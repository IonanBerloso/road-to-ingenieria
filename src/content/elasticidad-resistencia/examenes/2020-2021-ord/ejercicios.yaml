      <figcaption>

      Redibujada en alzado, en el plano del tubo y a escala. El original es
      una perspectiva con un jugador colgado del aro, una flecha sin rótulo
      junto al tubo y las cotas en el suelo; aquí van el tubo, el tablero, el
      aro, F, M, P, el ángulo, los ejes y las tres cotas.

      </figcaption>
      </figure>

      **Notas nuestras.** Se toma L1 = L − L0 = 3000 mm, la proyección
      horizontal del tramo a 45°, y el tramo de L0 horizontal, como lo pinta
      la perspectiva. F y M actúan en el extremo del tubo, y M tiene el
      sentido de su flecha, horario en este alzado. El tablero va unido a ese
      extremo, así que P baja lo mismo que él. R es el radio medio del tubo,
      el de las fórmulas de $I$ y $A$. En el PDF, «F=2000N y M=10⁶Nmm» va
      resaltado.
    pide: >-
      El diámetro del tubo para que P no baje más de 80 mm, contando la
      flexión, el axil y el cortante, y cuánto de ese descenso se debe al
      axil y al cortante.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se calcula el descenso de P?
        opciones:
          - texto: >-
              Con una carga unidad vertical en P (o derivando la coenergía
              respecto de F), sumando sobre los dos tramos los productos de
              flectores, de axiles y de cortantes, cada uno con su rigidez
            correcta: true
            mensaje: |
              Eso es: el método de la fuerza unitaria (apartado 13.6, pp. 17-18
              del tema 13), que es el teorema de Engesser (ec. 13.14) con la
              coenergía de cada esfuerzo (tabla de la p. 16). Con $R$ como
              incógnita, sale una ecuación en $R$.
          - texto: >-
              Con la flecha de un voladizo, $FL^{3}/(3EI)$, con $L = 4000$ mm
            mensaje: |
              El tubo no es un voladizo recto: tiene un tramo a 45° de
              $3000\sqrt{2}$ mm, un codo y otro tramo, y además lleva el par
              $M$. Y el enunciado pide contar también el axil y el cortante.
          - texto: >-
              Sumando la flecha de cada tramo como si fuera un voladizo
              empotrado por separado
            mensaje: |
              Así se pierde lo que el tramo inclinado le hace al otro: su giro
              en el codo levanta o baja todo el tramo de $L_0$. La integral de
              $M\,m/EI$ sobre toda la estructura lo cuenta sin pensar en ello.
      - tipo: calcular
        titulo: La integral del flector
        pregunta: |
          Con $m$ el flector de la carga unidad vertical en P, ¿cuánto vale
          $\int M\,m\,ds$ sobre los dos tramos, en $10^{13}$ N·mm³?
        respuesta:
          tipo: numero
          valor: '7.117'
          tolerancia: 0.005
          formato: un número, en 10¹³ N·mm³
        distractores:
          - valor: '4.896'
            mensaje: |
              Has tomado $M$ al revés, restando de $F$. La flecha de la
              figura tiene el sentido del giro que produce $F$ alrededor de
              cualquier sección: los dos flectan el tubo hacia el mismo lado
              y se suman.
          - valor: '5.067'
            mensaje: |
              Has integrado el tramo inclinado sobre su proyección, 3000 mm.
              Mide $3000\sqrt{2}$ mm: con $h$ la distancia horizontal a P,
              $ds = \sqrt{2}\,dh$, y su integral lleva un $\sqrt{2}$ delante.
          - valor: '6.006'
            mensaje: |
              Te has dejado el par $M$. El jugador transmite al aro $F$ y $M$,
              y los dos flectan el tubo.
        pista: |
          Con $h$ la distancia horizontal de la sección a la vertical de P,
          $M = Fh + M_0$ y $m = h$ en los dos tramos. En el horizontal,
          $ds = dh$ con $h$ de 0 a $L_0$; en el inclinado, $ds = \sqrt{2}\,dh$
          con $h$ de $L_0$ a $L$.
        desarrollo: |
          Tramo horizontal, en N·mm³:
          $\tfrac{1}{3}FL_0^{3} + \tfrac{1}{2}M_0L_0^{2} = 6{,}667\cdot10^{11} + 5\cdot10^{11} = 1{,}1667\cdot10^{12}$.
          Tramo inclinado:

          $$
          \sqrt{2}\left[\tfrac{1}{3}F\,(L^{3} - L_0^{3}) + \tfrac{1}{2}M_0\,(L^{2} - L_0^{2})\right] = \sqrt{2}\,(4{,}2\cdot10^{13} + 7{,}5\cdot10^{12}) = 7{,}0004\cdot10^{13}
          $$

          en N·mm³. En total, $7{,}117\cdot10^{13}$ N·mm³.
      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Qué diámetro hace falta, en mm?
        respuesta:
          tipo: numero
          valor: '139.25'
          tolerancia: 0.1
          formato: un número, en mm (el diámetro medio, 2R)
        tambienValen:
          - valor: '143.25'
            mensaje: |
              Es el diámetro exterior, $2R + t$. Las fórmulas del enunciado
              llevan el radio medio; el diámetro de cálculo es $2R = 139{,}25$
              mm, y por fuera el tubo mide 4 mm más.
        distractores:
          - valor: '69.63'
            mensaje: |
              Es el radio medio, $R$. El diámetro es el doble.
          - valor: '122.93'
            mensaje: |
              Sale esto con $M$ al revés, y casi lo mismo (124,35 mm) con el
              tramo inclinado medido por su proyección: los dos errores dan
              una integral del flector más pequeña. Revisa el paso anterior.
          - valor: '131.60'
            mensaje: |
              Es el diámetro sin el par $M$. Con él la integral del flector
              crece y hace falta más tubo.
        pista: |
          $\delta = \dfrac{\int M\,m\,ds}{E\pi R^{3}t} + \dfrac{1}{EA}\int N\,n\,ds + \dfrac{\chi}{GA}\int V\,v\,ds$,
          con $A = 2\pi Rt$. Iguala a 80 mm y resuelve en $R$, por tanteo: el
          primer término manda.
        desarrollo: |
          Con $E\pi t = 2{,}6389\cdot10^{6}$ MPa·mm, la flexión da
          $7{,}117\cdot10^{13}/(2{,}6389\cdot10^{6}R^{3}) = 2{,}6970\cdot10^{7}/R^{3}$
          (en mm, con $R$ en mm). El axil y el cortante suman $7{,}014/R$.
          La ecuación

          $$
          \frac{2{,}6970\cdot10^{7}}{R^{3}} + \frac{7{,}014}{R} = 80
          $$

          da $R = 69{,}63$ mm: el diámetro medio es $139{,}25$ mm. Solo con la
          flexión saldría $139{,}19$ mm.
      - tipo: calcular
        titulo: Lo que ponen el axil y el cortante
        pregunta: |
          Con ese diámetro, ¿cuántos milímetros de los 80 se deben al axil y
          al cortante juntos?
        respuesta:
          tipo: numero
          valor: '0.1007'
          tolerancia: 0.0005
          formato: un número, en mm
        distractores:
          - valor: '0.0561'
            mensaje: |
              Has tomado $\chi = 1$. La energía del cortante lleva el factor
              $\chi$ (ec. 13.37), y el enunciado da $\chi_Y = 2$.
          - valor: '0.0892'
            mensaje: |
              Es solo el cortante. Falta el axil del tramo inclinado: la
              componente de $F$ según su eje, $F\sin45^{\circ}$, lo comprime.
          - valor: '0.0115'
            mensaje: |
              Es solo el axil. El cortante pone casi ocho veces más: actúa en
              los dos tramos, y en el horizontal con $F$ entera.
        pista: |
          Axil: solo en el tramo inclinado, de compresión,
          $N = -F\sin45^{\circ}$, y el de la carga unidad,
          $n = -\sin45^{\circ}$. Cortante: $V = F$ en el horizontal y
          $F\cos45^{\circ}$ en el inclinado, y el de la carga unidad, $V/F$.
        desarrollo: |
          Axil:
          $\dfrac{F\sin^{2}45^{\circ}\cdot3000\sqrt{2}}{E\cdot2\pi Rt} = \dfrac{0{,}8039}{R}$.
          Cortante:
          $\dfrac{\chi F\,(1000 + 3000\sqrt{2}\cos^{2}45^{\circ})}{G\cdot2\pi Rt} = \dfrac{6{,}2097}{R}$
          (los dos en mm, con $R$ en mm). Con $R = 69{,}63$ mm,
          $7{,}0136/69{,}63 = 0{,}1007$ mm: el 0,13 % del descenso.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una carga unidad vertical en P; en cada sección, $M = Fh + M_0$
              y $m = h$, con $h$ la distancia horizontal a P.
          - texto: >-
              $\int M\,m\,ds = 7{,}117\cdot10^{13}$ N·mm³, con $ds = \sqrt{2}\,dh$
              en el tramo a 45°.
          - texto: >-
              El axil (solo en el tramo inclinado) y el cortante (en los dos,
              con $\chi = 2$) suman $7{,}014/R$ mm.
          - texto: >-
              $2{,}6970\cdot10^{7}/R^{3} + 7{,}014/R = 80$ da $R = 69{,}63$ mm
              y $D = 139{,}25$ mm.
          - texto: >-
              El codo es un empotramiento entre los dos tramos, y cada uno se
              calcula como un voladizo independiente.
            trampa: true
            mensaje: |
              El codo es rígido pero se mueve: gira y baja con el tramo
              inclinado, y arrastra al horizontal. Por eso se integra sobre
              toda la estructura.
    resolucion: |
      **El modelo.** En el plano del tubo: el tramo 1 sale del bloque a 45°
      y llega al codo, a $L_1 = L - L_0 = 3000$ mm en horizontal, así que
      mide $3000\sqrt{2} = 4242{,}6$ mm; el tramo 2, horizontal, mide
      $L_0 = 1000$ mm hasta el extremo, donde actúan $F = 2000$ N hacia abajo
      y $M_0 = 10^{6}$ N·mm, horario. P, en el tablero unido al extremo, baja
      lo mismo que él. El tubo, de radio medio $R$ y espesor $t = 4$ mm:
      $I = \pi R^{3}t$, $A = 2\pi Rt$, $\chi = 2$.

      **El método.** El descenso de P por la fuerza unitaria (apartado 13.6,
      pp. 17-18 del tema 13), es decir, el teorema de Engesser (ec. 13.14,
      p. 8) con las coenergías de la tabla de la p. 16: flexión (ec. 13.30),
      axil (ec. 13.23) y cortante (ec. 13.38, con el $\chi$ de la ec. 13.37,
      p. 14):

      $$
      \delta_P = \int\frac{M\,m}{EI}\,ds + \int\frac{N\,n}{EA}\,ds + \chi\int\frac{V\,v}{GA}\,ds
      $$

      con $m$, $n$, $v$ los esfuerzos de una carga unidad vertical en P.

      **Flexión.** Con $h$ la distancia horizontal de la sección a la
      vertical de P, en los dos tramos $M = Fh + M_0$ y $m = h$. En el
      horizontal $ds = dh$; en el inclinado, $ds = \sqrt{2}\,dh$. En N·mm³:

      $$
      \int M\,m\,ds = \tfrac{1}{3}FL_0^{3} + \tfrac{1}{2}M_0L_0^{2} + \sqrt{2}\left[\tfrac{1}{3}F(L^{3} - L_0^{3}) + \tfrac{1}{2}M_0(L^{2} - L_0^{2})\right] = 7{,}117\cdot10^{13}
      $$

      **Axil y cortante.** En el tramo horizontal, $F$ es perpendicular al
      eje: cortante $F$ y ningún axil. En el inclinado, $F$ se reparte en un
      axil de compresión $F\sin45^{\circ}$ y un cortante $F\cos45^{\circ}$; la
      carga unidad, igual. Con $R$ en mm, los dos términos dan, en mm,
      $0{,}8039/R$ (axil) y $6{,}2097/R$ (cortante).

      **El diámetro.** Con $E = 2{,}1\cdot10^{5}$ MPa y $G = 8\cdot10^{4}$ MPa:

      $$
      \frac{2{,}6970\cdot10^{7}}{R^{3}} + \frac{7{,}014}{R} = 80
      $$

      en mm. Por tanteo, $R = 69{,}63$ mm, y el diámetro (medio) es

      $$
      D = 2R = 139{,}25\ \text{mm}
      $$

      por fuera, $D + t = 143{,}25$ mm. El axil y el cortante ponen 0,10 mm
      de los 80: solo con la flexión saldría $D = 139{,}19$ mm. Es lo
      habitual en una pieza larga y esbelta; el enunciado pide contarlos, y
      se cuentan, pero no deciden nada.

      **Comprobaciones.** El motor del curso (el pórtico de dos barras
      empotrado en la base, con la carga unidad vertical en el extremo y las
      tres rigideces) da el mismo descenso para cualquier $R$, y el mismo
      $R$ buscado por bisección; la integral del flector sale igual por
      Simpson con dos mil intervalos.

