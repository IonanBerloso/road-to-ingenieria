      **Notas nuestras.** M0 tiene el sentido de su flecha, horario. En la
      sección, la cota vertical de 8t va entre las caras interiores de las
      dos alas, como en el original. Cada fila de tornillos lleva cuatro
      arriba (dos a cada lado del alma) y dos abajo, uno a cada lado, y
      cada tornillo trabaja a cortadura en un plano.
    pide: >-
      a) La reacción en C y los diagramas V y M. b) La posición del centro de
      gravedad, Iz, y el valor de la máxima tracción y de la máxima
      compresión, en q0a²/t³. c) El flujo entre cada platabanda y la sección,
      en q0a/t. d) La separación e, en τadm·d0²·t/(q0a).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza la estática?
        opciones:
          - texto: >-
              Por BCD, tomando momentos respecto de la rótula B, donde el
              flector es nulo; sale la reacción de C
            correcta: true
            mensaje: |
              Eso es. En BCD hay dos incógnitas verticales (la fuerza de la
              rótula y la de C), y la ecuación de momentos en B no lleva la de
              la rótula. Después, AB es un voladizo con la fuerza de la rótula
              en la punta.
          - texto: >-
              Por la viga entera; tiene un empotramiento y un apoyo, y no hace
              falta nada más
            mensaje: |
              La viga entera tiene tres incógnitas (la vertical y el par de
              A, y la de C; la horizontal es nula) y solo dos ecuaciones de
              equilibrio. La que falta es $M_B = 0$, y se usa aislando BCD.
          - texto: >-
              Es hiperestática: hay que plantear una compatibilidad
            mensaje: |
              Con la rótula no lo es: empotramiento (2 incógnitas verticales
              y par) y apoyo móvil (1) son tres, y hay dos ecuaciones de
              equilibrio más $M_B = 0$.
      - tipo: calcular
        titulo: La reacción en C
        pregunta: |
          ¿Cuánto vale la reacción en C, en $q_0a$, positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.002
          formato: un número con su signo, en q0a
        distractores:
          - valor: '-0.5'
            mensaje: |
              Has tomado $M_0$ antihorario. La flecha de la figura baja por la
              derecha de D: horario, y respecto de B se suma al momento de
              $q_0$.
          - valor: '0.5'
            mensaje: |
              Te has dejado $M_0$. Un par no aparece en las sumas de fuerzas,
              pero sí en las de momentos.
        pista: |
          Momentos de BCD respecto de B, antihorario positivo:
          $R_C\,a - q_0a\cdot\tfrac{a}{2} - M_0 = 0$.
        desarrollo: |
          $R_C = \tfrac{1}{2}q_0a + q_0a = \tfrac{3}{2}q_0a$. Vertical en BCD:
          la rótula tira de BCD hacia abajo con
          $\tfrac{3}{2}q_0a - q_0a = \tfrac{1}{2}q_0a$; sobre AB empuja hacia
          arriba, y en A la reacción es $\tfrac{1}{2}q_0a$ hacia abajo, con un
          par de $\tfrac{1}{2}q_0a^{2}$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C y D y el convenio del tema
          7 (V, la suma de las fuerzas hacia arriba a la izquierda; M > 0 si
          tracciona la fibra de abajo).
        comprueba:
          - punto: |
              **Cortante**: $-\tfrac{1}{2}q_0a$ constante de A a B; recta de
              pendiente $-q_0$ en BC hasta $-\tfrac{3}{2}q_0a$ en C; en C salta
              $R_C$ hasta cero, y cero hasta D.
            porque: |
              $dT/dx = -q$ (ec. 7.14, p. 12 del tema 7, con $T$ el cortante):
              horizontal sin carga y de pendiente $-q_0$ en BC. En CD no hay
              fuerzas: el par de D no cambia el cortante.
          - punto: |
              **Flector**: $\tfrac{1}{2}q_0a^{2}$ en A, recta hasta cero en la
              rótula B; parábola en BC hasta $-q_0a^{2}$ en C; constante,
              $-q_0a^{2}$, de C a D, y en D vuelve a cero por el par.
            porque: |
              $dM/dx = T$ (ec. 7.15): lineal donde el cortante es constante,
              parabólico en BC y constante donde es nulo. En la rótula el
              flector es nulo.
          - punto: |
              **Los máximos**: $|M|$ máximo, $q_0a^{2}$, en todo CD (y en C);
              $|V|$ máximo, $\tfrac{3}{2}q_0a$, justo a la izquierda de C.
            porque: |
              Son los que mandan en los apartados b, c y d: las tensiones
              normales salen del flector y los flujos, del cortante.
