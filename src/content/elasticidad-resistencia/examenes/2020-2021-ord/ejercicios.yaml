      **Notas nuestras.** La carga $q_0$ de DE está dibujada por debajo de la
      viga, con las puntas de las flechas hacia ella: se toma hacia arriba.
      Los giros se dan con el convenio del tema 10, positivos en sentido
      horario.
    pide: >-
      a) La reacción en C, en q0a. b) La flecha de B, en q0a⁴/EIz. c) El giro
      de la sección de B del lado de AB y el del lado de BD, en q0a³/EIz.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas sobran para la estática?
        opciones:
          - texto: >-
              Una. Hay cinco (dos reacciones y dos pares en los empotramientos,
              y la de C) y la estática da dos ecuaciones, más una por rótula
            correcta: true
            mensaje: |
              Eso es: $5 - 2 - 2 = 1$. Es hiperestática de grado 1, y hace
              falta una condición de deformación (apartado 11.1, p. 3 del
              tema 11): que las flechas a los dos lados de cada rótula sean
              iguales.
          - texto: >-
              Ninguna, porque cada rótula añade una ecuación
            mensaje: |
              Las rótulas añaden dos ecuaciones ($M = 0$ en B y en D), pero
              los dos empotramientos y el apoyo dan cinco incógnitas: la
              estática se queda corta en una.
          - texto: >-
              Tres, porque cada empotramiento tiene tres reacciones
            mensaje: |
              Con cargas verticales, la reacción horizontal es nula y no
              cuenta. Quedan cinco incógnitas para cuatro ecuaciones (dos de
              equilibrio y dos de las rótulas).
      - tipo: calcular
        titulo: La reacción del apoyo móvil
        pregunta: |
          ¿Cuánto vale la reacción en C, en unidades de $q_0a$, positiva hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.002
          formato: un número con su signo, en q0a
        distractores:
          - valor: '0.375'
            mensaje: |
              Has tomado BD rígida. BD está apoyada solo en su centro y las
              rótulas la cargan en los extremos: flecta como dos voladizos de
              $a/2$, y esa flexión entra en la compatibilidad.
          - valor: '1'
            mensaje: |
              Has tomado $q_0$ de DE hacia abajo. La figura la dibuja por debajo
              de la viga con las flechas hacia ella: empuja hacia arriba.
          - valor: '0'
            mensaje: |
              Has puesto $q_0$ en AB y no $2q_0$. Con las dos cargas iguales y
              de sentidos opuestos, los voladizos no cargarían BD; aquí la de
              AB es el doble.
          - valor: '-0.3333'
            mensaje: |
              El valor es ese y el signo no. Los dos voladizos empujan BD
              hacia abajo en sus extremos, y C la sostiene: la reacción va
              hacia arriba.
        pista: |
          Corta por las rótulas. BD solo tiene las fuerzas de las rótulas y la
          de C; los momentos respecto de C dicen que las fuerzas de B y de D
          son iguales, $X$. Escribe la flecha de B por el voladizo AB y por BD
          (que gira alrededor de C y además flecta), y lo mismo en D.
        desarrollo: |
          Con $X$ la fuerza hacia arriba de cada voladizo sobre BD y flechas
          positivas hacia abajo (en $q_0a^{4}/EI$, con $X$ en $q_0a$):
          voladizo AB, $v_B = \tfrac{1}{4} + \tfrac{1}{3}X$; voladizo DE,
          $v_D = -\tfrac{1}{8} + \tfrac{1}{3}X$; BD, con el giro $\varphi$ y su
          flexión de voladizos de $a/2$, $v_B = \tfrac{1}{2}\varphi - \tfrac{1}{24}X$
          y $v_D = -\tfrac{1}{2}\varphi - \tfrac{1}{24}X$. Sumando las dos
          igualdades, $\tfrac{1}{8} + \tfrac{2}{3}X = -\tfrac{1}{12}X$, de donde
          $X = -\tfrac{1}{6}$ y $R_C = -2X = \tfrac{1}{3}$ (en $q_0a$).
      - tipo: calcular
        titulo: La flecha de la rótula B
        pregunta: |
          ¿Cuánto baja B, en unidades de $q_0a^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.19444'
          tolerancia: 0.0005
          formato: un número con su signo, positivo hacia abajo, en q0a⁴/EIz
        distractores:
          - valor: '0.1875'
            mensaje: |
              Es la de BD rígida. La flexión propia de BD cambia la fuerza de
              las rótulas, y con ella la flecha.
          - valor: '0.25'
            mensaje: |
              Es la del voladizo AB con su carga sola, $2q_0a^{4}/(8EI)$.
              Falta la fuerza de la rótula: BD empuja AB hacia arriba en B.
          - valor: '0.08333'
            mensaje: |
              Sale con $q_0$ de DE hacia abajo. Las flechas de la figura
              empujan hacia arriba.
        pista: |
          Con $X$ ya calculada, la flecha del voladizo AB:
          $v_B = \dfrac{2q_0a^{4}}{8EI} + \dfrac{X\,a^{3}}{3EI}$, con $X$ la
          fuerza de BD sobre AB hacia abajo (aquí negativa).
        desarrollo: |
          $v_B = \tfrac{1}{4} - \tfrac{1}{18} = \tfrac{7}{36} = 0{,}19444$, en
          $q_0a^{4}/EI_z$, hacia abajo.
      - tipo: calcular
        titulo: El giro de B del lado de AB
        pregunta: |
          ¿Cuánto gira la sección de B del lado de AB, en $q_0a^{3}/EI_z$
          (horario positivo)?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.0005
          formato: un número con su signo, en q0a³/EIz
        distractores:
          - valor: '0.3333'
            mensaje: |
              Es el giro del voladizo con su carga sola,
              $2q_0a^{3}/(6EI)$. Falta el de la fuerza de la rótula,
              $X\,a^{2}/(2EI)$.
          - valor: '-0.25'
            mensaje: |
              El signo. AB baja al ir de A a B: $\theta = dv/dx > 0$, horario
              (ec. 10.13).
          - valor: '0.2396'
            mensaje: |
              Es el de BD rígida. La fuerza de la rótula cambia al contar la
              flexión de BD.
        pista: |
          Voladizo AB: $\theta_B = \dfrac{2q_0a^{3}}{6EI} + \dfrac{X\,a^{2}}{2EI}$.
        desarrollo: |
          $\theta_B^{AB} = \tfrac{1}{3} - \tfrac{1}{12} = \tfrac{1}{4}$, en
          $q_0a^{3}/EI_z$: horario.
      - tipo: calcular
        titulo: El giro de B del lado de BD
        pregunta: |
          ¿Y el de la sección de B del lado de BD, en $q_0a^{3}/EI_z$
          (horario positivo)?
        respuesta:
          tipo: numero
          valor: '-0.39583'
          tolerancia: 0.0005
          formato: un número con su signo, en q0a³/EIz
        distractores:
          - valor: '-0.375'
            mensaje: |
              Es solo el giro de BD como sólido, $-\varphi$. BD además flecta
              entre C y B, y eso añade $X\,(a/2)^{2}/(2EI)$.
          - valor: '0.39583'
            mensaje: |
              El signo. B baja y D sube: al ir de B a D la flecha disminuye,
              $dv/dx < 0$, antihorario.
          - valor: '-0.64583'
            mensaje: |
              Es el salto de giro en la rótula, la diferencia entre los dos
              lados. Se pide el giro de cada lado.
        pista: |
          De las dos compatibilidades restadas sale el giro de BD,
          $\varphi = \tfrac{3}{8}q_0a^{3}/EI$. Del lado de BD,
          $\theta_B = -\varphi + \dfrac{X\,(a/2)^{2}}{2EI}$.
        desarrollo: |
          $\theta_B^{BD} = -\tfrac{3}{8} - \tfrac{1}{48} = -\tfrac{19}{48} = -0{,}39583$,
          en $q_0a^{3}/EI_z$: antihorario. El salto en la rótula es
          $-\tfrac{19}{48} - \tfrac{12}{48} = -\tfrac{31}{48}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cinco incógnitas, dos ecuaciones de equilibrio y dos de las
              rótulas: grado 1.
          - texto: >-
              Por momentos en C, las fuerzas de las rótulas sobre BD son
              iguales, $X$, y $R_C = -2X$.
          - texto: >-
              Las flechas de B y D por los voladizos y por BD (giro y flexión
              propia) dan $X = -q_0a/6$ y $R_C = q_0a/3$.
          - texto: >-
              $v_B = \tfrac{7}{36}q_0a^{4}/EI_z$, hacia abajo.
          - texto: >-
              Giros en B: $\tfrac{1}{4}$ del lado de AB (horario) y
              $-\tfrac{19}{48}$ del lado de BD, en $q_0a^{3}/EI_z$.
          - texto: >-
              En una rótula la flecha y el giro son continuos; solo el flector
              se anula.
            trampa: true
            mensaje: |
              En una rótula el flector es nulo y la flecha continua, pero el
              giro salta: aquí, de $\tfrac{1}{4}$ a $-\tfrac{19}{48}$. Por eso
              el apartado c pide los ángulos, en plural.
    resolucion: |
      **El grado.** Con cargas verticales, las incógnitas son las dos
      reacciones y los dos pares de los empotramientos y la reacción de C:
      cinco. Hay dos ecuaciones de equilibrio y dos más de las rótulas
      ($M_B = M_D = 0$): grado 1 (apartado 11.1, p. 3 del tema 11).

      **Los tres trozos.** Cortando por las rótulas quedan el voladizo AB
      (empotrado en A, con $2q_0$ hacia abajo), el voladizo DE (empotrado en
      E, con $q_0$ hacia arriba) y BD, de longitud $a$ y apoyada en su centro
      C, sin carga. Sean $X$ las fuerzas, hacia arriba, de los voladizos
      sobre BD en B y en D. Momentos de BD respecto de C: las dos tienen el
      mismo brazo, $a/2$, así que son iguales; y $R_C = -2X$.

      **Las flechas** (ec. 10.14, p. 7 del tema 10; positivas hacia abajo,
      $\theta = dv/dx$ positivo horario, ec. 10.13). En unidades de
      $q_0a^{4}/EI$ y con $X$ en $q_0a$:

      - voladizo AB, con $2q_0$ y la fuerza $X$ de BD hacia abajo en la punta:
        $v_B = \tfrac{2}{8} + \tfrac{1}{3}X$;
      - voladizo DE, con $q_0$ hacia arriba y $X$ hacia abajo:
        $v_D = -\tfrac{1}{8} + \tfrac{1}{3}X$;
      - BD: gira $\varphi$ alrededor de C y cada mitad flecta como un voladizo
        de $a/2$ con $X$ hacia arriba en la punta, que sube
        $X(a/2)^{3}/(3EI) = \tfrac{1}{24}X$:
        $v_B = \tfrac{1}{2}\varphi - \tfrac{1}{24}X$ y
        $v_D = -\tfrac{1}{2}\varphi - \tfrac{1}{24}X$.

      **a) La reacción en C.** Sumando las dos compatibilidades:
      $\tfrac{1}{8} + \tfrac{2}{3}X = -\tfrac{1}{12}X$, de donde
      $X = -\tfrac{1}{6}$: los voladizos empujan BD hacia abajo con
      $q_0a/6$ cada uno, y

      $$
      R_C = \frac{q_0a}{3}\ \text{hacia arriba}
      $$

      Restándolas: $\tfrac{3}{8} = \varphi$, el giro de BD en
      $q_0a^{3}/EI$ (B baja y D sube).

      **b) La flecha de B.**
      $v_B = \tfrac{1}{4} - \tfrac{1}{18} = \tfrac{7}{36}$:

      $$
      v_B = \frac{7q_0a^{4}}{36EI_z} = 0{,}1944\,\frac{q_0a^{4}}{EI_z}\ \text{hacia abajo}
      $$

      y D sube $\tfrac{13}{72}q_0a^{4}/EI_z$.

      **c) Los giros en B.** La rótula deja que el giro salte. Del lado de AB,
      el giro de la punta del voladizo:
      $\theta_B^{AB} = \tfrac{2}{6} + \tfrac{1}{2}X = \tfrac{1}{4}$ (horario).
      Del lado de BD, el giro de sólido más el de su flexión entre C y B:
      $\theta_B^{BD} = -\tfrac{3}{8} + \tfrac{1}{8}X = -\tfrac{19}{48}$
      (antihorario). En $q_0a^{3}/EI_z$:

      $$
      \theta_B^{AB} = \tfrac{1}{4} = 0{,}25,\qquad \theta_B^{BD} = -\tfrac{19}{48} = -0{,}3958,\qquad \Delta\theta_B = -\tfrac{31}{48}
      $$

      **Comprobaciones.** El motor del curso integra la elástica de toda la
      viga, con las dos rótulas como saltos de giro y las cinco reacciones
      como incógnitas, y da lo mismo: $R_C = 0{,}3333\,q_0a$,
      $v_B = 0{,}19444$, los dos giros y el salto, y flecha nula en C.

  # ── Problema 4 · la viga con rótula y la sección con platabandas.
  - id: exerm2021-ord-8-la-viga-con-platabandas-atornilladas
    titulo: La viga con rótula y la sección en I con platabandas atornilladas, de los diagramas a la separación de los tornillos
    fuente: >-
      Problema 4 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. Se conservan «rotula» sin tilde y «calcula». El examen
      no publica resolución; el desarrollo es nuestro, con los convenios de
      los temas 7 y 9.
    nivel: examen
    enunciado: |
      (1,5p) La viga de la figura tiene rotula en B y un apoyo móvil en C. El
      espesor de toda la sección y de las platabandas es t. Determinar:

      a/ Diagramas V y M.

      b/ Determinar donde se dan las tensiones normales máximas de tracción y
      de compresión.

      c/ Flujos cortantes máximos entre platabandas y sección.

      d/ Conocidos la tensión admisible ($\tau_{adm}$) y el diámetro ($d_0$)
      de los tornillos, calcula la distancia e entre tornillos.

