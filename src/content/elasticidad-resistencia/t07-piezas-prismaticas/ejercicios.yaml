      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La resultante de la carga es $q_0L/4$, en $x = 5L/6$; los momentos respecto de C dan $R_A = q_0L/24$, y la vertical, $R_C = 5q_0L/24$.
          - texto: En AB no hay carga, así que $T = q_0L/24$ constante y el flector es una recta que llega a $q_0L^{2}/48$ en B.
          - texto: En BC, $T = q_0L/24 - q_0(x - L/2)^{2}/L$, que se anula en $x = 0{,}704L$.
          - texto: Ahí el flector es máximo, $(9 + \sqrt{6})\,q_0L^{2}/432 = 0{,}0265\,q_0L^{2}$, y en C vuelve a cero.
          - texto: Como la carga es triangular, el flector máximo está bajo su resultante, en $x = 5L/6$.
            trampa: true
            mensaje: |
              Bajo la resultante estaría el máximo si toda la carga fuera una
              fuerza concentrada allí. Con la carga repartida, el flector es
              máximo donde se anula la cortante, en $x = 0{,}704L$, antes de
              la resultante.
    resolucion: |
      **1. El sólido libre.** La viga apoyada en A y en C, con la carga
      triangular en BC.

      <figure class="figura-examen">
      <svg viewBox="0 34 340 112" role="img" width="510" height="168" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La viga de la carga triangular, sin sus apoyos</title>
