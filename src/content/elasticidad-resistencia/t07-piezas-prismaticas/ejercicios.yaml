      - **La carga** crece en BE de $q_0$ a $2q_0$: a una distancia $x$ de A
        vale $q(x) = q_0\left(1 + \tfrac{x - a}{3a}\right)$. Su resultante es
        $\tfrac92 q_0a$, a $\tfrac53 a$ de B, en $x = \tfrac83 a$.
      - **El par de C**, $q_0a^{2}$ antihorario, cambia el flector y no la
        cortante.
      - **Las reacciones de A** no hacen falta: se recorre la viga por la
        derecha.

      **2. Incógnitas.** La cortante y el flector en A; el flector en B, a los
      dos lados de C y en D; y los diagramas.

      **3. Ecuaciones.** Por la derecha de cada sección: $T$ es la resultante
      de lo que hay a la derecha, positiva hacia abajo, y $M$, su momento
      respecto de la sección, con el antihorario positivo. Y
      $dT/dx = -q$ y $dM/dx = T$ (ecs. 7.14 y 7.15) para comprobar.

      **4. Resultados.** **Cortante.** En AB, toda la carga queda a la
      derecha: $T = \tfrac92 q_0a$ constante, que es la reacción vertical de
      A. En BE, la cortante es la carga que queda entre la sección y E: una
      parábola, con $\tfrac{10}{3}q_0a$ en C, $\tfrac{11}{6}q_0a$ en D y cero
      en E. El par no la cambia.

      **Flector.**

      $$
      M_A = -\frac92\,q_0a\cdot\frac83\,a + q_0a^{2} = -11\,q_0a^{2},
      \qquad
      M_B = -\frac92\,q_0a\cdot\frac53\,a + q_0a^{2} = -\frac{13}{2}\,q_0a^{2}
      $$

      En C, la carga de CE, $\tfrac{10}{3}q_0a$ a $\tfrac{16}{15}a$ de C, da
      $M_C^{+} = -\tfrac{32}{9}q_0a^{2}$ justo a la derecha, y justo a la
      izquierda se suma el par: $M_C^{-} = -\tfrac{23}{9}q_0a^{2}$. En D, la
      carga de DE, $\tfrac{11}{6}q_0a$ a $\tfrac{17}{33}a$ de D, da
      $M_D = -\tfrac{17}{18}q_0a^{2}$, y en E el flector es cero. Es recta en
      AB y cúbica en BE. Los diagramas, con estos valores, son los del paso
      de dibujarlos.

      **5. Comprobación.** Integrando $dT/dx = -q$ y $dM/dx = T$ de E hacia A,
      con $T = M = 0$ en E y el salto de $+q_0a^{2}$ al pasar C hacia la
      izquierda, se llega a A con $T = \tfrac92 q_0a$ y
      $M = -11\,q_0a^{2}$, los mismos.

      **Lo que dice el resultado.** El flector es negativo en toda la viga:
      tracciona la fibra de arriba, y el mayor en valor absoluto es el del
      empotramiento, $11q_0a^{2}$. Visto de izquierda a derecha, baja
      $q_0a^{2}$ al cruzar C: el par se ve en el flector como un escalón, y en
      la cortante, nada.

  # ── Ejercicio de clase 7.3 · la viga recta y el cuarto de círculo.
  - id: ejerm7-cl7-3-la-viga-recta-y-el-cuarto-de-circulo
    titulo: La viga recta y el cuarto de círculo, articulados en C
    fuente: >-
      Ejercicio 7.3 · Tema 7, «Piezas prismáticas. Fuerzas y momentos de
      sección» · Elasticidad y Resistencia de Materiales, UPV/EHU, ejercicios
      de clase (el fichero del 7.3 lleva la fecha del 28 de octubre de 2019).
      El material no trae solución: la resolución es nuestra, con el convenio
      del tema 7 en la viga recta y el de las diapositivas del tema
      (diapositivas 13 y 14, «Piezas curvas») en la pieza curva, con θ
      medido como en la figura. Cada cifra está calculada con el motor del
      curso —la pieza curva, como una poligonal de noventa barras rectas con
      los nudos sobre el arco— y comprobada por un segundo camino (BC como
      pieza de dos fuerzas, las fórmulas cerradas de N, T y M en función de
      θ, y las ecuaciones de equilibrio de la rebanada curva sobre lo que da
      el motor). La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        Son dos piezas articuladas. Antes de los esfuerzos hay que saber qué se
        transmiten en la articulación, y eso depende de cómo está sujeta y
        cargada cada pieza.
      formula: |
        $$
        \frac{dN}{d\theta} = -V
        \qquad
        \frac{dV}{d\theta} = N
        \qquad
        \frac{dM}{d\theta} = -V\,R
        $$

        La rebanada curva sin carga (diapositivas 13 y 14 del tema), con
        $\theta$ medido de B hacia C.
      reconocer: |
        Antes de las cuentas, mira la pieza curva: dónde está articulada y qué
        cargas tiene encima.
    enunciado: |
      La viga recta AC y la viga en forma de cuarto de círculo BC están
      articuladas en C.

      a/ Dibujar los diagramas de fuerzas normales, de fuerzas cortantes y de
      momentos flectores del tramo AC en función de $q_0$ y $a$.

      b/ Expresar las fuerzas normales, fuerzas cortantes y momentos
      flectores para cualquier $\theta$, en función de $q_0$, $\theta$ y $a$.
      Determinar para qué ángulo son máximos el momento flector y la fuerza
      normal.

