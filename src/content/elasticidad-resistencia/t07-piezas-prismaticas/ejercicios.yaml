      - tipo: calcular
        titulo: El ángulo de los máximos
        pregunta: |
          Escribe el flector y el axil de la pieza curva en función de
          $\theta$. ¿Para qué ángulo, en grados, son máximos en valor
          absoluto?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.5
          formato: un número, el ángulo en grados
        distractores:
          - valor: '90'
            mensaje: |
              Es C, donde la fuerza llega a la pieza. Allí el flector es cero,
              porque es una articulación, y el axil es solo la parte de la
              fuerza que va según la pieza, horizontal en C: $\tfrac34 q_0a$
              de los $1{,}06\,q_0a$.
          - valor: '0'
            mensaje: |
              Es B, el apoyo: allí el flector es cero, porque es una
              articulación, y el axil es solo $\tfrac34 q_0a$, porque la pieza
              es vertical y la fuerza va a 45°.
        pista: |
          Por el lado de C actúa sobre la pieza curva la fuerza que le hace
          AC: $\tfrac34 q_0a$ hacia la derecha y $\tfrac34 q_0a$ hacia abajo.
          La sección de ángulo $\theta$ está $a\cos\theta$ a la derecha de C
          y $a(1 - \operatorname{sen}\theta)$ por debajo.
        desarrollo: |
          Con las fuerzas del lado de C, el horario cuenta positivo, como por
          la izquierda de una viga. La fuerza hacia la derecha, por encima de
          la sección, gira en sentido horario; la de hacia abajo, a su
          izquierda, en antihorario:

          $$
          M(\theta) = \frac34\,q_0a\cdot a(1 - \operatorname{sen}\theta) - \frac34\,q_0a\cdot a\cos\theta
          = -\frac34\,q_0a^{2}\,(\operatorname{sen}\theta + \cos\theta - 1)
          $$

          El axil es la componente de esa fuerza según la tangente, con signo
          negativo porque comprime:
          $N(\theta) = -\tfrac34 q_0a\,(\operatorname{sen}\theta + \cos\theta)$.
          Los dos dependen de $\operatorname{sen}\theta + \cos\theta$:

          $$
          \frac{d}{d\theta}\left(\operatorname{sen}\theta + \cos\theta\right)
          = \cos\theta - \operatorname{sen}\theta = 0
          \quad\Longrightarrow\quad
          \theta = 45^{\circ}
          $$

          Es el punto del arco más alejado de la cuerda BC, y el único en que
          la tangente es paralela a ella.

      - tipo: calcular
        titulo: El flector máximo de la pieza curva
        pregunta: |
          ¿Cuánto vale el flector de la pieza curva en ese ángulo, en
          unidades de $q_0a^{2}$, con su signo?
        respuesta:
          tipo: numero
          valor: '-0.3107'
          tolerancia: 0.003
          formato: un número con su signo, el flector dividido entre q0a²
        distractores:
          - valor: '0.3107'
            mensaje: |
              El valor es ese, pero el signo no. Las dos fuerzas de los
              extremos comprimen la pieza a lo largo de la cuerda, y el arco,
              que va por fuera de la cuerda, se curva más: se tracciona la
              fibra exterior, y con $M > 0$ en la interior eso es flector
              negativo.
          - valor: '-0.5303'
            mensaje: |
              Te has quedado solo con la componente vertical de la fuerza de
              C, $\tfrac34 q_0a$, con su brazo $a\cos 45^{\circ}$. La
              horizontal también tiene brazo, $a(1 - \operatorname{sen}45^{\circ})$,
              y gira al revés: resta $0{,}22\,q_0a^{2}$.
          - valor: '0.2197'
            mensaje: |
              Te has quedado solo con la componente horizontal de la fuerza de
              C, con su brazo $a(1 - \operatorname{sen}45^{\circ})$. La vertical,
              $\tfrac34 q_0a$ con brazo $a\cos 45^{\circ}$, es mayor y gira al
              revés.
          - valor: '-1.0607'
            mensaje: |
              Has multiplicado la fuerza de BC, $\tfrac{3\sqrt{2}}{4}q_0a$,
              por el radio. Su brazo respecto de un punto del arco es la
              distancia del punto a la cuerda BC, que en 45° es
              $a(1 - \cos 45^{\circ}) = 0{,}293\,a$.
          - valor: '-0.75'
            mensaje: |
              Has tomado como brazo la distancia de O a la cuerda,
              $a\cos 45^{\circ}$. El brazo es la distancia del punto del arco
              a la cuerda, $a - a\cos 45^{\circ}$.
        pista: |
          Por el lado de C, con la fuerza que AC le hace a la pieza curva:
          $\tfrac34 q_0a$ hacia la derecha y $\tfrac34 q_0a$ hacia abajo. El
          punto de $\theta = 45^{\circ}$ está $a\cos 45^{\circ}$ a la derecha de
          C y $a(1 - \operatorname{sen}45^{\circ})$ por debajo.
        desarrollo: |
          $$
          M(45^{\circ}) = -\frac34\,(\sqrt{2} - 1)\,q_0a^{2} = -0{,}311\,q_0a^{2}
          $$

          Es también la fuerza de BC, $\tfrac{3\sqrt{2}}{4}q_0a$, por la
          distancia del punto a la cuerda, $a(1 - \cos 45^{\circ}) = 0{,}293\,a$,
          con signo negativo porque tracciona la fibra exterior.

      - tipo: calcular
        titulo: El axil máximo de la pieza curva
        pregunta: |
          ¿Cuánto vale el axil de la pieza curva en ese ángulo, en unidades de
          $q_0a$, con su signo?
        respuesta:
          tipo: numero
          valor: '-1.0607'
          tolerancia: 0.005
          formato: un número con su signo, el axil dividido entre q0a
        distractores:
          - valor: '-0.75'
            mensaje: |
              Es el axil en los extremos, B y C, donde la pieza es vertical u
              horizontal y solo una componente de la fuerza va según ella. En
              45° la tangente es paralela a la cuerda, y la fuerza entera es
              axil.
          - valor: '1.0607'
            mensaje: |
              El valor es ese, pero el signo no: la pieza curva está
              comprimida, como AC.
          - valor: '-0.5303'
            mensaje: |
              Has proyectado sobre la tangente solo una de las dos componentes,
              $\tfrac34 q_0a\cos 45^{\circ}$. En 45° las dos tienen proyección
              sobre la tangente, y se suman: $2\cdot\tfrac34 q_0a\cos 45^{\circ}$.
        pista: |
          Proyecta sobre la tangente en 45° las dos componentes de la fuerza
          del lado de C.
        desarrollo: |
          Recorriendo la pieza de C a B, hacia donde decrece $\theta$, con
          las fuerzas del lado de C: $N$ positivo a tracción, $T$ positiva
          hacia O en la cara que mira a B (como la $V$ de la rebanada de la
          diapositiva 13 en su cara de $\theta$) y $M > 0$ si tracciona la
          fibra interior. Para cualquier $\theta$:

          $$
          N(\theta) = -\frac34\,q_0a\,(\operatorname{sen}\theta + \cos\theta),
          \qquad
          T(\theta) = \frac34\,q_0a\,(\cos\theta - \operatorname{sen}\theta)
          $$

          $$
          N(45^{\circ}) = -\frac{3\sqrt{2}}{4}\,q_0a = -1{,}061\,q_0a,
          \qquad
          T(45^{\circ}) = 0
          $$

          Es la fuerza entera de BC: en 45° todo es axil.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: BC no tiene carga y está articulada en sus dos extremos, así que la fuerza que transmite va por la cuerda BC, a 45°.
          - texto: Los momentos de AC respecto de A dan la componente vertical de esa fuerza, $\tfrac34 q_0a$, y la horizontal es igual.
          - texto: En AC, $N = -\tfrac34 q_0a$, y el flector máximo, $\tfrac{9}{32}q_0a^{2}$, está en $x = \tfrac54 a$.
          - texto: En la pieza curva, $M(\theta) = -\tfrac34 q_0a^{2}(\operatorname{sen}\theta + \cos\theta - 1)$, máximo en valor absoluto en $\theta = 45^{\circ}$, como el axil.
          - texto: Como BC es curva, la fuerza que transmite va tangente al arco en C, horizontal.
            trampa: true
            mensaje: |
              La forma de la pieza no cuenta: con dos fuerzas solas, en B y en
              C, el equilibrio de BC las pone sobre la recta que une B y C. Una
              fuerza horizontal en C no tendría momento respecto de A, y AC no
