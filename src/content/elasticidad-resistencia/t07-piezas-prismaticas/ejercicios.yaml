      - tipo: calcular
        titulo: El axil de AC
        pregunta: |
          ¿Cuánto vale el axil en AC, en unidades de $q_0a$, con su signo
          (positivo a tracción)?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.005
          formato: un número con su signo, el axil dividido entre q0a
        distractores:
          - valor: '0'
            mensaje: |
              Es lo que sale si la fuerza de C es vertical, como la de un
              apoyo simple. BC empuja a lo largo de su cuerda, a 45°, y la
              parte horizontal de ese empuje comprime AC.
          - valor: '0.75'
            mensaje: |
              El valor es ese, pero el signo no. BC está comprimida y empuja a
              AC hacia la izquierda, contra A: AC trabaja a compresión.
          - valor: '-1.0607'
            mensaje: |
              Es la fuerza entera de BC, $\tfrac{3\sqrt{2}}{4}q_0a$. AC solo
              recibe como axil su componente según AC, la horizontal,
              $F\cos 45^{\circ} = \tfrac34 q_0a$; la vertical es cortante.
        pista: |
          La fuerza de BC sobre AC va por la cuerda, a 45°: sus dos
          componentes son iguales. Momentos de AC respecto de A: solo la
          componente vertical tiene brazo, $2a$.
        desarrollo: |
          $$
          \sum M_A = 0:\quad F_y\cdot 2a = q_0a\cdot\frac32\,a
          \quad\Longrightarrow\quad
          F_y = \frac34\,q_0a = F_x
          $$

          $$
          F = \sqrt{2}\cdot\frac34\,q_0a = 1{,}061\,q_0a,
          \qquad
          N_{AC} = -F_x = -\frac34\,q_0a
          $$

          Y en A: $\tfrac34 q_0a$ hacia la derecha y
          $q_0a - \tfrac34 q_0a = \tfrac14 q_0a$ hacia arriba.

      - tipo: calcular
        titulo: El flector máximo de AC
        pregunta: |
          ¿Cuánto vale el flector máximo de AC, en unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.28125'
          tolerancia: 0.002
          formato: un número, el flector dividido entre q0a²
        distractores:
          - valor: '0.25'
            mensaje: |
              Dos errores dan $q_0a^{2}/4$: el flector en $x = a$, donde
              empieza la carga, o el del centro del tramo cargado,
              $x = \tfrac32 a$. El máximo está donde se anula la cortante,
              entre los dos.
          - valor: '0.125'
            mensaje: |
              Es $q_0a^{2}/8$, el de una biapoyada de luz $a$ con toda la
              carga. El tramo cargado no está apoyado en sus dos extremos: en
              $x = a$ sigue la viga hacia A, y la reacción de A,
              $\tfrac14 q_0a$, no es la mitad de la carga.
          - valor: '1.03125'
            mensaje: |
              Has cambiado la vertical de A por la de C: con
              $\tfrac34 q_0a$ en A, la cortante se anularía en
              $x = \tfrac74 a$. La vertical de A es lo que queda de la carga
              después de lo que se lleva C: $\tfrac14 q_0a$.
        pista: |
          $T = \tfrac14 q_0a$ hasta $x = a$; después baja con pendiente
          $-q_0$. El máximo está donde se anula.
        desarrollo: |
          $$
          T = \frac14\,q_0a - q_0(x - a) = 0
          \quad\Longrightarrow\quad
          x = \frac54\,a
          $$

          $$
          M_{\max} = \frac14\,q_0a\cdot\frac54\,a - \frac{q_0}{2}\left(\frac{a}{4}\right)^{2}
          = \frac{5}{16}\,q_0a^{2} - \frac{1}{32}\,q_0a^{2} = \frac{9}{32}\,q_0a^{2}
          $$

      - tipo: dibujar
        consigna: |
          En papel, el apartado a/: **los diagramas de axiles, de cortantes y
          de flectores de AC**, alineados bajo la viga, con los valores en A,
          en el principio de la carga, en el máximo y en C.
        comprueba:
          - punto: |
              **Axil**: $-\tfrac34 q_0a$ constante en toda AC, compresión.
            porque: |
              Ninguna carga tiene componente según AC salvo la de C, la parte
              horizontal del empuje de BC, que equilibra A.
          - punto: |
              **Cortante**: $\tfrac14 q_0a$ de A a $x = a$; recta de pendiente
              $-q_0$ hasta $-\tfrac34 q_0a$ en C, con el cero en
              $x = \tfrac54 a$.
            porque: |
              $dT/dx = -q$ (ec. 7.14). En C, la componente vertical del
              empuje de BC, $\tfrac34 q_0a$ hacia arriba, la devuelve a cero.
          - punto: |
              **Flector**: recta de cero en A a $\tfrac14 q_0a^{2}$ en
              $x = a$; parábola con su máximo, $\tfrac{9}{32}q_0a^{2}$, en
              $x = \tfrac54 a$, y cero en C.
            porque: |
              $dM/dx = T$ (ec. 7.15), con tangente horizontal donde $T = 0$.
              En C, la articulación, el flector es nulo.
        figura: |
          <svg viewBox="0 0 400 330" role="img" width="400" height="330" aria-labelledby="ejerm7-cl7-3-la-viga-recta-y-el-cuarto-de-circulo-dib-t ejerm7-cl7-3-la-viga-recta-y-el-cuarto-de-circulo-dib-d">
