      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Momentos respecto de A con los brazos horizontales, $R_C\cdot 3a = q_0a\cdot\tfrac{a}{2} + q_0a\cdot\tfrac52 a$, dan $R_C = q_0a$, y la vertical de A es también $q_0a$.
          - texto: En AB la cortante baja de $q_0a$ a cero en $x = a$, y el flector llega ahí a $\tfrac12 q_0a^{2}$ y sigue constante hasta B.
          - texto: De B a P, P y $R_C$ se anulan entre sí, y el tramo está en flexión pura, con $M = \tfrac12 q_0a^{2}$.
          - texto: De P a C, $R_C$ proyectada da $N = -\tfrac{\sqrt{3}}{2}q_0a$ y $T = -\tfrac12 q_0a$, y el flector baja en recta hasta cero en C.
          - texto: En B, donde la pieza se quiebra, el flector es cero, como en una articulación.
            trampa: true
            mensaje: |
              B es un nudo rígido: transmite momento, y el flector pasa de AB
              a BC con el mismo valor, $\tfrac12 q_0a^{2}$. Solo es cero en las
              articulaciones y en los extremos sin par.
    resolucion: |
