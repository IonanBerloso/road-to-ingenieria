      **Notas nuestras.** Las fuerzas se dan en unidades de $q_0a$ y los
      momentos en unidades de $q_0a^{2}$. Los esfuerzos se dan recorriendo la
      pieza de A a C: en cada tramo, $x$ va hacia C e $y$ es $x$ girada 90° en
      sentido horario (hacia abajo en AB). $N > 0$ a tracción, $T > 0$ según
      $+y$ en la cara de la parte que va de A a la sección, y $M > 0$ si
      tracciona la fibra del lado de $+y$.
    pide: >-
      La reacción de C, el flector en B, el axil y la cortante de BC entre el
      punto de P y C, y los diagramas de los dos tramos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay tres reacciones: dos en A y la de C, vertical. ¿Qué ecuación da
          la de C sola?
        opciones:
          - texto: Momentos respecto de A, con el brazo de cada fuerza medido en horizontal
            correcta: true
            mensaje: |
              Eso es. Las dos reacciones de A no tienen momento respecto de A,
              y las demás fuerzas son verticales: su brazo es la distancia
              horizontal de su recta de acción a A, $\tfrac{a}{2}$ para la
              carga de AB, $\tfrac52 a$ para P y $3a$ para $R_C$.
          - texto: Momentos respecto de A, con las distancias medidas a lo largo de la pieza
            mensaje: |
              El brazo de una fuerza es la distancia de A a su recta de
              acción, no el camino por la pieza. BC va inclinada: C está a
              $4a$ de A recorriendo la pieza, pero a $3a$ en horizontal, que
              es lo que cuenta para una fuerza vertical.
          - texto: Momentos respecto de B, donde la pieza se quiebra, que valen cero
            mensaje: |
              B no es una articulación: la pieza es rígida, y el flector en B
              no es cero. Que la pieza cambie de dirección no la parte en dos.
          - texto: La suma de fuerzas horizontales
            mensaje: |
              Esa da la componente horizontal de A, cero aquí porque todas las
              cargas son verticales, y $R_C$ no aparece en ella. Con la
              vertical quedarían dos incógnitas, la vertical de A y $R_C$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la pieza ABC sin sus apoyos**,
          con las cargas y las reacciones.
        comprueba:
          - punto: |
              **En A, dos componentes; en C, solo la vertical.**
            porque: |
              A es un apoyo fijo y C uno móvil, que solo impide bajar.
          - punto: |
              **La carga $q_0$ en el primer tramo de AB y $P$ en la mitad de
              BC.**
            porque: |
              Para las reacciones, la carga vale $q_0a$ en el centro de su
              tramo, a $a/2$ de A; $P$ está a $\tfrac52 a$ de A en horizontal.
          - punto: |
              **Los brazos, en horizontal.**
            porque: |
              Las cargas y la reacción de C son verticales: su brazo respecto de
              A es la distancia horizontal, aunque BC esté inclinada.
