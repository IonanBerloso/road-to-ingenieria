      <figcaption>

      El trozo de 0 a x: la carga q sobre la cara de arriba y, en la cara del corte, N, T y M con sus sentidos positivos del curso, como incógnitas. El extremo libre no tiene nada.

      </figcaption>
      </figure>

      - **La rebanada**: en la cara izquierda, $N$ hacia $-x$, $T$ hacia
        arriba y $M$ horario; en la derecha, $N + dN$ hacia $+x$, $T + dT$
        hacia abajo y $M + dM$ antihorario. Son los sentidos positivos del
        tema 7 con $y$ hacia abajo (figura 7.6 de los apuntes, p. 11, en el
        plano $xy$).
      - **Sobre la cara de arriba**, $q\,dx$, vertical hacia abajo. La carga
        se toma uniforme dentro de $dx$ (apuntes, p. 10): su resultante pasa
        por el centro del tramo, a $dx/2$ de cada cara.
      - **El trozo de $0$ a $x$** solo tiene la carga, $q\,x$ hacia abajo,
        con su resultante en $x/2$.

      **2. Incógnitas.** $dN/dx$, $dT/dx$ y $dM/dx$; en el voladizo, $T(x)$ y
      $M(x)$, y con ellas $dM/dx$ en $x = 1{,}5$ m y el flector en el
      empotramiento.

      **3. Ecuaciones.** El equilibrio de la rebanada: fuerzas según $x$,
      fuerzas según $y$, positivas hacia abajo, y momentos respecto de G₂,
      el centro de la cara derecha, con el antihorario positivo, como en la
      ec. 7.11. En el trozo del voladizo, $T$ es la suma de las fuerzas hacia
      arriba y $M$, la suma de sus momentos respecto del centro de la
      sección, con el horario positivo.

      **4. Resultados.** **a/ Fuerzas según $x$.** $q$ no tiene componente
      según $x$:

      $$
      -N + (N + dN) = 0 \quad\Longrightarrow\quad \frac{dN}{dx} = 0
      $$

      **Fuerzas según $y$**, positivas hacia abajo:

      $$
      -T + (T + dT) + q\,dx = 0 \quad\Longrightarrow\quad \frac{dT}{dx} = -q
      $$

      **Momentos respecto de G₂.** $M + dM$ suma y $M$ resta. $T$, hacia
      arriba y a $dx$ a la izquierda de G₂, da $-T\,dx$. Los dos axiles y
      $T + dT$ pasan por G₂. La recta de acción de $q\,dx$ es vertical y pasa
      a $dx/2$ a la izquierda de G₂: hacia abajo y a la izquierda, gira en
      sentido antihorario y da $+q\,dx \cdot dx/2$. La altura a la que está
      aplicada no entra: el brazo de una fuerza vertical es la distancia
      horizontal de su recta de acción al punto.

      $$
      -M + (M + dM) - T\,dx + q\,dx\,\frac{dx}{2} = 0
      $$

      El último término es de segundo orden y se desprecia (apuntes, p. 11):

      $$
      \frac{dM}{dx} = T
      $$

      Las tres son las de los apuntes con $q_x = 0$ (ecs. 7.8, p. 10, y 7.14
      y 7.15, p. 12).

      **b/ El voladizo.** Con $x$ desde el extremo libre:

      $$
      T(x) = -q\,x \qquad M(x) = -\frac{q\,x^{2}}{2}
      $$

      En $x = 1{,}5$ m, la pendiente del flector es la cortante:

      $$
      \frac{dM}{dx} = T(1{,}5) = -4 \cdot 1{,}5 = -6\ \text{kN}
      $$

      es decir, $-6$ kN·m por metro. En el empotramiento, $x = 3$ m:

      $$
      M(3) = -\frac{4 \cdot 3^{2}}{2} = -18\ \text{kN·m}
      $$

      **5. Comprobación.** Con la carga en su sitio de verdad: la carga del
      trozo de $0$ a $x$ partida en muchas fuerzas $q\,\Delta s$, cada una
      aplicada en la cara de arriba, en el punto $(s, -h)$, y el momento de
      cada una respecto del centro de la sección, $(x, 0)$, con el producto
      vectorial entero, $r_x F_y - r_y F_x$. La altura solo entra en
      $r_y F_x$, y $F_x = 0$ en todas: con $h = 0{,}3$ m y con $h = 0$ sale
      lo mismo, $-18$ kN·m en el empotramiento y una pendiente de $-6$ en
      $x = 1{,}5$ m. El motor del curso (`vigas.ts`, con la carga en el eje)
      da $T(1{,}5) = -6$ kN y $M(3) = -18$ kN·m, y la pendiente de su
      diagrama de $M$ en $x = 1{,}5$ m es $-6$.

      **Lo que dice el resultado.** Que la carga se apoye en la cara de
      arriba no cambia nada, porque su recta de acción corta el eje, que es lo
      que los apuntes piden a $q_y$ (p. 10). El flector es negativo: el
      voladizo se comba hacia abajo desde el empotramiento y tracciona la
      fibra de arriba, y el empotramiento sostiene la carga entera,
      $4 \cdot 3 = 12$ kN, y su momento. Con una carga horizontal en la cara
      de arriba, la pregunta es la misma: dónde está su recta de acción
      respecto de G₂. Es la cuestión de 2016-2017, la siguiente del escalón.

  - id: ejerm7-la-viga-con-rotula
    titulo: La viga con una rótula, y por dónde se empieza
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        Con las tres ecuaciones de equilibrio del conjunto no basta: hay que
        encontrar en la viga una condición más, y escoger bien con qué trozo
        escribirla.
      formula: |
        $$
        \frac{dT}{dx} = -q
        \qquad
        \frac{dM}{dx} = T
        $$

        Cómo cambian la cortante y el flector a lo largo de la viga (ecs. 7.14
        y 7.15).
      reconocer: |
        Antes de las cuentas, cuenta las incógnitas de los apoyos y las
        ecuaciones, y mira qué tiene de especial el punto B.
    enunciado: |
      Una viga ABC está empotrada en A, tiene una rótula en B y se apoya en C
      sobre un apoyo simple. Los tramos miden $AB = BC = 2\ \text{m}$, y en
      todo el tramo BC actúa una carga uniforme $q = 4\ \text{kN/m}$ hacia
      abajo; AB no tiene ninguna carga encima. Es la viga de la figura del
      tema, con números.

      Calcular la reacción en C, el momento flector en el empotramiento y el
      flector máximo del tramo BC, con el convenio del curso: $y$ hacia abajo,
      flector positivo si tracciona la fibra inferior.
    pide: La reacción en C, el flector en A y el flector máximo de BC.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las incógnitas son cuatro: las tres del empotramiento y la del
          apoyo C. ¿De dónde sale la cuarta ecuación, y por dónde conviene
          empezar?
        opciones:
          - texto: De la rótula, donde el flector es cero; se empieza por el tramo BC
            correcta: true
            mensaje: |
              Eso es. $M_B = 0$ escrito con las fuerzas de la derecha de B
              solo tiene una incógnita, $R_C$. BC es una biapoyada entre la
              rótula y el apoyo, y se resuelve sola.
          - texto: Del empotramiento, que tiene tres reacciones y tres ecuaciones
            mensaje: |
              El conjunto tiene tres ecuaciones de equilibrio y cuatro
              incógnitas. Empezando por A se dan vueltas: la ecuación que
              falta es la de la rótula, $M_B = 0$.
          - texto: No hace falta; la rótula no cambia nada y la viga es una continua
            mensaje: |
              La rótula cambia todo: no transmite momento. Sin ella, con
              empotramiento y apoyo, la viga sería hiperestática y estas
              ecuaciones no bastarían.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga entera sin sus apoyos
          y, aparte, el tramo BC cortado por la rótula**.
        comprueba:
          - punto: |
              **En A, dos fuerzas y el par del empotramiento; en C, una
              fuerza.**
            porque: |
              El empotramiento impide moverse y girar; el apoyo simple, solo
              bajar.
          - punto: |
              **En la rótula, dos componentes de fuerza y ningún par.**
            porque: |
              La rótula deja girar: no transmite momento, y por eso el flector
              en B es cero.
          - punto: |
              **Sobre BC, la carga entera, en los dos dibujos.**
            porque: |
              Tomando momentos respecto de B en el tramo BC, las fuerzas de la
              rótula no entran: queda solo $R_C$.
        figura: |
          <svg viewBox="0 36 420 108" role="img" width="420" height="108" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La viga con la rótula: entera y partida en B</title>
