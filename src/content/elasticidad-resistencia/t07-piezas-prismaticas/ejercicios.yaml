ejercicios:
  # ── Ejemplo introductorio nuestro · el equilibrio de la rebanada con la carga en la cara de arriba.
  - id: ejerm7-la-rebanada-con-la-carga-vertical-arriba
    titulo: La rebanada con una carga vertical en su cara de arriba
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        La rebanada se aísla como un sólido más, con los esfuerzos de sus dos
        caras y la carga. Las tres ecuaciones salen de su equilibrio: fuerzas
        según x, fuerzas según y y momentos.
      formula: |
        $$
        \frac{dT}{dx} = -q
        \qquad
        \frac{dM}{dx} = T
        $$

        Lo que dan las ecuaciones de equilibrio de la rebanada en una viga
        recta con carga vertical (ecs. 7.14 y 7.15), junto con $dN/dx = 0$.
      reconocer: |
        Antes de las cuentas, dibuja la rebanada con la carga donde está de
        verdad, en la cara de arriba, y mira qué ecuación podría notarlo.
    enunciado: |
      Una pieza prismática recta de canto $2h$ lleva una carga repartida
      vertical $q(x)$, hacia abajo, aplicada sobre su cara de arriba: por
      ejemplo, el peso de un pavimento que se apoya en la viga. Con el
      convenio del curso ($x$ a lo largo del eje, $y$ hacia abajo, y los
      esfuerzos positivos como en la figura):

      a) Deducir las ecuaciones de equilibrio de una rebanada de longitud
      $dx$: $dN/dx$, $dT/dx$ y $dM/dx$.

