      <figcaption>

      a) La viga entera: cuatro incógnitas, HA, VA, MA y RC, y tres ecuaciones. b) El tramo BC, cortado por la rótula, que transmite fuerza y no momento: en B, dos componentes y ningún par.

      </figcaption>
      </figure>

      - **Cuatro incógnitas**: las tres del empotramiento, $H_A$, $V_A$ y
        $M_A$, y $R_C$; y tres ecuaciones del conjunto.
      - **La cuarta es la rótula**: $M_B = 0$. Escrita con lo que hay a la
        derecha de B, solo tiene a $R_C$.
      - **AB no tiene carga encima.**

      **2. Incógnitas.** $R_C$; las reacciones de A; el flector en el
      empotramiento y el máximo de BC.

      **3. Ecuaciones.** Momentos respecto de B del tramo BC, que son
      $M_B = 0$; el equilibrio vertical del conjunto; y las leyes de la
      cortante y del flector (ecs. 7.14 y 7.15).

      **4. Resultados.** **La reacción en C.**

      $$
      R_C \cdot 2 - 4 \cdot 2 \cdot 1 = 0 \quad\Longrightarrow\quad R_C = 4\ \text{kN}
      $$

      **AB.** Por el equilibrio vertical del conjunto, $V_A = 8 - 4 = 4$ kN.
      No hay carga en AB, así que la cortante es constante, $T = 4$ kN, y el
      flector es una recta que vale cero en la rótula. En A, por la derecha:

      $$
      M_A = -4 \cdot 2 = -8\ \text{kN}\cdot\text{m}
      $$

      Negativo: AB se comba hacia abajo desde el empotramiento y tracciona la
      fibra superior.

      **BC.** La cortante baja con pendiente $-q$ desde $T = 4$ kN en B hasta
      $T = 4 - 4 \cdot 2 = -4$ kN en C, donde la reacción la devuelve a cero.
      Se anula a 1 m de C, en el centro del tramo, y ahí el flector, una
      parábola, alcanza su máximo:

      $$
      M_{\max} = 4 \cdot 1 - 4 \cdot \frac{1^{2}}{2} = 2\ \text{kN}\cdot\text{m} = \frac{q\,a^{2}}{8}
      $$

      **5. Comprobación.** $M = 0$ en la rótula y en el apoyo C, y en cada
      apoyo la cortante salta lo que vale su reacción. El tramo BC solo
      cumple el equilibrio vertical con $B_y = 8 - 4 = 4$ kN: la cortante que
      la rótula pasa a AB.

      **Lo que dice el resultado.** BC trabaja como una viga apoyada en la
      rótula y en C: su flector máximo es el de siempre, $q\,a^{2}/8$. Y AB
      es un voladizo con los 4 kN de la rótula en su punta: de ahí los
      $-8$ kN·m del empotramiento.

  # ── Ejercicio de clase 7.1 · la biapoyada con la carga triangular en BC.
  - id: ejerm7-cl7-1-la-carga-triangular-en-media-viga
    titulo: La viga apoyada con una carga triangular en su mitad derecha
    fuente: >-
      Ejercicio 7.1 · Tema 7, «Piezas prismáticas. Fuerzas y momentos de
      sección» · Elasticidad y Resistencia de Materiales, UPV/EHU, ejercicios
      de clase (el fichero del 7.1 lleva la fecha del 23 de octubre de 2019).
      El material no trae solución: la resolución es nuestra, con el convenio
      del tema 7, y cada cifra está calculada con el motor del curso y
      comprobada por un segundo camino (la resultante del triángulo en su
      centro de gravedad para las reacciones, y la integración de
      dT/dx = −q y dM/dx = T de A a C, que tiene que acabar con M = 0 en el
      apoyo). El enunciado pide solo los diagramas; aquí se pregunta además
      por los valores que los fijan. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        Primero las reacciones, con la resultante de la carga triangular;
        después, tramo a tramo, la cortante y el flector, que cambian de forma
        donde cambia la carga.
      formula: |
        $$
        \frac{dT}{dx} = -q
        \qquad
        \frac{dM}{dx} = T
        $$

        La pendiente de la cortante es la carga cambiada de signo, y la del
        flector, la cortante (ecs. 7.14 y 7.15).
      reconocer: |
        Antes de las cuentas, separa la viga en tramos según la carga y piensa
        qué grado tiene la carga en cada uno.
    enunciado: |
      Para la viga de la figura, dibujar los diagramas de fuerzas cortantes y
      de momentos flectores.

      <figure class="figura-examen">
