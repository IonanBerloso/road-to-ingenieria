          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M70 70 H230 V100 H70 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M254 110 h22" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M254 110 v20" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M70 128 H230 M70 124 V132 M230 124 V132" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="150" y="122" font-size="9" text-anchor="middle" fill="var(--faint)">2 m</text>
        <path d="M67.2 104.8 A20 20 0 0 1 51.9 93.5" fill="none" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="44" y="116" font-size="10" text-anchor="end" fill="var(--d2-tinta)">M</text>
        <line x1="230" y1="28" x2="230" y2="66" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="236" y="40" font-size="10" text-anchor="start" fill="var(--flag)">10 kN</text>
        <line x1="70" y1="85" x2="32" y2="85" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="28" y="89" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
        <line x1="70" y1="85" x2="70" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="76" y="44" font-size="10" text-anchor="start" fill="var(--d2-tinta)">T</text>
        <circle cx="70" cy="85" r="2.4" fill="var(--ink)"/>
        <text x="76" y="96" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">G</text>
        <circle cx="230" cy="85" r="2.4" fill="var(--ink)"/>
        <text x="236" y="96" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <text x="280" y="114" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <text x="251" y="138" font-size="9" text-anchor="end" fill="var(--faint)">y</text>
      </svg>
      <figcaption>

      La parte derecha: la fuerza de B, dato, y en la cara del corte, de normal −x, N, T y M con sus sentidos positivos, como incógnitas: T hacia −y, hacia arriba, y M horario.

      </figcaption>
      </figure>

      **2. Incógnitas.** $T$ y $M$ en la sección a 1 m de A.

      **3. Ecuaciones.** El equilibrio de la parte derecha: fuerzas
      verticales y momentos respecto de G, el centro de la cara del corte,
      con el horario positivo. La fuerza de B está a 2 m de G:

      $$
      T - 10 = 0
      \qquad
      M + 10 \cdot 2 = 0
      $$

      **4. Resultados.**

      $$
      T = 10\ \text{kN}
      \qquad
      M = -20\ \text{kN·m}
      $$

      **5. Comprobación.** Por la izquierda, con las reacciones de A (10 kN
      hacia arriba y un par antihorario de 30 kN·m), sale lo mismo: $T$ es la
      suma de las fuerzas hacia arriba de la izquierda, 10 kN, y $M$, la suma
      de sus momentos respecto de la sección con el horario positivo,
      $10 \cdot 1 - 30 = -20$ kN·m. El voladizo se ha resuelto también con el
      motor del curso, que usa este convenio: da $T$ = 10 kN y
      $M$ = −20 kN·m en $x$ = 1 m. Los sentidos de la figura del primer
      dibujo se han comparado con los de la figura 7.5: los mismos en las
      cuatro caras.

      **Lo que dice el resultado.** $T$ es positiva aunque la fuerza de B vaya
      hacia abajo: lo que cuenta es la cara en que se mira. Y el flector
      negativo tracciona la fibra de arriba, como en todo voladizo cargado
      hacia abajo.

  # ── Cuestión 3 de autoevaluación del tema 7 · los procedimientos A y B.
  - id: ejerm7-cu3-los-procedimientos-a-y-b
    titulo: Los dos procedimientos para calcular los esfuerzos de una sección
    fuente: >-
      Cuestión 3 de autoevaluación · Tema 7, «Piezas prismáticas. Fuerzas y
      momentos de sección» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae respuesta: la resolución es nuestra y
      sigue los apuntes del tema 7, apartado 7.2 (pp. 4 a 6, ecs. 7.1 a 7.5
      y figura 7.1), y el ejemplo del voladizo de las diapositivas del tema.
      Ninguno de los diez parciales 1 publicados la pide. El ejemplo de la
      viga apoyada es nuestro, comprobado con el motor del curso y a mano
      por las dos partes.
    nivel: practica
    antes:
      idea: |
        Al cortar la pieza, la cara de cada parte recibe lo que le hace la
        otra. Los esfuerzos de la sección se pueden sacar de cualquiera de las
        dos partes: cada procedimiento usa una.
      formula: |
        $$
        \vec R_I + \left(\sum\vec F_{ext}\right)_I = \vec 0
        $$

        El equilibrio de la parte I: la resultante de la cara del corte y sus
        fuerzas exteriores; y lo mismo con los momentos respecto de $G$.
      reconocer: |
        Antes de escribir, piensa en la parte II sola: qué fuerzas tiene y qué
        le hace la parte I.
    enunciado: |
      3. Explicar los procedimientos de cálculo A y B para determinar las
      fuerzas y momentos internos de una sección.
    pide: >-
      En qué consiste cada procedimiento, con sus ecuaciones, y cuándo se
      usa cada uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el procedimiento B, la resultante y el momento de la cara de la
          parte I se igualan a la resultante y al momento, respecto de $G$, de
          las fuerzas exteriores de la parte II. ¿Qué dos cosas lo permiten?
        opciones:
          - texto: >-
              Que la parte II está en equilibrio, y que lo que la parte II
              recibe de la I es igual y contrario a lo que la I recibe de la II
            correcta: true
            mensaje: |
              Eso es: el equilibrio de la parte II (ec. 7.2) y el principio de
              acción y reacción en el corte,
              $\vec R_I = -\vec R_{II}$ y $\vec M_{GI} = -\vec M_{GII}$
              (ec. 7.3). Juntos dan la ec. 7.5: lo que actúa en la cara de una
              parte es la reducción a $G$ de las fuerzas exteriores de la otra.
          - texto: >-
              Que la parte I está en equilibrio con sus propias fuerzas
              exteriores
            mensaje: |
              Ese es el procedimiento A (ec. 7.1), y lo que da es que la
              resultante de la cara de I es la **opuesta** de la de las fuerzas
              exteriores de I. Para llegar a las de la parte II hacen falta el
              equilibrio de II y la acción y reacción.
          - texto: >-
              Que la pieza es rígida y las fuerzas de la parte II se pueden
              trasladar hasta la sección sin cambiarlas
            mensaje: |
              No se trasladan: se reducen a $G$, cada una con su momento
              respecto de $G$, y la igualdad sale del equilibrio de la parte II
              y de la acción y reacción, no de ninguna rigidez.
          - texto: >-
              Que las fuerzas exteriores de las dos partes son iguales
            mensaje: |
              Son opuestas, no iguales: por el equilibrio de la pieza entera,
              la resultante de las fuerzas exteriores de I más la de las de II
              da cero. Por eso los dos procedimientos dan lo mismo.
      - tipo: redactar
        que: procedimiento
        consigna: >-
          Explica los dos procedimientos como en un examen: el corte y lo que
          aparece en él, las ecuaciones de cada procedimiento y cuál se usa.
        rubrica:
          - punto: >-
              Se corta la pieza por una sección en dos partes, I y II. En la
              cara de cada una aparecen las fuerzas internas que la mantienen
              en equilibrio, que reducidas al centro de gravedad de la sección
              son una resultante Ri y un momento resultante MGi (figura 7.1).
            porque: >-
              Es el punto de partida de los dos procedimientos: las incógnitas
              son la resultante y el momento de la cara, y sus componentes son
              las fuerzas y momentos de sección.
            minimo: true
          - punto: >-
              Procedimiento A, el equilibrio de cada parte con sus fuerzas
              exteriores (reacciones incluidas) y las internas de su cara:
              (ΣFext)I + RI = 0 y (ΣMGext)I + MGI = 0 (ec. 7.1), y lo mismo
              para la parte II (ec. 7.2).
            porque: >-
              Las fuerzas exteriores se conocen, así que el equilibrio de cada
              parte da directamente la resultante y el momento de su cara.
            minimo: true
          - punto: >-
              Acción y reacción en el corte: RI = −RII y MGI = −MGII (ec. 7.3).
            porque: >-
              Es lo que liga las caras de las dos partes, y lo que permite el
              procedimiento B.
            minimo: true
          - punto: >-
              Procedimiento B: con la ec. 7.3 en las ecs. 7.1 y 7.2,
              (ΣFext)I = RII y (ΣMGext)I = MGII (ec. 7.4), y
              (ΣFext)II = RI y (ΣMGext)II = MGI (ec. 7.5): la resultante y el
              momento de las fuerzas exteriores de una parte son los de las
              fuerzas internas de la cara de la otra.
            porque: >-
              Es la equivalencia que da nombre al procedimiento: los esfuerzos
              de una cara se calculan sin dibujar la parte a la que pertenece.
            minimo: true
          - punto: >-
              Los dos dan lo mismo; se elige la parte con menos fuerzas. Los
              apuntes toman en lo sucesivo la parte izquierda, sin subíndice.
            porque: >-
              Es la consecuencia práctica, y con ella se escriben todos los
              diagramas del tema.
      - tipo: calcular
        titulo: La cortante por el procedimiento A
        pregunta: |
          Un ejemplo nuestro: una viga de 6 m, con A articulado en $x = 0$,
          B móvil en $x$ = 6 m y una fuerza de 12 kN hacia abajo en
          $x$ = 2 m. Las reacciones son 8 kN en A y 4 kN en B, las dos hacia
          arriba. Con el procedimiento A sobre la parte izquierda de la
          sección $x$ = 4 m, ¿cuánto vale la cortante $T$, con su signo, en
          kN?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.01
          formato: un número con su signo, en kN
        distractores:
          - valor: '4'
            mensaje: |
              Has igualado $T$ a la resultante de las fuerzas exteriores de la
              propia parte izquierda, 4 kN hacia abajo, como en el
              procedimiento B, que usa las de la **otra** parte. En el A la cara
              equilibra esas fuerzas (ec. 7.1): empuja 4 kN hacia arriba, y en
              la cara derecha $T$ es positiva hacia abajo, así que $T = -4$ kN.
              Si has tomado $T$ positiva hacia arriba en la cara derecha (los
              libros con $y$ hacia arriba), es el mismo signo cambiado.
          - valor: '8'
            mensaje: |
              Te has dejado la fuerza de 12 kN, que está a la izquierda de la
              sección, en $x$ = 2 m: es una fuerza exterior de la parte I.
          - valor: '-12'
            mensaje: |
              Te has dejado la reacción de A: las reacciones son fuerzas
              exteriores de la parte en que están (apuntes, p. 5).
        pista: |
          Dibuja la parte de $x = 0$ a $x$ = 4 m con sus fuerzas y, en su cara
          derecha, $T$ hacia abajo (positiva). Equilibrio de fuerzas
          verticales.
        desarrollo: |
          Sobre la parte izquierda: 8 kN hacia arriba en A, 12 kN hacia abajo
          en $x$ = 2 m y $T$ en la cara, positiva hacia abajo. Con las fuerzas
          hacia abajo positivas:

          $$
          -8 + 12 + T = 0 \;\Longrightarrow\; T = -4
          $$

          en kN: la cara empuja hacia arriba.
      - tipo: calcular
        titulo: El flector por el procedimiento B
        pregunta: |
          En la misma sección, con el procedimiento B: ¿cuánto vale el flector
          $M$ de la cara de la parte izquierda, sacado de las fuerzas
          exteriores de la parte derecha, con su signo, en kN·m?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-8'
            mensaje: |
              Tiene el valor bueno y el signo cambiado. La reacción de B, 4 kN
              hacia arriba a 2 m a la derecha de la sección, gira en
              antihorario respecto de ella; en la cara derecha de la parte
              izquierda el flector positivo es antihorario (fig. 7.5), así que
              $M = +8$ kN·m: tracciona la fibra de abajo, como en toda viga
              apoyada con cargas hacia abajo.
          - valor: '16'
            mensaje: |
              Has tomado como brazo la distancia de A a la sección, 4 m. El
              momento es respecto de $G$, el centro de la sección: la reacción
              de B está a $6 - 4 = 2$ m de ella.
          - valor: '24'
            mensaje: |
              Has tomado como brazo la distancia de A a B, 6 m: es el momento
              de la reacción de B respecto de A. En el procedimiento B los
              momentos se toman respecto de $G$, el centro de la sección.
          - valor: '32'
            mensaje: |
              Has hecho reacción de A por su brazo, 8 kN por 4 m: son fuerzas
              de la parte izquierda, y además falta la de 12 kN. En el
              procedimiento B, para la cara de la parte izquierda, cuentan las
              fuerzas de la derecha: solo la reacción de B.
        pista: |
          Ec. 7.5: el momento de la cara de la parte I es el de las fuerzas
          exteriores de la parte II respecto de $G$. En la parte derecha solo
          está la reacción de B.
        desarrollo: |
          La única fuerza exterior de la parte derecha es la reacción de B,
          4 kN hacia arriba, a 2 m de la sección. Respecto de $G$ gira en
          antihorario, que en la cara derecha de la parte izquierda es el
          sentido positivo del flector:

          $$
          M = 4\cdot2 = 8
          $$

          en kN·m. Con el procedimiento A sobre la parte izquierda sale lo
          mismo: $8\cdot4 - 12\cdot2 = 8$, también en kN·m.
      - tipo: justificar
        pregunta: Ordena la deducción del procedimiento B. Una pieza es falsa.
        piezas:
          - texto: >-
              Se corta la pieza en las partes I y II, y en la cara de cada una
              se reducen las fuerzas internas a $G$: $\vec R_I$, $\vec M_{GI}$
              y $\vec R_{II}$, $\vec M_{GII}$.
          - texto: >-
              Equilibrio de la parte II:
              $\left(\sum\vec F_{ext}\right)_{II} + \vec R_{II} = \vec 0$ y
              $\left(\sum\vec M_{Gext}\right)_{II} + \vec M_{GII} = \vec 0$ (ec. 7.2).
          - texto: >-
              Acción y reacción en el corte: $\vec R_I = -\vec R_{II}$ y
              $\vec M_{GI} = -\vec M_{GII}$ (ec. 7.3).
          - texto: >-
              Sustituyendo: $\left(\sum\vec F_{ext}\right)_{II} = \vec R_I$ y
              $\left(\sum\vec M_{Gext}\right)_{II} = \vec M_{GI}$ (ec. 7.5): los esfuerzos
              de la cara de I son la reducción a $G$ de las fuerzas exteriores
              de II.
          - texto: >-
              Por el equilibrio de la pieza entera, las fuerzas exteriores de I
              y de II son iguales, así que también
              $\left(\sum\vec F_{ext}\right)_I = \vec R_I$.
            trampa: true
            mensaje: |
              Son opuestas: $\left(\sum\vec F_{ext}\right)_I + \left(\sum\vec F_{ext}\right)_{II} = \vec 0$.
              Con las fuerzas de la propia parte, la ec. 7.1 da
              $\vec R_I = -\left(\sum\vec F_{ext}\right)_I$, que es el procedimiento A.
              Usar las de la propia parte con el signo del B es el error que
              cambia el signo de todos los esfuerzos.
    resolucion: |
      **El corte** (apuntes del tema 7, apartado 7.2, pp. 4-5, figura 7.1).
      Una pieza en equilibrio bajo las fuerzas exteriores
      $\vec F_1, \vec F_2, \dots, \vec F_N$, reacciones incluidas, se corta
      por una sección en dos partes, I y II. En la superficie de corte
      aparecen las fuerzas internas que mantienen en equilibrio cada parte;
      reducidas al centro de gravedad de la sección son una resultante
      $\vec R_i$ y un momento resultante $\vec M_{Gi}$, con $i = I, II$.

      **Procedimiento A: el equilibrio de cada parte** (p. 5).

      $$
      \left(\textstyle\sum\vec F_{ext}\right)_I + \vec R_I = \vec 0
      \qquad
      \left(\textstyle\sum\vec M_{Gext}\right)_I + \vec M_{GI} = \vec 0
      \qquad (7.1)
      $$

      y lo mismo con la parte II (ec. 7.2). Las fuerzas exteriores se
      conocen, así que el equilibrio de cada parte da la resultante y el
      momento de su cara.

      **Procedimiento B: la equivalencia con la otra parte** (pp. 5-6). Por
      el principio de acción y reacción,

      $$
      \vec R_I = -\vec R_{II}
      \qquad
      \vec M_{GI} = -\vec M_{GII}
      \qquad (7.3)
      $$

      y sustituyéndolo en las ecs. 7.1 y 7.2:

      $$
      \left(\textstyle\sum\vec F_{ext}\right)_I = \vec R_{II}
      \quad
      \left(\textstyle\sum\vec M_{Gext}\right)_I = \vec M_{GII}
      \quad (7.4)
      \qquad
      \left(\textstyle\sum\vec F_{ext}\right)_{II} = \vec R_I
      \quad
      \left(\textstyle\sum\vec M_{Gext}\right)_{II} = \vec M_{GI}
      \quad (7.5)
      $$

      La resultante y el momento de las fuerzas exteriores de una parte son
      los de las fuerzas internas de la cara de la **otra**. Los apuntes
      escriben en las ecs. 7.4 y 7.5 el subíndice «kan» en lugar de «ext»:
      es una errata, y es el mismo sumatorio de las fuerzas exteriores.

      **Cuál se usa.** Los dos dan lo mismo, porque la pieza entera está en
      equilibrio. Se toma la parte con menos fuerzas; los apuntes toman en
      lo sucesivo la izquierda, sin subíndice (p. 6). Las diapositivas lo
      ponen con un voladizo: el procedimiento A plantea el equilibrio del
      cuerpo 1, y el B da los esfuerzos del cuerpo 1 con las cargas
      aplicadas en el cuerpo 2.

      **Un ejemplo nuestro.** Una viga de 6 m con A articulado, B móvil y
      12 kN hacia abajo en $x$ = 2 m: las reacciones son 8 kN en A y 4 kN
      en B, hacia arriba. En la sección $x$ = 4 m:

      - Procedimiento A, con la parte izquierda: $-8 + 12 + T = 0$, así que
        $T$ = −4 kN; y, con los momentos respecto de $G$, $M$ = 8 kN·m.
      - Procedimiento B, con las fuerzas de la parte derecha: solo la
        reacción de B, 4 kN hacia arriba a 2 m. Da $T$ = −4 kN (va hacia
        arriba, el sentido negativo de la cara derecha) y $M$ = 8 kN·m
        (antihorario, el positivo).

      **Comprobaciones.** La viga se ha resuelto con el motor del curso: da
      las mismas reacciones y, en $x$ = 4 m, $T$ = −4 kN y $M$ = 8 kN·m. El
      segundo camino son los dos procedimientos a mano, por las dos partes.

  # ── Cuestión 5 de autoevaluación del tema 7 · cortantes y flectores con carga lineal.
  - id: ejerm7-cu5-la-carga-lineal
    titulo: Cortantes y flectores bajo una carga repartida lineal
    fuente: >-
      Cuestión 5 de autoevaluación · Tema 7, «Piezas prismáticas. Fuerzas y
      momentos de sección» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae respuesta: la resolución es nuestra y
      sigue los apuntes del tema 7, apartados 7.4 y 7.5 (ecs. 7.14 a 7.17 y
      las dos tablas, pp. 12 y 13). Ningún parcial 1 publicado la pide sola:
      la pregunta 2 de teoría de 2012-2013 pide otra cosa, y su resolución
      en el sitio toca esto al final. El ejemplo del tramo es nuestro, comprobado
      con el motor del curso y por dos caminos más: las ecs. 7.16 y 7.17 a
      mano y un Runge-Kutta desde x = 0.
    nivel: practica
    antes:
      idea: |
        La carga de un tramo decide la forma de sus leyes: cada grado de más en
        la carga es un grado de más en la cortante y otro en el flector.
      formula: |
        $$
        \int x^{n}\,dx = \frac{x^{n+1}}{n+1}
        $$

        La integral de una potencia: con ella se integra un polinomio término a
        término.
      reconocer: |
        Antes de escribir, mira el ejemplo: da la carga y los valores de $T$ y
        de $M$ en $x = 0$. Piensa para qué sirve cada dato.
    enunciado: |
      5. Si la carga distribuida aplicada en una pieza recta es lineal,
      deducir las distribuciones de fuerzas cortantes y de momentos
      flectores.
    pide: >-
      Las leyes de la fuerza cortante y del momento flector en un tramo de
      pieza recta con carga repartida lineal, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          La carga es $q = q_1x + q_0$, hacia abajo. ¿De dónde salen las leyes
          $T(x)$ y $M(x)$ del tramo?
        opciones:
          - texto: >-
              De integrar las ecuaciones de la rebanada, primero $dT/dx = -q$
              y después $dM/dx = T$, con dos constantes: $T$ y $M$ en $x = 0$
            correcta: true
            mensaje: |
              Eso es (ecs. 7.14 y 7.15). Cada integración sube un grado: la
              carga es de grado 1, la cortante de grado 2 y el flector de
              grado 3. Las constantes $T_0$ y $M_0$ son los valores en el
              principio del tramo, y salen de sus condiciones.
          - texto: >-
              Del equilibrio de la viga entera, con la carga cambiada por su
              resultante
            mensaje: |
              Eso da las reacciones, no la ley en cada $x$: la resultante de
              toda la carga no actúa sobre el trozo que va de 0 a $x$. Para la
              ley hay que contar la carga que hay en cada trozo, que es lo que
              hace la integración de la rebanada.
          - texto: >-
              De integrar $dT/dx = +q$ y después $dM/dx = T$
            mensaje: |
              Con el convenio del curso la carga positiva va hacia abajo,
              según $y$, y hace bajar la cortante: $dT/dx = -q$ (ec. 7.14).
              Con $+q$ salen los signos de los libros que toman la carga
              positiva hacia arriba.
          - texto: >-
              De integrar $dM/dx = -q$ y después $dT/dx = M$
            mensaje: |
              Están cambiadas: la carga da la pendiente de la cortante, y la
              cortante, la del flector (ecs. 7.14 y 7.15).
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en un examen: de qué ecuaciones se parte,
          las dos integraciones con sus constantes y qué forma tienen las
          leyes con carga nula, uniforme y lineal.
        rubrica:
          - punto: >-
              Se parte de las ecuaciones de equilibrio de la rebanada en el
              plano, dT/dx = −q y dM/dx = T (ecs. 7.14 y 7.15), con la carga
              positiva hacia abajo, según y.
            porque: >-
              Son las que ligan la carga con los esfuerzos en cada sección: sin
              ellas no hay ley, solo valores sueltos.
            minimo: true
          - punto: >-
              La carga lineal es q = q1·x + q0, que incluye la uniforme
              (q1 = 0) y la nula (q0 = q1 = 0).
            porque: >-
              Es lo que dice el apartado 7.5 (p. 12): analizar la lineal da los
              otros dos casos.
          - punto: >-
              Integrando la 7.14: T = −½q1x² − q0x + T0 (ec. 7.16), con T0 una
              constante de integración, la cortante en x = 0.
            porque: >-
              Es la ley de cortantes pedida, con su constante interpretada.
            minimo: true
          - punto: >-
              Integrando la 7.15: M = −⅙q1x³ − ½q0x² + T0x + M0 (ec. 7.17), con
              M0 el flector en x = 0.
            porque: >-
              Es la ley de flectores pedida: el término de la carga lineal
              lleva un sexto, no un medio.
            minimo: true
          - punto: >-
              Con q lineal, T es una parábola y M una función cúbica (tablas de
              la p. 13).
            porque: >-
              Es la conclusión de la deducción, la que se usa para dibujar los
              diagramas tramo a tramo.
            minimo: true
          - punto: >-
              Y los otros dos casos de las tablas: con q = 0, T es uniforme y M
              lineal; con q uniforme, T es lineal y M una parábola.
            porque: >-
              Salen de la misma deducción con q1 = 0 o con q0 = q1 = 0, y son
              los tramos que más se dibujan.
          - punto: >-
              Donde T = 0, M tiene tangente horizontal; una fuerza concentrada
              hace saltar T lo que vale, y un momento concentrado hace saltar M
              lo que vale.
            porque: >-
              Son las otras características que dan los apuntes (p. 13), y las
              que se comprueban en un diagrama.
      - tipo: calcular
        titulo: Dónde se anula la cortante
        pregunta: |
          Un ejemplo nuestro: en un tramo de viga recta la carga es
          $q = 2 + 1{,}5\,x$ (kN/m, con $x$ en m), hacia abajo. En $x = 0$ la
          cortante vale $T_0$ = 18 kN y el flector, $M_0$ = −6 kN·m, con el
          convenio del curso. ¿En qué $x$ se anula la cortante, en m?
        respuesta:
          tipo: numero
          valor: '3.744'
          tolerancia: 0.005
          formato: un número, en m
        distractores:
          - valor: '2.861'
            mensaje: |
              Has integrado $1{,}5\,x$ como $1{,}5\,x^{2}$, sin el ½, o has
              multiplicado la carga en $x$ por $x$ como si fuera uniforme: las
              dos cosas dan $1{,}5\,x^{2} + 2x = 18$. La carga que hay entre 0
              y $x$ es un trapecio de área $2x + 0{,}75\,x^{2}$ (ec. 7.16 con
              $q_1 = 1{,}5$).
          - valor: '9'
            mensaje: |
              Has tomado la carga como uniforme, de 2 kN/m: $18/2$. Crece con
              $x$, y la cortante cae cada vez más deprisa: se anula antes.
          - valor: '4.899'
            mensaje: |
              Te has dejado la parte uniforme de la carga, $q_0 = 2$ kN/m, y
              has resuelto $0{,}75\,x^{2} = 18$. La ec. 7.16 lleva los dos
              términos, $-\tfrac12q_1x^{2} - q_0x$.
        pista: |
          Ec. 7.16: $T = -\tfrac12q_1x^{2} - q_0x + T_0$, con $q_1 = 1{,}5$,
          $q_0 = 2$ y $T_0 = 18$. Iguala a cero y quédate con la raíz positiva.
        desarrollo: |
          $$
          T = -0{,}75\,x^{2} - 2x + 18 = 0
          \;\Longrightarrow\;
          x = \frac{-2 + \sqrt{4 + 54}}{1{,}5} = 3{,}744
          $$

          en m.
      - tipo: calcular
        titulo: El flector máximo del tramo
        pregunta: |
          ¿Cuánto vale el flector en esa sección, que es el máximo del tramo,
          en kN·m?
        respuesta:
          tipo: numero
          valor: '34.25'
          tolerancia: 0.05
          formato: un número, en kN·m
        distractores:
          - valor: '40.25'
            mensaje: |
              Te has dejado la constante $M_0$ = −6 kN·m: el flector no empieza
              en cero en $x = 0$.
          - valor: '8.02'
            mensaje: |
              Has integrado $-\tfrac12q_1x^{2}$ como $-\tfrac12q_1x^{3}$, sin
              dividir por 3: el término de la carga lineal en el flector es
              $-\tfrac16q_1x^{3}$ (ec. 7.17).
          - valor: '20.24'
            mensaje: |
              Has integrado $-q_0x$ como $-q_0x^{2}$, sin el ½: el término de
              la parte uniforme es $-\tfrac12q_0x^{2}$ (ec. 7.17).
        pista: |
          Ec. 7.17: $M = -\tfrac16q_1x^{3} - \tfrac12q_0x^{2} + T_0x + M_0$, en
          el $x$ del paso anterior. Es un máximo porque $dM/dx = T$ pasa de
          positiva a negativa.
        desarrollo: |
          Con $x$ = 3,744 m:

          $$
          M = -0{,}25\cdot3{,}744^{3} - 3{,}744^{2} + 18\cdot3{,}744 - 6 = 34{,}25
          $$

          en kN·m.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En el plano, la rebanada da $dT/dx = -q$ y $dM/dx = T$ (ecs. 7.14
              y 7.15).
          - texto: >-
              Con $q = q_1x + q_0$, integrando la primera:
              $T = -\tfrac12q_1x^{2} - q_0x + T_0$ (ec. 7.16).
          - texto: >-
              Integrando la segunda con esa $T$:
              $M = -\tfrac16q_1x^{3} - \tfrac12q_0x^{2} + T_0x + M_0$ (ec. 7.17).
          - texto: >-
              $T_0$ y $M_0$ son la cortante y el flector en $x = 0$, y salen de
              las condiciones del tramo; la cortante es una parábola y el
              flector una cúbica, con su extremo donde $T = 0$.
          - texto: >-
              Al integrar la segunda, el término de la carga lineal es
              $-\tfrac12q_1x^{3}$, porque viene de $-\tfrac12q_1x^{2}$.
            trampa: true
            mensaje: |
              Al integrar $x^{2}$ sale $x^{3}/3$: el término es
              $-\tfrac12\cdot\tfrac13\,q_1x^{3} = -\tfrac16q_1x^{3}$ (ec. 7.17).
    resolucion: |
      **De dónde se parte** (apuntes del tema 7, apartado 7.4, p. 12). Con
      todas las fuerzas según $y$, la rebanada da

      $$
      \frac{dT}{dx} = -q \quad (7.14)
      \qquad
      \frac{dM}{dx} = T \quad (7.15)
      $$

      con $y$ y la carga positiva hacia abajo.

      **La carga lineal** (apartado 7.5, pp. 12-13). Es $q = q_1x + q_0$, que
      contiene la uniforme ($q_1 = 0$) y la nula ($q_0 = q_1 = 0$).
      Integrando la ec. 7.14:

      $$
      T = -\tfrac12q_1x^{2} - q_0x + T_0 \quad (7.16)
      $$

      e integrando la 7.15 con esa $T$:

      $$
      M = -\tfrac16q_1x^{3} - \tfrac12q_0x^{2} + T_0x + M_0 \quad (7.17)
      $$

      $T_0$ y $M_0$ son constantes de integración: la cortante y el flector
      en $x = 0$, que salen de las condiciones del tramo (un apoyo, un
      extremo libre, lo que deja el tramo anterior).

      **Qué forma tienen** (las dos tablas de la p. 13):

      | $q$ | $T$ | $M$ |
      |---|---|---|
      | $0$ | uniforme, $T_0$ | lineal |
      | $q_0$ | lineal | parábola |
      | $q_1x + q_0$ | parábola | función cúbica |

      Y además: donde $T = 0$, $M$ tiene tangente horizontal (ec. 7.15); una
      fuerza concentrada da un salto en $T$ del valor de la fuerza, y un
      momento concentrado, un salto en $M$ del valor del momento.

      **Un ejemplo nuestro.** Con $q = 2 + 1{,}5\,x$ kN/m, $T_0$ = 18 kN y
      $M_0$ = −6 kN·m:

      $$
      T = -0{,}75\,x^{2} - 2x + 18
      \qquad
      M = -0{,}25\,x^{3} - x^{2} + 18x - 6
      $$

      La cortante se anula en $x$ = 3,744 m, y allí el flector es máximo
      (la cortante pasa de positiva a negativa): 34,25 kN·m.

      **Comprobaciones.** El tramo se ha resuelto con el motor del curso
      como un voladizo de 6 m empotrado en su extremo derecho, con 18 kN
      hacia arriba y un par de 6 kN·m que tracciona la fibra de arriba en el
      extremo libre, y la carga de 2 a 11 kN/m: da $T$ = 18 kN y
      $M$ = −6 kN·m justo a la derecha de $x = 0$, el cero de la cortante en
      3,7438 m y el flector máximo, 34,254 kN·m, en esa misma sección. El
      segundo camino son las ecs. 7.16 y 7.17 evaluadas a mano, y el tercero
      una integración numérica de las ecs. 7.14 y 7.15 desde $x = 0$: el
      mismo máximo.

  # ── Cuestión 6 de autoevaluación del tema 7 · de las tensiones a los esfuerzos.
  - id: ejerm7-cu6-de-las-tensiones-a-los-esfuerzos
    titulo: Las tensiones de una sección y sus fuerzas y momentos internos
    fuente: >-
      Cuestión 6 de autoevaluación · Tema 7, «Piezas prismáticas. Fuerzas y
      momentos de sección» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae respuesta: la resolución es nuestra y
      sigue los apuntes del tema 7, apartados 7.1 y 7.2 (p. 4 y pp. 6 a 8:
      ecs. 7.6 y 7.7, figuras 7.2 y 7.3). Se parece a la mitad a/ de la
      pregunta 3 de teoría del primer parcial de 2016-2017, que da una
      distribución σx = A·y³ y pide la constante A a partir del flector;
      esta pide la relación misma, las seis. El ejemplo numérico es nuestro,
      comprobado con el motor del curso y por integración numérica.
    nivel: practica
    antes:
      idea: |
        Las tensiones están punto a punto; las fuerzas y momentos de la sección
        son seis números para toda ella. Hay que ver cómo se pasa de lo uno a
        lo otro.
      formula: |
        $$
        \vec M_G = M_t\,\vec i + M_y\,\vec j - M_z\,\vec k
        $$

        El momento de la cara, con el signo menos del flector $M_z$ (ec. 7.6).
      reconocer: |
        Antes de escribir, piensa en un elemento $dA$ de la sección: qué fuerza
        le hace la tensión y dónde está respecto de $G$.
    enunciado: |
      6. Relación entre tensiones y fuerzas y momentos internos.
    pide: >-
      Las seis fuerzas y momentos de sección escritos con las tensiones de la
      sección, con sus signos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Sobre un elemento $dA$ de la sección, en el punto $(y, z)$, actúan
          las fuerzas $\sigma_x\,dA$, $\tau_{xy}\,dA$ y $\tau_{zx}\,dA$. ¿Qué son
          las seis fuerzas y momentos de sección respecto de ellas?
        opciones:
          - texto: >-
              Las componentes de su resultante y de su momento resultante
              respecto del centro de gravedad $G$, sumadas sobre toda la
              sección
            correcta: true
            mensaje: |
              Eso es (apuntes, pp. 4 y 7): las tensiones son fuerzas internas
              por unidad de superficie, y las fuerzas y momentos de sección son
              la reducción a $G$ de todas ellas. Cada esfuerzo es una integral
              sobre el área: tres de fuerzas y tres de momentos.
          - texto: >-
              Las tensiones que actúan en $G$, multiplicadas por el área de la
              sección
            mensaje: |
              Eso solo da el axil, y solo si $\sigma_x$ es uniforme o lineal.
              Un flector no se ve en $G$: en flexión pura la tensión en $G$ es
              cero y el momento no. Hay que sumar sobre toda la sección, con el
              brazo de cada $dA$.
          - texto: >-
              Solo las resultantes de $\sigma_x$: $\tau_{xy}$ y $\tau_{zx}$ no
              dan esfuerzos, porque están en el plano de la sección
            mensaje: |
              Las tangenciales dan las dos cortantes, $T_y$ y $T_z$, y el
              torsor $M_t$: son las fuerzas en el plano de la sección y su giro
              alrededor de $x$. $\sigma_x$ da las otras tres, $N$, $M_y$ y
              $M_z$.
          - texto: >-
              Las tres fuerzas, $N$, $T_y$ y $T_z$, son sus resultantes; los
              tres momentos salen de las cargas, no de las tensiones
            mensaje: |
              Los momentos también son de las tensiones: son el momento
              respecto de $G$ de las fuerzas $\sigma_x\,dA$, $\tau_{xy}\,dA$ y
              $\tau_{zx}\,dA$, sumado sobre la sección (ec. 7.7). Que también
              se puedan sacar de las cargas, por equilibrio, es otro camino al
              mismo número.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en un examen: de qué fuerzas se parte, las
          seis relaciones con su origen y el signo del flector Mz.
        rubrica:
          - punto: >-
              Sobre un elemento dA de coordenadas (y, z) actúan σx dA,
              perpendicular a la sección y hacia fuera, y τxy dA y τzx dA en su
              plano (figura 7.3).
            porque: >-
              Las tensiones son fuerzas internas por unidad de superficie: son
              las fuerzas que, reducidas a G, dan los esfuerzos.
            minimo: true
          - punto: >-
              La resultante: N = ∫σx dA, Ty = ∫τxy dA y Tz = ∫τzx dA (ec. 7.7),
              las componentes de R según x, y, z (ec. 7.6).
            porque: >-
              Son las tres fuerzas de sección: cada una suma una componente de
              la fuerza que actúa sobre cada dA.
            minimo: true
          - punto: >-
              El momento respecto de G, con el brazo (0, y, z) de cada dA:
              Mt = ∫(τzx·y − τxy·z) dA, My = ∫σx·z dA y Mz = ∫σx·y dA
              (ec. 7.7).
            porque: >-
              Son las tres componentes del producto vectorial del brazo por la
              fuerza, sumadas: de ahí la resta del torsor.
            minimo: true
          - punto: >-
              Mz es positivo en el sentido opuesto al eje z (MG lleva −Mz k en
              la ec. 7.6), porque σx da momento en ese sentido: por eso
              Mz = ∫σx·y dA va sin signo menos, y con y hacia abajo una
              tracción en la fibra de abajo da Mz > 0.
            porque: >-
              Es el signo que cambia al copiar la fórmula de un libro con y
              hacia arriba, donde se escribe M = −∫σ·y dA.
            minimo: true
          - punto: >-
              Como y y z se miden desde G, ∫y dA = ∫z dA = 0: una σx uniforme
              da solo axil, N = σx·A, sin momentos.
            porque: >-
              Es lo que separa el axil de los flectores, y lo que se usa al
              revés en los temas de axil y de flexión.
      - tipo: calcular
        titulo: El axil de una tensión lineal
        pregunta: |
          Un ejemplo nuestro: una sección rectangular de 100 mm de ancho
          (según $z$) y 200 mm de canto (según $y$). La tensión normal no
          depende de $z$ y varía linealmente con $y$, de −5 MPa en la fibra de
          arriba a 25 MPa en la de abajo; las tangenciales son nulas. ¿Cuánto
          vale el axil $N$, en kN?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '500'
            mensaje: |
              Has multiplicado la tensión de la fibra de abajo, 25 MPa, por el
              área. $N = \int\sigma_x\,dA$ suma la tensión de cada franja, y con
              una distribución lineal eso es la tensión en $G$, 10 MPa, por el
              área.
          - valor: '-100'
            mensaje: |
              Has multiplicado la tensión de la fibra de arriba, −5 MPa, por el
              área. $N$ suma todas las franjas: con una distribución lineal, es
              la tensión en $G$, 10 MPa, por el área.
          - valor: '2'
            mensaje: |
              Has integrado $\sigma_x\,dy$ sin el ancho: la franja de canto
              $dy$ tiene área $dA = b\,dy$, con $b$ = 100 mm.
        pista: |
          Con $y$ medida desde $G$ hacia abajo, $\sigma_x = 10 + 0{,}15\,y$
          (MPa, con $y$ en mm), y $dA = b\,dy$. El término en $y$ se anula al
          integrar de −100 a 100.
        desarrollo: |
          Con $\sigma_x = 10 + 0{,}15\,y$ y $dA = 100\,dy$, el término en $y$
          se anula porque $y$ se mide desde $G$:

          $$
          N = \int_{-100}^{100}(10 + 0{,}15\,y)\cdot100\,dy = 10\cdot100\cdot200 = 200\,000
          $$

          en N, es decir, 200 kN.
      - tipo: calcular
        titulo: El flector de la misma tensión
        pregunta: |
          Con la misma distribución, ¿cuánto vale el flector $M_z$, con su
          signo, en kN·m?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.02
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-10'
            mensaje: |
              Tiene el valor bueno y el signo cambiado. Puede venir de escribir
              $M_z = -\int\sigma_x\,y\,dA$, la fórmula de los libros con $y$
              hacia arriba, o de medir $y$ desde la fibra de abajo y no desde
              $G$, que resta $N$ por 100 mm, 20 kN·m. Con $y$ hacia abajo y
              desde $G$, $M_z = \int\sigma_x\,y\,dA$, y la tracción está abajo:
              es positivo.
          - valor: '30'
            mensaje: |
              Has medido $y$ desde la fibra de arriba, no desde $G$: has
              calculado el momento respecto del borde, que suma $N$ por
              100 mm, 20 kN·m. Los momentos de sección se toman respecto de
              $G$.
          - valor: '2.5'
            mensaje: |
              Has cambiado el ancho y el canto en la inercia: $b^{3}h/12$ es
              la de la sección respecto del eje $y$. $M_z$ lleva
              $\int y^{2}\,dA = bh^{3}/12$, con el canto al cubo.
          - valor: '0.1'
            mensaje: |
              Has integrado $\sigma_x\,y\,dy$ sin el ancho: $dA = b\,dy$, con
              $b$ = 100 mm.
        pista: |
          $M_z = \int_A\sigma_x\,y\,dA$, con $y$ desde $G$. El término
          constante, 10 MPa, da $10\int y\,dA = 0$; queda
          $0{,}15\int y^{2}\,dA$.
        desarrollo: |
          El término constante no da momento, porque $\int y\,dA = 0$, y queda
          $0{,}15\,I_z$:

          $$
          M_z = 0{,}15\cdot\frac{100\cdot200^{3}}{12} = 10\,000\,000
          $$

          en N·mm, es decir, 10 kN·m, positivo: tracciona la fibra de abajo.
      - tipo: justificar
        pregunta: Ordena la deducción de los tres momentos. Una pieza es falsa.
        piezas:
          - texto: >-
              Sobre $dA$, en el punto $(y, z)$ de la sección, actúa la fuerza
              $(\sigma_x\,\vec i + \tau_{xy}\,\vec j + \tau_{zx}\,\vec k)\,dA$.
          - texto: >-
              Su momento respecto de $G$, con el brazo $y\,\vec j + z\,\vec k$,
              es $\left[(\tau_{zx}\,y - \tau_{xy}\,z)\,\vec i + \sigma_x z\,\vec j - \sigma_x y\,\vec k\right]dA$.
          - texto: >-
              Se suma sobre la sección y se iguala a
              $\vec M_G = M_t\,\vec i + M_y\,\vec j - M_z\,\vec k$ (ec. 7.6).
          - texto: >-
              Componente a componente:
              $M_t = \int(\tau_{zx}\,y - \tau_{xy}\,z)\,dA$,
              $M_y = \int\sigma_x z\,dA$ y $M_z = \int\sigma_x y\,dA$ (ec. 7.7).
          - texto: >-
              Como la componente según $\vec k$ es $-\int\sigma_x y\,dA$, el
              flector es $M_z = -\int\sigma_x y\,dA$.
            trampa: true
            mensaje: |
              El menos ya está en la definición: $\vec M_G$ lleva
              $-M_z\,\vec k$ (ec. 7.6), así que $-M_z = -\int\sigma_x y\,dA$ y
              $M_z = \int\sigma_x y\,dA$, sin signo. El menos es el de los
              libros que toman $y$ hacia arriba; con $y$ hacia abajo, una
              tracción abajo da $M_z > 0$ (apuntes, p. 8).
    resolucion: |
      **De dónde sale** (apuntes del tema 7, pp. 4, 7 y 8). Las tensiones son
      fuerzas internas por unidad de superficie, así que las fuerzas y
      momentos de sección son las componentes de la resultante y del momento
      resultante, respecto del centro de gravedad $G$, del campo de
      tensiones de la sección. Sobre un elemento $dA$ de coordenadas
      $(y, z)$ actúan (figura 7.3) $\sigma_x\,dA$, perpendicular a la sección
      y hacia fuera, y $\tau_{xy}\,dA$ y $\tau_{zx}\,dA$ en su plano.

