      <figcaption>

      Redibujada del enunciado: A es un apoyo móvil y C uno fijo, y la carga
      crece en línea recta desde cero en B hasta q₀ en C.

      </figcaption>
      </figure>

      **Notas nuestras.** Las fuerzas se dan en unidades de $q_0L$ y los
      momentos en unidades de $q_0L^{2}$, y la abscisa $x$ se mide desde A.
      Convenio del curso: $T > 0$ si la resultante de las fuerzas de la
      izquierda de la sección va hacia arriba, y $M > 0$ si tracciona la
      fibra de abajo.
    pide: >-
      La reacción de A, la sección en que se anula la cortante, el flector
      máximo y los diagramas de cortantes y de flectores.
    pasos:
      - tipo: reconocer
        pregunta: |
          En BC la carga no es uniforme: crece en línea recta desde cero.
          ¿Qué forma tiene ahí el diagrama de cortantes?
        opciones:
          - texto: Una parábola, que arranca en B con tangente horizontal
            correcta: true
            mensaje: |
              Eso es. La cortante es la integral de $-q$ (ec. 7.14), y la
              integral de una recta es una parábola. Su pendiente en cada
              sección es $-q$, que en B vale cero: la parábola sale plana y se
              va empinando hacia C. El flector, que integra otra vez
              (ec. 7.15), es una cúbica.
          - texto: Una recta que va de su valor en B a su valor en C
            mensaje: |
              Eso pasa con carga uniforme, que da una pendiente constante.
              Aquí la pendiente de $T$ es $-q(x)$, que empieza en cero en B y
              llega a $-q_0$ en C: la curva sale plana y se va empinando. Si se
              unen con una recta los valores de B y de C, el cero de la
              cortante, y con él el flector máximo, sale en otro sitio.
          - texto: Constante, con un salto bajo la resultante de la carga
            mensaje: |
              La resultante, $q_0L/4$ en $x = 5L/6$, sirve para las
              reacciones, que miran el equilibrio de toda la viga. En una
              sección de BC solo cuenta la carga que queda a un lado, y esa
              cambia con $x$: una carga repartida no hace saltar la cortante.
          - texto: Una cúbica, porque la carga es triangular
            mensaje: |
              La cúbica es el flector. La cortante está un escalón por debajo:
              es la integral de $-q$ una sola vez (ec. 7.14), y de una carga
              lineal sale una parábola.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga sin sus apoyos**, con la
          carga y las reacciones.
        comprueba:
          - punto: |
              **En A, solo la reacción vertical.**
            porque: |
              Es un apoyo móvil: no impide moverse en horizontal.
          - punto: |
              **En C, la vertical y la horizontal.**
            porque: |
              Es un apoyo fijo. Como no hay cargas horizontales, la horizontal
              saldrá nula.
          - punto: |
              **La carga triangular, de cero en B a $q_0$ en C.**
            porque: |
              Para las reacciones vale su resultante, $q_0L/4$, en su centro de
              gravedad, a un tercio de BC contado desde C.
        figura: |
