      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La resultante de la carga es $\tfrac92 q_0a$, en $x = \tfrac83 a$, y es la cortante en todo AB.
          - texto: Por la derecha de A, $M_A = -\tfrac92 q_0a \cdot \tfrac83 a + q_0a^{2} = -11\,q_0a^{2}$.
          - texto: Por la derecha de C, la carga de CE da $-\tfrac{32}{9}q_0a^{2}$; justo a la izquierda de C se suma el par, y queda $-\tfrac{23}{9}q_0a^{2}$.
          - texto: En E, el extremo libre, la cortante y el flector son cero, y el flector llega con tangente horizontal.
          - texto: En C salta también la cortante, porque el par es una carga concentrada.
            trampa: true
            mensaje: |
              Concentrado sí, pero un par no es una fuerza: no tiene
              resultante, y la cortante solo salta con fuerzas concentradas.
              En C salta el flector, $q_0a^{2}$, y la cortante sigue igual.
    resolucion: |
      **1. El sólido libre.** El voladizo sin el empotramiento. Por la
      derecha de cualquier sección solo hay carga conocida.

