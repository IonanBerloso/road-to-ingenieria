      <figcaption>

      La viga sin apoyos: las dos fuerzas, el par y la carga del voladizo, datos; Ax, Ay y RD, incógnitas.

      </figcaption>
      </figure>

      - **Tres incógnitas**: $A_x$, nula, $A_y$ y $R_D$.
      - **El par** entra en los momentos con su valor, 20 kN·m, y su sentido,
        sin brazo.
      - **La carga del voladizo**, 15 kN en su centro, a 3,5 m de A.

      **2. Incógnitas.** $R_D$ y $R_A$; las leyes de $T$ y de $M$; el flector
      justo a la derecha del par y en D.

      **3. Ecuaciones.** Momentos respecto de A, con el horario positivo, y
      equilibrio vertical; y de A en adelante, $T$ y $M$ por la izquierda,
      con $dT/dx = -q$ y $dM/dx = T$ entre cargas.

      **4. Resultados.** **Reacciones.** Momentos respecto de A, con el par
      horario de 20 kN·m sin brazo:

      $$
      R_D \cdot 3\ \text{m} = 8\ \text{kN}\cdot 1\ \text{m} + 8\ \text{kN}\cdot 2\ \text{m} + 15\ \text{kN}\cdot 3{,}5\ \text{m} + 20\ \text{kN}\cdot\text{m}
      \quad\Longrightarrow\quad
      R_D = 32{,}17\ \text{kN}
      $$

      Y por la vertical, $R_A = 31\ \text{kN} - 32{,}17\ \text{kN} = -1{,}17\ \text{kN}$:
      A tira hacia abajo.

      **Cortante**, en kN. Constante entre cargas: $-1{,}17$ de A a B,
      $-9{,}17$ de B a C, $-17{,}17$ de C a D. En D sube 32,17, hasta 15, y
      baja en recta, con pendiente $-15$ kN/m, hasta cero en el extremo.

      **Flector**, en kN·m, por la izquierda: $-1{,}17$ en B y $-3{,}46$
      justo antes del par. El par horario lo sube 20, hasta 16,54. Después
      baja con pendiente $-9{,}17$ hasta 9,67 en C, y con pendiente
      $-17{,}17$ corta el cero en $x = 2{,}56$ m y llega a $-7{,}5$ en D. De
      D al extremo, una parábola que acaba en cero con tangente horizontal.
      Los diagramas, con estos valores, son los del paso de dibujarlos.

      **5. Comprobación.** El flector en D por la derecha es el del voladizo,
      $-15 \cdot 1 \cdot 0{,}5 = -7{,}5$ kN·m, el mismo que llega por la
      izquierda. E integrando $dT/dx = -q$ y $dM/dx = T$ desde A, con los
      saltos de las fuerzas y del par, se llega al extremo libre con $T = 0$
      y $M = 0$.

      **Lo que dice el resultado.** El mayor flector positivo, 16,54 kN·m,
      está justo a la derecha del par, y el mayor negativo, $-7{,}5$ kN·m,
      en D. Ninguno de los dos está donde se anula la cortante: el primero es
      un salto y el segundo, un pico. Y A tira de la viga hacia abajo: el
      voladizo y el par la levantarían de ese lado.

  # ── Cuestión 1 de autoevaluación del tema 7 · la definición de pieza prismática.
  - id: ejerm7-cu1-la-pieza-prismatica
    titulo: Qué es una pieza prismática
    fuente: >-
      Cuestión 1 de autoevaluación · Tema 7, «Piezas prismáticas. Fuerzas y
      momentos de sección» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae respuesta: la resolución es nuestra y
      sigue los apuntes del tema 7, apartado 7.1 (pp. 3 y 4), que dan la
      definición, y el apartado 7.2 (p. 6) para el triedro de la sección.
      Ninguno de los diez parciales 1 publicados, de 2012-2013 a 2022-2023,
      la pide. El ejemplo de la sección en T es nuestro: su centro de
      gravedad sale igual con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Una pieza prismática se define por cómo se engendra: una figura plana
        que se mueve a lo largo de una curva. La definición pone condiciones a
        ese movimiento y a las proporciones de la pieza.
      formula: |
        $$
        y_G = \frac{\sum A_i\,y_i}{\sum A_i}
        $$

        El centro de gravedad de una sección compuesta, con el área y el centro
        de cada parte.
      reconocer: |
        Antes de escribir, piensa en una pieza curva, como un arco: cómo tiene
        que ir la sección a lo largo de ella.
    enunciado: |
      1. Definición de pieza prismática.
    pide: >-
      La definición de pieza prismática, con el nombre de sus partes y las
      piezas reales que abarca.
    pasos:
      - tipo: reconocer
        pregunta: |
          Una pieza prismática es el volumen que barre una figura plana al
          moverse a lo largo de una curva. ¿Qué dos condiciones pone la
          definición a ese movimiento?
        opciones:
          - texto: >-
              Que el centro de gravedad de la figura recorra la curva, y que la
              figura sea perpendicular a la curva en cada punto
            correcta: true
            mensaje: |
              Eso es (apuntes, p. 3). Por eso en cada sección se puede poner un
              eje $x$ tangente a la curva que pasa por su centro de gravedad,
              que es donde se reducen las fuerzas internas para dar $N$, $T$ y
              $M$.
          - texto: >-
              Que un punto cualquiera de la figura recorra la curva, y que la
              figura se mantenga paralela a sí misma
            mensaje: |
              Eso es una extrusión, y en una pieza curva dejaría la sección
              inclinada respecto del eje. La definición pide el centro de
              gravedad, no un punto cualquiera, y la figura perpendicular a la
              curva en cada punto, no paralela a sí misma.
          - texto: >-
              Que la curva sea recta y horizontal, y la figura perpendicular a
              ella
            mensaje: |
              Eso describe una viga, que es un caso particular. Si la curva es
              vertical, la pieza es una columna, y puede ser curva: el
              apartado 7.6 estudia las piezas de directriz curva. Y falta lo
              principal: que el punto que recorre la curva sea el centro de
              gravedad.
          - texto: >-
              Que la figura sea perpendicular a la curva, sin importar qué punto
              de ella la recorra
            mensaje: |
              Falta la mitad: el punto que recorre la curva es el centro de
              gravedad. Si fuera otro, el eje de la pieza no pasaría por los
              centros de gravedad de las secciones, que es donde se reducen
              las fuerzas internas.
      - tipo: redactar
        que: definicion
        consigna: >-
          Escribe la definición como la pondrías en un examen: cómo se
          engendra la pieza, cómo se llaman la figura y la curva, qué
          proporción tiene y qué piezas reales lo son.
        rubrica:
          - punto: >-
              Es el volumen que engendra una superficie plana cuando su centro
              de gravedad describe una curva, siendo la superficie y la curva
              perpendiculares.
            porque: >-
              Es la definición de los apuntes (p. 3): las dos condiciones hacen
              que el eje de la pieza pase por el centro de gravedad de cada
              sección y sea perpendicular a ella.
            minimo: true
          - punto: >-
              La superficie es la sección recta (o sección de la pieza) y la
              curva, el eje de la pieza.
            porque: >-
              Son los dos nombres con los que se trabaja el resto del curso:
              los esfuerzos se dan en cada sección y se dibujan a lo largo del
              eje.
            minimo: true
          - punto: >-
              La longitud es sensiblemente mayor que las dimensiones de la
              sección.
            porque: >-
              Es lo que permite estudiar la pieza sección a sección, con seis
              esfuerzos, en lugar de resolver el problema elástico del tema 5
              en todo el sólido.
            minimo: true
          - punto: >-
              Ejemplos: la viga (orientación preferente horizontal), la
              columna (vertical), los ejes de transmisión de potencia de las
              máquinas y las barras de las estructuras articuladas.
            porque: >-
              Son los que da el apartado 7.1 (pp. 3-4), y dicen que ni la
              orientación ni el uso cambian lo que es la pieza.
          - punto: >-
              Las fuerzas internas de una sección se reducen a su centro de
              gravedad, y las componentes de la resultante y del momento
              resultante son las fuerzas y momentos de sección.
            porque: >-
              Es para lo que sirve la definición: el apartado 7.1 lo dice justo
              después (p. 4), y es lo que estudia todo el tema.
      - tipo: calcular
        titulo: El eje de una viga de sección en T
        pregunta: |
          Un ejemplo nuestro: una viga recta de sección en T, con el ala de
          120 × 20 mm arriba y el alma de 20 × 100 mm debajo, centrada (el
          canto total es de 120 mm). ¿A qué distancia del borde superior de
          la sección pasa el eje de la pieza, en mm?
        respuesta:
          tipo: numero
          valor: '37.27'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '60'
            mensaje: |
              Es la mitad del canto: el eje pasaría por el centro del
              rectángulo que envuelve la sección. Pasa por su centro de
              gravedad, y en una T el ala, que tiene más área, lo sube.
          - valor: '40'
            mensaje: |
              Has hecho la media de los centros de las dos piezas,
              $(10 + 70)/2$, sin pesarlos con sus áreas. El ala tiene 2400 mm²
              y el alma 2000 mm²: el centro de gravedad queda más cerca del
              ala.
          - valor: '82.73'
            mensaje: |
              Es la distancia al borde inferior, el del alma. La pregunta la
              pide desde el borde superior: $120 - 82{,}73 = 37{,}27$.
          - valor: '35'
            mensaje: |
              Has contado el alma de arriba abajo, con 120 mm, solapada con el
              ala: la franja de 20 × 20 mm del cruce está dos veces. El alma
              empieza donde acaba el ala y mide 100 mm.
        pista: |
          El eje pasa por el centro de gravedad de cada sección:
          $\overline{y} = \sum A_i\,y_i / \sum A_i$, con $y_i$ el centro de cada
          rectángulo medido desde el borde superior.
        desarrollo: |
          El ala tiene $120\cdot20 = 2400$ mm² con su centro a 10 mm del borde
          superior; el alma, $20\cdot100 = 2000$ mm² con su centro a
          $20 + 50 = 70$ mm.

          $$
          \overline{y} = \frac{2400\cdot10 + 2000\cdot70}{2400 + 2000} = \frac{164\,000}{4400} = 37{,}27
          $$

          en mm por debajo del borde superior.
      - tipo: justificar
        pregunta: Ordena la definición, de la figura plana a la pieza. Una pieza es falsa.
        piezas:
          - texto: Se toma una superficie plana, que será la sección recta de la pieza.
          - texto: Su centro de gravedad describe una curva, que será el eje de la pieza.
          - texto: En cada punto de la curva, la superficie es perpendicular a ella.
          - texto: >-
              La longitud de la pieza es sensiblemente mayor que las dimensiones
              de la sección; si su orientación es horizontal se llama viga, y si
              es vertical, columna.
          - texto: >-
              Mientras recorre la curva, la superficie se mantiene paralela a
              sí misma.
            trampa: true
            mensaje: |
              Eso solo vale si el eje es recto. En una pieza curva la sección
              gira con la curva para seguir perpendicular a ella: por eso el
              eje $x$ de cada sección es siempre tangente al eje de la pieza
              (apuntes, p. 6).
    resolucion: |
      **La definición** (apuntes del tema 7, apartado 7.1, p. 3). Una pieza
      prismática es el volumen engendrado por una superficie plana cuando su
      centro de gravedad describe una curva, siendo perpendiculares la
      superficie y la curva. La superficie es la **sección recta** (o
      sección de la pieza) y la curva, el **eje de la pieza**. La longitud
      es sensiblemente mayor que las dimensiones de la sección.

      **Qué piezas lo son** (pp. 3-4). Si la orientación preferente es
      horizontal, la pieza es una **viga**; si es vertical, una **columna**.
      Los ejes de transmisión de potencia de las máquinas y las barras de
      las estructuras articuladas también son piezas prismáticas. El eje
      puede ser curvo: el apartado 7.6 estudia las piezas de directriz
      curva.

      **Por qué importa.** Como la sección es perpendicular al eje y su
      centro de gravedad está sobre él, en cada sección se pone un triedro
      $Gxyz$ con $x$ tangente al eje e $y$, $z$ en el plano de la sección
      (p. 6). Las fuerzas internas de la sección se reducen a $G$, y las
      componentes de su resultante y de su momento resultante son las
      fuerzas y momentos de sección (p. 4): seis números por sección en vez
      de un tensor en cada punto. Como la pieza es larga frente a su
      sección, eso basta para estudiarla.

      **Un ejemplo nuestro.** En una viga de sección en T, con el ala de
      120 × 20 mm arriba y el alma de 20 × 100 mm debajo, el eje pasa por el
      centro de gravedad de la sección:

      $$
      \overline{y} = \frac{2400\cdot10 + 2000\cdot70}{4400} = 37{,}27
      $$

      en mm por debajo del borde superior, no a media altura (60 mm): el
      ala, con más área, lo sube.

      **Comprobaciones.** El centro de gravedad sale igual con el motor del
      curso, con la sección hecha de dos rectángulos, y a mano, con los
      momentos estáticos respecto del borde superior: 37,2727 mm las dos
      veces.

  # ── Cuestión 2 de autoevaluación del tema 7 · el convenio de signos, dibujado.
  - id: ejerm7-cu2-el-convenio-de-signos
    titulo: El convenio de signos de las fuerzas y momentos de sección
    fuente: >-
      Cuestión 2 de autoevaluación · Tema 7, «Piezas prismáticas. Fuerzas y
      momentos de sección» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae respuesta: la resolución es nuestra y
      sigue los apuntes del tema 7, la ec. 7.6 (p. 6) y el apartado 7.3 (pp.
      8-9, figuras 7.4 y 7.5), y la frase del convenio de las diapositivas
      del tema. Ninguno de los diez parciales 1 publicados la pide como tal.
      La figura del dibujo está hecha sobre la 7.5, con la cortante de la
      vista xz rotulada Tz (los apuntes repiten «Ty» en las dos vistas) y
      con N y Mt añadidos. El ejemplo del voladizo es nuestro, comprobado
      con el motor del curso y a mano por las dos partes.
    nivel: practica
    antes:
      idea: |
        Al cortar una pieza, las dos caras reciben fuerzas y momentos iguales y
        contrarios. Un convenio útil tiene que darles el mismo signo a las dos.
      formula: |
        $$
        \vec R = N\,\vec i + T_y\,\vec j + T_z\,\vec k
        \qquad
        \vec M_G = M_t\,\vec i + M_y\,\vec j - M_z\,\vec k
        $$

        La resultante y el momento de las fuerzas internas de la cara de la
        parte izquierda (ec. 7.6).
      reconocer: |
        Antes de dibujar, piensa en las dos caras del corte a la vez: lo que se
        dibuja en una se dibuja al revés en la otra.
    enunciado: |
      2. Dibujar el convenio de signos para las fuerzas y momentos internos.
    pide: >-
      El dibujo de las fuerzas y momentos de sección positivos en las dos
      caras de un corte, y la regla que los fija.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al cortar la pieza, la cara derecha de la parte izquierda y la cara
          izquierda de la parte derecha reciben la misma cortante $T_y$, pero
          dibujada en sentidos contrarios. ¿Qué regla le da el mismo signo en
          las dos?
        opciones:
          - texto: >-
              Se mira la cara: en la de normal $+x$ es positiva según $+y$, y
              en la de normal $-x$, según $-y$. Es el mismo criterio que el de
              las tensiones
            correcta: true
            mensaje: |
              Eso es. En la sección derecha (la cara de la parte I) el sistema
              de referencia es directo y en la izquierda, inverso (apuntes,
              p. 8): así la acción y la reacción, que son opuestas, tienen el
              mismo signo, y la cortante de una sección no depende de qué parte
              se mire. Las diapositivas lo dicen con una frase: las tensiones
              positivas en el cuadrante positivo generan fuerzas y momentos
              positivos.
          - texto: >-
              Es positiva si va hacia $+y$, hacia abajo, en cualquier cara
            mensaje: |
              Así la acción y la reacción, que son opuestas, tendrían signos
              contrarios, y la cortante de una sección cambiaría de signo según
              la parte que se tome. El convenio tiene que dar el mismo número a
              las dos caras de un corte.
          - texto: >-
              Es positiva si va hacia arriba en la cara derecha, como una
              reacción
            mensaje: |
              Es el sentido contrario al del curso, el de los libros que toman
              $y$ hacia arriba. Con $y$ hacia abajo, en la cara derecha de la
              parte izquierda $T$ es positiva hacia abajo (fig. 7.5).
          - texto: >-
              Es positiva si tracciona la fibra inferior
            mensaje: |
              Esa es la regla del flector $M_z$, no la de la cortante: $T$ no
              tracciona ninguna fibra, hace deslizar una sección sobre la
              vecina.
      - tipo: dibujar
        consigna: |
          En papel: un trozo de pieza con sus dos caras, visto en el plano
          $xy$ (con $x$ a la derecha e $y$ hacia abajo) y en el plano $xz$,
          con las seis fuerzas y momentos de sección positivos en cada cara:
          $N$, $T_y$, $T_z$, $M_t$, $M_y$ y $M_z$.
        comprueba:
          - punto: |
              **$N$** sale de la pieza en las dos caras: hacia $+x$ en la
              derecha y hacia $-x$ en la izquierda.
            porque: |
              Es positivo a tracción. Es la componente según $\vec i$ de la
              resultante (ec. 7.6), con el triedro directo en la cara derecha
              e inverso en la izquierda.
          - punto: |
              **$T_y$** va hacia abajo ($+y$) en la cara derecha y hacia
              arriba en la izquierda; **$T_z$**, hacia $+z$ en la derecha y
              hacia $-z$ en la izquierda.
            porque: |
              Son las componentes según $\vec j$ y $\vec k$ de la resultante,
              con el mismo criterio de caras que $N$ (figs. 7.4 y 7.5).
          - punto: |
              **$M_z$** es antihorario en la cara derecha y horario en la
              izquierda, visto con $x$ a la derecha e $y$ hacia abajo: los dos
              traccionan la fibra de abajo.
            porque: |
              En la ec. 7.6 el momento lleva $-M_z\,\vec k$, y con $y$ hacia
              abajo el eje $z$ entra en el papel: $-\vec k$ sale hacia quien
              mira, que es el giro antihorario en la cara derecha.
          - punto: |
              **$M_t$** y **$M_y$**, por la regla de la mano derecha: $M_t$ es
              una flecha doble que sale de la pieza en las dos caras, y $M_y$
              gira alrededor de $+y$ en la cara derecha (horario en la vista
              $xz$ desde arriba, con $z$ hacia arriba en el dibujo) y al revés
              en la izquierda.
            porque: |
              Son las componentes según $\vec i$ y $\vec j$ del momento, sin
              signo menos (ec. 7.6). La figura 7.5 dibuja $M_y$ así en su
              vista $xz$.
        figura: |
          <svg viewBox="0 0 680 186" role="img" width="680" height="186" aria-labelledby="ejerm7-cu2-el-convenio-de-signos-dib-t ejerm7-cu2-el-convenio-de-signos-dib-d">
