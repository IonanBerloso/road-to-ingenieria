      <figcaption>

      Redibujada del enunciado: A es un apoyo fijo y D uno móvil; el par de
      20 kN·m, horario, está a 0,25 m a la derecha de B, y los 15 kN/m ocupan
      el voladizo, de D al extremo.

      </figcaption>
      </figure>

      **Notas nuestras.** La abscisa $x$ se mide desde A; las fuerzas van en
      kN y los momentos en kN·m. Convenio del curso: $T > 0$ si la resultante
      de las fuerzas de la izquierda de la sección va hacia arriba, y
      $M > 0$ si tracciona la fibra de abajo.
    pide: >-
      Las dos reacciones, el flector justo a la derecha del par y en D, y los
      diagramas de cortantes y de flectores.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para sacar $R_D$ se toman momentos respecto de A. ¿Cómo entra en esa
          ecuación el par de 20 kN·m?
        opciones:
          - texto: Con su valor, 20 kN·m, y su sentido, sin brazo
            correcta: true
            mensaje: |
              Eso es. Un par son dos fuerzas iguales y contrarias, y su
              momento no depende del punto respecto del que se toma: respecto
              de A, de D o de cualquier otro, vale 20 kN·m, horario.
          - texto: Multiplicado por su distancia a A, 1,25 m
            mensaje: |
              Eso se hace con una fuerza, cuyo momento depende de su brazo. Un
              par ya es un momento, y vale lo mismo respecto de cualquier
              punto.
          - texto: No entra, porque un par no tiene resultante
            mensaje: |
              No cambia la suma de fuerzas, pero sí la de momentos: sin él, la
              ecuación de momentos respecto de A no es la del equilibrio de
              esta viga.
          - texto: Solo entra si está entre los dos apoyos
            mensaje: |
              Entra esté donde esté: en el equilibrio de toda la viga cuentan
              todas las cargas. Su posición importa para los esfuerzos: el
              flector salta en la sección donde está.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga sin sus apoyos**, con las
          cargas y las reacciones.
        comprueba:
          - punto: |
              **En A, dos componentes; en D, solo la vertical.**
            porque: |
              A es un apoyo fijo y D uno móvil.
          - punto: |
              **El par de 20 kN·m, horario, entre B y C.**
            porque: |
              Entra en los momentos con su valor y su sentido, esté donde esté.
          - punto: |
              **La carga del voladizo, 15 kN/m en 1 m.**
            porque: |
              Para las reacciones vale 15 kN en el centro del voladizo, a 3,5 m
              de A.
        figura: |
          <svg viewBox="0 28 350 130" role="img" width="350" height="130" aria-labelledby="dsl-t dsl-d">
