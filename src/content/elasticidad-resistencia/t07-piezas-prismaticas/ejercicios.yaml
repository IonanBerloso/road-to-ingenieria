      a) La viga AC: la carga, HA, VA y, en C, la fuerza de la pieza curva, FBC, en la dirección de la cuerda. b) La pieza curva, articulada en sus dos extremos y sin carga: dos fuerzas iguales y contrarias, en la recta BC. Las dos, dibujadas a tracción.

      </figcaption>
      </figure>

      - **BC** está articulada en B y en C y no tiene carga encima: es una
        pieza de dos fuerzas, y la que transmite va por la cuerda BC, a 45°,
        con sus dos componentes iguales.
      - **AC** lleva la carga, $q_0a$ a $\tfrac32 a$ de A, las dos fuerzas de
        A y la de BC en C.

      **2. Incógnitas.** La fuerza de BC y las reacciones de A; el axil, la
      cortante y el flector de AC; y en la pieza curva, $N(\theta)$,
      $T(\theta)$ y $M(\theta)$, con el ángulo de sus máximos.

      **3. Ecuaciones.** Momentos de AC respecto de A y su equilibrio; en AC,
      los esfuerzos por la izquierda de cada sección; en la pieza curva, el
      equilibrio del trozo que va de C a la sección de ángulo $\theta$.

      **4. Resultados.** **La fuerza de C.** Momentos de AC respecto de A,
      con la carga $q_0a$ a $\tfrac32 a$:

      $$
      F_y\cdot 2a = q_0a\cdot\frac32\,a
      \quad\Longrightarrow\quad
      F_x = F_y = \frac34\,q_0a,
      \qquad
      F = \frac{3\sqrt{2}}{4}\,q_0a = 1{,}061\,q_0a
      $$

      BC empuja a AC hacia la izquierda y hacia arriba: está comprimida. En
      A, $\tfrac34 q_0a$ hacia la derecha y $\tfrac14 q_0a$ hacia arriba.

      **a/ AC.** Axil constante, $N = -\tfrac34 q_0a$. Cortante
      $\tfrac14 q_0a$ hasta $x = a$ y después una recta de pendiente $-q_0$
      hasta $-\tfrac34 q_0a$ en C, con el cero en $x = \tfrac54 a$. Flector
      lineal hasta $\tfrac14 q_0a^{2}$ en $x = a$, y una parábola con su
      máximo en $x = \tfrac54 a$:

      $$
      M_{\max} = \frac14\,q_0a\cdot\frac54\,a - \frac{q_0}{2}\left(\frac{a}{4}\right)^{2} = \frac{9}{32}\,q_0a^{2}
      $$

      que vuelve a cero en C, la articulación. Los diagramas, con estos
      valores, son los del paso de dibujarlos.

      **b/ La pieza curva.** Con el origen en O, la sección de ángulo
      $\theta$ está en $(a\cos\theta,\ a\operatorname{sen}\theta)$, y C en
      $(0,\ a)$. Sobre la pieza curva, en C, actúa la fuerza que le hace AC:
      $\tfrac34 q_0a$ hacia la derecha y $\tfrac34 q_0a$ hacia abajo.
      Recorriendo la pieza de C a B, hacia donde decrece $\theta$, con $T$
      positiva hacia O en la cara que mira a B (la $V$ de la diapositiva 13)
      y $M > 0$ si tracciona la fibra interior:

      $$
      N(\theta) = -\frac34\,q_0a\,(\operatorname{sen}\theta + \cos\theta),
      \qquad
      T(\theta) = \frac34\,q_0a\,(\cos\theta - \operatorname{sen}\theta)
      $$

      $$
      M(\theta) = -\frac34\,q_0a^{2}\,(\operatorname{sen}\theta + \cos\theta - 1)
      $$

      $|M|$ y $|N|$ son máximos donde $\cos\theta - \operatorname{sen}\theta = 0$,
      en $\theta = 45^{\circ}$:
      $M = -\tfrac34(\sqrt{2} - 1)\,q_0a^{2} = -0{,}311\,q_0a^{2}$ y
      $N = -\tfrac{3\sqrt{2}}{4}q_0a$, toda la fuerza de BC, con $T = 0$.

      **5. Comprobación.** Las tres leyes cumplen las ecuaciones de la
      rebanada curva sin carga de las diapositivas 13 y 14, que miden
      $\theta$ como esta figura, de B hacia C: $dN/d\theta = -V$,
      $dV/d\theta = N$ y $dM/d\theta = -V\cdot R$, con $V = T$ y $R = a$. Las
      de la página del tema (apuntes, ecs. 7.18 a 7.21, fig. 7.7) miden el
      ángulo al revés: con ellas hay que usar $\theta' = 90^{\circ} - \theta$,
      que crece de C a B, y dan lo mismo. Y el motor del curso, con el arco
      hecho de noventa barras rectas, da los mismos valores en cada grado.

      **Lo que dice el resultado.** El flector de la pieza curva es negativo
      en todo el arco: tracciona la fibra exterior, porque la pieza,
      comprimida por la cuerda, se curva más. Vale cero en B y en C, las dos
      articulaciones, y es máximo en $45^{\circ}$, donde el arco está más
      lejos de la cuerda: su brazo es el mayor.

  # ── Ejercicio de clase 7.4 · la pieza quebrada ABC con BC a 60°.
  - id: ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60
    titulo: La pieza quebrada ABC, con el tramo BC a 60°
    fuente: >-
      Ejercicio 7.4 · Tema 7, «Piezas prismáticas. Fuerzas y momentos de
      sección» · Elasticidad y Resistencia de Materiales, UPV/EHU, ejercicios
      de clase (el fichero del 7.4 lleva la fecha del 28 de octubre de 2019).
      El material no trae solución: la resolución es nuestra, con el convenio
      del tema 7 para piezas de varios tramos (x de cada tramo hacia C, y
      girada 90° en sentido horario), y cada cifra está calculada con el
      motor del curso y comprobada por un segundo camino (los momentos
      respecto de A con los brazos horizontales, y N y T de BC por la
      derecha, con la reacción de C proyectada sobre la barra y su
      perpendicular). Los 60° son los que forma BC con la horizontal, como
      los acota la figura; con BC avanzando a en horizontal, mide 2a. La
      figura está redibujada.
    nivel: practica
    antes:
      idea: |
        Es una pieza rígida de dos tramos. Primero las reacciones, con la pieza
        entera; después, los esfuerzos de cada tramo, cada uno con sus propios
        ejes $x$ e $y$.
      formula: |
        $$
        \vec x = (\cos 60^{\circ},\ -\operatorname{sen}60^{\circ})
        \qquad
        \vec y = (-\operatorname{sen}60^{\circ},\ -\cos 60^{\circ})
        $$

        Los ejes del tramo BC, con $x$ hacia C e $y$ girada 90° en sentido
        horario, escritos con la horizontal y la vertical hacia arriba.
      reconocer: |
        Antes de las cuentas, mira las tres reacciones: dónde está cada una y
        cuál es la que se pregunta primero.
    enunciado: |
      Las dimensiones y las cargas que soporta el sistema rígido ABC se
      muestran en la figura, siendo $P = q_0a$ y estando aplicada en la mitad
      del tramo BC. Determinar los diagramas de fuerzas normales, de fuerzas
      cortantes y de momentos flectores en los tramos AB y BC en función de
      $q_0$ y $a$.

