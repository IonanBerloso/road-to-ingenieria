      - tipo: calcular
        titulo: La cortante, con las fuerzas de la parte derecha
        pregunta: |
          Un ejemplo nuestro: un voladizo de 3 m, empotrado en su extremo
          izquierdo, A, con una fuerza de 10 kN hacia abajo en el extremo
          libre, B. Corta por la sección a 1 m de A y quédate con la parte
          derecha, la que va de la sección a B. ¿Cuánto vale la cortante $T$
          de esa sección, con su signo, en kN?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número con su signo, en kN
        distractores:
          - valor: '-10'
            mensaje: |
              Has tomado $T$ positiva hacia abajo también en la cara de la
              parte derecha. Esa cara es la izquierda del trozo, la de normal
              $-x$, y en ella $T$ es positiva hacia arriba: para equilibrar los
              10 kN que bajan en B, la cara tiene que empujar hacia arriba, y
              eso es $T = +10$ kN.
        pista: |
          La cara del corte es la izquierda de la parte derecha: allí $T$ es
          positiva hacia arriba y $M$, horario (fig. 7.5). Plantea el
          equilibrio de ese trozo con $T$ y $M$ dibujados positivos.
        desarrollo: |
          Sobre el trozo que va de la sección a B actúan los 10 kN de B, hacia
          abajo, y en su cara izquierda $T$ (positiva hacia arriba), $M$
          (positivo horario) y $N$. Fuerzas verticales:

          $$
          T - 10 = 0 \;\Longrightarrow\; T = 10
          $$

          en kN. Por la izquierda sale lo mismo: la reacción de A, 10 kN
          hacia arriba, es la única fuerza vertical a la izquierda de la
          sección.
      - tipo: calcular
        titulo: El flector, con las fuerzas de la parte derecha
        pregunta: |
          En la misma sección y con la misma parte, ¿cuánto vale el flector
          $M$, con su signo, en kN·m?
        respuesta:
          tipo: numero
          valor: '-20'
          tolerancia: 0.01
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '20'
            mensaje: |
              Tiene el valor bueno y el signo cambiado. En la cara izquierda
              de la parte derecha $M$ es positivo horario. Los 10 kN de B, a
              2 m a la derecha, hacen girar el trozo en horario respecto de la
              sección, así que la cara tiene que hacer un par antihorario: es
              negativo. Tracciona la fibra de arriba, como en todo voladizo
              cargado hacia abajo.
          - valor: '-30'
            mensaje: |
              Has tomado como brazo la longitud entera, 3 m: es el flector del
              empotramiento. En la sección a 1 m de A, el brazo de la fuerza de
              B es la distancia de la sección a B, 2 m.
          - valor: '-10'
            mensaje: |
              Has tomado como brazo la distancia de A a la sección, 1 m. El
              brazo es la distancia de la fuerza a la sección: de la sección a
              B hay 2 m.
        pista: |
          Momentos respecto del centro de la sección, en el trozo que va de la
          sección a B, con $M$ dibujado horario en su cara izquierda.
        desarrollo: |
          Momentos respecto del centro de la sección, con el horario
          positivo: el par $M$ de la cara y los 10 kN de B, que a 2 m giran en
          horario,

          $$
          M + 10\cdot2 = 0 \;\Longrightarrow\; M = -20
          $$

          en kN·m. Por la izquierda: el empotramiento hace un par antihorario
          de 30 kN·m y la reacción de 10 kN, a 1 m, gira en horario respecto
          de la sección, así que $M = 10\cdot1 - 30 = -20$, también en kN·m.
      - tipo: justificar
        pregunta: Ordena cómo se fija el convenio en el plano $xy$. Una pieza es falsa.
        piezas:
          - texto: >-
              En la cara de normal $+x$, la derecha de la parte izquierda, el
              triedro es directo, con $x$ a la derecha e $y$ hacia abajo: $z$
              entra en el papel.
          - texto: >-
              Allí $N$ es positivo hacia $+x$, $T_y$ hacia $+y$, y $M_z$ según
              $-\vec k$, que sale del papel: antihorario (ec. 7.6).
          - texto: >-
              En la cara de normal $-x$, la izquierda de la parte derecha, el
              triedro es inverso y todo va al revés: $N$ hacia $-x$, $T_y$
              hacia arriba y $M_z$ horario.
          - texto: >-
              Con eso, $N > 0$ es tracción en las dos caras, y $M_z > 0$
              tracciona la fibra de abajo en las dos.
          - texto: >-
              Como $z$ sale del papel hacia quien mira, $M_z$ positivo es
              antihorario porque gira alrededor de $+z$.
            trampa: true
            mensaje: |
              Con $x$ a la derecha e $y$ hacia abajo, $z = x\times y$ entra en
              el papel, no sale. El antihorario de la cara derecha es el giro
              alrededor de $-z$, y por eso la ec. 7.6 escribe el momento como
              $-M_z\,\vec k$.
    resolucion: |
      **1. El sólido libre.** **De dónde sale el convenio** (apuntes del tema
      7, ec. 7.6, p. 6, y apartado 7.3, pp. 8-9). Al cortar la pieza, las
      fuerzas internas de la cara de la parte izquierda se reducen a su centro
      de gravedad y se descomponen en el triedro $Gxyz$:

      $$
      \vec R = N\,\vec i + T_y\,\vec j + T_z\,\vec k
      \qquad
      \vec M_G = M_t\,\vec i + M_y\,\vec j - M_z\,\vec k
      $$

      Son positivas las de la figura 7.4: en la **sección derecha** (la de
      normal $+x$, la cara de la parte I) el sistema de referencia es
      directo, y en la **sección izquierda** (la cara de la parte II),
      inverso. Así la acción y la reacción, que son opuestas, tienen el
      mismo signo. Las diapositivas lo resumen: las tensiones positivas en
      el cuadrante positivo generan fuerzas y momentos positivos.

      **En el plano $xy$**, con $x$ a la derecha, $y$ hacia abajo y $z$
      entrando en el papel:

      - $N > 0$ sale de la pieza en las dos caras: es tracción.
      - $T_y > 0$ va hacia abajo en la cara derecha y hacia arriba en la
        izquierda.
      - $M_z > 0$ es antihorario en la cara derecha y horario en la
        izquierda: los dos traccionan la fibra de abajo. Para eso está el
        signo menos de la ec. 7.6: el giro antihorario es alrededor de $-z$.

      **En el plano $xz$**, visto desde arriba, con $z$ hacia arriba en el
      dibujo e $y$ entrando en el papel: $T_z > 0$ va hacia $+z$ en la cara
      derecha y hacia $-z$ en la izquierda, y $M_y > 0$ es horario en la
      derecha y antihorario en la izquierda. $M_t$ es una flecha doble que
      sale de la pieza en las dos caras. La figura 7.5 de los apuntes rotula
      «$T_y$» también en esta vista; es $T_z$, y las diapositivas la llaman
      $V_z$.

      Cuando no hay fuerzas según $z$, $T_z = M_y = 0$ y se escribe
      $T_y = T$ y $M_z = M$ (p. 9). **En el ejemplo nuestro**, un voladizo de
      3 m empotrado en A con 10 kN hacia abajo en B, la parte derecha de la
      sección a 1 m de A:

      <figure class="figura-examen">
      <svg viewBox="0 14 300 150" role="img" width="450" height="225" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La parte derecha del voladizo, de la sección a B</title>
