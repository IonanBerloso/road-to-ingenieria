      - tipo: calcular
        titulo: La cortante en el empotramiento
        pregunta: |
          ¿Cuánto vale la cortante en A, en unidades de $q_0a$, con su signo?
        respuesta:
          tipo: numero
          valor: '4.5'
          tolerancia: 0.02
          formato: un número con su signo, la cortante dividida entre q0a
        distractores:
          - valor: '3'
            mensaje: |
              Es $q_0 \cdot 3a$, como si la carga fuera $q_0$ uniforme en BE.
              La carga es un trapecio: su resultante es su área, la media de
              los dos lados por la base, $\tfrac{q_0 + 2q_0}{2}\cdot 3a$.
          - valor: '6'
            mensaje: |
              Es $2q_0 \cdot 3a$, la carga máxima en todo BE. La intensidad
              solo llega a $2q_0$ en E; la media es $\tfrac32 q_0$.
          - valor: '1.5'
            mensaje: |
              Es solo la parte triangular del trapecio, la que crece de cero a
              $q_0$ sobre $3a$. Debajo hay un rectángulo de $q_0$ por $3a$ que
              también carga la viga.
          - valor: '9'
            mensaje: |
              Es $(q_0 + 2q_0)\cdot 3a$, sin dividir entre dos. El área de un
              trapecio es la media de los dos lados por la base.
          - valor: '-4.5'
            mensaje: |
              El valor es ese, pero el signo no. Con el convenio del curso,
              $T > 0$ si la resultante de lo que hay a la derecha de la
              sección va hacia abajo. A la derecha de A está toda la carga,
              hacia abajo.
        pista: |
          Por la derecha de A está toda la carga y nada más. Su resultante es
          el área del trapecio.
        desarrollo: |
          $$
          T_A = \frac{q_0 + 2q_0}{2}\cdot 3a = \frac92\,q_0a
          $$

          Es también la reacción vertical del empotramiento, hacia arriba. El
          par no entra: no tiene resultante.

      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en unidades de $q_0a^{2}$, con su
          signo?
        respuesta:
          tipo: numero
          valor: '-11'
          tolerancia: 0.05
          formato: un número con su signo, el flector dividido entre q0a²
        distractores:
          - valor: '11'
            mensaje: |
              El valor es ese, pero el signo no. La carga dobla el voladizo
              hacia abajo y tracciona la fibra de arriba: flector negativo.
              Por la derecha de la sección el antihorario cuenta positivo, y
              la carga, hacia abajo a la derecha de A, gira en sentido
              horario.
          - valor: '-12'
            mensaje: |
              Es el flector de la carga sola,
              $-\tfrac92 q_0a \cdot \tfrac83 a = -12\,q_0a^{2}$, sin el par.
              El par de C está a la derecha de A y cuenta: antihorario, por la
              derecha suma $+q_0a^{2}$.
          - valor: '-13'
            mensaje: |
              Has metido el par con el signo cambiado. Por la derecha de la
              sección un par antihorario cuenta positivo, lo contrario que por
              la izquierda: $-12 + 1$, no $-12 - 1$.
          - valor: '-10.25'
            mensaje: |
              Has puesto la resultante de la carga en el centro de BE, a
              $2{,}5a$ de A. Un trapecio que crece hacia E tiene su centro de
              gravedad más cerca de E: a $\tfrac53 a$ de B, en
              $x = \tfrac83 a$.
          - valor: '-9.5'
            mensaje: |
              Has medido el centro de gravedad desde E, y queda a
              $\tfrac43 a$ de B. La fórmula de la pista lo da desde el lado de
              $q_1$, B: a $\tfrac53 a$ de B, en $x = \tfrac83 a$.
        pista: |
          Por la derecha de A: la carga, $\tfrac92 q_0a$, en el centro de
          gravedad del trapecio, y el par. El centro de gravedad de un
          trapecio de base $\ell$ y lados $q_1$ y $q_2$ está a
          $\tfrac{\ell}{3}\cdot\tfrac{q_1 + 2q_2}{q_1 + q_2}$ del lado $q_1$.
        desarrollo: |
          $$
          \overline{x}_{BE} = \frac{3a}{3}\cdot\frac{q_0 + 2\cdot 2q_0}{q_0 + 2q_0} = \frac53\,a
          \quad\Longrightarrow\quad
          x = a + \frac53\,a = \frac83\,a
          $$

          Por la derecha, el antihorario cuenta positivo:

          $$
          M_A = -\frac92\,q_0a\cdot\frac83\,a + q_0a^{2} = -12\,q_0a^{2} + q_0a^{2} = -11\,q_0a^{2}
          $$

      - tipo: calcular
        titulo: El flector justo a la izquierda de C
        pregunta: |
          ¿Cuánto vale el flector justo a la izquierda de C, en unidades de
          $q_0a^{2}$, con su signo?
        respuesta:
          tipo: numero
          valor: '-2.5556'
          tolerancia: 0.01
          formato: un número con su signo, el flector dividido entre q0a²
        distractores:
          - valor: '-3.5556'
            mensaje: |
              Es el flector justo a la derecha de C, $-\tfrac{32}{9}q_0a^{2}$,
              el de la carga de CE sola. Justo a la izquierda de C el par
              queda a la derecha de la sección y entra: antihorario, por la
              derecha suma $+q_0a^{2}$.
          - valor: '-4.5556'
            mensaje: |
              Has metido el par con el signo cambiado: por la derecha de la
              sección el antihorario cuenta positivo. A la izquierda de C el
              flector es $-\tfrac{32}{9} + 1$, no $-\tfrac{32}{9} - 1$, en
              unidades de $q_0a^{2}$.
          - valor: '-2.3333'
            mensaje: |
              Has puesto la resultante de la carga de CE,
              $\tfrac{10}{3}q_0a$, en el centro de CE, a $a$ de C. La carga
              crece hacia E, y su centro de gravedad está a $\tfrac{16}{15}a$
              de C.
          - valor: '2.5556'
            mensaje: |
              El valor es ese, pero el signo no: toda la viga está doblada
              hacia abajo, con la fibra de arriba traccionada. El par alivia
              el flector, pero no le cambia el signo.
        pista: |
          Por la derecha de una sección justo a la izquierda de C están la
          carga de CE, que va de $\tfrac43 q_0$ a $2q_0$ sobre $2a$, y el par.
        desarrollo: |
          $$
          R_{CE} = \frac{\tfrac43 q_0 + 2q_0}{2}\cdot 2a = \frac{10}{3}\,q_0a,
          \qquad
          \overline{x}_{CE} = \frac{2a}{3}\cdot\frac{\tfrac43 q_0 + 4q_0}{\tfrac43 q_0 + 2q_0} = \frac{16}{15}\,a
          $$

          $$
          M_C^{+} = -\frac{10}{3}\,q_0a\cdot\frac{16}{15}\,a = -\frac{32}{9}\,q_0a^{2},
          \qquad
          M_C^{-} = -\frac{32}{9}\,q_0a^{2} + q_0a^{2} = -\frac{23}{9}\,q_0a^{2}
          $$

          Que es $-2{,}556\,q_0a^{2}$.

      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C (a los dos lados), D y E.
        comprueba:
          - punto: |
              **Cortante**: $\tfrac92 q_0a$ constante de A a B; de B a E baja
              en una curva cada vez más empinada, por $\tfrac{10}{3}q_0a$ en C
              y $\tfrac{11}{6}q_0a$ en D, hasta cero en E. Sin salto en C.
            porque: |
              $dT/dx = -q$ (ec. 7.14): horizontal en AB, sin carga; en BE la
              pendiente va de $-q_0$ en B a $-2q_0$ en E, y la cortante es
              una parábola. El par no tiene resultante y no la cambia. En E,
              extremo libre, es cero.
          - punto: |
              **Flector**, negativo en toda la viga: $-11q_0a^{2}$ en A, recta
              hasta $-\tfrac{13}{2}q_0a^{2}$ en B, curva hasta
              $-\tfrac{23}{9}q_0a^{2}$ justo antes de C; en C baja de golpe
              $q_0a^{2}$, hasta $-\tfrac{32}{9}q_0a^{2}$, y sube en curva por
              $-\tfrac{17}{18}q_0a^{2}$ en D hasta cero en E, con tangente
              horizontal.
            porque: |
              $dM/dx = T$ (ec. 7.15): recta donde la cortante es constante,
              cúbica donde la carga es lineal, y tangente horizontal en E,
              donde $T = 0$. Por la izquierda, el par antihorario cuenta
              negativo: el flector baja $q_0a^{2}$ al cruzar C.
          - punto: |
              **El empotramiento manda**: el mayor flector en valor absoluto
              es el de A, $11q_0a^{2}$.
            porque: |
              Es la sección que dimensiona. El par, antihorario, lo alivia: la
              carga sola daría $12q_0a^{2}$.
