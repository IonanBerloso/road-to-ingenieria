        <text x="228" y="122" font-size="10" text-anchor="start" fill="var(--d2-tinta)">M</text>
        <line x1="200" y1="90" x2="240" y2="90" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="246" y="94" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="200" y1="90" x2="200" y2="134" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="190" y="132" font-size="10" text-anchor="end" fill="var(--d2-tinta)">T</text>
        <circle cx="200" cy="90" r="2.4" fill="var(--ink)"/>
        <text x="194" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
        <text x="264" y="34" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
