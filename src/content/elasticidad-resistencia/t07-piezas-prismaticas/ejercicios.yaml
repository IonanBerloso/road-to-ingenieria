      **Las seis relaciones** (ec. 7.7, p. 8). Se suman las fuerzas y sus
      momentos respecto de $G$, con el brazo $y\,\vec j + z\,\vec k$, y se
      igualan a $\vec R = N\,\vec i + T_y\,\vec j + T_z\,\vec k$ y a
      $\vec M_G = M_t\,\vec i + M_y\,\vec j - M_z\,\vec k$ (ec. 7.6):

      $$
      N = \int_A\sigma_x\,dA
      \qquad
      T_y = \int_A\tau_{xy}\,dA
      \qquad
      T_z = \int_A\tau_{zx}\,dA
      $$

      $$
      M_t = \int_A(\tau_{zx}\,y - \tau_{xy}\,z)\,dA
      \qquad
      M_y = \int_A\sigma_x\,z\,dA
      \qquad
      M_z = \int_A\sigma_x\,y\,dA
      $$

      **El signo de $M_z$.** Es positivo en el sentido opuesto al eje $z$,
      porque las tensiones $\sigma_x$ dan momento en ese sentido (p. 8): la
      componente según $\vec k$ del momento es $-\int\sigma_x y\,dA$, y como
      $\vec M_G$ lleva $-M_z\,\vec k$, queda $M_z = \int\sigma_x y\,dA$, sin
      signo menos. Con $y$ hacia abajo, una tracción en la fibra de abajo
      ($y > 0$, $\sigma_x > 0$) da $M_z > 0$, que es lo que dice el convenio.
      Los libros con $y$ hacia arriba escriben $M = -\int\sigma\,y\,dA$.

      **Lo que se usa.** Como $y$ y $z$ se miden desde $G$,
      $\int y\,dA = \int z\,dA = 0$: una $\sigma_x$ uniforme da solo axil,
      $N = \sigma_x A$, y el término lineal de una $\sigma_x$ no da axil,
      solo momento. Los temas siguientes recorren el camino al revés: dados
      los esfuerzos, qué tensiones los producen.

      **Un ejemplo nuestro.** Una sección de 100 × 200 mm (ancho por canto)
      con $\sigma_x$ lineal, de −5 MPa arriba a 25 MPa abajo:
      $\sigma_x = 10 + 0{,}15\,y$, en MPa con $y$ en mm desde $G$. Entonces

      $$
      N = 10\cdot100\cdot200 = 200\,000
      $$

      en N, es decir, 200 kN, y

      $$
      M_z = 0{,}15\cdot\frac{100\cdot200^{3}}{12} = 10\,000\,000
      $$

      en N·mm, 10 kN·m, positivo. No hay $M_y$, porque $\sigma_x$ no depende
      de $z$ y la sección es simétrica, ni cortantes ni torsor, porque las
      tangenciales son nulas.

      **Comprobaciones.** Las dos integrales se han hecho con el motor del
      curso (área, momento estático e integral de $y^{2}$ de la sección
      respecto de $G$) y, aparte, por integración numérica en franjas
      horizontales de $\sigma_x\,b$ y de $\sigma_x\,y\,b$: 200 kN y 10 kN·m
      las dos veces. El parcial de 2016-2017 pide lo mismo al revés: da
      $\sigma_x = A\,y^{3}$ y el flector, y pregunta $A$.
