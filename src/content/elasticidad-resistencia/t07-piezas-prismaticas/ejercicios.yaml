      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción del apoyo A, en unidades de $q_0L$?
        respuesta:
          tipo: numero
          valor: '0.04167'
          tolerancia: 0.0005
          formato: un número, la reacción dividida entre q0L
        distractores:
          - valor: '0.0625'
            mensaje: |
              Has puesto la resultante, $q_0L/4$, en el centro de BC,
              $x = 3L/4$, y sale $q_0L/16$. El centro de gravedad de un
              triángulo está a un tercio de su lado alto: a $L/6$ de C, en
              $x = 5L/6$.
          - valor: '0.08333'
            mensaje: |
              Dos errores dan este número, $q_0L/12$. O la resultante a un
              tercio de BC contado desde B, el lado de cero, en $x = 2L/3$,
              cuando el tercio se cuenta desde C, el lado alto. O la
              resultante sin el ½ del triángulo, $q_0 \cdot L/2$, en su sitio.
              La resultante es el área, $\tfrac12 \cdot q_0 \cdot \tfrac{L}{2} = q_0L/4$,
              en $x = 5L/6$.
          - valor: '0.125'
            mensaje: |
              Es la reacción con $q_0$ uniforme en todo BC: resultante
              $q_0L/2$ en $x = 3L/4$. La carga es triangular: su resultante es
              la mitad, y está más cerca de C.
          - valor: '0.20833'
            mensaje: |
              Es $5q_0L/24$, la reacción de C. La de A sale de los momentos
              respecto de C, donde la resultante tiene brazo $L/6$ y $R_A$,
              brazo $L$; los momentos respecto de A dan $R_C$.
        pista: |
          La resultante de la carga es el área del triángulo, $q_0L/4$, y
          está en su centro de gravedad, a un tercio de BC contado desde C.
          Momentos respecto de C.
        desarrollo: |
          $$
          \sum M_C = 0:\quad R_A \cdot L - \frac{q_0L}{4}\cdot\frac{L}{6} = 0
          \quad\Longrightarrow\quad
          R_A = \frac{q_0L}{24} = 0{,}0417\,q_0L
          $$

          Y por el equilibrio vertical,
          $R_C = \tfrac{q_0L}{4} - \tfrac{q_0L}{24} = \tfrac{5}{24}\,q_0L$.

      - tipo: calcular
        titulo: Dónde se anula la cortante
        pregunta: |
          ¿En qué sección se anula la cortante? Da $x/L$, con $x$ medida
          desde A.
        respuesta:
          tipo: numero
          valor: '0.7041'
          tolerancia: 0.002
          formato: un número, x dividida entre L
        distractores:
          - valor: '0.58333'
            mensaje: |
              Has unido con una recta $T_B = q_0L/24$ y
              $T_C = -5q_0L/24$, y el cero sale a un sexto de BC, en
              $x = 7L/12$. Con carga lineal la cortante es una parábola que
              sale plana de B, donde la carga es cero, y tarda más en bajar:
              el cero está más cerca de C.
          - valor: '0.54167'
            mensaje: |
              Has tomado la carga uniforme, $T = R_A - q_0(x - L/2)$, y el
              cero sale a $R_A/q_0 = L/24$ de B. A una distancia $u$ de B la
              carga vale $2q_0u/L$, no $q_0$, y la que hay entre B y la
              sección es el área de su triángulo, $q_0u^{2}/L$.
          - valor: '0.83333'
            mensaje: |
              Es la posición de la resultante, $5L/6$. La cortante se anula
              donde la carga que queda a la izquierda de la sección iguala a
              $R_A$, y eso no tiene que ver con dónde está la resultante de
              toda la carga.
          - valor: '0.5'
            mensaje: |
              Es B, el centro de la viga. En AB la cortante vale $R_A > 0$,
              constante, y no se anula: empieza a bajar en B, con la carga.
          - valor: '0.78868'
            mensaje: |
              Has tomado la intensidad a una distancia $u$ de B como
              $q_0u/L$. La carga pasa de cero a $q_0$ en $L/2$, no en $L$:
              crece $2q_0/L$ por unidad de longitud, y la carga entre B y la
              sección es $q_0u^{2}/L$.
          - valor: '0.2041'
            mensaje: |
              Es $u/L$, la distancia del cero a B. La pregunta pide $x$
              medida desde A, que está $L/2$ más allá.
        pista: |
          A una distancia $u = x - L/2$ de B, la carga vale $2q_0u/L$, y la
          que hay entre B y la sección es el área de su triángulo,
          $q_0u^{2}/L$. La cortante es $R_A$ menos eso.
        desarrollo: |
          $$
          T(x) = \frac{q_0L}{24} - \frac{q_0}{L}\left(x - \frac{L}{2}\right)^{2} = 0
          \quad\Longrightarrow\quad
          x - \frac{L}{2} = \frac{L}{2\sqrt{6}}
          $$

          $$
          x_0 = \frac{L}{2} + \frac{L}{2\sqrt{6}} = 0{,}7041\,L
          $$

      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo, en unidades de $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '0.026503'
          tolerancia: 0.0003
          formato: un número con tres cifras significativas, el flector dividido entre q0L²
        distractores:
          - valor: '0.020833'
            mensaje: |
              Es $q_0L^{2}/48$, el flector en B. La carga empieza en B, pero
              el flector sigue subiendo mientras la cortante sea positiva,
              hasta $x = 0{,}704L$. O has puesto la carga entre B y la
              sección, $q_0u^{2}/L$ ($u = x_0 - L/2$), con brazo $u$, como si
              estuviera en B:
              con $u^{2} = L^{2}/24$ sale justo lo mismo. Su resultante está a
              $u/3$ de la sección.
          - valor: '0.022377'
            mensaje: |
              Es el flector bajo la resultante, en $x = 5L/6$. El máximo está
              donde se anula la cortante, en $x = 0{,}704L$; en $5L/6$ el
              flector ya está bajando.
          - valor: '0.024113'
            mensaje: |
              Es el flector en $x = 7L/12$, donde se anula la cortante si se
              dibuja como una recta entre B y C; es una parábola, y su cero
              está en $x = 0{,}704L$. O, si lo has calculado en $0{,}704L$, has
              puesto la resultante de la carga entre B y la sección a un
              tercio contado desde B, y sale $0{,}0237\,q_0L^{2}$: el lado alto
              de ese triángulo es el de la sección, y la resultante está a
              $u/3$ de ella.
          - valor: '0.029339'
            mensaje: |
              Es $R_A \cdot x_0$, sin la carga que hay entre B y la sección.
              Esa carga, $q_0u^{2}/L$ con $u = x_0 - L/2$, tiene su resultante
              a $u/3$ de la sección, y resta $q_0u^{3}/(3L)$.
        pista: |
          Por la izquierda de la sección del máximo: $R_A$ con brazo $x_0$,
          menos la carga entre B y la sección, $q_0u^{2}/L$, con su
          resultante a $u/3$ de la sección ($u = x_0 - L/2$).
        desarrollo: |
          Con $u = x_0 - L/2 = L/(2\sqrt{6})$, que cumple $u^{2} = L^{2}/24$:

          $$
          M_{\max} = R_A\,x_0 - \frac{q_0u^{2}}{L}\cdot\frac{u}{3}
          = \frac{q_0L}{24}\left(\frac{L}{2} + u\right) - \frac{q_0L}{72}\,u
          = \frac{q_0L^{2}}{48} + \frac{q_0L\,u}{36}
          $$

          $$
          M_{\max} = \frac{9 + \sqrt{6}}{432}\,q_0L^{2} = 0{,}0265\,q_0L^{2}
          $$

      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B y C, la sección en que se
          anula la cortante y el flector máximo.
        comprueba:
          - punto: |
              **Cortante**: $q_0L/24$ constante de A a B; de B a C, una
              parábola que sale de B con tangente horizontal, corta el cero en
              $x = 0{,}704L$ y llega a $-5q_0L/24$ en C, donde la reacción la
              devuelve a cero.
            porque: |
              $dT/dx = -q$ (ec. 7.14): horizontal donde no hay carga, y donde
              la carga crece en recta, una parábola cuya pendiente es la
              carga, nula en B.
          - punto: |
              **Flector**: cero en A; recta hasta $q_0L^{2}/48$ en B; de B a
              C, una cúbica con su máximo, $0{,}0265\,q_0L^{2}$, en
              $x = 0{,}704L$, y cero en C.
            porque: |
              $dM/dx = T$ (ec. 7.15): recta donde la cortante es constante y
              tangente horizontal donde $T = 0$. En un apoyo del extremo, sin
              par aplicado, el flector es nulo.
          - punto: |
              **B no hace pico**: el flector pasa por B sin quiebro, con la
              misma pendiente, $R_A$, a los dos lados.
            porque: |
              La cortante no salta en B: la carga empieza ahí con intensidad
              cero, y no hay ninguna fuerza concentrada.
        figura: |
