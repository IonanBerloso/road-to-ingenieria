      **Notas nuestras.** Las fuerzas se dan en unidades de $q_0a$ y los
      momentos en unidades de $q_0a^{2}$; en AC, $x$ se mide desde A. La
      pieza curva tiene radio $a$, y en ella $M > 0$ tracciona la fibra
      interior, la del lado de O, como en las diapositivas del tema.
    pide: >-
      En AC, el axil, el flector máximo y los tres diagramas; en la pieza
      curva, el ángulo en que el flector y el axil son máximos, y sus dos
      valores.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fuerza le hace la pieza curva BC a la viga AC en la
          articulación C?
        opciones:
          - texto: Una fuerza en la dirección de la cuerda BC, a 45°, porque BC solo recibe fuerzas en sus dos articulaciones
            correcta: true
            mensaje: |
              Eso es. BC no tiene carga encima y está articulada en B y en C:
              es una pieza de dos fuerzas. Para que esté en equilibrio, las
              dos tienen que ser iguales, contrarias y sobre la recta que une
              B y C, a 45°, aunque la pieza sea curva. Con eso, las tres
              ecuaciones de AC bastan.
          - texto: Una fuerza tangente al arco en C, es decir, horizontal
            mensaje: |
              La tangente en C no tiene nada de especial. Lo que fija la
              dirección es el equilibrio de BC: dos fuerzas solas, en B y en
              C, solo se equilibran si van por la recta BC. Y una fuerza
              horizontal en C no tendría momento respecto de A: AC no podría
              equilibrar su carga.
          - texto: Una fuerza vertical, como si C fuera un apoyo simple
            mensaje: |
              C no es un apoyo: es la unión con otra pieza, que se apoya a su
              vez en B. Con una fuerza vertical en C, BC no estaría en
              equilibrio: sus dos fuerzas tienen que ir por la misma recta, la
              cuerda BC.
          - texto: Una fuerza y un par, porque las dos piezas están unidas en C
            mensaje: |
              Unidas por una articulación, que no transmite momento: en C el
              flector es cero en las dos piezas. Si C transmitiera un par, la
              estructura tendría una incógnita más que ecuaciones.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga AC y la pieza curva BC
          por separado**, cada una con sus fuerzas.
        comprueba:
          - punto: |
              **La pieza curva, con una fuerza en cada extremo, por la cuerda
              BC.**
            porque: |
              Está articulada en B y en C y no tiene carga encima: es una pieza
              de dos fuerzas, y las dos van por la recta que une sus extremos,
              a 45°, no tangentes al arco.
          - punto: |
              **En C, sobre AC, la fuerza contraria a la que recibe BC.**
            porque: |
              Acción y reacción en la articulación. Dibujada a tracción, el
              signo dirá si BC está comprimida.
          - punto: |
              **En A, dos componentes.**
            porque: |
              Es un apoyo fijo: impide moverse en las dos direcciones.
