    pide: >-
      Las tres ecuaciones de equilibrio de la rebanada con la carga en la
      cara de arriba y, en el voladizo, dM/dx en x = 1,5 m, en kN·m/m, y el
      flector en el empotramiento, en kN·m.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la carga en el eje, las ecuaciones de la rebanada son
          $dN/dx = 0$, $dT/dx = -q$ y $dM/dx = T$ (apuntes, ecs. 7.8, 7.14 y
          7.15, con $q_x = 0$). Aquí la carga se apoya en la cara de arriba, a
          una distancia $h$ del eje. ¿Qué cambia?
        opciones:
          - texto: 'Nada: la recta de acción de $q\,dx$ es vertical y corta el eje, y su brazo respecto de G₂ es horizontal, de $dx/2$'
            correcta: true
            mensaje: |
              Eso es. El brazo de una fuerza respecto de un punto es la
              distancia de su recta de acción a ese punto, y la recta de una
              fuerza vertical es vertical: se puede deslizar por ella hasta el
              eje sin que cambie su momento. Queda el término
              $q\,dx \cdot dx/2$ de la ec. 7.11, que es de segundo orden y se
              desprecia. Es lo que piden los apuntes a $q_y$: que corte el eje
              de la pieza (p. 10).
          - texto: 'La de momentos: $q\,dx$ está a $h$ del eje, así que da un momento $h\,q\,dx$ y $dM/dx = T \pm h\,q$'
            mensaje: |
              La altura a la que se aplica una fuerza vertical no es su brazo.
              El brazo respecto de G₂ es la distancia de la recta de acción a
              G₂, y la recta de una fuerza vertical es vertical: está a
              $dx/2$ de G₂, en horizontal, sea cual sea la altura. La $h$
              sería el brazo de una fuerza horizontal aplicada en esa cara.
          - texto: 'Nada, porque una carga perpendicular al eje no da momento respecto de G₂'
            mensaje: |
              La conclusión es buena; la razón, no. Ser perpendicular al eje no
              quita el momento: $T$, en la cara izquierda, también lo es, y da
              $-T\,dx$ respecto de G₂. $q\,dx$ da $q\,dx \cdot dx/2$, porque su
              recta de acción pasa a $dx/2$ de G₂; lo que pasa es que ese
              término es de segundo orden y se desprecia frente a $T\,dx$
              (apuntes, p. 11).

      - tipo: dibujar
        consigna: |
          En papel, antes de las cuentas del apartado b): **el trozo del
          voladizo entre el extremo libre y una sección $x$**, con su carga y
          los esfuerzos del corte.
        comprueba:
          - punto: |
              **La carga $q$ sobre la cara de arriba, en toda la longitud $x$.**
            porque: |
              Es lo único que hay a la izquierda de la sección: el extremo
              libre no tiene nada.
          - punto: |
              **En la cara del corte, $N$ hacia $+x$, $T$ hacia abajo y $M$
              antihorario, como incógnitas.**
            porque: |
              Es una cara de normal $+x$, como la derecha de la rebanada: los
              sentidos positivos del curso, con $y$ hacia abajo (figura 7.6 de
              los apuntes).
          - punto: |
              **Sin las reacciones del empotramiento.**
            porque: |
              Están en el otro trozo: con el del extremo libre no hace falta
              calcularlas.
