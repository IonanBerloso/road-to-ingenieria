        <text x="46" y="116" font-size="10" text-anchor="start" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">A</tspan></text>
        <line x1="280" y1="118" x2="280" y2="86" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="286" y="116" font-size="10" text-anchor="start" fill="var(--d2-tinta)">R<tspan font-size="7.5" dy="2.5">C</tspan></text>
        <line x1="318" y1="80" x2="288" y2="80" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="318" y="74" font-size="10" text-anchor="start" fill="var(--d2-tinta)">H<tspan font-size="7.5" dy="2.5">C</tspan></text>
