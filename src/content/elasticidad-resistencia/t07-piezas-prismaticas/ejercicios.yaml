        <circle cx="160" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="160" y="98" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="280" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="274" y="74" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      La viga sin apoyos: la carga triangular sobre BC, y tres incógnitas, RA, RC y HC; la del apoyo móvil, solo vertical.

      </figcaption>
      </figure>

      - **Tres incógnitas**: $R_A$, $R_C$ y $H_C$, nula porque no hay cargas
        horizontales.
      - **La resultante de la carga** es $q_0L/4$, el área del triángulo de
        base $L/2$ y altura $q_0$, en su centro de gravedad, a un tercio de BC
        contado desde C: $x = 5L/6$.
      - **Dos tramos**: AB, sin carga, y BC, con la carga creciendo en recta
        desde cero.

      **2. Incógnitas.** $R_A$ y $R_C$; las leyes de $T$ y de $M$ en cada
      tramo; la sección en que se anula la cortante y el flector máximo.

      **3. Ecuaciones.** Momentos respecto de C y equilibrio vertical; en cada
      tramo, $T$ y $M$ por la izquierda de la sección; y $dT/dx = -q$ y
      $dM/dx = T$ (ecs. 7.14 y 7.15) para comprobar.

      **4. Resultados.** **Las reacciones.**

      $$
      R_A \cdot L = \frac{q_0L}{4}\cdot\frac{L}{6}
      \quad\Longrightarrow\quad
      R_A = \frac{q_0L}{24},\qquad R_C = \frac{q_0L}{4} - \frac{q_0L}{24} = \frac{5}{24}\,q_0L
      $$

      **AB.** Sin carga: $T = q_0L/24$ constante, y el flector es una recta
      que vale cero en A y $q_0L^{2}/48$ en B.

      **BC.** A una distancia $u = x - L/2$ de B, la carga vale $2q_0u/L$, y
      la que hay entre B y la sección es $q_0u^{2}/L$, con su resultante a
      $u/3$ de la sección:

      $$
      T = \frac{q_0L}{24} - \frac{q_0u^{2}}{L},
      \qquad
      M = \frac{q_0L}{24}\left(\frac{L}{2} + u\right) - \frac{q_0u^{3}}{3L}
      $$

      La cortante es una parábola que sale plana de B (la carga allí es cero)
      y llega a $-5q_0L/24$ en C; el flector, una cúbica que vale cero en C.
      La cortante se anula en $u = L/(2\sqrt{6})$, en $x_0 = 0{,}7041\,L$, y
      ahí el flector es máximo:

      $$
      M_{\max} = \frac{9 + \sqrt{6}}{432}\,q_0L^{2} = 0{,}0265\,q_0L^{2}
      $$

      Los diagramas, con estos valores, son los del paso de dibujarlos.

      **5. Comprobación.** Integrando $dT/dx = -q$ y $dM/dx = T$ desde A, con
      $T(0) = R_A$ y $M(0) = 0$, se llega a C con $T = -5q_0L/24 = -R_C$ y
      $M = 0$: la reacción de C devuelve la cortante a cero, y el apoyo
      extremo no tiene flector.

      **Lo que dice el resultado.** $R_A$ es pequeña, $1/24$, porque la carga
      está cerca de C. Y el máximo no está bajo la resultante ($5L/6$) ni en
      el centro de BC ($3L/4$, donde el flector vale $0{,}0260\,q_0L^{2}$,
      muy cerca, porque alrededor del máximo la curva es casi plana).

  # ── Ejercicio de clase 7.2 · el voladizo con carga trapecial y un par en C.
  - id: ejerm7-cl7-2-el-voladizo-con-carga-trapecial-y-un-par
    titulo: El voladizo con una carga trapecial y un par en C
    fuente: >-
      Ejercicio 7.2 · Tema 7, «Piezas prismáticas. Fuerzas y momentos de
      sección» · Elasticidad y Resistencia de Materiales, UPV/EHU, ejercicios
      de clase (el fichero del 7.2 lleva la fecha del 24 de octubre de 2019).
      El material no trae solución: la resolución es nuestra, con el convenio
      del tema 7, y cada cifra está calculada con el motor del curso y
      comprobada por un segundo camino (los esfuerzos escritos por la
      derecha, desde el extremo libre, con fracciones, y la integración de
      dT/dx = −q y dM/dx = T de E a A, con el salto del par en C). El par de
      C se lee antihorario, como lo dibuja la flecha del original, y D es
      solo un punto acotado, a una distancia a del extremo E. El enunciado
      pide solo los diagramas; aquí se pregunta además por los valores que
      los fijan. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        En un voladizo, por el lado del extremo libre de cualquier sección solo
        hay cargas conocidas: la cortante y el flector salen sin calcular antes
        las reacciones.
      formula: |
        $$
        \frac{dT}{dx} = -q
        \qquad
        \frac{dM}{dx} = T
        $$

        Cómo cambian la cortante y el flector a lo largo de la viga (ecs. 7.14
        y 7.15).
      reconocer: |
        Antes de las cuentas, separa lo que hace cada carga: la repartida, a lo
        largo de BE, y el par, en un solo punto.
    enunciado: |
      Para la viga de la figura, dibujar los diagramas de fuerzas cortantes y
      de momentos flectores.

