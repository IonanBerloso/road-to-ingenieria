            <text x="190" y="132" font-size="10" text-anchor="end" fill="var(--d2-tinta)">T</text>
            <circle cx="200" cy="90" r="2.4" fill="var(--ink)"/>
            <text x="194" y="84" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">G</text>
            <text x="264" y="34" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
            <text x="235" y="58" font-size="9" text-anchor="end" fill="var(--faint)">y</text>
          </svg>

      - tipo: calcular
        titulo: La pendiente del flector a mitad del voladizo
        pregunta: |
          En el voladizo, ¿cuánto vale $dM/dx$ en $x = 1{,}5$ m, en kN·m/m,
          con el convenio del curso?
        respuesta:
          tipo: numero
          valor: '-6'
          tolerancia: 0.05
          formato: un número con su signo, en kN·m/m
        distractores:
          - valor: '-4.8'
            mensaje: |
              Has sumado $h\,q = 0{,}3 \cdot 4 = 1{,}2$ a la cortante, como si
              $q\,dx$ diera un momento $h\,q\,dx$. Una fuerza vertical no
              tiene $h$ de brazo: su recta de acción corta el eje. Queda
              $dM/dx = T = -6$.
          - valor: '-7.2'
            mensaje: |
              Has restado $h\,q = 0{,}3 \cdot 4 = 1{,}2$ a la cortante: es el
              brazo $h$ con el otro signo. Una fuerza vertical no tiene $h$ de
              brazo, sea cual sea el signo: su recta de acción corta el eje, y
              $dM/dx = T = -6$.
          - valor: '6'
            mensaje: |
              El valor es ese, el signo no. $dM/dx = T$, y $T$ es la suma de
              las fuerzas hacia arriba que hay a la izquierda de la sección.
              A la izquierda solo hay carga, hacia abajo, $4 \cdot 1{,}5 = 6$
              kN: $T = -6$ kN. Con $dT/dx = +q$, que es otro convenio, el
              signo sale cambiado.
        pista: |
          $dM/dx = T$, y $T$ en $x$ es la suma de las fuerzas hacia arriba
          que hay a la izquierda de la sección.
        desarrollo: |
          A la izquierda de $x = 1{,}5$ m solo está la carga de ese tramo,
          hacia abajo:

          $$
          \frac{dM}{dx} = T(1{,}5) = -4 \cdot 1{,}5 = -6\ \text{kN}
          $$

          que son kN·m por metro.

      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en el empotramiento, $x = 3$ m, en kN·m,
          con su signo?
        respuesta:
          tipo: numero
          valor: '-18'
          tolerancia: 0.05
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-14.4'
            mensaje: |
              Es lo que sale integrando $dM/dx = T + h\,q$:
              $-18 + 0{,}3 \cdot 4 \cdot 3 = -14{,}4$. Ese término no existe
              con una carga vertical: su recta de acción corta el eje.
          - valor: '-21.6'
            mensaje: |
              Es lo que sale integrando $dM/dx = T - h\,q$:
              $-18 - 0{,}3 \cdot 4 \cdot 3 = -21{,}6$. Ese término no existe
              con una carga vertical, con ningún signo: su recta de acción
              corta el eje.
          - valor: '18'
            mensaje: |
              El valor es ese, el signo no. El voladizo se comba hacia abajo
              desde el empotramiento y tracciona la fibra de arriba: con el
              convenio del curso, el flector es negativo.
          - valor: '-36'
            mensaje: |
              Has puesto la resultante, $q\,L = 12$ kN, en el extremo libre, a
              3 m del empotramiento. La resultante de una carga uniforme está
              en el centro del tramo, a 1,5 m: $-12 \cdot 1{,}5 = -18$.
        pista: |
          Integra $dM/dx = T = -q\,x$ desde el extremo libre, donde $M = 0$.
          O toma momentos de la carga del trozo de la izquierda: su
          resultante está en el centro del tramo.
        desarrollo: |
          $$
          M(x) = \int_0^x (-q\,s)\,ds = -\frac{q\,x^{2}}{2}
          \qquad
          M(3) = -\frac{4 \cdot 3^{2}}{2} = -18\ \text{kN·m}
          $$

          Negativo: tracciona la fibra de arriba.

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: 'Se aísla la rebanada $dx$, con $N$, $T$ y $M$ en la cara izquierda y $N + dN$, $T + dT$ y $M + dM$ en la derecha, positivos, y $q\,dx$ hacia abajo sobre la cara de arriba.'
          - texto: '$\sum F_x = 0$ da $dN = 0$, porque $q$ no tiene componente según $x$; $\sum F_y = 0$ da $dT + q\,dx = 0$.'
          - texto: 'Momentos respecto de G₂: $dM - T\,dx + q\,dx \cdot dx/2 = 0$, porque la recta de acción de $q\,dx$ es vertical y pasa a $dx/2$ de G₂.'
          - texto: 'El término de $q$ es de segundo orden: $dM/dx = T$, como con la carga en el eje.'
          - texto: '$q\,dx$ está aplicada a $h$ del eje, así que su momento respecto de G₂ es $h\,q\,dx$ y queda $dM/dx = T + h\,q$.'
            trampa: true
            mensaje: |
              La altura sería el brazo de una fuerza horizontal. El de una
              fuerza vertical es la distancia horizontal entre su recta de
              acción y G₂, $dx/2$: la fuerza se puede deslizar por su recta
              hasta el eje sin que cambie su momento.
    resolucion: |
      **1. El sólido libre.** Hay dos: la rebanada de la figura del enunciado,
      para a/, y el trozo del voladizo de $0$ a $x$, para b/.

      <figure class="figura-examen">
      <svg viewBox="0 18 290 168" role="img" width="435" height="252" aria-labelledby="dsl-t dsl-d">
