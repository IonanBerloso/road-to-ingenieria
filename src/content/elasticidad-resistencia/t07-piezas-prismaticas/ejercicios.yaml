          </svg>

      - tipo: calcular
        titulo: La reacción en D
        pregunta: |
          ¿Cuánto vale la reacción del apoyo D, en kN?
        respuesta:
          tipo: numero
          valor: '32.1667'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '25.5'
            mensaje: |
              Es la reacción sin el par. El par horario de 20 kN·m también hay
              que equilibrarlo, y respecto de A solo puede hacerlo $R_D$.
          - valor: '18.8333'
            mensaje: |
              Has metido el par como antihorario. En la figura gira en sentido
              horario, como el momento de las cargas respecto de A, y $R_D$
              tiene que equilibrar las dos cosas.
          - valor: '29.6667'
            mensaje: |
              Has puesto la resultante del voladizo, 15 kN, en D, a 3 m de A.
              Está en el centro del voladizo, a 3,5 m.
          - valor: '33.8333'
            mensaje: |
              Has multiplicado el par por su distancia a A,
              20 kN·m · 1,25 m. Un par vale lo mismo respecto de cualquier
              punto: 20 kN·m.
        pista: |
          Momentos respecto de A: $R_D$ con brazo 3 m contra los 8 kN de B
          (1 m), los de C (2 m), los 15 kN del voladizo (3,5 m) y el par.
        desarrollo: |
          $$
          R_D \cdot 3\ \text{m} = 8\ \text{kN}\cdot 1\ \text{m} + 8\ \text{kN}\cdot 2\ \text{m} + 15\ \text{kN}\cdot 3{,}5\ \text{m} + 20\ \text{kN}\cdot\text{m} = 96{,}5\ \text{kN}\cdot\text{m}
          $$

          $$
          R_D = \frac{96{,}5\ \text{kN}\cdot\text{m}}{3\ \text{m}} = 32{,}17\ \text{kN}
          $$

      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción vertical en A, en kN, con su signo
          (positiva hacia arriba)?
        respuesta:
          tipo: numero
          valor: '-1.1667'
          tolerancia: 0.02
          formato: un número con su signo, en kN
        distractores:
          - valor: '1.1667'
            mensaje: |
              El valor es ese, pero el signo no. Las cargas suman 31 kN y
              $R_D$ ya lleva más que eso: A tiene que tirar hacia abajo. Es un
              apoyo fijo y puede hacerlo.
          - valor: '5.5'
            mensaje: |
              Es la reacción de A sin el par. El par horario carga $R_D$ y
              descarga $R_A$ en $20/3$ kN, y la deja negativa.
          - valor: '12.1667'
            mensaje: |
              Has metido el par como antihorario, y entonces descargaría D y
              cargaría A. En la figura es horario.
        pista: |
          Equilibrio vertical: $R_A + R_D$ es la suma de las cargas,
          8 + 8 + 15 kN.
        desarrollo: |
          $$
          R_A = 31\ \text{kN} - 32{,}17\ \text{kN} = -1{,}17\ \text{kN}
          $$

          Negativa: A tira de la viga hacia abajo. El voladizo y el par la
          levantan por ese lado.

      - tipo: calcular
        titulo: El flector justo a la derecha del par
        pregunta: |
          ¿Cuánto vale el flector justo a la derecha del par, en kN·m, con su
          signo?
        respuesta:
          tipo: numero
          valor: '16.5417'
          tolerancia: 0.05
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-3.4583'
            mensaje: |
              Es el flector justo a la izquierda del par. A su derecha, el par
              queda a la izquierda de la sección y cuenta: horario, por la
              izquierda suma 20 kN·m.
          - valor: '-23.4583'
            mensaje: |
              Has restado el par. Por la izquierda de la sección el horario
              cuenta positivo: al cruzar un par horario, de izquierda a
              derecha, el flector sube.
          - valor: '19.4583'
            mensaje: |
              Has tomado $R_A$ hacia arriba, $+1{,}17$ kN. Sale negativa: tira
              hacia abajo, y su momento respecto de la sección resta.
        pista: |
          Por la izquierda: $R_A$ con brazo 1,25 m, los 8 kN de B con brazo
          0,25 m, y el par.
        desarrollo: |
          $$
          M = -1{,}1667\ \text{kN}\cdot 1{,}25\ \text{m} - 8\ \text{kN}\cdot 0{,}25\ \text{m} + 20\ \text{kN}\cdot\text{m} = 16{,}54\ \text{kN}\cdot\text{m}
          $$

          Justo a la izquierda del par, sin él, vale $-3{,}46$ kN·m: el par
          lo sube 20 kN·m.

      - tipo: calcular
        titulo: El flector en D
        pregunta: |
          ¿Cuánto vale el flector en D, en kN·m, con su signo?
        respuesta:
          tipo: numero
          valor: '-7.5'
          tolerancia: 0.02
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '7.5'
            mensaje: |
              El valor es ese, pero el signo no. El voladizo cargado se dobla
              hacia abajo desde D y tracciona la fibra de arriba: flector
              negativo.
          - valor: '-15'
            mensaje: |
              Has puesto los 15 kN del voladizo en su extremo, a 1 m de D. Su
              resultante está en el centro del voladizo, a 0,5 m.
          - valor: '-27.5'
            mensaje: |
              Lo has calculado por la izquierda sin el par. A la izquierda de
              D están $R_A$, las dos fuerzas de 8 kN y también el par, que
              suma 20 kN·m. Por la derecha es más corto: solo el voladizo.
        pista: |
          Por la derecha de D solo está el voladizo: 15 kN con su resultante a
          0,5 m.
        desarrollo: |
          $$
          M_D = -15\ \text{kN}\cdot 0{,}5\ \text{m} = -7{,}5\ \text{kN}\cdot\text{m}
          $$

          Por la izquierda sale igual:
          $-1{,}1667 \cdot 3 - 8 \cdot 2 - 8 \cdot 1 + 20 = -7{,}5$, en kN·m.

      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, a los dos lados del par, en
          C, en D y en el extremo, y la sección en que el flector cambia de
          signo.
        comprueba:
          - punto: |
              **Cortante**, en kN: $-1{,}17$ de A a B; $-9{,}17$ de B a C,
              también a los dos lados del par; $-17{,}17$ de C a D; en D salta
              32,17 hacia arriba, hasta 15, y baja en recta hasta cero en el
              extremo.
            porque: |
              $dT/dx = -q$ (ec. 7.14): constante donde no hay carga, con un
              salto en cada fuerza concentrada, del valor de la fuerza; el par
              no la cambia. En el extremo libre es cero.
          - punto: |
              **Flector**, en kN·m: cero en A; recta hasta $-1{,}17$ en B y
              hasta $-3{,}46$ justo antes del par; en el par sube 20, hasta
              16,54; recta hasta 9,67 en C; recta que corta el cero en
              $x = 2{,}56$ m y llega a $-7{,}5$ en D; parábola hasta cero en
              el extremo, con tangente horizontal.
            porque: |
              $dM/dx = T$ (ec. 7.15): rectas donde la cortante es constante y
              parábola bajo la carga uniforme. El par horario, por la
              izquierda, suma: el flector salta 20 kN·m hacia arriba.
          - punto: |
              **El máximo está en el par**: el mayor flector es 16,54 kN·m,
              justo a la derecha del par, y el mayor negativo, $-7{,}5$ kN·m,
              en D.
            porque: |
              La cortante no se anula entre A y D: los extremos del flector
              están en los saltos, el del par y el pico de D.
