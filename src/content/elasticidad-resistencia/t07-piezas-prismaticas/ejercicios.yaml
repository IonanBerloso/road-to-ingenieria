      <figcaption>

      Redibujada del enunciado: la viga está empotrada en A y libre en E; la
      carga crece en línea recta desde q₀ en B hasta 2q₀ en E, y en C actúa
      un par q₀a² antihorario.

      </figcaption>
      </figure>

      **Notas nuestras.** Las fuerzas se dan en unidades de $q_0a$ y los
      momentos en unidades de $q_0a^{2}$, y la abscisa $x$ se mide desde A.
      Convenio del curso: $T > 0$ si la resultante de las fuerzas de la
      izquierda de la sección va hacia arriba (o la de la derecha, hacia
      abajo), y $M > 0$ si tracciona la fibra de abajo.
    pide: >-
      La cortante en A, dos valores del flector y los diagramas de cortantes
      y de flectores.
    pasos:
      - tipo: reconocer
        pregunta: |
          En C hay un par concentrado, $q_0a^{2}$. ¿Qué les hace a los
          diagramas?
        opciones:
          - texto: El flector da un salto de $q_0a^{2}$ en C, y la cortante no lo nota
            correcta: true
            mensaje: |
              Eso es. Un par no tiene resultante, así que no cambia la suma de
              fuerzas a un lado de la sección: la cortante sigue igual. Sí
              cambia la suma de momentos, y al cruzar C el flector salta lo
              que vale el par. Si sube o baja lo dice su sentido.
          - texto: La cortante da un salto de $q_0a^{2}$ en C
            mensaje: |
              Los saltos de la cortante los dan las fuerzas concentradas. Un
              par es un momento puro, sin resultante: no cambia la suma de
              fuerzas a un lado de la sección. Y $q_0a^{2}$ ni siquiera es una
              fuerza: tiene unidades de momento.
          - texto: Nada; un par solo cuenta en las reacciones del empotramiento
            mensaje: |
              Cuenta en las reacciones y en cada sección que lo tenga a un
              lado. El flector de una sección es la suma de los momentos de lo
              que hay a un lado, pares incluidos: justo a la izquierda de C el
              par está a la derecha de la sección y cuenta, y justo a la
              derecha ya no.
          - texto: El flector cambia de pendiente en C
            mensaje: |
              La pendiente del flector es la cortante (ec. 7.15), y la
              cortante no cambia en C. Lo que cambia es el valor: el flector
              da un salto vertical de $q_0a^{2}$ y sigue con la misma
              pendiente.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el voladizo sin el
          empotramiento**, con las cargas y las reacciones.
        comprueba:
          - punto: |
              **En A, dos fuerzas y el par del empotramiento.**
            porque: |
              El empotramiento impide moverse y girar. No hace falta
              calcularlas: por la derecha de cada sección solo hay datos.
          - punto: |
              **La carga trapecial, de $q_0$ en B a $2q_0$ en E.**
            porque: |
              Su resultante, $\tfrac92 q_0a$, está en el centro de gravedad del
              trapecio, a $\tfrac53 a$ de B.
          - punto: |
              **El par de C, antihorario.**
            porque: |
              Es un momento puro: entra en los momentos con su valor y su
              sentido, y en las fuerzas, no.
