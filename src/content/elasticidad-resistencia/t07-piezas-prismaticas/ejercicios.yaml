      <figcaption>

      La pieza sin apoyos: la carga y P, datos; HA, VA y RC, incógnitas, la de C solo vertical, porque el apoyo es móvil.

      </figcaption>
      </figure>

      - **Tres reacciones**: $H_A$, $V_A$ y $R_C$, vertical.
      - **Momentos respecto de A** dan $R_C$ sola, con los brazos
        horizontales.
      - **Los esfuerzos** se dan recorriendo la pieza de A a C, cada tramo con
        su $x$ hacia C y su $y$, la $x$ girada 90° en sentido horario.

      **2. Incógnitas.** $R_C$ y las reacciones de A; $N$, $T$ y $M$ en AB y en
      BC, con el flector en B y el axil y la cortante entre P y C.

      **3. Ecuaciones.** El equilibrio de la pieza entera; en cada sección,
      $N$ y $T$ son las proyecciones sobre $x$ y sobre $y$ de lo que hay a un
      lado, y $M$, su momento respecto de la sección.

      **4. Resultados.** **Reacciones.** Momentos respecto de A, con los
      brazos horizontales:

      $$
      R_C\cdot 3a = q_0a\cdot\frac{a}{2} + q_0a\cdot\frac52\,a
      \quad\Longrightarrow\quad
      R_C = q_0a
      $$

      En A, $q_0a$ hacia arriba y nada en horizontal.

      **AB**, de A a B, con $y$ hacia abajo. Sin axil. Cortante $q_0a$ en A,
      que baja en recta hasta cero en $x = a$ y sigue en cero hasta B.
      Flector $q_0a\,x - q_0x^{2}/2$ hasta $x = a$, donde vale
      $\tfrac12 q_0a^{2}$ con tangente horizontal, y constante hasta B.

      **BC**, de B a C, con
      $x = (\cos 60^{\circ},\ -\operatorname{sen}60^{\circ})$ e
      $y = (-\operatorname{sen}60^{\circ},\ -\cos 60^{\circ})$. Por la derecha
      de una sección entre B y P quedan P y $R_C$, iguales y contrarias:
      $N = T = 0$ y $M = \tfrac12 q_0a^{2}$, flexión pura. Entre P y C solo
      queda $R_C$:

      $$
      N = -R_C\operatorname{sen}60^{\circ} = -\frac{\sqrt{3}}{2}\,q_0a,
      \qquad
      T = -R_C\cos 60^{\circ} = -\frac12\,q_0a
      $$

      y el flector baja en recta de $\tfrac12 q_0a^{2}$ en P a cero en C. Los
      diagramas, con estos valores, son los del paso de dibujarlos.

      **5. Comprobación.** El flector en B es el mismo por los dos lados: por
      la izquierda, $q_0a\cdot 2a - q_0a\cdot\tfrac32 a$; por la derecha,
      $q_0a\cdot a - q_0a\cdot\tfrac{a}{2}$; las dos, $\tfrac12 q_0a^{2}$. Y
      la pendiente del flector de P a C, $-\tfrac12 q_0a^{2}$ en una longitud
      $a$, es la cortante del tramo.

      **Lo que dice el resultado.** En B la pieza se quiebra, pero es rígida:
      el nudo pasa el flector de un tramo al otro, $\tfrac12 q_0a^{2}$, y no
      es una articulación. Entre B y P, P y $R_C$ se anulan entre sí y el
      tramo solo se flexa, sin axil ni cortante.

  # ── Ejercicio de clase 7.5 · la viga con voladizo y un par de 20 kN·m.
  - id: ejerm7-cl7-5-la-viga-con-voladizo-y-un-par-de-20-kn-m
    titulo: La viga con voladizo, dos fuerzas de 8 kN y un par de 20 kN·m
    fuente: >-
      Ejercicio 7.5 · Tema 7, «Piezas prismáticas. Fuerzas y momentos de
      sección» · Elasticidad y Resistencia de Materiales, UPV/EHU, ejercicios
      de clase (el fichero del 7.5 no lleva fecha). El material no trae
      solución: la resolución es nuestra, con el convenio del tema 7, y cada
      cifra está calculada con el motor del curso y comprobada por un segundo
      camino (los momentos respecto de A con los números, y la integración de
      dT/dx = −q y dM/dx = T de A al extremo, con el salto del par, que
      tiene que acabar con T = 0 y M = 0 en el extremo libre). La figura del
      original es una imagen en color, de otro estilo que las demás; aquí
      está redibujada con las mismas cotas, cargas y sentidos (el par,
      horario, a 0,25 m a la derecha de B). El enunciado pide solo los
      diagramas; aquí se pregunta además por los valores que los fijan.
    nivel: practica
    antes:
      idea: |
        Primero las dos reacciones; después, de izquierda a derecha, la
        cortante salta en cada fuerza y el flector en el par, y entre medias
        cada uno sigue su ley.
      formula: |
        $$
        \frac{dT}{dx} = -q
        \qquad
        \frac{dM}{dx} = T
        $$

        Con ellas se pasa de un punto de la viga al siguiente (ecs. 7.14 y
        7.15).
      reconocer: |
        Antes de las cuentas, escribe cada carga con su posición y su sentido:
        dos fuerzas, un par y una repartida.
    enunciado: |
      Para la viga de la figura, dibujar los diagramas de fuerzas cortantes y
      de momentos flectores.

