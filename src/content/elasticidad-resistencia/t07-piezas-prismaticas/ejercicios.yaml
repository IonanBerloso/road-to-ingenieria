      - tipo: calcular
        titulo: La reacción en C
        pregunta: |
          ¿Cuánto vale la reacción del apoyo C, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número, la reacción dividida entre q0a
        distractores:
          - valor: '1.1667'
            mensaje: |
              Dos errores dan $\tfrac76 q_0a$: poner la resultante de la carga
              de AB al final del tramo cargado, a $a$ de A, en vez de en su
              centro, a $\tfrac{a}{2}$; o medir el brazo de P hasta C, $3a$,
              en vez de hasta la mitad de BC, $\tfrac52 a$.
          - valor: '0.75'
            mensaje: |
              Has medido el brazo de $R_C$ a lo largo de la pieza,
              $2a + 2a = 4a$. Para una fuerza vertical cuenta la distancia
              horizontal: C está a $3a$ de A.
          - valor: '1.5'
            mensaje: |
              Has repartido $q_0$ en todo AB, $2a$. La carga solo ocupa el
              primer tramo, de longitud $a$: su resultante es $q_0a$, a
              $\tfrac{a}{2}$ de A.
        pista: |
          Momentos respecto de A: $R_C$ con brazo $3a$ contra la carga de AB,
          $q_0a$ con brazo $\tfrac{a}{2}$, y P, $q_0a$ con brazo
          $\tfrac52 a$.
        desarrollo: |
          $$
          R_C\cdot 3a = q_0a\cdot\frac{a}{2} + q_0a\cdot\frac52\,a = 3\,q_0a^{2}
          \quad\Longrightarrow\quad
          R_C = q_0a
          $$

          Y por la vertical, la reacción vertical de A es
          $2q_0a - q_0a = q_0a$; la horizontal, cero.

      - tipo: calcular
        titulo: El flector en B
        pregunta: |
          ¿Cuánto vale el flector en B, en unidades de $q_0a^{2}$, con su
          signo?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número con su signo, el flector dividido entre q0a²
        distractores:
          - valor: '1.5'
            mensaje: |
              Has medido el brazo de la carga desde A, $\tfrac{a}{2}$, en vez
              de desde B, $\tfrac32 a$. El brazo es la distancia de la
              resultante a la sección.
          - valor: '2'
            mensaje: |
              Es la reacción de A por $2a$, sin la carga. La carga de AB está
              a la izquierda de B y cuenta: resta $q_0a\cdot\tfrac32 a$.
          - valor: '-0.5'
            mensaje: |
              El valor es ese, pero el signo no. Por la izquierda de B el
              horario cuenta positivo: la reacción de A, hacia arriba, gira en
              sentido horario respecto de B y suma; la carga resta, pero
              menos. AB se comba hacia abajo y tracciona la fibra de abajo.
          - valor: '1'
            mensaje: |
              Has medido los brazos a lo largo de BC. Para fuerzas verticales
              cuenta la distancia horizontal: $a$ para $R_C$ y
              $\tfrac{a}{2}$ para P.
        pista: |
          Por la izquierda de B: la reacción de A, $q_0a$ hacia arriba, con
          brazo $2a$, y la carga, $q_0a$ hacia abajo, con brazo $\tfrac32 a$.
          O por la derecha, con P y $R_C$.
        desarrollo: |
          $$
          M_B = q_0a\cdot 2a - q_0a\cdot\frac32\,a = \frac12\,q_0a^{2}
          $$

          Por la derecha sale lo mismo: $R_C$ con brazo horizontal $a$ y P
          con $\tfrac{a}{2}$, $q_0a\cdot a - q_0a\cdot\tfrac{a}{2}$.

      - tipo: calcular
        titulo: El axil de BC entre P y C
        pregunta: |
          Entre el punto de P y C, ¿cuánto vale el axil de BC, en unidades de
          $q_0a$, con su signo?
        respuesta:
          tipo: numero
          valor: '-0.866'
          tolerancia: 0.005
          formato: un número con su signo, el axil dividido entre q0a
        distractores:
          - valor: '-0.5'
            mensaje: |
              Has proyectado $R_C$ con el coseno de 60°. La barra forma 60° con
              la horizontal, y por tanto 30° con la vertical: la parte de una
              fuerza vertical que va según la barra es
              $R_C\cos 30^{\circ} = R_C\operatorname{sen}60^{\circ}$.
          - valor: '0.866'
            mensaje: |
              El valor es ese, pero el signo no. $R_C$ empuja hacia arriba el
              extremo de abajo de la barra: la comprime.
          - valor: '-1'
            mensaje: |
              Es la reacción entera. Solo su componente según la barra es
              axil; la otra es cortante.
        pista: |
          Por la derecha de la sección solo está $R_C = q_0a$, vertical.
          Proyéctala sobre la barra, que forma 30° con la vertical.
        desarrollo: |
          $$
          N = -R_C\cos 30^{\circ} = -\frac{\sqrt{3}}{2}\,q_0a = -0{,}866\,q_0a
          $$

          Entre B y P, en cambio, a la derecha de la sección están P y
          $R_C$, iguales y contrarias: el axil y la cortante son cero, y el
          flector es constante.

      - tipo: calcular
        titulo: La cortante de BC entre P y C
        pregunta: |
          ¿Y la cortante en ese tramo, en unidades de $q_0a$, con su signo?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.005
          formato: un número con su signo, la cortante dividida entre q0a
        distractores:
          - valor: '-0.866'
            mensaje: |
              Has proyectado con el ángulo cambiado: la componente de $R_C$
              perpendicular a la barra es $R_C\operatorname{sen}30^{\circ}$,
              porque la barra está a 30° de la vertical.
          - valor: '0.5'
            mensaje: |
              El valor es ese, pero el signo no. En BC, $+y$ es $x$ girada 90°
              en sentido horario: apunta hacia abajo y a la izquierda. Con la
              parte de la derecha, la cortante es la componente de sus fuerzas
              según $+y$, y $R_C$, hacia arriba, la tiene negativa.
          - valor: '-1'
            mensaje: |
              Es la reacción entera. Solo su componente perpendicular a la
              barra es cortante, $R_C\operatorname{sen}30^{\circ}$.
        pista: |
          Proyecta $R_C$ sobre la perpendicular a la barra. Con la parte de la
          derecha, la cortante es la componente de sus fuerzas según $+y$.
        desarrollo: |
          Con $x = (\cos 60^{\circ},\ -\operatorname{sen}60^{\circ})$ e
          $y = (-\operatorname{sen}60^{\circ},\ -\cos 60^{\circ})$, y $R_C$
          vertical hacia arriba:

          $$
          T = R_C\,(-\cos 60^{\circ}) = -\frac12\,q_0a
          $$

          Comprobación: de P a C el flector baja de $\tfrac12 q_0a^{2}$ a
          cero en una longitud $a$, con pendiente $-\tfrac12 q_0a$, que es
          la cortante (ec. 7.15).

      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de axiles, de cortantes y de flectores**
          de AB y de BC, dibujados sobre la pieza, con los valores en A, en el
          final de la carga, en B, en el punto de P y en C.
        comprueba:
          - punto: |
              **Axiles**: cero en AB y entre B y P; $-\tfrac{\sqrt{3}}{2}q_0a$
              de P a C.
            porque: |
              Todas las fuerzas son verticales y AB es horizontal: ninguna
              tiene componente según AB. En BC, de B a P lo de la derecha (P y
              $R_C$) se anula, y de P a C solo queda $R_C$, que comprime.
          - punto: |
              **Cortantes**: en AB, $q_0a$ en A, recta hasta cero en $x = a$ y
              cero hasta B; en BC, cero de B a P y $-\tfrac12 q_0a$ de P a C.
            porque: |
              $dT/dx = -q$ (ec. 7.14) en AB. En BC, la cortante es la
              componente perpendicular a la barra de lo que hay a la derecha.
          - punto: |
              **Flectores**: en AB, parábola de cero en A a
              $\tfrac12 q_0a^{2}$ en $x = a$, con tangente horizontal, y
              constante hasta B; en BC, $\tfrac12 q_0a^{2}$ constante hasta P
              y recta hasta cero en C. En B el flector pasa de un tramo al
              otro sin cambiar.
            porque: |
              $dM/dx = T$ (ec. 7.15): tangente horizontal y valor constante
              donde la cortante es cero. B es un nudo rígido sin par aplicado,
              y C, un apoyo del extremo.
        figura: |
          <svg viewBox="0 0 340 480" role="img" width="340" height="480" aria-labelledby="ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60-dib-t ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60-dib-d">
          <title id="ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60-dib-t">Los diagramas de axiles, cortantes y flectores del sistema ABC, dibujados sobre la pieza</title>
          <desc id="ejerm7-cl7-4-el-portico-quebrado-con-el-tramo-a-60-dib-d">Tres dibujos de la pieza ABC, uno por esfuerzo, con cada valor llevado en perpendicular a la barra, positivos hacia arriba en AB y hacia arriba a la derecha en BC. Axiles: cero en AB y en la mitad de BC que va de B a la carga P; de P a C, −√3q0a/2, compresión. Cortantes: en AB, q0a en A, baja en recta hasta cero en x = a y sigue en cero hasta B; en BC, cero de B a P y −q0a/2 de P a C. Flectores: en AB, parábola de cero en A a q0a²/2 en x = a, con tangente horizontal, y constante hasta B; en BC, q0a²/2 constante hasta P y recta hasta cero en C.</desc>
