ejercicios:
  # ── Ejemplo introductorio nuestro · el giro y la flecha de la punta de un voladizo, con la viga conjugada.
  - id: ejerm10-el-giro-y-la-flecha-del-voladizo
    titulo: La viga con voladizo y la carga en la punta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      La viga ABC de la figura tiene un apoyo fijo en A y un apoyo móvil en
      B, a 2 m de A, y sigue en voladizo 1 m más, hasta su extremo C, donde
      lleva una fuerza $P = 10$ kN hacia abajo. Su rigidez a flexión es $EI_z = 2000$ kN·m²
      en toda la longitud (por ejemplo, $E = 200$ GPa e $I_z = 1000$ cm⁴).

      Con el convenio del curso ($v$ positiva hacia abajo, $\theta$ positivo
      en sentido horario) y por el método de la viga conjugada, determinar
      el giro y la flecha del extremo C.

