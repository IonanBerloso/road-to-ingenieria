    pide: >-
      El giro de C, en milésimas de radián, y su flecha, en mm, los dos con
      su signo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué enlaces tiene la viga conjugada de esta viga en A, en B y en C?
        opciones:
          - texto: 'Un apoyo en A, una rótula sin apoyo en B y un empotramiento en C'
            correcta: true
            mensaje: |
              Eso es. En A, $v = 0$ y el giro es libre: en la conjugada,
              $M^{*} = 0$ y $T^{*}$ libre, un apoyo. B es un apoyo intermedio:
              $v = 0$ y el mismo giro a los dos lados, es decir, $M^{*} = 0$ y
              $T^{*}$ continua, que es una rótula sin apoyo. C es libre: gira y
              baja, así que $T^{*} \neq 0$ y $M^{*} \neq 0$, y eso lo da un
              empotramiento (apuntes, figura 10.9, pp. 12 y 13).
          - texto: 'Los mismos que la real: un apoyo en A, otro en B y C libre'
            mensaje: |
              Con C libre en la conjugada, $T^{*}_{C} = 0$ y $M^{*}_{C} = 0$:
              la punta del voladizo ni giraría ni bajaría. Los enlaces de la
              conjugada tienen que dar en $T^{*}$ y $M^{*}$ lo que se sabe de
              $\theta$ y $v$, y un extremo libre gira y baja: en la conjugada
              es un empotramiento.
          - texto: 'Un apoyo en A, un apoyo en B y un empotramiento en C'
            mensaje: |
              A y C están bien; B no. Un apoyo intermedio de la real fija
              $v = 0$, que en la conjugada es $M^{*} = 0$, pero deja el giro
              igual a los dos lados, así que $T^{*}$ no salta: no hay reacción.
              Es una rótula sin apoyo. Con un apoyo en B, la conjugada saldría
              hiperestática, y la de una viga isostática es isostática.
          - texto: 'Un empotramiento en A, una rótula sin apoyo en B y C libre'
            mensaje: |
              B está bien, pero A y C están cambiados. El apoyo de un extremo
              se queda como está: $v = 0$ y giro libre dan $M^{*} = 0$ y
              $T^{*}$ libre. Lo que se intercambia es el empotramiento con el
              extremo libre, y aquí el libre es C: en la conjugada, C es el
              empotramiento.

      - tipo: calcular
        titulo: El giro de la punta
        pregunta: |
          ¿Cuánto gira el extremo C, en milésimas de radián ($10^{-3}$ rad),
          con su signo?
        respuesta:
          tipo: numero
          valor: '5.8333'
          tolerancia: 0.01
          formato: un número con su signo, en milésimas de radián
        distractores:
          - valor: '2.5'
            mensaje: |
              Es $Pb^{2}/2EI_z$, el giro de la punta de un voladizo empotrado
              en B. Pero B no está empotrado: es un apoyo y gira, porque el
              flector $-Pb$ que le llega curva todo el tramo AB. En la
              conjugada, esa es la carga $q^{*}$ de AB, que pasa por la rótula
              y le da a B un $T^{*}_{B} = 20/3EI_z$: faltan
              $3{,}333\cdot10^{-3}$ rad.
          - valor: '3.3333'
            mensaje: |
              Es el giro de B, $\theta_B = T^{*}_{B} = 20/3EI_z$. Entre B y C
              el voladizo sigue girando: la carga $q^{*}$ de BC, de resultante
              $5/EI_z$, suma $2{,}5\cdot10^{-3}$ rad más.
          - valor: '4.1667'
            mensaje: |
              Has dado a B el giro $Pab/6EI_z = 1{,}667\cdot10^{-3}$ rad. En
              una biapoyada con un par $M_0$ en un extremo, ese extremo gira
              $M_0 a/3EI_z$ y el otro $M_0 a/6EI_z$; el par $Pb$ está en B,
              así que $\theta_B = Pab/3EI_z$. En la conjugada se ve igual: de
              la carga de AB, la rótula B se lleva dos tercios, no uno.
          - valor: '-5.8333'
            mensaje: |
              El valor es ese; el signo, no. El flector es negativo en toda la
              viga, así que $q^{*} = M/EI_z$ va hacia arriba, y $T^{*}$, la
              suma de las fuerzas hacia arriba que hay a la izquierda, sale
              positivo. C gira en sentido horario: la punta baja hacia la
              derecha.
        pista: |
          $\theta_C = T^{*}_{C}$, la suma de las fuerzas hacia arriba que hay
          a la izquierda de C en la conjugada: la reacción de A y toda la
          carga $q^{*}$.
        desarrollo: |
          El flector es $M = -5x$ en AB y $M = -10(3 - x)$ en BC, en kN·m.
          La carga $q^{*} = M/EI_z$ va hacia arriba: en AB, un triángulo de
          resultante $10/EI_z$ a $4/3$ m de A; en BC, otro de resultante
          $5/EI_z$ a $1/3$ m de B. Con $M^{*}_{B} = 0$ en la rótula, la
          reacción de A es $-10/3EI_z$ (hacia abajo), y

          $$
          T^{*}_{C} = -\frac{10}{3EI_z} + \frac{10}{EI_z} + \frac{5}{EI_z} = \frac{35}{3EI_z}
          $$

          $$
          \theta_C = \frac{35}{3 \cdot 2000} = 5{,}833\cdot10^{-3}\ \text{rad}
          $$

      - tipo: calcular
        titulo: La flecha de la punta
        pregunta: |
          ¿Cuánto baja el extremo C, en mm, con su signo?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número con su signo, en mm
        distractores:
          - valor: '1.6667'
            mensaje: |
              Es $Pb^{3}/3EI_z$, la flecha de un voladizo empotrado en B. Pero
              B gira $3{,}333\cdot10^{-3}$ rad, y con ese giro el voladizo
              baja además $\theta_B\,b = 3{,}333$ mm, como un sólido rígido.
          - valor: '3.3333'
            mensaje: |
              Es lo que baja C por el giro de B, $\theta_B\,b$, sin la flexión
              del propio voladizo, que añade $Pb^{3}/3EI_z = 1{,}667$ mm. El
              mismo número sale si se toma $\theta_B = Pab/6EI_z$, el
              coeficiente del extremo lejano, y se suma la flexión:
              $1{,}667 + 1{,}667 = 3{,}333$ mm. Con $\theta_B = Pab/3EI_z$ y
              la flexión, $3{,}333 + 1{,}667 = 5$ mm.
          - valor: '5.8333'
            mensaje: |
              Es $\theta_C\,b$: el giro de la punta por el brazo, como si todo
              el voladizo girara lo que gira C. El giro crece de B a C, y lo
              que baja C es $M^{*}_{C}$ en la conjugada: el momento de las
              cargas, no la última cortante por la luz.
          - valor: '-5'
            mensaje: |
              El valor es ese; el signo, no. $M^{*}_{C}$ sale positivo, y con
              el convenio del curso una flecha positiva es hacia abajo: la
              punta de un voladizo cargado hacia abajo baja.
        pista: |
          $v_C = M^{*}_{C}$: la suma de los momentos respecto de C, con el
          horario positivo, de todo lo que hay a su izquierda en la conjugada.
        desarrollo: |
          Respecto de C, la reacción de A está a 3 m, la carga de AB a
          $3 - 4/3 = 5/3$ m y la de BC a $2/3$ m. Las fuerzas hacia arriba a
          la izquierda giran en sentido horario:

          $$
          M^{*}_{C} = -\frac{10}{3EI_z}\cdot 3 + \frac{10}{EI_z}\cdot\frac{5}{3} + \frac{5}{EI_z}\cdot\frac{2}{3} = \frac{10}{EI_z}
          $$

          $$
          v_C = \frac{10}{2000} = 0{,}005\ \text{m} = 5\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Equilibrio: $R_A = -5$ kN, hacia abajo, y $R_B = 15$ kN. El flector es $M = -5x$ en AB y $M = -10(3 - x)$ en BC, con $M_B = -10$ kN·m.'
          - texto: 'La conjugada tiene un apoyo en A, una rótula sin apoyo en B y un empotramiento en C, y se carga con $q^{*} = M/EI_z$, hacia arriba porque $M$ es negativo.'
          - texto: 'En AB la carga es un triángulo de resultante $10/EI_z$ a $4/3$ m de A. Como $M^{*}_{B} = 0$ en la rótula, la reacción de A es $-10/3EI_z$ y $T^{*}_{B} = 20/3EI_z$.'
          - texto: 'Con la carga de BC, de resultante $5/EI_z$: $T^{*}_{C} = 35/3EI_z$ y $M^{*}_{C} = 10/EI_z$, que con $EI_z = 2000$ kN·m² son $\theta_C = 5{,}833\cdot10^{-3}$ rad y $v_C = 5$ mm.'
          - texto: 'C es un extremo libre, así que en la conjugada también: $T^{*}_{C} = 0$ y $M^{*}_{C} = 0$, y C ni gira ni baja.'
            trampa: true
            mensaje: |
              Eso es copiar el enlace de la real. Un extremo libre gira y
              baja, $\theta \neq 0$ y $v \neq 0$; en la conjugada,
              $T^{*} \neq 0$ y $M^{*} \neq 0$, que es lo que da un
              empotramiento.
    resolucion: |
      **Reacciones y flector.** Momentos respecto de B, con el horario
      positivo: $R_A$, a 2 m a la izquierda, y $P$, a 1 m a la derecha,
      dan $2R_A + 10 \cdot 1 = 0$, así que $R_A = -5$ kN: hacia abajo. En
      vertical, $R_B = 10 + 5 = 15$ kN. Con el convenio del tema 7, $M$ es
      la suma de los momentos horarios de lo que hay a la izquierda:

      $$
      M = -5x \quad (0 \le x \le 2), \qquad M = -10\,(3 - x) \quad (2 \le x \le 3)
      $$

      en kN·m, con $M_B = -10$ kN·m. Es negativo en toda la viga: tracciona
      la fibra de arriba.

      **La conjugada.** Cada enlace cambia según lo que se sabe de la real
      (apuntes, figura 10.9, pp. 12 y 13). En A, $v = 0$ y $\theta$ libre:
      apoyo. En B, apoyo intermedio, $v = 0$ y el mismo giro a los dos
      lados: rótula sin apoyo. En C, libre, $v$ y $\theta$ libres:
      empotramiento. Se carga con $q^{*} = M/EI_z$, que aquí es negativa:
      **hacia arriba**. En AB es un triángulo que va de 0 en A a $10/EI_z$
      en B, de resultante $10/EI_z$ a $4/3$ m de A; en BC, otro que va de
      $10/EI_z$ en B a 0 en C, de resultante $5/EI_z$ a $1/3$ m de B.

      **El tramo AB.** Va de un apoyo a una rótula, y en la rótula
      $M^{*}_{B} = 0$. Con $R^{*}_{A}$ la reacción de A, positiva hacia
      arriba:

      $$
      2R^{*}_{A} + \frac{10}{EI_z}\left(2 - \frac{4}{3}\right) = 0
      \quad\Longrightarrow\quad
      R^{*}_{A} = -\frac{10}{3EI_z}
      $$

      Es el giro de A: $\theta_A = -1{,}667\cdot10^{-3}$ rad, antihorario,
      porque el voladizo levanta el tramo AB. En B,

      $$
      \theta_B = T^{*}_{B} = -\frac{10}{3EI_z} + \frac{10}{EI_z} = \frac{20}{3EI_z}
      $$

      **De B a C.** Se suma la carga de BC:

      $$
      \theta_C = T^{*}_{C} = \frac{20}{3EI_z} + \frac{5}{EI_z} = \frac{35}{3EI_z}
      $$

      $$
      v_C = M^{*}_{C} = -\frac{10}{3EI_z}\cdot 3 + \frac{10}{EI_z}\cdot\frac{5}{3} + \frac{5}{EI_z}\cdot\frac{2}{3} = \frac{10}{EI_z}
      $$

      Con $EI_z = 2000$ kN·m², las cargas $q^{*}$ en m⁻¹ dan giros en
      radianes y flechas en metros:

      $$
      \theta_C = \frac{35}{3 \cdot 2000} = 5{,}833\cdot10^{-3}\ \text{rad},
      \qquad
      v_C = \frac{10}{2000} = 0{,}005\ \text{m} = 5\ \text{mm}
      $$

      Los dos positivos: la punta gira en sentido horario y baja.

      **Por otro camino.** Superponiendo la tabla de vigas elementales. El
      par $Pb = 10$ kN·m que el voladizo deja en B hace girar ese extremo
      de la biapoyada AB $\theta_B = Pb\,a/3EI_z = 20/6000$, que son
      $3{,}333\cdot10^{-3}$ rad. Sobre ese giro, el voladizo BC se flecta como
      uno empotrado en B:

      $$
      \theta_C = \theta_B + \frac{Pb^{2}}{2EI_z} = (3{,}333 + 2{,}5)\cdot10^{-3} = 5{,}833\cdot10^{-3}\ \text{rad}
      $$

      $$
      v_C = \theta_B\,b + \frac{Pb^{3}}{3EI_z} = 3{,}333 + 1{,}667 = 5\ \text{mm}
      $$

      Y la elástica de AB sube: el giro se anula en $x = a/\sqrt{3} = 1{,}155$
      m, donde la viga está $1{,}283$ mm por encima de su posición.
