ejercicios:
  - id: ejerm6-tresca-con-la-tercera-nula
    titulo: Tresca y Von Mises en tensión plana, sin olvidar la tercera principal
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un punto de la superficie libre de una pieza de acero dúctil, con
      límite elástico $\sigma_e = 240\ \text{MPa}$, las dos tensiones
      principales del plano de la superficie valen $120\ \text{MPa}$ y
      $40\ \text{MPa}$, las dos de tracción. La superficie está libre: no hay
      tensión perpendicular a ella.

      Calcular el factor de seguridad según el criterio de Tresca y según el
      de Von Mises.
    pide: El factor de seguridad de Tresca y el de Von Mises.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son las tres tensiones principales, ordenadas
          $\sigma_1 \ge \sigma_2 \ge \sigma_3$?
        opciones:
          - texto: $\sigma_1 = 120$, $\sigma_2 = 40$ y $\sigma_3 = 0$ MPa
            correcta: true
            mensaje: |
              Eso es. La cara libre es un plano principal con tensión nula, y
              como las otras dos son de tracción, el cero es la menor:
              $\sigma_3 = 0$.
          - texto: $\sigma_1 = 120$ y $\sigma_3 = 40$ MPa; en tensión plana solo hay dos
            mensaje: |
              En tensión plana hay tres principales, y una es cero. Con las dos
              del plano de tracción, el cero es la menor y es $\sigma_3$; el 40
              es $\sigma_2$. Olvidarlo es el error que cambia Tresca.
          - texto: $\sigma_1 = 0$, $\sigma_2 = 40$ y $\sigma_3 = 120$ MPa
            mensaje: |
              El orden es de mayor a menor con su signo: $\sigma_1$ es la
              mayor, 120, y $\sigma_3$ la menor, 0.

      - tipo: calcular
        titulo: El factor de seguridad de Tresca
        pregunta: |
          ¿Cuánto vale el factor de seguridad según Tresca?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, sin unidades
        distractores:
          - valor: '3'
            mensaje: |
              Has hecho $\sigma_{eqv} = 120 - 40 = 80$, con las dos del plano.
              Tresca es $\sigma_1 - \sigma_3$, y aquí $\sigma_3 = 0$: el círculo
              de Mohr mayor es el que va de 0 a 120, no el de 40 a 120.
          - valor: '4'
            mensaje: |
              Has dividido $\sigma_e$ entre la tangencial máxima,
              $\tau_{\max} = 60$. En Tresca la tensión equivalente es el doble:
              $\sigma_{eqv} = 2\,\tau_{\max} = \sigma_1 - \sigma_3 = 120$.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$, con las tres principales,
          incluida la nula.
        desarrollo: |
          $$
          \sigma_{eqv} = \sigma_1 - \sigma_3 = 120 - 0 = 120\ \text{MPa}
          \qquad
          SF = \frac{\sigma_e}{\sigma_{eqv}} = \frac{240}{120} = 2
          $$

      - tipo: calcular
        titulo: El factor de seguridad de Von Mises
        pregunta: |
          ¿Cuánto vale el factor de seguridad según Von Mises?
        respuesta:
          tipo: numero
          valor: '2.2678'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '1.8974'
            mensaje: |
              Has hecho $\sqrt{\sigma_1^{2} + \sigma_2^{2}}$ y te has dejado
              el producto cruzado. En tensión plana es
              $\sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$.
          - valor: '1.6641'
            mensaje: |
              El producto va restando: $\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}$.
              Con el signo más, la tracción en una dirección empeora la otra, y
              es al revés: dos tracciones del mismo signo distorsionan menos que
              una sola.
        pista: |
          Con $\sigma_3 = 0$, $\sigma_{eqv} = \sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$.
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{120^{2} - 120 \cdot 40 + 40^{2}} = \sqrt{11\,200} = 105{,}83\ \text{MPa}
          \qquad
          SF = \frac{240}{105{,}83} = 2{,}27
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: La cara libre es un plano principal sin tensión, así que las principales son 120, 40 y 0 MPa, y $\sigma_3 = 0$.
          - texto: 'Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3 = 120$ MPa y $SF = 240/120 = 2$.'
          - texto: 'Von Mises: $\sigma_{eqv} = \sqrt{120^{2} - 120 \cdot 40 + 40^{2}} = 105{,}8$ MPa y $SF = 2{,}27$.'
          - texto: Tresca da el factor menor porque su hexágono queda dentro de la elipse de Von Mises; es el criterio del lado de la seguridad.
          - texto: 'Tresca: $\sigma_{eqv} = 120 - 40 = 80$ MPa, la diferencia de las dos tensiones del plano.'
            trampa: true
            mensaje: |
              Con las dos del plano del mismo signo, el círculo de Mohr mayor
              pasa por la tercera, la nula. La diferencia que cuenta es
              $\sigma_1 - \sigma_3 = 120 - 0$.
    resolucion: |
      **Las tres principales.** La superficie libre no tiene tensiones, así
      que su normal es una dirección principal con tensión nula. Ordenadas:
      $\sigma_1 = 120$, $\sigma_2 = 40$ y $\sigma_3 = 0$ MPa.

      **Tresca.** La tensión equivalente es la diferencia entre la mayor y la
      menor, el diámetro del círculo de Mohr mayor:

      $$
      \sigma_{eqv} = \sigma_1 - \sigma_3 = 120\ \text{MPa}
      \qquad
      SF = \frac{240}{120} = 2
      $$

      **Von Mises.** Con la forma general, que no necesita saber cuál es la
      nula,

      $$
      \sigma_{eqv} = \frac{1}{\sqrt2}\sqrt{(120 - 40)^{2} + (40 - 0)^{2} + (0 - 120)^{2}} = \sqrt{11\,200} = 105{,}83\ \text{MPa}
      $$

      que es lo mismo que $\sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$
      con las dos del plano. El factor de seguridad es $240/105{,}83 = 2{,}27$.

      **Los dos juntos.** Tresca da un factor menor, 2 frente a 2,27: su
      hexágono queda dentro de la elipse de Von Mises y es el más
      conservador. Los dos dicen que el punto aguanta.
  # ── Cuestión 1 de autoevaluación del tema 6 · el concepto de tensión equivalente.
  - id: ejerm6-cu1-la-tension-equivalente
    titulo: La tensión equivalente de un estado de tensión
    fuente: >-
      Cuestión 1 de autoevaluación · Tema 6, «Criterios de fallo» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 6,
      apartado 6.1 (pp. 3-4, ec. 6.1), y los apartados 6.2 a 6.6 (ecs. 6.3 a
      6.29, pp. 4 a 11). Se parece al principio de la pregunta 3 de teoría
      del primer parcial de 2014-2015, «Criterios de fallo. Criterio de
      Mohr.», que en R se resuelve empezando por lo que es un criterio de
      fallo y repasando los cinco; esta pide solo el concepto. El ejemplo es
      nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    enunciado: |
      1. Concepto de tensión equivalente.
    pide: >-
      Qué es la tensión equivalente, de dónde sale y para qué se usa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un mismo estado de tensión, con sus tres principales, ¿tiene una
          sola tensión equivalente?
        opciones:
          - texto: >-
              No: cada criterio de fallo da la suya, porque cada uno decide qué
              hace igual de peligrosos el estado del punto y un ensayo de
              tracción
            correcta: true
            mensaje: |
              Eso es (apuntes, p. 3). Todos los criterios cambian el estado por
              uno uniaxial equivalente, pero cada uno con su hipótesis: la
              mayor tensión normal (Rankine), la mayor deformación
              (Saint-Venant), la recta intrínseca (Mohr), la mayor tangencial
              (Tresca) o la energía de distorsión (Von Mises). Por eso
              $\sigma_{eqv}$ va siempre con el nombre de su criterio.
          - texto: >-
              Sí: es una propiedad del estado de tensión, como sus tensiones
              principales
            mensaje: |
              Las principales son del estado; $\sigma_{eqv}$ es del estado y de
              una hipótesis sobre cómo falla el material. Con las mismas
              principales, Tresca y Von Mises dan números distintos.
          - texto: >-
              Sí: es siempre la mayor tensión principal, $\sigma_1$
            mensaje: |
              Esa es la de Rankine cuando $\sigma_1$ es la de mayor módulo
              (ec. 6.3), y solo la de Rankine. Tresca, por ejemplo, usa
              $\sigma_1 - \sigma_3$, que con una $\sigma_3$ de compresión es
              mayor que $\sigma_1$.
          - texto: >-
              Sí: es la media de las tres principales
            mensaje: |
              La media, $(\sigma_1 + \sigma_2 + \sigma_3)/3$, es la parte
              hidrostática del estado, y en Tresca y en Von Mises ni siquiera
              cuenta: una presión igual en todas las direcciones no hace
              deslizar planos ni distorsiona. No es la tensión equivalente de
              ningún criterio del curso.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica el concepto como en un examen: qué problema resuelve, qué
          es la tensión equivalente, cómo se usa y cómo la da cada criterio.
        rubrica:
          - punto: >-
              El ensayo de tracción da el límite elástico σe, pero en un estado
              general de tensión no se sabe con qué combinación de tensiones
              principales llega el fallo.
            porque: >-
              Es la pregunta de la que parte el tema (apuntes, p. 3), y la que
              la tensión equivalente responde.
            minimo: true
          - punto: >-
              Los criterios de fallo equiparan el estado general a uno uniaxial
              equivalente: la tensión equivalente σeqv es la de tracción simple
              que, según el criterio, está igual de cerca del fallo que el
              estado dado.
            porque: >-
              Es la definición: lo que tienen en común todos los criterios.
            minimo: true
          - punto: >-
              σeqv se compara con el límite del ensayo uniaxial: si
              σeqv < σe, no hay fallo.
            porque: >-
              Es para lo que se define: el ensayo de tracción es lo único que
              se mide.
            minimo: true
          - punto: >-
              Cada criterio de fallo da la suya, según qué decida el fallo; por
              ejemplo, σ1 − σ3 en Tresca (ec. 6.19).
            porque: >-
              Es lo que diferencia un criterio de otro, y lo que hace que un
              mismo estado tenga varias tensiones equivalentes.
            minimo: true
          - punto: >-
              Las de los cinco criterios del tema: |σmax| en Rankine (ec. 6.3),
              E|εmax| en Saint-Venant (ec. 6.6), σ1 − kσ3 en Mohr (ec. 6.15),
              σ1 − σ3 en Tresca (ec. 6.19) y la de la energía de distorsión en
              Von Mises (ec. 6.29).
            porque: >-
              El concepto no las pide todas, pero escribirlas muestra que se
              sabe de dónde sale cada una.
          - punto: >-
              Con ella se define el factor de seguridad, SF = σe/σeqv (ec. 6.1,
              p. 4), que dice cuán lejos está el fallo.
            porque: >-
              Es el número que se pide en casi todos los problemas del tema.
      - tipo: calcular
        titulo: La tensión equivalente de Tresca
        pregunta: |
          Un ejemplo nuestro: en un punto de una pieza de acero las tres
          tensiones principales son 100, 50 y −20 MPa. ¿Cuánto vale su
          tensión equivalente según Tresca, en MPa?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Has restado las dos mayores. Tresca resta la mayor y la menor, con
              su signo: el círculo de Mohr mayor va de $-20$ a 100.
          - valor: '60'
            mensaje: |
              Es la tangencial máxima, $\tfrac12(\sigma_1 - \sigma_3)$. La
              tensión equivalente es la de tracción simple con esa misma
              tangencial máxima, que es el doble (ecs. 6.17 a 6.19).
          - valor: '80'
            mensaje: |
              Has restado 20 sin su signo: $\sigma_3 = -20$ MPa, y
              $\sigma_1 - \sigma_3 = 100 - (-20)$.
        pista: |
          Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19), con las
          principales ordenadas $\sigma_1 \ge \sigma_2 \ge \sigma_3$.
        desarrollo: |
          $$
          \sigma_{eqv} = \sigma_1 - \sigma_3 = 100 - (-20) = 120
          $$

          en MPa.
      - tipo: calcular
        titulo: La tensión equivalente de Von Mises
        pregunta: |
          Con el mismo estado, ¿cuánto vale la tensión equivalente según Von
          Mises, en MPa?
        respuesta:
          tipo: numero
          valor: '104.40'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '147.65'
            mensaje: |
              Te has dejado el $1/\sqrt2$ de la ec. 6.29: la raíz de la suma de
              los tres cuadrados hay que dividirla por $\sqrt2$.
          - valor: '113.58'
            mensaje: |
              Has hecho $\sqrt{\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2}}$, sin
              los productos cruzados. Desarrollada, la ec. 6.29 es
              $\sqrt{\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2} - \sigma_1\sigma_2 - \sigma_2\sigma_3 - \sigma_3\sigma_1}$.
          - valor: '70'
            mensaje: |
              Has tomado $\sigma_3$ como $+20$: las diferencias serían 50, 30 y
              80. Con $\sigma_3 = -20$ MPa son 50, 70 y 120.
        pista: |
          Ec. 6.29:
          $\sigma_{eqv} = \tfrac{1}{\sqrt2}\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$.
        desarrollo: |
          Las diferencias son $100 - 50 = 50$, $50 - (-20) = 70$ y
          $-20 - 100 = -120$:

          $$
          \sigma_{eqv} = \frac{1}{\sqrt2}\sqrt{50^{2} + 70^{2} + 120^{2}} = 104{,}40
          $$

          en MPa.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Del ensayo de tracción solo se conoce el límite elástico
              $\sigma_e$, el de un estado uniaxial.
          - texto: >-
              Un criterio de fallo elige qué decide el fallo: la mayor tensión
              normal, la mayor deformación, la mayor tangencial, la energía de
              distorsión…
          - texto: >-
              La tensión equivalente $\sigma_{eqv}$ es la de tracción simple
              que, según ese criterio, está igual de cerca del fallo que el
              estado del punto.
          - texto: >-
              No hay fallo mientras $\sigma_{eqv} < \sigma_e$, y el factor de
              seguridad es $SF = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
          - texto: >-
              La tensión equivalente es la misma con cualquier criterio, porque
              solo depende de las tensiones principales del punto.
            trampa: true
            mensaje: |
              Depende también del criterio: con las principales 100, 50 y
              −20 MPa, Rankine da 100, Tresca 120 y Von Mises 104,4 MPa. Cada
              criterio es una hipótesis distinta sobre cómo falla el material.
    resolucion: |
      **El problema** (apuntes del tema 6, apartado 6.1, p. 3). Del ensayo
      de tracción se obtiene el límite elástico $\sigma_e$. En un estado
      general de tensión no se sabe para qué combinación de tensiones
      principales llega el material a su estado de fallo.

      **La tensión equivalente.** Todos los criterios de fallo tienen algo
      en común: equiparan el estado general de tensión a uno uniaxial
      equivalente, de tensión $\sigma_{eqv}$, y la comparan con el límite
      elástico del ensayo uniaxial. Si $\sigma_{eqv} < \sigma_e$, no hay
      fallo. Lo que cambia de un criterio a otro es qué hace equivalentes
      los dos estados:

      | criterio | lo que decide el fallo | $\sigma_{eqv}$ |
      |---|---|---|
      | Rankine | la mayor tensión normal | $\lvert\sigma_{max}\rvert$ (ec. 6.3) |
      | Saint-Venant | la mayor deformación | $E\,\lvert\varepsilon_{max}\rvert$ (ec. 6.6) |
      | Mohr | la recta intrínseca | $\sigma_1 - k\,\sigma_3$ (ec. 6.15) |
      | Tresca | la mayor tangencial | $\sigma_1 - \sigma_3$ (ec. 6.19) |
      | Von Mises | la energía de distorsión | ec. 6.29 |

      Con ella se define el factor de seguridad (ec. 6.1, p. 4), que los
      apuntes escriben $SF = \sigma_e/\sigma_{eqv}$; las diapositivas lo
      dicen con su letra para el límite: $FS = \sigma_L/\sigma_{eq}$, y hay
      fallo cuando $\sigma_{eq} = \sigma_L$.

      **Un ejemplo nuestro.** Con las principales 100, 50 y −20 MPa, el
      mismo punto tiene cuatro tensiones equivalentes distintas: 100 MPa
      con Rankine; 91 MPa con Saint-Venant y $\nu$ = 0,3
      ($100 - 0{,}3\cdot30 = 91$); 120 MPa con Tresca; y con Von Mises

      $$
      \sigma_{eqv} = \frac{1}{\sqrt2}\sqrt{50^{2} + 70^{2} + 120^{2}} = 104{,}40
      $$

      en MPa. Cuál vale depende del material: para un acero, dúctil, Tresca
      o Von Mises.

      **Comprobaciones.** Las cuatro salen igual con el motor del curso y a
      mano: Von Mises, además, con la forma desarrollada,
      $\sqrt{\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2} - \sigma_1\sigma_2 - \sigma_2\sigma_3 - \sigma_3\sigma_1}$.

  # ── Cuestión 2 de autoevaluación del tema 6 · Rankine.
  - id: ejerm6-cu2-el-criterio-de-rankine
    titulo: El criterio de la tensión máxima (Rankine)
    fuente: >-
      Cuestión 2 de autoevaluación · Tema 6, «Criterios de fallo» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 6,
      apartado 6.2 (pp. 4-5, ecs. 6.3 a 6.5). Se parece a una parte de la
      pregunta 3 de teoría del primer parcial de 2014-2015, «Criterios de
      fallo. Criterio de Mohr.», que en R se resuelve con este criterio en
      una fila de una tabla, junto a los demás; esta lo pide solo, con los
      dos límites. La ec. 6.5 se lee con signo: ver la resolución. El
      ejemplo es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    enunciado: |
      2. Criterio de tensión máxima.
    pide: >-
      En qué consiste el criterio, su tensión equivalente con un límite o
      con dos, y a qué materiales se aplica.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el criterio de tensión máxima, con un límite a tracción
          $\sigma_{et}$ y otro a compresión $\sigma_{ec}$, ¿qué tensión se
          compara, y con qué límite?
        opciones:
          - texto: >-
              La principal de mayor valor absoluto, con el límite de su signo:
              $\sigma_{et}$ si es de tracción, $\sigma_{ec}$ si es de compresión
            correcta: true
            mensaje: |
              Eso es (ecs. 6.3 a 6.5): $\sigma_{eqv} = |\sigma_{max}|$, con
              $|\sigma_{max}| = \max(|\sigma_1|, |\sigma_2|, |\sigma_3|)$, y el
              límite según el signo de $\sigma_{max}$. Si hay principales de
              los dos signos, mira también la otra con su límite: la 6.5 solo
              mira una (ver la resolución).
          - texto: >-
              $\sigma_1$, la mayor de las tres con su signo, con $\sigma_{et}$
            mensaje: |
              $\sigma_1$ es la mayor algebraicamente, no en valor absoluto. Con
              $\sigma_1 = 40$ y $\sigma_3 = -300$ MPa, la que decide es
              $\sigma_3$: la ec. 6.4 toma el máximo de los módulos.
          - texto: >-
              $\sigma_1 - \sigma_3$, con $\sigma_{et}$
            mensaje: |
              Esa es la tensión equivalente de Tresca (ec. 6.19), que mira la
              tangencial máxima. Rankine mira una sola tensión normal y no
              tiene en cuenta ninguna interacción entre las principales.
          - texto: >-
              La mayor deformación principal, multiplicada por $E$
            mensaje: |
              Ese es el criterio de la deformación máxima, Saint-Venant
              (ec. 6.6). Rankine limita la tensión, no la deformación.
      - tipo: redactar
        que: definicion
        consigna: >-
          Escribe el criterio como en un examen: cuándo hay fallo, su tensión
          equivalente, qué pasa con dos límites distintos y cuándo se usa.
        rubrica:
          - punto: >-
              El fallo se produce cuando el valor absoluto máximo de las
              tensiones normales alcanza el límite elástico:
              σeqv = |σmax| (ec. 6.3), con |σmax| = max(|σ1|, |σ2|, |σ3|)
              (ec. 6.4).
            porque: >-
              Es el criterio: una sola tensión, la de mayor módulo, decide.
            minimo: true
          - punto: >-
              Con límites distintos a tracción y a compresión, σet y σec, se
              usa el del signo de σmax: si es de tracción, σet; si es de
              compresión, σec (ec. 6.5).
            porque: >-
              Los materiales en los que se usa resisten mucho más a compresión
              que a tracción, y el signo decide con qué se compara.
            minimo: true
          - punto: >-
              Con principales de los dos signos se comprueba también la otra con
              su límite, y el factor es el menor: la ec. 6.5 mira solo la de
              mayor módulo, y una tracción menor que la compresión puede haber
              pasado ya σet.
            porque: >-
              El criterio no tiene en cuenta ninguna interacción (p. 5): una
              compresión grande no protege a una tracción. Con 150 y 600 MPa y
              las principales 200 y −250 MPa, la 6.5 da 2,4 y la tracción, 0,75.
          - punto: >-
              No tiene en cuenta ninguna interacción entre las tensiones
              principales.
            porque: >-
              Es su limitación: una principal no cambia el límite de otra, y dos
              tracciones dan lo mismo que la mayor sola.
            minimo: true
          - punto: >-
              Es válido para materiales frágiles, cuando la tensión equivalente
              es sensiblemente mayor que las otras principales.
            porque: >-
              Lo dice el apartado 6.2 (p. 5): ahí el fallo es la rotura por la
              tensión normal mayor, sin que importen las otras.
            minimo: true
          - punto: >-
              El factor de seguridad es el límite que toca entre σeqv (ec. 6.1);
              con los dos límites iguales, en tensión plana la región sin fallo
              es un cuadrado centrado en el origen.
            porque: >-
              Es como se aplica, y el dibujo que lo distingue de los demás
              criterios.
      - tipo: calcular
        titulo: La tensión equivalente de Rankine
        pregunta: |
          Un ejemplo nuestro: una fundición frágil con $\sigma_{et}$ = 150 MPa
          a tracción y $\sigma_{ec}$ = 600 MPa a compresión. En un punto, las
          tensiones principales son 40, 0 y −300 MPa. ¿Cuánto vale la tensión
          equivalente de Rankine, en MPa?
        respuesta:
          tipo: numero
          valor: '300'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '40'
            mensaje: |
              Has tomado $\sigma_1$, la mayor con su signo. La ec. 6.4 toma el
              máximo de los valores absolutos: $|-300| > |40|$.
          - valor: '340'
            mensaje: |
              Es $\sigma_1 - \sigma_3$, la tensión equivalente de Tresca.
              Rankine no combina principales: se queda con la de mayor módulo.
          - valor: '-300'
            mensaje: |
              La tensión equivalente es el valor absoluto, $|\sigma_{max}|$
              (ec. 6.3). El signo de $\sigma_{max}$ solo decide con qué límite
              se compara.
        pista: |
          $\sigma_{eqv} = |\sigma_{max}|$, con
          $|\sigma_{max}| = \max(|\sigma_1|, |\sigma_2|, |\sigma_3|)$ (ecs. 6.3
          y 6.4).
        desarrollo: |
          $|\sigma_{max}| = \max(40, 0, 300) = 300$ MPa, la de $\sigma_3$, de
          compresión. La tensión equivalente es $\sigma_{eqv}$ = 300 MPa.
      - tipo: calcular
        titulo: El factor de seguridad de Rankine
        pregunta: |
          ¿Cuánto vale el factor de seguridad de ese punto según Rankine?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '0.5'
            mensaje: |
              Has dividido el límite de tracción, 150 MPa, entre 300. La
              tensión que decide es de compresión, y se compara con el límite
              de compresión, 600 MPa (ec. 6.5).
          - valor: '3.75'
            mensaje: |
              Has tomado $\sigma_1$ = 40 MPa con el límite de tracción: es el
              factor de la tracción sola. La que decide en Rankine es la de
              mayor módulo, −300 MPa, con su límite.
          - valor: '1.765'
            mensaje: |
              Has dividido 600 entre $\sigma_1 - \sigma_3$ = 340 MPa, que es la
              tensión equivalente de Tresca, no la de Rankine.
          - valor: '0.441'
            mensaje: |
              Has dividido el límite de tracción entre $\sigma_1 - \sigma_3$:
              es Tresca, y además con el límite que no toca.
        pista: |
          $SF$ = límite / $\sigma_{eqv}$ (ec. 6.1), con el límite del signo de
          $\sigma_{max}$ (ec. 6.5).
        desarrollo: |
          $\sigma_{max} = -300$ MPa es de compresión, así que el límite es
          $\sigma_{ec}$:

          $$
          SF = \frac{\sigma_{ec}}{\sigma_{eqv}} = \frac{600}{300} = 2
          $$
      - tipo: justificar
        pregunta: Ordena la aplicación del criterio. Una pieza es falsa.
        piezas:
          - texto: >-
              Se toma la principal de mayor valor absoluto:
              $\sigma_{max} = -300$ MPa.
          - texto: >-
              Su valor absoluto es la tensión equivalente, $\sigma_{eqv}$ =
              300 MPa (ecs. 6.3 y 6.4).
          - texto: >-
              Como $\sigma_{max}$ es de compresión, se compara con
              $\sigma_{ec}$ = 600 MPa (ec. 6.5).
          - texto: >-
              $SF = 600/300 = 2$: el punto no falla.
          - texto: >-
              Como $\sigma_1$ = 40 MPa es la tensión máxima, la tensión
              equivalente es 40 MPa y se compara con $\sigma_{et}$.
            trampa: true
            mensaje: |
              $\sigma_1$ es la mayor con su signo; Rankine toma la mayor en
              valor absoluto (ec. 6.4), que aquí es la compresión de 300 MPa.
    resolucion: |
      **El criterio** (apuntes del tema 6, apartado 6.2, pp. 4-5). Cuando el
      valor absoluto máximo de las tensiones normales alcanza el límite
      elástico, se produce el fallo:

      $$
      \sigma_{eqv} = |\sigma_{max}| \quad (6.3)
      \qquad
      |\sigma_{max}| = \max\left(|\sigma_1|, |\sigma_2|, |\sigma_3|\right) \quad (6.4)
      $$

      **Con dos límites.** Si el límite a tracción, $\sigma_{et}$, y el de
      compresión, $\sigma_{ec}$, son distintos, la ec. 6.5 dice: si la
      tensión máxima es de tracción, el límite es el de tracción, y si es de
      compresión, el de compresión. Los apuntes la escriben así:

      $$
      \sigma_{max} > 0:\ \sigma_{eqv} < \sigma_{et}
      \qquad
      \sigma_{max} < 0:\ \sigma_{eqv} > \sigma_{ec}
      \quad (6.5)
      $$

      Tal como está escrita, la segunda línea choca con la 6.3
      ($\sigma_{eqv}$ es un valor absoluto y $\sigma_{ec}$ se da positivo):
      se entiende leyendo $\sigma_{max}$ y $\sigma_{ec}$ con su signo,
      $\sigma_{max} > \sigma_{ec}$, o como $\sigma_{eqv} < \sigma_{ec}$. Con
      los límites en positivo, como se dan en los problemas, es
      $|\sigma_{max}| < \sigma_{ec}$.

      **Cuándo se usa.** No tiene en cuenta ninguna interacción entre las
      tensiones principales. Es válido en materiales frágiles, cuando la
      tensión equivalente es sensiblemente mayor que las otras principales.
      Con los dos límites iguales, en tensión plana y con las dos
      principales del plano en los ejes, la región sin fallo es un cuadrado
      centrado en el origen, de lado $2\sigma_e$.

      **Un ejemplo nuestro.** Una fundición con $\sigma_{et}$ = 150 MPa y
      $\sigma_{ec}$ = 600 MPa, y un punto con las principales 40, 0 y
      −300 MPa. La de mayor módulo es la compresión: $\sigma_{eqv}$ =
      300 MPa, que se compara con 600 MPa:

      $$
      SF = \frac{600}{300} = 2
      $$

      La ec. 6.5 mira solo la principal de mayor módulo. Como el criterio
      no admite interacción, se mira también la otra con su límite: aquí la
      tracción de 40 MPa está lejos del suyo, $150/40 = 3{,}75$, y el factor
      del punto es 2. No siempre sale así: con las principales 200, 0 y
      −250 MPa, la ec. 6.5 daría $600/250 = 2{,}4$, y la tracción ya habría
      fallado, $150/200 = 0{,}75$.

      **Comprobaciones.** El motor del curso da $\sigma_{eqv}$ = 300 MPa y
      $SF$ = 2 con las ecs. 6.3 a 6.5, lo mismo que a mano.

  # ── Cuestión 3 de autoevaluación del tema 6 · Saint-Venant.
  - id: ejerm6-cu3-el-criterio-de-saint-venant
    titulo: El criterio de la deformación máxima (Saint-Venant)
    fuente: >-
      Cuestión 3 de autoevaluación · Tema 6, «Criterios de fallo» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 6,
      apartado 6.3 (p. 5, ecs. 6.6 a 6.9). La ec. 6.9 de los apuntes escribe
      «σbal» donde va σeqv. Se parece a una parte de la pregunta 3 de teoría
      del primer parcial de 2014-2015, «Criterios de fallo. Criterio de
      Mohr.», que en R se resuelve con este criterio en una fila de una
      tabla, junto a los demás; esta lo pide solo. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    enunciado: |
      3. Criterio de deformación máxima.
    pide: >-
      En qué consiste el criterio, su tensión equivalente y a qué materiales
      se aplica.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la tensión equivalente de Saint-Venant es
          $\sigma_{eqv} = E\,|\varepsilon_{max}|$ (ec. 6.6)?
        opciones:
          - texto: >-
              Porque en el ensayo de tracción, al fallar, la deformación es
              $\sigma_e/E$: igualar $|\varepsilon_{max}|$ a ella y multiplicar
              por $E$ da una tensión que se compara con $\sigma_e$
            correcta: true
            mensaje: |
              Eso es: el criterio limita la deformación, y el valor crítico es
              el del ensayo uniaxial. $E\,|\varepsilon_{max}|$ es la tensión de
              tracción simple que produce la misma deformación máxima que el
              estado del punto.
          - texto: >-
              Porque en el punto se cumple $\sigma = E\,\varepsilon$ en cada
              dirección principal, y $E\,|\varepsilon_{max}|$ es la mayor
              tensión principal
            mensaje: |
              En un estado triaxial $\sigma_i \ne E\,\varepsilon_i$: la ley de
              Hooke lleva el término de Poisson (ec. 6.7). Si
              $E\,|\varepsilon_{max}|$ fuera la principal mayor, el criterio
              sería el de Rankine.
          - texto: >-
              Porque la deformación máxima está siempre en la dirección de
              $\sigma_1$
            mensaje: |
              No siempre: con una compresión grande, la deformación de mayor
              módulo es la de $\sigma_3$. Por eso la ec. 6.8 toma el máximo de
              los tres valores absolutos, y el límite según su signo (ec. 6.9).
          - texto: >-
              Porque $E\,\varepsilon_{max}$ es la energía de deformación por
              unidad de volumen
            mensaje: |
              La energía por unidad de volumen es del orden de
              $\tfrac12\sigma\varepsilon$ (tema 4); $E\,\varepsilon$ es una
              tensión. El criterio de energía es el de Von Mises, y solo con la
              parte de distorsión.
      - tipo: redactar
        que: definicion
        consigna: >-
          Escribe el criterio como en un examen: cuándo hay fallo, su tensión
          equivalente con las deformaciones principales, qué límite se usa y
          cuándo se aplica.
        rubrica:
          - punto: >-
              El fallo ocurre cuando el valor absoluto máximo de las
              deformaciones unitarias normales alcanza el valor crítico, el del
              ensayo: σeqv = E|εmax| (ec. 6.6).
            porque: >-
              Es el criterio: se limita la deformación, y E la convierte en una
              tensión comparable con la del ensayo.
            minimo: true
          - punto: >-
              Las deformaciones principales salen de la ley de Hooke:
              ε1 = [σ1 − ν(σ2 + σ3)]/E, y las otras dos cambiando los índices
              (ec. 6.7).
            porque: >-
              Es lo que mete la interacción entre principales que Rankine no
              tiene: el efecto Poisson.
            minimo: true
          - punto: >-
              |εmax| = max(|ε1|, |ε2|, |ε3|) (ec. 6.8), y el límite es el del
              signo de εmax: σet si es un alargamiento, σec si es un
              acortamiento (ec. 6.9).
            porque: >-
              Es como se elige el límite cuando el material resiste distinto a
              tracción y a compresión.
            minimo: true
          - punto: >-
              Es útil en materiales frágiles, cuando una deformación principal
              es sensiblemente mayor que las otras dos.
            porque: >-
              Lo dice el apartado 6.3 (p. 5).
            minimo: true
          - punto: >-
              A diferencia de Rankine, dos tracciones se ayudan: cada una
              acorta la dirección de la otra, y la deformación máxima baja.
            porque: >-
              Es lo que tiene de distinto, y lo que se ve al compararlo con
              Rankine en un mismo estado.
      - tipo: calcular
        titulo: La tensión equivalente de Saint-Venant
        pregunta: |
          Un ejemplo nuestro: un material frágil con $\sigma_{et}$ = 120 MPa,
          $\sigma_{ec}$ = 480 MPa, $E$ = 100 GPa y $\nu$ = 0,25. En un punto,
          las principales son 80, 40 y 0 MPa. ¿Cuánto vale la tensión
          equivalente de Saint-Venant, en MPa?
        respuesta:
          tipo: numero
          valor: '70'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '80'
            mensaje: |
              Has tomado $\sigma_1$ como si $\sigma = E\,\varepsilon$: es
              Rankine. La deformación de la dirección 1 lleva el término de
              Poisson, $\varepsilon_1 = [\sigma_1 - \nu(\sigma_2 + \sigma_3)]/E$
              (ec. 6.7): la tracción de 40 MPa la acorta.
          - valor: '90'
            mensaje: |
              Has sumado el término de Poisson: es
              $\sigma_1 - \nu(\sigma_2 + \sigma_3)$, con un menos. Una tracción
              en la dirección 2 acorta la dirección 1.
        pista: |
          Calcula $E\,\varepsilon_i = \sigma_i - \nu(\sigma_j + \sigma_k)$ para
          las tres direcciones (ec. 6.7) y quédate con la de mayor valor
          absoluto (ecs. 6.6 y 6.8).
        desarrollo: |
          En MPa, con $\nu$ = 0,25:

          $$
          E\varepsilon_1 = 80 - 0{,}25\cdot40 = 70
          \qquad
          E\varepsilon_2 = 40 - 0{,}25\cdot80 = 20
          \qquad
          E\varepsilon_3 = 0 - 0{,}25\cdot120 = -30
          $$

          La de mayor valor absoluto es la primera: $\sigma_{eqv}$ = 70 MPa,
          con $\varepsilon_{max} = 70/100\,000 = 0{,}0007$, un alargamiento.
      - tipo: calcular
        titulo: El factor de seguridad de Saint-Venant
        pregunta: |
          ¿Cuánto vale el factor de seguridad de ese punto según
          Saint-Venant?
        respuesta:
          tipo: numero
          valor: '1.714'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '1.5'
            mensaje: |
              Es el de Rankine, $120/80$. Saint-Venant tiene en cuenta que la
              tracción de 40 MPa acorta la dirección 1: $\sigma_{eqv}$ = 70 MPa,
              no 80.
          - valor: '6.857'
            mensaje: |
              Has usado el límite de compresión. $\varepsilon_{max}$ es un
              alargamiento, positivo, y el límite que toca es $\sigma_{et}$
              (ec. 6.9).
          - valor: '1.333'
            mensaje: |
              Has sumado el término de Poisson ($\sigma_{eqv}$ = 90 MPa): es
              $\sigma_1 - \nu(\sigma_2 + \sigma_3)$, y la tracción de la
              dirección 2 alivia la 1.
        pista: |
          $SF$ = límite / $\sigma_{eqv}$, con el límite del signo de
          $\varepsilon_{max}$ (ec. 6.9).
        desarrollo: |
          $\varepsilon_{max}$ es positiva, así que el límite es $\sigma_{et}$:

          $$
          SF = \frac{120}{70} = 1{,}714
          $$
      - tipo: justificar
        pregunta: Ordena la aplicación del criterio. Una pieza es falsa.
        piezas:
          - texto: >-
              Las deformaciones principales, con la ley de Hooke (ec. 6.7), en
              MPa: $E\varepsilon_1 = 70$, $E\varepsilon_2 = 20$ y
              $E\varepsilon_3 = -30$.
          - texto: >-
              La de mayor valor absoluto es la de la dirección 1:
              $\sigma_{eqv} = E\,|\varepsilon_1|$ = 70 MPa (ecs. 6.6 y 6.8).
          - texto: >-
              $\varepsilon_{max}$ es un alargamiento, así que el límite es
              $\sigma_{et}$ = 120 MPa (ec. 6.9), y $SF = 120/70 = 1{,}71$.
          - texto: >-
              Rankine daría $120/80 = 1{,}5$: la tracción de la dirección 2
              alivia la deformación de la 1.
          - texto: >-
              Como $\sigma_3 = 0$, la deformación $\varepsilon_3$ también es
              cero y no hace falta calcularla.
            trampa: true
            mensaje: |
              $E\varepsilon_3 = 0 - 0{,}25\cdot(80 + 40) = -30$ MPa: una tensión
              nula no da deformación nula, por el efecto Poisson. Aquí no
              decide, porque su módulo es menor que el de $\varepsilon_1$, pero
              hay que calcularla.
    resolucion: |
      **El criterio** (apuntes del tema 6, apartado 6.3, p. 5). El fallo
      ocurre cuando el valor absoluto máximo de las deformaciones unitarias
      normales alcanza el valor crítico. La tensión equivalente es

      $$
      \sigma_{eqv} = E\,|\varepsilon_{max}| \quad (6.6)
      $$

      con las deformaciones principales de la ley de Hooke

      $$
      \varepsilon_1 = \tfrac1E\left[\sigma_1 - \nu(\sigma_2 + \sigma_3)\right]
      \quad
      \varepsilon_2 = \tfrac1E\left[\sigma_2 - \nu(\sigma_1 + \sigma_3)\right]
      \quad
      \varepsilon_3 = \tfrac1E\left[\sigma_3 - \nu(\sigma_1 + \sigma_2)\right]
      \quad (6.7)
      $$

      y $|\varepsilon_{max}| = \max(|\varepsilon_1|, |\varepsilon_2|, |\varepsilon_3|)$
      (ec. 6.8). Con dos límites, la ec. 6.9 dice que si
      $\varepsilon_{max} > 0$ se compara con $\sigma_{et}$, y si
      $\varepsilon_{max} < 0$, con $\sigma_{ec}$, igual que la 6.5 de Rankine.
      Tal como está escrita, su segunda línea choca con la 6.6 ($\sigma_{eqv}$
      es un valor absoluto y $\sigma_{ec}$ se da positivo): se entiende como
      $\sigma_{eqv} < \sigma_{ec}$. Los apuntes escriben en ella
      «$\sigma_{bal}$» donde va $\sigma_{eqv}$: es una errata.

      **Por qué $E\,|\varepsilon_{max}|$.** En el ensayo de tracción, al
      fallar, la deformación es $\sigma_e/E$. Igualar $|\varepsilon_{max}|$ a
      ella y multiplicar por $E$ da la tensión de tracción simple que tiene
      la misma deformación máxima que el punto.

      **Cuándo se usa.** Es útil en materiales frágiles, cuando una
      deformación principal es sensiblemente mayor que las otras dos. A
      diferencia de Rankine, mete la interacción entre principales por el
      efecto Poisson: dos tracciones se ayudan, porque cada una acorta la
      dirección de la otra.

      **Un ejemplo nuestro.** Con $\sigma_{et}$ = 120 MPa, $\sigma_{ec}$ =
      480 MPa, $E$ = 100 GPa, $\nu$ = 0,25 y las principales 80, 40 y 0 MPa:
      en MPa, $E\varepsilon_1 = 70$, $E\varepsilon_2 = 20$ y
      $E\varepsilon_3 = -30$. La mayor en valor absoluto es la primera, un
      alargamiento, así que $\sigma_{eqv}$ = 70 MPa y

      $$
      SF = \frac{120}{70} = 1{,}714
      $$

      Rankine daría $120/80 = 1{,}5$: con Saint-Venant la tracción de la
      dirección 2 alivia la 1.

      **Comprobaciones.** El motor del curso da $\varepsilon_{max}$ =
      700·10⁻⁶, $\sigma_{eqv}$ = 70 MPa y $SF$ = 1,714, lo mismo que a mano.

  # ── Cuestión 5 de autoevaluación del tema 6 · Tresca.
  - id: ejerm6-cu5-el-criterio-de-tresca
    titulo: El criterio de la tensión tangencial máxima (Tresca)
    fuente: >-
      Cuestión 5 de autoevaluación · Tema 6, «Criterios de fallo» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 6,
      apartado 6.5 (pp. 9-10, ecs. 6.17 a 6.19 y figura 6.4) y la ec. 6.12
      de Mohr (p. 7). El enunciado de la hoja lleva un espacio antes del
      punto final, que se conserva. Se parece a una parte de la pregunta 3
      de teoría del primer parcial de 2014-2015, «Criterios de fallo.
      Criterio de Mohr.», que en R se resuelve con este criterio en una fila
      de una tabla, junto a los demás; esta lo pide solo, deducido. El
      ejemplo es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    enunciado: |
      5. Criterio de la tensión tangencial máxima .
    pide: >-
      En qué consiste el criterio, su tensión equivalente deducida y a qué
      materiales se aplica.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el criterio de Tresca, ¿con qué se compara la tensión tangencial
          máxima del punto?
        opciones:
          - texto: >-
              Con la tangencial máxima del ensayo de tracción en el fallo,
              $\sigma_e/2$
            correcta: true
            mensaje: |
              Eso es. En tracción simple el círculo de Mohr va de 0 a
              $\sigma$, y su radio es $\sigma/2$ (ec. 6.18). Igualarlo a
              $\tfrac12(\sigma_1 - \sigma_3)$ (ec. 6.17) da
              $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
          - texto: >-
              Con el límite elástico $\sigma_e$ directamente
            mensaje: |
              En tracción simple la tangencial máxima es la **mitad** de la
              normal. Comparar $\tau_{max}$ con $\sigma_e$ da un factor de
              seguridad el doble del real.
          - texto: >-
              Con $\sigma_e/\sqrt3$
            mensaje: |
              Esa es la tangencial a la que plastifica la cortadura pura según
              Von Mises. Tresca se calibra con el ensayo de tracción, y la
              tangencial crítica que da es $\sigma_e/2$.
          - texto: >-
              Con la tangencial del plano a 45° de las direcciones de
              $\sigma_1$ y $\sigma_2$
            mensaje: |
              Esa es la tangencial de un círculo menor. La máxima es la del
              plano a 45° de las direcciones de $\sigma_1$ y $\sigma_3$, el
              radio del círculo mayor (fig. 6.4), y es la que se compara.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe el criterio como en un examen: cuándo hay fallo, la
          deducción de su tensión equivalente, su relación con el de Mohr y
          cuándo se usa.
        rubrica:
          - punto: >-
              El fallo ocurre cuando la tensión tangencial máxima alcanza un
              valor crítico.
            porque: >-
              Es el criterio: los dúctiles plastifican por deslizamiento, y lo
              que lo produce es la tangencial.
            minimo: true
          - punto: >-
              Con las principales ordenadas σ1 > σ2 > σ3, la tangencial máxima
              es el radio del círculo de Mohr mayor: τmax = ½(σ1 − σ3)
              (ec. 6.17, figura 6.4).
            porque: >-
              Es la que se compara, y la que obliga a ordenar las tres
              principales, la nula incluida.
            minimo: true
          - punto: >-
              En el estado equivalente, tracción simple σeqv, τmax = ½σeqv
              (ec. 6.18); igualando, σeqv = σ1 − σ3 (ec. 6.19).
            porque: >-
              Es la deducción pedida, y el ½ que se compensa es el error más
              corriente.
            minimo: true
          - punto: >-
              Es el caso particular del criterio de Mohr con k = 1: los
              círculos de tracción y de compresión tienen el mismo radio, la
              recta intrínseca es horizontal y sen φ = 0 (ec. 6.12).
            porque: >-
              Lo dicen los apuntes (pp. 9-10), y explica por qué no distingue
              entre tracción y compresión.
            minimo: true
          - punto: >-
              Es válido para materiales dúctiles.
            porque: >-
              Lo dice el apartado 6.5 (p. 10).
            minimo: true
          - punto: >-
              σ2 no interviene, ni la parte hidrostática del estado: sumar la
              misma tensión a las tres principales no cambia σ1 − σ3.
            porque: >-
              Es lo que se comprueba al aplicarlo, y lo que lo distingue de
              Rankine y de Saint-Venant.
      - tipo: calcular
        titulo: La tensión equivalente de Tresca
        pregunta: |
          Un ejemplo nuestro: un acero dúctil con $\sigma_e$ = 260 MPa. En un
          punto, las principales son 90, 30 y −50 MPa. ¿Cuánto vale la
          tensión equivalente de Tresca, en MPa?
        respuesta:
          tipo: numero
          valor: '140'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '60'
            mensaje: |
              Has restado las dos mayores, $90 - 30$. Tresca resta la mayor y
              la menor, $\sigma_1 - \sigma_3$: el círculo de Mohr mayor va de
              −50 a 90.
          - valor: '70'
            mensaje: |
              Es la tangencial máxima, $\tfrac12(\sigma_1 - \sigma_3)$. La
              tensión equivalente es la de tracción simple con esa tangencial
              máxima: el doble (ec. 6.18).
          - valor: '40'
            mensaje: |
              Has restado 50 sin su signo: $\sigma_3 = -50$ MPa, y
              $\sigma_1 - \sigma_3 = 90 - (-50)$.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19), con las principales
          ordenadas de mayor a menor, con su signo.
        desarrollo: |
          $$
          \sigma_{eqv} = \sigma_1 - \sigma_3 = 90 - (-50) = 140
          $$

          en MPa: el diámetro del círculo de Mohr mayor.
      - tipo: calcular
        titulo: El factor de seguridad de Tresca
        pregunta: |
          ¿Cuánto vale el factor de seguridad de ese punto según Tresca?
        respuesta:
          tipo: numero
          valor: '1.857'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '3.714'
            mensaje: |
              Has dividido $\sigma_e$ entre la tangencial máxima, 70 MPa. La
              tangencial crítica del ensayo es $\sigma_e/2$: el factor es
              $130/70$, o $260/140$.
          - valor: '4.333'
            mensaje: |
              Has usado $\sigma_1 - \sigma_2$ = 60 MPa. Decide el círculo mayor,
              el de $\sigma_1$ y $\sigma_3$.
          - valor: '6.5'
            mensaje: |
              Has usado $90 - 50 = 40$ MPa, con $\sigma_3$ sin su signo.
          - valor: '2.137'
            mensaje: |
              Es el factor de Von Mises, $260/121{,}66$. Tresca da uno menor,
              porque su hexágono queda dentro de la elipse de Von Mises.
        pista: |
          $SF = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
        desarrollo: |
          $$
          SF = \frac{260}{140} = 1{,}857
          $$
      - tipo: justificar
        pregunta: Ordena la deducción y la aplicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Se ordenan las principales: $\sigma_1 = 90$, $\sigma_2 = 30$ y
              $\sigma_3 = -50$ MPa.
          - texto: >-
              La tangencial máxima es el radio del círculo mayor:
              $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3)$ = 70 MPa (ec. 6.17).
          - texto: >-
              En tracción simple, $\tau_{max} = \tfrac12\sigma_{eqv}$ (ec. 6.18),
              así que $\sigma_{eqv} = 2\tau_{max} = \sigma_1 - \sigma_3$ =
              140 MPa (ec. 6.19).
          - texto: >-
              $SF = \sigma_e/\sigma_{eqv} = 260/140 = 1{,}86$ (ec. 6.1).
          - texto: >-
              Como el fallo es por tangencial, el factor es
              $\sigma_e/\tau_{max} = 260/70 = 3{,}71$.
            trampa: true
            mensaje: |
              $\tau_{max}$ se compara con la tangencial máxima del ensayo en el
              fallo, $\sigma_e/2$, no con $\sigma_e$: el factor es
              $130/70 = 260/140 = 1{,}86$. Con $\sigma_e$ sale el doble, y del
              lado de la inseguridad.
    resolucion: |
      **El criterio** (apuntes del tema 6, apartado 6.5, pp. 9-10). El fallo
      ocurre cuando la tensión tangencial máxima alcanza un valor crítico.
      Con las principales ordenadas $\sigma_1 > \sigma_2 > \sigma_3$, la
      tangencial máxima es el radio del círculo de Mohr mayor (figura 6.4):

      $$
      \tau_{max} = \tfrac12\left(\sigma_1 - \sigma_3\right) \quad (6.17)
      $$

      En el estado equivalente, una tracción simple $\sigma_{eqv}$, el círculo
      va de 0 a $\sigma_{eqv}$:

      $$
      \tau_{max} = \tfrac12\,\sigma_{eqv} \quad (6.18)
      $$

      e igualando las dos:

      $$
      \sigma_{eqv} = \sigma_1 - \sigma_3 \quad (6.19)
      $$

      **Su relación con Mohr.** La ec. 6.19 es la de Mohr,
      $\sigma_{eqv} = \sigma_1 - k\,\sigma_3$ (ec. 6.15), con $k = 1$: los
      círculos de tracción y de compresión tienen el mismo radio, la recta
      intrínseca es horizontal y, por la ec. 6.12,
      $\operatorname{sen}\varphi = 0$. El criterio es válido para
      materiales dúctiles. $\sigma_2$ no interviene, ni la parte
      hidrostática: sumar la misma tensión a las tres principales no cambia
      $\sigma_1 - \sigma_3$.

      **Un ejemplo nuestro.** Un acero con $\sigma_e$ = 260 MPa y un punto
      con las principales 90, 30 y −50 MPa: $\tau_{max}$ = 70 MPa,
      $\sigma_{eqv}$ = 140 MPa y

      $$
      SF = \frac{260}{140} = 1{,}857
      $$

      Von Mises, con el mismo estado, da $\sigma_{eqv}$ = 121,66 MPa y
      $SF$ = 2,14: Tresca es el más conservador de los dos.

      **Comprobaciones.** El motor del curso da $\sigma_{eqv}$ = 140 MPa y
      $SF$ = 1,857 con Tresca, y 121,66 MPa con Von Mises (ec. 6.29), lo
      mismo que a mano.

  # ── Cuestión 7 de autoevaluación del tema 6 · factor y coeficiente de seguridad.
  - id: ejerm6-cu7-factor-y-coeficiente-de-seguridad
    titulo: El factor de seguridad y el coeficiente de seguridad
    fuente: >-
      Cuestión 7 de autoevaluación · Tema 6, «Criterios de fallo» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 6,
      apartado 6.1 (p. 4, ecs. 6.1 y 6.2), y la diapositiva de las dos
      definiciones. Se parece al principio de la pregunta 3 de teoría del
      primer parcial de 2014-2015, «Criterios de fallo. Criterio de Mohr.»,
      que en R define el factor de seguridad al decir qué es un criterio;
      esta pide la diferencia con el coeficiente. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    enunciado: |
      7. Factor de seguridad y coeficiente de seguridad.
    pide: >-
      Qué es cada uno, cómo se escribe y en qué se diferencian.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue, en el curso, el factor de seguridad del coeficiente
          de seguridad?
        opciones:
          - texto: >-
              El factor se calcula con un estado de tensiones ya conocido, para
              comprobar; el coeficiente se fija antes, para diseñar, y reduce
              el límite a una tensión admisible
            correcta: true
            mensaje: |
              Eso es (apuntes, p. 4). $SF = \sigma_e/\sigma_{eqv}$ (ec. 6.1)
              necesita el estado de tensiones: es un resultado, de comprobación.
              $n > 1$ se impone de antemano y da
              $\sigma_{adm} = \sigma_e/n$ (ec. 6.2), con la que se dimensiona.
          - texto: >-
              Nada: son el mismo número con dos nombres
            mensaje: |
              Los dos dividen el límite elástico, pero no se usan igual: el
              factor sale del cálculo (ec. 6.1), y el coeficiente se impone y
              da la tensión admisible (ec. 6.2). Un diseño bien hecho da un
              factor mayor o igual que el coeficiente.
          - texto: >-
              El factor reduce el límite elástico y el coeficiente aumenta las
              cargas
            mensaje: |
              El factor no reduce nada: es un resultado. Es el coeficiente el
              que puede reducir las propiedades del material o aumentar las
              cargas; en esta asignatura reduce las propiedades (p. 4).
          - texto: >-
              El coeficiente puede ser menor que 1, y el factor no
            mensaje: |
              Es al revés: el coeficiente es $n > 1$ por definición (ec. 6.2),
              y el factor sale menor que 1 cuando el punto falla.
      - tipo: redactar
        que: definicion
        consigna: >-
          Define los dos como en un examen: su fórmula, para qué tipo de
          cálculo sirve cada uno y cómo se relacionan.
        rubrica:
          - punto: >-
              Factor de seguridad: SF = σe/σeqv (ec. 6.1), con la tensión
              equivalente de cualquier criterio; dice cuán lejos se está del
              fallo.
            porque: >-
              Es la definición de los apuntes (p. 4), que lo llaman FS en el
              texto y SF en la ecuación, igual que las diapositivas
              (FS = σL/σeq).
            minimo: true
          - punto: >-
              Para calcularlo hay que conocer el estado de tensiones: se usa en
              cálculos de comprobación. Si sale mayor que 1, no hay fallo; si
              sale menor, sí.
            porque: >-
              Es lo que lo distingue: es un resultado, no un dato.
            minimo: true
          - punto: >-
              Coeficiente de seguridad, CS = n > 1: un número que se fija de
              antemano en los cálculos de diseño.
            porque: >-
              Es la otra mitad de la pregunta, y la condición n > 1 es parte de
              la definición (ec. 6.2).
            minimo: true
          - punto: >-
              Puede reducir las propiedades del material o aumentar las cargas;
              en esta asignatura reduce las propiedades, con la tensión
              admisible σadm = σe/n (ec. 6.2).
            porque: >-
              Es como se usa en el curso, y las diapositivas lo escriben
              CS = σL/σadmis.
            minimo: true
          - punto: >-
              Se diseña con σeqv ≤ σadm, y entonces el factor de seguridad del
              diseño es SF ≥ n.
            porque: >-
              Es lo que liga los dos: el coeficiente es el factor que se exige.
      - tipo: calcular
        titulo: El factor de seguridad de un punto
        pregunta: |
          Un ejemplo nuestro: una pieza de acero dúctil con $\sigma_e$ =
          275 MPa. Con una carga $P$ = 40 kN, en su punto más cargado las
          principales son 150, 0 y −50 MPa, proporcionales a $P$. ¿Cuánto vale
          el factor de seguridad según Tresca?
        respuesta:
          tipo: numero
          valor: '1.375'
          tolerancia: 0.005
          formato: un número, sin unidades
        distractores:
          - valor: '2.75'
            mensaje: |
              Has dividido 275 entre 100 MPa. Si 100 es la tangencial máxima,
              $\tfrac12(\sigma_1 - \sigma_3)$, en Tresca se compara con
              $\sigma_e/2$, no con $\sigma_e$: $137{,}5/100 = 275/200$. Si es
              $150 - 50$, te has dejado el signo: $\sigma_3 = -50$ MPa y
              $\sigma_1 - \sigma_3 = 200$ MPa.
          - valor: '0.727'
            mensaje: |
              Es el cociente al revés, $\sigma_{eqv}/\sigma_e$. El factor es
              $\sigma_e/\sigma_{eqv}$: mayor que 1 si el punto aguanta.
          - valor: '1.833'
            mensaje: |
              Has dividido entre $\sigma_1$ = 150 MPa, como en Rankine. Tresca
              usa $\sigma_1 - \sigma_3 = 200$ MPa.
        pista: |
          Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19), y
          $SF = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
        desarrollo: |
          $\sigma_{eqv} = 150 - (-50) = 200$ MPa, y

          $$
          SF = \frac{275}{200} = 1{,}375
          $$

          El punto no falla.
      - tipo: calcular
        titulo: La carga de diseño con un coeficiente de seguridad
        pregunta: |
          Para el diseño se exige un coeficiente de seguridad $n$ = 2,5.
          ¿Cuál es la mayor carga $P$ que se puede aplicar, en kN?
        respuesta:
          tipo: numero
          valor: '22'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '55'
            mensaje: |
              Has llevado la tensión equivalente hasta $\sigma_e$, no hasta la
              admisible: es la carga de fallo, $40\cdot1{,}375$. El diseño la
              limita a $\sigma_{adm} = \sigma_e/n$ = 110 MPa (ec. 6.2).
          - valor: '29.33'
            mensaje: |
              Has comparado $\sigma_1$ = 150 MPa con la admisible, como en
              Rankine. Con Tresca, lo que no puede pasar de 110 MPa es
              $\sigma_1 - \sigma_3$ = 200 MPa.
          - valor: '137.5'
            mensaje: |
              Has multiplicado por $n$ en vez de dividir: $\sigma_e\cdot n$
              aumentaría el límite. El coeficiente lo reduce:
              $\sigma_{adm} = 275/2{,}5$.
        pista: |
          $\sigma_{adm} = \sigma_e/n$ (ec. 6.2), y $\sigma_{eqv}$ crece en
          proporción a $P$: con 40 kN vale 200 MPa.
        desarrollo: |
          $\sigma_{adm} = 275/2{,}5 = 110$ MPa. Como $\sigma_{eqv}$ es
          proporcional a $P$:

          $$
          P_{max} = 40\cdot\frac{110}{200} = 22
          $$

          en kN. Con esa carga, $SF = 275/110 = 2{,}5 = n$.
      - tipo: justificar
        pregunta: Ordena la comprobación y el diseño. Una pieza es falsa.
        piezas:
          - texto: >-
              Comprobación con $P$ = 40 kN: $\sigma_{eqv}$ = 200 MPa con Tresca,
              y $SF = 275/200 = 1{,}375$; el punto no falla.
          - texto: >-
              Diseño con $n$ = 2,5: $\sigma_{adm} = 275/2{,}5 = 110$ MPa
              (ec. 6.2).
          - texto: >-
              Como las tensiones son proporcionales a $P$, la condición
              $\sigma_{eqv} \le \sigma_{adm}$ da $P \le 22$ kN.
          - texto: >-
              Con $P$ = 22 kN, $SF = 275/110 = 2{,}5$: diseñar con
              $\sigma_{adm}$ es exigir $SF \ge n$.
          - texto: >-
              Como $SF$ = 1,375 es mayor que 1, la carga de 40 kN cumple el
              diseño con $n$ = 2,5.
            trampa: true
            mensaje: |
              $SF > 1$ dice que el punto no falla; el diseño pide más:
              $SF \ge n = 2{,}5$, es decir,
              $\sigma_{eqv} \le \sigma_{adm}$ = 110 MPa, y con 40 kN
              $\sigma_{eqv}$ = 200 MPa.
    resolucion: |
      **El factor de seguridad** (apuntes del tema 6, apartado 6.1, p. 4).
      Para describir cuán lejos se está del fallo, para cualquier criterio:

      $$
      SF = \frac{\sigma_e}{\sigma_{eqv}} \quad (6.1)
      $$

      El texto de los apuntes lo llama factor de seguridad (FS) y la
      ecuación lo escribe SF. Para calcularlo hay que conocer el estado de
      tensiones, así que se usa en **cálculos de comprobación**: mayor que
      1, no hay fallo; menor que 1, sí.

      **El coeficiente de seguridad**, CS = $n$, es en cambio un número que
      se usa en **cálculos de diseño**, fijado de antemano. Puede reducir
      las propiedades del material o aumentar las cargas; en esta
      asignatura se reducen las propiedades, con la tensión admisible

      $$
      \sigma_{adm} = \frac{\sigma_e}{n} \qquad n > 1 \quad (6.2)
      $$

      Las diapositivas dicen lo mismo con $\sigma_L$ para el límite: para
      comprobar, $FS = \sigma_L/\sigma_{eq}$; para diseñar,
      $CS = \sigma_L/\sigma_{admis}$. Se diseña con
      $\sigma_{eqv} \le \sigma_{adm}$, y entonces el factor de seguridad del
      diseño es $SF \ge n$.

      **Un ejemplo nuestro.** Acero con $\sigma_e$ = 275 MPa; con
      $P$ = 40 kN, el punto más cargado tiene las principales 150, 0 y
      −50 MPa. Comprobación con Tresca: $\sigma_{eqv}$ = 200 MPa y
      $SF = 275/200 = 1{,}375$, no falla. Diseño con $n$ = 2,5:
      $\sigma_{adm}$ = 110 MPa, y como las tensiones son proporcionales a la
      carga,

      $$
      P_{max} = 40\cdot\frac{110}{200} = 22
      $$

      en kN. Los 40 kN no fallan, pero no cumplen el diseño: el punto
      aguanta 1,375 veces la carga, y se exigían 2,5.

      **Comprobaciones.** El motor del curso da $\sigma_{eqv}$ = 200 MPa,
      $SF$ = 1,375 y $\sigma_{adm}$ = 110 MPa (y rechaza un $n \le 1$, como
      la ec. 6.2); la carga de diseño se ha comprobado a mano por
      proporción.
