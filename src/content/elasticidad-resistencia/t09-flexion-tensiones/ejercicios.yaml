      <figcaption>

      La viga mide 3 m entre apoyos y la carga está en el centro. La sección es la
      misma en toda la viga, con el ala arriba. El peso propio no se tiene en cuenta.

      </figcaption>
      </figure>
    pide: >-
      La distancia del centro de gravedad a la cara de arriba, en mm; el
      momento de inercia, en mm⁴; las tensiones normales máximas de tracción
      y de compresión, en MPa, y la tensión cortante máxima, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular, ¿cómo serán las tensiones normales en la sección
          del centro?
        opciones:
          - texto: Lineales con la distancia a un eje neutro horizontal que pasa por G; como G está más cerca del ala, la tracción de abajo será mayor que la compresión de arriba
            correcta: true
            mensaje: |
              Eso es. El eje neutro pasa por G, y como la T es simétrica
              respecto del eje $y$, $I_{yz} = 0$ y el eje neutro es el eje $z$:
              $\sigma_x = M_z\,y/I_z$. El ala, toda arriba, sube G, así que la
              fibra de abajo queda más lejos del eje neutro que la de arriba y
              tiene más tensión. Por eso lo primero es G.
          - texto: Iguales y de signo contrario arriba y abajo, $\pm M\,(h/2)/I_z$ con $h = 140$ mm
            mensaje: |
              Eso es de una sección simétrica también respecto de un eje
              horizontal, como un rectángulo o una I de alas iguales. En la T
              el eje neutro pasa por G, que no está a media altura, y las dos
              fibras están a distancias distintas de él.
          - texto: No se pueden escribir sin pasar a ejes principales con el círculo de Mohr, porque la T no es simétrica
            mensaje: |
              La T no es simétrica respecto de un eje horizontal, pero sí
              respecto del vertical, el $y$. Con un eje de simetría,
              $I_{yz} = 0$: $y$ y $z$ ya son principales, y vale Navier
              directamente.
          - texto: Compresión abajo y tracción arriba, porque la carga empuja la viga hacia abajo
            mensaje: |
              La carga hacia abajo curva la viga con la concavidad hacia
              arriba: la fibra de abajo se alarga y la de arriba se acorta. Es
              un flector positivo, $M_z > 0$, que tracciona abajo.

      - tipo: calcular
        titulo: La posición del centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara de arriba de la sección está G, en mm?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '70'
            mensaje: |
              Es la mitad del canto, 140/2. G estaría ahí si la sección fuera
              simétrica respecto de un eje horizontal. El ala y el alma tienen
              la misma área, pero el ala está toda arriba, con su centro a
              10 mm de la cara, y sube G.
          - valor: '95'
            mensaje: |
              Es la distancia de G a la cara de abajo, 140 − 45. La pregunta
              la mide desde la de arriba.
        pista: |
          Dos rectángulos: el ala, $120 \times 20$, con su centro a 10 mm de
          la cara de arriba, y el alma, $20 \times 120$, con el suyo a
          20 + 60 = 80 mm. $\overline{y} = \sum A_i\,y_i / \sum A_i$.
        desarrollo: |
          Las dos áreas valen lo mismo, $120 \cdot 20 = 20 \cdot 120 = 2400\ \text{mm}^{2}$, y

          $$
          \overline{y} = \frac{2400 \cdot 10 + 2400 \cdot 80}{2400 + 2400} = 45\ \text{mm}
          $$

          Con dos áreas iguales, G está a mitad de camino entre sus centros.

      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale $I_z$, respecto del eje $z$ que pasa por G, en
          $10^{6}$ mm⁴?
        respuesta:
          tipo: numero
          valor: '8.84'
          tolerancia: 0.005
          formato: un número (Iz en millones de mm⁴)
        distractores:
          - valor: '2.96'
            mensaje: |
              Son solo las inercias propias de los dos rectángulos,
              $b\,h^{3}/12$. Falta Steiner, $A\,d^{2}$: los centros del ala y
              del alma están los dos a 35 mm de G, y cada uno añade
              $2400 \cdot 35^{2}$ mm⁴.
          - valor: '11.84'
            mensaje: |
              Es la inercia respecto del eje a media altura, a 70 mm de la cara
              de arriba. El eje neutro pasa por G, a 45 mm, y la inercia
              respecto de un eje por G es la menor de todas las paralelas:
              cualquier otro da más.
        pista: |
          Cada rectángulo, $\tfrac{b\,h^{3}}{12} + A\,d^{2}$, con $d$ la
          distancia de su centro a G: el del ala está a 45 − 10 mm y el del
          alma a 80 − 45 mm.
        desarrollo: |
          $$
          I_z = \frac{120 \cdot 20^{3}}{12} + 2400 \cdot 35^{2} + \frac{20 \cdot 120^{3}}{12} + 2400 \cdot 35^{2} = 8{,}84 \cdot 10^{6}\ \text{mm}^{4}
          $$

          El alma aporta su propia inercia, $2{,}88 \cdot 10^{6}$ mm⁴, y la
          del ala es pequeña, $0{,}08 \cdot 10^{6}$; el resto es Steiner.

      - tipo: calcular
        titulo: La tracción máxima
        pregunta: |
          En la sección más cargada, ¿cuánto vale la tensión normal máxima de
          tracción, en MPa?
        respuesta:
          tipo: numero
          valor: '161.2'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '118.78'
            mensaje: |
              Es la tensión de una fibra a 70 mm del eje neutro: lo has puesto
              a media altura. La fibra de abajo está a 140 − 45 = 95 mm de G.
          - valor: '76.36'
            mensaje: |
              Es la tensión de la fibra de arriba, a 45 mm del eje neutro, sin
              su signo. Con el flector positivo la tracción está abajo, y la
              fibra de abajo está más lejos, a 95 mm: tiene más tensión.
          - valor: '481.4'
            mensaje: |
              Has usado la inercia sin Steiner, $2{,}96 \cdot 10^{6}$ mm⁴. Con
              la de verdad, $8{,}84 \cdot 10^{6}$, la tensión es tres veces
              menor.
        pista: |
          Biapoyada con la carga en el centro: el flector máximo está en el
          centro, $M = P\,L/4$. Pásalo a N·mm y usa $\sigma_x = M\,y/I_z$,
          con $y$ la distancia de la fibra de abajo a G.
        desarrollo: |
          El flector máximo, en el centro, es $M = P\,L/4 = 20 \cdot 3/4 = 15$ kN·m,
          es decir, $15 \cdot 10^{6}$ N·mm. La fibra de abajo está a
          $y = 140 - 45 = 95$ mm de G:

          $$
          \sigma_{\text{abajo}} = \frac{M\,y}{I_z} = \frac{15 \cdot 10^{6} \cdot 95}{8{,}84 \cdot 10^{6}} = 161{,}2\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La compresión máxima
        pregunta: |
          En la misma sección, ¿cuánto vale la tensión normal máxima de
          compresión, en MPa, con su signo (negativa a compresión)?
        respuesta:
          tipo: numero
          valor: '-76.36'
          tolerancia: 0.1
          formato: un número, en MPa, con signo
        distractores:
          - valor: '76.36'
            mensaje: |
              El valor es ese, pero no el signo. La fibra de arriba está en
              $y = -45$ mm, por encima de G, y con $M > 0$ la tensión sale
              negativa: está comprimida.
          - valor: '-161.2'
            mensaje: |
              Es la de abajo con el signo cambiado, que valdría con G a media
              altura. En la T, la fibra de arriba está a 45 mm del eje neutro
              y la de abajo a 95: la compresión es menos de la mitad de la
              tracción.
          - valor: '-118.78'
            mensaje: |
              Has puesto el eje neutro a media altura, a 70 mm de las dos
              fibras. Pasa por G, a 45 mm de la cara de arriba.
        pista: |
          La misma fórmula, con la $y$ de la fibra de arriba, que es negativa:
          está por encima de G.
        desarrollo: |
          $$
          \sigma_{\text{arriba}} = \frac{M\,y}{I_z} = \frac{15 \cdot 10^{6} \cdot (-45)}{8{,}84 \cdot 10^{6}} = -76{,}36\ \text{MPa}
          $$

          La proporción con la de abajo es la de las distancias, 45 frente a
          95.

      - tipo: calcular
        titulo: La cortante máxima
        pregunta: |
          ¿Cuánto vale la tensión cortante máxima de la viga, en MPa?
        respuesta:
          tipo: numero
          valor: '5.10'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '3.125'
            mensaje: |
              Es $\tfrac32\,T/A$, la cortante máxima de un **rectángulo**. En
              la T la fórmula es la del flujo cortante,
              $\tau = T\,Q_z^{c}/(I_z\,b)$, con el $b$ de la fibra que se corta.
          - valor: '0.851'
            mensaje: |
              Has dividido por el ancho del ala, 120 mm. A la altura de G el
              corte atraviesa el alma, y el ancho que corta es el suyo, 20 mm.
          - valor: '4.75'
            mensaje: |
              Es la del alma justo debajo del ala, con $Q_z^{c} = 2400 \cdot 35$.
              Ahí no es máxima: crece hasta el eje neutro, donde $A_c$ es todo
              lo que queda a un lado de G.
          - valor: '4.17'
            mensaje: |
              Es la cortante entre el área del alma, $10\,000/2400$: la media
              del alma si se repartiera uniforme. La parábola del flujo da
              algo más en el eje neutro.
        pista: |
          En una biapoyada con la carga en el centro, $T = P/2$ en cada mitad.
          La máxima está en el eje neutro: toma como $A_c$ el trozo de alma de
          debajo de G, $20 \times 95$ mm, y $\tau = T\,Q_z^{c}/(I_z\,b)$ con
          $b = 20$ mm.
        desarrollo: |
          $T = 10$ kN. El trozo de alma de debajo de G tiene su centro a
          47,5 mm de G:

          $$
          Q_z^{c} = 20 \cdot 95 \cdot 47{,}5 = 90\,250\ \text{mm}^{3}
          $$

          $$
          \tau_{\max} = \frac{T\,Q_z^{c}}{I_z\,b} = \frac{10\,000 \cdot 90\,250}{8{,}84 \cdot 10^{6} \cdot 20} = 5{,}10\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'En el centro, $M = P L/4 = 15$ kN·m; en cada mitad, $T = P/2 = 10$ kN.'
          - texto: 'G está a 45 mm de la cara de arriba; la T es simétrica respecto de $y$, así que $I_{yz} = 0$ y el eje neutro es el eje $z$ por G.'
          - texto: 'Con Steiner, $I_z = 8{,}84 \cdot 10^{6}$ mm⁴.'
          - texto: 'Con $\sigma_x = M y/I_z$, la fibra de abajo, a 95 mm, lleva $+161{,}2$ MPa, y la de arriba, a 45 mm, $-76{,}36$ MPa.'
          - texto: 'La cortante máxima está en G, en el alma: $\tau = T Q_z^{c}/(I_z b) = 5{,}10$ MPa.'
          - texto: Las dos fibras extremas llevan la misma tensión con el signo cambiado, $M (h/2)/I_z$, porque están en los bordes de la sección.
            trampa: true
            mensaje: |
              Eso es de una sección simétrica respecto de un eje horizontal.
              La tensión va con la distancia al eje neutro, que pasa por G, y
              en la T las dos fibras están a 45 y a 95 mm de él: la tracción
              de abajo es más del doble de la compresión de arriba.
    resolucion: |
      **Antes de calcular.** La carga hacia abajo da un flector positivo, que
      tracciona abajo y comprime arriba. La tensión normal es lineal con la
      distancia al eje neutro, que pasa por G. La T es simétrica respecto del
      eje $y$, así que $I_{yz} = 0$, los ejes $y$, $z$ por G son principales
      y vale Navier, $\sigma_x = M_z\,y/I_z$ (apuntes, ec. 9.23, p. 12). Y el
      ala, toda arriba, sube G: la fibra de abajo quedará más lejos del eje
      neutro y tendrá la tensión mayor.

      **Los esfuerzos.** Biapoyada de luz $L = 3$ m con $P = 20$ kN en el
      centro: cada apoyo lleva 10 kN, la cortante vale $T = 10$ kN en cada
      mitad (con signo distinto) y el flector es máximo en el centro,
      $M = P\,L/4 = 15$ kN·m, es decir, $15 \cdot 10^{6}$ N·mm.

      **G.** Midiendo $y$ desde la cara de arriba, el ala ($2400\ \text{mm}^{2}$)
      tiene su centro en 10 mm y el alma ($2400\ \text{mm}^{2}$) en 80 mm:

      $$
      \overline{y} = \frac{2400 \cdot 10 + 2400 \cdot 80}{4800} = 45\ \text{mm}
      $$

      **La inercia**, con Steiner, con los dos centros a 35 mm de G:

      $$
      I_z = \frac{120 \cdot 20^{3}}{12} + 2400 \cdot 35^{2} + \frac{20 \cdot 120^{3}}{12} + 2400 \cdot 35^{2} = 8{,}84 \cdot 10^{6}\ \text{mm}^{4}
      $$

      **Las tensiones normales**, en el centro, con la fibra de abajo en
      $y = 95$ mm y la de arriba en $y = -45$ mm:

      $$
      \sigma_{\text{abajo}} = \frac{15 \cdot 10^{6} \cdot 95}{8{,}84 \cdot 10^{6}} = 161{,}2\ \text{MPa}
      \qquad
      \sigma_{\text{arriba}} = \frac{15 \cdot 10^{6} \cdot (-45)}{8{,}84 \cdot 10^{6}} = -76{,}36\ \text{MPa}
      $$

      La tracción máxima es más del doble de la compresión máxima: si el
      material resistiera menos a tracción, mandaría la fibra de abajo. Con
      la T al revés, el ala abajo, sería al contrario.

      **La cortante máxima.** Con $\tau = T\,Q_z^{c}/(I_z\,b)$ (apuntes, ec.
      9.35, p. 16), la máxima está donde $Q_z^{c}/b$ es mayor, en el eje
      neutro, que corta el alma. $A_c$ es el trozo de alma de debajo de G,
      $20 \times 95$ mm, con su centro a 47,5 mm de G:

      $$
      Q_z^{c} = 20 \cdot 95 \cdot 47{,}5 = 90\,250\ \text{mm}^{3}
      \qquad
      \tau_{\max} = \frac{10\,000 \cdot 90\,250}{8{,}84 \cdot 10^{6} \cdot 20} = 5{,}10\ \text{MPa}
      $$

      Es treinta veces menor que la normal: en una viga normal la cortante
      no suele mandar, y por eso los problemas dimensionan con $\sigma$ y
      comprueban $\tau$ después.

      **Comprobación por otro camino.** El momento estático de la parte de
      **encima** de G tiene que valer lo mismo con el signo cambiado, porque
      el de la sección entera respecto de G es cero. El ala tiene su centro
      a 35 mm por encima de G, y el trozo de alma de encima, $20 \times 25$
      mm, a 12,5 mm:

      $$
      2400 \cdot 35 + 500 \cdot 12{,}5 = 90\,250\ \text{mm}^{3}
      $$

      El mismo. Y para las normales: sin axial, la fuerza de tracción de la
      sección tiene que igualar a la de compresión. La tracción es el
      triángulo del alma de debajo de G,
      $\tfrac12 \cdot 161{,}2 \cdot 20 \cdot 95 = 153\,140$ N. La compresión,
      con $\sigma = -42{,}42$ MPa en la unión del ala con el alma, es la del
      ala más la del trozo de alma de encima de G,
      $2400 \cdot \tfrac12 \cdot (76{,}36 + 42{,}42) + 500 \cdot \tfrac12 \cdot 42{,}42 = 153\,141$ N.
      Las dos, 153 kN: G está bien puesto.
