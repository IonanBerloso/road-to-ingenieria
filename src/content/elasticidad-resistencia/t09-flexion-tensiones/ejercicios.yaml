ejercicios:
  # ── Ejemplo introductorio nuestro · la viga en T, con sus dos fibras.
  - id: ejerm9-la-viga-en-t
    titulo: La viga biapoyada de sección en T
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una viga de acero de 3 m de luz, articulada en A y apoyada en B, lleva
      una carga $P = 20\ \text{kN}$ en el centro. Su sección es una T: un ala
      de $120 \times 20$ mm arriba y, debajo, centrada, un alma de 20 mm de
      espesor y 120 mm de alto.

      a) ¿A qué distancia de la cara de arriba de la sección está su centro
      de gravedad?

      b) ¿Cuánto vale su momento de inercia respecto del eje $z$ que pasa
      por él?

      c) En la sección más cargada, ¿cuánto valen la tensión normal máxima
      de tracción y la máxima de compresión?

      d) ¿Cuánto vale la tensión cortante máxima de la viga?

