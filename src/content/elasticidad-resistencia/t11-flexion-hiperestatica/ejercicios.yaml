    pide: >-
      La reacción de B, en kN; el flector en el empotramiento, en kN·m, con su
      signo, y el flector máximo positivo del vano, en kN·m.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al quitar el apoyo B, la viga pasa a ser un voladizo con dos cargas,
          $q$ y $X$, y el equilibrio ya no basta para dar $X$. ¿Qué condición
          da la ecuación que falta?
        opciones:
          - texto: 'La flecha de B es nula: $v_B = 0$'
            correcta: true
            mensaje: |
              Eso es. La condición es lo que hacía el enlace que se ha
              quitado, y un apoyo impide que su punto baje. La flecha de B en
              el voladizo es la de $q$ menos la de $X$, y tiene que ser cero
              (apuntes, figura 11.2, pp. 4 y 5).
          - texto: 'El giro de B es nulo: $\theta_B = 0$'
            mensaje: |
              Un apoyo deja girar: lo que impide es la flecha. El giro nulo es
              la condición de un empotramiento, y aquí el empotramiento está
              en A. Con $\theta_B = 0$ se trataría B como empotrado, y saldría
              $X = qL/3$ en lugar de $3qL/8$.
          - texto: 'El flector en B es nulo: $M_B = 0$'
            mensaje: |
              Es cierto, pero no sirve para hallar $X$: en el voladizo, el
              flector de su extremo libre es nulo con cualquier $X$, porque no
              hay nada a la derecha de B. Es una ecuación de equilibrio que ya
              se cumple. La que falta es de deformación.
          - texto: 'Por simetría, cada extremo lleva la mitad de la carga: $X = qL/2$'
            mensaje: |
              La viga no es simétrica: un extremo está empotrado y el otro
              solo apoyado. El empotramiento retiene más y se lleva más carga,
              así que $X$ es menor que $qL/2$. La ecuación tiene que salir de
              cómo se deforma la viga, no de suponer el reparto.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga sin sus enlaces, y la
          isostática equivalente**.
        comprueba:
          - punto: |
              **En A, una fuerza horizontal, una vertical y un par; en B, solo
              una vertical.**
            porque: |
              A es un empotramiento, y B, un apoyo móvil.
          - punto: |
              **La carga uniforme, $q$, en toda la viga.**
            porque: |
              Es la carga del enunciado, el dato.
          - punto: |
              **En la isostática, el voladizo con $q$ y con $X$ hacia arriba en
              B.**
            porque: |
              La reacción quitada queda como una carga más, la incógnita.
