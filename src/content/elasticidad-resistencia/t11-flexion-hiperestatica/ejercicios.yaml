ejercicios:
  # ── Ejemplo introductorio nuestro · la viga empotrada y apoyada con carga uniforme, quitando el apoyo.
  - id: ejerm11-la-viga-empotrada-y-apoyada
    titulo: La viga empotrada y apoyada con una carga uniforme
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      La viga AB de la figura, de longitud $L = 4$ m, está empotrada en A y
      descansa en B sobre un apoyo móvil. Lleva una carga uniforme
      $q = 12$ kN/m hacia abajo en toda su longitud, y su rigidez a flexión
      $EI_z$ es la misma en toda la viga.

      Se resuelve tomando como viga isostática equivalente el voladizo
      empotrado en A, sin el apoyo B, y como incógnita hiperestática la
      reacción $X$ de ese apoyo, positiva hacia arriba. Con el convenio del
      curso ($v$ positiva hacia abajo, $M$ positivo si tracciona la fibra
      inferior), determinar las reacciones y el diagrama de flectores.

