      a) Cuatro incógnitas, HA, RA, MA y RB, y tres ecuaciones: hiperestática de grado uno. b) La isostática equivalente: el voladizo con q y con X, la reacción de B, como una carga más.

      </figcaption>
      </figure>

      - **Con cargas verticales**, la reacción horizontal de A es nula, y
        quedan $R_A$, $M_A$ y $R_B$: tres incógnitas para dos ecuaciones de
        equilibrio. La viga es hiperestática de grado 1.
      - **Se quita el apoyo B**, y su reacción $X$, positiva hacia arriba,
        queda como una carga más del voladizo empotrado en A.
      - **La condición** es lo que hacía el apoyo: B no baja, $v_B = 0$
        (apuntes, figura 11.2, pp. 4 y 5).

      **2. Incógnitas.** $X = R_B$, $R_A$ y $M_A$; y el flector máximo del
      vano.

      **3. Ecuaciones.** **La compatibilidad.** Con la tabla de vigas
      elementales del tema 10, la carga uniforme baja la punta del voladizo
      $qL^{4}/8EI_z$, y $X$ la sube $XL^{3}/3EI_z$:

      $$
      v_B = \frac{qL^{4}}{8EI_z} - \frac{XL^{3}}{3EI_z} = 0
      $$

      **El equilibrio.** En vertical, $R_A = qL - X$. Con $x$ desde A y el
      convenio del tema 7, el flector es

      $$
      M(x) = M_A + R_Ax - \frac{qx^{2}}{2}, \qquad
      M_A = -\frac{qL^{2}}{2} + XL
      $$

      **4. Resultados.** **Las reacciones.**

      $$
      X = R_B = \frac{3qL}{8} = \frac{3 \cdot 12 \cdot 4}{8} = 18\ \text{kN}
      \qquad
      R_A = 48 - 18 = 30\ \text{kN}
      $$

      $$
      M_A = -\frac{12 \cdot 16}{2} + 18 \cdot 4 = -24\ \text{kN·m}
      $$

      **Los flectores.** $M(x) = -24 + 30x - 6x^{2}$ en kN·m. En B vale cero,
      como tiene que valer en un apoyo extremo. Es negativo de A hasta
      $x = 1$ m, donde cambia de signo, y positivo de ahí a B. La cortante
      $T = 30 - 12x$ se anula en $x = 2{,}5$ m, a $3L/8$ de B, donde está el
      máximo positivo:

      $$
      M_{\max} = -24 + 30 \cdot 2{,}5 - 6 \cdot 2{,}5^{2} = 13{,}5\ \text{kN·m}
      $$

      En general, $M_A = -qL^{2}/8$ y $M_{\max} = 9qL^{2}/128$.

      **5. Comprobación.** **Quitando el giro de A.** Se cambia el
      empotramiento por una articulación y su flector $M_A$ queda como
      incógnita; la condición es $\theta_A = 0$. La biapoyada con $q$ gira en
      A $qL^{3}/24EI_z$, y un flector $M_A$ en su extremo le añade
      $M_AL/3EI_z$:

      $$
      \frac{qL^{3}}{24EI_z} + \frac{M_AL}{3EI_z} = 0
      \quad\Longrightarrow\quad
      M_A = -\frac{qL^{2}}{8} = -\frac{12 \cdot 16}{8} = -24\ \text{kN·m}
      $$

      **Y por los tres momentos.** El empotramiento es un vano ficticio de
      inercia infinita a la izquierda de A, y la ecuación de A queda
      $2M_AL = -6Ab/L = -qL^{3}/4$, con $M_B = 0$. Sale el mismo
      $M_A = -qL^{2}/8$. Las reacciones, como en cualquier vano: la
      isostática, $qL/2 = 24$ kN, más o menos $(M_B - M_A)/L = 6$ kN, es
      decir, $R_A = 24 + 6 = 30$ kN y $R_B = 24 - 6 = 18$ kN.

      **Lo que dice el resultado.** El empotramiento, que no deja girar a A,
      se lleva más carga que el apoyo: 30 kN frente a 18, no 24 cada uno. El
      flector de mayor valor absoluto es el del empotramiento, $qL^{2}/8$, lo
      mismo que tendría en el centro la viga biapoyada, y el vano baja a
      13,5 kN·m.
