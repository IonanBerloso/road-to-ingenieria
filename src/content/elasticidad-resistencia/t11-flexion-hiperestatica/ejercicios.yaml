    pide: >-
      La reacción de B, en kN; el flector en el empotramiento, en kN·m, con su
      signo, y el flector máximo positivo del vano, en kN·m.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al quitar el apoyo B, la viga pasa a ser un voladizo con dos cargas,
          $q$ y $X$, y el equilibrio ya no basta para dar $X$. ¿Qué condición
          da la ecuación que falta?
        opciones:
          - texto: 'La flecha de B es nula: $v_B = 0$'
            correcta: true
            mensaje: |
              Eso es. La condición es lo que hacía el enlace que se ha
              quitado, y un apoyo impide que su punto baje. La flecha de B en
              el voladizo es la de $q$ menos la de $X$, y tiene que ser cero
              (apuntes, figura 11.2, pp. 4 y 5).
          - texto: 'El giro de B es nulo: $\theta_B = 0$'
            mensaje: |
              Un apoyo deja girar: lo que impide es la flecha. El giro nulo es
              la condición de un empotramiento, y aquí el empotramiento está
              en A. Con $\theta_B = 0$ se trataría B como empotrado, y saldría
              $X = qL/3$ en lugar de $3qL/8$.
          - texto: 'El flector en B es nulo: $M_B = 0$'
            mensaje: |
              Es cierto, pero no sirve para hallar $X$: en el voladizo, el
              flector de su extremo libre es nulo con cualquier $X$, porque no
              hay nada a la derecha de B. Es una ecuación de equilibrio que ya
              se cumple. La que falta es de deformación.
          - texto: 'Por simetría, cada extremo lleva la mitad de la carga: $X = qL/2$'
            mensaje: |
              La viga no es simétrica: un extremo está empotrado y el otro
              solo apoyado. El empotramiento retiene más y se lleva más carga,
              así que $X$ es menor que $qL/2$. La ecuación tiene que salir de
              cómo se deforma la viga, no de suponer el reparto.

      - tipo: calcular
        titulo: La reacción del apoyo
        pregunta: |
          ¿Cuánto vale la reacción $X$ del apoyo B, en kN, positiva hacia
          arriba?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.01
          formato: un número con su signo, en kN
        distractores:
          - valor: '24'
            mensaje: |
              Es $qL/2$, la mitad de la carga, como en una biapoyada. Pero el
              empotramiento de A retiene más que el apoyo de B y se lleva más
              carga. El mismo 24 sale si la flecha del voladizo con $q$ se
              toma como $qL^{4}/6EI_z$, que es el coeficiente del giro con una
              $L$ más: la flecha es $qL^{4}/8EI_z$, y con $XL^{3}/3EI_z$ da
              $X = 3qL/8$.
          - valor: '30'
            mensaje: |
              Es la reacción de A, $5qL/8$. Las dos suman $qL = 48$ kN, y la
              mayor está en el empotramiento; B, que solo impide la flecha, se
              lleva $3qL/8 = 18$ kN.
          - valor: '16'
            mensaje: |
              Es $qL/3$, lo que sale de exigir $\theta_B = 0$:
              $qL^{3}/6EI_z = XL^{2}/2EI_z$. Un apoyo deja girar; lo que
              impide es la flecha, y con $v_B = 0$ sale $X = 3qL/8$.
          - valor: '-18'
            mensaje: |
              El valor es ese; el signo, no. $X$ hacia arriba levanta la punta,
              así que su flecha va con signo menos:
              $v_B = qL^{4}/8EI_z - XL^{3}/3EI_z$. Un apoyo empuja la viga hacia
              arriba, y su reacción sale positiva.
        pista: |
          En el voladizo empotrado en A, la carga uniforme baja la punta
          $qL^{4}/8EI_z$ y una fuerza $X$ hacia arriba en la punta la sube
          $XL^{3}/3EI_z$ (la tabla de vigas elementales del tema 10).
        desarrollo: |
          La flecha de B es la suma de las dos, y el apoyo la anula:

          $$
          v_B = \frac{qL^{4}}{8EI_z} - \frac{XL^{3}}{3EI_z} = 0
          \quad\Longrightarrow\quad
          X = \frac{3qL}{8}
          $$

          $$
          X = \frac{3 \cdot 12 \cdot 4}{8} = 18\ \text{kN}
          $$

          $EI_z$ se va: la reacción no depende de la rigidez, mientras sea la
          misma en toda la viga.

      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en el empotramiento A, en kN·m, con el
          convenio del curso?
        respuesta:
          tipo: numero
          valor: '-24'
          tolerancia: 0.01
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '24'
            mensaje: |
              El valor es ese; el signo, no. El empotramiento sujeta la viga
              por arriba, como un voladizo, y la tracciona por la fibra
              superior: $M_A < 0$. El mismo 24 sale si en
              $M_A = -qL^{2}/2 + XL$ se pone la reacción de A, 30 kN, en lugar
              de la de B: la fuerza que está a una distancia $L$ de A es la
              de B.
          - valor: '-96'
            mensaje: |
              Es $-qL^{2}/2$, el flector del voladizo sin el apoyo. Falta lo
              que pone la reacción de B, $XL = 18 \cdot 4 = 72$ kN·m, que
              descarga el empotramiento.
          - valor: '0'
            mensaje: |
              Sale con $X = qL/2 = 24$ kN: $-96 + 96 = 0$, el flector de una
              biapoyada en su apoyo. Pero A está empotrado y su flector no es
              nulo: con $X = 3qL/8 = 18$ kN, $M_A = -96 + 72 = -24$ kN·m.
          - valor: '-32'
            mensaje: |
              Sale con $X = qL/3 = 16$ kN, la de la condición $\theta_B = 0$:
              $-96 + 64 = -32$. La condición del apoyo es $v_B = 0$, que da
              $X = 18$ kN y $M_A = -24$ kN·m.
        pista: |
          $M_A$ es el flector en el empotramiento, el de una sección pegada a
          A. Con las fuerzas de la derecha: la carga $qL$, a $L/2$, y la
          reacción $X$, a $L$.
        desarrollo: |
          Con las fuerzas de la derecha de A, la carga baja y $X$ sube:

          $$
          M_A = -\frac{qL^{2}}{2} + XL = -\frac{12 \cdot 4^{2}}{2} + 18 \cdot 4 = -24\ \text{kN·m}
          $$

          Es $-qL^{2}/8$, negativo: la viga está traccionada por arriba en el
          empotramiento.

      - tipo: calcular
        titulo: El flector máximo del vano
        pregunta: |
          ¿Cuánto vale el flector máximo positivo del vano, en kN·m?
        respuesta:
          tipo: numero
          valor: '13.5'
          tolerancia: 0.01
          formato: un número, en kN·m
        distractores:
          - valor: '24'
            mensaje: |
              Es $qL^{2}/8$, el máximo de una biapoyada con la misma carga, y
              también el valor absoluto de $M_A$. El empotramiento rebaja el
              flector del vano: con $M = -24 + 30x - 6x^{2}$, el máximo
              positivo está donde $T = 30 - 12x = 0$, en $x = 2{,}5$ m, y vale
              $13{,}5$ kN·m.
          - valor: '12'
            mensaje: |
              Es el flector en el centro de la viga, en $x = 2$ m. La viga no
              es simétrica y el máximo no está en el centro: está donde la
              cortante se anula, en $x = 2{,}5$ m, a $3L/8$ de B.
          - valor: '10.6667'
            mensaje: |
              Sale con $X = qL/3 = 16$ kN, la de $\theta_B = 0$:
              $M = -32 + 32x - 6x^{2}$, con su máximo en $x = 8/3$ m. Con la
              condición del apoyo, $X = 18$ kN, el máximo es $13{,}5$ kN·m.
          - valor: '-24'
            mensaje: |
              Es el flector del empotramiento: el de mayor valor absoluto,
              pero negativo. Se pide el máximo positivo, el del vano, que está
              donde la cortante se anula.
        pista: |
          El flector es $M(x) = M_A + R_Ax - qx^{2}/2$, con $x$ desde A. Su
          máximo está donde $T = dM/dx = 0$.
        desarrollo: |
          Con $R_A = qL - X = 48 - 18 = 30$ kN:

          $$
          M(x) = -24 + 30x - 6x^{2}, \qquad T(x) = 30 - 12x
          $$

          $T = 0$ en $x = 2{,}5$ m, y

          $$
          M_{\max} = -24 + 30 \cdot 2{,}5 - 6 \cdot 2{,}5^{2} = 13{,}5\ \text{kN·m}
          $$

          que es $9qL^{2}/128$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con cargas verticales, las reacciones son $R_A$, $M_A$ y $R_B$, y el equilibrio da dos ecuaciones: la viga es hiperestática de grado 1. Se quita el apoyo B y su reacción $X$ pasa a ser una carga.'
          - texto: 'En el voladizo empotrado en A, la carga uniforme baja la punta $qL^{4}/8EI_z$ y $X$ la sube $XL^{3}/3EI_z$.'
          - texto: 'B es un apoyo, así que $v_B = 0$: $qL^{4}/8EI_z = XL^{3}/3EI_z$, y $X = 3qL/8 = 18$ kN.'
          - texto: 'Equilibrio: $R_A = 30$ kN y $M_A = -qL^{2}/2 + XL = -24$ kN·m. El flector, $M = -24 + 30x - 6x^{2}$, es máximo donde $T = 0$, en $x = 2{,}5$ m: $M_{\max} = 13{,}5$ kN·m.'
          - texto: 'B es un apoyo, así que no gira: $\theta_B = 0$, y $X = qL/3 = 16$ kN.'
            trampa: true
            mensaje: |
              Un apoyo deja girar; lo que impide es que su punto baje. La
              condición de giro nulo es la de un empotramiento, y aquí el
              empotramiento está en A.
    resolucion: |
      **Cuántas incógnitas sobran.** Con cargas verticales, la reacción
      horizontal de A es nula, y quedan $R_A$, $M_A$ y $R_B$: tres incógnitas
      para dos ecuaciones de equilibrio. La viga es hiperestática de grado 1.

      **La viga isostática.** Se quita el apoyo B y su reacción $X$, positiva
      hacia arriba, queda como una carga más del voladizo empotrado en A. La
      condición es lo que hacía el apoyo: B no baja, $v_B = 0$ (apuntes,
      figura 11.2, pp. 4 y 5).

      **La compatibilidad.** Con la tabla de vigas elementales del tema 10,
      la carga uniforme baja la punta del voladizo $qL^{4}/8EI_z$, y $X$ la
      sube $XL^{3}/3EI_z$:

      $$
      v_B = \frac{qL^{4}}{8EI_z} - \frac{XL^{3}}{3EI_z} = 0
      \quad\Longrightarrow\quad
      X = R_B = \frac{3qL}{8} = \frac{3 \cdot 12 \cdot 4}{8} = 18\ \text{kN}
      $$

      **El equilibrio.** En vertical, $R_A = qL - X = 48 - 18 = 30$ kN. Con
      $x$ desde A y el convenio del tema 7, el flector es

      $$
      M(x) = M_A + R_Ax - \frac{qx^{2}}{2}, \qquad
      M_A = -\frac{qL^{2}}{2} + XL = -\frac{12 \cdot 16}{2} + 18 \cdot 4 = -24\ \text{kN·m}
      $$

      es decir, $M(x) = -24 + 30x - 6x^{2}$ en kN·m. En B vale cero, como
      tiene que valer en un apoyo extremo. Es negativo de A hasta $x = 1$ m,
      donde cambia de signo, y positivo de ahí a B. La cortante
      $T = 30 - 12x$ se anula en $x = 2{,}5$ m, a $3L/8$ de B, donde está el
      máximo positivo:

      $$
      M_{\max} = -24 + 30 \cdot 2{,}5 - 6 \cdot 2{,}5^{2} = 13{,}5\ \text{kN·m}
      $$

      En general, $M_A = -qL^{2}/8$ y $M_{\max} = 9qL^{2}/128$. El flector de
      mayor valor absoluto es el del empotramiento.

      **Por otro camino: quitar el giro de A.** Se cambia el empotramiento
      por una articulación y su flector $M_A$ queda como incógnita; la
      condición es $\theta_A = 0$. La biapoyada con $q$ gira en A
      $qL^{3}/24EI_z$, y un flector $M_A$ en su extremo le añade
      $M_AL/3EI_z$:

      $$
      \frac{qL^{3}}{24EI_z} + \frac{M_AL}{3EI_z} = 0
      \quad\Longrightarrow\quad
      M_A = -\frac{qL^{2}}{8} = -\frac{12 \cdot 16}{8} = -24\ \text{kN·m}
      $$

      **Y por los tres momentos.** El empotramiento es un vano ficticio de
      inercia infinita a la izquierda de A, y la ecuación de A queda
      $2M_AL = -6Ab/L = -qL^{3}/4$, con $M_B = 0$. Sale el mismo
      $M_A = -qL^{2}/8$. Las reacciones, como en cualquier vano: la
      isostática, $qL/2 = 24$ kN, más o menos $(M_B - M_A)/L = 6$ kN, es
      decir, $R_A = 24 + 6 = 30$ kN y $R_B = 24 - 6 = 18$ kN.
