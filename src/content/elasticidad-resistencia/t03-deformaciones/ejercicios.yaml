ejercicios:
  - id: ejerm3-roseta-a-45
    titulo: Una roseta a 45°, de las lecturas a las deformaciones principales
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un punto de la superficie de una chapa se pega una roseta de tres
      galgas a 45°: $a$ a lo largo de $x$, $b$ a 45° y $c$ a lo largo de $y$.
      Con la chapa cargada, las lecturas son
      $\varepsilon_a = 500 \cdot 10^{-6}$, $\varepsilon_b = 780 \cdot 10^{-6}$ y
      $\varepsilon_c = 100 \cdot 10^{-6}$. Calcular $\gamma_{xy}$, las
      deformaciones principales en el plano de la chapa, el ángulo de la
      dirección principal 1 con $x$ y la deformación tangencial máxima en ese
      plano.

