      <figcaption>

      El elemento en P, visto desde x y muy exagerado: en el plano yz los lados no cambian de longitud y el ángulo recto se cierra; según x, que sale del papel, solo se alarga.

      </figcaption>
      </figure>

      - **En la diagonal** del tensor van las derivadas de cada
        desplazamiento en su propia dirección (ec. 3.14); fuera, la mitad de
        las distorsiones (ecs. 3.21 y 3.35).
      - **En P** la fila de x no tiene nada fuera de la diagonal: esa
        dirección ya es principal, y lo que queda es un problema 2×2.

      **2. Incógnitas.** La matriz de deformación en función de x, y, z; las
      principales y sus direcciones en P; y la matriz en los ejes
      principales.

      **3. Ecuaciones.** Las componentes del tensor, sus principales y la
      transformación tensorial (la del tema 2, ec. 2.27, por la similitud
      del apartado 3.6):

      $$
      \varepsilon_x = \frac{\partial u}{\partial x}
      \qquad
      \tfrac12\gamma_{yz} = \tfrac12\left(\frac{\partial v}{\partial z} + \frac{\partial w}{\partial y}\right)
      \qquad
      \left|[\varepsilon] - \varepsilon[I]\right| = 0
      \qquad
      [\varepsilon'] = [R][\varepsilon][R]^{t}
      $$

      **4. Resultados.** **a/ La matriz de deformación.** Con
      $u = 4ax^{2}$, $v = 8az^{2}$ y $w = -2ay^{2}$:

      $$
      \varepsilon_x = \frac{\partial u}{\partial x} = 8ax,\qquad
      \varepsilon_y = \frac{\partial v}{\partial y} = 0,\qquad
      \varepsilon_z = \frac{\partial w}{\partial z} = 0
      $$

      $$
      \gamma_{xy} = \frac{\partial u}{\partial y} + \frac{\partial v}{\partial x} = 0,\qquad
      \gamma_{yz} = \frac{\partial v}{\partial z} + \frac{\partial w}{\partial y} = 16az - 4ay,\qquad
      \gamma_{zx} = \frac{\partial w}{\partial x} + \frac{\partial u}{\partial z} = 0
      $$

      $$
      [\varepsilon] = \begin{bmatrix} 8ax & 0 & 0\\ 0 & 0 & a\,(8z - 2y)\\ 0 & a\,(8z - 2y) & 0 \end{bmatrix}
      $$

      **b/ En P(1/2, 1, 1).** Con $a = 10^{-4}\ \text{m}^{-1}$,
      $\varepsilon_x = 8\cdot\tfrac{1}{2}\cdot10^{-4} = 4\cdot10^{-4}$ y
      $\tfrac12\gamma_{yz} = (8 - 2)\cdot10^{-4} = 6\cdot10^{-4}$:

      $$
      [\varepsilon]_P = \begin{bmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{bmatrix}\cdot10^{-4}
      $$

      $x$ es dirección principal, con $4\cdot10^{-4}$. El bloque de $y$, $z$
      da $\varepsilon^{2} - 36 = 0$, es decir, $\pm6\cdot10^{-4}$, con las
      direcciones $\tfrac{1}{\sqrt2}(0, 1, 1)$ para $+6$ y
      $\tfrac{1}{\sqrt2}(0, 1, -1)$ para $-6$. Ordenadas:

      $$
      \varepsilon_1 = 6\cdot10^{-4},\ \vec n_1 = \tfrac{1}{\sqrt2}(0, 1, 1);\qquad
      \varepsilon_2 = 4\cdot10^{-4},\ \vec n_2 = (1, 0, 0);\qquad
      \varepsilon_3 = -6\cdot10^{-4},\ \vec n_3 = \tfrac{1}{\sqrt2}(0, 1, -1)
      $$

      **c/ La matriz en los ejes principales.** Con las direcciones en las
      filas de $[R]$,

      $$
      [R] = \begin{bmatrix} 0 & \tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2}\\ 1 & 0 & 0\\ 0 & \tfrac{1}{\sqrt2} & -\tfrac{1}{\sqrt2} \end{bmatrix}
      \;\Longrightarrow\;
      [\varepsilon'] = [R][\varepsilon][R]^{t} = \begin{bmatrix} 6 & 0 & 0\\ 0 & 4 & 0\\ 0 & 0 & -6 \end{bmatrix}\cdot10^{-4}
      $$

      Es lo que tenía que salir. El término $ij$ es
      $\vec n_i\cdot[\varepsilon]\,\vec n_j$, y como
      $[\varepsilon]\,\vec n_j = \varepsilon_j\,\vec n_j$, queda
      $\varepsilon_j\,\vec n_i\cdot\vec n_j$: cero fuera de la diagonal,
      porque las direcciones son perpendiculares, y la principal $j$ en la
      diagonal. El orden de las filas de $[R]$ es el orden de la diagonal.

      **5. Comprobación.** Los invariantes (en $10^{-4}$, $10^{-8}$ y
      $10^{-12}$). Con las componentes,

      $$
      I_1 = 4 + 0 + 0 = 4,\qquad
      I_2 = 4\cdot0 + 0\cdot0 + 0\cdot4 - 6^{2} = -36,\qquad
      I_3 = 4\cdot(0\cdot0 - 6^{2}) = -144
      $$

      y con las principales, $6 + 4 - 6 = 4$,
      $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$ y $6\cdot4\cdot(-6) = -144$.

      **Lo que dice el resultado.** Las direcciones 1 y 3 son las bisectrices
      de $y$ y $z$: en el plano yz el punto está en distorsión pura, que
      alarga una bisectriz lo mismo que acorta la otra, y las principales
      valen $\pm\tfrac12\gamma_{yz}$, la mitad de la distorsión, no
      $\pm\gamma_{yz}$.

  # ── Ejercicio de clase 3.1 · la disminución del ángulo entre dos direcciones
  #    cualesquiera. Una demostración: los pasos de cálculo la comprueban con
  #    un ejemplo nuestro.
  - id: ejerm3-cl3-1-la-disminucion-de-un-angulo-cualquiera
    titulo: La disminución del ángulo entre dos direcciones cualesquiera
    fuente: >-
      Ejercicio 3.1 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material trae una solución en esquema, de una
      página («Solución del ejercicio 3.1»), con los pasos sin desarrollar; la
      resolución de aquí es nuestra, sigue esos pasos y los completa con los
      convenios del tema 3 (apuntes, pp. 12 y 14). Como es una demostración sin números, los pasos de cálculo la
      comprueban en un ejemplo nuestro: cada cifra sale del motor del curso y
      está comprobada por un segundo camino que no linealiza, dicho en cada
      desarrollo. El enunciado está transcrito de la página del ejercicio, con
      sus notas aparte.
    nivel: practica
    antes:
      idea: |
        Es una demostración de primer orden: se parte de una igualdad exacta
        entre los elementos deformados y después se quita todo lo que es de
        segundo orden en las derivadas de los desplazamientos. $\Gamma$ es
        pequeña, del orden de las deformaciones.
      formula: |
        $$
        \cos(\varphi - \Gamma) \approx \cos\varphi + \Gamma\operatorname{sen}\varphi
        \qquad
        (1 + \varepsilon_1)(1 + \varepsilon_2) \approx 1 + \varepsilon_1 + \varepsilon_2
        $$

        Las dos aproximaciones de primer orden que hacen falta.
      reconocer: |
        «Demostrar que…» con la fórmula dada: hay que llegar a ella paso a
        paso, diciendo qué se desprecia en cada uno y por qué. La segunda forma
        sale de una propiedad del tensor.
    enunciado: |
      Los elementos diferenciales $d\vec r_1$ y $d\vec r_2$ con origen en O
      forman el ángulo $\varphi$ antes de la deformación. Tras deformarse, los
      elementos $d\vec r_1\,'$ y $d\vec r_2\,'$ forman el ángulo $\varphi'$.
      Demostrar que la disminución de ángulo $\Gamma = \varphi - \varphi'$
      viene dada por:

      $$
      \Gamma = \frac{2\{u_1\}^{T}[\varepsilon]\{u_2\} - (\varepsilon_1 + \varepsilon_2)\cos\varphi}{\sin\varphi}
      = \frac{2\{u_2\}^{T}[\varepsilon]\{u_1\} - (\varepsilon_1 + \varepsilon_2)\cos\varphi}{\sin\varphi}
      $$

      A tener en cuenta:

      $$
      \vec u_1 = \frac{d\vec r_1}{dr_1}\qquad
      \vec u_2 = \frac{d\vec r_2}{dr_2}\qquad
      1 + \varepsilon_1 = \frac{dr_1'}{dr_1}\qquad
      1 + \varepsilon_2 = \frac{dr_2'}{dr_2}
      $$
    notas:
      - >-
        Notas: Siendo x cualquiera de las derivadas parciales de las
        componentes de desplazamiento, $x^{2} \ll x$. La variación $\Gamma$ es
        muy pequeña.
    pide: >-
      La demostración de la fórmula de Γ, en sus dos formas. Los pasos de
      cálculo la comprueban en un ejemplo nuestro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué igualdad se parte para llegar a $\Gamma$?
        opciones:
          - texto: >-
              Del producto escalar $d\vec r_1\,'\cdot d\vec r_2\,'$, escrito de
              dos maneras: con las longitudes deformadas y $\cos\varphi'$, y con
              los dos elementos transformados
            correcta: true
            mensaje: |
              Eso es. Por un lado,
              $d\vec r_1\,'\cdot d\vec r_2\,' = dr_1'\,dr_2'\cos\varphi' = dr_1\,dr_2\,(1 + \varepsilon_1)(1 + \varepsilon_2)\cos\varphi'$,
              que trae $\varphi'$. Por el otro, cada elemento transformado sale
              del tensor, y el producto trae $\{u_1\}^{T}[\varepsilon]\{u_2\}$.
              Igualándolos queda una ecuación con $\Gamma$ dentro.
          - texto: >-
              De la definición $\gamma = \tfrac{\pi}{2} - \varphi'$ (ec. 3.15),
              aplicada a $\vec u_1$ y $\vec u_2$
            mensaje: |
              La ec. 3.15 define la distorsión de dos direcciones que eran
              perpendiculares. Aquí $\varphi$ es cualquiera: el ángulo de
              partida no es $\tfrac{\pi}{2}$, y la definición no dice cómo se
              calcula $\varphi'$.
          - texto: >-
              De la fórmula de la galga, $\varepsilon_u = \{u\}^{T}[\varepsilon]\{u\}$,
              en la bisectriz de $\vec u_1$ y $\vec u_2$
            mensaje: |
              La ec. 3.52 da cuánto se alarga una dirección, no cuánto se
              cierra el ángulo entre dos. Con galgas a 0°, 45° y 90° se llega a
              $\gamma$, pero solo porque son las direcciones de la roseta; con
              un $\varphi$ cualquiera hace falta otro camino.
      - tipo: reconocer
        pregunta: |
          El gradiente de desplazamientos es $[g] = [\varepsilon] + [\omega]$
          (ecs. 3.30 a 3.34). ¿Hace falta la parte antisimétrica, $[\omega]$,
          para calcular $\Gamma$?
        opciones:
          - texto: >-
              No: a primer orden el giro no cambia el ángulo entre dos
              elementos, y basta con $d\vec r\,' = d\vec r + [\varepsilon]\,d\vec r$
              (ec. 3.46)
            correcta: true
            mensaje: |
              Eso es. En el producto escalar, $[\omega]$ entraría como
              $\{u_1\}^{T}\bigl([\omega] + [\omega]^{T}\bigr)\{u_2\}$, que es
              cero porque $[\omega]^{T} = -[\omega]$; lo que queda de él es de
              segundo orden. Es lo que demuestran los apuntes en la p. 14 (ecs.
              3.43 a 3.45), y por eso la solución del material arranca de la
              transformación simétrica.
          - texto: >-
              Sí: el giro mueve los dos elementos y cambia $\varphi'$
            mensaje: |
              El giro mueve los dos elementos, pero los mueve juntos: los dos
              giran el mismo $\vec\omega$, y el ángulo entre ellos se conserva a
              primer orden (ec. 3.45). Lo que cierra o abre el ángulo es la
              parte simétrica.
          - texto: >-
              Solo cuando $\varphi = 90°$
            mensaje: |
              La demostración de los apuntes (ecs. 3.43 a 3.45) vale para
              cualquier ángulo: el término que deja el giro,
              $\omega^{2}\operatorname{sen}\theta_1\operatorname{sen}\theta_2\cos\beta$,
              es de segundo orden sea cual sea $\varphi$.
      - tipo: calcular
        titulo: La deformación de la dirección 2
        pregunta: |
          Un ejemplo nuestro: en un punto, $\varepsilon_x = 500\cdot10^{-6}$,
          $\varepsilon_y = -300\cdot10^{-6}$ y $\gamma_{xy} = 400\cdot10^{-6}$,
          con las demás componentes nulas; $\vec u_1 = (1, 0, 0)$ y
          $\vec u_2 = (3/5, 4/5, 0)$, que forman un $\varphi$ con
          $\cos\varphi = 0{,}6$ y $\operatorname{sen}\varphi = 0{,}8$. ¿Cuánto
          vale $\varepsilon_2$, la deformación de la dirección $\vec u_2$, en
          unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '180'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '84'
            mensaje: |
              Has escrito la fórmula de la galga con $\tfrac12\gamma_{xy}$:
              $0{,}36\cdot500 - 0{,}64\cdot300 + 0{,}48\cdot200$. La ec. 3.55
              lleva la $\gamma$ entera, $\gamma_{xy}\,u_x u_y$; la mitad va en
              el tensor.
          - valor: '404'
            mensaje: |
              Has cambiado el coseno por el seno: con $u_x^{2} = 0{,}64$ y
              $u_y^{2} = 0{,}36$ la dirección sería la de 36,87°. Con
              $\vec u_2 = (0{,}6;\ 0{,}8;\ 0)$, $u_x^{2} = 0{,}36$ y
              $u_y^{2} = 0{,}64$.
        pista: |
          Ec. 3.55 con $u_x = 0{,}6$ y $u_y = 0{,}8$.
        desarrollo: |
          $$
          \varepsilon_2 = \varepsilon_x u_x^{2} + \varepsilon_y u_y^{2} + \gamma_{xy}u_x u_y
          = (500\cdot0{,}36 - 300\cdot0{,}64 + 400\cdot0{,}48)\cdot10^{-6} = 180\cdot10^{-6}
          $$

          Y $\varepsilon_1 = \varepsilon_x = 500\cdot10^{-6}$, porque $\vec u_1$
          es el eje $x$.
      - tipo: calcular
        titulo: El término cruzado
        pregunta: |
          Con el mismo ejemplo, ¿cuánto vale $\{u_1\}^{T}[\varepsilon]\{u_2\}$,
          en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '460'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '620'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera fuera de la diagonal. La fila de
              $x$ del tensor es
              $(\varepsilon_x,\ \tfrac12\gamma_{xy},\ 0) = (500,\ 200,\ 0)\cdot10^{-6}$
              (ec. 3.35).
          - valor: '300'
            mensaje: |
              Es $\varepsilon_x\cdot0{,}6$, solo el término de la diagonal. La
              primera componente de $[\varepsilon]\{u_2\}$ es
              $\varepsilon_x\cdot0{,}6 + \tfrac12\gamma_{xy}\cdot0{,}8$: falta el
              de fuera de la diagonal.
        pista: |
          Calcula $[\varepsilon]\{u_2\}$ y quédate con su componente según
          $\vec u_1 = (1, 0, 0)$.
        desarrollo: |
          $$
          [\varepsilon]\{u_2\} =
          \begin{bmatrix} 500 & 200 & 0\\ 200 & -300 & 0\\ 0 & 0 & 0 \end{bmatrix}
          \begin{Bmatrix} 0{,}6\\ 0{,}8\\ 0 \end{Bmatrix}\cdot10^{-6}
          = \begin{Bmatrix} 460\\ -120\\ 0 \end{Bmatrix}\cdot10^{-6}
          $$

          y $\{u_1\}^{T}[\varepsilon]\{u_2\} = 460\cdot10^{-6}$, la primera
          componente. Al revés da lo mismo, porque el tensor es simétrico:
          $[\varepsilon]\{u_1\} = (500,\ 200,\ 0)\cdot10^{-6}$ y
          $\{u_2\}^{T}[\varepsilon]\{u_1\} = (300 + 160)\cdot10^{-6} = 460\cdot10^{-6}$.
      - tipo: calcular
        titulo: La disminución del ángulo
        pregunta: |
          ¿Cuánto vale $\Gamma$ en el ejemplo, en unidades de $10^{-6}$ rad?
        respuesta:
          tipo: numero
          valor: '640'
          tolerancia: 1
          formato: un número, en 10⁻⁶ rad
        distractores:
          - valor: '1150'
            mensaje: |
              Te has dejado el término $(\varepsilon_1 + \varepsilon_2)\cos\varphi$:
              $2\cdot460/0{,}8$. Ese término cuenta que los dos lados se
              alargan; sin él, la fórmula solo vale con $\varphi = 90°$, donde
              $\cos\varphi = 0$.
          - valor: '65'
            mensaje: |
              Falta el 2 delante de $\{u_1\}^{T}[\varepsilon]\{u_2\}$. Sale de
              los dos términos cruzados del producto escalar,
              $\{u_1\}^{T}[\varepsilon]\{u_2\} + \{u_2\}^{T}[\varepsilon]\{u_1\}$,
              que son iguales porque el tensor es simétrico.
          - valor: '896'
            mensaje: |
              Es lo que sale con $\gamma_{xy}$ entera fuera de la diagonal del
              tensor: cambian a la vez el término cruzado, que pasa a 620, y
              $\varepsilon_2$, que pasa a 372. En el tensor va
              $\tfrac12\gamma_{xy}$.
        pista: |
          $\Gamma = [2\cdot460 - (500 + 180)\cdot0{,}6]/0{,}8$, en $10^{-6}$ rad.
        desarrollo: |
          $$
          \Gamma = \frac{2\cdot460 - (500 + 180)\cdot0{,}6}{0{,}8}\cdot10^{-6}
          = \frac{920 - 408}{0{,}8}\cdot10^{-6} = 640\cdot10^{-6}
          $$

          en radianes. Sin linealizar nada —los dos vectores transformados con
          $[I] + [\varepsilon]$ y el ángulo entre ellos calculado tal cual— sale
          $\varphi - \varphi' = 639{,}8\cdot10^{-6}$ rad: la diferencia es del
          orden de $\varepsilon^{2}$, lo que las notas dejan despreciar. Y si al
          gradiente se le suma un giro, el ángulo exacto apenas cambia.
      - tipo: calcular
        titulo: La comprobación con φ = 90°
        pregunta: |
          Con el mismo tensor y $\vec u_2 = (0, 1, 0)$, el eje $y$, ¿cuánto da
          la fórmula, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '200'
            mensaje: |
              Es $\{u_1\}^{T}[\varepsilon]\{u_2\} = \tfrac12\gamma_{xy}$, sin el
              2. Con $\varphi = 90°$ la fórmula es
              $\Gamma = 2\{u_1\}^{T}[\varepsilon]\{u_2\} = 2\cdot\tfrac12\gamma_{xy}$.
          - valor: '800'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el tensor: $2\cdot400$. Con la
              mitad en el tensor, la fórmula devuelve $\gamma_{xy}$, que es lo
              que tiene que salir.
        pista: |
          Con $\varphi = 90°$, $\cos\varphi = 0$ y $\operatorname{sen}\varphi = 1$.
        desarrollo: |
          $$
          \Gamma = 2\{u_1\}^{T}[\varepsilon]\{u_2\} = 2\cdot200\cdot10^{-6} = 400\cdot10^{-6}
          $$

          que es $\gamma_{xy}$: con dos direcciones que eran perpendiculares, lo
          que se cierra el ángulo es la distorsión (ec. 3.15). La fórmula del
          3.1 la generaliza a cualquier $\varphi$. Calculada sin linealizar, con
          las aristas $x$ e $y$ deformadas, la distorsión exacta es
          $399{,}96\cdot10^{-6}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la demostración completa, como en el examen: de dónde se
          parte, qué se desprecia y por qué, y de dónde sale la segunda forma.
        rubrica:
          - punto: >-
              Se parte de la transformación simétrica de cada elemento,
              dr' = dr + [ε]dr (ec. 3.46), y se dice por qué la rotación no
              hace falta.
            porque: >-
              El giro no cambia el ángulo a primer orden (ecs. 3.43 a 3.45); sin
              decirlo, la transformación elegida no está justificada.
            minimo: true
          - punto: >-
              El producto escalar de los dos elementos deformados se escribe de
              dos maneras: dr1·dr2·(1 + ε1)(1 + ε2)·cos φ', y dr1·dr2·[cos φ +
              {u1}ᵀ[ε]{u2} + {u2}ᵀ[ε]{u1} + {u1}ᵀ[ε]ᵀ[ε]{u2}].
            porque: >-
              Es la igualdad de la que sale todo, y la que escribe la solución
              del material.
            minimo: true
          - punto: >-
              El último sumando, {u1}ᵀ[ε]ᵀ[ε]{u2}, es de segundo orden y se
              desprecia; los dos cruzados son iguales porque [ε] es simétrico, y
              suman 2{u1}ᵀ[ε]{u2}.
            porque: >-
              Es la primera nota del enunciado puesta a trabajar, y de la
              simetría sale también la segunda forma de la fórmula.
          - punto: >-
              Con Γ pequeño, cos φ' = cos(φ − Γ) ≈ cos φ + Γ·sen φ; y
              (1 + ε1)(1 + ε2) ≈ 1 + ε1 + ε2.
            porque: >-
              Es la segunda nota del enunciado: sin linealizar el coseno, Γ no
              se puede despejar.
            minimo: true
          - punto: >-
              Al multiplicar aparece (ε1 + ε2)·Γ·sen φ, de segundo orden, que se
              desprecia; queda Γ·sen φ = 2{u1}ᵀ[ε]{u2} − (ε1 + ε2)·cos φ, y se
              despeja Γ.
            porque: >-
              Es el último paso de la solución del material, «tras despreciar
              términos de segundo orden», y el que da la fórmula.
          - punto: >-
              Se comprueba con φ = 90°: queda Γ = 2{u1}ᵀ[ε]{u2} = γ12, la
              distorsión de la ec. 3.15.
            porque: >-
              Una fórmula que no devuelve el caso conocido está mal, y esta
              comprobación cuesta una línea.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada elemento se transforma con la parte simétrica,
              $d\vec r\,' = d\vec r + [\varepsilon]\,d\vec r$: el giro no cambia
              el ángulo a primer orden.
          - texto: >-
              El producto escalar de los deformados vale
              $dr_1dr_2(1 + \varepsilon_1)(1 + \varepsilon_2)\cos\varphi'$ y
              también $dr_1dr_2\,[\cos\varphi + 2\{u_1\}^{T}[\varepsilon]\{u_2\}]$,
              despreciado el término en $[\varepsilon]^{T}[\varepsilon]$.
          - texto: >-
              Con $\cos(\varphi - \Gamma) \approx \cos\varphi + \Gamma\operatorname{sen}\varphi$
              y $(1 + \varepsilon_1)(1 + \varepsilon_2) \approx 1 + \varepsilon_1 + \varepsilon_2$,
              se desprecia $(\varepsilon_1 + \varepsilon_2)\,\Gamma$ y se
              despeja $\Gamma$.
          - texto: >-
              Como el tensor es simétrico,
              $\{u_1\}^{T}[\varepsilon]\{u_2\} = \{u_2\}^{T}[\varepsilon]\{u_1\}$,
              y las dos formas son la misma.
          - texto: >-
              Con el gradiente entero, $[\omega]$ añade
              $2\{u_1\}^{T}[\omega]\{u_2\}$ al producto escalar, y hay que
              restarlo de $\Gamma$.
            trampa: true
            mensaje: |
              Los dos términos de la rotación son $\{u_1\}^{T}[\omega]\{u_2\}$ y
              $\{u_2\}^{T}[\omega]\{u_1\} = \{u_1\}^{T}[\omega]^{T}\{u_2\} = -\{u_1\}^{T}[\omega]\{u_2\}$:
              se anulan entre sí. La rotación no aporta nada a primer orden.
    resolucion: |
      **La idea.** El ángulo entre dos elementos está dentro de su producto
      escalar. Se escribe ese producto de los elementos ya deformados de dos
      maneras —una con $\varphi'$, otra con el tensor— y se igualan.

      **La transformación.** El gradiente de desplazamientos es la suma de la
      parte simétrica, el tensor de deformaciones, y la antisimétrica, la
      rotación (ecs. 3.30 a 3.34). La rotación no cambia el ángulo entre dos
      elementos a primer orden (ecs. 3.43 a 3.45, p. 14): basta con la
      transformación simétrica (ec. 3.46),

      $$
      \{dr_1'\} = \{dr_1\} + [\varepsilon]\{dr_1\},\qquad
      \{dr_2'\} = \{dr_2\} + [\varepsilon]\{dr_2\}
      $$

      **El producto escalar, dos veces.** Con las longitudes deformadas,
      $dr_1' = dr_1(1 + \varepsilon_1)$ y $dr_2' = dr_2(1 + \varepsilon_2)$:

      $$
      d\vec r_1\,'\cdot d\vec r_2\,' = dr_1\,dr_2\,(1 + \varepsilon_1)(1 + \varepsilon_2)\cos\varphi'
      $$

      Y con la transformación, dividiendo entre $dr_1\,dr_2$:

      $$
      (1 + \varepsilon_1)(1 + \varepsilon_2)\cos\varphi' = \cos\varphi + \{u_1\}^{T}[\varepsilon]\{u_2\}
      + \{u_2\}^{T}[\varepsilon]\{u_1\} + \{u_1\}^{T}[\varepsilon]^{T}[\varepsilon]\{u_2\}
      $$

      El último sumando es de segundo orden en las derivadas de los
      desplazamientos (primera nota): se desprecia. Los dos cruzados son
      iguales, porque el tensor es simétrico, y suman
      $2\{u_1\}^{T}[\varepsilon]\{u_2\}$.

      **Linealizar.** $\Gamma$ es muy pequeña (segunda nota):
      $\cos\varphi' = \cos(\varphi - \Gamma) \approx \cos\varphi + \Gamma\operatorname{sen}\varphi$.
      Y $(1 + \varepsilon_1)(1 + \varepsilon_2) \approx 1 + \varepsilon_1 + \varepsilon_2$.
      Queda el paso previo de la solución del material:

      $$
      (1 + \varepsilon_1 + \varepsilon_2)(\cos\varphi + \Gamma\operatorname{sen}\varphi) = \cos\varphi + 2\{u_1\}^{T}[\varepsilon]\{u_2\}
      $$

      Al multiplicar, $\cos\varphi$ se va de los dos lados y aparece
      $(\varepsilon_1 + \varepsilon_2)\,\Gamma\operatorname{sen}\varphi$, de
      segundo orden. Despreciándolo:

      $$
      \Gamma\operatorname{sen}\varphi = 2\{u_1\}^{T}[\varepsilon]\{u_2\} - (\varepsilon_1 + \varepsilon_2)\cos\varphi
      $$

      que es la fórmula. La segunda forma es la misma, porque
      $\{u_1\}^{T}[\varepsilon]\{u_2\} = \{u_2\}^{T}[\varepsilon]\{u_1\}$.

      **La comprobación con φ = 90°.** Queda
      $\Gamma = 2\{u_1\}^{T}[\varepsilon]\{u_2\} = 2\varepsilon_{12} = \gamma_{12}$:
      la distorsión de la ec. 3.15, lo que se cierra el ángulo recto.

      **El ejemplo nuestro.** Con $\varepsilon_x = 500$, $\varepsilon_y = -300$
      y $\gamma_{xy} = 400$ (en $10^{-6}$), $\vec u_1 = (1, 0, 0)$ y
      $\vec u_2 = (0{,}6;\ 0{,}8;\ 0)$: $\varepsilon_1 = 500$,
      $\varepsilon_2 = 180$ y $\{u_1\}^{T}[\varepsilon]\{u_2\} = 460$, así que

      $$
      \Gamma = \frac{2\cdot460 - (500 + 180)\cdot0{,}6}{0{,}8}\cdot10^{-6} = 640\cdot10^{-6}
      $$

      en radianes. El ángulo exacto entre los dos elementos deformados, sin
      linealizar, da $639{,}8\cdot10^{-6}$ rad: la diferencia es de segundo
      orden.

  # ── Ejercicio de clase 3.3 · tres galgas y la distorsión del ángulo recto
  #    entre a y b.
  - id: ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b
    titulo: Tres galgas y la distorsión del ángulo recto entre a y b
    fuente: >-
      Ejercicio 3.3 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (apuntes, pp. 8 y 17). Cada cifra
      sale del motor del curso, que resuelve las tres ecuaciones de las galgas,
      y está comprobada por un segundo camino: las ecuaciones despejadas a
      mano, las tres lecturas devueltas por la ec. 3.55 y la distorsión exacta
      de las dos aristas deformadas. El enunciado está
      transcrito de la página del ejercicio.
    nivel: practica
    antes:
      idea: |
        Dos de las galgas están sobre direcciones perpendiculares y pueden hacer
        de ejes. Con eso el estado plano tiene una sola incógnita, y la tercera
        galga da la ecuación que falta.
      formula: |
        $$
        \varepsilon_\alpha = \varepsilon_x\cos^{2}\alpha + \varepsilon_y\operatorname{sen}^{2}\alpha + \gamma_{xy}\operatorname{sen}\alpha\cos\alpha
        $$

        La lectura de una galga a $\alpha$ de $x$, medido en sentido
        antihorario (ec. 3.55).
      reconocer: |
        Lo que piden tiene un nombre del tema 3 que hay que traducir a una
        componente. Y el ángulo de la figura no está medido desde donde lo pide
        la fórmula.
    enunciado: |
      Las galgas extensométricas de la figura proporcionan las siguientes
      medidas, siendo $\tan\theta = 3/4$:

      $\varepsilon_a = 3\cdot10^{-3}$; $\varepsilon_b = 2\cdot10^{-3}$; $\varepsilon_c = -4\cdot10^{-3}$

      Determinar la deformación angular del ángulo recto que forman las
      direcciones *a* y *b*.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 220" role="img" width="320" height="220" aria-labelledby="ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b-fig-t ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b-fig-d">
      <title id="ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b-fig-t">Las tres galgas del ejercicio 3.3 y el ángulo θ</title>
      <desc id="ejerm3-cl3-3-tres-galgas-y-la-distorsion-entre-a-y-b-fig-d">Tres galgas extensométricas sobre tres rectas punteadas que salen de un mismo punto, abajo. La galga a está sobre la recta que va hacia la derecha, en horizontal. La galga b está sobre la recta que sube en vertical: a y b forman un ángulo recto. La galga c está sobre una recta que sube hacia la izquierda; un arco con punta en los dos extremos va de la recta de la b a la de la c y está rotulado θ, con tan θ = 3/4.</desc>
      <line x1="175" y1="200" x2="300" y2="200" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="175" y1="200" x2="175" y2="25" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="175" y1="200" x2="67" y2="56" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <g transform="translate(250 200) rotate(0)"><rect x="-22" y="-6" width="44" height="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-18 0 H-14 V-3.6 H14 V-1.2 H-12 V1.2 H14 V3.6 H-14" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <g transform="translate(175 105) rotate(-90)"><rect x="-22" y="-6" width="44" height="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-18 0 H-14 V-3.6 H14 V-1.2 H-12 V1.2 H14 V3.6 H-14" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <g transform="translate(119.8 126.4) rotate(-126.87)"><rect x="-22" y="-6" width="44" height="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-18 0 H-14 V-3.6 H14 V-1.2 H-12 V1.2 H14 V3.6 H-14" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <text x="245" y="187" font-size="13" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke" font-style="italic">a</text>
      <text x="188" y="110" font-size="13" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke" font-style="italic">b</text>
      <text x="89.8" y="140.4" font-size="13" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke" font-style="italic">c</text>
      <path d="M92.2 89.6 A138 138 0 0 1 175 62" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="175,62 168,64.6 168,59.4" fill="var(--ink)"/><polygon points="92.2,89.6 96.24,83.32 99.36,87.48" fill="var(--ink)"/>
      <text x="121.04" y="54.11" font-size="13" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke" font-style="italic">θ</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: las tres galgas, las rectas punteadas sobre
      las que van y el ángulo θ, como en el original.

      </figcaption>
      </figure>
    pide: >-
      La deformación angular del ángulo recto que forman las direcciones a y b.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $x$ según la galga a e $y$ según la b, ¿a qué ángulo de $x$,
          medido en sentido antihorario, está la galga c?
        opciones:
          - texto: $90° + \theta = 126{,}87°$
            correcta: true
            mensaje: |
              Eso es. θ se mide desde la recta de la b, que es el eje $y$, hacia
              la izquierda: la c está θ más allá de los 90°. Con
              $\tan\theta = 3/4$, $\theta = 36{,}87°$, y en la dirección de la c
              $\cos = -0{,}6$ y $\operatorname{sen} = 0{,}8$.
          - texto: $\theta = 36{,}87°$
            mensaje: |
              Ese sería el ángulo de una galga θ por encima de $x$, a la
              derecha de la b. El arco de θ sale de la recta de la b, no de la
              de la a.
          - texto: $90° - \theta = 53{,}13°$
            mensaje: |
              Es la recta simétrica, θ a la derecha de la b. En la figura la c
              sube hacia la izquierda: está θ más allá de la vertical.
      - tipo: reconocer
        pregunta: |
          ¿Qué es «la deformación angular del ángulo recto que forman las
          direcciones a y b»?
        opciones:
          - texto: >-
              $\gamma_{ab}$, lo que se cierra el ángulo recto entre a y b
              (ec. 3.15)
            correcta: true
            mensaje: |
              Eso es. Con $x$ según a e $y$ según b, es $\gamma_{xy}$: la
              distorsión, positiva si el ángulo se cierra.
          - texto: >-
              $\tfrac12\gamma_{ab}$, la componente del tensor de deformaciones
            mensaje: |
              La componente del tensor es la mitad de la distorsión (ec. 3.35).
              Lo que se cierra el ángulo recto es la distorsión entera.
          - texto: >-
              Lo que gira la dirección a
            mensaje: |
              El giro de una dirección sola no es una deformación: puede ser un
              giro de sólido rígido. Lo que deforma es lo que cambia el ángulo
              entre las dos.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las tres galgas con los ejes
          elegidos y el ángulo de cada una desde x**.
        comprueba:
          - punto: |
              **x según a e y según b: sus lecturas son $\varepsilon_x$ y
              $\varepsilon_y$.**
            porque: |
              Una galga mide la deformación normal de su dirección, y a y b son
              perpendiculares: valen de ejes.
          - punto: |
              **c a $\alpha = 90° + \theta$ de x, en sentido antihorario.**
            porque: |
              θ se mide desde la recta de b hacia la izquierda, y la ecuación
              de la galga pide el ángulo desde x.
          - punto: |
              **Una sola incógnita: $\gamma_{ab}$.**
            porque: |
              $\varepsilon_x$ y $\varepsilon_y$ son lecturas; la galga c da la
              ecuación que falta.
        figura: |
          <svg viewBox="0 14 260 190" role="img" width="260" height="190" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Las tres galgas con sus ángulos desde x</title>
            <desc id="dsl-d">Desde un punto O salen tres flechas finas: a hacia la derecha, que hace de eje x; b hacia arriba, que hace de eje y; y c hacia arriba a la izquierda. Un arco de x a c marca el ángulo alfa, y otro, más grande, de b a c, el ángulo theta.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M136 160 A26 26 0 0 0 94.4 139.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="128" y="136" font-size="10" fill="var(--ink)">α</text>
            <path d="M110 98 A62 62 0 0 0 72.8 110.4" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="88" y="90" font-size="10" fill="var(--ink)">θ</text>
            <line x1="110" y1="160" x2="232" y2="160" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="236" y="164" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a (x)</text>
            <line x1="110" y1="160" x2="110" y2="40" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="116" y="42" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">b (y)</text>
            <line x1="110" y1="160" x2="38" y2="64" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="32" y="60" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">c</text>
            <circle cx="110" cy="160" r="2.4" fill="var(--ink)"/>
            <text x="104" y="176" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
          </svg>

      - tipo: calcular
        titulo: La distorsión entre a y b
        pregunta: |
          ¿Cuánto vale $\gamma_{ab}$, en unidades de $10^{-3}$ rad?
        respuesta:
          tipo: numero
          valor: '13.25'
          tolerancia: 0.02
          formato: un número, en 10⁻³ rad, con su signo
        distractores:
          - valor: '-13.25'
            mensaje: |
              Sale con la c a 53,13°, a la derecha de la b: el término de
              $\gamma$ cambia de signo, porque
              $\operatorname{sen}\alpha\cos\alpha$ cambia de signo. La c sube
              hacia la izquierda, a 126,87°, y ahí el coseno es $-0{,}6$.
          - valor: '13.833'
            mensaje: |
              Sale con la c a 143,13°, con θ medido desde la horizontal por la
              izquierda. El arco de θ arranca en la recta de la b, la vertical:
              la c está a $90° + \theta = 126{,}87°$.
          - valor: '26.5'
            mensaje: |
              Has escrito la galga con $\tfrac12\gamma$:
              $-4 = 1{,}08 + 1{,}28 - 0{,}24\,\gamma_{ab}$. La ec. 3.55 lleva la
              $\gamma$ entera; con la mitad, la $\gamma$ sale doble.
          - valor: '6.625'
            mensaje: |
              Es $\tfrac12\gamma_{ab}$, la componente del tensor. Se pide la
              deformación angular del ángulo recto: la distorsión entera.
          - valor: '-13.833'
            mensaje: |
              Sale con la c a θ = 36,87° de $x$, a la derecha de la b. El arco
              de θ arranca en la recta de la b, la vertical, y la c sube hacia
              la izquierda: está a $90° + \theta = 126{,}87°$.
        pista: |
          La ec. 3.55 en la galga c, con $\alpha = 126{,}87°$:
          $\varepsilon_c = \varepsilon_a\cos^{2}\alpha + \varepsilon_b\operatorname{sen}^{2}\alpha + \gamma_{ab}\operatorname{sen}\alpha\cos\alpha$.
        desarrollo: |
          En $10^{-3}$, con $\cos^{2}\alpha = 0{,}36$, $\operatorname{sen}^{2}\alpha = 0{,}64$
          y $\operatorname{sen}\alpha\cos\alpha = -0{,}48$:

          $$
          -4 = 3\cdot0{,}36 + 2\cdot0{,}64 - 0{,}48\,\gamma_{ab}
          \;\Longrightarrow\;
          \gamma_{ab} = \frac{1{,}08 + 1{,}28 + 4}{0{,}48}\cdot10^{-3} = 13{,}25\cdot10^{-3}
          $$

          Comprobación: con $\varepsilon_x = 3$, $\varepsilon_y = 2$ y
          $\gamma_{xy} = 13{,}25$, la ec. 3.55 a 126,87° devuelve
          $1{,}08 + 1{,}28 - 6{,}36 = -4$, la lectura de la c.
      - tipo: reconocer
        pregunta: |
          Con $\gamma_{ab} = 13{,}25\cdot10^{-3}$, ¿cómo queda el ángulo entre a
          y b después de deformarse?
        opciones:
          - texto: >-
              Menor que 90°: una $\gamma$ positiva cierra el ángulo recto, aquí
              unos 0,76°
            correcta: true
            mensaje: |
              Eso es. $13{,}25\cdot10^{-3}$ rad son 0,76°: el ángulo pasa a unos
              89,24°. Calculada sin linealizar, con las dos aristas
              deformadas, la distorsión es $13{,}22\cdot10^{-3}$ rad: la
              diferencia es de segundo orden.
          - texto: >-
              Mayor que 90°
            mensaje: |
              Eso sería con $\gamma$ negativa. Por la ec. 3.15,
              $\gamma_{xy} = \tfrac{\pi}{2} - \varphi_{xy}$: si $\gamma$ es
              positiva, el ángulo deformado es menor que el recto.
          - texto: >-
              Sigue siendo 90°, porque las galgas a y b no giran
            mensaje: |
              Las galgas solo miden alargamientos: no dicen si las aristas
              giran. La distorsión que acabas de calcular es justo lo que
              cambia el ángulo entre ellas.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $x$ según a e $y$ según b, $\varepsilon_x = 3\cdot10^{-3}$ y
              $\varepsilon_y = 2\cdot10^{-3}$ son lecturas directas.
          - texto: >-
              La c está a $90° + \theta = 126{,}87°$ de $x$, con
              $\cos = -0{,}6$ y $\operatorname{sen} = 0{,}8$.
          - texto: >-
              Su ec. 3.55 es $-4 = 1{,}08 + 1{,}28 - 0{,}48\,\gamma_{ab}$ (en
              $10^{-3}$), y de ahí $\gamma_{ab} = 13{,}25\cdot10^{-3}$.
          - texto: >-
              Es positiva: el ángulo recto entre a y b se cierra unos 0,76°.
          - texto: >-
              Como a y b están dibujadas a 90°, $\gamma_{ab} = 0$ y la galga c
              no hace falta.
            trampa: true
            mensaje: |
              La figura es la de antes de deformarse. Que dos galgas se peguen a
              90° no dice nada de lo que se cierra el ángulo después: eso lo da
              la tercera lectura.
    resolucion: |
      **1. El estado de deformación.** Son tres galgas en un punto, dos de
      ellas perpendiculares. El dibujo lleva las tres con los ejes elegidos
      y sus ángulos.

      <figure class="figura-examen">
      <svg viewBox="0 14 260 190" role="img" width="390" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las tres galgas con sus ángulos desde x</title>
        <desc id="dsl-d">Desde un punto O salen tres flechas finas: a hacia la derecha, que hace de eje x; b hacia arriba, que hace de eje y; y c hacia arriba a la izquierda. Un arco de x a c marca el ángulo alfa, y otro, más grande, de b a c, el ángulo theta.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M136 160 A26 26 0 0 0 94.4 139.2" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="128" y="136" font-size="10" fill="var(--ink)">α</text>
        <path d="M110 98 A62 62 0 0 0 72.8 110.4" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="88" y="90" font-size="10" fill="var(--ink)">θ</text>
        <line x1="110" y1="160" x2="232" y2="160" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="236" y="164" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a (x)</text>
        <line x1="110" y1="160" x2="110" y2="40" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="116" y="42" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">b (y)</text>
        <line x1="110" y1="160" x2="38" y2="64" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="32" y="60" font-size="10" text-anchor="end" fill="var(--ink)" font-style="italic">c</text>
        <circle cx="110" cy="160" r="2.4" fill="var(--ink)"/>
        <text x="104" y="176" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
      </svg>
      <figcaption>

      Las galgas a y b hacen de ejes x e y; la c está a α = 90° + θ de x, medido en sentido antihorario. Las lecturas, en milésimas: 3, 2 y −4.

      </figcaption>
      </figure>

      - **a y b** hacen de ejes: dan $\varepsilon_x = 3\cdot10^{-3}$ y
        $\varepsilon_y = 2\cdot10^{-3}$ sin cuentas.
      - **c** está a $\alpha = 90° + \theta$ de $x$: θ se mide desde la recta
        de la b hacia la izquierda.

      **2. Incógnitas.** $\gamma_{ab}$, la distorsión entre a y b: lo que se
      cierra el ángulo recto que forman (ec. 3.15).

      **3. Ecuaciones.** La de la galga (ec. 3.55, p. 17), escrita para la c:

      $$
      \varepsilon_c = \varepsilon_a\cos^{2}\alpha + \varepsilon_b\operatorname{sen}^{2}\alpha + \gamma_{ab}\operatorname{sen}\alpha\cos\alpha
      $$

      **4. Resultados.** **El ángulo de la c.** Con $\tan\theta = 3/4$,
      $\theta = 36{,}87°$ y $\alpha = 126{,}87°$: $\cos\alpha = -0{,}6$ y
      $\operatorname{sen}\alpha = 0{,}8$.

      **La distorsión.** En $10^{-3}$:

      $$
      -4 = 3\cdot0{,}36 + 2\cdot0{,}64 - 0{,}48\,\gamma_{ab} = 1{,}08 + 1{,}28 - 0{,}48\,\gamma_{ab}
      \;\Longrightarrow\;
      \gamma_{ab} = \frac{6{,}36}{0{,}48}\cdot10^{-3} = 13{,}25\cdot10^{-3}
      $$

      Es la deformación angular que se pide: el ángulo recto entre a y b se
      cierra $13{,}25\cdot10^{-3}$ rad, unos 0,76°. En el tensor iría la
      mitad, $6{,}625\cdot10^{-3}$.

      **5. Comprobación.** Con $\varepsilon_x = 3$, $\varepsilon_y = 2$ y
      $\gamma_{xy} = 13{,}25$ (en $10^{-3}$), la ec. 3.55 devuelve las tres
      lecturas: 3 a 0°, 2 a 90° y $-4$ a 126,87°. Y transformando las
      aristas $x$ e $y$ con el tensor y midiendo el ángulo entre ellas sin
      linealizar, la distorsión sale $13{,}22\cdot10^{-3}$ rad: con
      deformaciones de $10^{-3}$, el segundo orden se nota en la tercera
      cifra.

      **Lo que dice el resultado.** a y b se alargan y, aun así, la c se
      acorta: sin distorsión leería $2{,}36\cdot10^{-3}$, y es la distorsión
      la que la lleva a $-4\cdot10^{-3}$. Que a y b estén dibujadas a 90° no
      dice nada: el dibujo es de antes de deformarse.

  # ── Ejercicio de clase 3.4 · la placa OABC deformada: dos alargamientos y
  #    un ángulo que no cambia.
  - id: ejerm3-cl3-4-la-placa-oabc-deformada
    titulo: La placa OABC deformada, de dos alargamientos y un ángulo a las principales
    fuente: >-
      Ejercicio 3.4 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (apuntes, pp. 8, 12 y 17) y la
      fórmula del ejercicio 3.1, que la nota impresa cita. Cada cifra sale del
      motor del curso y está comprobada por un segundo camino: las ecuaciones
      despejadas a mano, las principales por el centro y el radio del círculo
      de Mohr y devueltas por la fórmula de la galga, y los desplazamientos de
      A y de C, que tienen que dar las dos cotas de la figura. El enunciado
      está transcrito de la página del ejercicio, con su nota aparte; esa nota
      dice «ángulo OAC», y la lectura que se hace aquí está en el enunciado.
    nivel: practica
    antes:
      idea: |
        La placa da tres datos: lo que se alargan dos de sus lados y lo que pasa
        con el ángulo que forman. Son tres ecuaciones para las tres componentes
        del estado plano, y después todo es el círculo de Mohr.
      formula: |
        $$
        \Gamma = \frac{2\{u_1\}^{T}[\varepsilon]\{u_2\} - (\varepsilon_1 + \varepsilon_2)\cos\varphi}{\operatorname{sen}\varphi}
        $$

        La disminución del ángulo entre dos direcciones cualesquiera, la del
        ejercicio 3.1, que cita la nota del enunciado.
      reconocer: |
        Antes de nada hay que leer bien la figura: qué segmento mide cada cota y
        en qué dirección va cada lado de la placa.
    enunciado: |
      La deformación de la placa OABC de la figura es uniforme. Debido a la
      deformación pura pasa a la configuración OA’B’C’. Determinar:

      a/ $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$.

      b/ Deformaciones y direcciones principales.

      c/ Deformación tangencial máxima en el plano de la placa.

      <figure class="figura-examen">
      <svg viewBox="0 20 520 300" role="img" width="520" height="300" aria-labelledby="ejerm3-cl3-4-la-placa-oabc-deformada-fig-t ejerm3-cl3-4-la-placa-oabc-deformada-fig-d">
      <title id="ejerm3-cl3-4-la-placa-oabc-deformada-fig-t">La placa OABC del ejercicio 3.4 y su configuración deformada OA′B′C′</title>
      <desc id="ejerm3-cl3-4-la-placa-oabc-deformada-fig-d">Los ejes x, hacia la derecha, e y, hacia arriba, con el origen en O. La placa OABC, sombreada, es un paralelogramo: el lado OA va sobre el eje x y mide 10 cm, y el lado OC sale de O a 45° del eje x, acotado con un arco. En trazo discontinuo, la placa deformada OA′B′C′: A′ sigue sobre el eje x, 10⁻³ cm a la derecha de A, y C′ sigue sobre la recta de OC, más allá de C. A la izquierda, una cota paralela a OC va de la horizontal de O a la horizontal de C y mide 15 cm. Sobre su prolongación, otra cota de la horizontal de C a la de C′ mide 3·10⁻³ cm. Debajo, las cotas de 10 cm, de O a A, y de 10⁻³ cm, de A a A′. El dibujo exagera la deformación.</desc>
      <polygon points="110,250 260,250 419.1,90.9 269.1,90.9" fill="var(--faint)" fill-opacity=".30" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="260" y1="250" x2="282" y2="250" stroke="var(--live)" stroke-width="1.3" stroke-dasharray="5 4"/>
      <line x1="282" y1="250" x2="462.31" y2="69.69" stroke="var(--live)" stroke-width="1.3" stroke-dasharray="5 4"/>
