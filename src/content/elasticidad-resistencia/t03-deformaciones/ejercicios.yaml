      - tipo: calcular
        titulo: La deformación εy en el ejemplo
        pregunta: |
          Con el ejemplo nuestro de las notas, ¿cuánto vale $\varepsilon_y$, en
          unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '250'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶, con su signo
        distractores:
          - valor: '500'
            mensaje: |
              Este número sale de dos errores: olvidar el 2 de
              $2\operatorname{sen}^{2}\theta$ al despejar, o dar
              $\varepsilon_a$, que es $\varepsilon_x$. Sumando las de b y c,
              $\varepsilon_b + \varepsilon_c = 2\varepsilon_x\cos^{2}\theta + 2\varepsilon_y\operatorname{sen}^{2}\theta$.
          - valor: '55.556'
            mensaje: |
              Sale con θ medido desde la vertical, con las galgas a 90° − θ y
              a 90° + θ: el seno y el coseno se cambian. Con la b a θ de la
              base, $\cos^{2}\theta = 0{,}36$ y $\operatorname{sen}^{2}\theta = 0{,}64$.
          - valor: '180'
            mensaje: |
              Sale de tomar $\varepsilon_b + \varepsilon_c = \varepsilon_x + \varepsilon_y$,
              que solo vale con dos galgas perpendiculares. La b y la c están
              a θ y a 180° − θ:
              $\varepsilon_b + \varepsilon_c = 2\varepsilon_x\cos^{2}\theta + 2\varepsilon_y\operatorname{sen}^{2}\theta$.
        pista: |
          Escribe la ec. 3.55 de la b y de la c y súmalas: el término de
          $\gamma_{xy}$ se va.
        desarrollo: |
          En la c, $\cos(180° - \theta) = -\cos\theta$ y
          $\operatorname{sen}(180° - \theta) = \operatorname{sen}\theta$:

          $$
          \varepsilon_b = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta,\qquad
          \varepsilon_c = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta - \gamma_{xy}\operatorname{sen}\theta\cos\theta
          $$

          Sumando, con $\varepsilon_x = \varepsilon_a$:

          $$
          \varepsilon_y = \frac{\varepsilon_b + \varepsilon_c - 2\varepsilon_a\cos^{2}\theta}{2\operatorname{sen}^{2}\theta}
          = \frac{484 + 196 - 2\cdot500\cdot0{,}36}{2\cdot0{,}64}\cdot10^{-6} = 250\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La distorsión γxy en el ejemplo
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$ en el ejemplo, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '300'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶, con su signo
        distractores:
          - valor: '600'
            mensaje: |
              Este número sale de dos errores: escribir las galgas con
              $\tfrac12\gamma_{xy}$, o olvidar el 2 al restar las dos
              ecuaciones, porque el término de $\gamma_{xy}$ entra con signo
              contrario en cada una:
              $\varepsilon_b - \varepsilon_c = 2\gamma_{xy}\operatorname{sen}\theta\cos\theta$.
              La ec. 3.55 lleva la $\gamma$ entera.
          - valor: '-300'
            mensaje: |
              Tienes la b y la c cambiadas: la que está a θ es la b, la del
              lado izquierdo. Con ellas al revés, $\gamma_{xy}$ cambia de
              signo.
          - valor: '150'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, la componente del tensor. Se pide
              $\gamma_{xy}$.
        pista: |
          Resta las dos ecuaciones:
          $\varepsilon_b - \varepsilon_c = 2\gamma_{xy}\operatorname{sen}\theta\cos\theta$.
        desarrollo: |
          $$
          \gamma_{xy} = \frac{\varepsilon_b - \varepsilon_c}{\operatorname{sen}2\theta}
          = \frac{484 - 196}{2\cdot0{,}8\cdot0{,}6}\cdot10^{-6} = 300\cdot10^{-6}
          $$

          Comprobación, devolviendo la lectura de la b:
          $0{,}36\cdot500 + 0{,}64\cdot250 + 0{,}48\cdot300 = 484$.
      - tipo: reconocer
        pregunta: |
          Con θ = 60° las tres galgas forman una roseta a 120°. ¿A qué se
          reduce tu fórmula de $\varepsilon_y$?
        opciones:
          - texto: >-
              $\varepsilon_y = \tfrac13\,[2(\varepsilon_b + \varepsilon_c) - \varepsilon_a]$
            correcta: true
            mensaje: |
              Eso es: la ec. 3.66 de los apuntes (p. 21). Con
              $\cos^{2}60° = \tfrac14$ y $\operatorname{sen}^{2}60° = \tfrac34$,
              $\varepsilon_y = (\varepsilon_b + \varepsilon_c - \tfrac12\varepsilon_a)/\tfrac32$.
              Y $\gamma_{xy} = 2(\varepsilon_b - \varepsilon_c)/\sqrt3$; en los
              apuntes sale $\varepsilon_c - \varepsilon_b$ porque allí la galga
              de la recta a 60° se llama c.
          - texto: >-
              $\varepsilon_y = \tfrac13\,(\varepsilon_a + \varepsilon_b + \varepsilon_c)$
            mensaje: |
              La media de las tres lecturas de una roseta a 120° es el centro
              del círculo de Mohr, $\tfrac12(\varepsilon_x + \varepsilon_y)$,
              no $\varepsilon_y$.
          - texto: >-
              $\varepsilon_y = \varepsilon_b + \varepsilon_c - \varepsilon_a$
            mensaje: |
              Sale de tomar $\varepsilon_b + \varepsilon_c = \varepsilon_x + \varepsilon_y$,
              que solo vale con dos galgas perpendiculares. A 60° y a 120°,
              $\varepsilon_b + \varepsilon_c = \tfrac12\varepsilon_x + \tfrac32\varepsilon_y$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La a va según $x$: $\varepsilon_x = \varepsilon_a$.
          - texto: >-
              La b está a θ y la c a 180° − θ: en sus ecs. 3.55 el término de
              $\gamma_{xy}$ cambia de signo y lo demás es igual.
          - texto: >-
              Sumándolas,
              $\varepsilon_y = (\varepsilon_b + \varepsilon_c - 2\varepsilon_a\cos^{2}\theta)/(2\operatorname{sen}^{2}\theta)$.
          - texto: >-
              Restándolas,
              $\gamma_{xy} = (\varepsilon_b - \varepsilon_c)/\operatorname{sen}2\theta$.
          - texto: >-
              Con θ = 60° sale la roseta a 120° de los apuntes (ec. 3.66).
          - texto: >-
              Como los dos ángulos marcados son θ, la b y la c tienen la misma
              dirección y basta con una de las dos.
            trampa: true
            mensaje: |
              Los dos θ se miden desde la base, pero en vértices opuestos: la b
              sube hacia la derecha y la c hacia la izquierda. Son direcciones
              distintas, θ y 180° − θ, y hacen falta las dos.
    resolucion: |
      **1. El estado de deformación.** Son tres galgas sobre los lados de un
