          antihorario, están las galgas b y c?
        opciones:
          - texto: La b a θ y la c a 180° − θ
            correcta: true
            mensaje: |
              Eso es. La b va sobre el lado izquierdo, que sube hacia la
              derecha formando θ con la base. La c va sobre el derecho, que
              sube hacia la izquierda: también forma θ con la base, pero
              medido desde el otro vértice, así que desde $x$ está a
              180° − θ, la misma recta que −θ.
          - texto: Las dos a θ, porque los dos ángulos marcados son θ
            mensaje: |
              Dos galgas en la misma dirección leerían lo mismo y no darían
              tres ecuaciones. El θ de la derecha se mide desde la base hacia
              la izquierda: la c está a 180° − θ.
          - texto: La b a 90° − θ y la c a 90° + θ
            mensaje: |
              Así sería si θ se midiera desde la vertical. En la figura los
              dos θ están en los vértices de la base, entre la base y cada
              lado.
