        <text x="168" y="107" text-anchor="start" fill="var(--ink)" font-size="10.5" font-family="var(--mono)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">ε<tspan dy="3.2" font-size="7.8">b</tspan><tspan dy="-3.1"> = 780</tspan></text>
        <text x="86" y="67" text-anchor="start" fill="var(--ink)" font-size="10.5" font-family="var(--mono)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">ε<tspan dy="3.2" font-size="7.8">c</tspan><tspan dy="-3.1"> = 100</tspan></text>
      </svg>
      <figcaption>La roseta del ejemplo: a en x, b a 45° y c en y, con sus lecturas en millonésimas.</figcaption>
      </figure>
    pide: γxy, las deformaciones principales en el plano, la dirección 1 y la tangencial máxima en el plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué mide la galga $b$, la que está a 45°?
        opciones:
          - texto: La deformación normal en su dirección, que depende de εx, εy y γxy
            correcta: true
            mensaje: |
              Eso es. Una galga solo mide alargamientos en su dirección:
              $\varepsilon_b = \varepsilon_x\cos^{2}45° + \varepsilon_y\sin^{2}45° + \gamma_{xy}\sin45°\cos45°$.
              Por eso la tangencial sale de combinar las tres lecturas.
          - texto: La deformación tangencial γxy, porque está en diagonal
            mensaje: |
              Ninguna galga mide ángulos. La de 45° mide un alargamiento, y en
              ese alargamiento entra $\gamma_{xy}$ junto con $\varepsilon_x$ y
              $\varepsilon_y$: hay que despejarla.
          - texto: La media de las deformaciones de las galgas a y c
            mensaje: |
              Eso sería si $\gamma_{xy} = 0$. La lectura de $b$ es la media de
              $a$ y $c$ **más** $\tfrac12\gamma_{xy}$, y esa diferencia es
              justo lo que la roseta quiere medir.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el elemento deformado,
          exagerado, y dónde está cada galga**.
        comprueba:
          - punto: |
              **a en el lado x y c en el lado y: dan $\varepsilon_x$ y
              $\varepsilon_y$ directamente.**
            porque: |
              Una galga mide la deformación normal en su dirección, y esas dos
              están en los ejes.
          - punto: |
              **b en la diagonal, que se alarga también cuando el ángulo recto
              se cierra.**
            porque: |
              Por eso la b es la única que ve $\gamma_{xy}$: es la incógnita
              que hay que sacar de su lectura.
          - punto: |
              **El ángulo recto cerrándose, $\gamma/2$ por cada lado.**
            porque: |
              Es $\gamma_{xy}$ dibujada positiva: el signo lo dirá la cuenta.
        figura: |
          <svg viewBox="0 10 250 200" role="img" width="250" height="200" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El elemento de la roseta, antes y después de deformarse</title>
            <desc id="dsl-d">Un cuadrado a trazos, el elemento antes de deformarse, con la esquina O abajo a la izquierda, el lado x abajo y el lado y a la izquierda. Encima, el elemento deformado, exagerado: el lado x más largo y girado hacia arriba, el lado y algo más largo y girado hacia la derecha, de modo que el ángulo recto en O se cierra; cada lado gira gamma medios. La diagonal que sale de O, la dirección de la galga b, se alarga.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M60 175 L185.4 141.4 L215.3 29.8 L89.9 63.4 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M60 175 L215.3 29.8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M60 175 H170 V65 H60 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M112 175 A52 52 0 0 0 110.2 161.5" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="118" y="172" font-size="10" fill="var(--ink)">γ/2</text>
            <path d="M73.5 124.8 A52 52 0 0 0 60 123" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="24" y="132" font-size="10" fill="var(--ink)">γ/2</text>
            <text x="115" y="190" font-size="9" text-anchor="start" fill="var(--faint)">a: εx</text>
            <text x="52" y="92" font-size="9" text-anchor="end" fill="var(--faint)">c: εy</text>
            <text x="221.3" y="33.8" font-size="9" text-anchor="start" fill="var(--faint)">b</text>
          </svg>

      - tipo: calcular
        titulo: La deformación tangencial
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '960'
          tolerancia: 2
          formato: un número, en millonésimas
        distractores:
          - valor: '1920'
            mensaje: |
              Has escrito la galga con $\tfrac12\gamma_{xy}$ en el término
              cruzado. En la fórmula de la galga va $\gamma_{xy}$ entera:
              los dos $\tfrac12\gamma_{xy}$ del tensor se suman.
          - valor: '480'
            mensaje: |
              Eso es $\tfrac12\gamma_{xy}$, lo que va en el tensor y en el
              círculo. La pregunta es $\gamma_{xy}$ entera: el doble.
        pista: |
          Con $\theta = 45°$, $\cos^{2} = \sin^{2} = \sin\cos = \tfrac12$:
          $\varepsilon_b = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$.
        desarrollo: |
          $$
          \gamma_{xy} = 2\varepsilon_b - \varepsilon_a - \varepsilon_c = (2 \cdot 780 - 500 - 100) \cdot 10^{-6} = 960 \cdot 10^{-6}
          $$

      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '820'
          tolerancia: 2
          formato: un número, en millonésimas
        distractores:
          - valor: '1280.6'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. La ordenada del
              círculo es $\tfrac12\gamma$:
              $R = \sqrt{200^{2} + 480^{2}}$, no $\sqrt{200^{2} + 960^{2}}$.
          - valor: '520'
            mensaje: |
              Ese es el radio. La principal se mide desde el origen:
              $\varepsilon_1 = C + R$, con $C = 300$.
        pista: |
          $C = (\varepsilon_x + \varepsilon_y)/2$ y
          $R = \sqrt{((\varepsilon_x - \varepsilon_y)/2)^{2} + (\gamma_{xy}/2)^{2}}$.
        desarrollo: |
          $$
          C = \frac{500 + 100}{2} = 300 \qquad
          R = \sqrt{200^{2} + 480^{2}} = 520
          $$

          $$
          \varepsilon_1 = C + R = 820 \cdot 10^{-6} \qquad
          \varepsilon_2 = C - R = -220 \cdot 10^{-6}
          $$

      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección principal 1 con $x$, en grados,
          positivo en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '33.69'
          tolerancia: 0.2
          formato: un número, en grados
        distractores:
          - valor: '67.38'
            mensaje: |
              Ese es $2\theta_1$, el ángulo en el círculo. En la chapa es la
              mitad.
          - valor: '-33.69'
            mensaje: |
              El sentido está al revés. Con $\gamma_{xy} > 0$ el ángulo recto
              se cierra, $x$ gira en sentido antihorario y va abajo en el
              círculo; de ahí a la dirección 1 se sube, y en la chapa se gira
              en sentido antihorario.
        pista: |
          $\tan 2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$, y en
          la chapa, la mitad.
        desarrollo: |
          $$
          \tan 2\theta_1 = \frac{960}{500 - 100} = 2{,}4
          \;\Longrightarrow\; 2\theta_1 = 67{,}38° \;\Longrightarrow\; \theta_1 = 33{,}69°
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La roseta a 45° da $\varepsilon_x = 500$, $\varepsilon_y = 100$ y $\gamma_{xy} = 2 \cdot 780 - 500 - 100 = 960$ millonésimas.'
          - texto: 'En el círculo la ordenada es $\gamma/2 = 480$: centro $300$ y radio $\sqrt{200^{2} + 480^{2}} = 520$.'
          - texto: 'Las principales en el plano son $C \pm R$: $820$ y $-220$ millonésimas.'
          - texto: 'La dirección 1 está a $33{,}69°$ de $x$, en sentido antihorario, porque con $\gamma_{xy} > 0$ el punto de $x$ va abajo.'
          - texto: 'La tangencial máxima en el plano es el diámetro, $\gamma_{\max} = 2R = 1040$ millonésimas.'
          - texto: 'La tangencial máxima en el plano es el radio, $520$ millonésimas.'
            trampa: true
            mensaje: |
              El radio es $\tfrac12\gamma_{\max}$, porque el eje vertical del
              círculo de deformaciones es $\tfrac12\gamma$. La deformación
              tangencial máxima es el doble: $1040$.
    resolucion: |
      **1. El estado de deformación.** Es una roseta: tres lecturas de
      deformación normal en tres direcciones del mismo punto. El dibujo lleva
      el elemento deformado, exagerado, con lo que ve cada galga.

      <figure class="figura-examen">
      <svg viewBox="0 10 250 200" role="img" width="375" height="300" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El elemento de la roseta, antes y después de deformarse</title>
        <desc id="dsl-d">Un cuadrado a trazos, el elemento antes de deformarse, con la esquina O abajo a la izquierda, el lado x abajo y el lado y a la izquierda. Encima, el elemento deformado, exagerado: el lado x más largo y girado hacia arriba, el lado y algo más largo y girado hacia la derecha, de modo que el ángulo recto en O se cierra; cada lado gira gamma medios. La diagonal que sale de O, la dirección de la galga b, se alarga.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M60 175 L185.4 141.4 L215.3 29.8 L89.9 63.4 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 175 L215.3 29.8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M60 175 H170 V65 H60 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M112 175 A52 52 0 0 0 110.2 161.5" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="118" y="172" font-size="10" fill="var(--ink)">γ/2</text>
        <path d="M73.5 124.8 A52 52 0 0 0 60 123" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="24" y="132" font-size="10" fill="var(--ink)">γ/2</text>
        <text x="115" y="190" font-size="9" text-anchor="start" fill="var(--faint)">a: εx</text>
        <text x="52" y="92" font-size="9" text-anchor="end" fill="var(--faint)">c: εy</text>
        <text x="221.3" y="33.8" font-size="9" text-anchor="start" fill="var(--faint)">b</text>
      </svg>
      <figcaption>

      El elemento antes (a trazos) y después de deformarse, muy exagerado. La galga a está en el lado x, la c en el y, y la b en la diagonal, que se alarga también cuando el ángulo recto se cierra.

      </figcaption>
      </figure>

      - **a y c** están en los ejes: leen $\varepsilon_x = 500$ y
        $\varepsilon_y = 100$ millonésimas.
      - **b**, a 45°, ve además el cierre del ángulo recto: la diagonal se
        alarga cuando el ángulo se cierra.

      **2. Incógnitas.** $\gamma_{xy}$; las deformaciones principales en el
      plano y la dirección 1; y la deformación tangencial máxima en el
      plano.

      **3. Ecuaciones.** La de la galga, la deformación normal en una
      dirección a $\theta$ de $x$ (ec. 3.55), y el círculo de Mohr de
      deformaciones, con $\tfrac12\gamma$ en el eje vertical:

      $$
      \varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta
      \qquad
      \tan 2\theta_1 = \frac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y}
      $$

      **4. Resultados.** **La tangencial.** Con $\theta = 45°$,
      $\varepsilon_b = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$, y

      $$
      \gamma_{xy} = 2\varepsilon_b - \varepsilon_a - \varepsilon_c = (2 \cdot 780 - 500 - 100) \cdot 10^{-6} = 960 \cdot 10^{-6}
      $$

      **El círculo.** Con la ordenada $\gamma/2 = 480$:

      $$
      C = 300 \qquad R = \sqrt{200^{2} + 480^{2}} = 520 \qquad
      \varepsilon_{1} = 820 \qquad \varepsilon_{2} = -220
      $$

      en millonésimas.

      **La dirección.** $\tan 2\theta_1 = 960/400 = 2{,}4$, luego
      $2\theta_1 = 67{,}38°$ y $\theta_1 = 33{,}69°$. Con
      $\gamma_{xy} > 0$ el ángulo recto se cierra, $x$ gira en sentido
      antihorario y va abajo en el círculo; de ahí a 1 se sube, así que la
      dirección 1 está girada $33{,}69°$ en sentido antihorario desde
      $x$.

      <figure class="figura-examen">
      <svg viewBox="0 0 290 260" role="img" width="435" height="390" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El círculo de Mohr de deformaciones de la roseta</title>
        <desc id="dsl-d">El eje epsilon horizontal y el eje gamma medios vertical. El círculo tiene el centro en 300 y radio 520, y corta el eje horizontal en 820, el punto 1, y en menos 220, el punto 2, a la izquierda del origen. El punto x, en (500, 480), va abajo; el y, en (100, 480), arriba, en el otro extremo del diámetro.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M180 226 L100 34" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M36 130 A104 104 0 1 0 244 130 A104 104 0 1 0 36 130" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="20" y1="130" x2="260" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="80" y1="242" x2="80" y2="18" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="180" cy="226" r="2.4" fill="var(--ink)"/>
        <text x="186" y="239" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">x</text>
        <circle cx="100" cy="34" r="2.4" fill="var(--ink)"/>
        <text x="108" y="42" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">y</text>
        <circle cx="244" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="250" y="125" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">1</text>
        <circle cx="36" cy="130" r="2.4" fill="var(--ink)"/>
        <text x="30" y="124" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">2</text>
        <text x="263" y="134" font-size="9" text-anchor="start" fill="var(--faint)">ε</text>
        <text x="85" y="22" font-size="9" text-anchor="start" fill="var(--faint)">γ/2</text>
        <text x="76" y="142" font-size="9" text-anchor="end" fill="var(--faint)">O</text>
      </svg>
      <figcaption>

      El círculo de deformaciones, a escala, en millonésimas: ε en el eje horizontal y γ/2 en el vertical. El punto x va abajo porque γxy es positiva y cierra el ángulo recto; de x a 1 se suben 67,38°, el doble del ángulo de la dirección 1 en el elemento, y en el mismo sentido.

      </figcaption>
      </figure>

      **La tangencial máxima en el plano** es el diámetro del círculo, porque
      el eje vertical es $\tfrac12\gamma$:
      $\gamma_{\max} = 2R = 1040 \cdot 10^{-6}$.

      **5. Comprobación.** La fórmula de la galga en la dirección 1, con
      $\cos^{2}\theta_1 = 0{,}6923$, $\operatorname{sen}^{2}\theta_1 = 0{,}3077$
      y $\operatorname{sen}\theta_1\cos\theta_1 = 0{,}4615$:
      $500\cdot0{,}6923 + 100\cdot0{,}3077 + 960\cdot0{,}4615 = 820$. Y los
      invariantes del plano: $\varepsilon_1 + \varepsilon_2 = 600 = \varepsilon_x + \varepsilon_y$,
      y $\varepsilon_1\varepsilon_2 = -180\,400$, igual que
      $\varepsilon_x\varepsilon_y - (\gamma_{xy}/2)^{2} = 50\,000 - 230\,400$,
      en millonésimas al cuadrado.

      **Lo que dice el resultado.** Ninguna galga lee un acortamiento, y aun
      así la principal 2 es de $-220$ millonésimas: el ángulo recto se
      cierra tanto que el círculo pasa al otro lado del origen. La principal
      mayor, 820, supera a las tres lecturas. La tangencial máxima del punto,
      en el espacio, necesita $\varepsilon_z$, y esa sale de la ley de Hooke
      del tema 4.

  # ── Cuestión 2 de autoevaluación del tema 3 · las deformaciones unitarias.
  - id: ejerm3-cu2-las-deformaciones-unitarias
    titulo: Las deformaciones unitarias, en general y con pequeños desplazamientos
    fuente: >-
      Cuestión 2 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartado 3.3
      (pp. 7 a 9, ecs. 3.9 a 3.21). No está entre las preguntas de examen
      publicadas en el sitio. El ejemplo es nuestro, comprobado con el motor
      del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Las dos deformaciones unitarias miden cambios de forma: una, el de la
        longitud de una dirección; la otra, el del ángulo recto entre dos. Las
        dos se escriben con las derivadas de los desplazamientos, y la versión
        que se usa depende de lo pequeñas que sean esas derivadas.
      formula: |
        $$
        \varepsilon_x = \frac{\overline{O'A'} - \overline{OA}}{\overline{OA}}
        \qquad
        \gamma_{xy} = \tfrac12\pi - \varphi_{xy}
        $$

        Las definiciones (ecs. 3.9 y 3.15): la variación relativa de longitud
        y la disminución del ángulo recto.
      reconocer: |
        Es una pregunta de teoría con tres partes: dos definiciones, cada una en
        dos versiones, y la distinción entre dos tipos de problema. La
        distinción es la que más se confunde: piensa qué tiene que ser pequeño
        en cada uno.
    enunciado: |
      2. Deformación unitaria normal y deformación unitaria tangencial en el
      caso general y en problemas de pequeños desplazamientos. Diferencia
      entre problemas de pequeños desplazamientos y de pequeñas
      deformaciones.
    pide: >-
      Las dos deformaciones unitarias, con su expresión general y la de
      pequeños desplazamientos, y en qué se distinguen los dos tipos de
      problema.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un ejemplo nuestro: una barra recta según $x$ se alarga un 1 % y a
          la vez gira 0,2 rad (unos 11,5°) en el plano $xy$. ¿Qué tipo de
          problema es?
        opciones:
          - texto: >-
              De pequeñas deformaciones, pero no de pequeños desplazamientos:
              la deformación es del 1 %, pero la derivada $v_{,x}$ vale unos
              0,2, muy por encima de 0,02
            correcta: true
            mensaje: |
              Eso es (apuntes, pp. 7 y 8). Pequeños desplazamientos quiere
              decir pequeñas todas las derivadas de los desplazamientos;
              pequeñas deformaciones, solo $\varepsilon_x$, $\varepsilon_y$ y
              $\varepsilon_z$. Con el giro, $v_{,x} = 1{,}01\sin 0{,}2 \approx 0{,}2$,
              y su cuadrado ya no se puede despreciar.
          - texto: >-
              De pequeños desplazamientos: la barra solo se alarga un 1 %
            mensaje: |
              El 1 % es la deformación, y es pequeña. Pero el criterio de los
              pequeños desplazamientos mira las derivadas de los
              desplazamientos, y el giro hace $v_{,x} \approx 0{,}2$: diez
              veces el 0,02 de los apuntes (p. 7).
          - texto: >-
              De pequeños desplazamientos, porque un giro de sólido rígido no
              deforma
            mensaje: |
              Un giro pequeño no deforma a primer orden (apartado 3.5.1), pero
              este no es pequeño: con 0,2 rad las derivadas valen 0,2 y sus
              cuadrados, 0,04, ya son del orden de la deformación.
          - texto: >-
              Ni de pequeñas deformaciones ni de pequeños desplazamientos: un
              1 % ya es una deformación grande
            mensaje: |
              Los apuntes del tema 4 (p. 3) ponen el límite de las
              deformaciones pequeñas en 0,02: un 1 % es 0,01, y es pequeño.
              Lo grande aquí es el giro.
      - tipo: redactar
        que: definicion
        consigna: >-
          Contesta como en un examen: las dos definiciones, su expresión
          general y la de pequeños desplazamientos, y la diferencia entre los
          dos tipos de problema.
        rubrica:
          - punto: >-
              εx es la variación relativa de longitud de la dirección x,
              εx = (O′A′ − OA)/OA (ec. 3.9); con los desplazamientos,
              εx = √((1 + u,x)² + (v,x)² + (w,x)²) − 1 (ec. 3.10).
            porque: >-
              Es la definición y su forma general, sin aproximar: la cuestión
              pide el caso general.
            minimo: true
          - punto: >-
              Con la raíz aproximada, √(1 + α) ≈ 1 + ½α:
              εx = u,x + ½[(u,x)² + (v,x)² + (w,x)²] (ec. 3.11), y lo mismo
              en y y en z (ecs. 3.12 y 3.13).
            porque: >-
              Es el paso intermedio, y sus términos al cuadrado son justo los
              que separan los dos tipos de problema.
          - punto: >-
              Si las derivadas son pequeñas, menores que 0,02, los cuadrados
              se desprecian: εx = u,x, εy = v,y, εz = w,z (ec. 3.14).
            porque: >-
              Es la expresión de pequeños desplazamientos, la que se usa en
              todo el curso.
            minimo: true
          - punto: >-
              γxy es la disminución del ángulo recto entre x e y,
              γxy = ½π − φxy (ec. 3.15); en general, sin γxy es el producto
              escalar de las aristas deformadas O′A′ y O′B′ dividido por sus
              longitudes (ecs. 3.16 a 3.18).
            porque: >-
              Es la definición, con su signo: γxy es positiva si el ángulo
              recto se cierra.
            minimo: true
          - punto: >-
              Con pequeños desplazamientos, sin γxy ≈ γxy = u,y + v,x, y lo
              mismo γyz = v,z + w,y y γzx = w,x + u,z (ecs. 3.19 a 3.21).
            porque: >-
              Es la expresión lineal, la que entra en el tensor de
              deformaciones.
            minimo: true
          - punto: >-
              Pequeños desplazamientos: todas las derivadas de los
              desplazamientos son pequeñas. Pequeñas deformaciones: solo lo
              son εx, εy y εz, y algún cuadrado de las derivadas puede no ser
              despreciable, como en un giro grande (p. 8).
            porque: >-
              Es la segunda frase de la cuestión. Sin un ejemplo, como el del
              giro, las dos definiciones se leen como la misma.
            minimo: true
      - tipo: calcular
        titulo: La εx de la barra que gira
        pregunta: |
          El ejemplo de antes con números: $u = a\,x$, $v = b\,x$ y $w = 0$,
          con $a = -0{,}010133$ y $b = 0{,}200656$. ¿Cuánto vale
          $\varepsilon_x$, la variación relativa de longitud de la dirección
          $x$, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '10.00'
          tolerancia: 0.06
          formato: un número, en unidades de 10⁻³
        distractores:
          - valor: '-10.13'
            mensaje: |
              Es $u_{,x}$, la ec. 3.14: la de pequeños desplazamientos. Aquí
              $v_{,x} \approx 0{,}2$ no es pequeña y la fórmula lineal no vale:
              dice que la barra se acorta cuando se alarga un 1 %. Hay que ir
              a la forma general, la 3.10.
          - valor: '30.23'
            mensaje: |
              Has usado la 3.11 sin el ½ delante del corchete. Con él,
              $u_{,x} + \tfrac12[(u_{,x})^{2} + (v_{,x})^{2}]$ da
              $10{,}05\cdot10^{-3}$, que también vale: la diferencia con la
              3.10 es la de aproximar la raíz.
          - valor: '-799.09'
            mensaje: |
              Has escrito $(u_{,x})^{2}$ en vez de $(1 + u_{,x})^{2}$ dentro de
              la raíz de la 3.10. La arista deformada es
              $(1 + u_{,x},\ v_{,x},\ w_{,x})\,dx$: la $dx$ de partida más lo
              que se desplaza.
        pista: |
          Ec. 3.10: $\varepsilon_x = \sqrt{(1 + u_{,x})^{2} + (v_{,x})^{2} + (w_{,x})^{2}} - 1$,
          con $u_{,x} = a$, $v_{,x} = b$ y $w_{,x} = 0$.
        desarrollo: |
          $$
          \varepsilon_x = \sqrt{0{,}989867^{2} + 0{,}200656^{2}} - 1 = \sqrt{1{,}020100} - 1 = 0{,}0100
          $$

          Es el 1 %: $10{,}00\cdot10^{-3}$. La 3.11 da $10{,}05\cdot10^{-3}$
          (también vale) y la 3.14 da $-10{,}13\cdot10^{-3}$: con un giro de
          0,2 rad la fórmula lineal se equivoca hasta de signo.
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              $\varepsilon_x$ es la variación relativa de longitud de la
              dirección $x$ (ec. 3.9); con los desplazamientos,
              $\varepsilon_x = \sqrt{(1+u_{,x})^{2} + (v_{,x})^{2} + (w_{,x})^{2}} - 1$
              (ec. 3.10).
          - texto: >-
              Aproximando la raíz,
              $\varepsilon_x = u_{,x} + \tfrac12[(u_{,x})^{2} + (v_{,x})^{2} + (w_{,x})^{2}]$
              (ec. 3.11).
          - texto: >-
              $\gamma_{xy}$ es lo que disminuye el ángulo recto entre $x$ e
              $y$: $\gamma_{xy} = \tfrac12\pi - \varphi_{xy}$ (ec. 3.15).
          - texto: >-
              Si todas las derivadas de los desplazamientos son pequeñas,
              $\varepsilon_x = u_{,x}$ y $\gamma_{xy} = u_{,y} + v_{,x}$
              (ecs. 3.14 y 3.21): es un problema de pequeños desplazamientos.
          - texto: >-
              En uno de pequeñas deformaciones solo $\varepsilon_x$,
              $\varepsilon_y$ y $\varepsilon_z$ son pequeñas: un giro grande
              hace grande alguna derivada, y la 3.14 deja de valer.
          - texto: >-
              Pequeñas deformaciones y pequeños desplazamientos son lo mismo:
              si $\varepsilon_x$ es pequeña, $u_{,x}$, $v_{,x}$ y $w_{,x}$
              también lo son.
            trampa: true
            mensaje: |
              En el ejemplo, $\varepsilon_x = 0{,}01$ y $v_{,x} \approx 0{,}2$.
              Un giro de sólido rígido apenas cambia las longitudes y sí da
              derivadas grandes: por eso los apuntes distinguen los dos
              problemas (p. 8).
    resolucion: |
      **Deformación unitaria normal** (apuntes del tema 3, apartado 3.3.1,
      p. 7). Por definición, es la variación relativa de longitud de una
      dirección en un punto. En $x$, con $OA$ la arista antes y $O'A'$
      después,

      $$
      \varepsilon_x = \frac{\overline{O'A'} - \overline{OA}}{\overline{OA}} \qquad (3.9)
      $$

      La arista deformada es $(1 + u_{,x},\ v_{,x},\ w_{,x})\,dx$, y su
      longitud da la **forma general**:

      $$
      \varepsilon_x = \sqrt{(1 + u_{,x})^{2} + (v_{,x})^{2} + (w_{,x})^{2}} - 1 \qquad (3.10)
      $$

      Aproximando la raíz, $\sqrt{1 + \alpha} \approx 1 + \tfrac12\alpha$,

      $$
      \varepsilon_x = u_{,x} + \tfrac12\left[(u_{,x})^{2} + (v_{,x})^{2} + (w_{,x})^{2}\right] \qquad (3.11)
      $$

      y lo mismo en $y$ y en $z$ (ecs. 3.12 y 3.13). Si las derivadas son
      pequeñas —menores que 0,02, dicen los apuntes— los cuadrados se
      desprecian frente a los términos de primer orden, y en un **problema de
      pequeños desplazamientos**

      $$
      \varepsilon_x = u_{,x} \qquad \varepsilon_y = v_{,y} \qquad \varepsilon_z = w_{,z} \qquad (3.14)
      $$

      **Deformación unitaria tangencial** (apartado 3.3.2, pp. 8 y 9). Es la
      disminución del ángulo recto entre dos direcciones inicialmente
      perpendiculares. Con $\varphi_{xy}$ el ángulo entre $x$ e $y$ tras la
      deformación,

      $$
      \gamma_{xy} = \tfrac12\pi - \varphi_{xy} \qquad (3.15)
      $$

      Como $\cos\varphi_{xy} = \sin\gamma_{xy}$, el producto escalar de las
      dos aristas deformadas da la forma general,
      $\sin\gamma_{xy} = \overrightarrow{O'A'}\cdot\overrightarrow{O'B'}/(\overline{O'A'}\;\overline{O'B'})$
      (ecs. 3.16 y 3.17), que con los desplazamientos es la 3.18. Quitando
      los términos de orden 2 y superiores (ecs. 3.19 y 3.20), y con
      $\sin\gamma_{xy} \approx \gamma_{xy}$, en pequeños desplazamientos

      $$
      \gamma_{xy} = u_{,y} + v_{,x} \qquad \gamma_{yz} = v_{,z} + w_{,y} \qquad \gamma_{zx} = w_{,x} + u_{,z} \qquad (3.21)
      $$

      **La diferencia** (p. 8). En un *problema de pequeños desplazamientos*
      (de pequeños gradientes de desplazamiento) son pequeñas **todas las
      derivadas** de los desplazamientos. En uno de *pequeñas deformaciones*
      solo lo son $\varepsilon_x$, $\varepsilon_y$ y $\varepsilon_z$, y puede
      que algún cuadrado de las derivadas no sea despreciable. Lo que hace la
      diferencia es el giro: un sólido que gira mucho apenas cambia de
      longitud, pero sus derivadas son grandes.

      **Un ejemplo nuestro.** Una barra según $x$ que se alarga un 1 % y gira
      0,2 rad: $u = a\,x$ y $v = b\,x$, con $a = 1{,}01\cos 0{,}2 - 1 \approx -0{,}010133$
      y $b = 1{,}01\sin 0{,}2 \approx 0{,}200656$. Es un problema de pequeñas
      deformaciones y no de pequeños desplazamientos. Con cada fórmula, en
      unidades de $10^{-3}$:

      | fórmula | $\varepsilon_x$ |
      |---|---|
      | general, ec. 3.10 | 10,00 |
      | raíz aproximada, ec. 3.11 | 10,05 |
      | pequeños desplazamientos, ec. 3.14 | −10,13 |

      La lineal da un acortamiento donde hay un alargamiento: el término
      $\tfrac12(v_{,x})^{2} \approx 0{,}020$ que tira es el doble de la
      deformación. Las tres cifras salen igual con el motor del curso (la
      longitud del vector $(1 + a,\ b,\ 0)$) y a mano.

  # ── Cuestión 5 de autoevaluación del tema 3 · el ángulo tras la rotación.
  - id: ejerm3-cu5-el-angulo-tras-la-rotacion
    titulo: La rotación no cambia el ángulo entre dos direcciones
    fuente: >-
      Cuestión 5 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartado 3.5.1
      (pp. 12 a 14, ecs. 3.37 a 3.45). La cuestión 4 de esta misma hoja, la
      de la longitud, cayó con otras palabras en los primeros parciales de
      2019-2020, 2020-2021 y 2022-2023, y está en el sitio con su
      resolución; esta pide el ángulo.
      Los apuntes escriben «c os» en la ec. 3.45, por cos. El ejemplo es
      nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        La parte antisimétrica del gradiente transforma cada elemento sumándole
        $\vec\omega\times d\vec r$. Para ver qué le hace al ángulo entre dos
        elementos se compara su producto escalar antes y después.
      formula: |
        $$
        d\vec r\,' = d\vec r + \vec\omega\times d\vec r
        \qquad
        d\vec r_1\cdot d\vec r_2 = dr_1\,dr_2\cos\varphi
        $$

        La transformación (ec. 3.43) y el producto escalar escrito con el
        ángulo.
      reconocer: |
        «Demostrar» con el resultado ya dicho: la variación es nula. La
        demostración se apoya en la cuestión anterior, que la longitud no
        cambia, y en de qué orden es lo que se desprecia.
    enunciado: |
      5. Demostrar que la variación de ángulo entre dos direcciones
      transformadas por el tensor de rotación es nula en problemas de
      pequeños desplazamientos.
    pide: >-
      La demostración de que el ángulo entre dos elementos transformados por
      la parte antisimétrica no cambia en un problema de pequeños
      desplazamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $d\vec r_1' = d\vec r_1 + \vec\omega\times d\vec r_1$ y
          $d\vec r_2' = d\vec r_2 + \vec\omega\times d\vec r_2$ (ec. 3.43), el
          producto escalar $d\vec r_1'\cdot d\vec r_2'$ tiene cuatro términos.
          ¿Qué pasa con los dos cruzados,
          $d\vec r_1\cdot(\vec\omega\times d\vec r_2)$ y
          $(\vec\omega\times d\vec r_1)\cdot d\vec r_2$?
        opciones:
          - texto: >-
              Se anulan entre sí: son dos productos mixtos iguales con el signo
              cambiado, $\vec\omega\cdot(d\vec r_2\times d\vec r_1)$ y
              $\vec\omega\cdot(d\vec r_1\times d\vec r_2)$
            correcta: true
            mensaje: |
              Eso es. Por eso en la ec. 3.44 solo queda, además de
              $dr_1dr_2\cos\varphi$, el producto de los dos
              $\vec\omega\times d\vec r_i$, que es de orden $\omega^{2}$. Los
              apuntes pasan directamente a la 3.44: este es el paso que no
              escriben.
          - texto: >-
              Cada uno es nulo por separado, porque $\vec\omega\times d\vec r$
              es perpendicular a $d\vec r$
            mensaje: |
              $\vec\omega\times d\vec r_2$ es perpendicular a $d\vec r_2$, no
              a $d\vec r_1$. Con $\vec\omega = \omega\hat k$,
              $d\vec r_1 = \hat\imath$ y $d\vec r_2 = \hat\jmath$, el primero
              vale $-\omega$ y el segundo $+\omega$: ninguno es nulo, y se
              anulan entre los dos.
          - texto: >-
              Son de segundo orden en $\omega$ y se desprecian
            mensaje: |
              Cada uno lleva $\vec\omega$ una sola vez: son de primer orden. Si
              no se anularan, el ángulo cambiaría tanto como gira el elemento,
              y no se podría despreciar.
          - texto: >-
              No se anulan: son el cambio del ángulo, de primer orden en
              $\omega$
            mensaje: |
              Si fuera así, una rotación pura cambiaría los ángulos a primer
              orden: deformaría. Con $\vec\omega = \omega\hat k$, $\hat\imath$
              y $\hat\jmath$ dan $-\omega$ y $+\omega$, y su suma es cero.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen, desde la transformación
          de los dos elementos hasta la conclusión.
        rubrica:
          - punto: >-
              Los dos elementos transformados por la parte antisimétrica:
              dr1′ = dr1 + ω × dr1 y dr2′ = dr2 + ω × dr2 (ec. 3.43), con φ el
              ángulo que forman antes y φ′ el de después.
            porque: >-
              Es el punto de partida, y fija qué se compara.
            minimo: true
          - punto: >-
              El producto escalar: dr1′ dr2′ cos φ′ = dr1 dr2 cos φ +
              (ω dr1 sin θ1)(ω dr2 sin θ2) cos β (ec. 3.44), con θi el ángulo
              entre ω y dri, y β el que forman ω × dr1 y ω × dr2.
            porque: >-
              Es el centro de la demostración.
            minimo: true
          - punto: >-
              Por qué no queda ningún término de primer orden: los dos
              cruzados son productos mixtos iguales y de signo contrario, y se
              anulan.
            porque: >-
              Es el paso que los apuntes no escriben; sin él no se ve por qué
              falta un término en ω.
          - punto: >-
              Con dr1′ = dr1 y dr2′ = dr2, lo demostrado para la longitud
              (ec. 3.42), se divide por dr1 dr2:
              cos φ′ = cos φ + ω² sin θ1 sin θ2 cos β (ec. 3.45).
            porque: >-
              Une la demostración del ángulo con la de la longitud.
            minimo: true
          - punto: >-
              En un problema de pequeños desplazamientos ω es pequeño, el
              término en ω² se desprecia y cos φ′ = cos φ: el ángulo no
              cambia.
            porque: >-
              Es la conclusión que pide el enunciado, con su porqué.
            minimo: true
          - punto: >-
              Con la longitud y el ángulo sin cambiar, la parte antisimétrica
              es una rotación de sólido rígido (p. 13).
            porque: >-
              Es para lo que sirven las dos demostraciones juntas.
      - tipo: calcular
        titulo: Cuánto se cierra el ángulo, sin aproximar
        pregunta: |
          Un ejemplo nuestro: $\vec\omega = 0{,}01\,\hat k$ rad,
          $d\vec r_1 = \hat\imath$ y $d\vec r_2 = (\hat\imath + \hat k)/\sqrt2$,
          que forman 45°. Con $d\vec r' = d\vec r + \vec\omega\times d\vec r$,
          sin aproximar nada más, ¿cuánto disminuye el ángulo entre los dos,
          en unidades de $10^{-5}$ rad?
        respuesta:
          tipo: numero
          valor: '2.50'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻⁵ rad
        distractores:
          - valor: '1000'
            mensaje: |
              Eso es $\omega$, 0,01 rad: lo que gira cada elemento. Los dos
              giran lo mismo, y el ángulo entre ellos apenas cambia, porque los
              términos de primer orden se anulan.
          - valor: '10.00'
            mensaje: |
              Es lo que da la ec. 3.45 tomando $dr' = dr$:
              $\Delta\cos\varphi = \omega^{2}\sin\theta_1\sin\theta_2\cos\beta = 7{,}07\cdot10^{-5}$,
              y de ahí $10\cdot10^{-5}$ rad. Pero a segundo orden las
              longitudes también crecen (ec. 3.42,
              $dr_1' = dr_1\sqrt{1 + \omega^{2}}$), y dividir por
              $dr_1'dr_2'$ deja el cambio en $2{,}5\cdot10^{-5}$ rad. Para la
              demostración da igual, porque los dos son de orden
              $\omega^{2}$; para el número, no.
          - valor: '1.77'
            mensaje: |
              Es lo que cambia el coseno, $\Delta\cos\varphi = 1{,}77\cdot10^{-5}$.
              El ángulo cambia $\Delta\varphi \approx -\Delta\cos\varphi/\sin\varphi$,
              y con $\sin 45° = 0{,}707$ sale $2{,}50\cdot10^{-5}$ rad.
        pista: |
          $d\vec r_1' = (1;\ 0{,}01;\ 0)$ y $d\vec r_2' = (1;\ 0{,}01;\ 1)/\sqrt2$.
          Saca $\cos\varphi'$ con su producto escalar y sus dos módulos.
        desarrollo: |
          $$
          \cos\varphi' = \frac{d\vec r_1'\cdot d\vec r_2'}{|d\vec r_1'|\,|d\vec r_2'|}
          = \frac{1{,}0001/\sqrt2}{\sqrt{1{,}0001}\,\sqrt{2{,}0001}/\sqrt2}
          = \sqrt{\frac{1{,}0001}{2{,}0001}} = 0{,}70712446
          $$

          Así $\varphi' = 0{,}78537316$ rad, frente a
          $\varphi = \pi/4 = 0{,}78539816$ rad: el ángulo se cierra
          $2{,}50\cdot10^{-5}$ rad, que es $\omega^{2}/4$. El giro es 400 veces
          mayor.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos elementos girados:
              $d\vec r_i' = d\vec r_i + \vec\omega\times d\vec r_i$ (ec. 3.43).
          - texto: >-
              En $d\vec r_1'\cdot d\vec r_2'$ los dos términos cruzados son
              productos mixtos de signo contrario y se anulan.
          - texto: >-
              Queda
              $dr_1'dr_2'\cos\varphi' = dr_1dr_2\cos\varphi + (\omega dr_1\sin\theta_1)(\omega dr_2\sin\theta_2)\cos\beta$
              (ec. 3.44).
          - texto: >-
              Con $dr_i' = dr_i$,
              $\cos\varphi' = \cos\varphi + \omega^{2}\sin\theta_1\sin\theta_2\cos\beta$
              (ec. 3.45).
          - texto: >-
              Con $\omega$ pequeño, el término en $\omega^{2}$ se desprecia y
              $\cos\varphi' = \cos\varphi$.
          - texto: >-
              El ángulo cambia en $\omega$, lo mismo que gira cada elemento,
              pero se desprecia porque $\omega$ es pequeño.
            trampa: true
            mensaje: |
              Si cambiara en $\omega$, una rotación pura cambiaría los ángulos
              a primer orden, como las deformaciones, y no se podría
              despreciar frente a ellas. Los términos en $\omega$ se anulan; lo
              que se desprecia es el de $\omega^{2}$.
    resolucion: |
      **El planteamiento** (apuntes del tema 3, apartado 3.5.1, p. 14). Dos
      elementos $d\vec r_1$ y $d\vec r_2$ forman el ángulo $\varphi$ antes de
      la deformación y $\varphi'$ después. Con solo la parte antisimétrica,
      que es $[\omega]\{dr\} = \vec\omega\times d\vec r$ (ecs. 3.38 y 3.39),

      $$
      d\vec r_1' = d\vec r_1 + \vec\omega\times d\vec r_1 \qquad
      d\vec r_2' = d\vec r_2 + \vec\omega\times d\vec r_2 \qquad (3.43)
      $$

      **El producto escalar.** Desarrollado, $d\vec r_1'\cdot d\vec r_2'$
      tiene cuatro términos. Los dos cruzados se anulan, porque son el mismo
      producto mixto con los factores cambiados de orden:

      $$
      d\vec r_1\cdot(\vec\omega\times d\vec r_2) + (\vec\omega\times d\vec r_1)\cdot d\vec r_2
      = \vec\omega\cdot(d\vec r_2\times d\vec r_1) + \vec\omega\cdot(d\vec r_1\times d\vec r_2) = 0
      $$

      Los apuntes no escriben este paso y pasan directamente a

      $$
      dr_1'\,dr_2'\cos\varphi' = dr_1dr_2\cos\varphi + (\omega\,dr_1\sin\theta_1)(\omega\,dr_2\sin\theta_2)\cos\beta \qquad (3.44)
      $$

      con $\theta_i$ el ángulo entre $\vec\omega$ y $d\vec r_i$ (el módulo de
      $\vec\omega\times d\vec r_i$ es $\omega\,dr_i\sin\theta_i$) y $\beta$ el
      que forman $\vec\omega\times d\vec r_1$ y $\vec\omega\times d\vec r_2$.

      **La conclusión.** Como ya se ha demostrado que la longitud no varía,
      $dr_1' = dr_1$ y $dr_2' = dr_2$ (ec. 3.42 y la cuestión 4 de la hoja),
      dividiendo por $dr_1dr_2$:

      $$
      \cos\varphi' = \cos\varphi + \omega^{2}\sin\theta_1\sin\theta_2\cos\beta \qquad (3.45)
      $$

      En un problema de pequeños desplazamientos $\omega$ es pequeño y el
      segundo sumando, de orden $\omega^{2}$, es despreciable:
      $\cos\varphi' = \cos\varphi$. El ángulo no cambia. Con la longitud y el
      ángulo sin cambiar, la parte antisimétrica es una rotación de sólido
      rígido (p. 13).

      **Un ejemplo nuestro.** $\vec\omega = 0{,}01\,\hat k$,
      $d\vec r_1 = \hat\imath$ y $d\vec r_2 = (\hat\imath + \hat k)/\sqrt2$, a
      45°. Sin aproximar, $d\vec r_1' = (1;\ 0{,}01;\ 0)$ y
      $d\vec r_2' = (1;\ 0{,}01;\ 1)/\sqrt2$, y
      $\cos\varphi' = \sqrt{1{,}0001/2{,}0001} = 0{,}70712446$: el ángulo se
      cierra $2{,}50\cdot10^{-5}$ rad, $\omega^{2}/4$, cuando cada elemento
      ha girado $10^{-2}$ rad. Lo que cambia es de segundo orden.

      La 3.45 tal cual, con $\theta_1 = 90°$, $\theta_2 = 45°$ y $\beta = 0$,
      daría $\Delta\cos\varphi = 7{,}07\cdot10^{-5}$ y un cierre de
      $10\cdot10^{-5}$ rad: no es el número exacto, porque a segundo orden
      las longitudes también cambian ($dr_1' = dr_1\sqrt{1 + \omega^{2}}$) y
      la 3.45 divide por las de antes. Para lo que demuestra no importa: las
      dos cifras son de orden $\omega^{2}$. El número exacto sale igual con el
      motor del curso (los vectores girados con la matriz $[\omega]$) y a
      mano.

  # ── Cuestión 6 de autoevaluación del tema 3 · el vector deformación.
  - id: ejerm3-cu6-el-vector-deformacion
    titulo: El vector deformación y sus componentes intrínsecas
    fuente: >-
      Cuestión 6 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartados 3.5.2
      y 3.6 (pp. 14 a 18, ecs. 3.46 a 3.55, figs. 3.5 y 3.6 y la tabla de
      similitud). Se parece a la cuestión 2 del primer parcial de 2018-2019,
      que da la matriz de deformaciones en ejes principales y pide, entre
      otras cosas, las componentes longitudinal y transversal del vector
      deformación en una dirección; esta pide definirlo. El ejemplo es
      nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        El tensor de deformaciones convierte una dirección en un vector, como el
        de tensiones convierte una normal en el vector tensión. Ese vector se
        descompone según la dirección y perpendicular a ella, y cada parte mide
        una cosa distinta.
      formula: |
        $$
        \{D_u\} = [\varepsilon]\{u\}
        $$

        (ec. 3.49), con $[\varepsilon]$ el tensor de deformaciones. Tiene la
        forma de $\{S\} = [\sigma]\{n\}$, la del tema 2.
      reconocer: |
        Es una pregunta de concepto: la definición, el cálculo y las dos
        componentes. La similitud con el vector tensión del tema 2 da la
        estructura; lo que hay que cuidar es qué mide exactamente cada
        componente.
    enunciado: |
      6. Vector deformación y sus componentes intrínsecas.
    pide: >-
      Qué es el vector deformación de una dirección, cómo se calcula y
      cuáles son sus dos componentes intrínsecas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué mide el vector deformación $\vec D_u$ de una dirección
          $\hat u$?
        opciones:
          - texto: >-
              Cuánto cambia, por unidad de longitud, un elemento según
              $\hat u$ por la deformación pura: $(d\vec r' - d\vec r)/dr$ con
              solo la parte simétrica, sin el giro
            correcta: true
            mensaje: |
              Eso es (ecs. 3.46 y 3.47). En matrices,
              $\{D_u\} = [\varepsilon]\{u\}$ (ec. 3.49): el giro de sólido
              rígido ya se ha separado, con la parte antisimétrica.
          - texto: >-
              El desplazamiento del punto, $\vec\delta$
            mensaje: |
              El desplazamiento mueve el punto entero; $\vec D_u$ mira cómo
              cambia un elemento que sale de él. Una traslación pura tiene
              desplazamiento y $\vec D_u = \vec 0$ en todas las direcciones.
          - texto: >-
              El cambio total del elemento, giro incluido:
              $(d\vec r' - d\vec r)/dr$ con el tensor gradiente entero
            mensaje: |
              Con el gradiente entero entraría la rotación, que no deforma. El
              vector deformación se define con la parte simétrica de la
              transformación (ec. 3.46).
          - texto: >-
              La deformación normal de la dirección, un número
            mensaje: |
              Esa es su proyección sobre $\hat u$, $\varepsilon_u$ (ec. 3.51).
              $\vec D_u$ es un vector, con una componente según $\hat u$ y otra
              perpendicular.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica el concepto como en un examen: la definición, cómo se
          calcula y sus dos componentes intrínsecas, con lo que significa
          cada una.
        rubrica:
          - punto: >-
              Con la parte simétrica de la transformación, dr′ = dr + ε dr
              (ec. 3.46), el vector deformación es D_u = (dr′ − dr)/dr
              (ec. 3.47).
            porque: >-
              Es la definición; sin ella el resto son fórmulas sueltas.
            minimo: true
          - punto: >-
              Como dr/dr = û, D_u = ε û, y en matrices {D_u} = [ε]{u}
              (ecs. 3.48 a 3.50), con εx, εy, εz en la diagonal y ½γ fuera
              de ella.
            porque: >-
              Es cómo se calcula, y en ella está el ½γ del tensor, donde más
              se falla.
            minimo: true
          - punto: >-
              Cada componente de D_u suma lo que aportan en ese eje las
              deformaciones normales (fig. 3.5) y las tangenciales
              (fig. 3.6).
            porque: >-
              Es lo que significa cada fila de la ec. 3.50.
          - punto: >-
              La componente intrínseca normal es la proyección sobre û:
              εu = D_u · û = {u}ᵗ[ε]{u} (ecs. 3.51 y 3.52), la deformación
              unitaria normal de la dirección.
            porque: >-
              Es la primera de las dos componentes que pide la cuestión.
            minimo: true
          - punto: >-
              La tangencial es la perpendicular: ½γu = √(D_u² − εu²)
              (ec. 3.53), la mitad de la deformación tangencial de la
              dirección.
            porque: >-
              Es la segunda, con su ½: la raíz no da γu.
            minimo: true
          - punto: >-
              Desarrollada, εu = εx ux² + εy uy² + εz uz² + γxy ux uy +
              γyz uy uz + γzx uz ux (ec. 3.54), la de las galgas; en el plano
              xy, la ec. 3.55.
            porque: >-
              Es la forma que se usa con las galgas, y en ella la γ va
              entera.
          - punto: >-
              Por la similitud con las tensiones (apartado 3.6), todo lo de σn
              y τn vale con σ → ε y τ → ½γ, círculo de Mohr incluido.
            porque: >-
              Ahorra repetir el tema 2 y explica por qué los ejes del círculo
              de deformaciones son εu y ½γu.
      - tipo: calcular
        titulo: La deformación normal de la dirección
        pregunta: |
          Un ejemplo nuestro: en un punto, $\varepsilon_x = 400$,
          $\varepsilon_y = -200$, $\varepsilon_z = 100$, $\gamma_{xy} = 300$,
          $\gamma_{yz} = 0$ y $\gamma_{zx} = -200$, todas en $10^{-6}$. Para
          la dirección $\hat u = (2, 1, 2)/3$, ¿cuánto vale
          $\varepsilon_u$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '177.78'
          tolerancia: 0.05
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '188.89'
            mensaje: |
              Has puesto $\tfrac12\gamma$ en la ec. 3.54. En la forma
              desarrollada la $\gamma$ va entera: el $\tfrac12\gamma$ del
              tensor sale dos veces, una por cada lado de la diagonal, y se
              junta en $\gamma$.
          - valor: '155.56'
            mensaje: |
              Has puesto $\gamma$ entera fuera de la diagonal del tensor y
              luego has hecho $\{u\}^{t}[\varepsilon]\{u\}$: así cada $\gamma$
              cuenta dos veces. En el tensor va $\tfrac12\gamma$ (ec. 3.50).
          - valor: '252.21'
            mensaje: |
              Es el módulo de $\vec D_u$, no su proyección sobre $\hat u$:
              $\varepsilon_u = \vec D_u\cdot\hat u$ (ec. 3.51).
        pista: |
          $\{D_u\} = [\varepsilon]\{u\}$ con $\tfrac12\gamma$ fuera de la
          diagonal, y $\varepsilon_u = \{u\}^{t}\{D_u\}$.
        desarrollo: |
          Con $\tfrac12\gamma_{xy} = 150$ y $\tfrac12\gamma_{zx} = -100$, en
          $10^{-6}$:

          $$
          \{D_u\} = \begin{bmatrix} 400 & 150 & -100\\ 150 & -200 & 0\\ -100 & 0 & 100 \end{bmatrix}
          \frac13\begin{Bmatrix} 2\\ 1\\ 2 \end{Bmatrix}
          = \begin{Bmatrix} 250\\ 33{,}33\\ 0 \end{Bmatrix}
          $$

          $$
          \varepsilon_u = \frac{2\cdot250 + 33{,}33 + 2\cdot0}{3} = 177{,}78
          $$
      - tipo: calcular
        titulo: La componente tangencial
        pregunta: |
          ¿Y la componente intrínseca tangencial, $\tfrac12\gamma_u$, en
          unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '178.90'
          tolerancia: 0.05
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '357.81'
            mensaje: |
              Es $\gamma_u$. La componente intrínseca tangencial es su mitad,
              $\tfrac12\gamma_u$ (ec. 3.53).
          - valor: '252.21'
            mensaje: |
              Es $|\vec D_u|$, el vector entero. Falta quitarle la parte
              normal: $\tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}$.
          - valor: '74.43'
            mensaje: |
              Has restado los módulos, $|\vec D_u| - \varepsilon_u$. Las dos
              componentes son perpendiculares: se restan los cuadrados, como
              en Pitágoras (ec. 3.53).
        pista: |
          $\tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}$ (ec. 3.53),
          con $D_u^{2} = D_{ux}^{2} + D_{uy}^{2} + D_{uz}^{2}$.
        desarrollo: |
          $$
          D_u^{2} = 250^{2} + 33{,}333^{2} = 63611{,}1
          $$

          $$
          \tfrac12\gamma_u = \sqrt{63611{,}1 - 177{,}778^{2}} = \sqrt{32006{,}1} = 178{,}90
          $$
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La parte simétrica transforma $d\vec r$ en
              $d\vec r' = d\vec r + [\varepsilon]\,d\vec r$ (ec. 3.46).
          - texto: >-
              Dividiendo por $dr$: $\{D_u\} = [\varepsilon]\{u\}$, con
              $\tfrac12\gamma$ fuera de la diagonal (ecs. 3.47 a 3.50).
          - texto: >-
              Proyectando sobre $\hat u$:
              $\varepsilon_u = \{u\}^{t}[\varepsilon]\{u\}$ (ec. 3.52).
          - texto: >-
              La otra componente es la perpendicular:
              $\tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}$
              (ec. 3.53).
          - texto: >-
              La componente tangencial es
              $\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}$, la deformación
              tangencial entera.
            trampa: true
            mensaje: |
              La raíz da $\tfrac12\gamma_u$, no $\gamma_u$: en el tensor, y por
              tanto en $\vec D_u$, las tangenciales entran con su mitad. Por eso
              el eje vertical del círculo de Mohr de deformaciones es
              $\tfrac12\gamma$ (p. 17).
    resolucion: |
      **La definición** (apuntes del tema 3, apartado 3.5.2, pp. 14 y 15).
      Con solo la parte simétrica de la transformación, la deformación pura,

      $$
      d\vec r' = d\vec r + \vec{\vec\varepsilon}\,d\vec r \qquad (3.46)
      $$

      el vector deformación de la dirección es el cambio del elemento por
      unidad de longitud:

      $$
      \vec D_u = \frac{d\vec r' - d\vec r}{dr} = \vec{\vec\varepsilon}\,\hat u \qquad (3.47,\ 3.48)
      $$

      con $\hat u = d\vec r/dr$. En matrices, $\{D_u\} = [\varepsilon]\{u\}$
      (ec. 3.49):

      $$
      \begin{Bmatrix} D_{ux}\\ D_{uy}\\ D_{uz} \end{Bmatrix}
      = \begin{bmatrix} \varepsilon_x & \tfrac12\gamma_{xy} & \tfrac12\gamma_{zx}\\
      \tfrac12\gamma_{xy} & \varepsilon_y & \tfrac12\gamma_{yz}\\
      \tfrac12\gamma_{zx} & \tfrac12\gamma_{yz} & \varepsilon_z \end{bmatrix}
      \begin{Bmatrix} u_x\\ u_y\\ u_z \end{Bmatrix} \qquad (3.50)
      $$

      Cada componente suma lo que aportan en ese eje las deformaciones
      normales ($\varepsilon_x u_x$…, fig. 3.5) y las tangenciales
      ($\tfrac12\gamma_{xy}u_y$…, fig. 3.6).

      **Las componentes intrínsecas** (pp. 16 y 17). La normal es la
      proyección sobre $\hat u$, la deformación unitaria normal de la
      dirección:

      $$
      \varepsilon_u = \vec D_u\cdot\hat u = \{u\}^{t}[\varepsilon]\{u\} \qquad (3.51,\ 3.52)
      $$

      y la tangencial es la perpendicular, la mitad de la deformación
      tangencial de la dirección:

      $$
      \tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}} \qquad (3.53)
      $$

      Desarrollada, la 3.52 es la fórmula de las galgas:

      $$
      \varepsilon_u = \varepsilon_x u_x^{2} + \varepsilon_y u_y^{2} + \varepsilon_z u_z^{2}
      + \gamma_{xy}u_xu_y + \gamma_{yz}u_yu_z + \gamma_{zx}u_zu_x \qquad (3.54)
      $$

      con $\gamma$ entera, y en el plano $xy$ ($u_z = 0$) queda la 3.55. Por
      la similitud con las tensiones (apartado 3.6, pp. 17 y 18), todo lo
      del tema 2 vale cambiando $\sigma$ por $\varepsilon$ y $\tau$ por
      $\tfrac12\gamma$: los ejes del círculo de Mohr son $\varepsilon_u$ y
      $\tfrac12|\gamma_u|$.

      **Un ejemplo nuestro**, en $10^{-6}$: $\varepsilon_x = 400$,
      $\varepsilon_y = -200$, $\varepsilon_z = 100$, $\gamma_{xy} = 300$,
      $\gamma_{yz} = 0$, $\gamma_{zx} = -200$ y $\hat u = (2, 1, 2)/3$.
      Con $\tfrac12\gamma$ en el tensor, $\{D_u\} = (250;\ 33{,}33;\ 0)$, y

      $$
      \varepsilon_u = \frac{2\cdot250 + 33{,}33}{3} = 177{,}78
      \qquad
      \tfrac12\gamma_u = \sqrt{63611{,}1 - 177{,}778^{2}} = 178{,}90
      $$

      La 3.54, con las $\gamma$ enteras, da lo mismo:
      $(400\cdot4 - 200 + 100\cdot4 + 300\cdot2 - 200\cdot4)/9 = 1600/9$.
      Las dos cifras salen igual con el motor del curso.

  # ── Cuestión 7 de autoevaluación del tema 3 · εu estacionaria.
  - id: ejerm3-cu7-la-deformacion-normal-estacionaria
    titulo: Donde el vector deformación es paralelo a la dirección, εu es estacionaria
    fuente: >-
      Cuestión 7 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra. Los apuntes del tema 3 no escriben esta
      demostración; se ha comprobado con los apartados 3.5.2 y 3.6 del tema 3
      (pp. 14 a 18) y con el apartado 2.4.3 del tema 2 (pp. 15 y 16), por la
      similitud entre tensiones y deformaciones. Se parece a la pregunta 3 de
      teoría del primer parcial de 2013-2014, que pide demostrar que las
      direcciones principales del tensor de tensiones y las de tensión
      normal máxima y mínima son las mismas; esta lo pide para el vector
      deformación. El ejemplo es nuestro, comprobado con el motor del curso y
      a mano.
    nivel: practica
    antes:
      idea: |
        La componente longitudinal $\varepsilon_u$ depende de la dirección.
        Buscar dónde es estacionaria es un problema de máximos y mínimos, el
        mismo que en el tema 2 se resuelve para $\sigma_n$.
      formula: |
        $$
        \varepsilon_u = \{u\}^{t}[\varepsilon]\{u\}
        \qquad
        \{D_u\} = [\varepsilon]\{u\}
        $$

        (ecs. 3.52 y 3.49).
      reconocer: |
        «Demostrar que en tales direcciones…» pide el camino entero: plantear
        qué se hace estacionario, resolverlo y llegar a la condición del
        enunciado.
    enunciado: |
      7. Demostrar que en las direcciones donde el vector deformación es
      paralelo a la dirección, la componente longitudinal del vector
      deformación adopta valores estacionarios.
    pide: >-
      La demostración de que la componente longitudinal es estacionaria en
      las direcciones en que el vector deformación es paralelo a la
      dirección.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para buscar las direcciones en que
          $\varepsilon_u = \{u\}^{t}[\varepsilon]\{u\}$ es máxima o mínima,
          ¿por qué no basta con igualar a cero sus derivadas respecto de
          $u_x$, $u_y$ y $u_z$?
        opciones:
          - texto: >-
              Porque $\hat u$ no es libre: tiene que ser unitario,
              $\{u\}^{t}\{u\} = 1$, y el extremo es condicionado
            correcta: true
            mensaje: |
              Eso es. Sin la condición, $2[\varepsilon]\{u\} = \{0\}$ solo
              da $\{u\} = \{0\}$ si $[\varepsilon]$ no es singular, y si lo
              es, solo las direcciones de deformación nula: ninguna es lo que
              se busca. Con ella se forma la función lagrangiana, como en el
              tema 2 con las tensiones (ecs. 2.31 a 2.33).
          - texto: >-
              Sí basta: el gradiente nulo de $\varepsilon_u$ da directamente
              las direcciones principales
            mensaje: |
              El gradiente de $\{u\}^{t}[\varepsilon]\{u\}$ es
              $2[\varepsilon]\{u\}$, y anularlo solo da $\{u\} = \{0\}$ si
              $[\varepsilon]$ no es singular. Falta la condición de módulo
              unitario.
          - texto: >-
              Porque $[\varepsilon]$ no es simétrico
            mensaje: |
              Lo es: fuera de la diagonal va $\tfrac12\gamma_{xy}$ en los dos
              lados. Y es esa simetría la que deja la derivada en
              $2[\varepsilon]\{u\}$.
          - texto: >-
              Porque $\varepsilon_u$ depende también de las deformaciones
              tangenciales
            mensaje: |
              Depende, pero eso no impide derivar. El problema es que
              $\hat u$ tiene que seguir siendo unitario.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen: el problema que se
          plantea, cómo se resuelve y por qué en esas direcciones el vector
          deformación es paralelo a la dirección.
        rubrica:
          - punto: >-
              Se plantea: εu = {u}ᵗ[ε]{u} (ec. 3.52), estacionaria con la
              condición {u}ᵗ{u} = 1.
            porque: >-
              Es el problema; sin la condición no tiene solución.
            minimo: true
          - punto: >-
              Se forma la función lagrangiana
              F({u}, λ) = {u}ᵗ[ε]{u} − λ({u}ᵗ{u} − 1), como la ec. 2.31 de
              tensiones.
            porque: >-
              Es la herramienta del extremo condicionado, la misma del tema
              2.
            minimo: true
          - punto: >-
              Se deriva respecto de {u} y se iguala a cero:
              2[ε]{u} − 2λ{u} = {0}, usando que [ε] es simétrico (como la
              ec. 2.32).
            porque: >-
              Es el paso que lleva al problema de autovalores.
            minimo: true
          - punto: >-
              Queda ([ε] − λ[I]){u} = {0}, es decir [ε]{u} = λ{u}: como
              {D_u} = [ε]{u}, el vector deformación es paralelo a la dirección
              (como la ec. 2.33).
            porque: >-
              Es lo que pide el enunciado: las direcciones estacionarias son
              aquellas en que D_u es paralelo a û, las principales.
            minimo: true
          - punto: >-
              Premultiplicando por {u}ᵗ, λ = {u}ᵗ[ε]{u} = εu: el multiplicador
              es la propia deformación normal, y allí
              ½γu = √(D_u² − εu²) = 0.
            porque: >-
              Dice qué valores toma: las deformaciones principales, sin
              componente tangencial.
          - punto: >-
              En ejes principales εu = ε1u1² + ε2u2² + ε3u3², que con
              u1² + u2² + u3² = 1 está entre ε3 y ε1: son la mínima y la
              máxima.
            porque: >-
              Cierra la demostración con lo que se usa en los problemas.
      - tipo: calcular
        titulo: La mayor deformación normal
        pregunta: |
          Un ejemplo nuestro: $\varepsilon_x = 500$, $\varepsilon_y = 200$,
          $\varepsilon_z = -100$, $\gamma_{xy} = 400$ y
          $\gamma_{yz} = \gamma_{zx} = 0$, todas en $10^{-6}$. De todas las
          direcciones del punto, ¿cuál es la mayor deformación normal
          $\varepsilon_u$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '600'
          tolerancia: 0.1
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '777.20'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera fuera de la diagonal. En el
              tensor va $\tfrac12\gamma_{xy} = 200$: el círculo de Mohr del
              plano $xy$ tiene centro 350 y radio
              $\sqrt{150^{2} + 200^{2}} = 250$.
          - valor: '500'
            mensaje: |
              Es la mayor de la diagonal, $\varepsilon_x$. Con
              $\gamma_{xy} \ne 0$, $x$ no es principal, y alguna dirección
              girada se alarga más.
        pista: |
          La mayor es la principal $\varepsilon_1$. En el plano $xy$, círculo
          de Mohr de deformaciones: centro $(\varepsilon_x + \varepsilon_y)/2$
          y radio $\sqrt{((\varepsilon_x - \varepsilon_y)/2)^{2} + (\tfrac12\gamma_{xy})^{2}}$.
          $z$ ya es principal.
        desarrollo: |
          $$
          \varepsilon_{1} = \frac{500 + 200}{2} + \sqrt{150^{2} + 200^{2}} = 350 + 250 = 600
          $$

          La otra del plano es $350 - 250 = 100$, y la de $z$, $-100$: las
          principales son 600, 100 y −100, en $10^{-6}$.
      - tipo: calcular
        titulo: La dirección de la mayor
        pregunta: |
          ¿Qué ángulo forma esa dirección con $x$, en grados, positivo de $x$
          hacia $y$?
        respuesta:
          tipo: numero
          valor: '26.57'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '53.13'
            mensaje: |
              Es $2\theta$: $\tan 2\theta = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = 4/3$.
              Falta dividir el ángulo entre 2.
          - valor: '116.57'
            mensaje: |
              Es la otra dirección principal del plano, la de
              $\varepsilon_2 = 100\cdot10^{-6}$, perpendicular a la buena.
              Comprueba con la 3.55 cuál de las dos da 600.
          - valor: '16.85'
            mensaje: |
              Has puesto $\tfrac12\gamma_{xy}$ en el numerador. Con la
              similitud, $\tan 2\theta = 2(\tfrac12\gamma_{xy})/(\varepsilon_x - \varepsilon_y) = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$.
        pista: |
          $\tan 2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$, la
          del tema 2 con $\tau \to \tfrac12\gamma$, y comprueba con la ec.
          3.55 que esa dirección da la mayor.
        desarrollo: |
          $$
          \tan 2\theta_1 = \frac{400}{500 - 200} = \frac43
          \quad\Rightarrow\quad 2\theta_1 = 53{,}13°,\quad \theta_1 = 26{,}57°
          $$

          Con $\cos^{2}\theta_1 = 0{,}8$, $\sin^{2}\theta_1 = 0{,}2$ y
          $\sin\theta_1\cos\theta_1 = 0{,}4$, la ec. 3.55 da
          $500\cdot0{,}8 + 200\cdot0{,}2 + 400\cdot0{,}4 = 600$: es la
          mayor.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Se busca el extremo de
              $\varepsilon_u = \{u\}^{t}[\varepsilon]\{u\}$ con
              $\{u\}^{t}\{u\} = 1$.
          - texto: >-
              Función lagrangiana:
              $F = \{u\}^{t}[\varepsilon]\{u\} - \lambda(\{u\}^{t}\{u\} - 1)$.
          - texto: >-
              Derivando e igualando a cero:
              $2[\varepsilon]\{u\} - 2\lambda\{u\} = \{0\}$, luego
              $[\varepsilon]\{u\} = \lambda\{u\}$.
          - texto: >-
              Como $\{D_u\} = [\varepsilon]\{u\}$, en esas direcciones
              $\vec D_u$ es paralelo a $\hat u$, y $\lambda = \varepsilon_u$.
          - texto: >-
              Al derivar,
              $\partial(\{u\}^{t}[\varepsilon]\{u\})/\partial\{u\} = [\varepsilon]\{u\}$,
              sin el 2, porque $\{u\}$ sale una sola vez.
            trampa: true
            mensaje: |
              $\{u\}$ sale dos veces, y con $[\varepsilon]$ simétrico la
              derivada es $2[\varepsilon]\{u\}$. El 2 se va con el del
              multiplicador, $2\lambda\{u\}$; si se olvida solo uno de los dos,
              $\lambda$ sale la mitad o el doble de $\varepsilon_u$.
    resolucion: |
      **El problema.** La componente longitudinal del vector deformación de
      una dirección $\hat u$ es (apuntes del tema 3, ec. 3.52)

      $$
      \varepsilon_u = \{u\}^{t}\{D_u\} = \{u\}^{t}[\varepsilon]\{u\}
      $$

      y se busca en qué direcciones es estacionaria. $\{u\}$ no es libre:
      tiene que cumplir $\{u\}^{t}\{u\} = 1$. Es un extremo condicionado, el
      mismo problema que el tema 2 resuelve para $\sigma_n$ (apartado 2.4.3,
      ecs. 2.31 a 2.33), aquí con $\varepsilon$ en vez de $\sigma$, por la
      similitud del apartado 3.6.

      **La función lagrangiana:**

      $$
      F(\{u\}, \lambda) = \{u\}^{t}[\varepsilon]\{u\} - \lambda\left(\{u\}^{t}\{u\} - 1\right)
      $$

      **Las direcciones estacionarias.** Derivando respecto de $\{u\}$, con
      $[\varepsilon]$ simétrico, e igualando a cero:

      $$
      \frac{\partial F}{\partial\{u\}} = 2[\varepsilon]\{u\} - 2\lambda\{u\} = \{0\}
      \quad\Rightarrow\quad
      \left([\varepsilon] - \lambda[I]\right)\{u\} = \{0\}
      $$

      Es decir, $[\varepsilon]\{u\} = \lambda\{u\}$, y como
      $\{D_u\} = [\varepsilon]\{u\}$ (ec. 3.49):

      $$
      \{D_u\} = \lambda\{u\}
      $$

      En las direcciones en que $\varepsilon_u$ es estacionaria, el vector
      deformación es paralelo a la dirección; y al revés, si
      $\vec D_u = \lambda\hat u$, se cumple la condición de estacionariedad.
      Son las direcciones principales del tensor de deformaciones.
      Premultiplicando por $\{u\}^{t}$,
      $\lambda = \{u\}^{t}[\varepsilon]\{u\} = \varepsilon_u$: el
      multiplicador es la propia deformación normal, la deformación
      principal, y en esas direcciones
      $\tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}} = 0$.

      **Máximo y mínimo.** En ejes principales,
      $\varepsilon_u = \varepsilon_1u_1^{2} + \varepsilon_2u_2^{2} + \varepsilon_3u_3^{2}$,
      con $u_1^{2} + u_2^{2} + u_3^{2} = 1$: está entre $\varepsilon_3$ y
      $\varepsilon_1$, que son la menor y la mayor deformación normal del
      punto.

      **Un ejemplo nuestro**, en $10^{-6}$: $\varepsilon_x = 500$,
      $\varepsilon_y = 200$, $\varepsilon_z = -100$, $\gamma_{xy} = 400$.
      En el plano $xy$, centro 350 y radio 250: $\varepsilon_1 = 600$ a
      $\theta_1 = 26{,}57°$ de $x$, $\varepsilon_2 = 100$, y
      $\varepsilon_3 = -100$ según $z$. En $\theta_1$, la ec. 3.55 da 600 y
      $\tfrac12\gamma_u = 0$; a 5° de ella, $\varepsilon_u = 596{,}2$, menor.
      El motor del curso (sus principales por rotaciones de Jacobi) da lo
      mismo.

  # ── Cuestión 8 de autoevaluación del tema 3 · variación de volumen.
  - id: ejerm3-cu8-la-variacion-de-volumen
    titulo: La variación de volumen de un elemento diferencial
    fuente: >-
      Cuestión 8 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartado 3.7
      (pp. 18 y 19, ecs. 3.56 a 3.60). Se parece a la pregunta 1 de teoría
      del primer parcial de 2012-2013, que pide explicar las variaciones que
      sufre un paralelepípedo elemental en el proceso de deformación, y que
      es la cuestión 1 de esta hoja; esta pide solo la de volumen. El ejemplo
      es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        El elemento diferencial, tras deformarse, es un paralelepípedo oblicuo:
        sus aristas cambian de longitud y sus ángulos dejan de ser rectos. Su
        volumen sale de esas tres aristas, y después se queda con lo que es de
        primer orden.
      formula: |
        $$
        dV' = \overrightarrow{O'A'}\cdot\left(\overrightarrow{O'B'}\times\overrightarrow{O'C'}\right)
        $$

        El volumen de un paralelepípedo es el producto mixto de sus tres
        aristas.
      reconocer: |
        Es una pregunta de teoría que acaba en una magnitud con nombre propio,
        y en qué la hace cambiar. Cada paso del desarrollo dice qué se
        desprecia.
    enunciado: |
      8. Variación de volumen de un elemento diferencial.
    pide: >-
      Cómo se calcula el volumen del elemento tras la deformación, qué es la
      deformación volumétrica unitaria y qué deformaciones cambian el
      volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las deformaciones tangenciales, ¿cambian el volumen del elemento?
        opciones:
          - texto: >-
              No, a primer orden: cambian los ángulos y la forma; el volumen
              lo cambian las normales,
              $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$
            correcta: true
            mensaje: |
              Eso es (ec. 3.59 y p. 19). En el determinante de la ec. 3.56 las
              tangenciales solo aparecen multiplicadas entre sí: son de
              segundo orden.
          - texto: >-
              Sí, como las normales: se suman las seis componentes del tensor
            mensaje: |
              Una distorsión pura convierte el cubo en un paralelepípedo
              oblicuo con la misma base y, a primer orden, la misma altura: no
              cambia el volumen.
          - texto: >-
              Sí, pero solo las positivas, que cierran el ángulo
            mensaje: |
              El signo de $\gamma$ dice si el ángulo recto se cierra o se
              abre; ninguna de las dos cosas cambia el volumen a primer
              orden.
          - texto: >-
              Solo si el material es incompresible
            mensaje: |
              Es al revés: un material incompresible ($\nu = 0{,}5$, tema 4)
              es el que no cambia de volumen. Que las tangenciales no lo
              cambien es geometría, y vale con cualquier material.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Explica cómo se calcula la variación de volumen como en un examen:
          el volumen deformado, la aproximación, la deformación volumétrica y
          el volumen de todo el cuerpo.
        rubrica:
          - punto: >-
              El volumen deformado es el producto mixto de las tres aristas
              deformadas, dV′ = O′A′ · (O′B′ × O′C′), el determinante de la
              ec. 3.56 por dV = dx dy dz.
            porque: >-
              Es el punto de partida: el volumen de un paralelepípedo
              oblicuo.
            minimo: true
          - punto: >-
              Despreciando los términos de segundo orden y con las normales de
              la ec. 3.14, dV′ = (1 + εx)(1 + εy)(1 + εz) dV (ec. 3.57).
            porque: >-
              Es donde desaparecen las tangenciales: solo salen en productos
              de dos derivadas.
            minimo: true
          - punto: >-
              Con solo los términos de primer orden,
              dV′ = (1 + εx + εy + εz) dV (ec. 3.58).
            porque: >-
              Es la forma lineal, la de pequeños desplazamientos.
          - punto: >-
              La deformación volumétrica unitaria es la variación relativa de
              volumen: e = ΔdV/dV = (dV′ − dV)/dV = εx + εy + εz (ec. 3.59).
            porque: >-
              Es la definición que pide la cuestión.
            minimo: true
          - punto: >-
              La variación de volumen de todo el cuerpo es ΔV = ∫ e dV,
              extendida al volumen V (ec. 3.60).
            porque: >-
              Pasa del elemento al cuerpo.
          - punto: >-
              El volumen lo cambian las deformaciones normales; las
              tangenciales cambian los ángulos rectos y dan distorsión sin
              cambio de volumen (p. 19).
            porque: >-
              Es la idea que separa cambio de volumen y cambio de forma, la
              misma que separa después las dos partes de la energía.
            minimo: true
      - tipo: calcular
        titulo: El cambio de volumen del bloque
        pregunta: |
          Un ejemplo nuestro: un bloque de 100 × 50 × 20 mm se deforma
          uniformemente con $\varepsilon_x = 600$,
          $\varepsilon_y = \varepsilon_z = -180$ y $\gamma_{xy} = 400$, todas
          en $10^{-6}$. ¿Cuánto cambia su volumen, en mm³, con su signo?
        respuesta:
          tipo: numero
          valor: '24.00'
          tolerancia: 0.05
          formato: un número, en mm³, con su signo
        distractores:
          - valor: '64'
            mensaje: |
              Has sumado $\gamma_{xy}$ a la traza. Las tangenciales no cambian
              el volumen: $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$.
          - valor: '96'
            mensaje: |
              Has sumado las tres sin su signo. $\varepsilon_y$ y
              $\varepsilon_z$ son acortamientos: $600 - 180 - 180 = 240$, en
              $10^{-6}$.
          - valor: '60'
            mensaje: |
              Solo has contado $\varepsilon_x$. Las otras dos aristas se
              acortan, y eso también cambia el volumen.
        pista: |
          $\Delta V = e\,V$, con $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$
          (ec. 3.59) y $V = 100\cdot50\cdot20$ mm³.
        desarrollo: |
          $$
          e = (600 - 180 - 180)\cdot10^{-6} = 240\cdot10^{-6}
          $$

          $$
          \Delta V = 240\cdot10^{-6}\cdot10^{5}\ \text{mm}^{3} = 24\ \text{mm}^{3}
          $$

          Con el producto de la ec. 3.57 sale $23{,}98$ mm³: la diferencia es
          de segundo orden.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El volumen deformado es el producto mixto de las tres aristas
              deformadas (ec. 3.56).
          - texto: >-
              A primer orden solo quedan los términos de la diagonal:
              $dV' = (1 + \varepsilon_x + \varepsilon_y + \varepsilon_z)\,dV$
              (ec. 3.58).
          - texto: >-
              La deformación volumétrica es
              $e = (dV' - dV)/dV = \varepsilon_x + \varepsilon_y + \varepsilon_z$
              (ec. 3.59).
          - texto: >-
              La del cuerpo entero es $\Delta V = \int_V e\,dV$ (ec. 3.60).
          - texto: >-
              Las deformaciones tangenciales también cambian el volumen,
              porque inclinan las caras del elemento.
            trampa: true
            mensaje: |
              Inclinar las caras con la misma base y la misma altura no cambia
              el volumen a primer orden: en la ec. 3.56 las tangenciales solo
              aparecen en productos de dos derivadas. Cambian la forma, no el
              volumen (p. 19).
    resolucion: |
      **El volumen deformado** (apuntes del tema 3, apartado 3.7, p. 18).
      Las aristas del elemento de la fig. 3.1, tras la deformación, forman un
      paralelepípedo oblicuo, y su volumen es el producto mixto:

      $$
      dV' = \overrightarrow{O'A'}\cdot\left(\overrightarrow{O'B'}\times\overrightarrow{O'C'}\right)
      = \begin{vmatrix} 1 + u_{,x} & v_{,x} & w_{,x}\\ u_{,y} & 1 + v_{,y} & w_{,y}\\ u_{,z} & v_{,z} & 1 + w_{,z} \end{vmatrix} dV \qquad (3.56)
      $$

      con $dV = dx\,dy\,dz$ el volumen inicial. Al desarrollar el
      determinante, las derivadas de fuera de la diagonal solo aparecen
      multiplicadas entre sí. Despreciando los términos de segundo orden y
      con las normales de la ec. 3.14:

      $$
      dV' = (1 + \varepsilon_x)(1 + \varepsilon_y)(1 + \varepsilon_z)\,dV \qquad (3.57)
      $$

      y con solo los de primer orden,
      $dV' = (1 + \varepsilon_x + \varepsilon_y + \varepsilon_z)\,dV$
      (ec. 3.58).

      **La deformación volumétrica unitaria** es la variación relativa de
      volumen:

      $$
      e = \frac{\Delta dV}{dV} = \frac{dV' - dV}{dV} = \varepsilon_x + \varepsilon_y + \varepsilon_z \qquad (3.59)
      $$

      Es la traza del tensor de deformaciones, su primer invariante: no
      depende de los ejes. La variación de volumen de todo el cuerpo es
      $\Delta V = \int_V e\,dV$ (ec. 3.60).

      **Qué cambia el volumen** (p. 19). El volumen cambia porque las aristas
      cambian de longitud, por las deformaciones normales (fig. 3.5). Las
      tangenciales cambian los ángulos rectos: el elemento sufre una
      distorsión, un cambio de forma, sin variación de volumen (fig. 3.6).
      En un problema de pequeños desplazamientos el elemento sufre una
      traslación, una rotación de sólido rígido y una deformación pura, y de
      esta las normales dan el cambio de volumen y las tangenciales el de
      forma.

      **Un ejemplo nuestro.** Un bloque de 100 × 50 × 20 mm, con
      $\varepsilon_x = 600$, $\varepsilon_y = \varepsilon_z = -180$ y
      $\gamma_{xy} = 400$, en $10^{-6}$:
      $e = (600 - 180 - 180)\cdot10^{-6} = 240\cdot10^{-6}$ y
      $\Delta V = 240\cdot10^{-6}\cdot10^{5}\ \text{mm}^{3} = 24\ \text{mm}^{3}$.
      La $\gamma_{xy}$ no entra. La ec. 3.57 da 23,98 mm³; el motor del
      curso, con la traza del tensor, 24.

  # ── Cuestión 10 de autoevaluación del tema 3 · el significado de la compatibilidad.
  - id: ejerm3-cu10-el-significado-de-la-compatibilidad
    titulo: Qué significan las condiciones de compatibilidad
    fuente: >-
      Cuestión 10 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartado 3.8
      (pp. 19 y 20, ecs. 3.61 a 3.64). No está entre las preguntas de examen
      publicadas en el sitio; la cuestión 9 de esta hoja, la deducción en un
      caso bidimensional, cayó en los primeros parciales de 2015-2016 y
      2016-2017 y está en el sitio con su resolución. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        De los desplazamientos a las deformaciones se va derivando, y siempre se
        puede. Al revés hay que integrar, y la cuestión es si unas
        deformaciones dadas cualesquiera se pueden integrar.
      formula: |
        $$
        du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy
        \qquad
        dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy
        $$

        (ec. 3.61): los desplazamientos, escritos con las deformaciones y el
        giro.
      reconocer: |
        «Significado» pide el sentido físico, no solo las ecuaciones: qué
        problema resuelven, qué exigen y qué le pasa a un cuerpo cuyas
        deformaciones no las cumplen.
    enunciado: |
      10. Significado de las condiciones de compatibilidad.
    pide: >-
      Qué expresan las condiciones de compatibilidad, por qué hacen falta y
      qué pasa con un campo de deformaciones que no las cumple.
    pasos:
      - tipo: reconocer
        pregunta: |
          De unos desplazamientos siempre salen unas deformaciones. ¿Por qué
          hacen falta condiciones para ir al revés, de las deformaciones a los
          desplazamientos?
        opciones:
          - texto: >-
              Porque hay seis deformaciones y solo tres desplazamientos: seis
              funciones cualesquiera no salen, en general, de derivar tres
            correcta: true
            mensaje: |
              Eso es (p. 19). Las seis componentes del tensor salen de solo
              $u$, $v$ y $w$; para que al integrarlas se llegue a unos
              desplazamientos tienen que estar ligadas entre sí, y esas
              ligaduras son las condiciones de compatibilidad.
          - texto: >-
              Porque el elemento tiene que estar en equilibrio
            mensaje: |
              El equilibrio es de las tensiones (tema 2). La compatibilidad es
              solo geometría: no mira ni fuerzas ni material.
          - texto: >-
              Porque las deformaciones tienen que ser pequeñas
            mensaje: |
              Las del tema lo son, pero eso no basta: un campo de
              deformaciones pequeñas puede no salir de ningún desplazamiento.
          - texto: >-
              Porque la ley de Hooke liga las tensiones con las deformaciones
            mensaje: |
              Hooke es del tema 4 y liga tensiones con deformaciones. La
              compatibilidad liga las deformaciones entre sí, sea cual sea el
              material.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica su significado como en un examen: qué problema resuelven,
          qué exigen y qué pasa si no se cumplen.
        rubrica:
          - punto: >-
              Las seis componentes del tensor de deformaciones dependen de
              solo tres componentes del desplazamiento, u, v y w (p. 19).
            porque: >-
              Es el porqué de todo: hay más funciones que las que las
              producen.
            minimo: true
          - punto: >-
              Para obtener los desplazamientos integrando las deformaciones,
              estas tienen que cumplir unas condiciones de integrabilidad:
              las ecuaciones de compatibilidad.
            porque: >-
              Es la definición de lo que son las condiciones.
            minimo: true
          - punto: >-
              Expresan que los desplazamientos y los giros son funciones del
              punto y no del camino de integración: du, dv y el giro tienen
              que ser diferenciales exactas (ecs. 3.61 y 3.62).
            porque: >-
              Es el significado matemático, y de él sale la deducción.
            minimo: true
          - punto: >-
              Físicamente, los elementos deformados encajan entre sí sin
              huecos ni solapes: un campo que no las cumple no lo puede dar
              ningún cuerpo continuo.
            porque: >-
              Es el significado físico; sin él son ecuaciones sin sentido.
            minimo: true
          - punto: >-
              En el plano es una sola, εx,yy + εy,xx = γxy,xy (ec. 3.63); en
              el espacio, seis (ec. 3.64).
            porque: >-
              Concreta lo anterior y dice cuántas ligaduras hay.
          - punto: >-
              Un campo que sale de derivar unos desplazamientos las cumple
              siempre; hay que comprobarlas cuando las deformaciones vienen
              dadas o salen de otro sitio, como de unas tensiones con la ley
              de Hooke.
            porque: >-
              Dice cuándo se usan en la práctica.
      - tipo: calcular
        titulo: El giro por un camino
        pregunta: |
          Un ejemplo nuestro, en el plano: $\varepsilon_x = \varepsilon_y = 0$
          y $\gamma_{xy} = k\,x\,y$, con $k = 4\cdot10^{-4}$ m⁻². Con el giro
          $\omega_{xy}$ nulo en el origen, se integra su diferencial hasta el
          punto (2, 1) m por el camino 1: primero según $x$, de (0, 0) a
          (2, 0), y luego según $y$, hasta (2, 1). ¿Cuánto vale
          $\omega_{xy}$ al llegar, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '8'
            mensaje: |
              Te has dejado el ½ de la ec. 3.62:
              $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x} = \tfrac12k\,x$.
          - valor: '-4'
            mensaje: |
              Tiene el signo cambiado. En los apuntes,
              $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}$
              (ec. 3.62), y con $\tfrac12\gamma_{xy,y} = \tfrac12k\,x > 0$ el
              giro crece al subir. Si has usado $\omega_{yx} = -\omega_{xy}$,
              el de la ec. 3.34, es el otro.
          - valor: '0'
            mensaje: |
              En el tramo según $x$, a $y = 0$,
              $\omega_{xy,x} = -\tfrac12k\,y = 0$ y el giro no cambia; pero en
              el tramo según $y$, a $x = 2$ m, $\omega_{xy,y} = \tfrac12k\cdot2$
              y sí cambia.
        pista: |
          Ec. 3.62: $\omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x}$
          y $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}$. Aquí
          $\omega_{xy,x} = -\tfrac12k\,y$ y $\omega_{xy,y} = \tfrac12k\,x$.
        desarrollo: |
          Tramo según $x$, a $y = 0$: $\omega_{xy,x} = 0$ y
          $\omega_{xy}(2, 0) = 0$. Tramo según $y$, a $x = 2$:

          $$
          \omega_{xy}(2, 1) = \int_0^1 \tfrac12k\cdot2\,dy = k = 4\cdot10^{-4}
          $$
      - tipo: calcular
        titulo: El giro por el otro camino
        pregunta: |
          Ahora por el camino 2: primero según $y$, de (0, 0) a (0, 1), y
          luego según $x$, hasta (2, 1). ¿Cuánto vale $\omega_{xy}$ al
          llegar, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '4'
            mensaje: |
              Es lo del camino 1, y es lo que saldría si el giro fuera una
              función del punto. Aquí no lo es: por el camino 2, el tramo que
              cuenta es el de $y = 1$ m, con
              $\omega_{xy,x} = -\tfrac12k\,y < 0$.
          - valor: '-8'
            mensaje: |
              Te has dejado el ½:
              $\omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x} = -\tfrac12k\,y$.
          - valor: '0'
            mensaje: |
              En el primer tramo, a $x = 0$, no cambia; en el segundo, a
              $y = 1$ m, $\omega_{xy,x} = -\tfrac12k$ a lo largo de 2 m, y
              baja $k$.
        pista: |
          Las mismas derivadas de antes, ahora por el otro orden: primero
          $\omega_{xy,y}$ a $x = 0$ y después $\omega_{xy,x}$ a $y = 1$.
        desarrollo: |
          Tramo según $y$, a $x = 0$: $\omega_{xy,y} = 0$ y
          $\omega_{xy}(0, 1) = 0$. Tramo según $x$, a $y = 1$:

          $$
          \omega_{xy}(2, 1) = \int_0^2 \left(-\tfrac12k\cdot1\right)dx = -k = -4\cdot10^{-4}
          $$

          Dos caminos, dos giros en el mismo punto: el campo no cumple la
          ec. 3.63 ($0 + 0 \ne k$), y no hay ningún cuerpo continuo que se
          deforme así.
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay seis deformaciones y solo tres desplazamientos, de los que
              salen todas.
          - texto: >-
              Para recuperar $u$, $v$ y el giro integrando, sus diferenciales
              tienen que ser exactas: funciones del punto, no del camino.
          - texto: >-
              Esa exigencia, escrita con las deformaciones, son las ecuaciones
              de compatibilidad: una en el plano (ec. 3.63) y seis en el
              espacio (ec. 3.64).
          - texto: >-
              Si no se cumplen, el giro o los desplazamientos dependen del
              camino: el material tendría que abrirse o solaparse.
          - texto: >-
              Si un campo no cumple la compatibilidad, el cuerpo no está en
              equilibrio y hay que cambiar las cargas.
            trampa: true
            mensaje: |
              La compatibilidad no mira fuerzas: es geometría. Un campo
              incompatible no es un problema de equilibrio sino de
              continuidad: no hay desplazamientos continuos que lo den, con
              ninguna carga.
    resolucion: |
      **El problema** (apuntes del tema 3, apartado 3.8, p. 19). Las seis
      componentes del tensor de deformaciones, que dan la deformación pura,
      están relacionadas con solo tres componentes de desplazamiento. Al ir
      al revés —obtener los desplazamientos integrando las deformaciones—
      seis funciones cualesquiera no sirven: tienen que cumplir ciertas
      condiciones de integrabilidad, las **ecuaciones de compatibilidad**.

      **Qué expresan.** Se obtienen de exigir que las diferenciales de los
      desplazamientos y de las rotaciones sean exactas. En el plano,

      $$
      du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy \qquad
      dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy \qquad (3.61)
      $$

      tienen que ser diferenciales exactas, y también la del giro
      $\omega_{xy}$, cuyas derivadas da la ec. 3.62. Eso significa que **los
      desplazamientos y las rotaciones son funciones del punto, y no del
      camino** recorrido al integrar. Físicamente: los elementos deformados
      encajan unos con otros, sin huecos ni solapes; el cuerpo sigue siendo
      continuo.

      **Cuántas.** En el plano, una:

      $$
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy} \qquad (3.63)
      $$

      y en el espacio, seis (ec. 3.64). Un campo que sale de derivar unos
      desplazamientos las cumple siempre; se comprueban cuando las
      deformaciones vienen dadas, o cuando salen de otro sitio, por ejemplo
      de unas tensiones con la ley de Hooke del tema 4.

      **Un ejemplo nuestro.** $\varepsilon_x = \varepsilon_y = 0$ y
      $\gamma_{xy} = k\,x\,y$, con $k = 4\cdot10^{-4}$ m⁻². La 3.63 no se
      cumple: $0 + 0 \ne k$. La ec. 3.62 da
      $\omega_{xy,x} = -\tfrac12k\,y$ y $\omega_{xy,y} = \tfrac12k\,x$, y
      sus derivadas cruzadas no son iguales ($-\tfrac12k$ frente a
      $+\tfrac12k$). Integrando desde el origen hasta (2, 1) m:

      | camino | $\omega_{xy}(2, 1)$, en $10^{-4}$ |
      |---|---|
      | primero según $x$, luego según $y$ | 4 |
      | primero según $y$, luego según $x$ | −4 |

      El mismo punto tendría dos giros: el campo no lo puede dar ningún
      cuerpo continuo. Las dos integrales salen igual con la cuadratura de
      Gauss del motor del curso, por Simpson y en forma cerrada,
      $\pm\tfrac12k\cdot2\cdot1$.

  # ── Cuestión 11 de autoevaluación del tema 3 · las condiciones que se imponen.
  - id: ejerm3-cu11-las-condiciones-que-se-imponen
    titulo: Qué condiciones se imponen para llegar a la compatibilidad
    fuente: >-
      Cuestión 11 de autoevaluación · Tema 3, «Deformaciones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 3, apartado 3.8
      (pp. 19 y 20, ecs. 3.61 a 3.64). Se parece a la cuestión 9 de esta
      hoja, «Deducción de las condiciones de compatibilidad en un caso
      bidimensional», que cayó casi palabra por palabra en los primeros parciales
      de 2015-2016 y 2016-2017 y está en el sitio con su resolución; esta
      pregunta por las condiciones que se imponen. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Las ecuaciones de compatibilidad salen de pedir que lo que se integra a
        partir de las deformaciones dependa del punto y no del camino. La
        deducción encadena varias condiciones así, cada una sobre lo que dio la
        anterior.
      formula: |
        $$
        \frac{\partial P}{\partial y} = \frac{\partial Q}{\partial x}
        $$

        La condición para que $P\,dx + Q\,dy$ sea una diferencial exacta: las
        derivadas cruzadas, iguales.
      reconocer: |
        Pregunta por el camino, no por el resultado: cada condición que se
        impone, en orden, y lo que da. Las ecuaciones del plano y del espacio
        son el punto de llegada.
    enunciado: |
      11. ¿Qué condiciones se imponen para obtener las ecuaciones de
      compatibilidad?
    pide: >-
      Las condiciones que se imponen, en qué orden y qué da cada una, hasta
      las ecuaciones de compatibilidad del plano y del espacio.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la deducción del plano se supone que
          $\gamma_{xy,xy} = \gamma_{xy,yx}$. ¿Qué hace falta para poder
          suponerlo?
        opciones:
          - texto: >-
              Que las segundas derivadas de las deformaciones sean continuas
              o, lo que es lo mismo, las terceras de los desplazamientos
              (teorema de Schwarz)
            correcta: true
            mensaje: |
              Eso es (p. 20). Es una condición más, además de que los
              desplazamientos y el giro sean funciones del punto.
          - texto: >-
              Que las deformaciones sean pequeñas
            mensaje: |
              Ser pequeñas no dice nada del orden de derivación. El teorema de
              Schwarz pide que las derivadas segundas sean continuas.
          - texto: >-
              Que el material sea isótropo
            mensaje: |
              La compatibilidad es geometría, no material: vale igual para un
              material anisótropo.
          - texto: >-
              Nada: las derivadas cruzadas son siempre iguales
            mensaje: |
              Solo si son continuas (Schwarz); hay funciones cuyas derivadas
              cruzadas no coinciden en algún punto. Los apuntes lo ponen como
              condición.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Contesta como en un examen: cada condición que se impone, qué da y
          a qué ecuación se llega.
        rubrica:
          - punto: >-
              Se escriben las diferenciales de los desplazamientos con las
              deformaciones y el giro: du = εx dx + (½γxy + ωxy) dy y
              dv = (½γxy − ωxy) dx + εy dy (ec. 3.61).
            porque: >-
              Es de donde se parte; sin el giro no hay nada que imponer.
            minimo: true
          - punto: >-
              Primera condición: du y dv son diferenciales exactas (los
              desplazamientos son funciones del punto), luego sus derivadas
              cruzadas son iguales; de ahí ωxy,x = εx,y − ½γxy,x y
              ωxy,y = ½γxy,y − εy,x (ec. 3.62).
            porque: >-
              Es la primera de las dos condiciones de diferencial exacta.
            minimo: true
          - punto: >-
              Segunda: el giro también es función del punto, dωxy exacta,
              ωxy,xy = ωxy,yx; derivando la 3.62 se llega a
              εx,yy + εy,xx = γxy,xy (ec. 3.63).
            porque: >-
              Es la que da la ecuación.
            minimo: true
          - punto: >-
              Tercera, para poder igualar γxy,xy y γxy,yx: que las segundas
              derivadas de las deformaciones, o las terceras de los
              desplazamientos, sean continuas (teorema de Schwarz).
            porque: >-
              Es la condición que más se olvida, y los apuntes la dicen.
            minimo: true
          - punto: >-
              En el espacio se hace lo mismo con los tres planos y salen seis
              ecuaciones (ec. 3.64).
            porque: >-
              Completa la respuesta: la cuestión no se limita al plano.
      - tipo: calcular
        titulo: El giro de un campo compatible
        pregunta: |
          Un ejemplo nuestro: $\varepsilon_x = 10^{-4}\,y^{2}$,
          $\varepsilon_y = 0$ y $\gamma_{xy} = 2\cdot10^{-4}\,x\,y$, con $x$ e
          $y$ en metros. Con $\omega_{xy}$ nulo en el origen, ¿cuánto vale
          $\omega_{xy}$ en el punto (2, 1) m, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '-2'
            mensaje: |
              Es $\omega_{yx} = \tfrac12(v_{,x} - u_{,y})$, el de la ec. 3.34,
              que da el vector giro. El de las ecs. 3.61 y 3.62 es
              $\omega_{xy} = -\omega_{yx}$: $u_{,y} = \tfrac12\gamma_{xy} + \omega_{xy}$.
          - valor: '4'
            mensaje: |
              Salen 4 de dos maneras. Sin el ½ de la ec. 3.62,
              $\omega_{xy,y}$ sería $2x$ en vez de $x$. O sumando los dos
              lados de fuera del rectángulo, $\omega_{xy,x}$ a $y = 1$ y
              $\omega_{xy,y}$ a $x = 2$: cada camino recorre solo un lado
              según $x$ y otro según $y$.
          - valor: '0'
            mensaje: |
              En el tramo según $x$ a $y = 0$ no cambia,
              $\omega_{xy,x} = 10^{-4}y = 0$; pero luego, a $x = 2$ m,
              $\omega_{xy,y} = 10^{-4}x$ no es nula.
        pista: |
          Ec. 3.62: $\omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x}$
          y $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}$.
          Integra por cualquier camino: si el campo es compatible, da igual
          cuál.
        desarrollo: |
          En $10^{-4}$: $\omega_{xy,x} = 2y - y = y$ y
          $\omega_{xy,y} = x - 0 = x$. Primero según $x$ a $y = 0$, nada;
          luego según $y$ a $x = 2$:

          $$
          \omega_{xy}(2, 1) = \int_0^1 2\,dy = 2
          $$

          Por el otro camino, $\int_0^2 1\,dx = 2$: lo mismo, porque el campo
          es compatible ($\varepsilon_{x,yy} + \varepsilon_{y,xx} = 2 + 0 = \gamma_{xy,xy}$).
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se escriben $du$ y $dv$ con las deformaciones y el giro
              (ec. 3.61).
          - texto: >-
              Desplazamientos funciones del punto: $du$ y $dv$ exactas, y de
              sus derivadas cruzadas salen $\omega_{xy,x}$ y $\omega_{xy,y}$
              (ec. 3.62).
          - texto: >-
              Giro función del punto: $\omega_{xy,xy} = \omega_{xy,yx}$, y
              queda $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$
              (ec. 3.63).
          - texto: >-
              Para igualar $\gamma_{xy,xy}$ y $\gamma_{xy,yx}$, las segundas
              derivadas de las deformaciones tienen que ser continuas
              (Schwarz).
          - texto: >-
              Basta con que $du$ y $dv$ sean diferenciales exactas: el giro
              sale después y no hace falta imponerle nada.
            trampa: true
            mensaje: |
              Con solo eso se llega a la ec. 3.62, las derivadas del giro, pero
              no a la 3.63: la ecuación de compatibilidad sale de exigir que
              también el giro sea función del punto,
              $\omega_{xy,xy} = \omega_{xy,yx}$.
    resolucion: |
      **De dónde se parte** (apuntes del tema 3, apartado 3.8, p. 19). Las
      diferenciales de los desplazamientos, con las deformaciones y la
      rotación:

      $$
      du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy \qquad
      dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy \qquad (3.61)
      $$

      **Primera condición: los desplazamientos son funciones del punto.**
      $du$ y $dv$ tienen que ser diferenciales exactas, así que sus
      derivadas cruzadas son iguales:
      $\varepsilon_{x,y} = \tfrac12\gamma_{xy,x} + \omega_{xy,x}$ y
      $\tfrac12\gamma_{xy,y} - \omega_{xy,y} = \varepsilon_{y,x}$. De ahí
      las derivadas del giro (p. 20):

      $$
      \omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x} \qquad
      \omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x} \qquad (3.62)
      $$

      **Segunda: el giro también es función del punto.** Su diferencial
      tiene que ser exacta, $\omega_{xy,xy} = \omega_{xy,yx}$. Derivando la
      primera de la 3.62 respecto de $y$ y la segunda respecto de $x$:

      $$
      \varepsilon_{x,yy} - \tfrac12\gamma_{xy,xy} = \tfrac12\gamma_{xy,yx} - \varepsilon_{y,xx}
      \quad\Rightarrow\quad
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy} \qquad (3.63)
      $$

      **Tercera: continuidad.** Para juntar los dos medios $\gamma$ se ha
      supuesto $\gamma_{xy,xy} = \gamma_{xy,yx}$ (los apuntes escriben
      $\varepsilon_{xy,xy} = \varepsilon_{xy,yx}$, p. 20). Por el teorema de
      Schwarz, eso exige que las segundas derivadas de las deformaciones
      sean continuas o, lo que es lo mismo, las terceras de los
      desplazamientos.

      **En el espacio** se hace lo mismo y salen seis ecuaciones (ec. 3.64):
      tres como la 3.63, una por plano, y tres que mezclan las tres
      tangenciales, como
      $\varepsilon_{x,yz} = \tfrac12\left(-\gamma_{yz,x} + \gamma_{zx,y} + \gamma_{xy,z}\right)_{,x}$.

      **Un ejemplo nuestro.** $\varepsilon_x = 10^{-4}y^{2}$,
      $\varepsilon_y = 0$, $\gamma_{xy} = 2\cdot10^{-4}x\,y$. Es compatible:
      $\varepsilon_{x,yy} + \varepsilon_{y,xx} = 2\cdot10^{-4} + 0 = \gamma_{xy,xy}$.
      La 3.62 da, en $10^{-4}$, $\omega_{xy,x} = y$ y $\omega_{xy,y} = x$,
      con derivadas cruzadas iguales, y por los dos caminos
      $\omega_{xy}(2, 1) = 2\cdot10^{-4}$: $\omega_{xy} = 10^{-4}x\,y$. El
      campo sale de $u = 10^{-4}x\,y^{2}$ y $v = 0$, y con ellos
      $\omega_{xy} = \tfrac12(u_{,y} - v_{,x}) = 10^{-4}x\,y$, el mismo. Las
      integrales salen igual con la cuadratura de Gauss del motor del curso.

  # ── Ejercicio de clase 3.2 · del campo de desplazamientos a las principales.
  - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
    titulo: Del campo de desplazamientos a las deformaciones principales
    fuente: >-
      Ejercicio 3.2 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (γ es la distorsión, lo que se
      cierra el ángulo recto, y el tensor lleva ½γ, ec. 3.35). Cada cifra sale
      del motor del curso y está comprobada por un segundo camino: los tres
      invariantes calculados con las componentes y con las principales, y el
      cambio a ejes principales hecho término a término. El método es el
      de las tensiones principales del tema 2: los apuntes del tema 3 (apartado
      3.6, p. 17) dicen que todo lo de tensiones vale para deformaciones cambiando
      σ por ε y τ por ½γ. El enunciado está transcrito de la página del
      ejercicio; las tres componentes del
      desplazamiento van, como allí, separadas por punto y coma sin espacio.
    nivel: practica
    antes:
      idea: |
        El tensor de deformaciones es la parte simétrica del gradiente de
        desplazamientos: se deriva el campo y se evalúa en el punto. Después,
        las principales salen como en el tema 2, con $\varepsilon$ en lugar de
        $\sigma$.
      formula: |
        $$
        \varepsilon_x = \frac{\partial u}{\partial x}
        \qquad
        \gamma_{xy} = \frac{\partial u}{\partial y} + \frac{\partial v}{\partial x}
        $$

        y las demás igual (ecs. 3.14 y 3.21).
      reconocer: |
        El dato es un campo, no un tensor: primero se deriva, y solo después se
        sustituye el punto. Luego es el problema de principales del tema 2.
    enunciado: |
      Las componentes de desplazamiento del punto P son: $u = 4ax^{2};v = 8az^{2};w = -2ay^{2}$. Las
      coordenadas están en metros y $a = 10^{-4}\ \text{m}^{-1}$. Determinar:

      a/ La matriz de deformación.

      b/ Las deformaciones principales y las direcciones principales en el
      punto P(1/2, 1, 1).

      c/ Determinar la matriz de deformaciones en el sistema de referencia
      dado por las direcciones principales mediante la transformación
      tensorial.
    pide: >-
      La matriz de deformaciones en función de x, y, z; las deformaciones y
      direcciones principales en P(1/2, 1, 1), y la matriz en los ejes
      principales por la transformación tensorial.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué va en la posición $yz$ del tensor de deformaciones?
        opciones:
          - texto: >-
              $\tfrac12\gamma_{yz} = \tfrac12\left(\dfrac{\partial v}{\partial z} + \dfrac{\partial w}{\partial y}\right)$
            correcta: true
            mensaje: |
              Eso es. El tensor es la parte simétrica del gradiente de
              desplazamientos (ec. 3.35): fuera de la diagonal lleva la mitad
              de la distorsión $\gamma_{yz}$, que es lo que se cierra el ángulo
              recto entre $y$ y $z$.
          - texto: >-
              $\gamma_{yz} = \dfrac{\partial v}{\partial z} + \dfrac{\partial w}{\partial y}$, la distorsión entera
            mensaje: |
              $\gamma_{yz}$ es la distorsión (ec. 3.21), y el tensor lleva su
              mitad. Con la $\gamma$ entera las principales del bloque salen el
              doble de lo que son.
          - texto: >-
              $\tfrac12\left(\dfrac{\partial v}{\partial z} - \dfrac{\partial w}{\partial y}\right)$
            mensaje: |
              Con el signo menos es la parte antisimétrica del gradiente, la
              rotación (ecs. 3.30-3.34): describe un giro sin deformación y no
              entra en el tensor de deformaciones.
      - tipo: calcular
        titulo: La componente yz en P
        pregunta: |
          ¿Cuánto vale $\tfrac12\gamma_{yz}$ en P(1/2, 1, 1), en unidades de
          $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Es $\gamma_{yz} = 16az - 4ay$, la distorsión entera. En el tensor
              va su mitad, $a\,(8z - 2y)$.
          - valor: '10'
            mensaje: |
              Es $\tfrac12\left(\partial v/\partial z - \partial w/\partial y\right) = \tfrac12\,(16a + 4a)$,
              la rotación. En el tensor las dos derivadas se suman, y
              $\partial w/\partial y = -4ay$ ya trae su signo menos:
              $\tfrac12\,(16a - 4a)$.
        pista: |
          Deriva: $\partial v/\partial z = 16az$ y $\partial w/\partial y = -4ay$.
          Súmalas, divide entre dos y pon $y = z = 1$.
        desarrollo: |
          $$
          \tfrac12\gamma_{yz} = \tfrac12\,(16az - 4ay) = a\,(8z - 2y)
          $$

          y en P, con $a = 10^{-4}$: $(8\cdot1 - 2\cdot1)\cdot10^{-4} = 6\cdot10^{-4}$.
      - tipo: reconocer
        pregunta: |
          En P el tensor es
          $\begin{bmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{bmatrix}\cdot10^{-4}$.
          ¿Qué dirección es ya principal, sin resolver nada?
        opciones:
          - texto: La $x$, porque su fila y su columna solo tienen el término de la diagonal
            correcta: true
            mensaje: |
              Eso es. Con $\varepsilon_{xy} = \varepsilon_{xz} = 0$,
              $[\varepsilon]\{1, 0, 0\} = 4\cdot10^{-4}\,\{1, 0, 0\}$: el vector
              deformación de $x$ no tiene componente transversal. Lo que queda
              es un bloque 2×2 en $y$, $z$.
          - texto: La $y$ y la $z$, porque $\varepsilon_y = \varepsilon_z = 0$
            mensaje: |
              Que el término de la diagonal sea cero no dice nada. Lo que hace
              principal una dirección es que su fila no tenga nada fuera de la
              diagonal, y la fila de $y$ lleva el 6 en la columna $z$: el
              vector deformación de $y$ tiene componente según $z$.
          - texto: Ninguna, porque hay un término fuera de la diagonal
            mensaje: |
              El término de fuera está en el bloque de $y$, $z$, y no toca a
              $x$: su fila es $(4, 0, 0)$. La cúbica se parte en
              $(4 - \varepsilon)$ por un polinomio de segundo grado, como en el
              caso con una dirección principal conocida del tema 2
              (ecs. 2.38-2.41).
      - tipo: dibujar
        consigna: |
          Con el tensor en P ya escrito, antes de buscar las principales: **el
          elemento en P visto desde x**, deformado y exagerado.
        comprueba:
          - punto: |
              **En el plano yz, un rombo: los lados no cambian de longitud y el
              ángulo recto se cierra $\gamma_{yz}$.**
            porque: |
              En P, $\varepsilon_y = \varepsilon_z = 0$ y
              $\tfrac12\gamma_{yz} = 6\cdot10^{-4}$, positiva.
          - punto: |
              **Según x, que sale del papel, solo un alargamiento.**
            porque: |
              La fila de x solo tiene $\varepsilon_x$: no se mezcla con el
              plano yz.
          - punto: |
              **Las dos diagonales del rombo cambian de longitud, una al revés
              que la otra.**
            porque: |
              Es lo que hace una distorsión pura. Cuánto, y si ahí están las
              principales, lo dice la cuenta.
        figura: |
          <svg viewBox="0 14 250 200" role="img" width="250" height="200" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El elemento en P, visto desde x</title>
