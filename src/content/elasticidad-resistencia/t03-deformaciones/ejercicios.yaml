      </figure>

      - **E** está en $(1{,}5;\ 1;\ 2)$ m, de las cotas, y ahí $xyz = 3$
        (en m³).
      - **Los demás vértices** tienen alguna coordenada nula: no se mueven,
        como dice la figura (A = A′, B = B′…).

      **2. Incógnitas.** Las constantes A, B y C; el tensor en E; y las
      componentes intrínsecas del vector deformación de EA y de EF.

      **3. Ecuaciones.** El campo en E, las componentes del tensor (ecs.
      3.14, 3.21 y 3.35) y el vector deformación de una dirección con sus
      componentes intrínsecas (ecs. 3.49, 3.52 y 3.53):

      $$
      (u, v, w)_E = (A, B, C)\,x_Ey_Ez_E
      \qquad
      \varepsilon_x = \frac{\partial u}{\partial x}
      \qquad
      \tfrac12\gamma_{xy} = \tfrac12\left(\frac{\partial u}{\partial y} + \frac{\partial v}{\partial x}\right)
      $$

      $$
      \{D_u\} = [\varepsilon]\{u\}
      \qquad
      \varepsilon_u = \{u\}^{t}\{D_u\}
      \qquad
      \tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}
      $$

      **4. Resultados.** **Las constantes.** El desplazamiento de E es
      $(0{,}004;\ 0{,}002;\ -0{,}004)$ m; dividido entre $xyz = 3$, en
      $10^{-3}\ \text{m}^{-2}$: $A = \tfrac43$, $B = \tfrac23$ y
      $C = -\tfrac43$.

      **a/** En E, en $10^{-3}$:

      $$
      [\varepsilon]_E = \begin{bmatrix} Ayz & \tfrac12(Axz + Byz) & \tfrac12(Axy + Cyz)\\ \tfrac12(Axz + Byz) & Bxz & \tfrac12(Bxy + Cxz)\\ \tfrac12(Axy + Cyz) & \tfrac12(Bxy + Cxz) & Cxy \end{bmatrix}
      = \begin{bmatrix} 8/3 & 8/3 & -1/3\\ 8/3 & 2 & -3/2\\ -1/3 & -3/2 & -2 \end{bmatrix}
      $$

      **b/ Dirección EA.** $\vec n = (0, -1, -2)/\sqrt5$:

      $$
      \vec D = \frac{1}{\sqrt5}\,(-2,\ 1,\ 5{,}5)\cdot10^{-3},\qquad
      \varepsilon_{EA} = -2{,}4\cdot10^{-3},\qquad
      \tfrac12\gamma_{EA} = \sqrt{7{,}05 - 5{,}76}\cdot10^{-3} = 1{,}1358\cdot10^{-3}
      $$

      **b/ Dirección EF.** $\vec n = (-1, 0, 0)$, la de $x$:

      $$
      \varepsilon_{EF} = \varepsilon_x = 2{,}6667\cdot10^{-3},\qquad
      \tfrac12\gamma_{EF} = \sqrt{(8/3)^{2} + (1/3)^{2}}\cdot10^{-3} = 2{,}6874\cdot10^{-3}
      $$

      **5. Comprobación.** La derivada numérica del campo en E, simetrizada,
      da el mismo tensor. La ec. 3.54 desarrollada da las mismas
      $\varepsilon$. Y en EF el campo es lineal ($y$ y $z$ fijos), así que su
      deformación es la de la arista entera: $0{,}004/1{,}5 = 2{,}6667\cdot10^{-3}$.

      **Lo que dice el resultado.** La deformación es de un punto, no de una
      arista. En EF coinciden, porque a lo largo de ella el campo es lineal;
      en EA no: el alargamiento medio del segmento,
      $(2{,}233391 - 2{,}236068)/2{,}236068 = -1{,}197\cdot10^{-3}$, es la
      mitad de la deformación en E, $-2{,}4\cdot10^{-3}$.

  # ── Ejercicio de clase 3.6 · tres galgas sobre los lados de un triángulo,
  #    en función del ángulo θ. Se comprueba con un ejemplo nuestro.
  - id: ejerm3-cl3-6-tres-galgas-sobre-un-triangulo
    titulo: Tres galgas sobre un triángulo, en función del ángulo θ
    fuente: >-
      Ejercicio 3.6 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (apuntes, p. 17). El resultado es
      una fórmula; los pasos de cálculo la comprueban con un
      ejemplo nuestro, con las cifras del motor del curso, que resuelve las
      tres ecuaciones de las galgas, comprobadas por un segundo camino: las
      fórmulas cerradas, las tres lecturas devueltas por la ec. 3.55 y un caso
      particular que se dice en la resolución. El enunciado está transcrito de
      la página del ejercicio, con la doble coma «figura, ,» del original.
    nivel: practica
    antes:
      idea: |
        Cada galga da una ecuación con las tres componentes del estado plano. Si
        una de ellas está sobre un eje, esa componente sale directamente, y las
        otras dos galgas dan las dos que faltan.
      formula: |
        $$
        \varepsilon_\alpha = \varepsilon_x\cos^{2}\alpha + \varepsilon_y\operatorname{sen}^{2}\alpha + \gamma_{xy}\operatorname{sen}\alpha\cos\alpha
        $$

        La lectura de una galga a $\alpha$ de $x$, medido en sentido
        antihorario (ec. 3.55).
      reconocer: |
        El resultado es una fórmula, no un número: θ va en todas las cuentas. Y
        los ángulos de la figura están medidos desde la base, no todos desde x.
    enunciado: |
      Conocidas las deformaciones dadas por las galgas extensométricas de la
      figura, , determinar $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ en
      función de $\varepsilon_a$, $\varepsilon_b$, $\varepsilon_c$ y del
