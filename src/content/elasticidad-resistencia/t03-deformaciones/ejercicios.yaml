    pide: >-
      La matriz de deformaciones en E, y las componentes intrínsecas del
      vector deformación de las direcciones EA y EF en E.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son las coordenadas de E, en metros?
        opciones:
          - texto: (1,5; 1; 2)
            correcta: true
            mensaje: |
              Eso es. La cota de 1 m está entre el eje $x$ y la paralela a $x$
              que pasa por B: mide AB, según $y$. La de 1,5 m va paralela a
              $x$, entre el eje $y$ y la paralela a $y$ que pasa por B: mide
              OA. Y E está sobre B, a 2 m. Con ese E, E′ se ha movido 4, 2 y
              $-4$ mm: desplazamientos pequeños, como tienen que ser.
          - texto: (1; 1,5; 2)
            mensaje: |
              Es cambiar las dos cotas de abajo. Con ese E,
              $x_{E'} - x_E$ sería 0,504 m e $y_{E'} - y_E$, $-0{,}498$ m:
              desplazamientos de medio metro en un bloque de un metro, que no
              son los de un problema de pequeños desplazamientos.
          - texto: (1,504; 1,002; 1,996)
            mensaje: |
              Esas son las coordenadas de E′, el punto ya desplazado. Las de E
              salen de las cotas, y la diferencia entre las dos es el
              desplazamiento.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el paralelepípedo con E, su
          desplazamiento y las dos direcciones de b/**.
        comprueba:
          - punto: |
              **E en (1,5; 1; 2) m, y su desplazamiento hasta E′,
              $(0{,}004;\ 0{,}002;\ -0{,}004)$ m.**
            porque: |
              Es $\vec r_{E'} - \vec r_E$, el único desplazamiento que se
              conoce: da las tres constantes.
          - punto: |
              **Los demás vértices, quietos.**
            porque: |
              Todos tienen alguna coordenada nula, y el campo, que va con
              $xyz$, se anula en ellos: es lo que dice la figura con A = A′,
              B = B′…
          - punto: |
              **Desde E, EA hacia A y EF hacia F, según $-x$.**
            porque: |
              Son las dos direcciones del vector deformación de b/:
              $\tfrac{1}{\sqrt5}(0, -1, -2)$ y $(-1, 0, 0)$.
        figura: |
          <svg viewBox="0 40 240 230" role="img" width="240" height="230" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El paralelepípedo con el desplazamiento de E y las dos direcciones</title>
