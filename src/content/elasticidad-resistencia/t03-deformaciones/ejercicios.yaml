      <figcaption>

      Redibujada del enunciado: la placa, su configuración deformada en trazo
      discontinuo, el ángulo de 45° y las cuatro cotas del original, en los
      mismos sitios. La deformación está exagerada, como en el original.

      </figcaption>
      </figure>

      **Notas nuestras.** La nota impresa dice «ángulo OAC». Por la figura y
      por el ejercicio 3.1, al que remite, es el ángulo de 45° que forman OA y
      OC, con vértice en O, y así se lee.
    notas:
      - "Nota: Condiciones para a/: Deformaciones normales de las direcciones OA y OC; variación nula del ángulo OAC (ejercicio 3.1)."
    pide: >-
      εx, εy y γxy; las deformaciones principales y sus direcciones, y la
      deformación tangencial máxima en el plano de la placa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué longitud mide la cota de 15 cm?
        opciones:
          - texto: >-
              La de OC: la cota es paralela a OC y va de la horizontal de O a la
              horizontal de C
            correcta: true
            mensaje: |
              Eso es. Una cota paralela a OC entre dos rectas que pasan por O y
              por C mide lo mismo que OC. Sobre su prolongación está la de
              $3\cdot10^{-3}$ cm, lo que se alarga OC.
          - texto: >-
              La altura de C sobre OA
            mensaje: |
              La altura se acotaría en vertical. Esta cota está inclinada a
              45°, paralela a OC: mide OC, y la altura de C sería
              $15\operatorname{sen}45° = 10{,}61$ cm.
          - texto: >-
              La de la diagonal OB
            mensaje: |
              OB no está acotada. La cota va paralela a OC, entre las
              horizontales que pasan por O y por C.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la placa con sus dos lados, sus
          longitudes y el ángulo entre ellos**, y qué da cada dato.
        comprueba:
          - punto: |
              **OA, de 10 cm, sobre x: su alargamiento da $\varepsilon_x$
              directamente.**
            porque: |
              La deformación normal de x es el alargamiento unitario de un
              segmento según x.
          - punto: |
              **OC, de 15 cm, a 45°: su alargamiento da otra deformación
              normal, $\varepsilon_{OC}$.**
            porque: |
              Es como una galga a 45°: depende de $\varepsilon_x$,
              $\varepsilon_y$ y $\gamma_{xy}$.
          - punto: |
              **El ángulo de 45° entre OA y OC, el mismo antes y después.**
            porque: |
              Es el tercer dato: el enunciado dibuja OA′ sobre x y OC′ sobre
              la recta de OC.
        figura: |
          <svg viewBox="0 44 290 180" role="img" width="290" height="180" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La placa OABC con sus dos lados y el ángulo entre ellos</title>
            <desc id="dsl-d">Un paralelogramo OABC: el lado OA, de 10 centímetros, sobre el eje x, hacia la derecha; el lado OC, de 15 centímetros, a 45 grados del eje x. Un arco en O marca el ángulo de 45 grados entre los dos. Los ejes x e y salen de O.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M40 180 L140 180 L246 74 L146 74 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M40 180 h232" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
            <path d="M40 180 v-118" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
            <path d="M80 180 A40 40 0 0 0 68.3 151.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="86" y="166" font-size="10" fill="var(--ink)">45°</text>
            <circle cx="40" cy="180" r="2.4" fill="var(--ink)"/>
            <text x="34" y="194" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
            <circle cx="140" cy="180" r="2.4" fill="var(--ink)"/>
            <text x="146" y="194" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
            <circle cx="246" cy="74" r="2.4" fill="var(--ink)"/>
            <text x="252" y="72" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
            <circle cx="146" cy="74" r="2.4" fill="var(--ink)"/>
            <text x="140" y="70" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
            <text x="90" y="210" font-size="9" text-anchor="middle" fill="var(--faint)">OA = 10 cm: εx</text>
            <text x="276" y="184" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
            <text x="44" y="58" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
            <text x="104" y="130" font-size="9" text-anchor="start" fill="var(--faint)">OC = 15 cm: εOC</text>
          </svg>

      - tipo: calcular
        titulo: La deformación de OC
        pregunta: |
          ¿Cuánto vale $\varepsilon_{OC}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '1.4142'
            mensaje: |
              Has tomado los 15 cm como la altura de C:
              $OC = 15/\operatorname{sen}45° = 21{,}2$ cm y
              $3\cdot10^{-3}/21{,}2$. La cota es paralela a OC y mide OC.
          - valor: '30'
            mensaje: |
              Es el alargamiento, $3\cdot10^{-3}$ cm, escrito en $10^{-4}$. La
              deformación es el alargamiento entre la longitud.
        pista: |
          Alargamiento de OC entre su longitud; y lo mismo con OA.
        desarrollo: |
          $$
          \varepsilon_{OA} = \frac{10^{-3}}{10} = 1\cdot10^{-4},\qquad
          \varepsilon_{OC} = \frac{3\cdot10^{-3}}{15} = 2\cdot10^{-4}
          $$

          Y $\varepsilon_x = \varepsilon_{OA}$, porque OA va sobre $x$.
      - tipo: reconocer
        pregunta: |
          El ángulo de 45° entre OA y OC no cambia. ¿Qué dice eso de
          $\gamma_{xy}$?
        opciones:
          - texto: >-
              Que no tiene por qué ser cero: el de 45° no es el ángulo recto
              entre $x$ e $y$, y su condición liga $\gamma_{xy}$ con las
              deformaciones de OA y de OC
            correcta: true
            mensaje: |
              Eso es. $\gamma_{xy}$ es lo que se cierra el ángulo recto entre
              $x$ e $y$ (ec. 3.15). El de 45° es otro ángulo, y que no cambie
              es una ecuación más: la del 3.1 con $\Gamma = 0$, que mezcla
              $\gamma_{xy}$ con $\varepsilon_{OA}$ y $\varepsilon_{OC}$.
          - texto: >-
              Que $\gamma_{xy} = 0$, porque no hay distorsión
            mensaje: |
              Sin distorsión no cambiaría ningún ángulo recto. Pero OA y OC se
              alargan distinto, y eso por sí solo cambiaría el de 45°: para que
              se quede igual hace falta una $\gamma_{xy}$ que lo compense.
          - texto: >-
              Que OA y OC se alargan igual
            mensaje: |
              Un alargamiento igual en todas las direcciones no cambia ningún
              ángulo, pero no es la única manera de conservarlo. Aquí
              $\varepsilon_{OA} = 1\cdot10^{-4}$ y $\varepsilon_{OC} = 2\cdot10^{-4}$
              son distintas, y el ángulo se conserva igual.
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Es tomar «el ángulo no cambia» por «no hay distorsión». Con
              $\gamma_{xy} = 0$, la fórmula del 3.1 daría
              $\Gamma = \varepsilon_x - \varepsilon_{OC} = -1\cdot10^{-4}$: el
              ángulo de 45° se abriría.
          - valor: '-2'
            mensaje: |
              Te has dejado el término $(\varepsilon_1 + \varepsilon_2)\cos\varphi$
              de la fórmula del 3.1: con $\varphi = 45°$ no es cero. Ese
              término cuenta lo que se alargan los dos lados.
          - valor: '-1'
            mensaje: |
              Tiene el signo cambiado. $\Gamma = \varepsilon_x + \gamma_{xy} - \varepsilon_{OC} = 0$
              da $\gamma_{xy} = \varepsilon_{OC} - \varepsilon_x$: revisa el
              orden de la resta al despejar.
        pista: |
          Con $\vec u_1 = (1, 0)$, $\vec u_2 = (\cos45°, \operatorname{sen}45°)$
          y $\varphi = 45°$, la fórmula del 3.1 se simplifica mucho: el seno y
          el coseno valen lo mismo.
        desarrollo: |
          Con $\operatorname{sen}45° = \cos45° = \tfrac{\sqrt2}{2}$:

          $$
          2\{u_1\}^{T}[\varepsilon]\{u_2\} = \sqrt2\,\bigl(\varepsilon_x + \tfrac12\gamma_{xy}\bigr),\qquad
          \Gamma = \frac{\sqrt2\,\bigl(\varepsilon_x + \tfrac12\gamma_{xy}\bigr) - \tfrac{\sqrt2}{2}\,(\varepsilon_x + \varepsilon_{OC})}{\tfrac{\sqrt2}{2}}
          = \varepsilon_x + \gamma_{xy} - \varepsilon_{OC}
          $$

          y con $\Gamma = 0$:
          $\gamma_{xy} = \varepsilon_{OC} - \varepsilon_x = (2 - 1)\cdot10^{-4} = 1\cdot10^{-4}$.
      - tipo: calcular
        titulo: La deformación εy
        pregunta: |
          ¿Cuánto vale $\varepsilon_y$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴, con su signo
        distractores:
          - valor: '3'
            mensaje: |
              Es lo que sale con $\gamma_{xy} = 0$. La deformación de OC,
              $\varepsilon_{OC} = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$,
              lleva la distorsión, y $\gamma_{xy} = 1\cdot10^{-4}$.
          - valor: '2.5'
            mensaje: |
              Has escrito la deformación de OC con $\tfrac12\gamma_{xy}$ en el
              término cruzado. La ec. 3.55 lleva la $\gamma$ entera:
              $\gamma_{xy}\operatorname{sen}45°\cos45° = \tfrac12\gamma_{xy}$.
          - valor: '5'
            mensaje: |
              Arrastra la $\gamma_{xy} = -2\cdot10^{-4}$ de olvidar el término
              de los cosenos en la condición del ángulo. Con la buena,
              $1\cdot10^{-4}$, sale otra cosa.
        pista: |
          La ec. 3.55 a 45°: $\varepsilon_{OC} = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$.
        desarrollo: |
          $$
          \varepsilon_y = 2\varepsilon_{OC} - \varepsilon_x - \gamma_{xy} = (4 - 1 - 1)\cdot10^{-4} = 2\cdot10^{-4}
          $$
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, la deformación principal mayor en el
          plano de la placa, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '2.2071'
          tolerancia: 0.002
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '2.618'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio:
              $\sqrt{0{,}5^{2} + 1^{2}}$. En el círculo de deformaciones el eje
              vertical es $\tfrac12\gamma$ (p. 17): el radio es
              $\sqrt{0{,}5^{2} + 0{,}5^{2}}$.
          - valor: '3'
            mensaje: |
              Arrastra $\gamma_{xy} = 0$: con $\varepsilon_y = 3$ y sin
              distorsión, $x$ e $y$ ya serían principales. Con
              $\gamma_{xy} = 1\cdot10^{-4}$ no lo son.
          - valor: '0.7071'
            mensaje: |
              Es el radio del círculo. La principal mayor es el centro más el
              radio.
        pista: |
          Centro $\tfrac12(\varepsilon_x + \varepsilon_y)$ y radio
          $\sqrt{\bigl(\tfrac12(\varepsilon_x - \varepsilon_y)\bigr)^{2} + \bigl(\tfrac12\gamma_{xy}\bigr)^{2}}$.
        desarrollo: |
          En $10^{-4}$:

          $$
          C = \tfrac12\,(1 + 2) = 1{,}5,\qquad
          R = \sqrt{0{,}5^{2} + 0{,}5^{2}} = 0{,}7071
          $$

          $$
          \varepsilon_1 = C + R = 2{,}2071\cdot10^{-4},\qquad
          \varepsilon_2 = C - R = 0{,}7929\cdot10^{-4}
          $$

          La suma, $(2{,}2071 + 0{,}7929)\cdot10^{-4} = 3\cdot10^{-4}$, es
          $\varepsilon_x + \varepsilon_y$, como tiene que ser.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección de $\varepsilon_1$ con el eje $x$, en
          grados, medido en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '67.5'
          tolerancia: 0.2
          formato: un número, en grados
        tambienValen:
          - valor: '-112.5'
            mensaje: |
              Es la misma recta, recorrida en el otro sentido: una dirección
              principal es una recta, y 67,5° y −112,5° la señalan igual.
        distractores:
          - valor: '135'
            mensaje: |
              Ese es $2\theta_1$, el ángulo en el círculo de Mohr. En la placa
              es la mitad.
          - valor: '-22.5'
            mensaje: |
              Es $\tfrac12\arctan\bigl(1/(-1)\bigr)$ sin mirar el cuadrante, y
              es la dirección de $\varepsilon_2$. Con
              $\gamma_{xy} > 0$ y $\varepsilon_x < \varepsilon_y$, $2\theta_1$
              tiene el seno positivo y el coseno negativo: está en el segundo
              cuadrante.
          - valor: '22.5'
            mensaje: |
              Has restado al revés, $\varepsilon_y - \varepsilon_x$, en el
              denominador. Es
              $\tan2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = 1/(-1)$.
          - valor: '157.5'
            mensaje: |
              Es la dirección de $\varepsilon_2$: la misma recta que
              $-22{,}5°$, contada por el otro lado. Con $\gamma_{xy} > 0$ y
              $\varepsilon_x < \varepsilon_y$, $2\theta_1$ tiene el seno
              positivo y el coseno negativo: está en el segundo cuadrante.
        pista: |
          $\tan2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$, y el
          cuadrante de $2\theta_1$ lo dicen el signo de $\gamma_{xy}$ (el del
          seno) y el de $\varepsilon_x - \varepsilon_y$ (el del coseno).
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{1}{1 - 2} = -1,\qquad
          \operatorname{sen}2\theta_1 > 0,\ \cos2\theta_1 < 0
          \;\Longrightarrow\; 2\theta_1 = 135°,\quad \theta_1 = 67{,}5°
          $$

          Comprobación con la ec. 3.55 a 67,5°:
          $1\cdot\cos^{2}67{,}5° + 2\operatorname{sen}^{2}67{,}5° + 1\cdot\operatorname{sen}67{,}5°\cos67{,}5° = 2{,}2071$,
          que es $\varepsilon_1$ (en $10^{-4}$). La dirección 2 está a
          $-22{,}5°$, perpendicular.
      - tipo: calcular
        titulo: La deformación tangencial máxima
        pregunta: |
          ¿Cuánto vale la deformación tangencial máxima en el plano de la
          placa, $\gamma_{\max}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.002
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '0.7071'
            mensaje: |
              Es el radio, $\tfrac12\gamma_{\max}$: en el círculo de
              deformaciones el eje vertical es $\tfrac12\gamma$. La deformación
              tangencial máxima es el diámetro.
          - valor: '2.2071'
            mensaje: |
              Es $\varepsilon_1 - 0$, como si una $\varepsilon_z = 0$ fuera la
              tercera principal. Se pide la del plano de la placa, y
              $\varepsilon_z$ no es dato.
        pista: |
          En el plano, $\gamma_{\max} = \varepsilon_1 - \varepsilon_2 = 2R$.
        desarrollo: |
          $$
          \gamma_{\max} = \varepsilon_1 - \varepsilon_2 = (2{,}2071 - 0{,}7929)\cdot10^{-4} = 1{,}4142\cdot10^{-4}
          $$

          en las dos direcciones a 45° de las principales, 22,5° y 112,5°.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La cota de 15 cm mide OC: $\varepsilon_x = 10^{-3}/10 = 1\cdot10^{-4}$
              y $\varepsilon_{OC} = 3\cdot10^{-3}/15 = 2\cdot10^{-4}$.
          - texto: >-
              El ángulo de 45° no cambia: la fórmula del 3.1 con $\Gamma = 0$ da
              $\gamma_{xy} = \varepsilon_{OC} - \varepsilon_x = 1\cdot10^{-4}$.
          - texto: >-
              La deformación de OC,
              $\varepsilon_{OC} = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$,
              da $\varepsilon_y = 2\cdot10^{-4}$.
          - texto: >-
              Centro 1,5 y radio 0,7071: $\varepsilon_1 = 2{,}2071\cdot10^{-4}$
              a 67,5° y $\varepsilon_2 = 0{,}7929\cdot10^{-4}$ a $-22{,}5°$.
          - texto: >-
              En el plano de la placa,
              $\gamma_{\max} = \varepsilon_1 - \varepsilon_2 = 1{,}4142\cdot10^{-4}$.
          - texto: >-
              Como el ángulo de 45° no cambia, $\gamma_{xy} = 0$ y
              $\varepsilon_y = 3\cdot10^{-4}$.
            trampa: true
            mensaje: |
              $\gamma_{xy}$ es lo que se cierra el ángulo recto entre $x$ e
              $y$, no el de 45°. Con $\gamma_{xy} = 0$, OA y OC, que se alargan
              distinto, cambiarían el de 45°: hace falta
              $\gamma_{xy} = 1\cdot10^{-4}$ para que se quede igual.
    resolucion: |
      **1. El estado de deformación.** Es un estado plano uniforme que se lee
      en lo que le pasa a una placa. El dibujo lleva la placa con sus dos
      lados y el ángulo entre ellos.

      <figure class="figura-examen">
      <svg viewBox="0 44 290 180" role="img" width="435" height="270" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La placa OABC con sus dos lados y el ángulo entre ellos</title>
        <desc id="dsl-d">Un paralelogramo OABC: el lado OA, de 10 centímetros, sobre el eje x, hacia la derecha; el lado OC, de 15 centímetros, a 45 grados del eje x. Un arco en O marca el ángulo de 45 grados entre los dos. Los ejes x e y salen de O.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M40 180 L140 180 L246 74 L146 74 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M40 180 h232" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M40 180 v-118" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M80 180 A40 40 0 0 0 68.3 151.7" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="86" y="166" font-size="10" fill="var(--ink)">45°</text>
        <circle cx="40" cy="180" r="2.4" fill="var(--ink)"/>
        <text x="34" y="194" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
        <circle cx="140" cy="180" r="2.4" fill="var(--ink)"/>
        <text x="146" y="194" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
        <circle cx="246" cy="74" r="2.4" fill="var(--ink)"/>
        <text x="252" y="72" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="146" cy="74" r="2.4" fill="var(--ink)"/>
        <text x="140" y="70" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">C</text>
        <text x="90" y="210" font-size="9" text-anchor="middle" fill="var(--faint)">OA = 10 cm: εx</text>
        <text x="276" y="184" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <text x="44" y="58" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
        <text x="104" y="130" font-size="9" text-anchor="start" fill="var(--faint)">OC = 15 cm: εOC</text>
      </svg>
      <figcaption>

      Los tres datos de la placa: OA, sobre x, se alarga 10⁻³ cm; OC, a 45°, se alarga 3·10⁻³ cm; y el ángulo de 45° entre los dos no cambia.

      </figcaption>
      </figure>

      - **OA**, sobre $x$, se alarga $10^{-3}$ cm: da $\varepsilon_x$.
      - **OC**, a 45°, se alarga $3\cdot10^{-3}$ cm. La cota de 15 cm es
        paralela a OC y va de la horizontal de O a la de C: mide OC.
      - **El ángulo de 45°** entre los dos no cambia.

      **2. Incógnitas.** $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$;
      las deformaciones principales y sus direcciones; y la deformación
      tangencial máxima en el plano de la placa.

      **3. Ecuaciones.** La fórmula del ejercicio 3.1 con $\Gamma = 0$, la de
      la galga (ec. 3.55) a 45° y el círculo de Mohr de deformaciones, con
      $\tfrac12\gamma$ en el eje vertical (p. 17):

      $$
      \Gamma = \frac{2\{u_1\}^{T}[\varepsilon]\{u_2\} - (\varepsilon_1 + \varepsilon_2)\cos\varphi}{\operatorname{sen}\varphi} = 0
      \qquad
      \varepsilon_{OC} = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})
      $$

      **4. Resultados.** **Las dos deformaciones normales.**

      $$
      \varepsilon_x = \varepsilon_{OA} = \frac{10^{-3}}{10} = 1\cdot10^{-4},\qquad
      \varepsilon_{OC} = \frac{3\cdot10^{-3}}{15} = 2\cdot10^{-4}
      $$

      **El ángulo.** Con $\vec u_1 = (1, 0)$,
      $\vec u_2 = \tfrac{\sqrt2}{2}(1, 1)$ y $\varphi = 45°$, la fórmula del
      3.1 queda $\Gamma = \varepsilon_x + \gamma_{xy} - \varepsilon_{OC}$, y
      con $\Gamma = 0$:

      $$
      \gamma_{xy} = \varepsilon_{OC} - \varepsilon_x = (2 - 1)\cdot10^{-4} = 1\cdot10^{-4}
      $$

      **a/** La galga a 45° da $\varepsilon_y$:

      $$
      \varepsilon_x = 1\cdot10^{-4},\qquad \varepsilon_y = (4 - 1 - 1)\cdot10^{-4} = 2\cdot10^{-4},\qquad \gamma_{xy} = 1\cdot10^{-4}
      $$

      **b/** En $10^{-4}$: centro $1{,}5$ y radio
      $\sqrt{0{,}5^{2} + 0{,}5^{2}} = 0{,}7071$.

      $$
      \varepsilon_1 = 2{,}2071\cdot10^{-4}\ \text{a}\ 67{,}5°,\qquad
      \varepsilon_2 = 0{,}7929\cdot10^{-4}\ \text{a}\ -22{,}5°
      $$

      con $\tan2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = -1$ y
      $2\theta_1 = 135°$, en el segundo cuadrante porque $\gamma_{xy} > 0$ y
      $\varepsilon_x < \varepsilon_y$.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 190" role="img" width="450" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El círculo de Mohr de deformaciones de la placa</title>
        <desc id="dsl-d">El eje epsilon horizontal y el eje gamma medios vertical. El círculo tiene el centro en 1,5 y radio 0,71, todo a la derecha del origen: corta el eje en 2,21, el punto 1, y en 0,79, el punto 2. El punto x, en (1, 0,5), va abajo; el y, en (2, 0,5), arriba, en el otro extremo del diámetro.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M130 140 L220 50" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M111.4 95 A63.6 63.6 0 1 0 238.6 95 A63.6 63.6 0 1 0 111.4 95" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="13" y1="95" x2="274" y2="95" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="171.5" x2="40" y2="18.5" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="130" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="136" y="153" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">x</text>
        <circle cx="220" cy="50" r="2.4" fill="var(--ink)"/>
        <text x="226" y="45" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">y</text>
        <circle cx="238.6" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="244.6" y="90" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">1</text>
        <circle cx="111.4" cy="95" r="2.4" fill="var(--ink)"/>
        <text x="96" y="90" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">2</text>
        <text x="277" y="99" font-size="9" text-anchor="start" fill="var(--faint)">ε</text>
        <text x="45" y="22.5" font-size="9" text-anchor="start" fill="var(--faint)">γ/2</text>
        <text x="36" y="107" font-size="9" text-anchor="end" fill="var(--faint)">O</text>
      </svg>
      <figcaption>

      El círculo de deformaciones, a escala, en 10⁻⁴: ε en el eje horizontal y γ/2 en el vertical. x va abajo porque γxy es positiva; de x a 1 se suben 135°, el doble de los 67,5° de la dirección 1. Las dos principales son de alargamiento.

      </figcaption>
      </figure>

      **c/** En el plano de la placa,
      $\gamma_{\max} = \varepsilon_1 - \varepsilon_2 = 1{,}4142\cdot10^{-4}$,
      a 22,5° y a 112,5° de $x$. La del espacio necesitaría $\varepsilon_z$,
      que el enunciado no da.

      **5. Comprobación.** La galga a 67,5° leería $2{,}2071\cdot10^{-4}$, y
      su $\tfrac12\gamma$ es nula. Y con la figura: con la deformación pura,
      sin giro, cada punto se desplaza $[\varepsilon]\{r\}$. A, en (10, 0) cm,
      se desplaza $(1;\ 0{,}5)\cdot10^{-3}$ cm, y C, en
      $(10{,}607;\ 10{,}607)$ cm, $(1{,}591;\ 2{,}652)\cdot10^{-3}$ cm. Lo
      que avanza A según OA es $10^{-3}$ cm, y lo que avanza C según OC,
      $(1{,}591 + 2{,}652)\cdot0{,}7071\cdot10^{-3} = 3\cdot10^{-3}$ (en cm):
      las dos cotas. Lo que se mueven de lado hace girar OA y OC lo mismo,
      $5\cdot10^{-5}$ rad en sentido antihorario: la figura, que dibuja OA′
      sobre $x$ y OC′ sobre la recta de OC, es esta misma deformación con
      ese giro de sólido rígido quitado, y un giro no cambia ni longitudes
      ni ángulos.

      **Lo que dice el resultado.** El ángulo de 45° no cambia y, aun así,
      $\gamma_{xy}$ no es nula: el que se cierra es el ángulo recto entre
      $x$ e $y$, $10^{-4}$ rad. Las dos principales son de alargamiento: la
      placa se alarga en todas las direcciones de su plano, más a 67,5° y
      menos a $-22{,}5°$.

  # ── Ejercicio de clase 3.5 · el paralelepípedo deformado: el tensor en E y
  #    las componentes intrínsecas en dos direcciones.
  - id: ejerm3-cl3-5-el-paralelepipedo-y-el-punto-e
    titulo: El paralelepípedo deformado, el tensor en E y dos direcciones
    fuente: >-
      Ejercicio 3.5 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (apuntes, pp. 9, 12 y 17). Cada
      cifra sale del motor del curso y está comprobada por un segundo camino:
      el tensor, con la derivada numérica del campo de desplazamientos; las
      componentes intrínsecas, con la ec. 3.54 desarrollada y el vector
      deformación escrito a mano, y la de EF, además, por un tercer camino que
      se dice en su desarrollo. El enunciado está transcrito de la página del
      ejercicio.
    nivel: practica
    antes:
      idea: |
        El campo tiene tres constantes y se conoce el desplazamiento de un
        punto: eso da las constantes. Luego el tensor en ese punto sale de
        derivar el campo, y las componentes intrínsecas, de proyectar el vector
        deformación.
      formula: |
        $$
        \{D_u\} = [\varepsilon]\{u\}
        \qquad
        \varepsilon_u = \{u\}^{t}\{D_u\}
        \qquad
        \tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}}
        $$

        El vector deformación de una dirección y sus dos componentes
        intrínsecas (ecs. 3.49, 3.52 y 3.53).
      reconocer: |
        Las coordenadas no están en el enunciado: hay que sacarlas de las cotas
        de la figura y de dónde está cada vértice.
    enunciado: |
      El paralelepípedo de la figura se deforma según las líneas punteadas.
      Las coordenadas en *m* del punto *E’* de la configuración deformada son:
      $x_{E'} = 1{,}504$ $\quad y_{E'} = 1{,}002$ $\quad z_{E'} = 1{,}996$

      Los desplazamientos vienen dados por las siguientes relaciones:

      $$
      u = Axyz\qquad v = Bxyz\qquad w = Cxyz
      $$

      Determinar:

      a/ La matriz de deformaciones en el punto E.

      b/ Las componentes intrínsecas del vector deformación en el punto E
      correspondientes a las direcciones EA y EF.

