      - tipo: calcular
        titulo: La constante C
        pregunta: |
          ¿Cuánto vale la constante $C$, en unidades de
          $10^{-3}\ \text{m}^{-2}$?
        respuesta:
          tipo: numero
          valor: '-1.3333'
          tolerancia: 0.002
          formato: un número, en 10⁻³ m⁻², con su signo
        distractores:
          - valor: '1.3333'
            mensaje: |
              Has restado al revés. El desplazamiento es la posición final
              menos la inicial, $w(E) = z_{E'} - z_E = 1{,}996 - 2$: E baja.
          - valor: '665.33'
            mensaje: |
              Has tomado la coordenada de E′ por desplazamiento: $1{,}996/3$.
              El desplazamiento es lo que se mueve el punto,
              $z_{E'} - z_E$.
        pista: |
          En E, $xyz = 1{,}5\cdot1\cdot2 = 3$ (en m³), y $w(E) = z_{E'} - z_E$.
        desarrollo: |
          $$
          C = \frac{z_{E'} - z_E}{x_E\,y_E\,z_E} = \frac{1{,}996 - 2}{3} = -1{,}3333\cdot10^{-3}
          $$

          en m⁻². Igual, $A = (1{,}504 - 1{,}5)/3 = 1{,}3333\cdot10^{-3}$ y
          $B = (1{,}002 - 1)/3 = 0{,}6667\cdot10^{-3}$: en fracciones,
          $A = \tfrac43$, $B = \tfrac23$ y $C = -\tfrac43$, en
          $10^{-3}\ \text{m}^{-2}$.
      - tipo: calcular
        titulo: La matriz de deformaciones en E
        pregunta: |
          ¿Cuál es la matriz de deformaciones en E, en unidades de $10^{-3}$?
        respuesta:
          tipo: matriz
          valor: '[2.6667, 2.6667, -0.3333; 2.6667, 2, -1.5; -0.3333, -1.5, -2]'
          tolerancia: 0.002
          formato: tres filas de tres números, con punto y coma entre filas, en el orden x, y, z, en 10⁻³
        distractores:
          - valor: '[2.6667, 5.3333, -0.6667; 5.3333, 2, -3; -0.6667, -3, -2]'
            mensaje: |
              Has puesto las distorsiones enteras fuera de la diagonal. El
              tensor lleva su mitad (ec. 3.35):
              $\tfrac12\gamma_{xy} = \tfrac12(Axz + Byz)$.
          - valor: '[2.6667, 4, 2; 1.3333, 2, 1; -2.6667, -4, -2]'
            mensaje: |
              Es la matriz gradiente $[g]$ (ec. 3.28), sin simetrizar: en cada
              fila, las tres derivadas de un desplazamiento. El tensor de
              deformaciones es su parte simétrica,
              $\tfrac12(g_{ij} + g_{ji})$ (ec. 3.31).
        pista: |
          En la diagonal, $\varepsilon_x = \partial u/\partial x = Ayz$ y las
          otras dos igual. Fuera,
          $\tfrac12\gamma_{xy} = \tfrac12(\partial u/\partial y + \partial v/\partial x) = \tfrac12(Axz + Byz)$
          y las otras dos igual. Todo en E.
        desarrollo: |
          En E, con $A = \tfrac43$, $B = \tfrac23$ y $C = -\tfrac43$ (en
          $10^{-3}$):

          $$
          \varepsilon_x = Ayz = \tfrac43\cdot2 = \tfrac83,\qquad
          \varepsilon_y = Bxz = \tfrac23\cdot3 = 2,\qquad
          \varepsilon_z = Cxy = -\tfrac43\cdot1{,}5 = -2
          $$

          $$
          \tfrac12\gamma_{xy} = \tfrac12\bigl(\tfrac43\cdot3 + \tfrac23\cdot2\bigr) = \tfrac83,\qquad
          \tfrac12\gamma_{yz} = \tfrac12\bigl(\tfrac23\cdot1{,}5 - \tfrac43\cdot3\bigr) = -\tfrac32,\qquad
          \tfrac12\gamma_{zx} = \tfrac12\bigl(-\tfrac43\cdot2 + \tfrac43\cdot1{,}5\bigr) = -\tfrac13
          $$

          $$
          [\varepsilon]_E = \begin{bmatrix} 8/3 & 8/3 & -1/3\\ 8/3 & 2 & -3/2\\ -1/3 & -3/2 & -2 \end{bmatrix}\cdot10^{-3}
          $$

          Comprobación: derivando el campo numéricamente en E y simetrizando
          sale la misma matriz, y su traza es la variación de volumen unitaria,
          $e = \tfrac83\cdot10^{-3}$.
      - tipo: calcular
        titulo: La deformación de EA
        pregunta: |
          ¿Cuánto vale la componente intrínseca normal del vector deformación
          de la dirección EA en E, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '-2.4'
          tolerancia: 0.005
          formato: un número, en 10⁻³, con su signo
        distractores:
          - valor: '-1.1971'
            mensaje: |
              Es el alargamiento medio del segmento EA entero: $|E'A| = 2{,}23339$ m
              frente a $\sqrt5 = 2{,}23607$ m. El campo no es uniforme
              —$u = Axyz$ cambia de un punto a otro— y lo que se pide es la
              deformación en el punto E.
          - valor: '-12'
            mensaje: |
              Has usado $(0, -1, -2)$ sin dividir por su módulo. La ec. 3.52
              pide el vector unitario, $(0, -1, -2)/\sqrt5$: el resultado se
              divide entre 5.
          - valor: '-3.6'
            mensaje: |
              Es lo que sale con las distorsiones enteras fuera de la diagonal
              del tensor. En el tensor va la mitad.
        pista: |
          $\vec n_{EA} = (0, -1, -2)/\sqrt5$. Calcula
          $\vec D = [\varepsilon]\vec n$ y luego $\varepsilon_n = \vec D\cdot\vec n$.
        desarrollo: |
          A está en $(1{,}5;\ 0;\ 0)$: de E a A, $(0, -1, -2)$ m, de módulo
          $\sqrt5$.

          $$
          \vec D_{EA} = [\varepsilon]_E\,\vec n = \frac{1}{\sqrt5}
          \begin{Bmatrix} -8/3 + 2/3\\ -2 + 3\\ 3/2 + 4 \end{Bmatrix}\cdot10^{-3}
          = \frac{1}{\sqrt5}\begin{Bmatrix} -2\\ 1\\ 5{,}5 \end{Bmatrix}\cdot10^{-3}
          $$

          $$
          \varepsilon_{EA} = \vec D\cdot\vec n = \frac{0 - 1 - 11}{5}\cdot10^{-3} = -2{,}4\cdot10^{-3}
          $$
      - tipo: calcular
        titulo: La componente tangencial en EA
        pregunta: |
          ¿Cuánto vale la componente intrínseca tangencial,
          $\tfrac12\gamma_{EA}$, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '1.1358'
          tolerancia: 0.005
          formato: un número, en 10⁻³
        distractores:
          - valor: '2.2716'
            mensaje: |
              Es $\gamma_{EA}$, la distorsión entera. La componente intrínseca
              tangencial del vector deformación es $\tfrac12\gamma$ (ec. 3.53).
          - valor: '2.6552'
            mensaje: |
              Es el módulo de $\vec D$, $\sqrt{7{,}05}$. La componente
              tangencial es lo que queda al quitarle la normal:
              $\sqrt{D^{2} - \varepsilon_n^{2}}$.
          - valor: '1.8'
            mensaje: |
              Arrastra el tensor con las distorsiones enteras fuera de la
              diagonal. En el tensor va la mitad de cada una (ec. 3.35).
        pista: |
          $\tfrac12\gamma = \sqrt{D^{2} - \varepsilon_n^{2}}$ (ec. 3.53).
        desarrollo: |
          En $10^{-3}$:

          $$
          D^{2} = \frac{4 + 1 + 30{,}25}{5} = 7{,}05,\qquad
          \tfrac12\gamma_{EA} = \sqrt{7{,}05 - 2{,}4^{2}} = \sqrt{1{,}29} = 1{,}1358
          $$
      - tipo: calcular
        titulo: La deformación de EF
        pregunta: |
          ¿Cuánto vale la componente intrínseca normal del vector deformación
          de la dirección EF en E, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '2.6667'
          tolerancia: 0.005
          formato: un número, en 10⁻³, con su signo
        distractores:
          - valor: '6'
            mensaje: |
              Has usado $(-1{,}5;\ 0;\ 0)$ sin dividir por su módulo: sale
              $1{,}5^{2}$ veces mayor. El vector unitario de EF es $(-1, 0, 0)$.
          - valor: '2'
            mensaje: |
              Es $\varepsilon_y$. EF va de E, en $(1{,}5;\ 1;\ 2)$, a F, en
              $(0;\ 1;\ 2)$: solo cambia $x$, así que EF es la dirección de
              $x$, hacia atrás.
        pista: |
          F está en $(0;\ 1;\ 2)$: ¿qué dirección es EF?
        desarrollo: |
          $\vec n_{EF} = (-1, 0, 0)$, y $\varepsilon_{EF} = \varepsilon_x = \tfrac83\cdot10^{-3} = 2{,}6667\cdot10^{-3}$.

          Por otro camino: a lo largo de EF, $y = 1$ y $z = 2$ no cambian, y
          $u = 2Ax$ es lineal en $x$; la arista se deforma igual en todos sus
          puntos, y su deformación es su alargamiento entre su longitud. F no
          se mueve y E avanza 0,004 m según $x$:
          $\varepsilon_{EF} = 0{,}004/1{,}5 = 2{,}6667\cdot10^{-3}$.
      - tipo: calcular
        titulo: La componente tangencial en EF
        pregunta: |
          ¿Cuánto vale $\tfrac12\gamma_{EF}$, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '2.6874'
          tolerancia: 0.005
          formato: un número, en 10⁻³
        distractores:
          - valor: '5.3748'
            mensaje: |
              Este número sale de dos errores: dar $\gamma_{EF}$, la
              distorsión entera, o arrastrar el tensor con las distorsiones
              enteras fuera de la diagonal (según $x$ las dos cuentas
              coinciden). La componente intrínseca tangencial es
              $\tfrac12\gamma$ (ec. 3.53), y en el tensor va la mitad de cada
              distorsión (ec. 3.35).
          - valor: '3.7859'
            mensaje: |
              Es el módulo de $\vec D_{EF}$, $\sqrt{129}/3$. La tangencial es
              $\sqrt{D^{2} - \varepsilon_n^{2}}$.
        pista: |
          $\vec D_{EF} = [\varepsilon]\{-1, 0, 0\}$: la parte que no va según
          $x$ son las dos componentes de fuera de la diagonal de la fila de
          $x$.
        desarrollo: |
          $\vec D_{EF} = -(8/3,\ 8/3,\ -1/3)\cdot10^{-3}$; quitada la componente
          según $x$, quedan $8/3$ y $1/3$:

          $$
          \tfrac12\gamma_{EF} = \sqrt{(8/3)^{2} + (1/3)^{2}}\cdot10^{-3} = \frac{\sqrt{65}}{3}\cdot10^{-3} = 2{,}6874\cdot10^{-3}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              De las cotas, E está en $(1{,}5;\ 1;\ 2)$ m, y en E $xyz = 3$ (en m³).
          - texto: >-
              Con el desplazamiento de E, $A = \tfrac43$, $B = \tfrac23$ y
              $C = -\tfrac43$, en $10^{-3}\ \text{m}^{-2}$.
          - texto: >-
              El tensor en E es la parte simétrica del gradiente:
              $\varepsilon_x = Ayz$, $\tfrac12\gamma_{xy} = \tfrac12(Axz + Byz)$
              y las demás igual.
          - texto: >-
              Para EA, $\vec n = (0, -1, -2)/\sqrt5$: $\varepsilon = -2{,}4\cdot10^{-3}$
              y $\tfrac12\gamma = 1{,}1358\cdot10^{-3}$.
          - texto: >-
              Para EF, $\vec n = (-1, 0, 0)$: $\varepsilon = \varepsilon_x = 2{,}6667\cdot10^{-3}$
              y $\tfrac12\gamma = 2{,}6874\cdot10^{-3}$.
          - texto: >-
              La deformación de EA es la de la arista entera, el alargamiento
              de EA entre su longitud: $-1{,}197\cdot10^{-3}$.
            trampa: true
            mensaje: |
              Con un campo que no es uniforme, el alargamiento medio de un
              segmento no es la deformación en su extremo. Se pide en el punto
              E: $\{n\}^{T}[\varepsilon]_E\{n\}$.
    resolucion: |
      **1. El estado de deformación.** Es un campo de desplazamientos con tres
      constantes y un vértice cuyo desplazamiento se conoce. El dibujo lleva
      el paralelepípedo, el desplazamiento de E y las dos direcciones.

