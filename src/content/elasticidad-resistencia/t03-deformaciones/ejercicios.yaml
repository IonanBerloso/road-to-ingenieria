      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale la deformación principal mayor, $\varepsilon_1$, en
          unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera en el bloque:
              $\begin{vmatrix} -\varepsilon & 12\\ 12 & -\varepsilon \end{vmatrix} = 0$
              da $\pm12$. En el tensor va $\tfrac12\gamma_{yz} = 6$.
          - valor: '4'
            mensaje: |
              Es $\varepsilon_x$, la de la dirección que ya era principal. Ser
              la primera que se encuentra no la hace la mayor: el bloque de
              $y$, $z$ da $\pm6$, y 6 es mayor que 4.
        pista: |
          El bloque de $y$, $z$ es
          $\begin{bmatrix} 0 & 6\\ 6 & 0 \end{bmatrix}$: sus autovalores salen
          de $\varepsilon^{2} - 36 = 0$.
        desarrollo: |
          $$
          \begin{vmatrix} -\varepsilon & 6\\ 6 & -\varepsilon \end{vmatrix} = \varepsilon^{2} - 36 = 0
          \;\Longrightarrow\; \varepsilon = \pm6
          $$

          Ordenadas con la de $x$: $\varepsilon_1 = 6$, $\varepsilon_2 = 4$ y
          $\varepsilon_3 = -6$, en $10^{-4}$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Cuál es la dirección principal 1, como vector unitario, tomada con
          la componente $y$ positiva?
        respuesta:
          tipo: vector
          valor: '(0, 0.7071, 0.7071)'
          tolerancia: 0.005
          formato: tres componentes entre paréntesis, separadas por comas, con punto decimal
        distractores:
          - valor: '(0, 0.7071, -0.7071)'
            mensaje: |
              Es la dirección 3, la de $\varepsilon_3 = -6\cdot10^{-4}$:
              $[\varepsilon]\{0, 1, -1\} = \{0, -6, 6\}$, que es $-6$ veces el
              propio vector. La 1 es la de $+6$.
          - valor: '(1, 0, 0)'
            mensaje: |
              Es la $x$, que es principal pero es la 2: su deformación,
              $4\cdot10^{-4}$, queda entre $+6$ y $-6$.
        pista: |
          Con $\varepsilon = 6$: $(4 - 6)\,n_x = 0$ y $-6\,n_y + 6\,n_z = 0$.
        desarrollo: |
          $$
          (4 - 6)\,n_x = 0,\qquad -6\,n_y + 6\,n_z = 0
          \;\Longrightarrow\; \vec n_1 = \tfrac{1}{\sqrt2}\,(0,\ 1,\ 1)
          $$

          Las otras dos: $\vec n_2 = (1, 0, 0)$ y
          $\vec n_3 = \tfrac{1}{\sqrt2}\,(0, 1, -1)$. Las tres son
          perpendiculares entre sí, como tienen que serlo las de un tensor
          simétrico.
      - tipo: calcular
        titulo: El segundo invariante, de comprobación
        pregunta: |
          Comprueba con el segundo invariante. ¿Cuánto vale $I_2$ calculado
          con las componentes del tensor en P, en unidades de $10^{-8}$?
        respuesta:
          tipo: numero
          valor: '-36'
          tolerancia: 0.01
          formato: un número, en 10⁻⁸
        distractores:
          - valor: '-144'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera fuera de la diagonal,
              $0 - 12^{2}$. El invariante tiene que salir igual con las
              principales, $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$: si por un
              lado sale $-144$ y por el otro $-36$, sobra un factor dos fuera
              de la diagonal.
          - valor: '36'
            mensaje: |
              Has sumado los cuadrados de fuera de la diagonal. El segundo
              invariante es la suma de los tres menores principales de orden
              dos, y los resta:
              $\varepsilon_x\varepsilon_y - \varepsilon_{xy}^{2}$ y sus dos
              compañeros.
        pista: |
          $I_2 = \varepsilon_x\varepsilon_y + \varepsilon_y\varepsilon_z + \varepsilon_z\varepsilon_x - \varepsilon_{xy}^{2} - \varepsilon_{yz}^{2} - \varepsilon_{zx}^{2}$,
          con las componentes del tensor (las de fuera, con la mitad de
          $\gamma$).
        desarrollo: |
          $$
          I_2 = 4\cdot0 + 0\cdot0 + 0\cdot4 - 6^{2} = -36
          $$

          y con las principales, $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$. Los
          otros dos también casan: $4 + 0 + 0 = 6 + 4 - 6$ y
          $4\cdot(0\cdot0 - 6^{2}) = 6\cdot4\cdot(-6) = -144$.
      - tipo: calcular
        titulo: La matriz en los ejes principales
        pregunta: |
          Con $\vec n_1$, $\vec n_2$ y $\vec n_3$ como filas de $[R]$, ¿qué
          matriz da la transformación tensorial, en unidades de $10^{-4}$?
        respuesta:
          tipo: matriz
          valor: '[6, 0, 0; 0, 4, 0; 0, 0, -6]'
          tolerancia: 0.01
          formato: tres filas de tres números, con punto y coma entre filas, en el orden 1, 2, 3
        distractores:
          - valor: '[0, 4.243, -4.243; 4.243, 2, 2; -4.243, 2, 2]'
            mensaje: |
              Es $[R]^{t}[\varepsilon][R]$, el producto al revés. Con las
              direcciones en las filas de $[R]$, el cambio a los ejes
              principales es $[\varepsilon'] = [R][\varepsilon][R]^{t}$: el
              término $ij$ es $\vec n_i\cdot[\varepsilon]\,\vec n_j$. Al revés
              se gira hacia el otro lado y no sale diagonal.
          - valor: '[12, 0, 0; 0, 4, 0; 0, 0, -12]'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera en el tensor de partida:
              la transformación conserva lo que le metes. En la diagonal van
              las principales, $6$, $4$ y $-6$.
        pista: |
          Calcula $[R][\varepsilon][R]^{t}$; cada término es
          $\vec n_i\cdot[\varepsilon]\,\vec n_j$.
        desarrollo: |
          $$
          [R] = \begin{bmatrix} 0 & \tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2}\\ 1 & 0 & 0\\ 0 & \tfrac{1}{\sqrt2} & -\tfrac{1}{\sqrt2} \end{bmatrix},\qquad
          [\varepsilon'] = [R][\varepsilon][R]^{t} = \begin{bmatrix} 6 & 0 & 0\\ 0 & 4 & 0\\ 0 & 0 & -6 \end{bmatrix}\cdot10^{-4}
          $$

          El término 11 es $\vec n_1\cdot[\varepsilon]\,\vec n_1 = \tfrac12\,(0, 1, 1)\cdot(0, 6, 6) = 6$,
          y el 13, $\vec n_1\cdot[\varepsilon]\,\vec n_3 = \tfrac12\,(0, 1, 1)\cdot(0, -6, 6) = 0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Derivando, $\varepsilon_x = 8ax$, $\varepsilon_y = \varepsilon_z = 0$,
              $\gamma_{xy} = \gamma_{zx} = 0$ y $\tfrac12\gamma_{yz} = a\,(8z - 2y)$;
              en P, el tensor tiene 4 en $xx$ y 6 en $yz$ y $zy$ (en $10^{-4}$).
          - texto: >-
              La fila de $x$ solo tiene $\varepsilon_x$: $x$ es principal, con
              $4\cdot10^{-4}$.
          - texto: >-
              El bloque de $y$, $z$ da $\pm6\cdot10^{-4}$, con las direcciones
              $\tfrac{1}{\sqrt2}(0, 1, 1)$ y $\tfrac{1}{\sqrt2}(0, 1, -1)$.
          - texto: >-
              Ordenadas, $\varepsilon_1 = 6$, $\varepsilon_2 = 4$ y
              $\varepsilon_3 = -6$ (en $10^{-4}$), y los tres invariantes casan:
              4, $-36$ y $-144$.
          - texto: >-
              Con las direcciones en las filas de $[R]$,
              $[R][\varepsilon][R]^{t}$ es la diagonal de las principales.
          - texto: >-
              Como $\gamma_{yz} = 12\cdot10^{-4}$, las principales del bloque de
              $y$, $z$ son $\pm12\cdot10^{-4}$.
            trampa: true
            mensaje: |
              El tensor lleva la mitad de la distorsión fuera de la diagonal
              (ec. 3.35): el bloque es
              $\begin{bmatrix} 0 & 6\\ 6 & 0 \end{bmatrix}$ y sus autovalores
              son $\pm6\cdot10^{-4}$.
    resolucion: |
      **1. El estado de deformación.** Es pasar de un campo de desplazamientos
      al tensor y diagonalizarlo en un punto. El dibujo lleva el elemento en
      P, visto desde x.

