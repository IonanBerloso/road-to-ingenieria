      **2. Incógnitas.** $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$, en
      función de las tres lecturas y de θ.

      **3. Ecuaciones.** La de la galga (ec. 3.55, p. 17) para cada una. Como
      $\cos(180° - \theta) = -\cos\theta$, la de la c solo se diferencia de la
      de la b en el signo del término de $\gamma_{xy}$:

      $$
      \varepsilon_a = \varepsilon_x,\qquad
      \varepsilon_b = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta,\qquad
      \varepsilon_c = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta - \gamma_{xy}\operatorname{sen}\theta\cos\theta
      $$

      **4. Resultados.** Sumando las de b y c se va $\gamma_{xy}$ y sale
      $\varepsilon_y$; restándolas, sale $\gamma_{xy}$:

      $$
      \varepsilon_x = \varepsilon_a,\qquad
      \varepsilon_y = \frac{\varepsilon_b + \varepsilon_c - 2\varepsilon_a\cos^{2}\theta}{2\operatorname{sen}^{2}\theta},\qquad
      \gamma_{xy} = \frac{\varepsilon_b - \varepsilon_c}{\operatorname{sen}2\theta}
      $$

      **El ejemplo nuestro.** Con $\tan\theta = 4/3$ ($\cos^{2}\theta = 0{,}36$,
      $\operatorname{sen}^{2}\theta = 0{,}64$, $\operatorname{sen}2\theta = 0{,}96$)
      y las lecturas 500, 484 y 196 (en $10^{-6}$):

      $$
      \varepsilon_x = 500\cdot10^{-6},\qquad
      \varepsilon_y = \frac{680 - 360}{1{,}28}\cdot10^{-6} = 250\cdot10^{-6},\qquad
      \gamma_{xy} = \frac{288}{0{,}96}\cdot10^{-6} = 300\cdot10^{-6}
      $$

      **5. Comprobación.** En el ejemplo, la ec. 3.55 devuelve las tres
      lecturas, y el motor del curso, que resuelve las tres ecuaciones sin
      las fórmulas, da lo mismo. Y con θ = 60° es la roseta a 120° de los
      apuntes (figura 3.8, p. 21), con la b y la c en el otro orden:
      $\varepsilon_y = \tfrac13[2(\varepsilon_b + \varepsilon_c) - \varepsilon_a]$
      y $\gamma_{xy} = 2(\varepsilon_b - \varepsilon_c)/\sqrt3$, la ec. 3.66
      con el signo de $\gamma_{xy}$ que da ese cambio de nombre.

      **Lo que dice el resultado.** $\gamma_{xy}$ va dividida por
      $\operatorname{sen}2\theta$: con θ = 90°, b y c serían la misma
      dirección, el denominador se anularía y la distorsión no se podría
      sacar. Por eso una roseta necesita tres direcciones distintas, y con θ
      cerca de 90° cualquier error de lectura se multiplica.
