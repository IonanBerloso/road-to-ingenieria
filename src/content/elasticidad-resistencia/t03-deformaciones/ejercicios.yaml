        <text x="86" y="67" text-anchor="start" fill="var(--ink)" font-size="10.5" font-family="var(--mono)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">ε<tspan dy="3.2" font-size="7.8">c</tspan><tspan dy="-3.1"> = 100</tspan></text>
      </svg>
      <figcaption>La roseta del ejemplo: a en x, b a 45° y c en y, con sus lecturas en millonésimas.</figcaption>
      </figure>
    pide: γxy, las deformaciones principales en el plano, la dirección 1 y la tangencial máxima en el plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué mide la galga $b$, la que está a 45°?
        opciones:
          - texto: La deformación normal en su dirección, que depende de εx, εy y γxy
            correcta: true
            mensaje: |
              Eso es. Una galga solo mide alargamientos en su dirección:
              $\varepsilon_b = \varepsilon_x\cos^{2}45° + \varepsilon_y\sin^{2}45° + \gamma_{xy}\sin45°\cos45°$.
              Por eso la tangencial sale de combinar las tres lecturas.
          - texto: La deformación tangencial γxy, porque está en diagonal
            mensaje: |
              Ninguna galga mide ángulos. La de 45° mide un alargamiento, y en
              ese alargamiento entra $\gamma_{xy}$ junto con $\varepsilon_x$ y
              $\varepsilon_y$: hay que despejarla.
          - texto: La media de las deformaciones de las galgas a y c
            mensaje: |
              Eso sería si $\gamma_{xy} = 0$. La lectura de $b$ es la media de
              $a$ y $c$ **más** $\tfrac12\gamma_{xy}$, y esa diferencia es
              justo lo que la roseta quiere medir.

      - tipo: calcular
        titulo: La deformación tangencial
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '960'
          tolerancia: 2
          formato: un número, en millonésimas
        distractores:
          - valor: '1920'
            mensaje: |
              Has escrito la galga con $\tfrac12\gamma_{xy}$ en el término
              cruzado. En la fórmula de la galga va $\gamma_{xy}$ entera:
              los dos $\tfrac12\gamma_{xy}$ del tensor se suman.
          - valor: '480'
            mensaje: |
              Eso es $\tfrac12\gamma_{xy}$, lo que va en el tensor y en el
              círculo. La pregunta es $\gamma_{xy}$ entera: el doble.
        pista: |
          Con $\theta = 45°$, $\cos^{2} = \sin^{2} = \sin\cos = \tfrac12$:
          $\varepsilon_b = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$.
        desarrollo: |
          $$
          \gamma_{xy} = 2\varepsilon_b - \varepsilon_a - \varepsilon_c = (2 \cdot 780 - 500 - 100) \cdot 10^{-6} = 960 \cdot 10^{-6}
          $$

      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '820'
          tolerancia: 2
          formato: un número, en millonésimas
        distractores:
          - valor: '1280.6'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. La ordenada del
              círculo es $\tfrac12\gamma$:
              $R = \sqrt{200^{2} + 480^{2}}$, no $\sqrt{200^{2} + 960^{2}}$.
          - valor: '520'
            mensaje: |
              Ese es el radio. La principal se mide desde el origen:
              $\varepsilon_1 = C + R$, con $C = 300$.
        pista: |
          $C = (\varepsilon_x + \varepsilon_y)/2$ y
          $R = \sqrt{((\varepsilon_x - \varepsilon_y)/2)^{2} + (\gamma_{xy}/2)^{2}}$.
        desarrollo: |
          $$
          C = \frac{500 + 100}{2} = 300 \qquad
          R = \sqrt{200^{2} + 480^{2}} = 520
          $$

          $$
          \varepsilon_1 = C + R = 820 \cdot 10^{-6} \qquad
          \varepsilon_2 = C - R = -220 \cdot 10^{-6}
          $$

      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección principal 1 con $x$, en grados,
          positivo en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '33.69'
          tolerancia: 0.2
          formato: un número, en grados
        distractores:
          - valor: '67.38'
            mensaje: |
              Ese es $2\theta_1$, el ángulo en el círculo. En la chapa es la
              mitad.
          - valor: '-33.69'
            mensaje: |
              El sentido está al revés. Con $\gamma_{xy} > 0$ el ángulo recto
              se cierra, $x$ gira en sentido antihorario y va abajo en el
              círculo; de ahí a la dirección 1 se sube, y en la chapa se gira
              en sentido antihorario.
        pista: |
          $\tan 2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$, y en
          la chapa, la mitad.
        desarrollo: |
          $$
          \tan 2\theta_1 = \frac{960}{500 - 100} = 2{,}4
          \;\Longrightarrow\; 2\theta_1 = 67{,}38° \;\Longrightarrow\; \theta_1 = 33{,}69°
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La roseta a 45° da $\varepsilon_x = 500$, $\varepsilon_y = 100$ y $\gamma_{xy} = 2 \cdot 780 - 500 - 100 = 960$ millonésimas.'
          - texto: 'En el círculo la ordenada es $\gamma/2 = 480$: centro $300$ y radio $\sqrt{200^{2} + 480^{2}} = 520$.'
          - texto: 'Las principales en el plano son $C \pm R$: $820$ y $-220$ millonésimas.'
          - texto: 'La dirección 1 está a $33{,}69°$ de $x$, en sentido antihorario, porque con $\gamma_{xy} > 0$ el punto de $x$ va abajo.'
          - texto: 'La tangencial máxima en el plano es el diámetro, $\gamma_{\max} = 2R = 1040$ millonésimas.'
          - texto: 'La tangencial máxima en el plano es el radio, $520$ millonésimas.'
            trampa: true
            mensaje: |
              El radio es $\tfrac12\gamma_{\max}$, porque el eje vertical del
              círculo de deformaciones es $\tfrac12\gamma$. La deformación
              tangencial máxima es el doble: $1040$.
    resolucion: |
      **Lo que da la roseta.** La galga $a$ está en $x$ y la $c$ en $y$, así
      que $\varepsilon_x = 500$ y $\varepsilon_y = 100$ millonésimas. La de
      45° cumple
      $\varepsilon_b = \tfrac12(\varepsilon_x + \varepsilon_y + \gamma_{xy})$, y

      $$
      \gamma_{xy} = 2\varepsilon_b - \varepsilon_a - \varepsilon_c = (2 \cdot 780 - 500 - 100) \cdot 10^{-6} = 960 \cdot 10^{-6}
      $$

      **El círculo.** Con la ordenada $\gamma/2 = 480$:

      $$
      C = 300 \qquad R = \sqrt{200^{2} + 480^{2}} = 520 \qquad
      \varepsilon_{1} = 820 \qquad \varepsilon_{2} = -220
      $$

      en millonésimas.

      **La dirección.** $\tan 2\theta_1 = 960/400 = 2{,}4$, luego
      $2\theta_1 = 67{,}38°$ y $\theta_1 = 33{,}69°$. Con
      $\gamma_{xy} > 0$ el ángulo recto se cierra, $x$ gira en sentido
      antihorario y va abajo en el círculo; de ahí a 1 se sube, así que la
      dirección 1 está girada $33{,}69°$ en sentido antihorario desde
      $x$. Se comprueba con la fórmula de la galga en esa dirección, que da
      $820$.

      **La tangencial máxima en el plano** es el diámetro del círculo, porque
      el eje vertical es $\tfrac12\gamma$:
      $\gamma_{\max} = 2R = 1040 \cdot 10^{-6}$. La del punto,
      en el espacio, necesita $\varepsilon_z$, y esa sale de la ley de Hooke
      del tema 4.

  # ── Ejercicio de clase 3.2 · del campo de desplazamientos a las principales.
  - id: ejerm3-cl3-2-del-desplazamiento-a-las-principales
    titulo: Del campo de desplazamientos a las deformaciones principales
    fuente: >-
      Ejercicio 3.2 · Tema 3, «Deformaciones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 3 (γ es la distorsión, lo que se
      cierra el ángulo recto, y el tensor lleva ½γ, ec. 3.35). Cada cifra sale
      del motor del curso y está comprobada por un segundo camino: los tres
      invariantes calculados con las componentes y con las principales, y el
      cambio a ejes principales hecho término a término. El método es el
      de las tensiones principales del tema 2: los apuntes del tema 3 (§3.6,
      p. 17) dicen que todo lo de tensiones vale para deformaciones cambiando
      σ por ε y τ por ½γ. El enunciado está transcrito de la página del
      ejercicio; las tres componentes del
      desplazamiento van, como allí, separadas por punto y coma sin espacio.
    nivel: practica
    enunciado: |
      Las componentes de desplazamiento del punto P son: $u = 4ax^{2};v = 8az^{2};w = -2ay^{2}$. Las
      coordenadas están en metros y $a = 10^{-4}\ \text{m}^{-1}$. Determinar:

      a/ La matriz de deformación.

      b/ Las deformaciones principales y las direcciones principales en el
      punto P(1/2, 1, 1).

      c/ Determinar la matriz de deformaciones en el sistema de referencia
      dado por las direcciones principales mediante la transformación
      tensorial.
    pide: >-
      La matriz de deformaciones en función de x, y, z; las deformaciones y
      direcciones principales en P(1/2, 1, 1), y la matriz en los ejes
      principales por la transformación tensorial.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué va en la posición $yz$ del tensor de deformaciones?
        opciones:
          - texto: >-
              $\tfrac12\gamma_{yz} = \tfrac12\left(\dfrac{\partial v}{\partial z} + \dfrac{\partial w}{\partial y}\right)$
            correcta: true
            mensaje: |
              Eso es. El tensor es la parte simétrica del gradiente de
              desplazamientos (ec. 3.35): fuera de la diagonal lleva la mitad
              de la distorsión $\gamma_{yz}$, que es lo que se cierra el ángulo
              recto entre $y$ y $z$.
          - texto: >-
              $\gamma_{yz} = \dfrac{\partial v}{\partial z} + \dfrac{\partial w}{\partial y}$, la distorsión entera
            mensaje: |
              $\gamma_{yz}$ es la distorsión (ec. 3.21), y el tensor lleva su
              mitad. Con la $\gamma$ entera las principales del bloque salen el
              doble de lo que son.
          - texto: >-
              $\tfrac12\left(\dfrac{\partial v}{\partial z} - \dfrac{\partial w}{\partial y}\right)$
            mensaje: |
              Con el signo menos es la parte antisimétrica del gradiente, la
              rotación (ecs. 3.30-3.34): describe un giro sin deformación y no
              entra en el tensor de deformaciones.
      - tipo: calcular
        titulo: La componente yz en P
        pregunta: |
          ¿Cuánto vale $\tfrac12\gamma_{yz}$ en P(1/2, 1, 1), en unidades de
          $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Es $\gamma_{yz} = 16az - 4ay$, la distorsión entera. En el tensor
              va su mitad, $a\,(8z - 2y)$.
          - valor: '10'
            mensaje: |
              Es $\tfrac12\left(\partial v/\partial z - \partial w/\partial y\right) = \tfrac12\,(16a + 4a)$,
              la rotación. En el tensor las dos derivadas se suman, y
              $\partial w/\partial y = -4ay$ ya trae su signo menos:
              $\tfrac12\,(16a - 4a)$.
        pista: |
          Deriva: $\partial v/\partial z = 16az$ y $\partial w/\partial y = -4ay$.
          Súmalas, divide entre dos y pon $y = z = 1$.
        desarrollo: |
          $$
          \tfrac12\gamma_{yz} = \tfrac12\,(16az - 4ay) = a\,(8z - 2y)
          $$

          y en P, con $a = 10^{-4}$: $(8\cdot1 - 2\cdot1)\cdot10^{-4} = 6\cdot10^{-4}$.
      - tipo: reconocer
        pregunta: |
          En P el tensor es
          $\begin{bmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{bmatrix}\cdot10^{-4}$.
          ¿Qué dirección es ya principal, sin resolver nada?
        opciones:
          - texto: La $x$, porque su fila y su columna solo tienen el término de la diagonal
            correcta: true
            mensaje: |
              Eso es. Con $\varepsilon_{xy} = \varepsilon_{xz} = 0$,
              $[\varepsilon]\{1, 0, 0\} = 4\cdot10^{-4}\,\{1, 0, 0\}$: el vector
              deformación de $x$ no tiene componente transversal. Lo que queda
              es un bloque 2×2 en $y$, $z$.
          - texto: La $y$ y la $z$, porque $\varepsilon_y = \varepsilon_z = 0$
            mensaje: |
              Que el término de la diagonal sea cero no dice nada. Lo que hace
              principal una dirección es que su fila no tenga nada fuera de la
              diagonal, y la fila de $y$ lleva el 6 en la columna $z$: el
              vector deformación de $y$ tiene componente según $z$.
          - texto: Ninguna, porque hay un término fuera de la diagonal
            mensaje: |
              El término de fuera está en el bloque de $y$, $z$, y no toca a
              $x$: su fila es $(4, 0, 0)$. La cúbica se parte en
              $(4 - \varepsilon)$ por un polinomio de segundo grado, como en el
              caso con una dirección principal conocida del tema 2
              (ecs. 2.38-2.41).
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale la deformación principal mayor, $\varepsilon_1$, en
          unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera en el bloque:
              $\begin{vmatrix} -\varepsilon & 12\\ 12 & -\varepsilon \end{vmatrix} = 0$
              da $\pm12$. En el tensor va $\tfrac12\gamma_{yz} = 6$.
          - valor: '4'
            mensaje: |
              Es $\varepsilon_x$, la de la dirección que ya era principal. Ser
              la primera que se encuentra no la hace la mayor: el bloque de
              $y$, $z$ da $\pm6$, y 6 es mayor que 4.
        pista: |
          El bloque de $y$, $z$ es
          $\begin{bmatrix} 0 & 6\\ 6 & 0 \end{bmatrix}$: sus autovalores salen
          de $\varepsilon^{2} - 36 = 0$.
        desarrollo: |
          $$
          \begin{vmatrix} -\varepsilon & 6\\ 6 & -\varepsilon \end{vmatrix} = \varepsilon^{2} - 36 = 0
          \;\Longrightarrow\; \varepsilon = \pm6
          $$

          Ordenadas con la de $x$: $\varepsilon_1 = 6$, $\varepsilon_2 = 4$ y
          $\varepsilon_3 = -6$, en $10^{-4}$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Cuál es la dirección principal 1, como vector unitario, tomada con
          la componente $y$ positiva?
        respuesta:
          tipo: vector
          valor: '(0, 0.7071, 0.7071)'
          tolerancia: 0.005
          formato: tres componentes entre paréntesis, separadas por comas, con punto decimal
        distractores:
          - valor: '(0, 0.7071, -0.7071)'
            mensaje: |
              Es la dirección 3, la de $\varepsilon_3 = -6\cdot10^{-4}$:
              $[\varepsilon]\{0, 1, -1\} = \{0, -6, 6\}$, que es $-6$ veces el
              propio vector. La 1 es la de $+6$.
          - valor: '(1, 0, 0)'
            mensaje: |
              Es la $x$, que es principal pero es la 2: su deformación,
              $4\cdot10^{-4}$, queda entre $+6$ y $-6$.
        pista: |
          Con $\varepsilon = 6$: $(4 - 6)\,n_x = 0$ y $-6\,n_y + 6\,n_z = 0$.
        desarrollo: |
          $$
          (4 - 6)\,n_x = 0,\qquad -6\,n_y + 6\,n_z = 0
          \;\Longrightarrow\; \vec n_1 = \tfrac{1}{\sqrt2}\,(0,\ 1,\ 1)
          $$

          Las otras dos: $\vec n_2 = (1, 0, 0)$ y
          $\vec n_3 = \tfrac{1}{\sqrt2}\,(0, 1, -1)$. Las tres son
          perpendiculares entre sí, como tienen que serlo las de un tensor
          simétrico.
      - tipo: calcular
        titulo: El segundo invariante, de comprobación
        pregunta: |
          Comprueba con el segundo invariante. ¿Cuánto vale $I_2$ calculado
          con las componentes del tensor en P, en unidades de $10^{-8}$?
        respuesta:
          tipo: numero
          valor: '-36'
          tolerancia: 0.01
          formato: un número, en 10⁻⁸
        distractores:
          - valor: '-144'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera fuera de la diagonal,
              $0 - 12^{2}$. El invariante tiene que salir igual con las
              principales, $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$: si por un
              lado sale $-144$ y por el otro $-36$, sobra un factor dos fuera
              de la diagonal.
          - valor: '36'
            mensaje: |
              Has sumado los cuadrados de fuera de la diagonal. El segundo
              invariante es la suma de los tres menores principales de orden
              dos, y los resta:
              $\varepsilon_x\varepsilon_y - \varepsilon_{xy}^{2}$ y sus dos
              compañeros.
        pista: |
          $I_2 = \varepsilon_x\varepsilon_y + \varepsilon_y\varepsilon_z + \varepsilon_z\varepsilon_x - \varepsilon_{xy}^{2} - \varepsilon_{yz}^{2} - \varepsilon_{zx}^{2}$,
          con las componentes del tensor (las de fuera, con la mitad de
          $\gamma$).
        desarrollo: |
          $$
          I_2 = 4\cdot0 + 0\cdot0 + 0\cdot4 - 6^{2} = -36
          $$

          y con las principales, $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$. Los
          otros dos también casan: $4 + 0 + 0 = 6 + 4 - 6$ y
          $4\cdot(0\cdot0 - 6^{2}) = 6\cdot4\cdot(-6) = -144$.
      - tipo: calcular
        titulo: La matriz en los ejes principales
        pregunta: |
          Con $\vec n_1$, $\vec n_2$ y $\vec n_3$ como filas de $[R]$, ¿qué
          matriz da la transformación tensorial, en unidades de $10^{-4}$?
        respuesta:
          tipo: matriz
          valor: '[6, 0, 0; 0, 4, 0; 0, 0, -6]'
          tolerancia: 0.01
          formato: tres filas de tres números, con punto y coma entre filas, en el orden 1, 2, 3
        distractores:
          - valor: '[0, 4.243, -4.243; 4.243, 2, 2; -4.243, 2, 2]'
            mensaje: |
              Es $[R]^{t}[\varepsilon][R]$, el producto al revés. Con las
              direcciones en las filas de $[R]$, el cambio a los ejes
              principales es $[\varepsilon'] = [R][\varepsilon][R]^{t}$: el
              término $ij$ es $\vec n_i\cdot[\varepsilon]\,\vec n_j$. Al revés
              se gira hacia el otro lado y no sale diagonal.
          - valor: '[12, 0, 0; 0, 4, 0; 0, 0, -12]'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera en el tensor de partida:
              la transformación conserva lo que le metes. En la diagonal van
              las principales, $6$, $4$ y $-6$.
        pista: |
          Calcula $[R][\varepsilon][R]^{t}$; cada término es
          $\vec n_i\cdot[\varepsilon]\,\vec n_j$.
        desarrollo: |
          $$
          [R] = \begin{bmatrix} 0 & \tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2}\\ 1 & 0 & 0\\ 0 & \tfrac{1}{\sqrt2} & -\tfrac{1}{\sqrt2} \end{bmatrix},\qquad
          [\varepsilon'] = [R][\varepsilon][R]^{t} = \begin{bmatrix} 6 & 0 & 0\\ 0 & 4 & 0\\ 0 & 0 & -6 \end{bmatrix}\cdot10^{-4}
          $$

          El término 11 es $\vec n_1\cdot[\varepsilon]\,\vec n_1 = \tfrac12\,(0, 1, 1)\cdot(0, 6, 6) = 6$,
          y el 13, $\vec n_1\cdot[\varepsilon]\,\vec n_3 = \tfrac12\,(0, 1, 1)\cdot(0, -6, 6) = 0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Derivando, $\varepsilon_x = 8ax$, $\varepsilon_y = \varepsilon_z = 0$,
              $\gamma_{xy} = \gamma_{zx} = 0$ y $\tfrac12\gamma_{yz} = a\,(8z - 2y)$;
              en P, el tensor tiene 4 en $xx$ y 6 en $yz$ y $zy$ (en $10^{-4}$).
          - texto: >-
              La fila de $x$ solo tiene $\varepsilon_x$: $x$ es principal, con
              $4\cdot10^{-4}$.
          - texto: >-
              El bloque de $y$, $z$ da $\pm6\cdot10^{-4}$, con las direcciones
              $\tfrac{1}{\sqrt2}(0, 1, 1)$ y $\tfrac{1}{\sqrt2}(0, 1, -1)$.
          - texto: >-
              Ordenadas, $\varepsilon_1 = 6$, $\varepsilon_2 = 4$ y
              $\varepsilon_3 = -6$ (en $10^{-4}$), y los tres invariantes casan:
              4, $-36$ y $-144$.
          - texto: >-
              Con las direcciones en las filas de $[R]$,
              $[R][\varepsilon][R]^{t}$ es la diagonal de las principales.
          - texto: >-
              Como $\gamma_{yz} = 12\cdot10^{-4}$, las principales del bloque de
              $y$, $z$ son $\pm12\cdot10^{-4}$.
            trampa: true
            mensaje: |
              El tensor lleva la mitad de la distorsión fuera de la diagonal
              (ec. 3.35): el bloque es
              $\begin{bmatrix} 0 & 6\\ 6 & 0 \end{bmatrix}$ y sus autovalores
              son $\pm6\cdot10^{-4}$.
    resolucion: |
      **La idea.** El tensor de deformaciones es la parte simétrica del
      gradiente de desplazamientos: en la diagonal, las derivadas de cada
      desplazamiento en su propia dirección (ec. 3.14); fuera, la mitad de
      las distorsiones (ecs. 3.21 y 3.35). En P se busca la fila que no tiene
      nada fuera de la diagonal —esa dirección ya es principal— y lo que
      queda es un problema 2×2.

      **a/ La matriz de deformación.** Con $u = 4ax^{2}$, $v = 8az^{2}$ y
      $w = -2ay^{2}$:

      $$
      \varepsilon_x = \frac{\partial u}{\partial x} = 8ax,\qquad
      \varepsilon_y = \frac{\partial v}{\partial y} = 0,\qquad
      \varepsilon_z = \frac{\partial w}{\partial z} = 0
      $$

      $$
      \gamma_{xy} = \frac{\partial u}{\partial y} + \frac{\partial v}{\partial x} = 0,\qquad
      \gamma_{yz} = \frac{\partial v}{\partial z} + \frac{\partial w}{\partial y} = 16az - 4ay,\qquad
      \gamma_{zx} = \frac{\partial w}{\partial x} + \frac{\partial u}{\partial z} = 0
      $$

      $$
      [\varepsilon] = \begin{bmatrix} 8ax & 0 & 0\\ 0 & 0 & a\,(8z - 2y)\\ 0 & a\,(8z - 2y) & 0 \end{bmatrix}
      $$

      **b/ En P(1/2, 1, 1).** Con $a = 10^{-4}\ \text{m}^{-1}$,
      $\varepsilon_x = 8\cdot\tfrac{1}{2}\cdot10^{-4} = 4\cdot10^{-4}$ y
      $\tfrac12\gamma_{yz} = (8 - 2)\cdot10^{-4} = 6\cdot10^{-4}$:

      $$
      [\varepsilon]_P = \begin{bmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{bmatrix}\cdot10^{-4}
      $$

      La fila de $x$ solo tiene $\varepsilon_x$: $x$ es dirección principal,
      con $4\cdot10^{-4}$. El bloque de $y$, $z$ da
      $\varepsilon^{2} - 36 = 0$, es decir, $\pm6\cdot10^{-4}$, con las
      direcciones $\tfrac{1}{\sqrt2}(0, 1, 1)$ para $+6$ y
      $\tfrac{1}{\sqrt2}(0, 1, -1)$ para $-6$. Ordenadas:

      $$
      \varepsilon_1 = 6\cdot10^{-4},\ \vec n_1 = \tfrac{1}{\sqrt2}(0, 1, 1);\qquad
      \varepsilon_2 = 4\cdot10^{-4},\ \vec n_2 = (1, 0, 0);\qquad
      \varepsilon_3 = -6\cdot10^{-4},\ \vec n_3 = \tfrac{1}{\sqrt2}(0, 1, -1)
      $$

      Las direcciones 1 y 3 son las bisectrices de $y$ y $z$: en el plano
      $yz$ el punto P está en cortadura pura, que se alarga lo mismo en una
      bisectriz que se acorta en la otra.

      **La comprobación, con los invariantes** (en $10^{-4}$, $10^{-8}$ y
      $10^{-12}$). Con las componentes,

      $$
      I_1 = 4 + 0 + 0 = 4,\qquad
      I_2 = 4\cdot0 + 0\cdot0 + 0\cdot4 - 6^{2} = -36,\qquad
      I_3 = 4\cdot(0\cdot0 - 6^{2}) = -144
      $$

      y con las principales, $6 + 4 - 6 = 4$,
      $6\cdot4 + 4\cdot(-6) + (-6)\cdot6 = -36$ y $6\cdot4\cdot(-6) = -144$.

      **c/ La matriz en los ejes principales.** Con las direcciones en las
      filas de $[R]$,

      $$
      [\varepsilon'] = [R][\varepsilon][R]^{t},\qquad
      [R] = \begin{bmatrix} 0 & \tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2}\\ 1 & 0 & 0\\ 0 & \tfrac{1}{\sqrt2} & -\tfrac{1}{\sqrt2} \end{bmatrix}
      \;\Longrightarrow\;
      [\varepsilon'] = \begin{bmatrix} 6 & 0 & 0\\ 0 & 4 & 0\\ 0 & 0 & -6 \end{bmatrix}\cdot10^{-4}
      $$

      Es lo que tenía que salir. El término $ij$ es
      $\vec n_i\cdot[\varepsilon]\,\vec n_j$, y como
      $[\varepsilon]\,\vec n_j = \varepsilon_j\,\vec n_j$, queda
      $\varepsilon_j\,\vec n_i\cdot\vec n_j$: cero fuera de la diagonal,
      porque las direcciones son perpendiculares, y la principal $j$ en la
      diagonal. El orden de las filas de $[R]$ es el orden de la diagonal.
