      Nuestra, con el círculo a escala. A la izquierda, solo las
      tangenciales del elemento: las de las caras x forman par horario. A la
      derecha, el punto x arriba y el arco 2θ₁, de x a σ₁, en sentido
      horario.

      </figcaption>
