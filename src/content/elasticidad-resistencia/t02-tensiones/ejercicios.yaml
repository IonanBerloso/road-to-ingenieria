      <figcaption>

      Redibujada del enunciado: el elemento tiene las caras
      perpendiculares a las dos rectas de puntos, a 60° y a −30° de x, y
      cada flecha va en el sentido del original.

      </figcaption>
      </figure>

      **Notas nuestras.** Aquí se llama $x'$ a la normal de las caras que
      corta la recta de 60° e $y'$ a la de las que corta la de $-30°$,
      tomada hacia 150°: $y'$ es $x'$ girado 90° en sentido antihorario.
    pide: >-
      σx, σy y τxy, y cómo son: de tracción o de compresión, y en qué
      sentido va la tangencial.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los ejes $x'$, a 60° de $x$, e $y'$, a 150°, ¿qué dicen las
          flechas de la figura?
        opciones:
          - texto: $\sigma_{x'} = -10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = -11$ MPa
            correcta: true
            mensaje: |
              Eso es. En las caras $x'$ la flecha entra: compresión. En las
              $y'$ sale: tracción. Y en la cara $x'$ de arriba, que es
              positiva, la tangencial apunta hacia $-30°$, al revés que $y'$:
              $\tau_{x'y'} < 0$. Las otras tres caras lo confirman, como pide
              la reciprocidad.
          - texto: $\sigma_{x'} = 10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = 11$ MPa, los valores del enunciado
            mensaje: |
              El texto da los valores sin signo; el signo lo ponen las
              flechas. Una flecha que entra en su cara es una compresión, y
              la tangencial de la cara $x'$ va al revés que $y'$.
          - texto: $\sigma_{x'} = -10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = 11$ MPa
            mensaje: |
              Las normales están bien; la tangencial, no. En la cara $x'$ de
              arriba, que es positiva, la flecha apunta hacia $-30°$, al
              revés que $y'$ (150°): $\tau_{x'y'}$ es negativa.
      - tipo: calcular
        titulo: La normal en x
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '29.53'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '10.47'
            mensaje: |
              Has girado al revés, porque $x$ está a $-60°$ de $x'$ y no a
              $+60°$; o has tomado $\tau_{x'y'} = +11$. Los dos errores dan
              este número.
          - valor: '15.47'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto. El de 10 MPa es una compresión, porque la flecha entra, y
              la tangencial de la cara $x'$ es negativa.
          - valor: '9.53'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$ en la ec. 2.61: en el
              círculo, de $x'$ a $x$ se giran 120°, no 60°.
          - valor: '-9.53'
            mensaje: |
              Es $\sigma_y$. $x$ es la dirección a $-60°$ de $x'$; la de
              $+30°$ es la $y$.
        pista: |
          En el círculo, $x'$ va en $(-10, 11)$, arriba, e $y'$ en
          $(30, -11)$. $x$ está a $-60°$ de $x'$: en el círculo, 120° en
          sentido horario.
        desarrollo: |
          En MPa:

          $$
          C = \frac{-10 + 30}{2} = 10,\qquad R = \sqrt{20^{2} + 11^{2}} = \sqrt{521} = 22{,}83
          $$

          Con la ec. 2.61 desde $x'y'$ y $\theta = -60°$:

          $$
          \sigma_x = 10 + (-20)\cos(-120°) + (-11)\operatorname{sen}(-120°) = 10 + 10 + 9{,}53 = 29{,}53
          $$
      - tipo: calcular
        titulo: La normal en y
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-9.53'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '9.53'
            mensaje: |
              Has girado al revés, o has tomado $\tau_{x'y'} = +11$: los dos
              errores dan este número, el de $\sigma_y$ con el signo
              cambiado.
          - valor: '24.53'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto.
          - valor: '29.53'
            mensaje: |
              Es $\sigma_x$. $y$ está a $+30°$ de $x'$.
        pista: |
          $\sigma_x + \sigma_y = \sigma_{x'} + \sigma_{y'}$: la traza no
          cambia con el giro.
        desarrollo: |
          En MPa:

          $$
          \sigma_y = 20 - 29{,}53 = -9{,}53
          $$

          Con la ec. 2.61 a $\theta = 30°$ desde $x'$ sale lo mismo.
      - tipo: calcular
        titulo: La tangencial en x
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-11.82'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '11.82'
            mensaje: |
              El valor es ese y el signo no. En el círculo $x$ queda arriba:
              par horario, $\tau_{xy} < 0$.
          - valor: '22.82'
            mensaje: |
              Has girado al revés, $+60°$ en lugar de $-60°$.
          - valor: '-22.82'
            mensaje: |
              Has tomado $\tau_{x'y'} = +11$. La tangencial de la cara $x'$
              apunta hacia $-30°$, al revés que $y'$.
          - valor: '-14.16'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto.
        pista: |
          $\tau_{xy} = \tfrac12(\sigma_{y'} - \sigma_{x'})\operatorname{sen}2\theta + \tau_{x'y'}\cos2\theta$,
          con $\theta = -60°$.
        desarrollo: |
          En MPa:

          $$
          \tau_{xy} = 20\operatorname{sen}(-120°) + (-11)\cos(-120°) = -17{,}32 + 5{,}5 = -11{,}82
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En $x'$ (60°) e $y'$ (150°): $\sigma_{x'} = -10$,
              $\sigma_{y'} = 30$ y $\tau_{x'y'} = -11$ MPa.
          - texto: >-
              El círculo tiene centro 10 y radio $\sqrt{521} = 22{,}83$ MPa;
              $x'$ está arriba, en $(-10, 11)$.
          - texto: >-
              $x$ está a $-60°$ de $x'$: en el círculo se giran 120° en
              sentido horario desde $x'$.
          - texto: >-
              $\sigma_x = 29{,}53$ MPa, de tracción; $\sigma_y = -9{,}53$ MPa,
              de compresión; y $\tau_{xy} = -11{,}82$ MPa.
          - texto: >-
              Las dos normales de la figura son de tracción, porque el texto
              las da positivas, y $\tau_{x'y'} = +11$ MPa.
            trampa: true
            mensaje: |
              El texto da los valores; los signos los dan las flechas. La de
              10 MPa entra en su cara: es una compresión. Y la tangencial de
              la cara $x'$ va al revés que $y'$: $\tau_{x'y'} = -11$ MPa.
    resolucion: |
      **La idea.** Primero se leen las flechas en los ejes del elemento,
      con su signo; después se dibuja el círculo con esos dos puntos y se
      gira hasta $x$, el doble de ángulo y en el mismo sentido que en el
      elemento.

      **Lo que dice la figura.** Con $x'$ a 60° de $x$ e $y'$ a 150°: en
      las caras $x'$ la flecha de 10 MPa entra, $\sigma_{x'} = -10$ MPa; en
      las $y'$ la de 30 MPa sale, $\sigma_{y'} = 30$ MPa. En la cara $x'$
      de arriba, positiva, la tangencial apunta hacia $-30°$, al revés que
      $y'$: $\tau_{x'y'} = -11$ MPa. En las otras tres caras va como pide la
      reciprocidad: en la $y'$ de arriba, hacia 240°, al revés que $x'$; y
      en las dos negativas, en los sentidos opuestos.

      **El círculo.** En MPa, $x'$ va en $(\sigma_{x'}, -\tau_{x'y'}) = (-10, 11)$,
      arriba porque sus tangenciales forman un par horario, e $y'$ en
      $(30, -11)$. Centro y radio:

      $$
      C = \frac{-10 + 30}{2} = 10,\qquad R = \sqrt{20^{2} + 11^{2}} = \sqrt{521} = 22{,}83
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 400 290" role="img" width="400" height="290" aria-labelledby="ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy-fig-mohr-t ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy-fig-mohr-d">
      <title id="ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy-fig-mohr-t">El círculo de Mohr del ejercicio 2.9, del diámetro x′y′ al diámetro xy</title>
      <desc id="ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy-fig-mohr-d">Eje σn horizontal y |τn| vertical. El círculo tiene el centro en 10 y radio 22,8; corta el eje a uno y otro lado del origen. El punto x′, (−10, 11), va arriba a la izquierda y el y′, (30, −11), abajo a la derecha, en el otro extremo de un diámetro. Desde x′ se giran 120° en sentido horario y se llega al punto x, arriba a la derecha; el y, abajo a la izquierda, cierra el otro diámetro. Las principales, σ1 y σ2, son los cortes con el eje.</desc>
      <line x1="58" y1="150" x2="383" y2="150" stroke="var(--faint)" stroke-width="1.1"/><polygon points="390,150 382,153.5 382,146.5" fill="var(--faint)"/>
      <line x1="150" y1="272" x2="150" y2="29" stroke="var(--faint)" stroke-width="1.1"/><polygon points="150,22 153.5,30 146.5,30" fill="var(--faint)"/>
      <text x="388" y="142" font-size="11" fill="var(--faint)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">σ<tspan dy="3" font-size="9">n</tspan></text>
      <text x="156" y="32" font-size="11" fill="var(--faint)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">|τ<tspan dy="3" font-size="9">n</tspan><tspan dy="-3">|</tspan></text>
      <text x="146" y="164" font-size="11" fill="var(--faint)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">O</text>
      <circle cx="200" cy="150" r="114.13" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="100" y1="95" x2="300" y2="205" stroke="var(--d1)" stroke-width="1.3"/>
      <line x1="297.63" y1="90.9" x2="102.37" y2="209.1" stroke="var(--d2)" stroke-width="1.3"/>
      <circle cx="100" cy="95" r="3.2" fill="var(--d1)"/>
      <circle cx="300" cy="205" r="3.2" fill="var(--d1)"/>
      <circle cx="297.63" cy="90.9" r="3.2" fill="var(--d2)"/>
      <circle cx="102.37" cy="209.1" r="3.2" fill="var(--d2)"/>
      <path d="M225.66 134.46 A30 30 0 0 0 173.71 135.54" fill="none" stroke="var(--live)" stroke-width="1"/><polygon points="225.66,134.46 220.07,130.25 224.52,127.56" fill="var(--live)"/>
      <text x="204.6" y="112.02" font-size="11" fill="var(--live)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">120°</text>
      <text x="94" y="87" font-size="11" fill="var(--d1)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x′ (−10, 11)</text>
      <text x="306" y="221" font-size="11" fill="var(--d1)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">y′ (30, −11)</text>
      <text x="305.63" y="84.9" font-size="11" fill="var(--d2-tinta)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x</text>
      <text x="94.37" y="223.1" font-size="11" fill="var(--d2-tinta)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">y</text>
      <line x1="314.13" y1="146.5" x2="314.13" y2="153.5" stroke="var(--ink)" stroke-width="1"/>
      <line x1="85.87" y1="146.5" x2="85.87" y2="153.5" stroke="var(--ink)" stroke-width="1"/>
      <line x1="200" y1="146.5" x2="200" y2="153.5" stroke="var(--ink)" stroke-width="1"/>
      <text x="318.13" y="165" fill="var(--ink)" font-size="11" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">σ<tspan dy="3" font-size="9">1</tspan></text>
      <text x="81.87" y="165" fill="var(--ink)" font-size="11" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">σ<tspan dy="3" font-size="9">2</tspan></text>
      <text x="204" y="165" font-size="10" fill="var(--faint)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">10</text>
      </svg>
      <figcaption>

      Nuestra, a escala. De x′ se giran 120° en sentido horario hasta x,
      porque x está 60° en sentido horario de x′ en el elemento.

      </figcaption>
      </figure>

      **El giro.** $x$ está a $-60°$ de $x'$, así que en el círculo se giran
      120° en sentido horario desde $x'$. Con la ec. 2.61 desde $x'y'$ y
      $\theta = -60°$, en MPa:

      $$
      \sigma_x = 10 + (-20)\cos(-120°) + (-11)\operatorname{sen}(-120°) = 10 + 10 + 9{,}53 = 29{,}53
      $$

      $$
      \tau_{xy} = 20\operatorname{sen}(-120°) + (-11)\cos(-120°) = -17{,}32 + 5{,}5 = -11{,}82
      $$

      y $\sigma_y = 20 - 29{,}53 = -9{,}53$.

      **Cómo son.** $\sigma_x = 29{,}53$ MPa es de tracción y
      $\sigma_y = -9{,}53$ MPa, de compresión. $\tau_{xy} = -11{,}82$ MPa es
      negativa: baja por la cara derecha, sube por la izquierda, va hacia la
      izquierda en la de arriba y hacia la derecha en la de abajo, un par
      horario; por eso $x$ queda arriba en el círculo.

      **Comprobación.** Los invariantes del plano no cambian:
      $\sigma_x + \sigma_y = 20$, como $-10 + 30$; y
      $\sigma_x\sigma_y - \tau_{xy}^{2}$ vale $-421$ MPa², como
      $(-10)\cdot30 - 11^{2} = -421$. Las principales son
      $C \pm R = 32{,}83$ y $-12{,}83$ MPa en los dos casos, con la 1 a
      $-15{,}59°$ de $x$. Y girando $+60°$ desde $xy$ se vuelve a $-10$, 30
      y $-11$ MPa.

  # ── Ejercicio de clase 2.12 · el tensor y un plano en dos triedros.
  - id: ejerm2-cl2-12-el-tensor-y-un-plano-en-dos-triedros
    titulo: El tensor y el vector tensión de un plano en dos triedros
    fuente: >-
      Ejercicio 2.12 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el giro de ejes (ecs. 2.22 a 2.28 de los apuntes del tema
      2) y Cauchy (ecs. 2.14 y 2.16). Las componentes van en unidades de τ0.
      Cada cifra sale del motor del curso (el giro de la matriz con [R], el
      vector tensión y sus componentes intrínsecas en los dos sistemas) y
      está comprobada por un segundo camino: cada componente como
      proyección, {S}′ = [R]{S} y los tres invariantes. El enunciado da dos
      de los tres unitarios.
    nivel: practica
    enunciado: |
      El estado de tensiones de un punto es conocido en el sistema de
      referencia Oxyz. Considerando otro sistema de referencia Ox’y’z’ y
      siendo conocidos dos vectores unitarios de los ejes, determinar:

      a/ Matriz de tensiones en el sistema de referencia Ox’y’z’.

      b/ El vector tensión en el plano perpendicular a $\vec j'$ en ambos
      sistemas de referencia.

      c/ Las componentes intrínsecas del vector tensión determinado en b/
      calculadas en ambos sistemas de referencia.

      Datos:

      $$
      \vec i' = \tfrac{1}{\sqrt2}\left(\vec i - \vec k\right)\qquad
      \vec j' = \tfrac{1}{\sqrt2}\left(\vec i + \vec k\right)
      $$

      $$
      [\sigma]_{Oxyz} = \begin{bmatrix} 0 & \tau_0 & \tau_0\\ \tau_0 & 0 & \tau_0\\ \tau_0 & \tau_0 & 0 \end{bmatrix}
      $$

      **Notas nuestras.** Las componentes salen en unidades de $\tau_0$.
    pide: >-
      La matriz de tensiones en Ox’y’z’; y el vector tensión del plano
      perpendicular a j′ y sus componentes intrínsecas, cada uno en los dos
      sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da $\vec i'$ y $\vec j'$. ¿Cuál es el tercer eje,
          $\vec k'$?
        opciones:
          - texto: $\vec k' = \vec i'\times\vec j' = -\vec j$
            correcta: true
            mensaje: |
              Eso es. Para que Ox’y’z’ sea un triedro directo, como Oxyz,
              $\vec k' = \vec i'\times\vec j'$, y
              $\tfrac12\left[(1, 0, -1)\times(1, 0, 1)\right] = \tfrac12(0, -2, 0) = (0, -1, 0)$.
          - texto: $\vec k' = \vec j$, el eje que falta
            mensaje: |
              Es perpendicular a los dos, pero con $\vec j$ el triedro queda a
              izquierdas, porque $\vec i'\times\vec j' = -\vec j$. Con
              $+\vec j$, $\tau_{x'z'}$ y $\tau_{y'z'}$ salen con el signo
              cambiado.
          - texto: Da igual, porque el sentido de $\vec k'$ no cambia ninguna componente
            mensaje: |
              Cambia las dos tangenciales con $z'$, $\tau_{x'z'}$ y
              $\tau_{y'z'}$, que llevan un $\vec k'$ cada una. Las demás no
              lo llevan, y $\sigma_{z'}$ lo lleva dos veces.
      - tipo: calcular
        titulo: La matriz en Ox′y′z′
        pregunta: |
          ¿Cuánto vale $[\sigma]_{Ox'y'z'}$, en unidades de $\tau_0$?
        respuesta:
          tipo: matriz
          valor: '[-1, 0, 0; 0, 1, -1.4142; 0, -1.4142, 0]'
          tolerancia: 0.002
          formato: tres filas de tres números en unidades de τ0, con punto y coma entre filas
        distractores:
          - valor: '[-1, 0, 0; 0, 1, 1.4142; 0, 1.4142, 0]'
            mensaje: |
              Es la de $\vec k' = +\vec j$: el triedro a izquierdas cambia el
              signo de las tangenciales con $z'$.
          - valor: '[1, -1.4142, 0; -1.4142, 0, 0; 0, 0, -1]'
            mensaje: |
              Es $[R]^{t}[\sigma][R]$: los unitarios puestos en las columnas
              de $[R]$, que gira al revés.
          - valor: '[-2, 0, 0; 0, 2, -2; 0, -2, 0]'
            mensaje: |
              Te falta el $\tfrac{1}{\sqrt2}$ de $\vec i'$ y $\vec j'$: los
              ejes tienen que ser unitarios.
        pista: |
          Las filas de $[R]$ son $\vec i'$, $\vec j'$ y $\vec k'$; cada
          componente es $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$.
        desarrollo: |
          En unidades de $\tau_0$, con $[R]$ de filas
          $\tfrac{1}{\sqrt2}(1, 0, -1)$, $\tfrac{1}{\sqrt2}(1, 0, 1)$ y
          $(0, -1, 0)$:

          $$
          [\sigma]' = [R][\sigma][R]^{t} = \begin{bmatrix} -1 & 0 & 0\\ 0 & 1 & -\sqrt2\\ 0 & -\sqrt2 & 0 \end{bmatrix}
          $$

          Por ejemplo, $[\sigma]\{\vec i'\} = \tfrac{1}{\sqrt2}(-1, 0, 1)$ y
          $\sigma_{x'} = \tfrac12(-1 - 1) = -1$.
      - tipo: calcular
        titulo: El vector tensión en Oxyz
        pregunta: |
          ¿Cuánto vale el vector tensión del plano perpendicular a
          $\vec j'$, en Oxyz y en unidades de $\tau_0$?
        respuesta:
          tipo: vector
          valor: '(0.7071, 1.4142, 0.7071)'
          tolerancia: 0.002
          formato: tres componentes en unidades de τ0, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(1, 2, 1)'
            mensaje: |
              Te falta el $\tfrac{1}{\sqrt2}$ de $\vec j'$: Cauchy pide la
              normal unitaria.
          - valor: '(0, 1, -1.4142)'
            mensaje: |
              Son sus componentes en Ox’y’z’, las del paso siguiente. En
              Oxyz, $\{S\} = [\sigma]_{Oxyz}\{\vec j'\}$, con $\vec j'$
              escrito en Oxyz.
        pista: |
          $\{S\} = [\sigma]\{n\}$ con $\{n\} = \vec j' = \tfrac{1}{\sqrt2}(1, 0, 1)$:
          es sumar la primera y la tercera columna y dividir entre $\sqrt2$.
        desarrollo: |
          En unidades de $\tau_0$:

          $$
          \{S\} = \frac{1}{\sqrt2}\begin{pmatrix} 0 + 0 + 1\\ 1 + 0 + 1\\ 1 + 0 + 0 \end{pmatrix} = \frac{1}{\sqrt2}\begin{pmatrix} 1\\ 2\\ 1 \end{pmatrix}
          $$

          es decir, $(0{,}7071;\ 1{,}4142;\ 0{,}7071)$.
      - tipo: calcular
        titulo: El vector tensión en Ox′y′z′
        pregunta: |
          ¿Y en Ox’y’z’, en unidades de $\tau_0$?
        respuesta:
          tipo: vector
          valor: '(0, 1, -1.4142)'
          tolerancia: 0.002
          formato: tres componentes en unidades de τ0, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(0, 1, 1.4142)'
            mensaje: |
              Es la de $\vec k' = +\vec j$: el triedro a izquierdas cambia el
              signo de la componente según $z'$.
          - valor: '(0.7071, 1.4142, 0.7071)'
            mensaje: |
              Es el vector en Oxyz, sin girar. El vector es el mismo, pero sus
              componentes en Ox’y’z’ son otras: $\{S\}' = [R]\{S\}$.
          - valor: '(1.5, -0.7071, 0.5)'
            mensaje: |
              Es $[R]^{t}\{S\}$: has girado al revés.
        pista: |
          Dos caminos: $\{S\}' = [R]\{S\}$, o la segunda columna de
          $[\sigma]'$, porque en Ox’y’z’ la normal es $(0, 1, 0)$.
        desarrollo: |
          En unidades de $\tau_0$:

          $$
          \{S\}' = [\sigma]'\begin{pmatrix} 0\\ 1\\ 0 \end{pmatrix} = \begin{pmatrix} 0\\ 1\\ -\sqrt2 \end{pmatrix}
          $$

          Por el otro camino, proyectando $\vec S$ sobre los ejes nuevos:
          $\vec i'\cdot\vec S = \tfrac12(1 - 1) = 0$,
          $\vec j'\cdot\vec S = \tfrac12(1 + 1) = 1$ y
          $\vec k'\cdot\vec S = -\tfrac{2}{\sqrt2} = -\sqrt2$.
      - tipo: calcular
        titulo: La tangencial del plano
        pregunta: |
          ¿Cuánto vale la tensión tangencial $\tau_n$ del plano, en unidades
          de $\tau_0$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.001
          formato: un número positivo, en unidades de τ0
        distractores:
          - valor: '1.7321'
            mensaje: |
              Es $|\vec S| = \sqrt3\,\tau_0$, el vector tensión entero.
              $\tau_n$ es su parte en el plano.
          - valor: '2'
            mensaje: |
              Es $\tau_n^{2} = |\vec S|^{2} - \sigma_n^{2} = 3 - 1$: falta la
              raíz.
          - valor: '1'
            mensaje: |
              Es $\sigma_n$, la componente normal: $\vec S\cdot\vec j' = 1$.
        pista: |
          $\sigma_n = \vec S\cdot\vec n$ y
          $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$ (ec. 2.16), en el
          sistema que prefieras.
        desarrollo: |
          En Ox’y’z’ es inmediato: $\sigma_n$ es la componente según $y'$, 1,
          y $\tau_n$ el módulo de las otras dos,
          $\sqrt{0^{2} + 2} = \sqrt2 = 1{,}4142$. En Oxyz,
          $|\vec S|^{2} = \tfrac12(1 + 4 + 1) = 3$,
          $\sigma_n = \vec S\cdot\vec j' = \tfrac12(1 + 1) = 1$ y
          $\tau_n = \sqrt{3 - 1} = \sqrt2$: las mismas, en unidades de
          $\tau_0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec k' = \vec i'\times\vec j' = -\vec j$, y las filas de $[R]$
              son $\vec i'$, $\vec j'$ y $\vec k'$.
          - texto: >-
              $[\sigma]' = [R][\sigma][R]^{t}$: $\sigma_{x'} = -1$,
              $\sigma_{y'} = 1$, $\sigma_{z'} = 0$ y $\tau_{y'z'} = -\sqrt2$,
              en unidades de $\tau_0$, y las otras dos tangenciales nulas.
          - texto: >-
              $\vec S = \tfrac{1}{\sqrt2}(1, 2, 1)\,\tau_0$ en Oxyz y
              $(0, 1, -\sqrt2)\,\tau_0$ en O$x'y'z'$: el mismo vector, con otras
              componentes.
          - texto: >-
              $\sigma_n = \tau_0$ y $\tau_n = \sqrt2\,\tau_0$, en los dos
              sistemas.
          - texto: >-
              Como las componentes de $\vec S$ cambian de un sistema a otro,
              también cambian $\sigma_n$ y $\tau_n$.
            trampa: true
            mensaje: |
              $\sigma_n$ y $\tau_n$ son la proyección de $\vec S$ sobre la
              normal del plano y lo que queda en el plano: dependen del
              vector y del plano, no de los ejes con que se escriben. Por eso
              salen iguales, $\tau_0$ y $\sqrt2\,\tau_0$.
    resolucion: |
      **La idea.** El vector tensión de un plano es uno solo; lo que cambia
      de un triedro a otro son sus componentes. El tensor gira con
      $[\sigma]' = [R][\sigma][R]^{t}$ (ec. 2.27), los vectores con
      $\{v\}' = [R]\{v\}$ (ec. 2.22), y las componentes intrínsecas, que no
      dependen de los ejes, tienen que salir iguales en los dos.

      **El tercer eje.** El enunciado da $\vec i'$ y $\vec j'$; para que
      Ox’y’z’ sea directo, como Oxyz,
      $\vec k' = \vec i'\times\vec j' = -\vec j$. Las filas de $[R]$:

      $$
      [R] = \begin{bmatrix} \tfrac{1}{\sqrt2} & 0 & -\tfrac{1}{\sqrt2}\\ \tfrac{1}{\sqrt2} & 0 & \tfrac{1}{\sqrt2}\\ 0 & -1 & 0 \end{bmatrix}
      $$

      **a/ La matriz en Ox’y’z’.** En unidades de $\tau_0$:

      $$
      [\sigma]' = [R][\sigma][R]^{t} = \begin{bmatrix} -1 & 0 & 0\\ 0 & 1 & -\sqrt2\\ 0 & -\sqrt2 & 0 \end{bmatrix}
      $$

      $x'$ resulta ser una dirección principal, con $-\tau_0$. Los
      invariantes casan: la traza es 0 en los dos; $I_2 = -3\tau_0^{2}$ e
      $I_3 = 2\tau_0^{3}$ también en los dos.

      **b/ El vector tensión del plano perpendicular a ĵ′.** En Oxyz, con
      $\{n\} = \vec j' = \tfrac{1}{\sqrt2}(1, 0, 1)$,
      $\{S\} = [\sigma]\{n\} = \tfrac{1}{\sqrt2}(1, 2, 1)\,\tau_0$. En
      Ox’y’z’ la normal es $(0, 1, 0)$ y el vector tensión es la segunda
      columna de $[\sigma]'$, $\{S\}' = (0, 1, -\sqrt2)\,\tau_0$; y lo mismo
      sale de $\{S\}' = [R]\{S\}$.

      **c/ Las componentes intrínsecas.** En Ox’y’z’ se leen:
      $\sigma_n = \tau_0$, la componente según $y'$, y
      $\tau_n = \sqrt{0 + 2}\;\tau_0 = \sqrt2\,\tau_0$, el módulo de las otras
      dos. En Oxyz, $|\vec S|^{2} = 3\tau_0^{2}$,
      $\sigma_n = \vec S\cdot\vec j' = \tau_0$ y
      $\tau_n = \sqrt{3 - 1}\;\tau_0 = \sqrt2\,\tau_0$. Las mismas, como
      tenía que ser: proyectar un vector sobre una dirección no depende de
      los ejes en que se escriban los dos.
  # ── Cuestión 1 de autoevaluación del tema 2 · las componentes intrínsecas del vector tensión.
  - id: ejerm2-cu1-las-componentes-intrinsecas
    titulo: Las componentes intrínsecas del vector tensión
    fuente: >-
      Cuestión 1 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.2
      (pp. 3-6, ecs. 2.1 y 2.2, figs. 2.2 y 2.3), con las ecs. 2.14 a 2.16
      del apartado 2.4.1 (pp. 11-12). Cayó palabra por palabra como parte a)
      de la pregunta 1 de teoría de la extraordinaria del 1 de febrero de
      2023, que está en el sitio con su resolución. La ec. 2.2 trae una
      errata de signo, dicha en la resolución. El ejemplo es nuestro,
      comprobado con el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      1. Componentes intrínsecas del vector tensión.
    pide: >-
      Qué son las componentes intrínsecas del vector tensión de un plano, cómo
      se calculan y por qué se llaman así.
    pasos:
      - tipo: reconocer
        pregunta: |
          El vector tensión $\vec S_n$ de un plano de normal $\hat n$ se
          descompone en sus dos componentes intrínsecas. ¿Cuáles son?
        opciones:
          - texto: >-
              Su proyección sobre la normal, $\sigma_n$, y lo que queda
              contenido en el plano, $\tau_n$
            correcta: true
            mensaje: |
              Eso es (apuntes, p. 4, y fig. 2.2). La componente normal es la
              tensión normal y la contenida en el plano, la tensión cortante o
              tangencial. Como solo dependen del plano y del estado de tensión
              del punto, y no de unos ejes, se llaman intrínsecas.
          - texto: >-
              Sus tres componentes en los ejes $x$, $y$, $z$
            mensaje: |
              Esas son sus componentes cartesianas, y cambian si se giran los
              ejes. Las intrínsecas no dependen de ningún sistema de
              referencia: se miden respecto del propio plano.
          - texto: >-
              Las tensiones $\sigma_x$, $\tau_{xy}$ y $\tau_{xz}$ de la cara $x$
            mensaje: |
              Esas son las componentes cartesianas del vector tensión de la
              cara $x$ (fig. 2.3). Ahí $\sigma_x$ es su $\sigma_n$, y
              $\tau_{xy}$ y $\tau_{xz}$ son las dos piezas de su $\tau_n$, que
              vale $\sqrt{\tau_{xy}^2 + \tau_{xz}^2}$; pero siguen siendo
              componentes en unos ejes. En un plano oblicuo, $\sigma_n$ y
              $\tau_n$ hay que calcularlas.
          - texto: >-
              Su módulo $\lvert\vec S_n\rvert$ y el ángulo que forma con la
              normal
            mensaje: |
              Con el módulo y ese ángulo se reconstruye el vector, pero no son
              las componentes que define el curso. Las intrínsecas son dos
              tensiones: la parte de $\vec S_n$ en la dirección de $\hat n$ y
              la parte contenida en el plano.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica la cuestión como en un examen: qué es el vector tensión,
          cuáles son sus componentes intrínsecas, cómo se calcula cada una y
          por qué se llaman así.
        rubrica:
          - punto: >-
              El vector tensión de un plano de normal n̂ es la fuerza interna
              por unidad de superficie en ese plano: S⃗n = lím Δf⃗/ΔA, con
              ΔA → 0 (ec. 2.1).
            porque: >-
              Es lo que se descompone: sin él no hay componentes de las que
              hablar.
            minimo: true
          - punto: >-
              La componente normal es su proyección sobre la normal,
              σn = S⃗n·n̂ (ec. 2.2): la tensión normal.
            porque: >-
              Es la primera de las dos, y la que dice si el plano está
              traccionado o comprimido.
            minimo: true
          - punto: >-
              La componente contenida en el plano es lo que queda,
              τn t̂ = S⃗n − (S⃗n·n̂)n̂ (ec. 2.2), con t̂ el unitario de su
              dirección: la tensión cortante o tangencial.
            porque: >-
              Es la segunda, y la forma de calcularla sin dibujar nada.
            minimo: true
          - punto: >-
              Se llaman intrínsecas porque no dependen de ningún sistema de
              referencia: solo del plano y del estado de tensión del punto.
            porque: >-
              Es lo que dice el nombre, y lo que las distingue de las
              componentes cartesianas de S⃗n.
            minimo: true
          - punto: >-
              Con el tensor: σn = {n}ᵗ{Sn} = {n}ᵗ[σ]{n} y τn² = |S⃗n|² − σn²
              (ec. 2.16), sin necesidad de t̂.
            porque: >-
              Es como se calculan en los problemas, con {Sn} = [σ]{n}
              (ec. 2.14).
          - punto: >-
              En unos ejes, la tangencial de cada cara coordenada se
              descompone en dos paralelas a los ejes (fig. 2.3): en τij, i es
              la normal de la cara y j la dirección de la componente.
            porque: >-
              Es el paso a las componentes del tensor, y el origen de su
              convenio de signos.
      - tipo: calcular
        titulo: La tensión normal
        pregunta: |
          Un ejemplo nuestro: en un punto de un sólido, el vector tensión del
          plano de normal $\hat n = \tfrac13(2, 1, 2)$ es
          $\vec S_n = (55, 50, 10)$ MPa. ¿Cuánto vale la tensión normal
          $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '180'
            mensaje: |
              Has multiplicado por $(2, 1, 2)$ sin dividir entre su módulo, 3.
              La proyección es sobre el vector unitario $\hat n$.
          - valor: '55'
            mensaje: |
              Esa es la componente $x$ de $\vec S_n$, una componente cartesiana.
              La normal del plano no es $\hat i$: hay que proyectar sobre
              $\hat n$.
          - valor: '75'
            mensaje: |
              Ese es el módulo del vector tensión, $\sqrt{55^{2} + 50^{2} + 10^{2}}$.
              Solo coincidiría con $\sigma_n$ si $\vec S_n$ fuera
              perpendicular al plano, y aquí no lo es.
        pista: |
          $\sigma_n = \vec S_n\cdot\hat n$ (ec. 2.2), con el $\hat n$ unitario.
        desarrollo: |
          $$
          \sigma_n = \vec S_n\cdot\hat n = \frac{55\cdot2 + 50\cdot1 + 10\cdot2}{3} = \frac{180}{3} = 60
          $$

          en MPa. Es positiva: el plano está traccionado.
      - tipo: calcular
        titulo: El módulo de la tangencial
        pregunta: |
          En el mismo plano, ¿cuánto vale el módulo de la tensión tangencial,
          $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '15'
            mensaje: |
              Has restado los módulos: $75 - 60$. Las dos componentes son
              perpendiculares, y lo que se cumple es
              $\lvert\vec S_n\rvert^{2} = \sigma_n^{2} + \tau_n^{2}$ (ec. 2.16).
          - valor: '75'
            mensaje: |
              Ese es $\lvert\vec S_n\rvert$, el vector entero. La tangencial
              es lo que queda al quitarle la parte normal.
        pista: |
          $\tau_n^{2} = \lvert\vec S_n\rvert^{2} - \sigma_n^{2}$ (ec. 2.16).
        desarrollo: |
          $$
          \lvert\vec S_n\rvert^{2} = 55^{2} + 50^{2} + 10^{2} = 3025 + 2500 + 100 = 5625
          $$

          en MPa², y

          $$
          \tau_n = \sqrt{5625 - 60^{2}} = \sqrt{2025} = 45
          $$

          en MPa.
      - tipo: calcular
        titulo: La tangencial como vector
        pregunta: |
          ¿Y la componente tangencial como vector, $\tau_n\hat t$, en MPa?
        respuesta:
          tipo: vector
          valor: '(15, 30, -30)'
          tolerancia: 0.05
          formato: tres componentes en MPa, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(-15, -30, 30)'
            mensaje: |
              Es el vector bueno cambiado de signo: lo da
              $\hat n\times(\hat n\times\vec S_n)$, la última igualdad de la
              ec. 2.2 tal como está impresa, que lleva una errata. El doble
              producto vectorial bueno es $\hat n\times(\vec S_n\times\hat n)$.
          - valor: '(-65, -10, -110)'
            mensaje: |
              Has restado $\sigma_n\,(2, 1, 2)$ en vez de $\sigma_n\hat n$: la
              parte normal es $60\cdot\tfrac13(2, 1, 2) = (40, 20, 40)$.
          - valor: '(40, 20, 40)'
            mensaje: |
              Esa es la parte normal, $\sigma_n\hat n$. La tangencial es lo que
              queda al quitársela a $\vec S_n$.
        pista: |
          $\tau_n\hat t = \vec S_n - (\vec S_n\cdot\hat n)\,\hat n$ (ec. 2.2).
        desarrollo: |
          La parte normal es $\sigma_n\hat n = 60\cdot\tfrac13(2, 1, 2) = (40, 20, 40)$,
          y la tangencial, lo que queda:

          $$
          \tau_n\hat t = (55, 50, 10) - (40, 20, 40) = (15, 30, -30)
          $$

          en MPa. Su módulo es $\sqrt{15^{2} + 30^{2} + 30^{2}} = 45$, el del
          paso anterior, y es perpendicular a la normal:
          $\tfrac13(2\cdot15 + 1\cdot30 - 2\cdot30) = 0$. Su dirección es
          $\hat t = \tfrac13(1, 2, -2)$.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En un plano que pasa por el punto, la fuerza interna por unidad
              de superficie es el vector tensión,
              $\vec S_n = \lim_{\Delta A\to0}\Delta\vec f/\Delta A$.
          - texto: >-
              Su proyección sobre la normal es la tensión normal,
              $\sigma_n = \vec S_n\cdot\hat n$.
          - texto: >-
              Lo que queda, $\vec S_n - \sigma_n\hat n$, está contenido en el
              plano: es la tangencial, $\tau_n\hat t$.
          - texto: >-
              Como $\hat n$ y $\hat t$ son perpendiculares,
              $\tau_n^{2} = \lvert\vec S_n\rvert^{2} - \sigma_n^{2}$.
          - texto: >-
              Ninguna de las dos depende de los ejes que se elijan: son las
              componentes intrínsecas.
          - texto: >-
              Como $\vec S_n = \sigma_n\hat n + \tau_n\hat t$, el módulo de la
              tangencial es $\tau_n = \lvert\vec S_n\rvert - \sigma_n$.
            trampa: true
            mensaje: |
              Los módulos no se restan: $\sigma_n\hat n$ y $\tau_n\hat t$ son
              perpendiculares, y lo que se cumple es Pitágoras,
              $\lvert\vec S_n\rvert^{2} = \sigma_n^{2} + \tau_n^{2}$. En el
              ejemplo, $75 - 60$ daría 15, y la tangencial vale 45 MPa.
    resolucion: |
      **El vector tensión** (apuntes del tema 2, apartado 2.2, pp. 3-4). Si
      se corta el sólido por un plano que pasa por un punto, en cada trozo
      de superficie $\Delta A$ del corte actúa una fuerza interna
      $\Delta\vec f$. El vector tensión del plano de vector unitario normal
      $\hat n$ se define como

      $$
      \vec S_n = \lim_{\Delta A\to0}\frac{\Delta\vec f}{\Delta A} \qquad \text{(ec. 2.1)}
      $$

      **Sus componentes intrínsecas** (fig. 2.2 y ec. 2.2, pp. 4-5). Se
      descompone en una componente normal al plano de corte, $\sigma_n$, la
      tensión normal, y otra contenida en el plano, $\tau_n$, la tensión
      cortante o tangencial:

      $$
      \sigma_n = \vec S_n\cdot\hat n \qquad\qquad
      \tau_n\hat t = \vec S_n - (\vec S_n\cdot\hat n)\,\hat n
      $$

      siendo $\hat t$ el vector unitario de la dirección de $\tau_n$. Como
      no dependen de un sistema de referencia, se llaman componentes
      intrínsecas del vector tensión.

      **Una errata de la ec. 2.2.** Los apuntes añaden
      $\tau_n\hat t = \hat n\times(\hat n\times\vec S_n)$, y esa igualdad
      lleva el signo cambiado. Con
      $\vec a\times(\vec b\times\vec c) = \vec b\,(\vec a\cdot\vec c) - \vec c\,(\vec a\cdot\vec b)$,

      $$
      \hat n\times(\hat n\times\vec S_n) = (\vec S_n\cdot\hat n)\,\hat n - \vec S_n = -\tau_n\hat t
      $$

      La buena es $\tau_n\hat t = \hat n\times(\vec S_n\times\hat n)$, que es
      como lo escriben las diapositivas del tema.

      **Con el tensor** (ecs. 2.14 a 2.16, pp. 11-12). Con
      $\{S_n\} = [\sigma]\{n\}$, las componentes intrínsecas se calculan
      sin $\hat t$:

      $$
      \sigma_n = \{n\}^{t}\{S_n\} = \{n\}^{t}[\sigma]\{n\} \qquad\qquad
      \tau_n^{2} = \lvert\vec S_n\rvert^{2} - \sigma_n^{2}
      $$

      **En unos ejes** (fig. 2.3, pp. 5-6). Si se usa un sistema de
      referencia, la tangencial de cada cara coordenada se descompone a su
      vez en dos paralelas a los ejes: en la cara $x$, $\sigma_x$,
      $\tau_{xy}$ y $\tau_{xz}$. En $\sigma_i$, $i$ es la normal del plano;
      en $\tau_{ij}$, $i$ es la normal y $j$ la dirección de la componente.
      Estas sí dependen de los ejes. En una cara coordenada se leen las
      intrínsecas: en la $x$, $\sigma_n = \sigma_x$ y
      $\tau_n = \sqrt{\tau_{xy}^2 + \tau_{xz}^2}$.

      **Un ejemplo nuestro.** Con $\hat n = \tfrac13(2, 1, 2)$ y
      $\vec S_n = (55, 50, 10)$ MPa, en MPa:

      $$
      \sigma_n = \frac{2\cdot55 + 1\cdot50 + 2\cdot10}{3} = 60 \qquad
      \tau_n = \sqrt{5625 - 3600} = 45
      $$

      y $\tau_n\hat t = (55, 50, 10) - (40, 20, 40) = (15, 30, -30)$, con
      $\hat t = \tfrac13(1, 2, -2)$.

      **Comprobaciones.** Las tres cifras salen igual con el motor del
      curso (al que se le pasa un tensor que da ese $\vec S_n$ en ese
      plano) y a mano. $\tau_n$, además, por otro camino: es el módulo de
      $\hat n\times\vec S_n = (-30, 30, 15)$, que vale
      $\sqrt{900 + 900 + 225} = 45$. Y $\hat n\times(\vec S_n\times\hat n)$
      da $(15, 30, -30)$, el mismo vector tangencial.
  # ── Cuestión 4 de autoevaluación del tema 2 · un vector en dos sistemas de referencia.
  - id: ejerm2-cu4-un-vector-en-dos-sistemas-de-referencia
    titulo: Las componentes de un vector en dos sistemas de referencia
    fuente: >-
      Cuestión 4 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.2
      (pp. 12-14, ecs. 2.17 a 2.23 y fig. 2.10). Se parece al arranque de la
      pregunta 2 de teoría del primer parcial de 2013-2014, en cuyo
      enunciado esta relación es un dato. El ejemplo es nuestro, comprobado
      con el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      4. Deducir la relación entre las componentes de un vector expresado en
      dos sistemas de referencia O$xyz$ y O$x'y'z'$, en el que el segundo está
      rotado respecto del primero.
    pide: >-
      La relación entre las componentes del vector en los dos sistemas,
      deducida, y qué significa cada coeficiente que aparece.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al girar los ejes de O$xyz$ a O$x'y'z'$, ¿qué le pasa al vector
          $\vec v$?
        opciones:
          - texto: >-
              Nada: es el mismo vector, escrito con otros vectores unitarios, y
              solo cambian sus componentes
            correcta: true
            mensaje: |
              Eso es. Las ecs. 2.17 y 2.18 escriben el mismo $\vec v$ en los
              dos sistemas; la relación sale de escribir los unitarios de uno
              en el otro y de igualar las dos expresiones.
          - texto: >-
              Gira con los ejes, y por eso cambian sus componentes
            mensaje: |
              Girar los ejes no mueve el vector: la fuerza o la normal siguen
              donde estaban. Lo que cambia es desde dónde se miden. Si el
              vector girara con los ejes, sus componentes no cambiarían.
          - texto: >-
              Cambia su módulo, porque cada sistema lo mide a su manera
            mensaje: |
              El módulo es del vector, no de los ejes: con unos ejes
              ortonormales, $v_x^{2} + v_y^{2} + v_z^{2} = v_{x'}^{2} + v_{y'}^{2} + v_{z'}^{2}$.
              Es una buena comprobación de cualquier giro.
          - texto: >-
              Nada, y tampoco sus componentes, que son las mismas en los dos
              sistemas
            mensaje: |
              El vector es el mismo, pero sus componentes no: cada una es su
              proyección sobre un eje, y los ejes son otros.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en un examen: de dónde se parte, qué son
          los coeficientes, la relación en forma de matriz y qué son las filas
          de esa matriz.
        rubrica:
          - punto: >-
              El vector es el mismo en los dos sistemas:
              v⃗ = vx î + vy ĵ + vz k̂ (ec. 2.17) y
              v⃗ = vx′ î′ + vy′ ĵ′ + vz′ k̂′ (ec. 2.18).
            porque: >-
              Es la idea de la que sale todo: igualar dos escrituras del mismo
              vector.
            minimo: true
          - punto: >-
              Los unitarios de un sistema se escriben en el otro con los
              cosenos directores: î = rxx′ î′ + rxy′ ĵ′ + rxz′ k̂′, y lo mismo
              ĵ y k̂ (ec. 2.19); y se cumple r_i′j = r_ji′, el coseno del
              ángulo entre las dos direcciones.
            porque: >-
              Son los coeficientes de la relación, y la igualdad r_i′j = r_ji′
              es la que deja la matriz por filas.
            minimo: true
          - punto: >-
              Sustituyendo la ec. 2.19 en la 2.17 e igualando con la 2.18
              componente a componente (ec. 2.21) sale
              {v}Ox′y′z′ = [R]{v}Oxyz (ec. 2.22).
            porque: >-
              Es el resultado que se pide.
            minimo: true
          - punto: >-
              Las filas de [R] son las componentes de î′, ĵ′ y k̂′ en el sistema
              sin girar (ec. 2.20).
            porque: >-
              Es lo que permite escribir [R] sin calcular ningún ángulo: basta
              con los unitarios del sistema girado.
            minimo: true
          - punto: >-
              La relación inversa: sustituyendo la ec. 2.20 en la 2.18 sale
              {v}Oxyz = [R]ᵗ{v}Ox′y′z′ (ec. 2.23).
            porque: >-
              Completa la respuesta, y con las dos se demuestra que [R] es
              ortogonal (cuestión 5).
          - punto: >-
              Un ejemplo: en un giro de ángulo θ alrededor de x, las filas de
              [R] son (1, 0, 0), (0, cos θ, sin θ) y (0, −sin θ, cos θ)
              (p. 14).
            porque: >-
              Es el caso que cae en los problemas, y muestra que [R] no es
              simétrica.
      - tipo: calcular
        titulo: Las componentes en el sistema girado
        pregunta: |
          Un ejemplo nuestro: los unitarios del sistema girado, escritos en
          O$xyz$, son $\hat i' = \tfrac13(2, 2, 1)$,
          $\hat j' = \tfrac13(-2, 1, 2)$ y $\hat k' = \tfrac13(1, -2, 2)$. Una
          fuerza vale $\vec F = (3, -3, 6)$ kN en O$xyz$. ¿Cuáles son sus
          componentes en O$x'y'z'$, en kN?
        respuesta:
          tipo: vector
          valor: '(2, 1, 7)'
          tolerancia: 0.05
          formato: tres componentes en kN, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(6, -3, 3)'
            mensaje: |
              Has puesto los unitarios girados como columnas de $[R]$: eso es
              $[R]^{t}\{F\}$, la relación inversa (ec. 2.23). Las filas de
              $[R]$ son $\hat i'$, $\hat j'$ y $\hat k'$ (ec. 2.20).
          - valor: '(6, 3, 21)'
            mensaje: |
              Te has dejado el $\tfrac13$ de los unitarios: $(2, 2, 1)$ no es
              unitario, mide 3. Con él, el módulo de la fuerza saldría el
              triple.
          - valor: '(3, -3, 6)'
            mensaje: |
              Son las componentes en O$xyz$. La fuerza es la misma, pero sus
              componentes en los ejes girados son sus proyecciones sobre
              $\hat i'$, $\hat j'$ y $\hat k'$.
        pista: |
          $\{F\}_{Ox'y'z'} = [R]\{F\}_{Oxyz}$ (ec. 2.22), con las filas de $[R]$
          iguales a $\hat i'$, $\hat j'$ y $\hat k'$.
        desarrollo: |
          Cada componente es una fila de $[R]$ por $\{F\}$, en kN:

          $$
          F_{x'} = \frac{2\cdot3 + 2\cdot(-3) + 1\cdot6}{3} = 2 \qquad
          F_{y'} = \frac{-2\cdot3 + 1\cdot(-3) + 2\cdot6}{3} = 1 \qquad
          F_{z'} = \frac{1\cdot3 - 2\cdot(-3) + 2\cdot6}{3} = 7
          $$

          El módulo no cambia: $3^{2} + 3^{2} + 6^{2} = 54$ y
          $2^{2} + 1^{2} + 7^{2} = 54$, en kN².
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El vector es el mismo en los dos sistemas:
              $\vec v = v_x\hat i + v_y\hat j + v_z\hat k = v_{x'}\hat i' + v_{y'}\hat j' + v_{z'}\hat k'$.
          - texto: >-
              Cada unitario de O$xyz$ se escribe en el girado con los cosenos
              directores: $\hat i = r_{xx'}\hat i' + r_{xy'}\hat j' + r_{xz'}\hat k'$,
              y lo mismo $\hat j$ y $\hat k$.
          - texto: >-
              Sustituyendo y juntando lo que multiplica a $\hat i'$:
              $v_{x'} = r_{xx'}v_x + r_{yx'}v_y + r_{zx'}v_z$.
          - texto: >-
              Como $r_{i'j} = r_{ji'}$, eso es
              $v_{x'} = r_{x'x}v_x + r_{x'y}v_y + r_{x'z}v_z$: la primera fila de
              $[R]$, que es $\hat i'$ escrito en O$xyz$.
          - texto: >-
              Con las tres componentes,
              $\{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz}$.
          - texto: >-
              Las columnas de $[R]$ son los unitarios girados, así que
              $\{v\}_{Ox'y'z'} = [R]^{t}\{v\}_{Oxyz}$.
            trampa: true
            mensaje: |
              Son las filas (ec. 2.20 y p. 13): $r_{x'x}$, $r_{x'y}$, $r_{x'z}$
              son las componentes de $\hat i'$. Con $[R]^{t}$ se hace la
              vuelta, de O$x'y'z'$ a O$xyz$ (ec. 2.23). En el ejemplo, saldría
              $(6, -3, 3)$ kN en vez de $(2, 1, 7)$ kN.
    resolucion: |
      **De dónde se parte** (apuntes del tema 2, apartado 2.4.2, pp. 12-13).
      Un mismo vector $\vec v$ se escribe en los dos sistemas de la fig. 2.10:

      $$
      \vec v = v_x\hat i + v_y\hat j + v_z\hat k \quad \text{(ec. 2.17)} \qquad\qquad
      \vec v = v_{x'}\hat i' + v_{y'}\hat j' + v_{z'}\hat k' \quad \text{(ec. 2.18)}
      $$

      **Los cosenos directores.** Los vectores unitarios de un sistema se
      pueden expresar en el otro:

      $$
      \hat i = r_{xx'}\hat i' + r_{xy'}\hat j' + r_{xz'}\hat k' \qquad
      \hat j = r_{yx'}\hat i' + r_{yy'}\hat j' + r_{yz'}\hat k' \qquad
      \hat k = r_{zx'}\hat i' + r_{zy'}\hat j' + r_{zz'}\hat k'
      $$

      (ec. 2.19), y al revés, $\hat i' = r_{x'x}\hat i + r_{x'y}\hat j + r_{x'z}\hat k$
      y lo mismo $\hat j'$ y $\hat k'$ (ec. 2.20). Los coeficientes
      $r_{i'j}$ y $r_{ij'}$ son los cosenos directores, el coseno del ángulo
      entre las dos direcciones, y por eso $r_{i'j} = r_{ji'}$.

      **La deducción.** Sustituyendo la ec. 2.19 en la 2.17 (ec. 2.21),
      igualando lo que multiplica a cada unitario con la ec. 2.18 y usando
      $r_{i'j} = r_{ji'}$, en forma matricial:

      $$
      \begin{Bmatrix} v_{x'}\\ v_{y'}\\ v_{z'} \end{Bmatrix} =
      \begin{bmatrix} r_{x'x} & r_{x'y} & r_{x'z}\\ r_{y'x} & r_{y'y} & r_{y'z}\\ r_{z'x} & r_{z'y} & r_{z'z} \end{bmatrix}
      \begin{Bmatrix} v_x\\ v_y\\ v_z \end{Bmatrix}
      \;\Longrightarrow\; \{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz} \qquad \text{(ec. 2.22)}
      $$

      Las filas de $[R]$ son las componentes de los vectores unitarios del
      sistema rotado en el sistema sin rotar, como dice la ec. 2.20.
      Sustituyendo la ec. 2.20 en la 2.18 sale la relación inversa,
      $\{v\}_{Oxyz} = [R]^{t}\{v\}_{Ox'y'z'}$ (ec. 2.23, p. 14).

      **Un caso que cae en los problemas** (p. 14). En un giro de ángulo
      $\theta$ alrededor del eje $x$, $\hat j' = \cos\theta\,\hat j + \sin\theta\,\hat k$
      y $\hat k' = -\sin\theta\,\hat j + \cos\theta\,\hat k$, y

      $$
      [R] = \begin{bmatrix} 1 & 0 & 0\\ 0 & \cos\theta & \sin\theta\\ 0 & -\sin\theta & \cos\theta \end{bmatrix}
      $$

      que no es simétrica: con $[R]^{t}$ en lugar de $[R]$ se gira al revés.

      **Un ejemplo nuestro.** Con $\hat i' = \tfrac13(2, 2, 1)$,
      $\hat j' = \tfrac13(-2, 1, 2)$ y $\hat k' = \tfrac13(1, -2, 2)$, la
      fuerza $\vec F = (3, -3, 6)$ kN tiene en O$x'y'z'$ las componentes
      $(2, 1, 7)$ kN: cada una es una fila de $[R]$ por $\{F\}$, es decir,
      la proyección $\vec F\cdot\hat i'$, $\vec F\cdot\hat j'$,
      $\vec F\cdot\hat k'$.

      **Comprobaciones.** El triedro es ortonormal y a derechas:
      $\hat i'\times\hat j' = \tfrac19(3, -6, 6) = \hat k'$. Las componentes
      salen igual con el motor del curso ($[R]\{F\}$) y como tres productos
      escalares, y el módulo se conserva: $\sqrt{54}$ kN en los dos
      sistemas.
  # ── Cuestión 5 de autoevaluación del tema 2 · la matriz de rotación es ortogonal.
  - id: ejerm2-cu5-la-matriz-de-rotacion-es-ortogonal
    titulo: La matriz de rotación es ortogonal
    fuente: >-
      Cuestión 5 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.2
      (pp. 13-14, ecs. 2.20, 2.22, 2.23 y 2.24). El ejemplo es nuestro,
      comprobado con el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      5. Demostrar que la matriz de rotación es ortogonal.
    pide: >-
      La demostración, para la matriz [R] con que cambian las componentes de
      un vector al girar los ejes.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que demostrar, exactamente, al decir que $[R]$ es ortogonal?
        opciones:
          - texto: >-
              Que su traspuesta es su inversa: $[R]^{t} = [R]^{-1}$, es decir,
              $[R]^{t}[R] = [R][R]^{t} = [I]$
            correcta: true
            mensaje: |
              Eso es (ec. 2.24, p. 14): «la inversa y la traspuesta de la matriz
              $[R]$ son iguales, por lo que es ortogonal». Lo práctico es que
              para deshacer un giro no hace falta invertir nada: basta
              trasponer.
          - texto: >-
              Que es simétrica: $[R]^{t} = [R]$
            mensaje: |
              Una matriz de giro casi nunca es simétrica: la del giro $\theta$
              alrededor de $x$ (p. 14) lleva $\sin\theta$ encima de la diagonal
              y $-\sin\theta$ debajo. Si fuera simétrica y ortogonal a la vez,
              sería su propia inversa: girar dos veces dejaría los ejes como
              estaban.
          - texto: >-
              Que su determinante vale 1
            mensaje: |
              Es una consecuencia, no la definición: de $[R]^{t}[R] = [I]$ sale
              $(\det[R])^{2} = 1$, y vale $+1$ si el triedro girado es a
              derechas. Al revés no funciona: una matriz con determinante 1 no
              tiene por qué ser ortogonal.
          - texto: >-
              Que los números de cada fila suman 1
            mensaje: |
              Lo que vale 1 es la suma de sus **cuadrados**: cada fila es un
              vector unitario. Y además, dos filas distintas tienen producto
              escalar nulo, porque los unitarios son perpendiculares.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen: qué quiere decir que [R]
          sea ortogonal, de qué se parte y cómo se llega.
        rubrica:
          - punto: >-
              Ortogonal quiere decir que la traspuesta es la inversa:
              [R]ᵗ = [R]⁻¹, o [R]ᵗ[R] = [R][R]ᵗ = [I].
            porque: >-
              Es lo que hay que demostrar; sin decirlo, no se sabe a dónde se
              va.
            minimo: true
          - punto: >-
              Se parte de las dos relaciones de un mismo vector:
              {v}Ox′y′z′ = [R]{v}Oxyz (ec. 2.22) y {v}Oxyz = [R]ᵗ{v}Ox′y′z′
              (ec. 2.23).
            porque: >-
              Son las dos caras del mismo giro, de un sistema al otro y de
              vuelta, y de ellas «se puede colegir» la ec. 2.24.
            minimo: true
          - punto: >-
              Sustituyendo una en la otra: {v}Ox′y′z′ = [R][R]ᵗ{v}Ox′y′z′ y
              {v}Oxyz = [R]ᵗ[R]{v}Oxyz.
            porque: >-
              Es el paso que junta las dos matrices.
            minimo: true
          - punto: >-
              Como vale para cualquier vector, [R][R]ᵗ = [R]ᵗ[R] = [I], y
              [R]ᵗ = [R]⁻¹ (ec. 2.24).
            porque: >-
              Con un vector solo no bastaría: hace falta que la igualdad valga
              para todos.
            minimo: true
          - punto: >-
              Otra forma de verlo: las filas de [R] son î′, ĵ′ y k̂′ (ec. 2.20),
              y el producto de la fila i por la fila j es el producto escalar
              de dos de ellos: 1 si es el mismo, 0 si no.
            porque: >-
              Explica por qué pasa: es un triedro de vectores unitarios y
              perpendiculares.
          - punto: >-
              Consecuencias: el giro conserva módulos y ángulos, y
              det[R] = ±1 (+1 con un triedro a derechas).
            porque: >-
              Son las comprobaciones que se usan después en los problemas.
      - tipo: calcular
        titulo: De vuelta al sistema sin girar
        pregunta: |
          Un ejemplo nuestro: el sistema girado tiene
          $\hat i' = \tfrac17(6, 2, 3)$ y $\hat j' = \tfrac17(-3, 6, 2)$ en
          O$xyz$, y $\hat k' = \hat i'\times\hat j' = \tfrac17(-2, -3, 6)$.
          Una fuerza vale $\vec F = (7, 0, 7)$ kN en O$x'y'z'$. ¿Cuáles son
          sus componentes en O$xyz$, en kN?
        respuesta:
          tipo: vector
          valor: '(4, -1, 9)'
          tolerancia: 0.05
          formato: tres componentes en kN, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(9, -1, 4)'
            mensaje: |
              Has multiplicado por $[R]$ sin trasponer: eso es ir otra vez de
              O$xyz$ a O$x'y'z'$. Para volver se usa $[R]^{t}$ (ec. 2.23), que
              es la inversa porque $[R]$ es ortogonal.
          - valor: '(28, -7, 63)'
            mensaje: |
              Te has dejado el $\tfrac17$ de los unitarios: $(6, 2, 3)$ mide 7.
              Con él, el módulo de la fuerza saldría siete veces mayor.
          - valor: '(7, 0, 7)'
            mensaje: |
              Son las componentes en O$x'y'z'$. La fuerza es la misma, pero en
              los otros ejes sus componentes son otras.
        pista: |
          $\{F\}_{Oxyz} = [R]^{t}\{F\}_{Ox'y'z'}$ (ec. 2.23): las columnas de
          $[R]^{t}$ son $\hat i'$, $\hat j'$ y $\hat k'$.
        desarrollo: |
          Con $[R]^{t}$, el vector es la suma de los unitarios girados por sus
          componentes, en kN:

          $$
          \vec F = 7\,\hat i' + 0\,\hat j' + 7\,\hat k' = (6, 2, 3) + (-2, -3, 6) = (4, -1, 9)
          $$

          Comprobación: $[R]\{4, -1, 9\}$ devuelve $(7, 0, 7)$; por ejemplo,
          la primera fila da $\tfrac17(6\cdot4 + 2\cdot(-1) + 3\cdot9) = 7$.
          Y el módulo se conserva: $4^{2} + 1^{2} + 9^{2} = 98 = 7^{2} + 7^{2}$,
          en kN².
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Un mismo vector cumple $\{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz}$
              (ec. 2.22).
          - texto: >-
              Y también, de vuelta, $\{v\}_{Oxyz} = [R]^{t}\{v\}_{Ox'y'z'}$
              (ec. 2.23).
          - texto: >-
              Sustituyendo la segunda en la primera,
              $\{v\}_{Ox'y'z'} = [R][R]^{t}\{v\}_{Ox'y'z'}$.
          - texto: >-
              Como eso vale para cualquier vector, $[R][R]^{t} = [I]$; del
              mismo modo, $[R]^{t}[R] = [I]$.
          - texto: >-
              Luego $[R]^{t} = [R]^{-1}$: la matriz es ortogonal.
          - texto: >-
              Basta con comprobarlo con un vector: si
              $[R][R]^{t}\{v\} = \{v\}$ para uno, entonces $[R][R]^{t} = [I]$.
            trampa: true
            mensaje: |
              Con un vector solo no: cualquier giro alrededor de ese vector lo
              deja igual y no es $[I]$. La igualdad tiene que valer para
              todos los vectores, y eso es lo que dan las ecs. 2.22 y 2.23,
              que valen para cualquier $\vec v$.
    resolucion: |
      **Qué hay que demostrar.** Que la traspuesta de $[R]$ es su inversa,
      $[R]^{t} = [R]^{-1}$, o lo que es lo mismo,
      $[R]^{t}[R] = [R][R]^{t} = [I]$.

      **De dónde se parte** (apuntes del tema 2, apartado 2.4.2, pp. 13-14).
      Las componentes de un mismo vector en los dos sistemas cumplen

      $$
      \{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz} \quad \text{(ec. 2.22)} \qquad\qquad
      \{v\}_{Oxyz} = [R]^{t}\{v\}_{Ox'y'z'} \quad \text{(ec. 2.23)}
      $$

      **La demostración.** Sustituyendo la ec. 2.23 en la 2.22, y la 2.22 en
      la 2.23:

      $$
      \{v\}_{Ox'y'z'} = [R][R]^{t}\{v\}_{Ox'y'z'} \qquad\qquad
      \{v\}_{Oxyz} = [R]^{t}[R]\{v\}_{Oxyz}
      $$

      Como las dos valen para cualquier vector, las dos matrices son la
      identidad:

      $$
      [R]^{t}[R] = [R][R]^{t} = [I] \;\Longrightarrow\; [R]^{t} = [R]^{-1} \qquad \text{(ec. 2.24)}
      $$

      Según la ec. 2.24, la inversa y la traspuesta de $[R]$ son iguales, por
      lo que es ortogonal.

      **Por qué pasa.** Las filas de $[R]$ son $\hat i'$, $\hat j'$ y
      $\hat k'$ escritos en O$xyz$ (ec. 2.20). El término $(i, j)$ de
      $[R][R]^{t}$ es el producto escalar de dos de ellos: 1 si es el mismo
      unitario y 0 si son dos distintos, porque son perpendiculares. Eso es
      $[I]$.

      **Consecuencias.** Un giro conserva módulos y ángulos, y
      $(\det[R])^{2} = \det([R]^{t}[R]) = 1$: $\det[R] = +1$ con un triedro
      girado a derechas y $-1$ si se escoge a izquierdas. La diapositiva 18 del
      tema titula esta propiedad como «$[R] = [R]^{T}$», que es una errata:
      su desarrollo prueba $[R][R]^{T} = [I]$ y $[R]^{T}[R] = [I]$.

      **Un ejemplo nuestro.** Con $\hat i' = \tfrac17(6, 2, 3)$,
      $\hat j' = \tfrac17(-3, 6, 2)$ y $\hat k' = \tfrac17(-2, -3, 6)$, la
      fuerza de componentes $(7, 0, 7)$ kN en O$x'y'z'$ vale en O$xyz$

      $$
      [R]^{t}\{F\}_{Ox'y'z'} = 7\,\hat i' + 7\,\hat k' = (4, -1, 9)
      $$

      en kN, y $[R]$ la devuelve a $(7, 0, 7)$.

      **Comprobaciones.** Con el motor del curso, $[R][R]^{t}$ y
      $[R]^{t}[R]$ salen $[I]$ y $\det[R] = 1$; la fuerza sale igual con
      $[R]^{t}\{F\}$ y como suma de los unitarios girados, y su módulo es
      $\sqrt{98}$ kN en los dos sistemas.
  # ── Cuestión 7 de autoevaluación del tema 2 · los dos planteamientos del problema de las principales.
  - id: ejerm2-cu7-los-dos-planteamientos-de-las-principales
    titulo: Direcciones y tensiones principales, planteadas de dos maneras
    fuente: >-
      Cuestión 7 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.3,
      «Dos formulaciones del problema» (pp. 15-16, ecs. 2.29 a 2.33). Se
      parece a la pregunta 3 de teoría del primer parcial de 2013-2014, que
      lo pide como una demostración. El ejemplo es nuestro, comprobado con el
      motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      7. Direcciones y tensiones principales. Dos planteamientos del problema.
    pide: >-
      Los dos planteamientos del problema de las tensiones y direcciones
      principales, cada uno con su ecuación, y a qué llevan.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos planteamientos son dos preguntas distintas sobre los planos
          que pasan por un punto. ¿Cuáles?
        opciones:
          - texto: >-
              ¿En qué planos es nula la tangencial? y ¿en qué direcciones es
              estacionaria la tensión normal?
            correcta: true
            mensaje: |
              Eso es (apuntes, pp. 15-16). La primera lleva a un problema de
              autovalores y autovectores; la segunda, a un extremo condicionado
              que acaba en el mismo problema. Por eso las dos dan las mismas
              direcciones.
          - texto: >-
              ¿En qué planos es máxima la tangencial? y ¿en cuáles es nula la
              normal?
            mensaje: |
              La tangencial máxima es otro problema (ecs. 2.48 a 2.50), que ni
              siquiera es lineal, y sus planos están a 45° de los principales.
              Y un plano con $\sigma_n = 0$ no tiene por qué ser principal.
          - texto: >-
              ¿Qué raíces tiene la ecuación característica? y ¿qué dirección
              sale de cada raíz?
            mensaje: |
              Esos son los dos pasos para **resolver** el problema una vez
              planteado (ecs. 2.34 a 2.37). La cuestión pide antes: de qué dos
              maneras se llega a plantearlo.
          - texto: >-
              ¿En qué ejes es diagonal el tensor? y ¿en cuáles es nula su
              traza?
            mensaje: |
              Que el tensor sea diagonal en ejes principales es una
              consecuencia (ec. 2.47). Y la traza es $I_1$, un invariante: vale
              lo mismo en todos los ejes.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe los dos planteamientos como en un examen, cada uno con su
          condición y su ecuación, y di a qué llevan los dos.
        rubrica:
          - punto: >-
              Primer planteamiento: buscar los planos sin tangencial. Si
              τn = 0, el vector tensión solo tiene componente normal:
              S⃗n = σn n̂, {Sn} = σn{n} (ec. 2.29).
            porque: >-
              Es la primera pregunta, la que da nombre a los planos
              principales.
            minimo: true
          - punto: >-
              Como también se cumple {Sn} = [σ]{n} (ec. 2.14), queda
              ([σ] − σn[I]){n} = {0} (ec. 2.30): un problema de autovalores y
              autovectores.
            porque: >-
              Es a lo que lleva el primer planteamiento.
            minimo: true
          - punto: >-
              Segundo planteamiento: buscar las direcciones en que
              σn = {n}ᵗ[σ]{n} es estacionaria, con la condición {n}ᵗ{n} = 1;
              con un multiplicador, F({n}, λ) = {n}ᵗ[σ]{n} − λ({n}ᵗ{n} − 1)
              (ec. 2.31), y ∂F/∂{n} = 0 da 2[σ]{n} − 2λ{n} = {0} (ec. 2.32).
            porque: >-
              Es la segunda pregunta, un problema de máximos y mínimos
              condicionados.
            minimo: true
          - punto: >-
              Los dos llevan al mismo problema, ([σ] − λ[I]){n} = {0}
              (ec. 2.33), con λ = σn: en las direcciones principales las
              tensiones normales adoptan valores estacionarios.
            porque: >-
              Es la conclusión, y lo que justifica tener dos planteamientos.
            minimo: true
          - punto: >-
              Las tres soluciones son las tensiones principales, sus
              direcciones son las direcciones principales, y los planos
              perpendiculares a ellas, los planos principales.
            porque: >-
              Son los nombres que usa el resto del tema.
          - punto: >-
              Sin la condición {n}ᵗ{n} = 1 el segundo planteamiento no
              funciona: σn crecería sin límite con el tamaño de {n}.
            porque: >-
              Explica por qué hace falta el multiplicador.
      - tipo: calcular
        titulo: El vector tensión de una dirección
        pregunta: |
          Un ejemplo nuestro: en un punto, el tensor de tensiones es

          $$
          [\sigma] = \begin{bmatrix} -5 & 38 & -4\\ 38 & 10 & 34\\ -4 & 34 & 31 \end{bmatrix}\ \text{MPa}
          $$

          ¿Cuánto vale el vector tensión $\{S_n\}$ del plano de normal
          $\hat n = \tfrac13(1, 2, 2)$, en MPa?
        respuesta:
          tipo: vector
          valor: '(21, 42, 42)'
          tolerancia: 0.05
          formato: tres componentes en MPa, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(63, 126, 126)'
            mensaje: |
              Has multiplicado por $(1, 2, 2)$ sin dividir entre su módulo, 3.
              La ecuación de Cauchy usa la normal unitaria.
          - valor: '(-1.667, 6.667, 20.667)'
            mensaje: |
              Solo has usado la diagonal, $S_x = \sigma_x n_x$. Cada componente
              de $\{S_n\}$ es una fila entera de $[\sigma]$ por $\{n\}$, con
              las tangenciales.
        pista: |
          $\{S_n\} = [\sigma]\{n\}$ (ec. 2.14): cada componente, una fila por
          $\tfrac13(1, 2, 2)$.
        desarrollo: |
          En MPa:

          $$
          S_x = \frac{-5\cdot1 + 38\cdot2 - 4\cdot2}{3} = 21 \qquad
          S_y = \frac{38\cdot1 + 10\cdot2 + 34\cdot2}{3} = 42 \qquad
          S_z = \frac{-4\cdot1 + 34\cdot2 + 31\cdot2}{3} = 42
          $$

          Es $(21, 42, 42) = 63\cdot\tfrac13(1, 2, 2)$: paralelo a la
          normal. En ese plano la tangencial es nula, y la dirección
          $\tfrac13(1, 2, 2)$ es principal, como pide el primer planteamiento.
      - tipo: calcular
        titulo: El multiplicador del segundo planteamiento
        pregunta: |
          En el segundo planteamiento, ¿cuánto vale el multiplicador $\lambda$
          en la dirección $\hat n = \tfrac13(1, 2, 2)$, en MPa?
        respuesta:
          tipo: numero
          valor: '63'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '126'
            mensaje: |
              Has derivado $\lambda\{n\}^{t}\{n\}$ como $\lambda\{n\}$, sin el 2.
              Las dos derivadas llevan su 2 (ec. 2.32) y se van:
              $[\sigma]\{n\} = \lambda\{n\}$.
          - valor: '31.5'
            mensaje: |
              Has derivado $\{n\}^{t}[\sigma]\{n\}$ como $[\sigma]\{n\}$, sin el 2.
              Las dos derivadas llevan su 2 (ec. 2.32) y se van:
              $[\sigma]\{n\} = \lambda\{n\}$.
          - valor: '21'
            mensaje: |
              Esa es la componente $S_x$. El multiplicador es el número que
              multiplica a $\{n\}$: $[\sigma]\{n\} = \lambda\{n\}$, y
              $21 = \lambda\cdot\tfrac13$.
        pista: |
          La ec. 2.33 es $([\sigma] - \lambda[I])\{n\} = \{0\}$, con
          $\lambda = \sigma_n$.
        desarrollo: |
          De la ec. 2.33, $[\sigma]\{n\} = \lambda\{n\}$, y con el vector del
          paso anterior, $(21, 42, 42) = \lambda\cdot\tfrac13(1, 2, 2)$. O
          bien, $\lambda = \sigma_n = \{n\}^{t}\{S_n\}$, en MPa:

          $$
          \lambda = \frac{1\cdot21 + 2\cdot42 + 2\cdot42}{3} = \frac{189}{3} = 63
          $$

          El multiplicador es la tensión normal estacionaria: la principal
          de esa dirección.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Primera pregunta: ¿hay planos sin tangencial? Si $\tau_n = 0$,
              $\{S_n\} = \sigma_n\{n\}$.
          - texto: >-
              Con la ecuación de Cauchy, $[\sigma]\{n\} = \sigma_n\{n\}$, es
              decir, $([\sigma] - \sigma_n[I])\{n\} = \{0\}$.
          - texto: >-
              Segunda pregunta: ¿en qué direcciones es estacionaria
              $\sigma_n = \{n\}^{t}[\sigma]\{n\}$, con $\{n\}^{t}\{n\} = 1$?
          - texto: >-
              Con el multiplicador $\lambda$, la condición de estacionario es
              $2[\sigma]\{n\} - 2\lambda\{n\} = \{0\}$.
          - texto: >-
              Es el mismo sistema, con $\lambda = \sigma_n$: las direcciones
              sin tangencial son las de normal estacionaria.
          - texto: >-
              Son dos familias distintas de direcciones: en unas la tangencial
              es nula y en las otras la normal es máxima o mínima.
            trampa: true
            mensaje: |
              Son las mismas: los dos planteamientos acaban en
              $([\sigma] - \lambda[I])\{n\} = \{0\}$ con $\lambda = \sigma_n$
              (ecs. 2.30 y 2.33). En el ejemplo, la dirección
              $\tfrac13(1, 2, 2)$ tiene tangencial nula y normal estacionaria,
              63 MPa, a la vez.
    resolucion: |
      **Primer planteamiento: la tangencial nula** (apuntes del tema 2,
      apartado 2.4.3, p. 15). Conocido el tensor, se quiere saber si en
      algún plano la componente tangencial es nula. Entonces el vector
      tensión solo tiene componente normal:

      $$
      \tau_n = 0 \;\Longrightarrow\; \vec S_n = \sigma_n\hat n \;\Longrightarrow\; \{S_n\} = \sigma_n\{n\} \qquad \text{(ec. 2.29)}
      $$

      Como también debe cumplir $\{S_n\} = [\sigma]\{n\}$ (ec. 2.14):

      $$
      \sigma_n\{n\} = [\sigma]\{n\} \;\Longrightarrow\; ([\sigma] - \sigma_n[I])\{n\} = \{0\} \qquad \text{(ec. 2.30)}
      $$

      un problema de autovalores y autovectores. Las tres tensiones que lo
      cumplen son las tensiones principales; sus direcciones, las
      direcciones principales; y los planos perpendiculares a ellas, los
      planos principales.

      **Segundo planteamiento: la normal estacionaria** (pp. 15-16). Ahora se
      quiere saber si $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ (ec. 2.16) adopta
      valor estacionario en alguna dirección. Es un problema de máximos y
      mínimos condicionados, con la variable $\{n\}$ y la condición
      $\{n\}^{t}\{n\} = 1$. La función lagrangeana es

      $$
      F(\{n\}, \lambda) = \{n\}^{t}[\sigma]\{n\} - \lambda\left(\{n\}^{t}\{n\} - 1\right) \qquad \text{(ec. 2.31)}
      $$

      y los valores estacionarios salen de

      $$
      \frac{\partial F(\{n\}, \lambda)}{\partial\{n\}} = 0 \;\Longrightarrow\; 2[\sigma]\{n\} - 2\lambda\{n\} = \{0\} \qquad \text{(ec. 2.32)}
      $$

      **A qué llevan los dos.** Ordenando la ec. 2.32 sale el mismo problema
      que la 2.30, con $\lambda = \sigma_n$:

      $$
      ([\sigma] - \lambda[I])\{n\} = \{0\} \qquad \text{(ec. 2.33)}
      $$

      Por tanto, en las direcciones principales las tensiones normales
      adoptan valores estacionarios: los planos sin tangencial y las
      direcciones de normal estacionaria son los mismos.

      **Un ejemplo nuestro.** Con el tensor de los pasos, la
      dirección $\tfrac13(1, 2, 2)$ da $\{S_n\} = (21, 42, 42)$ MPa, que es
      $63\cdot\tfrac13(1, 2, 2)$: tangencial nula, y $\lambda = \sigma_n = 63$
      MPa. Las otras dos principales son 18 MPa, en
      $\tfrac13(2, 1, -2)$, y $-45$ MPa, en $\tfrac13(2, -2, 1)$. Estacionaria
      no siempre quiere decir máxima o mínima (esto es nuestro, no de los
      apuntes): en la dirección de 63 MPa la normal es máxima, en la de
      $-45$ mínima, y en la de 18 sube hacia la primera y baja hacia la
      tercera, sin ser ni una cosa ni otra.

      **Comprobaciones.** El motor del curso da como principales 63, 18 y
      $-45$ MPa; el vector tensión sale igual a mano, fila por fila, y es
      paralelo a la normal. Y, girando un poco la normal desde cada
      dirección principal, $\sigma_n$ se mueve como dice el párrafo
      anterior.
  # ── Cuestión 8 de autoevaluación del tema 2 · la ecuación característica y los invariantes.
  - id: ejerm2-cu8-la-ecuacion-caracteristica-y-los-invariantes
    titulo: La ecuación característica y los invariantes del tensor
    fuente: >-
      Cuestión 8 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.3,
      «Resolución del problema e invariantes» (pp. 16-17, ecs. 2.33 a 2.37),
      con los invariantes desarrollados como en las diapositivas del tema.
      El ejemplo es nuestro, comprobado con el motor del curso y por un
      segundo camino.
    nivel: practica
    enunciado: |
      8. Direcciones y tensiones principales. Dada la ecuación reducida del
      problema de autovalores y autovectores, deducir la ecuación
      característica y los invariantes del tensor de tensiones.
    pide: >-
      La ecuación característica y los tres invariantes del tensor,
      deducidos, y por qué no dependen de los ejes.
    pasos:
      - tipo: reconocer
        pregunta: |
          Desarrollada, $([\sigma] - \sigma_n[I])\{n\} = \{0\}$ es un sistema
          de tres ecuaciones en $n_x$, $n_y$, $n_z$ (ec. 2.34). ¿Por qué tiene
          que anularse su determinante?
        opciones:
          - texto: >-
              Porque el sistema es homogéneo, y solo tiene una solución
              distinta de $\{n\} = \{0\}$ si su determinante es nulo
            correcta: true
            mensaje: |
              Eso es (p. 16). Y $\{n\} = \{0\}$ no sirve: no es una dirección,
              ni cumple $n_x^{2} + n_y^{2} + n_z^{2} = 1$. Las $\sigma_n$ que
              anulan el determinante son las tensiones principales.
          - texto: >-
              Porque las tensiones principales tienen que sumar cero
            mensaje: |
              Las tres principales suman $I_1 = \sigma_x + \sigma_y + \sigma_z$,
              que puede valer cualquier cosa. El determinante se anula por
              otra razón: el sistema no tiene término independiente.
          - texto: >-
              Porque la matriz $[\sigma]$ es simétrica
            mensaje: |
              La simetría sirve para otras cosas: que las principales sean
              reales y sus direcciones perpendiculares. Que haya que anular el
              determinante viene de que el sistema es homogéneo, y pasaría
              igual con una matriz no simétrica.
          - texto: >-
              Porque $\{n\}$ tiene que ser unitario
            mensaje: |
              La condición de módulo unitario (ec. 2.37) se usa después, para
              fijar los cosenos directores de cada dirección una vez conocida
              su tensión principal. No es la que da la ecuación.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en un examen: de la ecuación reducida a la
          ecuación característica, los tres invariantes y por qué lo son.
        rubrica:
          - punto: >-
              Desarrollada, ([σ] − σn[I]){n} = {0} es un sistema homogéneo de
              tres ecuaciones en nx, ny, nz (ec. 2.34).
            porque: >-
              Es el punto de partida que da el enunciado, escrito con sus
              componentes.
            minimo: true
          - punto: >-
              Para que tenga una solución distinta de la trivial {n} = {0},
              el determinante del sistema tiene que ser nulo.
            porque: >-
              Es la idea de la que sale la ecuación.
            minimo: true
          - punto: >-
              Desarrollando el determinante sale la ecuación característica,
              σn³ − I1σn² + I2σn − I3 = 0 (ec. 2.35).
            porque: >-
              Es la primera mitad de lo que se pide.
            minimo: true
          - punto: >-
              I1 = σx + σy + σz; I2, la suma de los tres menores de 2×2 de la
              diagonal; e I3, el determinante de [σ] (ec. 2.36).
            porque: >-
              Es la segunda mitad: los coeficientes, cada uno con su forma.
            minimo: true
          - punto: >-
              Las raíces, las tensiones principales, no dependen del sistema
              de referencia; por eso tampoco los coeficientes de la ecuación:
              I1, I2 e I3 son invariantes.
            porque: >-
              Es el porqué del nombre, que la cuestión también pide.
            minimo: true
          - punto: >-
              Desarrollados, I2 = σxσy + σxσz + σyσz − τxz² − τxy² − τyz² e
              I3 = σxσyσz + 2τxyτyzτxz − σxτyz² − σyτxz² − σzτxy²; y en ejes
              principales, I1 = σ1 + σ2 + σ3, I2 = σ1σ2 + σ2σ3 + σ3σ1,
              I3 = σ1σ2σ3.
            porque: >-
              Son las formas que se usan para calcular y para comprobar unas
              principales.
      - tipo: calcular
        titulo: El segundo invariante
        pregunta: |
          Un ejemplo nuestro: en un punto, el tensor de tensiones es

          $$
          [\sigma] = \begin{bmatrix} 44 & 44 & 4\\ 44 & 26 & 40\\ 4 & 40 & 2 \end{bmatrix}\ \text{MPa}
          $$

          ¿Cuánto vale su segundo invariante, $I_2$, en MPa²?
        respuesta:
          tipo: numero
          valor: '-2268'
          tolerancia: 0.5
          formato: un número, en MPa²
        distractores:
          - valor: '4836'
            mensaje: |
              Has sumado los cuadrados de las tangenciales. Cada menor de 2×2
              es $\sigma_x\sigma_y - \tau_{xy}^{2}$: las tangenciales restan.
          - valor: '1284'
            mensaje: |
              Te has dejado las tangenciales: eso es solo
              $\sigma_x\sigma_y + \sigma_x\sigma_z + \sigma_y\sigma_z$. Cada
              menor resta el cuadrado de su tangencial.
        pista: |
          $I_2$ es la suma de los tres menores de 2×2 de la diagonal
          (ec. 2.36): $\sigma_x\sigma_y - \tau_{xy}^{2}$,
          $\sigma_x\sigma_z - \tau_{zx}^{2}$ y $\sigma_y\sigma_z - \tau_{yz}^{2}$.
        desarrollo: |
          Los tres menores, en MPa²:

          $$
          44\cdot26 - 44^{2} = -792 \qquad 44\cdot2 - 4^{2} = 72 \qquad 26\cdot2 - 40^{2} = -1548
          $$

          y su suma, $I_2 = -792 + 72 - 1548 = -2268$ MPa².
      - tipo: calcular
        titulo: El tercer invariante
        pregunta: |
          ¿Y el tercero, $I_3 = \det[\sigma]$, en MPa³?
        respuesta:
          tipo: numero
          valor: '-58320'
          tolerancia: 1
          formato: un número, en MPa³
        distractores:
          - valor: '-65360'
            mensaje: |
              Te falta el 2 del término cruzado: en el desarrollo del
              determinante simétrico aparece $2\tau_{xy}\tau_{yz}\tau_{zx}$,
              porque el producto de las tres tangenciales sale dos veces.
          - valor: '-86480'
            mensaje: |
              El término de las tres tangenciales suma, no resta:
              $I_3 = \sigma_x\sigma_y\sigma_z + 2\tau_{xy}\tau_{yz}\tau_{zx} - \sigma_x\tau_{yz}^{2} - \sigma_y\tau_{zx}^{2} - \sigma_z\tau_{xy}^{2}$.
        pista: |
          Desarrollado,
          $I_3 = \sigma_x\sigma_y\sigma_z + 2\tau_{xy}\tau_{yz}\tau_{zx} - \sigma_x\tau_{yz}^{2} - \sigma_y\tau_{zx}^{2} - \sigma_z\tau_{xy}^{2}$.
        desarrollo: |
          En MPa³:

          $$
          I_3 = 44\cdot26\cdot2 + 2\cdot44\cdot40\cdot4 - 44\cdot40^{2} - 26\cdot4^{2} - 2\cdot44^{2} = -58320
          $$

          término a término, $2288 + 14080 - 70400 - 416 - 3872 = -58320$.
      - tipo: calcular
        titulo: Las tres principales, con una conocida
        pregunta: |
          Se sabe que 90 MPa es una de las tensiones principales de ese
          tensor. Con los invariantes, ¿cuáles son las tres, ordenadas de
          mayor a menor, en MPa?
        respuesta:
          tipo: vector
          valor: '(90, 18, -36)'
          tolerancia: 0.05
          formato: tres valores en MPa, de mayor a menor, entre paréntesis y separados por comas, con punto decimal
        distractores:
          - valor: '(90, -36, 18)'
            mensaje: |
              Son las tres, pero sin ordenar: los apuntes ordenan
              $\sigma_1 > \sigma_2 > \sigma_3$ (p. 17), y $\sigma_2 = 18$ MPa.
          - valor: '(90, 36, -18)'
            mensaje: |
              Te ha salido $\sigma_2 + \sigma_3$ con el signo cambiado: es
              $I_1 - 90 = 72 - 90 = -18$, no $+18$.
        pista: |
          Si $\sigma_1 = 90$, entonces $\sigma_2 + \sigma_3 = I_1 - 90$ y
          $\sigma_2\sigma_3 = I_3/90$: las otras dos son las raíces de una
          ecuación de segundo grado.
        desarrollo: |
          $I_1 = 44 + 26 + 2 = 72$ MPa. Las otras dos cumplen, en MPa y MPa²,

          $$
          \sigma_2 + \sigma_3 = 72 - 90 = -18 \qquad \sigma_2\sigma_3 = \frac{-58320}{90} = -648
          $$

          y son las raíces de $\sigma^{2} + 18\sigma - 648 = 0$:

          $$
          \sigma = \frac{-18 \pm \sqrt{18^{2} + 4\cdot648}}{2} = \frac{-18 \pm 54}{2}
          $$

          es decir, 18 y $-36$ MPa. Comprobación con $I_2$:
          $90\cdot18 + 18\cdot(-36) + (-36)\cdot90 = -2268$, en MPa².
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación reducida, $([\sigma] - \sigma_n[I])\{n\} = \{0\}$, es
              un sistema homogéneo en $n_x$, $n_y$, $n_z$.
          - texto: >-
              $\{n\} = \{0\}$ no es una dirección: hace falta otra solución, y
              para eso el determinante del sistema tiene que ser nulo.
          - texto: >-
              Desarrollado, el determinante da
              $\sigma_n^{3} - I_1\sigma_n^{2} + I_2\sigma_n - I_3 = 0$.
          - texto: >-
              Sus raíces son las tensiones principales, que no dependen de los
              ejes.
          - texto: >-
              Por tanto, tampoco sus coeficientes: $I_1$, $I_2$ e $I_3$ son
              invariantes.
          - texto: >-
              Los invariantes cambian al girar los ejes, porque $\sigma_x$,
              $\sigma_y$ y $\sigma_z$ cambian.
            trampa: true
            mensaje: |
              Cambian las componentes, pero no esas combinaciones de ellas: en
              el ejemplo, $I_1 = 44 + 26 + 2 = 72$ MPa en $xyz$, y en ejes
              principales $90 + 18 - 36 = 72$ MPa. Si cambiaran, cambiarían las
              raíces de la ecuación, y las tensiones principales de un punto
              dependerían de los ejes.
    resolucion: |
      **La ecuación reducida, desarrollada** (apuntes del tema 2, apartado
      2.4.3, p. 16). Con $\lambda = \sigma_n$, la ec. 2.33 escrita con sus
      componentes es

      $$
      \begin{bmatrix} (\sigma_x - \sigma_n) & \tau_{xy} & \tau_{zx}\\ \tau_{xy} & (\sigma_y - \sigma_n) & \tau_{yz}\\ \tau_{zx} & \tau_{yz} & (\sigma_z - \sigma_n) \end{bmatrix}
      \begin{Bmatrix} n_x\\ n_y\\ n_z \end{Bmatrix} = \begin{Bmatrix} 0\\ 0\\ 0 \end{Bmatrix} \qquad \text{(ec. 2.34)}
      $$

      **La ecuación característica.** La ec. 2.34 es un sistema homogéneo, y
      para que tenga una solución distinta de la trivial nula su
      determinante tiene que ser nulo. Desarrollándolo:

      $$
      \sigma_n^{3} - I_1\sigma_n^{2} + I_2\sigma_n - I_3 = 0 \qquad \text{(ec. 2.35)}
      $$

      **Los invariantes** (p. 17). Las raíces de la ecuación característica
      son las tensiones principales, y no dependen del sistema de referencia
      utilizado. En consecuencia, $I_1$, $I_2$ e $I_3$ son invariantes. Para
      cualquier sistema con origen en O:

      $$
      I_1 = \sigma_x + \sigma_y + \sigma_z \qquad
      I_2 = \begin{vmatrix} \sigma_x & \tau_{xy}\\ \tau_{xy} & \sigma_y \end{vmatrix} +
      \begin{vmatrix} \sigma_x & \tau_{zx}\\ \tau_{zx} & \sigma_z \end{vmatrix} +
      \begin{vmatrix} \sigma_y & \tau_{yz}\\ \tau_{yz} & \sigma_z \end{vmatrix} \qquad
      I_3 = \det[\sigma] \qquad \text{(ec. 2.36)}
      $$

      Desarrollados, como en las diapositivas del tema:
      $I_2 = \sigma_x\sigma_y + \sigma_x\sigma_z + \sigma_y\sigma_z - \tau_{xz}^{2} - \tau_{xy}^{2} - \tau_{yz}^{2}$
      e
      $I_3 = \sigma_x\sigma_y\sigma_z + 2\tau_{xy}\tau_{yz}\tau_{xz} - \sigma_x\tau_{yz}^{2} - \sigma_y\tau_{xz}^{2} - \sigma_z\tau_{xy}^{2}$.
      En ejes principales, donde el tensor es diagonal, quedan
      $I_1 = \sigma_1 + \sigma_2 + \sigma_3$,
      $I_2 = \sigma_1\sigma_2 + \sigma_2\sigma_3 + \sigma_3\sigma_1$ e
      $I_3 = \sigma_1\sigma_2\sigma_3$.

      **Después** (p. 17). Cada tensión principal se sustituye en la
      ec. 2.34 para sacar su dirección; como al menos una de sus ecuaciones
      es combinación lineal de las otras, se completa con
      $n_x^{2} + n_y^{2} + n_z^{2} = 1$ (ec. 2.37). Se ordenan
      $\sigma_1 > \sigma_2 > \sigma_3$.

      **Un ejemplo nuestro.** Con el tensor de los pasos, en MPa, MPa² y
      MPa³: $I_1 = 72$, $I_2 = -2268$ e $I_3 = -58320$. Sabiendo que 90 MPa
      es principal, las otras dos suman $72 - 90 = -18$ y su producto es
      $-58320/90 = -648$: son 18 y $-36$ MPa.

      **Comprobaciones.** El motor del curso da los mismos invariantes y las
      principales 90, 18 y $-36$ MPa. Con ellas, a mano:
      $90 + 18 - 36 = 72$, $1620 - 648 - 3240 = -2268$ y
      $90\cdot18\cdot(-36) = -58320$. El tensor se montó con esas
      principales en las direcciones $\tfrac13(2, 2, 1)$,
      $\tfrac13(-2, 1, 2)$ y $\tfrac13(1, -2, 2)$.
  # ── Cuestión 10 de autoevaluación del tema 2 · las tensiones principales son reales.
  - id: ejerm2-cu10-las-tensiones-principales-son-reales
    titulo: Las tensiones principales son reales
    fuente: >-
      Cuestión 10 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.3,
      «Las tensiones principales son números reales» (pp. 17-18, ecs. 2.35 y
      2.38 a 2.43). Las ecs. 2.42 y 2.43 escriben «> 0» donde la condición
      es «≥ 0»: ver la resolución. El ejemplo es nuestro, comprobado con el
      motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      10. Demostrar que las tensiones principales son reales.
    pide: >-
      La demostración de que las tres raíces de la ecuación característica
      son números reales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la demostración de los apuntes, las otras dos raíces salen de una
          ecuación de segundo grado (ec. 2.40). ¿Qué hace que su discriminante
          no pueda ser negativo?
        opciones:
          - texto: >-
              Que el tensor es simétrico: el mismo $\tau_{yz}$ está a los dos
              lados de la diagonal, y el discriminante queda como una suma de
              cuadrados
            correcta: true
            mensaje: |
              Eso es (ecs. 2.42 y 2.43). Con $\tau_{yz}$ en las dos posiciones,
              el discriminante es $(\sigma_y - \sigma_z)^{2} + (2\tau_{yz})^{2}$.
              Si las dos tangenciales fueran distintas, sería
              $(\sigma_y - \sigma_z)^{2} + 4\tau_{yz}\tau_{zy}$, que con signos
              opuestos puede ser negativo.
          - texto: >-
              Que las tensiones normales son positivas
            mensaje: |
              Las normales pueden tener cualquier signo: en el ejemplo de los
              pasos, $\sigma_z = -20$ MPa. El discriminante no depende de sus
              signos, sino de su diferencia y de la tangencial.
          - texto: >-
              Que $\sigma_y$ y $\sigma_z$ son distintas
            mensaje: |
              Si son iguales, el discriminante es $(2\tau_{yz})^{2}$, que
              tampoco es negativo. Con $\sigma_y = \sigma_z$ y $\tau_{yz} = 0$
              es cero, y las dos raíces coinciden: son reales igual.
          - texto: >-
              Que los coeficientes de la ecuación característica son reales
            mensaje: |
              Eso solo asegura una raíz real de la cúbica: las otras dos
              podrían ser complejas conjugadas. Es justo lo que hay que
              descartar.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen, desde la ecuación
          característica hasta la conclusión.
        rubrica:
          - punto: >-
              La ecuación característica (ec. 2.35) es cúbica con coeficientes
              reales: o sus tres raíces son reales, o una es real y las otras
              dos complejas conjugadas.
            porque: >-
              Es lo que hay que decidir, y de dónde sale que al menos una es
              real.
            minimo: true
          - punto: >-
              Se toma el eje x en la dirección de esa raíz real: x es
              principal, τxy = τzx = 0, y el determinante queda como en la
              ec. 2.38.
            porque: >-
              Es el truco de la demostración: separa la raíz conocida de las
              otras dos.
            minimo: true
          - punto: >-
              Las otras dos salen del bloque yz (ec. 2.39):
              σn² − (σy + σz)σn − (τyz² − σyσz) = 0 (ec. 2.40), de raíces la
              ec. 2.41.
            porque: >-
              Es la ecuación de segundo grado cuyo discriminante decide.
            minimo: true
          - punto: >-
              Su discriminante, (σy + σz)² − 4(σyσz − τyz²) (ec. 2.42), es
              igual a (σy − σz)² + (2τyz)² (ec. 2.43): una suma de cuadrados,
              que no puede ser negativa. Las tres raíces son reales.
            porque: >-
              Es la conclusión, con la cuenta que la justifica.
            minimo: true
          - punto: >-
              La suma de cuadrados sale porque el tensor es simétrico: el mismo
              τyz está encima y debajo de la diagonal.
            porque: >-
              Es lo que de verdad se usa, aunque los apuntes no lo digan con
              esas palabras.
          - punto: >-
              El discriminante es cero si σy = σz y τyz = 0: dos raíces iguales,
              reales. La condición es ≥ 0, no > 0 como escriben las
              ecs. 2.42 y 2.43.
            porque: >-
              Es el caso de dos principales iguales, que también existe.
      - tipo: calcular
        titulo: El discriminante del bloque yz
        pregunta: |
          Un ejemplo nuestro, con $x$ ya principal: $\sigma_x = 25$,
          $\sigma_y = 50$, $\sigma_z = -20$ y $\tau_{yz} = 12$ MPa, con
          $\tau_{xy} = \tau_{zx} = 0$. ¿Cuánto vale el discriminante de la
          ec. 2.41, $(\sigma_y + \sigma_z)^{2} + 4(\tau_{yz}^{2} - \sigma_y\sigma_z)$,
          en MPa²?
        respuesta:
          tipo: numero
          valor: '5476'
          tolerancia: 0.5
          formato: un número, en MPa²
        distractores:
          - valor: '4324'
            mensaje: |
              Te ha salido $(\sigma_y + \sigma_z)^{2} - 4(\sigma_y\sigma_z + \tau_{yz}^{2})$:
              has cambiado el signo de $\tau_{yz}^{2}$. Dentro del paréntesis
              es $\tau_{yz}^{2} - \sigma_y\sigma_z = 144 + 1000$.
          - valor: '2044'
            mensaje: |
              Te has dejado el 4: es $(\sigma_y + \sigma_z)^{2}$ más **cuatro**
              veces $(\tau_{yz}^{2} - \sigma_y\sigma_z)$.
          - valor: '5188'
            mensaje: |
              Has escrito $(2\tau_{yz})^{2}$ como $2\tau_{yz}^{2}$. En la forma de la
              ec. 2.43, el segundo cuadrado es $(2\cdot12)^{2} = 576$.
        pista: |
          Con $\sigma_y\sigma_z = 50\cdot(-20)$, ojo al signo; o con la
          ec. 2.43, $(\sigma_y - \sigma_z)^{2} + (2\tau_{yz})^{2}$.
        desarrollo: |
          En MPa²:

          $$
          (50 - 20)^{2} + 4\left(12^{2} + 1000\right) = 900 + 4576 = 5476
          $$

          y con la ec. 2.43, la misma cifra como suma de cuadrados:

          $$
          (50 + 20)^{2} + (2\cdot12)^{2} = 4900 + 576 = 5476
          $$
      - tipo: calcular
        titulo: Las tres tensiones principales
        pregunta: |
          ¿Cuáles son las tres tensiones principales, ordenadas de mayor a
          menor, en MPa?
        respuesta:
          tipo: vector
          valor: '(52, 25, -22)'
          tolerancia: 0.05
          formato: tres valores en MPa, de mayor a menor, entre paréntesis y separados por comas, con punto decimal
        distractores:
          - valor: '(25, 52, -22)'
            mensaje: |
              Has puesto primero la de $x$ por ser la primera dirección. Se
              ordenan por su valor, $\sigma_1 > \sigma_2 > \sigma_3$ (p. 17):
              la de $x$, 25 MPa, queda en medio.
          - valor: '(25, 22, -52)'
            mensaje: |
              Te ha salido $-(\sigma_y + \sigma_z)$ delante de la raíz. En la
              ec. 2.41 es $\tfrac12\left[(\sigma_y + \sigma_z) \pm \sqrt{\ldots}\right]$,
              con $\sigma_y + \sigma_z = 30$ MPa.
        pista: |
          Una es $\sigma_x$; las otras dos, de la ec. 2.41 con el
          discriminante del paso anterior.
        desarrollo: |
          $\sqrt{5476} = 74$, y con la ec. 2.41, en MPa:

          $$
          \sigma = \frac{30 \pm 74}{2} \;\Longrightarrow\; \frac{30 + 74}{2} = 52 \quad\text{y}\quad \frac{30 - 74}{2} = -22
          $$

          Con la de $x$, 25 MPa, y ordenadas: 52, 25 y $-22$ MPa.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación característica es cúbica con coeficientes reales:
              tiene al menos una raíz real.
          - texto: >-
              Se toma $x$ en la dirección principal de esa raíz:
              $\tau_{xy} = \tau_{zx} = 0$.
          - texto: >-
              Las otras dos son las raíces de
              $\sigma_n^{2} - (\sigma_y + \sigma_z)\sigma_n - (\tau_{yz}^{2} - \sigma_y\sigma_z) = 0$.
          - texto: >-
              Su discriminante es $(\sigma_y - \sigma_z)^{2} + (2\tau_{yz})^{2}$,
              que no puede ser negativo.
          - texto: >-
              Luego las tres tensiones principales son reales.
          - texto: >-
              Como los coeficientes de la cúbica son reales, sus tres raíces lo
              son.
            trampa: true
            mensaje: |
              Eso solo asegura una: $\sigma^{3} + \sigma = 0$ tiene coeficientes
              reales y raíces 0, $i$ y $-i$. Las otras dos son reales por el
              discriminante del bloque $yz$, que es una suma de cuadrados
              porque el tensor es simétrico.
    resolucion: |
      **De dónde se parte** (apuntes del tema 2, apartado 2.4.3, p. 17). La
      ecuación característica,
      $\sigma_n^{3} - I_1\sigma_n^{2} + I_2\sigma_n - I_3 = 0$ (ec. 2.35), es
      cúbica, y hay dos posibilidades: que las tres raíces sean reales, o que
      una sea real y las otras dos complejas conjugadas.

      **La raíz real, en el eje x.** Como por lo menos una raíz es real, se
      supone que su dirección es $x$. Siendo $x$ dirección principal,
      $\tau_{xy} = \tau_{zx} = 0$, y la ecuación característica sale de

      $$
      \begin{vmatrix} (\sigma_x - \sigma_n) & 0 & 0\\ 0 & (\sigma_y - \sigma_n) & \tau_{yz}\\ 0 & \tau_{yz} & (\sigma_z - \sigma_n) \end{vmatrix} = 0 \qquad \text{(ec. 2.38)}
      $$

      **Las otras dos** (p. 18). Tienen que anular el bloque $yz$
      (ec. 2.39), que desarrollado da la ecuación de segundo grado

      $$
      \sigma_n^{2} - (\sigma_y + \sigma_z)\sigma_n - (\tau_{yz}^{2} - \sigma_y\sigma_z) = 0 \qquad \text{(ec. 2.40)}
      $$

      de raíces

      $$
      \sigma_n = \tfrac12\left[(\sigma_y + \sigma_z) \pm \sqrt{(\sigma_y + \sigma_z)^{2} + 4(\tau_{yz}^{2} - \sigma_y\sigma_z)}\right] \qquad \text{(ec. 2.41)}
      $$

      **El discriminante.** Para que las raíces sean reales, el discriminante
      no puede ser negativo:
      $(\sigma_y + \sigma_z)^{2} - 4(\sigma_y\sigma_z - \tau_{yz}^{2})$
      (ec. 2.42). Desarrollando el cuadrado,
      $\sigma_y^{2} + 2\sigma_y\sigma_z + \sigma_z^{2} - 4\sigma_y\sigma_z + 4\tau_{yz}^{2}$,
      que es una suma de dos cuadrados:

      $$
      (\sigma_y - \sigma_z)^{2} + (2\tau_{yz})^{2} \ge 0 \qquad \text{(ec. 2.43)}
      $$

      Se cumple siempre: las tres tensiones principales son reales.

      **Dos precisiones nuestras.** Los apuntes escriben «> 0» en las
      ecs. 2.42 y 2.43 y dicen que el discriminante «debe ser positivo».
      Basta con que no sea negativo, y la igualdad existe: con
      $\sigma_y = \sigma_z$ y $\tau_{yz} = 0$ las dos raíces coinciden, y
      siguen siendo reales (las diapositivas del tema escriben «≥ 0»). Y la
      suma de cuadrados sale porque el tensor es simétrico, con el mismo
      $\tau_{yz}$ encima y debajo de la diagonal: con dos tangenciales
      distintas, el último término sería $4\tau_{yz}\tau_{zy}$, que podría
      ser negativo.

      **Un ejemplo nuestro.** Con $\sigma_x = 25$, $\sigma_y = 50$,
      $\sigma_z = -20$ y $\tau_{yz} = 12$ MPa, el discriminante es
      $70^{2} + 24^{2} = 5476$ MPa², su raíz 74 MPa, y las principales,
      52, 25 y $-22$ MPa.

      **Comprobaciones.** El motor del curso da las mismas principales, y el
      discriminante sale igual con la ec. 2.42 y con la 2.43. Y los
      invariantes cuadran: $52 + 25 - 22 = 55 = 25 + 50 - 20$, en MPa.
  # ── Cuestión 11 de autoevaluación del tema 2 · tensión plana en función del ángulo doble.
  - id: ejerm2-cu11-tension-plana-en-funcion-del-angulo-doble
    titulo: Tensión plana, las componentes intrínsecas en función del ángulo doble
    fuente: >-
      Cuestión 11 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.5
      (pp. 21-23, ecs. 2.55 a 2.64 y fig. 2.11). La ec. 2.63 trae una
      errata, dicha en la resolución. El ejemplo es nuestro, comprobado con
      el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      11. Tensión plana. Determinar las componentes intrínsecas de cualquier
      plano que pasa por el punto O en función del ángulo doble.
    pide: >-
      σn y τn de un plano cualquiera que pasa por O, en tensión plana,
      deducidas y escritas en función de 2θ, con lo que significan θ y el
      signo de τn.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para tener $\sigma_n$ y $\tau_n$ de cualquier plano que pasa por O,
          ¿de qué se parte?
        opciones:
          - texto: >-
              Del vector tensión del plano de normal
              $\hat n = (\cos\theta, \sin\theta)$, por Cauchy, proyectado sobre
              $\hat n$ y sobre $\hat t$, la normal girada 90° en sentido
              antihorario
            correcta: true
            mensaje: |
              Eso es (ecs. 2.56 a 2.58 y fig. 2.11). Las proyecciones dan
              $\sigma_n$ y $\tau_n$ en función de $\theta$, y las identidades
              trigonométricas las pasan a $2\theta$. Como se proyecta sobre
              $\hat t$, $\tau_n$ sale con signo.
          - texto: >-
              De girar los ejes un ángulo $2\theta$ y aplicar a $\sigma_x$,
              $\sigma_y$, $\tau_{xy}$ la ley de cambio del tensor
            mensaje: |
              El plano está girado $\theta$, no $2\theta$. El ángulo doble no es
              un giro: aparece al final, al usar
              $\cos^{2}\theta = \tfrac12(1 + \cos2\theta)$ y sus compañeras.
          - texto: >-
              Del círculo de Mohr, que da el punto de cada plano
            mensaje: |
              Es al revés: el círculo sale de estas ecuaciones (ecs. 2.65 a
              2.67), elevando al cuadrado y sumando. Primero hay que tenerlas.
          - texto: >-
              De las tensiones principales del punto, que hay que calcular
              antes
            mensaje: |
              No hacen falta: las ecuaciones dan $\sigma_n$ y $\tau_n$ de
              cualquier plano a partir de $\sigma_x$, $\sigma_y$ y $\tau_{xy}$.
              Las principales salen después, de ellas (ec. 2.62).
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en un examen: qué es tensión plana, el
          plano y su ángulo, las proyecciones y el paso al ángulo doble.
        rubrica:
          - punto: >-
              En tensión plana σz = τyz = τzx = 0, y por Cauchy Snz = 0 en
              cualquier plano (ec. 2.55): basta estudiar el plano xy.
            porque: >-
              Es lo que convierte el problema en uno de dos dimensiones.
            minimo: true
          - punto: >-
              El plano AB del prisma de la fig. 2.11 tiene normal
              n̂ = cos θ î + sin θ ĵ, con θ medido desde x en sentido
              antihorario y 0 < θ < π; por Cauchy,
              Snx = σx cos θ + τxy sin θ y Sny = τxy cos θ + σy sin θ
              (ec. 2.56).
            porque: >-
              Es el vector tensión del plano cualquiera que pide la cuestión.
            minimo: true
          - punto: >-
              σn = S⃗n·n̂ y τn = S⃗n·t̂, con t̂ = −sin θ î + cos θ ĵ, la normal
              girada 90° en sentido antihorario (ecs. 2.57 y 2.58): τn lleva
              signo, positivo hacia t̂.
            porque: >-
              Es la definición de las dos componentes en el plano, y la que
              fija el signo de la tangencial.
            minimo: true
          - punto: >-
              Sustituyendo: σn = σx cos²θ + σy sin²θ + 2τxy sin θ cos θ y
              τn = (σy − σx) sin θ cos θ + τxy(cos²θ − sin²θ) (ec. 2.59).
            porque: >-
              Es el paso intermedio, en función de θ.
          - punto: >-
              Con las identidades del ángulo doble (ec. 2.60):
              σn = (σx + σy)/2 + (σx − σy)/2·cos 2θ + τxy sin 2θ y
              τn = (σy − σx)/2·sin 2θ + τxy cos 2θ (ec. 2.61).
            porque: >-
              Es el resultado que pide la cuestión.
            minimo: true
          - punto: >-
              Consecuencias: tan 2θ1 = 2τxy/(σx − σy) da las direcciones
              principales, donde τn = 0 (ec. 2.62), y las de tangencial
              máxima están a 45° de ellas (ecs. 2.63 y 2.64).
            porque: >-
              Es para lo que se usan estas ecuaciones, y el paso al círculo de
              Mohr.
      - tipo: calcular
        titulo: La tensión normal del plano
        pregunta: |
          Un ejemplo nuestro: en un punto de una chapa en tensión plana,
          $\sigma_x = 60$, $\sigma_y = -20$ y $\tau_{xy} = -30$ MPa. ¿Cuánto vale
          $\sigma_n$ en el plano cuya normal forma $\theta = 30°$ con $x$, en
          sentido antihorario, en MPa?
        respuesta:
          tipo: numero
          valor: '14.02'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '39.64'
            mensaje: |
              Has usado $\theta$ donde va $2\theta$: $\cos30°$ y $\sin30°$ en vez
              de $\cos60°$ y $\sin60°$. En la ec. 2.61 los ángulos son dobles.
          - valor: '-11.96'
            mensaje: |
              Te has llevado el 2 de la ec. 2.59 a la 2.61. Allí es
              $2\tau_{xy}\sin\theta\cos\theta$, que es $\tau_{xy}\sin2\theta$:
              el 2 ya está dentro del seno doble.
          - valor: '65.98'
            mensaje: |
              Has tomado $\tau_{xy} = +30$ MPa. Es negativa, y el término
              $\tau_{xy}\sin2\theta$ resta.
        pista: |
          Ec. 2.61:
          $\sigma_n = \tfrac12(\sigma_x + \sigma_y) + \tfrac12(\sigma_x - \sigma_y)\cos2\theta + \tau_{xy}\sin2\theta$,
          con $2\theta = 60°$.
        desarrollo: |
          Con $\tfrac12(\sigma_x + \sigma_y) = 20$ MPa,
          $\tfrac12(\sigma_x - \sigma_y) = 40$ MPa, $\cos60° = 0{,}5$ y
          $\sin60° = 0{,}8660$, en MPa:

          $$
          \sigma_n = 20 + 40\cdot0{,}5 + (-30)\cdot0{,}8660 = 20 + 20 - 25{,}98 = 14{,}02
          $$
      - tipo: calcular
        titulo: La tensión tangencial del plano, con su signo
        pregunta: |
          ¿Y $\tau_n$ en ese plano, con su signo, en MPa?
        respuesta:
          tipo: numero
          valor: '-49.64'
          tolerancia: 0.05
          formato: un número, en MPa, con su signo
        distractores:
          - valor: '49.64'
            mensaje: |
              El valor es bueno y el signo no. $\tau_n$ se mide sobre
              $\hat t = (-\sin\theta, \cos\theta)$, la normal girada 90° en
              sentido antihorario; aquí la tangencial apunta al revés que
              $\hat t$. Si diste el módulo, como en tres dimensiones, en tensión
              plana el signo cuenta.
          - valor: '19.64'
            mensaje: |
              El primer término es $\tfrac12(\sigma_y - \sigma_x)\sin2\theta$,
              con $\sigma_y$ delante: $-40\cdot0{,}8660$, no $+40\cdot0{,}8660$.
          - valor: '-45.98'
            mensaje: |
              Has usado $\theta$ donde va $2\theta$: $\sin30°$ y $\cos30°$ en vez
              de $\sin60°$ y $\cos60°$.
        pista: |
          Ec. 2.61:
          $\tau_n = \tfrac12(\sigma_y - \sigma_x)\sin2\theta + \tau_{xy}\cos2\theta$.
        desarrollo: |
          Con $\tfrac12(\sigma_y - \sigma_x) = -40$ MPa, en MPa:

          $$
          \tau_n = (-40)\cdot0{,}8660 + (-30)\cdot0{,}5 = -34{,}64 - 15 = -49{,}64
          $$

          Negativa: la tangencial va en sentido contrario a
          $\hat t = (-\sin30°, \cos30°)$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En tensión plana $S_{nz} = 0$ en cualquier plano: basta el plano
              $xy$.
          - texto: >-
              El plano de normal $\hat n = \cos\theta\,\hat i + \sin\theta\,\hat j$
              tiene, por Cauchy, $S_{nx} = \sigma_x\cos\theta + \tau_{xy}\sin\theta$
              y $S_{ny} = \tau_{xy}\cos\theta + \sigma_y\sin\theta$.
          - texto: >-
              Se proyecta sobre $\hat n$ y sobre
              $\hat t = -\sin\theta\,\hat i + \cos\theta\,\hat j$:
              $\sigma_n = \vec S_n\cdot\hat n$ y $\tau_n = \vec S_n\cdot\hat t$.
          - texto: >-
              Salen
              $\sigma_n = \sigma_x\cos^{2}\theta + \sigma_y\sin^{2}\theta + 2\tau_{xy}\sin\theta\cos\theta$
              y
              $\tau_n = (\sigma_y - \sigma_x)\sin\theta\cos\theta + \tau_{xy}(\cos^{2}\theta - \sin^{2}\theta)$.
          - texto: >-
              Con $\cos^{2}\theta = \tfrac12(1 + \cos2\theta)$,
              $\sin^{2}\theta = \tfrac12(1 - \cos2\theta)$ y
              $\sin2\theta = 2\sin\theta\cos\theta$, quedan en función de
              $2\theta$.
          - texto: >-
              Como $\tau_n^{2} = \lvert\vec S_n\rvert^{2} - \sigma_n^{2}$, la
              tangencial es siempre positiva.
            trampa: true
            mensaje: |
              Esa es la del caso general (ec. 2.16), que solo da el módulo. En
              tensión plana se proyecta sobre $\hat t$ y $\tau_n$ lleva signo: en
              el ejemplo, $-49{,}64$ MPa, en sentido contrario a $\hat t$. Sin
              ese signo, el círculo de Mohr no sabría en qué mitad poner cada
              punto.
    resolucion: |
      **Tensión plana** (apuntes del tema 2, apartado 2.5, p. 21). Las
      componentes no nulas están en el plano $xy$: $\sigma_z = \tau_{yz} = \tau_{zx} = 0$.
      Por Cauchy (ec. 2.55), en cualquier plano $S_{nz} = 0$, y el análisis
      se hace en el plano $xy$, con el prisma triangular de la fig. 2.11
      ($\overline{OA} = dx$, $\overline{OB} = dy$, longitud 1 en $z$). Su cara
      AB pasa por O. El ángulo $\theta$ va de $x$ a la normal, en sentido
      antihorario, y basta $0 < \theta < \pi$: con $\theta + \pi$ la normal y
      el vector tensión son los opuestos, el otro lado del corte.

      **El vector tensión del plano** (p. 22). Con $n_x = \cos\theta$ y
      $n_y = \sin\theta$:

      $$
      \begin{Bmatrix} S_{nx}\\ S_{ny} \end{Bmatrix} = \begin{bmatrix} \sigma_x & \tau_{xy}\\ \tau_{xy} & \sigma_y \end{bmatrix}\begin{Bmatrix} \cos\theta\\ \sin\theta \end{Bmatrix} \qquad \text{(ec. 2.56)}
      $$

      **Las proyecciones.** Según la fig. 2.11,
      $\hat n = \cos\theta\,\hat i + \sin\theta\,\hat j$ y
      $\hat t = -\sin\theta\,\hat i + \cos\theta\,\hat j$ (ec. 2.57), y

      $$
      \sigma_n = \vec S_n\cdot\hat n = S_{nx}\cos\theta + S_{ny}\sin\theta \qquad
      \tau_n = \vec S_n\cdot\hat t = -S_{nx}\sin\theta + S_{ny}\cos\theta \qquad \text{(ec. 2.58)}
      $$

      Sustituyendo la ec. 2.56:

      $$
      \sigma_n = \sigma_x\cos^{2}\theta + \sigma_y\sin^{2}\theta + 2\tau_{xy}\sin\theta\cos\theta \qquad
      \tau_n = (\sigma_y - \sigma_x)\sin\theta\cos\theta + \tau_{xy}(\cos^{2}\theta - \sin^{2}\theta) \qquad \text{(ec. 2.59)}
      $$

      **El ángulo doble** (pp. 22-23). Con $\cos^{2}\theta = \tfrac12(1 + \cos2\theta)$,
      $\sin^{2}\theta = \tfrac12(1 - \cos2\theta)$,
      $\cos2\theta = \cos^{2}\theta - \sin^{2}\theta$ y
      $\sin2\theta = 2\sin\theta\cos\theta$ (ec. 2.60):

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\sin2\theta \qquad
      \tau_n = \frac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta \qquad \text{(ec. 2.61)}
      $$

      $\tau_n$ lleva signo: positiva si va hacia $\hat t$.

      **Lo que sale de ellas** (p. 23). Derivando $\sigma_n$ e igualando a
      cero, $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 2.62):
      las direcciones principales, perpendiculares, en las que $\tau_n = 0$.
      Derivando $\tau_n$, $\tan2\theta_2 = -(\sigma_x - \sigma_y)/(2\tau_{xy})$
      (ec. 2.63), y $\theta_2 = \theta_1 \pm \tfrac14\pi$ (ec. 2.64): las
      direcciones de tangencial máxima están a 45° de las principales. La
      ec. 2.63 termina en $-1/\tan\theta_1$, y es $-1/\tan2\theta_1$: con los
      ángulos simples no sale la ec. 2.64.

      **Un ejemplo nuestro.** Con $\sigma_x = 60$, $\sigma_y = -20$ y
      $\tau_{xy} = -30$ MPa, el plano a $\theta = 30°$ tiene, en MPa,

      $$
      \sigma_n = 20 + 40\cdot0{,}5 - 30\cdot0{,}8660 = 14{,}02 \qquad
      \tau_n = -40\cdot0{,}8660 - 30\cdot0{,}5 = -49{,}64
      $$

      **Comprobaciones.** Las dos salen igual con el motor del curso
      (ec. 2.61) y por el otro camino, el de los apuntes: el vector tensión
      $\vec S_n = (36{,}96;\ -35{,}98)$ MPa de la ec. 2.56, proyectado sobre
      $\hat n$ y sobre $\hat t$ (ec. 2.58).
  # ── Cuestión 12 de autoevaluación del tema 2 · las componentes esférica y desviadora.
  - id: ejerm2-cu12-las-componentes-esferica-y-desviadora
    titulo: Las componentes esférica y desviadora del tensor de tensiones
    fuente: >-
      Cuestión 12 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.4.4
      (p. 20, ecs. 2.51 a 2.54), y para el cambio de volumen, los del tema 4,
      p. 7 (ec. 4.14). El ejemplo es nuestro, comprobado con el motor del
      curso y por un segundo camino.
    nivel: practica
    enunciado: |
      12. Componentes esférica y desviadora del tensor de tensiones.
    pide: >-
      Qué son las componentes esférica y desviadora del tensor de tensiones,
      cómo se calculan y qué tiene que ver cada una con la deformación del
      sólido.
    pasos:
      - tipo: reconocer
        pregunta: |
          La componente esférica es un estado de tensión con la misma tensión
          normal en todas las direcciones. ¿Cuál es esa tensión?
        opciones:
          - texto: >-
              La media de las tres normales,
              $\tfrac13(\sigma_x + \sigma_y + \sigma_z)$, que es $\tfrac13 I_1$
            correcta: true
            mensaje: |
              Eso es: «por definición» (ec. 2.51, p. 20). Como $I_1$ es un
              invariante, la tensión esférica no depende de los ejes:
              también es la media de las tres principales.
          - texto: >-
              La suma de las tres normales, $I_1$
            mensaje: |
              Falta el tercio. Con la suma en la diagonal, la traza de la
              esférica sería $3I_1$, el triple de la del tensor, y la
              desviadora, lo que queda, tendría traza $-2I_1$ en vez de cero:
              ya no sería la parte que no cambia el volumen.
          - texto: >-
              La mayor de las tres principales, $\sigma_1$
            mensaje: |
              Con $\sigma_1$ en la diagonal, la desviadora tendría todas sus
              normales negativas o nulas. La esférica es un valor medio, no
              un extremo.
          - texto: >-
              La media de las dos principales extremas,
              $\tfrac12(\sigma_1 + \sigma_3)$
            mensaje: |
              Esa es la normal de los planos de tangencial máxima, el centro
              del círculo de Mohr mayor. La esférica cuenta las tres
              principales por igual.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica la cuestión como en un examen: la tensión esférica, cómo se
          parte el tensor, cómo es cada matriz y qué representa cada una.
        rubrica:
          - punto: >-
              La tensión esférica es, por definición,
              σe = ⅓(σx + σy + σz) = ⅓I1 (ec. 2.51); como I1, no depende de
              los ejes.
            porque: >-
              Es el número del que sale todo lo demás.
            minimo: true
          - punto: >-
              El tensor se descompone en dos: [σ] = [σe] + [σd] (ec. 2.52).
            porque: >-
              Es la descomposición que pide la cuestión.
            minimo: true
          - punto: >-
              La matriz esférica, [σe], es diagonal, con σe en las tres
              posiciones y sin tangenciales (ec. 2.53): la misma tensión normal
              en todas las direcciones, como una presión hidrostática.
            porque: >-
              Es la primera componente, y explica su nombre.
            minimo: true
          - punto: >-
              La desviadora, [σd] = [σ] − [σe], tiene en la diagonal
              σx − σe, σy − σe y σz − σe, y las tangenciales sin tocar
              (ec. 2.54); su traza es nula.
            porque: >-
              Es la segunda componente, la que se despeja de la ec. 2.52.
            minimo: true
          - punto: >-
              En un material isótropo, la esférica está relacionada con el
              cambio de volumen (p. 20): e = 3(1 − 2ν)σe/E (ec. 4.14); y la
              desviadora, con la distorsión.
            porque: >-
              Es para lo que se usa la descomposición: en el criterio de Von
              Mises, por ejemplo, solo cuenta la distorsión.
          - punto: >-
              Todas las tangenciales están en la desviadora: la esférica no
              tiene tangencial en ningún plano.
            porque: >-
              Una presión igual en todas las direcciones no hace deslizar
              ningún plano sobre otro.
      - tipo: calcular
        titulo: La tensión esférica
        pregunta: |
          Un ejemplo nuestro: en un punto de una pieza de acero,

          $$
          [\sigma] = \begin{bmatrix} 80 & 30 & 0\\ 30 & -10 & -15\\ 0 & -15 & 20 \end{bmatrix}\ \text{MPa}
          $$

          ¿Cuánto vale la tensión esférica $\sigma_e$, en MPa?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '90'
            mensaje: |
              Esa es $I_1 = 80 - 10 + 20$, la suma. La tensión esférica es la
              media: $\tfrac13 I_1$ (ec. 2.51).
          - valor: '45'
            mensaje: |
              Has dividido entre 2: son tres las normales que se promedian,
              $\sigma_x$, $\sigma_y$ y $\sigma_z$.
        pista: |
          $\sigma_e = \tfrac13(\sigma_x + \sigma_y + \sigma_z)$ (ec. 2.51): las
          tangenciales no entran.
        desarrollo: |
          En MPa:

          $$
          \sigma_e = \frac{80 - 10 + 20}{3} = \frac{90}{3} = 30
          $$

          La desviadora tiene en la diagonal $80 - 30 = 50$,
          $-10 - 30 = -40$ y $20 - 30 = -10$, que suman cero, y las mismas
          tangenciales que $[\sigma]$.
      - tipo: calcular
        titulo: El cambio de volumen
        pregunta: |
          Con $E = 210$ GPa y $\nu = 0{,}3$, y la relación del tema 4,
          $e = 3(1 - 2\nu)\,\sigma_e/E$ (ec. 4.14), ¿cuánto vale la deformación
          volumétrica unitaria $e$ en ese punto, en millonésimas?
        respuesta:
          tipo: numero
          valor: '171.43'
          tolerancia: 0.05
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '57.14'
            mensaje: |
              Te has dejado el 3 de la ec. 4.14. Con $\sigma_e$ hay que
              escribir $3(1 - 2\nu)/E$; sin el 3, la fórmula es la de la suma
              de las normales, $(1 - 2\nu)\,I_1/E$.
          - valor: '514.29'
            mensaje: |
              Has puesto $I_1 = 90$ MPa en lugar de $\sigma_e = 30$ MPa: con la
              suma, el 3 ya sobra.
          - valor: '300'
            mensaje: |
              Has escrito $1 - \nu$ en lugar de $1 - 2\nu$: con $\nu = 0{,}3$,
              $1 - 2\nu = 0{,}4$.
        pista: |
          $E = 210\,000$ MPa; el resultado, adimensional, se da en $10^{-6}$.
        desarrollo: |
          $$
          e = \frac{3(1 - 2\cdot0{,}3)\cdot30}{210\,000} = \frac{36}{210\,000} = 171{,}43\cdot10^{-6}
          $$

          Positiva: el volumen aumenta. La desviadora no cambia el volumen,
          porque su traza es nula.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La tensión esférica es la media de las tres normales:
              $\sigma_e = \tfrac13(\sigma_x + \sigma_y + \sigma_z) = \tfrac13 I_1$.
          - texto: >-
              La matriz esférica tiene $\sigma_e$ en la diagonal y ceros fuera:
              la misma tensión normal en cualquier dirección.
          - texto: >-
              La desviadora es lo que queda, $[\sigma_d] = [\sigma] - [\sigma_e]$:
              $\sigma_e$ restada de la diagonal y las tangenciales sin tocar.
          - texto: >-
              La traza de la desviadora es nula: toda la $I_1$ está en la
              esférica.
          - texto: >-
              En un material isótropo, el cambio de volumen depende solo de la
              esférica; la desviadora distorsiona sin cambiar el volumen.
          - texto: >-
              La esférica se queda también con las tangenciales, repartidas
              por igual entre los tres planos.
            trampa: true
            mensaje: |
              La matriz esférica es diagonal (ec. 2.53): no tiene ninguna
              tangencial. Todas van a la desviadora tal como estaban
              (ec. 2.54). Un estado esférico no tiene tangencial en ningún
              plano.
    resolucion: |
      **La tensión esférica** (apuntes del tema 2, apartado 2.4.4, p. 20).
      Por definición,

      $$
      \sigma_e = \tfrac13(\sigma_x + \sigma_y + \sigma_z) = \tfrac13 I_1 \qquad \text{(ec. 2.51)}
      $$

      Como $I_1$ es invariante, $\sigma_e$ no depende de los ejes: es también
      la media de las tres principales.

      **La descomposición.** La matriz de tensiones en O$xyz$ se descompone
      en dos:

      $$
      [\sigma] = [\sigma_e] + [\sigma_d] \qquad \text{(ec. 2.52)}
      $$

      $[\sigma_e]$ es la matriz esférica, y $[\sigma_d]$, la desviadora, que
      se despeja de la ec. 2.52:

      $$
      [\sigma_e] = \begin{bmatrix} \sigma_e & 0 & 0\\ 0 & \sigma_e & 0\\ 0 & 0 & \sigma_e \end{bmatrix} \quad \text{(ec. 2.53)} \qquad
      [\sigma_d] = \begin{bmatrix} (\sigma_x - \sigma_e) & \tau_{xy} & \tau_{zx}\\ \tau_{xy} & (\sigma_y - \sigma_e) & \tau_{yz}\\ \tau_{zx} & \tau_{yz} & (\sigma_z - \sigma_e) \end{bmatrix} \quad \text{(ec. 2.54)}
      $$

      **Qué es cada una.** La esférica es la misma tensión normal en
      cualquier dirección, sin tangencial en ningún plano: un estado como el
      de una presión hidrostática. La desviadora se lleva todas las
      tangenciales, y su traza es nula. En un material isótropo, la
      componente esférica está relacionada con el cambio de volumen del
      cuerpo (p. 20). En el tema 4 (p. 7) se ve cómo:

      $$
      e = \frac{3(1 - 2\nu)}{E}\,\sigma_e \qquad \text{(ec. 4.14)}
      $$

      con $e$ la deformación volumétrica unitaria. En consecuencia, la
      distorsión está relacionada con la componente desviadora. Es lo que
      usa el criterio de Von Mises (tema 6): una presión hidrostática no
      hace fallar el material, y solo cuenta la energía de distorsión.

      **Un ejemplo nuestro.** Con el tensor de los pasos,
      $\sigma_e = 90/3 = 30$ MPa; la desviadora tiene en la diagonal 50,
      $-40$ y $-10$ MPa, y las tangenciales 30, 0 y $-15$ MPa de $[\sigma]$.
      En acero, con $E = 210$ GPa y $\nu = 0{,}3$, la ec. 4.14 da
      $e = 171{,}43\cdot10^{-6}$.

      **Comprobaciones.** El motor del curso da la misma esférica y una
      desviadora de traza nula, y la deformación volumétrica sale igual con
      la suma de las normales, $e = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E$,
      y sumando las tres deformaciones de Hooke,
      $\varepsilon_x + \varepsilon_y + \varepsilon_z$, escritas a mano.
  # ── Cuestión 13 de autoevaluación del tema 2 · el criterio de colocación en el círculo de Mohr.
  - id: ejerm2-cu13-el-criterio-de-colocacion-de-mohr
    titulo: El criterio para colocar los puntos en el círculo de Mohr
    fuente: >-
      Cuestión 13 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.6.1
      (pp. 24-27, ecs. 2.62 y 2.65 a 2.69, figs. 2.11, 2.12 y 2.13), con un
      complemento nuestro. La figura y el ejemplo son nuestros, comprobados
      con el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      13. Círculo de Mohr. Demostración del criterio de colocación de las
      tensiones tangenciales en tensión plana.
    pide: >-
      La demostración del criterio que decide en qué mitad del círculo de
      Mohr va el punto de cada dirección, en tensión plana.
    pasos:
      - tipo: reconocer
        pregunta: |
          El eje vertical del círculo es $\lvert\tau_n\rvert$, y hay que decidir
          si el punto $(\sigma_x, \tau_{xy})$ de $x$ va arriba o abajo. ¿En qué
          se apoya la demostración del criterio?
        opciones:
          - texto: >-
              En que un giro $\theta$ en la pieza es un giro $2\theta$ en el
              círculo, en el mismo sentido: el doble del giro de $x$ a la
              dirección principal tiene que llevar del punto de $x$ al eje
              $\sigma_n$
            correcta: true
            mensaje: |
              Eso es (p. 26 y fig. 2.13). El signo de $\tan2\theta_p$ dice si
              la dirección principal está girada en sentido antihorario u
              horario desde $x$; en el círculo, el mismo giro doble tiene que
              llevar del punto de $x$ al eje. Eso solo pasa con $x$ en una de
              las dos mitades, y mirando los cuatro casos sale el criterio.
          - texto: >-
              En el signo de $\tau_{xy}$: si es positiva, $x$ va arriba
            mensaje: |
              Con el convenio del curso es al revés: en la fig. 2.12, con
              $\tau_{xy} > 0$, $x$ va abajo. Y en cualquier caso no es una
              demostración, sino una regla que hay que justificar.
          - texto: >-
              En que $\sigma_x$ es mayor que $\sigma_y$
            mensaje: |
              La fig. 2.13 tiene casos con $\sigma_x > \sigma_y$ y con
              $\sigma_x < \sigma_y$, y en los dos $x$ puede ir arriba o abajo.
              Solo con las normales no se decide.
          - texto: >-
              En un convenio que se elige libremente: se podría poner $x$
              siempre arriba
            mensaje: |
              Con el eje en valor absoluto no es libre: si $x$ va en la mitad
              equivocada, el giro doble en el círculo y el giro en la pieza
              salen en sentidos contrarios, y las direcciones principales se
              leen mal.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen: el problema, qué dice el
          signo de la ec. 2.62, cómo se traslada al círculo, los cuatro casos y
          el criterio.
        rubrica:
          - punto: >-
              El problema: el eje vertical es |τn|, y con un mismo τxy un eje va
              arriba y el otro abajo; hace falta un criterio para colocar el
              punto (σx, τxy) de x en la mitad superior o en la inferior
              (p. 26).
            porque: >-
              Es lo que la demostración resuelve.
          - punto: >-
              La ec. 2.62, tan 2θp = 2τxy/(σx − σy), da las direcciones
              principales, y su signo dice el sentido: si la tangente es
              positiva el ángulo es antihorario, y si es negativa, horario
              (θ como en la fig. 2.11).
            porque: >-
              Es el dato de la pieza que el círculo tiene que respetar.
            minimo: true
          - punto: >-
              En el círculo los ángulos son dobles y en el mismo sentido: desde
              el punto de x, un giro 2θp en ese sentido tiene que llegar al eje
              σn, al punto de la principal.
            porque: >-
              Es lo que fija la mitad en la que va x.
            minimo: true
          - punto: >-
              Los cuatro casos de la fig. 2.13 (τxy positiva o negativa, σx
              mayor o menor que σy): en todos, la dirección perpendicular a las
              caras cuyas tangenciales forman par horario queda en la mitad
              superior.
            porque: >-
              Es la comprobación caso a caso de la que sale el criterio.
            minimo: true
          - punto: >-
              El criterio: cuando el par de las tangenciales que actúan en dos
              planos paralelos es horario, la dirección perpendicular a ellos
              va en la mitad superior; si es antihorario, en la inferior. Por
              eso, en la fig. 2.12, con τxy > 0, x va abajo e y arriba.
            porque: >-
              Es el resultado que se pide.
            minimo: true
          - punto: >-
              Y a la inversa: la mitad en que está el punto de un eje dice el
              sentido de sus tangenciales.
            porque: >-
              Es como se usa el criterio al leer un círculo ya dibujado.
      - tipo: calcular
        titulo: La dirección que da la fórmula
        pregunta: |
          Un ejemplo nuestro: en un punto de una chapa en tensión plana,
          $\sigma_x = 10$, $\sigma_y = 70$ y $\tau_{xy} = -40$ MPa. Con la
          ec. 2.62, $\tan2\theta_p = 2\tau_{xy}/(\sigma_x - \sigma_y) = 4/3$, y
          el arco tangente da $\theta_p = 26{,}57°$. ¿Cuánto vale $\sigma_n$ en
          la dirección que forma ese ángulo con $x$, en sentido antihorario,
          en MPa?
        respuesta:
          tipo: numero
          valor: '-10'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '90'
            mensaje: |
              Esa es $\sigma_1$, y has supuesto que la fórmula da su
              dirección. La ec. 2.62 da las dos direcciones principales a la
              vez, y el arco tangente no dice cuál es cuál: aquí da la de
              $\sigma_2$.
          - valor: '40'
            mensaje: |
              Ese es el centro del círculo, $\tfrac12(\sigma_x + \sigma_y)$: la
              normal de los planos a 45° de los principales. En
              $\theta = 26{,}57°$ el término del ángulo doble no se anula.
          - valor: '10'
            mensaje: |
              Esa es $\sigma_x$, la de $\theta = 0$. Con la ec. 2.61 y
              $2\theta = 53{,}13°$ la normal cambia.
        pista: |
          Ec. 2.61, con $\cos53{,}13° = 0{,}6$ y $\sin53{,}13° = 0{,}8$.
        desarrollo: |
          Con $\tfrac12(\sigma_x + \sigma_y) = 40$ y
          $\tfrac12(\sigma_x - \sigma_y) = -30$, en MPa:

          $$
          \sigma_n = 40 + (-30)\cdot0{,}6 + (-40)\cdot0{,}8 = 40 - 18 - 32 = -10
          $$

          Es $\sigma_2 = C - R = 40 - 50$: la fórmula ha dado la dirección
          principal 2, no la 1.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma con $x$ la dirección principal 1, en grados,
          positivo en sentido antihorario y entre $-90°$ y $90°$?
        respuesta:
          tipo: numero
          valor: '-63.43'
          tolerancia: 0.2
          formato: un número, en grados, con su signo
        distractores:
          - valor: '26.57'
            mensaje: |
              Esa es la que da el arco tangente, y en el paso anterior se ve
              que es la dirección 2. La 1 es la perpendicular.
          - valor: '63.43'
            mensaje: |
              Has puesto $x$ abajo en el círculo. Con $\tau_{xy} < 0$, las
              tangenciales de las caras $x$ forman par horario y $x$ va arriba,
              en $(10, 40)$; de ahí a $\sigma_1$ se gira en sentido horario.
          - valor: '-126.87'
            mensaje: |
              Ese es el ángulo en el círculo, $2\theta_1$. En la pieza es la
              mitad: $\theta_1 = -63{,}43°$.
        tambienValen:
          - valor: '116.57'
            mensaje: |
              Es la misma dirección, recorrida al revés: $-63{,}43° + 180°$. La
              pregunta la pedía entre $-90°$ y $90°$, que es $-63{,}43°$.
        pista: |
          Coloca $x$ con el criterio y mide en el círculo el giro de $x$ a
          $\sigma_1 = 90$ MPa, con su sentido; en la pieza es la mitad.
        desarrollo: |
          Con $\tau_{xy} = -40$ MPa las tangenciales de las caras $x$ forman
          par horario: $x$ va arriba, en $(10, 40)$. El centro es
          $C = 40$ MPa y el radio $R = \sqrt{30^{2} + 40^{2}} = 50$ MPa. Visto
          desde el centro, $x$ está a $180° - 53{,}13° = 126{,}87°$ del eje
          positivo, y $\sigma_1 = 90$ MPa en $0°$: hay que girar
          $126{,}87°$ en sentido horario. En la pieza, la mitad y en el mismo
          sentido: $\theta_1 = -63{,}43°$, perpendicular a la de
          $26{,}57°$, como debe.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el eje vertical en valor absoluto, $\lvert\tau_n\rvert$, hace
              falta decidir si el punto de $x$ va arriba o abajo.
          - texto: >-
              La ec. 2.62 da $2\theta_p$, y su signo dice el sentido:
              antihorario si la tangente es positiva, horario si es negativa.
          - texto: >-
              En el círculo el giro es doble y en el mismo sentido: desde $x$,
              un giro $2\theta_p$ así tiene que llegar al eje $\sigma_n$.
          - texto: >-
              Eso fija la mitad de $x$ en cada uno de los cuatro casos de
              signos de $\tau_{xy}$ y de $\sigma_x - \sigma_y$.
          - texto: >-
              En los cuatro, la dirección perpendicular a las caras con par
              horario queda arriba: ese es el criterio.
          - texto: >-
              Si $\tau_{xy} > 0$, el punto de $x$ va arriba, porque su ordenada
              es $\tau_{xy}$ y es positiva.
            trampa: true
            mensaje: |
              Con el convenio del curso es al revés: con $\tau_{xy} > 0$ las
              tangenciales de las caras $x$ forman par antihorario, y $x$ va
              abajo (fig. 2.12). El eje vertical es $\lvert\tau_n\rvert$: la
              ordenada no lleva el signo de $\tau_{xy}$, y la mitad la decide el
              criterio.
    resolucion: |
      **El problema** (apuntes del tema 2, apartado 2.6.1, pp. 24-26). Las
      ecs. 2.61, escritas como en la ec. 2.65 y elevadas al cuadrado, dan
      una circunferencia, $(\sigma_n - \sigma_C)^{2} + \tau_n^{2} = R^{2}$
      (ec. 2.67), con $\sigma_C = \tfrac12(\sigma_x + \sigma_y)$ y
      $R = \sqrt{\left[\tfrac12(\sigma_x - \sigma_y)\right]^{2} + \tau_{xy}^{2}}$
      (ec. 2.68). Para dibujarla se toma como abscisa $\sigma_x$ y como
      ordenada $\tau_{xy}$, pero si el eje $x$ está en la parte superior el
      $y$ está en la inferior, y viceversa: para un mismo signo de
      $\tau_{xy}$ hay un valor positivo y uno negativo. Por eso el eje
      vertical se dibuja en valor absoluto, $\lvert\tau_n\rvert$, y el
      problema fundamental es: ¿cuál es el criterio para colocar el punto
      $(\sigma_x, \tau_{xy})$ en la mitad superior o en la inferior?

      **El signo de la ec. 2.62.** El valor de
      $\tan2\theta_p = 2\tau_{xy}/(\sigma_x - \sigma_y)$ que da las
      direcciones principales puede ser positivo o negativo. Según la
      fig. 2.11, con $\theta$ medido desde $x$ en sentido antihorario, si la
      tangente es positiva el ángulo es antihorario, y si es negativa,
      horario. Los apuntes la escriben con $\theta_1$ (pp. 23 y 26) y la
      fig. 2.13 con $\theta_p$; aquí va $\theta_p$, porque la raíz del arco
      tangente no siempre es la dirección 1, como se ve en el ejemplo, y
      $\theta_1$ se guarda para ella.

      **Los cuatro casos** (fig. 2.13, p. 27). En el círculo los ángulos son
      dobles: desde el punto de $x$, un giro $2\theta_p$ en ese mismo sentido
      tiene que llegar al eje $\sigma_n$, a la principal 1 o a la 2. Con
      $\tau_{xy} > 0$ y $\sigma_x > \sigma_y$, o con $\tau_{xy} < 0$ y
      $\sigma_x < \sigma_y$, la tangente es positiva; en los otros dos casos,
      negativa. En cada caso solo una mitad del círculo deja que el giro
      llegue al eje en el sentido bueno, y en los cuatro se ve lo mismo: las
      direcciones perpendiculares a las caras cuyas tangenciales provocan par
      horario están en la mitad superior.

      **El criterio.** Cuando el par de las tensiones tangenciales que
      actúan en planos paralelos es horario, la dirección perpendicular a
      dichos planos se sitúa en la mitad superior del círculo; si es
      antihorario, en la inferior. Por eso en la fig. 2.12, con
      $\sigma_x > \sigma_y > 0$ y $\tau_{xy} > 0$, el eje $x$ está abajo y
      el $y$ arriba. A la inversa, la mitad en que está un eje dice el
      sentido de sus tangenciales.

      **Otra forma de verlo** (nuestra, desde la ec. 2.61). En la dirección
      $\theta$, las tangenciales $\tau_n$ de las dos caras perpendiculares a
      $\hat n$ forman un par de momento proporcional a $\tau_n$, antihorario
      si $\tau_n > 0$: el criterio pone arriba las de $\tau_n < 0$, así que
      lo que se dibuja es $(\sigma_n, -\tau_n)$. Con la ec. 2.61,

      $$
      \sigma_n - \sigma_C = \tfrac12(\sigma_x - \sigma_y)\cos2\theta + \tau_{xy}\sin2\theta \qquad
      -\tau_n = \tfrac12(\sigma_x - \sigma_y)\sin2\theta - \tau_{xy}\cos2\theta
      $$

      que es el punto de $x$, $\left(\tfrac12(\sigma_x - \sigma_y), -\tau_{xy}\right)$
      respecto del centro, girado $2\theta$ en sentido antihorario. Girar la
      dirección $\theta$ en la pieza es girar su punto $2\theta$ en el mismo
      sentido en el círculo.

      **Un ejemplo nuestro.** Con $\sigma_x = 10$, $\sigma_y = 70$ y
      $\tau_{xy} = -40$ MPa (el segundo caso de la fig. 2.13): el par de las
      caras $x$ es horario y $x$ va arriba, en $(10, 40)$; $y$, abajo, en
      $(70, 40)$. $C = 40$ MPa, $R = 50$ MPa, $\sigma_1 = 90$ MPa y
      $\sigma_2 = -10$ MPa (ec. 2.69).

      <figure>
      <svg viewBox="0 0 600 300" role="img" width="600" height="300" aria-labelledby="ejerm2-cu13-el-criterio-de-colocacion-de-mohr-fig-t ejerm2-cu13-el-criterio-de-colocacion-de-mohr-fig-d">
      <title id="ejerm2-cu13-el-criterio-de-colocacion-de-mohr-fig-t">El elemento con τxy negativa y su círculo de Mohr: el punto x arriba</title>
      <desc id="ejerm2-cu13-el-criterio-de-colocacion-de-mohr-fig-d">A la izquierda, un elemento cuadrado con solo sus tensiones tangenciales. En la cara de la derecha la flecha baja y en la de la izquierda sube: las dos forman un par horario, marcado con un arco. En la cara de arriba la flecha va a la izquierda y en la de abajo a la derecha. Debajo, los ejes x hacia la derecha e y hacia arriba. A la derecha, el círculo de Mohr a escala, con eje σn horizontal y |τn| vertical: centro en 40 y radio 50, corta el eje en −10 y en 90. El punto x, (10, 40), va en la mitad de arriba, a la izquierda; el y, (70, 40), en la de abajo, a la derecha, en el otro extremo del diámetro. Un arco con punta va del punto x al punto σ1 = 90 en sentido horario: es el ángulo 2θ1.</desc>
