# De ocho en ocho y no de diez: con la caja, el paso de dibujarlo y la
# resolución en cinco partes, los dos primeros bloques de diez pasaban de
# los 3 MB (3,18 y 3,13; lib/ejercicios.ts).
porPagina: 8
ejercicios:
  # ── Ejemplo introductorio nuestro · el vector tensión de un plano.
  - id: ejerm2-el-vector-tension-de-un-plano
    titulo: El vector tensión de un plano oblicuo
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        El tensor de un punto guarda la tensión de todos los planos que pasan por
        él. Multiplicado por la normal de un plano da su vector tensión, que luego
        se parte en lo que empuja perpendicular al plano, $\sigma_n$, y lo que lo
        hace deslizar, $\tau_n$.
      formula: |
        $$
        \{S\} = [\sigma]\{n\},\qquad \sigma_n = \{n\}^{t}[\sigma]\{n\},\qquad \tau_n^{2} = |S|^{2} - \sigma_n^{2}
        $$

        Es Cauchy (ec. 2.14), con $\{n\}$ **unitario**. Vale para cualquier
        plano porque sale del equilibrio del tetraedro de Cauchy cuando se encoge
        hasta el punto.
      reconocer: |
        Te dan el tensor entero y un plano —por su normal, por tres puntos o por
        dónde corta a los ejes— y piden qué pasa en ese plano. El fallo típico
        está en la normal que se mete en la fórmula.
    enunciado: |
      En un punto de un sólido, el tensor de tensiones en los ejes $xyz$ es

      $$
      [\sigma] = \begin{bmatrix} -20 & 40 & 30\\ 40 & -10 & 20\\ 30 & 20 & 40 \end{bmatrix}\ \text{MPa}
      $$

      Para el plano que pasa por el punto y es perpendicular a la dirección
      $(1, 2, 2)$, calcular el vector tensión $\{S\}$, su componente normal
      $\sigma_n$ y su componente tangencial $\tau_n$.

      Un plano paralelo a ese, muy cerca del punto, corta de su entorno el
      tetraedro $OABC$ de la figura: la arista $OA$ mide el doble que $OB$ y
      que $OC$.

