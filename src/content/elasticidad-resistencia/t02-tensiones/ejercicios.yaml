        <path d="M247.7 100.7 L301.3 69.7 L332.3 123.3 L278.7 154.3 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M96 180 A46 46 0 0 0 89.8 157" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
