        <path d="M175 85 L221.2 38.8 L221.2 148.8 L175 195 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M262 228 l-14 14" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M262 228 h20" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M262 228 v-20" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <line x1="120" y1="140" x2="148.6" y2="140" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="140.6" y="133" font-size="10" text-anchor="middle" fill="var(--flag)">40</text>
        <line x1="198.1" y1="116.9" x2="178.5" y2="136.5" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="175.5" y="150.5" font-size="10" text-anchor="end" fill="var(--flag)">40</text>
        <line x1="202.1" y1="116.9" x2="232.1" y2="116.9" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="241.1" y="120.9" font-size="10" text-anchor="start" fill="var(--flag)">60</text>
        <line x1="143.1" y1="57.9" x2="143.1" y2="27.9" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="146.1" y="25.9" font-size="10" text-anchor="start" fill="var(--flag)">100</text>
        <text x="240" y="250" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <text x="286" y="232" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
        <text x="259" y="204" font-size="9" text-anchor="start" fill="var(--faint)">z</text>
      </svg>
      <figcaption>

      Las componentes que no son nulas, en su cara y en su sentido real, en MPa. x hacia el que mira, y a la derecha, z arriba; en las caras escondidas, las mismas componentes con el sentido contrario.

      </figcaption>
      </figure>

      - **La cara z** no tiene tangenciales: su vector tensión,
        $[\sigma]\{0, 0, 1\} = (0, 0, 100)$ MPa, es perpendicular a ella. El
        eje z es dirección principal, con 100 MPa.
      - **Las caras x e y** forman un bloque plano, con $\sigma_x = 0$,
        $\sigma_y = 60$ y $\tau_{xy} = 40$ MPa.

      **2. Incógnitas.** Las tres principales, la dirección de $\sigma_2$ y el
      segundo invariante.

      **3. Ecuaciones.** La ecuación característica (apuntes, ec. 2.35,
      p. 16) se parte en el factor de z y el bloque $2 \times 2$ de x e y, que
      es un problema plano (ecs. 2.38 a 2.41, pp. 17-18):

      $$
      (100 - \sigma)\,\big[(0 - \sigma)(60 - \sigma) - 40^{2}\big] = 0
      \qquad
      C = \frac{\sigma_x + \sigma_y}{2}
      \qquad
      R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}
      $$

      La dirección, del sistema $([\sigma] - \sigma[I])\{n\} = 0$ con
      $|\{n\}| = 1$ (ec. 2.34 y 2.37, pp. 16-17), y los invariantes, de las
      componentes (ec. 2.36, p. 17).

      **4. Resultados.** El bloque, con $C = 30$ y
      $R = \sqrt{30^{2} + 40^{2}} = 50$ MPa, da $C + R = 80$ y $C - R = -20$
      MPa. Lo mismo sale de $\sigma^{2} - 60\,\sigma - 1600 = 0$. Ordenadas
      (p. 17):

      $$
      \sigma_1 = 100\ \text{MPa}
      \qquad
      \sigma_2 = 80\ \text{MPa}
      \qquad
      \sigma_3 = -20\ \text{MPa}
      $$

      La mayor es la de z, la que no hubo que calcular. La dirección de
      $\sigma_2$, con $\sigma = 80$:

      $$
      -80\,n_x + 40\,n_y = 0 \;\Longrightarrow\; n_y = 2\,n_x
      \qquad
      (100 - 80)\,n_z = 0 \;\Longrightarrow\; n_z = 0
      $$

      y unitaria, $\{n_2\} = \frac{1}{\sqrt5}\,(1, 2, 0) = (0{,}4472;\ 0{,}8944;\ 0)$.
      La de $\sigma_3$ es la perpendicular dentro del plano xy,
      $\frac{1}{\sqrt5}(2, -1, 0)$, y la de $\sigma_1$, el eje z. El segundo
      invariante, de las componentes:

      $$
      I_2 = 0 \cdot 60 + 60 \cdot 100 + 100 \cdot 0 - 40^{2} = 4400\ \text{MPa}^{2}
      $$

      Ojo con $\tan 2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y) = -4/3$: da
      $\theta = -26{,}57°$, que es la dirección de $-20$, no la de 80. Con
      $\sigma_x < \sigma_y$, el ángulo de la fórmula es el de la principal
      menor del bloque.

      **5. Comprobación.** $[\sigma]$ por $(1, 2, 0)$ da
      $0 \cdot 1 + 40 \cdot 2 = 80$ en x y $40 \cdot 1 + 60 \cdot 2 = 160$ en
      y: 80 veces $(1, 2, 0)$, así que es dirección principal con 80. Y los
      tres invariantes, con las principales, tienen que repetir los de las
      componentes:

      $$
      I_1 = 0 + 60 + 100 = 160
      \qquad
      100 + 80 - 20 = 160\ \text{MPa}
      $$

      $$
      100 \cdot 80 + 80 \cdot (-20) + (-20) \cdot 100 = 4400\ \text{MPa}^{2}
      $$

      $$
      I_3 = \det[\sigma] = 100\,(0 \cdot 60 - 40^{2}) = -160\,000
      \qquad
      100 \cdot 80 \cdot (-20) = -160\,000\ \text{MPa}^{3}
      $$

      La traza sola no basta como comprobación: no ve un radio mal calculado,
      porque $(C + R) + (C - R) = 2C$ con cualquier $R$. Con el radio sin la
      mitad, $72{,}11$, las tres serían $102{,}11$, $100$ y $-42{,}11$, que
      también suman 160; pero su $I_2$ sale 1700, no 4400.

      **Lo que dice el resultado.** $\sigma_x$ es nula, y aun así el bloque
      xy tiene una principal de compresión, $-20$ MPa: la tangencial de 40
      sola ya pone tracción en una dirección y compresión en la perpendicular.
      La $\sigma_y = 60$ desplaza las dos hacia arriba, a 80 y $-20$.

  - id: ejerm2-circulo-de-mohr-en-tension-plana
    titulo: Un estado de tensión plana, con su círculo de Mohr entero
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        En tensión plana, los planos que contienen al eje $z$ dibujan una
        circunferencia en el plano $(\sigma_n, \tau_n)$: el círculo de Mohr. Con
        su centro y su radio se leen las principales del plano y la dirección de
        la mayor, sin calcular autovalores.
      formula: |
        $$
        C = \frac{\sigma_x + \sigma_y}{2},\qquad R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}},\qquad \tan 2\theta_1 = \frac{2\tau_{xy}}{\sigma_x - \sigma_y}
        $$

        Las principales del plano son $C \pm R$. Valen porque $\sigma_n$ y
        $\tau_n$, escritas con $2\theta$, son las ecuaciones paramétricas de una
        circunferencia.
      reconocer: |
        Te dan $\sigma_x$, $\sigma_y$ y $\tau_{xy}$, y todo lo de $z$ es nulo: es
        tensión plana. Fíjate en si piden la tangencial máxima «del plano» o «del
        punto»: no son la misma pregunta.
    enunciado: |
      En un punto de una chapa hay un estado de tensión plana con
      $\sigma_x = 90\ \text{MPa}$, $\sigma_y = 30\ \text{MPa}$ y
      $\tau_{xy} = 40\ \text{MPa}$, en el convenio del curso
      ($\sigma_z = \tau_{xz} = \tau_{yz} = 0$). Calcular las tensiones
      principales, el ángulo que forma la dirección principal 1 con el eje
      $x$ y la tensión tangencial máxima del punto.
    pide: La principal mayor, el ángulo de la dirección 1 con x y la tangencial máxima del punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          En tensión plana, ¿qué papel juega la tensión $\sigma_z = 0$ al buscar
          la tangencial máxima del punto?
        opciones:
          - texto: Es una tensión principal más, y hay que ordenarla con las dos del plano
            correcta: true
            mensaje: |
              Eso es. En tensión plana $z$ es dirección principal y su tensión
              vale cero. Las tres del punto son las dos del plano y ese cero, y
              la tangencial máxima es $(\sigma_1 - \sigma_3)/2$ con las tres
              ordenadas.
          - texto: Ninguno, porque el estado es plano y todo está en el círculo del plano xy
            mensaje: |
              El círculo del plano $xy$ da las tensiones de los planos
              **paralelos a $z$**. Hay otros planos que pasan por el punto, y en
              alguno de ellos la tangencial puede ser mayor que el radio de ese
              círculo.
          - texto: Solo importa si las dos tensiones del plano son de compresión
            mensaje: |
              También importa si las dos son de tracción, que es justo este caso.
              El cero solo deja de mandar cuando las dos del plano tienen signo
              contrario: entonces queda en medio y el grande es el del plano.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el elemento con sus tensiones y
          el círculo de Mohr del plano xy**, a ojo, con los puntos de las caras
          x e y.
        comprueba:
          - punto: |
              **Las caras x a tracción, con 90 MPa, y las y, con 30.**
            porque: |
              Son positivas: las flechas salen de las caras.
          - punto: |
              **La tangencial de 40, subiendo por la cara de la derecha y
              bajando por la de la izquierda.**
            porque: |
              Con $\tau_{xy} > 0$, en la cara +x va hacia +y. En las caras y va
              hacia +x arriba y hacia −x abajo: las cuatro juntas no hacen girar
              el elemento.
          - punto: |
              **En el círculo, el punto x abajo, en (90, 40), y el y arriba, en
              (30, 40).**
            porque: |
              Las tangenciales de las caras x forman un par antihorario, y en el
              convenio del curso ese punto va abajo.
          - punto: |
              **El centro, sobre el eje σ, a medio camino entre x e y.**
            porque: |
              x e y son caras perpendiculares: en el círculo quedan en los
              extremos de un diámetro.
        figura: |
          <svg viewBox="0 0 470 220" role="img" width="470" height="220" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El elemento de la chapa y su círculo de Mohr</title>
