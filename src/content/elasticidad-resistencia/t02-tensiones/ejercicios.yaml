      La ec. 2.62 da $\tan2\theta_p = 4/3$ y $\theta_p = 26{,}57°$, pero en
      esa dirección $\sigma_n = -10$ MPa: es la 2. Desde $x$, en el círculo,
      se llega a $\sigma_2$ girando $53{,}13°$ en sentido antihorario, como
      dice la tangente positiva; y a $\sigma_1$, girando $126{,}87°$ en
      sentido horario. La dirección 1 está a $\theta_1 = -63{,}43°$ de $x$.

      **Comprobaciones.** El motor del curso da el mismo centro, radio y
      principales, $\theta_1 = -63{,}43°$ y el punto de $x$ en $(10, 40)$,
      arriba. A mano, el vector propio de $\sigma_1 = 90$ MPa cumple
      $(10 - 90)\,n_x - 40\,n_y = 0$, es decir, $n_y = -2n_x$, que forma
      $-63{,}43°$ con $x$; y la ec. 2.61 da $\sigma_n = 90$ MPa en esa
      dirección.
  # ── Cuestión 14 de autoevaluación del tema 2 · los tres círculos de Mohr y la tangencial máxima.
  - id: ejerm2-cu14-los-tres-circulos-y-la-tangencial-maxima
    titulo: Los círculos de Mohr en tres dimensiones y la tangencial máxima
    fuente: >-
      Cuestión 14 de autoevaluación · Tema 2, «Tensiones» · Elasticidad y
      Resistencia de Materiales, UPV/EHU. El material no trae respuesta: la
      resolución es nuestra y sigue los apuntes del tema 2, apartado 2.6.2
      (pp. 27-29, figs. 2.14 y 2.15), con las ecs. 2.47 a 2.50 del apartado
      2.4.3 (pp. 19-20) y la diapositiva 35 del tema. La ec. 2.50 trae una
      errata, dicha en la resolución. La figura y el ejemplo son nuestros,
      comprobados con el motor del curso y por un segundo camino.
    nivel: practica
    enunciado: |
      14. Círculos de Mohr en tres dimensiones. Tensión tangencial máxima.
    pide: >-
      Qué representan los tres círculos de Mohr de un estado general, dónde
      quedan los demás planos, cuánto vale la tangencial máxima y en qué
      planos actúa.
    pasos:
      - tipo: reconocer
        pregunta: |
          De los tres círculos de un punto, el que pasa por $\sigma_1$ y
          $\sigma_2$, ¿qué planos representa?
        opciones:
          - texto: >-
              Los planos paralelos a la dirección principal 3: en ellos
              $\sigma_n$ y $\tau_n$ no dependen de $\sigma_3$, y se estudian
              como en tensión plana
            correcta: true
            mensaje: |
              Eso es (diapositiva 35 del tema).
              Del mismo modo, el círculo 2-3 recoge los planos paralelos a la
              dirección 1, y el 3-1, los paralelos a la 2.
          - texto: >-
              Solo el plano que contiene las direcciones 1 y 2
            mensaje: |
              Ese plano tiene por normal la dirección 3, y su punto es
              $(\sigma_3, 0)$, en el eje. El círculo 1-2 es toda una familia
              de planos: los que contienen a la dirección 3.
          - texto: >-
              Todos los planos que pasan por el punto
            mensaje: |
              Los demás planos no caen en ese círculo: sus puntos llenan la
              zona entre el círculo grande y los dos pequeños (fig. 2.14).
          - texto: >-
              Los planos a 45° de las direcciones 1 y 2
            mensaje: |
              Esos son solo dos puntos del círculo 1-2: el más alto y el más
              bajo, donde la tangencial de esa familia es máxima.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica la cuestión como en un examen: los tres círculos y qué planos
          recoge cada uno, dónde quedan los demás, la tangencial máxima y sus
          planos, y el caso de la tensión plana.
        rubrica:
          - punto: >-
              En ejes principales el tensor es diagonal (ec. 2.47), con
              σ1 > σ2 > σ3, y hay un círculo por cada par de principales:
              1-2, 2-3 y 3-1 (fig. 2.14).
            porque: >-
              Son los tres círculos que nombra la cuestión.
            minimo: true
          - punto: >-
              El círculo 1-2 recoge los planos paralelos a la dirección 3,
              cuyas componentes intrínsecas no dependen de σ3; el 2-3, los
              paralelos a la 1; y el 3-1, los paralelos a la 2.
            porque: >-
              Es lo que significa cada círculo, y por qué se dibuja como en
              tensión plana.
            minimo: true
          - punto: >-
              Cualquier otro plano que pasa por el punto tiene sus
              componentes intrínsecas en la zona sombreada: dentro del círculo
              grande y fuera de los dos pequeños (fig. 2.14).
            porque: >-
              Es lo que los tres círculos dicen de todos los planos a la vez.
            minimo: true
          - punto: >-
              La tangencial máxima es el radio del círculo mayor:
              τmax = ½(σ1 − σ3).
            porque: >-
              Es la segunda mitad de la cuestión.
            minimo: true
          - punto: >-
              Actúa en los planos a 45° de las direcciones 1 y 3, que
              contienen a la 2, y en ellos σn = ½(σ1 + σ3), el centro del
              círculo mayor.
            porque: >-
              Dice dónde está, no solo cuánto vale.
          - punto: >-
              En tensión plana, z es principal con tensión nula, y la
              tangencial máxima no está siempre en el plano xy: depende de
              dónde caiga el cero respecto de las otras dos (fig. 2.15,
              casos a/, b/ y c/).
            porque: >-
              Es el error que más se comete con los tres círculos.
      - tipo: calcular
        titulo: La tangencial máxima del punto
        pregunta: |
          Un ejemplo nuestro: en un punto, el tensor de tensiones es

          $$
          [\sigma] = \begin{bmatrix} 70 & 0 & 0\\ 0 & 10 & -16\\ 0 & -16 & -14 \end{bmatrix}\ \text{MPa}
          $$

          ¿Cuánto vale la tensión tangencial máxima del punto, en MPa?
        respuesta:
          tipo: numero
          valor: '46'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '20'
            mensaje: |
              Ese es el radio del círculo del bloque $yz$, el de los planos
              paralelos a $x$. Con la principal de $x$, 70 MPa, el círculo
              mayor va de $-22$ a 70 MPa.
          - valor: '26'
            mensaje: |
              Ese es el radio del círculo 1-2, $\tfrac12(70 - 18)$. El mayor
              es el de las principales extremas, $\sigma_1$ y $\sigma_3$.
          - valor: '92'
            mensaje: |
              Ese es el diámetro, $\sigma_1 - \sigma_3$. La tangencial máxima
              es el radio, la mitad.
        pista: |
          $x$ ya es principal. Saca las otras dos del bloque $yz$ como en
          tensión plana, ordena las tres y toma el radio del círculo mayor.
        desarrollo: |
          El bloque $yz$ tiene centro $\tfrac12(10 - 14) = -2$ y radio
          $\sqrt{12^{2} + 16^{2}} = 20$, en MPa: sus principales son 18 y
          $-22$ MPa. Con la de $x$: $\sigma_1 = 70$, $\sigma_2 = 18$ y
          $\sigma_3 = -22$ MPa, y

          $$
          \tau_{max} = \tfrac12(\sigma_1 - \sigma_3) = \tfrac12(70 + 22) = 46
          $$

          en MPa.
      - tipo: calcular
        titulo: La normal en los planos de tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión normal $\sigma_n$ en los planos en que actúa
          esa tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '24'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '0'
            mensaje: |
              En los planos de tangencial máxima la normal no es nula: es el
              centro del círculo mayor, $\tfrac12(\sigma_1 + \sigma_3)$. Solo
              sería cero si $\sigma_3 = -\sigma_1$.
          - valor: '44'
            mensaje: |
              Ese es el centro del círculo 1-2, $\tfrac12(70 + 18)$. El de la
              tangencial máxima es el mayor, el de $\sigma_1$ y $\sigma_3$.
          - valor: '-2'
            mensaje: |
              Ese es el centro del círculo del bloque $yz$. Con la principal
              de $x$, el círculo mayor es otro.
        pista: |
          El punto más alto del círculo mayor está encima de su centro.
        desarrollo: |
          En MPa:

          $$
          \sigma_n = \tfrac12(\sigma_1 + \sigma_3) = \tfrac12(70 - 22) = 24
          $$

          Son los planos a 45° de las direcciones 1 ($x$) y 3, que contienen
          a la 2.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En ejes principales el tensor es diagonal, con
              $\sigma_1 > \sigma_2 > \sigma_3$.
          - texto: >-
              En los planos paralelos a la dirección 3, $\sigma_n$ y $\tau_n$ no
              dependen de $\sigma_3$: se estudian como en tensión plana, con el
              círculo de $\sigma_1$ y $\sigma_2$.
          - texto: >-
              Lo mismo con las direcciones 1 y 2: salen los círculos 2-3 y
              3-1.
          - texto: >-
              Los demás planos quedan en la zona entre el círculo grande y los
              dos pequeños.
          - texto: >-
              Así que la tangencial máxima es el radio del círculo grande,
              $\tfrac12(\sigma_1 - \sigma_3)$.
          - texto: >-
              En tensión plana la tangencial máxima es siempre el radio del
              círculo del plano $xy$.
            trampa: true
            mensaje: |
              Solo si las dos principales del plano tienen signos opuestos
              (fig. 2.15 a/). Si son del mismo signo, el cero de $z$ queda en un
              extremo y el círculo grande pasa por él: la tangencial máxima es
              la mitad de la principal del plano de mayor valor absoluto
              (casos b/ y c/).
    resolucion: |
      **Los tres círculos** (apuntes del tema 2, apartado 2.6.2, pp. 27-28).
      En ejes principales el tensor es diagonal (ec. 2.47), y se ordenan
      $\sigma_1 > \sigma_2 > \sigma_3$. El estado general de tensión está
      relacionado con tres círculos, que corresponden a los planos
      principales 1-2, 2-3 y 3-1 (fig. 2.14).

      **Qué recoge cada uno.** Lo dice la diapositiva 35 del tema: en
      cualquier plano paralelo a la dirección 3, las componentes intrínsecas
      no dependen de $\sigma_3$, solo de $\sigma_1$ y $\sigma_2$, y se pueden
      analizar como en tensión plana, con el círculo de Mohr 1-2. Del mismo
      modo, los planos paralelos a la dirección 1 van en el círculo 2-3, y
      los paralelos a la 2, en el 3-1.

      **Los demás planos.** Se puede demostrar que las componentes
      intrínsecas del vector tensión de cualquier plano que pasa por O están
      contenidas en el área sombreada de la fig. 2.14: dentro del círculo
      grande y fuera de los dos pequeños.

      **La tangencial máxima.** Es el radio del círculo mayor:

      $$
      \tau_{max} = \tfrac12(\sigma_1 - \sigma_3)
      $$

      Actúa en el punto más alto de ese círculo: los planos a 45° de las
      direcciones 1 y 3, que contienen a la 2, con
      $\sigma_n = \tfrac12(\sigma_1 + \sigma_3)$. Los apuntes también llegan
      a los máximos de $\tau_n$ como extremo condicionado (ecs. 2.48 a 2.50,
      pp. 19-20), un sistema que no es lineal; la ec. 2.50 escribe la
      derivada respecto de $\mu$, y es respecto de $\{n\}$ (la derivada
      respecto de $\mu$ solo devuelve la condición $\{n\}^{t}\{n\} = 1$).

      **En tensión plana** (fig. 2.15, pp. 28-29). La dirección $z$ es
      principal, con tensión nula, y la tangencial máxima no está siempre en
      el plano O$xy$. Los apuntes llaman 3 a la de $z$ aunque no sea la
      menor. Si las dos del plano tienen signos opuestos,
      $\tau_{max} = \tfrac12(\sigma_1 - \sigma_2)$ (caso a/); si las dos son
      positivas, $\tfrac12(\sigma_1 - \sigma_3) = \tfrac12\sigma_1$ (b/); y si
      las dos son negativas, $\tfrac12(\sigma_3 - \sigma_2) = \tfrac12(-\sigma_2)$
      (c/).

      **Un ejemplo nuestro.** Con el tensor de los pasos, $x$ ya es
      principal (70 MPa) y el bloque $yz$ da 18 y $-22$ MPa. Los tres
      círculos, en MPa: el 1-2, de centro 44 y radio 26; el 2-3, de centro
      $-2$ y radio 20; y el 3-1, de centro 24 y radio 46.

