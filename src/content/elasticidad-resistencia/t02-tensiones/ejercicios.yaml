      - **Las flechas, en números**, con $x'$ a 60° de $x$ e $y'$ a 150°: en
        las caras $x'$ la de 10 MPa entra, $\sigma_{x'} = -10$ MPa; en las
        $y'$ la de 30 MPa sale, $\sigma_{y'} = 30$ MPa. En la cara $x'$ de
        arriba, positiva, la tangencial apunta hacia $-30°$, al revés que
        $y'$: $\tau_{x'y'} = -11$ MPa. En las otras tres caras va como pide
        la reciprocidad.
      - **El convenio del círculo** (apuntes del tema 2, p. 26): un punto va
        arriba si las tangenciales de sus caras forman un par horario, y en
        el círculo se gira el doble de ángulo y en el mismo sentido que en el
        elemento.

      **2. Incógnitas.** $\sigma_x$, $\sigma_y$ y $\tau_{xy}$, y cómo son: de
      tracción o de compresión, y en qué sentido va la tangencial.

      **3. Ecuaciones.** El centro y el radio del círculo, y la ec. 2.61
      desde los ejes $x'y'$, con $\theta$ el ángulo de $x$ respecto de $x'$:

      $$
      C = \frac{\sigma_{x'} + \sigma_{y'}}{2}
      \qquad
      R = \sqrt{\left(\frac{\sigma_{x'} - \sigma_{y'}}{2}\right)^{2} + \tau_{x'y'}^{2}}
      $$

      $$
      \sigma_n = C + \frac{\sigma_{x'} - \sigma_{y'}}{2}\cos 2\theta + \tau_{x'y'}\operatorname{sen} 2\theta
      \qquad
      \tau_n = -\frac{\sigma_{x'} - \sigma_{y'}}{2}\operatorname{sen} 2\theta + \tau_{x'y'}\cos 2\theta
      $$

      **4. Resultados.** **El círculo.** En MPa, $x'$ va en
      $(\sigma_{x'}, -\tau_{x'y'}) = (-10, 11)$ e $y'$ en $(30, -11)$:

      $$
      C = \frac{-10 + 30}{2} = 10,\qquad R = \sqrt{20^{2} + 11^{2}} = \sqrt{521} = 22{,}83
      $$

      **El giro.** $x$ está a $-60°$ de $x'$, así que en el círculo se giran
      120° en sentido horario desde $x'$:

