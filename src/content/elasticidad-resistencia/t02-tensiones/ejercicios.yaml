        <line x1="251.9" y1="134" x2="229.4" y2="147" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
