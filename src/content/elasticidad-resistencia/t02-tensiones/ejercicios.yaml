          el círculo de Mohr del plano xy**, a ojo, con los puntos de las caras
          x e y.
        comprueba:
          - punto: |
              **Las caras x a tracción, con 400 MPa, y las y, con 200.**
            porque: |
              Son positivas: las flechas salen de las caras.
          - punto: |
              **En el círculo, el punto x abajo, en (400, 500), y el y arriba,
              en (200, 500).**
            porque: |
              Con $\tau_{xy} > 0$, las tangenciales de las caras x forman un par
              antihorario, y en el convenio del curso ese punto va abajo.
          - punto: |
              **El círculo corta el eje σ a los dos lados del origen.**
            porque: |
              Su radio, que se ve mayor que la distancia del centro al origen,
              lo lleva a la parte negativa: una de las principales es de
              compresión aunque $\sigma_x$ y $\sigma_y$ sean de tracción.
        figura: |
