      **5. Comprobación.** La ec. 2.61 en $x'$:
      $\sigma_n(30°) = 900 + 300\cos60° - 519{,}62\operatorname{sen}60° = 600$
      MPa, el dato. Y los invariantes del plano:
      $\sigma_1 + \sigma_2 = 1800 = \sigma_x + \sigma_y$ y
      $\sigma_1\sigma_2 = 450\,000$ MPa², igual que
      $\sigma_x\sigma_y - \tau_{xy}^{2}$. El motor del curso, con 1200, 600 y
      $-519{,}62$ MPa, da el mismo círculo y $\theta_1 = -30°$.

      **Lo que dice el resultado.** El círculo dibujado no es el único del
      punto: el 0 de $z$ queda por debajo de $\sigma_2$, así que el círculo
      grande va de 0 a 1500, y la tangencial máxima es
      $\tfrac12(1500 - 0) = 750$ MPa, mayor que el radio del dibujado.

  # ── Ejercicio de clase 2.8 · de las principales a los ejes xy.
  - id: ejerm2-cl2-8-de-las-principales-a-los-ejes-xy
    titulo: De las tensiones principales dibujadas al estado en x e y, y al plano perpendicular a una dirección
    fuente: >-
      Ejercicio 2.8 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ec. 2.61 de la tensión plana y Cauchy (ec. 2.14). Cada
      cifra sale del motor del curso (la ec. 2.61 girando desde los ejes
      principales hasta x e y, y desde x e y hasta la normal de a) y está
      comprobada por un segundo camino: el tensor montado como
      σ1·n1·n1ᵗ + σ2·n2·n2ᵗ y su vector tensión, proyectado sobre la normal
      de a y sobre su perpendicular. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        En los ejes principales el estado es el más sencillo: $\sigma_1$,
        $\sigma_2$ y ninguna tangencial. Cualquier otra dirección sale de girar
        desde ellos con las fórmulas del ángulo doble, contando el ángulo desde la
        dirección 1.
      formula: |
        Con $\varphi$ medido desde la 1 en sentido antihorario:

        $$
        \sigma = \frac{\sigma_1 + \sigma_2}{2} + \frac{\sigma_1 - \sigma_2}{2}\cos 2\varphi,\qquad \tau = -\frac{\sigma_1 - \sigma_2}{2}\sin 2\varphi
        $$

        Son las de la ec. 2.61 con la tangencial de partida nula.
      reconocer: |
        Te dan las principales con su dirección dibujada y piden el estado en
        otros ejes: es el camino inverso del de siempre. Todo depende de leer
        bien en la figura el ángulo de $x$ respecto de la 1, con su signo.
    enunciado: |
      Las direcciones principales 1 y 2 se indican en la figura, siendo
      $\sigma_1$ = 1000 MPa y $\sigma_2$ = 200 MPa. Determinar:

      a/ El estado tensional correspondiente a las direcciones $x$ e $y$.

      b/ Las componentes intrínsecas del vector tensión en el plano
      perpendicular a la dirección $a$.

