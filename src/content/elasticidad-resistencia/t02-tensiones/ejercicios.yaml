    pide: >-
      σx, σy y τxy, con el dibujo del elemento; y las tensiones principales y
      sus direcciones, también dibujadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El punto de $x$ está en la mitad de arriba del círculo. Con el
          convenio del curso, ¿qué dice eso de $\tau_{xy}$?
        opciones:
          - texto: Que es negativa, porque arriba van las caras cuyas tangenciales forman un par horario
            correcta: true
            mensaje: |
              Eso es. Con $\tau_{xy} > 0$ la tangencial sube por la cara
              derecha y baja por la izquierda: par antihorario, abajo. Aquí
              $x$ está arriba, así que sus tangenciales forman un par horario
              y $\tau_{xy} < 0$.
          - texto: Que es positiva, porque está por encima del eje σ
            mensaje: |
              Es el error más corriente: «arriba» invita a «positiva». En el
              convenio del curso, con $\tau_{xy} > 0$ el punto de $x$ va
              abajo (apuntes del tema 2, p. 26). Con el signo cambiado, la
              dirección principal sale al otro lado de $x$.
          - texto: Nada, porque el eje vertical es |τ| y el signo no se puede saber
            mensaje: |
              El eje mide el valor absoluto, pero la mitad no es
              indiferente: el convenio pone arriba los puntos con par
              horario y abajo los de par antihorario. Por eso en el círculo
              se gira en el mismo sentido que en el elemento.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el elemento en xy con lo que se
          sabe y el círculo con sus puntos**, el centro, $x$, $x'$ y el de la
          cara $y$.
        comprueba:
          - punto: |
              **En las caras x, 1200 MPa saliendo; $\sigma_y$ y $\tau_{xy}$,
              como incógnitas, dibujadas positivas.**
            porque: |
              Es lo que da el enunciado de la cara x. El signo de $\tau_{xy}$
              lo dice el círculo, no el dibujo del elemento.
          - punto: |
              **El centro C en el eje σ, en medio de $x$ y $x'$.**
            porque: |
              Los dos puntos están a la misma altura y a 60° del eje cada uno:
              son simétricos respecto de la vertical por C.
          - punto: |
              **El punto $y$, en el otro extremo del diámetro de $x$.**
            porque: |
              Las caras x e y forman 90° en el elemento, y en el círculo se
              gira el doble: 180°.
