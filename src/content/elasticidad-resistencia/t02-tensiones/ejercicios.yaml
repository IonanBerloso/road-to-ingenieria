      <figcaption>

      Redibujada del enunciado. A diferencia del original, el círculo está
      a escala. La dirección D, a 45° de x, está en el original y el
      enunciado no la usa.

      </figcaption>
      </figure>

      **Notas nuestras.** Los dos ángulos de 60° se miden desde el eje
      $\sigma$: el de $x$, por la derecha del centro, y el de $x'$, por la
      izquierda.
    pide: >-
      σx, σy y τxy, con el dibujo del elemento; y las tensiones principales y
      sus direcciones, también dibujadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El punto de $x$ está en la mitad de arriba del círculo. Con el
          convenio del curso, ¿qué dice eso de $\tau_{xy}$?
        opciones:
          - texto: Que es negativa, porque arriba van las caras cuyas tangenciales forman un par horario
            correcta: true
            mensaje: |
              Eso es. Con $\tau_{xy} > 0$ la tangencial sube por la cara
              derecha y baja por la izquierda: par antihorario, abajo. Aquí
              $x$ está arriba, así que sus tangenciales forman un par horario
              y $\tau_{xy} < 0$.
          - texto: Que es positiva, porque está por encima del eje σ
            mensaje: |
              Es el error más corriente: «arriba» invita a «positiva». En el
              convenio del curso, con $\tau_{xy} > 0$ el punto de $x$ va
              abajo (apuntes del tema 2, p. 26). Con el signo cambiado, la
              dirección principal sale al otro lado de $x$.
          - texto: Nada, porque el eje vertical es |τ| y el signo no se puede saber
            mensaje: |
              El eje mide el valor absoluto, pero la mitad no es
              indiferente: el convenio pone arriba los puntos con par
              horario y abajo los de par antihorario. Por eso en el círculo
              se gira en el mismo sentido que en el elemento.
      - tipo: calcular
        titulo: El radio del círculo
        pregunta: |
          ¿Cuánto vale el radio del círculo, en MPa?
        respuesta:
          tipo: numero
          valor: '600'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '300'
            mensaje: |
              Has tomado $x$ y $x'$ como los extremos de un diámetro,
              $\tfrac12(1200 - 600)$. Cada uno está a 60° del eje, no sobre
              él: la mitad de su separación es $R\cos60°$.
          - valor: '346.41'
            mensaje: |
              Has usado el seno de 60° donde va el coseno. La distancia
              horizontal del centro a $x$ es $R\cos60°$, así que
              $R = 300/0{,}5$.
          - valor: '900'
            mensaje: |
              Es el centro, $\tfrac12(1200 + 600)$. El radio es la distancia
              del centro a $x$.
        pista: |
          Por la simetría de la figura, el centro está en medio de
          $\sigma_x$ y $\sigma_{x'}$; y $\sigma_x = C + R\cos60°$.
        desarrollo: |
          En MPa:

          $$
          C = \frac{1200 + 600}{2} = 900,\qquad R = \frac{300}{\cos60°} = \frac{300}{0{,}5} = 600
          $$
      - tipo: calcular
        titulo: La tangencial en x
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-519.62'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '519.62'
            mensaje: |
              El valor es ese y el signo no. $x$ está arriba: sus
              tangenciales forman un par horario y $\tau_{xy} < 0$.
          - valor: '-300'
            mensaje: |
              Has usado el coseno donde va el seno: la altura del punto $x$
              es $R\operatorname{sen}60°$.
          - valor: '-259.81'
            mensaje: |
              Es la altura con el radio de 300, el que sale de tomar $x$ y
              $x'$ como extremos de un diámetro.
        pista: |
          El punto de $x$ es $(\sigma_x, -\tau_{xy})$: su altura es
          $R\operatorname{sen}60°$.
        desarrollo: |
          En MPa:

          $$
          |\tau_{xy}| = R\operatorname{sen}60° = 600\cdot\tfrac{\sqrt3}{2} = 519{,}62
          $$

          Arriba, $\tau_{xy} = -519{,}62$ MPa. El punto de $y$ está en el
          otro extremo del diámetro: $\sigma_y = 2C - \sigma_x = 1800 - 1200 = 600$
          MPa. Comprobación con la ec. 2.61 en $x'$, que está a $\theta = 30°$
          de $x$ (60° en el círculo, en sentido antihorario):
          $900 + 300\cos60° - 519{,}62\operatorname{sen}60° = 900 + 150 - 450 = 600$.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '1500'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '1200'
            mensaje: |
              Es $\sigma_x$, que también es $C + R$ con el radio de 300. $x$
              no es una dirección principal, porque su tangencial no es nula.
              La mayor es el extremo derecho del círculo.
          - valor: '1246.41'
            mensaje: |
              Es $C + R$ con el radio de 346,41, el del seno en lugar del
              coseno.
          - valor: '1719.62'
            mensaje: |
              Es $\sigma_x + |\tau_{xy}|$. La principal sale del círculo:
              centro más radio.
        pista: |
          $\sigma_{1,2} = C \pm R$; la tercera, la de $z$, es 0.
        desarrollo: |
          En MPa:

          $$
          \sigma_1 = 900 + 600 = 1500,\qquad \sigma_2 = 900 - 600 = 300
          $$

          y la de $z$, 0. Comprobación con los invariantes del plano:
          $\sigma_1 + \sigma_2 = 1800$, como $\sigma_x + \sigma_y$; y
          $1500\cdot300 = 1200\cdot600 - (300\cdot\sqrt3)^{2} = 450\,000$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿A qué ángulo de $x$ está la dirección principal 1, en grados,
          positivo en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '-30'
          tolerancia: 0.1
          formato: un número con su signo, en grados
        distractores:
          - valor: '30'
            mensaje: |
              El sentido. En el círculo, de $x$, arriba, a $\sigma_1$ se baja
              en sentido horario, y en el elemento también: la dirección 1
              está 30° por debajo de $x$.
          - valor: '-60'
            mensaje: |
              Es $2\theta_1$, el ángulo del círculo. En el elemento es la
              mitad.
          - valor: '60'
            mensaje: |
              Es la dirección 2, a 90° de la 1.
        pista: |
          $\tan2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62);
          o, en el círculo, el ángulo de $x$ a $\sigma_1$.
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{2\cdot(-519{,}62)}{1200 - 600} = -1{,}7321
          \;\Longrightarrow\; 2\theta_1 = -60°,\qquad \theta_1 = -30°
          $$

          En el círculo, $x$ está 60° por encima del eje, a la derecha del
          centro: para llegar a $\sigma_1$ se giran 60° en sentido horario.
          La dirección 2 está a $+60°$ de $x$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El centro está en medio de $x$ y $x'$, $C = 900$ MPa, y el
              radio es $R = 300/\cos60° = 600$ MPa.
          - texto: >-
              $x$ está arriba: $\tau_{xy} = -R\operatorname{sen}60° = -519{,}62$
              MPa; y $\sigma_y = 2C - \sigma_x = 600$ MPa.
          - texto: >-
              $\sigma_1 = 1500$ y $\sigma_2 = 300$ MPa, con $\sigma_3 = 0$, la
              de $z$.
          - texto: >-
              De $x$ a $\sigma_1$ se giran 60° en sentido horario en el
              círculo: la dirección 1 está a $-30°$ de $x$ y la 2, a $+60°$.
          - texto: >-
              $\tau_{xy} = +519{,}62$ MPa, porque el punto de $x$ está en la
              mitad de arriba.
            trampa: true
            mensaje: |
              Con el convenio del curso, arriba van las caras cuyas
              tangenciales forman un par horario, y eso es $\tau_{xy} < 0$.
              Con el signo cambiado, la dirección 1 saldría a $+30°$, al otro
              lado de $x$.
    resolucion: |
      **La idea.** El círculo lo da todo si se lee bien: el centro y el
      radio salen de las dos normales y de los dos ángulos de 60°, y el
      signo de $\tau_{xy}$ sale de la mitad en que está $x$. Con el convenio
      del curso (apuntes del tema 2, p. 26), un punto va arriba si las
      tangenciales de sus caras forman un par horario, y en el círculo se
      gira el doble de ángulo y en el mismo sentido que en el elemento.

      **El círculo.** $x$ y $x'$ están a la misma altura y a 60° del eje cada
      uno, así que el centro está en medio:

      $$
      C = \frac{1200 + 600}{2} = 900,\qquad R = \frac{1200 - 900}{\cos60°} = 600
      $$

      en MPa. De $x$ (a 60° por la derecha) a $x'$ (a 60° por la izquierda)
      hay 60° de círculo en sentido antihorario: $x'$ está a $\theta = 30°$
      de $x$ en el elemento.

      **a/ El estado en x e y.** La altura de $x$ es
      $R\operatorname{sen}60° = 519{,}62$ MPa, y está arriba: par horario,
      $\tau_{xy} = -519{,}62$ MPa. $y$ está en el otro extremo del diámetro,
      abajo: $\sigma_y = 2C - \sigma_x = 600$ MPa. Dibujado: tracción de
      1200 MPa en las caras $x$, tracción de 600 MPa en las $y$, y la
      tangencial bajando por la cara derecha, subiendo por la izquierda,
      hacia la izquierda en la de arriba y hacia la derecha en la de abajo.
      Comprobación con la ec. 2.61 en $x'$:
      $\sigma_n(30°) = 900 + 300\cos60° - 519{,}62\operatorname{sen}60° = 600$
      MPa, el dato.

      **b/ Las principales.** $\sigma_1 = C + R = 1500$ MPa y
      $\sigma_2 = C - R = 300$ MPa, con $\sigma_3 = 0$, la de $z$. De $x$ a
      $\sigma_1$ se baja 60° en sentido horario: la dirección 1 está a
      $\theta_1 = -30°$ de $x$, 30° por debajo, y la 2 a $+60°$. Lo confirma
      la ec. 2.62: $\tan2\theta_1 = 2\cdot(-519{,}62)/600 = -1{,}7321$.
      Dibujado: el elemento girado 30° en sentido horario, con 1500 MPa de
      tracción en las caras de normal a $-30°$, 300 MPa de tracción en las
      de normal a $60°$ y ninguna tangencial.

      **Comprobación.** $\sigma_1 + \sigma_2 = 1800 = \sigma_x + \sigma_y$ y
      $\sigma_1\sigma_2 = 450\,000$ MPa², igual que
      $\sigma_x\sigma_y - \tau_{xy}^{2}$. El motor del curso, con 1200, 600 y
      $-519{,}62$ MPa, da el mismo círculo y $\theta_1 = -30°$.

      **Y la tangencial máxima.** No se pide, pero aquí el 0 de $z$ queda
      por debajo de $\sigma_2$: el círculo grande del punto va de 0 a 1500, y
      la tangencial máxima es $\tfrac12(1500 - 0) = 750$ MPa, mayor que el
      radio del círculo dibujado.

  # ── Ejercicio de clase 2.8 · de las principales a los ejes xy.
  - id: ejerm2-cl2-8-de-las-principales-a-los-ejes-xy
    titulo: De las tensiones principales dibujadas al estado en x e y, y al plano perpendicular a una dirección
    fuente: >-
      Ejercicio 2.8 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ec. 2.61 de la tensión plana y Cauchy (ec. 2.14). Cada
      cifra sale del motor del curso (la ec. 2.61 girando desde los ejes
      principales hasta x e y, y desde x e y hasta la normal de a) y está
      comprobada por un segundo camino: el tensor montado como
      σ1·n1·n1ᵗ + σ2·n2·n2ᵗ y su vector tensión, proyectado sobre la normal
      de a y sobre su perpendicular. La figura está redibujada.
    nivel: practica
    enunciado: |
      Las direcciones principales 1 y 2 se indican en la figura, siendo
      $\sigma_1$ = 1000 MPa y $\sigma_2$ = 200 MPa. Determinar:

      a/ El estado tensional correspondiente a las direcciones $x$ e $y$.

      b/ Las componentes intrínsecas del vector tensión en el plano
      perpendicular a la dirección $a$.

      <figure class="figura-examen">
      <svg viewBox="0 0 384 360" role="img" width="384" height="360" aria-labelledby="ejerm2-cl2-8-de-las-principales-a-los-ejes-xy-fig-t ejerm2-cl2-8-de-las-principales-a-los-ejes-xy-fig-d">
      <title id="ejerm2-cl2-8-de-las-principales-a-los-ejes-xy-fig-t">Las direcciones principales 1 y 2 del ejercicio 2.8, la dirección a y el elemento con σ1 y σ2</title>
      <desc id="ejerm2-cl2-8-de-las-principales-a-los-ejes-xy-fig-d">Los ejes x hacia la derecha e y hacia arriba. Desde el origen salen tres rectas: la dirección 1, a 60° de x hacia arriba a la derecha, con el ángulo marcado; la 2, a 30° por debajo de x, perpendicular a la 1; y la a, con punta, a 45° por debajo de x, también con el ángulo marcado. En el origen, un elemento cuadrado girado, con sus caras perpendiculares a 1 y a 2. De las dos caras perpendiculares a 1 salen hacia fuera dos flechas huecas, según 1, rotuladas 1000 MPa; de las dos perpendiculares a 2 salen hacia fuera otras dos, según 2, rotuladas 200 MPa.</desc>
      <polygon points="150.44,165.56 116.44,224.44 57.56,190.44 91.56,131.56" fill="var(--paper)" fill-opacity="0.75" stroke="var(--ink)" stroke-width="1.3"/>
