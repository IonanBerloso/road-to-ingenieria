            <text x="387" y="86" font-size="10" text-anchor="start" fill="var(--d2-tinta)">τ<tspan font-size="7.5" dy="2.5">xy</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="298" y1="93.3" x2="298" y2="136.7" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
