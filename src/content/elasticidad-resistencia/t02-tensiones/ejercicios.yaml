ejercicios:
  # ── Ejemplo introductorio nuestro · el vector tensión de un plano.
  - id: ejerm2-el-vector-tension-de-un-plano
    titulo: El vector tensión de un plano oblicuo
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un punto de un sólido, el tensor de tensiones en los ejes $xyz$ es

      $$
      [\sigma] = \begin{bmatrix} -20 & 40 & 30\\ 40 & -10 & 20\\ 30 & 20 & 40 \end{bmatrix}\ \text{MPa}
      $$

      Para el plano que pasa por el punto y es perpendicular a la dirección
      $(1, 2, 2)$, calcular el vector tensión $\{S\}$, su componente normal
      $\sigma_n$ y su componente tangencial $\tau_n$.

      Un plano paralelo a ese, muy cerca del punto, corta de su entorno el
      tetraedro $OABC$ de la figura: la arista $OA$ mide el doble que $OB$ y
      que $OC$.

      <figure>
      <svg viewBox="20 14 300 222" role="img" width="300" height="222" aria-labelledby="ejerm2-el-vector-tension-de-un-plano-fig-t ejerm2-el-vector-tension-de-un-plano-fig-d">
      <title id="ejerm2-el-vector-tension-de-un-plano-fig-t">El tetraedro OABC que corta el plano, con la normal n de la cara ABC</title>
      <desc id="ejerm2-el-vector-tension-de-un-plano-fig-d">Los ejes x, y, z en perspectiva, con el origen O. El plano corta el eje x en A, a 2 unidades de O, y los ejes y y z en B y en C, a 1 unidad. La cara ABC del tetraedro está sombreada, y de un punto de ella sale la normal n, hacia fuera del tetraedro, en la dirección (1, 2, 2).</desc>
      <polygon points="73.79,194 230,150 150,70" fill="var(--live)" fill-opacity=".14" stroke="var(--live)" stroke-width="1.4"/>
      <line x1="150" y1="150" x2="51.27" y2="207" stroke="var(--ink)" stroke-width="1.2"/><polygon points="45.21,210.5 50.54,203.73 53.74,209.27" fill="var(--ink)"/>
      <line x1="150" y1="150" x2="279" y2="150" stroke="var(--ink)" stroke-width="1.2"/><polygon points="286,150 278,153.2 278,146.8" fill="var(--ink)"/>
      <line x1="150" y1="150" x2="150" y2="33" stroke="var(--ink)" stroke-width="1.2"/><polygon points="150,26 153.2,34 146.8,34" fill="var(--ink)"/>
      <text x="41.21" y="224.5" fill="var(--ink)" font-style="italic" font-size="13">x</text>
      <text x="290" y="164" fill="var(--ink)" font-style="italic" font-size="13">y</text>
      <text x="157" y="34" fill="var(--ink)" font-style="italic" font-size="13">z</text>
      <line x1="182.38" y1="122.4" x2="213.65" y2="87" stroke="var(--d2)" stroke-width="1.8"/><polygon points="218.95,81 215.84,90.26 210.14,85.23" fill="var(--d2)"/>
      <text x="224.95" y="79" font-weight="600" font-style="italic" fill="var(--d2-tinta)" font-size="13">n</text>
      <circle cx="150" cy="150" r="2.4" fill="var(--ink)"/>
      <text x="156" y="166" font-size="12" fill="var(--ink)" font-style="italic">O</text>
      <text x="83.79" y="214" font-size="12" fill="var(--ink)"><tspan font-style="italic">A</tspan> (2, 0, 0)</text>
      <text x="232" y="142" font-size="12" fill="var(--ink)"><tspan font-style="italic">B</tspan> (0, 1, 0)</text>
      <text x="142" y="74" font-size="12" fill="var(--ink)" text-anchor="end"><tspan font-style="italic">C</tspan> (0, 0, 1)</text>
      </svg>
      <figcaption>

      A escala cualquiera: lo que cuenta es la orientación de la cara ABC,
      no su tamaño. El tetraedro de los apuntes es infinitesimal. El eje x va
      en perspectiva, acortado: OA mide el doble que OB aunque en el dibujo
      no lo parezca.

      </figcaption>
      </figure>
    pide: >-
      El vector tensión {S} del plano, en MPa, y sus componentes intrínsecas
      σn y τn, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué vector $\{n\}$ va en $\{S\} = [\sigma]\{n\}$?
        opciones:
          - texto: $\tfrac13(1, 2, 2)$, la dirección dividida por su módulo
            correcta: true
            mensaje: |
              Eso es. $|(1, 2, 2)| = \sqrt{1 + 4 + 4} = 3$. La ecuación de
              Cauchy (apuntes, ec. 2.14, p. 11) sale de dividir el equilibrio
              del tetraedro por el área de $ABC$, y las áreas de las otras
              tres caras son esa área por $n_x$, $n_y$ y $n_z$ (ec. 2.11,
              p. 10): por eso $\{n\}$ tiene que ser unitario.
          - texto: $(1, 2, 2)$, tal como viene
            mensaje: |
              No es unitario: su módulo es 3. Con él, $\{S\}$ sale tres veces
              mayor y $\sigma_n$, nueve veces.
          - texto: '$\tfrac{1}{\sqrt6}(2, 1, 1)$, las aristas $OA$, $OB$ y $OC$ del tetraedro'
            mensaje: |
              Esas son las distancias a las que el plano corta los ejes, no su
              normal. Un plano que corta los ejes en $a$, $b$ y $c$ tiene la
              normal proporcional a $(1/a, 1/b, 1/c)$: con 2, 1 y 1,
              $(1/2, 1, 1)$, que es $(1, 2, 2)$ a otra escala. Con
              $(2, 1, 1)/\sqrt6$, $\sigma_n$ saldría 45 MPa.

      - tipo: calcular
        titulo: El vector tensión
        pregunta: |
          ¿Cuánto vale $\{S\}$, en MPa?
        respuesta:
          tipo: vector
          valor: '(40, 20, 50)'
          tolerancia: 0.05
          formato: tres componentes en MPa, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(120, 60, 150)'
            mensaje: |
              Has multiplicado por $(1, 2, 2)$ sin dividir entre su módulo,
              3. El vector de la ecuación de Cauchy es el unitario.
          - valor: '(-6.667, -6.667, 26.667)'
            mensaje: |
              Solo has usado la diagonal, $S_x = \sigma_x n_x$. En la cara $x$
              actúan también las tangenciales, y cada componente de $\{S\}$
              es una fila entera de $[\sigma]$ por $\{n\}$:
              $S_x = \sigma_x n_x + \tau_{xy} n_y + \tau_{xz} n_z$ (ec. 2.13).
        pista: |
          Cada componente es una fila de $[\sigma]$ por $\{n\} = \tfrac13(1, 2, 2)$.
        desarrollo: |
          $$
          S_x = \frac{-20 \cdot 1 + 40 \cdot 2 + 30 \cdot 2}{3} = \frac{120}{3} = 40\ \text{MPa}
          $$

          $$
          S_y = \frac{40 \cdot 1 - 10 \cdot 2 + 20 \cdot 2}{3} = \frac{60}{3} = 20\ \text{MPa}
          $$

          $$
          S_z = \frac{30 \cdot 1 + 20 \cdot 2 + 40 \cdot 2}{3} = \frac{150}{3} = 50\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La componente normal
        pregunta: |
          ¿Cuánto vale $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.5
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '180'
            mensaje: |
              Has proyectado $\{S\}$ sobre $(1, 2, 2)$ sin dividir entre 3.
              $\sigma_n = \{n\}^{t}\{S\}$, con el unitario.
          - valor: '11.11'
            mensaje: |
              Solo con la diagonal:
              $\sigma_x n_x^{2} + \sigma_y n_y^{2} + \sigma_z n_z^{2}$. Faltan
              los términos de las tangenciales,
              $2\tau_{xy} n_x n_y + 2\tau_{yz} n_y n_z + 2\tau_{zx} n_z n_x$.
              Proyectar el $\{S\}$ ya calculado los lleva dentro.
        pista: |
          $\sigma_n = \{n\}^{t}\{S\}$ (ec. 2.16): el producto escalar de $\{S\}$
          con la normal unitaria.
        desarrollo: |
          $$
          \sigma_n = \{n\}^{t}\{S\} = \frac{1 \cdot 40 + 2 \cdot 20 + 2 \cdot 50}{3} = \frac{180}{3} = 60\ \text{MPa}
          $$

          A tracción.

      - tipo: calcular
        titulo: La componente tangencial
        pregunta: |
          ¿Cuánto vale $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '67.08'
            mensaje: |
              Es $|S|$, el módulo del vector entero. $\tau_n$ es solo la
              parte de $\{S\}$ que queda en el plano, y se saca con Pitágoras:
              $\tau_n^{2} = |S|^{2} - \sigma_n^{2}$.
        pista: |
          $\{S\}$ es la suma de $\sigma_n\{n\}$ y de una parte en el plano,
          perpendiculares: $\tau_n^{2} = |S|^{2} - \sigma_n^{2}$ (p. 12).
        desarrollo: |
          $$
          |S|^{2} = 40^{2} + 20^{2} + 50^{2} = 4500\ \text{MPa}^{2}
          \qquad
          \tau_n = \sqrt{4500 - 60^{2}} = \sqrt{900} = 30\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El plano es perpendicular a $(1, 2, 2)$, de módulo 3: $\{n\} = \frac13(1, 2, 2)$.'
          - texto: 'En el tetraedro, las caras $OBC$, $OCA$ y $OAB$ miden el área de $ABC$ por $n_x$, $n_y$ y $n_z$: un tercio, dos tercios y dos tercios de ella.'
          - texto: 'El equilibrio del tetraedro, dividido por el área de $ABC$, da $\{S\} = [\sigma]\{n\} = (40, 20, 50)$ MPa.'
          - texto: '$\sigma_n = \{n\}^{t}\{S\} = 60$ MPa y $\tau_n = \sqrt{|S|^{2} - \sigma_n^{2}} = 30$ MPa.'
          - texto: 'Cada componente de $\{S\}$ es la tensión normal de su cara por su coseno: $S_x = \sigma_x n_x$.'
            trampa: true
            mensaje: |
              En la cara $x$ actúan $\sigma_x$ y también $\tau_{xy}$ y
              $\tau_{xz}$, y en el equilibrio según $x$ entran las tres caras:
              $S_x = \sigma_x n_x + \tau_{yx} n_y + \tau_{zx} n_z$ (ec. 2.13).
              Con la diagonal sola, $\{S\}$ saldría
              $(-6{,}67;\ -6{,}67;\ 26{,}67)$ MPa.
    resolucion: |
      **La normal.** El plano es perpendicular a $(1, 2, 2)$, que tiene
      módulo $\sqrt{1 + 4 + 4} = 3$:

      $$
      \{n\} = \frac{1}{3}\,(1, 2, 2)
      $$

      Es la normal de la cara $ABC$ de la figura: es perpendicular a
      $\vec{AB} = (-2, 1, 0)$ y a $\vec{AC} = (-2, 0, 1)$, porque
      $-2 + 2 = 0$ en los dos productos escalares.

      **El vector tensión.** La ecuación de Cauchy (apuntes, ec. 2.14,
      p. 11), fila a fila:

      $$
      \{S\} = [\sigma]\{n\} = \frac{1}{3}
      \begin{bmatrix} -20 \cdot 1 + 40 \cdot 2 + 30 \cdot 2\\ 40 \cdot 1 - 10 \cdot 2 + 20 \cdot 2\\ 30 \cdot 1 + 20 \cdot 2 + 40 \cdot 2 \end{bmatrix}
      = \frac{1}{3}\begin{bmatrix} 120\\ 60\\ 150 \end{bmatrix}
      = \begin{bmatrix} 40\\ 20\\ 50 \end{bmatrix}\ \text{MPa}
      $$

      **Sus dos componentes** (ec. 2.16 y la siguiente, p. 12). La normal es
      la proyección de $\{S\}$ sobre $\{n\}$:

      $$
      \sigma_n = \{n\}^{t}\{S\} = \frac{40 + 2 \cdot 20 + 2 \cdot 50}{3} = 60\ \text{MPa}
      $$

      a tracción. La tangencial es lo que queda, perpendicular a ella:

      $$
      |S|^{2} = 40^{2} + 20^{2} + 50^{2} = 4500\ \text{MPa}^{2}
      \qquad
      \tau_n = \sqrt{4500 - 60^{2}} = 30\ \text{MPa}
      $$

      En 3D, $\tau_n$ es un módulo: sale positiva siempre.

      **Comprobación por otro camino: el tetraedro.** Con las aristas de la
      figura, $OA = 2$ y $OB = OC = 1$, las caras de los ejes miden
      $OBC = \frac{1}{2}$, $OCA = 1$ y $OAB = 1$, y la cara oblicua,
      $ABC = \frac{1}{2}\,|\vec{AB} \times \vec{AC}| = \frac{1}{2}\,|(1, 2, 2)| = \frac{3}{2}$.
      Los cocientes son $\frac{1}{3}$, $\frac{2}{3}$ y $\frac{2}{3}$: las
      componentes de $\{n\}$ (ec. 2.11, p. 10). En la cara $OBC$, de normal
      $-x$, el vector tensión es $-(\sigma_x, \tau_{xy}, \tau_{xz})$, y así
      en las otras dos. El equilibrio según $x$, con las áreas de verdad:

      $$
      S_x \cdot \frac{3}{2} = -20 \cdot \frac{1}{2} + 40 \cdot 1 + 30 \cdot 1 = 60
      \;\Longrightarrow\;
      S_x = 40\ \text{MPa}
      $$

      el mismo. Y la parte tangencial, escrita como vector,
      $\{S\} - \sigma_n\{n\} = (40 - 20,\ 20 - 40,\ 50 - 40) = (20, -20, 10)$
      MPa, es perpendicular a $\{n\}$, porque $20 - 40 + 20 = 0$, y su
      módulo es $\sqrt{400 + 400 + 100} = 30$ MPa: $\tau_n$.

  # ── Ejemplo introductorio nuestro · las tensiones principales.
  - id: ejerm2-las-tres-principales-de-un-tensor
    titulo: Las tres tensiones principales de un tensor
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un punto de un sólido, el tensor de tensiones en los ejes $xyz$ es

      $$
      [\sigma] = \begin{bmatrix} 0 & 40 & 0\\ 40 & 60 & 0\\ 0 & 0 & 100 \end{bmatrix}\ \text{MPa}
      $$

      Calcular las tres tensiones principales y la dirección principal de
      $\sigma_2$, y comprobar el resultado con los invariantes.
    pide: >-
      Las tres tensiones principales, en MPa, la dirección principal de σ2 y
      el segundo invariante, en MPa².
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿hay alguna dirección que ya sea principal?
        opciones:
          - texto: 'Sí, la $z$: su fila y su columna no tienen nada fuera de la diagonal'
            correcta: true
            mensaje: |
              Eso es. En la cara $z$, $\{S\} = [\sigma]\{0, 0, 1\} = (0, 0, 100)$:
              normal a la cara, sin tangencial. $z$ es principal, con
              100 MPa, y queda el bloque 2×2 de $x$ e $y$, un problema plano
              (apuntes, ecs. 2.38 a 2.41, pp. 17-18, allí con $x$ como
              principal suelta).
          - texto: 'Sí, la $x$, porque $\sigma_x = 0$'
            mensaje: |
              Que el término de la diagonal sea cero no dice nada. Lo que hace
              principal una dirección son los ceros fuera de la diagonal en su
              fila. La fila de $x$ lleva $\tau_{xy} = 40$: en la cara $x$ hay
              tangencial, y $x$ no es principal.
          - texto: 'No: hay un término fuera de la diagonal, y hay que resolver la cúbica entera'
            mensaje: |
              Hay uno, $\tau_{xy}$, y solo mezcla $x$ con $y$. La cúbica sale,
              pero factorizada: $(100 - \sigma)$ por la ecuación del bloque.
              Buscar primero la fila con ceros te ahorra la cúbica.

      - tipo: calcular
        titulo: La mayor del bloque xy
        pregunta: |
          ¿Cuánto vale la mayor de las dos principales del bloque $xy$, en MPa?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '102.11'
            mensaje: |
              Has puesto $\sigma_x - \sigma_y$ entero bajo la raíz, sin
              dividir entre 2: $\sqrt{60^{2} + 40^{2}} = 72{,}11$. El radio es
              $\sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}} = 50$.
          - valor: '50'
            mensaje: |
              Es el radio del círculo del bloque. La principal es el centro
              más el radio: $30 + 50$.
        pista: |
          El bloque es un estado plano: centro
          $C = (\sigma_x + \sigma_y)/2$ y radio
          $R = \sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $$
          C = \frac{0 + 60}{2} = 30\ \text{MPa}
          \qquad
          R = \sqrt{30^{2} + 40^{2}} = 50\ \text{MPa}
          $$

          Las dos del bloque son $C \pm R$: 80 MPa y $-20$ MPa.

      - tipo: calcular
        titulo: La principal mayor
        pregunta: |
          Ordenadas de mayor a menor, ¿cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '80'
            mensaje: |
              Es la mayor del bloque $xy$, pero la de $z$, que ya era
              principal, es mayor. El orden $\sigma_1 > \sigma_2 > \sigma_3$
              (apuntes, p. 17) mete las tres.
        pista: |
          Junta la de $z$ con las dos del bloque y ordénalas.
        desarrollo: |
          Las tres son 100, 80 y $-20$ MPa:
          $\sigma_1 = 100$, $\sigma_2 = 80$ y $\sigma_3 = -20$ MPa. La mayor
          es la de $z$, la que no hubo que calcular.

      - tipo: calcular
        titulo: La dirección de σ2
        pregunta: |
          ¿Cuál es la dirección principal de $\sigma_2$, unitaria y con la
          componente $x$ positiva?
        respuesta:
          tipo: vector
          valor: '(0.4472, 0.8944, 0)'
          tolerancia: 0.005
          formato: tres componentes entre paréntesis, separadas por comas, con punto decimal
        distractores:
          - valor: '(0.8944, -0.4472, 0)'
            mensaje: |
              Es la dirección de $-20$, la otra del bloque. Es la que da
              $\tan 2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y) = -4/3$: con
              $\sigma_x < \sigma_y$, el ángulo que sale, $-26{,}57°$, es el de
              la principal menor. Comprueba siempre que $[\sigma]\{n\}$ sale
              $80\{n\}$.
          - valor: '(1, 2, 0)'
            mensaje: |
              Es la dirección, pero sin normalizar: su módulo es $\sqrt5$. La
              unitaria es $\tfrac{1}{\sqrt5}(1, 2, 0)$ (ec. 2.37, p. 17).
        pista: |
          Con $\sigma = 80$, la primera fila de $([\sigma] - \sigma[I])\{n\} = 0$
          (ec. 2.34) es $-80\,n_x + 40\,n_y = 0$, y la tercera,
          $(100 - 80)\,n_z = 0$.
        desarrollo: |
          $$
          -80\,n_x + 40\,n_y = 0 \;\Longrightarrow\; n_y = 2\,n_x
          \qquad
          20\,n_z = 0 \;\Longrightarrow\; n_z = 0
          $$

          Con $n_x^{2} + n_y^{2} + n_z^{2} = 1$, $5\,n_x^{2} = 1$:

          $$
          \{n_2\} = \frac{1}{\sqrt5}\,(1, 2, 0) = (0{,}4472;\ 0{,}8944;\ 0)
          $$

      - tipo: calcular
        titulo: El segundo invariante
        pregunta: |
          Con las componentes del tensor, ¿cuánto vale el segundo invariante
          $I_2$, en MPa²?
        respuesta:
          tipo: numero
          valor: '4400'
          tolerancia: 1
          formato: un número, en MPa²
        distractores:
          - valor: '7600'
            mensaje: |
              Has sumado $\tau_{xy}^{2}$ en vez de restarlo. Los cuadrados de
              fuera de la diagonal restan:
              $I_2 = \sigma_x\sigma_y + \sigma_y\sigma_z + \sigma_z\sigma_x - \tau_{xy}^{2} - \tau_{yz}^{2} - \tau_{zx}^{2}$
              (ec. 2.36, p. 17).
        pista: |
          $I_2 = \sigma_x\sigma_y + \sigma_y\sigma_z + \sigma_z\sigma_x - \tau_{xy}^{2} - \tau_{yz}^{2} - \tau_{zx}^{2}$.
        desarrollo: |
          $$
          I_2 = 0 \cdot 60 + 60 \cdot 100 + 100 \cdot 0 - 40^{2} = 6000 - 1600 = 4400\ \text{MPa}^{2}
          $$

          Con las principales:
          $100 \cdot 80 + 80 \cdot (-20) + (-20) \cdot 100 = 8000 - 1600 - 2000 = 4400$,
          el mismo.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La fila de $z$ solo tiene el término de la diagonal: $z$ es principal, con 100 MPa.'
          - texto: 'Queda el bloque $xy$, con centro 30 MPa y radio 50 MPa: sus principales son 80 y $-20$ MPa.'
          - texto: 'Ordenadas, $\sigma_1 = 100$, $\sigma_2 = 80$ y $\sigma_3 = -20$ MPa.'
          - texto: 'La dirección de $\sigma_2$ sale de $-80\,n_x + 40\,n_y = 0$ y $n_z = 0$: $\frac{1}{\sqrt5}(1, 2, 0)$.'
          - texto: '$I_1 = 160$ MPa e $I_2 = 4400$ MPa² salen iguales con las componentes y con las principales.'
          - texto: 'La traza es la comprobación completa: si $\sigma_1 + \sigma_2 + \sigma_3 = \sigma_x + \sigma_y + \sigma_z$, las tres están bien.'
            trampa: true
            mensaje: |
              La traza no ve un radio mal calculado: el centro más el radio y
              el centro menos el radio suman el doble del centro con cualquier
              radio. Con el radio sin la mitad, $102{,}11 + 100 - 42{,}11 = 160$
              también. $I_2$ sí lo ve: con esos valores sale 1700, no 4400.
    resolucion: |
      **Lo que se ve antes de calcular.** La fila y la columna de $z$ solo
      tienen el 100 de la diagonal. En la cara $z$ el vector tensión es
      $[\sigma]\{0, 0, 1\} = (0, 0, 100)$ MPa: normal a la cara, sin
      tangencial. Así que $z$ es principal, con 100 MPa, y la ecuación
      característica (apuntes, ec. 2.35, p. 16) se parte en ese factor y el
      bloque $2 \times 2$ de $x$ e $y$, que es un problema plano (ecs. 2.38 a
      2.41, pp. 17-18, donde la principal suelta es la $x$).

      **El bloque.** Centro y radio de su círculo:

      $$
      C = \frac{\sigma_x + \sigma_y}{2} = \frac{0 + 60}{2} = 30\ \text{MPa}
      \qquad
      R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}} = \sqrt{30^{2} + 40^{2}} = 50\ \text{MPa}
      $$

      Sus dos principales son $C + R = 80$ y $C - R = -20$ MPa. Lo mismo sale
      de la ecuación de segundo grado del bloque,
      $\sigma^{2} - 60\,\sigma - 1600 = 0$, que da
      $\sigma = 30 \pm \sqrt{900 + 1600} = 30 \pm 50$.

      **Las tres, ordenadas** (p. 17): $\sigma_1 = 100$, $\sigma_2 = 80$ y
      $\sigma_3 = -20$ MPa. La mayor es la de $z$, la que no hubo que
      calcular.

      **La dirección de σ2.** Con $\sigma = 80$ en el sistema
      $([\sigma] - \sigma[I])\{n\} = 0$ (ec. 2.34, p. 16):

      $$
      -80\,n_x + 40\,n_y = 0 \;\Longrightarrow\; n_y = 2\,n_x
      \qquad
      (100 - 80)\,n_z = 0 \;\Longrightarrow\; n_z = 0
      $$

      y con el módulo unitario (ec. 2.37, p. 17),
      $\{n_2\} = \frac{1}{\sqrt5}\,(1, 2, 0) = (0{,}4472;\ 0{,}8944;\ 0)$.
      Comprobación: $[\sigma]$ por $(1, 2, 0)$ da $0 \cdot 1 + 40 \cdot 2 = 80$
      en $x$ y $40 \cdot 1 + 60 \cdot 2 = 160$ en $y$, es decir, $80$ veces
      $(1, 2, 0)$. La de $\sigma_3$ es la perpendicular dentro del plano $xy$,
      $\frac{1}{\sqrt5}(2, -1, 0)$, y la de $\sigma_1$, el eje $z$.

      Ojo con $\tan 2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y) = -4/3$: da
      $\theta = -26{,}57°$, que es la dirección de $-20$, no la de 80. Con
      $\sigma_x < \sigma_y$, el ángulo de la fórmula es el de la principal
      menor del bloque. En el ejemplo del círculo de Mohr, con
      $\sigma_x > \sigma_y$, la misma fórmula daba la dirección 1; aquí, con
      $\sigma_x < \sigma_y$, da la menor del bloque.

      **Comprobación con los invariantes** (ec. 2.36, p. 17). Con las
      componentes y con las principales tienen que salir lo mismo:

      $$
      I_1 = 0 + 60 + 100 = 160\ \text{MPa}
      \qquad
      100 + 80 - 20 = 160\ \text{MPa}
      $$

      $$
      I_2 = 0 \cdot 60 + 60 \cdot 100 + 100 \cdot 0 - 40^{2} = 4400\ \text{MPa}^{2}
      \qquad
      100 \cdot 80 + 80 \cdot (-20) + (-20) \cdot 100 = 4400\ \text{MPa}^{2}
      $$

      $$
      I_3 = \det[\sigma] = 100\,(0 \cdot 60 - 40^{2}) = -160\,000\ \text{MPa}^{3}
      \qquad
      100 \cdot 80 \cdot (-20) = -160\,000\ \text{MPa}^{3}
      $$

      La traza sola no basta como comprobación: no ve un radio mal
      calculado, porque $(C + R) + (C - R) = 2C$ con cualquier $R$. Con el
      radio sin la mitad, $72{,}11$, las tres serían $102{,}11$, $100$ y
      $-42{,}11$, que también suman 160; pero su $I_2$ sale 1700, no 4400.

  - id: ejerm2-circulo-de-mohr-en-tension-plana
    titulo: Un estado de tensión plana, con su círculo de Mohr entero
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      En un punto de una chapa hay un estado de tensión plana con
      $\sigma_x = 90\ \text{MPa}$, $\sigma_y = 30\ \text{MPa}$ y
      $\tau_{xy} = 40\ \text{MPa}$, en el convenio del curso
      ($\sigma_z = \tau_{xz} = \tau_{yz} = 0$). Calcular las tensiones
      principales, el ángulo que forma la dirección principal 1 con el eje
      $x$ y la tensión tangencial máxima del punto.
    pide: La principal mayor, el ángulo de la dirección 1 con x y la tangencial máxima del punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          En tensión plana, ¿qué papel juega la tensión $\sigma_z = 0$ al buscar
          la tangencial máxima del punto?
        opciones:
          - texto: Es una tensión principal más, y hay que ordenarla con las dos del plano
            correcta: true
            mensaje: |
              Eso es. En tensión plana $z$ es dirección principal y su tensión
              vale cero. Las tres del punto son las dos del plano y ese cero, y
              la tangencial máxima es $(\sigma_1 - \sigma_3)/2$ con las tres
              ordenadas.
          - texto: Ninguno, porque el estado es plano y todo está en el círculo del plano xy
            mensaje: |
              El círculo del plano $xy$ da las tensiones de los planos
              **paralelos a $z$**. Hay otros planos que pasan por el punto, y en
              alguno de ellos la tangencial puede ser mayor que el radio de ese
              círculo.
          - texto: Solo importa si las dos tensiones del plano son de compresión
            mensaje: |
              También importa si las dos son de tracción, que es justo este caso.
              El cero solo deja de mandar cuando las dos del plano tienen signo
              contrario: entonces queda en medio y el grande es el del plano.

      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor del plano, en MPa?
        respuesta:
          tipo: numero
          valor: '110'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '132.11'
            mensaje: |
              Has metido $\sigma_x - \sigma_y$ en el radio sin dividir entre 2:
              $\sqrt{60^{2} + 40^{2}}$. El radio es
              $\sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}} = \sqrt{30^{2} + 40^{2}}$.
          - valor: '60'
            mensaje: |
              Eso es el centro del círculo, la media de $\sigma_x$ y $\sigma_y$.
              La principal mayor está un radio a la derecha: $C + R$.
          - valor: '50'
            mensaje: |
              Eso es el radio. La principal se mide desde el origen, no desde
              el centro: $\sigma_1 = C + R$.
        pista: |
          Centro $C = (\sigma_x + \sigma_y)/2$ y radio
          $R = \sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $$
          C = \frac{90 + 30}{2} = 60 \qquad
          R = \sqrt{30^{2} + 40^{2}} = 50 \qquad
          \sigma_1 = C + R = 110\ \text{MPa}
          $$

          Y la otra del plano, $\sigma_2 = C - R = 10\ \text{MPa}$.

      - tipo: calcular
        titulo: El ángulo de la dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección principal 1 con el eje $x$, en grados,
          positivo en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '26.57'
          tolerancia: 0.2
          formato: un número, en grados
        distractores:
          - valor: '53.13'
            mensaje: |
              Ese es $2\theta_1$, el ángulo del círculo. En la pieza los ángulos
              son la mitad: $\theta_1 = 26{,}57°$.
          - valor: '-26.57'
            mensaje: |
              El valor es bueno y el sentido no. Con $\tau_{xy} > 0$ las caras
              $x$ forman un par antihorario y $x$ va **abajo** en el círculo;
              de ahí a la dirección 1 se sube, y en la pieza se gira en sentido
              antihorario. Si pusiste $x$ arriba, giraste al revés.
        pista: |
          $\tan 2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$, y el ángulo de
          la pieza es la mitad del que sale.
        desarrollo: |
          $$
          \tan 2\theta_1 = \frac{2 \cdot 40}{90 - 30} = \frac{4}{3}
          \;\Longrightarrow\; 2\theta_1 = 53{,}13° \;\Longrightarrow\; \theta_1 = 26{,}57°
          $$

          Como $\sigma_x > \sigma_y$, este ángulo da la principal mayor: lo
          confirma $\sigma_n(\theta_1) = 110$ en la fórmula del
          ángulo doble.

      - tipo: calcular
        titulo: La tangencial máxima del punto
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del punto, en MPa?
        respuesta:
          tipo: numero
          valor: '55'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Ese es el radio del círculo del plano $xy$: la máxima entre los
              planos paralelos a $z$. Con $\sigma_z = 0$ las tres principales
              son $110$, $10$ y $0$, y el círculo
              grande va de 0 a $110$.
          - valor: '40'
            mensaje: |
              Esa es $\tau_{xy}$, la tangencial en las caras $x$ e $y$. En
              otras caras es mayor: la máxima sale de las principales.
        pista: |
          Ordena las tres principales, la de $z$ incluida, y usa
          $\tau_{\max} = (\sigma_1 - \sigma_3)/2$.
        desarrollo: |
          $$
          \sigma_1 = 110,\quad \sigma_2 = 10,\quad \sigma_3 = 0
          \qquad \tau_{\max} = \frac{110 - 0}{2} = 55\ \text{MPa}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El centro es $C = (90 + 30)/2 = 60$ y el radio $R = \sqrt{30^{2} + 40^{2}} = 50$ MPa.'
          - texto: 'Las principales del plano son $C \pm R$: $110$ y $10$ MPa.'
          - texto: Con τxy positiva, x va abajo en el círculo y la dirección 1 está girada θ1 en sentido antihorario.
          - texto: 'La tensión de $z$ es principal y vale cero, así que las tres son $110$, $10$ y $0$.'
          - texto: 'La tangencial máxima es $(110 - 0)/2 = 55$ MPa.'
          - texto: 'La tangencial máxima es el radio del círculo, $50$ MPa.'
            trampa: true
            mensaje: |
              El radio es la máxima en los planos paralelos a $z$. Con las dos
              principales del plano de tracción, el cero de $z$ queda fuera y
              el círculo grande es el que va de 0 a $110$.
    resolucion: |
      **El círculo del plano.** Centro y radio:

      $$
      C = \frac{\sigma_x + \sigma_y}{2} = 60 \qquad
      R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}} = \sqrt{30^{2} + 40^{2}} = 50\ \text{MPa}
      $$

      así que $\sigma_1 = C + R = 110$ y $\sigma_2 = C - R = 10$ MPa.

      **La dirección.** $\tan 2\theta_1 = 2 \cdot 40/(90 - 30) = 4/3$, luego
      $2\theta_1 = 53{,}13°$ y $\theta_1 = 26{,}57°$. Con
      $\tau_{xy} > 0$ las caras $x$ forman un par antihorario: $x$ va abajo en
      el círculo, y de ahí a 1 se sube. En la pieza, la dirección 1 está
      girada $26{,}57°$ en sentido antihorario desde $x$, y la 2,
      perpendicular, a $116{,}57°$.

      **La tangencial máxima.** En tensión plana $z$ es principal con
      tensión nula. Las tres del punto son $110$, $10$
      y $0$ MPa, y

      $$
      \tau_{\max} = \frac{\sigma_1 - \sigma_3}{2} = \frac{110 - 0}{2} = 55\ \text{MPa}
      $$

      mayor que el radio del círculo del plano, $50$ MPa. Actúa en
      los planos a 45° de las direcciones 1 y $z$, que contienen la 2.

