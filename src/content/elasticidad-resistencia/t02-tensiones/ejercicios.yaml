      **Notas nuestras.** La dirección a sale de la esquina de abajo a la
      izquierda formando 60° con la cara de abajo: está a 60° de $x$. El
      plano perpendicular a la dirección a es el que la tiene por normal.
    pide: >-
      Las tensiones principales y su dirección; la tangencial máxima, sus
      planos y la tensión normal que los acompaña; y σn y τn del plano
      perpendicular a la dirección a.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el convenio del curso, ¿dónde va el punto de $x$,
          $(\sigma_x, |\tau_{xy}|) = (400, 500)$, en el círculo de Mohr?
        opciones:
          - texto: En la mitad de abajo, porque las tangenciales de las caras $x$ forman un par antihorario
            correcta: true
            mensaje: |
              Eso es. Con $\tau_{xy} > 0$ la tangencial sube por la cara
              derecha y baja por la izquierda: par antihorario, y $x$ va abajo.
              El de $y$, $(200, 500)$, va arriba, en el otro extremo del
              diámetro, y en el círculo se gira en el mismo sentido que en el
              elemento.
          - texto: En la mitad de arriba, porque $\tau_{xy}$ es positiva
            mensaje: |
              Es el error de colocación más corriente: «positiva» invita a
              subir. En el convenio del curso las caras $x$ forman un par
              antihorario y $x$ va abajo. Arriba, el círculo sale igual, pero
              el ángulo gira al revés y la dirección principal cae al otro lado
              de $x$.
          - texto: En la mitad de abajo, y el de $y$ también, porque su tangencial también vale 500
            mensaje: |
              Los puntos de $x$ y de $y$ están siempre en los extremos de un
              diámetro: en las caras $y$ la tangencial forma un par horario, y
              $y$ va arriba.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor del plano, $\sigma_1$, en
          MPa?
        respuesta:
          tipo: numero
          valor: '809.9'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '838.52'
            mensaje: |
              Has usado $\sigma_x - \sigma_y$ entera en el radio. El radio es
              la hipotenusa de $\tfrac12(\sigma_x - \sigma_y) = 100$ y
              $\tau_{xy} = 500$.
          - valor: '300'
            mensaje: |
              Es el centro del círculo. La principal es el extremo derecho:
              el centro más el radio.
        pista: |
          Centro $C = \tfrac12(\sigma_x + \sigma_y)$ y radio
          $R = \sqrt{\left(\tfrac12(\sigma_x - \sigma_y)\right)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $$
          C = \frac{400 + 200}{2} = 300,\qquad R = \sqrt{100^{2} + 500^{2}} = 509{,}90\ \text{MPa}
          $$

          $\sigma_1 = 300 + 509{,}90 = 809{,}90$ MPa y
          $\sigma_2 = 300 - 509{,}90 = -209{,}90$ MPa. La tercera, la de $z$,
          es 0 y queda entre las dos.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿A qué ángulo de $x$, en grados y en sentido antihorario, está la
          normal del plano principal 1?
        respuesta:
          tipo: numero
          valor: '39.35'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '78.69'
            mensaje: |
              Es $2\theta_1$, el ángulo que se gira en el círculo. En el
              elemento el ángulo es la mitad.
          - valor: '-39.345'
            mensaje: |
              El signo. En el círculo, el punto de $x$ está abajo, y para
              llegar a $\sigma_1$ se sube, en sentido antihorario: en el
              elemento también se gira en sentido antihorario.
        pista: |
          $\tan2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$; con
          $\sigma_x > \sigma_y$, la dirección 1 está a menos de 45° de $x$.
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{2\cdot500}{400 - 200} = 5
          \;\Longrightarrow\; 2\theta_1 = 78{,}69°,\qquad \theta_1 = 39{,}35°
          $$

          Comprobación con la ec. 2.61: a $39{,}35°$,
          $\tau_n = -100\operatorname{sen}78{,}69° + 500\cos78{,}69° = -98{,}06 + 98{,}06 = 0$.
          La dirección 2 está a $129{,}35°$.
      - tipo: calcular
        titulo: La tangencial máxima del punto
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del punto, en MPa?
        respuesta:
          tipo: numero
          valor: '509.9'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '404.95'
            mensaje: |
              Es $(\sigma_1 - 0)/2$: has tomado el 0 de $z$ como la menor de
              las tres. La menor es $\sigma_2 = -209{,}90$ MPa, y el círculo
              grande es el del plano $xy$.
          - valor: '538.52'
            mensaje: |
              Es el radio con $\sigma_x - \sigma_y$ entera,
              $\sqrt{200^{2} + 500^{2}}$: el cateto horizontal es la mitad,
              100.
        pista: |
          Ordena las tres principales, con el 0 de $z$ dentro:
          $\tau_{max} = \tfrac12(\sigma_{mayor} - \sigma_{menor})$.
        desarrollo: |
          $$
          \tau_{max} = \frac{809{,}90 - (-209{,}90)}{2} = 509{,}90\ \text{MPa}
          $$

          Es el radio del círculo del plano $xy$, porque el 0 queda entre
          $\sigma_1$ y $\sigma_2$. Actúa en los planos a $\theta_1 \pm 45°$,
          a $84{,}35°$ y a $-5{,}65°$ de $x$, y en los dos $\sigma_n = C = 300$ MPa.
      - tipo: calcular
        titulo: La normal del plano perpendicular a la dirección a
        pregunta: |
          El plano perpendicular a la dirección a tiene por normal la propia a,
          a 60° de $x$. ¿Cuánto vale su tensión normal $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '683.01'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '-83.01'
            mensaje: |
              Es la del plano que contiene la dirección a, el de normal a
              150°. «Perpendicular a la dirección a» quiere decir que a es su
              normal.
          - valor: '783.01'
            mensaje: |
              Has girado $\theta = 60°$ en el círculo en vez de
              $2\theta = 120°$: $300 + 100\cos60° + 500\operatorname{sen}60°$.
              En el círculo los ángulos van dobles.
        pista: |
          En el círculo se giran $2\theta = 120°$ desde el punto de $x$; con
          la fórmula,
          $\sigma_n = C + \tfrac12(\sigma_x - \sigma_y)\cos2\theta + \tau_{xy}\operatorname{sen}2\theta$.
        desarrollo: |
          $$
          \sigma_n = 300 + 100\cos120° + 500\operatorname{sen}120° = 300 - 50 + 433{,}01 = 683{,}01\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial del plano perpendicular a la dirección a
        pregunta: |
          ¿Y su tensión tangencial $\tau_n$, en MPa, con el convenio del tema
          2: positiva si va según $\hat t$, la normal girada 90° en sentido
          antihorario?
        respuesta:
          tipo: numero
          valor: '-336.6'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '336.6'
            mensaje: |
              El valor es ese y el signo no: sale negativa, así que la
              tangencial va al revés que $\hat t$ (que está a 150°): apunta
              hacia $-30°$. En el círculo, su punto queda en la mitad de
              arriba.
          - valor: '761.45'
            mensaje: |
              Es $|\vec S| = \sqrt{\sigma_n^{2} + \tau_n^{2}}$, el vector
              tensión entero. $\tau_n$ es su componente en el plano.
        pista: |
          $\tau_n = \dfrac{\sigma_y - \sigma_x}{2}\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
          (ec. 2.61), con $2\theta = 120°$.
        desarrollo: |
          $$
          \tau_n = -100\operatorname{sen}120° + 500\cos120° = -86{,}60 - 250 = -336{,}60\ \text{MPa}
          $$

          Por Cauchy, con $\vec n = (\cos60°, \operatorname{sen}60°)$:
          $\vec S = [\sigma]\{n\} = (633{,}01;\ 423{,}21)$ MPa, y
          $\vec S\cdot\hat t = -633{,}01\cdot0{,}86603 + 423{,}21\cdot0{,}5 = -336{,}60$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El círculo tiene centro 300 y radio 509,90 MPa; el punto de $x$,
              $(400, 500)$, va abajo y el de $y$, $(200, 500)$, arriba.
          - texto: >-
              $\sigma_1 = 809{,}90$ MPa a $39{,}35°$ de $x$ y
              $\sigma_2 = -209{,}90$ MPa a $129{,}35°$; la de $z$ es 0.
          - texto: >-
              La tangencial máxima es el radio, 509,90 MPa, en los planos a
              $84{,}35°$ y $-5{,}65°$, con $\sigma_n = 300$ MPa en los dos.
          - texto: >-
              En el plano de normal a, a 60°: $\sigma_n = 683{,}01$ MPa y
              $\tau_n = -336{,}60$ MPa.
          - texto: >-
              Como en tensión plana $\sigma_z = 0$, la tangencial máxima del
              punto es $\sigma_1/2 = 404{,}95$ MPa.
            trampa: true
            mensaje: |
              Eso vale cuando el 0 es la menor de las tres principales. Aquí
              $\sigma_2 = -209{,}90$ MPa es menor que 0: el círculo grande es el
              del plano $xy$, y $\tau_{max} = \tfrac12(809{,}90 + 209{,}90) = 509{,}90$ MPa.
    resolucion: |
      **La idea.** El círculo de Mohr del plano tiene el centro en la media de
      $\sigma_x$ y $\sigma_y$ y pasa por los puntos de $x$ y de $y$, que son
      los extremos de un diámetro. Con el convenio del curso (apuntes del
      tema 2, p. 26), con $\tau_{xy} > 0$ las caras $x$ forman un par
      antihorario y el punto de $x$ va abajo; así, en el círculo se gira en el
      mismo sentido que en el elemento, el doble de ángulo.

      Los dibujos que pide el enunciado, el elemento girado con sus
      tensiones en cada caso, quedan para ti: aquí van los valores y los
      ángulos con los que se dibujan.

      **El círculo.** Centro y radio:

      $$
      C = \frac{400 + 200}{2} = 300\ \text{MPa},\qquad
      R = \sqrt{100^{2} + 500^{2}} = 509{,}90\ \text{MPa}
      $$

      con $x$ en $(400, 500)$, abajo, e $y$ en $(200, 500)$, arriba.

