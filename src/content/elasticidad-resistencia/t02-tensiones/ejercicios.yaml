      <path d="M242.59 316.59 A196 196 0 0 0 300 178" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="300,178 302.6,184.5 297.4,184.5" fill="var(--ink)"/><polygon points="242.59,316.59 245.35,310.16 249.03,313.84" fill="var(--ink)"/>
      <text x="189" y="24.92" font-size="13" fill="var(--ink)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">1</text>
      <text x="253.49" y="278" font-size="13" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">2</text>
      <text x="249.81" y="331.81" font-size="13" fill="var(--ink)" font-style="italic" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">a</text>
      <text x="348" y="168" font-size="13" fill="var(--ink)" font-style="italic" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x</text>
      <text x="114" y="30" font-size="13" fill="var(--ink)" font-style="italic" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">y</text>
      <text x="282.7" y="72.84" fill="var(--ink)" font-size="12" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">60°</text>
      <text x="296.19" y="267.79" fill="var(--ink)" font-size="12" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">45°</text>
      <text x="161.29" y="116.57" font-size="12" fill="var(--d2-tinta)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">1000 MPa</text>
      <text x="192.16" y="195.46" font-size="12" fill="var(--d1)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">200 MPa</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la dirección 1 a 60° de x, la 2
      perpendicular a ella y la a a 45° por debajo de x. Las flechas huecas
      son σ₁ y σ₂, en las caras del elemento perpendiculares a cada
      dirección.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no acota el ángulo de la 2: es
      perpendicular a la 1. En b/, el ángulo de $a$ se cuenta desde $x$,
      positivo en sentido antihorario, y $\tau_n$ lleva el convenio del
      tema 2: positiva según $\hat t$, la normal girada 90° en sentido
      antihorario.
    pide: >-
      σx, σy y τxy; y σn y τn del plano perpendicular a la dirección a.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para pasar de los ejes 1-2 a los $xy$ con la ec. 2.61, el ángulo
          se cuenta desde la dirección 1. ¿A qué ángulo de la 1 está el eje
          $x$, positivo en sentido antihorario?
        opciones:
          - texto: $-60°$, porque $x$ está 60° por debajo de la 1
            correcta: true
            mensaje: |
              Eso es. La 1 está a 60° de $x$ en sentido antihorario, así que,
              vista desde la 1, $x$ está a $-60°$, e $y$ a $+30°$. Con esos
              ángulos, la ec. 2.61 desde los ejes 1-2, donde no hay
              tangencial, da $\sigma_x$, $\sigma_y$ y $\tau_{xy}$.
          - texto: $+60°$, el ángulo que marca la figura
            mensaje: |
              La figura marca la 1 vista desde $x$. Desde la 1, $x$ está al
              otro lado, a $-60°$. Con $+60°$, $\sigma_x$ sale igual, pero
              $\tau_{xy}$ sale con el signo cambiado.
          - texto: $-30°$, porque $x$ está a 30° de la 2
            mensaje: |
              $x$ está a 30° de la 2, pero la ec. 2.61 se escribe desde la
              dirección que hace de eje $x$ en los ejes principales, la 1.
              Desde la 1, $x$ está a $-60°$; con $-30°$ saldría el estado en
              otra dirección.
      - tipo: calcular
        titulo: La normal en x
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '800'
            mensaje: |
              Es $\sigma_y$. Sale aquí si has cambiado $x$ por $y$, si has
              puesto $\theta$ donde va $2\theta$ ($600 + 400\cos60°$) o si
              has usado el ángulo con la 2 como si fuera el ángulo con la 1.
          - valor: '673.21'
            mensaje: |
              Te faltan los cuadrados:
              $\sigma_x = \sigma_1\cos^{2}60° + \sigma_2\operatorname{sen}^{2}60°$.
              Un coseno sale al formar el vector tensión y otro al
              proyectarlo.
          - valor: '600'
            mensaje: |
              Es el centro del círculo, $\tfrac12(\sigma_1 + \sigma_2)$: falta
              el término del ángulo doble.
        pista: |
          $\sigma_x = \sigma_1\cos^{2}\varphi + \sigma_2\operatorname{sen}^{2}\varphi$,
          con $\varphi$ el ángulo entre $x$ y la 1.
        desarrollo: |
          En MPa:

          $$
          \sigma_x = 1000\cos^{2}60° + 200\operatorname{sen}^{2}60° = 1000\cdot0{,}25 + 200\cdot0{,}75 = 250 + 150 = 400
          $$

          Con la ec. 2.61 desde los ejes 1-2 y $\theta = -60°$:
          $600 + 400\cos(-120°) = 600 - 200 = 400$.
      - tipo: calcular
        titulo: La tangencial en x
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '346.41'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-346.41'
            mensaje: |
              El signo: has girado $+60°$ desde la 1. $x$ está a $-60°$ de la
              1, y $\tfrac12(\sigma_2 - \sigma_1)\operatorname{sen}(-120°)$ es
              $-400$ por un seno negativo.
          - valor: '400'
            mensaje: |
              Es el radio del círculo, $\tfrac12(\sigma_1 - \sigma_2)$: la
              tangencial máxima del plano, que no está en $x$.
          - valor: '692.82'
            mensaje: |
              Te sobra un 2: es $(\sigma_1 - \sigma_2)\operatorname{sen}120°$
              sin el ½.
        pista: |
          En los ejes 1-2 no hay tangencial:
          $\tau_{xy} = \tfrac12(\sigma_2 - \sigma_1)\operatorname{sen}2\varphi$,
          con $\varphi = -60°$.
        desarrollo: |
          En MPa:

          $$
          \tau_{xy} = \frac{200 - 1000}{2}\operatorname{sen}(-120°) = -400\cdot\left(-\tfrac{\sqrt3}{2}\right) = 346{,}41
          $$

          Y $\sigma_y = 1000\cos^{2}30° + 200\operatorname{sen}^{2}30° = 750 + 50 = 800$
          MPa. Comprobación con la ec. 2.62:
          $\tan2\theta_1 = \dfrac{2\cdot346{,}41}{400 - 800} = -1{,}7321$,
          y como el numerador es positivo y el denominador negativo,
          $2\theta_1 = 120°$: $\theta_1 = 60°$, la 1 de la figura.
      - tipo: calcular
        titulo: La normal del plano de a
        pregunta: |
          ¿Cuánto vale la tensión normal $\sigma_n$ del plano perpendicular a
          la dirección $a$, en MPa?
        respuesta:
          tipo: numero
          valor: '253.59'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '946.41'
            mensaje: |
              Tres errores dan este número: el plano que contiene a la
              dirección $a$, el de normal a $+45°$; la $a$ con el ángulo
              cambiado de signo; o $\tau_{xy}$ arrastrada del apartado a/ con
              el signo cambiado, $-346{,}41$ MPa, porque con $2\theta = -90°$
              queda $\sigma_n = 600 - \tau_{xy}$. El plano perpendicular a $a$
              tiene por normal la propia $a$, a $-45°$, y $\tau_{xy}$ es
              positiva.
          - valor: '213.63'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$ en la ec. 2.61.
          - valor: '600'
            mensaje: |
              Es el centro del círculo, la normal de los planos a 45° de las
              principales. $a$ está a 45° de $x$, no de la 1: de la 1 la
              separan 105°.
        pista: |
          La normal es la propia $a$, a $\theta = -45°$ de $x$: en la
          ec. 2.61, $2\theta = -90°$.
        desarrollo: |
          En MPa:

          $$
          \sigma_n = 600 - 200\cos(-90°) + 346{,}41\operatorname{sen}(-90°) = 600 - 0 - 346{,}41 = 253{,}59
          $$

          Desde las principales, con $a$ a $-105°$ de la 1:
          $1000\cos^{2}105° + 200\operatorname{sen}^{2}105° = 66{,}99 + 186{,}60 = 253{,}59$.
      - tipo: calcular
        titulo: La tangencial del plano de a
        pregunta: |
          ¿Y su tensión tangencial $\tau_n$, en MPa, con el convenio del tema
          2?
        respuesta:
          tipo: numero
          valor: '-200'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '200'
            mensaje: |
              El valor es ese y el signo no: sale negativa, así que la
              tangencial va al revés que $\hat t$, que está a $+45°$; apunta
              hacia $-135°$.
          - valor: '322.97'
            mensaje: |
              Es $|\vec S| = \sqrt{\sigma_n^{2} + \tau_n^{2}}$, el vector
              tensión entero. $\tau_n$ es su componente en el plano.
          - valor: '103.53'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$ en la ec. 2.61.
        pista: |
          $\tau_n = \tfrac12(\sigma_y - \sigma_x)\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
          (ec. 2.61), con $2\theta = -90°$.
        desarrollo: |
          En MPa:

          $$
          \tau_n = 200\operatorname{sen}(-90°) + 346{,}41\cos(-90°) = -200
          $$

          Por Cauchy, con $\vec n = (\cos45°, -\operatorname{sen}45°)$:
          $\vec S = [\sigma]\{n\} = (37{,}89;\ -320{,}74)$ MPa; su
          proyección sobre $\vec n$ es 253,59 MPa y sobre
          $\hat t = (\operatorname{sen}45°, \cos45°)$, $-200$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En los ejes 1-2 no hay tangencial; $x$ está a $-60°$ de la 1, e
              $y$ a $+30°$.
          - texto: >-
              $\sigma_x = 400$, $\sigma_y = 800$ y $\tau_{xy} = 346{,}41$ MPa;
              $\sigma_x + \sigma_y = 1200$, como $\sigma_1 + \sigma_2$.
          - texto: >-
              La normal del plano perpendicular a $a$ es la propia $a$, a
              $-45°$ de $x$.
          - texto: >-
              $\sigma_n = 253{,}59$ MPa y $\tau_n = -200$ MPa, con
              $|\vec S| = 322{,}97$ MPa.
          - texto: >-
              El plano perpendicular a $a$ es el que contiene a $a$: su normal
              está a $+45°$ y $\sigma_n = 946{,}41$ MPa.
            trampa: true
            mensaje: |
              «Perpendicular a la dirección $a$» quiere decir que $a$ es su
              normal. El que contiene a $a$ es otro plano, el de normal a
              $+45°$.
    resolucion: |
      **La idea.** En los ejes principales el estado es el más sencillo:
      $\sigma_1$ según 1, $\sigma_2$ según 2 y ninguna tangencial. Cualquier
      otra dirección sale de girar desde ellos con la ec. 2.61 (p. 23),
      contando el ángulo desde la 1; y el plano de $a$, de girar desde $xy$.

      **a/ El estado en x e y.** La 1 está a 60° de $x$, así que $x$ está a
      $\varphi = -60°$ de la 1 e $y$ a $+30°$. Con centro
      $\tfrac12(1000 + 200) = 600$ y semidiferencia
      $\tfrac12(1000 - 200) = 400$, en MPa:

      $$
      \sigma_x = 600 + 400\cos(-120°) = 400,\qquad \sigma_y = 600 + 400\cos60° = 800
      $$

      $$
      \tau_{xy} = -400\operatorname{sen}(-120°) = 346{,}41
      $$

      Comprobación: $\sigma_x + \sigma_y = 1200 = \sigma_1 + \sigma_2$ y
      $\sigma_x\sigma_y - \tau_{xy}^{2} = 320\,000 - 120\,000 = 200\,000$ MPa²,
      igual que $\sigma_1\sigma_2$. Y por la ec. 2.62 se vuelve a la 1:
      $\tan2\theta_1 = 2\cdot346{,}41/(400 - 800) = -1{,}7321$, con
      $2\theta_1 = 120°$ y $\theta_1 = 60°$. Dibujado: tracción de 400 MPa
      en las caras $x$, de 800 MPa en las $y$, y la tangencial positiva,
      subiendo por la cara derecha.

      **b/ El plano perpendicular a a.** Su normal es la $a$, a
      $\theta = -45°$ de $x$:

      $$
      \sigma_n = 600 - 200\cos(-90°) + 346{,}41\operatorname{sen}(-90°) = 253{,}59
      $$

      $$
      \tau_n = 200\operatorname{sen}(-90°) + 346{,}41\cos(-90°) = -200
      $$

      en MPa. La tangencial es negativa: va al revés que $\hat t$, que está
      a $+45°$, así que apunta hacia $-135°$.

      **Comprobación por Cauchy.** Con $[\sigma]$ montado desde las
      principales,
      $[\sigma] = \sigma_1\{n_1\}\{n_1\}^{t} + \sigma_2\{n_2\}\{n_2\}^{t}$,
      y $\vec n = (\cos45°, -\operatorname{sen}45°)$, el vector tensión es
      $\vec S = (37{,}89;\ -320{,}74)$ MPa, de módulo 322,97 MPa; su
      proyección sobre $\vec n$ da 253,59 MPa y sobre $\hat t$, $-200$ MPa.
      Y desde las principales, con $a$ a $-105°$ de la 1:
      $1000\cos^{2}105° + 200\operatorname{sen}^{2}105° = 253{,}59$ MPa.

  # ── Ejercicio de clase 2.9 · del elemento girado a los ejes xy.
  - id: ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy
    titulo: Del elemento girado 60° a σx, σy y τxy, con el círculo de Mohr
    fuente: >-
      Ejercicio 2.9 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio de signos del curso, el del círculo (apuntes
      del tema 2, p. 26) y la ec. 2.61. Cada cifra sale del motor del curso
      (la ec. 2.61 girando desde los ejes del elemento hasta x e y, y el
      círculo) y está comprobada por un segundo camino: el giro de la matriz
      con [R], los invariantes del plano y el giro de vuelta, que devuelve
      los datos. Se conserva «11MPa», sin espacio, como en el original. La
      figura del enunciado está redibujada, con las flechas en los sentidos
      del original ampliado; el círculo de la resolución es nuestro.
    nivel: practica
    enunciado: |
      En el estado de tensión plana de la figura, las tensiones normales son
      10 y 30 MPa y la tensión cortante 11MPa. Calcular $\sigma_x$,
      $\sigma_y$ y $\tau_{xy}$ utilizando el círculo de Mohr e indicar cómo
      son.

