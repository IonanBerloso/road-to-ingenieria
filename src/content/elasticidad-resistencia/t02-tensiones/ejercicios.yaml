      <figcaption>

      Solo lo que empuja según x, con su sentido positivo; cada componente, multiplicada por el área de su cara. En las caras z, que son el propio papel, va lo mismo con τzx.

      </figcaption>
      </figure>

      - **Cada componente**, de una cara a la opuesta, crece su derivada por
        el lado: por eso entran las derivadas y no los valores.
      - **Las unidades**: las tensiones, en kp/mm², con las coordenadas en
        metros; un kilopondio, 9,81 N.

      **2. Incógnitas.** La fuerza de volumen $(F_x, F_y, F_z)$, y la
      esférica y la desviadora del tensor en P(0, 1, −1).

      **3. Ecuaciones.** Las de equilibrio interno (ecs. 2.3 y 2.4, p. 7): en
      cada eje, las derivadas de las tres componentes que empujan en esa
      dirección, cada una respecto de la coordenada de su cara, más la fuerza
      de volumen, suman cero:

      $$
      \frac{\partial\sigma_x}{\partial x} + \frac{\partial\tau_{yx}}{\partial y} + \frac{\partial\tau_{zx}}{\partial z} + F_x = 0
      $$

      y las otras dos igual. En el punto, la descomposición (ecs. 2.51 a
      2.54): $[\sigma] = \sigma_e[I] + [\sigma_d]$, con $\sigma_e = I_1/3$.

      **4. Resultados.** **a/** El campo es lineal: las derivadas son
      números. En (kp/mm²)/m:

      $$
      \begin{aligned}
      F_x &= -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right) = -(4 - 6 + 1) = 1\\
      F_y &= -\left(\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z}\right) = -(-6 + 10 + 0) = -4\\
      F_z &= -\left(\tau_{xz,x} + \tau_{yz,y} + \sigma_{z,z}\right) = -(0 + 0 + 5) = -5
      \end{aligned}
      $$

      Cada (kp/mm²)/m son $9{,}81\cdot10^{6}$ N/m³, porque un mm² es
      $10^{-6}$ m²:

      $$
      \vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}\ \text{N/m}^{3}
      $$

      la misma en todo el sólido. Con 9,80665 N por kilopondio cambia la
      cuarta cifra: $(9{,}807;\ -39{,}23;\ -49{,}03)\cdot10^{6}$ N/m³.

      **b/** En P(0, 1, −1) las tres tangenciales se anulan y el tensor es
      diagonal, con $\sigma_x = 3$, $\sigma_y = 20$ y $\sigma_z = -5$ kp/mm².
      La esférica lleva en la diagonal la media, $\sigma_e = 18/3 = 6$
      kp/mm², y la desviadora es lo que queda:

      $$
      \begin{bmatrix} 3 & 0 & 0\\ 0 & 20 & 0\\ 0 & 0 & -5 \end{bmatrix}
      = \begin{bmatrix} 6 & 0 & 0\\ 0 & 6 & 0\\ 0 & 0 & 6 \end{bmatrix}
      + \begin{bmatrix} -3 & 0 & 0\\ 0 & 14 & 0\\ 0 & 0 & -11 \end{bmatrix}
      $$

      en kp/mm². En MPa, la esférica es 58,86 en la diagonal.

      **5. Comprobación.** El tensor de P, componente a componente:
      $4 \cdot 0 + 3 \cdot 1 = 3$, $10\,(1 + 1) = 20$, $5 \cdot (-1) = -5$, y
      las tangenciales, $-6\,(0 + 1 - 1)$, $1 - 1$ y $3 \cdot 0$, todas nulas.
      La desviadora tiene traza $-3 + 14 - 11 = 0$, como tiene que tener. Y las
      derivadas, hechas por diferencias sobre el propio campo en un punto
      cualquiera, dan las mismas tres de arriba.

      **Lo que dice el resultado.** La fuerza de volumen sale enorme: su
      módulo, $9{,}81\cdot10^{6}\sqrt{1 + 16 + 25} = 63{,}6\cdot10^{6}$ N/m³,
      es unas 800 veces el peso propio del acero, $77\cdot10^{3}$ N/m³. Un
      campo así no lo sostiene la gravedad: hace falta otra fuerza de volumen,
      o el campo no es de un sólido real.

  # ── Ejercicio de clase 2.4 · la misma octaédrica a tracción y a cortante.
  - id: ejerm2-cl2-4-la-misma-octaedrica-a-traccion-y-a-cortante
    titulo: Una tracción y una cortadura pura con la misma tangencial octaédrica
    fuente: >-
      Ejercicio 2.4 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con las tensiones octaédricas del ejercicio 2.2. Cada cifra
      sale del motor del curso (las principales de cada tensor y las
      componentes intrínsecas en el plano octaédrico de sus ejes
      principales) y está comprobada por un segundo camino: la fórmula con
      los invariantes y una tensión equivalente del tema 6.
    nivel: practica
    antes:
      idea: |
        La tangencial octaédrica depende solo de las tensiones principales, no de
        los ejes. Para comparar dos estados distintos se sacan las principales de
        cada uno, se calcula la octaédrica de los dos y se igualan.
      formula: |
        $$
        \tau_{oct} = \frac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}
        $$

        La del ejercicio 2.2. Vale para cualquier estado, porque las principales
        existen siempre.
      reconocer: |
        Dos cuerpos con estados sencillos y una condición que los iguala: es
        comparar una magnitud que no depende de los ejes. Mira si cada estado ya
        está en ejes principales o no.
    enunciado: |
      En el sistema de referencia Oxyz el cuerpo A está sometido a la
      tensión $\sigma_x = \sigma_0$ siendo nulas las demás componentes. El
      cuerpo B está sometido a $\tau_{xy} = \tau_0$ siendo nulas las demás
      componentes. Si la tensión cortante octaédrica (ejercicio 2.2) es la
      misma en ambos casos, determinar la relación $\sigma_0/\tau_0$.
    pide: >-
      La relación σ0/τ0 con la que la tensión cortante octaédrica de los dos
      cuerpos es la misma.
    pasos:
      - tipo: reconocer
        pregunta: |
          La fórmula del 2.2 pide las tensiones principales. ¿Cuáles son las
          del cuerpo B?
        opciones:
          - texto: $\tau_0$, $0$ y $-\tau_0$
            correcta: true
            mensaje: |
              Eso es. El bloque $xy$,
              $\begin{bmatrix} 0 & \tau_0\\ \tau_0 & 0\end{bmatrix}$, tiene
              los autovalores $\pm\tau_0$, en las direcciones a ±45° de $x$, y
              $z$ ya es principal, con 0. La cortadura pura es una tracción y
              una compresión iguales.
          - texto: $\tau_0$, $\tau_0$ y $0$, porque $\tau_{xy}$ y $\tau_{yx}$ valen las dos $\tau_0$
            mensaje: |
              $\tau_{xy}$ y $\tau_{yx}$ son la misma tangencial vista desde
              las dos caras, no dos principales. Las principales son los
              autovalores: $\lambda^{2} - \tau_0^{2} = 0$ da $\pm\tau_0$.
          - texto: $\tau_0$, $0$ y $0$, como en A con $\tau_0$ en lugar de $\sigma_0$
            mensaje: |
              Así sería una tracción. Una tangencial sola en Oxyz es, en los
              ejes a 45°, una tracción $\tau_0$ y una compresión $-\tau_0$ a
              la vez.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **los elementos de los dos
          cuerpos**, vistos desde z, cada uno con sus tensiones.
        comprueba:
          - punto: |
              **En A, $\sigma_0$ saliendo de las dos caras x y nada en las y.**
            porque: |
              Es una tracción según x: con $\sigma_0$ positiva, la flecha sale
              de la cara.
          - punto: |
              **En B, $\tau_0$ en las cuatro caras y ninguna normal.**
            porque: |
              La tangencial de las caras x y la de las y valen lo mismo: si
              solo estuviera en las x, el elemento giraría. Las cuatro forman
              dos pares que se equilibran.
          - punto: |
              **En las caras z de los dos, nada.**
            porque: |
              Las tres componentes con z son nulas: z es dirección principal
              en los dos cuerpos, con tensión nula.
        figura: |
          <svg viewBox="0 0 470 200" role="img" width="470" height="200" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Los elementos de los cuerpos A y B</title>
            <desc id="dsl-d">A la izquierda, el elemento del cuerpo A, con sigma cero saliendo de las caras x y nada en las y. A la derecha, el del cuerpo B, sin tensiones normales y con la tangencial tau cero: sube por la cara derecha, baja por la izquierda, va a la derecha por arriba y a la izquierda por abajo. Vistos desde z; en las caras z de los dos, nada.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M75 65 L145 65 L145 135 L75 135 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M310 65 L380 65 L380 135 L310 135 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="158" y1="100" x2="188" y2="100" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="193" y="104" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="62" y1="100" x2="32" y2="100" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="387" y1="121.7" x2="387" y2="78.3" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="392" y="71" font-size="10" text-anchor="start" fill="var(--flag)">τ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="303" y1="78.3" x2="303" y2="121.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="323.3" y1="58" x2="366.7" y2="58" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="366.7" y1="142" x2="323.3" y2="142" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <text x="40" y="34" font-size="11" font-weight="700" fill="var(--ink)">A</text>
            <text x="270" y="34" font-size="11" font-weight="700" fill="var(--ink)">B</text>
          </svg>

      - tipo: calcular
        titulo: La octaédrica de A
        pregunta: |
          ¿Cuánto vale $\tau_{\text{oct}}$ en el cuerpo A, en unidades de
          $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '0.4714'
          tolerancia: 0.0005
          formato: un número, en unidades de σ0
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $\sigma_0/2$, la tangencial máxima de A, en los planos a 45°
              de $x$. La octaédrica es otra:
              $\tfrac13\sqrt{\sigma_0^{2} + 0 + \sigma_0^{2}}$.
          - valor: '0.3333'
            mensaje: |
              Es $\sigma_{\text{oct}} = \sigma_0/3$, la componente normal en
              el plano octaédrico. Se pide la tangencial.
          - valor: '1.4142'
            mensaje: |
              Te falta el ⅓ de la fórmula del 2.2:
              $\tau_{\text{oct}} = \tfrac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$.
        pista: |
          Las principales de A son $\sigma_0$, 0 y 0: lleva sus diferencias a
          la fórmula del 2.2.
        desarrollo: |
          $$
          \tau_{\text{oct},A} = \frac13\sqrt{(\sigma_0 - 0)^{2} + (0 - 0)^{2} + (0 - \sigma_0)^{2}} = \frac{\sqrt2}{3}\,\sigma_0
          $$

          y $\tfrac{\sqrt2}{3} = 0{,}4714$.
      - tipo: calcular
        titulo: La octaédrica de B
        pregunta: |
          ¿Cuánto vale $\tau_{\text{oct}}$ en el cuerpo B, en unidades de
          $\tau_0$?
        respuesta:
          tipo: numero
          valor: '0.8165'
          tolerancia: 0.0005
          formato: un número, en unidades de τ0
        distractores:
          - valor: '0.4714'
            mensaje: |
              Sale con las principales mal: $\tau_0$, 0 y 0, o $\tau_0$,
              $\tau_0$ y 0, dan los dos $\tfrac{\sqrt2}{3}\tau_0$. Las de la
              cortadura pura son $\tau_0$, 0 y $-\tau_0$.
          - valor: '1'
            mensaje: |
              Es $\tau_0$, la tangencial máxima de B:
              $\tfrac12\left(\tau_0 - (-\tau_0)\right)$. La octaédrica es
              menor.
          - valor: '2.4495'
            mensaje: |
              Te falta el ⅓ de la fórmula del 2.2.
        pista: |
          Con las principales $\tau_0$, 0 y $-\tau_0$, las tres diferencias
          valen $\tau_0$, $\tau_0$ y $2\tau_0$.
        desarrollo: |
          $$
          \tau_{\text{oct},B} = \frac13\sqrt{\tau_0^{2} + \tau_0^{2} + (2\tau_0)^{2}} = \frac{\sqrt6}{3}\,\tau_0
          $$

          y $\tfrac{\sqrt6}{3} = 0{,}8165$.
      - tipo: calcular
        titulo: La relación entre σ0 y τ0
        pregunta: |
          ¿Cuánto vale $\sigma_0/\tau_0$?
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Sale con las principales de B mal, $\tau_0$ y dos ceros: los dos
              cuerpos parecen el mismo y el cociente vale 1.
          - valor: '2'
            mensaje: |
              Has igualado las tangenciales máximas, $\sigma_0/2 = \tau_0$:
              es lo que pediría Tresca. Con la tangencial octaédrica, que es
              lo de von Mises, sale otro número.
          - valor: '0.5774'
            mensaje: |
              Es $\tau_0/\sigma_0$, el cociente al revés.
        pista: |
          Iguala $\tfrac{\sqrt2}{3}\,\sigma_0$ y $\tfrac{\sqrt6}{3}\,\tau_0$.
        desarrollo: |
          $$
          \frac{\sqrt2}{3}\,\sigma_0 = \frac{\sqrt6}{3}\,\tau_0
          \;\Longrightarrow\; \frac{\sigma_0}{\tau_0} = \frac{\sqrt6}{\sqrt2} = \sqrt3 = 1{,}7321
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las principales de A son $\sigma_0$, 0 y 0, y
              $\tau_{\text{oct},A} = \tfrac{\sqrt2}{3}\,\sigma_0$.
          - texto: >-
              Las de B son $\tau_0$, 0 y $-\tau_0$, y
              $\tau_{\text{oct},B} = \tfrac{\sqrt6}{3}\,\tau_0$.
          - texto: >-
              Igualándolas, $\sigma_0/\tau_0 = \sqrt3$.
          - texto: >-
              Es la relación que da von Mises entre una tracción y una
              cortadura pura: la tensión equivalente de B es $\sqrt3\,\tau_0$.
          - texto: >-
              Como $\tau_{xy} = \tau_{yx} = \tau_0$, las principales de B son
              $\tau_0$, $\tau_0$ y 0.
            trampa: true
            mensaje: |
              Las dos son la misma tangencial, vista desde las caras $x$ y
              desde las $y$. Las principales son los autovalores del bloque
              $xy$, $\pm\tau_0$, y la de $z$, 0.
    resolucion: |
      **1. El estado de tensión.** Es comparar dos estados distintos con una
      magnitud que no depende de los ejes: el dibujo lleva los dos elementos,
      vistos desde z.

      <figure class="figura-examen">
      <svg viewBox="0 0 470 200" role="img" width="705" height="300" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Los elementos de los cuerpos A y B</title>
        <desc id="dsl-d">A la izquierda, el elemento del cuerpo A, con sigma cero saliendo de las caras x y nada en las y. A la derecha, el del cuerpo B, sin tensiones normales y con la tangencial tau cero: sube por la cara derecha, baja por la izquierda, va a la derecha por arriba y a la izquierda por abajo. Vistos desde z; en las caras z de los dos, nada.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M75 65 L145 65 L145 135 L75 135 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M310 65 L380 65 L380 135 L310 135 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="158" y1="100" x2="188" y2="100" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="193" y="104" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="62" y1="100" x2="32" y2="100" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="387" y1="121.7" x2="387" y2="78.3" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="392" y="71" font-size="10" text-anchor="start" fill="var(--flag)">τ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="303" y1="78.3" x2="303" y2="121.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="323.3" y1="58" x2="366.7" y2="58" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="366.7" y1="142" x2="323.3" y2="142" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <text x="40" y="34" font-size="11" font-weight="700" fill="var(--ink)">A</text>
        <text x="270" y="34" font-size="11" font-weight="700" fill="var(--ink)">B</text>
      </svg>
      <figcaption>

      Los dos elementos, vistos desde z, con sus tensiones en su sentido positivo. En las caras z de los dos no hay nada: el eje z es principal, con tensión nula.

      </figcaption>
      </figure>

      - **El cuerpo A** ya está en ejes principales: $\sigma_0$, 0 y 0.
      - **El cuerpo B** tiene z principal, con 0; las otras dos salen del
        bloque $xy$, que no es diagonal.

      **2. Incógnitas.** La tangencial octaédrica de cada cuerpo y el
      cociente $\sigma_0/\tau_0$ que las iguala.

      **3. Ecuaciones.** La tangencial octaédrica del ejercicio 2.2, que solo
      depende de las principales, y las principales del bloque $xy$, sus
      autovalores:

      $$
      \tau_{\text{oct}} = \frac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}
      \qquad
      \begin{vmatrix} \sigma_x - \lambda & \tau_{xy}\\ \tau_{xy} & \sigma_y - \lambda \end{vmatrix} = 0
      $$

      **4. Resultados.** **El cuerpo A**, con $\sigma_0$, 0 y 0:

      $$
      \tau_{\text{oct},A} = \frac13\sqrt{\sigma_0^{2} + 0 + \sigma_0^{2}} = \frac{\sqrt2}{3}\,\sigma_0
      $$

      **El cuerpo B.** El bloque $xy$ da $\lambda^{2} - \tau_0^{2} = 0$, es
      decir, $\pm\tau_0$, en las direcciones a ±45° de $x$
      ($\sigma_x - \sigma_y = 0$, así que la ec. 2.62 da $2\theta_1 = 90°$).
      Ordenadas, $\tau_0$, 0 y $-\tau_0$:

      $$
      \tau_{\text{oct},B} = \frac13\sqrt{\tau_0^{2} + \tau_0^{2} + (2\tau_0)^{2}} = \frac{\sqrt6}{3}\,\tau_0
      $$

      **La relación.**

      $$
      \frac{\sqrt2}{3}\,\sigma_0 = \frac{\sqrt6}{3}\,\tau_0
      \;\Longrightarrow\; \frac{\sigma_0}{\tau_0} = \sqrt3 = 1{,}7321
      $$

      **5. Comprobación.** Por otros dos caminos. Con los invariantes,
      $\tau_{\text{oct}} = \tfrac{\sqrt2}{3}\sqrt{I_1^{2} - 3I_2}$: en A,
      $I_1 = \sigma_0$ e $I_2 = 0$; en B, $I_1 = 0$ e $I_2 = -\tau_0^{2}$,
      y salen las mismas dos. Y con la tensión equivalente de von Mises del
      tema 6, que en tensión plana es
      $\sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2} + 3\tau_{xy}^{2}}$
      (ec. 6.30): vale $\sigma_0$ en A y $\sqrt3\,\tau_0$ en B, el mismo
      cociente, porque es $\tfrac{3}{\sqrt2}\,\tau_{\text{oct}}$.

      **Lo que dice el resultado.** Para la misma tangencial octaédrica, la
      tracción tiene que ser $\sqrt3$ veces la cortadura: una cortadura de
      $\tau_0$ distorsiona el material como una tracción de
      $1{,}73\,\tau_0$. Igualando las tangenciales máximas,
      $\sigma_0/2 = \tau_0$, saldría 2: es la diferencia entre los criterios
      de von Mises y de Tresca del tema 6.

  # ── Ejercicio de clase 2.6 · el tensor en un triedro girado.
  - id: ejerm2-cl2-6-el-tensor-en-un-triedro-girado
    titulo: La ley de giro del tensor, demostrada y aplicada a un triedro dado por sus unitarios
    fuente: >-
      Ejercicio 2.6 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el giro de ejes de los apuntes del tema 2 (ecs. 2.22 a
      2.28, pp. 13 a 15). El enunciado no da unidades: las componentes van en
      unidades de σ. Cada cifra sale del motor del curso (el giro de la
      matriz con [R]) y está comprobada por un segundo camino: cada
      componente calculada a mano, con las fracciones exactas, y los tres
      invariantes.
    nivel: practica
    antes:
      idea: |
        Lo que define al tensor es que convierte la normal de un plano en su
        vector tensión, y eso no depende de los ejes. Como la normal y el vector
        tensión giran con $[R]$, el tensor queda obligado a girar de una forma
        concreta: la demostración es encadenar esas igualdades.
      formula: |
        $$
        \{v\}' = [R]\{v\},\qquad [R]^{-1} = [R]^{t},\qquad \{S\} = [\sigma]\{n\}
        $$

        (ecs. 2.22, 2.24 y 2.14). La segunda vale porque las filas de $[R]$ son
        unitarias y perpendiculares entre sí.
      reconocer: |
        «Demostrar» y luego «aplicar»: la primera parte es la ley de giro, y la
        segunda, usarla con los unitarios del enunciado.
    enunciado: |
      Se tiene un sistema de referencia Ox'y'z' rotado respecto al original
      Oxyz. La relación entre las componentes de un vector $\vec v$ en ambos
      sistemas viene dada por: $\{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz}$.

      a/ Demostrar que las componentes del tensor de tensiones se relacionan
      según:

      $$
      [\sigma]_{Ox'y'z'} = [R][\sigma]_{Oxyz}[R]^{T}
      $$

      b/ Los vectores unitarios del sistema de referencia girado son:

      $$
      \vec i' = \tfrac{1}{\sqrt3}\left(\vec i + \vec j + \vec k\right)\qquad
      \vec j' = \tfrac{1}{\sqrt6}\left(\vec i + \vec j - 2\vec k\right)\qquad
      \vec k' = \tfrac{1}{\sqrt2}\left(-\vec i + \vec j\right)
      $$

      Determinar las componentes del tensor de tensiones en el sistema
      Ox'y'z' siendo las componentes en Oxyz:

      $$
      [\sigma]_{Oxyz} = \begin{bmatrix} \sigma & 0 & 0\\ 0 & -2\sigma & 0\\ 0 & 0 & 3\sigma \end{bmatrix}
      $$

      **Notas nuestras.** El enunciado no da unidades: las componentes de b/
      salen en unidades de $\sigma$.
    pide: >-
      a) La demostración de la ley de giro del tensor. b) Las seis
      componentes del tensor en Ox'y'z', en unidades de σ.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado b/, ¿cómo se monta $[R]$ con los tres unitarios?
        opciones:
          - texto: Con $\vec i'$, $\vec j'$ y $\vec k'$ en las filas, la primera $\tfrac{1}{\sqrt3}(1, 1, 1)$
            correcta: true
            mensaje: |
              Eso es. $v_{x'} = \vec v\cdot\vec i'$, así que la primera
              componente de $[R]\{v\}$ sale de multiplicar por la fila
              $\vec i'$. Las tres filas son perpendiculares y de módulo 1: por
              eso $[R]^{-1} = [R]^{t}$ (ec. 2.24).
          - texto: Con $\vec i'$, $\vec j'$ y $\vec k'$ en las columnas, la primera $\tfrac{1}{\sqrt3}(1, 1, 1)$
            mensaje: |
              Esa es $[R]^{t}$, la que vuelve de Ox'y'z' a Oxyz. Puesta en el
              sitio de $[R]$, gira al revés: da el tensor en otros ejes, no en
              los del enunciado.
          - texto: No hace falta, porque $[\sigma]$ es diagonal y en O$x'y'z'$ sigue siéndolo, con los mismos valores
            mensaje: |
              $x$, $y$ y $z$ son direcciones principales; $x'$, $y'$ y $z'$
              no lo son, y en ellos aparecen tangenciales. Lo que no cambia
              con el giro son los invariantes.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cubo en Oxyz con el tensor
          del apartado b/** y, aparte, por dónde van los ejes nuevos.
        comprueba:
          - punto: |
              **Una normal por cara: $\sigma$ y $3\sigma$ saliendo, y $2\sigma$
              entrando en la cara y.**
            porque: |
              El tensor de Oxyz es diagonal: $x$, $y$ y $z$ ya son direcciones
              principales. El $-2\sigma$ es de compresión.
          - punto: |
              **Las tres con $\sigma$ positiva, sin números.**
            porque: |
              El enunciado no da unidades: las componentes de Ox′y′z′ salen en
              unidades de $\sigma$.
          - punto: |
              **Aparte, $\vec i'$ por la diagonal del cubo y $\vec k'$ en el
              plano $xy$.**
            porque: |
              $\vec i'$ tiene las tres componentes iguales y apunta al vértice
              opuesto a O; $\vec k'$ no tiene componente $z$. Ver dónde caen
              los ejes nuevos ayuda a leer el resultado.
        figura: |
          <svg viewBox="0 14 300 244" role="img" width="300" height="244" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El cubo en Oxyz con el tensor del apartado b</title>
            <desc id="dsl-d">Un cubo en perspectiva: x hacia el que mira, y a la derecha y z arriba. En la cara x, sigma saliendo; en la cara y, dos sigma entrando; en la cara z, tres sigma saliendo. Ninguna tangencial.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
