      - tipo: calcular
        titulo: La matriz en Ox′y′z′
        pregunta: |
          ¿Cuánto vale $[\sigma]_{Ox'y'z'}$, en unidades de $\tau_0$?
        respuesta:
          tipo: matriz
          valor: '[-1, 0, 0; 0, 1, -1.4142; 0, -1.4142, 0]'
          tolerancia: 0.002
          formato: tres filas de tres números en unidades de τ0, con punto y coma entre filas
        distractores:
          - valor: '[-1, 0, 0; 0, 1, 1.4142; 0, 1.4142, 0]'
            mensaje: |
              Es la de $\vec k' = +\vec j$: el triedro a izquierdas cambia el
              signo de las tangenciales con $z'$.
          - valor: '[1, -1.4142, 0; -1.4142, 0, 0; 0, 0, -1]'
            mensaje: |
              Es $[R]^{t}[\sigma][R]$: los unitarios puestos en las columnas
              de $[R]$, que gira al revés.
          - valor: '[-2, 0, 0; 0, 2, -2; 0, -2, 0]'
            mensaje: |
              Te falta el $\tfrac{1}{\sqrt2}$ de $\vec i'$ y $\vec j'$: los
              ejes tienen que ser unitarios.
        pista: |
          Las filas de $[R]$ son $\vec i'$, $\vec j'$ y $\vec k'$; cada
          componente es $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$.
        desarrollo: |
          En unidades de $\tau_0$, con $[R]$ de filas
          $\tfrac{1}{\sqrt2}(1, 0, -1)$, $\tfrac{1}{\sqrt2}(1, 0, 1)$ y
          $(0, -1, 0)$:

          $$
          [\sigma]' = [R][\sigma][R]^{t} = \begin{bmatrix} -1 & 0 & 0\\ 0 & 1 & -\sqrt2\\ 0 & -\sqrt2 & 0 \end{bmatrix}
          $$

          Por ejemplo, $[\sigma]\{\vec i'\} = \tfrac{1}{\sqrt2}(-1, 0, 1)$ y
          $\sigma_{x'} = \tfrac12(-1 - 1) = -1$.
      - tipo: calcular
        titulo: El vector tensión en Oxyz
        pregunta: |
          ¿Cuánto vale el vector tensión del plano perpendicular a
          $\vec j'$, en Oxyz y en unidades de $\tau_0$?
        respuesta:
          tipo: vector
          valor: '(0.7071, 1.4142, 0.7071)'
          tolerancia: 0.002
          formato: tres componentes en unidades de τ0, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(1, 2, 1)'
            mensaje: |
              Te falta el $\tfrac{1}{\sqrt2}$ de $\vec j'$: Cauchy pide la
              normal unitaria.
          - valor: '(0, 1, -1.4142)'
            mensaje: |
              Son sus componentes en Ox’y’z’, las del paso siguiente. En
              Oxyz, $\{S\} = [\sigma]_{Oxyz}\{\vec j'\}$, con $\vec j'$
              escrito en Oxyz.
        pista: |
          $\{S\} = [\sigma]\{n\}$ con $\{n\} = \vec j' = \tfrac{1}{\sqrt2}(1, 0, 1)$:
          es sumar la primera y la tercera columna y dividir entre $\sqrt2$.
        desarrollo: |
          En unidades de $\tau_0$:

          $$
          \{S\} = \frac{1}{\sqrt2}\begin{pmatrix} 0 + 0 + 1\\ 1 + 0 + 1\\ 1 + 0 + 0 \end{pmatrix} = \frac{1}{\sqrt2}\begin{pmatrix} 1\\ 2\\ 1 \end{pmatrix}
          $$

          es decir, $(0{,}7071;\ 1{,}4142;\ 0{,}7071)$.
      - tipo: calcular
        titulo: El vector tensión en Ox′y′z′
        pregunta: |
          ¿Y en Ox’y’z’, en unidades de $\tau_0$?
        respuesta:
          tipo: vector
          valor: '(0, 1, -1.4142)'
          tolerancia: 0.002
          formato: tres componentes en unidades de τ0, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(0, 1, 1.4142)'
            mensaje: |
              Es la de $\vec k' = +\vec j$: el triedro a izquierdas cambia el
              signo de la componente según $z'$.
          - valor: '(0.7071, 1.4142, 0.7071)'
            mensaje: |
              Es el vector en Oxyz, sin girar. El vector es el mismo, pero sus
              componentes en Ox’y’z’ son otras: $\{S\}' = [R]\{S\}$.
          - valor: '(1.5, -0.7071, 0.5)'
            mensaje: |
              Es $[R]^{t}\{S\}$: has girado al revés.
        pista: |
          Dos caminos: $\{S\}' = [R]\{S\}$, o la segunda columna de
          $[\sigma]'$, porque en Ox’y’z’ la normal es $(0, 1, 0)$.
        desarrollo: |
          En unidades de $\tau_0$:

          $$
          \{S\}' = [\sigma]'\begin{pmatrix} 0\\ 1\\ 0 \end{pmatrix} = \begin{pmatrix} 0\\ 1\\ -\sqrt2 \end{pmatrix}
          $$

          Por el otro camino, proyectando $\vec S$ sobre los ejes nuevos:
          $\vec i'\cdot\vec S = \tfrac12(1 - 1) = 0$,
          $\vec j'\cdot\vec S = \tfrac12(1 + 1) = 1$ y
          $\vec k'\cdot\vec S = -\tfrac{2}{\sqrt2} = -\sqrt2$.
      - tipo: calcular
        titulo: La tangencial del plano
        pregunta: |
          ¿Cuánto vale la tensión tangencial $\tau_n$ del plano, en unidades
          de $\tau_0$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.001
          formato: un número positivo, en unidades de τ0
        distractores:
          - valor: '1.7321'
            mensaje: |
              Es $|\vec S| = \sqrt3\,\tau_0$, el vector tensión entero.
              $\tau_n$ es su parte en el plano.
          - valor: '2'
            mensaje: |
              Es $\tau_n^{2} = |\vec S|^{2} - \sigma_n^{2} = 3 - 1$: falta la
              raíz.
          - valor: '1'
            mensaje: |
              Es $\sigma_n$, la componente normal: $\vec S\cdot\vec j' = 1$.
        pista: |
          $\sigma_n = \vec S\cdot\vec n$ y
          $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$ (ec. 2.16), en el
          sistema que prefieras.
        desarrollo: |
          En Ox’y’z’ es inmediato: $\sigma_n$ es la componente según $y'$, 1,
          y $\tau_n$ el módulo de las otras dos,
          $\sqrt{0^{2} + 2} = \sqrt2 = 1{,}4142$. En Oxyz,
          $|\vec S|^{2} = \tfrac12(1 + 4 + 1) = 3$,
          $\sigma_n = \vec S\cdot\vec j' = \tfrac12(1 + 1) = 1$ y
          $\tau_n = \sqrt{3 - 1} = \sqrt2$: las mismas, en unidades de
          $\tau_0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec k' = \vec i'\times\vec j' = -\vec j$, y las filas de $[R]$
              son $\vec i'$, $\vec j'$ y $\vec k'$.
          - texto: >-
              $[\sigma]' = [R][\sigma][R]^{t}$: $\sigma_{x'} = -1$,
              $\sigma_{y'} = 1$, $\sigma_{z'} = 0$ y $\tau_{y'z'} = -\sqrt2$,
              en unidades de $\tau_0$, y las otras dos tangenciales nulas.
          - texto: >-
              $\vec S = \tfrac{1}{\sqrt2}(1, 2, 1)\,\tau_0$ en Oxyz y
              $(0, 1, -\sqrt2)\,\tau_0$ en O$x'y'z'$: el mismo vector, con otras
              componentes.
          - texto: >-
              $\sigma_n = \tau_0$ y $\tau_n = \sqrt2\,\tau_0$, en los dos
              sistemas.
          - texto: >-
              Como las componentes de $\vec S$ cambian de un sistema a otro,
              también cambian $\sigma_n$ y $\tau_n$.
            trampa: true
            mensaje: |
              $\sigma_n$ y $\tau_n$ son la proyección de $\vec S$ sobre la
              normal del plano y lo que queda en el plano: dependen del
              vector y del plano, no de los ejes con que se escriben. Por eso
              salen iguales, $\tau_0$ y $\sqrt2\,\tau_0$.
    resolucion: |
      **1. El estado de tensión.** Es un giro de ejes en tres dimensiones y
      un plano: el dibujo lleva el cubo en Oxyz con las tangenciales.

