      - tipo: calcular
        titulo: El radio del círculo
        pregunta: |
          ¿Cuánto vale el radio del círculo, en MPa?
        respuesta:
          tipo: numero
          valor: '600'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '300'
            mensaje: |
              Has tomado $x$ y $x'$ como los extremos de un diámetro,
              $\tfrac12(1200 - 600)$. Cada uno está a 60° del eje, no sobre
              él: la mitad de su separación es $R\cos60°$.
          - valor: '346.41'
            mensaje: |
              Has usado el seno de 60° donde va el coseno. La distancia
              horizontal del centro a $x$ es $R\cos60°$, así que
              $R = 300/0{,}5$.
          - valor: '900'
            mensaje: |
              Es el centro, $\tfrac12(1200 + 600)$. El radio es la distancia
              del centro a $x$.
        pista: |
          Por la simetría de la figura, el centro está en medio de
          $\sigma_x$ y $\sigma_{x'}$; y $\sigma_x = C + R\cos60°$.
        desarrollo: |
          En MPa:

          $$
          C = \frac{1200 + 600}{2} = 900,\qquad R = \frac{300}{\cos60°} = \frac{300}{0{,}5} = 600
          $$
      - tipo: calcular
        titulo: La tangencial en x
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-519.62'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '519.62'
            mensaje: |
              El valor es ese y el signo no. $x$ está arriba: sus
              tangenciales forman un par horario y $\tau_{xy} < 0$.
          - valor: '-300'
            mensaje: |
              Has usado el coseno donde va el seno: la altura del punto $x$
              es $R\operatorname{sen}60°$.
          - valor: '-259.81'
            mensaje: |
              Es la altura con el radio de 300, el que sale de tomar $x$ y
              $x'$ como extremos de un diámetro.
        pista: |
          El punto de $x$ es $(\sigma_x, -\tau_{xy})$: su altura es
          $R\operatorname{sen}60°$.
        desarrollo: |
          En MPa:

          $$
          |\tau_{xy}| = R\operatorname{sen}60° = 600\cdot\tfrac{\sqrt3}{2} = 519{,}62
          $$

          Arriba, $\tau_{xy} = -519{,}62$ MPa. El punto de $y$ está en el
          otro extremo del diámetro: $\sigma_y = 2C - \sigma_x = 1800 - 1200 = 600$
          MPa. Comprobación con la ec. 2.61 en $x'$, que está a $\theta = 30°$
          de $x$ (60° en el círculo, en sentido antihorario):
          $900 + 300\cos60° - 519{,}62\operatorname{sen}60° = 900 + 150 - 450 = 600$.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '1500'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '1200'
            mensaje: |
              Es $\sigma_x$, que también es $C + R$ con el radio de 300. $x$
              no es una dirección principal, porque su tangencial no es nula.
              La mayor es el extremo derecho del círculo.
          - valor: '1246.41'
            mensaje: |
              Es $C + R$ con el radio de 346,41, el del seno en lugar del
              coseno.
          - valor: '1719.62'
            mensaje: |
              Es $\sigma_x + |\tau_{xy}|$. La principal sale del círculo:
              centro más radio.
        pista: |
          $\sigma_{1,2} = C \pm R$; la tercera, la de $z$, es 0.
        desarrollo: |
          En MPa:

          $$
          \sigma_1 = 900 + 600 = 1500,\qquad \sigma_2 = 900 - 600 = 300
          $$

          y la de $z$, 0. Comprobación con los invariantes del plano:
          $\sigma_1 + \sigma_2 = 1800$, como $\sigma_x + \sigma_y$; y
          $1500\cdot300 = 1200\cdot600 - (300\cdot\sqrt3)^{2} = 450\,000$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿A qué ángulo de $x$ está la dirección principal 1, en grados,
          positivo en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '-30'
          tolerancia: 0.1
          formato: un número con su signo, en grados
        distractores:
          - valor: '30'
            mensaje: |
              El sentido. En el círculo, de $x$, arriba, a $\sigma_1$ se baja
              en sentido horario, y en el elemento también: la dirección 1
              está 30° por debajo de $x$.
          - valor: '-60'
            mensaje: |
              Es $2\theta_1$, el ángulo del círculo. En el elemento es la
              mitad.
          - valor: '60'
            mensaje: |
              Es la dirección 2, a 90° de la 1.
        pista: |
          $\tan2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62);
          o, en el círculo, el ángulo de $x$ a $\sigma_1$.
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{2\cdot(-519{,}62)}{1200 - 600} = -1{,}7321
          \;\Longrightarrow\; 2\theta_1 = -60°,\qquad \theta_1 = -30°
          $$

          En el círculo, $x$ está 60° por encima del eje, a la derecha del
          centro: para llegar a $\sigma_1$ se giran 60° en sentido horario.
          La dirección 2 está a $+60°$ de $x$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El centro está en medio de $x$ y $x'$, $C = 900$ MPa, y el
              radio es $R = 300/\cos60° = 600$ MPa.
          - texto: >-
              $x$ está arriba: $\tau_{xy} = -R\operatorname{sen}60° = -519{,}62$
              MPa; y $\sigma_y = 2C - \sigma_x = 600$ MPa.
          - texto: >-
              $\sigma_1 = 1500$ y $\sigma_2 = 300$ MPa, con $\sigma_3 = 0$, la
              de $z$.
          - texto: >-
              De $x$ a $\sigma_1$ se giran 60° en sentido horario en el
              círculo: la dirección 1 está a $-30°$ de $x$ y la 2, a $+60°$.
          - texto: >-
              $\tau_{xy} = +519{,}62$ MPa, porque el punto de $x$ está en la
              mitad de arriba.
            trampa: true
            mensaje: |
              Con el convenio del curso, arriba van las caras cuyas
              tangenciales forman un par horario, y eso es $\tau_{xy} < 0$.
              Con el signo cambiado, la dirección 1 saldría a $+30°$, al otro
              lado de $x$.
    resolucion: |
      **1. El estado de tensión.** Es leer un círculo de Mohr dibujado: el
      dibujo lleva el elemento con lo que se sabe y el círculo con sus
      puntos.

