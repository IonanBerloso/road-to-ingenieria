  # ── Ejercicio de clase 2.10 · el círculo de Mohr y la dirección a.
  - id: ejerm2-cl2-10-el-circulo-de-mohr-y-la-direccion-a
    titulo: El círculo de Mohr de un elemento, con sus principales, su cortante máxima y un plano dado
    fuente: >-
      Ejercicio 2.10 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio del curso para el círculo (apuntes del tema 2,
      p. 26: con τxy positiva el punto de x va abajo) y la ec. 2.61 para la
      tangencial con signo. Cada cifra sale del motor del curso y está
      comprobada por un segundo camino: las principales como raíces de la
      cúbica de los invariantes del tensor 3×3 con σz = 0, la tangencial nula
      en θ1, σn = C en los planos a θ1 ± 45°, y σn, τn del plano de la a por
      Cauchy. La figura del enunciado está redibujada; la del círculo es
      nuestra.
    nivel: practica
    enunciado: |
      En el estado plano de tensión de la figura se conocen los siguientes
      datos:

      $\sigma_x$ = 400 MPa, $\sigma_y$ = 200 MPa, $\tau_{xy}$ = 500 MPa.
      Utilizando el círculo de Mohr calcular y expresar mediante figuras los
      estados de tensión:

      a/ En los planos principales.

      b/ En los planos de máxima tensión cortante.

      c/ En el plano perpendicular a la dirección $a$.

