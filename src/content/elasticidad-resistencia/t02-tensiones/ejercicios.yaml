      - tipo: calcular
        titulo: La normal en la cara x′
        pregunta: |
          ¿Cuánto vale $\sigma_{x'}$, en unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.001
          formato: un número, en unidades de σ
        distractores:
          - valor: '1.5'
            mensaje: |
              Has tomado las columnas de $[R]$ por los ejes nuevos: es el
              término 1,1 de $[R]^{t}[\sigma][R]$. La primera fila de $[R]$ es
              $\vec i'$.
          - valor: '0.5774'
            mensaje: |
              Es el término 1,1 de $[R][\sigma]$ solo, $\tfrac{1}{\sqrt3}$:
              falta multiplicar por $[R]^{t}$ a la derecha, porque el tensor
              gira por sus dos índices.
          - valor: '2'
            mensaje: |
              Has usado $(1, 1, 1)$ sin el $\tfrac{1}{\sqrt3}$. $\vec i'$ es
              unitario, y el factor entra dos veces: ⅓.
        pista: |
          $\sigma_{x'} = \{\vec i'\}^{t}[\sigma]\{\vec i'\}$; con $[\sigma]$
          diagonal es la suma de cada término de la diagonal por el cuadrado
          de su componente de $\vec i'$.
        desarrollo: |
          En unidades de $\sigma$:

          $$
          \sigma_{x'} = \frac{1 - 2 + 3}{3} = \frac23 = 0{,}6667
          $$
      - tipo: calcular
        titulo: La tangencial entre x′ e y′
        pregunta: |
          ¿Cuánto vale $\tau_{x'y'}$, en unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '-1.6499'
          tolerancia: 0.001
          formato: un número con su signo, en unidades de σ
        distractores:
          - valor: '-1.5'
            mensaje: |
              Es el término 1,2 de $[R]^{t}[\sigma][R]$: las columnas tomadas
              como ejes nuevos.
          - valor: '-1.1547'
            mensaje: |
              Es el término 1,2 de $[R][\sigma]$, $\tfrac{1}{\sqrt3}\cdot(-2)$,
              sin $[R]^{t}$ a la derecha.
          - valor: '-7'
            mensaje: |
              Te faltan los factores de los unitarios: $(1, 1, 1)$ y
              $(1, 1, -2)$ dan $1 - 2 - 6$, que hay que dividir entre
              $\sqrt3\cdot\sqrt6 = \sqrt{18}$.
        pista: |
          $\tau_{x'y'} = \{\vec i'\}^{t}[\sigma]\{\vec j'\}$.
        desarrollo: |
          En unidades de $\sigma$:

          $$
          \tau_{x'y'} = \frac{1\cdot1\cdot1 + (-2)\cdot1\cdot1 + 3\cdot1\cdot(-2)}{\sqrt{18}} = \frac{-7}{\sqrt{18}} = -1{,}6499
          $$
      - tipo: calcular
        titulo: El tensor entero en Ox′y′z′
        pregunta: |
          ¿Cuánto vale $[\sigma]_{Ox'y'z'}$, en unidades de $\sigma$?
        respuesta:
          tipo: matriz
          valor: '[0.6667, -1.6499, -1.2247; -1.6499, 1.8333, -0.866; -1.2247, -0.866, -0.5]'
          tolerancia: 0.002
          formato: tres filas de tres números en unidades de σ, con punto y coma entre filas
        distractores:
          - valor: '[1.5, -1.5, 1; -1.5, 1.5, 1; 1, 1, -1]'
            mensaje: |
              Es $[R]^{t}[\sigma][R]$: has girado al revés, con los unitarios
              en las columnas. También tiene traza 2, porque también es un
              giro, pero a otros ejes.
          - valor: '[1, 0, 0; 0, -2, 0; 0, 0, 3]'
            mensaje: |
              Es el tensor de Oxyz sin girar. En Ox'y'z' deja de ser
              diagonal: $x'$, $y'$ y $z'$ no son direcciones principales.
          - valor: '[0.5774, -1.1547, 1.7321; 0.4082, -0.8165, -2.4495; -0.7071, -1.4142, 0]'
            mensaje: |
              Es $[R][\sigma]$, sin $[R]^{t}$ a la derecha: no sale simétrica,
              y un tensor de tensiones lo es siempre.
        pista: |
          Las otras cuatro, igual: $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$.
          Comprueba al final que la traza sigue valiendo $2\sigma$.
        desarrollo: |
          En unidades de $\sigma$, con las fracciones exactas:

          $$
          [\sigma]' = \begin{bmatrix} \tfrac23 & -\tfrac{7}{\sqrt{18}} & -\tfrac{3}{\sqrt6}\\ -\tfrac{7}{\sqrt{18}} & \tfrac{11}{6} & -\tfrac{3}{\sqrt{12}}\\ -\tfrac{3}{\sqrt6} & -\tfrac{3}{\sqrt{12}} & -\tfrac12 \end{bmatrix}
          = \begin{bmatrix} 0{,}6667 & -1{,}6499 & -1{,}2247\\ -1{,}6499 & 1{,}8333 & -0{,}8660\\ -1{,}2247 & -0{,}8660 & -0{,}5 \end{bmatrix}
          $$

          La traza, $\tfrac23 + \tfrac{11}{6} - \tfrac12 = 2$, es la de Oxyz,
          $1 - 2 + 3$.
      - tipo: justificar
        pregunta: Ordena la demostración del apartado a/. Una pieza es falsa.
        piezas:
          - texto: >-
              La relación de Cauchy vale en los dos sistemas:
              $\{S\} = [\sigma]\{n\}$ y $\{S\}' = [\sigma]'\{n\}'$.
          - texto: >-
              $\{S\}$ y $\{n\}$ son vectores: $\{S\}' = [R]\{S\}$ y
              $\{n\}' = [R]\{n\}$.
          - texto: >-
              Las filas de $[R]$ son unitarios perpendiculares, así que
              $[R]^{-1} = [R]^{t}$ y $\{n\} = [R]^{t}\{n\}'$.
          - texto: >-
              $\{S\}' = [R][\sigma]\{n\} = [R][\sigma][R]^{t}\{n\}'$ para
              cualquier $\{n\}'$; luego $[\sigma]' = [R][\sigma][R]^{t}$.
          - texto: >-
              Como $[\sigma]$ convierte vectores en vectores, se gira como uno
              de ellos: $[\sigma]' = [R][\sigma]$.
            trampa: true
            mensaje: |
              Eso gira solo uno de los dos índices. Cada componente lleva dos
              direcciones, la normal de la cara y la de la componente, y las
              dos giran: $[R]$ entra por la izquierda y $[R]^{t}$ por la
              derecha. $[R][\sigma]$ ni siquiera sale simétrica.
    resolucion: |
      **1. El estado de tensión.** Es un giro de ejes: el dibujo lleva el cubo
      en Oxyz, donde el tensor del apartado b/ es diagonal.

      <figure class="figura-examen">
      <svg viewBox="0 14 300 244" role="img" width="450" height="366" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El cubo en Oxyz con el tensor del apartado b</title>
        <desc id="dsl-d">Un cubo en perspectiva: x hacia el que mira, y a la derecha y z arriba. En la cara x, sigma saliendo; en la cara y, dos sigma entrando; en la cara z, tres sigma saliendo. Ninguna tangencial.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M65 85 H175 V195 H65 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M65 85 L111.2 38.8 L221.2 38.8 L175 85 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M175 85 L221.2 38.8 L221.2 148.8 L175 195 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M262 228 l-14 14" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M262 228 h20" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M262 228 v-20" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <line x1="117.2" y1="142.8" x2="96" y2="164" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="94.7" y="172.3" font-size="10" text-anchor="start" fill="var(--flag)">σ</text>
        <line x1="232.1" y1="116.9" x2="202.1" y2="116.9" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="241.1" y="120.9" font-size="10" text-anchor="start" fill="var(--flag)">2σ</text>
        <line x1="143.1" y1="57.9" x2="143.1" y2="27.9" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="146.1" y="25.9" font-size="10" text-anchor="start" fill="var(--flag)">3σ</text>
        <text x="240" y="250" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <text x="286" y="232" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
        <text x="259" y="204" font-size="9" text-anchor="start" fill="var(--faint)">z</text>
      </svg>
      <figcaption>

      Las tres componentes que no son nulas, en su sentido real, con σ positiva. x hacia el que mira, y a la derecha, z arriba: los ejes de partida ya son principales.

      </figcaption>
      </figure>

      - **Los ejes de partida** ya son principales, con $\sigma$, $-2\sigma$
        y $3\sigma$.
      - **Los nuevos**: $\vec i'$ va por la diagonal del cubo, $\vec k'$ está
        en el plano $xy$ y $\vec j'$ completa el triedro.

      **2. Incógnitas.** a/ La ley de giro del tensor. b/ Sus seis
      componentes en Ox′y′z′, en unidades de $\sigma$.

      **3. Ecuaciones.** La relación de Cauchy (ec. 2.14), el giro de un
      vector (ec. 2.22) y la inversa de $[R]$ (ec. 2.24):

      $$
      \{S\} = [\sigma]\{n\}
      \qquad
      \{v\}' = [R]\{v\}
      \qquad
      [R]^{-1} = [R]^{t}
      $$

      La tercera vale porque las filas de $[R]$ son los unitarios de los ejes
      nuevos, perpendiculares y de módulo 1: $[R][R]^{t} = [I]$.

      **4. Resultados.** **a/ La demostración.** La relación de Cauchy vale
      en los dos sistemas: $\{S\} = [\sigma]\{n\}$ y
      $\{S\}' = [\sigma]'\{n\}'$. Los dos vectores giran con $[R]$:
      $\{S\}' = [R]\{S\}$ y $\{n\}' = [R]\{n\}$, y de la segunda,
      $\{n\} = [R]^{t}\{n\}'$. Encadenando,

      $$
      \{S\}' = [R]\{S\} = [R][\sigma]\{n\} = [R][\sigma][R]^{t}\{n\}'
      $$

      y como esto vale para cualquier normal $\{n\}'$, comparado con
      $\{S\}' = [\sigma]'\{n\}'$ da $[\sigma]' = [R][\sigma][R]^{t}$
      (ec. 2.27). La inversa, para volver, es
      $[\sigma] = [R]^{t}[\sigma]'[R]$ (ec. 2.28).

      **b/ La matriz del giro.** Con los unitarios en las filas:

      $$
      [R] = \begin{bmatrix} \tfrac{1}{\sqrt3} & \tfrac{1}{\sqrt3} & \tfrac{1}{\sqrt3}\\ \tfrac{1}{\sqrt6} & \tfrac{1}{\sqrt6} & -\tfrac{2}{\sqrt6}\\ -\tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2} & 0 \end{bmatrix}
      $$

      Las tres filas son perpendiculares y $\vec i'\times\vec j' = \vec k'$:
      el triedro nuevo es directo, como el de partida.

      **b/ Las componentes.** Cada una es
      $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$, y con
      $[\sigma]$ diagonal es la suma de $\sigma$, $-2\sigma$ y $3\sigma$
      por los productos de las componentes de los dos unitarios. En unidades
      de $\sigma$:

      $$
      [\sigma]' = \begin{bmatrix} \tfrac23 & -\tfrac{7}{\sqrt{18}} & -\tfrac{3}{\sqrt6}\\ -\tfrac{7}{\sqrt{18}} & \tfrac{11}{6} & -\tfrac{3}{\sqrt{12}}\\ -\tfrac{3}{\sqrt6} & -\tfrac{3}{\sqrt{12}} & -\tfrac12 \end{bmatrix}
      = \begin{bmatrix} 0{,}6667 & -1{,}6499 & -1{,}2247\\ -1{,}6499 & 1{,}8333 & -0{,}8660\\ -1{,}2247 & -0{,}8660 & -0{,}5 \end{bmatrix}
      $$

      Por ejemplo, $\sigma_{y'} = \tfrac{1 - 2 + 3\cdot4}{6} = \tfrac{11}{6}$
      y $\tau_{x'z'} = \tfrac{-1 - 2 + 0}{\sqrt3\cdot\sqrt2} = -\tfrac{3}{\sqrt6}$.

      **5. Comprobación.** Los invariantes no cambian con el giro: la traza
      es $\tfrac23 + \tfrac{11}{6} - \tfrac12 = 2$, como $1 - 2 + 3$; y el
      motor del curso da también $I_2 = -5$ e $I_3 = -6$ en los dos
      sistemas, en unidades de $\sigma^{2}$ y $\sigma^{3}$. Y la cara $x'$,
      con $\vec i'$ por la diagonal, es un plano octaédrico (ejercicio 2.2):
      su normal es $\sigma_{x'} = I_1/3 = \tfrac23$, y su tangencial,

      $$
      \sqrt{\tau_{x'y'}^{2} + \tau_{x'z'}^{2}} = \sqrt{\tfrac{49}{18} + \tfrac32} = \tfrac{\sqrt{38}}{3} = 2{,}0548
      $$

      la octaédrica de las principales 3, 1 y $-2$:
      $\tfrac13\sqrt{2^{2} + 3^{2} + 5^{2}} = \tfrac{\sqrt{38}}{3}$.

      **Lo que dice el resultado.** El tensor es el mismo: en Ox′y′z′ salen
      tangenciales porque los ejes nuevos no son principales. Las principales
      siguen siendo $3\sigma$, $\sigma$ y $-2\sigma$, en las direcciones $z$,
      $x$ e $y$: el giro solo cambia cómo se ve el tensor.

  # ── Ejercicio de clase 2.7 · el círculo de Mohr dado.
  - id: ejerm2-cl2-7-el-circulo-de-mohr-dado
    titulo: Del círculo de Mohr dibujado al estado tensional en x e y, y a las principales
    fuente: >-
      Ejercicio 2.7 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio del curso para el círculo (apuntes del tema 2,
      p. 26) y la ec. 2.61. Cada cifra sale del motor del curso (el círculo
      y la ec. 2.61 con σx, σy y τxy leídos) y está comprobada por un segundo
      camino: la ec. 2.61 despejada en x′ con σx′ = 600 MPa como dato, y los
      invariantes del plano. La figura está redibujada, con el círculo a
      escala; la dirección D que trae no la usa el enunciado.
    nivel: practica
    antes:
      idea: |
        Un círculo de Mohr dibujado contiene el estado entero, si se sabe leer: el
        centro y el radio salen de dos puntos conocidos, y el signo de
        $\tau_{xy}$, de la mitad del círculo en que está $x$.
      formula: |
        Para un punto cuyo radio forma un ángulo $2\varphi$ con el eje:

        $$
        \sigma = C + R\cos 2\varphi,\qquad |\tau| = R\,|\sin 2\varphi|,\qquad \sigma_{1,2} = C \pm R
        $$

        En el círculo se gira el doble de ángulo que en el elemento, y en el
        mismo sentido.
      reconocer: |
        El dato es una figura con ángulos marcados, no un tensor. Lo primero es
        leer en ella dónde están $x$ y $x'$, y a cuántos grados del eje. El
        convenio del curso: arriba van los puntos cuyas caras tienen las
        tangenciales en par horario.
    enunciado: |
      En la figura se representa el círculo de Mohr que corresponde a un
      estado plano de tensiones. Las tensiones normales que corresponden a
      las direcciones $x$ y $x'$ son: $\sigma_x$ = 1200 MPa,
      $\sigma_{x'}$ = 600 MPa.

      a/ Representar el estado de tensiones que corresponde a las
      direcciones $x$ e $y$.

      b/ Calcular las tensiones principales y representar las tensiones
      principales y las direcciones principales.

