      </figcaption>
      </figure>

      - **Las caras x**, a tracción con 90 MPa, y **las y**, con 30.
      - **La tangencial**, de 40 MPa, sube por la cara +x: forma con la de la
        cara −x un par antihorario, y el punto x va abajo en el círculo.
      - **Lo de z es nulo**: la cara z es principal, con tensión cero.

      **2. Incógnitas.** Las principales del plano, el ángulo $\theta_1$ de la
      dirección 1 con x y la tangencial máxima del punto, que es de las tres
      principales, no solo de las dos del plano.

      **3. Ecuaciones.** El centro y el radio del círculo, y el ángulo:

      $$
      C = \frac{\sigma_x + \sigma_y}{2}
      \qquad
      R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}
      \qquad
      \tan 2\theta_1 = \frac{2\,\tau_{xy}}{\sigma_x - \sigma_y}
      $$

      Las principales del plano son $C \pm R$, y la tangencial máxima del
      punto, la mitad de la mayor diferencia entre las tres principales:
      $\tau_{\max} = (\sigma_1 - \sigma_3)/2$.

      **4. Resultados.** $C = 60$ y $R = \sqrt{30^{2} + 40^{2}} = 50$ MPa:

      $$
      \sigma_1 = C + R = 110\ \text{MPa}
      \qquad
      \sigma_2 = C - R = 10\ \text{MPa}
      $$

      $\tan 2\theta_1 = 2 \cdot 40/(90 - 30) = 4/3$, $2\theta_1 = 53{,}13°$ y
      $\theta_1 = 26{,}57°$. Del punto x, abajo, a 1 se sube: en la pieza, la
      dirección 1 está girada $26{,}57°$ en sentido antihorario desde x, y la
      2, perpendicular, a $116{,}57°$. Con la de z, las tres principales del
      punto son 110, 10 y 0 MPa:

      $$
      \tau_{\max} = \frac{\sigma_1 - \sigma_3}{2} = \frac{110 - 0}{2} = 55\ \text{MPa}
      $$

      mayor que el radio del círculo del plano, 50 MPa. Actúa en los planos a
      45° de las direcciones 1 y z, que contienen la 2.

      <figure>
