            <text x="347" y="44" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">y</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="340" y1="163" x2="340" y2="193" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
