        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
        <line x1="325.6" y1="135.3" x2="292.4" y2="154.5" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
