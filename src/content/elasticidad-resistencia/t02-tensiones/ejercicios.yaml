      <figcaption>

      Nuestra, a escala. El círculo del plano <i>xy</i>, con los otros dos
      del punto a trazos por dentro: el 0 de <i>z</i> queda entre las dos
      principales. De <i>x</i> a la dirección 1 se gira 2θ₁ hacia arriba;
      de <i>x</i> al plano de la a, 120°.

      </figcaption>
      </figure>

      **a/ Los planos principales.** $\sigma_1 = 300 + 509{,}90 = 809{,}90$ MPa
      y $\sigma_2 = 300 - 509{,}90 = -209{,}90$ MPa, con

      $$
      \tan2\theta_1 = \frac{2\cdot500}{400 - 200} = 5
      \;\Longrightarrow\; 2\theta_1 = 78{,}69°,\qquad \theta_1 = 39{,}35°
      $$

      En el círculo se sube de $x$ a 1, en sentido antihorario, y en el
      elemento también. Dibujado: el elemento girado $39{,}35°$ en sentido
      antihorario, con $809{,}90$ MPa de tracción en las caras cuya normal
      está a $39{,}35°$ y $209{,}90$ MPa de compresión en las de $129{,}35°$,
      sin tangenciales. Comprobación: $\sigma_1 + \sigma_2 = 600 = \sigma_x + \sigma_y$
      y $\sigma_1\sigma_2 = 400\cdot200 - 500^{2} = -170\,000$, los dos
      invariantes del plano.

      **b/ Los planos de máxima tangencial.** Arriba y abajo del círculo, a
      90° de las principales en el círculo y a 45° en el elemento:
      $\theta = 39{,}35° \pm 45°$, es decir, $84{,}35°$ y $-5{,}65°$. En los
      dos, $|\tau_n| = R = 509{,}90$ MPa y $\sigma_n = C = 300$ MPa de
      tracción. Con la ec. 2.61, en el de $84{,}35°$ la tangencial sale
      negativa y en el de $-5{,}65°$, positiva. Como el 0 de $z$ queda entre
      $\sigma_2$ y $\sigma_1$, esta es también la tangencial máxima del
      punto: $\tfrac12\,(809{,}90 + 209{,}90) = 509{,}90$ MPa.

      **c/ El plano perpendicular a la dirección a.** Su normal es la a, a
      $\theta = 60°$; en el círculo se giran $120°$ desde $x$ en sentido
      antihorario:

      $$
      \sigma_n = 300 + 100\cos120° + 500\operatorname{sen}120° = 300 - 50 + 433{,}01 = 683{,}01\ \text{MPa}
      $$

      $$
      \tau_n = -100\operatorname{sen}120° + 500\cos120° = -86{,}60 - 250 = -336{,}60\ \text{MPa}
      $$

      La tangencial es negativa: va al revés que $\hat t$, hacia $-30°$, y el
      punto del plano queda en la mitad de arriba del círculo, en
      $(683{,}01;\ 336{,}60)$. Comprobación por Cauchy:
      $\vec S = [\sigma]\{\cos60°, \operatorname{sen}60°\} = (633{,}01;\ 423{,}21)$ MPa,
      con $\vec S\cdot\vec n = 633{,}01\cdot0{,}5 + 423{,}21\cdot0{,}86603 = 683{,}01$ MPa.

  # ── Ejercicio de clase 2.11 · el vector tensión desde las principales.
  - id: ejerm2-cl2-11-el-vector-tension-desde-las-principales
    titulo: Las tensiones principales dadas como vectores, y el vector tensión de un plano
    fuente: >-
      Ejercicio 2.11 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con los convenios del tema 2. Cada cifra sale del motor del
      curso, al que se le pasa el tensor montado como Σσi ni niᵗ (y que
      devuelve como principales 50, 30 y −20), y está comprobada por un
      segundo camino que no monta el tensor: las componentes de la
      normal en los ejes principales, con σn = Σσi li² y |S|² = Σσi² li², y
      las fracciones exactas. El enunciado no da unidades ni lleva punto
      final; las tensiones se toman en MPa, y cómo se lee el signo de σ⃗3 lo
      dicen las notas.
    nivel: practica
    enunciado: |
      Las tensiones principales en el sistema de referencia Oxyz vienen dadas
      por:

      $$
      \begin{aligned}
      \vec\sigma_1 &= \tfrac{50}{3}\left(2\vec i + 2\vec j + \vec k\right)\\
      \vec\sigma_2 &= 20\vec i - 10\vec j - 20\vec k\\
      \vec\sigma_3 &= -\tfrac{20}{3}\left(\vec i - 2\vec j + 2\vec k\right)
      \end{aligned}
      $$

      Determinar el vector tensión y sus componentes intrínsecas en el plano
      de normal $\vec n = \tfrac{1}{\sqrt3}\left(\vec i + \vec j + \vec k\right)$

      **Notas nuestras.** Cada vector se lee como $\vec\sigma_i = \sigma_i\,\vec n_i$,
      con $\vec n_i$ unitario. Un vector solo no fija el signo: el mismo
      vector es $\sigma\,\vec n$ y $(-\sigma)(-\vec n)$. Lo fijan el orden
      $\sigma_1 > \sigma_2 > \sigma_3$ de los apuntes, que obliga a
      $\sigma_1 = 50$ y $\sigma_2 = 30$, y, para $\sigma_3$, el menos que el
      enunciado escribe delante del paréntesis: $\sigma_3 = -20$, una
      compresión. Quien lea $\sigma_3 = +20$, con
      $\vec n_3 = \tfrac13(-1, 2, -2)$, resuelve otro estado y obtiene
      $\sigma_n = 48{,}15$ y $\tau_n = 6{,}69$. El enunciado no da unidades;
      aquí las tensiones van en MPa.
    pide: >-
      El vector tensión en Oxyz y sus componentes intrínsecas, σn y τn, en el
      plano de normal (1, 1, 1)/√3.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice $\vec\sigma_1 = \tfrac{50}{3}\left(2\vec i + 2\vec j + \vec k\right)$?
        opciones:
          - texto: Que $\sigma_1 = 50$ MPa, en la dirección $\tfrac13(2, 2, 1)$
            correcta: true
            mensaje: |
              Eso es. $(2, 2, 1)$ tiene módulo 3, así que
              $\tfrac{50}{3}(2, 2, 1) = 50\cdot\tfrac13(2, 2, 1)$: la tensión
              principal por su dirección unitaria. En un plano principal el
              vector tensión es normal al plano, $\vec S = \sigma\,\vec n$
              (ec. 2.30).
          - texto: Que $\sigma_1 = \tfrac{50}{3}$ MPa, en la dirección $(2, 2, 1)$
            mensaje: |
              $(2, 2, 1)$ no es unitario: su módulo es 3. La tensión es el
              módulo del vector entero, $\tfrac{50}{3}\cdot3 = 50$ MPa, y la
              dirección, $(2, 2, 1)$ dividido entre 3.
          - texto: Que $\sigma_x = \sigma_y = 33{,}3$ y $\sigma_z = 16{,}7$ MPa
            mensaje: |
              Esas son las componentes del vector $\vec\sigma_1$ en Oxyz, no
              tensiones normales de las caras $x$, $y$, $z$. $\vec\sigma_1$ es
              el vector tensión del plano principal 1, que no es ninguna de
              esas caras.
      - tipo: calcular
        titulo: El tensor en Oxyz
        pregunta: |
          Primer camino: monta $[\sigma]$ en Oxyz. ¿Cuánto vale, en MPa?
        respuesta:
          tipo: matriz
          valor: '[33.333, 20, -6.667; 20, 16.667, 26.667; -6.667, 26.667, 10]'
          tolerancia: 0.01
          formato: tres filas de tres números en MPa, con punto y coma entre filas
        distractores:
          - valor: '[50, 0, 0; 0, 30, 0; 0, 0, -20]'
            mensaje: |
              Es el tensor en sus ejes principales. En Oxyz no es diagonal,
              porque las direcciones principales no son $x$, $y$, $z$: hay que
              girarlo, $[\sigma] = \sum_i \sigma_i\,\vec n_i\,\vec n_i^{\,t}$.
          - valor: '[33.333, 33.333, 16.667; 20, -10, -20; -6.667, 13.333, -13.333]'
            mensaje: |
              Has puesto los tres vectores $\vec\sigma_i$ como filas. Las filas
              de $[\sigma]$ son los vectores tensión de las caras $x$, $y$, $z$
              (ec. 2.14), y los $\vec\sigma_i$ son los de los planos
              principales. Se nota en que no sale simétrica.
        pista: |
          Cada principal aporta $\sigma_i\,\vec n_i\,\vec n_i^{\,t}$: el término
          $xy$, por ejemplo, es $\sum_i \sigma_i\,n_{ix}\,n_{iy}$, con
          $\vec n_1 = \tfrac13(2, 2, 1)$, $\vec n_2 = \tfrac13(2, -1, -2)$ y
          $\vec n_3 = \tfrac13(1, -2, 2)$.
        desarrollo: |
          $$
          \sigma_{xy} = \frac{50\cdot2\cdot2 + 30\cdot2\cdot(-1) + (-20)\cdot1\cdot(-2)}{9} = \frac{200 - 60 + 40}{9} = 20\ \text{MPa}
          $$

          y así los seis:

          $$
          [\sigma] = \frac{1}{9}\begin{bmatrix} 300 & 180 & -60\\ 180 & 150 & 240\\ -60 & 240 & 90 \end{bmatrix}
          = \begin{bmatrix} 33{,}33 & 20 & -6{,}67\\ 20 & 16{,}67 & 26{,}67\\ -6{,}67 & 26{,}67 & 10 \end{bmatrix}\ \text{MPa}
          $$

          La traza casa: $33{,}33 + 16{,}67 + 10 = 60$, y $50 + 30 - 20 = 60$.
      - tipo: calcular
        titulo: El vector tensión
        pregunta: |
          ¿Cuánto vale el vector tensión $\vec S = [\sigma]\{n\}$ del plano de
          normal $\tfrac{1}{\sqrt3}(1, 1, 1)$, en Oxyz y en MPa?
        respuesta:
          tipo: vector
          valor: '(26.943, 36.566, 17.321)'
          tolerancia: 0.01
          formato: tres componentes en MPa, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(48.11, -5.77, -3.85)'
            mensaje: |
              Son las componentes de $\vec S$ en los ejes principales,
              $(\sigma_1 l_1, \sigma_2 l_2, \sigma_3 l_3)$ con
              $l_i = \vec n\cdot\vec n_i$. Su módulo es el bueno, pero la
              pregunta las pide en Oxyz: hay que volver con
              $\vec S = \sum_i \sigma_i l_i\,\vec n_i$.
          - valor: '(28.87, 17.32, -11.55)'
            mensaje: |
              Es $[\sigma]\{n\}$ con las principales en la diagonal de Oxyz,
              como si $x$, $y$, $z$ fueran las direcciones principales. No lo
              son: en Oxyz el tensor tiene términos fuera de la diagonal.
        pista: |
          Multiplica cada fila de $[\sigma]$ por $\tfrac{1}{\sqrt3}(1, 1, 1)$:
          es sumar la fila y dividir entre $\sqrt3$.
        desarrollo: |
          $$
          S_x = \frac{33{,}33 + 20 - 6{,}67}{\sqrt3} = 26{,}94,\qquad
          S_y = \frac{20 + 16{,}67 + 26{,}67}{\sqrt3} = 36{,}57,\qquad
          S_z = \frac{-6{,}67 + 26{,}67 + 10}{\sqrt3} = 17{,}32
          $$

          en MPa; con fracciones, $\vec S = \tfrac{1}{3\sqrt3}\,(140,\ 190,\ 90)$ MPa.
      - tipo: calcular
        titulo: La tensión normal
        pregunta: |
          ¿Cuánto vale la tensión normal $\sigma_n$ del plano, en MPa?
        respuesta:
          tipo: numero
          valor: '46.667'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '20'
            mensaje: |
              Es $\sigma_n$ con las principales en la diagonal de Oxyz:
              $(50 + 30 - 20)/3$. El plano de normal $(1, 1, 1)/\sqrt3$ forma
              ángulos iguales con $x$, $y$, $z$, no con las direcciones
              principales.
          - valor: '38.49'
            mensaje: |
              Es $\sum_i \sigma_i l_i$, con los cosenos sin elevar al cuadrado.
              En ejes principales $\sigma_n = \sum_i \sigma_i l_i^{2}$: un
              coseno entra al formar $\vec S$ y otro al proyectarlo sobre
              $\vec n$.
        pista: |
          $\sigma_n = \vec S\cdot\vec n$: suma las tres componentes de $\vec S$
          y divide entre $\sqrt3$.
        desarrollo: |
          $$
          \sigma_n = \vec S\cdot\vec n = \frac{26{,}943 + 36{,}566 + 17{,}321}{\sqrt3} = 46{,}667\ \text{MPa}
          $$

          Por el otro camino, en ejes principales, con
          $l_i = \vec n\cdot\vec n_i = \tfrac{1}{3\sqrt3}\,(5, -1, 1)$:
          $\sigma_n = \sum_i \sigma_i l_i^{2} = \frac{50\cdot25 + 30\cdot1 - 20\cdot1}{27} = \frac{1260}{27} = 46{,}667$ MPa.
      - tipo: calcular
        titulo: La tensión tangencial
        pregunta: |
          ¿Cuánto vale la tensión tangencial $\tau_n$ del plano, en MPa?
        respuesta:
          tipo: numero
          valor: '13.608'
          tolerancia: 0.02
          formato: un número positivo, en MPa
        distractores:
          - valor: '48.61'
            mensaje: |
              Es $|\vec S|$, el módulo del vector tensión entero. $\tau_n$ es
              solo su parte en el plano: $\tau_n^{2} = |\vec S|^{2} - \sigma_n^{2}$.
          - valor: '29.44'
            mensaje: |
              Es $\tau_n$ con las principales en la diagonal de Oxyz. Con el
              tensor bien girado, $|\vec S| = 48{,}61$ y $\sigma_n = 46{,}67$
              MPa: el vector tensión es casi normal al plano.
        pista: |
          $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$.
        desarrollo: |
          $$
          |\vec S|^{2} = \sum_i \sigma_i^{2} l_i^{2} = \frac{2500\cdot25 + 900\cdot1 + 400\cdot1}{27} = 2362{,}96
          $$

          $$
          \tau_n = \sqrt{2362{,}96 - 46{,}667^{2}} = 13{,}608\ \text{MPa}
          $$

          Exacto, $\tau_n^{2} = \tfrac{63\,800}{27} - \tfrac{19\,600}{9} = \tfrac{5000}{27}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada $\vec\sigma_i$ es $\sigma_i\,\vec n_i$: $\sigma_1 = 50$,
              $\sigma_2 = 30$ y $\sigma_3 = -20$ MPa, con
              $\vec n_1 = \tfrac13(2, 2, 1)$, $\vec n_2 = \tfrac13(2, -1, -2)$ y
              $\vec n_3 = \tfrac13(1, -2, 2)$, perpendiculares entre sí.
          - texto: >-
              En Oxyz, $[\sigma] = \sum_i \sigma_i\,\vec n_i\,\vec n_i^{\,t}$, y
              su traza, 60 MPa, es la suma de las principales.
          - texto: >-
              $\vec S = [\sigma]\{n\} = \tfrac{1}{3\sqrt3}(140, 190, 90)$, es
              decir, $(26{,}94;\ 36{,}57;\ 17{,}32)$ MPa.
          - texto: >-
              $\sigma_n = \vec S\cdot\vec n = 46{,}67$ MPa y
              $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}} = 13{,}61$ MPa.
          - texto: >-
              Como la normal es $(1, 1, 1)/\sqrt3$, $\sigma_n$ es la media de
              las tres principales: $(50 + 30 - 20)/3 = 20$ MPa.
            trampa: true
            mensaje: |
              Eso sería si $x$, $y$, $z$ fueran las direcciones principales.
              Lo que cuenta son los cosenos con las direcciones principales,
              $l_i = \tfrac{1}{3\sqrt3}(5, -1, 1)$, y con ellos
              $\sigma_n = \sum_i \sigma_i l_i^{2} = 46{,}67$ MPa.
    resolucion: |
      **La idea.** En un plano principal el vector tensión es normal al
      plano, $\vec S = \sigma\,\vec n$ (ec. 2.30): cada vector del enunciado
      da a la vez la tensión principal, que es su módulo con su signo, y la
      dirección. Con eso hay dos caminos. Uno, montar el tensor en Oxyz y
      aplicar Cauchy, $\vec S = [\sigma]\{n\}$ (ecs. 2.13-2.14); el otro,
      trabajar en los ejes principales, donde el tensor es diagonal
      (ec. 2.47).

      **La lectura.** $(2, 2, 1)$, $(2, -1, -2)$ y $(1, -2, 2)$ tienen módulo
      3:

      $$
      \vec\sigma_1 = 50\cdot\tfrac13(2, 2, 1),\qquad
      \vec\sigma_2 = 30\cdot\tfrac13(2, -1, -2),\qquad
      \vec\sigma_3 = -20\cdot\tfrac13(1, -2, 2)
      $$

      Las tres direcciones son perpendiculares dos a dos, como tienen que ser
      ($4 - 2 - 2 = 0$, $2 - 4 + 2 = 0$ y $2 + 2 - 4 = 0$), y
      $\sigma_1 = 50$, $\sigma_2 = 30$ y $\sigma_3 = -20$ MPa.

      **Primer camino: el tensor en Oxyz.** Cada principal aporta
      $\sigma_i\,\vec n_i\,\vec n_i^{\,t}$:

      $$
      [\sigma] = \sum_i \sigma_i\,\vec n_i\,\vec n_i^{\,t}
      = \frac{1}{9}\begin{bmatrix} 300 & 180 & -60\\ 180 & 150 & 240\\ -60 & 240 & 90 \end{bmatrix}\ \text{MPa}
      $$

      con traza $\tfrac{300 + 150 + 90}{9} = 60$, la suma de las principales.
      Con la normal $\tfrac{1}{\sqrt3}(1, 1, 1)$:

      $$
      \vec S = [\sigma]\{n\} = \frac{1}{9\sqrt3}\,(420,\ 570,\ 270) = (26{,}94;\ 36{,}57;\ 17{,}32)\ \text{MPa}
      $$

      $$
      \sigma_n = \vec S\cdot\vec n = \frac{420 + 570 + 270}{27} = 46{,}667\ \text{MPa},\qquad
      |\vec S| = 48{,}610\ \text{MPa},\qquad
      \tau_n = \sqrt{48{,}610^{2} - 46{,}667^{2}} = 13{,}61\ \text{MPa}
      $$

      **Segundo camino: en los ejes principales.** Los cosenos de la normal
      con las direcciones principales son
      $l_i = \vec n\cdot\vec n_i = \tfrac{1}{3\sqrt3}\,(5, -1, 1)$, y con el
      tensor diagonal,

      $$
      \sigma_n = \sum_i \sigma_i l_i^{2} = \frac{50\cdot25 + 30\cdot1 - 20\cdot1}{27} = 46{,}667\ \text{MPa},\qquad
      |\vec S|^{2} = \sum_i \sigma_i^{2} l_i^{2} = \frac{2500\cdot25 + 900 + 400}{27} = 2362{,}96
      $$

      lo mismo que por el primero. Y el vector, devuelto a Oxyz,
      $\vec S = \sum_i \sigma_i l_i\,\vec n_i$, coincide componente a
      componente.

      **El resultado.** En el plano de normal $\tfrac{1}{\sqrt3}(1, 1, 1)$,
      $\vec S = (26{,}94;\ 36{,}57;\ 17{,}32)$ MPa, con
      $\sigma_n = 46{,}67$ MPa de tracción y $\tau_n = 13{,}61$ MPa. El
      vector tensión es casi normal al plano porque la normal está cerca de
      la dirección 1: $l_1 = 0{,}962$.

  # ── Ejercicio de clase 2.1 · el giro de los ejes alrededor de z.
  - id: ejerm2-cl2-1-el-giro-alrededor-de-z
    titulo: Las seis componentes del tensor en unos ejes girados un ángulo θ alrededor de z
    fuente: >-
      Ejercicio 2.1 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el giro de ejes de los apuntes del tema 2 (ecs. 2.22, 2.24
      y 2.27, pp. 13 y 14). El enunciado no da números: los pasos con cifras
      usan un ejemplo nuestro, y cada cifra sale del motor del curso (el giro
      de la matriz entera con [R]) y está comprobada por un segundo camino:
      las fórmulas cerradas en l y m y, para σx′ y τx′y′, la ec. 2.61 de la
      tensión plana. La figura está redibujada; en qué sentido se toma el
      giro lo dicen las notas.
    nivel: practica
    enunciado: |
      Determinar la relación entre las componentes de tensión expresadas en
      los sistemas de referencia Ox'y'z' y Oxyz, siendo el segundo sistema el
      obtenido mediante una rotación de ángulo $\theta$ respecto al eje $z$
      del primer sistema. Se suponen conocidas las componentes en Oxyz. Nota:
      Utilizar $\cos\theta = l$, $\operatorname{sen}\theta = m$.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 220" role="img" width="300" height="220" aria-labelledby="ejerm2-cl2-1-el-giro-alrededor-de-z-fig-t ejerm2-cl2-1-el-giro-alrededor-de-z-fig-d">
      <title id="ejerm2-cl2-1-el-giro-alrededor-de-z-fig-t">Los ejes Oxyz y los girados Ox′y′z′ del ejercicio 2.1, con x′ a un ángulo θ de x</title>
      <desc id="ejerm2-cl2-1-el-giro-alrededor-de-z-fig-d">Desde un mismo origen salen x hacia la derecha e y hacia arriba. Con otro color, x′ sale formando un ángulo θ con x, en sentido antihorario, e y′ forma el mismo ángulo con y, a 90° de x′. Un arco con punta en los dos extremos marca θ entre x y x′. El eje z, común a los dos sistemas, sale del papel y no está dibujado.</desc>
      <line x1="96" y1="196" x2="279" y2="196" stroke="var(--ink)" stroke-width="1.5"/><polygon points="286,196 278,199.5 278,192.5" fill="var(--ink)"/>
      <line x1="96" y1="196" x2="96" y2="43" stroke="var(--ink)" stroke-width="1.5"/><polygon points="96,36 99.5,44 92.5,44" fill="var(--ink)"/>
      <line x1="96" y1="196" x2="248.26" y2="125" stroke="var(--d1)" stroke-width="1.5"/><polygon points="254.6,122.04 248.83,128.59 245.87,122.25" fill="var(--d1)"/>
      <line x1="96" y1="196" x2="29.23" y2="52.8" stroke="var(--d1)" stroke-width="1.5"/><polygon points="26.27,46.46 32.82,52.23 26.48,55.19" fill="var(--d1)"/>
      <path d="M216 196 A120 120 0 0 0 204.76 145.29" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="204.76,145.29 209.86,150.08 205.15,152.28" fill="var(--ink)"/><polygon points="216,196 213.4,189.5 218.6,189.5" fill="var(--ink)"/>
      <text x="282" y="214" font-size="13" fill="var(--ink)" font-style="italic" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x</text>
      <text x="106" y="46" font-size="13" fill="var(--ink)" font-style="italic" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">y</text>
      <text x="252.6" y="112.04" font-size="13" font-style="italic" fill="var(--d1)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x′</text>
      <text x="34.27" y="52.46" font-size="13" font-style="italic" fill="var(--d1)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">y′</text>
      <text x="224.87" y="172.43" font-size="13" fill="var(--ink)" font-style="italic" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">θ</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: x′ forma el ángulo θ con x, en sentido
      antihorario, como en el original, que lo dibuja de unos 25°. El eje z,
      común a los dos sistemas, sale del papel.

      </figcaption>
      </figure>

      **Notas nuestras.** El texto y la figura no casan en el sentido del
      giro. Según el texto, Oxyz sale de girar Ox'y'z' un ángulo $\theta$, y
      entonces $x'$ quedaría a $\theta$ de $x$ en sentido horario; la figura
      pone $x'$ a $\theta$ de $x$ en sentido antihorario, visto desde $z$.
      Aquí se sigue la figura, y se buscan las componentes en Ox'y'z' a
      partir de las de Oxyz. Con la lectura del texto, bastaría cambiar
      $\theta$ por $-\theta$.
    pide: >-
      Las seis componentes del tensor en Ox'y'z' en función de las de Oxyz,
      de l y de m.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $\{v\}' = [R]\{v\}$ (ec. 2.22), ¿cuál es la matriz $[R]$ del
          giro de la figura?
        opciones:
          - texto: >-
              $[R] = \begin{bmatrix} l & m & 0\\ -m & l & 0\\ 0 & 0 & 1\end{bmatrix}$,
              con $\hat i'$, $\hat j'$ y $\hat k'$ en las filas
            correcta: true
            mensaje: |
              Eso es. La componente $v_{x'}$ es la proyección
              $\vec v\cdot\hat i'$, así que la primera fila es
              $\hat i' = (l, m, 0)$; la segunda, $\hat j' = (-m, l, 0)$, que
              es $\hat i'$ girado 90° en sentido antihorario; y la tercera,
              $\hat k' = \hat k$, porque el giro es alrededor de $z$.
          - texto: >-
              $[R] = \begin{bmatrix} l & -m & 0\\ m & l & 0\\ 0 & 0 & 1\end{bmatrix}$,
              con $\hat i'$, $\hat j'$ y $\hat k'$ en las columnas
            mensaje: |
              Es la traspuesta, $[R]^{t}$, la que vuelve de Ox'y'z' a Oxyz
              (ec. 2.24). Con ella cada componente sale como si los ejes
              hubieran girado $-\theta$: es el error que deja el giro al
              revés.
          - texto: >-
              $[R] = \begin{bmatrix} l & m & 0\\ m & -l & 0\\ 0 & 0 & 1\end{bmatrix}$,
              con $\hat j' = (m, -l, 0)$, que también es perpendicular a $\hat i'$
            mensaje: |
              Ese $\hat j'$ es perpendicular a $\hat i'$, pero apunta al otro
              lado: con él, $\hat i'\times\hat j' = -\hat k$ y el triedro
              queda a izquierdas. Es una simetría, no un giro: su determinante
              vale $-1$.
      - tipo: calcular
        titulo: La normal en la cara x′
        pregunta: |
          Un ejemplo nuestro, en MPa: $\sigma_x = 80$, $\sigma_y = -40$,
          $\sigma_z = 30$, $\tau_{xy} = 45$, $\tau_{xz} = 20$ y
          $\tau_{yz} = 10$, con $\theta = 30°$. ¿Cuánto vale $\sigma_{x'}$, en
          MPa?
        respuesta:
          tipo: numero
          valor: '88.97'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '11.03'
            mensaje: |
              Es el giro al revés: $[R]^{t}$ en lugar de $[R]$, o $x'$ a 30°
              por debajo de $x$. El término de $\tau_{xy}$ cambia de signo:
              $60 - 10 - 38{,}97$.
          - valor: '69.49'
            mensaje: |
              Te falta el 2 del término de $\tau_{xy}$. En
              $\{\hat i'\}^{t}[\sigma]\{\hat i'\}$ entran $\tau_{xy}$ y
              $\tau_{yx}$, dos términos iguales, y suman $2lm\,\tau_{xy}$.
          - valor: '94.46'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$ en la fórmula del ángulo
              doble. Con $l^{2} = \tfrac12(1 + \cos2\theta)$ y
              $2lm = \operatorname{sen}2\theta$, el ángulo que entra es 60°.
        pista: |
          $\sigma_{x'} = \{\hat i'\}^{t}[\sigma]\{\hat i'\}$ con
          $\hat i' = (l, m, 0)$: solo entran $\sigma_x$, $\sigma_y$ y
          $\tau_{xy}$.
        desarrollo: |
          Con $l = \cos30° = 0{,}8660$ y $m = 0{,}5$, en MPa:

          $$
          \sigma_{x'} = l^{2}\sigma_x + m^{2}\sigma_y + 2lm\,\tau_{xy} = 0{,}75\cdot80 + 0{,}25\cdot(-40) + 0{,}8660\cdot45 = 60 - 10 + 38{,}97 = 88{,}97
          $$

          Con la ec. 2.61 de la tensión plana sale lo mismo:
          $20 + 60\cos60° + 45\operatorname{sen}60° = 20 + 30 + 38{,}97 = 88{,}97$.
      - tipo: calcular
        titulo: La tangencial entre x′ e y′
        pregunta: |
          Con el mismo ejemplo, ¿cuánto vale $\tau_{x'y'}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-29.46'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '74.46'
            mensaje: |
              Has escrito $lm(\sigma_x - \sigma_y)$ en lugar de
              $lm(\sigma_y - \sigma_x)$, o has girado al revés ($m$ por $-m$):
              los dos errores dan este número. $\tau_{x'y'}$ es
              $\{\hat j'\}^{t}[\sigma]\{\hat i'\}$, con
              $\hat j' = (-m, l, 0)$: el $-m$ va con $\sigma_x$.
          - valor: '-6.96'
            mensaje: |
              Has puesto $l^{2} + m^{2}$, que vale 1, donde va
              $l^{2} - m^{2} = \cos2\theta = 0{,}5$: el término de $\tau_{xy}$
              es 22,5 MPa, no 45.
          - valor: '-81.42'
            mensaje: |
              Te sobra un 2. $lm(\sigma_y - \sigma_x)$ es
              $\tfrac12(\sigma_y - \sigma_x)\operatorname{sen}2\theta$, y has
              escrito $(\sigma_y - \sigma_x)\operatorname{sen}2\theta$ sin el ½.
          - valor: '29.46'
            mensaje: |
              El triedro: con $\hat j' = (m, -l, 0)$ el sistema queda a
              izquierdas, y cambian de signo las componentes con $y'$.
              $\hat j'$ es $\hat i'$ girado 90° en sentido antihorario,
              $(-m, l, 0)$.
        pista: |
          $\tau_{x'y'} = \{\hat j'\}^{t}[\sigma]\{\hat i'\}$, con
          $\hat j' = (-m, l, 0)$.
        desarrollo: |
          En MPa:

          $$
          \tau_{x'y'} = lm(\sigma_y - \sigma_x) + (l^{2} - m^{2})\,\tau_{xy} = 0{,}4330\cdot(-120) + 0{,}5\cdot45 = -51{,}96 + 22{,}5 = -29{,}46
          $$

          Con la ec. 2.61, $\tau_n = \tfrac12(\sigma_y - \sigma_x)\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
          da lo mismo, porque allí $\hat t$, la normal girada 90° en sentido
          antihorario, es $\hat j'$.
      - tipo: calcular
        titulo: La tangencial entre y′ y z′
        pregunta: |
          Con el mismo ejemplo, ¿cuánto vale $\tau_{y'z'}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-1.34'
          tolerancia: 0.01
          formato: un número con su signo, en MPa
        distractores:
          - valor: '18.66'
            mensaje: |
              El signo de $m$: $\tau_{y'z'} = -m\,\tau_{xz} + l\,\tau_{yz}$,
              porque $\hat j' = (-m, l, 0)$. Con $+m$, o con el giro al revés,
              sale $10 + 8{,}66$.
          - valor: '10'
            mensaje: |
              Es $\tau_{yz}$ sin girar. Que $z$ no se mueva no deja quietas
              las tangenciales con $z$: $\tau_{y'z'}$ es la componente según
              $z$ del vector tensión de la cara $y'$, y esa cara sí ha girado.
          - valor: '-12.32'
            mensaje: |
              Has cambiado $l$ y $m$ de sitio: $-l\,\tau_{xz} + m\,\tau_{yz}$.
              Con $\hat j' = (-m, l, 0)$, el seno va con $\tau_{xz}$ y el
              coseno con $\tau_{yz}$.
          - valor: '22.32'
            mensaje: |
              Es $\tau_{x'z'} = l\,\tau_{xz} + m\,\tau_{yz}$, la de la cara
              $x'$. La de la cara $y'$ lleva la segunda fila de $[R]$.
          - valor: '1.34'
            mensaje: |
              El triedro: con $\hat j' = (m, -l, 0)$ el sistema queda a
              izquierdas, y cambian de signo las componentes con $y'$.
              $\hat j'$ es $\hat i'$ girado 90° en sentido antihorario,
              $(-m, l, 0)$.
        pista: |
          $\tau_{y'z'} = \{\hat k'\}^{t}[\sigma]\{\hat j'\}$ con
          $\hat k' = \hat k$: es la componente $z$ de $[\sigma]\{\hat j'\}$.
        desarrollo: |
          En MPa:

          $$
          \tau_{y'z'} = -m\,\tau_{xz} + l\,\tau_{yz} = -0{,}5\cdot20 + 0{,}8660\cdot10 = -10 + 8{,}66 = -1{,}34
          $$

          Las otras dos de $z$: $\tau_{x'z'} = l\,\tau_{xz} + m\,\tau_{yz} = 17{,}32 + 5 = 22{,}32$
          y $\sigma_{z'} = \sigma_z = 30$, también en MPa.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las filas de $[R]$ son los ejes nuevos escritos en Oxyz:
              $\hat i' = (l, m, 0)$, $\hat j' = (-m, l, 0)$ y
              $\hat k' = (0, 0, 1)$.
          - texto: >-
              Cada componente nueva es una proyección del vector tensión de una
              cara: $\sigma_{x'} = \{\hat i'\}^{t}[\sigma]\{\hat i'\}$,
              $\tau_{x'y'} = \{\hat j'\}^{t}[\sigma]\{\hat i'\}$, y así las
              seis; juntas, $[\sigma]' = [R][\sigma][R]^{t}$ (ec. 2.27).
          - texto: >-
              $\sigma_{x'} = l^{2}\sigma_x + m^{2}\sigma_y + 2lm\,\tau_{xy}$ y
              $\sigma_{y'} = m^{2}\sigma_x + l^{2}\sigma_y - 2lm\,\tau_{xy}$.
          - texto: >-
              $\tau_{x'y'} = lm(\sigma_y - \sigma_x) + (l^{2} - m^{2})\,\tau_{xy}$.
          - texto: >-
              $\sigma_{z'} = \sigma_z$, $\tau_{x'z'} = l\,\tau_{xz} + m\,\tau_{yz}$
              y $\tau_{y'z'} = -m\,\tau_{xz} + l\,\tau_{yz}$.
          - texto: >-
              Como el eje $z$ no se mueve, las tangenciales con $z$ tampoco
              cambian: $\tau_{x'z'} = \tau_{xz}$ y $\tau_{y'z'} = \tau_{yz}$.
            trampa: true
            mensaje: |
              Solo $\sigma_{z'} = \sigma_z$ se queda igual. $\tau_{x'z'}$ es la
              componente según $z$ del vector tensión de la cara $x'$, y esa
              cara sí ha girado: $\tau_{x'z'} = l\,\tau_{xz} + m\,\tau_{yz}$. En
              el ejemplo, 22,32 MPa frente a los 20 de $\tau_{xz}$.
    resolucion: |
      **La idea.** Las componentes en unos ejes girados salen de proyectar.
      Cada cara de Ox'y'z' tiene su vector tensión por Cauchy,
      $\{S\} = [\sigma]\{n\}$ (ec. 2.14), y sus componentes según $x'$, $y'$ y
      $z'$ son las del tensor nuevo. Escrito con matrices es
      $[\sigma]' = [R][\sigma][R]^{t}$ (ec. 2.27), con los unitarios de los
      ejes nuevos en las filas de $[R]$.

      **La matriz del giro.** Con $x'$ a $\theta$ de $x$ en sentido
      antihorario, como en la figura, y $z' = z$:

      $$
      [R] = \begin{bmatrix} l & m & 0\\ -m & l & 0\\ 0 & 0 & 1\end{bmatrix},\qquad l = \cos\theta,\quad m = \operatorname{sen}\theta
      $$

      **La cara x′.** Su normal es $\hat i' = (l, m, 0)$ y su vector tensión,

      $$
      \{S\}_{x'} = [\sigma]\{\hat i'\} = \begin{pmatrix} l\,\sigma_x + m\,\tau_{xy}\\ l\,\tau_{xy} + m\,\sigma_y\\ l\,\tau_{xz} + m\,\tau_{yz}\end{pmatrix}
      $$

      Proyectado sobre $\hat i'$, $\hat j'$ y $\hat k'$:

      $$
      \begin{aligned}
      \sigma_{x'} &= l^{2}\sigma_x + m^{2}\sigma_y + 2lm\,\tau_{xy}\\
      \tau_{x'y'} &= lm(\sigma_y - \sigma_x) + (l^{2} - m^{2})\,\tau_{xy}\\
      \tau_{x'z'} &= l\,\tau_{xz} + m\,\tau_{yz}
      \end{aligned}
      $$

      **La cara y′.** Con $\hat j' = (-m, l, 0)$, del vector tensión
      $[\sigma]\{\hat j'\}$ salen las dos que faltan con $y'$:

      $$
      \begin{aligned}
      \sigma_{y'} &= m^{2}\sigma_x + l^{2}\sigma_y - 2lm\,\tau_{xy}\\
      \tau_{y'z'} &= -m\,\tau_{xz} + l\,\tau_{yz}
      \end{aligned}
      $$

      **La cara z′.** Es la misma que la $z$, y su vector tensión,
      $(\tau_{xz}, \tau_{yz}, \sigma_z)$, también: $\sigma_{z'} = \sigma_z$.
      Lo que cambia es cómo se reparte su parte tangencial entre $x'$ e $y'$,
      y eso da otra vez las $\tau_{x'z'}$ y $\tau_{y'z'}$ de arriba, como
      pide la reciprocidad.

      **Con el ángulo doble.** Con $l^{2} = \tfrac12(1 + \cos2\theta)$,
      $m^{2} = \tfrac12(1 - \cos2\theta)$ y $2lm = \operatorname{sen}2\theta$,
      las dos del plano son las de la tensión plana (ec. 2.61, p. 23):

      $$
      \sigma_{x'} = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\operatorname{sen}2\theta,\qquad
      \tau_{x'y'} = \frac{\sigma_y - \sigma_x}{2}\operatorname{sen}2\theta + \tau_{xy}\cos2\theta
      $$

      **Comprobación.** $\sigma_{x'} + \sigma_{y'} = \sigma_x + \sigma_y$,
      porque $l^{2} + m^{2} = 1$: la traza no cambia con el giro. En el
      ejemplo de los pasos ($\theta = 30°$), $\sigma_{x'} = 88{,}97$ y
      $\sigma_{y'} = -48{,}97$ MPa suman 40, como $80 - 40$; y el motor del
      curso, girando la matriz entera con $[R]$, da las seis componentes de
      arriba.

  # ── Ejercicio de clase 2.2 · las tensiones octaédricas.
  - id: ejerm2-cl2-2-las-tensiones-octaedricas
    titulo: Las componentes intrínsecas en los planos que forman el mismo ángulo con las tres direcciones principales
    fuente: >-
      Ejercicio 2.2 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el vector tensión en los ejes principales (ecs. 2.14, 2.16
      y 2.47 de los apuntes del tema 2). Los apuntes del tema 2 no tratan los
      planos octaédricos: salen en el tema 6 (diapositiva 15), con el criterio
      de von Mises. El enunciado no da números: los pasos con cifras usan un
      ejemplo nuestro, y cada cifra sale del motor del curso, en los ocho
      planos, y está comprobada a mano por un segundo camino. La figura está
      redibujada.
    nivel: practica
    enunciado: |
      Los planos que forman los mismos ángulos con las direcciones
      principales son los planos octaédricos. En la figura se muestra uno de
      los 8 planos que cumplen la condición, así como su vector normal.
      Determinar las componentes intrínsecas de los vectores tensión
      octaédricos $\sigma_{oct}$, $\tau_{oct}$ en función de las tensiones
      principales $\sigma_1$, $\sigma_2$, $\sigma_3$.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 262" role="img" width="340" height="262" aria-labelledby="ejerm2-cl2-2-las-tensiones-octaedricas-fig-t ejerm2-cl2-2-las-tensiones-octaedricas-fig-d">
      <title id="ejerm2-cl2-2-las-tensiones-octaedricas-fig-t">Uno de los ocho planos octaédricos, con los ejes principales 1, 2 y 3 y su normal</title>
      <desc id="ejerm2-cl2-2-las-tensiones-octaedricas-fig-d">Los tres ejes de las direcciones principales en perspectiva: 3 hacia arriba, 2 hacia la derecha y 1 hacia abajo y a la izquierda. Un triángulo sombreado tiene un vértice en cada eje, a la misma distancia del origen, que queda detrás; de cada vértice sale hacia fuera su eje, con la flecha y el número. Desde el centro del triángulo sale, hacia arriba y a la derecha, su vector normal, rotulado n con una flecha encima y el subíndice o.</desc>
      <polygon points="100.79,221.21 270,172 150,52" fill="var(--faint)" fill-opacity="0.3" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="150" y1="52" x2="150" y2="15" stroke="var(--ink)" stroke-width="1.5"/><polygon points="150,8 153.5,16 146.5,16" fill="var(--ink)"/>
      <line x1="270" y1="172" x2="315" y2="172" stroke="var(--ink)" stroke-width="1.5"/><polygon points="322,172 314,175.5 314,168.5" fill="var(--ink)"/>
      <line x1="100.79" y1="221.21" x2="75.74" y2="246.26" stroke="var(--ink)" stroke-width="1.5"/><polygon points="70.79,251.21 73.97,243.08 78.92,248.03" fill="var(--ink)"/>
      <line x1="173.6" y1="148.4" x2="203.66" y2="104.19" stroke="var(--d2)" stroke-width="1.7"/><polygon points="207.6,98.4 205.99,106.99 200.2,103.05" fill="var(--d2)"/>
      <text x="162" y="20" font-size="13" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">3</text>
      <text x="314" y="160" font-size="13" fill="var(--ink)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">2</text>
      <text x="64.79" y="239.21" font-size="13" fill="var(--ink)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">1</text>
      <text x="213.6" y="94.4" font-size="13" font-style="italic" fill="var(--d2-tinta)" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">n<tspan dy="3" font-size="9">o</tspan></text>
      <line x1="214.6" y1="83.4" x2="220.1" y2="83.4" stroke="var(--d2-tinta)" stroke-width="0.9"/><polygon points="222.6,83.4 219.1,85.2 219.1,81.6" fill="var(--d2-tinta)"/>
      </svg>
      <figcaption>

      Redibujada del enunciado: los ejes 1, 2 y 3 son las direcciones
      principales, y el plano los corta a la misma distancia del origen,
      que queda detrás. Como en el original, la normal lleva el subíndice o.

      </figcaption>
      </figure>

      **Notas nuestras.** El plano de la figura corta los tres semiejes
      positivos; los otros siete salen de cambiar el sentido de uno, dos o
      los tres.
    pide: >-
      σoct y τoct, las componentes intrínsecas del vector tensión en los
      planos octaédricos, en función de σ1, σ2 y σ3.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los ejes principales, ¿cuál es la normal $\vec n_{o}$ del plano de
          la figura?
        opciones:
          - texto: $\vec n_{o} = \tfrac{1}{\sqrt3}(1, 1, 1)$
            correcta: true
            mensaje: |
              Eso es. «Los mismos ángulos» son tres cosenos directores
              iguales, y lo que suma 1 son sus cuadrados: $3n^{2} = 1$ y
              $n = 1/\sqrt3$, un ángulo de 54,74° con cada dirección
              principal.
          - texto: $\vec n_{o} = \tfrac13(1, 1, 1)$
            mensaje: |
              Los cosenos directores no suman 1: suman 1 sus cuadrados. Con
              ⅓ en cada uno, el vector mide $1/\sqrt3$ y no es unitario.
          - texto: $\vec n_{o} = (1, 1, 1)$, porque el plano corta los tres ejes a la misma distancia
            mensaje: |
              Esa es la dirección, pero el vector mide $\sqrt3$. Cauchy da el
              vector tensión con la normal unitaria; con esta, $\vec S$ sale
              $\sqrt3$ veces mayor y $\sigma_n$, tres veces.
      - tipo: calcular
        titulo: La normal octaédrica
        pregunta: |
          Un ejemplo nuestro: $\sigma_1 = 120$, $\sigma_2 = 60$ y
          $\sigma_3 = -30$ MPa. ¿Cuánto vale $\sigma_{\text{oct}}$, en MPa?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '150'
            mensaje: |
              Es la suma sin dividir entre 3, lo que sale con la normal
              $(1, 1, 1)$ sin hacerla unitaria: el $1/\sqrt3$ entra dos
              veces, al formar $\vec S$ y al proyectarlo sobre $\vec n_{o}$.
          - valor: '86.6'
            mensaje: |
              Has dividido entre $\sqrt3$ una sola vez. El factor entra dos
              veces, en $\vec S = [\sigma]\{n_{o}\}$ y en $\vec S\cdot\vec n_{o}$:
              en total, ⅓.
          - valor: '45'
            mensaje: |
              Es $\tfrac12(\sigma_1 + \sigma_3)$, la normal en los planos de
              la tangencial máxima, a 45° de 1 y de 3. El octaédrico forma el
              mismo ángulo con las tres direcciones, y $\sigma_2$ también
              entra.
          - valor: '16.67'
            mensaje: |
              Has usado $\tfrac13(1, 1, 1)$ como normal: sus componentes
              suman 1, pero lo que tiene que sumar 1 son sus cuadrados, y ese
              vector no es unitario.
        pista: |
          En los ejes principales $[\sigma]$ es diagonal (ec. 2.47):
          $\vec S = (\sigma_1 n_1, \sigma_2 n_2, \sigma_3 n_3)$ y
          $\sigma_n = \vec S\cdot\vec n$.
        desarrollo: |
          En MPa:

          $$
          \sigma_{\text{oct}} = \frac{\sigma_1 + \sigma_2 + \sigma_3}{3} = \frac{120 + 60 - 30}{3} = 50
          $$

          Es la media de las tres, la misma $\sigma_e$ de la componente
          esférica.
      - tipo: calcular
        titulo: La tangencial octaédrica
        pregunta: |
          Con el mismo ejemplo, ¿cuánto vale $\tau_{\text{oct}}$, en MPa?
        respuesta:
          tipo: numero
          valor: '61.64'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '75'
            mensaje: |
              Es $\tfrac12(\sigma_1 - \sigma_3)$, la tangencial máxima del
              punto, en los planos a 45° de 1 y de 3. La del octaédrico, que
              forma 54,74° con las tres, es menor.
          - valor: '29.37'
            mensaje: |
              Has restado los módulos: $|\vec S| - \sigma_{\text{oct}} = 79{,}37 - 50$.
              $\sigma_n$ y $\tau_n$ son los catetos de un triángulo
              rectángulo de hipotenusa $|\vec S|$: se restan los cuadrados.
          - valor: '184.93'
            mensaje: |
              Te falta el ⅓ de delante:
              $\tau_{\text{oct}} = \tfrac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$.
          - valor: '79.37'
            mensaje: |
              Es $|\vec S|$, el vector tensión entero; o casi, si has restado
              $\sigma_{\text{oct}}$ sin elevarla al cuadrado, que da 79,06 y
              cae aquí. $\tau_{\text{oct}}^{2} = |\vec S|^{2} - \sigma_{\text{oct}}^{2} = 6300 - 2500$.
          - valor: '42.69'
            mensaje: |
              Has usado $\tfrac13(1, 1, 1)$ como normal: sus componentes
              suman 1, pero lo que tiene que sumar 1 son sus cuadrados, y ese
              vector no es unitario.
        pista: |
          $|\vec S|^{2} = \tfrac13(\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2})$
          y $\tau_n^{2} = |\vec S|^{2} - \sigma_n^{2}$ (ec. 2.16).
        desarrollo: |
          En MPa:

          $$
          |\vec S|^{2} = \frac{120^{2} + 60^{2} + 30^{2}}{3} = \frac{14\,400 + 3600 + 900}{3} = 6300
          $$

          $$
          \tau_{\text{oct}} = \sqrt{6300 - 50^{2}} = \sqrt{3800} = 61{,}64
          $$

          Con la fórmula cerrada, lo mismo:
          $\tfrac13\sqrt{60^{2} + 90^{2} + 150^{2}} = \tfrac13\sqrt{34\,200} = 61{,}64$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En los ejes principales el tensor es diagonal, y la normal del
              plano de la figura es $\vec n_{o} = \tfrac{1}{\sqrt3}(1, 1, 1)$.
          - texto: >-
              Su vector tensión es
              $\vec S = \tfrac{1}{\sqrt3}(\sigma_1, \sigma_2, \sigma_3)$.
          - texto: >-
              $\sigma_{\text{oct}} = \vec S\cdot\vec n_{o} = \tfrac13(\sigma_1 + \sigma_2 + \sigma_3)$.
          - texto: >-
              $\tau_{\text{oct}}^{2} = |\vec S|^{2} - \sigma_{\text{oct}}^{2} = \tfrac19\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]$.
          - texto: >-
              Las dos salen iguales en los ocho planos: los signos de la
              normal desaparecen al elevar al cuadrado.
          - texto: >-
              Como el plano forma el mismo ángulo con las tres direcciones,
              $\tau_{\text{oct}}$ es la tangencial máxima,
              $\tfrac12(\sigma_1 - \sigma_3)$.
            trampa: true
            mensaje: |
              La tangencial máxima está en los planos a 45° de las direcciones
              1 y 3, que contienen la 2. El octaédrico es otro plano, y su
              tangencial es menor: en el ejemplo, 61,64 MPa frente a 75.
    resolucion: |
      **La idea.** En los ejes principales el tensor es diagonal (ec. 2.47),
      y el vector tensión de un plano de normal $\vec n = (n_1, n_2, n_3)$ es
      $\vec S = (\sigma_1 n_1, \sigma_2 n_2, \sigma_3 n_3)$. Sus componentes
      intrínsecas salen de $\sigma_n = \vec S\cdot\vec n$ y
      $\tau_n^{2} = |\vec S|^{2} - \sigma_n^{2}$ (ecs. 2.14 y 2.16).

      **La normal.** Formar los mismos ángulos con 1, 2 y 3 es tener los tres
      cosenos directores iguales en valor absoluto; como
      $n_1^{2} + n_2^{2} + n_3^{2} = 1$, cada uno vale $\pm1/\sqrt3$, un
      ángulo de 54,74° con cada dirección. Las ocho combinaciones de signos
      son las ocho caras de un octaedro, de ahí el nombre. El de la figura es
      $\vec n_{o} = \tfrac{1}{\sqrt3}(1, 1, 1)$.

      **La normal octaédrica.**

      $$
      \vec S = \frac{1}{\sqrt3}(\sigma_1, \sigma_2, \sigma_3),\qquad
      \sigma_{\text{oct}} = \vec S\cdot\vec n_{o} = \frac{\sigma_1 + \sigma_2 + \sigma_3}{3} = \frac{I_1}{3}
      $$

      Es la media de las tres principales, la $\sigma_e$ de la componente
      esférica (ecs. 2.51 a 2.54).

      **La tangencial octaédrica.**

      $$
      \tau_{\text{oct}}^{2} = \frac{\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2}}{3} - \frac{(\sigma_1 + \sigma_2 + \sigma_3)^{2}}{9}
      = \frac{2(\sigma_1^{2} + \sigma_2^{2} + \sigma_3^{2}) - 2(\sigma_1\sigma_2 + \sigma_2\sigma_3 + \sigma_3\sigma_1)}{9}
      $$

      y, agrupando por parejas,

      $$
      \tau_{\text{oct}} = \frac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}} = \frac{\sqrt2}{3}\sqrt{I_1^{2} - 3I_2}
      $$

      Como las dos dependen solo de las principales, salen iguales en los
      ocho planos, y con los invariantes se pueden calcular sin
      diagonalizar el tensor.

      **Para qué sirven.** $\sigma_{\text{oct}}$ es la parte que cambia el
      volumen y $\tau_{\text{oct}}$ la que distorsiona. En el tema 6, el
      criterio de von Mises se escribe con ella: la tensión equivalente es
      $\sigma_{eq} = \tfrac{3}{\sqrt2}\,\tau_{\text{oct}}$. El ejercicio 2.4
      la usa para comparar una tracción con una cortadura.

      **Comprobación con el ejemplo de los pasos.** Con 120, 60 y $-30$ MPa,
      $I_1 = 150$ e $I_2 = 7200 - 1800 - 3600 = 1800$, en MPa y MPa²; y
      $\tfrac{\sqrt2}{3}\cdot\sqrt{17\,100} = 61{,}64$ MPa, lo mismo que por
      $|\vec S|$. El motor del curso, con el tensor diagonal y
      $\vec n_{o}$, da 50 y 61,64 MPa, y lo mismo en los otros siete planos.

  # ── Ejercicio de clase 2.3 · las fuerzas de volumen de un campo de tensiones.
  - id: ejerm2-cl2-3-las-fuerzas-de-volumen-de-un-campo
    titulo: Las fuerzas de volumen de un campo de tensiones, y sus partes esférica y desviadora en un punto
    fuente: >-
      Ejercicio 2.3 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con las ecuaciones de equilibrio interno de los apuntes del
      tema 2 (ecs. 2.3 y 2.4, p. 7) y la descomposición en esférica y
      desviadora (ecs. 2.51 a 2.54, p. 20). El enunciado da las tensiones en
      kilopondios y no da la gravedad: se toma 1 kp = 9,81 N. Cada cifra sale
      del motor del curso (el tensor del campo en cada punto y su
      descomposición) y está comprobada por un segundo camino: las derivadas
      del campo, hechas a mano, frente a diferencias finitas sobre el propio
      campo en un punto cualquiera, y la traza nula de la desviadora.
    nivel: practica
    enunciado: |
      El tensor de tensiones del punto O relativo al sistema de referencia
      Oxyz viene dado por:

      $$
      [\sigma] = \begin{bmatrix} 4x + 3y & -6(x + y + z) & y + z\\ -6(x + y + z) & 10(y - z) & 3x\\ y + z & 3x & 5z \end{bmatrix}
      $$

      Las tensiones están dadas en kp/mm² cuando las coordenadas se expresan
      en metros. Determinar:

      a/ Las fuerzas de volumen en N/m³.

      b/ Determinar las componentes esférica y desviadora en el punto
      P(0, 1, -1), estando las coordenadas en metros.

      **Notas nuestras.** El enunciado no da la gravedad: aquí un kilopondio
      son 9,81 N. Las fuerzas de volumen, $F_x$, $F_y$ y $F_z$, son fuerzas
      por unidad de volumen, como el peso propio.
    pide: >-
      Las tres componentes de la fuerza de volumen, en N/m³, y las partes
      esférica y desviadora del tensor en P(0, 1, −1).
    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación de equilibrio interno según $x$ suma $F_x$ y tres
          derivadas. ¿Cuáles?
        opciones:
          - texto: >-
              $\dfrac{\partial\sigma_x}{\partial x} + \dfrac{\partial\tau_{yx}}{\partial y} + \dfrac{\partial\tau_{zx}}{\partial z}$:
              cada componente según $x$, derivada respecto de la coordenada
              de su cara
            correcta: true
            mensaje: |
              Eso es. En las caras $x$, $y$ y $z$ del elemento lo que empuja
              según $x$ es $\sigma_x$, $\tau_{yx}$ y $\tau_{zx}$, y cada una
              cambia de una cara a la opuesta con su coordenada: $\sigma_x$
              con $x$, $\tau_{yx}$ con $y$ y $\tau_{zx}$ con $z$ (ec. 2.4).
          - texto: >-
              $\dfrac{\partial\sigma_x}{\partial x} + \dfrac{\partial\tau_{xy}}{\partial x} + \dfrac{\partial\tau_{xz}}{\partial x}$:
              la fila $x$ entera, derivada respecto de $x$
            mensaje: |
              $\tau_{xy}$ actúa en las caras $x$, pero según $y$: no empuja
              según $x$. La que lo hace es $\tau_{yx}$, de las caras $y$, y
              cambia de una a otra con $y$, no con $x$.
          - texto: >-
              $\dfrac{\partial\sigma_x}{\partial x} + \dfrac{\partial\sigma_y}{\partial y} + \dfrac{\partial\sigma_z}{\partial z}$:
              las tres normales, cada una con su coordenada
            mensaje: |
              $\sigma_y$ y $\sigma_z$ empujan según $y$ y según $z$, no según
              $x$. Ninguna de las tres ecuaciones es esa suma: cada una junta
              una normal y dos tangenciales.
      - tipo: calcular
        titulo: La fuerza de volumen
        pregunta: |
          ¿Cuánto vale la fuerza de volumen $(F_x, F_y, F_z)$, en unidades de
          $10^{6}$ N/m³?
        respuesta:
          tipo: vector
          valor: '(9.81, -39.24, -49.05)'
          tolerancia: 0.1
          formato: tres componentes en 10⁶ N/m³, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(-9.81, 39.24, 49.05)'
            mensaje: |
              El signo. Las derivadas y la fuerza de volumen suman cero
              (ec. 2.4), así que la fuerza va al revés que la suma de las
              derivadas: $F_x = -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right)$.
          - valor: '(1, -4, -5)'
            mensaje: |
              Has tomado el kp/mm² por un MPa: falta pasar los kilopondios a
              newtons. Cada kp/mm² son $9{,}81\cdot10^{6}$ N/m², y cada
              (kp/mm²)/m, $9{,}81\cdot10^{6}$ N/m³.
          - valor: '(19.62, -39.24, -58.86)'
            mensaje: |
              Has derivado cada fila entera respecto de una sola coordenada:
              en la de $x$, también $\tau_{xy}$ y $\tau_{xz}$ respecto de $x$.
              En la ecuación según $x$ entran $\tau_{yx}$ derivada respecto
              de $y$ y $\tau_{zx}$ respecto de $z$.
        pista: |
          Las derivadas del campo son constantes; en (kp/mm²)/m,
          $\sigma_{x,x} = 4$, $\tau_{yx,y} = -6$ y $\tau_{zx,z} = 1$, y así en
          $y$ y en $z$.
        desarrollo: |
          En (kp/mm²)/m, con la ec. 2.4:

          $$
          \begin{aligned}
          F_x &= -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right) = -(4 - 6 + 1) = 1\\
          F_y &= -\left(\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z}\right) = -(-6 + 10 + 0) = -4\\
          F_z &= -\left(\tau_{xz,x} + \tau_{yz,y} + \sigma_{z,z}\right) = -(0 + 0 + 5) = -5
          \end{aligned}
          $$

          Cada (kp/mm²)/m son $9{,}81\cdot10^{6}$ N/m³, así que
          $\vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}$ N/m³, la misma
          en todos los puntos, porque el campo es lineal.
      - tipo: calcular
        titulo: La tensión esférica en P
        pregunta: |
          ¿Cuánto vale $\sigma_e$, la tensión de la componente esférica en
          P(0, 1, −1), en kp/mm²?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en kp/mm²
        distractores:
          - valor: '18'
            mensaje: |
              Es la traza, $I_1 = 3 + 20 - 5$, sin dividir entre 3. La
              esférica lleva en la diagonal la media, $\sigma_e = I_1/3$.
          - valor: '2.667'
            mensaje: |
              Has tomado $z = 1$: P es (0, 1, −1). Con $z = -1$,
              $\sigma_y = 10(1 + 1) = 20$ y $\sigma_z = -5$.
        pista: |
          Primero el tensor en P: sustituye $x = 0$, $y = 1$ y $z = -1$ en
          cada componente.
        desarrollo: |
          En P, en kp/mm²: $\sigma_x = 3$, $\sigma_y = 10(1 + 1) = 20$ y
          $\sigma_z = -5$, y las tres tangenciales se anulan:
          $-6(0 + 1 - 1) = 0$, $y + z = 0$ y $3x = 0$. El tensor es diagonal,
          y

          $$
          \sigma_e = \frac{3 + 20 - 5}{3} = 6
          $$
      - tipo: calcular
        titulo: La componente desviadora en P
        pregunta: |
          ¿Cuánto vale la componente desviadora en P, en kp/mm²?
        respuesta:
          tipo: matriz
          valor: '[-3, 0, 0; 0, 14, 0; 0, 0, -11]'
          tolerancia: 0.01
          formato: tres filas de tres números en kp/mm², con punto y coma entre filas
        distractores:
          - valor: '[-15, 0, 0; 0, 2, 0; 0, 0, -23]'
            mensaje: |
              Has restado la traza entera, 18, en lugar de su tercio. A la
              diagonal se le resta $\sigma_e = 6$.
          - valor: '[-3, -6, -6; -6, 14, -6; -6, -6, -11]'
            mensaje: |
              Has restado $\sigma_e$ también fuera de la diagonal. La esférica
              solo tiene diagonal: las tangenciales pasan enteras a la
              desviadora, y aquí son cero.
          - valor: '[6, 0, 0; 0, 6, 0; 0, 0, 6]'
            mensaje: |
              Es la esférica, $\sigma_e[I]$. La desviadora es lo que queda,
              $[\sigma] - \sigma_e[I]$.
        pista: |
          La desviadora es $[\sigma] - \sigma_e[I]$: solo cambia la diagonal.
        desarrollo: |
          En kp/mm², la esférica más la desviadora:

          $$
          \begin{bmatrix} 3 & 0 & 0\\ 0 & 20 & 0\\ 0 & 0 & -5 \end{bmatrix}
          = \begin{bmatrix} 6 & 0 & 0\\ 0 & 6 & 0\\ 0 & 0 & 6 \end{bmatrix}
          + \begin{bmatrix} -3 & 0 & 0\\ 0 & 14 & 0\\ 0 & 0 & -11 \end{bmatrix}
          $$

          La traza de la desviadora es $-3 + 14 - 11 = 0$, como tiene que
          ser. En MPa, la esférica lleva $6\cdot9{,}81 = 58{,}86$ en la
          diagonal.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio interno (ec. 2.4):
              $F_x = -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right)$, y
              lo mismo según $y$ y según $z$.
          - texto: >-
              Las derivadas del campo son constantes, y $\vec F = (1, -4, -5)$
              en (kp/mm²)/m en todos los puntos.
          - texto: >-
              Con 9,81 N por kilopondio y $10^{6}$ mm² por m²,
              $\vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}$ N/m³.
          - texto: >-
              En P(0, 1, −1) el tensor es diagonal, con 3, 20 y −5 kp/mm², y
              $\sigma_e = 6$ kp/mm².
          - texto: >-
              La esférica lleva 6 en la diagonal; la desviadora, −3, 14 y −11,
              y ceros fuera.
          - texto: >-
              La esférica de P es la media de la mayor y la menor principal,
              $\tfrac12(20 - 5) = 7{,}5$ kp/mm².
            trampa: true
            mensaje: |
              Esa media es el centro del círculo grande de Mohr. La esférica
              lleva la media de las tres, $\sigma_e = I_1/3 = 6$ kp/mm²: la
              intermedia también cuenta.
    resolucion: |
      **La idea.** Un campo de tensiones solo está en equilibrio si cumple,
      en cada punto, las tres ecuaciones de equilibrio interno (ecs. 2.3 y
      2.4, p. 7): según cada eje, las derivadas de las tres componentes que
      empujan en esa dirección, cada una respecto de la coordenada de su
      cara, más la fuerza de volumen, suman cero. De ahí sale la fuerza de
      volumen que hace falta. Para b/ basta el tensor en P y su traza.

      **a/ Las fuerzas de volumen.** El campo es lineal, así que las
      derivadas son números. En (kp/mm²)/m:

      $$
      \begin{aligned}
      F_x &= -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right) = -(4 - 6 + 1) = 1\\
      F_y &= -\left(\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z}\right) = -(-6 + 10 + 0) = -4\\
      F_z &= -\left(\tau_{xz,x} + \tau_{yz,y} + \sigma_{z,z}\right) = -(0 + 0 + 5) = -5
      \end{aligned}
      $$

      Las unidades: el campo da kp/mm² por cada metro. Un kilopondio son
      9,81 N y un mm², $10^{-6}$ m², así que cada (kp/mm²)/m son
      $9{,}81\cdot10^{6}$ N/m³, y

      $$
      \vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}\ \text{N/m}^{3}
      $$

      la misma en todo el sólido. Con 9,80665 N por kilopondio cambia la
      cuarta cifra: $(9{,}807;\ -39{,}23;\ -49{,}03)\cdot10^{6}$ N/m³.

      **b/ Esférica y desviadora en P.** En P(0, 1, −1) las tres
      tangenciales se anulan y el tensor es diagonal, con $\sigma_x = 3$,
      $\sigma_y = 20$ y $\sigma_z = -5$ kp/mm². La esférica lleva en la
      diagonal la media, $\sigma_e = I_1/3 = 6$ kp/mm², y la desviadora es lo
      que queda (ecs. 2.51 a 2.54):

      $$
      \begin{bmatrix} 3 & 0 & 0\\ 0 & 20 & 0\\ 0 & 0 & -5 \end{bmatrix}
      = \begin{bmatrix} 6 & 0 & 0\\ 0 & 6 & 0\\ 0 & 0 & 6 \end{bmatrix}
      + \begin{bmatrix} -3 & 0 & 0\\ 0 & 14 & 0\\ 0 & 0 & -11 \end{bmatrix}
      $$

      en kp/mm². La esférica es la parte que cambia el volumen de un
      material isótropo y la desviadora, con traza nula, la que lo
      distorsiona. En MPa, la esférica es 58,86 en la diagonal.

      **Comprobación.** El motor del curso da el tensor de P y su
      descomposición; y las derivadas, hechas por diferencias sobre el
      propio campo en un punto cualquiera, dan las mismas tres de arriba.
      La desviadora tiene traza $-3 + 14 - 11 = 0$.

  # ── Ejercicio de clase 2.4 · la misma octaédrica a tracción y a cortante.
  - id: ejerm2-cl2-4-la-misma-octaedrica-a-traccion-y-a-cortante
    titulo: Una tracción y una cortadura pura con la misma tangencial octaédrica
    fuente: >-
      Ejercicio 2.4 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con las tensiones octaédricas del ejercicio 2.2. Cada cifra
      sale del motor del curso (las principales de cada tensor y las
      componentes intrínsecas en el plano octaédrico de sus ejes
      principales) y está comprobada por un segundo camino: la fórmula con
      los invariantes y una tensión equivalente del tema 6.
    nivel: practica
    enunciado: |
      En el sistema de referencia Oxyz el cuerpo A está sometido a la
      tensión $\sigma_x = \sigma_0$ siendo nulas las demás componentes. El
      cuerpo B está sometido a $\tau_{xy} = \tau_0$ siendo nulas las demás
      componentes. Si la tensión cortante octaédrica (ejercicio 2.2) es la
      misma en ambos casos, determinar la relación $\sigma_0/\tau_0$.
    pide: >-
      La relación σ0/τ0 con la que la tensión cortante octaédrica de los dos
      cuerpos es la misma.
    pasos:
      - tipo: reconocer
        pregunta: |
          La fórmula del 2.2 pide las tensiones principales. ¿Cuáles son las
          del cuerpo B?
        opciones:
          - texto: $\tau_0$, $0$ y $-\tau_0$
            correcta: true
            mensaje: |
              Eso es. El bloque $xy$,
              $\begin{bmatrix} 0 & \tau_0\\ \tau_0 & 0\end{bmatrix}$, tiene
              los autovalores $\pm\tau_0$, en las direcciones a ±45° de $x$, y
              $z$ ya es principal, con 0. La cortadura pura es una tracción y
              una compresión iguales.
          - texto: $\tau_0$, $\tau_0$ y $0$, porque $\tau_{xy}$ y $\tau_{yx}$ valen las dos $\tau_0$
            mensaje: |
              $\tau_{xy}$ y $\tau_{yx}$ son la misma tangencial vista desde
              las dos caras, no dos principales. Las principales son los
              autovalores: $\lambda^{2} - \tau_0^{2} = 0$ da $\pm\tau_0$.
          - texto: $\tau_0$, $0$ y $0$, como en A con $\tau_0$ en lugar de $\sigma_0$
            mensaje: |
              Así sería una tracción. Una tangencial sola en Oxyz es, en los
              ejes a 45°, una tracción $\tau_0$ y una compresión $-\tau_0$ a
              la vez.
      - tipo: calcular
        titulo: La octaédrica de A
        pregunta: |
          ¿Cuánto vale $\tau_{\text{oct}}$ en el cuerpo A, en unidades de
          $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '0.4714'
          tolerancia: 0.0005
          formato: un número, en unidades de σ0
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $\sigma_0/2$, la tangencial máxima de A, en los planos a 45°
              de $x$. La octaédrica es otra:
              $\tfrac13\sqrt{\sigma_0^{2} + 0 + \sigma_0^{2}}$.
          - valor: '0.3333'
            mensaje: |
              Es $\sigma_{\text{oct}} = \sigma_0/3$, la componente normal en
              el plano octaédrico. Se pide la tangencial.
          - valor: '1.4142'
            mensaje: |
              Te falta el ⅓ de la fórmula del 2.2:
              $\tau_{\text{oct}} = \tfrac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$.
        pista: |
          Las principales de A son $\sigma_0$, 0 y 0: lleva sus diferencias a
          la fórmula del 2.2.
        desarrollo: |
          $$
          \tau_{\text{oct},A} = \frac13\sqrt{(\sigma_0 - 0)^{2} + (0 - 0)^{2} + (0 - \sigma_0)^{2}} = \frac{\sqrt2}{3}\,\sigma_0
          $$

          y $\tfrac{\sqrt2}{3} = 0{,}4714$.
      - tipo: calcular
        titulo: La octaédrica de B
        pregunta: |
          ¿Cuánto vale $\tau_{\text{oct}}$ en el cuerpo B, en unidades de
          $\tau_0$?
        respuesta:
          tipo: numero
          valor: '0.8165'
          tolerancia: 0.0005
          formato: un número, en unidades de τ0
        distractores:
          - valor: '0.4714'
            mensaje: |
              Sale con las principales mal: $\tau_0$, 0 y 0, o $\tau_0$,
              $\tau_0$ y 0, dan los dos $\tfrac{\sqrt2}{3}\tau_0$. Las de la
              cortadura pura son $\tau_0$, 0 y $-\tau_0$.
          - valor: '1'
            mensaje: |
              Es $\tau_0$, la tangencial máxima de B:
              $\tfrac12\left(\tau_0 - (-\tau_0)\right)$. La octaédrica es
              menor.
          - valor: '2.4495'
            mensaje: |
              Te falta el ⅓ de la fórmula del 2.2.
        pista: |
          Con las principales $\tau_0$, 0 y $-\tau_0$, las tres diferencias
          valen $\tau_0$, $\tau_0$ y $2\tau_0$.
        desarrollo: |
          $$
          \tau_{\text{oct},B} = \frac13\sqrt{\tau_0^{2} + \tau_0^{2} + (2\tau_0)^{2}} = \frac{\sqrt6}{3}\,\tau_0
          $$

          y $\tfrac{\sqrt6}{3} = 0{,}8165$.
      - tipo: calcular
        titulo: La relación entre σ0 y τ0
        pregunta: |
          ¿Cuánto vale $\sigma_0/\tau_0$?
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Sale con las principales de B mal, $\tau_0$ y dos ceros: los dos
              cuerpos parecen el mismo y el cociente vale 1.
          - valor: '2'
            mensaje: |
              Has igualado las tangenciales máximas, $\sigma_0/2 = \tau_0$:
              es lo que pediría Tresca. Con la tangencial octaédrica, que es
              lo de von Mises, sale otro número.
          - valor: '0.5774'
            mensaje: |
              Es $\tau_0/\sigma_0$, el cociente al revés.
        pista: |
          Iguala $\tfrac{\sqrt2}{3}\,\sigma_0$ y $\tfrac{\sqrt6}{3}\,\tau_0$.
        desarrollo: |
          $$
          \frac{\sqrt2}{3}\,\sigma_0 = \frac{\sqrt6}{3}\,\tau_0
          \;\Longrightarrow\; \frac{\sigma_0}{\tau_0} = \frac{\sqrt6}{\sqrt2} = \sqrt3 = 1{,}7321
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las principales de A son $\sigma_0$, 0 y 0, y
              $\tau_{\text{oct},A} = \tfrac{\sqrt2}{3}\,\sigma_0$.
          - texto: >-
              Las de B son $\tau_0$, 0 y $-\tau_0$, y
              $\tau_{\text{oct},B} = \tfrac{\sqrt6}{3}\,\tau_0$.
          - texto: >-
              Igualándolas, $\sigma_0/\tau_0 = \sqrt3$.
          - texto: >-
              Es la relación que da von Mises entre una tracción y una
              cortadura pura: la tensión equivalente de B es $\sqrt3\,\tau_0$.
          - texto: >-
              Como $\tau_{xy} = \tau_{yx} = \tau_0$, las principales de B son
              $\tau_0$, $\tau_0$ y 0.
            trampa: true
            mensaje: |
              Las dos son la misma tangencial, vista desde las caras $x$ y
              desde las $y$. Las principales son los autovalores del bloque
              $xy$, $\pm\tau_0$, y la de $z$, 0.
    resolucion: |
      **La idea.** La tangencial octaédrica solo depende de las tensiones
      principales (ejercicio 2.2):
      $\tau_{\text{oct}} = \tfrac13\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$.
      Se sacan las principales de cada cuerpo, se calcula y se iguala.

      **El cuerpo A.** Ya está en ejes principales: $\sigma_0$, 0 y 0.

      $$
      \tau_{\text{oct},A} = \frac13\sqrt{\sigma_0^{2} + 0 + \sigma_0^{2}} = \frac{\sqrt2}{3}\,\sigma_0
      $$

      **El cuerpo B.** $z$ es principal, con 0. El bloque $xy$ da
      $\lambda^{2} - \tau_0^{2} = 0$, es decir, $\pm\tau_0$, en las
      direcciones a ±45° de $x$ ($\sigma_x - \sigma_y = 0$, así que la
      ec. 2.62 da $2\theta_1 = 90°$).
      Ordenadas, $\tau_0$, 0 y $-\tau_0$:

      $$
      \tau_{\text{oct},B} = \frac13\sqrt{\tau_0^{2} + \tau_0^{2} + (2\tau_0)^{2}} = \frac{\sqrt6}{3}\,\tau_0
      $$

      **La relación.**

      $$
      \frac{\sqrt2}{3}\,\sigma_0 = \frac{\sqrt6}{3}\,\tau_0
      \;\Longrightarrow\; \frac{\sigma_0}{\tau_0} = \sqrt3 = 1{,}7321
      $$

      Para la misma tangencial octaédrica, la tensión de la tracción tiene
      que ser $\sqrt3$ veces la de la cortadura: una cortadura de
      $\tau_0$ distorsiona el material como una tracción de $1{,}73\,\tau_0$.

      **Comprobación por otros dos caminos.** Con los invariantes,
      $\tau_{\text{oct}} = \tfrac{\sqrt2}{3}\sqrt{I_1^{2} - 3I_2}$: en A,
      $I_1 = \sigma_0$ e $I_2 = 0$; en B, $I_1 = 0$ e $I_2 = -\tau_0^{2}$,
      y salen las mismas dos. Y con la tensión equivalente de von Mises del
      tema 6, que en tensión plana es
      $\sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2} + 3\tau_{xy}^{2}}$
      (ec. 6.30): vale $\sigma_0$ en A y $\sqrt3\,\tau_0$ en B, el mismo
      cociente, porque es $\tfrac{3}{\sqrt2}\,\tau_{\text{oct}}$.

  # ── Ejercicio de clase 2.6 · el tensor en un triedro girado.
  - id: ejerm2-cl2-6-el-tensor-en-un-triedro-girado
    titulo: La ley de giro del tensor, demostrada y aplicada a un triedro dado por sus unitarios
    fuente: >-
      Ejercicio 2.6 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el giro de ejes de los apuntes del tema 2 (ecs. 2.22 a
      2.28, pp. 13 a 15). El enunciado no da unidades: las componentes van en
      unidades de σ. Cada cifra sale del motor del curso (el giro de la
      matriz con [R]) y está comprobada por un segundo camino: cada
      componente calculada a mano, con las fracciones exactas, y los tres
      invariantes.
    nivel: practica
    enunciado: |
      Se tiene un sistema de referencia Ox'y'z' rotado respecto al original
      Oxyz. La relación entre las componentes de un vector $\vec v$ en ambos
      sistemas viene dada por: $\{v\}_{Ox'y'z'} = [R]\{v\}_{Oxyz}$.

      a/ Demostrar que las componentes del tensor de tensiones se relacionan
      según:

      $$
      [\sigma]_{Ox'y'z'} = [R][\sigma]_{Oxyz}[R]^{T}
      $$

      b/ Los vectores unitarios del sistema de referencia girado son:

      $$
      \vec i' = \tfrac{1}{\sqrt3}\left(\vec i + \vec j + \vec k\right)\qquad
      \vec j' = \tfrac{1}{\sqrt6}\left(\vec i + \vec j - 2\vec k\right)\qquad
      \vec k' = \tfrac{1}{\sqrt2}\left(-\vec i + \vec j\right)
      $$

      Determinar las componentes del tensor de tensiones en el sistema
      Ox'y'z' siendo las componentes en Oxyz:

      $$
      [\sigma]_{Oxyz} = \begin{bmatrix} \sigma & 0 & 0\\ 0 & -2\sigma & 0\\ 0 & 0 & 3\sigma \end{bmatrix}
      $$

      **Notas nuestras.** El enunciado no da unidades: las componentes de b/
      salen en unidades de $\sigma$.
    pide: >-
      a) La demostración de la ley de giro del tensor. b) Las seis
      componentes del tensor en Ox'y'z', en unidades de σ.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado b/, ¿cómo se monta $[R]$ con los tres unitarios?
        opciones:
          - texto: Con $\vec i'$, $\vec j'$ y $\vec k'$ en las filas, la primera $\tfrac{1}{\sqrt3}(1, 1, 1)$
            correcta: true
            mensaje: |
              Eso es. $v_{x'} = \vec v\cdot\vec i'$, así que la primera
              componente de $[R]\{v\}$ sale de multiplicar por la fila
              $\vec i'$. Las tres filas son perpendiculares y de módulo 1: por
              eso $[R]^{-1} = [R]^{t}$ (ec. 2.24).
          - texto: Con $\vec i'$, $\vec j'$ y $\vec k'$ en las columnas, la primera $\tfrac{1}{\sqrt3}(1, 1, 1)$
            mensaje: |
              Esa es $[R]^{t}$, la que vuelve de Ox'y'z' a Oxyz. Puesta en el
              sitio de $[R]$, gira al revés: da el tensor en otros ejes, no en
              los del enunciado.
          - texto: No hace falta, porque $[\sigma]$ es diagonal y en O$x'y'z'$ sigue siéndolo, con los mismos valores
            mensaje: |
              $x$, $y$ y $z$ son direcciones principales; $x'$, $y'$ y $z'$
              no lo son, y en ellos aparecen tangenciales. Lo que no cambia
              con el giro son los invariantes.
      - tipo: calcular
        titulo: La normal en la cara x′
        pregunta: |
          ¿Cuánto vale $\sigma_{x'}$, en unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.001
          formato: un número, en unidades de σ
        distractores:
          - valor: '1.5'
            mensaje: |
              Has tomado las columnas de $[R]$ por los ejes nuevos: es el
              término 1,1 de $[R]^{t}[\sigma][R]$. La primera fila de $[R]$ es
              $\vec i'$.
          - valor: '0.5774'
            mensaje: |
              Es el término 1,1 de $[R][\sigma]$ solo, $\tfrac{1}{\sqrt3}$:
              falta multiplicar por $[R]^{t}$ a la derecha, porque el tensor
              gira por sus dos índices.
          - valor: '2'
            mensaje: |
              Has usado $(1, 1, 1)$ sin el $\tfrac{1}{\sqrt3}$. $\vec i'$ es
              unitario, y el factor entra dos veces: ⅓.
        pista: |
          $\sigma_{x'} = \{\vec i'\}^{t}[\sigma]\{\vec i'\}$; con $[\sigma]$
          diagonal es la suma de cada término de la diagonal por el cuadrado
          de su componente de $\vec i'$.
        desarrollo: |
          En unidades de $\sigma$:

          $$
          \sigma_{x'} = \frac{1 - 2 + 3}{3} = \frac23 = 0{,}6667
          $$
      - tipo: calcular
        titulo: La tangencial entre x′ e y′
        pregunta: |
          ¿Cuánto vale $\tau_{x'y'}$, en unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '-1.6499'
          tolerancia: 0.001
          formato: un número con su signo, en unidades de σ
        distractores:
          - valor: '-1.5'
            mensaje: |
              Es el término 1,2 de $[R]^{t}[\sigma][R]$: las columnas tomadas
              como ejes nuevos.
          - valor: '-1.1547'
            mensaje: |
              Es el término 1,2 de $[R][\sigma]$, $\tfrac{1}{\sqrt3}\cdot(-2)$,
              sin $[R]^{t}$ a la derecha.
          - valor: '-7'
            mensaje: |
              Te faltan los factores de los unitarios: $(1, 1, 1)$ y
              $(1, 1, -2)$ dan $1 - 2 - 6$, que hay que dividir entre
              $\sqrt3\cdot\sqrt6 = \sqrt{18}$.
        pista: |
          $\tau_{x'y'} = \{\vec i'\}^{t}[\sigma]\{\vec j'\}$.
        desarrollo: |
          En unidades de $\sigma$:

          $$
          \tau_{x'y'} = \frac{1\cdot1\cdot1 + (-2)\cdot1\cdot1 + 3\cdot1\cdot(-2)}{\sqrt{18}} = \frac{-7}{\sqrt{18}} = -1{,}6499
          $$
      - tipo: calcular
        titulo: El tensor entero en Ox′y′z′
        pregunta: |
          ¿Cuánto vale $[\sigma]_{Ox'y'z'}$, en unidades de $\sigma$?
        respuesta:
          tipo: matriz
          valor: '[0.6667, -1.6499, -1.2247; -1.6499, 1.8333, -0.866; -1.2247, -0.866, -0.5]'
          tolerancia: 0.002
          formato: tres filas de tres números en unidades de σ, con punto y coma entre filas
        distractores:
          - valor: '[1.5, -1.5, 1; -1.5, 1.5, 1; 1, 1, -1]'
            mensaje: |
              Es $[R]^{t}[\sigma][R]$: has girado al revés, con los unitarios
              en las columnas. También tiene traza 2, porque también es un
              giro, pero a otros ejes.
          - valor: '[1, 0, 0; 0, -2, 0; 0, 0, 3]'
            mensaje: |
              Es el tensor de Oxyz sin girar. En Ox'y'z' deja de ser
              diagonal: $x'$, $y'$ y $z'$ no son direcciones principales.
          - valor: '[0.5774, -1.1547, 1.7321; 0.4082, -0.8165, -2.4495; -0.7071, -1.4142, 0]'
            mensaje: |
              Es $[R][\sigma]$, sin $[R]^{t}$ a la derecha: no sale simétrica,
              y un tensor de tensiones lo es siempre.
        pista: |
          Las otras cuatro, igual: $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$.
          Comprueba al final que la traza sigue valiendo $2\sigma$.
        desarrollo: |
          En unidades de $\sigma$, con las fracciones exactas:

          $$
          [\sigma]' = \begin{bmatrix} \tfrac23 & -\tfrac{7}{\sqrt{18}} & -\tfrac{3}{\sqrt6}\\ -\tfrac{7}{\sqrt{18}} & \tfrac{11}{6} & -\tfrac{3}{\sqrt{12}}\\ -\tfrac{3}{\sqrt6} & -\tfrac{3}{\sqrt{12}} & -\tfrac12 \end{bmatrix}
          = \begin{bmatrix} 0{,}6667 & -1{,}6499 & -1{,}2247\\ -1{,}6499 & 1{,}8333 & -0{,}8660\\ -1{,}2247 & -0{,}8660 & -0{,}5 \end{bmatrix}
          $$

          La traza, $\tfrac23 + \tfrac{11}{6} - \tfrac12 = 2$, es la de Oxyz,
          $1 - 2 + 3$.
      - tipo: justificar
        pregunta: Ordena la demostración del apartado a/. Una pieza es falsa.
        piezas:
          - texto: >-
              La relación de Cauchy vale en los dos sistemas:
              $\{S\} = [\sigma]\{n\}$ y $\{S\}' = [\sigma]'\{n\}'$.
          - texto: >-
              $\{S\}$ y $\{n\}$ son vectores: $\{S\}' = [R]\{S\}$ y
              $\{n\}' = [R]\{n\}$.
          - texto: >-
              Las filas de $[R]$ son unitarios perpendiculares, así que
              $[R]^{-1} = [R]^{t}$ y $\{n\} = [R]^{t}\{n\}'$.
          - texto: >-
              $\{S\}' = [R][\sigma]\{n\} = [R][\sigma][R]^{t}\{n\}'$ para
              cualquier $\{n\}'$; luego $[\sigma]' = [R][\sigma][R]^{t}$.
          - texto: >-
              Como $[\sigma]$ convierte vectores en vectores, se gira como uno
              de ellos: $[\sigma]' = [R][\sigma]$.
            trampa: true
            mensaje: |
              Eso gira solo uno de los dos índices. Cada componente lleva dos
              direcciones, la normal de la cara y la de la componente, y las
              dos giran: $[R]$ entra por la izquierda y $[R]^{t}$ por la
              derecha. $[R][\sigma]$ ni siquiera sale simétrica.
    resolucion: |
      **La idea.** Lo que define el tensor es que convierte la normal de un
      plano en su vector tensión, $\{S\} = [\sigma]\{n\}$ (ec. 2.14), y esa
      relación no depende de los ejes. Como $\{S\}$ y $\{n\}$ se transforman
      con $[R]$, el tensor queda obligado a transformarse de una forma
      concreta.

      **a/ La demostración.** En los dos sistemas,
      $\{S\} = [\sigma]\{n\}$ y $\{S\}' = [\sigma]'\{n\}'$. Los dos vectores
      giran con $[R]$ (ec. 2.22): $\{S\}' = [R]\{S\}$ y $\{n\}' = [R]\{n\}$.
      Las filas de $[R]$ son los unitarios de los ejes nuevos,
      perpendiculares y de módulo 1, así que $[R][R]^{t} = [I]$ y
      $[R]^{-1} = [R]^{t}$ (ec. 2.24): $\{n\} = [R]^{t}\{n\}'$. Encadenando,

      $$
      \{S\}' = [R]\{S\} = [R][\sigma]\{n\} = [R][\sigma][R]^{t}\{n\}'
      $$

      y como esto vale para cualquier normal $\{n\}'$, comparado con
      $\{S\}' = [\sigma]'\{n\}'$ da $[\sigma]' = [R][\sigma][R]^{t}$
      (ec. 2.27). La inversa, para volver, es
      $[\sigma] = [R]^{t}[\sigma]'[R]$ (ec. 2.28).

      **b/ La matriz del giro.** Con los unitarios en las filas:

      $$
      [R] = \begin{bmatrix} \tfrac{1}{\sqrt3} & \tfrac{1}{\sqrt3} & \tfrac{1}{\sqrt3}\\ \tfrac{1}{\sqrt6} & \tfrac{1}{\sqrt6} & -\tfrac{2}{\sqrt6}\\ -\tfrac{1}{\sqrt2} & \tfrac{1}{\sqrt2} & 0 \end{bmatrix}
      $$

      Las tres filas son perpendiculares y $\vec i'\times\vec j' = \vec k'$:
      el triedro nuevo es directo, como el de partida.

      **b/ Las componentes.** Cada una es
      $\sigma'_{ij} = \{e'_i\}^{t}[\sigma]\{e'_j\}$, y con
      $[\sigma]$ diagonal es la suma de $\sigma$, $-2\sigma$ y $3\sigma$
      por los productos de las componentes de los dos unitarios. En unidades
      de $\sigma$:

      $$
      [\sigma]' = \begin{bmatrix} \tfrac23 & -\tfrac{7}{\sqrt{18}} & -\tfrac{3}{\sqrt6}\\ -\tfrac{7}{\sqrt{18}} & \tfrac{11}{6} & -\tfrac{3}{\sqrt{12}}\\ -\tfrac{3}{\sqrt6} & -\tfrac{3}{\sqrt{12}} & -\tfrac12 \end{bmatrix}
      = \begin{bmatrix} 0{,}6667 & -1{,}6499 & -1{,}2247\\ -1{,}6499 & 1{,}8333 & -0{,}8660\\ -1{,}2247 & -0{,}8660 & -0{,}5 \end{bmatrix}
      $$

      Por ejemplo, $\sigma_{y'} = \tfrac{1 - 2 + 3\cdot4}{6} = \tfrac{11}{6}$
      y $\tau_{x'z'} = \tfrac{-1 - 2 + 0}{\sqrt3\cdot\sqrt2} = -\tfrac{3}{\sqrt6}$.

      **Comprobación.** Los invariantes no cambian con el giro: la traza es
      $\tfrac23 + \tfrac{11}{6} - \tfrac12 = 2$, como $1 - 2 + 3$; y el
      motor del curso da también $I_2 = -5$ e $I_3 = -6$ en los dos
      sistemas, en unidades de $\sigma^{2}$ y $\sigma^{3}$. Las principales
      siguen siendo $3\sigma$, $\sigma$ y $-2\sigma$, en las direcciones $z$,
      $x$ e $y$: el giro solo cambia cómo se ve el tensor.

  # ── Ejercicio de clase 2.7 · el círculo de Mohr dado.
  - id: ejerm2-cl2-7-el-circulo-de-mohr-dado
    titulo: Del círculo de Mohr dibujado al estado tensional en x e y, y a las principales
    fuente: >-
      Ejercicio 2.7 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio del curso para el círculo (apuntes del tema 2,
      p. 26) y la ec. 2.61. Cada cifra sale del motor del curso (el círculo
      y la ec. 2.61 con σx, σy y τxy leídos) y está comprobada por un segundo
      camino: la ec. 2.61 despejada en x′ con σx′ = 600 MPa como dato, y los
      invariantes del plano. La figura está redibujada, con el círculo a
      escala; la dirección D que trae no la usa el enunciado.
    nivel: practica
    enunciado: |
      En la figura se representa el círculo de Mohr que corresponde a un
      estado plano de tensiones. Las tensiones normales que corresponden a
      las direcciones $x$ y $x'$ son: $\sigma_x$ = 1200 MPa,
      $\sigma_{x'}$ = 600 MPa.

      a/ Representar el estado de tensiones que corresponde a las
      direcciones $x$ e $y$.

      b/ Calcular las tensiones principales y representar las tensiones
      principales y las direcciones principales.

