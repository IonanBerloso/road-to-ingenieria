      </figcaption>
      </figure>

      - **Cara x**: $(-20,\ 40,\ 30)$ MPa, compresión de 20 y tangenciales de
        40 hacia y y de 30 hacia z.
      - **Cara y**: $(40,\ -10,\ 20)$ MPa.
      - **Cara z**: $(30,\ 20,\ 40)$ MPa.
      - **El plano** es perpendicular a $(1, 2, 2)$, de módulo
        $\sqrt{1 + 4 + 4} = 3$: su normal unitaria es
        $\{n\} = \frac{1}{3}\,(1, 2, 2)$. Es la de la cara $ABC$ de la figura
        del enunciado: es perpendicular a $\vec{AB} = (-2, 1, 0)$ y a
        $\vec{AC} = (-2, 0, 1)$, porque $-2 + 2 = 0$ en los dos productos
        escalares.

      **2. Incógnitas.** El vector tensión $\{S\}$ y sus dos componentes
      intrínsecas, $\sigma_n$ y $\tau_n$.

      **3. Ecuaciones.** La de Cauchy (apuntes, ec. 2.14, p. 11), y la
      proyección sobre la normal y lo que queda, perpendicular a ella (ec. 2.16
      y la siguiente, p. 12):

      $$
      \{S\} = [\sigma]\{n\}
      \qquad
      \sigma_n = \{n\}^{t}\{S\}
      \qquad
      \tau_n = \sqrt{|S|^{2} - \sigma_n^{2}}
      $$

      **4. Resultados.** Cauchy, fila a fila:

      $$
      \{S\} = \frac{1}{3}
      \begin{bmatrix} -20 \cdot 1 + 40 \cdot 2 + 30 \cdot 2\\ 40 \cdot 1 - 10 \cdot 2 + 20 \cdot 2\\ 30 \cdot 1 + 20 \cdot 2 + 40 \cdot 2 \end{bmatrix}
      = \frac{1}{3}\begin{bmatrix} 120\\ 60\\ 150 \end{bmatrix}
      = \begin{bmatrix} 40\\ 20\\ 50 \end{bmatrix}\ \text{MPa}
      $$

      $$
      \sigma_n = \frac{40 + 2 \cdot 20 + 2 \cdot 50}{3} = 60\ \text{MPa}
      \qquad
      \tau_n = \sqrt{40^{2} + 20^{2} + 50^{2} - 60^{2}} = \sqrt{4500 - 3600} = 30\ \text{MPa}
      $$

      $\sigma_n$ sale positiva: el plano está a tracción. En 3D, $\tau_n$ es
      un módulo: sale positiva siempre.

      **5. Comprobación.** Por el tetraedro, con las áreas de verdad. Con las
      aristas de la figura, $OA = 2$ y $OB = OC = 1$, las caras de los ejes
      miden $OBC = \frac{1}{2}$, $OCA = 1$ y $OAB = 1$, y la cara oblicua,
      $ABC = \frac{1}{2}\,|\vec{AB} \times \vec{AC}| = \frac{1}{2}\,|(1, 2, 2)| = \frac{3}{2}$.
      Los cocientes son $\frac{1}{3}$, $\frac{2}{3}$ y $\frac{2}{3}$: las
      componentes de $\{n\}$ (ec. 2.11, p. 10). En la cara $OBC$, de normal
      $-x$, el vector tensión es $-(\sigma_x, \tau_{xy}, \tau_{xz})$, y así en
      las otras dos. El equilibrio según $x$:

      $$
      S_x \cdot \frac{3}{2} = -20 \cdot \frac{1}{2} + 40 \cdot 1 + 30 \cdot 1 = 60
      \;\Longrightarrow\;
      S_x = 40\ \text{MPa}
      $$

      el mismo. Y la parte tangencial, escrita como vector,
      $\{S\} - \sigma_n\{n\} = (40 - 20,\ 20 - 40,\ 50 - 40) = (20, -20, 10)$
      MPa, es perpendicular a $\{n\}$, porque $20 - 40 + 20 = 0$, y su módulo
      es $\sqrt{400 + 400 + 100} = 30$ MPa: $\tau_n$.

      **Lo que dice el resultado.** Las caras x e y están a compresión, y aun
      así el plano sale a tracción, con 60 MPa. En $S_x = 40$, la normal de
      la cara x solo pone $\sigma_x n_x = -6{,}67$; las tangenciales ponen
      $46{,}67$. Por eso no vale quedarse con la diagonal del tensor.

  # ── Ejemplo introductorio nuestro · las tensiones principales.
  - id: ejerm2-las-tres-principales-de-un-tensor
    titulo: Las tres tensiones principales de un tensor
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        Las tensiones principales son las de los planos en los que el vector
        tensión sale perpendicular al plano, sin tangencial. Son los autovalores
        del tensor, y sus direcciones, los autovectores.
      formula: |
        $$
        \det([\sigma] - \sigma[I]) = 0 \quad\Longleftrightarrow\quad \sigma^{3} - I_1\sigma^{2} + I_2\sigma - I_3 = 0
        $$

        Los invariantes no dependen de los ejes, así que con las tres raíces
        tienen que volver a salir: $I_1 = \sigma_1 + \sigma_2 + \sigma_3$,
        $I_2 = \sigma_1\sigma_2 + \sigma_2\sigma_3 + \sigma_3\sigma_1$ e
        $I_3 = \sigma_1\sigma_2\sigma_3$.
      reconocer: |
        Te dan un tensor en números y piden las principales, sus direcciones o
        los invariantes. Antes de desarrollar el determinante, mira la matriz: a
        veces una dirección ya es principal sin hacer ninguna cuenta.
    enunciado: |
      En un punto de un sólido, el tensor de tensiones en los ejes $xyz$ es

      $$
      [\sigma] = \begin{bmatrix} 0 & 40 & 0\\ 40 & 60 & 0\\ 0 & 0 & 100 \end{bmatrix}\ \text{MPa}
      $$

      Calcular las tres tensiones principales y la dirección principal de
      $\sigma_2$, y comprobar el resultado con los invariantes.
    pide: >-
      Las tres tensiones principales, en MPa, la dirección principal de σ2 y
      el segundo invariante, en MPa².
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿hay alguna dirección que ya sea principal?
        opciones:
          - texto: 'Sí, la $z$: su fila y su columna no tienen nada fuera de la diagonal'
            correcta: true
            mensaje: |
              Eso es. En la cara $z$, $\{S\} = [\sigma]\{0, 0, 1\} = (0, 0, 100)$:
              normal a la cara, sin tangencial. $z$ es principal, con
              100 MPa, y queda el bloque 2×2 de $x$ e $y$, un problema plano
              (apuntes, ecs. 2.38 a 2.41, pp. 17-18, allí con $x$ como
              principal suelta).
          - texto: 'Sí, la $x$, porque $\sigma_x = 0$'
            mensaje: |
              Que el término de la diagonal sea cero no dice nada. Lo que hace
              principal una dirección son los ceros fuera de la diagonal en su
              fila. La fila de $x$ lleva $\tau_{xy} = 40$: en la cara $x$ hay
              tangencial, y $x$ no es principal.
          - texto: 'No: hay un término fuera de la diagonal, y hay que resolver la cúbica entera'
            mensaje: |
              Hay uno, $\tau_{xy}$, y solo mezcla $x$ con $y$. La cúbica sale,
              pero factorizada: $(100 - \sigma)$ por la ecuación del bloque.
              Buscar primero la fila con ceros te ahorra la cúbica.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cubo elemental con las
          componentes del tensor que no son nulas**, cada una en su cara y en
          su sentido.
        comprueba:
          - punto: |
              **En la cara z, solo la normal: 100 MPa saliendo.**
            porque: |
              La fila de z es $(0, 0, 100)$: en esa cara el vector tensión es
              perpendicular a ella, sin tangencial.
          - punto: |
              **En la cara x, solo la tangencial de 40 hacia y.**
            porque: |
              La fila de x es $(0, 40, 0)$: $\sigma_x$ es nula.
          - punto: |
              **En la cara y, 60 saliendo y 40 hacia x.**
            porque: |
              La fila de y es $(40, 60, 0)$.
        figura: |
          <svg viewBox="0 14 300 244" role="img" width="300" height="244" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El cubo elemental con las componentes del tensor</title>
