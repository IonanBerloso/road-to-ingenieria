      **5. Comprobación.** En el plano girado $\theta_1$, con
      $\cos^{2}\theta_1 = 0{,}8$, $\sin^{2}\theta_1 = 0{,}2$ y
      $\sin\theta_1\cos\theta_1 = 0{,}4$:

      $$
      \sigma = 90 \cdot 0{,}8 + 30 \cdot 0{,}2 + 2 \cdot 40 \cdot 0{,}4 = 110\ \text{MPa}
      \qquad
      \tau = -(90 - 30) \cdot 0{,}4 + 40\,(0{,}8 - 0{,}2) = 0
      $$

      La dirección girada $26{,}57°$ tiene 110 MPa y ninguna tangencial: es la
      1. Y los invariantes del plano: $110 + 10 = 90 + 30$, y
      $110 \cdot 10 = 90 \cdot 30 - 40^{2} = 1100$.

      **Lo que dice el resultado.** La tangencial máxima del punto, 55 MPa,
      no está en ningún plano perpendicular a la chapa, sino en los inclinados
      a 45° entre la dirección 1 y z. Quien mira solo el círculo del plano se
      queda en 50.

  # ── Ejercicio de clase 2.10 · el círculo de Mohr y la dirección a.
  - id: ejerm2-cl2-10-el-circulo-de-mohr-y-la-direccion-a
    titulo: El círculo de Mohr de un elemento, con sus principales, su cortante máxima y un plano dado
    fuente: >-
      Ejercicio 2.10 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio del curso para el círculo (apuntes del tema 2,
      p. 26: con τxy positiva el punto de x va abajo) y la ec. 2.61 para la
      tangencial con signo. Cada cifra sale del motor del curso y está
      comprobada por un segundo camino: las principales como raíces de la
      cúbica de los invariantes del tensor 3×3 con σz = 0, la tangencial nula
      en θ1, σn = C en los planos a θ1 ± 45°, y σn, τn del plano de la a por
      Cauchy. La figura del enunciado está redibujada; la del círculo es
      nuestra.
    nivel: practica
    antes:
      idea: |
        En el círculo de Mohr cada dirección del plano es un punto, y girar la
        faceta $\theta$ en la pieza es girar $2\theta$ en el círculo, en el mismo
        sentido. Las principales son los cortes con el eje; las tangenciales
        máximas, el punto más alto y el más bajo, a 45° de las principales en la
        pieza.
      formula: |
        $$
        C = \frac{\sigma_x + \sigma_y}{2},\qquad R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}
        $$

        Las principales son el centro más y menos el radio; la tangencial máxima
        del plano es el radio, y la normal que la acompaña, el centro. Un plano
        cualquiera es el punto que queda, desde el de $x$, al doble de su ángulo.
      reconocer: |
        Dice «utilizando el círculo de Mohr» y «expresar mediante figuras»:
        además de los números hay que dibujar cada elemento girado, con sus
        flechas. El convenio del curso: un punto va arriba si las tangenciales de
        sus caras forman par horario, y abajo si antihorario.
    enunciado: |
      En el estado plano de tensión de la figura se conocen los siguientes
      datos:

      $\sigma_x$ = 400 MPa, $\sigma_y$ = 200 MPa, $\tau_{xy}$ = 500 MPa.
      Utilizando el círculo de Mohr calcular y expresar mediante figuras los
      estados de tensión:

      a/ En los planos principales.

      b/ En los planos de máxima tensión cortante.

      c/ En el plano perpendicular a la dirección $a$.

