        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="78.3" y1="68" x2="121.7" y2="68" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
