      <figcaption>

      Lo que se sabe y lo que se busca: a la izquierda, el elemento en las direcciones principales, en MPa, girado desde x lo que dice su rótulo; a la derecha, el de los ejes xy, con sus tres incógnitas dibujadas positivas.

      </figcaption>
      </figure>

      - **La dirección 1** está a 60° de $x$, y la 2, perpendicular, a
        $-30°$.
      - **El ángulo** de la ec. 2.61 se cuenta desde la 1: $x$ está a
        $\varphi = -60°$ de ella, e $y$ a $+30°$.

      **2. Incógnitas.** $\sigma_x$, $\sigma_y$ y $\tau_{xy}$; y $\sigma_n$ y
      $\tau_n$ del plano perpendicular a la dirección $a$.

      **3. Ecuaciones.** La ec. 2.61 (p. 23) desde los ejes principales, con
      la tangencial de partida nula:

      $$
      \sigma = \frac{\sigma_1 + \sigma_2}{2} + \frac{\sigma_1 - \sigma_2}{2}\cos 2\varphi
      \qquad
      \tau = -\frac{\sigma_1 - \sigma_2}{2}\operatorname{sen} 2\varphi
      $$

      y desde $xy$ para b/, con la tangencial positiva según $\hat t$, la
      normal girada 90° en sentido antihorario:

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos 2\theta + \tau_{xy}\operatorname{sen} 2\theta
      \qquad
      \tau_n = -\frac{\sigma_x - \sigma_y}{2}\operatorname{sen} 2\theta + \tau_{xy}\cos 2\theta
      $$

      **4. Resultados.** **a/ El estado en x e y.** Con centro
      $\tfrac12(1000 + 200) = 600$ y semidiferencia
      $\tfrac12(1000 - 200) = 400$, en MPa:

      $$
      \sigma_x = 600 + 400\cos(-120°) = 400,\qquad \sigma_y = 600 + 400\cos60° = 800
      $$

      $$
      \tau_{xy} = -400\operatorname{sen}(-120°) = 346{,}41
      $$

      **b/ El plano perpendicular a a.** Su normal es la $a$, a
      $\theta = -45°$ de $x$:

      $$
      \sigma_n = 600 - 200\cos(-90°) + 346{,}41\operatorname{sen}(-90°) = 253{,}59
      $$

      $$
      \tau_n = 200\operatorname{sen}(-90°) + 346{,}41\cos(-90°) = -200
      $$

      en MPa. La tangencial es negativa: va al revés que $\hat t$, que está
      a $+45°$, así que apunta hacia $-135°$. En las caras perpendiculares,
      $\sigma = 1200 - 253{,}59 = 946{,}41$ MPa.

