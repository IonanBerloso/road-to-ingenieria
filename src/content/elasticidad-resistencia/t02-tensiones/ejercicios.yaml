              son: en Oxyz el tensor tiene términos fuera de la diagonal.
        pista: |
          Multiplica cada fila de $[\sigma]$ por $\tfrac{1}{\sqrt3}(1, 1, 1)$:
          es sumar la fila y dividir entre $\sqrt3$.
        desarrollo: |
          $$
          S_x = \frac{33{,}33 + 20 - 6{,}67}{\sqrt3} = 26{,}94,\qquad
          S_y = \frac{20 + 16{,}67 + 26{,}67}{\sqrt3} = 36{,}57,\qquad
