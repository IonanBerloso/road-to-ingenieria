      <figcaption>

      El elemento, con las tensiones en su sentido real, en MPa, y el círculo del plano xy, sin escala: el punto de la cara x va abajo porque su tangencial forma con la de la otra cara x un par antihorario.

      </figcaption>
      </figure>

      - **Las caras x**, a tracción con 400 MPa, y **las y**, con 200.
      - **La tangencial**, de 500 MPa, sube por la cara +x: con el convenio
        del curso (apuntes del tema 2, p. 26), el punto x va abajo y el y,
        arriba. Así, en el círculo se gira en el mismo sentido que en el
        elemento, el doble de ángulo.
      - **La dirección a**, a 60° de x: el plano perpendicular a ella la tiene
        por normal.

      **2. Incógnitas.** Las principales y su dirección; la tangencial máxima,
      sus planos y la normal que la acompaña; y $\sigma_n$ y $\tau_n$ del plano
      de la a.

      **3. Ecuaciones.** El centro y el radio del círculo, el ángulo de la
      principal 1 y, para un plano girado $\theta$, el punto que queda a
      $2\theta$ del de x (ec. 2.61, con la tangencial positiva según
      $\hat t$, la normal girada 90° en sentido antihorario):

      $$
      C = \frac{\sigma_x + \sigma_y}{2}
      \qquad
      R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}
      \qquad
      \tan 2\theta_1 = \frac{2\,\tau_{xy}}{\sigma_x - \sigma_y}
      $$

      $$
      \sigma_n = C + \frac{\sigma_x - \sigma_y}{2}\cos 2\theta + \tau_{xy}\operatorname{sen} 2\theta
      \qquad
      \tau_n = -\frac{\sigma_x - \sigma_y}{2}\operatorname{sen} 2\theta + \tau_{xy}\cos 2\theta
      $$

      **4. Resultados.** $C = 300$ MPa y $R = \sqrt{100^{2} + 500^{2}} = 509{,}90$
      MPa.

      **a/ Los planos principales.** $\sigma_1 = C + R = 809{,}90$ MPa y
      $\sigma_2 = C - R = -209{,}90$ MPa, con $\tan 2\theta_1 = 5$,
      $2\theta_1 = 78{,}69°$ y $\theta_1 = 39{,}35°$. En el círculo se sube
      de x a 1, en sentido antihorario, y en el elemento también.

      **b/ Los planos de tangencial máxima.** Arriba y abajo del círculo, a
      45° de las principales en el elemento: $\theta = 84{,}35°$ y
      $-5{,}65°$. En los dos, $|\tau_n| = R = 509{,}90$ MPa y
      $\sigma_n = C = 300$ MPa de tracción; con la ec. 2.61, en el de
      $-5{,}65°$ la tangencial sale positiva y en el de $84{,}35°$, negativa.
      Como el 0 de z queda entre $\sigma_2$ y $\sigma_1$, es también la
      tangencial máxima del punto: $\tfrac12\,(809{,}90 + 209{,}90) = 509{,}90$
      MPa.

      **c/ El plano de la a.** $\theta = 60°$, $2\theta = 120°$:

      $$
      \sigma_n = 300 + 100\cos120° + 500\operatorname{sen}120° = 300 - 50 + 433{,}01 = 683{,}01\ \text{MPa}
      $$

      $$
      \tau_n = -100\operatorname{sen}120° + 500\cos120° = -86{,}60 - 250 = -336{,}60\ \text{MPa}
      $$

      La tangencial es negativa: va al revés que $\hat t$, hacia $-30°$. En
      las caras perpendiculares, $\sigma = 600 - 683{,}01 = -83{,}01$ MPa.

