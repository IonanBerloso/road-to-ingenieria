      <figcaption>

      Lo que se sabe y lo que se busca. σy y τxy van dibujadas positivas, como incógnitas: el signo de τxy lo dice el círculo. El punto y, en el otro extremo del diámetro de x.

      </figcaption>
      </figure>

      - **El convenio del curso** (apuntes del tema 2, p. 26): un punto va
        arriba si las tangenciales de sus caras forman un par horario, y en
        el círculo se gira el doble de ángulo y en el mismo sentido que en el
        elemento.
      - **$x$ y $x'$** están a la misma altura y a 60° del eje cada uno: el
        centro está en medio.

      **2. Incógnitas.** $\sigma_y$ y $\tau_{xy}$, con el elemento dibujado;
      y las principales con sus direcciones, también dibujadas.

      **3. Ecuaciones.** El centro, la normal de un punto cuyo radio forma
      $2\varphi$ con el eje, su altura y las principales:

      $$
      C = \frac{\sigma_x + \sigma_y}{2}
      \qquad
      \sigma = C + R\cos 2\varphi
      \qquad
      |\tau| = R\,|\operatorname{sen} 2\varphi|
      \qquad
      \sigma_{1,2} = C \pm R
      $$

      **4. Resultados.** **El círculo.**

      $$
      C = \frac{1200 + 600}{2} = 900,\qquad R = \frac{1200 - 900}{\cos60°} = 600
      $$

      en MPa. De $x$ (a 60° por la derecha) a $x'$ (a 60° por la izquierda)
      hay 60° de círculo en sentido antihorario: $x'$ está a $\theta = 30°$
      de $x$ en el elemento.

      **a/ El estado en x e y.** La altura de $x$ es
      $R\operatorname{sen}60° = 519{,}62$ MPa, y está arriba: par horario,
      $\tau_{xy} = -519{,}62$ MPa. $y$ está en el otro extremo del diámetro,
      abajo: $\sigma_y = 2C - \sigma_x = 600$ MPa.

      **b/ Las principales.** $\sigma_1 = C + R = 1500$ MPa y
      $\sigma_2 = C - R = 300$ MPa, con $\sigma_3 = 0$, la de $z$. De $x$ a
      $\sigma_1$ se baja 60° en sentido horario: la dirección 1 está a
      $\theta_1 = -30°$ de $x$, 30° por debajo, y la 2 a $+60°$. Lo confirma
      la ec. 2.62: $\tan2\theta_1 = 2\cdot(-519{,}62)/600 = -1{,}7321$.

      Los dos elementos, como pide el enunciado:

