        <line x1="332.5" y1="109.6" x2="313.3" y2="76.4" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="324.6" y="73.9" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">τ<tspan font-size="7.5" dy="2.5">x′y′</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="247.5" y1="114.4" x2="266.7" y2="147.6" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
