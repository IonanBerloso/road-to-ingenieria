        pista: |
          $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$.
        desarrollo: |
          $$
          |\vec S|^{2} = \sum_i \sigma_i^{2} l_i^{2} = \frac{2500\cdot25 + 900\cdot1 + 400\cdot1}{27} = 2362{,}96
          $$

          $$
          \tau_n = \sqrt{2362{,}96 - 46{,}667^{2}} = 13{,}608\ \text{MPa}
          $$

          Exacto, $\tau_n^{2} = \tfrac{63\,800}{27} - \tfrac{19\,600}{9} = \tfrac{5000}{27}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada $\vec\sigma_i$ es $\sigma_i\,\vec n_i$: $\sigma_1 = 50$,
              $\sigma_2 = 30$ y $\sigma_3 = -20$ MPa, con
              $\vec n_1 = \tfrac13(2, 2, 1)$, $\vec n_2 = \tfrac13(2, -1, -2)$ y
              $\vec n_3 = \tfrac13(1, -2, 2)$, perpendiculares entre sí.
          - texto: >-
              En Oxyz, $[\sigma] = \sum_i \sigma_i\,\vec n_i\,\vec n_i^{\,t}$, y
              su traza, 60 MPa, es la suma de las principales.
          - texto: >-
              $\vec S = [\sigma]\{n\} = \tfrac{1}{3\sqrt3}(140, 190, 90)$, es
              decir, $(26{,}94;\ 36{,}57;\ 17{,}32)$ MPa.
          - texto: >-
              $\sigma_n = \vec S\cdot\vec n = 46{,}67$ MPa y
              $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}} = 13{,}61$ MPa.
          - texto: >-
              Como la normal es $(1, 1, 1)/\sqrt3$, $\sigma_n$ es la media de
              las tres principales: $(50 + 30 - 20)/3 = 20$ MPa.
            trampa: true
            mensaje: |
              Eso sería si $x$, $y$, $z$ fueran las direcciones principales.
              Lo que cuenta son los cosenos con las direcciones principales,
              $l_i = \tfrac{1}{3\sqrt3}(5, -1, 1)$, y con ellos
              $\sigma_n = \sum_i \sigma_i l_i^{2} = 46{,}67$ MPa.
    resolucion: |
      **La idea.** En un plano principal el vector tensión es normal al
      plano, $\vec S = \sigma\,\vec n$ (ec. 2.30): cada vector del enunciado
      da a la vez la tensión principal, que es su módulo con su signo, y la
      dirección. Con eso hay dos caminos. Uno, montar el tensor en Oxyz y
      aplicar Cauchy, $\vec S = [\sigma]\{n\}$ (ecs. 2.13-2.14); el otro,
      trabajar en los ejes principales, donde el tensor es diagonal
      (ec. 2.47).

      **La lectura.** $(2, 2, 1)$, $(2, -1, -2)$ y $(1, -2, 2)$ tienen módulo
      3:

      $$
      \vec\sigma_1 = 50\cdot\tfrac13(2, 2, 1),\qquad
      \vec\sigma_2 = 30\cdot\tfrac13(2, -1, -2),\qquad
      \vec\sigma_3 = -20\cdot\tfrac13(1, -2, 2)
      $$

      Las tres direcciones son perpendiculares dos a dos, como tienen que ser
      ($4 - 2 - 2 = 0$, $2 - 4 + 2 = 0$ y $2 + 2 - 4 = 0$), y
      $\sigma_1 = 50$, $\sigma_2 = 30$ y $\sigma_3 = -20$ MPa.

      **Primer camino: el tensor en Oxyz.** Cada principal aporta
      $\sigma_i\,\vec n_i\,\vec n_i^{\,t}$:

      $$
      [\sigma] = \sum_i \sigma_i\,\vec n_i\,\vec n_i^{\,t}
      = \frac{1}{9}\begin{bmatrix} 300 & 180 & -60\\ 180 & 150 & 240\\ -60 & 240 & 90 \end{bmatrix}\ \text{MPa}
      $$

      con traza $\tfrac{300 + 150 + 90}{9} = 60$, la suma de las principales.
      Con la normal $\tfrac{1}{\sqrt3}(1, 1, 1)$:

      $$
      \vec S = [\sigma]\{n\} = \frac{1}{9\sqrt3}\,(420,\ 570,\ 270) = (26{,}94;\ 36{,}57;\ 17{,}32)\ \text{MPa}
      $$

      $$
      \sigma_n = \vec S\cdot\vec n = \frac{420 + 570 + 270}{27} = 46{,}667\ \text{MPa},\qquad
      |\vec S| = 48{,}610\ \text{MPa},\qquad
      \tau_n = \sqrt{48{,}610^{2} - 46{,}667^{2}} = 13{,}61\ \text{MPa}
      $$

      **Segundo camino: en los ejes principales.** Los cosenos de la normal
      con las direcciones principales son
      $l_i = \vec n\cdot\vec n_i = \tfrac{1}{3\sqrt3}\,(5, -1, 1)$, y con el
      tensor diagonal,

      $$
      \sigma_n = \sum_i \sigma_i l_i^{2} = \frac{50\cdot25 + 30\cdot1 - 20\cdot1}{27} = 46{,}667\ \text{MPa},\qquad
      |\vec S|^{2} = \sum_i \sigma_i^{2} l_i^{2} = \frac{2500\cdot25 + 900 + 400}{27} = 2362{,}96
      $$

      lo mismo que por el primero. Y el vector, devuelto a Oxyz,
      $\vec S = \sum_i \sigma_i l_i\,\vec n_i$, coincide componente a
      componente.

      **El resultado.** En el plano de normal $\tfrac{1}{\sqrt3}(1, 1, 1)$,
      $\vec S = (26{,}94;\ 36{,}57;\ 17{,}32)$ MPa, con
      $\sigma_n = 46{,}67$ MPa de tracción y $\tau_n = 13{,}61$ MPa. El
      vector tensión es casi normal al plano porque la normal está cerca de
      la dirección 1: $l_1 = 0{,}962$.
