      <text x="79.01" y="132" font-size="12" fill="var(--d2-tinta)" text-anchor="middle" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">30 MPa</text>
      <text x="102.14" y="258.9" font-size="12" fill="var(--d1)" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">11 MPa</text>
