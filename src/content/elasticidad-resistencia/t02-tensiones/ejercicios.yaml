      - tipo: calcular
        titulo: La fuerza de volumen
        pregunta: |
          ¿Cuánto vale la fuerza de volumen $(F_x, F_y, F_z)$, en unidades de
          $10^{6}$ N/m³?
        respuesta:
          tipo: vector
          valor: '(9.81, -39.24, -49.05)'
          tolerancia: 0.1
          formato: tres componentes en 10⁶ N/m³, entre paréntesis y separadas por comas, con punto decimal
        distractores:
          - valor: '(-9.81, 39.24, 49.05)'
            mensaje: |
              El signo. Las derivadas y la fuerza de volumen suman cero
              (ec. 2.4), así que la fuerza va al revés que la suma de las
              derivadas: $F_x = -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right)$.
          - valor: '(1, -4, -5)'
            mensaje: |
              Has tomado el kp/mm² por un MPa: falta pasar los kilopondios a
              newtons. Cada kp/mm² son $9{,}81\cdot10^{6}$ N/m², y cada
              (kp/mm²)/m, $9{,}81\cdot10^{6}$ N/m³.
          - valor: '(19.62, -39.24, -58.86)'
            mensaje: |
              Has derivado cada fila entera respecto de una sola coordenada:
              en la de $x$, también $\tau_{xy}$ y $\tau_{xz}$ respecto de $x$.
              En la ecuación según $x$ entran $\tau_{yx}$ derivada respecto
              de $y$ y $\tau_{zx}$ respecto de $z$.
        pista: |
          Las derivadas del campo son constantes; en (kp/mm²)/m,
          $\sigma_{x,x} = 4$, $\tau_{yx,y} = -6$ y $\tau_{zx,z} = 1$, y así en
          $y$ y en $z$.
        desarrollo: |
          En (kp/mm²)/m, con la ec. 2.4:

          $$
          \begin{aligned}
          F_x &= -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right) = -(4 - 6 + 1) = 1\\
          F_y &= -\left(\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z}\right) = -(-6 + 10 + 0) = -4\\
          F_z &= -\left(\tau_{xz,x} + \tau_{yz,y} + \sigma_{z,z}\right) = -(0 + 0 + 5) = -5
          \end{aligned}
          $$

          Cada (kp/mm²)/m son $9{,}81\cdot10^{6}$ N/m³, así que
          $\vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}$ N/m³, la misma
          en todos los puntos, porque el campo es lineal.
      - tipo: calcular
        titulo: La tensión esférica en P
        pregunta: |
          ¿Cuánto vale $\sigma_e$, la tensión de la componente esférica en
          P(0, 1, −1), en kp/mm²?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en kp/mm²
        distractores:
          - valor: '18'
            mensaje: |
              Es la traza, $I_1 = 3 + 20 - 5$, sin dividir entre 3. La
              esférica lleva en la diagonal la media, $\sigma_e = I_1/3$.
          - valor: '2.667'
            mensaje: |
              Has tomado $z = 1$: P es (0, 1, −1). Con $z = -1$,
              $\sigma_y = 10(1 + 1) = 20$ y $\sigma_z = -5$.
        pista: |
          Primero el tensor en P: sustituye $x = 0$, $y = 1$ y $z = -1$ en
          cada componente.
        desarrollo: |
          En P, en kp/mm²: $\sigma_x = 3$, $\sigma_y = 10(1 + 1) = 20$ y
          $\sigma_z = -5$, y las tres tangenciales se anulan:
          $-6(0 + 1 - 1) = 0$, $y + z = 0$ y $3x = 0$. El tensor es diagonal,
          y

          $$
          \sigma_e = \frac{3 + 20 - 5}{3} = 6
          $$
      - tipo: calcular
        titulo: La componente desviadora en P
        pregunta: |
          ¿Cuánto vale la componente desviadora en P, en kp/mm²?
        respuesta:
          tipo: matriz
          valor: '[-3, 0, 0; 0, 14, 0; 0, 0, -11]'
          tolerancia: 0.01
          formato: tres filas de tres números en kp/mm², con punto y coma entre filas
        distractores:
          - valor: '[-15, 0, 0; 0, 2, 0; 0, 0, -23]'
            mensaje: |
              Has restado la traza entera, 18, en lugar de su tercio. A la
              diagonal se le resta $\sigma_e = 6$.
          - valor: '[-3, -6, -6; -6, 14, -6; -6, -6, -11]'
            mensaje: |
              Has restado $\sigma_e$ también fuera de la diagonal. La esférica
              solo tiene diagonal: las tangenciales pasan enteras a la
              desviadora, y aquí son cero.
          - valor: '[6, 0, 0; 0, 6, 0; 0, 0, 6]'
            mensaje: |
              Es la esférica, $\sigma_e[I]$. La desviadora es lo que queda,
              $[\sigma] - \sigma_e[I]$.
        pista: |
          La desviadora es $[\sigma] - \sigma_e[I]$: solo cambia la diagonal.
        desarrollo: |
          En kp/mm², la esférica más la desviadora:

          $$
          \begin{bmatrix} 3 & 0 & 0\\ 0 & 20 & 0\\ 0 & 0 & -5 \end{bmatrix}
          = \begin{bmatrix} 6 & 0 & 0\\ 0 & 6 & 0\\ 0 & 0 & 6 \end{bmatrix}
          + \begin{bmatrix} -3 & 0 & 0\\ 0 & 14 & 0\\ 0 & 0 & -11 \end{bmatrix}
          $$

          La traza de la desviadora es $-3 + 14 - 11 = 0$, como tiene que
          ser. En MPa, la esférica lleva $6\cdot9{,}81 = 58{,}86$ en la
          diagonal.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio interno (ec. 2.4):
              $F_x = -\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z}\right)$, y
              lo mismo según $y$ y según $z$.
          - texto: >-
              Las derivadas del campo son constantes, y $\vec F = (1, -4, -5)$
              en (kp/mm²)/m en todos los puntos.
          - texto: >-
              Con 9,81 N por kilopondio y $10^{6}$ mm² por m²,
              $\vec F = (9{,}81;\ -39{,}24;\ -49{,}05)\cdot10^{6}$ N/m³.
          - texto: >-
              En P(0, 1, −1) el tensor es diagonal, con 3, 20 y −5 kp/mm², y
              $\sigma_e = 6$ kp/mm².
          - texto: >-
              La esférica lleva 6 en la diagonal; la desviadora, −3, 14 y −11,
              y ceros fuera.
          - texto: >-
              La esférica de P es la media de la mayor y la menor principal,
              $\tfrac12(20 - 5) = 7{,}5$ kp/mm².
            trampa: true
            mensaje: |
              Esa media es el centro del círculo grande de Mohr. La esférica
              lleva la media de las tres, $\sigma_e = I_1/3 = 6$ kp/mm²: la
              intermedia también cuenta.
    resolucion: |
      **1. El elemento diferencial.** Es un problema de equilibrio interno de
      un campo de tensiones: el dibujo lleva el elemento de lados dx, dy y dz
      con lo que empuja según x; según y y según z es igual.

