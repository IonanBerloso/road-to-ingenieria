  # ── Ejercicio de clase 2.12 · el tensor y un plano en dos triedros.
  - id: ejerm2-cl2-12-el-tensor-y-un-plano-en-dos-triedros
    titulo: El tensor y el vector tensión de un plano en dos triedros
    fuente: >-
      Ejercicio 2.12 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el giro de ejes (ecs. 2.22 a 2.28 de los apuntes del tema
      2) y Cauchy (ecs. 2.14 y 2.16). Las componentes van en unidades de τ0.
      Cada cifra sale del motor del curso (el giro de la matriz con [R], el
      vector tensión y sus componentes intrínsecas en los dos sistemas) y
      está comprobada por un segundo camino: cada componente como
      proyección, {S}′ = [R]{S} y los tres invariantes. El enunciado da dos
      de los tres unitarios.
    nivel: practica
    antes:
      idea: |
        El vector tensión de un plano es uno solo; lo que cambia de un triedro a
        otro son sus componentes. El tensor y los vectores giran con la misma
        $[R]$, y las componentes intrínsecas, que no dependen de los ejes, tienen
        que salir iguales en los dos.
      formula: |
        $$
        [\sigma]' = [R][\sigma][R]^{t},\qquad \{v\}' = [R]\{v\}
        $$

        (ecs. 2.27 y 2.22), y en cada sistema, Cauchy.
      reconocer: |
        Te dan dos de los tres unitarios nuevos, y el triedro tiene que ser
        directo, como el de partida. Que las componentes intrínsecas salgan
        iguales en los dos sistemas es la comprobación de todo lo anterior.
    enunciado: |
      El estado de tensiones de un punto es conocido en el sistema de
      referencia Oxyz. Considerando otro sistema de referencia Ox’y’z’ y
      siendo conocidos dos vectores unitarios de los ejes, determinar:

      a/ Matriz de tensiones en el sistema de referencia Ox’y’z’.

      b/ El vector tensión en el plano perpendicular a $\vec j'$ en ambos
      sistemas de referencia.

      c/ Las componentes intrínsecas del vector tensión determinado en b/
      calculadas en ambos sistemas de referencia.

      Datos:

      $$
      \vec i' = \tfrac{1}{\sqrt2}\left(\vec i - \vec k\right)\qquad
      \vec j' = \tfrac{1}{\sqrt2}\left(\vec i + \vec k\right)
      $$

      $$
      [\sigma]_{Oxyz} = \begin{bmatrix} 0 & \tau_0 & \tau_0\\ \tau_0 & 0 & \tau_0\\ \tau_0 & \tau_0 & 0 \end{bmatrix}
      $$

      **Notas nuestras.** Las componentes salen en unidades de $\tau_0$.
    pide: >-
      La matriz de tensiones en Ox’y’z’; y el vector tensión del plano
      perpendicular a j′ y sus componentes intrínsecas, cada uno en los dos
      sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da $\vec i'$ y $\vec j'$. ¿Cuál es el tercer eje,
          $\vec k'$?
        opciones:
          - texto: $\vec k' = \vec i'\times\vec j' = -\vec j$
            correcta: true
            mensaje: |
              Eso es. Para que Ox’y’z’ sea un triedro directo, como Oxyz,
              $\vec k' = \vec i'\times\vec j'$, y
              $\tfrac12\left[(1, 0, -1)\times(1, 0, 1)\right] = \tfrac12(0, -2, 0) = (0, -1, 0)$.
          - texto: $\vec k' = \vec j$, el eje que falta
            mensaje: |
              Es perpendicular a los dos, pero con $\vec j$ el triedro queda a
              izquierdas, porque $\vec i'\times\vec j' = -\vec j$. Con
              $+\vec j$, $\tau_{x'z'}$ y $\tau_{y'z'}$ salen con el signo
              cambiado.
          - texto: Da igual, porque el sentido de $\vec k'$ no cambia ninguna componente
            mensaje: |
              Cambia las dos tangenciales con $z'$, $\tau_{x'z'}$ y
              $\tau_{y'z'}$, que llevan un $\vec k'$ cada una. Las demás no
              lo llevan, y $\sigma_{z'}$ lo lleva dos veces.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cubo en Oxyz con el tensor**
          y, aparte, los dos unitarios que da el enunciado.
        comprueba:
          - punto: |
              **Ninguna normal: solo tangenciales, dos en cada cara.**
            porque: |
              La diagonal del tensor es nula, y fuera de ella todo vale
              $\tau_0$.
          - punto: |
              **Todas en sentido positivo, con el mismo valor $\tau_0$.**
            porque: |
              Las tres son positivas: en las caras positivas van hacia los
              ejes positivos. Las de dos caras perpendiculares son iguales por
              la reciprocidad.
          - punto: |
              **Aparte, $\vec i'$ y $\vec j'$ en el plano $xz$, a 45° de los
              dos ejes.**
            porque: |
              Ninguno tiene componente $y$. $\vec j'$ es la normal del plano
              de b/.
        figura: |
