      <line x1="104" y1="178" x2="197" y2="16.92" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="104" y1="178" x2="249.49" y2="262" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="104" y1="178" x2="258.86" y2="332.86" stroke="var(--ink)" stroke-width="1.2"/><polygon points="263.81,337.81 255.67,334.62 260.62,329.67" fill="var(--ink)"/>
      <polygon points="125.53,147.71 140.53,121.73 143.56,123.48 142.5,111.32 131.44,116.48 134.47,118.23 119.47,144.21" fill="var(--paper)" stroke="var(--d2)" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="82.47,208.29 67.47,234.27 64.44,232.52 65.5,244.68 76.56,239.52 73.53,237.77 88.53,211.79" fill="var(--paper)" stroke="var(--d2)" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="134.29,199.53 160.27,214.53 158.52,217.56 170.68,216.5 165.52,205.44 163.77,208.47 137.79,193.47" fill="var(--paper)" stroke="var(--d1)" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="73.71,156.47 47.73,141.47 49.48,138.44 37.32,139.5 42.48,150.56 44.23,147.53 70.21,162.53" fill="var(--paper)" stroke="var(--d1)" stroke-width="1.2" stroke-linejoin="round"/>
