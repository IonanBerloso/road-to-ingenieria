      y $\sigma_y = 20 - 29{,}53 = -9{,}53$.

      **Cómo son.** $\sigma_x = 29{,}53$ MPa es de tracción y
      $\sigma_y = -9{,}53$ MPa, de compresión. $\tau_{xy} = -11{,}82$ MPa es
      negativa: baja por la cara derecha, sube por la izquierda, va hacia la
      izquierda en la de arriba y hacia la derecha en la de abajo, un par
