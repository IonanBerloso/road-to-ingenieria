      <line x1="96" y1="196" x2="29.23" y2="52.8" stroke="var(--d1)" stroke-width="1.5"/><polygon points="26.27,46.46 32.82,52.23 26.48,55.19" fill="var(--d1)"/>
      <path d="M216 196 A120 120 0 0 0 204.76 145.29" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="204.76,145.29 209.86,150.08 205.15,152.28" fill="var(--ink)"/><polygon points="216,196 213.4,189.5 218.6,189.5" fill="var(--ink)"/>
      <text x="282" y="214" font-size="13" fill="var(--ink)" font-style="italic" text-anchor="end" paint-order="stroke" stroke="var(--paper)" stroke-width="3" stroke-linejoin="round">x</text>
