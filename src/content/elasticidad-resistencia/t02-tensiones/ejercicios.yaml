      La tangencial máxima es $\tau_{max} = 46$ MPa, no los 20 MPa del bloque
      $yz$, y actúa con $\sigma_n = 24$ MPa.

      **Comprobaciones.** El motor del curso da las mismas principales, la
      misma tangencial máxima y los mismos tres círculos. Por otro camino,
      el plano de normal $\tfrac{1}{\sqrt2}(1, 0, 1)$ en ejes principales,
      a 45° de las direcciones 1 y 3, tiene por Cauchy
      $\sigma_n = \tfrac12(70 - 22) = 24$ MPa y $\tau_n = 46$ MPa.
