      **Notas nuestras.** Aquí se llama $x'$ a la normal de las caras que
      corta la recta de 60° e $y'$ a la de las que corta la de $-30°$,
      tomada hacia 150°: $y'$ es $x'$ girado 90° en sentido antihorario.
    pide: >-
      σx, σy y τxy, y cómo son: de tracción o de compresión, y en qué
      sentido va la tangencial.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los ejes $x'$, a 60° de $x$, e $y'$, a 150°, ¿qué dicen las
          flechas de la figura?
        opciones:
          - texto: $\sigma_{x'} = -10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = -11$ MPa
            correcta: true
            mensaje: |
              Eso es. En las caras $x'$ la flecha entra: compresión. En las
              $y'$ sale: tracción. Y en la cara $x'$ de arriba, que es
              positiva, la tangencial apunta hacia $-30°$, al revés que $y'$:
              $\tau_{x'y'} < 0$. Las otras tres caras lo confirman, como pide
              la reciprocidad.
          - texto: $\sigma_{x'} = 10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = 11$ MPa, los valores del enunciado
            mensaje: |
              El texto da los valores sin signo; el signo lo ponen las
              flechas. Una flecha que entra en su cara es una compresión, y
              la tangencial de la cara $x'$ va al revés que $y'$.
          - texto: $\sigma_{x'} = -10$, $\sigma_{y'} = 30$ y $\tau_{x'y'} = 11$ MPa
            mensaje: |
              Las normales están bien; la tangencial, no. En la cara $x'$ de
              arriba, que es positiva, la flecha apunta hacia $-30°$, al
              revés que $y'$ (150°): $\tau_{x'y'}$ es negativa.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el elemento girado con sus datos
          y el círculo con los puntos de sus caras**, $x'$ e $y'$.
        comprueba:
          - punto: |
              **El elemento girado 60°, con 10 MPa entrando en las caras $x'$,
              30 saliendo de las $y'$ y 11 de tangencial, cada flecha en el
              sentido de la figura.**
            porque: |
              Son los datos: en números, $\sigma_{x'} = -10$,
              $\sigma_{y'} = 30$ y $\tau_{x'y'} = -11$ MPa.
          - punto: |
              **En el círculo, $x'$ arriba, en $(-10, 11)$, e $y'$ abajo, en
              $(30, -11)$.**
            porque: |
              Las tangenciales de las caras $x'$ forman un par horario: con el
              convenio del curso, ese punto va arriba.
          - punto: |
              **Los dos en los extremos de un diámetro, y el círculo cortando
              el eje σ a los dos lados del origen.**
            porque: |
              Las caras $x'$ e $y'$ forman 90° en el elemento: 180° en el
              círculo. Y el radio, que se ve mayor que la distancia del centro
              al origen, lleva el círculo a la parte negativa.
