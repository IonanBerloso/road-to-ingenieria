      - tipo: calcular
        titulo: La normal en x
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '29.53'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '10.47'
            mensaje: |
              Has girado al revés, porque $x$ está a $-60°$ de $x'$ y no a
              $+60°$; o has tomado $\tau_{x'y'} = +11$. Los dos errores dan
              este número.
          - valor: '15.47'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto. El de 10 MPa es una compresión, porque la flecha entra, y
              la tangencial de la cara $x'$ es negativa.
          - valor: '9.53'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$ en la ec. 2.61: en el
              círculo, de $x'$ a $x$ se giran 120°, no 60°.
          - valor: '-9.53'
            mensaje: |
              Es $\sigma_y$. $x$ es la dirección a $-60°$ de $x'$; la de
              $+30°$ es la $y$.
        pista: |
          En el círculo, $x'$ va en $(-10, 11)$, arriba, e $y'$ en
          $(30, -11)$. $x$ está a $-60°$ de $x'$: en el círculo, 120° en
          sentido horario.
        desarrollo: |
          En MPa:

          $$
          C = \frac{-10 + 30}{2} = 10,\qquad R = \sqrt{20^{2} + 11^{2}} = \sqrt{521} = 22{,}83
          $$

          Con la ec. 2.61 desde $x'y'$ y $\theta = -60°$:

          $$
          \sigma_x = 10 + (-20)\cos(-120°) + (-11)\operatorname{sen}(-120°) = 10 + 10 + 9{,}53 = 29{,}53
          $$
      - tipo: calcular
        titulo: La normal en y
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-9.53'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '9.53'
            mensaje: |
              Has girado al revés, o has tomado $\tau_{x'y'} = +11$: los dos
              errores dan este número, el de $\sigma_y$ con el signo
              cambiado.
          - valor: '24.53'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto.
          - valor: '29.53'
            mensaje: |
              Es $\sigma_x$. $y$ está a $+30°$ de $x'$.
        pista: |
          $\sigma_x + \sigma_y = \sigma_{x'} + \sigma_{y'}$: la traza no
          cambia con el giro.
        desarrollo: |
          En MPa:

          $$
          \sigma_y = 20 - 29{,}53 = -9{,}53
          $$

          Con la ec. 2.61 a $\theta = 30°$ desde $x'$ sale lo mismo.
      - tipo: calcular
        titulo: La tangencial en x
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-11.82'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '11.82'
            mensaje: |
              El valor es ese y el signo no. En el círculo $x$ queda arriba:
              par horario, $\tau_{xy} < 0$.
          - valor: '22.82'
            mensaje: |
              Has girado al revés, $+60°$ en lugar de $-60°$.
          - valor: '-22.82'
            mensaje: |
              Has tomado $\tau_{x'y'} = +11$. La tangencial de la cara $x'$
              apunta hacia $-30°$, al revés que $y'$.
          - valor: '-14.16'
            mensaje: |
              Has tomado los tres valores positivos, como los escribe el
              texto.
        pista: |
          $\tau_{xy} = \tfrac12(\sigma_{y'} - \sigma_{x'})\operatorname{sen}2\theta + \tau_{x'y'}\cos2\theta$,
          con $\theta = -60°$.
        desarrollo: |
          En MPa:

          $$
          \tau_{xy} = 20\operatorname{sen}(-120°) + (-11)\cos(-120°) = -17{,}32 + 5{,}5 = -11{,}82
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En $x'$ (60°) e $y'$ (150°): $\sigma_{x'} = -10$,
              $\sigma_{y'} = 30$ y $\tau_{x'y'} = -11$ MPa.
          - texto: >-
              El círculo tiene centro 10 y radio $\sqrt{521} = 22{,}83$ MPa;
              $x'$ está arriba, en $(-10, 11)$.
          - texto: >-
              $x$ está a $-60°$ de $x'$: en el círculo se giran 120° en
              sentido horario desde $x'$.
          - texto: >-
              $\sigma_x = 29{,}53$ MPa, de tracción; $\sigma_y = -9{,}53$ MPa,
              de compresión; y $\tau_{xy} = -11{,}82$ MPa.
          - texto: >-
              Las dos normales de la figura son de tracción, porque el texto
              las da positivas, y $\tau_{x'y'} = +11$ MPa.
            trampa: true
            mensaje: |
