      Con la ec. 2.61 y $\theta = -60°$, en MPa:

      $$
      \sigma_x = 10 + (-20)\cos(-120°) + (-11)\operatorname{sen}(-120°) = 10 + 10 + 9{,}53 = 29{,}53
