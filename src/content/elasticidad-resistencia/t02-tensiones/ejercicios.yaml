        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="303.4" y1="123.5" x2="331.5" y2="151.6" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <text x="20" y="30" font-size="11" font-weight="700" fill="var(--ink)">a)</text>
        <text x="252.2" y="30" font-size="11" font-weight="700" fill="var(--ink)">b) −45°</text>
      </svg>
      <figcaption>

      Con las tensiones en su sentido real, en MPa: a) el estado en x e y; b) el elemento con las caras perpendiculares a la dirección a, girado desde x lo que dice su rótulo.

      </figcaption>
      </figure>

      **5. Comprobación.** **a/** $\sigma_x + \sigma_y = 1200 = \sigma_1 + \sigma_2$
      y $\sigma_x\sigma_y - \tau_{xy}^{2} = 320\,000 - 120\,000 = 200\,000$
      MPa², igual que $\sigma_1\sigma_2$. Y por la ec. 2.62 se vuelve a la 1:
      $\tan2\theta_1 = 2\cdot346{,}41/(400 - 800) = -1{,}7321$, con
      $2\theta_1 = 120°$ y $\theta_1 = 60°$.

      **b/** Por Cauchy, con $[\sigma]$ montado desde las principales,
      $[\sigma] = \sigma_1\{n_1\}\{n_1\}^{t} + \sigma_2\{n_2\}\{n_2\}^{t}$,
      y $\vec n = (\cos45°, -\operatorname{sen}45°)$: el vector tensión es
      $\vec S = (37{,}89;\ -320{,}74)$ MPa, de módulo 322,97 MPa; su
      proyección sobre $\vec n$ da 253,59 MPa y sobre $\hat t$, $-200$ MPa.
      Y desde las principales, con $a$ a $-105°$ de la 1:
      $1000\cos^{2}105° + 200\operatorname{sen}^{2}105° = 253{,}59$ MPa.

      **Lo que dice el resultado.** La $a$ está a solo 15° de la dirección 2,
      y $\sigma_n$, 253,59 MPa, queda cerca de $\sigma_2 = 200$. La
      tangencial, en cambio, ya es la mitad de la máxima del plano, 400 MPa:
      crece con el seno del ángulo doble, y a 15° ese ángulo es de 30°.

  # ── Ejercicio de clase 2.9 · del elemento girado a los ejes xy.
  - id: ejerm2-cl2-9-del-elemento-girado-a-los-ejes-xy
    titulo: Del elemento girado 60° a σx, σy y τxy, con el círculo de Mohr
    fuente: >-
      Ejercicio 2.9 · Tema 2, «Tensiones» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con el convenio de signos del curso, el del círculo (apuntes
      del tema 2, p. 26) y la ec. 2.61. Cada cifra sale del motor del curso
      (la ec. 2.61 girando desde los ejes del elemento hasta x e y, y el
      círculo) y está comprobada por un segundo camino: el giro de la matriz
      con [R], los invariantes del plano y el giro de vuelta, que devuelve
      los datos. Se conserva «11MPa», sin espacio, como en el original. La
      figura del enunciado está redibujada, con las flechas en los sentidos
      del original ampliado; el círculo de la resolución es nuestro.
    nivel: practica
    antes:
      idea: |
        El elemento girado da dos puntos del círculo de Mohr, los de $x'$ y de
        $y'$, que son los extremos de un diámetro. Con ellos se dibuja el círculo,
        y $x$ se encuentra girando desde $x'$ el doble del ángulo de la figura, en
        el mismo sentido.
      formula: |
        Las de siempre del círculo, con los ejes de la figura: el centro es la
        media de las dos normales, y el radio, la distancia del centro a
        cualquiera de los dos puntos. Un giro de $\theta$ en la pieza es uno de
        $2\theta$ en el círculo. Y la suma de las dos normales no cambia al girar
        los ejes: es el primer invariante.
      reconocer: |
        La figura trae las tensiones como flechas, sin signo: lo primero es
        pasarlas a números con el convenio. Positiva es la componente que va en
        sentido positivo en cara positiva, o en negativo en cara negativa.
    enunciado: |
      En el estado de tensión plana de la figura, las tensiones normales son
      10 y 30 MPa y la tensión cortante 11MPa. Calcular $\sigma_x$,
      $\sigma_y$ y $\tau_{xy}$ utilizando el círculo de Mohr e indicar cómo
      son.

