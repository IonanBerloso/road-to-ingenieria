    pide: >-
      El vector tensión {S} del plano, en MPa, y sus componentes intrínsecas
      σn y τn, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué vector $\{n\}$ va en $\{S\} = [\sigma]\{n\}$?
        opciones:
          - texto: $\tfrac13(1, 2, 2)$, la dirección dividida por su módulo
            correcta: true
            mensaje: |
              Eso es. $|(1, 2, 2)| = \sqrt{1 + 4 + 4} = 3$. La ecuación de
              Cauchy (apuntes, ec. 2.14, p. 11) sale de dividir el equilibrio
              del tetraedro por el área de $ABC$, y las áreas de las otras
              tres caras son esa área por $n_x$, $n_y$ y $n_z$ (ec. 2.11,
              p. 10): por eso $\{n\}$ tiene que ser unitario.
          - texto: $(1, 2, 2)$, tal como viene
            mensaje: |
              No es unitario: su módulo es 3. Con él, $\{S\}$ sale tres veces
              mayor y $\sigma_n$, nueve veces.
          - texto: '$\tfrac{1}{\sqrt6}(2, 1, 1)$, las aristas $OA$, $OB$ y $OC$ del tetraedro'
            mensaje: |
              Esas son las distancias a las que el plano corta los ejes, no su
              normal. Un plano que corta los ejes en $a$, $b$ y $c$ tiene la
              normal proporcional a $(1/a, 1/b, 1/c)$: con 2, 1 y 1,
              $(1/2, 1, 1)$, que es $(1, 2, 2)$ a otra escala. Con
              $(2, 1, 1)/\sqrt6$, $\sigma_n$ saldría 45 MPa.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cubo elemental con las seis
          componentes del tensor**, cada una en su cara y en su sentido.
        comprueba:
          - punto: |
              **En la cara x, 20 MPa entrando, 40 hacia y y 30 hacia z.**
            porque: |
              La primera fila del tensor, $(-20, 40, 30)$, es el vector tensión
              de la cara x. El $-20$ es compresión: la flecha entra en la cara.
          - punto: |
              **En la cara y, 10 MPa entrando, 40 hacia x y 20 hacia z.**
            porque: |
              Es la segunda fila, $(40, -10, 20)$. El 40 hacia y de la cara x y
              el 40 hacia x de la cara y son el mismo número: el tensor es
              simétrico.
          - punto: |
              **En la cara z, 40 MPa saliendo, 30 hacia x y 20 hacia y.**
            porque: |
              Es la tercera fila, $(30, 20, 40)$.
          - punto: |
              **En las tres caras escondidas, lo mismo con el sentido contrario.**
            porque: |
              Su normal es la opuesta, y su vector tensión también: así el cubo
              queda en equilibrio.
