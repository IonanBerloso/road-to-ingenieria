ejercicios:
  # ── Ejemplo introductorio nuestro · la viga sujeta por una barra, con carga triangular.
  - id: ejerm1-la-viga-sujeta-por-una-barra
    titulo: La viga sujeta por una barra inclinada
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una viga horizontal AB de 4 m está articulada a una pared en A. Su
      extremo B está sujeto por una barra BC que llega a la pared en C, 3 m
      por encima de A; la barra está articulada en B y en C. La viga lleva una
      carga repartida hacia abajo que crece en línea recta desde cero en A
      hasta $q_0 = 6\ \text{kN/m}$ en B. El peso de la viga y el de la barra
      son despreciables frente a la carga.

      a) ¿A qué distancia de A pasa la resultante de la carga?

      b) ¿Qué fuerza hace la barra BC sobre la viga?

      c) ¿Y la pared, en A?

