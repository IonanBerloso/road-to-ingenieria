    pide: >-
      La distancia de A a la resultante de la carga, en m, y las fuerzas que
      hacen sobre la viga la barra BC y la articulación A, en kN.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular, ¿qué fuerza hace la barra BC sobre la viga?
        opciones:
          - texto: Una fuerza dirigida según BC, de la que solo se desconoce el valor
            correcta: true
            mensaje: |
              Eso es. BC es una barra de dos fuerzas: la que le hace la viga en
              B y la que le hace la pared en C tienen que ser opuestas y estar
              sobre la recta BC. Sobre la viga hace una fuerza $F$ de dirección
              conocida, la de BC, y la viga queda con tres incógnitas, $A_x$,
              $A_y$ y $F$, para tres ecuaciones.
          - texto: Una fuerza vertical hacia arriba, porque es la que sostiene la carga
            mensaje: |
              La barra está inclinada, y una barra articulada en sus dos
              extremos y sin carga entre ellos solo puede tirar o empujar a lo
              largo de sí misma: con dos fuerzas verticales, una en B y otra en
              C, la barra no estaría en equilibrio, porque formarían un par. La
              fuerza de BC tiene una componente vertical, pero también una
              horizontal.
          - texto: Dos componentes desconocidas en B, $B_x$ y $B_y$, como en cualquier articulación
            mensaje: |
              Eso sería si la barra llevara carga entre B y C. Sin ella,
              $B_y/B_x$ es la pendiente de la barra, 3/4, y la incógnita es una
              sola. Con dos, la viga tendría cuatro incógnitas para tres
              ecuaciones y parecería hiperestática, y no lo es.
          - texto: Una fuerza perpendicular a la viga y un momento en B
            mensaje: |
              En B hay una articulación, que no transmite momento. Y la fuerza
              no es perpendicular a la viga: va según la barra, que está
              inclinada.

      - tipo: calcular
        titulo: Dónde está la resultante de la carga
        pregunta: |
          ¿A qué distancia de A pasa la resultante de la carga triangular, en m?
        respuesta:
          tipo: numero
          valor: '2.667'
          tolerancia: 0.005
          formato: un número, en m
        distractores:
          - valor: '2'
            mensaje: |
              Es el centro de la viga, donde estaría la resultante de una carga
              uniforme. La triangular carga más cerca de B, y su resultante pasa
              por el centro de gravedad del triángulo.
          - valor: '1.333'
            mensaje: |
              Es $L/3$ medido desde A, el lado del cero. El centro de gravedad
              del triángulo está a un tercio de su lado **alto**, que es B: a
              4/3 m de B, que son 8/3 m de A.
        pista: |
          La resultante de una carga repartida pasa por el centro de gravedad
          del diagrama de carga. El de un triángulo está a un tercio de la base
          desde el lado alto.
        desarrollo: |
          La resultante vale el área del triángulo,
          $R = \tfrac12 \cdot 6 \cdot 4 = 12$ kN, y pasa por su centro de
          gravedad, a un tercio de B y dos tercios de A:

          $$
          \overline{x} = \frac{2}{3} \cdot 4 = 2{,}667\ \text{m}
          $$

      - tipo: calcular
        titulo: La fuerza de la barra
        pregunta: |
          ¿Cuánto vale la fuerza de la barra BC, en kN? Positiva si la barra
          tira de la viga (tracción) y negativa si la empuja (compresión).
        respuesta:
          tipo: numero
          valor: '13.33'
          tolerancia: 0.01
          formato: un número, en kN, con signo
        distractores:
          - valor: '10'
            mensaje: |
              Sale con la resultante en el centro de la viga, $12 \cdot 2$, o
              con el brazo de $F$ mal tomado, $4 \cdot 0{,}8 = 3{,}2$ m. La
              resultante está a 8/3 m de A. Y respecto de A la componente
              horizontal de $F$ pasa por A, y la vertical, $0{,}6\,F$, tiene
              4 m de brazo.
          - valor: '6.667'
            mensaje: |
              Has puesto la resultante a $L/3$ de A. Está a $L/3$ de B, el lado
              alto del triángulo: a 8/3 m de A.
          - valor: '8'
            mensaje: |
              Es la componente vertical de la fuerza, $0{,}6\,F$: sale de tomar
              momentos como si la barra tirara en vertical. La barra tira según
              BC, y su fuerza es esa componente entre 0,6.
          - valor: '26.67'
            mensaje: |
              Has tomado como resultante $q_0 L = 24$ kN, la de un rectángulo.
              El triángulo es la mitad: 12 kN.
          - valor: '-13.33'
            mensaje: |
              El valor es ese, pero la barra no empuja: tira. La carga hace
              bajar B, y la barra, colgada de C, lo sujeta tirando de él hacia
              C. Está a tracción.
        pista: |
          Momentos respecto de A: $A_x$ y $A_y$ pasan por A y no dan momento.
          BC mide 5 m, así que las componentes de $F$ son $0{,}8\,F$ en
          horizontal y $0{,}6\,F$ en vertical.
        desarrollo: |
          BC une B con C, 4 m en horizontal y 3 m en vertical: mide 5 m. La
          componente horizontal de $F$, $0{,}8\,F$, pasa por A; la vertical,
          $0{,}6\,F$, tiene 4 m de brazo. La carga, 12 kN a 8/3 m de A:

          $$
          0{,}6\,F \cdot 4 = 12 \cdot \frac{8}{3} = 32 \qquad F = \frac{32}{2{,}4} = 13{,}33\ \text{kN}
          $$

          Positiva: la barra está a tracción.

      - tipo: calcular
        titulo: La componente horizontal de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_x$, en kN? Positiva hacia la derecha, alejándose de
          la pared.
        respuesta:
          tipo: numero
          valor: '10.67'
          tolerancia: 0.01
          formato: un número, en kN, con signo
        distractores:
          - valor: '8'
            mensaje: |
              Es $0{,}6\,F$: has usado el seno para la componente horizontal.
              La barra avanza 4 m en horizontal por cada 5 de largo: su
              componente horizontal es $0{,}8\,F$. También sale 8 con la
              $F = 10$ de poner la resultante en el centro.
          - valor: '-10.67'
            mensaje: |
              El valor es ese, pero no el sentido. La barra tira de B hacia la
              pared; para que la viga no se mueva, la pared la empuja en A
              hacia fuera, hacia la derecha.
          - valor: '0'
            mensaje: |
              La carga es vertical, pero la fuerza de la barra no lo es: su
              componente horizontal, $0{,}8\,F$, tira de la viga hacia la
              pared, y A tiene que equilibrarla.
          - valor: '21.33'
            mensaje: |
              Sale de la $F = 26{,}67$ de tomar la resultante como $q_0 L$. El
              triángulo vale la mitad, 12 kN.
          - valor: '5.333'
            mensaje: |
              Sale de la $F = 6{,}667$ de poner la resultante a $L/3$ de A.
              Está a $L/3$ de B.
        pista: |
          Fuerzas horizontales: solo $A_x$ y la componente horizontal de $F$.
        desarrollo: |
          $$
          A_x = 0{,}8\,F = 0{,}8 \cdot 13{,}33 = 10{,}67\ \text{kN}
          $$

          Positiva: hacia la derecha. La pared empuja la viga, que la barra
          arrastra hacia ella.

      - tipo: calcular
        titulo: La componente vertical de la reacción en A
        pregunta: |
          ¿Cuánto vale $A_y$, en kN? Positiva hacia arriba.
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número, en kN, con signo
        distractores:
          - valor: '1.333'
            mensaje: |
              Has usado $0{,}8\,F$ como componente vertical. La barra sube 3 m
              por cada 5 de largo: su componente vertical es $0{,}6\,F = 8$ kN.
          - valor: '6'
            mensaje: |
              Es la mitad de la carga, como si la viga se apoyara igual en sus
              dos extremos; también sale con la $F = 10$ de poner la resultante
              en el centro. La carga triangular pesa más del lado de B, y la
              barra se lleva 8 de los 12 kN.
          - valor: '12'
            mensaje: |
              Es toda la carga. Falta la componente vertical de la barra, que
              sostiene 8 kN de los 12.
          - valor: '8'
            mensaje: |
              Es la componente vertical de la barra, $0{,}6\,F$, no la de A. A
              lleva el resto, $12 - 8$. También sale 8 con la $F = 6{,}667$ de
              poner la resultante a $L/3$ de A. Y sale 8 con la carga entera,
              $q_0L = 24$ kN, en vez de la del triángulo:
              $24 - 0{,}6 \cdot 26{,}67 = 8$. El triángulo es la mitad, 12 kN.
          - valor: '-4'
            mensaje: |
              El valor es ese, pero el sentido es hacia arriba: la carga va
              hacia abajo, y A y la barra la sostienen entre las dos.
        pista: |
          Fuerzas verticales: $A_y$, la componente vertical de $F$ y la
          resultante de la carga.
        desarrollo: |
          $$
          A_y = 12 - 0{,}6\,F = 12 - 8 = 4\ \text{kN}
          $$

          Positiva: hacia arriba. La barra sostiene 8 de los 12 kN, y A, el
          resto.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La barra BC está articulada en B y en C y no lleva carga: hace sobre la viga una sola fuerza $F$, según BC.'
          - texto: 'La carga triangular equivale a su resultante, $R = 12$ kN, a 8/3 m de A.'
          - texto: 'Momentos respecto de A: $0{,}6\,F \cdot 4 = 12 \cdot 8/3$, y $F = 13{,}33$ kN, a tracción.'
          - texto: 'Fuerzas horizontales: $A_x = 0{,}8\,F = 10{,}67$ kN, hacia fuera de la pared.'
          - texto: 'Fuerzas verticales: $A_y = 12 - 0{,}6\,F = 4$ kN, hacia arriba.'
          - texto: 'En B hay dos incógnitas, $B_x$ y $B_y$; con $A_x$ y $A_y$ son cuatro para tres ecuaciones, así que la viga es hiperestática y hace falta su deformación.'
            trampa: true
            mensaje: |
              BC es una barra de dos fuerzas: $B_y/B_x$ es la pendiente de la
              barra y hay una sola incógnita, $F$. Con tres incógnitas para
              tres ecuaciones, la viga es isostática.
    resolucion: |
      **Antes de calcular.** La barra BC está articulada en sus dos extremos y
      no lleva carga entre ellos: es una barra de dos fuerzas (apuntes de
      estática, p. 8 a 10). Hace sobre la viga una sola fuerza $F$, a lo
      largo de BC, y la viga tiene tres incógnitas, $A_x$, $A_y$ y $F$, para
      las tres ecuaciones del plano: es isostática.

      **La carga.** La resultante del triángulo es su área,
      $R = \tfrac12 \cdot 6 \cdot 4 = 12$ kN, y pasa por su centro de
      gravedad, a un tercio de B, el lado alto, que son 8/3 = 2,667 m de A
      (ec. 12 a 15, p. 4 y 5).

      **La barra.** BC va de B a C, 4 m en horizontal y 3 m en vertical: mide
      5 m, y sus componentes son $0{,}8\,F$ en horizontal y $0{,}6\,F$ en
      vertical. Momentos respecto de A, por donde pasan $A_x$, $A_y$ y la
      componente horizontal de $F$:

      $$
      0{,}6\,F \cdot 4 - 12 \cdot \frac{8}{3} = 0 \qquad F = 13{,}33\ \text{kN}
      $$

      Sale positiva con $F$ tirando de B hacia C: la barra está a tracción.

      **La reacción en A.**

      $$
      A_x = 0{,}8\,F = 10{,}67\ \text{kN} \qquad A_y = 12 - 0{,}6\,F = 4\ \text{kN}
      $$

      $A_x$ va hacia la derecha: la pared empuja la viga, que la barra
      arrastra hacia ella. $A_y$ va hacia arriba: la barra sostiene 8 de los
      12 kN, y A, el resto.

      **Comprobación por otro camino.** Tres ecuaciones de momentos respecto
      de tres puntos no alineados también valen (ec. 10, p. 3). Respecto de
      C, $F$ pasa por C y no da momento, y $A_y$ tampoco, porque C está en la
      vertical de A; queda $A_x$, con 3 m de brazo:

      $$
      3\,A_x = 12 \cdot \frac{8}{3} = 32 \qquad A_x = 10{,}67\ \text{kN}
      $$

      Respecto de B, $F$ pasa por B, y $A_x$ también, porque B está en la
      horizontal de A:

      $$
      4\,A_y = 12 \cdot \frac{4}{3} = 16 \qquad A_y = 4\ \text{kN}
      $$

      Los mismos valores, sin pasar por $F$.
