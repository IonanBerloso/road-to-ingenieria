      <figcaption>

      El eje del ejemplo: AB, macizo, de 60 mm de diámetro; BC, macizo, de 30 mm. Los dos, del mismo acero, con <i>G</i> = 80 GPa.

      </figcaption>
      </figure>
    pide: >-
      El torsor del tramo AB, en N·m, con su signo; la tensión cortante
      máxima del eje, en MPa, y el giro de la sección B, en grados, con su
      signo.
    pasos:
      - tipo: reconocer
        pregunta: |
          En A y en C, las paredes hacen sobre el eje dos pares desconocidos,
          $M_A$ y $M_C$. ¿Bastan las ecuaciones de la estática para
          sacarlos?
        opciones:
          - texto: 'No: el equilibrio da una sola ecuación, $M_A + M_0 + M_C = 0$, y la que falta es que C no gire respecto de A'
            correcta: true
            mensaje: |
              Eso es. Con pares a lo largo del eje, la estática solo da la
              suma de sus componentes según $x$, y hay dos incógnitas: el eje
              es hiperestático de grado 1. La ecuación que falta es lo que
              hacen las paredes, que no dejan girar: la suma de los ángulos
              de torsión de AB y de BC es cero (ec. 12.13 tramo a tramo). Es
              la barra entre dos paredes del tema 8, con el torsor en lugar
              del axil.
          - texto: 'Sí: con el equilibrio de momentos respecto de A y respecto de C salen los dos'
            mensaje: |
              Un par tiene el mismo momento respecto de cualquier punto, así
              que tomar momentos en A o en C da la misma ecuación,
              $M_A + M_0 + M_C = 0$. No hay una segunda independiente: con
              dos incógnitas, la estática no basta.
          - texto: 'Sí: el par se lo lleva entero la pared más cercana, C, y A no trabaja'
            mensaje: |
              Las dos paredes retienen, y cada una en proporción a la
              rigidez $GI_p/L$ de su tramo, no a la distancia. Aquí, además,
              la pared lejana se lleva la mayor parte: AB es tres veces más
              largo, pero su diámetro es el doble, y su $I_p$, 16 veces
              mayor. Para saber cuánto, hace falta una ecuación de
              deformación.
          - texto: 'No: falta que los dos tramos giren lo mismo, el mismo ángulo de torsión en AB que en BC'
            mensaje: |
              Lo que tienen en común los dos tramos es el giro de B, pero sus
              ángulos de torsión son $\varphi_B - \varphi_A = \varphi_B$ y
              $\varphi_C - \varphi_B = -\varphi_B$: iguales y de signo
              contrario, porque suman cero. Esa suma nula, el giro de C
              respecto de A, es la condición. Pedirlos iguales da un torsor
              que no cumple lo que hacen las paredes.

      - tipo: calcular
        titulo: El torsor del tramo AB
        pregunta: |
          ¿Cuánto vale el torsor del tramo AB, en N·m, con su signo?
        respuesta:
          tipo: numero
          valor: '1684.2105'
          tolerancia: 1
          formato: un número con su signo, en N·m
        distractores:
          - valor: '500'
            mensaje: |
              Es el reparto de una barra de sección constante: cada pared
              retiene en proporción a la longitud del tramo del otro lado.
              AB es tres veces más largo y se llevaría la cuarta parte. Pero
              aquí la sección cambia: el $I_p$ de AB es 16 veces el de BC, y
              su rigidez $GI_p/L$, $16/3$ veces. AB retiene $16/19$ del par.
          - valor: '1500'
            mensaje: |
              Es el reparto al revés: cada pared retiene en proporción a la
              longitud de su propio tramo, y AB, tres veces más largo, se
              llevaría tres cuartos. Es al contrario: a igual sección, el
              tramo largo es el más flexible y retiene menos. Lo que cuenta
              es la rigidez $GI_p/L$, y la de AB es $16/3$ veces la de BC.
          - valor: '315.7895'
            mensaje: |
              Es el torsor de BC, en valor absoluto. Sale si en
              $X = M_0 f_2/(f_1 + f_2)$ se cambian de sitio las
              flexibilidades $f = L/GI_p$: cada tramo se quedaría con la
              parte del otro. El más rígido, AB, es el que más retiene.
          - valor: '1000'
            mensaje: |
              Es $M_0/2$, el reparto a medias, como si las dos paredes
              retuvieran lo mismo. Con las rigideces $GI_p/L$ de cada tramo,
              la de AB es $16/3$ veces la de BC, y AB retiene $16/19$ del
              par.
          - valor: '1142.8571'
            mensaje: |
              Sale con $I_p$ proporcional a $D^{2}$ en lugar de a $D^{4}$:
              con un $I_p$ solo cuatro veces mayor, AB, tres veces más largo,
              sería apenas más rígido que BC. Con $D^{4}$, su $I_p$ es 16
              veces el de BC.
          - valor: '1882.3529'
            mensaje: |
              Es el reparto por las inercias sin las longitudes,
              el que valdría si los dos tramos midieran lo mismo. AB es tres
              veces más largo, y la longitud divide la rigidez: la de cada
              tramo es $GI_p/L$.
          - valor: '2000'
            mensaje: |
              Es $M_0$ entero en AB, como si C no existiera y el eje fuera un
              voladizo empotrado en A. Con C empotrado, BC también retiene
              parte del par, y AB lleva menos.
          - valor: '-1684.2105'
            mensaje: |
              El valor es ese; el signo, no. $-1684{,}2$ N·m es el par que
              hace la pared A sobre el eje, $M_A$, con su vector hacia $-x$.
              El torsor de una sección de AB es la suma de los pares de su
              derecha, $M_0 + M_C$, o menos la de los de su izquierda, $-M_A$:
              positivo, su flecha doble sale de la sección.
        pista: |
          Llama $X$ al torsor de AB. El equilibrio de un trozo da el de BC,
          $X - M_0$. Y C no gira respecto de A: la suma de los ángulos de
          torsión de los dos tramos, $M_tL/GI_p$ en cada uno, es cero.
        desarrollo: |
          Con $X$ el torsor de AB, el de BC es $X - M_0$, y la compatibilidad
          pide

          $$
          \frac{X L_1}{G I_{p1}} + \frac{(X - M_0) L_2}{G I_{p2}} = 0
          \quad\Longrightarrow\quad
          X = M_0\,\frac{L_2/I_{p2}}{L_1/I_{p1} + L_2/I_{p2}}
          $$

          Como $D_1 = 2D_2$, $I_{p1} = 16\,I_{p2}$, y con las longitudes en
          metros:

          $$
          X = 2000 \cdot \frac{0{,}4}{1{,}2/16 + 0{,}4} = 1684{,}2\ \text{N·m}
          $$

          El de BC es $1684{,}2 - 2000 = -315{,}8$ N·m. AB, con una rigidez
          $GI_p/L$, $16/3$ veces la de BC, retiene $16/19$ del par.

      - tipo: calcular
        titulo: La tensión cortante máxima del eje
        pregunta: |
          ¿Cuánto vale la tensión cortante máxima del eje, en MPa?
        respuesta:
          tipo: numero
          valor: '59.5668'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '39.7112'
            mensaje: |
              Es la de AB, el tramo que más par lleva. Pero la tensión no va
              con el par, sino con el par partido por $D^{3}$: BC lleva
              $3/16$ del par de AB con la mitad de diámetro, un $D^{3}$ ocho
              veces menor, y su tensión es vez y media la de AB.
          - valor: '119.1335'
            mensaje: |
              Es el doble de la de BC. Sale con $I_z = \pi D^{4}/64$ en lugar
              de $I_p = \pi D^{4}/32$, o con el diámetro en lugar del radio en
              $\tau = M_tr/I_p$. La máxima está en el borde, a $r = D/2$, y
              la inercia es la polar: $\tau_{\max} = 16M_t/\pi D^{3}$.
          - valor: '188.6281'
            mensaje: |
              Es la de BC con la mitad del par, 1000 N·m: el reparto a
              medias. BC retiene $3/19$ del par, porque su rigidez $GI_p/L$
              es $3/16$ de la de AB.
          - valor: '47.157'
            mensaje: |
              Es la de AB con el par entero, como si C no existiera. Con C
              empotrado, AB lleva menos, y la máxima del eje está en BC.
          - valor: '94.314'
            mensaje: |
              Es la de BC con 500 N·m: el reparto al revés, por la longitud
              de cada tramo, que deja 1500 N·m en AB. Con las rigideces
              $GI_p/L$, BC retiene $3/19$ del par.
          - valor: '282.9421'
            mensaje: |
              Es la de BC con 1500 N·m: el reparto de una barra de sección
              constante, sin las $I_p$, que deja 500 N·m en AB. Con las
              rigideces $GI_p/L$, BC retiene $3/19$ del par.
        pista: |
          En cada tramo, $\tau_{\max} = 16|M_t|/\pi D^{3}$. Calcula las dos:
          un tramo con menos par puede tener más tensión.
        desarrollo: |
          En AB, con 1684,2 N·m y 60 mm:

          $$
          \tau_{AB} = \frac{16 \cdot 1684{,}2 \cdot 10^{3}}{\pi \cdot 60^{3}} = 39{,}71\ \text{MPa}
          $$

          En BC, con 315,8 N·m y 30 mm:

          $$
          \tau_{BC} = \frac{16 \cdot 315{,}8 \cdot 10^{3}}{\pi \cdot 30^{3}} = 59{,}57\ \text{MPa}
          $$

          La máxima está en BC, aunque lleve menos de la quinta parte del
          par.

      - tipo: calcular
        titulo: El giro de la sección B
        pregunta: |
          ¿Cuánto gira la sección B, en grados, con su signo?
        respuesta:
          tipo: numero
          valor: '1.1376'
          tolerancia: 0.002
          formato: un número con su signo, en grados
        distractores:
          - valor: '0.019856'
            mensaje: |
              Es el giro en radianes. $M_tL/GI_p$ da radianes; en grados,
              multiplica por $180/\pi$.
          - valor: '-1.1376'
            mensaje: |
              El valor es ese; el signo, no. B gira en el sentido de $M_0$:
              $\varphi_B - \varphi_A = M_{t,AB}L_1/GI_{p1}$, con
              $M_{t,AB}$ positivo y $\varphi_A = 0$, es positivo.
          - valor: '2.2753'
            mensaje: |
              Es el doble. Sale con $I_z = \pi D^{4}/64$ en lugar de
              $I_p = \pi D^{4}/32$: el giro de torsión lleva la inercia
              polar.
          - valor: '1.0132'
            mensaje: |
              Es el giro con 1500 N·m en AB, el reparto al revés, por la
              longitud de cada tramo. Con el torsor que retiene AB por su
              rigidez, el giro es mayor.
          - valor: '0.3377'
            mensaje: |
              Es el giro con 500 N·m en AB, el reparto de una barra de
              sección constante, sin las $I_p$. Con el torsor que retiene AB
              por su rigidez, el giro es mayor.
          - valor: '0.6755'
            mensaje: |
              Es el giro con 1000 N·m en AB, el reparto a medias. Con el
              torsor que retiene AB por su rigidez, el giro es mayor.
          - valor: '1.3509'
            mensaje: |
              Es el giro con el par entero en AB, como si C no existiera.
              Con C empotrado, AB lleva menos par y B gira menos.
        pista: |
          A no gira, así que el giro de B es el ángulo de torsión de AB,
          $M_{t,AB}L_1/GI_{p1}$, en radianes.
        desarrollo: |
          Con $I_{p1} = \pi D_1^{4}/32$ y todo en N y mm:

          $$
          \varphi_B = \frac{1684{,}2 \cdot 10^{3} \cdot 1200 \cdot 32}{8 \cdot 10^{4} \cdot \pi \cdot 60^{4}} = 0{,}019856\ \text{rad}
          $$

          $$
          0{,}019856 \cdot \frac{180}{\pi} = 1{,}138
          $$

          es decir, $1{,}138$°, positivo: B gira en el sentido de $M_0$.
          Por BC sale lo mismo:
          $\varphi_C - \varphi_B = M_{t,BC}L_2/GI_{p2} = -\varphi_B$, porque C
          tampoco gira.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Hay dos pares de reacción, $M_A$ y $M_C$, y una sola ecuación de equilibrio, $M_A + M_0 + M_C = 0$: el eje es hiperestático de grado 1.'
          - texto: 'Con $X$ el torsor de AB, el de BC es $X - M_0$, y C no gira respecto de A: $XL_1/GI_{p1} + (X - M_0)L_2/GI_{p2} = 0$, que da $X = 16M_0/19 = 1684{,}2$ N·m.'
          - texto: 'BC lleva $-315{,}8$ N·m. Con $\tau_{\max} = 16|M_t|/\pi D^{3}$, AB llega a $39{,}7$ MPa y BC a $59{,}6$ MPa: la máxima del eje está en BC.'
          - texto: 'El giro de B es el ángulo de torsión de AB, $M_{t,AB}L_1/GI_{p1} = 0{,}0199$ rad, es decir, $1{,}138$°, en el sentido de $M_0$.'
          - texto: 'AB lleva más de cinco veces el par de BC, así que la tensión máxima del eje está en AB.'
            trampa: true
            mensaje: |
              La tensión no va con el par, sino con el par partido por
              $D^{3}$. BC lleva $3/16$ del par de AB, pero con la mitad de
              diámetro su $D^{3}$ es ocho veces menor, y su tensión es vez y
              media la de AB.
    resolucion: |
      **Cuántas incógnitas sobran.** Las paredes hacen sobre el eje dos
      pares, $M_A$ y $M_C$, y con pares a lo largo del eje la estática da una
      sola ecuación, $M_A + M_0 + M_C = 0$. El eje es hiperestático de
      grado 1, y la ecuación que falta es lo que hacen las paredes: no dejan
      girar, así que el giro de C respecto de A es cero (ec. 12.13 tramo a
      tramo).

      **La compatibilidad.** Con $X$ el torsor de AB, el equilibrio de un
      trozo da el de BC, $X - M_0$. Los ángulos de torsión de los dos tramos
      suman cero:

      $$
      \frac{X L_1}{G I_{p1}} + \frac{(X - M_0) L_2}{G I_{p2}} = 0
      $$

      Como $D_1 = 2D_2$, $I_{p1} = 16\,I_{p2}$:

      $$
      X = 2000 \cdot \frac{0{,}4}{1{,}2/16 + 0{,}4} = 1684{,}2\ \text{N·m}
      $$

      El torsor de AB es $+1684{,}2$ N·m y el de BC,
      $1684{,}2 - 2000 = -315{,}8$ N·m. Los pares de las paredes son
      $M_A = -1684{,}2$ N·m y $M_C = -315{,}8$ N·m: los dos se oponen a
      $M_0$. AB, con un $I_p$ 16 veces mayor y tres veces más largo, tiene
      una rigidez, $GI_p/L$, $16/3$ veces la de BC, y retiene $16/19$ del par.
      No es el reparto por longitudes, ni el de una barra de sección
      constante ni al revés: va con las rigideces.

      **Las tensiones.** En cada tramo, $\tau_{\max} = 16|M_t|/\pi D^{3}$:

      $$
      \tau_{AB} = \frac{16 \cdot 1684{,}2 \cdot 10^{3}}{\pi \cdot 60^{3}} = 39{,}71\ \text{MPa}
      \qquad
      \tau_{BC} = \frac{16 \cdot 315{,}8 \cdot 10^{3}}{\pi \cdot 30^{3}} = 59{,}57\ \text{MPa}
      $$

      La máxima del eje, $59{,}57$ MPa, está en el borde de BC, el tramo que
      menos par lleva: con la mitad de diámetro, su $D^{3}$ es ocho veces
      menor.

      **El giro de B.** A no gira, y el giro de B es el ángulo de torsión
      de AB:

      $$
      \varphi_B = \frac{1684{,}2 \cdot 10^{3} \cdot 1200 \cdot 32}{8 \cdot 10^{4} \cdot \pi \cdot 60^{4}} = 0{,}019856\ \text{rad}
      $$

      es decir, $1{,}138$°, positivo: B gira en el sentido de $M_0$.

      **Por otro camino: dos muelles de torsión.** B está unido a A por AB y
      a C por BC, que trabajan como dos muelles de rigideces
      $k_1 = GI_{p1}/L_1$ y $k_2 = GI_{p2}/L_2$ puestos en paralelo. El par
      $M_0$ gira B lo que dan los dos juntos, $\varphi_B = M_0/(k_1 + k_2)$,
      y cada tramo lleva su parte, $k_1\varphi_B$ y $-k_2\varphi_B$. En
      N·mm/rad, $k_1 = 8{,}48 \cdot 10^{7}$ y $k_2 = 1{,}59 \cdot 10^{7}$:
      $\varphi_B = 2 \cdot 10^{6}/(10{,}07 \cdot 10^{7})$, los mismos
      $0{,}0199$ rad, y $k_1/(k_1 + k_2) = 16/19$, el reparto de antes.
