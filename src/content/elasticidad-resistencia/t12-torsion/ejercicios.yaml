ejercicios:
  # ── Ejemplo introductorio nuestro · el eje de dos diámetros empotrado en sus dos extremos, con un par en el cambio de sección.
  - id: ejerm12-el-eje-de-dos-diametros
    titulo: El eje de dos diámetros entre dos paredes
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      El eje ABC de la figura está empotrado en A y en C. El tramo AB es
      macizo, de diámetro $D_1 = 60$ mm y longitud $L_1 = 1{,}2$ m, y el BC,
      también macizo, de diámetro $D_2 = 30$ mm y longitud $L_2 = 0{,}4$ m.
      Los dos son del mismo acero, con $G = 80$ GPa. En B, donde cambia la
      sección, actúa un par $M_0 = 2$ kN·m cuyo vector apunta hacia $+x$: la
      flecha doble de la figura.

      Con el convenio del curso (el torsor es positivo si su flecha doble
      sale de la sección, y el giro, según la regla de la mano derecha
      alrededor de $+x$), determinar el torsor de cada tramo, la tensión
      cortante máxima del eje y el giro de la sección B.

