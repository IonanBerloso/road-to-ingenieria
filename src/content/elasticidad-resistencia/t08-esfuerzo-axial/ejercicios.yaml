            <text x="30" y="80" font-size="9" text-anchor="middle" fill="var(--faint)">ω</text>
          </svg>

      - tipo: calcular
        titulo: El axil a media pala
        pregunta: |
          A media pala, $x = L/2$, ¿cuánto vale $N$, en unidades de
          $\rho A\omega^2L^2$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número, N dividido entre ρAω²L²
        distractores:
          - valor: '0.25'
            mensaje: |
              Has tomado el axil como una recta entre la raíz y la punta. La
              fuerza centrífuga de cada trozo crece con su distancia al eje:
              la mitad de fuera tira más que la de dentro, y a media pala
              queda más de la mitad del axil de la raíz. O has tomado la
              fuerza centrífuga de la mitad de fuera con el radio de la
              sección, $L/2$; su centro está a $3L/4$.
          - valor: '0.5'
            mensaje: |
              Es el axil de la raíz, que retiene la pala entera. A media pala
              solo queda por fuera la mitad exterior. O has tomado la fuerza
              centrífuga de la mitad de fuera con el radio de la punta; su
              centro está a $3L/4$.
          - valor: '0.125'
            mensaje: |
              Es la fuerza centrífuga de la mitad de dentro, entre el eje y la
              sección. La sección sostiene lo de fuera, entre ella y la
              punta.
        pista: |
          La sección a la distancia $x$ retiene el trozo entre ella y la
          punta: $N(x) = \int_x^L \rho A\omega^2 s\,ds$.
        desarrollo: |
          $$
          N(x) = \int_x^L \rho A\omega^2 s\,ds = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - x^2\right)
          $$

          $$
          N\!\left(\tfrac{L}{2}\right) = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - \tfrac{L^2}{4}\right)
          = \tfrac{3}{8}\,\rho A\omega^2L^2 = 0{,}375\,\rho A\omega^2L^2
          $$

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga la pala, en unidades de $\rho\omega^2L^3/E$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre ρω²L³/E
        distractores:
          - valor: '0.5'
            mensaje: |
              Es con el axil de la raíz en toda la pala. El axil baja hasta
              cero en la punta, y hay que integrarlo.
          - valor: '0.25'
            mensaje: |
              Es con el axil en recta, de la raíz a cero en la punta. La
              mitad de fuera tira más que la de dentro, y el axil baja más
              despacio al principio.
          - valor: '0.1667'
            mensaje: |
              Has tomado como axil de cada sección la fuerza centrífuga de lo
              de dentro, $\tfrac{1}{2}\rho A\omega^2x^2$. Cada sección
              retiene lo de fuera.
          - valor: '1'
            mensaje: |
              Has tomado $N = \rho A\omega^2L^2$ en toda la pala: la masa
              entera con la aceleración de la punta. Ni toda la masa está en
              la punta ni todas las secciones la sostienen.
          - valor: '0.6667'
            mensaje: |
              Te falta el ½: $N(x) = \tfrac12\rho A\omega^2(L^2 - x^2)$.
        pista: |
          Con $N$ variable, la integral de la ec. 8.8, sin término térmico:
          $\Delta L = \int_0^L N/(EA)\,dx$.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{\rho\omega^2}{2E}\left(L^2 - x^2\right)dx
          = \frac{\rho\omega^2}{2E}\left(L^3 - \frac{L^3}{3}\right)
          = \frac{\rho\omega^2L^3}{3E}
          $$

      - tipo: calcular
        titulo: El ejemplo
        pregunta: |
          Con el ejemplo de la nota, ¿cuánto se alarga la pala, en mm?
        respuesta:
          tipo: numero
          valor: '4.053'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '6.080'
            mensaje: |
              Es con el axil de la raíz en toda la pala. El axil baja hasta
              cero en la punta, y hay que integrarlo.
          - valor: '3.040'
            mensaje: |
              Es con el axil en recta, de la raíz a cero en la punta. La
              mitad de fuera tira más que la de dentro.
          - valor: '2.027'
            mensaje: |
              Has tomado como axil la fuerza centrífuga de lo de dentro de
              cada sección. Cada sección retiene lo de fuera.
        pista: |
          $\Delta L = \rho\omega^2L^3/(3E)$, con todo en el SI: $E$ en Pa y
          el resultado en m.
        desarrollo: |
          $$
          \Delta L = \frac{1900 \cdot 2^{2} \cdot 40^{3}}{3 \cdot 40 \cdot 10^{9}}\ \text{m} = 4{,}053 \cdot 10^{-3}\ \text{m}
          $$

          Es decir, 4,053 mm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A la distancia $x$ del eje, la sección retiene el trozo entre
              ella y la punta, que tira hacia fuera con su fuerza centrífuga.
          - texto: >-
              Ese trozo suma
              $\int_x^L \rho A\omega^2 s\,ds = \tfrac{1}{2}\rho A\omega^2\left(L^2 - x^2\right)$,
              que es el axil $N(x)$.
          - texto: >-
              Como $N$ cambia a lo largo de la pala, el alargamiento es la
              integral de la ec. 8.8: $\Delta L = \int_0^L N/(EA)\,dx$.
          - texto: >-
              Integrando, $\Delta L = \rho\omega^2L^3/(3E)$, y la sección se
              va.
          - texto: >-
              Toda la masa de la pala, $\rho AL$, gira como si estuviera a
              $L/2$ del eje: el axil es $\tfrac{1}{2}\rho A\omega^2L^2$ en toda
              la pala.
            trampa: true
            mensaje: |
              Eso es la fuerza centrífuga total, la que retiene la sección de
              la raíz. Una sección más afuera solo retiene lo que queda entre
              ella y la punta, y el axil baja hasta cero en la punta.
    resolucion: |
      **1. El sólido libre.** El trozo de pala que queda por fuera de una
      sección a la distancia $x$ del eje.

      <figure class="figura-examen">
      <svg viewBox="0 58 250 100" role="img" width="375" height="150" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El trozo de pala que queda por fuera de una sección</title>
        <desc id="dsl-d">La pala, horizontal, que gira alrededor de un eje en su raíz, a la izquierda. A trazos, el trozo de pala entre el eje y una sección a la distancia x. Del corte a la punta, el trozo que queda por fuera, con N en el corte tirando hacia el eje y, encima, cuatro flechas rojas hacia fuera, cada vez más largas hacia la punta: la fuerza centrífuga de cada trozo. Cotas: x del eje al corte y L del eje a la punta.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M120 94 H230 V106 H120 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="30" cy="100" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
        <path d="M30 94 H120 M30 106 H120" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M20 112 A15.6 15.6 0 1 1 40 112" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M30 132 H120 M30 128 V136 M120 128 V136" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="75" y="126" font-size="9" text-anchor="middle" fill="var(--faint)">x</text>
        <path d="M30 148 H230 M30 144 V152 M230 144 V152" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="175" y="144" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
        <line x1="116" y1="100" x2="80" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="84" y="92" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="124" y1="84" x2="140" y2="84" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="140" y="84" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="152" y1="84" x2="172" y2="84" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="150" y="72" font-size="10" text-anchor="start" fill="var(--flag)">ρAω²s ds</text>
        <line x1="182" y1="84" x2="206" y2="84" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="206" y="84" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="212" y1="84" x2="240" y2="84" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="240" y="84" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <text x="30" y="80" font-size="9" text-anchor="middle" fill="var(--faint)">ω</text>
      </svg>
      <figcaption>

      El trozo de pala por fuera del corte: N, supuesto a tracción, lo retiene, y cada trozo de pala sufre hacia fuera su fuerza centrífuga, mayor cuanto más lejos del eje. La punta no tiene nada.

      </figcaption>
      </figure>

      - **Con $\omega$ constante**, cada trozo de pala, de masa $\rho A\,ds$ y
        a la distancia $s$ del eje, necesita una fuerza hacia el eje,
        $\rho A\,ds\,\omega^2 s$, para seguir girando. Visto desde la pala, es
        su fuerza centrífuga, hacia fuera.
      - **En el corte, $N$**, supuesto a tracción, tirando del trozo hacia el
        eje.
      - **El peso propio se desprecia**, como dice el enunciado.

      **2. Incógnitas.** El axil $N(x)$ y el alargamiento de la pala.

      **3. Ecuaciones.** El equilibrio del trozo, y el alargamiento con la
      integral de la ec. 8.8 (p. 6), sin término térmico:

      $$
      N(x) = \int_x^L \rho A\omega^2 s\,ds
      \qquad
      \Delta L = \int_0^L \frac{N}{EA}\,dx
      $$

      **4. Resultados.** **El axil.**

      $$
      N(x) = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - x^2\right)
      $$

      Toda la pala está a tracción, con $\tfrac{1}{2}\rho A\omega^2L^2$ en la
      raíz y cero en la punta. Va con $L^2 - x^2$, no en recta: a media pala
      queda $\tfrac{3}{8}\rho A\omega^2L^2$, tres cuartos del axil de la raíz.

      **El alargamiento.**

      $$
      \Delta L = \frac{\rho\omega^2}{2E}\int_0^L \left(L^2 - x^2\right)dx
      = \frac{\rho\omega^2}{2E}\cdot\frac{2L^3}{3}
      = \frac{\rho\omega^2L^3}{3E}
      $$

      **El ejemplo.** Con $\rho = 1900\ \text{kg/m}^{3}$,
      $E = 40\ \text{GPa}$, $L = 40\ \text{m}$ y $\omega = 2\ \text{rad/s}$:

      $$
      \Delta L = \frac{1900 \cdot 2^{2} \cdot 40^{3}}{3 \cdot 40 \cdot 10^{9}}\ \text{m} = 4{,}053 \cdot 10^{-3}\ \text{m}
      $$

      **5. Comprobación.** El motor del curso hace la integral de la ec. 8.8
      con el axil de arriba. Por otro lado, la pala se parte en 4000 tramos,
      fija en el eje y libre en la punta, con la fuerza centrífuga de cada
      tramo repartida en sus dos nudos, y se resuelve como una barra con
      cargas puntuales. Los dos dan $0{,}3333\,\rho\omega^2L^3/E$; el de los
      tramos, además, $N = 0{,}5$ en la raíz y $0{,}375$ a media pala, en
      unidades de $\rho A\omega^2L^2$, y para el ejemplo, 4,053 mm.

      **Lo que dice el resultado.** La sección $A$ se va: una pala más gruesa
      tiene más masa, pero también más sección que la sostenga. Unos 4 mm en
      una pala de 40 m: una deformación media de una diezmilésima. El peso
      propio, que el enunciado deja fuera, solo es perpendicular a la pala
      cuando está horizontal, como en la figura; con la pala vertical daría
      un axil de hasta $\rho A g L$ en la raíz, que suma o resta según apunte
      hacia abajo o hacia arriba.

  # ── Propuesta A12 de clase · ABC rígida sobre cinco barras, con BE calentada.
  - id: ejerm8-cla12-la-pieza-abc-sobre-cinco-barras
    titulo: La barra rígida ABC sobre cinco barras, con P en B y la barra BE calentada
    fuente: >-
      Propuesta A12 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (el equilibrio de ABC y de E con la
      compatibilidad, escrito a mano, y las reacciones de D y F contra la
      carga). Se conserva la errata del original, «fugura». La carga P solo
      está en la figura, en B. El enunciado no dice cómo se mueven ABC y E:
      se toma la simetría, y lo dice la nota. La figura está redibujada con
      las cotas del original.
    nivel: practica
    antes:
      idea: |
        ABC no se deforma y todo es simétrico respecto de la vertical de B: ABC
        sube o baja sin girar, y E solo se mueve en vertical. Con esos dos
        movimientos se escriben los cinco alargamientos.
      formula: |
        $$
        \Delta L = \vec u\cdot\vec e
        $$

        Lo que se alarga una barra con un extremo fijo: el desplazamiento del
        otro extremo, proyectado sobre la dirección de la barra contada desde
        su apoyo (ec. 8.12).
      reconocer: |
        Antes de las cuentas, escribe las ecuaciones de equilibrio de ABC y de
        E, una a una.
    enunciado: |
      La estructura de la fugura tiene la barra ABC rígida y las otras 5
      articuladas. Las $E$ y $A$ de estas últimas son las mismas.

      Las articulaciones D y F son fijas. La barra BE sufre un cambio de
      temperatura $\Delta T$.

      Determina las fuerzas axiales de las barras y el desplazamiento en E.

