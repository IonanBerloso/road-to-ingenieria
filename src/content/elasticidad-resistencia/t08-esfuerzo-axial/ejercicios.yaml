      <figcaption>

      Redibujada del enunciado: D y A, articulados en la pared; el nudo de
      en medio, sobre un apoyo móvil, y el de la derecha, sobre un apoyo
      fijo. A diferencia del original, el dibujo está a escala.

      </figcaption>
      </figure>

      **Notas nuestras.** Los nombres B y C son nuestros: B es el nudo de en
      medio y C, el apoyo fijo de la derecha. El enunciado no da el material
      ni la sección: se toman iguales en las tres barras. Solo la 3 cambia
      de temperatura, así que solo entra su $\alpha$; $\Delta T > 0$ es un
      calentamiento. Cada axil se pregunta
      como coeficiente de $EA\alpha\Delta T$, positivo a tracción.
    pide: >-
      Los axiles de las barras 2, 3 y 1, como coeficientes de EAαΔT.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apoyo móvil deja a B moverse solo en horizontal: se mueve $u$,
          positivo hacia la derecha. ¿Cuánto se alarga cada barra?
        opciones:
          - texto: $\Delta L_2 = u$, $\Delta L_3 = -u$ y $\Delta L_1 = u\cos 30^{\circ}$
            correcta: true
            mensaje: |
              Eso es. Cada barra se alarga lo que su extremo B avanza en su
              dirección, contada desde el otro extremo (apuntes, ec. 8.12).
              La 2 va de A a B, hacia la derecha, y se alarga $u$; la 3 va
              de C a B, hacia la izquierda, y se acorta $u$; la 1 va de D a
              B, a 30° por debajo de la horizontal, y se alarga
              $u\cos 30^{\circ}$.
          - texto: $\Delta L_1 = \Delta L_2 = u$ y $\Delta L_3 = -u$
            mensaje: |
              La 1 no es horizontal: forma 30° con la 2, y de lo que se
              mueve B solo cuenta la parte en su dirección,
              $u\cos 30^{\circ}$.
          - texto: $\Delta L_2 = \Delta L_3 = u$ y $\Delta L_1 = u\cos 30^{\circ}$
            mensaje: |
              La 3 va de C a B, en sentido contrario a la 2: si B se va a la
              derecha, se acerca a C, y la 3 se acorta. $\Delta L_3 = -u$.
          - texto: $\Delta L_3 = \alpha\Delta T\,L$, y la 1 y la 2 no se alargan
            mensaje: |
              B no está quieto: la 1 y la 2 solo lo frenan. Lo que se mueve
              B alarga la 1 y la 2 y acorta la 3, y el alargamiento de la 3
              es lo elástico más lo térmico,
              $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec. 8.9).

      - tipo: calcular
        titulo: La barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, como coeficiente de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.3774'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en N2
        distractores:
          - valor: '-0.5'
            mensaje: |
              Es lo que saldría sin la barra 1: la 2 y la 3 se repartirían
              la dilatación a medias. La 1 también se alarga cuando B se
              mueve, frena a B y se lleva su parte.
          - valor: '-0.3636'
            mensaje: |
              Has tomado $\Delta L_1 = u$, sin proyectar, o la barra 1 de
              longitud $L$ con la proyección: los dos errores dan este mismo
              número. La 1 se alarga $u\cos 30^{\circ}$ y mide
              $L/\cos 30^{\circ} = 2L/\sqrt{3}$.
          - valor: '-1.5396'
            mensaje: |
              Has tomado $\Delta L_3 = +u$. La 3 va de C a B: si B se va a
              la derecha, se acerca a C y la 3 se acorta,
              $\Delta L_3 = -u$.
          - valor: '0.3774'
            mensaje: |
              El valor es ese, pero has puesto la deformación térmica con el
              signo cambiado: calentada, la 3 empuja B hacia la pared, y la 2
              se acorta.
        pista: |
          Con las tres a tracción, el equilibrio horizontal de B es
          $-N_2 + N_3 - N_1\cos 30^{\circ} = 0$. Escribe cada axil con su
          alargamiento (ec. 8.9), el de la 3 con su término térmico, y sale
          $u$.
        desarrollo: |
          $$
          N_2 = \frac{EA}{L}\,u
          \qquad
          N_3 = -\frac{EA}{L}\,u - EA\alpha\Delta T
          \qquad
          N_1 = \frac{EA}{2L/\sqrt{3}}\,u\cos 30^{\circ} = \frac{3}{4}\,\frac{EA}{L}\,u
          $$

          $$
          -\left(2 + \frac{3\sqrt{3}}{8}\right)\frac{EA}{L}\,u - EA\alpha\Delta T = 0
          \;\Longrightarrow\;
          u = -\frac{8}{16 + 3\sqrt{3}}\,\alpha\Delta T\,L
          $$

          $$
          N_2 = -\frac{8}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}3774\,EA\alpha\Delta T
          $$

      - tipo: calcular
        titulo: La barra 3
        pregunta: |
          ¿Y $N_3$, como coeficiente de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.6226'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en N3
        distractores:
          - valor: '-1'
            mensaje: |
              Es la fuerza de una barra que no puede alargarse, con los dos
              extremos fijos. C lo es, pero B se va hacia la izquierda: la 1
              y la 2 solo lo frenan en parte.
          - valor: '0.6226'
            mensaje: |
              El valor es ese, pero has puesto la deformación térmica con el
              signo cambiado. Calentada, la 3 quiere alargarse; la 1 y la 2
              la frenan y queda comprimida.
          - valor: '-0.5'
            mensaje: |
              Es lo que saldría sin la barra 1: la 2 y la 3 se repartirían
              la dilatación a medias. La 1 también frena a B y se lleva su
              parte.
          - valor: '-0.6364'
            mensaje: |
              Has tomado $\Delta L_1 = u$, sin proyectar, o la barra 1 de
              longitud $L$ con la proyección: los dos errores dan este mismo
              número. La 1 se alarga $u\cos 30^{\circ}$ y mide $2L/\sqrt{3}$.
        pista: |
          $N_3 = -\dfrac{EA}{L}\,u - EA\alpha\Delta T$, con la $u$ del paso
          anterior.
        desarrollo: |
          $$
          N_3 = \left(\frac{8}{16 + 3\sqrt{3}} - 1\right)EA\alpha\Delta T
          = -\frac{8 + 3\sqrt{3}}{16 + 3\sqrt{3}}\,EA\alpha\Delta T
          = -0{,}6226\,EA\alpha\Delta T
          $$

      - tipo: calcular
        titulo: La barra 1
        pregunta: |
          ¿Y $N_1$, como coeficiente de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.2831'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en N1
        distractores:
          - valor: '-0.3269'
            mensaje: |
              Has dividido entre $L$ en lugar de entre la longitud de la 1,
              o has usado su longitud pero sin proyectar $u$: los dos
              errores dan este número. La 1 se alarga $u\cos 30^{\circ}$ y
              mide $2L/\sqrt{3}$.
          - valor: '-0.3774'
            mensaje: |
              Es el axil de la 2, $EAu/L$: ni has proyectado $u$ sobre la 1
              ni has usado su longitud. La 1 se alarga $u\cos 30^{\circ}$ y
              mide $2L/\sqrt{3}$.
          - valor: '0.2831'
            mensaje: |
              El valor es ese, pero el signo no. B se va hacia la izquierda,
              se acerca a D y acorta la 1: está comprimida, como la 2.
        pista: |
          $N_1 = \dfrac{EA}{L_1}\,\Delta L_1$, con $\Delta L_1 = u\cos 30^{\circ}$
          y $L_1 = 2L/\sqrt{3}$.
        desarrollo: |
          $$
          N_1 = \frac{3}{4}\,\frac{EA}{L}\,u = -\frac{6}{16 + 3\sqrt{3}}\,EA\alpha\Delta T
          = -0{,}2831\,EA\alpha\Delta T
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En B hay cuatro incógnitas, los tres axiles y la reacción del
              apoyo móvil, y dos ecuaciones de equilibrio: es hiperestático.
          - texto: >-
              B solo se mueve en horizontal, $u$: la 2 se alarga $u$, la 3 se
              acorta $u$ y la 1 se alarga $u\cos 30^{\circ}$.
          - texto: >-
              Cada axil sale de su alargamiento con la ec. 8.9, y el de la 3
              lleva además $-EA\alpha\Delta T$.
          - texto: >-
              El equilibrio horizontal de B, con los tres axiles escritos con
              $u$, da $u = -8\,\alpha\Delta T\,L/(16 + 3\sqrt{3})$.
          - texto: >-
              Con $u$ salen los tres axiles, y el equilibrio vertical de B
              da la reacción del apoyo móvil.
          - texto: >-
              La barra 3 no puede alargarse, porque C es fijo:
              $N_3 = -EA\alpha\Delta T$.
            trampa: true
            mensaje: |
              Para no poder alargarse le harían falta los dos extremos fijos,
              y B no lo está: el apoyo móvil lo deja ir en horizontal, y la 1
              y la 2 solo lo frenan en parte. $N_3$ sale
              $-0{,}6226\,EA\alpha\Delta T$.
    resolucion: |
      **Lo que la estática no cierra.** Origen en A, $x$ hacia la derecha e
      $y$ hacia arriba. Las tres barras llegan a B, que está sobre un apoyo
      móvil: el apoyo da una reacción vertical $R$ y deja a B moverse en
      horizontal. Con las tres barras a tracción, tirando de B hacia su
      otro extremo, el equilibrio de B es

      $$
      -N_2 + N_3 - N_1\cos 30^{\circ} = 0
      \qquad
      N_1\operatorname{sen} 30^{\circ} + R = 0
      $$

      Cuatro incógnitas, $N_1$, $N_2$, $N_3$ y $R$, y dos ecuaciones: el
      nudo es hiperestático (apuntes del tema 8, p. 4). Pero B solo tiene
      una forma de moverse, $u$ en horizontal, y con ella se escriben los
      tres alargamientos: basta la ecuación horizontal.

      **Compatibilidad.** Cada barra se alarga lo que su extremo B avanza
      en su dirección, contada desde el otro extremo (ec. 8.12). La 2 va de
      A a B, hacia la derecha; la 3, de C a B, hacia la izquierda, y la 1,
      de D a B, a 30° por debajo de la horizontal:

      $$
      \Delta L_2 = u
      \qquad
      \Delta L_3 = -u
      \qquad
      \Delta L_1 = u\cos 30^{\circ}
      $$

      **Ley de cada barra**, $\Delta L = NL/(EA) + \varepsilon_0 L$
      (ec. 8.9), con la misma $EA$ en las tres y $\varepsilon_0 = \alpha\Delta T$
      solo en la 3. La 2 y la 3 miden $L$; la 1 llega de D a B, que están a
      $L$ en horizontal, y mide $L_1 = L/\cos 30^{\circ} = 2L/\sqrt{3}$:

      $$
      N_2 = \frac{EA}{L}\,u
      \qquad
      N_3 = -\frac{EA}{L}\,u - EA\alpha\Delta T
      \qquad
      N_1 = \frac{EA}{L_1}\,u\cos 30^{\circ} = \frac{3}{4}\,\frac{EA}{L}\,u
      $$

      **El equilibrio de B.** Con los tres axiles en la ecuación
      horizontal,

      $$
      -\frac{EA}{L}\,u - \frac{EA}{L}\,u - EA\alpha\Delta T - \frac{3\sqrt{3}}{8}\,\frac{EA}{L}\,u = 0
      \;\Longrightarrow\;
      u = -\frac{8}{16 + 3\sqrt{3}}\,\alpha\Delta T\,L = -0{,}3774\,\alpha\Delta T\,L
      $$

      Calentada, la 3 empuja B hacia la izquierda, hacia la pared.

      **Las fuerzas.**

      $$
      N_2 = -\frac{8}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}3774\,EA\alpha\Delta T
      $$

      $$
      N_3 = -\frac{8 + 3\sqrt{3}}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}6226\,EA\alpha\Delta T
      $$

      $$
      N_1 = -\frac{6}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}2831\,EA\alpha\Delta T
      $$

      Las tres están comprimidas: la 3, porque no la dejan dilatarse
      entera, y la 1 y la 2, porque B se les acerca. La 3 se queda con algo
      más de seis décimas de la fuerza que tendría entre dos apoyos fijos.
      La reacción del apoyo móvil es
      $R = -N_1\operatorname{sen} 30^{\circ} = 0{,}1415\,EA\alpha\Delta T$,
      hacia arriba: la 1, comprimida, empuja B hacia abajo.

      **Comprobación por otro camino.** La 1 tiene que alargarse lo mismo
      calculada con su axil que proyectando el movimiento de B. Con su
      axil, $N_1L_1/(EA) = -0{,}28307 \cdot 1{,}15470\,\alpha\Delta T\,L = -0{,}3269\,\alpha\Delta T\,L$;
      proyectando, $u\cos 30^{\circ} = -0{,}37743 \cdot 0{,}86603\,\alpha\Delta T\,L = -0{,}3269\,\alpha\Delta T\,L$.
      El motor del curso, con B como nudo y el apoyo móvil como una
      deslizadera, da los mismos tres axiles, B quieto en vertical y la
      misma reacción. Y la $L$ no entra en las fuerzas, que es por lo que
      el enunciado no la necesita para ellas.

  # ── Propuesta A9 de clase · BD indeformable, dos barras y un resorte en D.
  - id: ejerm8-cla9-la-barra-bd-con-dos-barras-y-un-resorte
    titulo: La barra BD indeformable, con dos barras y un resorte en D
    fuente: >-
      Propuesta A9 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (los momentos en B escritos a mano,
      la proyección del desplazamiento de D sobre cada barra y el equilibrio
      de las fuerzas que llegan a D). Se conserva la errata del original,
      «subren». El enunciado no da ni el material ni la sección de las
      barras: se toman iguales en las dos. En el original no se ve bien
      dónde se une la barra 2: mirada ampliada, llega al extremo D de
      BD por debajo, en el mismo punto que el resorte, y así casan las
      longitudes que da el texto. Las dos cosas las dice la nota. La figura
      está redibujada; la constante del resorte, que la figura llama k y el
      texto K, es la misma.
    nivel: practica
    enunciado: |
      Calcula las fuerzas axiales que subren las barras (1) y (2).
      Considerando a la barra BD indeformable.

      $$
      L_1 = L
      \qquad
      L_2 = \sqrt{3}\,L
      \qquad
      K = \frac{EA}{4L}
      $$

