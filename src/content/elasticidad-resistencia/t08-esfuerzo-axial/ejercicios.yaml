    pide: >-
      La ecuación de A(y) y, con el ejemplo de la nota, la constante k de
      la ecuación de la rebanada, el área de la base y el peso de la
      columna.
    pasos:
      - tipo: reconocer
        pregunta: |
          Toma la rebanada de columna entre las profundidades $y$ e
          $y + dy$. Si todas las secciones han de trabajar a la misma
          tensión $\sigma_0$, ¿qué ecuación da $A(y)$?
        opciones:
          - texto: $\sigma_0\,dA = \gamma\,A\,dy$, porque de una cara de la rebanada a la otra la fuerza crece lo que pesa la rebanada
            correcta: true
            mensaje: |
              Eso es. La cara de arriba de la rebanada transmite
              $\sigma_0 A$, y la de abajo, eso más el peso de la rebanada,
              $\gamma A\,dy$. Con la tensión fija, la fuerza solo puede
              crecer si crece el área: $\sigma_0\,dA = \gamma A\,dy$, con
              $A = A_0$ en la cara de arriba y $\sigma_0 = P/A_0$.
          - texto: $\sigma_0\,A = P + \gamma\,A\,y$, con el peso de lo de encima igual al área de la sección por la profundidad
            mensaje: |
              Eso sería el peso de un prisma de sección $A(y)$, y lo de
              encima no lo es: más arriba la columna es más estrecha. El
              peso de lo de encima es $\gamma\int_0^y A\,ds$, y por eso hay
              que ir rebanada a rebanada.
          - texto: $\sigma_0\,A = P + \gamma\,A_0\,y$, con el peso de lo de encima calculado con el área de arriba
            mensaje: |
              Con $A_0$ cuentas lo de encima como si no se hubiera
              ensanchado, y se ha ensanchado: el peso de lo de encima es
              $\gamma\int_0^y A\,ds$, mayor que $\gamma A_0\,y$.
          - texto: $A = A_0$ en toda la columna, porque con la sección constante la tensión no cambia
            mensaje: |
              Con la sección constante, el axil crece con la profundidad:
              cada sección sostiene $P$ y además el peso de lo de encima. La
              tensión, $N/A$ (ec. 8.5), crece con él, y para que no crezca
              el área tiene que crecer al mismo paso.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la rebanada de columna entre las
          profundidades $y$ e $y + dy$**.
        comprueba:
          - punto: |
              **$N$ en la cara de arriba y $N + dN$ en la de abajo, tirando de
              la rebanada.**
            porque: |
              Se suponen a tracción, como siempre; saldrán negativos, porque la
              columna está comprimida.
          - punto: |
              **Su peso, $\gamma A\,dy$, hacia abajo.**
            porque: |
              Es el volumen de la rebanada, $A\,dy$, por el peso específico.
          - punto: |
              **Nada más: $P$ no actúa sobre la rebanada.**
            porque: |
              $P$ está en la cara de arriba de la columna; aquí llega a través
              de $N$.
        figura: |
          <svg viewBox="0 12 240 160" role="img" width="240" height="160" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La rebanada de columna entre las profundidades y e y + dy</title>
            <desc id="dsl-d">Un trapecio, la rebanada de columna entre las profundidades y, arriba, e y más dy, abajo, algo más ancha abajo. En la cara de arriba, N hacia arriba; en la de abajo, N más dN hacia abajo. En el centro, su peso, gamma A dy, a trazos, hacia abajo. A la derecha, la cota dy.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M70 60 H170 L176 120 H64 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M200 60 V120 M196 60 H204 M196 120 H204" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="206" y="94" font-size="9" text-anchor="start" fill="var(--faint)">dy</text>
            <line x1="120" y1="56" x2="120" y2="20" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="128" y="30" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
            <line x1="120" y1="124" x2="120" y2="160" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="128" y="156" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N + dN</text>
            <line x1="120" y1="76" x2="120" y2="104" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
            <text x="128" y="100" font-size="10" text-anchor="start" fill="var(--flag)">γA dy</text>
            <text x="58" y="64" font-size="9" text-anchor="end" fill="var(--faint)">y</text>
            <text x="56" y="124" font-size="9" text-anchor="end" fill="var(--faint)">y + dy</text>
          </svg>

      - tipo: calcular
        titulo: La constante de la columna
        pregunta: |
          La ecuación de la rebanada se escribe $dA/dy = k\,A$. Con el
          ejemplo de la nota, ¿cuánto vale $k$, en 1/m?
        respuesta:
          tipo: numero
          valor: '0.0125'
          tolerancia: 0.0002
          formato: un número, en 1/m
        distractores:
          - valor: '12.5'
            mensaje: |
              Has dividido kN/m³ entre MPa sin pasarlos a las mismas
              unidades. $\sigma_0 = 2\ \text{MPa}$ son
              $2000\ \text{kN/m}^{2}$, y $k = \gamma/\sigma_0$ sale en 1/m.
          - valor: '80'
            mensaje: |
              Es la inversa, $\sigma_0/\gamma$: la altura de columna que,
              con su propio peso, daría la tensión $\sigma_0$. De
              $\sigma_0\,dA = \gamma A\,dy$, $k = \gamma/\sigma_0$.
          - valor: '0.025'
            mensaje: |
              Has dividido $\gamma$ entre $P$ y no entre la tensión:
              $k = \gamma/\sigma_0 = \gamma A_0/P$.
        pista: |
          De $\sigma_0\,dA = \gamma A\,dy$, $k = \gamma/\sigma_0$, con
          $\sigma_0 = P/A_0$ en kN/m².
        desarrollo: |
          $$
          \sigma_0 = \frac{P}{A_0} = \frac{1000\ \text{kN}}{0{,}5\ \text{m}^{2}} = 2000\ \text{kN/m}^{2}
          $$

          $$
          k = \frac{\gamma}{\sigma_0} = \frac{25\ \text{kN/m}^{3}}{2000\ \text{kN/m}^{2}} = 0{,}0125\ \text{m}^{-1}
          $$

      - tipo: calcular
        titulo: El área de la base
        pregunta: |
          ¿Qué área necesita la sección a 20 m de profundidad, la base de la
          columna del ejemplo, en m²?
        respuesta:
          tipo: numero
          valor: '0.6420'
          tolerancia: 0.002
          formato: un número, en m²
        distractores:
          - valor: '0.625'
            mensaje: |
              Es $A_0(1 + k\,y)$, la de $\sigma_0 A = P + \gamma A_0\,y$: has
              contado el peso de lo de encima con el área de arriba. La
              columna se ensancha al bajar, y cada rebanada pesa más que la
              de encima.
          - valor: '0.6667'
            mensaje: |
              Es $A_0/(1 - k\,y)$, la de $\sigma_0 A = P + \gamma A\,y$: has
              contado lo de encima como un prisma con el área de la sección.
              Lo de encima es más estrecho, y hay que sumarlo rebanada a
              rebanada.
          - valor: '0.5'
            mensaje: |
              Es $A_0$, la sección que bastaría sin peso propio. La base
              sostiene además el peso de toda la columna, y para seguir a
              $\sigma_0$ tiene que ser mayor.
          - valor: '0.3894'
            mensaje: |
              Es $A_0\,e^{-k y}$: has integrado con el signo cambiado, y la
              sección te sale menguando hacia abajo. Cada sección sostiene
              más que la de encima, así que tiene que ser mayor.
        pista: |
          Integrando $dA/A = k\,dy$ desde la cara de arriba, donde
          $A = A_0$: $A(y) = A_0\,e^{k y}$.
        desarrollo: |
          $$
          A(y) = A_0\,e^{k y}
          $$

          $$
          A(20\ \text{m}) = 0{,}5\ \text{m}^{2} \cdot e^{0{,}25} = 0{,}6420\ \text{m}^{2}
          $$

      - tipo: calcular
        titulo: El peso de la columna
        pregunta: |
          ¿Cuánto pesa la columna entera del ejemplo, en kN?
        respuesta:
          tipo: numero
          valor: '284.03'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '250'
            mensaje: |
              Es $\gamma A_0 h$, el peso de un prisma con el área de arriba.
              La columna se ensancha hacia abajo y pesa más.
          - valor: '321.01'
            mensaje: |
              Es $\gamma A_b h$, el peso de un prisma con el área de la base.
              Más arriba la columna es más estrecha y pesa menos.
          - valor: '1284.03'
            mensaje: |
              Es la reacción del suelo, $P + W$: lo que sostiene la base. El
              peso de la columna es lo que la base sostiene de más sobre $P$.
        pista: |
          La base trabaja a $\sigma_0$ como todas las secciones, y sostiene
          $P$ más el peso de la columna: $\sigma_0 A_b = P + W$.
        desarrollo: |
          $$
          W = \sigma_0 A_b - P = 2000 \cdot 0{,}6420\ \text{kN} - 1000\ \text{kN} = 284{,}0\ \text{kN}
          $$

          Por la integral, con $\sigma_0 A_0 = P$:

          $$
          W = \int_0^h \gamma A_0\,e^{k y}\,dy = P\left(e^{k h} - 1\right)
          = 1000\ \text{kN} \cdot \left(e^{0{,}25} - 1\right) = 284{,}03\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Todas las secciones han de trabajar a la tensión de la cara de
              arriba, $\sigma_0 = P/A_0$, a compresión.
          - texto: >-
              La rebanada entre $y$ e $y + dy$ pesa $\gamma A\,dy$, y la
              fuerza de su cara de abajo es la de la de arriba más ese peso.
          - texto: >-
              Con $\sigma_0$ fija, $\sigma_0\,dA = \gamma A\,dy$: el área
              crece en proporción a sí misma.
          - texto: >-
              Integrando desde la cara de arriba,
              $A(y) = A_0\,e^{\gamma y/\sigma_0} = A_0\,e^{\gamma A_0 y/P}$.
          - texto: >-
              La base sostiene $P$ más el peso de la columna:
              $W = P\left(e^{\gamma A_0 h/P} - 1\right)$.
          - texto: >-
              El axil es $P$ en toda la columna, así que basta con la sección
              constante $A_0$.
            trampa: true
            mensaje: |
              Eso sería sin peso propio. Cada sección sostiene $P$ y además
              el peso de lo que tiene encima: el axil crece hacia abajo, y la
              sección tiene que crecer con él.
    resolucion: |
      **1. El sólido libre.** La rebanada de columna entre las profundidades
      $y$ e $y + dy$, medidas hacia abajo desde la cara de arriba.

      <figure class="figura-examen">
      <svg viewBox="0 12 240 160" role="img" width="360" height="240" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">La rebanada de columna entre las profundidades y e y + dy</title>
        <desc id="dsl-d">Un trapecio, la rebanada de columna entre las profundidades y, arriba, e y más dy, abajo, algo más ancha abajo. En la cara de arriba, N hacia arriba; en la de abajo, N más dN hacia abajo. En el centro, su peso, gamma A dy, a trazos, hacia abajo. A la derecha, la cota dy.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M70 60 H170 L176 120 H64 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M200 60 V120 M196 60 H204 M196 120 H204" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="206" y="94" font-size="9" text-anchor="start" fill="var(--faint)">dy</text>
        <line x1="120" y1="56" x2="120" y2="20" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="128" y="30" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="120" y1="124" x2="120" y2="160" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="128" y="156" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N + dN</text>
        <line x1="120" y1="76" x2="120" y2="104" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
        <text x="128" y="100" font-size="10" text-anchor="start" fill="var(--flag)">γA dy</text>
        <text x="58" y="64" font-size="9" text-anchor="end" fill="var(--faint)">y</text>
        <text x="56" y="124" font-size="9" text-anchor="end" fill="var(--faint)">y + dy</text>
      </svg>
      <figcaption>

      La rebanada entre las profundidades y e y + dy: en cada cara, el axil, supuesto a tracción, y en medio, su peso, γA dy.

      </figcaption>
      </figure>

      - **En cada cara, el axil**, supuesto a tracción: $N$ arriba y $N + dN$
        abajo.
      - **En medio, su peso**, $\gamma A\,dy$.
      - **Toda la columna está a compresión**: en la cara de arriba, de área
        $A_0$, el axil es $-P$.

      **2. Incógnitas.** El área $A(y)$; con el ejemplo, la constante $k$, el
      área de la base y el peso de la columna.

      **3. Ecuaciones.** En la cara de arriba, la tensión (ec. 8.5, p. 6) es
      $\sigma_x = -P/A_0$. Que todas las secciones trabajen igual quiere decir
      $\sigma_x = -\sigma_0$ en toda la columna, es decir, $N = -\sigma_0 A$,
      con

      $$
      \sigma_0 = \frac{P}{A_0}
      $$

      El equilibrio vertical de la rebanada, con $N = -\sigma_0 A$:

      $$
      N - (N + dN) - \gamma A\,dy = 0
      \;\Longrightarrow\;
      \sigma_0\,dA = \gamma A\,dy
      $$

      **4. Resultados.** **La ecuación del cambio de sección.** Con
      $dA/A = (\gamma/\sigma_0)\,dy$, integrando desde la cara de arriba,
      donde $A = A_0$:

      $$
      A(y) = A_0\,e^{\gamma y/\sigma_0} = A_0\,e^{\gamma A_0 y/P}
      $$

      El área crece en exponencial hacia la base. El peso de la columna hasta
      la profundidad $h$ es lo que la base sostiene de más sobre $P$:

      $$
      W = \sigma_0 A(h) - P = P\left(e^{\gamma A_0 h/P} - 1\right)
      $$

      **El ejemplo.** Con $P = 1000\ \text{kN}$, $A_0 = 0{,}5\ \text{m}^{2}$ y
      $\gamma = 25\ \text{kN/m}^{3}$, $\sigma_0 = 2000\ \text{kN/m}^{2}$, es
      decir, 2 MPa, y

      $$
      k = \frac{\gamma}{\sigma_0} = \frac{25\ \text{kN/m}^{3}}{2000\ \text{kN/m}^{2}} = 0{,}0125\ \text{m}^{-1}
      $$

      A 20 m de profundidad,
      $A = 0{,}5\ \text{m}^{2} \cdot e^{0{,}25} = 0{,}6420\ \text{m}^{2}$, y la
      columna pesa $W = 1000\ \text{kN} \cdot (e^{0{,}25} - 1) = 284{,}03\ \text{kN}$.

      **5. Comprobación.** El peso, sumado rebanada a rebanada:
      $W = \int_0^{h} \gamma A\,dy = (\gamma A_0/k)\left(e^{kh} - 1\right)$,
      con $\gamma A_0/k = 1000\ \text{kN}$, da el mismo $284{,}03\ \text{kN}$.
      Y el motor parte la columna en 4000 tramos prismáticos, cada uno con el
      área de su profundidad media y su peso repartido en sus dos nudos, y la
      resuelve como una barra con cargas puntuales. La tensión le sale la
      misma en todos los tramos, 2 MPa, con diferencias de menos de una parte
      en mil millones, y la reacción del suelo, $1284{,}03\ \text{kN}$, que es
      $P + W$.

      **Lo que dice el resultado.** Cada sección es justo la que hace falta
      para que su axil, $-\sigma_0 A(y)$, la deje a $\sigma_0$. Con la columna
      prismática de área $A_0$, la base estaría a
      $(1000 + 25 \cdot 0{,}5 \cdot 20)\ \text{kN}/(0{,}5\ \text{m}^{2}) = 2500\ \text{kN/m}^{2}$:
      un 25 % más que arriba. Ensanchar la base un 28 % lo evita.

  # ── Propuesta A8 de clase · tres barras en B, con la 3 calentada.
  - id: ejerm8-cla8-tres-barras-y-la-3-calentada
    titulo: Tres barras en el nudo B, sobre un apoyo móvil, con la barra 3 calentada
    fuente: >-
      Propuesta A8 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (las ecuaciones de B resueltas a
      mano, el alargamiento de la barra 1 calculado con su axil y proyectando
      el movimiento de B, y la reacción del apoyo móvil). El enunciado no da
      ni el material ni la sección de las barras: se toman iguales en las
      tres, y lo dice la nota. Los nombres B y C, que el original no
      escribe, son nuestros. La figura está redibujada con las cotas del
      original.
    nivel: practica
    antes:
      idea: |
        B está sobre un apoyo móvil: solo puede moverse en horizontal. Con ese
        único movimiento se escriben los tres alargamientos, y la reacción del
        apoyo no entra en la ecuación horizontal.
      formula: |
        $$
        \Delta L = \vec u\cdot\vec e
        $$

        Lo que se alarga una barra con un extremo fijo: el desplazamiento del
        otro extremo, proyectado sobre la dirección de la barra contada desde
        su apoyo (ec. 8.12).
      reconocer: |
        Antes de las cuentas, escribe la dirección de cada barra desde su otro
        extremo hasta B.
    enunciado: |
      En la estructura articulada de la figura la barra (3) sufre un cambio
      de temperatura $\Delta T$. Calcula la fuerza axial que sufre cada
      barra.

