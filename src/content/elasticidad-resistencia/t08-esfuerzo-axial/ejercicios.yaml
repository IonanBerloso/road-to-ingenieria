      <figcaption>

      Redibujada del enunciado. El original no numera las barras: aquí la (1)
      es la que va de D a B, y la (2), la que va de D al último nudo del
      cordón de arriba, algo antes de la vertical de C. Las cuentas toman ese
      nudo en la vertical de C (ver las notas).

      </figcaption>
      </figure>

      **Notas nuestras.** La celosía se toma como una pieza rígida,
      articulada en A. La figura no acota ni el canto ni dónde se une la barra
      2, y no está a escala: aquí se usan solo las cotas. El canto se
      desprecia, B queda en la recta AC a $a$ de A, y el extremo de la barra
      2, en la vertical de C, a $2a$. Con el canto y el nudo tal como están
      dibujados, las dos fuerzas saldrían algo menores. Las dos barras tienen
      el mismo $EA$. Las fuerzas van en unidades de $P$, positivas a
      tracción.
    pide: >-
      Los axiles de las barras 1 y 2, en unidades de P, y, por el camino, un
      cociente que sale de la geometría.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuaciones hay para las dos fuerzas?
        opciones:
          - texto: La de momentos en A y una de compatibilidad, porque los dos alargamientos salen del mismo giro de la celosía
            correcta: true
            mensaje: |
              Eso es. $N_1$, $N_2$ y las dos reacciones de A son cuatro
              incógnitas para tres ecuaciones; las reacciones no entran en los
              momentos en A, que dejan una ecuación para dos fuerzas. La que
              falta es de compatibilidad: la celosía gira un ángulo pequeño θ
              alrededor de A, y cada barra se alarga lo que ese giro lleva su
              extremo en su dirección.
          - texto: Las tres del equilibrio de la celosía, que es isostática
            mensaje: |
              Son cuatro incógnitas, $N_1$, $N_2$ y las dos reacciones de la
              articulación A, para tres ecuaciones. Una pieza articulada con
              dos barras es hiperestática de grado uno.
          - texto: La de momentos en A y $N_1 = N_2$, porque las dos barras son iguales
            mensaje: |
              Iguales en material y sección, pero no en longitud ni en
              dirección, y su extremo no se mueve lo mismo. El mismo $EA$ no
              quiere decir la misma fuerza.
          - texto: La de momentos en A y $\Delta L_1 = \Delta L_2$, porque las dos salen de D
            mensaje: |
              Comparten D, que no se mueve, pero el otro extremo de cada una
              está en un punto distinto de la celosía: el de la 2, el doble de
              lejos de A, baja el doble.

      - tipo: calcular
        titulo: La razón entre los alargamientos
        pregunta: |
          Con la celosía girada un ángulo pequeño θ alrededor de A, ¿cuánto
          vale $\Delta L_2/\Delta L_1$?
        respuesta:
          tipo: numero
          valor: '1.2649'
          tolerancia: 0.002
          formato: un número, ΔL2 dividido entre ΔL1
        distractores:
          - valor: '2'
            mensaje: |
              Es la razón entre lo que bajan los dos extremos, $2a\theta$ y
              $a\theta$. Cada barra se alarga solo la proyección de ese
              descenso sobre ella, y las dos van inclinadas distinto.
          - valor: '1'
            mensaje: |
              Es suponer que las dos se alargan igual porque salen de D. El
              otro extremo de cada una baja distinto, y cada una lo ve con su
              ángulo.
          - valor: '2.5298'
            mensaje: |
              Has proyectado el descenso del extremo de la 2 con el coseno de
              su ángulo con la horizontal, $2/\sqrt{5}$. El descenso es
              vertical, y su componente a lo largo de la barra va con el seno,
              $1/\sqrt{5}$.
        pista: |
          B baja $a\theta$ y el extremo de la 2, $2a\theta$. La 1 va de D a B
          con dirección $(1, -1)/\sqrt{2}$; la 2, de D a su extremo, con
          $(2, -1)/\sqrt{5}$.
        desarrollo: |
          $$
          \Delta L_1 = \frac{a\theta}{\sqrt{2}}
          \qquad
          \Delta L_2 = \frac{2a\theta}{\sqrt{5}}
          \qquad
          \frac{\Delta L_2}{\Delta L_1} = \frac{2\sqrt{2}}{\sqrt{5}} = 1{,}2649
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.4058'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '1.0879'
            mensaje: |
              Has tomado como alargamiento de cada barra lo que baja su
              extremo, $a\theta$ y $2a\theta$, sin proyectar; o has puesto $N$
              proporcional a $\Delta L$ sin dividir entre la longitud, que da
              lo mismo. Cada barra se alarga solo la componente del descenso en
              su dirección, y la 1 mide $a\sqrt{2}$ y la 2, $a\sqrt{5}$.
          - valor: '1.2488'
            mensaje: |
              Es $N_1 = N_2$, el reparto de dos barras iguales. Son iguales en
              material y sección, no en longitud ni en lo que se alargan.
          - valor: '1.5713'
            mensaje: |
              Has puesto $\Delta L_1 = \Delta L_2$. Comparten D, pero el
              extremo de la 2 está el doble de lejos de A y baja el doble.
          - valor: '0.7692'
            mensaje: |
              Has tomado como brazo de cada barra la distancia horizontal de su
              extremo a A, $a$ y $2a$. El brazo es la distancia de A a la recta
              de la barra: $a/\sqrt{2}$ la 1 y $2a/\sqrt{5}$ la 2.
        pista: |
          Con $L_1 = a\sqrt{2}$ y $L_2 = a\sqrt{5}$, $N_1 = EA\theta/2$ y
          $N_2 = 2EA\theta/5$. En los momentos en A, el brazo de cada barra es
          la distancia de A a su recta.
        desarrollo: |
          $$
          N_1\,\frac{a}{\sqrt{2}} + N_2\,\frac{2a}{\sqrt{5}} = P\cdot 2a
          \;\Longrightarrow\;
          EA\theta\left(\frac{1}{2\sqrt{2}} + \frac{4}{5\sqrt{5}}\right) = 2P
          $$

          $$
          EA\theta = 2{,}8117\,P
          \qquad
          N_1 = \frac{EA\theta}{2} = 1{,}4058\,P
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.1247'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '1.3760'
            mensaje: |
              Has tomado como alargamiento de cada barra lo que baja su
              extremo, sin proyectar; o has puesto $N$ proporcional a
              $\Delta L$ sin dividir entre la longitud, que da lo mismo. La 1
              mide $a\sqrt{2}$ y la 2, $a\sqrt{5}$: con eso la 2 se lleva más de
              lo que le toca.
          - valor: '1.2488'
            mensaje: |
              Es $N_1 = N_2$, el reparto de dos barras iguales. Mismo $EA$ no
              es misma fuerza: la 2 es más larga y se alarga distinto.
          - valor: '0.9938'
            mensaje: |
              Has puesto $\Delta L_1 = \Delta L_2$. El extremo de la 2 está el
              doble de lejos de A y baja el doble.
          - valor: '2.2361'
            mensaje: |
              Es lo que llevaría la barra 2 sola: con los momentos en A,
              $N_2 \cdot 2a/\sqrt{5} = 2Pa$ da $\sqrt{5}\,P$. La 1 también se
              alarga con el giro y se lleva parte del momento.
          - valor: '0.6154'
            mensaje: |
              Has tomado como brazo de cada barra la distancia horizontal de su
              extremo a A, $a$ y $2a$. El brazo es la distancia de A a la recta
              de la barra: $a/\sqrt{2}$ la 1 y $2a/\sqrt{5}$ la 2.
        pista: |
          De la compatibilidad, $N_2 = \tfrac{4}{5}N_1$.
        desarrollo: |
          $$
          N_2 = \frac{2EA\theta}{5} = \frac{4}{5}\,N_1 = 1{,}1247\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Son cuatro incógnitas, $N_1$, $N_2$ y las dos reacciones de A, y
              tres ecuaciones: falta una de compatibilidad.
          - texto: >-
              La celosía gira θ alrededor de A: B baja $a\theta$ y el extremo
              de la 2, $2a\theta$.
          - texto: >-
              Cada barra se alarga la proyección de ese descenso:
              $\Delta L_1 = a\theta/\sqrt{2}$ y $\Delta L_2 = 2a\theta/\sqrt{5}$.
          - texto: >-
              Con $L_1 = a\sqrt{2}$ y $L_2 = a\sqrt{5}$, $N_1 = EA\theta/2$ y
              $N_2 = 2EA\theta/5$.
          - texto: >-
              Los momentos en A, con brazos $a/\sqrt{2}$ y $2a/\sqrt{5}$, dan
              $N_1 = 1{,}4058\,P$ y $N_2 = 1{,}1247\,P$.
          - texto: >-
              Como el material y la sección de las dos barras son iguales, las
              dos llevan la misma fuerza.
            trampa: true
            mensaje: |
              El mismo $EA$ da la misma fuerza solo con el mismo $\Delta L/L$.
              Aquí la 2 es más larga y se alarga distinto: $N_2 = 4N_1/5$.
    resolucion: |
      **Lo que la estática no cierra.** Origen en A, $x$ hacia la derecha e
      $y$ hacia arriba: $D = (0, a)$, $B = (a, 0)$ y el extremo de la barra 2,
      en la vertical de C, $E = (2a, 0)$. La celosía es rígida y está
      articulada en A, y la sujetan las dos barras, que salen de D. Son
      cuatro incógnitas, $N_1$, $N_2$ y las dos reacciones de A, para tres
      ecuaciones: hiperestática de grado uno. Con las dos barras a tracción,
      tirando de la celosía hacia D, momentos en A:

      $$
      N_1\,\frac{a}{\sqrt{2}} + N_2\,\frac{2a}{\sqrt{5}} = P \cdot 2a
      $$

      El brazo de cada barra es la distancia de A a su recta: la 1 pasa por D
      y B, a $a/\sqrt{2}$ de A; la 2 pasa por D y E, a $2a/\sqrt{5}$.

      **Compatibilidad.** P hace girar la celosía un ángulo pequeño θ, en
      sentido horario, alrededor de A. Un punto de la recta AC a una
      distancia $x$ de A baja $x\theta$ (apuntes, apartado 8.4): B baja
      $a\theta$ y E, $2a\theta$. Cada barra se alarga la proyección de ese
      descenso sobre su dirección, desde D (ec. 8.12); la 1 va hacia
      $(1, -1)/\sqrt{2}$ y la 2, hacia $(2, -1)/\sqrt{5}$:

      $$
      \Delta L_1 = \frac{a\theta}{\sqrt{2}}
      \qquad
      \Delta L_2 = \frac{2a\theta}{\sqrt{5}}
      \qquad
      \frac{\Delta L_2}{\Delta L_1} = \frac{2\sqrt{2}}{\sqrt{5}} = 1{,}2649
      $$

      **Ley de cada barra** (ec. 8.9), con $L_1 = a\sqrt{2}$ y
      $L_2 = a\sqrt{5}$:

      $$
      N_1 = \frac{EA\,\Delta L_1}{a\sqrt{2}} = \frac{EA\theta}{2}
      \qquad
      N_2 = \frac{EA\,\Delta L_2}{a\sqrt{5}} = \frac{2EA\theta}{5}
      $$

      **Las fuerzas.** En los momentos,
      $EA\theta\left(\tfrac{1}{2\sqrt{2}} + \tfrac{4}{5\sqrt{5}}\right) = 2P$:

      $$
      N_1 = \frac{100}{25\sqrt{2} + 16\sqrt{5}}\,P = 1{,}4058\,P
      \qquad
      N_2 = \frac{4}{5}\,N_1 = 1{,}1247\,P
      $$

      Las dos a tracción. La 1 lleva más que la 2 aunque esté más cerca de
      A: con el mismo giro, la 2 se estira menos por unidad de longitud,
      $2\theta/5$ frente a $\theta/2$.

      **Comprobación por otro camino.** La reacción horizontal de A sale sin
      las barras: las dos pasan por D, así que en los momentos en D solo
      entran P y esa reacción, que está a una distancia $a$:
      $R_x\,a = P \cdot 2a$, y $R_x = 2P$ hacia la derecha. Con las fuerzas de
      las barras, sus componentes horizontales, que tiran hacia D, tienen que
      sumar lo mismo; en unidades de $P$,
      $N_1/\sqrt{2} + 2N_2/\sqrt{5} = 0{,}9941 + 1{,}0059 = 2{,}0000$. Eso
      comprueba el equilibrio. Y la compatibilidad:
      $1{,}1247/1{,}4058 = 0{,}8000$, que es $(2/5)/(1/2)$, lo que se estira
      cada una por unidad de longitud y de giro.

  # ── Propuesta A4 de clase · el cono que cuelga con su peso.
  - id: ejerm8-cla4-el-cono-que-cuelga-con-su-peso
    titulo: El cono que cuelga con su propio peso
    fuente: >-
      Propuesta A4 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8 con la sección variable, y el cono partido
      en 2000 tramos con el peso de cada rebanada en sus nudos) y comprobada
      por un segundo camino (el peso de lo que cuelga sumado rebanada a
      rebanada y la fórmula con el peso específico). Los datos dicen A y la
      figura, A₀: es el área de la base. La «v» de los datos, el coeficiente
      de Poisson, no hace falta para el alargamiento. La figura está
      redibujada.
    nivel: practica
    enunciado: |
      Calcula el alargamiento de un cono que solo sufre su peso propio.
      Datos: Q,L,A,E,v

      <figure class="figura-examen">
      <svg viewBox="120 12 210 168" role="img" width="210" height="168" aria-labelledby="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-t ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-d">
      <title id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-t">Un cono colgado del techo por su base, con el vértice hacia abajo</title>
      <desc id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-d">Un techo rayado del que cuelga un cono invertido: la base, de área A₀, pegada al techo, y el vértice abajo. A su izquierda, una cota vertical L del techo al vértice. Una flecha curva señala la base con el rótulo A₀.</desc>
      <defs><pattern id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="150" y="20" width="140" height="12" fill="url(#ejerm8-cla4-el-cono-que-cuelga-con-su-peso-r)"/><line x1="150" y1="32" x2="290" y2="32" stroke="var(--ink)" stroke-width="1.4"/>
      <polygon points="170,32 270,32 220,172" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="152" y1="34" x2="152" y2="172" stroke="var(--faint)" stroke-width="0.9"/><polygon points="152,172 149.6,166 154.4,166" fill="var(--faint)"/><polygon points="152,34 154.4,40 149.6,40" fill="var(--faint)"/>
      <text x="142" y="106" font-size="12" fill="var(--ink)" font-style="italic" text-anchor="end">L</text>
      <path d="M300 66 Q248 72 244 42" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <polygon points="244,36 247.42,42.64 242.26,43.26" fill="var(--ink)"/>
      <text x="304" y="70" font-size="12" fill="var(--ink)" font-style="italic">A₀</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: el cono cuelga del techo por su base, de área
      A₀, con el vértice hacia abajo.

      </figcaption>
      </figure>

      **Notas nuestras.** $Q$ es el peso del cono, $L$ su altura y $A_0$ el
      área de la base, que es la $A$ de los datos. Los axiles van en unidades
      de $Q$, las tensiones en unidades de $Q/A_0$ y el alargamiento en
      unidades de $QL/(EA_0)$.
    pide: >-
      El axil y la tensión a media altura del cono, en unidades de Q y de
      Q/A₀, y el alargamiento del cono, en unidades de QL/(EA₀).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué sección del cono es mayor la tensión?
        opciones:
          - texto: En la base, junto al techo, porque hacia arriba el axil crece más deprisa que el área
            correcta: true
            mensaje: |
              Eso es. A una distancia $x$ del vértice, lo que cuelga por
              debajo es un cono semejante al entero: su peso va con $x^{3}$ y
              el área de la sección, con $x^{2}$. La tensión, su cociente,
              crece en proporción a $x$.
          - texto: En todas igual, porque el axil y el área crecen a la vez hacia arriba
            mensaje: |
              Crecen los dos, pero no igual: el peso de lo que cuelga va con
              el volumen del cono pequeño, $x^{3}$, y el área con $x^{2}$. La
              tensión crece con $x$.
          - texto: En el vértice, porque allí la sección se hace cero
            mensaje: |
              La sección se hace cero, pero el peso de lo que cuelga por
              debajo se hace cero más deprisa, con $x^{3}$ frente a $x^{2}$. En
              el vértice la tensión es cero.

      - tipo: calcular
        titulo: El axil a media altura
        pregunta: |
          A media altura, a $L/2$ del vértice, ¿cuánto vale $N$, en unidades
          de $Q$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.002
          formato: un número, N dividido entre Q
        distractores:
          - valor: '0.5'
            mensaje: |
              Es la mitad del peso, como en una barra de sección constante.
              Por debajo de media altura cuelga un cono semejante de altura
              $L/2$, y su volumen va con el cubo de la altura.
          - valor: '0.25'
            mensaje: |
              Has tomado el peso proporcional al área de la sección,
              $(x/L)^{2}$. Es proporcional al volumen del cono de debajo, que va
              con el cubo de su altura.
          - valor: '0.875'
            mensaje: |
              Es el peso de lo que hay por encima de media altura. La sección
              sostiene lo que cuelga por debajo.
        pista: |
          Lo que cuelga por debajo de media altura es un cono semejante al
          entero, de altura $L/2$: su peso va con el cubo de la altura.
        desarrollo: |
          $$
          N\!\left(\tfrac{L}{2}\right) = Q\left(\tfrac{1}{2}\right)^{3} = 0{,}125\,Q
          $$

      - tipo: calcular
        titulo: La tensión a media altura
        pregunta: |
          ¿Y la tensión a media altura, en unidades de $Q/A_0$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, σ dividido entre Q/A0
        distractores:
          - valor: '0.125'
            mensaje: |
              Has dividido el axil entre el área de la base, $A_0$. A media
              altura el radio es la mitad, y la sección, la cuarta parte.
          - valor: '2'
            mensaje: |
              Has tomado el axil de una barra de sección constante, $Q/2$, y lo
              has dividido entre la sección del cono a esa altura, $A_0/4$. El
              axil del cono a media altura es mucho menor.
          - valor: '0.25'
            mensaje: |
              Has tomado la sección proporcional al radio. A media altura el
              radio es la mitad y el área, la cuarta parte.
        pista: |
          A media altura la sección es $A_0/4$.
        desarrollo: |
          $$
          \sigma_x = \frac{N}{A} = \frac{0{,}125\,Q}{0{,}25\,A_0} = 0{,}5\,\frac{Q}{A_0}
          $$

          Ojo con una coincidencia: una barra de sección $A_0$ que pesara lo
          mismo, $Q$, tendría a media altura $0{,}5\,Q$ sobre $A_0$, y la
          misma tensión. Sale igual por los dos lados, pero el axil y el área
          del cono son los de arriba, no esos.

      - tipo: calcular
        titulo: El alargamiento del cono
        pregunta: |
          ¿Cuánto se alarga el cono, en unidades de $QL/(EA_0)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre QL/(EA0)
        distractores:
          - valor: '1.5'
            mensaje: |
              Es $\rho g L^{2}/(2E)$, la fórmula de la barra de sección
              constante, con el peso específico del cono,
              $\rho g = 3Q/(A_0L)$. En el cono la tensión a una distancia $x$
              del vértice es $\rho g x/3$, un tercio de la de la barra.
          - valor: '0.1667'
            mensaje: |
              Has sacado el peso específico con el volumen de un cilindro,
              $\rho g = Q/(A_0L)$. El volumen del cono es $A_0L/3$.
          - valor: '0.25'
            mensaje: |
              Has dejado el área de la base en toda la altura: con
              $N = Q(x/L)^{3}$ y $A = A_0$ sale $QL/(4EA_0)$. La sección se
              estrecha hacia abajo, y eso sube la tensión.
          - valor: '1'
            mensaje: |
              Es $QL/(EA_0)$, el alargamiento de una barra de sección $A_0$
              con todo el peso colgado del extremo. Al cono el peso le cuelga
              repartido, y la mayor parte cerca de la base.
          - valor: '0.3333'
            mensaje: |
              Has tomado la sección proporcional al radio, $A_0\,x/L$. Va con
              el cuadrado del radio: $A = A_0\,(x/L)^{2}$.
        pista: |
          El alargamiento es la ec. 8.8 sin $\varepsilon_0$,
          $\Delta L = \int_0^L N/(EA)\,dx$, y aquí
          $N/A = \sigma_x = Qx/(A_0L)$.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{N}{EA}\,dx = \int_0^L \frac{Q\,x}{E A_0 L}\,dx
          = \frac{QL}{2EA_0} = 0{,}5\,\frac{QL}{EA_0}
          $$

          Es el mismo número que daría una barra de sección $A_0$ que pesara
          $Q$, porque sección a sección las dos tienen la misma tensión. Con el
          mismo material no: el cono pesa un tercio de esa barra, y se alarga
          un tercio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que cuelga por debajo de una sección a una distancia $x$ del
              vértice es un cono semejante: $N = Q(x/L)^{3}$.
          - texto: >-
              La sección a esa altura es $A = A_0(x/L)^{2}$.
          - texto: >-
              La tensión, $\sigma_x = N/A = Qx/(A_0L)$, crece desde cero en el
              vértice hasta $Q/A_0$ en la base.
          - texto: >-
              Integrando $\sigma_x/E$ desde el vértice hasta la base,
              $\Delta L = QL/(2EA_0)$.
          - texto: >-
              Con $Q = \rho g A_0 L/3$, es $\rho g L^{2}/(6E)$.
          - texto: >-
              Por su peso, cualquier pieza colgada se alarga
              $\rho g L^{2}/(2E)$: la forma de la sección no cuenta.
            trampa: true
            mensaje: |
              Esa es la de la sección constante. En el cono la tensión a una
              distancia $x$ del vértice es $\rho g x/3$, un tercio de la de la
              barra, y el alargamiento sale un tercio: $\rho g L^{2}/(6E)$.
    resolucion: |
      **El axil.** Se mide $x$ desde el vértice hacia arriba. La sección a la
      altura $x$ es un círculo de radio proporcional a $x$, así que su área es
      $A(x) = A_0\,(x/L)^{2}$. Lo que cuelga por debajo de ella es un cono
      semejante al entero, de altura $x$: su volumen, y con él su peso, va con
      el cubo de la altura,

      $$
      N(x) = Q\left(\frac{x}{L}\right)^{3}
      $$

      **La tensión** (ec. 8.5) crece en proporción a la distancia al
      vértice:

      $$
      \sigma_x = \frac{N}{A} = \frac{Q}{A_0}\,\frac{x}{L}
      $$

      Cero en el vértice y $Q/A_0$ en la base, que es donde el cono está más
      cargado. A media altura, $N = 0{,}125\,Q$ sobre una sección $A_0/4$:
      $\sigma_x = 0{,}5\,Q/A_0$.

      **El alargamiento.** Con $N$ y $A$ variables, la ec. 8.8 sin término
      térmico:

      $$
      \Delta L = \int_0^L \frac{N}{EA}\,dx = \int_0^L \frac{Q\,x}{E A_0 L}\,dx = \frac{QL}{2EA_0}
      $$

      Con el peso específico: el volumen del cono es $A_0L/3$, así que
      $Q = \rho g A_0L/3$ y $\Delta L = \rho g L^{2}/(6E)$, un tercio de lo
      que se alarga por su peso una barra de sección constante de la misma
      altura y el mismo material.

      Una coincidencia que conviene ver para no fiarse de ella: en unidades
      de $Q$, el cono se alarga lo mismo que una barra de sección $A_0$ que
      pesara también $Q$, porque sección a sección las dos tienen la misma
      tensión, $Qx/(A_0L)$. Esa barra sería de un material tres veces más
      ligero. Con el mismo material, que es lo que da $\rho g$, el cono se
      alarga un tercio.

      **Comprobación por otro camino.** El axil también sale sumando el peso
      de las rebanadas de debajo, $N(L/2) = \int_0^{L/2} \rho g\,A(x)\,dx$
      con $\rho g = 3Q/(A_0L)$, y da el mismo $0{,}125\,Q$. Y el motor, con el
      cono partido en 2000 tramos de sección constante y el peso de cada
      rebanada en sus nudos, da $0{,}5000\,QL/(EA_0)$ de alargamiento.

