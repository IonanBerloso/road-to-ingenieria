    pide: >-
      La tensión del carril a −10 °C, en MPa, y las temperaturas a las que
      llega a la tracción admisible y a la compresión admisible, en °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da ni la longitud del carril ni su sección. ¿Se
          puede calcular su tensión?
        opciones:
          - texto: 'Sí: si no puede cambiar de longitud, $\sigma L/E + \alpha\,\Delta T\,L = 0$, y la $L$ se va; la sección solo haría falta para la fuerza'
            correcta: true
            mensaje: |
              Eso es. Es la barra que no puede alargarse (apuntes, ec. 8.9,
              p. 7, igualada a cero): $\sigma = -E\alpha\,\Delta T$. Ni la
              longitud ni la sección entran en la tensión. Lo que hay que medir
              bien es $\Delta T$, desde la temperatura a la que se soldó.
          - texto: 'No: sin la longitud no se sabe cuánto querría acortarse el carril, ni cuánto hay que estirarlo'
            mensaje: |
              Lo que querría acortarse, $\alpha\,\Delta T\,L$, crece con $L$,
              pero lo que hay que estirarlo para devolverlo a su longitud
              también: $\sigma L/E$. Las dos llevan $L$, y se va. Un carril de
              10 m y uno de 10 km, soldados igual, tienen la misma tensión.
          - texto: 'Sí: $\sigma = -E\alpha\,T$, con la temperatura que tenga el carril'
            mensaje: |
              La fórmula pide el incremento de temperatura desde la de
              soldadura, cuando no tenía tensión: $\Delta T = T - 20$. Con la
              temperatura sin más, a 20 °C el carril tendría tensión, y no la
              tiene.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **un trozo cualquiera del carril,
          lejos de sus extremos**.
        comprueba:
          - punto: |
              **$N$ en los dos cortes, tirando del trozo hacia fuera.**
            porque: |
              Se supone a tracción: es lo que el resto del carril hace sobre el
              trozo.
          - punto: |
              **El mismo $N$ en los dos cortes.**
            porque: |
              El trozo está en equilibrio, y lejos de los extremos las
              traviesas no le hacen fuerza a lo largo.
          - punto: |
              **La temperatura, escrita, sin flecha.**
            porque: |
              No es una fuerza: entra en el alargamiento, $\alpha\Delta T\,L$.
        figura: |
          <svg viewBox="0 72 240 62" role="img" width="240" height="62" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Un trozo del carril, lejos de sus extremos</title>
            <desc id="dsl-d">Un trozo de carril, una banda horizontal de longitud L, cortado por los dos lados; a trazos, el carril que sigue. En cada corte, N tirando hacia fuera. Encima, el rótulo delta T.</desc>
