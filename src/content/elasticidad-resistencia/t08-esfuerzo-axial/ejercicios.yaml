      <line x1="175" y1="120" x2="221" y2="120" stroke="var(--d2)" stroke-width="1.8"/><polygon points="228,120 220,123.5 220,116.5" fill="var(--d2)"/>
      <path d="M195.98 105 A30 30 0 0 1 200 120" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <text x="177" y="68" font-size="12" font-style="italic" fill="var(--d2-tinta)">P</text>
      <text x="226" y="137" font-size="12" fill="var(--d2-tinta)">2<tspan font-style="italic">P</tspan></text>
      <text x="205" y="116" fill="var(--ink)" font-size="11">30°</text>
      <text x="128" y="136" font-size="12" fill="var(--ink)">1</text>
      <text x="163" y="164" font-size="12" fill="var(--ink)" text-anchor="end">2</text>
      <text x="196" y="94" font-size="12" fill="var(--ink)" text-anchor="end">3</text>
