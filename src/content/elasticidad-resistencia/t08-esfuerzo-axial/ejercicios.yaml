      <svg viewBox="0 20 330 185" role="img" width="330" height="185" aria-labelledby="ejerm8-cl8-1-la-viga-con-una-barra-calentada-fig-t ejerm8-cl8-1-la-viga-con-una-barra-calentada-fig-d">
