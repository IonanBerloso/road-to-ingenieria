      <line x1="294" y1="136" x2="294" y2="164" stroke="var(--d2)" stroke-width="1.1"/><polygon points="294,169 291.4,163 296.6,163" fill="var(--d2)"/>
      <text x="210" y="130" font-size="12" text-anchor="middle" font-style="italic" fill="var(--d2-tinta)">q<tspan baseline-shift="sub" font-size="8">0</tspan></text>
      <text x="50" y="192" font-size="12" fill="var(--ink)" text-anchor="end">A</text>
      <text x="111" y="167" font-size="12" fill="var(--ink)" text-anchor="end">B</text>
      <text x="312" y="174" font-size="12" fill="var(--ink)">C</text>
      <text x="72" y="124" font-size="12" fill="var(--ink)">D</text>
      <text x="312" y="66" font-size="12" fill="var(--ink)">E</text>
      <text x="48" y="144" font-size="12" fill="var(--ink)" text-anchor="end">1</text>
      <text x="312" y="104" font-size="12" fill="var(--ink)">2</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la barra 1 va de A al techo en D y la 2, de
      C al techo en E; B es la articulación fija, bajo la viga.

      </figcaption>
      </figure>

      **Notas nuestras.** Las dos barras tienen el mismo $E$ y la misma $A$,
      que es lo que dice el «en función de». Cada fuerza se escribe como
      $N = a\,q_0L + b\,EA\alpha\Delta T$, positiva a tracción, y en los
      pasos se pregunta por los coeficientes. $\Delta T > 0$ es un
      calentamiento.
    pide: >-
      Los axiles de las dos barras, con su signo, como coeficientes de q0L y
      de EAαΔT; el ΔT que deja la viga horizontal, en unidades de
      q0L/(EAα), y los axiles con él.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga gira un ángulo pequeño θ alrededor de B, con A a un lado y C
          al otro. ¿Qué relación hay entre los alargamientos de las dos
          barras?
        opciones:
          - texto: $\Delta L_2 = -3\,\Delta L_1$, porque si C baja, A sube, y C está el triple de lejos de B
            correcta: true
            mensaje: |
              Eso es. A y C están a los dos lados de la articulación: cuando la
              viga gira, uno baja y el otro sube. Las barras están encima, así
              que la del punto que baja se alarga y la otra se acorta; y la de
              C se mueve el triple, porque BC = 3AB.
          - texto: $\Delta L_2 = 3\,\Delta L_1$, porque C se mueve el triple que A
            mensaje: |
              El triple sí, pero en sentido contrario: B está entre A y C. Con
              los dos alargamientos del mismo signo, la barra 1 sale
              traccionada, cuando la viga la empuja hacia arriba.
          - texto: $\Delta L_1 = \Delta L_2$, porque la viga es rígida
            mensaje: |
              Rígida no es inmóvil: la viga está articulada en B y gira. Cada
              punto se mueve en proporción a su distancia a B, y a los dos
              lados con signo contrario.
          - texto: $\Delta L_2 = -\Delta L_1/3$, porque A está más cerca de B
            mensaje: |
              Tienes la proporción al revés. Se mueve más el que está más
              lejos de la articulación: C, a $3L$, se mueve el triple que A, a
              $L$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la viga sin la articulación y
          con las dos barras cortadas**.
        comprueba:
          - punto: |
              **Las dos barras cortadas, tirando de la viga hacia arriba.**
            porque: |
              Se suponen a tracción; el signo dirá cuál está comprimida.
          - punto: |
              **En B, dos componentes.**
            porque: |
              Es una articulación fija: impide moverse, no girar.
          - punto: |
              **La carga sobre BC, y la temperatura de la barra 1 sin flecha.**
            porque: |
              Para los momentos en B, la carga vale $3q_0L$ en el centro de BC;
              la temperatura no es una fuerza, y entra en el alargamiento de la
              barra 1.
        figura: |
          <svg viewBox="0 30 290 150" role="img" width="290" height="150" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La viga rígida, sin la articulación y con las dos barras cortadas</title>
            <desc id="dsl-d">La viga rígida ABC, horizontal, sin la articulación de B, que queda en tenue y a trazos debajo de ella. En A y en C, los trozos cortados de las barras 1 y 2, y de cada uno una fuerza hacia arriba, N 1 y N 2; junto a la barra 1, el rótulo delta T. En B, una fuerza horizontal y una vertical. Sobre BC, la carga repartida q cero. Cotas: L de A a B y 3L de B a C.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M40 106 H240 V114 H40 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
