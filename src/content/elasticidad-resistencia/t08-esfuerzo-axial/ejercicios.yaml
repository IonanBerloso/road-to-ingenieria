      - **En cada corte, $N$**, supuesto a tracción: lo que el resto del
        carril hace sobre el trozo.
      - **Lejos de los extremos**, todo el carril está igual, y las traviesas
        no le hacen fuerza a lo largo: el $N$ es el mismo en los dos cortes.
      - **La temperatura** entra en el alargamiento, no como una fuerza. Al
        enfriarse, el carril quiere acortarse y no le dejan: queda a tracción.
        Al calentarse, queda comprimido. El signo se sabe antes de ninguna
        cuenta.

      **2. Incógnitas.** La tensión $\sigma = N/A$ a −10 °C, y las
      temperaturas a las que llega a los dos límites.

      **3. Ecuaciones.** El trozo conserva su longitud. Su alargamiento, el
      elástico más el térmico (ec. 8.9, p. 7, con
      $\varepsilon_0 = \alpha\,\Delta T$, ec. 8.3, p. 5, y p. 6), vale cero:

      $$
      \frac{\sigma\,L}{E} + \alpha\,\Delta T\,L = 0
      \quad\Longrightarrow\quad
      \sigma = -E\alpha\,\Delta T
      $$

      $\Delta T$ se mide desde los 20 °C de la soldadura, cuando el carril no
      tenía tensión. Con $E = 2{,}1 \cdot 10^{5}$ MPa,
      $E\alpha = 2{,}1 \cdot 10^{5} \cdot 12 \cdot 10^{-6} = 2{,}52$ MPa por
      grado.

      **4. Resultados.** **a) A −10 °C.** $\Delta T = -10 - 20 = -30$ °C:

      $$
      \sigma = -2{,}52 \cdot (-30) = 75{,}6\ \text{MPa}
      $$

      a tracción.

      **b) La tracción admisible.** Con $\sigma = 120$ MPa:

      $$
      \Delta T = -\frac{120}{2{,}52} = -47{,}62
      \qquad
      T = 20 - 47{,}62 = -27{,}62\ \text{°C}
      $$

      **c) La compresión admisible.** Con $\sigma = -80$ MPa:

      $$
      \Delta T = \frac{80}{2{,}52} = 31{,}75
      \qquad
      T = 20 + 31{,}75 = 51{,}75\ \text{°C}
      $$

      **5. Comprobación.** Quita la sujeción de un trozo de 18 m de carril. A
      −10 °C se acortaría libre
      $\alpha\,\Delta T\,L = 12 \cdot 10^{-6} \cdot 30 \cdot 18\,000 = 6{,}48$ mm,
      sin tensión. Devolverlo a su longitud pide estirarlo esos 6,48 mm:

      $$
      \frac{\sigma\,L}{E} = 6{,}48
      \;\Longrightarrow\;
      \sigma = \frac{6{,}48 \cdot 2{,}1 \cdot 10^{5}}{18\,000} = 75{,}6\ \text{MPa}
      $$

      la misma tensión, y con un trozo de otra longitud saldría igual. El
      motor del curso (`axial.ts`, una barra fija por los dos extremos con
      $\varepsilon_0 = \alpha\,\Delta T$) da 75,6 MPa con dos longitudes y dos
      secciones distintas, y la bisección sobre él encuentra los 120 MPa a
      $-27{,}62$ °C y los $-80$ MPa a $51{,}75$ °C.

      **Lo que dice el resultado.** La $L$ se va: da igual el trozo que se
      mire y lo largo que sea el carril. La sección tampoco hace falta; solo
      la pediría la fuerza. Entre $-27{,}62$ °C y $51{,}75$ °C, el carril está
      dentro de sus dos límites.

      **Para el escalón siguiente.** En la cuestión de 2016-2017, la siguiente
      del escalón, el alambre no empieza sin tensión: a 20 °C ya lleva 40 MPa.
