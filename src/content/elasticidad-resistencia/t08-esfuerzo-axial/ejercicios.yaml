      **Notas nuestras.** La barra 2 y el resorte se unen a BD en su
      extremo D, por debajo, en el mismo punto al que llega la barra 1 por
      encima: así casan las longitudes del texto. El canto de BD se
      desprecia. El enunciado no da el material ni la sección: se toman
      iguales en las barras 1 y 2. La $L$ de los datos es la longitud de la
      barra 1. Los axiles se preguntan
      en unidades de $P$, positivos a tracción, y el movimiento vertical de
      D, positivo hacia abajo, en unidades de $PL/(EA)$.
    pide: >-
      El movimiento vertical de D, en unidades de PL/(EA), y los axiles de
      las barras 1 y 2, en unidades de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          BD gira un ángulo pequeño alrededor de B, y D se mueve en vertical
          $v$, positivo hacia abajo. ¿Cuánto se alargan las barras y el
          resorte?
        opciones:
          - texto: $\Delta L_1 = v\operatorname{sen} 30^{\circ}$ y $\Delta L_2 = -v\cos 30^{\circ}$, y el resorte se acorta $v$
            correcta: true
            mensaje: |
              Eso es. Cada barra se alarga lo que D avanza en su dirección,
              contada desde su apoyo (apuntes, ec. 8.12). La 1 baja de A a D,
              a 30° por debajo de la horizontal: si D baja, se aleja de A, y
              la 1 se alarga $v\operatorname{sen} 30^{\circ}$. La 2 sube de C
              a D, a 30° de la vertical: si D baja, se acerca a C, y la 2 se
              acorta $v\cos 30^{\circ}$. El resorte va de D al suelo, en
              vertical, y se acorta $v$.
          - texto: $\Delta L_1 = v$ y $\Delta L_2 = -v$, y el resorte se acorta $v$
            mensaje: |
              Las barras no son verticales: de lo que baja D, cada una solo
              nota la parte en su dirección. La 1 forma 30° con BD, y la 2,
              30° con la vertical.
          - texto: $\Delta L_1 = v\cos 30^{\circ}$ y $\Delta L_2 = -v\operatorname{sen} 30^{\circ}$, y el resorte se acorta $v$
            mensaje: |
              Has cambiado los ángulos. La 1 forma 30° con la horizontal, y
              la parte vertical de su dirección va con el seno; la 2 forma
              30° con la vertical, y la suya va con el coseno.
          - texto: $\Delta L_1 = -v\operatorname{sen} 30^{\circ}$ y $\Delta L_2 = v\cos 30^{\circ}$, y el resorte se alarga $v$
            mensaje: |
              Están los tres al revés. La 1 cuelga de A, por encima de D: si
              D baja, se aleja de A y la 1 se alarga. La 2 y el resorte están
              por debajo: D se les acerca, y se acortan.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **la barra BD, sin la articulación
          de B y con las dos barras y el resorte cortados**.
        comprueba:
          - punto: |
              **Las dos barras y el resorte cortados, tirando de D hacia su
              apoyo.**
            porque: |
              Se suponen a tracción; el signo dirá cuáles empujan.
          - punto: |
              **En B, una fuerza horizontal y una vertical.**
            porque: |
              La articulación impide que B se mueva, pero no que BD gire.
          - punto: |
              **$P$ hacia abajo, en D.**
            porque: |
              Es la carga del enunciado, el dato.
        figura: |
          <svg viewBox="0 16 240 170" role="img" width="240" height="170" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">La barra BD, sin la articulación y con las barras y el resorte cortados</title>
            <desc id="dsl-d">La barra BD, horizontal, rígida. A trazos, la pared y el resto de la barra 1 hasta A. En D, los trozos cortados de la barra 1, que sube hacia la izquierda a 30 grados de BD, de la barra 2, que baja hacia la izquierda, y del resorte, que baja en vertical; de cada uno, una fuerza que tira de D hacia su apoyo: N 1, N 2 y F. Sobre D, P hacia abajo. En B, una fuerza horizontal y una vertical.</desc>
