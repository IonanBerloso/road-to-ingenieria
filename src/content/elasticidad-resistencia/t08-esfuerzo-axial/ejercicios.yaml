      <text x="165.5" y="252" font-size="15" fill="var(--d2-tinta)" text-anchor="start"><tspan font-style="italic">W</tspan></text>
      <line x1="98" y1="204" x2="144" y2="204" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="104" y1="36" x2="104" y2="204" stroke="var(--faint)" stroke-width="0.9"/>
