ejercicios:
  # ── Ejemplo introductorio nuestro · la barra que no puede alargarse.
  - id: ejerm8-la-barra-entre-dos-paredes
    titulo: La barra de latón entre dos paredes
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una barra de latón de longitud $L = 1{,}5\ \text{m}$ y sección
      $A = 800\ \text{mm}^{2}$ está empotrada por sus dos extremos en dos
      paredes rígidas, y se montó sin ninguna tensión. El latón tiene
      $E = 100\ \text{GPa}$ y un coeficiente de dilatación
      $\alpha = 20 \cdot 10^{-6}$ por grado.

      a) Si no estuviera la pared de la derecha, ¿cuánto se alargaría la
      barra al calentarla 30 °C?

      b) Entre las dos paredes, ¿qué tensión tiene calentada 30 °C?

      c) ¿Y enfriada 25 °C desde la temperatura de montaje?

      <figure>
      <svg viewBox="20 20 330 100" role="img" width="330" height="100" aria-labelledby="ejerm8-la-barra-entre-dos-paredes-fig-t ejerm8-la-barra-entre-dos-paredes-fig-d">
      <title id="ejerm8-la-barra-entre-dos-paredes-fig-t">Una barra entre dos paredes rígidas, a la que se le cambia la temperatura</title>
      <desc id="ejerm8-la-barra-entre-dos-paredes-fig-d">Una barra horizontal de 1,5 m metida entre dos paredes rígidas, empotrada en las dos, sin ningún hueco. Su temperatura cambia en ΔT.</desc>
      <defs><pattern id="ejerm8-la-barra-entre-dos-paredes-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="36" y="34" width="14" height="60" fill="url(#ejerm8-la-barra-entre-dos-paredes-r)"/><line x1="50" y1="34" x2="50" y2="94" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="310" y="34" width="14" height="60" fill="url(#ejerm8-la-barra-entre-dos-paredes-r)"/><line x1="310" y1="34" x2="310" y2="94" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="50" y="56" width="260" height="16" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.3"/>
      <text x="180" y="68" font-size="12" text-anchor="middle" font-style="italic" fill="var(--flag)">ΔT</text>
      <line x1="50" y1="76" x2="50" y2="110" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="310" y1="76" x2="310" y2="110" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="50" y1="104" x2="310" y2="104" stroke="var(--faint)" stroke-width="0.9"/><polygon points="310,104 304,106.4 304,101.6" fill="var(--faint)"/><polygon points="50,104 56,101.6 56,106.4" fill="var(--faint)"/>
      <text x="180" y="99" text-anchor="middle" font-size="11" fill="var(--faint)">L = 1,5 m</text>
      </svg>
      <figcaption>

      La barra toca las dos paredes sin holgura, y a la temperatura de
      montaje no tiene tensión.

      </figcaption>
      </figure>
    pide: >-
      Lo que se alargaría libre calentada 30 °C, en mm, y la tensión de la
      barra entre las paredes calentada 30 °C y enfriada 25 °C, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          A la barra no se le aplica ninguna fuerza: solo cambia su
          temperatura. ¿Qué ecuación cierra el problema?
        opciones:
          - texto: $N L/(EA) + \alpha\,\Delta T\,L = 0$, porque las paredes no se mueven
            correcta: true
            mensaje: |
              Eso es. El alargamiento total, el elástico más el térmico
              (apuntes, ec. 8.9, p. 7), vale cero porque los dos extremos
              están fijos. El equilibrio solo dice que las dos paredes
              empujan lo mismo, no cuánto: hay una incógnita de más, y esta
              es la ecuación que falta.
          - texto: $N = 0$, porque no hay ninguna carga
            mensaje: |
              Eso valdría con la barra suelta por un extremo: se dilataría
              sin tensión. Con las dos paredes, el alargamiento que no puede
              darse se convierte en tensión, aunque nadie empuje desde fuera.
          - texto: $N L/(EA) = \alpha\,\Delta T\,L$, porque la fuerza de las paredes compensa la dilatación
            mensaje: |
              Se compensan, sí, pero eso se escribe con una suma que vale
              cero. Con el igual entre los dos términos, $N$ sale positivo, y
              la barra calentada aparecería estirada en vez de comprimida.

      - tipo: calcular
        titulo: Lo que se alargaría libre
        pregunta: |
          Sin la pared de la derecha, ¿cuánto se alargaría la barra
          calentada 30 °C, en mm?
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.0001
          formato: un número, en mm
        distractores:
          - valor: '0.0009'
            mensaje: |
              Has puesto $L$ en metros: $20 \cdot 10^{-6} \cdot 30 \cdot 1{,}5$
              da el alargamiento en metros. Si lo quieres en mm, $L$ va en
              mm, 1500.
          - valor: '0.0006'
            mensaje: |
              Te has dejado la longitud: $\alpha\,\Delta T$ es una
              deformación, no un alargamiento. El alargamiento es
              $\alpha\,\Delta T\,L$.
        pista: |
          Libre, la barra se dilata sin tensión: $\Delta L = \alpha\,\Delta T\,L$,
          con $L$ en mm.
        desarrollo: |
          $$
          \Delta L_T = \alpha\,\Delta T\,L = 20 \cdot 10^{-6} \cdot 30 \cdot 1500 = 0{,}9\ \text{mm}
          $$

      - tipo: calcular
        titulo: La tensión calentada 30 °C
        pregunta: |
          Entre las dos paredes y calentada 30 °C, ¿cuánto vale la tensión de
          la barra, en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '-60'
          tolerancia: 0.5
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '60'
            mensaje: |
              El valor es ese, pero el signo no. La barra quiere alargarse y
              las paredes no la dejan: la empujan, y está comprimida. Con
              $\sigma L/E + \alpha\,\Delta T\,L = 0$ el signo sale solo.
          - valor: '0'
            mensaje: |
              Es la tensión de la barra suelta por un extremo, que se dilata
              libre. Entre las dos paredes no puede alargarse, y esos 0,9 mm
              que no puede dar se convierten en compresión.
        pista: |
          Con los dos extremos fijos, $\sigma L/E + \alpha\,\Delta T\,L = 0$:
          la $L$ se va. $E = 10^{5}$ MPa.
        desarrollo: |
          $$
          \sigma = -E\,\alpha\,\Delta T = -10^{5} \cdot 20 \cdot 10^{-6} \cdot 30 = -60\ \text{MPa}
          $$

          A compresión. El axil es $N = \sigma A = -60 \cdot 800 = -48\,000$ N,
          es decir, $-48$ kN.

      - tipo: calcular
        titulo: La tensión enfriada 25 °C
        pregunta: |
          Enfriada 25 °C desde la temperatura de montaje, ¿cuánto vale la
          tensión, en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.5
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '-50'
            mensaje: |
              Ese signo sería el de la barra calentada. Al enfriarse quiere
              acortarse, y las paredes, a las que está empotrada, no la
              dejan: tiran de ella, y está a tracción.
          - valor: '0'
            mensaje: |
              Si solo estuviera apoyada contra las paredes, al enfriarse se
              separaría de ellas y quedaría sin tensión. Pero está empotrada:
              las paredes la sujetan, y enfriarla la estira.
        pista: |
          La misma ecuación, con $\Delta T = -25$.
        desarrollo: |
          $$
          \sigma = -E\,\alpha\,\Delta T = -10^{5} \cdot 20 \cdot 10^{-6} \cdot (-25) = 50\ \text{MPa}
          $$

          A tracción, con $N = 50 \cdot 800 = 40\,000$ N.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Libre, la barra calentada 30 °C se alargaría $\alpha\,\Delta T\,L = 0{,}9$ mm, sin tensión.'
          - texto: 'Las paredes no se mueven: el alargamiento total es cero, $N L/(EA) + \alpha\,\Delta T\,L = 0$.'
          - texto: 'De ahí $\sigma = -E\alpha\,\Delta T = -60$ MPa: las paredes le quitan los 0,9 mm comprimiéndola.'
          - texto: 'Enfriada 25 °C, la misma ecuación da $\sigma = +50$ MPa: las paredes la estiran.'
          - texto: Como no se le aplica ninguna fuerza, el axil es nulo y la barra no tiene tensión.
            trampa: true
            mensaje: |
              Ese es el equilibrio de una barra suelta. Aquí las dos paredes
              la sujetan: el equilibrio solo dice que empujan lo mismo, y
              cuánto lo dice la compatibilidad. La dilatación que las paredes
              impiden es la que se convierte en tensión.
    resolucion: |
      **Antes de calcular.** Calentada, la barra quiere alargarse; las
      paredes no la dejan, así que la comprimen. Enfriada, quiere acortarse;
      como está empotrada, las paredes tiran de ella y la estiran. El signo
      se sabe antes de hacer ninguna cuenta.

      **Por qué hace falta otra ecuación.** Cada pared hace una fuerza según
      el eje de la barra, y el equilibrio da una sola ecuación: las dos
      fuerzas son iguales. Cuánto valen no lo dice la estática: es
      hiperestático de grado uno. La ecuación que falta es de
      compatibilidad, y aquí es la más corta posible: los dos extremos están
      quietos, así que la barra no cambia de longitud.

      **Libre.** Sin la pared de la derecha, la barra se dilataría sin
      tensión (apuntes, ec. 8.9, p. 7, con $N = 0$ y
      $\varepsilon_0 = \alpha\,\Delta T$, ec. 8.3, p. 5, y p. 6):

      $$
      \Delta L_T = \alpha\,\Delta T\,L = 20 \cdot 10^{-6} \cdot 30 \cdot 1500 = 0{,}9\ \text{mm}
      $$

      **Entre las dos paredes.** El alargamiento total, el elástico más el
      térmico, vale cero:

      $$
      \frac{N L}{E A} + \alpha\,\Delta T\,L = 0
      \;\Longrightarrow\;
      \sigma = \frac{N}{A} = -E\,\alpha\,\Delta T
      $$

      La longitud se va: la tensión no depende de lo larga que sea la
      barra. Ni de su sección: $A$ solo hace falta para la fuerza que hacen
      las paredes. Con $E = 10^{5}$ MPa, $E\alpha = 10^{5} \cdot 20 \cdot 10^{-6} = 2$ MPa
      por grado, y

      $$
      \sigma = -2 \cdot 30 = -60\ \text{MPa}
      $$

      a compresión, con $N = -60 \cdot 800 = -48\,000$ N, es decir, $-48$ kN.
      Cada pared empuja la barra con 48 kN.

      **Enfriada 25 °C.** La misma ecuación con $\Delta T = -25$:

      $$
      \sigma = -2 \cdot (-25) = 50\ \text{MPa}
      $$

      a tracción, con $N = 50 \cdot 800 = 40\,000$ N. Enfriar una barra
      empotrada entre dos paredes la estira, igual que enfriar el alambre
      sujeto de la cuestión de 2016-2017 lo tensa más.

      **Comprobación por otro camino.** Quita la pared de la derecha: la
      barra calentada se alarga 0,9 mm, libre. Ahora devuélvela a su sitio
      con una fuerza de compresión $R$ en el extremo: tiene que acortarla
      esos 0,9 mm.

      $$
      \frac{R\,L}{E A} = 0{,}9
      \;\Longrightarrow\;
      R = \frac{0{,}9 \cdot 10^{5} \cdot 800}{1500} = 48\,000\ \text{N}
      $$

      Es la fuerza que hace la pared, y la tensión,
      $-48\,000/800 = -60$ MPa, la misma.

  # ── Ejemplo introductorio nuestro · dos barras que se alargan lo mismo.
  - id: ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos
    titulo: La varilla y el tubo que cuelgan juntos
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una varilla de acero, con $E_v = 200\ \text{GPa}$ y sección
      $A_v = 100\ \text{mm}^{2}$, va por dentro de un tubo de latón, con
      $E_t = 100\ \text{GPa}$ y sección $A_t = 600\ \text{mm}^{2}$, sin
      tocarlo. Los dos miden $L = 1{,}5\ \text{m}$, cuelgan del techo y
      están soldados abajo a la misma placa rígida, de la que tira una carga
      $P = 80\ \text{kN}$ en el eje común.

      a) ¿Qué axil lleva la varilla?

      b) ¿Qué tensión tiene?

      c) ¿Cuánto baja la placa?

      <figure>
      <svg viewBox="0 18 440 262" role="img" width="440" height="262" aria-labelledby="ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-fig-t ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-fig-d">
      <title id="ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-fig-t">Una varilla de acero dentro de un tubo de latón, colgados del techo y soldados a la misma placa, que carga una fuerza P</title>
      <desc id="ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-fig-d">A la izquierda, la vista de frente, cortada por el eje: un tubo de latón cuelga del techo, de 1,5 m de largo, y por dentro de él, sin tocarlo, una varilla de acero de la misma longitud. Los dos están soldados arriba al techo y abajo a una placa rígida, de la que tira una fuerza P hacia abajo, en el eje común. A la derecha, la sección: un círculo macizo, la varilla, dentro de un anillo, el tubo, con un hueco entre los dos.</desc>
      <defs><pattern id="ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="80" y="28" width="140" height="12" fill="url(#ejerm8-la-varilla-y-el-tubo-que-cuelgan-juntos-r)"/><line x1="80" y1="40" x2="220" y2="40" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="115.88" y="40" width="14.12" height="170" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="170" y="40" width="14.12" height="170" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="138.72" y="40" width="22.57" height="170" fill="var(--ink)" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="103.88" y="210" width="92.23" height="12" fill="var(--faint)" fill-opacity=".55" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="150" y1="222" x2="150" y2="257" stroke="var(--d2)" stroke-width="2.4"/><polygon points="150,266 145.5,256 154.5,256" fill="var(--d2)"/>
      <text x="159" y="262" font-size="12" font-weight="600" font-style="italic" fill="var(--d2-tinta)">P</text>
      <line x1="99.88" y1="210" x2="74" y2="210" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="80" y1="40" x2="80" y2="210" stroke="var(--faint)" stroke-width="0.9"/><polygon points="80,210 77.6,204 82.4,204" fill="var(--faint)"/><polygon points="80,40 82.4,46 77.6,46" fill="var(--faint)"/>
      <text x="74" y="129" text-anchor="end" font-size="11" fill="var(--faint)">L = 1,5 m</text>
      <line x1="177.06" y1="76" x2="216" y2="62" stroke="var(--faint)" stroke-width="0.8"/>
      <text x="220" y="66" fill="var(--ink)" font-size="11">tubo de latón</text>
      <line x1="154" y1="150" x2="216" y2="150" stroke="var(--faint)" stroke-width="0.8"/>
      <text x="220" y="154" fill="var(--ink)" font-size="11">varilla de acero</text>
      <circle cx="380" cy="110" r="34.12" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.2"/>
      <circle cx="380" cy="110" r="20" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
      <circle cx="380" cy="110" r="11.28" fill="var(--ink)" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="380" y="162.12" text-anchor="middle" font-size="11" fill="var(--faint)">la sección</text>
      </svg>
      <figcaption>

      La longitud no está a escala; la sección, sí: el área del tubo es seis
      veces la de la varilla.

      </figcaption>
      </figure>
    pide: >-
      El axil de la varilla, en kN, su tensión, en MPa, y lo que baja la
      placa, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular, ¿cómo se reparte la carga entre la varilla y el
          tubo?
        opciones:
          - texto: 'Hace falta una ecuación más: la placa baja sin girar, así que las dos se alargan lo mismo'
            correcta: true
            mensaje: |
              Eso es. Hay dos incógnitas, los axiles de la varilla y del
              tubo, y el equilibrio de la placa da una sola ecuación:
              $N_v + N_t = P$. Es hiperestático de grado uno. La que falta es
              de compatibilidad: las dos van del techo a la misma placa, que
              baja sin girar porque la carga va por el eje común, así que se
              alargan lo mismo.
          - texto: A partes iguales, la mitad cada una, porque cuelgan las dos del mismo sitio
            mensaje: |
              Así sería si fueran iguales. La varilla es de un material el
              doble de rígido, pero tiene la sexta parte de sección. Lo que
              comparten es el alargamiento, no la fuerza.
          - texto: Con la misma tensión en las dos, como si fueran una sola pieza de sección $A_v + A_t$
            mensaje: |
              Eso valdría si fueran del mismo material. Con el mismo
              alargamiento y la misma longitud tienen la misma deformación, y
              la tensión es $E\varepsilon$: el acero, con el doble de $E$,
              lleva el doble de tensión.

      - tipo: calcular
        titulo: El axil de la varilla
        pregunta: |
          ¿Qué axil lleva la varilla, en kN?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '40'
            mensaje: |
              Es la mitad de la carga: solo has usado el equilibrio. Las dos
              se alargan lo mismo, y para eso el tubo, tres veces más rígido,
              tiene que llevar tres veces más.
          - valor: '60'
            mensaje: |
              Ese es el axil del tubo. La carga se reparte según la rigidez
              $E A$ de cada una, y la del tubo es la mayor:
              $10^{5} \cdot 600$ frente a $2 \cdot 10^{5} \cdot 100$.
          - valor: '11.43'
            mensaje: |
              Es lo que lleva con la misma tensión en las dos,
              $P\,A_v/(A_v + A_t)$. Eso pasaría con un solo material. Aquí lo
              que es igual es la deformación, y el acero, más rígido, se
              lleva más tensión.
        pista: |
          Con el mismo alargamiento y la misma $L$:
          $N_v/(E_v A_v) = N_t/(E_t A_t)$. Compara las dos rigideces $E A$.
        desarrollo: |
          $$
          E_v A_v = 2 \cdot 10^{5} \cdot 100 = 2 \cdot 10^{7}\ \text{N}
          \qquad
          E_t A_t = 10^{5} \cdot 600 = 6 \cdot 10^{7}\ \text{N}
          $$

          El tubo es tres veces más rígido, así que $N_t = 3 N_v$. Con
          $N_v + N_t = 80$ kN, $4 N_v = 80$ kN: $N_v = 20$ kN, y
          $N_t = 60$ kN.

      - tipo: calcular
        titulo: La tensión de la varilla
        pregunta: |
          ¿Qué tensión tiene la varilla, en MPa?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '114.29'
            mensaje: |
              Es la tensión de una pieza única de sección $A_v + A_t$,
              $80\,000/700$. Las dos se deforman lo mismo, no se tensan lo
              mismo: la varilla, con el doble de $E$, tiene el doble de
              tensión que el tubo.
          - valor: '400'
            mensaje: |
              Es la tensión con la mitad de la carga en la varilla,
              $40\,000/100$. La varilla lleva una cuarta parte, no la mitad.
        pista: |
          $\sigma_v = N_v/A_v$, con $N_v$ en N y $A_v$ en mm².
        desarrollo: |
          $$
          \sigma_v = \frac{N_v}{A_v} = \frac{20\,000}{100} = 200\ \text{MPa}
          \qquad
          \sigma_t = \frac{60\,000}{600} = 100\ \text{MPa}
          $$

      - tipo: calcular
        titulo: Lo que baja la placa
        pregunta: |
          ¿Cuánto baja la placa, en mm?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '1500'
            mensaje: |
              Has puesto $E = 200$, en GPa, sin pasarlo a MPa. Con las
              fuerzas en N y las longitudes en mm, $E_v = 2 \cdot 10^{5}$ MPa.
          - valor: '6'
            mensaje: |
              Es lo que bajaría con toda la carga colgada de la varilla. El
              tubo se lleva tres cuartas partes, y la varilla se alarga con
              su propio axil, 20 kN.
        pista: |
          La placa baja lo que se alarga cualquiera de las dos:
          $\Delta L_v = N_v L/(E_v A_v)$.
        desarrollo: |
          $$
          \delta = \frac{N_v\,L}{E_v A_v} = \frac{20\,000 \cdot 1500}{2 \cdot 10^{5} \cdot 100} = 1{,}5\ \text{mm}
          $$

          Y por el tubo, lo mismo:
          $60\,000 \cdot 1500/(10^{5} \cdot 600) = 1{,}5$ mm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Dos incógnitas, $N_v$ y $N_t$, y una ecuación de equilibrio, $N_v + N_t = P$: hiperestático de grado uno.'
          - texto: 'La placa baja sin girar, así que las dos se alargan lo mismo: $N_v L/(E_v A_v) = N_t L/(E_t A_t)$.'
          - texto: 'El tubo es tres veces más rígido: $N_t = 3N_v$, y de ahí $N_v = 20$ kN y $N_t = 60$ kN.'
          - texto: 'La varilla está a 200 MPa y el tubo a 100 MPa, y la placa baja 1,5 mm.'
          - texto: 'Como cuelgan juntas, las dos tienen la misma tensión: $P/(A_v + A_t) = 114{,}3$ MPa.'
            trampa: true
            mensaje: |
              Tienen la misma deformación, no la misma tensión. Con
              $\varepsilon$ igual, la tensión es $E\varepsilon$, y el acero,
              con el doble de $E$, está al doble que el latón: 200 frente a
              100 MPa.
    resolucion: |
      **Qué problema es.** La placa cuelga de dos piezas. Sus dos axiles,
      $N_v$ y $N_t$, son las incógnitas, y el equilibrio vertical de la placa
      da una sola ecuación:

      $$
      N_v + N_t = P = 80\ \text{kN}
      $$

      En horizontal no hay nada, y los momentos no añaden nada nuevo: la
      carga va por el eje común. Falta una ecuación: es hiperestático de
      grado uno.

      **Compatibilidad.** Las dos están soldadas arriba al techo, que no se
      mueve, y abajo a la placa. Todo es simétrico respecto del eje, así que
      la placa baja una distancia $\delta$ sin girar, y las dos se alargan
      eso:

      $$
      \Delta L_v = \Delta L_t = \delta
      $$

      **Comportamiento.** Cada una se alarga $N L/(E A)$ (apuntes, ec. 8.9,
      p. 7, sin temperatura). Con la misma $L$, la compatibilidad queda

      $$
      \frac{N_v}{E_v A_v} = \frac{N_t}{E_t A_t}
      \;\Longrightarrow\;
      N_t = \frac{E_t A_t}{E_v A_v}\,N_v = \frac{10^{5} \cdot 600}{2 \cdot 10^{5} \cdot 100}\,N_v = 3\,N_v
      $$

      **Resolver.** Con el equilibrio, $4 N_v = 80$ kN: $N_v = 20$ kN y
      $N_t = 60$ kN. Las dos a tracción. Es la regla del reparto: cada una se
      lleva la carga en proporción a su rigidez,
      $N_v = P\,E_v A_v/(E_v A_v + E_t A_t)$.

      **Tensiones y descenso.**

      $$
      \sigma_v = \frac{20\,000}{100} = 200\ \text{MPa}
      \qquad
      \sigma_t = \frac{60\,000}{600} = 100\ \text{MPa}
      $$

      $$
      \delta = \frac{N_v\,L}{E_v A_v} = \frac{20\,000 \cdot 1500}{2 \cdot 10^{5} \cdot 100} = 1{,}5\ \text{mm}
      $$

      **Comprobación por otro camino.** Las dos tienen que deformarse lo
      mismo, $\varepsilon = \sigma/E$:

      $$
      \frac{200}{2 \cdot 10^{5}} = 0{,}001 \qquad \frac{100}{10^{5}} = 0{,}001
      $$

      y $\delta = \varepsilon L = 0{,}001 \cdot 1500 = 1{,}5$ mm. Los axiles
      suman $20 + 60 = 80$ kN, la carga.

      **Para el escalón siguiente.** Aquí las dos se alargan lo mismo porque
      la placa baja sin girar. Con una pieza rígida articulada en un punto,
      la pieza gira, y cada barra se alarga según su distancia a la
      articulación: «rígido» no quiere decir que todo baje lo mismo.

  - id: ejerm8-la-barra-rigida-colgada
    titulo: La barra rígida colgada de dos barras, y la ecuación que falta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una barra rígida horizontal ABC está articulada en A y cuelga de dos
      barras verticales iguales sujetas al techo: la barra 1 en B y la barra 2
      en C, con $AB = BC = a = 1\ \text{m}$. Las dos barras miden
      $L = 1\ \text{m}$, tienen una sección $A = 100\ \text{mm}^{2}$ y son de
      acero, $E = 200\ \text{GPa}$. En C cuelga una carga
      $P = 10\ \text{kN}$. Es la viga de la figura del tema.

      Calcular la fuerza en la barra 2 y el descenso del punto C.
    pide: El axial de la barra 2 y el descenso de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las incógnitas son $N_1$, $N_2$ y las dos reacciones de A. ¿Se
          pueden sacar todas del equilibrio?
        opciones:
          - texto: No; es hiperestático, y la ecuación que falta es la compatibilidad del giro de la viga
            correcta: true
            mensaje: |
              Eso es. El plano da tres ecuaciones y hay cuatro incógnitas. La
              cuarta sale de cómo se mueve la viga: gira alrededor de A, así
              que C baja el doble que B, y la barra 2 se alarga el doble que
              la 1.
          - texto: Sí; con momentos en A se sacan las dos fuerzas
            mensaje: |
              Los momentos en A dan una sola ecuación, $N_1 a + N_2\,2a = P\,2a$,
              con dos incógnitas. Para repartir la carga entre las dos barras
              hace falta saber cuánto se alarga cada una.
          - texto: Sí, porque la viga es rígida y las dos barras llevan lo mismo
            mensaje: |
              Rígida no quiere decir que baje entera: está articulada en A y
              gira. Las barras se alargan distinto y llevan fuerzas distintas.

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale el axial de la barra 2, en kN?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '6.6667'
            mensaje: |
              Has supuesto que las dos barras se alargan lo mismo, como si la
              viga bajara entera. Está articulada en A y gira: C baja el doble
              que B, así que $\Delta L_2 = 2\,\Delta L_1$ y $N_2 = 2\,N_1$.
          - valor: '5'
            mensaje: |
              Tienes la proporción al revés: $N_1 = 2\,N_2$. La barra que más
              se alarga es la que está más lejos de A, la 2, y es la que más
              fuerza lleva.
          - valor: '10'
            mensaje: |
              Es lo que llevaría la barra 2 sola, sin la barra 1: con momentos
              en A, $N_2\,2a = P\,2a$. La barra 1 también se alarga y también
              sujeta.
        pista: |
          Compatibilidad: $\Delta L_2 = 2\,\Delta L_1$, y como las barras son
          iguales, $N_2 = 2\,N_1$. Equilibrio de momentos en A:
          $N_1 a + N_2\,2a = P\,2a$.
        desarrollo: |
          $$
          N_1 + 2\,(2N_1) = 2P
          \quad\Longrightarrow\quad
          N_1 = \frac{2P}{5} = 4\ \text{kN}
          \qquad
          N_2 = \frac{4P}{5} = 8\ \text{kN}
          $$

      - tipo: calcular
        titulo: El descenso de C
        pregunta: |
          ¿Cuánto baja el punto C, en mm?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número, en mm
        distractores:
          - valor: '0.2'
            mensaje: |
              Ese es el alargamiento de la barra 1, que es lo que baja B. C
              está el doble de lejos de A y baja el doble, que es lo que se
              alarga la barra 2.
          - valor: '400'
            mensaje: |
              Has puesto $E = 200$ con las fuerzas en N y las longitudes en
              mm. En esas unidades $E$ va en MPa: $200\ \text{GPa} = 200\,000\ \text{MPa}$.
        pista: |
          La barra 2 es vertical y su extremo de arriba no se mueve: se alarga
          lo que baja C. $\Delta L_2 = N_2 L/(EA)$, en N, mm y MPa.
        desarrollo: |
          $$
          v_C = \Delta L_2 = \frac{N_2\,L}{E\,A} = \frac{8000 \cdot 1000}{200\,000 \cdot 100} = 0{,}4\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Hay cuatro incógnitas y tres ecuaciones de equilibrio; la de momentos en A es $N_1 a + N_2\,2a = P\,2a$.
          - texto: La viga gira un ángulo pequeño $\theta$ alrededor de A, así que B baja $\theta a$ y C baja $2\theta a$.
          - texto: Las barras son verticales con el extremo de arriba fijo, y se alargan lo que bajan B y C, así que $\Delta L_2 = 2\,\Delta L_1$.
          - texto: Con la misma $EA/L$, $N_2 = 2N_1$, y con el equilibrio, $N_1 = 4$ kN y $N_2 = 8$ kN.
          - texto: C baja lo que se alarga la barra 2, $8000 \cdot 1000/(200\,000 \cdot 100) = 0{,}4$ mm.
          - texto: Como la viga es rígida, B y C bajan lo mismo y las dos barras llevan $P/2$.
            trampa: true
            mensaje: |
              Rígida no es inmóvil ni quiere decir que baje entera. Articulada
              en A, gira, y cada punto baja en proporción a su distancia a A.
    resolucion: |
      **Por qué no basta el equilibrio.** Las incógnitas son $N_1$, $N_2$ y
      las dos reacciones de A; el plano da tres ecuaciones. Se suponen las dos
      barras a tracción, y la de momentos en A es

      $$
      N_1\,a + N_2\,2a = P\,2a
      $$

      **Compatibilidad.** La viga es rígida y está articulada en A: con un
      giro pequeño $\theta$, B baja $\theta a$ y C, $2\theta a$. Cada barra es
      vertical, con el extremo de arriba fijo, y se alarga lo que baja su
      extremo de abajo, la proyección de su desplazamiento sobre ella:

      $$
      \Delta L_1 = \theta a \qquad \Delta L_2 = 2\theta a \qquad\Longrightarrow\qquad \Delta L_2 = 2\,\Delta L_1
      $$

      **Ley de cada barra.** $\Delta L_i = N_i L/(EA)$ con la misma $EA/L$, así
      que $N_2 = 2N_1$. Con el equilibrio:

      $$
      N_1 = \frac{2P}{5} = 4\ \text{kN} \qquad N_2 = \frac{4P}{5} = 8\ \text{kN}
      $$

      Las dos salen positivas: las dos barras están a tracción, como se
      supuso. La barra 2 trabaja a $\sigma_2 = 8000/100 = 80$ MPa.

      **El descenso de C.** En N, mm y MPa:

      $$
      v_C = \Delta L_2 = \frac{8000 \cdot 1000}{200\,000 \cdot 100} = 0{,}4\ \text{mm}
      \qquad
      \theta = \frac{\Delta L_1}{a} = \frac{0{,}2}{1000} = 2 \cdot 10^{-4}\ \text{rad}
      $$

      **Comprobación por otro camino.** Tomando el giro como incógnita, cada
      barra tira con $N_i = (EA/L)\,\theta\,d_i$, y el equilibrio en A da
      $(EA/L)\,\theta\,(a^{2} + 4a^{2}) = P\,2a$: el mismo
      $\theta = 2 \cdot 10^{-4}$ rad.
  - id: ejerm8-la-barra-calentada-que-toca-la-pared
    titulo: La barra calentada que llega a tocar la pared
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una barra de acero de longitud $L = 2\ \text{m}$ y sección
      $A = 2000\ \text{mm}^{2}$ está empotrada en una pared por su extremo
      izquierdo. El extremo derecho queda libre, a una distancia
      $\xi = 0{,}6\ \text{mm}$ de otra pared. El acero tiene
      $E = 200\ \text{GPa}$ y un coeficiente de dilatación
      $\alpha = 12 \cdot 10^{-6}$ por grado. Se calienta la barra.

      a) ¿Con qué incremento de temperatura toca la pared?

      b) ¿Qué tensión tiene si se calienta $\Delta T = 60$ °C?

      <figure>
      <svg viewBox="20 20 380 100" role="img" width="380" height="100" aria-labelledby="ejerm8-la-barra-calentada-que-toca-la-pared-fig-t ejerm8-la-barra-calentada-que-toca-la-pared-fig-d">
      <title id="ejerm8-la-barra-calentada-que-toca-la-pared-fig-t">Una barra empotrada en una pared, con una holgura hasta la otra, que se calienta</title>
      <desc id="ejerm8-la-barra-calentada-que-toca-la-pared-fig-d">Una barra horizontal de 2 m empotrada en una pared a la izquierda. Su extremo derecho queda libre, separado de otra pared por una holgura ξ de 0,6 mm. La barra se calienta un incremento de temperatura ΔT.</desc>
      <defs><pattern id="ejerm8-la-barra-calentada-que-toca-la-pared-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="36" y="44" width="14" height="60" fill="url(#ejerm8-la-barra-calentada-que-toca-la-pared-r)"/><line x1="50" y1="44" x2="50" y2="104" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="346" y="44" width="14" height="60" fill="url(#ejerm8-la-barra-calentada-que-toca-la-pared-r)"/><line x1="346" y1="44" x2="346" y2="104" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="50" y="62" width="280" height="16" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.3"/>
      <text x="190" y="74" font-size="12" text-anchor="middle" font-style="italic" fill="var(--flag)">ΔT</text>
      <line x1="50" y1="82" x2="50" y2="116" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="330" y1="82" x2="330" y2="116" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="50" y1="110" x2="330" y2="110" stroke="var(--faint)" stroke-width="0.9"/><polygon points="330,110 324,112.4 324,107.6" fill="var(--faint)"/><polygon points="50,110 56,107.6 56,112.4" fill="var(--faint)"/>
      <text x="190" y="105" text-anchor="middle" font-size="11" fill="var(--faint)">L = 2 m</text>
      <line x1="330" y1="58" x2="330" y2="30" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="346" y1="42" x2="346" y2="30" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="308" y1="34" x2="330" y2="34" stroke="var(--faint)" stroke-width="0.9"/><polygon points="330,34 324,36.4 324,31.6" fill="var(--faint)"/><polygon points="308,34 314,31.6 314,36.4" fill="var(--faint)"/>
      <line x1="368" y1="34" x2="346" y2="34" stroke="var(--faint)" stroke-width="0.9"/><polygon points="346,34 352,31.6 352,36.4" fill="var(--faint)"/><polygon points="368,34 362,36.4 362,31.6" fill="var(--faint)"/>
      <line x1="330" y1="34" x2="346" y2="34" stroke="var(--faint)" stroke-width="0.9"/>
      <text x="304" y="38" text-anchor="end" font-size="11" fill="var(--faint)">ξ = 0,6 mm</text>
      </svg>
      <figcaption>

      La holgura está exagerada: 0,6 mm frente a 2 m.

      </figcaption>
      </figure>
    pide: El incremento de temperatura con el que la barra toca la pared, en °C, y su tensión calentada 60 °C, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Calentada 60 °C, la barra libre se alargaría
          $\alpha\,\Delta T\,L = 1{,}44$ mm, y el hueco mide 0,6 mm. ¿Qué
          ecuación escribes para ella?
        opciones:
          - texto: $N L/(EA) + \alpha\,\Delta T\,L = \xi$, porque se alarga justo lo que mide el hueco
            correcta: true
            mensaje: |
              Eso es. La barra toca, así que su extremo avanza ξ y ni una
              décima más. El alargamiento total, el elástico más el térmico
              (apuntes, ec. 8.9), vale ξ; el término elástico sale negativo,
              y esa es la compresión que mete la pared.
          - texto: $N L/(EA) + \alpha\,\Delta T\,L = 0$, como el alambre entre soportes rígidos
            mensaje: |
              Eso sería sin hueco, con los dos extremos fijos desde el
              principio. Aquí el extremo derecho tiene 0,6 mm de margen, y la
              pared solo empuja cuando se agotan. Con el cero, la tensión sale
              mayor de lo que es.
          - texto: $N = 0$, porque la barra tiene sitio para dilatarse
            mensaje: |
              Solo mientras su alargamiento libre no llegue a ξ. A 60 °C se
              alargaría 1,44 mm y el hueco es de 0,6: toca, y desde ese
              momento la pared la comprime. Calentada 20 °C sí sería $N = 0$.
          - texto: $N L/(EA) = \xi$, porque el hueco lo cierra la fuerza
            mensaje: |
              El hueco lo cierra la dilatación, no una fuerza: no hay ninguna
              carga que estire la barra. La ecuación lleva los dos términos
              del alargamiento, y lo que vale ξ es la suma.

      - tipo: calcular
        titulo: La temperatura a la que toca
        pregunta: |
          ¿Con qué incremento de temperatura toca la barra la pared, en °C?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.1
          formato: un número, en °C
        distractores:
          - valor: '25000'
            mensaje: |
              Has puesto $L$ en metros y ξ en milímetros, $0{,}6/(12 \cdot 10^{-6} \cdot 2)$.
              Con las dos longitudes en mm, $L = 2000$ mm, salen 25 °C.
          - valor: '50000'
            mensaje: |
              Te has dejado la longitud: $\alpha\,\Delta T$ es una deformación,
              no un alargamiento. Lo que tiene que llegar a ξ es el
              alargamiento libre, $\alpha\,\Delta T\,L$.
        pista: |
          Mientras no toca, la barra se dilata libre y sin tensión:
          $\Delta L = \alpha\,\Delta T\,L$. Toca cuando eso vale ξ. Las dos
          longitudes, en mm.
        desarrollo: |
          $$
          \alpha\,\Delta T_c\,L = \xi
          \;\Longrightarrow\;
          \Delta T_c = \frac{\xi}{\alpha L} = \frac{0{,}6}{12 \cdot 10^{-6} \cdot 2000} = 25\ \text{°C}
          $$

      - tipo: calcular
        titulo: La tensión calentada 60 °C
        pregunta: |
          Calentada $\Delta T = 60$ °C, ¿cuánto vale la tensión de la barra,
          en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '-84'
          tolerancia: 0.5
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '-144'
            mensaje: |
              Es la tensión que tendría sin hueco, $-E\alpha\Delta T$, con los
              dos extremos fijos desde el principio. Los primeros 0,6 mm de
              dilatación son libres y no tensan: solo cuenta lo que la pared
              impide.
          - valor: '-204'
            mensaje: |
              Has puesto la holgura con el signo cambiado, $\Delta L = -\xi$.
              La barra avanza 0,6 mm hasta la pared, así que su alargamiento
              total es $+\xi$: el hueco quita compresión, no la añade.
          - valor: '84'
            mensaje: |
              El valor es ese, pero el signo no. La barra quiere alargarse
              1,44 mm y solo la dejan 0,6: la pared la empuja y está
              comprimida. Con $N L/(EA) = \xi - \alpha\,\Delta T\,L$ el signo
              sale solo.
        pista: |
          Con la pared tocando, $\sigma L/E + \alpha\,\Delta T\,L = \xi$.
          Despeja σ con $E = 2 \cdot 10^{5}$ MPa y las longitudes en mm.
        desarrollo: |
          $$
          \sigma = E\left(\frac{\xi}{L} - \alpha\,\Delta T\right)
          \qquad
          2 \cdot 10^{5}\left(\frac{0{,}6}{2000} - 12 \cdot 10^{-6} \cdot 60\right) = -84
          $$

          En MPa: $\sigma = -84$ MPa, a compresión. El axil es
          $N = \sigma A = -84 \cdot 2000 = -168\,000$ N.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Mientras no toca, la barra se dilata libre y sin tensión: su extremo avanza $\alpha\,\Delta T\,L$.'
          - texto: Toca cuando $\alpha\,\Delta T\,L = \xi$, es decir, con $\Delta T = \xi/(\alpha L) = 25$ °C.
          - texto: 'A 60 °C se alargaría 1,44 mm y solo tiene 0,6: toca, y la pared la comprime.'
          - texto: Con la pared tocando, $\sigma L/E + \alpha\,\Delta T\,L = \xi$, y $\sigma = E(\xi/L - \alpha\,\Delta T) = -84$ MPa.
          - texto: Como al final los dos extremos están sujetos, $\Delta L = 0$ y $\sigma = -E\alpha\Delta T = -144$ MPa.
            trampa: true
            mensaje: |
              Al final los dos extremos están sujetos, pero el derecho llegó a
              la pared después de avanzar 0,6 mm. Esa parte de la dilatación
              fue libre; la pared impide el resto. Por eso el alargamiento
              total es ξ, no cero.
    resolucion: |
      **Antes de tocar.** Mientras el extremo derecho no llega a la pared, la
      barra está empotrada por un lado y libre por el otro: nada la sujeta en
      su dirección, $N = 0$, y se dilata libremente,
      $\Delta L = \alpha\,\Delta T\,L$ (apuntes, ec. 8.9, con
      $\varepsilon_0 = \alpha\,\Delta T$).

      **Cuándo toca.** Cuando ese alargamiento libre llega a la holgura. Con
      las longitudes en mm:

      $$
      \Delta T_c = \frac{\xi}{\alpha L} = \frac{0{,}6}{12 \cdot 10^{-6} \cdot 2000} = 25\ \text{°C}
      $$

      Calentada menos de 25 °C, no toca y no tiene tensión: a 20 °C su
      extremo avanza $12 \cdot 10^{-6} \cdot 20 \cdot 2000 = 0{,}48$ mm y no
      pasa nada más.

      **Calentada 60 °C.** Libre se alargaría
      $12 \cdot 10^{-6} \cdot 60 \cdot 2000 = 1{,}44$ mm, más que los
      0,6 mm del hueco: toca. Desde ese momento el extremo derecho está
      quieto, y la compatibilidad cambia el cero de una barra entre soportes
      fijos por la holgura: el alargamiento total vale ξ.

      $$
      \frac{N L}{E A} + \alpha\,\Delta T\,L = \xi
      \;\Longrightarrow\;
      \sigma = \frac{N}{A} = E\left(\frac{\xi}{L} - \alpha\,\Delta T\right)
      $$

      Con $E = 2 \cdot 10^{5}$ MPa, en MPa:

      $$
      2 \cdot 10^{5}\left(\frac{0{,}6}{2000} - 12 \cdot 10^{-6} \cdot 60\right) = -84
      $$

      $\sigma = -84$ MPa, a compresión, y $N = -84 \cdot 2000 = -168\,000$ N,
      es decir, $-168$ kN. La pared empuja la barra con esos 168 kN.

      **Comprobación por otro camino.** De los 60 °C, los primeros 25 son
      libres; la pared solo impide los otros 35, y una barra que no puede
      alargarse tiene $\sigma = -E\alpha\,\Delta T$ con ese incremento:

      $$
      -2 \cdot 10^{5} \cdot 12 \cdot 10^{-6} \cdot 35 = -84
      $$

      Sin el hueco serían $-144$ MPa: los 0,6 mm le quitan
      $E\xi/L = 2 \cdot 10^{5} \cdot 0{,}6/2000 = 60$ MPa de compresión.
  - id: ejerm8-cl8-1-la-viga-con-una-barra-calentada
    titulo: La viga rígida articulada en B, con la barra 1 calentada
    fuente: >-
      Ejercicio 8.1 · Tema 8, «Esfuerzo axial simple» · Elasticidad y
      Resistencia de Materiales, UPV/EHU, ejercicios de clase (el fichero del
      8.1 lleva la fecha del 30 de octubre de 2019). El material no trae
      solución: la resolución es nuestra, con el convenio del tema 8, y cada cifra está
      calculada con el motor del curso y comprobada por un segundo camino
      (los momentos en B, la compatibilidad y la fórmula cerrada). El
      enunciado pide las fuerzas «en función de» los datos, y aquí se
      pregunta por el coeficiente de cada término. La figura está
      redibujada; como en el original, no lleva cotas y las longitudes van
      en los datos.
    nivel: practica
    enunciado: |
      En la estructura de la figura, la viga ABC sometida a flexión es
      rígida y B es una articulación fija. El tramo BC soporta la carga $q_0$
      y la barra 1 sufre una variación de temperatura $\Delta T$.
      Determinar:

      a/ Las fuerzas en las barras en función de $\alpha$, $E$, $A$,
      $\Delta T$, $q_0$ y $L$.

      b/ El valor de $\Delta T$ para que la viga ABC se mantenga horizontal
      en función de $\alpha$, $E$, $A$, $q_0$ y $L$. ¿Cuáles son entonces
      las fuerzas en las barras?

      Datos: AB = $L$, BC =3$L$, AD = $L$, CE=2$L$

