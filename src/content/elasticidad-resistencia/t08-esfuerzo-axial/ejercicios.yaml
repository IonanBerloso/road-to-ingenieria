      **2. Incógnitas.** $N_1$ y $N_2$; el giro de la pieza y las dos
      componentes del desplazamiento de D.

      **3. Ecuaciones.** **Momentos en O:**

      $$
      N_1\,\frac{L}{\sqrt{2}} + N_2\,L = P \cdot 2L
      $$

