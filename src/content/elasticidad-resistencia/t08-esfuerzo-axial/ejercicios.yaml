      <figcaption>

      La viga rígida: las barras 1 y 2, cortadas y supuestas a tracción, tiran hacia arriba; la 1 está calentada, sin flecha. B da dos componentes, y q₀ carga BC. Cuatro incógnitas y tres ecuaciones.

      </figcaption>
      </figure>

      - **Cuatro incógnitas**: $N_1$, $N_2$ y las dos reacciones de B; el
        plano da tres ecuaciones.
      - **Las dos barras se suponen a tracción**, tirando de la viga hacia
        arriba.
      - **La resultante de la carga**, $3q_0L$, está en el centro de BC, a
        $1{,}5L$ de B.
      - **La viga gira un ángulo pequeño $\theta$** (antihorario) alrededor de
        B: A, a $L$ a la izquierda, baja $\theta L$; C, a $3L$ a la derecha,
        sube $3\theta L$.

      **2. Incógnitas.** $N_1$ y $N_2$, con la carga y con el calentamiento;
      el $\Delta T$ que deja la viga horizontal, y las fuerzas con él.

      **3. Ecuaciones.** Momentos en B, antihorarios positivos:

      $$
      -N_1\,L + N_2\,3L - 3q_0L \cdot 1{,}5L = 0
      \;\Longrightarrow\;
      -N_1 + 3N_2 = 4{,}5\,q_0L
      $$

      Compatibilidad: las dos barras son verticales y su extremo de arriba es
      fijo, así que cada una se alarga lo que baja su extremo de abajo
      (apuntes, ecs. 8.10-8.12). Y la ley de cada barra (ec. 8.9), con la 1
      calentada:

      $$
      \Delta L_1 = \theta L \qquad \Delta L_2 = -3\theta L
      \qquad\Longrightarrow\qquad
      \Delta L_2 = -3\,\Delta L_1
      $$

      $$
      \Delta L_1 = \frac{N_1 L}{EA} + \alpha\Delta T\,L
      \qquad
      \Delta L_2 = \frac{N_2\,2L}{EA}
      $$

      **4. Resultados.** **a/** Llevadas a la compatibilidad,
      $2N_2 = -3N_1 - 3EA\alpha\Delta T$. Con el equilibrio,
      $N_1 = 3N_2 - 4{,}5\,q_0L$, y queda
      $11N_2 = 13{,}5\,q_0L - 3EA\alpha\Delta T$:

      $$
      N_2 = \frac{27}{22}\,q_0L - \frac{3}{11}\,EA\alpha\Delta T
      \qquad
      N_1 = -\frac{9}{11}\left(q_0L + EA\alpha\Delta T\right)
      $$

      En números, $\frac{9}{11} = 0{,}8182$, $\frac{27}{22} = 1{,}2273$ y
      $\frac{3}{11} = 0{,}2727$.

      **b/ La viga horizontal.** Horizontal es $\theta = 0$: ninguna barra
      se alarga. La 2 no tiene deformación térmica, así que $N_2 = 0$, y los
      momentos en B dan $N_1 = -4{,}5\,q_0L$. La 1 tiene que quedarse con su
      longitud, como un alambre entre soportes fijos:

      $$
      \frac{N_1 L}{EA} + \alpha\Delta T\,L = 0
      \;\Longrightarrow\;
      \Delta T = -\frac{N_1}{EA\alpha} = \frac{9\,q_0L}{2\,EA\alpha}
      $$

      Las fuerzas son entonces $N_1 = -\tfrac{9}{2}q_0L$ (compresión) y
      $N_2 = 0$.

      **5. Comprobación.** Con el giro como incógnita,
      $N_1 = EA(\theta - \alpha\Delta T)$ y $N_2 = -\tfrac{3}{2}EA\,\theta$.
      Los momentos en B dan

      $$
      -\tfrac{11}{2}\,EA\,\theta + EA\alpha\Delta T = 4{,}5\,q_0L
      \;\Longrightarrow\;
      \theta = \frac{2\,\alpha\Delta T}{11} - \frac{9\,q_0L}{11\,EA}
      $$

      que se anula justo con $\alpha\Delta T = 9q_0L/(2EA)$, el mismo
      resultado. Sin calentar, $\theta$ sale negativo: la viga gira en
      sentido horario, C baja y A sube, como dice el signo de $N_1$.

      **Lo que dice el resultado.** Calentada, la barra 1 sale comprimida: con
      la carga, porque la viga sube por A; con el calentamiento, porque no la
      dejan alargarse del todo. La 2 está a tracción con la carga, y el
      calentamiento se la quita. En b/, la barra 1 empuja A hacia abajo lo
      justo para que la carga de BC no haga girar la viga.

  - id: ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45
    titulo: La pieza en L colgada de O, con una barra a 45° y otra vertical
    fuente: >-
      Propuesta A6 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del
      curso y comprobada por un segundo camino (los momentos en O y la
      proyección del desplazamiento de cada punto sobre su barra). Se
      conservan las erratas del original, «totalmene» y «rigida» sin tilde.
      El enunciado no da ni el material ni la sección de las barras: se
      toman iguales en las dos, y lo dice la nota. La figura está
      redibujada con las cotas del original.
    nivel: practica
    antes:
      idea: |
        La pieza es rígida y está articulada en O: su único movimiento es un
        giro pequeño. Lo que se alarga cada barra sale de ese giro y de la
        geometría.
      formula: |
        $$
        \Delta L = \frac{N L}{E A}
        $$

        El alargamiento de una barra con axil, sin temperatura (ec. 8.9).
      reconocer: |
        Antes de las cuentas, mira dónde está A respecto de O, y en qué
        dirección se mueve un punto de un sólido que gira.
    enunciado: |
      En el sistema de la figura, la barra OABD es totalmene rigida y las
      barras 1 y 2 están articuladas en sus dos extremos. Calcular:

      a/ Fuerzas en las barras 1 y 2.

      b/ Desplazamiento horizontal y vertical en el punto D

