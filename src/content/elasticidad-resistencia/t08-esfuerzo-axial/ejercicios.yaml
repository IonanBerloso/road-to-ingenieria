              **Las dos barras cortadas, tirando de C hacia la pared.**
            porque: |
              Se suponen a tracción; el signo dirá cuál empuja.
          - punto: |
              **$P$ hacia abajo, en C.**
            porque: |
              Es la única carga del nudo, el dato.
          - punto: |
              **Dos incógnitas y dos ecuaciones.**
            porque: |
              El nudo es isostático: las fuerzas salen sin compatibilidad.
