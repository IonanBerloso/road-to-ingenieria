      <title id="ejerm8-caballete-el-tirante-y-el-desplazamiento-de-b-proceso-fig-t">El proceso de deformación del caballete, con los desplazamientos exagerados</title>
      <desc id="ejerm8-caballete-el-tirante-y-el-desplazamiento-de-b-proceso-fig-d">El caballete sin deformar, con las patas AC y BC y el tirante MN, y encima, en trazo discontinuo, la posición final. La pata AC gira un ángulo β alrededor de A y su extremo C pasa a C prima. La pata BC se traslada primero con B hasta B prima, y C pasa a C dos primas, a la misma altura que C; después gira alrededor de B prima el mismo ángulo β, en sentido contrario, hasta que su extremo llega a C prima. N pasa a N dos primas con la traslación y a N prima con el giro; M pasa a M prima. M prima cero y N prima cero, en la recta del tirante sin deformar, en la vertical de M prima y de N prima, unidos a ellos por una línea de puntos. Abajo, la cota δB entre B y B prima.</desc>
