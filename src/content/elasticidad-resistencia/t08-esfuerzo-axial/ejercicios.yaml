      el mismo $EA$. Las fuerzas van en unidades de $P$, positivas a
      tracción.
    pide: >-
      Los axiles de las barras 1 y 2, en unidades de P, y, por el camino, un
      cociente que sale de la geometría.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuaciones hay para las dos fuerzas?
        opciones:
          - texto: La de momentos en A y una de compatibilidad, porque los dos alargamientos salen del mismo giro de la celosía
            correcta: true
            mensaje: |
              Eso es. $N_1$, $N_2$ y las dos reacciones de A son cuatro
              incógnitas para tres ecuaciones; las reacciones no entran en los
              momentos en A, que dejan una ecuación para dos fuerzas. La que
              falta es de compatibilidad: la celosía gira un ángulo pequeño θ
              alrededor de A, y cada barra se alarga lo que ese giro lleva su
              extremo en su dirección.
          - texto: Las tres del equilibrio de la celosía, que es isostática
            mensaje: |
              Son cuatro incógnitas, $N_1$, $N_2$ y las dos reacciones de la
              articulación A, para tres ecuaciones. Una pieza articulada con
              dos barras es hiperestática de grado uno.
          - texto: La de momentos en A y $N_1 = N_2$, porque las dos barras son iguales
            mensaje: |
              Iguales en material y sección, pero no en longitud ni en
              dirección, y su extremo no se mueve lo mismo. El mismo $EA$ no
              quiere decir la misma fuerza.
          - texto: La de momentos en A y $\Delta L_1 = \Delta L_2$, porque las dos salen de D
            mensaje: |
              Comparten D, que no se mueve, pero el otro extremo de cada una
              está en un punto distinto de la celosía: el de la 2, el doble de
              lejos de A, baja el doble.

