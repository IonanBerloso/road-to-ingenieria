      La celosía rígida: las dos barras, cortadas y supuestas a tracción, tiran hacia D; A da dos componentes, y P cuelga de C. Cuatro incógnitas y tres ecuaciones.

      </figcaption>
      </figure>

      - **Las dos barras se suponen a tracción**, tirando de la celosía hacia
        D.
      - **A da dos componentes**, $A_x$ y $A_y$, y $P$ cuelga de C.
      - **Cuatro incógnitas y tres ecuaciones**: la celosía es hiperestática
        de grado uno, y la ecuación que falta es de compatibilidad.

      **2. Incógnitas.** $N_1$, $N_2$, $A_x$ y $A_y$; y el giro pequeño θ de
      la celosía alrededor de A.

      **3. Ecuaciones.** Momentos en A, donde no entran las reacciones de A.
      El brazo de cada barra es la distancia de A a su recta: la 1 pasa por D
      y B, a $a/\sqrt{2}$ de A; la 2 pasa por D y E, a $2a/\sqrt{5}$:

      $$
      N_1\,\frac{a}{\sqrt{2}} + N_2\,\frac{2a}{\sqrt{5}} = P \cdot 2a
      $$

      Compatibilidad: $P$ hace girar la celosía un ángulo pequeño θ, en
      sentido horario, alrededor de A. Un punto de la recta AC a una distancia
      $x$ de A baja $x\theta$ (apuntes, apartado 8.4): B baja $a\theta$ y E,
      $2a\theta$. Cada barra se alarga la proyección de ese descenso sobre su
      dirección, desde D (ec. 8.12); la 1 va hacia $(1, -1)/\sqrt{2}$ y la 2,
      hacia $(2, -1)/\sqrt{5}$:

      $$
      \Delta L_1 = \frac{a\theta}{\sqrt{2}}
      \qquad
      \Delta L_2 = \frac{2a\theta}{\sqrt{5}}
      $$

      Y la ley de cada barra (ec. 8.9), con $L_1 = a\sqrt{2}$ y
      $L_2 = a\sqrt{5}$:

      $$
      N_1 = \frac{EA\,\Delta L_1}{a\sqrt{2}}
      \qquad
      N_2 = \frac{EA\,\Delta L_2}{a\sqrt{5}}
      $$

      **4. Resultados.** **La razón entre los alargamientos.**

      $$
      \frac{\Delta L_2}{\Delta L_1} = \frac{2\sqrt{2}}{\sqrt{5}} = 1{,}2649
      $$

      **Las fuerzas.** Con los alargamientos, $N_1 = EA\theta/2$ y
      $N_2 = 2EA\theta/5$; en los momentos,
      $EA\theta\left(\tfrac{1}{2\sqrt{2}} + \tfrac{4}{5\sqrt{5}}\right) = 2P$:

      $$
      N_1 = \frac{100}{25\sqrt{2} + 16\sqrt{5}}\,P = 1{,}4058\,P
      \qquad
      N_2 = \frac{4}{5}\,N_1 = 1{,}1247\,P
      $$

      Las dos a tracción.

      **5. Comprobación.** $A_x$ sale sin las barras: las dos pasan por D, así
      que en los momentos en D solo entran $P$ y $A_x$, que está a una
      distancia $a$: $A_x\,a = P \cdot 2a$, y $A_x = 2P$ hacia la derecha. Con
      las fuerzas de las barras, sus componentes horizontales, que tiran hacia
      D, tienen que sumar lo mismo; en unidades de $P$,
      $N_1/\sqrt{2} + 2N_2/\sqrt{5} = 0{,}9941 + 1{,}0059 = 2{,}0000$. Y la
      compatibilidad: $1{,}1247/1{,}4058 = 0{,}8000$, que es $(2/5)/(1/2)$, lo
      que se estira cada una por unidad de longitud y de giro.

      **Lo que dice el resultado.** El mismo $EA$ no quiere decir la misma
      fuerza: cada barra lleva la que le pide su alargamiento. La 1 lleva más
      que la 2 aunque esté más cerca de A: con el mismo giro, la 2 se estira
      menos por unidad de longitud, $2\theta/5$ frente a $\theta/2$.

  # ── Propuesta A4 de clase · el cono que cuelga con su peso.
  - id: ejerm8-cla4-el-cono-que-cuelga-con-su-peso
    titulo: El cono que cuelga con su propio peso
    fuente: >-
      Propuesta A4 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8 con la sección variable, y el cono partido
      en 2000 tramos con el peso de cada rebanada en sus nudos) y comprobada
      por un segundo camino (el peso de lo que cuelga sumado rebanada a
      rebanada y la fórmula con el peso específico). Los datos dicen A y la
      figura, A₀: es el área de la base. La «v» de los datos, el coeficiente
      de Poisson, no hace falta para el alargamiento. La figura está
      redibujada.
    nivel: practica
    antes:
      idea: |
        Igual que en una barra que cuelga, cada sección sostiene lo que cuelga
        por debajo de ella. Aquí cambian a la vez el axil y el área, y la
        tensión es su cociente.
      formula: |
        $$
        \Delta L = \int_0^L \frac{N}{EA}\,dx
        $$

        El alargamiento de una barra cuyo axil y cuya sección cambian a lo
        largo de ella (ec. 8.8, sin término térmico).
      reconocer: |
        Antes de las cuentas, escribe cómo cambian con la altura el área de la
        sección y el volumen de lo que cuelga por debajo.
    enunciado: |
      Calcula el alargamiento de un cono que solo sufre su peso propio.
      Datos: Q,L,A,E,v

      <figure class="figura-examen">
      <svg viewBox="120 12 210 168" role="img" width="210" height="168" aria-labelledby="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-t ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-d">
      <title id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-t">Un cono colgado del techo por su base, con el vértice hacia abajo</title>
      <desc id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-fig-d">Un techo rayado del que cuelga un cono invertido: la base, de área A₀, pegada al techo, y el vértice abajo. A su izquierda, una cota vertical L del techo al vértice. Una flecha curva señala la base con el rótulo A₀.</desc>
      <defs><pattern id="ejerm8-cla4-el-cono-que-cuelga-con-su-peso-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="150" y="20" width="140" height="12" fill="url(#ejerm8-cla4-el-cono-que-cuelga-con-su-peso-r)"/><line x1="150" y1="32" x2="290" y2="32" stroke="var(--ink)" stroke-width="1.4"/>
      <polygon points="170,32 270,32 220,172" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="152" y1="34" x2="152" y2="172" stroke="var(--faint)" stroke-width="0.9"/><polygon points="152,172 149.6,166 154.4,166" fill="var(--faint)"/><polygon points="152,34 154.4,40 149.6,40" fill="var(--faint)"/>
      <text x="142" y="106" font-size="12" fill="var(--ink)" font-style="italic" text-anchor="end">L</text>
      <path d="M300 66 Q248 72 244 42" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <polygon points="244,36 247.42,42.64 242.26,43.26" fill="var(--ink)"/>
      <text x="304" y="70" font-size="12" fill="var(--ink)" font-style="italic">A₀</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: el cono cuelga del techo por su base, de área
      A₀, con el vértice hacia abajo.

      </figcaption>
      </figure>

      **Notas nuestras.** $Q$ es el peso del cono, $L$ su altura y $A_0$ el
      área de la base, que es la $A$ de los datos. Los axiles van en unidades
      de $Q$, las tensiones en unidades de $Q/A_0$ y el alargamiento en
      unidades de $QL/(EA_0)$.
    pide: >-
      El axil y la tensión a media altura del cono, en unidades de Q y de
      Q/A₀, y el alargamiento del cono, en unidades de QL/(EA₀).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué sección del cono es mayor la tensión?
        opciones:
          - texto: En la base, junto al techo, porque hacia arriba el axil crece más deprisa que el área
            correcta: true
            mensaje: |
              Eso es. A una distancia $x$ del vértice, lo que cuelga por
              debajo es un cono semejante al entero: su peso va con $x^{3}$ y
              el área de la sección, con $x^{2}$. La tensión, su cociente,
              crece en proporción a $x$.
          - texto: En todas igual, porque el axil y el área crecen a la vez hacia arriba
            mensaje: |
              Crecen los dos, pero no igual: el peso de lo que cuelga va con
              el volumen del cono pequeño, $x^{3}$, y el área con $x^{2}$. La
              tensión crece con $x$.
          - texto: En el vértice, porque allí la sección se hace cero
            mensaje: |
              La sección se hace cero, pero el peso de lo que cuelga por
              debajo se hace cero más deprisa, con $x^{3}$ frente a $x^{2}$. En
              el vértice la tensión es cero.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el trozo de cono que cuelga por
          debajo de una sección cualquiera**.
        comprueba:
          - punto: |
              **$N$ hacia arriba, en el corte.**
            porque: |
              Es lo que el resto del cono hace sobre el trozo; se supone a
              tracción.
          - punto: |
              **El peso del trozo, hacia abajo, en su centro de gravedad.**
            porque: |
              Es la única carga; cuánto vale es la primera cuenta.
          - punto: |
              **El vértice, sin nada.**
            porque: |
              Abajo no hay apoyo ni carga: el trozo solo cuelga.
        figura: |
          <svg viewBox="0 0 220 190" role="img" width="220" height="190" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El trozo de cono que cuelga por debajo de una sección</title>
            <desc id="dsl-d">Un triángulo con el vértice abajo, el trozo del cono que va del vértice a una sección a la altura x. A trazos, el resto del cono hasta el techo. En el corte, N hacia arriba. En su centro de gravedad, su peso, Q de x, a trazos, hacia abajo. A la derecha, la cota x y la flecha del eje x, hacia arriba.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M75 80 H145 L110 180 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M75 80 L50 8 H170 L145 80" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M200 180 v-36" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
            <path d="M172 80 V180 M168 80 H176 M168 180 H176" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="178" y="134" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
            <line x1="110" y1="76" x2="110" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="118" y="48" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
            <line x1="110" y1="105" x2="110" y2="145" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
            <text x="133" y="142" font-size="10" text-anchor="start" fill="var(--flag)">Q(x)</text>
            <text x="206" y="152" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
          </svg>

      - tipo: calcular
        titulo: El axil a media altura
        pregunta: |
          A media altura, a $L/2$ del vértice, ¿cuánto vale $N$, en unidades
          de $Q$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.002
          formato: un número, N dividido entre Q
        distractores:
          - valor: '0.5'
            mensaje: |
              Es la mitad del peso, como en una barra de sección constante.
              Por debajo de media altura cuelga un cono semejante de altura
              $L/2$, y su volumen va con el cubo de la altura.
          - valor: '0.25'
            mensaje: |
              Has tomado el peso proporcional al área de la sección,
              $(x/L)^{2}$. Es proporcional al volumen del cono de debajo, que va
              con el cubo de su altura.
          - valor: '0.875'
            mensaje: |
              Es el peso de lo que hay por encima de media altura. La sección
              sostiene lo que cuelga por debajo.
        pista: |
          Lo que cuelga por debajo de media altura es un cono semejante al
          entero, de altura $L/2$: su peso va con el cubo de la altura.
        desarrollo: |
          $$
          N\!\left(\tfrac{L}{2}\right) = Q\left(\tfrac{1}{2}\right)^{3} = 0{,}125\,Q
          $$

      - tipo: calcular
        titulo: La tensión a media altura
        pregunta: |
          ¿Y la tensión a media altura, en unidades de $Q/A_0$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, σ dividido entre Q/A0
        distractores:
          - valor: '0.125'
            mensaje: |
              Has dividido el axil entre el área de la base, $A_0$. A media
              altura el radio es la mitad, y la sección, la cuarta parte.
          - valor: '2'
            mensaje: |
              Has tomado el axil de una barra de sección constante, $Q/2$, y lo
              has dividido entre la sección del cono a esa altura, $A_0/4$. El
              axil del cono a media altura es mucho menor.
          - valor: '0.25'
            mensaje: |
              Has tomado la sección proporcional al radio. A media altura el
              radio es la mitad y el área, la cuarta parte.
        pista: |
          A media altura la sección es $A_0/4$.
        desarrollo: |
          $$
          \sigma_x = \frac{N}{A} = \frac{0{,}125\,Q}{0{,}25\,A_0} = 0{,}5\,\frac{Q}{A_0}
          $$

          Ojo con una coincidencia: una barra de sección $A_0$ que pesara lo
          mismo, $Q$, tendría a media altura $0{,}5\,Q$ sobre $A_0$, y la
          misma tensión. Sale igual por los dos lados, pero el axil y el área
          del cono son los de arriba, no esos.

      - tipo: calcular
        titulo: El alargamiento del cono
        pregunta: |
          ¿Cuánto se alarga el cono, en unidades de $QL/(EA_0)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre QL/(EA0)
        distractores:
          - valor: '1.5'
            mensaje: |
              Es $\rho g L^{2}/(2E)$, la fórmula de la barra de sección
              constante, con el peso específico del cono,
              $\rho g = 3Q/(A_0L)$. En el cono la tensión a una distancia $x$
              del vértice es $\rho g x/3$, un tercio de la de la barra.
          - valor: '0.1667'
            mensaje: |
              Has sacado el peso específico con el volumen de un cilindro,
              $\rho g = Q/(A_0L)$. El volumen del cono es $A_0L/3$.
          - valor: '0.25'
            mensaje: |
              Has dejado el área de la base en toda la altura: con
              $N = Q(x/L)^{3}$ y $A = A_0$ sale $QL/(4EA_0)$. La sección se
              estrecha hacia abajo, y eso sube la tensión.
          - valor: '1'
            mensaje: |
              Es $QL/(EA_0)$, el alargamiento de una barra de sección $A_0$
              con todo el peso colgado del extremo. Al cono el peso le cuelga
              repartido, y la mayor parte cerca de la base.
          - valor: '0.3333'
            mensaje: |
              Has tomado la sección proporcional al radio, $A_0\,x/L$. Va con
              el cuadrado del radio: $A = A_0\,(x/L)^{2}$.
        pista: |
          El alargamiento es la ec. 8.8 sin $\varepsilon_0$,
          $\Delta L = \int_0^L N/(EA)\,dx$, y aquí
          $N/A = \sigma_x = Qx/(A_0L)$.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{N}{EA}\,dx = \int_0^L \frac{Q\,x}{E A_0 L}\,dx
          = \frac{QL}{2EA_0} = 0{,}5\,\frac{QL}{EA_0}
          $$

          Es el mismo número que daría una barra de sección $A_0$ que pesara
          $Q$, porque sección a sección las dos tienen la misma tensión. Con el
          mismo material no: el cono pesa un tercio de esa barra, y se alarga
          un tercio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que cuelga por debajo de una sección a una distancia $x$ del
              vértice es un cono semejante: $N = Q(x/L)^{3}$.
          - texto: >-
              La sección a esa altura es $A = A_0(x/L)^{2}$.
          - texto: >-
              La tensión, $\sigma_x = N/A = Qx/(A_0L)$, crece desde cero en el
              vértice hasta $Q/A_0$ en la base.
          - texto: >-
              Integrando $\sigma_x/E$ desde el vértice hasta la base,
              $\Delta L = QL/(2EA_0)$.
          - texto: >-
              Con $Q = \rho g A_0 L/3$, es $\rho g L^{2}/(6E)$.
          - texto: >-
              Por su peso, cualquier pieza colgada se alarga
              $\rho g L^{2}/(2E)$: la forma de la sección no cuenta.
            trampa: true
            mensaje: |
              Esa es la de la sección constante. En el cono la tensión a una
              distancia $x$ del vértice es $\rho g x/3$, un tercio de la de la
              barra, y el alargamiento sale un tercio: $\rho g L^{2}/(6E)$.
    resolucion: |
      **1. El sólido libre.** El trozo de cono que cuelga por debajo de una
      sección cualquiera. Se mide $x$ desde el vértice hacia arriba.

      <figure class="figura-examen">
      <svg viewBox="0 0 220 190" role="img" width="330" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El trozo de cono que cuelga por debajo de una sección</title>
        <desc id="dsl-d">Un triángulo con el vértice abajo, el trozo del cono que va del vértice a una sección a la altura x. A trazos, el resto del cono hasta el techo. En el corte, N hacia arriba. En su centro de gravedad, su peso, Q de x, a trazos, hacia abajo. A la derecha, la cota x y la flecha del eje x, hacia arriba.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M75 80 H145 L110 180 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M75 80 L50 8 H170 L145 80" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M200 180 v-36" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M172 80 V180 M168 80 H176 M168 180 H176" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="178" y="134" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <line x1="110" y1="76" x2="110" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="118" y="48" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="110" y1="105" x2="110" y2="145" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
        <text x="133" y="142" font-size="10" text-anchor="start" fill="var(--flag)">Q(x)</text>
        <text x="206" y="152" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
      </svg>
      <figcaption>

      El trozo de cono de altura x que cuelga por debajo del corte: N, supuesto a tracción, lo sostiene, y su peso, Q(x), actúa en su centro de gravedad. El vértice no tiene nada.

      </figcaption>
      </figure>

      - **La sección a la altura $x$** es un círculo de radio proporcional a
        $x$: su área es $A(x) = A_0\,(x/L)^{2}$.
      - **Lo que cuelga por debajo** es un cono semejante al entero, de altura
        $x$: su volumen, y con él su peso, va con el cubo de la altura.
      - **Cada rebanada está a tracción simple**, con $\sigma_x = N/A$.

      **2. Incógnitas.** El axil $N(x)$, la tensión $\sigma_x(x)$ y el
      alargamiento del cono.

      **3. Ecuaciones.** El equilibrio del trozo, la tensión (ec. 8.5) y el
      alargamiento con $N$ y $A$ variables (ec. 8.8, sin término térmico):

      $$
      N(x) = Q\left(\frac{x}{L}\right)^{3}
      \qquad
      \sigma_x = \frac{N}{A}
      \qquad
      \Delta L = \int_0^L \frac{N}{EA}\,dx
      $$

      **4. Resultados.** **La tensión** crece en proporción a la distancia al
      vértice:

      $$
      \sigma_x = \frac{Q}{A_0}\,\frac{x}{L}
      $$

      Cero en el vértice y $Q/A_0$ en la base, que es donde el cono está más
      cargado. A media altura, $N = 0{,}125\,Q$ sobre una sección $A_0/4$:
      $\sigma_x = 0{,}5\,Q/A_0$.

      **El alargamiento.**

      $$
      \Delta L = \int_0^L \frac{Q\,x}{E A_0 L}\,dx = \frac{QL}{2EA_0}
      $$

      **5. Comprobación.** El axil también sale sumando el peso de las
      rebanadas de debajo, $N(L/2) = \int_0^{L/2} \rho g\,A(x)\,dx$ con
      $\rho g = 3Q/(A_0L)$, y da el mismo $0{,}125\,Q$. Y el motor, con el
      cono partido en 2000 tramos de sección constante y el peso de cada
      rebanada en sus nudos, da $0{,}5000\,QL/(EA_0)$ de alargamiento.

      **Lo que dice el resultado.** Con el peso específico: el volumen del
      cono es $A_0L/3$, así que $Q = \rho g A_0L/3$ y
      $\Delta L = \rho g L^{2}/(6E)$, un tercio de lo que se alarga por su
      peso una barra de sección constante de la misma altura y el mismo
      material.

      Una coincidencia que conviene ver para no fiarse de ella: en unidades
      de $Q$, el cono se alarga lo mismo que una barra de sección $A_0$ que
      pesara también $Q$, porque sección a sección las dos tienen la misma
      tensión, $Qx/(A_0L)$. Esa barra sería de un material tres veces más
      ligero. Con el mismo material, que es lo que da $\rho g$, el cono se
      alarga un tercio.

  # ── Propuesta A5 de clase · las cinco barras en cometa.
