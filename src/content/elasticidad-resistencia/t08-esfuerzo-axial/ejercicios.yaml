        <line x1="120" y1="70" x2="120" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="128" y="50" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">2</tspan></text>
        <line x1="110" y1="128" x2="110" y2="162" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="116" y="158" font-size="10" text-anchor="start" fill="var(--flag)">W</text>
        <text x="94" y="92" font-size="9" text-anchor="end" fill="var(--faint)">1</text>
        <text x="126" y="92" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
      </svg>
      <figcaption>

      El pasador: las dos barras, cortadas y supuestas a tracción, tiran de él hacia arriba, y W cuelga de él. Dos incógnitas y una ecuación.

      </figcaption>
      </figure>

      - **Las dos barras se suponen a tracción**, tirando del pasador hacia
        arriba.
      - **$W$ cuelga del pasador.**
      - **Las dos fuerzas son verticales**: el equilibrio vertical es la única
        ecuación, para dos axiles. Es hiperestático de grado uno (apuntes del
        tema 8, p. 4).

      **2. Incógnitas.** $N_1$ y $N_2$, y lo que baja el pasador, $\delta$.

      **3. Ecuaciones.** El equilibrio vertical del pasador:

      $$
      N_1 + N_2 = W = 10\ \text{kN}
      $$

      La compatibilidad: el techo y la ménsula no se mueven, y las dos barras
      acaban en el mismo pasador. Si el pasador baja $\delta$, cada barra se
      alarga eso:

      $$
      \Delta L_1 = \Delta L_2 = \delta
      $$

      Y la ley de cada barra: se alarga $NL/(EA)$ (ec. 8.9, p. 7, sin
      temperatura). Con la misma $E$ y la misma $A$:

      $$
      \frac{N_1 L_1}{E A} = \frac{N_2 L_2}{E A}
      \;\Longrightarrow\;
      N_1 L_1 = N_2 L_2
      \;\Longrightarrow\;
      N_1 = \frac{L_2}{L_1}\,N_2 = \frac{2}{3}\,N_2
      $$

      **4. Resultados.** Con el equilibrio, $\tfrac{5}{3}\,N_2 = 10$ kN:
      $N_2 = 6$ kN y $N_1 = 4$ kN, las dos a tracción.

      **Tensiones y descenso.**

      $$
      \sigma_1 = \frac{4000}{50} = 80\ \text{MPa}
      \qquad
      \sigma_2 = \frac{6000}{50} = 120\ \text{MPa}
      $$

      $$
      \delta = \frac{N_1 L_1}{E A} = \frac{4000 \cdot 3000}{2 \cdot 10^{5} \cdot 50} = 1{,}2\ \text{mm}
      $$

      **5. Comprobación.** Las dos barras son dos muelles en paralelo, cada
      uno con su rigidez $k = EA/L$:

      $$
      k_1 = \frac{2 \cdot 10^{5} \cdot 50}{3000} = 3333{,}3\ \text{N/mm}
      \qquad
      k_2 = \frac{2 \cdot 10^{5} \cdot 50}{2000} = 5000\ \text{N/mm}
      $$

      El pasador baja $\delta = W/(k_1 + k_2) = 10\,000/8333{,}3 = 1{,}2$ mm,
      y cada barra lleva $k\,\delta$: $3333{,}3 \cdot 1{,}2 = 4000$ N y
      $5000 \cdot 1{,}2 = 6000$ N. Las deformaciones son
      $\varepsilon_1 = 1{,}2/3000 = 4 \cdot 10^{-4}$ y
      $\varepsilon_2 = 1{,}2/2000 = 6 \cdot 10^{-4}$, y $E\varepsilon$ da 80 y
      120 MPa. El motor del curso (`barras.ts`), con las dos barras llegando
      al mismo nudo, da las mismas cifras.

      **Lo que dice el resultado.** Es la regla del reparto: cada barra lleva
      la carga en proporción a su rigidez, $EA/L$, y la corta es la más
      rígida. Se alargan lo mismo, pero no se deforman lo mismo: la corta
      reparte el mismo alargamiento en menos longitud. Las dos tensiones
      quedan muy por debajo del límite elástico de un acero corriente.

      **Para el escalón siguiente.** En la cuestión de 2018-2019, la siguiente
      del escalón, los dos cables miden lo mismo y son de distinto material, y
      pasan por dos poleas antes de llegar al peso.

  # ── Ejercicio propio, de práctica · la barra que no puede alargarse, de la tensión a la temperatura.
  - id: ejerm8-el-carril-soldado-sin-juntas
    titulo: El carril soldado sin juntas, en invierno y en verano
    fuente: Ejercicio propio · Road to Ingeniería. De nivel de los ejercicios de clase, escrito para un escalón al que los ejercicios de clase del tema 8 no dan material. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: practica
    antes:
      idea: |
        El carril no puede cambiar de longitud: lo que la temperatura querría
        alargarlo o acortarlo lo tiene que deshacer su tensión.
      formula: |
        $$
        \Delta L = \frac{NL}{EA} + \alpha\,\Delta T\,L
        $$

        El alargamiento de una barra con axil y con un cambio de temperatura
        (ec. 8.9, p. 7, con $\varepsilon_0 = \alpha\Delta T$, ec. 8.3).
      reconocer: |
        Antes de las cuentas, escribe el alargamiento de un trozo cualquiera
        del carril y mira de qué depende.
    enunciado: |
      Un carril de ferrocarril de acero, con $E = 210\ \text{GPa}$ y
      $\alpha = 12 \cdot 10^{-6}$ por grado, se suelda en barra larga, sin
      juntas, a una temperatura de 20 °C, y queda sin tensión. Está sujeto a
      las traviesas en toda su longitud, y lejos de sus extremos no puede
      alargarse ni acortarse.

      a) ¿Qué tensión tiene el carril una noche en que está a −10 °C?

      b) La tracción admisible del carril es de 120 MPa. ¿A qué temperatura
      del carril se llega a ella?

      c) La compresión se limita a 80 MPa, para que la vía no se pandee de
      lado. ¿A qué temperatura del carril se llega a ella?

