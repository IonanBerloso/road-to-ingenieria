            <line x1="70" y1="140" x2="70" y2="106" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="76" y="136" font-size="10" text-anchor="start" fill="var(--d2-tinta)">B<tspan font-size="7.5" dy="2.5">y</tspan></text>
