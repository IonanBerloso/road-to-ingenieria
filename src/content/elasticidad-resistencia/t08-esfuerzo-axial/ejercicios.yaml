      <figcaption>

      Redibujada del ejemplo, sin deformar: A, apoyo fijo; B, apoyo móvil;
      las patas, articuladas en C, y el tirante MN, horizontal, a la altura
      x. La posición deformada, que el original dibuja encima, está en la
      resolución.

      </figcaption>
      </figure>

      **Notas nuestras.** Las patas AC y BC son rígidas e iguales, de
      longitud $L$, y cada una forma el ángulo $\theta$ con la vertical. A
      es un apoyo fijo, y B, un apoyo móvil. Para las cifras, un ejemplo
      nuestro: $L = 1\ \text{m}$,
      $\theta = 20^{\circ}$, $x = 0{,}45\ \text{m}$ y
      $\delta = 0{,}3\ \text{mm}$.
    pide: >-
      Con el ejemplo de la nota, el ángulo que gira la pata AC, en unidades
      de 10⁻⁴ rad, y el desplazamiento de B, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pata AC solo puede girar alrededor de A. ¿Qué hace la pata BC?
        opciones:
          - texto: Se traslada con B en horizontal y gira alrededor de la nueva posición de B, el mismo ángulo que AC y en sentido contrario
            correcta: true
            mensaje: |
              Eso es, los pasos 2 y 3 del ejemplo. B solo puede ir en
              horizontal, y con esa traslación C pasa a C″, a la misma
              altura. Luego BC gira alrededor de B′ hasta que su extremo
              coincide con el C′ de la otra pata. CC′ y C″C′ forman el mismo
              ángulo θ con la horizontal y miden lo mismo, así que los dos
              giros son iguales.
          - texto: Gira alrededor de B, que no se mueve, el mismo ángulo que AC
            mensaje: |
              Si B no se moviera, las dos patas girarían alrededor de dos
              puntos fijos, y C tendría que estar en dos arcos a la vez: solo
              podría quedarse quieto, y el tirante no se alargaría. B está
              sobre un apoyo móvil y se va en horizontal.
          - texto: Se traslada con B en horizontal, sin girar
            mensaje: |
              Entonces C pasaría a C″, a la misma altura que C, y AC, que
              solo gira alrededor de A, no puede llevar su extremo ahí: lo
              mueve en perpendicular a la pata. BC tiene que girar también,
              hasta que su C coincida con el de AC.
          - texto: Gira alrededor de C, que es la articulación entre las dos patas
            mensaje: |
              C no es un punto fijo: es la articulación, y se mueve con AC
              cuando esta gira alrededor de A. El punto de BC que tiene el
              movimiento limitado es B, sobre el apoyo móvil.

      - tipo: calcular
        titulo: El giro de las patas
        pregunta: |
          Con el ejemplo de la nota, ¿cuánto gira la pata AC, en unidades de
          $10^{-4}$ rad?
        respuesta:
          tipo: numero
          valor: '3.063'
          tolerancia: 0.01
          formato: un número, β dividido entre 10⁻⁴ rad
        distractores:
          - valor: '2.878'
            mensaje: |
              Te falta el $\cos\theta$. El tirante es horizontal, y de lo que
              se mueven M y N por el giro solo cuenta la parte horizontal,
              $d\beta\cos\theta$. Si lo que has hecho es usar $x$ en lugar de
              $d = x/\cos\theta$, sale casi lo mismo, 2,902: $d$ es la
              distancia de A a M medida sobre la pata, no la altura del
              tirante.
          - valor: '1.596'
            mensaje: |
              Has tomado $\delta = \delta_B$, como si el tirante se alargara
              lo que se va B. El giro de las patas acerca M y N, y
              $\delta = \delta_B - 2d\beta\cos\theta$, la ecuación (1) del
              ejemplo.
          - valor: '6.126'
            mensaje: |
              Te falta el 2. Las dos patas giran β: cada una acerca su
              extremo del tirante $d\beta\cos\theta$, y B se va el doble de
              lo que C se mueve en horizontal, $\delta_B = 2L\beta\cos\theta$.
        pista: |
          Las ecuaciones (1) y (2) del ejemplo:
          $\delta = \delta_B - 2d\tan\beta\cos\theta$ y
          $\delta_B = 2L\tan\beta\cos\theta$, con $d = x/\cos\theta$. Con un
          giro pequeño, $\tan\beta = \beta$.
        desarrollo: |
          $$
          d = \frac{x}{\cos\theta} = \frac{0{,}45\ \text{m}}{0{,}93969} = 0{,}47888\ \text{m}
          $$

          Con δ y las longitudes en mm:

          $$
          \beta = \frac{\delta}{2\,(L - d)\cos\theta} = \frac{0{,}3}{2 \cdot 521{,}12 \cdot 0{,}93969} = 3{,}063 \cdot 10^{-4}
          $$

      - tipo: calcular
        titulo: El desplazamiento de B
        pregunta: |
          ¿Cuánto se desplaza B, en mm?
        respuesta:
          tipo: numero
          valor: '0.5757'
          tolerancia: 0.002
          formato: un número, en mm
        distractores:
          - valor: '0.3'
            mensaje: |
              Es el alargamiento del tirante: has tomado $\delta_B = \delta$.
              El giro de las patas acerca M y N, y B tiene que irse más de lo
              que se alarga el tirante.
          - valor: '0.5455'
            mensaje: |
              Has usado $x$ en lugar de $d = x/\cos\theta$, o has llevado a la
              ecuación (2) el giro sin el $\cos\theta$, $2{,}878 \cdot 10^{-4}$,
              que da 0,5409: los dos errores caen aquí. $d$ es la distancia de
              A a M medida sobre la pata, y el giro lleva el $\cos\theta$ de la
              parte horizontal del movimiento de M.
          - valor: '0.6265'
            mensaje: |
              Has dividido entre $d$, la distancia de A a M, donde va
              $L - d$, la de M a C.
          - valor: '0.1563'
            mensaje: |
              Es la fracción al revés, $(L - d)/L$. De (1) y (2),
              $\delta_B = L\,\delta/(L - d)$.
        pista: |
          La fórmula final del ejemplo, $\delta_B = L\,\delta/(L - d)$, no
          necesita el giro. Si usas la ecuación (2),
          $\delta_B = 2L\tan\beta\cos\theta$, el giro es el de la ecuación
          (3), con su $\cos\theta$ en el denominador.
        desarrollo: |
          $$
          \delta_B = \frac{L}{L - d}\,\delta = \frac{1000}{521{,}12} \cdot 0{,}3\ \text{mm} = 0{,}5757\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              AC gira β alrededor de A: M se mueve $d\beta$, en perpendicular
              a la pata, y su parte horizontal es $d\beta\cos\theta$.
          - texto: >-
              BC se traslada con B, $\delta_B$ en horizontal, y gira
              alrededor de B′ el mismo β, en sentido contrario.
          - texto: >-
              El tirante es horizontal:
              $\delta = \delta_B - 2d\beta\cos\theta$, la ecuación (1) del
              ejemplo.
          - texto: >-
              C es de las dos patas, y se mueve lo mismo con las dos:
              $\delta_B = 2L\beta\cos\theta$, la ecuación (2).
          - texto: >-
              De las dos, $\beta = \delta/(2(L - d)\cos\theta)$ y
              $\delta_B = L\,\delta/(L - d)$.
          - texto: >-
              El tirante es lo único que se deforma, así que B se va lo que
              se alarga el tirante, $\delta_B = \delta$.
            trampa: true
            mensaje: |
              Las patas no se deforman, pero giran, y al girar acercan M y N:
              el tirante se alarga lo que se va B menos lo que le quita el
              giro de cada pata.
    resolucion: |
      **El proceso de deformación.** El sistema es isostático: la fuerza
      del tirante sale de la estática, y con ella su alargamiento $\delta$,
      que aquí es un dato. Las patas son rígidas, así que todo el
      movimiento sale de ese alargamiento. El ejemplo lo sigue en tres
      pasos (apartado 8.4 de los apuntes, p. 7):

      1. AC no puede trasladarse, porque A es fijo, y no se deforma: gira
         alrededor de A hasta AC′. M pasa a M′.
      2. BC tampoco se deforma. B solo puede moverse en horizontal: BC se
         traslada con él hasta B′C″, y N pasa a N″.
      3. BC gira alrededor de B′ hasta B′C′, con su extremo en el mismo C′
         que AC. N pasa de N″ a N′.

