      Nuestra, con el giro exagerado. A se mueve en horizontal; la barra 1
      solo se alarga la proyección de ese movimiento sobre su dirección.

      </figcaption>
      </figure>

      Cada barra se alarga la proyección del desplazamiento de su extremo
      sobre ella (ec. 8.12). La 2 es vertical y se alarga lo que baja B; la 1
      forma 45° con el movimiento de A:

      $$
      \Delta L_2 = \theta L
      \qquad
      \Delta L_1 = \theta L \cos 45^{\circ} = \frac{\theta L}{\sqrt{2}}
      $$

      **Ley de cada barra** (ec. 8.9), con $L_1 = L\sqrt{2}$ y $L_2 = L$:

      $$
      N_2 = \frac{EA\,\Delta L_2}{L} = EA\,\theta
      \qquad
      N_1 = \frac{EA\,\Delta L_1}{L\sqrt{2}} = \frac{EA\,\theta}{2}
      $$

      **4. Resultados.** **Las fuerzas.** Con $N_1 = N_2/2$ en los momentos,
      $N_2\left(1 + \tfrac{1}{2\sqrt{2}}\right) = 2P$:

      $$
      N_2 = \frac{4\sqrt{2}}{2\sqrt{2} + 1}\,P
      = \frac{4\sqrt{2}\,(2\sqrt{2} - 1)}{7}\,P
      = \frac{16 - 4\sqrt{2}}{7}\,P = 1{,}4776\,P
      \qquad
      N_1 = \frac{N_2}{2} = \frac{8 - 2\sqrt{2}}{7}\,P = 0{,}7388\,P
      $$

      Las dos a tracción, como se supuso.

      **El desplazamiento de D.** El giro sale de la barra 2,
      $\theta = N_2/(EA) = 1{,}4776\,P/(EA)$. D está a $2L$ de O en
      horizontal y a $L$ por debajo:

      $$
      u_D = -\theta L = -1{,}4776\,\frac{PL}{EA}
      \qquad
      v_D = -2\theta L = -2{,}9552\,\frac{PL}{EA}
      $$

      **5. Comprobación.** La reacción de O sale del equilibrio global: en
      horizontal, $R_x = -N_1/\sqrt{2} = -0{,}5224\,P$; en vertical,
      $R_y = P - N_1/\sqrt{2} - N_2 = -P$, es decir, O tira de la pieza hacia
      abajo con $P$. Y los momentos en O con las dos fuerzas:
      $0{,}5224 + 1{,}4776 = 2$, que es $2PL$ en unidades de $PL$.

      **Lo que dice el resultado.** A no se queda quieta por estar bajo O: se
      mueve en horizontal, y la barra 1 se alarga. La barra a 45° lleva la
      mitad que la vertical: se alarga menos ($1/\sqrt{2}$) y es más larga
      ($\sqrt{2}$). Y D se va a la izquierda y baja el doble de lo que se va.

  # ── Ejercicio de clase 8.3 · el nudo de tres barras, con la 2 calentada.
  - id: ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada
    titulo: El nudo C con tres barras, y la barra 2 con un cambio de temperatura
    fuente: >-
      Ejercicio 8.3 · Tema 8, «Esfuerzo axial simple» · Elasticidad y
      Resistencia de Materiales, UPV/EHU, ejercicios de clase (el fichero del
      8.3 lleva la fecha del 4 de noviembre de 2019). El material no trae
      solución: la resolución es nuestra, con el convenio del tema 8, y cada
      cifra está calculada con el motor del curso y comprobada por un segundo
      camino (el método de las fuerzas, con el equilibrio de C y la
      compatibilidad, y la proyección del desplazamiento de C sobre la barra
      3). El enunciado pide las fuerzas «en función de» los datos, y aquí se
      pregunta por el coeficiente de cada término. La figura está
      redibujada; como en el original, no lleva cotas.
    nivel: practica
    antes:
      idea: |
        El nudo tiene tres barras y solo dos ecuaciones de equilibrio. La que
        falta sale de que las tres barras se alargan según cómo se mueve C.
      formula: |
        $$
        \Delta L = \vec u\cdot\vec e
        $$

        Lo que se alarga una barra con un extremo fijo: el desplazamiento del
        otro extremo, proyectado sobre la dirección de la barra contada desde
        su apoyo (ec. 8.12).
      reconocer: |
        Antes de las cuentas, cuenta las barras y las ecuaciones del nudo, y
        escribe la dirección de cada barra desde su apoyo.
    enunciado: |
      En la estructura articulada de la figura, todas las barras son de la
      misma longitud y sección. Además de las cargas sobre el nudo C, la
      barra 2 sufre una variación de temperatura $\Delta T$. Determinar:

      a/ Fuerzas en las barras en función de $\alpha$, $E$, $A$, $\Delta T$, $P$.

      b/ Desplazamiento horizontal y vertical del nudo C.

      <figure class="figura-examen">
      <svg viewBox="62 46 220 170" role="img" width="220" height="170" aria-labelledby="ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-fig-t ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-fig-d">
      <title id="ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-fig-t">El nudo C, unido por tres barras a la pared, al suelo y al techo</title>
      <desc id="ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-fig-d">Un nudo C del que salen tres barras de la misma longitud. La barra 1 va horizontal hacia la izquierda, hasta una articulación en una pared. La barra 2 baja vertical hasta una articulación en el suelo. La barra 3 sube hacia la derecha, a 30° de la horizontal, hasta una articulación en el techo. En C actúan una fuerza P vertical hacia abajo y una fuerza 2P horizontal hacia la derecha.</desc>
