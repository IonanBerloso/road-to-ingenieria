        <line x1="200" y1="80" x2="188" y2="59.2" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="200" y1="80" x2="212" y2="59.2" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="200" y1="80" x2="200" y2="56" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="70" y1="80" x2="96" y2="80" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="200" y1="80" x2="226" y2="80" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M87.3 90 A20 20 0 0 0 90 80" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
