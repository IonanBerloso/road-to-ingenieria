      <figcaption>

      Redibujada del enunciado: A, B y C, articulados en la pared; la barra
      BD, horizontal, y el resorte, vertical entre D y el suelo. A
      diferencia del original, el dibujo está a escala, salvo el canto de
      BD.

      </figcaption>
      </figure>

      **Notas nuestras.** La barra 2 y el resorte se unen a BD en su
      extremo D, por debajo, en el mismo punto al que llega la barra 1 por
      encima: así casan las longitudes del texto. El canto de BD se
      desprecia. El enunciado no da el material ni la sección: se toman
      iguales en las barras 1 y 2. La $L$ de los datos es la longitud de la
      barra 1. Los axiles se preguntan
      en unidades de $P$, positivos a tracción, y el movimiento vertical de
      D, positivo hacia abajo, en unidades de $PL/(EA)$.
    pide: >-
      El movimiento vertical de D, en unidades de PL/(EA), y los axiles de
      las barras 1 y 2, en unidades de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          BD gira un ángulo pequeño alrededor de B, y D se mueve en vertical
          $v$, positivo hacia abajo. ¿Cuánto se alargan las barras y el
          resorte?
        opciones:
          - texto: $\Delta L_1 = v\operatorname{sen} 30^{\circ}$ y $\Delta L_2 = -v\cos 30^{\circ}$, y el resorte se acorta $v$
            correcta: true
            mensaje: |
              Eso es. Cada barra se alarga lo que D avanza en su dirección,
              contada desde su apoyo (apuntes, ec. 8.12). La 1 baja de A a D,
              a 30° por debajo de la horizontal: si D baja, se aleja de A, y
              la 1 se alarga $v\operatorname{sen} 30^{\circ}$. La 2 sube de C
              a D, a 30° de la vertical: si D baja, se acerca a C, y la 2 se
              acorta $v\cos 30^{\circ}$. El resorte va de D al suelo, en
              vertical, y se acorta $v$.
          - texto: $\Delta L_1 = v$ y $\Delta L_2 = -v$, y el resorte se acorta $v$
            mensaje: |
              Las barras no son verticales: de lo que baja D, cada una solo
              nota la parte en su dirección. La 1 forma 30° con BD, y la 2,
              30° con la vertical.
          - texto: $\Delta L_1 = v\cos 30^{\circ}$ y $\Delta L_2 = -v\operatorname{sen} 30^{\circ}$, y el resorte se acorta $v$
            mensaje: |
              Has cambiado los ángulos. La 1 forma 30° con la horizontal, y
              la parte vertical de su dirección va con el seno; la 2 forma
              30° con la vertical, y la suya va con el coseno.
          - texto: $\Delta L_1 = -v\operatorname{sen} 30^{\circ}$ y $\Delta L_2 = v\cos 30^{\circ}$, y el resorte se alarga $v$
            mensaje: |
              Están los tres al revés. La 1 cuelga de A, por encima de D: si
              D baja, se aleja de A y la 1 se alarga. La 2 y el resorte están
              por debajo: D se les acerca, y se acortan.

      - tipo: calcular
        titulo: El movimiento de D
        pregunta: |
          ¿Cuánto se mueve D en vertical, positivo hacia abajo, en unidades
          de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '1.0718'
          tolerancia: 0.002
          formato: un número con signo, vD dividido entre PL/(EA)
        distractores:
          - valor: '1.4641'
            mensaje: |
              Es lo que bajaría D sin el resorte, con las dos barras solas.
              El resorte también se acorta cuando D baja, empuja hacia
              arriba y se lleva parte de la carga.
          - valor: '0.8'
            mensaje: |
              Has tomado los alargamientos sin proyectar,
              $\Delta L_1 = v$ y $\Delta L_2 = -v$, o la barra 2 de longitud
              $L$ con la proyección: los dos errores dan este mismo número.
              Cada barra se alarga lo que D avanza en su dirección, y la 2
              mide $\sqrt{3}\,L$.
          - valor: '0.8739'
            mensaje: |
              Has cambiado los ángulos. La 1 forma 30° con la horizontal y la
              2, 30° con la vertical: la parte vertical va con el seno en la
              1 y con el coseno en la 2, al proyectar y al sumar fuerzas.
          - valor: '2.3094'
            mensaje: |
              Has hecho tirar al resorte de D hacia abajo. Está por debajo:
              cuando D baja, se acorta y empuja hacia arriba.
        pista: |
          Momentos en B: las dos barras, el resorte y $P$ actúan en D, a la
          misma distancia de B, así que basta con que sus componentes
          verticales sumen cero:
          $N_1\operatorname{sen} 30^{\circ} - N_2\cos 30^{\circ} - F = P$,
          con $F$ la fuerza del resorte, positiva si tira. Escribe cada
          fuerza con $v$.
        desarrollo: |
          $$
          N_1 = \frac{EA}{L}\,\frac{v}{2}
          \qquad
          N_2 = \frac{EA}{\sqrt{3}\,L}\left(-\frac{\sqrt{3}}{2}\,v\right) = -\frac{EA}{L}\,\frac{v}{2}
          \qquad
          F = -\frac{EA}{4L}\,v
          $$

          $$
          \frac{EA}{L}\,v\left(\frac{1}{4} + \frac{\sqrt{3}}{4} + \frac{1}{4}\right) = P
          \;\Longrightarrow\;
          v = \frac{4}{2 + \sqrt{3}}\,\frac{PL}{EA} = 4\left(2 - \sqrt{3}\right)\frac{PL}{EA} = 1{,}0718\,\frac{PL}{EA}
          $$

      - tipo: calcular
        titulo: La barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.5359'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '0.7321'
            mensaje: |
              Es el axil de la 1 sin el resorte. El resorte se acorta cuando
              D baja, empuja hacia arriba y descarga a las dos barras.
          - valor: '0.8'
            mensaje: |
              Has tomado $\Delta L_1 = v$ y $\Delta L_2 = -v$, sin proyectar.
              La 1 se alarga $v\operatorname{sen} 30^{\circ}$, solo la parte
              de lo que baja D que va en su dirección.
          - valor: '0.4'
            mensaje: |
              Has tomado la barra 2 de longitud $L$. Mide $\sqrt{3}\,L$, y con
              su longitud de verdad es más blanda y se lleva menos.
        pista: |
          $N_1 = \dfrac{EA}{L}\,\Delta L_1 = \dfrac{EA}{L}\,\dfrac{v}{2}$,
          con la $v$ del paso anterior.
        desarrollo: |
          $$
          N_1 = \frac{EA}{L}\,\frac{v}{2} = 2\left(2 - \sqrt{3}\right)P = 0{,}5359\,P
          $$

      - tipo: calcular
        titulo: La barra 2
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.5359'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '0.5359'
            mensaje: |
              El valor es ese, pero el signo no. D baja y se acerca a C: la 2
              se acorta y está comprimida.
          - valor: '-0.9282'
            mensaje: |
              Has dividido el acortamiento de la 2 entre $L$, y la 2 mide
              $\sqrt{3}\,L$: $N_2 = EA\,\Delta L_2/(\sqrt{3}\,L)$.
          - valor: '-0.7321'
            mensaje: |
              Es el axil de la 2 sin el resorte. El resorte se acorta cuando
              D baja, empuja hacia arriba y descarga a las dos barras.
          - valor: '-0.4619'
            mensaje: |
              Has tomado $\Delta L_1 = v$ y $\Delta L_2 = -v$, sin proyectar.
              La 2 se acorta $v\cos 30^{\circ}$, solo la parte de lo que baja
              D que va en su dirección.
          - valor: '-0.6928'
            mensaje: |
              Has tomado la barra 2 de longitud $L$, al buscar $v$ y al
              calcular su axil. Mide $\sqrt{3}\,L$.
        pista: |
          $N_2 = \dfrac{EA}{\sqrt{3}\,L}\,\Delta L_2$, con
          $\Delta L_2 = -v\cos 30^{\circ}$.
        desarrollo: |
          $$
          N_2 = -\frac{EA}{L}\,\frac{v}{2} = -2\left(2 - \sqrt{3}\right)P = -0{,}5359\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              BD da tres ecuaciones de equilibrio para cinco incógnitas,
              $N_1$, $N_2$, la fuerza del resorte y las dos reacciones de B:
              es hiperestático de grado dos.
          - texto: >-
              BD solo puede girar alrededor de B, así que el movimiento de
              todo se escribe con una incógnita, lo que baja D, $v$.
          - texto: >-
              La 1 se alarga $v\operatorname{sen} 30^{\circ}$, la 2 se acorta
              $v\cos 30^{\circ}$ y el resorte se acorta $v$.
          - texto: >-
              Con cada fuerza escrita con $v$, los momentos en B dan
              $v = 4(2 - \sqrt{3})\,PL/(EA)$.
          - texto: >-
              Con $v$, $N_1 = 2(2 - \sqrt{3})\,P$ y
              $N_2 = -2(2 - \sqrt{3})\,P$.
          - texto: >-
              El resorte se alarga cuando D baja, y tira de D hacia abajo,
              con la carga.
            trampa: true
            mensaje: |
              El resorte está entre D y el suelo, por debajo: cuando D baja
              se acerca al suelo, el resorte se acorta y empuja D hacia
              arriba. Ayuda a las barras, no a la carga.
    resolucion: |
      **Lo que la estática no cierra.** BD es rígida y está articulada en B.
      Sobre ella actúan las dos barras, el resorte y $P$, todos en D, y las
      dos reacciones de B. Tres ecuaciones de equilibrio y cinco incógnitas:
      hiperestático de grado dos (apuntes del tema 8, p. 4). Pero BD solo
      puede girar alrededor de B, y un giro pequeño mueve D en vertical: una
      sola incógnita de movimiento, $v$, lo que baja D, da los tres
      alargamientos.

      **Geometría.** Con $L_1 = L$ a 30° de BD, A está a $L/2$ por encima
      de B y D, a $\tfrac{\sqrt{3}}{2}L$ de B. Con $L_2 = \sqrt{3}\,L$ a 30°
      de la vertical, la 2 llega a la misma distancia horizontal,
      $\sqrt{3}\,L\operatorname{sen} 30^{\circ} = \tfrac{\sqrt{3}}{2}L$, y C
      está a $\tfrac{3}{2}L$ por debajo de B. Las dos barras llegan al mismo
      punto D.

      **Compatibilidad.** Cada barra se alarga lo que D avanza en su
      dirección, contada desde su apoyo (ec. 8.12). La 1 va de A a D, a
      30° por debajo de la horizontal; la 2, de C a D, a 30° de la
      vertical; el resorte, de D al suelo:

      $$
      \Delta L_1 = v\operatorname{sen} 30^{\circ} = \frac{v}{2}
      \qquad
      \Delta L_2 = -v\cos 30^{\circ} = -\frac{\sqrt{3}}{2}\,v
      \qquad
      \Delta L_k = -v
      $$

      **Ley de cada pieza**, $N = EA\,\Delta L/L_i$ (ec. 8.9, sin
      temperatura) en las barras y $F = K\,\Delta L_k$ en el resorte:

      $$
      N_1 = \frac{EA}{L}\,\frac{v}{2}
      \qquad
      N_2 = \frac{EA}{\sqrt{3}\,L}\left(-\frac{\sqrt{3}}{2}\,v\right) = -\frac{EA}{L}\,\frac{v}{2}
      \qquad
      F = -\frac{EA}{4L}\,v
      $$

      **El equilibrio de BD.** Momentos en B. Todo actúa en D, a
      $\tfrac{\sqrt{3}}{2}L$ de B, y BD es horizontal: solo cuentan las
      componentes verticales. La 1 a tracción tira de D hacia A, hacia
      arriba; la 2 a tracción, hacia C, hacia abajo; el resorte a tracción,
      hacia el suelo:

      $$
      N_1\operatorname{sen} 30^{\circ} - N_2\cos 30^{\circ} - F - P = 0
      $$

      $$
      \frac{EA}{L}\,v\left(\frac{1}{4} + \frac{\sqrt{3}}{4} + \frac{1}{4}\right) = P
      \;\Longrightarrow\;
      v = 4\left(2 - \sqrt{3}\right)\frac{PL}{EA} = 1{,}0718\,\frac{PL}{EA}
      $$

      **Las fuerzas.**

      $$
      N_1 = 2\left(2 - \sqrt{3}\right)P = 0{,}5359\,P
      \qquad
      N_2 = -2\left(2 - \sqrt{3}\right)P = -0{,}5359\,P
      \qquad
      F = -\left(2 - \sqrt{3}\right)P = -0{,}2679\,P
      $$

      La 1 tira y la 2 empuja con la misma fuerza: la 2 es $\sqrt{3}$ veces
      más larga, pero se acorta $\sqrt{3}$ veces más de lo que se alarga la
      1. El resorte, comprimido, empuja D hacia arriba con
      $0{,}2679\,P$. De la carga, la 1 sostiene $N_1/2$, la 2,
      $0{,}866\,|N_2|$, y el resorte, $|F|$:
      $0{,}2679 + 0{,}4641 + 0{,}2679 = 1$.

      **Comprobación por otro camino.** El motor del curso, con BD como
      sólido rígido articulado en B y el resorte como una barra de rigidez
      $K$, da el mismo giro, $\theta = v/(\tfrac{\sqrt{3}}{2}L) = 1{,}2376\,P/(EA)$,
      y las mismas tres fuerzas. Su reacción
      horizontal en B, $0{,}1962\,P$, es la que piden las componentes
      horizontales de las barras:
      $N_1\cos 30^{\circ} + N_2\operatorname{sen} 30^{\circ} = (0{,}4641 - 0{,}2679)\,P = 0{,}1962\,P$:
      BD está comprimida.

  # ── Propuesta A10 de clase · el anillo que gira.
  - id: ejerm8-cla10-el-anillo-que-gira
    titulo: El anillo que gira con velocidad angular constante
    fuente: >-
      Propuesta A10 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (el anillo con la presión interior que equivale a la fuerza centrífuga
      de su pared) y comprobada por un segundo camino (el equilibrio de medio
      anillo, sumando la fuerza centrífuga de 20 000 trozos). El enunciado no
      da números ni el espesor de la pared: los pasos usan un ejemplo
      nuestro, que dice la nota. La figura está redibujada.
    nivel: practica
    enunciado: |
      En un anillo con velocidad angular $\omega$ constante se quiere
      determinar $\sigma_1$ y $\varepsilon_1$.

      Datos:

      - El radio medio de la curvatura: $r_m$
      - Módulo de elasticidad: $E$
      - Altura del anillo: $L$
      - Peso específico: $\gamma$
      - Velocidad angular: $\omega$

      <figure class="figura-examen">
      <svg viewBox="50 22 236 190" role="img" width="236" height="190" aria-labelledby="ejerm8-cla10-el-anillo-que-gira-fig-t ejerm8-cla10-el-anillo-que-gira-fig-d">
      <title id="ejerm8-cla10-el-anillo-que-gira-fig-t">Un anillo que gira alrededor de su eje</title>
      <desc id="ejerm8-cla10-el-anillo-que-gira-fig-d">Un anillo cilíndrico corto, dibujado en perspectiva: dos bordes elípticos arriba, el de fuera y el de dentro, la pared de fuera en trazo continuo y la de dentro y el borde de abajo, en punteado. Su eje vertical, en trazo y punto, lleva arriba una flecha curva que gira a su alrededor, con el rótulo ω. A la derecha, una cota vertical L, la altura del anillo.</desc>
      <ellipse cx="150" cy="72" rx="84" ry="18" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <ellipse cx="150" cy="72" rx="66" ry="13" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="66" y1="72" x2="66" y2="170" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="234" y1="72" x2="234" y2="170" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M66 170 A84 18 0 0 0 234 170" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M66 170 A84 18 0 0 1 234 170" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="84" y1="72" x2="84" y2="170" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="216" y1="72" x2="216" y2="170" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <ellipse cx="150" cy="170" rx="66" ry="13" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="150" y1="28" x2="150" y2="206" stroke="var(--ink)" stroke-width="0.9" stroke-dasharray="7 3 1.5 3"/>
      <path d="M146 40 A12 5 0 1 0 160 44" fill="none" stroke="var(--ink)" stroke-width="1"/>
      <polygon points="166,44.6 159.77,46.59 160.29,41.41" fill="var(--ink)"/>
      <text x="172" y="40" font-size="12" fill="var(--ink)" font-style="italic">ω</text>
      <line x1="260" y1="72" x2="260" y2="170" stroke="var(--faint)" stroke-width="0.9"/><polygon points="260,170 257.6,164 262.4,164" fill="var(--faint)"/><polygon points="260,72 262.4,78 257.6,78" fill="var(--faint)"/>
      <text x="266" y="125" font-size="12" fill="var(--ink)" font-style="italic">L</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: un anillo de altura L que gira con
      velocidad angular ω alrededor de su eje.

      </figcaption>
      </figure>

      **Notas nuestras.** $\sigma_1$ es la tensión en la dirección de la
      circunferencia, y $\varepsilon_1$, la deformación en esa dirección. El
      espesor de la pared, que el enunciado no da, se llama aquí $t$, y es
      pequeño frente a $r_m$. Para las cifras, un ejemplo nuestro, un anillo
      de acero: $\gamma = 78{,}5\ \text{kN/m}^{3}$, $g = 9{,}81\ \text{m/s}^{2}$,
      $r_m = 0{,}5\ \text{m}$, $L = 0{,}1\ \text{m}$, $t = 1\ \text{cm}$,
      $\omega = 200\ \text{rad/s}$ y $E = 210\ \text{GPa}$.
    pide: >-
      Con el ejemplo de la nota, σ1, en MPa, y ε1, en unidades de 10⁻⁴.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué carga hace trabajar a la pared del anillo?
        opciones:
          - texto: La fuerza centrífuga de su propia masa, hacia fuera, que hace con la pared lo que una presión interior
            correcta: true
            mensaje: |
              Eso es. Cada trozo de pared gira en una circunferencia de
              radio $r_m$, y para seguir en ella necesita una fuerza hacia
              el eje, $dm\,\omega^2 r_m$, que le dan los trozos de al lado
              tirando de él. Visto desde el anillo, es una carga repartida
              hacia fuera, como la presión interior de un anillo
              (apartado 8.5.2 de los apuntes): la pared trabaja a tracción
              en la dirección de la circunferencia.
          - texto: El peso propio, que comprime la pared en vertical a lo largo de su altura $L$
            mensaje: |
              El peso está, pero da una tensión vertical, no en la dirección
              de la circunferencia, y es pequeñísima frente a la de la
              rotación. $\sigma_1$ es la de la circunferencia, y la provoca
              el giro.
          - texto: Ninguna, porque con la velocidad angular constante no hay aceleración
            mensaje: |
              Con $\omega$ constante no hay aceleración angular, pero sí la
              centrípeta, $\omega^2 r_m$, hacia el eje: cada trozo de pared
              tiende a seguir recto, y el resto del anillo tiene que tirar
              de él hacia dentro para que gire.
          - texto: Una presión exterior, porque cada trozo de pared es empujado hacia el eje
            mensaje: |
              Es al revés. Cada trozo tiende a seguir recto, alejándose del
              eje, y la pared lo retiene tirando de él: tracción, como con
              presión interior (ec. 8.18), y no compresión, como con
              presión exterior (ec. 8.19).

      - tipo: calcular
        titulo: La tensión en la circunferencia
        pregunta: |
          Con el ejemplo de la nota, ¿cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '80.02'
          tolerancia: 0.1
          formato: un número con signo, en MPa
        distractores:
          - valor: '785'
            mensaje: |
              Has usado el peso específico $\gamma$ como si fuera la
              densidad. La fuerza centrífuga va con la masa:
              $\rho = \gamma/g$, en kg/m³.
          - valor: '160.04'
            mensaje: |
              Es el doble. La fuerza centrífuga de medio anillo la sostienen
              las dos secciones del corte, una a cada lado: $2\sigma_1 tL$,
              y no $\sigma_1 tL$.
          - valor: '40.01'
            mensaje: |
              Es la mitad: te falta el 2 de la integral. La suma de
              $\operatorname{sen}\varphi$ entre 0 y π vale 2, y ese 2 se va
              con el de las dos secciones del corte.
          - valor: '320.08'
            mensaje: |
              Has usado el diámetro, 1 m, en lugar del radio medio. Con el
              radio al cuadrado, el error se multiplica por cuatro.
        pista: |
          Corta el anillo por un diámetro. La fuerza centrífuga de la mitad,
          sumada en la dirección perpendicular al corte, la sostienen las
          dos secciones de pared, $2\sigma_1 tL$. Cada trozo, de masa
          $\rho\,t\,L\,r_m\,d\varphi$, tira con $dm\,\omega^2 r_m$.
        desarrollo: |
          $$
          \rho = \frac{\gamma}{g} = \frac{78\,500\ \text{N/m}^{3}}{9{,}81\ \text{m/s}^{2}} = 8002\ \text{kg/m}^{3}
          $$

          $$
          2\sigma_1 tL = \int_0^{\pi} \rho\,t\,L\,r_m\,\omega^2 r_m \operatorname{sen}\varphi\,d\varphi = 2\rho\,t\,L\,\omega^2 r_m^2
          \;\Longrightarrow\;
          \sigma_1 = \rho\,\omega^2 r_m^2
          $$

          $$
          \sigma_1 = 8002 \cdot 200^{2} \cdot 0{,}5^{2}\ \text{Pa} = 80{,}02 \cdot 10^{6}\ \text{Pa}
          $$

          Es decir, 80,02 MPa, a tracción.

      - tipo: calcular
        titulo: La deformación en la circunferencia
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '3.810'
          tolerancia: 0.005
          formato: un número con signo, ε1 dividido entre 10⁻⁴
        distractores:
          - valor: '37.38'
            mensaje: |
              Viene de usar $\gamma$ como si fuera la densidad: la tensión te
              sale casi diez veces mayor, y la deformación con ella. La
              fuerza centrífuga va con la masa, $\rho = \gamma/g$.
          - valor: '7.621'
            mensaje: |
              Es el doble: viene de la tensión que sostendría una sola
              sección del corte. La fuerza centrífuga de medio anillo la
              sostienen las dos.
          - valor: '0.381'
            mensaje: |
              Es $\sigma_1$ en MPa entre $E$ en GPa, $80{,}02/210$, sin
              pasarlos a las mismas unidades: eso son milésimas. En
              unidades de $10^{-4}$, multiplica por 10.
          - valor: '1.905'
            mensaje: |
              Viene de la tensión sin el 2 de la integral, 40,01 MPa: la suma
              de $\operatorname{sen}\varphi$ entre 0 y π vale 2. Con
              $\sigma_1 = 80{,}02$ MPa, $\varepsilon_1 = \sigma_1/E$ es el
              doble.
        pista: |
          Sin cambio de temperatura, $\varepsilon_1 = \sigma_1/E$, con las
          dos en pascales.
        desarrollo: |
          $$
          \varepsilon_1 = \frac{\sigma_1}{E} = \frac{80{,}02 \cdot 10^{6}}{210 \cdot 10^{9}} = 3{,}810 \cdot 10^{-4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada trozo de pared, de masa $dm = \rho\,t\,L\,r_m\,d\varphi$,
              necesita una fuerza hacia el eje, $dm\,\omega^2 r_m$, para
              seguir girando.
          - texto: >-
              Cortando el anillo por un diámetro, la fuerza centrífuga de la
              mitad, en la dirección perpendicular al corte, suma
              $2\rho\,t\,L\,\omega^2 r_m^2$.
          - texto: >-
              La sostienen las dos secciones del corte,
              $2\sigma_1 tL = 2\rho\,t\,L\,\omega^2 r_m^2$, y
              $\sigma_1 = \rho\,\omega^2 r_m^2$.
          - texto: >-
              Con $\rho = \gamma/g$, $\sigma_1 = \gamma\,\omega^2 r_m^2/g$, y
              $\varepsilon_1 = \sigma_1/E$.
          - texto: >-
              Cuanto más fina la pared, mayor la tensión, como en un depósito
              con presión: $\sigma_1$ crece con $r_m/t$.
            trampa: true
            mensaje: |
              En un depósito la presión no depende del espesor. Aquí la
              carga es la fuerza centrífuga de la propia pared, que crece
              con $t$ igual que la sección que la sostiene: el espesor se
              va, y la altura $L$ también.
    resolucion: |
      **La carga.** Con $\omega$ constante, cada trozo de pared describe una
      circunferencia de radio $r_m$, y para seguir en ella necesita una
      fuerza hacia el eje, la de la aceleración centrípeta,
      $dm\,\omega^2 r_m$. Se la dan los trozos de al lado, tirando de él: la
      pared trabaja a tracción en la dirección de la circunferencia. Visto
      desde el anillo que gira, es lo mismo que si cada trozo sufriera hacia
      fuera su fuerza centrífuga, una carga repartida y radial, como una
      presión interior.

      **El medio anillo.** Se corta el anillo por un diámetro y se mide el
      ángulo $\varphi$ desde el corte. Un trozo de pared de ángulo
      $d\varphi$ tiene la masa $dm = \rho\,t\,L\,r_m\,d\varphi$, y su fuerza
      centrífuga, en la dirección perpendicular al corte, es
      $dm\,\omega^2 r_m \operatorname{sen}\varphi$. La de toda la mitad la
      sostienen las dos secciones del corte, cada una de área $tL$:

      $$
      2\sigma_1 tL = \int_0^{\pi} \rho\,t\,L\,\omega^2 r_m^2 \operatorname{sen}\varphi\,d\varphi = 2\rho\,t\,L\,\omega^2 r_m^2
      $$

      $$
      \sigma_1 = \rho\,\omega^2 r_m^2 = \frac{\gamma\,\omega^2 r_m^2}{g}
      $$

      Es la ec. 8.18 de los apuntes (p. 11), $\sigma = p\,r_1/t$, con la
      presión que equivale a la fuerza centrífuga, la de cada trozo entre su
      área media, $p = \rho\,t\,\omega^2 r_m$, y con $r_m$ en lugar de $r_1$,
      que en un anillo delgado es lo mismo. La pared más gruesa tiene más
      masa, pero también más sección: ni $t$ ni $L$ entran, y por eso el
      enunciado no da el espesor.

      **La deformación.** Sin cambio de temperatura, $\varepsilon_0 = 0$ en
      la ec. 8.18, y

      $$
      \varepsilon_1 = \frac{\sigma_1}{E} = \frac{\gamma\,\omega^2 r_m^2}{gE}
      $$

      La circunferencia media crece en esa proporción, y el radio también:
      $\Delta r_m = \varepsilon_1 r_m$.

      **El ejemplo.** Con
      $\rho = 78\,500\ \text{N/m}^{3} / 9{,}81\ \text{m/s}^{2} = 8002\ \text{kg/m}^{3}$:

      $$
      \sigma_1 = 8002 \cdot 200^{2} \cdot 0{,}5^{2}\ \text{Pa} = 80{,}02 \cdot 10^{6}\ \text{Pa}
      $$

      $$
      \varepsilon_1 = \frac{80{,}02 \cdot 10^{6}}{210 \cdot 10^{9}} = 3{,}810 \cdot 10^{-4}
      $$

      Es decir, 80,02 MPa a tracción, y el radio medio crece
      $3{,}810 \cdot 10^{-4} \cdot 500\ \text{mm} = 0{,}1905\ \text{mm}$.

      **Comprobación por otro camino.** El motor del curso resuelve el anillo
      con la presión interior equivalente, $p = \rho\,t\,\omega^2 r_m$, con
      la ec. 8.18. Por otro lado, se suma a mano la fuerza centrífuga de
      20 000 trozos del medio anillo, cada uno con su
      $\operatorname{sen}\varphi$, y se divide entre las dos secciones del
      corte. Los dos dan 80,02 MPa, y con la pared de 3 cm en lugar de
      1 cm, otra vez lo mismo.

  # ── Propuesta A11 de clase · la pala que gira.
  - id: ejerm8-cla11-la-pala-que-gira
    titulo: La pala de un aerogenerador que gira con velocidad angular constante
    fuente: >-
      Propuesta A11 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8) y comprobada por un segundo camino (la pala
      partida en 4000 tramos, con la fuerza centrífuga de cada uno en sus
      nudos). El enunciado no da números: el último paso usa un ejemplo
      nuestro, que dice la nota. La figura está redibujada.
    nivel: practica
    enunciado: |
      La pala de un aerogenerador gira a velocidad angular constante
      $\omega$. Calcula el alargamiento que va a tener. (despreciando el
      peso propio).

      Datos:

      - Sección de la pala: $A$
      - Módulo de elasticidad: $E$
      - Longitud de la pala: $L$
      - Densidad: $\rho$
      - Velocidad angular: $\omega$

      <figure class="figura-examen">
      <svg viewBox="16 24 360 144" role="img" width="360" height="144" aria-labelledby="ejerm8-cla11-la-pala-que-gira-fig-t ejerm8-cla11-la-pala-que-gira-fig-d">
      <title id="ejerm8-cla11-la-pala-que-gira-fig-t">Una pala recta articulada en un eje de la pared, que gira</title>
      <desc id="ejerm8-cla11-la-pala-que-gira-fig-d">A la izquierda, una pared rayada con una orejeta y un pasador. De la orejeta sale hacia la derecha una pala recta, larga y delgada, de sección constante. Una flecha curva alrededor del pasador indica que la pala gira con velocidad angular ω.</desc>
      <defs><pattern id="ejerm8-cla11-la-pala-que-gira-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="26" y="42" width="14" height="108" fill="url(#ejerm8-cla11-la-pala-que-gira-r)"/><line x1="40" y1="42" x2="40" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M40 76 L80 76 A20 20 0 0 1 80 116 L40 116 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <circle cx="80" cy="96" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="98" y="89" width="268" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <path d="M118.17 144.86 A62 62 0 0 0 119.85 48.51" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <polygon points="116.25,45.51 123.54,47.71 119.69,52.3" fill="var(--ink)"/>
      <text x="130" y="46" font-size="12" fill="var(--ink)" font-style="italic">ω</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la pala, articulada en su raíz, gira con
      velocidad angular ω alrededor del eje que pasa por ella.

      </figcaption>
      </figure>

      **Notas nuestras.** La pala se toma como una barra recta de sección
      $A$ constante que gira alrededor de un eje que pasa por su raíz; $L$
      va del eje a la punta, y $x$ es la distancia al eje. Los axiles se
      preguntan en unidades de $\rho A\omega^2L^2$, y el alargamiento, en
      unidades de $\rho\omega^2L^3/E$. Para la última cifra, un ejemplo
      nuestro, una pala de fibra de vidrio: $\rho = 1900\ \text{kg/m}^{3}$,
      $E = 40\ \text{GPa}$, $L = 40\ \text{m}$ y $\omega = 2\ \text{rad/s}$.
    pide: >-
      El axil a media pala, en unidades de ρAω²L², y el alargamiento de la
      pala, en unidades de ρω²L³/E y, con el ejemplo de la nota, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es el axil a lo largo de la pala?
        opciones:
          - texto: Máximo junto al eje y nulo en la punta, porque cada sección sostiene la fuerza centrífuga de lo que tiene por fuera
            correcta: true
            mensaje: |
              Eso es. La punta no tiene nada por fuera que retener. Una
              sección a la distancia $x$ del eje tiene que retener el trozo
              entre ella y la punta, que tira hacia fuera con su fuerza
              centrífuga; la de la raíz retiene la pala entera. Toda la pala
              está a tracción.
          - texto: Constante, porque la sección y la velocidad angular no cambian
            mensaje: |
              La sección es la misma, pero lo que cada una sostiene no: la de
              la raíz retiene toda la pala, y una cerca de la punta, solo el
              trocito de fuera.
          - texto: Máximo en la punta, que es la que gira más deprisa
            mensaje: |
              La punta es la que va más deprisa, pero no tiene nada por fuera
              que retener: su axil es cero. El axil de una sección es la
              fuerza centrífuga de lo que queda entre ella y la punta.
          - texto: Nulo junto al eje, porque allí la velocidad es cero
            mensaje: |
              Allí la velocidad es cero, pero esa sección es la que retiene
              la pala entera: su axil es el mayor.

      - tipo: calcular
        titulo: El axil a media pala
        pregunta: |
          A media pala, $x = L/2$, ¿cuánto vale $N$, en unidades de
          $\rho A\omega^2L^2$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número, N dividido entre ρAω²L²
        distractores:
          - valor: '0.25'
            mensaje: |
              Has tomado el axil como una recta entre la raíz y la punta. La
              fuerza centrífuga de cada trozo crece con su distancia al eje:
              la mitad de fuera tira más que la de dentro, y a media pala
              queda más de la mitad del axil de la raíz. O has tomado la
              fuerza centrífuga de la mitad de fuera con el radio de la
              sección, $L/2$; su centro está a $3L/4$.
          - valor: '0.5'
            mensaje: |
              Es el axil de la raíz, que retiene la pala entera. A media pala
              solo queda por fuera la mitad exterior. O has tomado la fuerza
              centrífuga de la mitad de fuera con el radio de la punta; su
              centro está a $3L/4$.
          - valor: '0.125'
            mensaje: |
              Es la fuerza centrífuga de la mitad de dentro, entre el eje y la
              sección. La sección sostiene lo de fuera, entre ella y la
              punta.
        pista: |
          La sección a la distancia $x$ retiene el trozo entre ella y la
          punta: $N(x) = \int_x^L \rho A\omega^2 s\,ds$.
        desarrollo: |
          $$
          N(x) = \int_x^L \rho A\omega^2 s\,ds = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - x^2\right)
          $$

          $$
          N\!\left(\tfrac{L}{2}\right) = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - \tfrac{L^2}{4}\right)
          = \tfrac{3}{8}\,\rho A\omega^2L^2 = 0{,}375\,\rho A\omega^2L^2
          $$

      - tipo: calcular
        titulo: El alargamiento
        pregunta: |
          ¿Cuánto se alarga la pala, en unidades de $\rho\omega^2L^3/E$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre ρω²L³/E
        distractores:
          - valor: '0.5'
            mensaje: |
              Es con el axil de la raíz en toda la pala. El axil baja hasta
              cero en la punta, y hay que integrarlo.
          - valor: '0.25'
            mensaje: |
              Es con el axil en recta, de la raíz a cero en la punta. La
              mitad de fuera tira más que la de dentro, y el axil baja más
              despacio al principio.
          - valor: '0.1667'
            mensaje: |
              Has tomado como axil de cada sección la fuerza centrífuga de lo
              de dentro, $\tfrac{1}{2}\rho A\omega^2x^2$. Cada sección
              retiene lo de fuera.
          - valor: '1'
            mensaje: |
              Has tomado $N = \rho A\omega^2L^2$ en toda la pala: la masa
              entera con la aceleración de la punta. Ni toda la masa está en
              la punta ni todas las secciones la sostienen.
          - valor: '0.6667'
            mensaje: |
              Te falta el ½: $N(x) = \tfrac12\rho A\omega^2(L^2 - x^2)$.
        pista: |
          Con $N$ variable, la integral de la ec. 8.8, sin término térmico:
          $\Delta L = \int_0^L N/(EA)\,dx$.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{\rho\omega^2}{2E}\left(L^2 - x^2\right)dx
          = \frac{\rho\omega^2}{2E}\left(L^3 - \frac{L^3}{3}\right)
          = \frac{\rho\omega^2L^3}{3E}
          $$

      - tipo: calcular
        titulo: El ejemplo
        pregunta: |
          Con el ejemplo de la nota, ¿cuánto se alarga la pala, en mm?
        respuesta:
          tipo: numero
          valor: '4.053'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '6.080'
            mensaje: |
              Es con el axil de la raíz en toda la pala. El axil baja hasta
              cero en la punta, y hay que integrarlo.
          - valor: '3.040'
            mensaje: |
              Es con el axil en recta, de la raíz a cero en la punta. La
              mitad de fuera tira más que la de dentro.
          - valor: '2.027'
            mensaje: |
              Has tomado como axil la fuerza centrífuga de lo de dentro de
              cada sección. Cada sección retiene lo de fuera.
        pista: |
          $\Delta L = \rho\omega^2L^3/(3E)$, con todo en el SI: $E$ en Pa y
          el resultado en m.
        desarrollo: |
          $$
          \Delta L = \frac{1900 \cdot 2^{2} \cdot 40^{3}}{3 \cdot 40 \cdot 10^{9}}\ \text{m} = 4{,}053 \cdot 10^{-3}\ \text{m}
          $$

          Es decir, 4,053 mm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A la distancia $x$ del eje, la sección retiene el trozo entre
              ella y la punta, que tira hacia fuera con su fuerza centrífuga.
          - texto: >-
              Ese trozo suma
              $\int_x^L \rho A\omega^2 s\,ds = \tfrac{1}{2}\rho A\omega^2\left(L^2 - x^2\right)$,
              que es el axil $N(x)$.
          - texto: >-
              Como $N$ cambia a lo largo de la pala, el alargamiento es la
              integral de la ec. 8.8: $\Delta L = \int_0^L N/(EA)\,dx$.
          - texto: >-
              Integrando, $\Delta L = \rho\omega^2L^3/(3E)$, y la sección se
              va.
          - texto: >-
              Toda la masa de la pala, $\rho AL$, gira como si estuviera a
              $L/2$ del eje: el axil es $\tfrac{1}{2}\rho A\omega^2L^2$ en toda
              la pala.
            trampa: true
            mensaje: |
              Eso es la fuerza centrífuga total, la que retiene la sección de
              la raíz. Una sección más afuera solo retiene lo que queda entre
              ella y la punta, y el axil baja hasta cero en la punta.
    resolucion: |
      **El axil.** Se mide $x$ desde el eje. Con $\omega$ constante, cada
      trozo de pala, de masa $\rho A\,ds$ y a la distancia $s$ del eje,
      necesita una fuerza hacia el eje, $\rho A\,ds\,\omega^2 s$, para seguir
      girando. Visto desde la pala, es su fuerza centrífuga, hacia fuera. La
      sección en $x$ retiene todo lo que tiene por fuera:

      $$
      N(x) = \int_x^L \rho A\omega^2 s\,ds = \tfrac{1}{2}\,\rho A\omega^2\left(L^2 - x^2\right)
      $$

      Toda la pala está a tracción, con
      $\tfrac{1}{2}\rho A\omega^2L^2$ en la raíz y cero en la punta. Va con
      $L^2 - x^2$, no en recta: a media pala queda
      $\tfrac{3}{8}\rho A\omega^2L^2$, tres cuartos del axil de la raíz. El
      peso propio, que el enunciado deja fuera, solo es perpendicular a la
      pala cuando está horizontal, como en la figura; con la pala vertical
      daría un axil de hasta $\rho A g L$ en la raíz, que suma o resta según
      apunte hacia abajo o hacia arriba.

      **El alargamiento.** $N$ cambia, así que el alargamiento es la
      integral de la ec. 8.8 (p. 6), sin término térmico:

      $$
      \Delta L = \int_0^L \frac{N}{EA}\,dx
      = \frac{\rho\omega^2}{2E}\int_0^L \left(L^2 - x^2\right)dx
      = \frac{\rho\omega^2}{2E}\cdot\frac{2L^3}{3}
      = \frac{\rho\omega^2L^3}{3E}
      $$

      La sección $A$ se va: una pala más gruesa tiene más masa, pero
      también más sección que la sostenga.

      **El ejemplo.** Con $\rho = 1900\ \text{kg/m}^{3}$,
      $E = 40\ \text{GPa}$, $L = 40\ \text{m}$ y $\omega = 2\ \text{rad/s}$:

      $$
      \Delta L = \frac{1900 \cdot 2^{2} \cdot 40^{3}}{3 \cdot 40 \cdot 10^{9}}\ \text{m} = 4{,}053 \cdot 10^{-3}\ \text{m}
      $$

      Unos 4 mm en una pala de 40 m: una deformación media de una diezmilésima.

      **Comprobación por otro camino.** El motor del curso hace la integral
      de la ec. 8.8 con el axil de arriba. Por otro lado, la pala se parte
      en 4000 tramos, fija en el eje y libre en la punta, con la fuerza
      centrífuga de cada tramo repartida en sus dos nudos, y se resuelve
      como una barra con cargas puntuales. Los dos dan
      $0{,}3333\,\rho\omega^2L^3/E$; el de los tramos, además, $N = 0{,}5$ en
      la raíz y $0{,}375$ a media pala, en unidades de
      $\rho A\omega^2L^2$, y para el ejemplo, 4,053 mm.

  # ── Propuesta A12 de clase · ABC rígida sobre cinco barras, con BE calentada.
  - id: ejerm8-cla12-la-pieza-abc-sobre-cinco-barras
    titulo: La barra rígida ABC sobre cinco barras, con P en B y la barra BE calentada
    fuente: >-
      Propuesta A12 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (el equilibrio de ABC y de E con la
      compatibilidad, escrito a mano, y las reacciones de D y F contra la
      carga). Se conserva la errata del original, «fugura». La carga P solo
      está en la figura, en B. El enunciado no dice cómo se mueven ABC y E:
      se toma la simetría, y lo dice la nota. La figura está redibujada con
      las cotas del original.
    nivel: practica
    enunciado: |
      La estructura de la fugura tiene la barra ABC rígida y las otras 5
      articuladas. Las $E$ y $A$ de estas últimas son las mismas.

      Las articulaciones D y F son fijas. La barra BE sufre un cambio de
      temperatura $\Delta T$.

      Determina las fuerzas axiales de las barras y el desplazamiento en E.

