      <text x="276.36" y="283" font-size="12" fill="var(--ink)" font-style="italic" text-anchor="middle">δ<tspan font-size="9" dy="3">B</tspan></text>
      </svg>
      <figcaption>

      El proceso de deformación, con los giros muy exagerados. En trazo
      discontinuo, la posición final; C″ y N″, después de la traslación y
      antes del giro de BC.

      </figcaption>
      </figure>

      - **AC** no puede trasladarse, porque A es fijo, y no se deforma: gira
        alrededor de A hasta AC′. M pasa a M′.
      - **BC** tampoco se deforma. B solo puede moverse en horizontal: BC se
        traslada con él hasta B′C″, y N pasa a N″.
      - **Después, BC gira** alrededor de B′ hasta B′C′, con su extremo en el
        mismo C′ que AC. N pasa de N″ a N′.

      **2. Incógnitas.** El giro β de las patas y el desplazamiento
      $\delta_B$ de B.

      **3. Ecuaciones.** **Los dos giros son iguales.** CC′ es perpendicular
      a AC, y C″C′, perpendicular a BC: los dos forman el ángulo θ con la
      horizontal, a un lado y a otro, y CC″ es horizontal. El triángulo
      CC″C′ es isósceles: $CC' = C''C'$, es decir,
      $L\tan\beta_{AC} = L\tan\beta_{BC}$. Las dos patas giran el mismo
      ángulo β, en sentidos contrarios (observación 1 del ejemplo).

      **El alargamiento del tirante.** Con giros pequeños, cada punto se
      mueve en perpendicular a su pata, y del tirante, horizontal, solo cuenta
      la parte horizontal (apuntes, ecs. 8.10 a 8.12). M, a la distancia
      $d = AM = x/\cos\theta$ de A, se mueve $d\tan\beta$, y su parte
      horizontal, hacia N, es $MM'_0 = d\tan\beta\cos\theta$, con $M'_0$ en la
      recta del tirante sin deformar, en la vertical de M′. N se va
      $NN'' = \delta_B$ con la traslación y vuelve
      $N''N'_0 = d\tan\beta\cos\theta$ con el giro, con $N'_0$ en la misma
      recta, en la vertical de N′, así que $NN'_0 = NN'' - N''N'_0$. El
      tirante pasa de MN a $M'_0N'_0$:

      $$
      \delta = M'_0N'_0 - MN = NN'_0 - MM'_0 = \delta_B - 2d\tan\beta\cos\theta
      \tag{1}
      $$

      **El movimiento de C.** Con AC, C se va $L\tan\beta\cos\theta$ en
      horizontal; con BC, se va $\delta_B$ con la traslación y vuelve
      $L\tan\beta\cos\theta$ con el giro. Las dos cosas son el mismo C:

      $$
      \delta_B = 2L\tan\beta\cos\theta
      \tag{2}
      $$

      **4. Resultados.** Con (2) en (1):

      $$
      \tan\beta = \frac{\delta}{2\,(L - d)\cos\theta}
      \tag{3}
      $$

      y con (3) en (2),

      $$
      \delta_B = \frac{L}{L - d}\,\delta = \frac{L}{L - x/\cos\theta}\,\delta
      $$

      **El ejemplo.** Con $L = 1\ \text{m}$, $\theta = 20^{\circ}$,
      $x = 0{,}45\ \text{m}$ y $\delta = 0{,}3\ \text{mm}$:
      $d = 0{,}45\ \text{m}/0{,}93969 = 0{,}47888\ \text{m}$, y con todo en
      mm,

      $$
      \beta = \frac{0{,}3}{2 \cdot 521{,}12 \cdot 0{,}93969} = 3{,}063 \cdot 10^{-4}
      $$

      $$
      \delta_B = \frac{1000}{521{,}12} \cdot 0{,}3\ \text{mm} = 0{,}5757\ \text{mm}
      $$

      **5. Comprobación.** El motor del curso trata las dos patas como
      sólidos rígidos: AC articulada en A, BC con B en un apoyo que solo le
      impide moverse en vertical, y la articulación de C hecha con dos barras
      muchísimo más rígidas que el tirante, que obligan a C a moverse igual en
      las dos patas. Con una carga vertical en C y el resultado escalado a
      $\delta = 0{,}3\ \text{mm}$, da el mismo giro en las dos patas, en
      sentidos contrarios, y B se va $0{,}5757\ \text{mm}$. Por la ecuación
      (2), $2 \cdot 1000 \cdot 3{,}0632 \cdot 10^{-4} \cdot 0{,}93969\ \text{mm} = 0{,}5757\ \text{mm}$.
      Y C, que el ejemplo no pregunta, baja
      $1000 \cdot 3{,}0632 \cdot 10^{-4} \cdot 0{,}34202\ \text{mm} = 0{,}1048\ \text{mm}$.

      **Lo que dice el resultado.** B se va más de lo que se alarga el
      tirante, tanto más cuanto más cerca de C está el tirante: en el
      ejemplo, 1,919 veces. El tirante no se lleva B consigo: lo que hace es
      obligar a las patas a girar, y los giros, multiplicados por la longitud
      de las patas, son los que mueven B.

  # ── Cuestión 1 de autoevaluación del tema 8 · la hipótesis de Bernoulli.
  - id: ejerm8-cu1-la-hipotesis-de-bernoulli
    titulo: La hipótesis de Bernoulli en una barra a tracción o compresión
    fuente: >-
      Cuestión 1 de autoevaluación · Tema 8, «Esfuerzo axial simple» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 8,
      apartados 8.1 a 8.3 (pp. 3 a 7, fig. 8.1, ecs. 8.1 a 8.5 y 8.9). No
      está entre las preguntas de examen publicadas en el sitio. El ejemplo
      es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Es una hipótesis sobre cómo se deforma la sección entera, no un punto.
        De ella salen, una tras otra, las deformaciones y las tensiones de
        toda la sección.
      formula: |
        $$
        \sigma_x = E\left(\varepsilon_x - \varepsilon_0\right)
        $$

        La ley de Hooke en la dirección de la barra, con la deformación
        térmica $\varepsilon_0 = \alpha\Delta T$ (ec. 8.4).
      reconocer: |
        Antes de redactar, piensa qué le pasa a cada fibra de la barra si todas
        las secciones siguen planas y paralelas.
    enunciado: |
      1. Hipótesis de Bernouilli.
    pide: >-
      Qué dice la hipótesis y qué se sigue de ella para las deformaciones y
      las tensiones de una barra a tracción o compresión.
    pasos:
      - tipo: reconocer
        pregunta: |
          La hipótesis dice que las secciones permanecen planas y paralelas a
          sí mismas tras la deformación. ¿Qué exige eso a las deformaciones de
          los puntos de una sección?
        opciones:
          - texto: >-
              Que las deformaciones unitarias, normales y tangenciales, sean
              uniformes en la sección
            correcta: true
            mensaje: |
              Eso es (p. 5). Si todas las fibras se alargan lo mismo y todas
              se distorsionan lo mismo, la sección se traslada sin alabearse
              ni inclinarse.
          - texto: >-
              Que no haya deformaciones tangenciales
            mensaje: |
              Eso se demuestra después, con la cortante nula (cuestión 2). La
              hipótesis sola no lo pide: una distorsión uniforme haría
              deslizar unas secciones sobre otras sin que dejaran de ser
              planas y paralelas.
          - texto: >-
              Que la tensión normal sea uniforme
            mensaje: |
              La hipótesis habla de deformaciones. La tensión uniforme viene
              después, de la ley de Hooke con esas deformaciones
              (ec. 8.4).
          - texto: >-
              Que la sección no cambie de tamaño
            mensaje: |
              Nada lo pide: con $\sigma_y = \sigma_z = 0$ la barra se estrecha
              por el efecto de Poisson, y la sección sigue plana y paralela.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica la hipótesis como en un examen: qué dice y qué se deduce de
          ella para las deformaciones y las tensiones de la sección.
        rubrica:
          - punto: >-
              Las secciones permanecen planas y paralelas a sí mismas tras la
              deformación (p. 5).
            porque: >-
              Es el enunciado de la hipótesis.
            minimo: true
          - punto: >-
              Para eso, las deformaciones unitarias normales y tangenciales
              tienen que ser uniformes en la sección.
            porque: >-
              Es la consecuencia directa, y de la que sale todo lo demás.
            minimo: true
          - punto: >-
              Las tangenciales son nulas: si fueran uniformes, τ = Gγ también
              lo sería, y Ty = τxy·A = 0 obliga a τxy = 0 (ecs. 8.1 y 8.2,
              por reducción al absurdo).
            porque: >-
              Es lo que se demuestra con la hipótesis y la cortante nula.
            minimo: true
          - punto: >-
              Se supone libertad de deformación en y y en z:
              σy = σz = 0.
            porque: >-
              Es una hipótesis aparte, no una consecuencia de la de
              Bernoulli.
            minimo: true
          - punto: >-
              Por la ley de Hooke, εx = σx/E + ε0 (ec. 8.3), con ε0 la
              deformación inicial, uniforme: αΔT, o h/L si la barra es h más
              larga por un error de fabricación.
            porque: >-
              Es la relación con la que se trabaja en todo el tema.
            minimo: true
          - punto: >-
              Despejando, σx = E(εx − ε0) (ec. 8.4) es uniforme, y como la
              única fuerza de sección es N, N = σx·A: σx = N/A (ec. 8.5).
            porque: >-
              Es la tensión de la barra, y su porqué.
            minimo: true
          - punto: >-
              La distribución es uniforme lejos de las cargas concentradas: a
              una distancia del orden de las dimensiones de la sección
              (principio de Saint-Venant, fig. 8.1).
            porque: >-
              Dice dónde vale lo anterior y dónde no.
      - tipo: calcular
        titulo: La tensión de la barra
        pregunta: |
          Un ejemplo nuestro: una barra de acero ($E = 200$ GPa,
          $\alpha = 12\cdot10^{-6}$ °C⁻¹) de 2 m de longitud y sección
          $A = 500$ mm², sin ninguna sujeción que le impida alargarse, soporta
          una tracción $N = 60$ kN y a la vez se calienta 40 °C. ¿Cuánto vale
          $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '216'
            mensaje: |
              Has multiplicado $E$ por la deformación total, con la térmica
              dentro. La tensión va con la parte que no es inicial:
              $\sigma_x = E(\varepsilon_x - \varepsilon_0)$ (ec. 8.4).
          - valor: '96'
            mensaje: |
              Es $E\alpha\Delta T$, la tensión térmica de una barra que no
              puede alargarse. Esta puede: el calentamiento solo la alarga, y
              la tensión es la del axil.
          - valor: '24'
            mensaje: |
              Has restado una tensión térmica de $E\alpha\Delta T = 96$ MPa.
              Libre, el calentamiento no da tensión: $\sigma_x = N/A$.
        pista: |
          Ec. 8.5: la única fuerza de sección es $N$, y $\sigma_x = N/A$.
        desarrollo: |
          $$
          \sigma_x = \frac{N}{A} = \frac{6\cdot10^{4}}{500} = 120
          $$

          en MPa, con $N$ en N y $A$ en mm².
      - tipo: calcular
        titulo: La deformación de la barra
        pregunta: |
          ¿Y $\varepsilon_x$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1080'
          tolerancia: 1
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '600'
            mensaje: |
              Solo $\sigma_x/E$. Falta la deformación inicial,
              $\varepsilon_0 = \alpha\Delta T = 480\cdot10^{-6}$ (ec. 8.3).
          - valor: '120'
            mensaje: |
              Has restado la térmica. Calentarla la alarga, como la tracción:
              $\varepsilon_x = \sigma_x/E + \alpha\Delta T$.
          - valor: '480'
            mensaje: |
              Solo la térmica. La tracción también alarga:
              $\sigma_x/E = 600\cdot10^{-6}$.
        pista: |
          Ec. 8.3: $\varepsilon_x = \sigma_x/E + \varepsilon_0$, con
          $\varepsilon_0 = \alpha\Delta T$.
        desarrollo: |
          $$
          \varepsilon_x = \frac{120}{2\cdot10^{5}} + 12\cdot10^{-6}\cdot40 = (600 + 480)\cdot10^{-6} = 1080\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Las secciones permanecen planas y paralelas a sí mismas tras la
              deformación.
          - texto: >-
              Luego las deformaciones, normales y tangenciales, son uniformes
              en la sección.
          - texto: >-
              Las tangenciales son nulas, porque la cortante lo es
              (ecs. 8.1 y 8.2), y se supone $\sigma_y = \sigma_z = 0$.
          - texto: >-
              Con Hooke, $\sigma_x = E(\varepsilon_x - \varepsilon_0)$ es
              uniforme, y $\sigma_x = N/A$ (ecs. 8.4 y 8.5).
          - texto: >-
              Por eso la tensión es $N/A$ en toda la barra, también junto al
              punto donde se aplica una carga concentrada.
            trampa: true
            mensaje: |
              Junto a una carga concentrada la distribución no es uniforme.
              Lo es a una distancia del orden de las dimensiones de la
              sección: es el principio de Saint-Venant, y en la fig. 8.1, a
              10 mm del extremo de una barra de 10 × 10 mm, ya lo es.
    resolucion: |
      **La hipótesis** (apuntes del tema 8, apartado 8.2, p. 5; la hoja y los
      apuntes escriben «Bernouilli»). Las secciones permanecen planas y
      paralelas a sí mismas tras la deformación. Para eso, las deformaciones
      unitarias normales y tangenciales tienen que ser **uniformes** en la
      sección.

      **Lo que se sigue de ella.**

      - Las tangenciales son nulas. Si hubiera unas $\gamma_{xy}$ y
        $\gamma_{zx}$ uniformes, $\tau_{xy} = G\gamma_{xy}$ y
        $\tau_{zx} = G\gamma_{zx}$ también lo serían; como las cortantes son
        nulas, $T_y = \int_A \tau_{xy}\,dA = \tau_{xy}A = 0$ y
        $\tau_{xy} = 0$, y lo mismo con $zx$ (ecs. 8.1 y 8.2). Es la
        cuestión 2.
      - Se supone, además, libertad de deformación en $y$ y en $z$:
        $\sigma_y = \sigma_z = 0$.
      - Por la ley de Hooke,

        $$
        \varepsilon_x = \frac{\sigma_x}{E} + \varepsilon_0 \qquad (8.3)
        $$

        con $\varepsilon_0$ la deformación inicial, uniforme en la sección:
        $\alpha\Delta T$ si cambia la temperatura, $h/L$ si la barra salió
        $h$ más larga por un error de fabricación.
      - Despejando, $\sigma_x = E(\varepsilon_x - \varepsilon_0)$ (ec. 8.4)
        es uniforme, y como la única fuerza de sección es $N$,

        $$
        N = \int_A \sigma_x\,dA = \sigma_xA \quad\Rightarrow\quad \sigma_x = \frac{N}{A} \qquad (8.5)
        $$

      **Dónde vale** (apartado 8.1, pp. 3 a 5). Por el principio de
      Saint-Venant, los estados particulares de tensión junto a una fuerza
      concentrada desaparecen a una distancia del orden de las dimensiones de
      la sección. En la fig. 8.1, con una barra de 10 × 10 mm, a 2,5 mm de la
      carga la distribución está lejos de ser uniforme y a 10 mm ya lo es.

      **Un ejemplo nuestro.** Una barra de acero libre de 2 m, con
      $A = 500$ mm², $N = 60$ kN y calentada 40 °C ($E = 200$ GPa,
      $\alpha = 12\cdot10^{-6}$ °C⁻¹). La tensión es $\sigma_x = N/A = 120$
      MPa: el calentamiento, sin nada que lo impida, no añade tensión. La
      deformación es $\varepsilon_x = (600 + 480)\cdot10^{-6} = 1080\cdot10^{-6}$,
      y el alargamiento, con la ec. 8.9,
      $\Delta L = NL/EA + \varepsilon_0L = 2{,}16$ mm. El motor del curso
      da lo mismo.

  # ── Cuestión 2 de autoevaluación del tema 8 · las tangenciales nulas.
  - id: ejerm8-cu2-las-deformaciones-tangenciales-nulas
    titulo: Por qué no hay deformaciones tangenciales en tracción o compresión
    fuente: >-
      Cuestión 2 de autoevaluación · Tema 8, «Esfuerzo axial simple» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 8,
      apartado 8.2 (p. 5, ecs. 8.1 y 8.2). No está entre las preguntas de examen publicadas en el
      sitio. El ejemplo es nuestro, comprobado con el motor del curso y a
      mano.
    nivel: practica
    antes:
      idea: |
        La demostración es corta y va por el absurdo: se supone lo contrario y
        se busca qué dato del problema deja de cumplirse.
      formula: |
        $$
        \tau = G\gamma
        \qquad
        G = \frac{E}{2\,(1 + \nu)}
        $$

        La ley de Hooke para una distorsión: la tensión tangencial que la
        acompaña, con el módulo de elasticidad transversal.
      reconocer: |
        Antes de redactar, recuerda qué esfuerzos tiene una barra a tracción o
        compresión, y cuáles son nulos.
    enunciado: |
      2. Demostrar que las deformaciones tangenciales deben ser nulas cuando
      la fuerza interna es de tracción o compresión.
    pide: >-
      La demostración de que una barra con solo esfuerzo axial no tiene
      deformaciones tangenciales en sus secciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          La demostración es por reducción al absurdo: se supone que en la
          sección hay deformaciones tangenciales. ¿Con qué choca esa
          suposición?
        opciones:
          - texto: >-
              Con que las fuerzas cortantes son nulas: unas tangenciales
              uniformes tendrían una resultante distinta de cero
            correcta: true
            mensaje: |
              Eso es (p. 5). Con $\gamma$ uniforme, $\tau = G\gamma$ también
              lo es, sale de la integral, y $T_y = \tau_{xy}A$ solo es nula
              si $\tau_{xy} = 0$.
          - texto: >-
              Con la hipótesis de Bernouilli, que no admite distorsiones
            mensaje: |
              La hipótesis pide deformaciones uniformes, no nulas: una
              distorsión uniforme haría deslizar las secciones sin que
              dejaran de ser planas y paralelas. Por eso hace falta la
              demostración.
          - texto: >-
              Con la ley de Hooke: en un material isótropo una tensión normal
              no da distorsión
            mensaje: |
              Eso supone ya que solo hay $\sigma_x$, es decir, que no hay
              $\tau$: justo lo que hay que demostrar. Sin la cortante nula,
              nada impide una $\tau$ uniforme.
          - texto: >-
              Con que las deformaciones tienen que ser pequeñas
            mensaje: |
              Una distorsión uniforme puede ser tan pequeña como se quiera y
              no ser nula. Lo que la anula es la cortante.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen, desde la hipótesis de las
          secciones planas hasta γ = 0.
        rubrica:
          - punto: >-
              Por la hipótesis de Bernoulli, las deformaciones de la sección
              son uniformes, también las tangenciales γxy y γzx, si las hay.
            porque: >-
              Es el punto de partida: sin la uniformidad no se podría sacar
              nada de la integral.
            minimo: true
          - punto: >-
              Por la ley de Hooke, τxy = Gγxy y τzx = Gγzx: las tensiones
              tangenciales también serían uniformes.
            porque: >-
              Pasa de deformaciones a tensiones, que son las que tienen
              resultante.
            minimo: true
          - punto: >-
              En tracción o compresión las fuerzas cortantes son nulas:
              Ty = ∫A τxy dA = 0 y Tz = ∫A τzx dA = 0 (ec. 8.1).
            porque: >-
              Es la condición con la que choca la suposición.
            minimo: true
          - punto: >-
              Al ser uniformes, las tangenciales salen de la integral:
              τxy·A = 0, luego τxy = 0 y γxy = 0; y lo mismo τzx y γzx
              (ec. 8.2).
            porque: >-
              Es la conclusión de la demostración.
            minimo: true
          - punto: >-
              Es una reducción al absurdo: suponer deformaciones tangenciales
              lleva a una cortante que la barra no tiene.
            porque: >-
              Dice qué tipo de demostración es, como la nombran los apuntes.
      - tipo: calcular
        titulo: La cortante que haría falta
        pregunta: |
          Un ejemplo nuestro, para ver el absurdo con números: una barra de
          acero ($E = 200$ GPa, $\nu = 0{,}25$) de sección $A = 400$ mm². Si
          su sección tuviera una distorsión uniforme $\gamma_{xy} = 10^{-3}$,
          ¿qué fuerza cortante $T_y$ haría falta, en kN?
        respuesta:
          tipo: numero
          valor: '32'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '80'
            mensaje: |
              Has hecho $\tau = E\gamma$. La distorsión va con el módulo de
              cortadura, $G = E/2(1 + \nu) = 80$ GPa (ecs. 4.3 y 4.6).
          - valor: '16'
            mensaje: |
              Has tomado $\tau = G\cdot\tfrac12\gamma$, con la mitad del
              tensor de deformaciones. La ley de Hooke es
              $\tau_{xy} = G\gamma_{xy}$, con $\gamma$ entera.
          - valor: '0'
            mensaje: |
              Es lo que pasa en una barra a tracción, porque no tiene
              distorsión. Con $\gamma_{xy} = 10^{-3}$ uniforme, $\tau_{xy}$
              sale de la integral y $T_y = \tau_{xy}A$ no es nula: por eso no
              puede haber distorsión.
        pista: |
          $\tau_{xy} = G\gamma_{xy}$ con $G = E/2(1 + \nu)$, y, siendo
          uniforme, $T_y = \int_A \tau_{xy}\,dA = \tau_{xy}A$.
        desarrollo: |
          $G = \dfrac{2\cdot10^{5}}{2\,(1 + 0{,}25)} = 8\cdot10^{4}$, en MPa, y

          $$
          \tau_{xy} = G\gamma_{xy} = 8\cdot10^{4}\cdot10^{-3} = 80
          $$

          en MPa. Entonces $T_y = \tau_{xy}A = 80\cdot400 = 3{,}2\cdot10^{4}$,
          en N: 32 kN.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Por la hipótesis de Bernoulli, si hay $\gamma_{xy}$ y
              $\gamma_{zx}$, son uniformes en la sección.
          - texto: >-
              Por Hooke, $\tau_{xy} = G\gamma_{xy}$ y
              $\tau_{zx} = G\gamma_{zx}$ también lo son.
          - texto: >-
              Las cortantes son nulas: $T_y = \int_A \tau_{xy}\,dA = 0$ y
              $T_z = \int_A \tau_{zx}\,dA = 0$ (ec. 8.1).
          - texto: >-
              Sacando la constante de la integral, $\tau_{xy}A = 0$: luego
              $\tau_{xy} = 0$ y $\gamma_{xy} = 0$, y lo mismo en $zx$
              (ec. 8.2).
          - texto: >-
              Como no hay distorsión, la barra tampoco se deforma en $y$ ni en
              $z$.
            trampa: true
            mensaje: |
              Sí se deforma: con $\sigma_y = \sigma_z = 0$, el efecto de
              Poisson la estrecha, $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$.
              Lo que es nulo es la distorsión, no las deformaciones normales.
    resolucion: |
      **La suposición** (apuntes del tema 8, apartado 8.2, p. 5). Por la
      hipótesis de Bernoulli, las deformaciones unitarias normales y
      tangenciales son uniformes en la sección. Supongamos que en la sección
      hay deformaciones tangenciales $\gamma_{xy}$ y $\gamma_{zx}$: serán
      uniformes, y por la ley de Hooke (ec. 4.3) también lo serán

      $$
      \tau_{xy} = G\gamma_{xy} \qquad \tau_{zx} = G\gamma_{zx}
      $$

      **El choque.** En tracción o compresión la única fuerza de sección es
      $N$, y las cortantes son nulas:

      $$
      T_y = 0 \Rightarrow \int_A \tau_{xy}\,dA = 0 \qquad
      T_z = 0 \Rightarrow \int_A \tau_{zx}\,dA = 0 \qquad (8.1)
      $$

      Al ser uniformes, las tangenciales salen de las integrales como factor
      común:

      $$
      \tau_{xy}A = 0 \Rightarrow \tau_{xy} = 0 \Rightarrow \gamma_{xy} = 0 \qquad
      \tau_{zx}A = 0 \Rightarrow \tau_{zx} = 0 \Rightarrow \gamma_{zx} = 0 \qquad (8.2)
      $$

      Por reducción al absurdo, las deformaciones tangenciales tienen que
      ser nulas. Las normales no: con la libertad de deformación que se
      supone en $y$ y en $z$, $\sigma_y = \sigma_z = 0$, y la barra se
      estrecha por el efecto de Poisson.

      **Un ejemplo nuestro.** En una barra de acero de $A = 400$ mm² con
      $E = 200$ GPa y $\nu = 0{,}25$ ($G = 80$ GPa), una distorsión uniforme
      de $10^{-3}$ pediría $\tau_{xy} = 80$ MPa en toda la sección, y una
      cortante $T_y = \tau_{xy}A = 32$ kN. Una barra sin cortante no puede
      tenerla. El motor del curso da la misma $\tau_{xy}$.

  # ── Cuestión 4 de autoevaluación del tema 8 · depósitos y anillos.
  - id: ejerm8-cu4-depositos-y-anillos
    titulo: Depósitos y anillos de pequeño espesor
    fuente: >-
      Cuestión 4 de autoevaluación · Tema 8, «Esfuerzo axial simple» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 8,
      apartado 8.5 (pp. 8 a 12, figs. 8.4 a 8.8, ecs. 8.13 a 8.20). La
      segunda frase se parece a la pregunta 4 de teoría del primer parcial de 2013-2014,
      «Deducir la relación entre las tensiones principales y la presión
      interna p en un depósito de revolución de pequeño espesor», y a la
      cuestión 4 del de 2017-2018, que piden lo mismo con otras palabras;
      esta pide además los anillos. El ejemplo es nuestro, comprobado con el
      motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Todo sale del equilibrio de un trozo de pared: la presión empuja hacia
        fuera y las tensiones de la pared la sostienen. Cambia la forma del
        trozo, no la idea.
      formula: |
        $$
        \sigma = \frac{p\,r_1}{t}
        $$

        La tensión en la circunferencia de un anillo delgado, de radio
        interior $r_1$ y espesor $t$, con una presión $p$ por dentro (ec. 8.18,
        p. 11).
      reconocer: |
        Antes de redactar, compara un depósito cilíndrico cerrado con un
        anillo: qué tiene uno que no tenga el otro.
    enunciado: |
      4. Depósitos y anillos de pequeño espesor. Deducir la ecuación de
      equilibrio de un depósito de revolución.
    pide: >-
      La relación entre la presión y las tensiones en la pared de un
      depósito de revolución, deducida del equilibrio, con la esfera y el
      cilindro; y las tensiones y deformaciones de un anillo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un anillo es, como el depósito cilíndrico, un cilindro de pared
          delgada con presión. ¿Por qué no tiene tensión $\sigma_2$, la que va
          a lo largo del eje?
        opciones:
          - texto: >-
              Porque es abierto: no hay tapas sobre las que empuje la presión,
              y nada tira de la pared a lo largo del eje
            correcta: true
            mensaje: |
              Eso es (p. 11). En el depósito cerrado, $\sigma_2$ sale del
              empuje de la presión sobre la tapa (ec. 8.17); sin tapa, ese
              empuje no existe.
          - texto: >-
              Porque la pared es delgada
            mensaje: |
              Ser delgada hace despreciable la tensión según el espesor, no la
              del eje: un depósito cilíndrico igual de delgado tiene
              $\sigma_2 = pr/2t$.
          - texto: >-
              Porque la presión es perpendicular a la pared
            mensaje: |
              También lo es en el depósito cerrado, que sí tiene $\sigma_2$.
              Lo que la crea es el empuje sobre las tapas.
          - texto: >-
              Porque $\sigma_2$ es despreciable frente a $\sigma_1$
            mensaje: |
              En un cilindro cerrado $\sigma_2 = pr/2t$ es la mitad de
              $\sigma_1$: nada despreciable. En un anillo no es pequeña: es
              nula.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Responde como en un examen: la ecuación del depósito deducida del
          equilibrio, la esfera y el cilindro, y las tensiones y
          deformaciones de los anillos.
        rubrica:
          - punto: >-
              Con presión interior p y espesor t pequeño frente a los radios de
              curvatura, según meridianos y paralelos solo hay tensiones
              normales: son direcciones principales (pp. 8 y 9).
            porque: >-
              Es lo que permite aislar un elemento con solo dos tensiones.
            minimo: true
          - punto: >-
              Equilibrio del elemento ds1 × ds2 en la normal a la pared (figs.
              8.4 y 8.5): p ds1 ds2 = 2σ1 ds2 t sin(dθ1/2) + 2σ2 ds1 t
              sin(dθ2/2) (ec. 8.13); σ1 actúa sobre el lado ds2 y σ2 sobre el
              lado ds1.
            porque: >-
              Es la ecuación de equilibrio que pide la cuestión.
            minimo: true
          - punto: >-
              Con ángulos pequeños y dsi = ri dθi: p/t = σ1/r1 + σ2/r2
              (ec. 8.14).
            porque: >-
              Es el resultado: la ecuación del depósito, ya sin los ángulos.
            minimo: true
          - punto: >-
              La tercera tensión principal vale −p en el interior de la pared y
              0 en el exterior; es sensiblemente menor que las otras dos y se
              supone nula.
            porque: >-
              Justifica tratar la pared como un estado plano.
          - punto: >-
              Esfera, r1 = r2 = r: σ = pr/2t (ec. 8.15). Cilindro, r1 = R y
              r2 = ∞: σ1 = pr/t (ec. 8.16), y del equilibrio de un corte
              perpendicular al eje, pπr² = 2πrtσ2, σ2 = pr/2t (ec. 8.17).
            porque: >-
              Son los dos casos que se usan.
            minimo: true
          - punto: >-
              Anillos: cilindros abiertos, σ2 = 0. Con presión en el radio
              interior, σ = pr1/t y ε = pr1/Et + ε0 (ec. 8.18); en el
              exterior, σ = −pr2/t y ε = −pr2/Et + ε0 (ec. 8.19).
            porque: >-
              Es la otra mitad de la cuestión.
            minimo: true
          - punto: >-
              ε es la variación relativa de la circunferencia; con dos anillos
              uno dentro del otro, la presión de contacto x sale de igualar
              sus deformaciones en el radio de contacto (ec. 8.20).
            porque: >-
              Es para lo que se usan las deformaciones de los anillos.
      - tipo: calcular
        titulo: La tensión de un anillo
        pregunta: |
          Un ejemplo nuestro: un anillo de acero ($E = 200$ GPa) de radio
          interior 200 mm y espesor 5 mm, con una presión interior de 2 MPa.
          ¿Cuánto vale su tensión, en MPa?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.05
          formato: un número, en MPa, con su signo
        distractores:
          - valor: '40'
            mensaje: |
              $pr/2t$ es la de una esfera, o la longitudinal de un cilindro con
              tapas. En el anillo solo hay la circunferencial,
              $\sigma = pr_1/t$ (ec. 8.18).
          - valor: '160'
            mensaje: |
              Has usado el diámetro, 400 mm. La ec. 8.18 lleva el radio:
              $\sigma = pr_1/t$.
          - valor: '-80'
            mensaje: |
              Con presión interior el anillo se abre: la tensión es de
              tracción (ec. 8.18). Es negativa con presión exterior
              (ec. 8.19).
        pista: |
          Ec. 8.18, con la presión en el radio interior: $\sigma = pr_1/t$.
        desarrollo: |
          $$
          \sigma = \frac{p\,r_1}{t} = \frac{2\cdot200}{5} = 80
          $$

          en MPa. Su deformación,
          $\varepsilon = 80/(2\cdot10^{5}) = 4\cdot10^{-4}$, abre el radio
          $4\cdot10^{-4}\cdot200 = 0{,}08$ mm.
      - tipo: calcular
        titulo: Dos anillos encajados
        pregunta: |
          Otro ejemplo nuestro: un anillo A de aluminio ($E = 70$ GPa,
          espesor 6 mm) va dentro de un anillo B de acero ($E = 200$ GPa,
          espesor 4 mm), con un radio de contacto $r = 100$ mm. B se fabricó
          con un radio 0,05 mm menor que el de contacto y se ha encajado sobre
          A. ¿Qué presión $x$ hay entre los dos, en MPa?
        respuesta:
          tipo: numero
          valor: '1.377'
          tolerancia: 0.005
          formato: un número, en MPa
        distractores:
          - valor: '1.05'
            mensaje: |
              Has copiado la ec. 8.20 tal como viene en los apuntes, con
              $E_At_A$ en los dos lados. El término de B lleva su propio
              producto, $E_Bt_B$.
          - valor: '2.10'
            mensaje: |
              Has hecho que solo se deforme A, como si B fuera rígido. B
              también se abre, $xr/E_Bt_B$, y eso rebaja la presión.
          - valor: '4.00'
            mensaje: |
              Has hecho que solo se deforme B, como si A fuera rígido. A
              también se cierra, $xr/E_At_A$.
        pista: |
          Ec. 8.20: A tiene la presión por fuera y B por dentro, y en el
          contacto $\varepsilon^{A} = \varepsilon^{B}$, con
          $\varepsilon_0^{A} = 0$ y
          $\varepsilon_0^{B} = -0{,}05/100$.
        desarrollo: |
          Con $x$ en MPa y $r$ y $t$ en mm,

          $$
          -\frac{100\,x}{7\cdot10^{4}\cdot6} = \frac{100\,x}{2\cdot10^{5}\cdot4} - 5\cdot10^{-4}
          $$

          $$
          x = \frac{5\cdot10^{-4}}{2{,}381\cdot10^{-4} + 1{,}25\cdot10^{-4}} = 1{,}377
          $$

          en MPa.
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Según meridianos y paralelos solo hay tensiones normales: son
              direcciones principales.
          - texto: >-
              Equilibrio del elemento:
              $p\,ds_1ds_2 = 2\sigma_1ds_2t\sin(\tfrac12d\theta_1) + 2\sigma_2ds_1t\sin(\tfrac12d\theta_2)$
              (ec. 8.13).
          - texto: >-
              Con ángulos pequeños y $ds_i = r_id\theta_i$:
              $p/t = \sigma_1/r_1 + \sigma_2/r_2$ (ec. 8.14).
          - texto: >-
              Esfera, $\sigma = pr/2t$; cilindro, $\sigma_1 = pr/t$ y, del
              corte perpendicular al eje, $\sigma_2 = pr/2t$.
          - texto: >-
              Anillo, cilindro abierto: $\sigma_2 = 0$, y con presión interior
              $\sigma = pr_1/t$ (ec. 8.18).
          - texto: >-
              En el cilindro, como $r_2 = \infty$, la ec. 8.14 da
              $\sigma_2 = 0$.
            trampa: true
            mensaje: |
              Con $r_2 = \infty$ se anula el término $\sigma_2/r_2$, no
              $\sigma_2$: la 8.14 da entonces $\sigma_1 = pr/t$, y $\sigma_2$
              sale del equilibrio del corte, $pr/2t$ (ec. 8.17). Solo en el
              anillo, sin tapas, es nula.
    resolucion: |
      **El depósito** (apuntes del tema 8, apartado 8.5.1, pp. 8 a 10). En
      un depósito de revolución con presión interior $p$, si el espesor $t$
      de la pared es pequeño frente a los radios de curvatura, según los
      paralelos y los meridianos solo hay tensiones normales: son direcciones
      principales. Se aísla el elemento $ds_1 \times ds_2$ de la fig. 8.4 y,
      con las dos proyecciones de la fig. 8.5, el equilibrio según la normal
      a la pared es

      $$
      p\,ds_1ds_2 = 2\sigma_1ds_2t\sin\left(\tfrac12d\theta_1\right) + 2\sigma_2ds_1t\sin\left(\tfrac12d\theta_2\right) \qquad (8.13)
      $$

      Ojo: $\sigma_1$ actúa en el lado de longitud $ds_2$, y $\sigma_2$ en el
      de longitud $ds_1$. Con ángulos pequeños y $ds_i = r_id\theta_i$:

      $$
      \frac{p}{t} = \frac{\sigma_1}{r_1} + \frac{\sigma_2}{r_2} \qquad (8.14)
      $$

      La otra tensión principal vale $\sigma_3 = -p$ en el interior de la
      pared y $\sigma_3 = 0$ en el exterior; es sensiblemente menor que las
      otras dos, y se supone nula.

      - **Esfera**, $r_1 = r_2 = r$ y, por simetría, tensiones iguales:
        $\sigma = pr/2t$ (ec. 8.15).
      - **Cilindro**, $r_1 = R$ y $r_2 = \infty$: $\sigma_1 = pr/t$
        (ec. 8.16). $\sigma_2$ sale de cortar el cilindro por un plano
        perpendicular a su eje (fig. 8.6): $p\pi r^{2} = 2\pi rt\sigma_2$, y
        $\sigma_2 = pr/2t$ (ec. 8.17).

      **Los anillos** (apartado 8.5.2, pp. 11 y 12). Son cilindros abiertos
      con presión exterior o interior, así que $\sigma_2 = 0$ y queda una
      sola tensión, sin subíndice; los subíndices 1 y 2 son de los radios
      interior y exterior (fig. 8.7). Con la presión en el radio interior,
      tracción; en el exterior, compresión:

      $$
      \sigma = \frac{pr_1}{t} \quad \varepsilon = \frac{pr_1}{Et} + \varepsilon_0 \qquad (8.18)
      \qquad\qquad
      \sigma = -\frac{pr_2}{t} \quad \varepsilon = -\frac{pr_2}{Et} + \varepsilon_0 \qquad (8.19)
      $$

      $\varepsilon$ es la variación relativa de la longitud de la
      circunferencia, que es la del radio. Con dos anillos A y B uno dentro
      del otro (fig. 8.8), la presión de contacto $x$ sale de que las
      deformaciones en el radio de contacto sean iguales:

      $$
      \varepsilon^{A} = \varepsilon^{B} \Rightarrow -\frac{xr}{E_At_A} + \varepsilon_0^{A} = \frac{xr}{E_Bt_B} + \varepsilon_0^{B} \qquad (8.20)
      $$

      Los apuntes imprimen $E_At_A$ también en el segundo denominador: es el
      del anillo B.

      **Un ejemplo nuestro.** Un anillo de acero de radio interior 200 mm y
      espesor 5 mm, con 2 MPa dentro, trabaja a $\sigma = 80$ MPa y su radio
      crece 0,08 mm; con tapas, sería un depósito con $\sigma_1 = 80$ MPa y
      $\sigma_2 = 40$ MPa. Y un anillo de acero B ($E = 200$ GPa, 4 mm) que
      se fabricó 0,05 mm corto de radio, encajado sobre uno de aluminio A
      ($E = 70$ GPa, 6 mm) de radio 100 mm, da con la 8.20 una presión de
      contacto $x = 1{,}377$ MPa: B queda a
      $\sigma = \dfrac{1{,}37705\cdot100}{4} = 34{,}43$ MPa de tracción y A a
      $\sigma = -\dfrac{1{,}37705\cdot100}{6} = -22{,}95$ MPa. Comprobación:
      B se abre $34{,}43/(2\cdot10^{5})\cdot100 = 0{,}0172$ mm y A se cierra
      $22{,}95/(7\cdot10^{4})\cdot100 = 0{,}0328$ mm, y las dos suman los
      0,05 mm de apriete. El motor del curso da lo mismo.
  # ── Ejercicio propio, de práctica · dos barras que se alargan lo mismo, de distinta longitud.
  - id: ejerm8-la-barra-larga-y-la-corta
    titulo: La barra larga y la corta que cuelgan del mismo pasador
    fuente: Ejercicio propio · Road to Ingeniería. De nivel de los ejercicios de clase, escrito para un escalón al que los ejercicios de clase del tema 8 no dan material. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: practica
    antes:
      idea: |
        Dos barras sostienen el mismo pasador. Antes de repartir el peso,
        cuenta las incógnitas y las ecuaciones que tienes para ellas.
      formula: |
        $$
        \Delta L = \frac{NL}{EA}
        $$

        El alargamiento de una barra de sección constante con axil constante
        (ec. 8.9, p. 7, sin término térmico).
      reconocer: |
        Antes de las cuentas, mira qué tienen en común las dos barras en su
        extremo de abajo.
    enunciado: |
      Dos barras de acero, con $E = 200\ \text{GPa}$ y la misma sección,
      $A = 50\ \text{mm}^{2}$, cuelgan verticales, una al lado de la otra. La
      barra 1 está colgada del techo y mide $L_1 = 3\ \text{m}$; la barra 2,
      de una ménsula rígida más baja, y mide $L_2 = 2\ \text{m}$. Abajo, las
      dos acaban en el mismo punto, un pasador del que cuelga un peso
      $W = 10\ \text{kN}$. El techo y la ménsula no se mueven.

      a) ¿Qué axil lleva la barra 2?

      b) ¿Qué tensión tiene la barra 1?

      c) ¿Cuánto baja el pasador?

      <figure>
      <svg viewBox="0 0 380 292" role="img" width="380" height="292" aria-labelledby="ejerm8-la-barra-larga-y-la-corta-fig-t ejerm8-la-barra-larga-y-la-corta-fig-d">
