    fuente: >-
      Propuesta A5 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (el método de las fuerzas con el axil
      de la barra 3 como incógnita, y lo que bajan B y D). La figura está
      redibujada a escala con los ángulos y las cotas del original, que no lo
      está.
