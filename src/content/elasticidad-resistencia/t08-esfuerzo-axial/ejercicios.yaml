      <figcaption>

      Nuestra, con el giro exagerado. A se mueve en horizontal; la barra 1
      solo se alarga la proyección de ese movimiento sobre su dirección.

      </figcaption>
      </figure>

      Cada barra se alarga la proyección del desplazamiento de su extremo
      sobre ella (ec. 8.12). La 2 es vertical y se alarga lo que baja B; la 1
      forma 45° con el movimiento de A:

      $$
      \Delta L_2 = \theta L
      \qquad
      \Delta L_1 = \theta L \cos 45^{\circ} = \frac{\theta L}{\sqrt{2}}
      $$

      **Ley de cada barra** (ec. 8.9), con $L_1 = L\sqrt{2}$ y $L_2 = L$:

      $$
      N_2 = \frac{EA\,\Delta L_2}{L} = EA\,\theta
      \qquad
      N_1 = \frac{EA\,\Delta L_1}{L\sqrt{2}} = \frac{EA\,\theta}{2}
      $$

      **Las fuerzas.** Con $N_1 = N_2/2$ en los momentos,
      $N_2\left(1 + \tfrac{1}{2\sqrt{2}}\right) = 2P$:

      $$
      N_2 = \frac{4\sqrt{2}}{2\sqrt{2} + 1}\,P
      = \frac{4\sqrt{2}\,(2\sqrt{2} - 1)}{7}\,P
      = \frac{16 - 4\sqrt{2}}{7}\,P = 1{,}4776\,P
      \qquad
      N_1 = \frac{N_2}{2} = \frac{8 - 2\sqrt{2}}{7}\,P = 0{,}7388\,P
      $$

      Las dos a tracción, como se supuso. La barra a 45° lleva la mitad que
      la vertical: se alarga menos ($1/\sqrt{2}$) y es más larga ($\sqrt{2}$).

      **El desplazamiento de D.** El giro sale de la barra 2,
      $\theta = N_2/(EA) = 1{,}4776\,P/(EA)$. D está a $2L$ de O en
      horizontal y a $L$ por debajo:

      $$
      u_D = -\theta L = -1{,}4776\,\frac{PL}{EA}
      \qquad
      v_D = -2\theta L = -2{,}9552\,\frac{PL}{EA}
      $$

      D se va a la izquierda y baja el doble de lo que se va.

      **Comprobación por otro camino.** La reacción de O sale del equilibrio
      global: en horizontal, $R_x = -N_1/\sqrt{2} = -0{,}5224\,P$; en
      vertical, $R_y = P - N_1/\sqrt{2} - N_2 = -P$, es decir, O tira de la
      pieza hacia abajo con $P$. Y los momentos en O con las dos fuerzas:
      $0{,}5224 + 1{,}4776 = 2$, que es $2PL$ en unidades de $PL$.
