      - tipo: calcular
        titulo: La razón entre los alargamientos
        pregunta: |
          Con la celosía girada un ángulo pequeño θ alrededor de A, ¿cuánto
          vale $\Delta L_2/\Delta L_1$?
        respuesta:
          tipo: numero
          valor: '1.2649'
          tolerancia: 0.002
          formato: un número, ΔL2 dividido entre ΔL1
        distractores:
          - valor: '2'
            mensaje: |
              Es la razón entre lo que bajan los dos extremos, $2a\theta$ y
              $a\theta$. Cada barra se alarga solo la proyección de ese
              descenso sobre ella, y las dos van inclinadas distinto.
          - valor: '1'
            mensaje: |
              Es suponer que las dos se alargan igual porque salen de D. El
              otro extremo de cada una baja distinto, y cada una lo ve con su
              ángulo.
          - valor: '2.5298'
            mensaje: |
              Has proyectado el descenso del extremo de la 2 con el coseno de
              su ángulo con la horizontal, $2/\sqrt{5}$. El descenso es
              vertical, y su componente a lo largo de la barra va con el seno,
              $1/\sqrt{5}$.
        pista: |
          B baja $a\theta$ y el extremo de la 2, $2a\theta$. La 1 va de D a B
          con dirección $(1, -1)/\sqrt{2}$; la 2, de D a su extremo, con
          $(2, -1)/\sqrt{5}$.
        desarrollo: |
          $$
          \Delta L_1 = \frac{a\theta}{\sqrt{2}}
          \qquad
          \Delta L_2 = \frac{2a\theta}{\sqrt{5}}
          \qquad
          \frac{\Delta L_2}{\Delta L_1} = \frac{2\sqrt{2}}{\sqrt{5}} = 1{,}2649
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.4058'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '1.0879'
            mensaje: |
              Has tomado como alargamiento de cada barra lo que baja su
              extremo, $a\theta$ y $2a\theta$, sin proyectar; o has puesto $N$
              proporcional a $\Delta L$ sin dividir entre la longitud, que da
              lo mismo. Cada barra se alarga solo la componente del descenso en
              su dirección, y la 1 mide $a\sqrt{2}$ y la 2, $a\sqrt{5}$.
          - valor: '1.2488'
            mensaje: |
              Es $N_1 = N_2$, el reparto de dos barras iguales. Son iguales en
              material y sección, no en longitud ni en lo que se alargan.
          - valor: '1.5713'
            mensaje: |
              Has puesto $\Delta L_1 = \Delta L_2$. Comparten D, pero el
              extremo de la 2 está el doble de lejos de A y baja el doble.
          - valor: '0.7692'
            mensaje: |
              Has tomado como brazo de cada barra la distancia horizontal de su
              extremo a A, $a$ y $2a$. El brazo es la distancia de A a la recta
              de la barra: $a/\sqrt{2}$ la 1 y $2a/\sqrt{5}$ la 2.
        pista: |
          Con $L_1 = a\sqrt{2}$ y $L_2 = a\sqrt{5}$, $N_1 = EA\theta/2$ y
          $N_2 = 2EA\theta/5$. En los momentos en A, el brazo de cada barra es
          la distancia de A a su recta.
        desarrollo: |
          $$
          N_1\,\frac{a}{\sqrt{2}} + N_2\,\frac{2a}{\sqrt{5}} = P\cdot 2a
          \;\Longrightarrow\;
          EA\theta\left(\frac{1}{2\sqrt{2}} + \frac{4}{5\sqrt{5}}\right) = 2P
          $$

          $$
          EA\theta = 2{,}8117\,P
          \qquad
          N_1 = \frac{EA\theta}{2} = 1{,}4058\,P
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.1247'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '1.3760'
            mensaje: |
              Has tomado como alargamiento de cada barra lo que baja su
              extremo, sin proyectar; o has puesto $N$ proporcional a
              $\Delta L$ sin dividir entre la longitud, que da lo mismo. La 1
              mide $a\sqrt{2}$ y la 2, $a\sqrt{5}$: con eso la 2 se lleva más de
              lo que le toca.
          - valor: '1.2488'
            mensaje: |
              Es $N_1 = N_2$, el reparto de dos barras iguales. Mismo $EA$ no
              es misma fuerza: la 2 es más larga y se alarga distinto.
          - valor: '0.9938'
            mensaje: |
              Has puesto $\Delta L_1 = \Delta L_2$. El extremo de la 2 está el
              doble de lejos de A y baja el doble.
          - valor: '2.2361'
            mensaje: |
              Es lo que llevaría la barra 2 sola: con los momentos en A,
              $N_2 \cdot 2a/\sqrt{5} = 2Pa$ da $\sqrt{5}\,P$. La 1 también se
              alarga con el giro y se lleva parte del momento.
          - valor: '0.6154'
            mensaje: |
              Has tomado como brazo de cada barra la distancia horizontal de su
              extremo a A, $a$ y $2a$. El brazo es la distancia de A a la recta
              de la barra: $a/\sqrt{2}$ la 1 y $2a/\sqrt{5}$ la 2.
        pista: |
          De la compatibilidad, $N_2 = \tfrac{4}{5}N_1$.
        desarrollo: |
          $$
          N_2 = \frac{2EA\theta}{5} = \frac{4}{5}\,N_1 = 1{,}1247\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Son cuatro incógnitas, $N_1$, $N_2$ y las dos reacciones de A, y
              tres ecuaciones: falta una de compatibilidad.
          - texto: >-
              La celosía gira θ alrededor de A: B baja $a\theta$ y el extremo
              de la 2, $2a\theta$.
          - texto: >-
              Cada barra se alarga la proyección de ese descenso:
              $\Delta L_1 = a\theta/\sqrt{2}$ y $\Delta L_2 = 2a\theta/\sqrt{5}$.
          - texto: >-
              Con $L_1 = a\sqrt{2}$ y $L_2 = a\sqrt{5}$, $N_1 = EA\theta/2$ y
              $N_2 = 2EA\theta/5$.
          - texto: >-
              Los momentos en A, con brazos $a/\sqrt{2}$ y $2a/\sqrt{5}$, dan
              $N_1 = 1{,}4058\,P$ y $N_2 = 1{,}1247\,P$.
          - texto: >-
              Como el material y la sección de las dos barras son iguales, las
              dos llevan la misma fuerza.
            trampa: true
            mensaje: |
              El mismo $EA$ da la misma fuerza solo con el mismo $\Delta L/L$.
              Aquí la 2 es más larga y se alarga distinto: $N_2 = 4N_1/5$.
    resolucion: |
      **1. El sólido libre.** La celosía, como una pieza rígida sin canto, sin
      la articulación de A y con las dos barras cortadas. Origen en A, $x$
      hacia la derecha e $y$ hacia arriba: $D = (0, a)$, $B = (a, 0)$ y el
      extremo de la barra 2, en la vertical de C, $E = (2a, 0)$.

      <figure class="figura-examen">
      <svg viewBox="0 16 280 212" role="img" width="420" height="318" aria-labelledby="dsl-t dsl-d">
