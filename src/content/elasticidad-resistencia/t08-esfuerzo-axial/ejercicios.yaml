      <rect x="150" y="200" width="40" height="8" fill="url(#ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-r)"/><line x1="150" y1="200" x2="190" y2="200" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="219.28" y="70" width="40" height="10" fill="url(#ejerm8-cl8-3-tres-barras-en-c-con-la-2-calentada-r)"/><line x1="219.28" y1="80" x2="259.28" y2="80" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="90" y1="120" x2="170" y2="120" stroke="var(--ink)" stroke-width="3"/>
