      <line x1="160" y1="130" x2="112.9" y2="177.1" stroke="var(--d2)" stroke-width="1.8"/><polygon points="108,182 111.2,173.9 116.1,178.8" fill="var(--d2)"/>
      <line x1="70" y1="130" x2="48.2" y2="151.8" stroke="var(--live)" stroke-width="1.4"/><polygon points="44,156 46.8,148.9 51.1,153.2" fill="var(--live)"/>
      <circle cx="70" cy="40" r="3.2" fill="var(--ink)"/>
      <circle cx="160" cy="40" r="3.2" fill="var(--ink)"/>
      <circle cx="70" cy="130" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <circle cx="160" cy="130" r="3.2" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <text x="77" y="38" font-size="12" fill="var(--ink)" font-style="italic">O</text>
      <text x="168" y="44" font-size="12" fill="var(--ink)" font-style="italic">C</text>
      <text x="77" y="145" font-size="12" fill="var(--ink)" font-style="italic">A</text>
      <text x="168" y="134" font-size="12" fill="var(--ink)" font-style="italic">B</text>
      <text x="44" y="124" font-size="12" text-anchor="middle" font-style="italic" fill="var(--d2-tinta)">θL</text>
      <text x="104" y="196" font-size="12" text-anchor="middle" font-style="italic" fill="var(--d2-tinta)">θL√2</text>
      <text x="40" y="174" text-anchor="middle" font-size="11" fill="var(--live)">ΔL₁ = θL/√2</text>
      <text x="154" y="85" fill="var(--ink)" text-anchor="end" font-size="11">2</text>
      <text x="91" y="99" fill="var(--ink)" text-anchor="end" font-size="11">1</text>
