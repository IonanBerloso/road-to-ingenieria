            porque: |
              Las tres se suponen a tracción, tirando de E hacia su otro
              extremo.
          - punto: |
              **BE en los dos dibujos, con el mismo axil, y su temperatura sin
              flecha.**
            porque: |
              Es una sola barra; la temperatura entra en su alargamiento,
              $\alpha\Delta T\,L$.
