            <path d="M20 90 H50 M20 104 H50" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M190 90 H220 M190 104 H220" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M50 124 H190 M50 120 V128 M190 120 V128" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="120" y="118" font-size="9" text-anchor="middle" fill="var(--faint)">L</text>
            <line x1="46" y1="97" x2="14" y2="97" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="16" y="88" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
            <line x1="194" y1="97" x2="226" y2="97" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="224" y="88" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N</text>
            <text x="120" y="84" font-size="9" text-anchor="middle" fill="var(--faint)">ΔT</text>
          </svg>

      - tipo: calcular
        titulo: La tensión a −10 °C
        pregunta: |
          ¿Qué tensión tiene el carril a −10 °C, en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '75.6'
          tolerancia: 0.1
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '-75.6'
            mensaje: |
              El valor es ese, el signo no. Al enfriarse, el carril quiere
              acortarse y las traviesas no le dejan: tiran de él y lo estiran.
              Con $\Delta T = -30$ °C, $\sigma = -E\alpha\,\Delta T$ sale
              positiva.
          - valor: '25.2'
            mensaje: |
              Has puesto $\Delta T = -10$, la temperatura de esa noche. El
              incremento se cuenta desde la de soldadura:
              $\Delta T = -10 - 20 = -30$ °C.
        pista: |
          $\sigma = -E\alpha\,\Delta T$, con $\Delta T$ desde los 20 °C de la
          soldadura y $E = 2{,}1 \cdot 10^{5}$ MPa.
        desarrollo: |
          $E\alpha = 2{,}1 \cdot 10^{5} \cdot 12 \cdot 10^{-6} = 2{,}52$ MPa
          por grado, y

          $$
          \sigma = -E\alpha\,\Delta T = -2{,}52 \cdot (-10 - 20) = 75{,}6\ \text{MPa}
          $$

          A tracción.

      - tipo: calcular
        titulo: La temperatura de la tracción admisible
        pregunta: |
          ¿A qué temperatura del carril se llega a los 120 MPa de tracción,
          en °C?
        respuesta:
          tipo: numero
          valor: '-27.62'
          tolerancia: 0.05
          formato: un número con su signo, en °C
        distractores:
          - valor: '-47.62'
            mensaje: |
              Es el incremento, $\Delta T = -120/2{,}52 = -47{,}62$ °C, no la
              temperatura. Se cuenta desde los 20 °C de la soldadura:
              $20 - 47{,}62 = -27{,}62$ °C.
          - valor: '67.62'
            mensaje: |
              Has calentado en vez de enfriar. La tracción llega al enfriarse:
              el carril quiere acortarse y no le dejan. Calentado 47,62 °C
              llegaría a 120 MPa, pero de compresión.
          - valor: '-11.75'
            mensaje: |
              Has usado los 80 MPa del límite de la compresión: a −11,75 °C el
              carril está a 80 MPa, pero de tracción. En frío el carril está a
              tracción, y su límite es de 120 MPa.
        pista: |
          Despeja $\Delta T$ de $\sigma = -E\alpha\,\Delta T$ con
          $\sigma = +120$ MPa, y súmalo a los 20 °C de la soldadura.
        desarrollo: |
          $$
          \Delta T = -\frac{\sigma}{E\alpha} = -\frac{120}{2{,}52} = -47{,}62
          \qquad
          T = 20 - 47{,}62 = -27{,}62\ \text{°C}
          $$

      - tipo: calcular
        titulo: La temperatura de la compresión admisible
        pregunta: |
          ¿A qué temperatura del carril se llega a los 80 MPa de compresión,
          en °C?
        respuesta:
          tipo: numero
          valor: '51.75'
          tolerancia: 0.05
          formato: un número con su signo, en °C
        distractores:
          - valor: '31.75'
            mensaje: |
              Es el incremento, $\Delta T = 80/2{,}52 = 31{,}75$ °C, no la
              temperatura: $20 + 31{,}75 = 51{,}75$ °C.
          - valor: '-11.75'
            mensaje: |
              Has enfriado en vez de calentar. La compresión llega al
              calentarse: el carril quiere alargarse y no le dejan. Enfriado
              31,75 °C llegaría a 80 MPa, pero de tracción.
          - valor: '67.62'
            mensaje: |
              Has usado los 120 MPa del límite de la tracción: a 67,62 °C el
              carril está a 120 MPa, pero de compresión. Al calentarse está
              comprimido, y su límite es de 80 MPa.
        pista: |
          Ahora $\sigma = -80$ MPa: $\Delta T = -\sigma/(E\alpha)$, desde los
          20 °C de la soldadura.
        desarrollo: |
          $$
          \Delta T = -\frac{-80}{2{,}52} = 31{,}75
          \qquad
          T = 20 + 31{,}75 = 51{,}75\ \text{°C}
          $$

          Un carril al sol, en verano, llega a esas temperaturas.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El carril no puede cambiar de longitud: $\sigma L/E + \alpha\,\Delta T\,L = 0$, y $\sigma = -E\alpha\,\Delta T$, sin $L$ ni $A$.'
          - texto: '$\Delta T$ se cuenta desde los 20 °C de la soldadura, cuando no tenía tensión.'
          - texto: 'A −10 °C, $\Delta T = -30$ °C y $\sigma = +75{,}6$ MPa, a tracción.'
          - texto: 'Los 120 MPa de tracción llegan con $\Delta T = -47{,}62$ °C, a $-27{,}62$ °C; los 80 MPa de compresión, con $\Delta T = 31{,}75$ °C, a $51{,}75$ °C.'
          - texto: Cuanto más largo es el carril, más querría acortarse al enfriarse, y más tensión tiene.
            trampa: true
            mensaje: |
              Querría acortarse más, sí, pero también hace falta estirarlo
              más para devolverlo a su longitud: las dos cosas van con $L$, y
              la tensión no depende de ella.
    resolucion: |
      **1. El sólido libre.** Un trozo cualquiera del carril, lejos de sus
      extremos, de longitud $L$.

      <figure class="figura-examen">
