ejercicios:
  - id: ejerm8-la-barra-rigida-colgada
    titulo: La barra rígida colgada de dos barras, y la ecuación que falta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Una barra rígida horizontal ABC está articulada en A y cuelga de dos
      barras verticales iguales sujetas al techo: la barra 1 en B y la barra 2
      en C, con $AB = BC = a = 1\ \text{m}$. Las dos barras miden
      $L = 1\ \text{m}$, tienen una sección $A = 100\ \text{mm}^{2}$ y son de
      acero, $E = 200\ \text{GPa}$. En C cuelga una carga
      $P = 10\ \text{kN}$. Es la viga de la figura del tema.

      Calcular la fuerza en la barra 2 y el descenso del punto C.
    pide: El axial de la barra 2 y el descenso de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las incógnitas son $N_1$, $N_2$ y las dos reacciones de A. ¿Se
          pueden sacar todas del equilibrio?
        opciones:
          - texto: No; es hiperestático, y la ecuación que falta es la compatibilidad del giro de la viga
            correcta: true
            mensaje: |
              Eso es. El plano da tres ecuaciones y hay cuatro incógnitas. La
              cuarta sale de cómo se mueve la viga: gira alrededor de A, así
              que C baja el doble que B, y la barra 2 se alarga el doble que
              la 1.
          - texto: Sí; con momentos en A se sacan las dos fuerzas
            mensaje: |
              Los momentos en A dan una sola ecuación, $N_1 a + N_2\,2a = P\,2a$,
              con dos incógnitas. Para repartir la carga entre las dos barras
              hace falta saber cuánto se alarga cada una.
          - texto: Sí, porque la viga es rígida y las dos barras llevan lo mismo
            mensaje: |
              Rígida no quiere decir que baje entera: está articulada en A y
              gira. Las barras se alargan distinto y llevan fuerzas distintas.

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale el axial de la barra 2, en kN?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '6.6667'
            mensaje: |
              Has supuesto que las dos barras se alargan lo mismo, como si la
              viga bajara entera. Está articulada en A y gira: C baja el doble
              que B, así que $\Delta L_2 = 2\,\Delta L_1$ y $N_2 = 2\,N_1$.
          - valor: '5'
            mensaje: |
              Tienes la proporción al revés: $N_1 = 2\,N_2$. La barra que más
              se alarga es la que está más lejos de A, la 2, y es la que más
              fuerza lleva.
          - valor: '10'
            mensaje: |
              Es lo que llevaría la barra 2 sola, sin la barra 1: con momentos
              en A, $N_2\,2a = P\,2a$. La barra 1 también se alarga y también
              sujeta.
        pista: |
          Compatibilidad: $\Delta L_2 = 2\,\Delta L_1$, y como las barras son
          iguales, $N_2 = 2\,N_1$. Equilibrio de momentos en A:
          $N_1 a + N_2\,2a = P\,2a$.
        desarrollo: |
          $$
          N_1 + 2\,(2N_1) = 2P
          \quad\Longrightarrow\quad
          N_1 = \frac{2P}{5} = 4\ \text{kN}
          \qquad
          N_2 = \frac{4P}{5} = 8\ \text{kN}
          $$

      - tipo: calcular
        titulo: El descenso de C
        pregunta: |
          ¿Cuánto baja el punto C, en mm?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número, en mm
        distractores:
          - valor: '0.2'
            mensaje: |
              Ese es el alargamiento de la barra 1, que es lo que baja B. C
              está el doble de lejos de A y baja el doble, que es lo que se
              alarga la barra 2.
          - valor: '400'
            mensaje: |
              Has puesto $E = 200$ con las fuerzas en N y las longitudes en
              mm. En esas unidades $E$ va en MPa: $200\ \text{GPa} = 200\,000\ \text{MPa}$.
        pista: |
          La barra 2 es vertical y su extremo de arriba no se mueve: se alarga
          lo que baja C. $\Delta L_2 = N_2 L/(EA)$, en N, mm y MPa.
        desarrollo: |
          $$
          v_C = \Delta L_2 = \frac{N_2\,L}{E\,A} = \frac{8000 \cdot 1000}{200\,000 \cdot 100} = 0{,}4\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Hay cuatro incógnitas y tres ecuaciones de equilibrio; la de momentos en A es $N_1 a + N_2\,2a = P\,2a$.
          - texto: La viga gira un ángulo pequeño $\theta$ alrededor de A, así que B baja $\theta a$ y C baja $2\theta a$.
          - texto: Las barras son verticales con el extremo de arriba fijo, y se alargan lo que bajan B y C, así que $\Delta L_2 = 2\,\Delta L_1$.
          - texto: Con la misma $EA/L$, $N_2 = 2N_1$, y con el equilibrio, $N_1 = 4$ kN y $N_2 = 8$ kN.
          - texto: C baja lo que se alarga la barra 2, $8000 \cdot 1000/(200\,000 \cdot 100) = 0{,}4$ mm.
          - texto: Como la viga es rígida, B y C bajan lo mismo y las dos barras llevan $P/2$.
            trampa: true
            mensaje: |
              Rígida no es inmóvil ni quiere decir que baje entera. Articulada
              en A, gira, y cada punto baja en proporción a su distancia a A.
    resolucion: |
      **Por qué no basta el equilibrio.** Las incógnitas son $N_1$, $N_2$ y
      las dos reacciones de A; el plano da tres ecuaciones. Se suponen las dos
      barras a tracción, y la de momentos en A es

      $$
      N_1\,a + N_2\,2a = P\,2a
      $$

      **Compatibilidad.** La viga es rígida y está articulada en A: con un
      giro pequeño $\theta$, B baja $\theta a$ y C, $2\theta a$. Cada barra es
      vertical, con el extremo de arriba fijo, y se alarga lo que baja su
      extremo de abajo, la proyección de su desplazamiento sobre ella:

      $$
      \Delta L_1 = \theta a \qquad \Delta L_2 = 2\theta a \qquad\Longrightarrow\qquad \Delta L_2 = 2\,\Delta L_1
      $$

      **Ley de cada barra.** $\Delta L_i = N_i L/(EA)$ con la misma $EA/L$, así
      que $N_2 = 2N_1$. Con el equilibrio:

      $$
      N_1 = \frac{2P}{5} = 4\ \text{kN} \qquad N_2 = \frac{4P}{5} = 8\ \text{kN}
      $$

      Las dos salen positivas: las dos barras están a tracción, como se
      supuso. La barra 2 trabaja a $\sigma_2 = 8000/100 = 80$ MPa.

      **El descenso de C.** En N, mm y MPa:

      $$
      v_C = \Delta L_2 = \frac{8000 \cdot 1000}{200\,000 \cdot 100} = 0{,}4\ \text{mm}
      \qquad
      \theta = \frac{\Delta L_1}{a} = \frac{0{,}2}{1000} = 2 \cdot 10^{-4}\ \text{rad}
      $$

      **Comprobación por otro camino.** Tomando el giro como incógnita, cada
      barra tira con $N_i = (EA/L)\,\theta\,d_i$, y el equilibrio en A da
      $(EA/L)\,\theta\,(a^{2} + 4a^{2}) = P\,2a$: el mismo
      $\theta = 2 \cdot 10^{-4}$ rad.
