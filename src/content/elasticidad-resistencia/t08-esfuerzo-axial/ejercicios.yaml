      **Notas nuestras.** El enunciado no da el material ni la sección de
      las barras: aquí las dos tienen el mismo módulo $E$ y la misma sección
      $A$. Las fuerzas salen en unidades de $P$, positivas a tracción, y los
      desplazamientos en unidades de $PL/(EA)$, positivos hacia la derecha y
      hacia arriba. D es el extremo del brazo horizontal a la altura de A y
      B, donde está su rótulo: la flecha de P sale del borde inferior, pero
      solo marca la recta de la fuerza, y el canto del brazo no se da.
    pide: >-
      Los axiles de las barras 1 y 2, en unidades de P, y las dos componentes
      del desplazamiento de D, en unidades de PL/(EA).
    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza gira un ángulo pequeño alrededor de O, y A está justo
          debajo de O. ¿Cómo se mueve A, y cuánto se alarga la barra 1?
        opciones:
          - texto: A se mueve en horizontal, θL, y la barra 1 se alarga la proyección de ese movimiento sobre ella, θL/√2
            correcta: true
            mensaje: |
              Eso es. Un punto de un sólido que gira alrededor de O se mueve
              perpendicular a la recta que lo une con O; OA es vertical, así
              que A va en horizontal. La barra 1 forma 45° con ese movimiento
              y solo se alarga lo que avanza en su dirección (apuntes, ec.
              8.12).
          - texto: A no se mueve, porque está en la vertical de O
            mensaje: |
              Estar en la vertical de O le quita el movimiento vertical, no el
              horizontal. Con la pieza girando, A se mueve θ por su distancia
              a O, $L$, y en perpendicular a OA: en horizontal.
          - texto: A se mueve θL, y la barra 1 se alarga eso mismo, θL
            mensaje: |
              Eso es tomar el desplazamiento del extremo por el alargamiento.
              La barra 1 forma 45° con el movimiento de A: la parte
              perpendicular a ella solo la gira. Se alarga
              $\theta L\cos 45^{\circ} = \theta L/\sqrt{2}$.
          - texto: A baja θL, como un punto de una viga horizontal
            mensaje: |
              Un punto baja cuando está a un lado de O, no debajo. Aquí OA es
              vertical y A se mueve en horizontal. Por los 45°, la proyección
              sobre la barra 1 saldría igual por casualidad; el apartado b no
              perdona: D también está a $L$ por debajo de O, y se va hacia la
              izquierda.

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.4776'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '1.3333'
            mensaje: |
              Has dado a la barra 1 todo el desplazamiento de A, $\theta L$,
              en vez de su proyección $\theta L/\sqrt{2}$; o la has tomado de
              longitud $L$ en vez de $L\sqrt{2}$. Cualquiera de los dos da
              $N_1 = N_2/\sqrt{2}$ y este número. Con los dos bien,
              $N_1 = N_2/2$.
          - valor: '2'
            mensaje: |
              Es lo que llevaría la barra 2 sola: con momentos en O,
              $N_2L = 2PL$. La barra 1 también se alarga y también sujeta, y
              se lleva parte del momento.
        pista: |
          Con un giro θ horario, $\Delta L_2 = \theta L$ y
          $\Delta L_1 = \theta L/\sqrt{2}$; como $L_1 = L\sqrt{2}$,
          $N_1 = N_2/2$. Momentos en O:
          $N_1\,L/\sqrt{2} + N_2\,L = 2PL$.
        desarrollo: |
          $$
          N_2 = \frac{EA\,\theta L}{L} = EA\,\theta
          \qquad
          N_1 = \frac{EA\,\theta L/\sqrt{2}}{L\sqrt{2}} = \frac{EA\,\theta}{2}
          $$

          $$
          \frac{N_2}{2\sqrt{2}} + N_2 = 2P
          \;\Longrightarrow\;
          N_2 = \frac{4\sqrt{2}}{2\sqrt{2} + 1}\,P
          = \frac{4\sqrt{2}\,(2\sqrt{2} - 1)}{7}\,P
          = \frac{16 - 4\sqrt{2}}{7}\,P
          \qquad
          \frac{16 - 4\sqrt{2}}{7} = 1{,}4776
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.7388'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '0.9428'
            mensaje: |
              Sale de dar a la barra 1 todo el desplazamiento de A, o de
              tomarla de longitud $L$: $N_1 = N_2/\sqrt{2}$ con $N_2 = 4P/3$.
              Se alarga $\theta L/\sqrt{2}$ y mide $L\sqrt{2}$, así que
              $N_1 = N_2/2$.
          - valor: '0.6667'
            mensaje: |
              Has tomado como brazo de $N_1$ respecto de O la distancia
              $OA = L$. La barra 1 va a 45°: su recta pasa a $L/\sqrt{2}$ de
              O, y ese es el brazo.
        pista: |
          De la compatibilidad, $N_1 = N_2/2$.
        desarrollo: |
          $$
          N_1 = \frac{N_2}{2} = \frac{8 - 2\sqrt{2}}{7}\,P
          \qquad
          \frac{8 - 2\sqrt{2}}{7} = 0{,}7388
          $$

          Comprobación con los momentos en O:
          $0{,}7388/\sqrt{2} + 1{,}4776 = 0{,}5224 + 1{,}4776 = 2$.

      - tipo: calcular
        titulo: El desplazamiento vertical de D
        pregunta: |
          ¿Cuánto vale el desplazamiento vertical de D, positivo hacia
          arriba, en unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '-2.9552'
          tolerancia: 0.004
          formato: un número con signo, vD dividido entre PL/(EA)
        distractores:
          - valor: '-1.4776'
            mensaje: |
              Esa es la componente horizontal. D está a $2L$ de O en
              horizontal y a $L$ en vertical: baja $\theta \cdot 2L$ y va a
              la izquierda $\theta L$.
          - valor: '-3.304'
            mensaje: |
              Es $\theta \cdot \overline{OD} = \theta L\sqrt{5}$, el
              desplazamiento entero de D. D se mueve perpendicular a OD, que no
              es horizontal: su componente vertical es θ por la distancia
              horizontal, $2L$.
          - valor: '2.9552'
            mensaje: |
              El valor es ese, pero P hace girar la pieza en sentido horario,
              y D, a la derecha de O, baja.
        pista: |
          Un punto a $(x, y)$ de O se mueve $\theta\,(y, -x)$ con un giro θ
          horario. D está a $(2L, -L)$, y $\theta = N_2/(EA)$.
        desarrollo: |
          $$
          \theta = \frac{N_2}{EA} = 1{,}4776\,\frac{P}{EA}
          \qquad
          v_D = -\theta \cdot 2L = -2{,}9552\,\frac{PL}{EA}
          $$

      - tipo: calcular
        titulo: El desplazamiento horizontal de D
        pregunta: |
          ¿Y el horizontal, positivo hacia la derecha, en unidades de
          $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '-1.4776'
          tolerancia: 0.002
          formato: un número con signo, uD dividido entre PL/(EA)
        distractores:
          - valor: '1.4776'
            mensaje: |
              El valor es ese, pero D está por debajo de O: con el giro
              horario va hacia la izquierda, como A.
          - valor: '-2.9552'
            mensaje: |
              Esa es la vertical. La horizontal es θ por la distancia
              vertical de D a O, que es $L$.
        pista: |
          Con $\theta\,(y, -x)$ y D a $(2L, -L)$, la componente horizontal es
          $\theta \cdot (-L)$.
        desarrollo: |
          $$
          u_D = -\theta L = -1{,}4776\,\frac{PL}{EA}
          $$

          D se va a la izquierda lo mismo que A, porque los dos están a $L$
          por debajo de O.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Son cuatro incógnitas, N1, N2 y las dos reacciones de O, y tres
              ecuaciones; la de momentos en O es
              $N_1L/\sqrt{2} + N_2L = 2PL$.
          - texto: >-
              La pieza gira θ en sentido horario: A va a la izquierda
              $\theta L$, y B, a la izquierda y hacia abajo, $\theta L$ en
              cada dirección.
          - texto: >-
              La barra 2 se alarga lo que baja B, $\theta L$; la 1, la
              proyección del movimiento de A sobre ella, $\theta L/\sqrt{2}$.
          - texto: >-
              Con $L_1 = L\sqrt{2}$, $N_1 = EA\theta/2$ y $N_2 = EA\theta$;
              con los momentos, $N_2 = 1{,}4776\,P$ y $N_1 = 0{,}7388\,P$.
          - texto: >-
              D se mueve $\theta L$ a la izquierda y $2\theta L$ hacia abajo,
              con $\theta = N_2/(EA)$.
          - texto: >-
              Como A está en la vertical de O, no se mueve, la barra 1 no se
              alarga y la 2 lo lleva todo, $N_2 = 2P$.
            trampa: true
            mensaje: |
              A no baja, pero se mueve: en horizontal, $\theta L$. Ese
              movimiento tiene una componente a lo largo de la barra 1, y por
              eso se alarga y trabaja.
    resolucion: |
      **Lo que la estática no cierra.** La pieza OABD está articulada en O y
      sujeta por dos barras: cuatro incógnitas, $N_1$, $N_2$ y las dos
      reacciones de O, y tres ecuaciones. Origen en O, $x$ a la derecha e
      $y$ hacia arriba: $A = (0, -L)$, $B = (L, -L)$, $D = (2L, -L)$ y la
      articulación del techo, $C = (L, 0)$. Las dos barras se suponen a
      tracción, tirando de la pieza hacia C. La 1 va de A a C a 45°, así que
      su recta pasa a $L/\sqrt{2}$ de O; la 2 es vertical, a $L$ de O.
      Momentos en O:

      $$
      N_1\,\frac{L}{\sqrt{2}} + N_2\,L = P \cdot 2L
      $$

      **Compatibilidad.** P hace girar la pieza en sentido horario un ángulo
      pequeño θ. Cada punto se mueve θ por su distancia a O, en perpendicular
      a la recta que lo une con O (apuntes, apartado 8.4): A, justo debajo de
      O, se va en horizontal hacia la izquierda $\theta L$; B se mueve
      $\theta L$ hacia la izquierda y $\theta L$ hacia abajo.

      <figure>
      <svg viewBox="0 20 250 210" role="img" width="250" height="210" aria-labelledby="ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45-giro-fig-t ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45-giro-fig-d">
      <title id="ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45-giro-fig-t">Cómo se mueven A y B cuando la pieza gira alrededor de O, y cuánto se alarga la barra 1</title>
      <desc id="ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45-giro-fig-d">La pieza en L, articulada en O, gira un ángulo pequeño θ en sentido horario. A, justo debajo de O, se mueve en horizontal hacia la izquierda una distancia θL. B se mueve perpendicular a OB, hacia abajo y a la izquierda, θL√2. La barra 1 va de C a A a 45°: su alargamiento es la proyección del desplazamiento de A sobre su dirección, θL/√2. La barra 2 es vertical y se alarga lo que baja B, θL.</desc>
      <line x1="70" y1="40" x2="70" y2="130" stroke="var(--faint)" stroke-width="5" stroke-linecap="round"/>
      <line x1="70" y1="130" x2="200" y2="130" stroke="var(--faint)" stroke-width="5" stroke-linecap="round"/>
      <line x1="70" y1="130" x2="160" y2="40" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="160" y1="130" x2="160" y2="40" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="70" y1="40" x2="160" y2="130" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="70" y1="130" x2="42.4" y2="157.6" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="18" y1="130" x2="44" y2="156" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="2 2"/>
