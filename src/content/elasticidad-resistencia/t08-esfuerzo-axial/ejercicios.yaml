      <circle cx="60" cy="110" r="4" fill="var(--ink)"/>
      <circle cx="300" cy="50" r="4" fill="var(--ink)"/>
      <circle cx="60" cy="170" r="4" fill="var(--ink)"/>
      <circle cx="300" cy="170" r="4" fill="var(--ink)"/>
      <circle cx="120" cy="187" r="4" fill="var(--ink)"/>
      <line x1="123" y1="136" x2="294" y2="136" stroke="var(--d2)" stroke-width="1.1"/>
      <line x1="123" y1="136" x2="123" y2="164" stroke="var(--d2)" stroke-width="1.1"/><polygon points="123,169 120.4,163 125.6,163" fill="var(--d2)"/>
