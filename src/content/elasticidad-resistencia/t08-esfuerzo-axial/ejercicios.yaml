      <figcaption>

      El proceso de deformación, con los giros muy exagerados. En trazo
      discontinuo, la posición final; C″ y N″, después de la traslación y
      antes del giro de BC.

      </figcaption>
      </figure>

      **Los dos giros son iguales.** CC′ es perpendicular a AC, y C″C′,
      perpendicular a BC: los dos forman el ángulo θ con la horizontal, a
      un lado y a otro, y CC″ es horizontal. El triángulo CC″C′ es
      isósceles: $CC' = C''C'$, es decir, $L\tan\beta_{AC} = L\tan\beta_{BC}$.
      Las dos patas giran el mismo ángulo β, en sentidos contrarios
      (observación 1 del ejemplo).

      **El alargamiento del tirante.** Con giros pequeños, cada punto se
      mueve en perpendicular a su pata, y del tirante, horizontal, solo
      cuenta la parte horizontal (apuntes, ecs. 8.10 a 8.12). M, a la
      distancia $d = AM = x/\cos\theta$ de A, se mueve $d\tan\beta$, y su
      parte horizontal, hacia N, es $MM'_0 = d\tan\beta\cos\theta$, con
      $M'_0$ en la recta del tirante sin deformar, en la vertical de M′. N se
      va $NN'' = \delta_B$ con la traslación y vuelve
      $N''N'_0 = d\tan\beta\cos\theta$ con el giro, con $N'_0$ en la misma
      recta, en la vertical de N′, así que
      $NN'_0 = NN'' - N''N'_0$. El tirante pasa de MN a $M'_0N'_0$:

      $$
      \delta = M'_0N'_0 - MN = NN'_0 - MM'_0 = \delta_B - 2d\tan\beta\cos\theta
      \tag{1}
      $$

      **El movimiento de C.** Con AC, C se va $L\tan\beta\cos\theta$ en
      horizontal; con BC, se va $\delta_B$ con la traslación y vuelve
      $L\tan\beta\cos\theta$ con el giro. Las dos cosas son el mismo C:

      $$
      \delta_B = 2L\tan\beta\cos\theta
      \tag{2}
      $$

      **Las dos incógnitas**, β y $\delta_B$. Con (2) en (1):

      $$
      \tan\beta = \frac{\delta}{2\,(L - d)\cos\theta}
      \tag{3}
      $$

      y con (3) en (2),

      $$
      \delta_B = \frac{L}{L - d}\,\delta = \frac{L}{L - x/\cos\theta}\,\delta
      $$

      B se va más de lo que se alarga el tirante, tanto más cuanto más
      cerca de C está el tirante.

      **El ejemplo.** Con $L = 1\ \text{m}$, $\theta = 20^{\circ}$,
      $x = 0{,}45\ \text{m}$ y $\delta = 0{,}3\ \text{mm}$:
      $d = 0{,}45\ \text{m}/0{,}93969 = 0{,}47888\ \text{m}$, y con todo en
      mm,

      $$
      \beta = \frac{0{,}3}{2 \cdot 521{,}12 \cdot 0{,}93969} = 3{,}063 \cdot 10^{-4}
      $$

      $$
      \delta_B = \frac{1000}{521{,}12} \cdot 0{,}3\ \text{mm} = 0{,}5757\ \text{mm}
      $$

      B se va 1,919 veces lo que se alarga el tirante.

      **Comprobación por otro camino.** El motor del curso trata las dos
      patas como sólidos rígidos: AC articulada en A, BC con B en un apoyo
      que solo le impide moverse en vertical, y la articulación de C hecha con dos barras
      muchísimo más rígidas que el tirante, que obligan a C a moverse igual
      en las dos patas. Con una carga vertical en C y el resultado escalado
      a $\delta = 0{,}3\ \text{mm}$, da el mismo giro en las dos patas, en
      sentidos contrarios, y B se va $0{,}5757\ \text{mm}$. Por la ecuación
      (2), $2 \cdot 1000 \cdot 3{,}0632 \cdot 10^{-4} \cdot 0{,}93969\ \text{mm} = 0{,}5757\ \text{mm}$.
      Y C, que el ejemplo no pregunta, baja
      $1000 \cdot 3{,}0632 \cdot 10^{-4} \cdot 0{,}34202\ \text{mm} = 0{,}1048\ \text{mm}$.
