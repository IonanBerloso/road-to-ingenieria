      <text x="210" y="130" font-size="12" text-anchor="middle" font-style="italic" fill="var(--d2-tinta)">q<tspan baseline-shift="sub" font-size="8">0</tspan></text>
      <text x="50" y="192" font-size="12" fill="var(--ink)" text-anchor="end">A</text>
      <text x="111" y="167" font-size="12" fill="var(--ink)" text-anchor="end">B</text>
      <text x="312" y="174" font-size="12" fill="var(--ink)">C</text>
      <text x="72" y="124" font-size="12" fill="var(--ink)">D</text>
      <text x="312" y="66" font-size="12" fill="var(--ink)">E</text>
      <text x="48" y="144" font-size="12" fill="var(--ink)" text-anchor="end">1</text>
