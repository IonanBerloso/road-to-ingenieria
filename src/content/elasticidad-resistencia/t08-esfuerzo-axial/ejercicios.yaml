      - **Dos barras y dos ecuaciones**: el nudo es isostático, y las fuerzas
        salen sin compatibilidad.
      - **Las dos se suponen a tracción**, tirando de C hacia su apoyo.
      - **La 2 va hacia $(1, 0)$** y la 1, de $(0, L)$ a $(L, 0)$, hacia
        $(1, -1)/\sqrt{2}$.

      **2. Incógnitas.** $N_1$ y $N_2$; los dos alargamientos; y el
      desplazamiento $(u, v)$ de C.

      **3. Ecuaciones.** El equilibrio de C, la ley de cada barra (ec. 8.9),
      con $L_1 = L\sqrt{2}$ y $L_2 = L$, y lo que C avanza en la dirección de
      cada barra (ec. 8.12):

      $$
      N_1\operatorname{sen}45^{\circ} = P
      \qquad
      N_1\cos 45^{\circ} + N_2 = 0
      $$

      $$
      \Delta L_i = \frac{N_iL_i}{EA}
      \qquad
      \Delta L_2 = u
      \qquad
      \Delta L_1 = \frac{u - v}{\sqrt{2}}
      $$

      **4. Resultados.** **Las fuerzas.**

      $$
      N_1 = \sqrt{2}\,P = 1{,}4142\,P
      \qquad
      N_2 = -P
      $$

      La 1 tira y la 2 empuja. **Los alargamientos:**

      $$
      \Delta L_1 = \frac{N_1L_1}{EA} = 2\,\frac{PL}{EA}
      \qquad
      \Delta L_2 = \frac{N_2L_2}{EA} = -\frac{PL}{EA}
      $$

      **El desplazamiento de C.**

      $$
      u_C = -\frac{PL}{EA}
      \qquad
      v_C = u_C - \sqrt{2}\,\Delta L_1 = -\left(1 + 2\sqrt{2}\right)\frac{PL}{EA} = -3{,}8284\,\frac{PL}{EA}
      $$

      **5. Comprobación.** El trabajo de P en su bajada tiene que ser la
      energía que guardan las dos barras, una cuenta que el tema 13 hace con
      calma: $\tfrac{1}{2}P\,|v_C| = \sum N^{2}L/(2EA)$. En unidades de
      $P^{2}L/(EA)$, $N_1^{2}L_1 + N_2^{2}L_2$ da $2\sqrt{2} + 1 = 3{,}8284$,
      que es $|v_C|$ en unidades de $PL/(EA)$. Y de vuelta a la proyección:
      con $u_C$ y $v_C$, lo que C avanza en la dirección de la 1 es
      $(-1 + 3{,}8284)/1{,}4142 = 2{,}0000$, el $\Delta L_1$ de arriba.

      **Lo que dice el resultado.** C se va hacia la pared y baja casi cuatro
      veces más. La bajada no es solo la de la barra 1: la 2 se acorta, C se
      va hacia la pared, y la 1, que tiene que seguir llegando a C, lo baja
      también.

  # ── Propuesta A2 de clase · la barra que cuelga con su peso.
  - id: ejerm8-cla2-la-barra-que-cuelga-con-su-peso
    titulo: La barra que cuelga con su propio peso
    fuente: >-
      Propuesta A2 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8 y la barra partida en 400 tramos con el peso
      en los nudos) y comprobada por un segundo camino (la fórmula cerrada y,
      para el volumen, las rebanadas deformadas de verdad). Se conserva la
      errata del original, «volumentes»; la «v» de los datos es el
      coeficiente de Poisson, ν. El enunciado no da un número para ν: el
      último paso toma ν = 0,3. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        El peso no está en un punto: está repartido por toda la barra. Por eso
        el axil, y con él el alargamiento, cambian de una sección a otra.
      formula: |
        $$
        \Delta L = \int_0^L \frac{N}{EA}\,dx
        $$

        El alargamiento de una barra cuyo axil cambia a lo largo de ella (ec.
        8.8, sin término térmico).
      reconocer: |
        Antes de las cuentas, corta la barra a una altura cualquiera y mira qué
        sostiene esa sección.
    enunciado: |
      Una barra de sección constante solo sufre su peso propio. Calcula el
      diagrama de fuerzas normales, variación de longitudes y variación de
      volumentes. Datos: Q,L,A,E,v

      <figure class="figura-examen">
      <svg viewBox="56 14 150 192" role="img" width="150" height="192" aria-labelledby="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-t ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-d">
      <title id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-t">Una barra de sección constante colgada del techo</title>
      <desc id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-d">Un techo rayado del que cuelga una barra recta vertical de sección constante. A su izquierda, una cota vertical L de arriba abajo, toda la longitud de la barra.</desc>
      <defs><pattern id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="66" y="22" width="130" height="12" fill="url(#ejerm8-cla2-la-barra-que-cuelga-con-su-peso-r)"/><line x1="66" y1="34" x2="196" y2="34" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="110" y="34" width="30" height="160" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="88" y1="36" x2="88" y2="194" stroke="var(--faint)" stroke-width="0.9"/><polygon points="88,194 85.6,188 90.4,188" fill="var(--faint)"/><polygon points="88,36 90.4,42 85.6,42" fill="var(--faint)"/>
      <text x="78" y="118" font-size="12" fill="var(--ink)" font-style="italic" text-anchor="end">L</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la barra cuelga del techo por su extremo de
      arriba, y el de abajo está libre.

      </figcaption>
      </figure>

      **Notas nuestras.** $Q$ es el peso de toda la barra y la «v» de los
      datos, el coeficiente de Poisson $\nu$. Los axiles van en unidades de
      $Q$, el alargamiento y los descensos en unidades de $QL/(EA)$ y la
      variación de volumen en unidades de $QL/E$. Para el volumen hace falta
      un número: aquí $\nu = 0{,}3$, un ejemplo nuestro.
    pide: >-
      El axil a un cuarto de la longitud por debajo del techo, en unidades de
      Q; el alargamiento de la barra y el descenso de su punto medio, en
      unidades de QL/(EA), y la variación de volumen con ν = 0,3, en unidades
      de QL/E.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es el diagrama de fuerzas normales a lo largo de la barra?
        opciones:
          - texto: Una recta, de $Q$ junto al techo a cero en el extremo libre
            correcta: true
            mensaje: |
              Eso es. Cada sección sostiene el peso de lo que cuelga por
              debajo de ella. Con la sección constante, ese peso crece en
              proporción a la longitud que cuelga: cero en el extremo libre y
              la barra entera, $Q$, junto al techo.
          - texto: Constante, $Q$ en toda la barra
            mensaje: |
              Eso sería con la barra sin peso y $Q$ colgado del extremo. Con el
              peso propio, una sección cerca del extremo libre solo sostiene el
              trocito que tiene debajo.
          - texto: Una recta, de cero junto al techo a $Q$ en el extremo libre
            mensaje: |
              Está al revés. La sección del techo sostiene la barra entera; la
              del extremo libre no sostiene nada.
          - texto: Una parábola, porque cada trozo baja lo que se alargan los de encima
            mensaje: |
              Lo que va sumándose así es el descenso de cada sección, y ese sí
              es una parábola. El axil es el peso de lo de debajo, y con la
              sección constante crece en proporción a su longitud: una recta.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el trozo de barra que cuelga por
          debajo de una sección cualquiera**.
        comprueba:
          - punto: |
              **$N$ hacia arriba, en el corte.**
            porque: |
              Es lo que la parte de arriba hace sobre el trozo; se supone a
              tracción.
          - punto: |
              **El peso del trozo, $Qx/L$, en su centro.**
            porque: |
              Con la sección constante, el peso es proporcional a la longitud.
          - punto: |
              **El extremo libre, sin nada.**
            porque: |
              Abajo no hay apoyo ni carga: solo cuelga.
        figura: |
          <svg viewBox="0 0 220 190" role="img" width="220" height="190" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El trozo de barra que cuelga por debajo de una sección</title>
            <desc id="dsl-d">Un rectángulo vertical, el trozo de la barra que va del extremo libre, abajo, a una sección a la altura x, arriba. A trazos, el resto de la barra hasta el techo. En el corte, N hacia arriba. En el centro del trozo, su peso, Q por x partido por L, a trazos, hacia abajo. A la derecha, la cota x y la flecha del eje x, hacia arriba.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M100 60 H120 V180 H100 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M100 60 V8 M120 60 V8" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M190 180 v-36" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
            <path d="M160 60 V180 M156 60 H164 M156 180 H164" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
            <text x="166" y="124" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
            <line x1="110" y1="56" x2="110" y2="22" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="125" y="30" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
            <line x1="110" y1="102" x2="110" y2="140" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
            <text x="126" y="136" font-size="10" text-anchor="start" fill="var(--flag)">Qx/L</text>
            <text x="196" y="152" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
          </svg>

      - tipo: calcular
        titulo: El axil a un cuarto del techo
        pregunta: |
          A una distancia $L/4$ por debajo del techo, ¿cuánto vale $N$, en
          unidades de $Q$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.002
          formato: un número, N dividido entre Q
        distractores:
          - valor: '0.25'
            mensaje: |
              Es el axil a $L/4$ del extremo libre: has medido desde el lado
              equivocado. Por debajo de esa sección cuelgan tres cuartos de la
              barra.
          - valor: '1'
            mensaje: |
              Es el axil junto al techo, que sostiene la barra entera. A $L/4$
              del techo el cuarto de arriba ya queda por encima de la sección.
        pista: |
          Por debajo de la sección cuelgan $3L/4$ de barra, y $N$ es su peso.
        desarrollo: |
          $$
          N = Q\,\frac{3L/4}{L} = 0{,}75\,Q
          $$

      - tipo: calcular
        titulo: El alargamiento de la barra
        pregunta: |
          ¿Cuánto se alarga la barra, en unidades de $QL/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre QL/(EA)
        distractores:
          - valor: '1'
            mensaje: |
              Es $QL/(EA)$, el alargamiento con todo el peso colgado del
              extremo. El axil baja hasta cero en el extremo libre, y cada
              trozo se alarga según el peso que tiene debajo.
        pista: |
          Con $N$ variable hay que integrar: la ec. 8.8 sin $\varepsilon_0$,
          $\Delta L = \int_0^L N/(EA)\,dx$, con $N = Qx/L$ y $x$ medida desde
          el extremo libre.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{Q\,x}{L\,EA}\,dx = \frac{QL}{2EA} = 0{,}5\,\frac{QL}{EA}
          $$

      - tipo: calcular
        titulo: El descenso del punto medio
        pregunta: |
          ¿Cuánto baja el punto medio de la barra, en unidades de $QL/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número, el descenso dividido entre QL/(EA)
        distractores:
          - valor: '0.25'
            mensaje: |
              Es la mitad del alargamiento total, como si la barra se estirara
              igual en toda su longitud. La mitad de arriba lleva más axil que
              la de abajo y se alarga más.
          - valor: '0.125'
            mensaje: |
              Es lo que se alarga la mitad de abajo. El punto medio baja lo que
              se alarga la mitad de arriba, la que está entre él y el techo.
        pista: |
          El punto medio baja lo que se alarga el trozo entre él y el techo:
          $x$ de $L/2$ a $L$, medida desde el extremo libre.
        desarrollo: |
          $$
          \delta_{L/2} = \int_{L/2}^{L} \frac{Q\,x}{L\,EA}\,dx
          = \frac{Q}{2L\,EA}\left(L^{2} - \frac{L^{2}}{4}\right)
          = \frac{3}{8}\,\frac{QL}{EA} = 0{,}375\,\frac{QL}{EA}
          $$

      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          Con $\nu = 0{,}3$, ¿cuánto cambia el volumen de la barra, en
          unidades de $QL/E$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.002
          formato: un número con signo, ΔV dividido entre QL/E
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $A\,\Delta L$: has contado el alargamiento y no el
              estrechamiento. Con $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$
              la sección también cambia (apuntes del tema 4, ec. 4.1).
          - valor: '0.8'
            mensaje: |
              Has sumado las deformaciones laterales con el signo cambiado. A
              tracción la barra se estrecha: $e = (1 - 2\nu)\,\varepsilon_x$,
              no $(1 + 2\nu)\,\varepsilon_x$.
          - valor: '0.4'
            mensaje: |
              Es $(1 - 2\nu)\,QL/E$, con $N = Q$ en toda la barra. El axil baja
              de $Q$ a cero, y la integral se queda en la mitad.
          - valor: '0'
            mensaje: |
              Sería con $\nu = 0{,}5$, un material que no cambia de volumen.
              Con $\nu = 0{,}3$ la sección se estrecha menos de lo que haría
              falta para compensar el alargamiento, y el volumen crece.
        pista: |
          La deformación volumétrica es
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = (1 - 2\nu)\,\varepsilon_x$,
          y $\Delta V = \int_V e\,dV = A\int_0^L e\,dx$.
        desarrollo: |
          $$
          \Delta V = A\int_0^L (1 - 2\nu)\,\frac{N}{EA}\,dx
          = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,\frac{QL}{2E}
          $$

          $$
          (1 - 0{,}6) \cdot 0{,}5 = 0{,}2
          \qquad
          \Delta V = 0{,}2\,\frac{QL}{E}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A una distancia $x$ del extremo libre, la sección sostiene el
              trozo de debajo: $N = Qx/L$.
          - texto: >-
              Como $N$ cambia, el alargamiento es la integral de $N/(EA)$:
              $\Delta L = QL/(2EA)$.
          - texto: >-
              Cada sección baja lo que se alarga el trozo entre ella y el
              techo: el punto medio, $3QL/(8EA)$.
          - texto: >-
              Cada rebanada se alarga $\varepsilon_x$ y se estrecha
              $\nu\varepsilon_x$ en cada dirección de la sección:
              $e = (1 - 2\nu)\,\varepsilon_x$.
          - texto: >-
              Sumando sobre la barra,
              $\Delta V = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,QL/(2E)$.
          - texto: >-
              El volumen no cambia: lo que la barra gana en longitud lo pierde
              en sección.
            trampa: true
            mensaje: |
              Solo con $\nu = 0{,}5$. Con $\nu = 0{,}3$,
              $e = 0{,}4\,\varepsilon_x$: la sección se estrecha menos de lo
              que haría falta, y el volumen crece.
    resolucion: |
      **1. El sólido libre.** El trozo de barra que cuelga por debajo de una
      sección cualquiera. Se mide $x$ desde el extremo libre hacia arriba.

      <figure class="figura-examen">
      <svg viewBox="0 0 220 190" role="img" width="330" height="285" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El trozo de barra que cuelga por debajo de una sección</title>
        <desc id="dsl-d">Un rectángulo vertical, el trozo de la barra que va del extremo libre, abajo, a una sección a la altura x, arriba. A trazos, el resto de la barra hasta el techo. En el corte, N hacia arriba. En el centro del trozo, su peso, Q por x partido por L, a trazos, hacia abajo. A la derecha, la cota x y la flecha del eje x, hacia arriba.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M100 60 H120 V180 H100 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M100 60 V8 M120 60 V8" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <path d="M190 180 v-36" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
        <path d="M160 60 V180 M156 60 H164 M156 180 H164" fill="none" stroke="var(--faint)" stroke-width="0.8"/>
        <text x="166" y="124" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
        <line x1="110" y1="56" x2="110" y2="22" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="125" y="30" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N</text>
        <line x1="110" y1="102" x2="110" y2="140" stroke="var(--flag)" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#dsl-fc)"/>
        <text x="126" y="136" font-size="10" text-anchor="start" fill="var(--flag)">Qx/L</text>
        <text x="196" y="152" font-size="9" text-anchor="start" fill="var(--faint)">x</text>
      </svg>
      <figcaption>

      El trozo de longitud x que cuelga por debajo del corte: N, supuesto a tracción, lo sostiene, y su peso, Qx/L, es la resultante de lo que pesa cada rebanada. El extremo libre no tiene nada.

      </figcaption>
      </figure>

      - **La sección a la altura $x$** sostiene el trozo que cuelga por
        debajo, de longitud $x$.
      - **Su peso es la fracción $x/L$ de $Q$**, porque la sección es
        constante.
      - **Cada rebanada está a tracción simple**, con $\sigma_x = N/A$.

      **2. Incógnitas.** El axil $N(x)$; el alargamiento de la barra y el
      descenso de su punto medio; y la variación de volumen.

      **3. Ecuaciones.** El equilibrio del trozo:

      $$
      N(x) = Q\,\frac{x}{L}
      $$

      $N$ cambia a lo largo de la barra, así que el alargamiento es la
      integral de la ec. 8.8, sin término térmico. Cada sección baja lo que se
      alarga el trozo entre ella y el techo:

      $$
      \Delta L = \int_0^L \frac{N}{EA}\,dx
      \qquad
      \delta(x_0) = \int_{x_0}^{L} \frac{N}{EA}\,dx
      $$

      Para el volumen, cada rebanada se alarga $\varepsilon_x = \sigma_x/E$ y
      se estrecha $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$ (apuntes del
      tema 4, ec. 4.1, p. 4). Su deformación volumétrica (tema 3, ec. 3.59,
      p. 18) y la variación de volumen de toda la barra (ec. 3.60) son

      $$
      e = \varepsilon_x + \varepsilon_y + \varepsilon_z = (1 - 2\nu)\,\frac{\sigma_x}{E}
      \qquad
      \Delta V = \int_V e\,dV
      $$

      **4. Resultados.** **El diagrama de fuerzas normales** es una recta:
      cero en el extremo libre y $Q$ junto al techo, donde la reacción vale el
      peso entero. Toda la barra está a tracción. A $L/4$ por debajo del
      techo, $x = 3L/4$ y $N = 0{,}75\,Q$.

      **El alargamiento y el descenso del punto medio.**

      $$
      \Delta L = \int_0^L \frac{Q\,x}{L\,EA}\,dx = \frac{QL}{2EA}
      \qquad
      \delta_{L/2} = \int_{L/2}^{L} \frac{Q\,x}{L\,EA}\,dx = \frac{3QL}{8EA} = 0{,}375\,\frac{QL}{EA}
      $$

      **La variación de volumen**, con $dV = A\,dx$:

      $$
      \Delta V = (1 - 2\nu)\int_0^L \frac{N}{EA}\,A\,dx
      = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,\frac{QL}{2E}
      $$

      Con $\nu = 0{,}3$, $\Delta V = 0{,}4 \cdot 0{,}5\,QL/E = 0{,}2\,QL/E$.

      **5. Comprobación.** El motor resuelve la barra de dos formas que no
      comparten nada: la integral de la ec. 8.8, y la barra partida en 400
      tramos con el peso de cada uno repartido en sus nudos, como una barra
      con cargas puntuales. Las dos dan $0{,}5\,QL/(EA)$ de alargamiento,
      $0{,}375\,QL/(EA)$ de descenso del punto medio y $Q$ de reacción en el
      techo. Para el volumen, cada rebanada deformada mide de verdad
      $(1 + \varepsilon_x)(1 - \nu\varepsilon_x)^{2}$ veces lo que medía;
      sumando lo que crece cada una sale el mismo $0{,}2\,QL/E$, salvo
      términos de segundo orden.

      **Lo que dice el resultado.** La barra se alarga la mitad de lo que se
      alargaría con $Q$ colgado del extremo; con $Q = \rho g A L$ es la
      fórmula de la teoría, $\rho g L^{2}/(2E)$. Tres cuartas partes del
      alargamiento están en la mitad de arriba, la que más carga. Y el volumen
      crece mientras $\nu < 0{,}5$: la sección se estrecha, pero no tanto como
      para compensar lo que la barra gana en longitud.

  # ── Propuesta A3 de clase · la celosía rígida sujeta por dos barras.
  - id: ejerm8-cla3-la-celosia-rigida-y-las-dos-barras
    titulo: La celosía articulada en A, sujeta desde D por dos barras
    fuente: >-
      Propuesta A3 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (los momentos en A con el giro como
      incógnita, y la reacción de A por los momentos en D). La figura no
      numera las barras ni da el canto de la celosía ni dónde se une la barra
      2: la nota dice cómo se leen. La figura está redibujada con las cotas
      del original.
    nivel: practica
    antes:
      idea: |
        La celosía se toma como un sólido rígido articulado en A, y las dos
        barras la sujetan desde el mismo punto de la pared. Hay que contar
        incógnitas antes de buscar ecuaciones.
      formula: |
        $$
        \Delta L = \vec u\cdot\vec e
        $$

        Lo que se alarga una barra con un extremo fijo: el desplazamiento del
        otro extremo, proyectado sobre la dirección de la barra contada desde
        su apoyo (ec. 8.12).
      reconocer: |
        Antes de las cuentas, cuenta las incógnitas de la celosía y las
        ecuaciones de equilibrio que tienes para ellas.
    enunciado: |
      Calcula las fuerzas de las barras (1) y (2). Los materiales y las
      secciones de las dos barras son iguales.

