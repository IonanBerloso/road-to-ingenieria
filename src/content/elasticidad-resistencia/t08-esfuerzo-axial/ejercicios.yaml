      <line x1="171" y1="204" x2="212" y2="204" stroke="var(--faint)" stroke-width="0.8" stroke-dasharray="3 3"/>
      <line x1="206" y1="92" x2="206" y2="204" stroke="var(--faint)" stroke-width="0.9"/>
      <polygon points="206,204 203.6,198 208.4,198" fill="var(--faint)"/>
      <polygon points="206,92 208.4,98 203.6,98" fill="var(--faint)"/>
      <text x="212" y="153" font-size="12" fill="var(--ink)" text-anchor="start"><tspan>2 m</tspan></text>
      </svg>
      <figcaption>
      
      Las longitudes están a escala; el grueso de las barras, no.
      
      </figcaption>
      </figure>
    pide: >-
      El axil de la barra 2, en kN, la tensión de la barra 1, en MPa, y lo
      que baja el pasador, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos barras son del mismo acero y tienen la misma sección. Antes
          de calcular, ¿cómo se reparten el peso?
        opciones:
          - texto: 'Hace falta una ecuación más: las dos bajan con el mismo pasador y se alargan lo mismo, así que cada una lleva según su rigidez $EA/L$'
            correcta: true
            mensaje: |
              Eso es. Hay dos incógnitas, $N_1$ y $N_2$, y el equilibrio del
              pasador da una sola ecuación: es hiperestático de grado uno
              (apuntes del tema 8, p. 4). La que falta es de compatibilidad: el
              pasador baja una distancia $\delta$ y las dos barras se alargan
              eso. Con la misma $E$ y la misma $A$, la que tiene la rigidez
              $EA/L$ mayor es la más corta.
          - texto: 'A partes iguales, la mitad cada una: son del mismo acero y de la misma sección'
            mensaje: |
              Así sería si además midieran lo mismo. Lo que comparten es el
              alargamiento, y para alargarse lo mismo la corta necesita más
              fuerza que la larga: $\Delta L = NL/(EA)$ crece con $L$.
          - texto: 'Con la misma tensión en las dos: se alargan lo mismo, así que se deforman lo mismo'
            mensaje: |
              Alargarse lo mismo no es deformarse lo mismo:
              $\varepsilon = \delta/L$, y con el mismo $\delta$ la más corta se
              deforma más. Con la misma $E$, también tiene más tensión.
          - texto: 'La larga lleva más, porque tiene más acero que estirar'
            mensaje: |
              Es al revés. La barra larga es más flexible: para el mismo
              alargamiento le basta menos fuerza. Su rigidez, $EA/L$, es la
              menor de las dos.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el pasador con las dos barras
          cortadas**.
        comprueba:
          - punto: |
              **Las dos barras cortadas, tirando del pasador hacia arriba.**
            porque: |
              Se suponen a tracción, cada una con su axil.
          - punto: |
              **$W$ hacia abajo, en el pasador.**
            porque: |
              Es la carga que cuelga del pasador, el dato.
          - punto: |
              **Dos incógnitas y una ecuación.**
            porque: |
              Las dos fuerzas son verticales: solo cuenta el equilibrio
              vertical.
        figura: |
          <svg viewBox="0 30 220 140" role="img" width="220" height="140" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El pasador con las dos barras cortadas</title>
            <desc id="dsl-d">El pasador, un círculo, con los trozos cortados de las dos barras, que suben verticales una al lado de la otra: la 1 a la izquierda y la 2 a la derecha. De cada trozo, una fuerza hacia arriba, N 1 y N 2. Del pasador, W hacia abajo.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M96 110 A14 14 0 1 1 124 110 A14 14 0 1 1 96 110 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="100" y1="100" x2="100" y2="74" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <line x1="120" y1="100" x2="120" y2="74" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
            <line x1="100" y1="70" x2="100" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="92" y="50" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">1</tspan></text>
            <line x1="120" y1="70" x2="120" y2="40" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="128" y="50" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">2</tspan></text>
            <line x1="110" y1="128" x2="110" y2="162" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="116" y="158" font-size="10" text-anchor="start" fill="var(--flag)">W</text>
            <text x="94" y="92" font-size="9" text-anchor="end" fill="var(--faint)">1</text>
            <text x="126" y="92" font-size="9" text-anchor="start" fill="var(--faint)">2</text>
          </svg>

      - tipo: calcular
        titulo: El axil de la barra 2
        pregunta: |
          ¿Qué axil lleva la barra 2, la corta, en kN?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '5'
            mensaje: |
              Es la mitad del peso. Sale de usar solo el equilibrio, y también
              de suponer la misma tensión en las dos: con la misma sección son
              el mismo error. Las dos se alargan lo mismo, y la corta, más
              rígida, lleva más.
          - valor: '4'
            mensaje: |
              Ese es el axil de la barra 1, la larga, y también el que sale
              repartiendo el peso en proporción a la longitud. La rigidez va
              con $1/L$: la barra 2, más corta, lleva la parte mayor.
        pista: |
          Con el mismo alargamiento, $N_1 L_1/(EA) = N_2 L_2/(EA)$, así que
          $N_1 L_1 = N_2 L_2$. Y $N_1 + N_2 = W$.
        desarrollo: |
          $$
          N_1 \cdot 3 = N_2 \cdot 2 \quad\Longrightarrow\quad N_1 = \frac{2}{3}\,N_2
          $$

          Con $N_1 + N_2 = 10$ kN, $\tfrac{5}{3}\,N_2 = 10$ kN: $N_2 = 6$ kN,
          y $N_1 = 4$ kN.

      - tipo: calcular
        titulo: La tensión de la barra 1
        pregunta: |
          ¿Qué tensión tiene la barra 1, la larga, en MPa?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '100'
            mensaje: |
              Es $5000/50$: la mitad del peso en cada barra, que es también la
              misma tensión en las dos. La barra 1 lleva 4 kN, no 5.
          - valor: '120'
            mensaje: |
              Esa es la tensión de la barra 2, la corta: $6000/50$. Y es
              también la que sale repartiendo el peso en proporción a la
              longitud, que le da a la larga 6 kN. La barra 1, la larga, es la
              menos rígida y lleva 4 kN.
        pista: |
          $\sigma_1 = N_1/A$, con $N_1$ en N y $A$ en mm².
        desarrollo: |
          $$
          \sigma_1 = \frac{N_1}{A} = \frac{4000}{50} = 80\ \text{MPa}
          \qquad
          \sigma_2 = \frac{6000}{50} = 120\ \text{MPa}
          $$

      - tipo: calcular
        titulo: Lo que baja el pasador
        pregunta: |
          ¿Cuánto baja el pasador, en mm?
        respuesta:
          tipo: numero
          valor: '1.2'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '1200'
            mensaje: |
              Has puesto $E = 200$, en GPa, sin pasarlo a MPa. Con las
              fuerzas en N y las longitudes en mm, $E = 2 \cdot 10^{5}$ MPa.
          - valor: '0.0012'
            mensaje: |
              Has puesto $L_1$ en metros. Con $E$ en MPa y $A$ en mm², la
              longitud va en mm, 3000, y el alargamiento sale en mm.
          - valor: '1.5'
            mensaje: |
              Es el alargamiento de la barra larga con la mitad del peso,
              $5000 \cdot 3000/(2 \cdot 10^{5} \cdot 50)$. Con su axil de
              verdad, 4 kN, sale lo mismo que por la corta.
          - valor: '1'
            mensaje: |
              Es el alargamiento de la barra corta con la mitad del peso,
              $5000 \cdot 2000/(2 \cdot 10^{5} \cdot 50)$. Con su axil de
              verdad, 6 kN, sale lo mismo que por la larga.
          - valor: '2.4'
            mensaje: |
              Has sumado los alargamientos de las dos barras, como si
              estuvieran una detrás de la otra. Están una al lado de la otra,
              cada una de su soporte al mismo pasador: el pasador baja lo que
              se alarga cada una, no la suma.
        pista: |
          El pasador baja lo que se alarga cualquiera de las dos:
          $\delta = N_1 L_1/(EA)$.
        desarrollo: |
          $$
          \delta = \frac{N_1 L_1}{E A} = \frac{4000 \cdot 3000}{2 \cdot 10^{5} \cdot 50} = 1{,}2\ \text{mm}
          $$

          Y por la barra 2, lo mismo:
          $6000 \cdot 2000/(2 \cdot 10^{5} \cdot 50) = 1{,}2$ mm.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Dos incógnitas, $N_1$ y $N_2$, y una ecuación de equilibrio, $N_1 + N_2 = W$: hiperestático de grado uno.'
          - texto: 'Las dos bajan con el mismo pasador, así que se alargan lo mismo: $N_1 L_1/(EA) = N_2 L_2/(EA)$.'
          - texto: 'Con la misma $E$ y la misma $A$, $N_1 L_1 = N_2 L_2$: $N_2 = 6$ kN y $N_1 = 4$ kN.'
          - texto: 'La barra 1 está a 80 MPa y la 2 a 120 MPa, y el pasador baja 1,2 mm.'
          - texto: 'Se alargan lo mismo, así que se deforman lo mismo y tienen la misma tensión: $W/(2A) = 100$ MPa.'
            trampa: true
            mensaje: |
              Con distinta longitud, el mismo alargamiento es distinta
              deformación: $\varepsilon = \delta/L$ vale $4 \cdot 10^{-4}$ en la
              larga y $6 \cdot 10^{-4}$ en la corta. La corta, más deformada,
              tiene más tensión.
    resolucion: |
      **1. El sólido libre.** El pasador, con las dos barras cortadas.

      <figure class="figura-examen">
      <svg viewBox="0 30 220 140" role="img" width="330" height="210" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El pasador con las dos barras cortadas</title>
        <desc id="dsl-d">El pasador, un círculo, con los trozos cortados de las dos barras, que suben verticales una al lado de la otra: la 1 a la izquierda y la 2 a la derecha. De cada trozo, una fuerza hacia arriba, N 1 y N 2. Del pasador, W hacia abajo.</desc>
