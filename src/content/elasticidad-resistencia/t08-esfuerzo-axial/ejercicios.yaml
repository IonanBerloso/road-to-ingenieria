        <text x="28" y="100" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">1</tspan></text>
        <line x1="85.6" y1="89" x2="108" y2="102" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="112" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">2</tspan></text>
        <line x1="70" y1="98" x2="70" y2="128" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="76" y="126" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">3</tspan></text>
        <line x1="188" y1="59.2" x2="175" y2="36.7" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="171" y="36" font-size="10" text-anchor="end" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">4</tspan></text>
        <line x1="212" y1="59.2" x2="225" y2="36.7" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="229" y="36" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">5</tspan></text>
        <line x1="200" y1="56" x2="200" y2="28" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="206" y="22" font-size="10" text-anchor="start" fill="var(--d2-tinta)">N<tspan font-size="7.5" dy="2.5">3</tspan></text>
        <line x1="200" y1="84" x2="200" y2="116" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="206" y="112" font-size="10" text-anchor="start" fill="var(--flag)">P</text>
        <circle cx="70" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="70" y="70" font-size="10" text-anchor="middle" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="200" cy="80" r="2.4" fill="var(--ink)"/>
        <text x="190" y="96" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">D</text>
      </svg>
      <figcaption>

      Los nudos B y D: las cinco barras, cortadas y supuestas a tracción, tiran de cada nudo hacia su otro extremo, y P cuelga de D. La barra 3 aparece en los dos nudos, con el mismo axil.

      </figcaption>
      </figure>

      - **Las cinco barras se suponen a tracción**, tirando de cada nudo hacia
        su otro extremo.
      - **A y C son fijos**: los nudos que se mueven son B y D, con cuatro
        ecuaciones para cinco axiles. Es hiperestática de grado uno (apuntes
        del tema 8, p. 4).
      - **La figura y la carga son simétricas respecto de BD**: B y D solo
        bajan, $N_1 = N_2$ y $N_4 = N_5$, y las dos ecuaciones horizontales se
        cumplen solas.

      **2. Incógnitas.** $N_1$, $N_3$ y $N_4$, con la simetría; y lo que bajan
      B y D, $\delta_B$ y $\delta_D$.

      **3. Ecuaciones.** Las longitudes:

      $$
      L_1 = L_2 = \frac{a}{\cos 30^{\circ}} = \frac{2a}{\sqrt{3}}
      \qquad
      L_3 = a\left(\tan 30^{\circ} + \tan 60^{\circ}\right) = \frac{4a}{\sqrt{3}}
      \qquad
      L_4 = L_5 = \frac{a}{\cos 60^{\circ}} = 2a
      $$

      El equilibrio vertical de los dos nudos:

      $$
      \text{B:}\quad 2N_1\operatorname{sen}30^{\circ} + N_3 = 0
      \qquad
      \text{D:}\quad 2N_4\operatorname{sen}60^{\circ} + N_3 = P
      $$

      Tres axiles y dos ecuaciones: la que falta es de compatibilidad. Cada
      barra se alarga lo que su extremo avanza en su dirección (ec. 8.12). La
      1 va de A a B, hacia $(\cos 30^{\circ}, \operatorname{sen} 30^{\circ})$:
      si B baja, se acorta $\delta_B/2$. La 4 va de A a D, hacia
      $(\cos 60^{\circ}, -\operatorname{sen} 60^{\circ})$: se alarga
      $\tfrac{\sqrt{3}}{2}\delta_D$. La 3 es vertical y se alarga lo que D
      baja más que B:

      $$
      \Delta L_1 = -\frac{\delta_B}{2}
      \qquad
      \Delta L_4 = \frac{\sqrt{3}}{2}\,\delta_D
      \qquad
      \Delta L_3 = \delta_D - \delta_B = \frac{2}{\sqrt{3}}\,\Delta L_4 + 2\,\Delta L_1
      $$

      Y la ley de cada barra (ec. 8.9), $\Delta L_i = N_iL_i/(EA)$.

      **4. Resultados.** Con las longitudes de arriba, la compatibilidad
      queda

      $$
      N_3\,\frac{4a}{\sqrt{3}} = \frac{2}{\sqrt{3}}\,N_4\,2a + 2N_1\,\frac{2a}{\sqrt{3}}
      \;\Longrightarrow\;
      N_3 = N_4 + N_1
      $$

      **Las fuerzas.** De B, $N_1 = -N_3$; en la compatibilidad,
      $N_4 = 2N_3$; en D, $\sqrt{3}\cdot 2N_3 + N_3 = P$:

      $$
      N_3 = \frac{P}{2\sqrt{3} + 1} = \frac{2\sqrt{3} - 1}{11}\,P = 0{,}2240\,P
      $$

      $$
      N_4 = N_5 = 2N_3 = 0{,}4480\,P
      \qquad
      N_1 = N_2 = -N_3 = -0{,}2240\,P
      $$

      La 3, la 4 y la 5 tiran; la 1 y la 2 empujan.

      **5. Comprobación.** Con las fuerzas, lo que baja cada nudo, en
      unidades de $Pa/(EA)$: B baja $\delta_B = -2\,\Delta L_1$, que da
      $2 \cdot 0{,}2240 \cdot 1{,}1547 = 0{,}5173$, y D baja
      $\delta_D = \tfrac{2}{\sqrt{3}}\,\Delta L_4$, que da
      $1{,}1547 \cdot 0{,}4480 \cdot 2 = 1{,}0346$. La 3 se alarga la
      diferencia, $1{,}0346 - 0{,}5173 = 0{,}5173$, que es lo que da su axil,
      $0{,}2240 \cdot 2{,}3094 = 0{,}5173$. Y el equilibrio global: cada apoyo
      recibe en vertical
      $N_4\operatorname{sen}60^{\circ} - N_1\operatorname{sen}30^{\circ} = 0{,}3880 + 0{,}1120 = 0{,}5$,
      en unidades de $P$, y los dos juntos sostienen $P$.

      **Lo que dice el resultado.** La 3 no lleva carga directa, pero
      trabaja: D baja el doble que B, así que la 3 se estira, tira de B hacia
      abajo, y la 1 y la 2 lo sostienen comprimidas.

  # ── Propuesta A7 de clase · la columna de igual resistencia.
  - id: ejerm8-cla7-la-columna-de-igual-resistencia
    titulo: La columna con su peso y la carga P, a la misma tensión en todas sus secciones
    fuente: >-
      Propuesta A7 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la columna partida en 4000 tramos, con el peso de cada uno en sus
      nudos) y comprobada por un segundo camino (la fórmula cerrada y el
      equilibrio de la columna entera). Se conserva la errata del original,
      «secciónes» con tilde. El enunciado no da números: los pasos con
      cifras usan un ejemplo nuestro, que dice la nota. La figura está
      redibujada.
    nivel: practica
    antes:
      idea: |
        La condición no es sobre una sección sino sobre todas: se escribe para
        una rebanada cualquiera, y lo que sale es una ecuación diferencial para
        el área.
      formula: |
        $$
        \sigma_x = \frac{N}{A}
        $$

        La tensión de una sección a tracción o compresión simple (ec. 8.5,
        p. 6).
      reconocer: |
        Antes de las cuentas, escribe el equilibrio de una rebanada de la
        columna con la condición de que sus dos caras estén a la misma tensión.
    enunciado: |
      La columna con el peso específico $\gamma$ sufre su peso propio y la
      carga $P$. Calcula la ecuación del cambio de sección para que la
      tensión que sufren todas las secciónes sea la misma.

