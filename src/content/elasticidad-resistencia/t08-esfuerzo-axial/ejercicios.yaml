            <circle cx="70" cy="30.7" r="2.4" fill="var(--ink)"/>
            <text x="80" y="30" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">A</text>
            <text x="200" y="120" font-size="9" text-anchor="start" fill="var(--faint)">k</text>
          </svg>

      - tipo: calcular
        titulo: El movimiento de D
        pregunta: |
          ¿Cuánto se mueve D en vertical, positivo hacia abajo, en unidades
          de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '1.0718'
          tolerancia: 0.002
          formato: un número con signo, vD dividido entre PL/(EA)
        distractores:
          - valor: '1.4641'
            mensaje: |
              Es lo que bajaría D sin el resorte, con las dos barras solas.
              El resorte también se acorta cuando D baja, empuja hacia
              arriba y se lleva parte de la carga.
          - valor: '0.8'
            mensaje: |
              Has tomado los alargamientos sin proyectar,
              $\Delta L_1 = v$ y $\Delta L_2 = -v$, o la barra 2 de longitud
              $L$ con la proyección: los dos errores dan este mismo número.
              Cada barra se alarga lo que D avanza en su dirección, y la 2
              mide $\sqrt{3}\,L$.
          - valor: '0.8739'
            mensaje: |
              Has cambiado los ángulos. La 1 forma 30° con la horizontal y la
              2, 30° con la vertical: la parte vertical va con el seno en la
              1 y con el coseno en la 2, al proyectar y al sumar fuerzas.
          - valor: '2.3094'
            mensaje: |
              Has hecho tirar al resorte de D hacia abajo. Está por debajo:
              cuando D baja, se acorta y empuja hacia arriba.
        pista: |
          Momentos en B: las dos barras, el resorte y $P$ actúan en D, a la
          misma distancia de B, así que basta con que sus componentes
          verticales sumen cero:
          $N_1\operatorname{sen} 30^{\circ} - N_2\cos 30^{\circ} - F = P$,
          con $F$ la fuerza del resorte, positiva si tira. Escribe cada
          fuerza con $v$.
        desarrollo: |
          $$
          N_1 = \frac{EA}{L}\,\frac{v}{2}
          \qquad
          N_2 = \frac{EA}{\sqrt{3}\,L}\left(-\frac{\sqrt{3}}{2}\,v\right) = -\frac{EA}{L}\,\frac{v}{2}
          \qquad
          F = -\frac{EA}{4L}\,v
          $$

          $$
          \frac{EA}{L}\,v\left(\frac{1}{4} + \frac{\sqrt{3}}{4} + \frac{1}{4}\right) = P
          \;\Longrightarrow\;
          v = \frac{4}{2 + \sqrt{3}}\,\frac{PL}{EA} = 4\left(2 - \sqrt{3}\right)\frac{PL}{EA} = 1{,}0718\,\frac{PL}{EA}
          $$

      - tipo: calcular
        titulo: La barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.5359'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '0.7321'
            mensaje: |
              Es el axil de la 1 sin el resorte. El resorte se acorta cuando
              D baja, empuja hacia arriba y descarga a las dos barras.
          - valor: '0.8'
            mensaje: |
              Has tomado $\Delta L_1 = v$ y $\Delta L_2 = -v$, sin proyectar.
              La 1 se alarga $v\operatorname{sen} 30^{\circ}$, solo la parte
              de lo que baja D que va en su dirección.
          - valor: '0.4'
            mensaje: |
              Has tomado la barra 2 de longitud $L$. Mide $\sqrt{3}\,L$, y con
              su longitud de verdad es más blanda y se lleva menos.
        pista: |
          $N_1 = \dfrac{EA}{L}\,\Delta L_1 = \dfrac{EA}{L}\,\dfrac{v}{2}$,
          con la $v$ del paso anterior.
        desarrollo: |
          $$
          N_1 = \frac{EA}{L}\,\frac{v}{2} = 2\left(2 - \sqrt{3}\right)P = 0{,}5359\,P
          $$

      - tipo: calcular
        titulo: La barra 2
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.5359'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '0.5359'
            mensaje: |
              El valor es ese, pero el signo no. D baja y se acerca a C: la 2
              se acorta y está comprimida.
          - valor: '-0.9282'
            mensaje: |
              Has dividido el acortamiento de la 2 entre $L$, y la 2 mide
              $\sqrt{3}\,L$: $N_2 = EA\,\Delta L_2/(\sqrt{3}\,L)$.
          - valor: '-0.7321'
            mensaje: |
              Es el axil de la 2 sin el resorte. El resorte se acorta cuando
              D baja, empuja hacia arriba y descarga a las dos barras.
          - valor: '-0.4619'
            mensaje: |
              Has tomado $\Delta L_1 = v$ y $\Delta L_2 = -v$, sin proyectar.
              La 2 se acorta $v\cos 30^{\circ}$, solo la parte de lo que baja
              D que va en su dirección.
          - valor: '-0.6928'
            mensaje: |
              Has tomado la barra 2 de longitud $L$, al buscar $v$ y al
              calcular su axil. Mide $\sqrt{3}\,L$.
        pista: |
          $N_2 = \dfrac{EA}{\sqrt{3}\,L}\,\Delta L_2$, con
          $\Delta L_2 = -v\cos 30^{\circ}$.
        desarrollo: |
          $$
          N_2 = -\frac{EA}{L}\,\frac{v}{2} = -2\left(2 - \sqrt{3}\right)P = -0{,}5359\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              BD da tres ecuaciones de equilibrio para cinco incógnitas,
              $N_1$, $N_2$, la fuerza del resorte y las dos reacciones de B:
              es hiperestático de grado dos.
          - texto: >-
              BD solo puede girar alrededor de B, así que el movimiento de
              todo se escribe con una incógnita, lo que baja D, $v$.
          - texto: >-
              La 1 se alarga $v\operatorname{sen} 30^{\circ}$, la 2 se acorta
              $v\cos 30^{\circ}$ y el resorte se acorta $v$.
          - texto: >-
              Con cada fuerza escrita con $v$, los momentos en B dan
              $v = 4(2 - \sqrt{3})\,PL/(EA)$.
          - texto: >-
              Con $v$, $N_1 = 2(2 - \sqrt{3})\,P$ y
              $N_2 = -2(2 - \sqrt{3})\,P$.
          - texto: >-
              El resorte se alarga cuando D baja, y tira de D hacia abajo,
              con la carga.
            trampa: true
            mensaje: |
              El resorte está entre D y el suelo, por debajo: cuando D baja
              se acerca al suelo, el resorte se acorta y empuja D hacia
              arriba. Ayuda a las barras, no a la carga.
    resolucion: |
      **1. El sólido libre.** La barra BD, sin la articulación de B y con las
      dos barras y el resorte cortados.

      <figure class="figura-examen">
      <svg viewBox="0 16 240 170" role="img" width="360" height="255" aria-labelledby="dsl-t dsl-d">
