      <figcaption>

      Redibujada del enunciado: la barra 1 va de C a una pared, la 2 al
      suelo y la 3 al techo, articuladas en los dos extremos. En el original
      la 3 sale más corta; aquí las tres miden lo mismo, como dice el texto.

      </figcaption>
      </figure>

      **Notas nuestras.** Las tres barras tienen además el mismo módulo $E$,
      que es lo que dice el «en función de», y su longitud común se llama
      aquí $L$. Cada fuerza se escribe como $N = a\,P + b\,EA\alpha\Delta T$,
      positiva a tracción, y cada desplazamiento de C como
      $c\,PL/(EA) + d\,\alpha\Delta T\,L$, positivo hacia la derecha y hacia
      arriba; en los pasos se pregunta por los coeficientes. $\Delta T > 0$
      es un calentamiento.
    pide: >-
      Los axiles de las tres barras con solo las cargas, en unidades de P; el
      de la barra 2 con solo la temperatura, como coeficiente de EAαΔT, y la
      parte del desplazamiento vertical de C que se debe a la temperatura, en
      unidades de αΔT·L.
    pasos:
      - tipo: reconocer
        pregunta: |
          C se mueve $u$ en horizontal y $v$ en vertical. La barra 1 es
          horizontal y la 2 vertical, así que $\Delta L_1 = u$ y
          $\Delta L_2 = v$. ¿Qué ecuación de compatibilidad cierra el
          problema?
        opciones:
          - texto: $\Delta L_3 = -\tfrac{\sqrt{3}}{2}\,\Delta L_1 - \tfrac{1}{2}\,\Delta L_2$, lo que C avanza en la dirección de la barra 3
            correcta: true
            mensaje: |
              Eso es. La barra 3 va del techo a C, hacia abajo y a la
              izquierda: su dirección, del apoyo a C, es
              $(-\cos 30^{\circ}, -\operatorname{sen} 30^{\circ})$, y se alarga
              lo que C avanza en esa dirección (apuntes, ec. 8.12). Si C se
              va a la derecha o sube, se acerca al techo y la 3 se acorta.
          - texto: $\Delta L_3 = \tfrac{\sqrt{3}}{2}\,\Delta L_1 + \tfrac{1}{2}\,\Delta L_2$
            mensaje: |
              Es la proyección sobre la dirección de C al techo, la
              contraria. Con ese signo, al meter el equilibrio, $N_3$ se va de
              la ecuación y, con solo las cargas, queda
              $(\sqrt{3} - \tfrac{1}{2})\,P = 0$: no hay solución. Si C se
              acerca al techo, la 3 se acorta.
          - texto: $\Delta L_1 = \Delta L_2 = \Delta L_3$, porque las tres barras son iguales y llegan al mismo nudo
            mensaje: |
              Iguales en longitud y sección no quiere decir que se alarguen
              lo mismo: cada una se alarga lo que C avanza en su dirección, y
              las tres van en direcciones distintas.
          - texto: $\Delta L_2 = \alpha\,\Delta T\,L$, porque la barra 2 se dilata libre
            mensaje: |
              C no está suelto: las barras 1 y 3 lo sujetan y frenan a la 2.
              Su alargamiento es el elástico más el térmico,
              $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec. 8.9) con
              $\varepsilon_0 = \alpha\Delta T$, y $N_2$ no es cero.

      - tipo: calcular
        titulo: La barra 1 con solo las cargas
        pregunta: |
          Sin cambio de temperatura ($\Delta T = 0$), ¿cuánto vale $N_1$, en
          unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.4665'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '1.9378'
            mensaje: |
              Has cambiado el seno y el coseno de la barra 3: en la
              proyección,
              $\Delta L_3 = -u\operatorname{sen}30^{\circ} - v\cos 30^{\circ}$,
              o, si la has tomado a 60° de la horizontal, también en el
              equilibrio, y entonces sale 1,9665. La 3 forma 30° con la
              horizontal: la parte de $u$ va con el coseno.
          - valor: '2'
            mensaje: |
              Es lo que llevaría la barra 1 sin la 3: con dos barras el nudo
              es isostático, y la horizontal se lleva los $2P$ enteros. La 3
              también se deforma con C, trabaja y se lleva parte.
        pista: |
          Del equilibrio de C, $N_1 = 2P + \tfrac{\sqrt{3}}{2}N_3$ y
          $N_2 = \tfrac{1}{2}N_3 - P$. Mételos en la compatibilidad, con
          $\Delta L_i = N_iL/(EA)$, y sale $N_3$.
        desarrollo: |
          $$
          N_3 + \tfrac{\sqrt{3}}{2}N_1 + \tfrac{1}{2}N_2 = 0
          \;\Longrightarrow\;
          2N_3 + \left(\sqrt{3} - \tfrac{1}{2}\right)P = 0
          \;\Longrightarrow\;
          N_3 = \frac{1 - 2\sqrt{3}}{4}\,P
          $$

          $$
          N_1 = 2P + \frac{\sqrt{3}}{2}\cdot\frac{1 - 2\sqrt{3}}{4}\,P
          = \frac{10 + \sqrt{3}}{8}\,P = 1{,}4665\,P
          $$

      - tipo: calcular
        titulo: La barra 2 con solo las cargas
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-1.3080'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '-1'
            mensaje: |
              Es lo que llevaría la barra 2 sin la 3: con la 1 y la 2 solas,
              la vertical aguanta $P$ entera. La 3 está comprimida y empuja C
              hacia abajo, y la 2 tiene que aguantar también eso.
          - valor: '1.3080'
            mensaje: |
              El valor es ese, pero el signo no: la barra 2 está comprimida.
              C baja con las cargas, se acerca al suelo y la acorta; con las
              tres barras supuestas a tracción, el signo sale solo.
          - valor: '-1.0359'
            mensaje: |
              Has cambiado el seno y el coseno al proyectar sobre la barra 3.
              La 3 forma 30° con la horizontal: la parte de $u$ va con
              $\cos 30^{\circ}$ y la de $v$, con $\operatorname{sen}30^{\circ}$.
          - valor: '-1.0580'
            mensaje: |
              Has tomado la barra 3 a 60° de la horizontal, en el equilibrio y
              en la compatibilidad. Forma 30°, y su componente vertical va con
              $\operatorname{sen}30^{\circ}$.
        pista: |
          Con el $N_3$ del paso anterior, el equilibrio vertical de C da
          $N_2 = \tfrac{1}{2}N_3 - P$.
        desarrollo: |
          $$
          N_2 = \frac{1}{2}\cdot\frac{1 - 2\sqrt{3}}{4}\,P - P
          = -\frac{7 + 2\sqrt{3}}{8}\,P = -1{,}3080\,P
          $$

      - tipo: calcular
        titulo: La barra 3 con solo las cargas
        pregunta: |
          ¿Y $N_3$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.6160'
          tolerancia: 0.002
          formato: un número con signo, N3 dividido entre P
        distractores:
          - valor: '0'
            mensaje: |
              Con la 1 y la 2 solas el nudo ya está en equilibrio, pero eso no
              deja a la 3 sin trabajo: C se mueve, y la 3 se acorta lo que C
              avanza hacia el techo. Su fuerza sale de la compatibilidad.
          - valor: '0.6160'
            mensaje: |
              El valor es ese, pero el signo no. C se va a la derecha y eso
              lo acerca al techo: la 3 se acorta y está comprimida.
          - valor: '-0.0718'
            mensaje: |
              Has cambiado el seno y el coseno al proyectar sobre la barra 3:
              la parte de $u$ va con $\cos 30^{\circ}$ y la de $v$, con
              $\operatorname{sen}30^{\circ}$.
          - valor: '-0.0670'
            mensaje: |
              Has tomado la barra 3 a 60° de la horizontal, en el equilibrio y
              en la compatibilidad. Forma 30°: su componente horizontal va con
              $\cos 30^{\circ}$ y la vertical, con $\operatorname{sen}30^{\circ}$.
        pista: |
          Sale directamente de $2N_3 + (\sqrt{3} - \tfrac{1}{2})P = 0$.
        desarrollo: |
          $$
          N_3 = \frac{1 - 2\sqrt{3}}{4}\,P = -0{,}6160\,P
          $$

      - tipo: calcular
        titulo: La barra 2 con solo la temperatura
        pregunta: |
          Ahora sin cargas ($P = 0$) y con la barra 2 calentada $\Delta T$:
          ¿cuánto vale $N_2$, como coeficiente de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.125'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en N2
        distractores:
          - valor: '-1'
            mensaje: |
              Es la fuerza de una barra que no puede alargarse, con los dos
              extremos fijos. El de arriba de la 2 es C, y C se mueve: las
              barras 1 y 3 solo la frenan en parte.
          - valor: '0.125'
            mensaje: |
              El valor es ese, pero has puesto la deformación térmica con el
              signo cambiado. Calentada, la barra 2 quiere alargarse, las
              otras dos la frenan y queda comprimida.
        pista: |
          Con $P = 0$, el equilibrio da $N_1 = \tfrac{\sqrt{3}}{2}N_3$ y
          $N_2 = \tfrac{1}{2}N_3$, y en la compatibilidad la 2 lleva su término
          térmico: $\Delta L_2 = N_2L/(EA) + \alpha\Delta T\,L$.
        desarrollo: |
          $$
          N_3 + \tfrac{\sqrt{3}}{2}N_1 + \tfrac{1}{2}\left(N_2 + EA\alpha\Delta T\right) = 0
          \;\Longrightarrow\;
          2N_3 + \tfrac{1}{2}\,EA\alpha\Delta T = 0
          $$

          $$
          N_3 = -\tfrac{1}{4}\,EA\alpha\Delta T
          \qquad
          N_2 = \tfrac{1}{2}N_3 = -\tfrac{1}{8}\,EA\alpha\Delta T = -0{,}125\,EA\alpha\Delta T
          $$

      - tipo: calcular
        titulo: Lo que sube C por la temperatura
        pregunta: |
          Con $P = 0$, ¿cuánto se mueve C en vertical, positivo hacia arriba,
          en unidades de $\alpha\Delta T\,L$?
        respuesta:
          tipo: numero
          valor: '0.875'
          tolerancia: 0.002
          formato: un número con signo, vC dividido entre αΔT·L
        distractores:
          - valor: '-0.125'
            mensaje: |
              Has tomado solo la parte elástica del alargamiento de la 2,
              $N_2L/(EA)$. C sube lo que se alarga la 2, y su alargamiento
              lleva también el término $\varepsilon_0 L$ de la ec. 8.9, con
              $\varepsilon_0 = \alpha\Delta T$.
          - valor: '1'
            mensaje: |
              Es lo que subiría C si la 2 se dilatara libre. Las barras 1 y 3
              la frenan: la comprimen y le quitan parte de la dilatación.
          - valor: '1.125'
            mensaje: |
              Has arrastrado el signo de $N_2$: la 2 está comprimida,
              $N_2 = -EA\alpha\Delta T/8$, y su parte elástica le resta, no le
              suma.
        pista: |
          $v = \Delta L_2 = N_2L/(EA) + \alpha\Delta T\,L$, con el $N_2$ del
          paso anterior.
        desarrollo: |
          $$
          v_C = -\tfrac{1}{8}\,\alpha\Delta T\,L + \alpha\Delta T\,L
          = \tfrac{7}{8}\,\alpha\Delta T\,L = 0{,}875\,\alpha\Delta T\,L
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con las tres barras a tracción, el equilibrio de C da
              $N_1 = 2P + \tfrac{\sqrt{3}}{2}N_3$ y
              $N_2 = \tfrac{1}{2}N_3 - P$: tres axiles y dos ecuaciones.
          - texto: >-
              C se mueve $(u, v)$: la 1 se alarga $u$, la 2 se alarga $v$ y la
              3, $-\tfrac{\sqrt{3}}{2}u - \tfrac{1}{2}v$.
          - texto: >-
              Cada barra cumple $\Delta L = NL/(EA) + \varepsilon_0 L$, con
              $\varepsilon_0 = \alpha\Delta T$ solo en la 2.
          - texto: >-
              Con el equilibrio en la compatibilidad,
              $2N_3 = \left(\tfrac{1}{2} - \sqrt{3}\right)P - \tfrac{1}{2}EA\alpha\Delta T$.
          - texto: >-
              Con $N_3$, el equilibrio da $N_1$ y $N_2$, y el desplazamiento de
              C es $u = \Delta L_1$, $v = \Delta L_2$.
          - texto: >-
              La barra 2 va del suelo, que no se mueve, a C: no puede
              alargarse, y la temperatura le da $N_2 = -EA\alpha\Delta T$.
            trampa: true
            mensaje: |
              Para no poder alargarse le harían falta los dos extremos fijos,
              y C no lo está: las barras 1 y 3 se deforman y lo dejan subir.
              La 2 se alarga lo que sube C, y la temperatura solo le da
              $-EA\alpha\Delta T/8$.
    resolucion: |
      **Lo que la estática no cierra.** Origen en C, $x$ a la derecha e $y$
      hacia arriba. La barra 1 va de C a la pared, hacia la izquierda; la 2,
      al suelo, hacia abajo, y la 3, al techo, a 30° sobre la horizontal y
      hacia la derecha. Las tres se suponen a tracción, tirando de C hacia su
      apoyo. Equilibrio de C:

      $$
      -N_1 + N_3\cos 30^{\circ} + 2P = 0
      \qquad
      -N_2 + N_3\operatorname{sen} 30^{\circ} - P = 0
      $$

      Tres axiles y dos ecuaciones: el nudo es hiperestático de grado uno
      (apuntes del tema 8, p. 4), y la ecuación que falta es de
      compatibilidad.

      **Compatibilidad.** C se mueve $(u, v)$. Cada barra se alarga lo que
      su extremo C avanza en su dirección, contada desde el apoyo (ec. 8.12):
      la 1, $u$; la 2, $v$; la 3, cuya dirección del techo a C es
      $(-\cos 30^{\circ}, -\operatorname{sen} 30^{\circ})$,

      $$
      \Delta L_3 = -u\cos 30^{\circ} - v\operatorname{sen} 30^{\circ}
      = -\tfrac{\sqrt{3}}{2}\,\Delta L_1 - \tfrac{1}{2}\,\Delta L_2
      $$

      **Ley de cada barra**, $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec. 8.9),
      con la misma $L$ y la misma $EA$ en las tres, y
      $\varepsilon_0 = \alpha\Delta T$ solo en la 2:

      $$
      \Delta L_1 = \frac{N_1L}{EA}
      \qquad
      \Delta L_2 = \frac{N_2L}{EA} + \alpha\Delta T\,L
      \qquad
      \Delta L_3 = \frac{N_3L}{EA}
      $$

      Con $L/(EA)$ fuera, la compatibilidad queda
      $N_3 + \tfrac{\sqrt{3}}{2}N_1 + \tfrac{1}{2}N_2 + \tfrac{1}{2}EA\alpha\Delta T = 0$.
      Del equilibrio, $N_1 = 2P + \tfrac{\sqrt{3}}{2}N_3$ y
      $N_2 = \tfrac{1}{2}N_3 - P$; metidos en ella,

      $$
      2N_3 + \left(\sqrt{3} - \tfrac{1}{2}\right)P + \tfrac{1}{2}EA\alpha\Delta T = 0
      $$

      **Las fuerzas.**

      $$
      N_1 = \frac{10 + \sqrt{3}}{8}\,P - \frac{\sqrt{3}}{8}\,EA\alpha\Delta T
      = 1{,}4665\,P - 0{,}2165\,EA\alpha\Delta T
      $$

      $$
      N_2 = -\frac{7 + 2\sqrt{3}}{8}\,P - \frac{1}{8}\,EA\alpha\Delta T
      = -1{,}3080\,P - 0{,}125\,EA\alpha\Delta T
      $$

      $$
      N_3 = \frac{1 - 2\sqrt{3}}{4}\,P - \frac{1}{4}\,EA\alpha\Delta T
      = -0{,}6160\,P - 0{,}25\,EA\alpha\Delta T
      $$

      Con solo las cargas, la 1 tira y la 2 y la 3 empujan. Calentar la 2
      comprime las tres: la 2 empuja C hacia arriba, y la 1 y la 3 lo
      frenan.

      **El desplazamiento de C.** La 1 es horizontal y la 2 vertical, así
      que $u = \Delta L_1$ y $v = \Delta L_2$:

      $$
      u_C = \frac{N_1L}{EA} = 1{,}4665\,\frac{PL}{EA} - 0{,}2165\,\alpha\Delta T\,L
      $$

      $$
      v_C = \frac{N_2L}{EA} + \alpha\Delta T\,L = -1{,}3080\,\frac{PL}{EA} + 0{,}875\,\alpha\Delta T\,L
      $$

      Las cargas llevan C a la derecha y hacia abajo; el calentamiento de la
      2 lo sube $\tfrac{7}{8}\alpha\Delta T\,L$, un octavo menos de lo que la
      2 se dilataría libre.

      **Comprobación por otro camino.** La 3 tiene que alargarse lo mismo
      calculada con su axil que proyectando el movimiento de C. Con su axil,
      $\Delta L_3 = N_3L/(EA) = -0{,}6160\,PL/(EA) - 0{,}25\,\alpha\Delta T\,L$.
      Proyectando, $-\tfrac{\sqrt{3}}{2}u_C - \tfrac{1}{2}v_C$. En la parte de
      las cargas, en unidades de $PL/(EA)$:
      $-0{,}8660 \cdot 1{,}4665 + 0{,}5 \cdot 1{,}3080 = -0{,}6160$. En la de
      la temperatura, en unidades de $\alpha\Delta T\,L$:
      $0{,}8660 \cdot 0{,}2165 - 0{,}5 \cdot 0{,}875 = -0{,}25$.
      Y la $L$ no entra en las fuerzas, que es por lo que el enunciado no la
      da.

  # ── Propuesta A1 de clase · el nudo de dos barras en la pared.
  - id: ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared
    titulo: El nudo C sujeto a la pared por dos barras
    fuente: >-
      Propuesta A1 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (el equilibrio del nudo a mano, la
      proyección del desplazamiento de C sobre cada barra y el balance de
      energía). El enunciado no da ni el material ni la sección de las
      barras: se toman iguales en las dos, y lo dice la nota. La figura está
      redibujada; el original no rotula el nudo C.
    nivel: practica
    enunciado: |
      Encuentra el desplazamiento horizontal y vertical del punto C. Siendo
      $L_2$=$L$.

      <figure class="figura-examen">
      <svg viewBox="40 30 200 200" role="img" width="200" height="200" aria-labelledby="ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-fig-t ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-fig-d">
      <title id="ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-fig-t">El nudo C, sujeto a una pared por dos barras, con la carga P</title>
      <desc id="ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-fig-d">Una pared vertical a la izquierda con dos articulaciones, una encima de otra. De la de abajo sale la barra 2, horizontal, hasta el nudo C. De la de arriba baja la barra 1 hasta C, formando 45° con la barra 2. En C cuelga una fuerza P vertical hacia abajo.</desc>
      <defs><pattern id="ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="48" y="36" width="12" height="148" fill="url(#ejerm8-cla1-el-nudo-de-dos-barras-en-la-pared-r)"/><line x1="60" y1="36" x2="60" y2="184" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="60" y1="50" x2="180" y2="170" stroke="var(--ink)" stroke-width="1.8"/>
      <line x1="60" y1="170" x2="180" y2="170" stroke="var(--ink)" stroke-width="1.8"/>
      <circle cx="60" cy="50" r="4" fill="var(--ink)"/>
      <circle cx="60" cy="170" r="4" fill="var(--ink)"/>
      <circle cx="180" cy="170" r="4" fill="var(--ink)"/>
      <path d="M140 170 A40 40 0 0 1 151.72 141.72" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <line x1="180" y1="175" x2="180" y2="213" stroke="var(--d2)" stroke-width="1.8"/><polygon points="180,220 176.5,212 183.5,212" fill="var(--d2)"/>
      <text x="188" y="216" font-size="12" font-style="italic" fill="var(--d2-tinta)">P</text>
      <text x="188" y="164" font-size="12" fill="var(--ink)">C</text>
      <text x="136" y="160" fill="var(--ink)" font-size="11" text-anchor="end">45°</text>
      <text x="124" y="100" font-size="12" fill="var(--ink)">(1)</text>
      <text x="110" y="192" font-size="12" fill="var(--ink)">(2)</text>
      </svg>
      <figcaption>

      Redibujada del enunciado. El original no rotula el nudo: C es el de la
      derecha, donde cuelga P. La barra 1 va aquí a 45° de la 2, como dice el
      ángulo; en el original sale algo más tendida.

      </figcaption>
      </figure>

      **Notas nuestras.** Las dos barras tienen el mismo módulo $E$ y la
      misma sección $A$, que el enunciado no da. Con la 2 de longitud $L$ y
      el ángulo de 45°, la articulación de la 1 está a $L$ por encima de la
      de la 2. Las fuerzas van en unidades de $P$, positivas a tracción, y
      los desplazamientos en unidades de $PL/(EA)$, positivos hacia la
      derecha y hacia arriba.
    pide: >-
      Los axiles de las dos barras, en unidades de P, y las dos componentes
      del desplazamiento de C, en unidades de PL/(EA).
    pasos:
      - tipo: reconocer
        pregunta: |
          Las fuerzas salen del equilibrio de C, y con ellas los
          alargamientos. ¿Cómo se pasa de los alargamientos al desplazamiento
          $(u, v)$ de C?
        opciones:
          - texto: $\Delta L_2 = u$ y $\Delta L_1 = (u - v)/\sqrt{2}$, lo que C avanza en la dirección de cada barra
            correcta: true
            mensaje: |
              Eso es. Cada barra se alarga lo que su extremo C avanza a lo
              largo de ella, contado desde su apoyo (apuntes, ec. 8.12). La 2
              es horizontal: solo cuenta $u$. La 1 baja de la pared hacia C con
              dirección $(1, -1)/\sqrt{2}$: si C baja, la 1 se alarga.
          - texto: $\Delta L_2 = u$ y $\Delta L_1 = -v$, porque la 1 es la que sostiene P
            mensaje: |
              La 1 sostiene P, pero no es vertical: se alarga lo que C avanza
              en su dirección, a 45°, y eso mezcla el movimiento horizontal y
              el vertical.
          - texto: $\Delta L_2 = u$ y $\Delta L_1 = (u + v)/\sqrt{2}$
            mensaje: |
              El signo de $v$ está al revés. La 1 va de la pared a C hacia
              abajo, $(1, -1)/\sqrt{2}$: un C que baja la estira, así que $v$
              entra con signo menos.

      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '1'
            mensaje: |
              Has puesto que la barra 1 sostiene P entera. Solo su componente
              vertical, $N_1\operatorname{sen}45^{\circ}$, sostiene P; la
              horizontal la equilibra la barra 2.
          - valor: '0.7071'
            mensaje: |
              Has multiplicado P por $\operatorname{sen}45^{\circ}$ en lugar de
              dividir entre él. Lo que vale P es la componente vertical de
              $N_1$, no $N_1$.
        pista: |
          En C, la componente vertical de $N_1$ sostiene $P$, y la horizontal
          la equilibra $N_2$.
        desarrollo: |
          $$
          N_1\operatorname{sen}45^{\circ} = P
          \;\Longrightarrow\;
          N_1 = \sqrt{2}\,P = 1{,}4142\,P
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Y $N_2$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre P
        distractores:
          - valor: '1'
            mensaje: |
              El valor es ese, pero la barra 2 está comprimida: la 1 tira de C
              hacia la pared, y la 2 lo aguanta empujando hacia fuera.
          - valor: '-1.4142'
            mensaje: |
              Has igualado $N_2$ a $N_1$ entero. Solo la componente horizontal
              de $N_1$, $N_1\cos 45^{\circ}$, empuja contra la 2.
        pista: |
          En horizontal, $N_1\cos 45^{\circ} + N_2 = 0$.
        desarrollo: |
          $$
          N_2 = -N_1\cos 45^{\circ} = -\sqrt{2}\cdot\frac{\sqrt{2}}{2}\,P = -P
          $$

      - tipo: calcular
        titulo: El desplazamiento horizontal de C
        pregunta: |
          ¿Cuánto se mueve C en horizontal, positivo hacia la derecha, en
          unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.002
          formato: un número con signo, uC dividido entre PL/(EA)
        distractores:
          - valor: '1'
            mensaje: |
              El valor es ese, pero la 2 está comprimida: se acorta, y C se
              acerca a la pared, hacia la izquierda.
          - valor: '0'
            mensaje: |
              P es vertical, pero C no solo baja: la barra 2 se acorta y lo
              mete hacia la pared.
        pista: |
          La 2 es horizontal y va de la pared a C: $u = \Delta L_2 = N_2L/(EA)$.
        desarrollo: |
          $$
          u_C = \Delta L_2 = \frac{N_2L}{EA} = -\frac{PL}{EA}
          $$

      - tipo: calcular
        titulo: El desplazamiento vertical de C
        pregunta: |
          ¿Y en vertical, positivo hacia arriba, en unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '-3.8284'
          tolerancia: 0.004
          formato: un número con signo, vC dividido entre PL/(EA)
        distractores:
          - valor: '-2.8284'
            mensaje: |
              Es $-\sqrt{2}\,\Delta L_1$, como si C solo bajara: te has dejado
              el $u$ de la proyección. De $\Delta L_1 = (u - v)/\sqrt{2}$ sale
              $v = u - \sqrt{2}\,\Delta L_1$, y $u$ no es cero.
          - valor: '-1.8284'
            mensaje: |
              Has metido $u$ con el signo cambiado. La 2 se acorta y C va hacia
              la pared: $u = -PL/(EA)$.
          - valor: '-3'
            mensaje: |
              Has tomado la barra 1 de longitud $L$. Va a 45° y su
              articulación está a $L$ por encima de la de la 2: mide
              $L\sqrt{2}$, y se alarga $\sqrt{2}$ veces más.
          - valor: '-2'
            mensaje: |
              Es $-\Delta L_1$: has tomado lo que se alarga la 1 por lo que baja
              C, o has tomado la 1 de longitud $L$ y te has dejado la $u$, que
              da lo mismo. La 1 mide $L\sqrt{2}$ y va a 45°, y C baja más de lo
              que ella se alarga.
          - valor: '3.8284'
            mensaje: |
              El valor es ese, pero C baja: con
              $\Delta L_1 = (u - v)/\sqrt{2}$, $v = u - \sqrt{2}\,\Delta L_1$
              es negativa.
        pista: |
          De la proyección sobre la 1, $v = u - \sqrt{2}\,\Delta L_1$, con
          $\Delta L_1 = N_1L_1/(EA)$ y $L_1 = L\sqrt{2}$.
        desarrollo: |
          $$
          \Delta L_1 = \frac{N_1L_1}{EA} = \frac{\sqrt{2}\,P \cdot L\sqrt{2}}{EA} = 2\,\frac{PL}{EA}
          $$

          $$
          v_C = u_C - \sqrt{2}\,\Delta L_1
          = -\left(1 + 2\sqrt{2}\right)\frac{PL}{EA}
          = -3{,}8284\,\frac{PL}{EA}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En C, la componente vertical de la 1 sostiene P y la horizontal
              la aguanta la 2: $N_1 = \sqrt{2}\,P$ y $N_2 = -P$.
          - texto: >-
              La 1 mide $L\sqrt{2}$ y se alarga $2PL/(EA)$; la 2 se acorta
              $PL/(EA)$.
          - texto: >-
              La 2 es horizontal: C se va hacia la pared,
              $u = \Delta L_2 = -PL/(EA)$.
          - texto: >-
              La 1 se alarga lo que C avanza en su dirección,
              $(u - v)/\sqrt{2}$, y de ahí $v = u - \sqrt{2}\,\Delta L_1$.
          - texto: >-
              C baja $(1 + 2\sqrt{2})\,PL/(EA)$ y se va hacia la pared
              $PL/(EA)$.
          - texto: >-
              C baja $\Delta L_1/\operatorname{sen}45^{\circ} = 2\sqrt{2}\,PL/(EA)$;
              la 2 es horizontal y no cuenta en la vertical.
            trampa: true
            mensaje: |
              La 2 se acorta y mete C hacia la pared, y ese movimiento también
              tiene componente a lo largo de la 1. Sin él falta $PL/(EA)$ en
              la bajada.
    resolucion: |
      **Las fuerzas.** El nudo C tiene dos barras y dos ecuaciones: es
      isostático, y las fuerzas salen sin compatibilidad. Origen en la
      articulación de la 2, $x$ hacia la derecha e $y$ hacia arriba: C está en
      $(L, 0)$ y la articulación de la 1, en $(0, L)$. Con las dos a
      tracción, tirando de C hacia su apoyo:

      $$
      N_1\operatorname{sen}45^{\circ} = P
      \qquad
      N_1\cos 45^{\circ} + N_2 = 0
      $$

      $$
      N_1 = \sqrt{2}\,P = 1{,}4142\,P
      \qquad
      N_2 = -P
      $$

      La 1 tira y la 2 empuja.

      **Los alargamientos** (ec. 8.9), con $L_1 = L\sqrt{2}$ y $L_2 = L$:

      $$
      \Delta L_1 = \frac{N_1L_1}{EA} = 2\,\frac{PL}{EA}
      \qquad
      \Delta L_2 = \frac{N_2L_2}{EA} = -\frac{PL}{EA}
      $$

      **El desplazamiento de C.** Cada barra se alarga lo que C avanza en su
      dirección, contada desde su apoyo (ec. 8.12). La 2 va hacia $(1, 0)$ y
      la 1, de $(0, L)$ a $(L, 0)$, hacia $(1, -1)/\sqrt{2}$:

      $$
      \Delta L_2 = u
      \qquad
      \Delta L_1 = \frac{u - v}{\sqrt{2}}
      $$

      $$
      u_C = -\frac{PL}{EA}
      \qquad
      v_C = u_C - \sqrt{2}\,\Delta L_1 = -\left(1 + 2\sqrt{2}\right)\frac{PL}{EA} = -3{,}8284\,\frac{PL}{EA}
      $$

      C se va hacia la pared y baja casi cuatro veces más.

      **Comprobación por otro camino.** El trabajo de P en su bajada tiene
      que ser la energía que guardan las dos barras, una cuenta que el tema
      13 hace con calma:
      $\tfrac{1}{2}P\,|v_C| = \sum N^{2}L/(2EA)$. En unidades de
      $P^{2}L/(EA)$, $N_1^{2}L_1 + N_2^{2}L_2$ da
      $2\sqrt{2} + 1 = 3{,}8284$, que es $|v_C|$ en unidades de $PL/(EA)$.
      Y de vuelta a la proyección: con $u_C$ y $v_C$, lo que C avanza en la
      dirección de la 1 es
      $(-1 + 3{,}8284)/1{,}4142 = 2{,}0000$, el $\Delta L_1$ de arriba.

  # ── Propuesta A2 de clase · la barra que cuelga con su peso.
  - id: ejerm8-cla2-la-barra-que-cuelga-con-su-peso
    titulo: La barra que cuelga con su propio peso
    fuente: >-
      Propuesta A2 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8 y la barra partida en 400 tramos con el peso
      en los nudos) y comprobada por un segundo camino (la fórmula cerrada y,
      para el volumen, las rebanadas deformadas de verdad). Se conserva la
      errata del original, «volumentes»; la «v» de los datos es el
      coeficiente de Poisson, ν. El enunciado no da un número para ν: el
      último paso toma ν = 0,3. La figura está redibujada.
    nivel: practica
    enunciado: |
      Una barra de sección constante solo sufre su peso propio. Calcula el
      diagrama de fuerzas normales, variación de longitudes y variación de
      volumentes. Datos: Q,L,A,E,v

      <figure class="figura-examen">
      <svg viewBox="56 14 150 192" role="img" width="150" height="192" aria-labelledby="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-t ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-d">
      <title id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-t">Una barra de sección constante colgada del techo</title>
      <desc id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-fig-d">Un techo rayado del que cuelga una barra recta vertical de sección constante. A su izquierda, una cota vertical L de arriba abajo, toda la longitud de la barra.</desc>
      <defs><pattern id="ejerm8-cla2-la-barra-que-cuelga-con-su-peso-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="66" y="22" width="130" height="12" fill="url(#ejerm8-cla2-la-barra-que-cuelga-con-su-peso-r)"/><line x1="66" y1="34" x2="196" y2="34" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="110" y="34" width="30" height="160" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="88" y1="36" x2="88" y2="194" stroke="var(--faint)" stroke-width="0.9"/><polygon points="88,194 85.6,188 90.4,188" fill="var(--faint)"/><polygon points="88,36 90.4,42 85.6,42" fill="var(--faint)"/>
      <text x="78" y="118" font-size="12" fill="var(--ink)" font-style="italic" text-anchor="end">L</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la barra cuelga del techo por su extremo de
      arriba, y el de abajo está libre.

      </figcaption>
      </figure>

      **Notas nuestras.** $Q$ es el peso de toda la barra y la «v» de los
      datos, el coeficiente de Poisson $\nu$. Los axiles van en unidades de
      $Q$, el alargamiento y los descensos en unidades de $QL/(EA)$ y la
      variación de volumen en unidades de $QL/E$. Para el volumen hace falta
      un número: aquí $\nu = 0{,}3$, un ejemplo nuestro.
    pide: >-
      El axil a un cuarto de la longitud por debajo del techo, en unidades de
      Q; el alargamiento de la barra y el descenso de su punto medio, en
      unidades de QL/(EA), y la variación de volumen con ν = 0,3, en unidades
      de QL/E.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es el diagrama de fuerzas normales a lo largo de la barra?
        opciones:
          - texto: Una recta, de $Q$ junto al techo a cero en el extremo libre
            correcta: true
            mensaje: |
              Eso es. Cada sección sostiene el peso de lo que cuelga por
              debajo de ella. Con la sección constante, ese peso crece en
              proporción a la longitud que cuelga: cero en el extremo libre y
              la barra entera, $Q$, junto al techo.
          - texto: Constante, $Q$ en toda la barra
            mensaje: |
              Eso sería con la barra sin peso y $Q$ colgado del extremo. Con el
              peso propio, una sección cerca del extremo libre solo sostiene el
              trocito que tiene debajo.
          - texto: Una recta, de cero junto al techo a $Q$ en el extremo libre
            mensaje: |
              Está al revés. La sección del techo sostiene la barra entera; la
              del extremo libre no sostiene nada.
          - texto: Una parábola, porque cada trozo baja lo que se alargan los de encima
            mensaje: |
              Lo que va sumándose así es el descenso de cada sección, y ese sí
              es una parábola. El axil es el peso de lo de debajo, y con la
              sección constante crece en proporción a su longitud: una recta.

      - tipo: calcular
        titulo: El axil a un cuarto del techo
        pregunta: |
          A una distancia $L/4$ por debajo del techo, ¿cuánto vale $N$, en
          unidades de $Q$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.002
          formato: un número, N dividido entre Q
        distractores:
          - valor: '0.25'
            mensaje: |
              Es el axil a $L/4$ del extremo libre: has medido desde el lado
              equivocado. Por debajo de esa sección cuelgan tres cuartos de la
              barra.
          - valor: '1'
            mensaje: |
              Es el axil junto al techo, que sostiene la barra entera. A $L/4$
              del techo el cuarto de arriba ya queda por encima de la sección.
        pista: |
          Por debajo de la sección cuelgan $3L/4$ de barra, y $N$ es su peso.
        desarrollo: |
          $$
          N = Q\,\frac{3L/4}{L} = 0{,}75\,Q
          $$

      - tipo: calcular
        titulo: El alargamiento de la barra
        pregunta: |
          ¿Cuánto se alarga la barra, en unidades de $QL/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, ΔL dividido entre QL/(EA)
        distractores:
          - valor: '1'
            mensaje: |
              Es $QL/(EA)$, el alargamiento con todo el peso colgado del
              extremo. El axil baja hasta cero en el extremo libre, y cada
              trozo se alarga según el peso que tiene debajo.
        pista: |
          Con $N$ variable hay que integrar: la ec. 8.8 sin $\varepsilon_0$,
          $\Delta L = \int_0^L N/(EA)\,dx$, con $N = Qx/L$ y $x$ medida desde
          el extremo libre.
        desarrollo: |
          $$
          \Delta L = \int_0^L \frac{Q\,x}{L\,EA}\,dx = \frac{QL}{2EA} = 0{,}5\,\frac{QL}{EA}
          $$

      - tipo: calcular
        titulo: El descenso del punto medio
        pregunta: |
          ¿Cuánto baja el punto medio de la barra, en unidades de $QL/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número, el descenso dividido entre QL/(EA)
        distractores:
          - valor: '0.25'
            mensaje: |
              Es la mitad del alargamiento total, como si la barra se estirara
              igual en toda su longitud. La mitad de arriba lleva más axil que
              la de abajo y se alarga más.
          - valor: '0.125'
            mensaje: |
              Es lo que se alarga la mitad de abajo. El punto medio baja lo que
              se alarga la mitad de arriba, la que está entre él y el techo.
        pista: |
          El punto medio baja lo que se alarga el trozo entre él y el techo:
          $x$ de $L/2$ a $L$, medida desde el extremo libre.
        desarrollo: |
          $$
          \delta_{L/2} = \int_{L/2}^{L} \frac{Q\,x}{L\,EA}\,dx
          = \frac{Q}{2L\,EA}\left(L^{2} - \frac{L^{2}}{4}\right)
          = \frac{3}{8}\,\frac{QL}{EA} = 0{,}375\,\frac{QL}{EA}
          $$

      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          Con $\nu = 0{,}3$, ¿cuánto cambia el volumen de la barra, en
          unidades de $QL/E$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.002
          formato: un número con signo, ΔV dividido entre QL/E
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $A\,\Delta L$: has contado el alargamiento y no el
              estrechamiento. Con $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$
              la sección también cambia (apuntes del tema 4, ec. 4.1).
          - valor: '0.8'
            mensaje: |
              Has sumado las deformaciones laterales con el signo cambiado. A
              tracción la barra se estrecha: $e = (1 - 2\nu)\,\varepsilon_x$,
              no $(1 + 2\nu)\,\varepsilon_x$.
          - valor: '0.4'
            mensaje: |
              Es $(1 - 2\nu)\,QL/E$, con $N = Q$ en toda la barra. El axil baja
              de $Q$ a cero, y la integral se queda en la mitad.
          - valor: '0'
            mensaje: |
              Sería con $\nu = 0{,}5$, un material que no cambia de volumen.
              Con $\nu = 0{,}3$ la sección se estrecha menos de lo que haría
              falta para compensar el alargamiento, y el volumen crece.
        pista: |
          La deformación volumétrica es
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = (1 - 2\nu)\,\varepsilon_x$,
          y $\Delta V = \int_V e\,dV = A\int_0^L e\,dx$.
        desarrollo: |
          $$
          \Delta V = A\int_0^L (1 - 2\nu)\,\frac{N}{EA}\,dx
          = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,\frac{QL}{2E}
          $$

          $$
          (1 - 0{,}6) \cdot 0{,}5 = 0{,}2
          \qquad
          \Delta V = 0{,}2\,\frac{QL}{E}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A una distancia $x$ del extremo libre, la sección sostiene el
              trozo de debajo: $N = Qx/L$.
          - texto: >-
              Como $N$ cambia, el alargamiento es la integral de $N/(EA)$:
              $\Delta L = QL/(2EA)$.
          - texto: >-
              Cada sección baja lo que se alarga el trozo entre ella y el
              techo: el punto medio, $3QL/(8EA)$.
          - texto: >-
              Cada rebanada se alarga $\varepsilon_x$ y se estrecha
              $\nu\varepsilon_x$ en cada dirección de la sección:
              $e = (1 - 2\nu)\,\varepsilon_x$.
          - texto: >-
              Sumando sobre la barra,
              $\Delta V = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,QL/(2E)$.
          - texto: >-
              El volumen no cambia: lo que la barra gana en longitud lo pierde
              en sección.
            trampa: true
            mensaje: |
              Solo con $\nu = 0{,}5$. Con $\nu = 0{,}3$,
              $e = 0{,}4\,\varepsilon_x$: la sección se estrecha menos de lo
              que haría falta, y el volumen crece.
    resolucion: |
      **El diagrama de fuerzas normales.** Se mide $x$ desde el extremo
      libre hacia arriba. La sección a la altura $x$ sostiene el trozo de
      barra que cuelga por debajo, de longitud $x$; con la sección constante,
      su peso es la fracción $x/L$ de $Q$:

      $$
      N(x) = Q\,\frac{x}{L}
      $$

      Una recta: cero en el extremo libre y $Q$ junto al techo, donde la
      reacción vale el peso entero. Toda la barra está a tracción.

      **La variación de longitud.** $N$ cambia a lo largo de la barra, así
      que el alargamiento es la integral de la ec. 8.8, sin término térmico:

      $$
      \Delta L = \int_0^L \frac{N}{EA}\,dx = \int_0^L \frac{Q\,x}{L\,EA}\,dx = \frac{QL}{2EA}
      $$

      La mitad de lo que saldría con $Q$ colgado del extremo; con
      $Q = \rho g A L$ es la fórmula de la teoría, $\rho g L^{2}/(2E)$. Cada
      sección baja lo que se alarga el trozo entre ella y el techo; el punto
      medio, lo que se alarga la mitad de arriba:

      $$
      \delta_{L/2} = \int_{L/2}^{L} \frac{Q\,x}{L\,EA}\,dx = \frac{3QL}{8EA} = 0{,}375\,\frac{QL}{EA}
      $$

      Tres cuartas partes del alargamiento están en la mitad de arriba.

      **La variación de volumen.** Cada rebanada está a tracción simple, con
      $\sigma_x = N/A$: se alarga $\varepsilon_x = \sigma_x/E$ y se estrecha
      $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$ (apuntes del tema 4,
      ec. 4.1, p. 4). Su deformación volumétrica (tema 3, ec. 3.59, p. 18) es

      $$
      e = \varepsilon_x + \varepsilon_y + \varepsilon_z = (1 - 2\nu)\,\frac{\sigma_x}{E}
      $$

      y la del volumen de toda la barra (ec. 3.60), con $dV = A\,dx$,

      $$
      \Delta V = \int_V e\,dV = (1 - 2\nu)\int_0^L \frac{N}{EA}\,A\,dx
      = (1 - 2\nu)\,A\,\Delta L = (1 - 2\nu)\,\frac{QL}{2E}
      $$

      El volumen crece mientras $\nu < 0{,}5$. Con $\nu = 0{,}3$,
      $\Delta V = 0{,}4 \cdot 0{,}5\,QL/E = 0{,}2\,QL/E$.

      **Comprobación por otro camino.** El motor resuelve la barra de dos
      formas que no comparten nada: la integral de la ec. 8.8, y la barra
      partida en 400 tramos con el peso de cada uno repartido en sus nudos,
      como una barra con cargas puntuales. Las dos dan $0{,}5\,QL/(EA)$ de
      alargamiento, $0{,}375\,QL/(EA)$ de descenso del punto medio y $Q$ de
      reacción en el techo. Para el volumen, cada rebanada deformada mide de
      verdad $(1 + \varepsilon_x)(1 - \nu\varepsilon_x)^{2}$ veces lo que
      medía; sumando lo que crece cada una sale el mismo $0{,}2\,QL/E$, salvo
      términos de segundo orden.

  # ── Propuesta A3 de clase · la celosía rígida sujeta por dos barras.
  - id: ejerm8-cla3-la-celosia-rigida-y-las-dos-barras
