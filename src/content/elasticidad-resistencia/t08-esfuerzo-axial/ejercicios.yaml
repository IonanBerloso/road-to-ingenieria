      <figcaption>

      Redibujada del enunciado: la barra 1 va de A al techo en D y la 2, de
      C al techo en E; B es la articulación fija, bajo la viga.

      </figcaption>
      </figure>

      **Notas nuestras.** Las dos barras tienen el mismo $E$ y la misma $A$,
      que es lo que dice el «en función de». Cada fuerza se escribe como
      $N = a\,q_0L + b\,EA\alpha\Delta T$, positiva a tracción, y en los
      pasos se pregunta por los coeficientes. $\Delta T > 0$ es un
      calentamiento.
    pide: >-
      Los axiles de las dos barras, con su signo, como coeficientes de q0L y
      de EAαΔT; el ΔT que deja la viga horizontal, en unidades de
      q0L/(EAα), y los axiles con él.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga gira un ángulo pequeño θ alrededor de B, con A a un lado y C
          al otro. ¿Qué relación hay entre los alargamientos de las dos
          barras?
        opciones:
          - texto: $\Delta L_2 = -3\,\Delta L_1$, porque si C baja, A sube, y C está el triple de lejos de B
            correcta: true
            mensaje: |
              Eso es. A y C están a los dos lados de la articulación: cuando la
              viga gira, uno baja y el otro sube. Las barras están encima, así
              que la del punto que baja se alarga y la otra se acorta; y la de
              C se mueve el triple, porque BC = 3AB.
          - texto: $\Delta L_2 = 3\,\Delta L_1$, porque C se mueve el triple que A
            mensaje: |
              El triple sí, pero en sentido contrario: B está entre A y C. Con
              los dos alargamientos del mismo signo, la barra 1 sale
              traccionada, cuando la viga la empuja hacia arriba.
          - texto: $\Delta L_1 = \Delta L_2$, porque la viga es rígida
            mensaje: |
              Rígida no es inmóvil: la viga está articulada en B y gira. Cada
              punto se mueve en proporción a su distancia a B, y a los dos
              lados con signo contrario.
          - texto: $\Delta L_2 = -\Delta L_1/3$, porque A está más cerca de B
            mensaje: |
              Tienes la proporción al revés. Se mueve más el que está más
              lejos de la articulación: C, a $3L$, se mueve el triple que A, a
              $L$.

      - tipo: calcular
        titulo: La barra 1 con solo la carga
        pregunta: |
          Sin calentar ($\Delta T = 0$), ¿cuánto vale $N_1$? Da el
          coeficiente de $q_0L$, con su signo.
        respuesta:
          tipo: numero
          valor: '-0.8182'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre q0L
        distractores:
          - valor: '1.2857'
            mensaje: |
              Has escrito $\Delta L_2 = 3\,\Delta L_1$, con el mismo signo, y la
              barra 1 te sale a tracción. A sube cuando C baja: con
              $\Delta L_2 = -3\,\Delta L_1$ la barra 1 está comprimida.
          - valor: '-0.45'
            mensaje: |
              Has tomado la barra 2 de longitud $L$. Mide $CE = 2L$: con el
              mismo alargamiento lleva la mitad de fuerza, y la
              compatibilidad es $2N_2 = -3N_1$, no $N_2 = -3N_1$.
          - valor: '-1.6364'
            mensaje: |
              Has puesto la resultante $3q_0L$ en C. Una carga repartida
              uniforme actúa en el centro de su tramo, a $1{,}5L$ de B: su
              momento es $4{,}5\,q_0L^{2}$, no $9\,q_0L^{2}$.
        pista: |
          Supón las dos a tracción. Momentos en B, con A a la izquierda:
          $-N_1L + 3L\,N_2 = 3q_0L \cdot 1{,}5L$. Compatibilidad con la ley de
          cada barra: $N_2\,2L/(EA) = -3\,N_1L/(EA)$, o sea $2N_2 = -3N_1$.
        desarrollo: |
          $$
          -N_1 + 3N_2 = 4{,}5\,q_0L
          \qquad
          N_2 = -\tfrac{3}{2}N_1
          $$

          $$
          -N_1 - \tfrac{9}{2}N_1 = 4{,}5\,q_0L
          \;\Longrightarrow\;
          N_1 = -\frac{9}{11}\,q_0L
          \qquad
          \frac{9}{11} = 0{,}8182
          $$

          Negativa: la barra 1 está comprimida. La viga empuja A hacia arriba.

      - tipo: calcular
        titulo: La barra 2 con solo la carga
        pregunta: |
          Sin calentar, ¿cuánto vale $N_2$? Da el coeficiente de $q_0L$.
        respuesta:
          tipo: numero
          valor: '1.2273'
          tolerancia: 0.002
          formato: un número con signo, N2 dividido entre q0L
        distractores:
          - valor: '1.9286'
            mensaje: |
              Sale de $\Delta L_2 = 3\,\Delta L_1$, con el signo perdido: la
              barra 1 tira en vez de empujar y la 2 tiene que llevar más. A
              sube cuando C baja, y $\Delta L_2 = -3\,\Delta L_1$.
          - valor: '1.35'
            mensaje: |
              Has tomado la barra 2 de longitud $L$. Mide $2L$: para el mismo
              alargamiento hace la mitad de fuerza, $N_2 = EA\,\Delta L_2/(2L)$.
          - valor: '2.4545'
            mensaje: |
              Has puesto la resultante $3q_0L$ en C. La de una carga uniforme
              va en el centro de su tramo, a $1{,}5L$ de B.
        pista: |
          Con $N_1 = -\tfrac{9}{11}q_0L$, de la compatibilidad
          $N_2 = -\tfrac{3}{2}N_1$; o del equilibrio, $3N_2 = 4{,}5\,q_0L + N_1$.
        desarrollo: |
          $$
          N_2 = -\tfrac{3}{2}N_1 = \frac{27}{22}\,q_0L
          \qquad
          \frac{27}{22} = 1{,}2273
          $$

          Comprobación con los momentos en B:
          $-(-\frac{9}{11}) + 3 \cdot \frac{27}{22} = \frac{18}{22} + \frac{81}{22} = \frac{99}{22} = 4{,}5$.

      - tipo: calcular
        titulo: Lo que el calentamiento añade a la barra 1
        pregunta: |
          Con la carga y el calentamiento, $N_1 = a\,q_0L + b\,EA\alpha\Delta T$.
          ¿Cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '-0.8182'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en N1
        distractores:
          - valor: '-1'
            mensaje: |
              Es lo que tendría la barra 1 con sus dos extremos fijos, como el
              alambre entre soportes: $N_1 = -EA\alpha\Delta T$. Aquí A no
              está fijo: al calentarse, la barra 1 empuja A hacia abajo, la
              viga gira y le cede parte del alargamiento.
          - valor: '0.8182'
            mensaje: |
              Has puesto el término térmico con el signo cambiado,
              $\Delta L_1 = N_1L/(EA) - \alpha\Delta T\,L$. Calentada, la barra
              se alargaría sin carga: $\varepsilon_0 = +\alpha\Delta T$, y lo
              que la viga le impide la comprime.
        pista: |
          Solo con el calentamiento ($q_0 = 0$): momentos en B,
          $-N_1 + 3N_2 = 0$; compatibilidad,
          $2N_2L/(EA) = -3\left(N_1L/(EA) + \alpha\Delta T\,L\right)$.
        desarrollo: |
          Con $q_0 = 0$, $N_1 = 3N_2$, y la compatibilidad queda

          $$
          2N_2 = -3\left(3N_2 + EA\alpha\Delta T\right)
          \;\Longrightarrow\;
          N_2 = -\frac{3}{11}\,EA\alpha\Delta T
          \qquad
          N_1 = -\frac{9}{11}\,EA\alpha\Delta T
          $$

          $b = -9/11$, y $\frac{9}{11} = 0{,}8182$. Las dos barras se
          comprimen: la 1 porque no la dejan alargarse del todo, y la 2
          porque C sube.

      - tipo: calcular
        titulo: El calentamiento que deja la viga horizontal
        pregunta: |
          ¿Qué $\Delta T$ deja la viga ABC horizontal? Da el coeficiente de
          $q_0L/(EA\alpha)$.
        respuesta:
          tipo: numero
          valor: '4.5'
          tolerancia: 0.01
          formato: un número con signo, ΔT dividido entre q0L/(EAα)
        distractores:
          - valor: '-4.5'
            mensaje: |
              Has escrito el término térmico restando, como si calentar
              acortara la barra. Con la viga horizontal, $\Delta L_1 = 0$:
              $N_1L/(EA) + \alpha\Delta T\,L = 0$, y con $N_1 = -4{,}5\,q_0L$
              sale un calentamiento, positivo.
          - valor: '9'
            mensaje: |
              Sale de poner la resultante $3q_0L$ en C, que da
              $N_1 = -9\,q_0L$. Va en el centro de BC, a $1{,}5L$ de B: el
              momento es $4{,}5\,q_0L^{2}$.
        pista: |
          Horizontal quiere decir θ = 0: ninguna barra se alarga. Con
          $\Delta L_2 = 0$, $N_2 = 0$, y los momentos en B dan $N_1$. Con
          $\Delta L_1 = 0$, la barra 1 es como un alambre entre soportes
          fijos.
        desarrollo: |
          $$
          N_2 = 0
          \;\Longrightarrow\;
          -N_1 L = 4{,}5\,q_0L^{2}
          \;\Longrightarrow\;
          N_1 = -4{,}5\,q_0L
          $$

          $$
          \frac{N_1 L}{EA} + \alpha\Delta T\,L = 0
          \;\Longrightarrow\;
          \Delta T = -\frac{N_1}{EA\alpha} = \frac{9}{2}\,\frac{q_0L}{EA\alpha}
          $$

          Con ese calentamiento la barra 2 no trabaja, y la 1 aguanta toda la
          carga empujando: $N_1 = -4{,}5\,q_0L$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Son cuatro incógnitas, N1, N2 y las dos reacciones de B, y tres
              ecuaciones; la de momentos en B es
              $-N_1L + 3L\,N_2 = 4{,}5\,q_0L^{2}$.
          - texto: >-
              La viga gira θ alrededor de B: A baja $\theta L$ y C sube
              $3\theta L$, así que $\Delta L_1 = \theta L$ y
              $\Delta L_2 = -3\theta L$.
          - texto: >-
              La ley de cada barra: $\Delta L_1 = N_1L/(EA) + \alpha\Delta T\,L$
              y $\Delta L_2 = 2N_2L/(EA)$.
          - texto: >-
              Resolviendo, $N_1 = -\tfrac{9}{11}(q_0L + EA\alpha\Delta T)$ y
              $N_2 = \tfrac{27}{22}q_0L - \tfrac{3}{11}EA\alpha\Delta T$; la
              barra 1 empuja.
          - texto: >-
              Horizontal es θ = 0: $N_2 = 0$, $N_1 = -4{,}5\,q_0L$, y
              $\Delta L_1 = 0$ da $\Delta T = 9q_0L/(2EA\alpha)$.
          - texto: >-
              Como la viga es rígida, las dos barras se alargan lo mismo,
              $\Delta L_1 = \Delta L_2$.
            trampa: true
            mensaje: |
              Rígida no es inmóvil. La viga está articulada en B y gira: A y C
              se mueven en sentidos contrarios y C el triple que A. Por eso
              $\Delta L_2 = -3\,\Delta L_1$.
    resolucion: |
      **Lo que la estática no cierra.** Las incógnitas son $N_1$, $N_2$ y
      las dos reacciones de la articulación B; el plano da tres ecuaciones.
      Se suponen las dos barras a tracción, que tiran de la viga hacia
      arriba, y se toman momentos en B, antihorarios positivos, con A a la
      izquierda y la resultante de la carga, $3q_0L$, en el centro de BC, a
      $1{,}5L$:

      $$
      -N_1\,L + N_2\,3L - 3q_0L \cdot 1{,}5L = 0
      \;\Longrightarrow\;
      -N_1 + 3N_2 = 4{,}5\,q_0L
      $$

      **Compatibilidad.** La viga es rígida y gira un ángulo pequeño θ
      (antihorario) alrededor de B. A, a $L$ a la izquierda, baja
      $\theta L$; C, a $3L$ a la derecha, sube $3\theta L$. Las dos barras
      son verticales y su extremo de arriba es fijo, así que cada una se
      alarga lo que baja su extremo de abajo (apuntes, ecs. 8.10-8.12):

      $$
      \Delta L_1 = \theta L \qquad \Delta L_2 = -3\theta L
      \qquad\Longrightarrow\qquad
      \Delta L_2 = -3\,\Delta L_1
      $$

      **Ley de cada barra** (ec. 8.9), con la barra 1 calentada:

      $$
      \Delta L_1 = \frac{N_1 L}{EA} + \alpha\Delta T\,L
      \qquad
      \Delta L_2 = \frac{N_2\,2L}{EA}
      $$

      Llevadas a la compatibilidad,
      $2N_2 = -3N_1 - 3EA\alpha\Delta T$. Con el equilibrio,
      $N_1 = 3N_2 - 4{,}5\,q_0L$, y queda
      $11N_2 = 13{,}5\,q_0L - 3EA\alpha\Delta T$:

      $$
      N_2 = \frac{27}{22}\,q_0L - \frac{3}{11}\,EA\alpha\Delta T
      \qquad
      N_1 = -\frac{9}{11}\left(q_0L + EA\alpha\Delta T\right)
      $$

      Calentada, la barra 1 sale comprimida: con la carga, porque la viga sube
      por A; con el calentamiento, porque no la dejan alargarse del todo. La
      2 está a tracción con la carga y el calentamiento se la quita. En
      números, $\frac{9}{11} = 0{,}8182$, $\frac{27}{22} = 1{,}2273$ y
      $\frac{3}{11} = 0{,}2727$.

      **b/ La viga horizontal.** Horizontal es $\theta = 0$: ninguna barra
      se alarga. La 2 no tiene deformación térmica, así que $N_2 = 0$, y los
      momentos en B dan $N_1 = -4{,}5\,q_0L$. La 1 tiene que quedarse con su
      longitud, como un alambre entre soportes fijos:

      $$
      \frac{N_1 L}{EA} + \alpha\Delta T\,L = 0
      \;\Longrightarrow\;
      \Delta T = -\frac{N_1}{EA\alpha} = \frac{9\,q_0L}{2\,EA\alpha}
      $$

      Las fuerzas son entonces $N_1 = -\tfrac{9}{2}q_0L$ (compresión) y
      $N_2 = 0$: el calentamiento hace que la barra 1 empuje A hacia abajo lo
      justo para que la carga de BC no haga girar la viga.

      **Comprobación por otro camino.** Con el giro como incógnita,
      $N_1 = EA(\theta - \alpha\Delta T)$ y $N_2 = -\tfrac{3}{2}EA\,\theta$.
      Los momentos en B dan

      $$
      -\tfrac{11}{2}\,EA\,\theta + EA\alpha\Delta T = 4{,}5\,q_0L
      \;\Longrightarrow\;
      \theta = \frac{2\,\alpha\Delta T}{11} - \frac{9\,q_0L}{11\,EA}
      $$

      que se anula justo con $\alpha\Delta T = 9q_0L/(2EA)$, el mismo
      resultado. Sin calentar, θ sale negativo: la viga gira en sentido
      horario, C baja y A sube, como dice el signo de $N_1$.
  - id: ejerm8-cla6-la-pieza-en-l-y-la-barra-a-45
    titulo: La pieza en L colgada de O, con una barra a 45° y otra vertical
    fuente: >-
      Propuesta A6 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del
      curso y comprobada por un segundo camino (los momentos en O y la
      proyección del desplazamiento de cada punto sobre su barra). Se
      conservan las erratas del original, «totalmene» y «rigida» sin tilde.
      El enunciado no da ni el material ni la sección de las barras: se
      toman iguales en las dos, y lo dice la nota. La figura está
      redibujada con las cotas del original.
    nivel: practica
    enunciado: |
      En el sistema de la figura, la barra OABD es totalmene rigida y las
      barras 1 y 2 están articuladas en sus dos extremos. Calcular:

      a/ Fuerzas en las barras 1 y 2.

      b/ Desplazamiento horizontal y vertical en el punto D

