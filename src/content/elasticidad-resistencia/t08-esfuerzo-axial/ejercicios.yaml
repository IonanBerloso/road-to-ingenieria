      <figcaption>

      El nudo C: las dos barras, cortadas y supuestas a tracción, tiran de él hacia la pared; P cuelga de C. La 1 forma 45° con la pared y con la 2. Dos incógnitas y dos ecuaciones: isostático.

      </figcaption>
