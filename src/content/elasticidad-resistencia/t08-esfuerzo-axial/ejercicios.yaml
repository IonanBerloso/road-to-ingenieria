      </figcaption>
      </figure>

      - **La 2 va de B a A**, hacia la izquierda; **la 3, de B a C**, hacia la
        derecha, y **la 1, de B a D**, a 30° por encima de la horizontal.
      - **Las tres se suponen a tracción**, tirando de B hacia su otro
        extremo.
      - **El apoyo móvil** da una reacción vertical $R$ y deja a B moverse en
        horizontal.

      **2. Incógnitas.** $N_1$, $N_2$, $N_3$ y $R$; y el movimiento $u$ de B,
      en horizontal, positivo hacia la derecha.

      **3. Ecuaciones.** El equilibrio de B:

      $$
      -N_2 + N_3 - N_1\cos 30^{\circ} = 0
      \qquad
      N_1\operatorname{sen} 30^{\circ} + R = 0
      $$

      Cuatro incógnitas y dos ecuaciones: el nudo es hiperestático (apuntes
      del tema 8, p. 4). Pero B solo tiene una forma de moverse, $u$ en
      horizontal, y con ella se escriben los tres alargamientos: basta la
      ecuación horizontal. Cada barra se alarga lo que su extremo B avanza en
      su dirección, contada desde el otro extremo (ec. 8.12). La 2 va de A a
      B, hacia la derecha; la 3, de C a B, hacia la izquierda, y la 1, de D a
      B, a 30° por debajo de la horizontal:

      $$
      \Delta L_2 = u
      \qquad
      \Delta L_3 = -u
      \qquad
      \Delta L_1 = u\cos 30^{\circ}
      $$

      Y la ley de cada barra, $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec.
      8.9), con la misma $EA$ en las tres y $\varepsilon_0 = \alpha\Delta T$
      solo en la 3. La 2 y la 3 miden $L$; la 1 llega de D a B, que están a
      $L$ en horizontal, y mide $L_1 = L/\cos 30^{\circ} = 2L/\sqrt{3}$:

      $$
      N_2 = \frac{EA}{L}\,u
      \qquad
      N_3 = -\frac{EA}{L}\,u - EA\alpha\Delta T
      \qquad
      N_1 = \frac{EA}{L_1}\,u\cos 30^{\circ} = \frac{3}{4}\,\frac{EA}{L}\,u
      $$

      **4. Resultados.** Con los tres axiles en la ecuación horizontal,

      $$
      -\frac{EA}{L}\,u - \frac{EA}{L}\,u - EA\alpha\Delta T - \frac{3\sqrt{3}}{8}\,\frac{EA}{L}\,u = 0
      \;\Longrightarrow\;
      u = -\frac{8}{16 + 3\sqrt{3}}\,\alpha\Delta T\,L = -0{,}3774\,\alpha\Delta T\,L
      $$

      Calentada, la 3 empuja B hacia la izquierda, hacia la pared.

      **Las fuerzas.**

      $$
      N_2 = -\frac{8}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}3774\,EA\alpha\Delta T
      $$

      $$
      N_3 = -\frac{8 + 3\sqrt{3}}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}6226\,EA\alpha\Delta T
      $$

      $$
      N_1 = -\frac{6}{16 + 3\sqrt{3}}\,EA\alpha\Delta T = -0{,}2831\,EA\alpha\Delta T
      $$

      La reacción del apoyo móvil es
      $R = -N_1\operatorname{sen} 30^{\circ} = 0{,}1415\,EA\alpha\Delta T$,
      hacia arriba: la 1, comprimida, empuja B hacia abajo.

      **5. Comprobación.** La 1 tiene que alargarse lo mismo calculada con su
      axil que proyectando el movimiento de B. Con su axil,
      $N_1L_1/(EA) = -0{,}28307 \cdot 1{,}15470\,\alpha\Delta T\,L = -0{,}3269\,\alpha\Delta T\,L$;
      proyectando,
      $u\cos 30^{\circ} = -0{,}37743 \cdot 0{,}86603\,\alpha\Delta T\,L = -0{,}3269\,\alpha\Delta T\,L$.
      El motor del curso, con B como nudo y el apoyo móvil como una
      deslizadera, da los mismos tres axiles, B quieto en vertical y la misma
      reacción.

      **Lo que dice el resultado.** Las tres están comprimidas: la 3, porque
      no la dejan dilatarse entera, y la 1 y la 2, porque B se les acerca. La
      3 se queda con algo más de seis décimas de la fuerza que tendría entre
      dos apoyos fijos. Y la $L$ no entra en las fuerzas, que es por lo que el
      enunciado no la necesita para ellas.

  # ── Propuesta A9 de clase · BD indeformable, dos barras y un resorte en D.
  - id: ejerm8-cla9-la-barra-bd-con-dos-barras-y-un-resorte
    titulo: La barra BD indeformable, con dos barras y un resorte en D
    fuente: >-
      Propuesta A9 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      y comprobada por un segundo camino (los momentos en B escritos a mano,
      la proyección del desplazamiento de D sobre cada barra y el equilibrio
      de las fuerzas que llegan a D). Se conserva la errata del original,
      «subren». El enunciado no da ni el material ni la sección de las
      barras: se toman iguales en las dos. En el original no se ve bien
      dónde se une la barra 2: mirada ampliada, llega al extremo D de
      BD por debajo, en el mismo punto que el resorte, y así casan las
      longitudes que da el texto. Las dos cosas las dice la nota. La figura
      está redibujada; la constante del resorte, que la figura llama k y el
      texto K, es la misma.
    nivel: practica
    antes:
      idea: |
        BD no se deforma y solo puede girar alrededor de B. Un único
        movimiento, lo que baja D, da los alargamientos de las dos barras y del
        resorte.
      formula: |
        $$
        \Delta L = \vec u\cdot\vec e
        $$

        Lo que se alarga una barra con un extremo fijo: el desplazamiento del
        otro extremo, proyectado sobre la dirección de la barra contada desde
        su apoyo (ec. 8.12).
      reconocer: |
        Antes de las cuentas, escribe la dirección de cada barra y del resorte
        desde su apoyo hasta D.
    enunciado: |
      Calcula las fuerzas axiales que subren las barras (1) y (2).
      Considerando a la barra BD indeformable.

      $$
      L_1 = L
      \qquad
      L_2 = \sqrt{3}\,L
      \qquad
      K = \frac{EA}{4L}
      $$

