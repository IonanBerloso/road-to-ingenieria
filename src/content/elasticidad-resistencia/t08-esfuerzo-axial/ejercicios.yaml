        <line x1="70" y1="80" x2="54.4" y2="89" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
        <line x1="70" y1="80" x2="85.6" y2="89" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
