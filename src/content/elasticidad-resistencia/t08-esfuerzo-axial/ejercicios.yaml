      </svg>
      <figcaption>

      La barra BD: las dos barras y el resorte, cortados y supuestos a tracción, tiran de D hacia su apoyo; P cuelga de D, y B da dos componentes. Cinco incógnitas y tres ecuaciones.

      </figcaption>
      </figure>

      - **BD es rígida y está articulada en B**: solo puede girar, y un giro
        pequeño mueve D en vertical, $v$, positivo hacia abajo.
      - **Las dos barras y el resorte se suponen a tracción**, tirando de D
        hacia su apoyo; $P$ cuelga de D.
      - **Cinco incógnitas y tres ecuaciones**: hiperestático de grado dos
        (apuntes del tema 8, p. 4). Pero una sola incógnita de movimiento,
        $v$, da los tres alargamientos.

      **2. Incógnitas.** $N_1$, $N_2$, la fuerza $F$ del resorte y las dos
      reacciones de B; y lo que baja D, $v$.

      **3. Ecuaciones.** **La geometría.** Con $L_1 = L$ a 30° de BD, A está
      a $L/2$ por encima de B y D, a $\tfrac{\sqrt{3}}{2}L$ de B. Con
      $L_2 = \sqrt{3}\,L$ a 30° de la vertical, la 2 llega a la misma
      distancia horizontal,
      $\sqrt{3}\,L\operatorname{sen} 30^{\circ} = \tfrac{\sqrt{3}}{2}L$, y C
      está a $\tfrac{3}{2}L$ por debajo de B. Las dos barras llegan al mismo
      punto D.

      **La compatibilidad.** Cada pieza se alarga lo que D avanza en su
      dirección, contada desde su apoyo (ec. 8.12). La 1 va de A a D, a 30°
      por debajo de la horizontal; la 2, de C a D, a 30° de la vertical; el
      resorte, del suelo a D, hacia arriba:

      $$
      \Delta L_1 = v\operatorname{sen} 30^{\circ} = \frac{v}{2}
      \qquad
      \Delta L_2 = -v\cos 30^{\circ} = -\frac{\sqrt{3}}{2}\,v
      \qquad
      \Delta L_k = -v
      $$

      **La ley de cada pieza**, $N = EA\,\Delta L/L_i$ (ec. 8.9, sin
      temperatura) en las barras y $F = K\,\Delta L_k$ en el resorte:

      $$
      N_1 = \frac{EA}{L}\,\frac{v}{2}
      \qquad
      N_2 = \frac{EA}{\sqrt{3}\,L}\left(-\frac{\sqrt{3}}{2}\,v\right) = -\frac{EA}{L}\,\frac{v}{2}
      \qquad
      F = -\frac{EA}{4L}\,v
      $$

      **Los momentos en B.** Todo actúa en D, a $\tfrac{\sqrt{3}}{2}L$ de B,
      y BD es horizontal: solo cuentan las componentes verticales. La 1 a
      tracción tira de D hacia A, hacia arriba; la 2 a tracción, hacia C,
      hacia abajo; el resorte a tracción, hacia el suelo:

      $$
      N_1\operatorname{sen} 30^{\circ} - N_2\cos 30^{\circ} - F - P = 0
      $$

      **4. Resultados.** Con las leyes de las tres piezas en los momentos,

      $$
      \frac{EA}{L}\,v\left(\frac{1}{4} + \frac{\sqrt{3}}{4} + \frac{1}{4}\right) = P
      \;\Longrightarrow\;
      v = 4\left(2 - \sqrt{3}\right)\frac{PL}{EA} = 1{,}0718\,\frac{PL}{EA}
      $$

      **Las fuerzas.**

      $$
      N_1 = 2\left(2 - \sqrt{3}\right)P = 0{,}5359\,P
      \qquad
      N_2 = -2\left(2 - \sqrt{3}\right)P = -0{,}5359\,P
      \qquad
      F = -\left(2 - \sqrt{3}\right)P = -0{,}2679\,P
      $$

      La 1 tira y la 2 empuja; el resorte, comprimido, empuja D hacia arriba
      con $0{,}2679\,P$.

      **5. Comprobación.** De la carga, la 1 sostiene $N_1/2$, la 2,
      $0{,}866\,|N_2|$, y el resorte, $|F|$:
      $0{,}2679 + 0{,}4641 + 0{,}2679 = 1$. El motor del curso, con BD como
      sólido rígido articulado en B y el resorte como una barra de rigidez
      $K$, da el mismo giro,
      $\theta = v/(\tfrac{\sqrt{3}}{2}L) = 1{,}2376\,P/(EA)$, y las mismas
      tres fuerzas. Su reacción horizontal en B, $0{,}1962\,P$, es la que
      piden las componentes horizontales de las barras:
      $N_1\cos 30^{\circ} + N_2\operatorname{sen} 30^{\circ} = (0{,}4641 - 0{,}2679)\,P = 0{,}1962\,P$:
      BD está comprimida.

      **Lo que dice el resultado.** La 1 tira y la 2 empuja con la misma
      fuerza: la 2 es $\sqrt{3}$ veces más larga, pero se acorta $\sqrt{3}$
      veces más de lo que se alarga la 1. Y el resorte no ayuda a la carga a
      bajar D: se acorta, y empuja hacia arriba.

  # ── Propuesta A10 de clase · el anillo que gira.
  - id: ejerm8-cla10-el-anillo-que-gira
    titulo: El anillo que gira con velocidad angular constante
    fuente: >-
      Propuesta A10 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (el anillo con la presión interior que equivale a la fuerza centrífuga
      de su pared) y comprobada por un segundo camino (el equilibrio de medio
      anillo, sumando la fuerza centrífuga de 20 000 trozos). El enunciado no
      da números ni el espesor de la pared: los pasos usan un ejemplo
      nuestro, que dice la nota. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        La pared trabaja en la dirección de la circunferencia. Para ver cuánto,
        se corta el anillo por un diámetro y se mira qué sostienen las dos
        secciones del corte.
      formula: |
        $$
        F = m\,\omega^{2} r
        $$

        La fuerza hacia el eje que necesita una masa $m$ para girar con
        $\omega$ constante a una distancia $r$ de él: la de la aceleración
        centrípeta.
      reconocer: |
        Antes de las cuentas, piensa qué le pasaría a un trozo de pared que se
        soltara del resto mientras el anillo gira.
    enunciado: |
      En un anillo con velocidad angular $\omega$ constante se quiere
      determinar $\sigma_1$ y $\varepsilon_1$.

      Datos:

      - El radio medio de la curvatura: $r_m$
      - Módulo de elasticidad: $E$
      - Altura del anillo: $L$
      - Peso específico: $\gamma$
      - Velocidad angular: $\omega$

      <figure class="figura-examen">
      <svg viewBox="50 22 236 190" role="img" width="236" height="190" aria-labelledby="ejerm8-cla10-el-anillo-que-gira-fig-t ejerm8-cla10-el-anillo-que-gira-fig-d">
      <title id="ejerm8-cla10-el-anillo-que-gira-fig-t">Un anillo que gira alrededor de su eje</title>
      <desc id="ejerm8-cla10-el-anillo-que-gira-fig-d">Un anillo cilíndrico corto, dibujado en perspectiva: dos bordes elípticos arriba, el de fuera y el de dentro, la pared de fuera en trazo continuo y la de dentro y el borde de abajo, en punteado. Su eje vertical, en trazo y punto, lleva arriba una flecha curva que gira a su alrededor, con el rótulo ω. A la derecha, una cota vertical L, la altura del anillo.</desc>
      <ellipse cx="150" cy="72" rx="84" ry="18" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <ellipse cx="150" cy="72" rx="66" ry="13" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="66" y1="72" x2="66" y2="170" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="234" y1="72" x2="234" y2="170" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M66 170 A84 18 0 0 0 234 170" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M66 170 A84 18 0 0 1 234 170" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="84" y1="72" x2="84" y2="170" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="216" y1="72" x2="216" y2="170" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <ellipse cx="150" cy="170" rx="66" ry="13" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="1.5 2.5"/>
      <line x1="150" y1="28" x2="150" y2="206" stroke="var(--ink)" stroke-width="0.9" stroke-dasharray="7 3 1.5 3"/>
      <path d="M146 40 A12 5 0 1 0 160 44" fill="none" stroke="var(--ink)" stroke-width="1"/>
      <polygon points="166,44.6 159.77,46.59 160.29,41.41" fill="var(--ink)"/>
      <text x="172" y="40" font-size="12" fill="var(--ink)" font-style="italic">ω</text>
      <line x1="260" y1="72" x2="260" y2="170" stroke="var(--faint)" stroke-width="0.9"/><polygon points="260,170 257.6,164 262.4,164" fill="var(--faint)"/><polygon points="260,72 262.4,78 257.6,78" fill="var(--faint)"/>
      <text x="266" y="125" font-size="12" fill="var(--ink)" font-style="italic">L</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: un anillo de altura L que gira con
      velocidad angular ω alrededor de su eje.

      </figcaption>
      </figure>

      **Notas nuestras.** $\sigma_1$ es la tensión en la dirección de la
      circunferencia, y $\varepsilon_1$, la deformación en esa dirección. El
      espesor de la pared, que el enunciado no da, se llama aquí $t$, y es
      pequeño frente a $r_m$. Para las cifras, un ejemplo nuestro, un anillo
      de acero: $\gamma = 78{,}5\ \text{kN/m}^{3}$, $g = 9{,}81\ \text{m/s}^{2}$,
      $r_m = 0{,}5\ \text{m}$, $L = 0{,}1\ \text{m}$, $t = 1\ \text{cm}$,
      $\omega = 200\ \text{rad/s}$ y $E = 210\ \text{GPa}$.
    pide: >-
      Con el ejemplo de la nota, σ1, en MPa, y ε1, en unidades de 10⁻⁴.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué carga hace trabajar a la pared del anillo?
        opciones:
          - texto: La fuerza centrífuga de su propia masa, hacia fuera, que hace con la pared lo que una presión interior
            correcta: true
            mensaje: |
              Eso es. Cada trozo de pared gira en una circunferencia de
              radio $r_m$, y para seguir en ella necesita una fuerza hacia
              el eje, $dm\,\omega^2 r_m$, que le dan los trozos de al lado
              tirando de él. Visto desde el anillo, es una carga repartida
              hacia fuera, como la presión interior de un anillo
              (apartado 8.5.2 de los apuntes): la pared trabaja a tracción
              en la dirección de la circunferencia.
          - texto: El peso propio, que comprime la pared en vertical a lo largo de su altura $L$
            mensaje: |
              El peso está, pero da una tensión vertical, no en la dirección
              de la circunferencia, y es pequeñísima frente a la de la
              rotación. $\sigma_1$ es la de la circunferencia, y la provoca
              el giro.
          - texto: Ninguna, porque con la velocidad angular constante no hay aceleración
            mensaje: |
              Con $\omega$ constante no hay aceleración angular, pero sí la
              centrípeta, $\omega^2 r_m$, hacia el eje: cada trozo de pared
              tiende a seguir recto, y el resto del anillo tiene que tirar
              de él hacia dentro para que gire.
          - texto: Una presión exterior, porque cada trozo de pared es empujado hacia el eje
            mensaje: |
              Es al revés. Cada trozo tiende a seguir recto, alejándose del
              eje, y la pared lo retiene tirando de él: tracción, como con
              presión interior (ec. 8.18), y no compresión, como con
              presión exterior (ec. 8.19).

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **medio anillo, cortado por un
          diámetro**.
        comprueba:
          - punto: |
              **En cada sección del corte, $\sigma_1$ por su área, $tL$.**
            porque: |
              Es lo que la otra mitad hace sobre esta; se supone a tracción.
          - punto: |
              **Por toda la pared, la fuerza centrífuga de cada trozo, hacia
              fuera.**
            porque: |
              Visto desde el anillo que gira, cada trozo la sufre: es la carga.
          - punto: |
              **Nada más: ni apoyos ni otras cargas.**
            porque: |
              El enunciado no da ninguna: el anillo solo gira.
        figura: |
          <svg viewBox="0 10 270 176" role="img" width="270" height="176" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Medio anillo, cortado por un diámetro</title>
            <desc id="dsl-d">La mitad de arriba del anillo, cortada por un diámetro horizontal. En cada una de las dos secciones del corte, una fuerza hacia abajo, sigma 1 por t por L, la tensión de la circunferencia por el área de la sección. Repartidas por todo el medio anillo, flechas rojas hacia fuera, en dirección radial: la fuerza centrífuga de cada trozo de pared. Un radio a trazos marca un trozo a un ángulo phi del corte.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M44 130 A86 86 0 0 1 216 130 H204 A74 74 0 0 0 56 130 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="130" y1="130" x2="170" y2="60.7" stroke="var(--faint)" stroke-width="0.7"/>
            <line x1="130" y1="130" x2="204" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
            <path d="M156 130 A26 26 0 0 0 143 107.5" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="160" y="122" font-size="10" fill="var(--ink)">φ</text>
            <line x1="50" y1="134" x2="50" y2="168" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="56" y="166" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"> tL</tspan></text>
            <line x1="210" y1="134" x2="210" y2="168" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="216" y="166" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"> tL</tspan></text>
            <line x1="206.2" y1="86" x2="225.3" y2="75" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="225" y="75" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="174" y1="53.8" x2="185" y2="34.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="192" y="36" font-size="10" text-anchor="start" fill="var(--flag)">dm ω²r<tspan font-size="7.5" dy="2.5">m</tspan></text>
            <line x1="130" y1="42" x2="130" y2="20" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="130" y="20" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="86" y1="53.8" x2="75" y2="34.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="75" y="34" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="53.8" y1="86" x2="34.7" y2="75" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="34" y="75" font-size="10" text-anchor="start" fill="var(--flag)"></text>
          </svg>

      - tipo: calcular
        titulo: La tensión en la circunferencia
        pregunta: |
          Con el ejemplo de la nota, ¿cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '80.02'
          tolerancia: 0.1
          formato: un número con signo, en MPa
        distractores:
          - valor: '785'
            mensaje: |
              Has usado el peso específico $\gamma$ como si fuera la
              densidad. La fuerza centrífuga va con la masa:
              $\rho = \gamma/g$, en kg/m³.
          - valor: '160.04'
            mensaje: |
              Es el doble. La fuerza centrífuga de medio anillo la sostienen
              las dos secciones del corte, una a cada lado: $2\sigma_1 tL$,
              y no $\sigma_1 tL$.
          - valor: '40.01'
            mensaje: |
              Es la mitad: te falta el 2 de la integral. La suma de
              $\operatorname{sen}\varphi$ entre 0 y π vale 2, y ese 2 se va
              con el de las dos secciones del corte.
          - valor: '320.08'
            mensaje: |
              Has usado el diámetro, 1 m, en lugar del radio medio. Con el
              radio al cuadrado, el error se multiplica por cuatro.
        pista: |
          Corta el anillo por un diámetro. La fuerza centrífuga de la mitad,
          sumada en la dirección perpendicular al corte, la sostienen las
          dos secciones de pared, $2\sigma_1 tL$. Cada trozo, de masa
          $\rho\,t\,L\,r_m\,d\varphi$, tira con $dm\,\omega^2 r_m$.
        desarrollo: |
          $$
          \rho = \frac{\gamma}{g} = \frac{78\,500\ \text{N/m}^{3}}{9{,}81\ \text{m/s}^{2}} = 8002\ \text{kg/m}^{3}
          $$

          $$
          2\sigma_1 tL = \int_0^{\pi} \rho\,t\,L\,r_m\,\omega^2 r_m \operatorname{sen}\varphi\,d\varphi = 2\rho\,t\,L\,\omega^2 r_m^2
          \;\Longrightarrow\;
          \sigma_1 = \rho\,\omega^2 r_m^2
          $$

          $$
          \sigma_1 = 8002 \cdot 200^{2} \cdot 0{,}5^{2}\ \text{Pa} = 80{,}02 \cdot 10^{6}\ \text{Pa}
          $$

          Es decir, 80,02 MPa, a tracción.

      - tipo: calcular
        titulo: La deformación en la circunferencia
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '3.810'
          tolerancia: 0.005
          formato: un número con signo, ε1 dividido entre 10⁻⁴
        distractores:
          - valor: '37.38'
            mensaje: |
              Viene de usar $\gamma$ como si fuera la densidad: la tensión te
              sale casi diez veces mayor, y la deformación con ella. La
              fuerza centrífuga va con la masa, $\rho = \gamma/g$.
          - valor: '7.621'
            mensaje: |
              Es el doble: viene de la tensión que sostendría una sola
              sección del corte. La fuerza centrífuga de medio anillo la
              sostienen las dos.
          - valor: '0.381'
            mensaje: |
              Es $\sigma_1$ en MPa entre $E$ en GPa, $80{,}02/210$, sin
              pasarlos a las mismas unidades: eso son milésimas. En
              unidades de $10^{-4}$, multiplica por 10.
          - valor: '1.905'
            mensaje: |
              Viene de la tensión sin el 2 de la integral, 40,01 MPa: la suma
              de $\operatorname{sen}\varphi$ entre 0 y π vale 2. Con
              $\sigma_1 = 80{,}02$ MPa, $\varepsilon_1 = \sigma_1/E$ es el
              doble.
        pista: |
          Sin cambio de temperatura, $\varepsilon_1 = \sigma_1/E$, con las
          dos en pascales.
        desarrollo: |
          $$
          \varepsilon_1 = \frac{\sigma_1}{E} = \frac{80{,}02 \cdot 10^{6}}{210 \cdot 10^{9}} = 3{,}810 \cdot 10^{-4}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada trozo de pared, de masa $dm = \rho\,t\,L\,r_m\,d\varphi$,
              necesita una fuerza hacia el eje, $dm\,\omega^2 r_m$, para
              seguir girando.
          - texto: >-
              Cortando el anillo por un diámetro, la fuerza centrífuga de la
              mitad, en la dirección perpendicular al corte, suma
              $2\rho\,t\,L\,\omega^2 r_m^2$.
          - texto: >-
              La sostienen las dos secciones del corte,
              $2\sigma_1 tL = 2\rho\,t\,L\,\omega^2 r_m^2$, y
              $\sigma_1 = \rho\,\omega^2 r_m^2$.
          - texto: >-
              Con $\rho = \gamma/g$, $\sigma_1 = \gamma\,\omega^2 r_m^2/g$, y
              $\varepsilon_1 = \sigma_1/E$.
          - texto: >-
              Cuanto más fina la pared, mayor la tensión, como en un depósito
              con presión: $\sigma_1$ crece con $r_m/t$.
            trampa: true
            mensaje: |
              En un depósito la presión no depende del espesor. Aquí la
              carga es la fuerza centrífuga de la propia pared, que crece
              con $t$ igual que la sección que la sostiene: el espesor se
              va, y la altura $L$ también.
    resolucion: |
      **1. El sólido libre.** Medio anillo, cortado por un diámetro. Se mide
      el ángulo $\varphi$ desde el corte.

      <figure class="figura-examen">
      <svg viewBox="0 10 270 176" role="img" width="405" height="264" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Medio anillo, cortado por un diámetro</title>
        <desc id="dsl-d">La mitad de arriba del anillo, cortada por un diámetro horizontal. En cada una de las dos secciones del corte, una fuerza hacia abajo, sigma 1 por t por L, la tensión de la circunferencia por el área de la sección. Repartidas por todo el medio anillo, flechas rojas hacia fuera, en dirección radial: la fuerza centrífuga de cada trozo de pared. Un radio a trazos marca un trozo a un ángulo phi del corte.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M44 130 A86 86 0 0 1 216 130 H204 A74 74 0 0 0 56 130 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="130" y1="130" x2="170" y2="60.7" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="130" y1="130" x2="204" y2="130" stroke="var(--faint)" stroke-width="0.7"/>
        <path d="M156 130 A26 26 0 0 0 143 107.5" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="160" y="122" font-size="10" fill="var(--ink)">φ</text>
        <line x1="50" y1="134" x2="50" y2="168" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="56" y="166" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"> tL</tspan></text>
        <line x1="210" y1="134" x2="210" y2="168" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="216" y="166" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"> tL</tspan></text>
        <line x1="206.2" y1="86" x2="225.3" y2="75" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="225" y="75" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="174" y1="53.8" x2="185" y2="34.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="192" y="36" font-size="10" text-anchor="start" fill="var(--flag)">dm ω²r<tspan font-size="7.5" dy="2.5">m</tspan></text>
        <line x1="130" y1="42" x2="130" y2="20" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="130" y="20" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="86" y1="53.8" x2="75" y2="34.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="75" y="34" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="53.8" y1="86" x2="34.7" y2="75" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="34" y="75" font-size="10" text-anchor="start" fill="var(--flag)"></text>
      </svg>
      <figcaption>

      Medio anillo: en cada sección del corte, la tensión de la circunferencia, supuesta a tracción, por su área; y, por toda la pared, la fuerza centrífuga de cada trozo, hacia fuera.

      </figcaption>
      </figure>

      - **Con $\omega$ constante**, cada trozo de pared describe una
        circunferencia de radio $r_m$ y necesita una fuerza hacia el eje,
        $dm\,\omega^2 r_m$. Se la dan los trozos de al lado, tirando de él: la
        pared trabaja a tracción en la dirección de la circunferencia.
      - **Visto desde el anillo que gira**, es lo mismo que si cada trozo
        sufriera hacia fuera su fuerza centrífuga: una carga repartida y
        radial, como una presión interior.
      - **En cada sección del corte**, de área $tL$, la fuerza $\sigma_1 tL$,
        supuesta a tracción.

      **2. Incógnitas.** $\sigma_1$ y $\varepsilon_1$.

      **3. Ecuaciones.** Un trozo de pared de ángulo $d\varphi$ tiene la masa
      $dm = \rho\,t\,L\,r_m\,d\varphi$, y su fuerza centrífuga, en la
      dirección perpendicular al corte, es
      $dm\,\omega^2 r_m \operatorname{sen}\varphi$. La de toda la mitad la
      sostienen las dos secciones del corte:

      $$
      2\sigma_1 tL = \int_0^{\pi} \rho\,t\,L\,\omega^2 r_m^2 \operatorname{sen}\varphi\,d\varphi = 2\rho\,t\,L\,\omega^2 r_m^2
      $$

      Y la deformación, sin cambio de temperatura, $\varepsilon_0 = 0$ en la
      ec. 8.18 (p. 11): $\varepsilon_1 = \sigma_1/E$.

      **4. Resultados.**

      $$
      \sigma_1 = \rho\,\omega^2 r_m^2 = \frac{\gamma\,\omega^2 r_m^2}{g}
      \qquad
      \varepsilon_1 = \frac{\gamma\,\omega^2 r_m^2}{gE}
      $$

      La circunferencia media crece en esa proporción, y el radio también:
      $\Delta r_m = \varepsilon_1 r_m$.

      **El ejemplo.** Con
      $\rho = 78\,500\ \text{N/m}^{3} / 9{,}81\ \text{m/s}^{2} = 8002\ \text{kg/m}^{3}$:

      $$
      \sigma_1 = 8002 \cdot 200^{2} \cdot 0{,}5^{2}\ \text{Pa} = 80{,}02 \cdot 10^{6}\ \text{Pa}
      $$

      $$
      \varepsilon_1 = \frac{80{,}02 \cdot 10^{6}}{210 \cdot 10^{9}} = 3{,}810 \cdot 10^{-4}
      $$

      Es decir, 80,02 MPa a tracción, y el radio medio crece
      $3{,}810 \cdot 10^{-4} \cdot 500\ \text{mm} = 0{,}1905\ \text{mm}$.

      **5. Comprobación.** Es la ec. 8.18 de los apuntes (p. 11),
      $\sigma = p\,r_1/t$, con la presión que equivale a la fuerza
      centrífuga, la de cada trozo entre su área media,
      $p = \rho\,t\,\omega^2 r_m$, y con $r_m$ en lugar de $r_1$, que en un
      anillo delgado es lo mismo. El motor del curso resuelve el anillo con
      esa presión; por otro lado, se suma a mano la fuerza centrífuga de
      20 000 trozos del medio anillo, cada uno con su
      $\operatorname{sen}\varphi$, y se divide entre las dos secciones del
      corte. Los dos dan 80,02 MPa, y con la pared de 3 cm en lugar de 1 cm,
      otra vez lo mismo.

      **Lo que dice el resultado.** La pared más gruesa tiene más masa, pero
      también más sección: ni $t$ ni $L$ entran, y por eso el enunciado no da
      el espesor. Lo que manda es la velocidad del borde, $\omega r_m$: al
      doble de vueltas, cuatro veces la tensión.

  # ── Propuesta A11 de clase · la pala que gira.
  - id: ejerm8-cla11-la-pala-que-gira
    titulo: La pala de un aerogenerador que gira con velocidad angular constante
    fuente: >-
      Propuesta A11 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la integral de la ec. 8.8) y comprobada por un segundo camino (la pala
      partida en 4000 tramos, con la fuerza centrífuga de cada uno en sus
      nudos). El enunciado no da números: el último paso usa un ejemplo
      nuestro, que dice la nota. La figura está redibujada.
    nivel: practica
    antes:
      idea: |
        La pala gira, y cada trozo necesita una fuerza hacia el eje para seguir
        girando, mayor cuanto más lejos está. Esa fuerza se la da la pala
        misma, a través de sus secciones.
      formula: |
        $$
        \Delta L = \int_0^L \frac{N}{EA}\,dx
        $$

        El alargamiento de una barra cuyo axil cambia a lo largo de ella (ec.
        8.8, sin término térmico).
      reconocer: |
        Antes de las cuentas, corta la pala a una distancia cualquiera del eje
        y mira qué retiene esa sección.
    enunciado: |
      La pala de un aerogenerador gira a velocidad angular constante
      $\omega$. Calcula el alargamiento que va a tener. (despreciando el
      peso propio).

      Datos:

      - Sección de la pala: $A$
      - Módulo de elasticidad: $E$
      - Longitud de la pala: $L$
      - Densidad: $\rho$
      - Velocidad angular: $\omega$

      <figure class="figura-examen">
      <svg viewBox="16 24 360 144" role="img" width="360" height="144" aria-labelledby="ejerm8-cla11-la-pala-que-gira-fig-t ejerm8-cla11-la-pala-que-gira-fig-d">
      <title id="ejerm8-cla11-la-pala-que-gira-fig-t">Una pala recta articulada en un eje de la pared, que gira</title>
      <desc id="ejerm8-cla11-la-pala-que-gira-fig-d">A la izquierda, una pared rayada con una orejeta y un pasador. De la orejeta sale hacia la derecha una pala recta, larga y delgada, de sección constante. Una flecha curva alrededor del pasador indica que la pala gira con velocidad angular ω.</desc>
      <defs><pattern id="ejerm8-cla11-la-pala-que-gira-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <rect x="26" y="42" width="14" height="108" fill="url(#ejerm8-cla11-la-pala-que-gira-r)"/><line x1="40" y1="42" x2="40" y2="150" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M40 76 L80 76 A20 20 0 0 1 80 116 L40 116 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <circle cx="80" cy="96" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="98" y="89" width="268" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <path d="M118.17 144.86 A62 62 0 0 0 119.85 48.51" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <polygon points="116.25,45.51 123.54,47.71 119.69,52.3" fill="var(--ink)"/>
      <text x="130" y="46" font-size="12" fill="var(--ink)" font-style="italic">ω</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la pala, articulada en su raíz, gira con
      velocidad angular ω alrededor del eje que pasa por ella.

      </figcaption>
      </figure>

      **Notas nuestras.** La pala se toma como una barra recta de sección
      $A$ constante que gira alrededor de un eje que pasa por su raíz; $L$
      va del eje a la punta, y $x$ es la distancia al eje. Los axiles se
      preguntan en unidades de $\rho A\omega^2L^2$, y el alargamiento, en
      unidades de $\rho\omega^2L^3/E$. Para la última cifra, un ejemplo
      nuestro, una pala de fibra de vidrio: $\rho = 1900\ \text{kg/m}^{3}$,
      $E = 40\ \text{GPa}$, $L = 40\ \text{m}$ y $\omega = 2\ \text{rad/s}$.
    pide: >-
      El axil a media pala, en unidades de ρAω²L², y el alargamiento de la
      pala, en unidades de ρω²L³/E y, con el ejemplo de la nota, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es el axil a lo largo de la pala?
        opciones:
          - texto: Máximo junto al eje y nulo en la punta, porque cada sección sostiene la fuerza centrífuga de lo que tiene por fuera
            correcta: true
            mensaje: |
              Eso es. La punta no tiene nada por fuera que retener. Una
              sección a la distancia $x$ del eje tiene que retener el trozo
              entre ella y la punta, que tira hacia fuera con su fuerza
              centrífuga; la de la raíz retiene la pala entera. Toda la pala
              está a tracción.
          - texto: Constante, porque la sección y la velocidad angular no cambian
            mensaje: |
              La sección es la misma, pero lo que cada una sostiene no: la de
              la raíz retiene toda la pala, y una cerca de la punta, solo el
              trocito de fuera.
          - texto: Máximo en la punta, que es la que gira más deprisa
            mensaje: |
              La punta es la que va más deprisa, pero no tiene nada por fuera
              que retener: su axil es cero. El axil de una sección es la
              fuerza centrífuga de lo que queda entre ella y la punta.
          - texto: Nulo junto al eje, porque allí la velocidad es cero
            mensaje: |
              Allí la velocidad es cero, pero esa sección es la que retiene
              la pala entera: su axil es el mayor.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el trozo de pala que queda por
          fuera de una sección cualquiera**.
        comprueba:
          - punto: |
              **$N$ en el corte, tirando del trozo hacia el eje.**
            porque: |
              Se supone a tracción: es lo que la parte de dentro hace sobre la
              de fuera.
          - punto: |
              **La fuerza centrífuga de cada trozo, hacia fuera, mayor cuanto
              más lejos del eje.**
            porque: |
              Visto desde la pala que gira, cada trozo la sufre, y crece con su
              distancia al eje.
          - punto: |
              **La punta, sin nada.**
            porque: |
              La pala acaba ahí: no hay apoyo ni carga.
        figura: |
          <svg viewBox="0 58 250 100" role="img" width="250" height="100" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El trozo de pala que queda por fuera de una sección</title>
            <desc id="dsl-d">La pala, horizontal, que gira alrededor de un eje en su raíz, a la izquierda. A trazos, el trozo de pala entre el eje y una sección a la distancia x. Del corte a la punta, el trozo que queda por fuera, con N en el corte tirando hacia el eje y, encima, cuatro flechas rojas hacia fuera, cada vez más largas hacia la punta: la fuerza centrífuga de cada trozo. Cotas: x del eje al corte y L del eje a la punta.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M120 94 H230 V106 H120 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <circle cx="30" cy="100" r="3.4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
            <path d="M30 94 H120 M30 106 H120" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M20 112 A15.6 15.6 0 1 1 40 112" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#dsl-fe)"/>
