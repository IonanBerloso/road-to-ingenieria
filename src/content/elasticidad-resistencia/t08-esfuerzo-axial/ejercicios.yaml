          <text x="204.73" y="74.79" font-size="12" fill="var(--faint)">C''</text>
          <text x="81.8" y="181" font-size="12" fill="var(--ink)" text-anchor="end">M</text>
          <text x="208.2" y="184" font-size="12" fill="var(--ink)" text-anchor="end">N</text>
          <text x="103.08" y="212.82" font-size="12" fill="var(--live)">M'</text>
          <text x="247.64" y="212.82" font-size="12" fill="var(--live)" text-anchor="end">N'</text>
