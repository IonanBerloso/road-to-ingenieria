      <figcaption>

      La barra ABC y el nudo E: las cinco barras, cortadas y supuestas a tracción, tiran de cada uno hacia su otro extremo; P actúa en B. BE aparece en los dos, con el mismo axil, y está calentada, sin flecha.

      </figcaption>
      </figure>

      - **ABC es rígida**, y le llegan AD, BE y CF, las tres verticales.
        **E es un nudo** con BE, vertical, y DE y EF, que bajan a D y a F a
        30° de la horizontal (forman 120° entre sí, dos a dos).
      - **Las cinco barras se suponen a tracción**, tirando de ABC y de E
        hacia su otro extremo.
      - **ABC da tres ecuaciones de equilibrio y E, dos**; pero en la
        horizontal de ABC no entra ninguna fuerza, y queda 0 = 0. Cuatro
        ecuaciones útiles para cinco axiles: hiperestático de grado uno
        (apuntes del tema 8, p. 4).

      **2. Incógnitas.** Los cinco axiles, que la simetría deja en tres,
      $N_{AD} = N_{CF}$, $N_{BE}$ y $N_{DE} = N_{EF}$; y dos movimientos. La
      ecuación vacía avisa de otra cosa: nada impide que ABC se desplace un
      poco de lado, porque las tres barras que la sujetan son verticales. Con
      la carga en B y todo simétrico respecto de la vertical de B, nada la
      empuja de lado, y se toma que ABC sube o baja sin girar, $v$ positivo
      hacia abajo, y que E se mueve en vertical, $w$ positivo hacia abajo.

      **3. Ecuaciones.** **La compatibilidad.** Cada barra se alarga lo que
      su extremo móvil avanza en su dirección, contada desde el otro extremo
      (ec. 8.12). AD y CF van del suelo a ABC y se acortan lo que baja ABC.
      BE va de E a B: se alarga lo que E baja más que B. DE va de D a E, hacia
      arriba y a 30° de la horizontal, y se acorta
      $w\operatorname{sen} 30^{\circ}$:

      $$
      \Delta L_{AD} = \Delta L_{CF} = -v
      \qquad
      \Delta L_{BE} = w - v
      \qquad
      \Delta L_{DE} = \Delta L_{EF} = -\frac{w}{2}
      $$

      **La ley de cada barra**, $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec.
      8.9), con la misma $EA$ en las cinco y $\varepsilon_0 = \alpha\Delta T$
      solo en BE. AD y CF miden $1{,}5L$; BE, DE y EF, $L$:

      $$
      N_{AD} = -\frac{EA}{1{,}5L}\,v
      \qquad
      N_{BE} = \frac{EA}{L}\,(w - v) - EA\alpha\Delta T
      \qquad
      N_{DE} = -\frac{EA}{2L}\,w
      $$

      **El equilibrio.** En E, las componentes verticales de DE y EF suman
      $2N_{DE}\operatorname{sen} 30^{\circ} = N_{DE}$, y las horizontales se
      anulan; en ABC, las tres barras tiran hacia abajo si están a tracción:

      $$
      N_{BE} = N_{DE}
      \qquad
      2N_{AD} + N_{BE} = -P
      $$

      **4. Resultados.** Con las leyes metidas, dos ecuaciones en $v$ y $w$:

      $$
      v - \tfrac{3}{2}\,w = -\alpha\Delta T\,L
      \qquad
      \tfrac{4}{3}\,v + \tfrac{1}{2}\,w = \frac{PL}{EA}
      $$

      $$
      w = \frac{2}{5}\,\frac{PL}{EA} + \frac{8}{15}\,\alpha\Delta T\,L
      \qquad
      v = \frac{3}{5}\,\frac{PL}{EA} - \frac{1}{5}\,\alpha\Delta T\,L
      $$

      **Las fuerzas.**

      $$
      N_{AD} = N_{CF} = -\frac{2}{5}\,P + \frac{2}{15}\,EA\alpha\Delta T
      = -0{,}4\,P + 0{,}1333\,EA\alpha\Delta T
      $$

      $$
      N_{BE} = N_{DE} = N_{EF} = -\frac{1}{5}\,P - \frac{4}{15}\,EA\alpha\Delta T
      = -0{,}2\,P - 0{,}2667\,EA\alpha\Delta T
      $$

      **El desplazamiento de E**, hacia abajo, en la vertical de B:

      $$
      w_E = \frac{2}{5}\,\frac{PL}{EA} + \frac{8}{15}\,\alpha\Delta T\,L
      = 0{,}4\,\frac{PL}{EA} + 0{,}5333\,\alpha\Delta T\,L
      $$

      **5. Comprobación.** Con la carga, las reacciones de D y F tienen que
      sumar $P$: AD y CF llevan $0{,}4\,P$ cada una, y DE y EF, $0{,}2\,P$
      cada una con la mitad en vertical,
      $0{,}4 + 0{,}4 + 2 \cdot 0{,}2 \cdot 0{,}5 = 1$. Con solo la
      temperatura, suman cero:
      $2 \cdot 0{,}1333 - 2 \cdot 0{,}2667 \cdot 0{,}5 = 0$. El motor del
      curso, por su parte, ve ABC como un mecanismo, porque nada la sujeta en
      horizontal; con un apoyo en B que solo le impide irse de lado (una guía
      vertical), que se comprueba que no trabaja, da los mismos cinco axiles,
      ABC sin girar y E quieto en horizontal.

      **Lo que dice el resultado.** Con la carga, las cinco empujan, y no a
      partes iguales: AD y CF llevan el doble que BE, porque E baja con ella y
      BE se acorta menos. Calentar BE la comprime a ella y a DE y EF, que la
      frenan por debajo, y estira AD y CF, que la frenan por arriba: BE sube
      ABC $\tfrac{1}{5}\alpha\Delta T\,L$. De la dilatación libre de BE,
      $\alpha\Delta T\,L$, ocho quinceavos van hacia abajo, en E, y tres
      quinceavos hacia arriba, en ABC; los cuatro quinceavos que faltan se
      los quita la compresión.

  # ── Ejemplo resuelto del curso · el tirante de un caballete.
  - id: ejerm8-caballete-el-tirante-y-el-desplazamiento-de-b
    titulo: El caballete, del alargamiento del tirante al desplazamiento de B
    fuente: >-
      Ejemplo resuelto del curso, «Deformación del tirante de un caballete» ·
      Tema 8, «Esfuerzo axial simple» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material trae la resolución, en letras, y la
      nuestra la sigue paso a paso, con sus ecuaciones (1) a (3). Los
      números del ejemplo son nuestros, y cada cifra está calculada con el
      motor del curso (las dos patas como sólidos rígidos articulados en C)
      y comprobada por un segundo camino (la fórmula final del ejemplo y el
      movimiento de C escrito a mano). El enunciado es el primer párrafo
      del ejemplo; los tres pasos del proceso de deformación y las
      observaciones que lo siguen están en nuestra resolución. La
      observación 1 del original nombra «CC' y CC''»: por su figura, los
      segmentos iguales son CC′ y C″C′, y así se escribe aquí. La figura
      está redibujada: la del original lleva además la posición deformada,
      que pasa a la resolución.
    nivel: practica
    antes:
      idea: |
        Las patas son rígidas: solo pueden girar o trasladarse. El movimiento
        de todo el caballete sale de cómo encajan esos movimientos en C, y el
        alargamiento del tirante, de cómo se mueven M y N.
      formula: |
        $$
        u = d\,\beta
        $$

        Lo que se mueve un punto de un sólido rígido que gira un ángulo
        pequeño β alrededor de otro, a una distancia $d$: en perpendicular a
        la recta que los une (apartado 8.4, p. 7).
      reconocer: |
        Antes de las cuentas, mira cómo puede moverse cada pata: qué la sujeta
        y qué le deja hacer.
    enunciado: |
      Dado que el sistema de la figura es isostático, se ha determinado la
      fuerza que soporta la barra MN y el alargamiento correspondiente se
      denomina $\delta$, siendo conocido. Analizando el proceso de
      deformación, se desea determinar el desplazamiento $\delta_B$ del
      punto B.

