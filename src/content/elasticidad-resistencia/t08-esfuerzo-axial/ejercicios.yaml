        <circle cx="110" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="102" y="76" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">B</text>
        <circle cx="190" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="198" y="54" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">C</text>
        <circle cx="290" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="280" y="104" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">E</text>
