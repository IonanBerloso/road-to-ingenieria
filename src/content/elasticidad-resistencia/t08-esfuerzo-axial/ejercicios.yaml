      <figcaption>

      Redibujada del enunciado, con sus cotas: ABC, rígida y horizontal; D
      y F, articulaciones fijas en el suelo; E, el nudo en el que se juntan
      BE, DE y EF.

      </figcaption>
      </figure>

      **Notas nuestras.** Todo es simétrico respecto de la vertical de B: se
      toma que ABC sube o baja sin girar y que E solo se mueve en vertical.
      Solo BE cambia de temperatura, y $\Delta T > 0$ es un calentamiento.
      Cada axil se escribe $N = a\,P + b\,EA\alpha\Delta T$,
      positivo a tracción, y el desplazamiento de E,
      $c\,PL/(EA) + d\,\alpha\Delta T\,L$, positivo hacia abajo; en los pasos
      se pregunta por los coeficientes.
    pide: >-
      Los axiles de AD y de BE con solo la carga, en unidades de P; el de BE
      con solo la temperatura, como coeficiente de EAαΔT, y el desplazamiento
      vertical de E con cada una de las dos, en unidades de PL/(EA) y de
      αΔT·L.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay cinco axiles. Contando las ecuaciones de equilibrio de ABC y
          de E, ¿cuántas ecuaciones de compatibilidad hacen falta?
        opciones:
          - texto: Una, porque la ecuación horizontal de ABC queda 0 = 0 y la estática solo da cuatro ecuaciones útiles
            correcta: true
            mensaje: |
              Eso es. ABC da tres ecuaciones y E, dos, pero las tres barras
              que llegan a ABC son verticales: en su ecuación horizontal no
              entra ninguna fuerza. Quedan cuatro ecuaciones para cinco
              axiles: hiperestático de grado uno (apuntes del tema 8, p. 4),
              y falta una de compatibilidad.
          - texto: Ninguna, porque hay cinco axiles y cinco ecuaciones, tres de ABC y dos de E
            mensaje: |
              Cuenta otra vez la horizontal de ABC. AD, BE y CF son
              verticales y ninguna tiene componente horizontal, así que esa
              ecuación queda 0 = 0. Quedan cuatro ecuaciones útiles para
              cinco axiles.
          - texto: Dos, porque la temperatura de BE añade una incógnita
            mensaje: |
              La temperatura no añade incógnitas: solo un término en la ley
              de BE, $\Delta L = NL/(EA) + \varepsilon_0 L$ (ec. 8.9). El
              grado sale de contar axiles y ecuaciones útiles de equilibrio.
          - texto: Tres, una por cada barra vertical que llega a ABC
            mensaje: |
              Las barras no piden una ecuación cada una. Hacen falta tantas
              como axiles sobran sobre las ecuaciones útiles de equilibrio:
              cinco menos cuatro.

      - tipo: calcular
        titulo: La barra AD con solo la carga
        pregunta: |
          Sin cambio de temperatura ($\Delta T = 0$), ¿cuánto vale
          $N_{AD}$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.4'
          tolerancia: 0.002
          formato: un número con signo, NAD dividido entre P
        distractores:
          - valor: '-0.3333'
            mensaje: |
              Has repartido $P$ a partes iguales entre las tres barras
              verticales. Se reparten según lo rígida que sea cada una: AD y
              CF van al suelo, y BE va a E, que se mueve con ella. BE
              resulta más blanda y se lleva menos.
          - valor: '-0.5'
            mensaje: |
              Es lo que llevaría cada una sin BE. BE se acorta cuando ABC
              baja, porque E baja menos que B, y se lleva su parte.
          - valor: '-0.2857'
            mensaje: |
              Has tomado E fijo. E baja, porque DE y EF se acortan, y BE se
              acorta menos de lo que baja ABC: BE se lleva menos de lo que
              crees, y AD y CF, más.
          - valor: '-0.3636'
            mensaje: |
              Has tomado que DE y EF se acortan lo que baja E, sin proyectar.
              Forman 30° con la horizontal y se acortan
              $w\operatorname{sen} 30^{\circ}$: E cede más, y BE se lleva
              menos.
          - valor: '-0.4286'
            mensaje: |
              Has tomado AD y CF de longitud $L$. Van del suelo a ABC y miden
              $1{,}5L$: son más blandas y se llevan menos.
        pista: |
          ABC baja $v$ y E baja $w$. AD y CF se alargan $-v$; BE, $w - v$;
          DE y EF, $-w\operatorname{sen} 30^{\circ}$. El equilibrio de E da
          $N_{BE} = N_{DE}$, y el de ABC, $2N_{AD} + N_{BE} = -P$.
        desarrollo: |
          $$
          N_{AD} = -\frac{EA}{1{,}5L}\,v
          \qquad
          N_{BE} = \frac{EA}{L}\,(w - v)
          \qquad
          N_{DE} = -\frac{EA}{2L}\,w
          $$

          $$
          N_{BE} = N_{DE}
          \;\Longrightarrow\;
          v = \tfrac{3}{2}\,w
          \qquad
          2N_{AD} + N_{BE} = -P
          \;\Longrightarrow\;
          \tfrac{5}{2}\,\frac{EA}{L}\,w = P
          $$

          $$
          w = \frac{2}{5}\,\frac{PL}{EA}
          \qquad
          v = \frac{3}{5}\,\frac{PL}{EA}
          \qquad
          N_{AD} = -\frac{2}{5}\,P = -0{,}4\,P
          $$

      - tipo: calcular
        titulo: La barra BE con solo la carga
        pregunta: |
          ¿Y $N_{BE}$, con solo la carga, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.002
          formato: un número con signo, NBE dividido entre P
        distractores:
          - valor: '-0.3333'
            mensaje: |
              Has repartido $P$ a partes iguales entre las tres barras
              verticales. BE va a E, que se mueve con ella, y resulta más
              blanda que AD y CF.
          - valor: '-0.4286'
            mensaje: |
              Has tomado E fijo. E baja, porque DE y EF se acortan, y BE se
              acorta menos de lo que baja ABC.
          - valor: '-0.2727'
            mensaje: |
              Has tomado que DE y EF se acortan lo que baja E, sin proyectar.
              Se acortan $w\operatorname{sen} 30^{\circ}$, y E cede más.
          - valor: '-0.1429'
            mensaje: |
              Has tomado AD y CF de longitud $L$, y miden $1{,}5L$. Más
              cortas, se llevarían más carga y dejarían menos para BE.
        pista: |
          El equilibrio de E: $N_{BE} = N_{DE} = -\dfrac{EA}{2L}\,w$, con la
          $w$ del paso anterior.
        desarrollo: |
          $$
          N_{BE} = N_{DE} = -\frac{EA}{2L}\cdot\frac{2}{5}\,\frac{PL}{EA} = -\frac{1}{5}\,P = -0{,}2\,P
          $$

      - tipo: calcular
        titulo: La barra BE con solo la temperatura
        pregunta: |
          Ahora sin carga ($P = 0$) y con BE calentada $\Delta T$: ¿cuánto
          vale $N_{BE}$, como coeficiente de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.2667'
          tolerancia: 0.002
          formato: un número con signo, el coeficiente de EAαΔT en NBE
        distractores:
          - valor: '-1'
            mensaje: |
              Es la fuerza de una barra que no puede alargarse, con los dos
              extremos fijos. Los de BE son B y E, y los dos se mueven.
          - valor: '0.2667'
            mensaje: |
              El valor es ese, pero has puesto la deformación térmica con el
              signo cambiado. Calentada, BE quiere alargarse; el resto la
              frena y queda comprimida.
          - valor: '-0.5714'
            mensaje: |
              Has tomado E fijo. DE y EF se acortan y dejan bajar a E: BE
              puede alargarse por los dos extremos.
          - valor: '-0.3333'
            mensaje: |
              Has tomado ABC fija. AD y CF se alargan y dejan subir a ABC:
              BE puede alargarse por los dos extremos.
        pista: |
          Con $P = 0$, la ley de BE lleva su término térmico,
          $N_{BE} = \dfrac{EA}{L}(w - v) - EA\alpha\Delta T$, y el equilibrio
          de ABC queda $2N_{AD} + N_{BE} = 0$.
        desarrollo: |
          $$
          \frac{EA}{L}\,(w - v) - EA\alpha\Delta T = -\frac{EA}{2L}\,w
          \;\Longrightarrow\;
          v = \tfrac{3}{2}\,w - \alpha\Delta T\,L
          $$

          $$
          -\frac{4}{3}\,\frac{EA}{L}\,v - \frac{1}{2}\,\frac{EA}{L}\,w = 0
          \;\Longrightarrow\;
          v = -\tfrac{3}{8}\,w
          $$

          $$
          w = \frac{8}{15}\,\alpha\Delta T\,L
          \qquad
          v = -\frac{1}{5}\,\alpha\Delta T\,L
          \qquad
          N_{BE} = -\frac{EA}{2L}\,w = -\frac{4}{15}\,EA\alpha\Delta T = -0{,}2667\,EA\alpha\Delta T
          $$

      - tipo: calcular
        titulo: Lo que se mueve E con la carga
        pregunta: |
          Con solo la carga, ¿cuánto se mueve E, positivo hacia abajo, en
          unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.002
          formato: un número con signo, wE dividido entre PL/(EA)
        distractores:
          - valor: '0.6'
            mensaje: |
              Es lo que baja ABC, $v$. E baja menos: BE se acorta $v - w$.
          - valor: '0.2727'
            mensaje: |
              Has tomado que DE y EF se acortan lo que baja E, sin proyectar.
              Se acortan $w\operatorname{sen} 30^{\circ}$, y E baja más.
          - valor: '0.2'
            mensaje: |
              Es lo que se acortan DE y EF, $w\operatorname{sen} 30^{\circ}$.
              E baja $w$, el doble.
        pista: |
          Es la $w$ que sale del primer cálculo.
        desarrollo: |
          $$
          w_E = \frac{2}{5}\,\frac{PL}{EA} = 0{,}4\,\frac{PL}{EA}
          $$

      - tipo: calcular
        titulo: Lo que se mueve E con la temperatura
        pregunta: |
          Con solo la temperatura, ¿cuánto se mueve E, positivo hacia abajo,
          en unidades de $\alpha\Delta T\,L$?
        respuesta:
          tipo: numero
          valor: '0.5333'
          tolerancia: 0.002
          formato: un número con signo, wE dividido entre αΔT·L
        distractores:
          - valor: '1'
            mensaje: |
              Es toda la dilatación libre de BE, como si ABC no se moviera y
              nada frenara a E. DE y EF frenan a E, y ABC también se mueve.
          - valor: '0.6667'
            mensaje: |
              Has tomado ABC fija. AD y CF se alargan y dejan subir a ABC, y
              BE empuja a E menos de lo que crees.
          - valor: '-0.5333'
            mensaje: |
              El valor es ese, pero el signo no. Calentada, BE se alarga:
              empuja ABC hacia arriba y E hacia abajo.
          - valor: '-0.2'
            mensaje: |
              Es lo que se mueve ABC, $v$, positivo hacia abajo. Lo que se
              pregunta es lo que se mueve E.
        pista: |
          Es la $w$ del cálculo con solo la temperatura.
        desarrollo: |
          $$
          w_E = \frac{8}{15}\,\alpha\Delta T\,L = 0{,}5333\,\alpha\Delta T\,L
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cinco axiles y cuatro ecuaciones útiles, porque la horizontal
              de ABC queda 0 = 0: hiperestático de grado uno.
          - texto: >-
              Por la simetría, ABC se mueve $v$ sin girar y E se mueve $w$,
              los dos en vertical.
          - texto: >-
              AD y CF se alargan $-v$; BE, $w - v$, y DE y EF,
              $-w\operatorname{sen} 30^{\circ}$.
          - texto: >-
              Cada axil sale de la ec. 8.9, y el de BE lleva además
              $-EA\alpha\Delta T$.
          - texto: >-
              El equilibrio de E, $N_{BE} = N_{DE}$, y el de ABC,
              $2N_{AD} + N_{BE} = -P$, dan $v$ y $w$, y con ellos los cinco
              axiles.
          - texto: >-
              AD, BE y CF son paralelas y llegan a la misma barra rígida:
              las tres se acortan lo mismo y se reparten $P$ a partes iguales.
            trampa: true
            mensaje: |
              Se acortarían lo mismo si sus extremos de abajo estuvieran
              fijos, y E no lo está: baja, porque DE y EF se acortan. Además
              AD y CF miden $1{,}5L$ y BE, $L$. Con la carga, AD y CF llevan
              $0{,}4\,P$ cada una y BE, $0{,}2\,P$.
    resolucion: |
      **Lo que la estática no cierra.** ABC es rígida, y le llegan AD, BE y
      CF, las tres verticales. E es un nudo con tres barras: BE, vertical, y
      DE y EF, que bajan a D y a F a 30° de la horizontal (forman 120° entre
      sí, dos a dos). ABC da tres ecuaciones de equilibrio y E, dos; pero en
      la horizontal de ABC no entra ninguna fuerza, y queda 0 = 0. Quedan
      cuatro ecuaciones útiles para cinco axiles: hiperestático de grado uno
      (apuntes del tema 8, p. 4).

      Esa ecuación vacía avisa de otra cosa: nada impide que ABC se desplace
      un poco de lado, porque las tres barras que la sujetan son verticales.
      Con la carga en B y todo simétrico respecto de la vertical de B, nada
      la empuja de lado, y se toma que ABC sube o baja sin girar, $v$
      positivo hacia abajo, y que E se mueve en vertical, $w$ positivo hacia
      abajo.

      **Compatibilidad.** Cada barra se alarga lo que su extremo móvil
      avanza en su dirección, contada desde el otro extremo (ec. 8.12). AD
      y CF van del suelo a ABC y se acortan lo que baja ABC. BE va de E a
      B: se alarga lo que E baja más que B. DE va de D a E, hacia arriba y
      a 30° de la horizontal, y se acorta $w\operatorname{sen} 30^{\circ}$:

      $$
      \Delta L_{AD} = \Delta L_{CF} = -v
      \qquad
      \Delta L_{BE} = w - v
      \qquad
      \Delta L_{DE} = \Delta L_{EF} = -\frac{w}{2}
      $$

      **Ley de cada barra**, $\Delta L = NL/(EA) + \varepsilon_0 L$
      (ec. 8.9), con la misma $EA$ en las cinco y $\varepsilon_0 = \alpha\Delta T$
      solo en BE. AD y CF miden $1{,}5L$; BE, DE y EF, $L$:

      $$
      N_{AD} = -\frac{EA}{1{,}5L}\,v
      \qquad
      N_{BE} = \frac{EA}{L}\,(w - v) - EA\alpha\Delta T
      \qquad
      N_{DE} = -\frac{EA}{2L}\,w
      $$

      **Equilibrio.** En E, las componentes verticales de DE y EF suman
      $2N_{DE}\operatorname{sen} 30^{\circ} = N_{DE}$, y las horizontales se
      anulan; en ABC, las tres barras tiran hacia abajo si están a
      tracción:

      $$
      N_{BE} = N_{DE}
      \qquad
      2N_{AD} + N_{BE} = -P
      $$

      Con las leyes metidas, dos ecuaciones en $v$ y $w$:

      $$
      v - \tfrac{3}{2}\,w = -\alpha\Delta T\,L
      \qquad
      \tfrac{4}{3}\,v + \tfrac{1}{2}\,w = \frac{PL}{EA}
      $$

      $$
      w = \frac{2}{5}\,\frac{PL}{EA} + \frac{8}{15}\,\alpha\Delta T\,L
      \qquad
      v = \frac{3}{5}\,\frac{PL}{EA} - \frac{1}{5}\,\alpha\Delta T\,L
      $$

      **Las fuerzas.**

      $$
      N_{AD} = N_{CF} = -\frac{2}{5}\,P + \frac{2}{15}\,EA\alpha\Delta T
      = -0{,}4\,P + 0{,}1333\,EA\alpha\Delta T
      $$

      $$
      N_{BE} = N_{DE} = N_{EF} = -\frac{1}{5}\,P - \frac{4}{15}\,EA\alpha\Delta T
      = -0{,}2\,P - 0{,}2667\,EA\alpha\Delta T
      $$

      Con la carga, las cinco empujan. Calentar BE la comprime a ella y a DE
      y EF, que la frenan por debajo, y estira AD y CF, que la frenan por
      arriba: BE sube ABC $\tfrac{1}{5}\alpha\Delta T\,L$.

      **El desplazamiento de E.**

      $$
      w_E = \frac{2}{5}\,\frac{PL}{EA} + \frac{8}{15}\,\alpha\Delta T\,L
      = 0{,}4\,\frac{PL}{EA} + 0{,}5333\,\alpha\Delta T\,L
      $$

      hacia abajo, en la vertical de B. De la dilatación libre de BE,
      $\alpha\Delta T\,L$, ocho quinceavos van hacia abajo, en E, y tres
      quinceavos hacia arriba, en ABC; los cuatro quinceavos que faltan se
      los quita la compresión.

      **Comprobación por otro camino.** Con la carga, las reacciones de D y
      F tienen que sumar $P$: AD y CF llevan $0{,}4\,P$ cada una, y DE y EF,
      $0{,}2\,P$ cada una con la mitad en vertical,
      $0{,}4 + 0{,}4 + 2 \cdot 0{,}2 \cdot 0{,}5 = 1$. Con solo la
      temperatura, suman cero:
      $2 \cdot 0{,}1333 - 2 \cdot 0{,}2667 \cdot 0{,}5 = 0$. El motor del
      curso, por su parte, ve ABC como un mecanismo, porque nada la sujeta
      en horizontal; con un apoyo en B que solo le impide irse de lado (una
      guía vertical), que se comprueba que no trabaja, da los mismos cinco
      axiles, ABC sin girar y E quieto en horizontal.

  # ── Ejemplo resuelto del curso · el tirante de un caballete.
  - id: ejerm8-caballete-el-tirante-y-el-desplazamiento-de-b
    titulo: El caballete, del alargamiento del tirante al desplazamiento de B
    fuente: >-
      Ejemplo resuelto del curso, «Deformación del tirante de un caballete» ·
      Tema 8, «Esfuerzo axial simple» · Elasticidad y Resistencia de
      Materiales, UPV/EHU. El material trae la resolución, en letras, y la
      nuestra la sigue paso a paso, con sus ecuaciones (1) a (3). Los
      números del ejemplo son nuestros, y cada cifra está calculada con el
      motor del curso (las dos patas como sólidos rígidos articulados en C)
      y comprobada por un segundo camino (la fórmula final del ejemplo y el
      movimiento de C escrito a mano). El enunciado es el primer párrafo
      del ejemplo; los tres pasos del proceso de deformación y las
      observaciones que lo siguen están en nuestra resolución. La
      observación 1 del original nombra «CC' y CC''»: por su figura, los
      segmentos iguales son CC′ y C″C′, y así se escribe aquí. La figura
      está redibujada: la del original lleva además la posición deformada,
      que pasa a la resolución.
    nivel: practica
    enunciado: |
      Dado que el sistema de la figura es isostático, se ha determinado la
      fuerza que soporta la barra MN y el alargamiento correspondiente se
      denomina $\delta$, siendo conocido. Analizando el proceso de
      deformación, se desea determinar el desplazamiento $\delta_B$ del
      punto B.

