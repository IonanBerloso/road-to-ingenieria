    pide: >-
      Los axiles de las barras 4, 3 y 1, en unidades de P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas ecuaciones de compatibilidad hacen falta?
        opciones:
          - texto: Una, porque hay cinco axiles y los nudos B y D dan cuatro ecuaciones, y la simetría no la quita
            correcta: true
            mensaje: |
              Eso es. A y C son apoyos fijos: los nudos que se mueven son B y
              D, con dos ecuaciones cada uno. La simetría da $N_1 = N_2$ y
              $N_4 = N_5$, pero se lleva también las dos ecuaciones
              horizontales, que se cumplen solas: quedan tres axiles y dos
              ecuaciones (apuntes del tema 8, p. 4).
          - texto: Ninguna, porque con la simetría quedan tres axiles y B y D dan cuatro ecuaciones
            mensaje: |
              Con la figura y la carga simétricas, las dos ecuaciones
              horizontales dicen $0 = 0$. Quedan las verticales de B y D, dos
              ecuaciones para tres axiles.
          - texto: Dos, porque hay cinco barras y solo tres ecuaciones de equilibrio
            mensaje: |
              Las tres ecuaciones de la estructura entera no bastan ni para sus
              cuatro reacciones. Contando todo, son cinco axiles y cuatro
              reacciones, nueve incógnitas, para dos ecuaciones en cada uno de
              los cuatro nudos, ocho. Sobra una, no dos.

      - tipo: calcular
        titulo: La fuerza en la barra 4
        pregunta: |
          ¿Cuánto vale $N_4$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.4480'
          tolerancia: 0.002
          formato: un número con signo, N4 dividido entre P
        distractores:
          - valor: '0.5774'
            mensaje: |
              Es $P/\sqrt{3}$, lo que llevarían la 4 y la 5 sin la barra 3. La
              3 se alarga lo que D baja más que B, trabaja y sostiene parte de
              P.
          - valor: '0.4330'
            mensaje: |
              Has tomado el alargamiento de cada barra igual a lo que baja su
              nudo, sin proyectar. La 4 y la 1 van inclinadas: la 4 se alarga
              $\tfrac{\sqrt{3}}{2}\delta_D$, y la 1 se acorta $\delta_B/2$.
          - valor: '0.4724'
            mensaje: |
              Has tomado las cinco barras de la misma longitud: son del mismo
              material y sección, pero la 1 mide $2a/\sqrt{3}$, la 3
              $4a/\sqrt{3}$ y la 4, $2a$.
        pista: |
          Si B baja $\delta_B$ y D baja $\delta_D$: $\Delta L_1 = -\delta_B/2$,
          $\Delta L_4 = \tfrac{\sqrt{3}}{2}\delta_D$ y
          $\Delta L_3 = \delta_D - \delta_B$. Con $L_1 = 2a/\sqrt{3}$,
          $L_3 = 4a/\sqrt{3}$ y $L_4 = 2a$, la compatibilidad se queda en
          $N_3 = N_4 + N_1$.
        desarrollo: |
          $$
          N_1 = -N_3 \;\Longrightarrow\; N_4 = 2N_3
          \qquad
          \sqrt{3}\,N_4 + N_3 = P \;\Longrightarrow\; N_3 = \frac{P}{2\sqrt{3} + 1}
          $$

          $$
          N_4 = \frac{2P}{2\sqrt{3} + 1} = \frac{2\left(2\sqrt{3} - 1\right)}{11}\,P = 0{,}4480\,P
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 3
        pregunta: |
          ¿Y $N_3$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.2240'
          tolerancia: 0.002
          formato: un número con signo, N3 dividido entre P
        distractores:
          - valor: '0'
            mensaje: |
              Es suponer que la 3 no trabaja porque B no tiene carga. Sin
              fuerza en la 3, D bajaría y B no, y la 3 tendría que alargarse
              sin tensión.
          - valor: '1'
            mensaje: |
              Has cargado P entera en la 3, como si D colgara solo de ella. La 4
              y la 5 también se alargan cuando D baja, y sostienen la mayor
              parte.
          - valor: '0.25'
            mensaje: |
              Has tomado el alargamiento de cada barra igual a lo que baja su
              nudo, sin proyectar. Solo la 3, que es vertical, se alarga lo
              que bajan sus extremos.
          - valor: '0.1818'
            mensaje: |
              Has tomado las cinco barras de la misma longitud: son del mismo
              material y sección, pero la 1 mide $2a/\sqrt{3}$, la 3
              $4a/\sqrt{3}$ y la 4, $2a$.
        pista: |
          Del equilibrio de B, $N_1 = -N_3$; de la compatibilidad,
          $N_4 = 2N_3$; y el equilibrio vertical de D cierra.
        desarrollo: |
          $$
          N_3 = \frac{P}{2\sqrt{3} + 1} = \frac{2\sqrt{3} - 1}{11}\,P = 0{,}2240\,P
          $$

      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Y $N_1$, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-0.2240'
          tolerancia: 0.002
          formato: un número con signo, N1 dividido entre P
        distractores:
          - valor: '0.2240'
            mensaje: |
              El valor es ese, pero la 1 está comprimida: la 3 tira de B hacia
              abajo, y la 1 y la 2 lo sostienen empujando hacia arriba.
          - valor: '-0.4480'
            mensaje: |
              Te has dejado la barra 2 en el equilibrio de B:
              $N_1\operatorname{sen}30^{\circ} + N_3 = 0$. La 1 y la 2
              sostienen B entre las dos.
          - valor: '-0.25'
            mensaje: |
              Has tomado el alargamiento de cada barra igual a lo que baja su
              nudo, sin proyectar: la 1 se acorta solo $\delta_B/2$.
          - valor: '-0.1818'
            mensaje: |
              Has tomado las cinco barras de la misma longitud: son del mismo
              material y sección, pero la 1 mide $2a/\sqrt{3}$, la 3
              $4a/\sqrt{3}$ y la 4, $2a$.
        pista: |
          En B, en vertical: $2N_1\operatorname{sen}30^{\circ} + N_3 = 0$.
        desarrollo: |
          $$
          N_1 = N_2 = -N_3 = -0{,}2240\,P
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría, B y D solo bajan, $N_1 = N_2$ y $N_4 = N_5$;
              quedan tres axiles y dos ecuaciones, las verticales de B y D.
          - texto: >-
              En B, $N_1 = -N_3$; en D, $\sqrt{3}\,N_4 + N_3 = P$.
          - texto: >-
              Si B baja $\delta_B$ y D baja $\delta_D$:
              $\Delta L_1 = -\delta_B/2$,
              $\Delta L_4 = \tfrac{\sqrt{3}}{2}\delta_D$ y
              $\Delta L_3 = \delta_D - \delta_B$.
          - texto: >-
              Con $L_1 = 2a/\sqrt{3}$, $L_3 = 4a/\sqrt{3}$ y $L_4 = 2a$, la
              compatibilidad queda $N_3 = N_4 + N_1$, es decir, $N_4 = 2N_3$.
          - texto: >-
              $N_3 = P/(2\sqrt{3} + 1) = 0{,}2240\,P$,
              $N_4 = N_5 = 0{,}4480\,P$ y $N_1 = N_2 = -0{,}2240\,P$.
          - texto: >-
              B no tiene carga y la barra 3 es vertical: la 3 no trabaja, y D
              cuelga de la 4 y la 5.
            trampa: true
            mensaje: |
              Sin la 3, D bajaría y B se quedaría donde está, y la 3 tendría
              que alargarse todo lo que baja D sin ninguna fuerza. Trabaja:
              tira de B hacia abajo y frena a D.
    resolucion: |
      **Lo que la estática no cierra.** Origen en el punto medio de AC, $x$
      hacia la derecha e $y$ hacia arriba: $A = (-a, 0)$, $C = (a, 0)$,
      $B = (0, a\tan 30^{\circ})$ y $D = (0, -a\tan 60^{\circ})$. Las
      longitudes:

      $$
      L_1 = L_2 = \frac{a}{\cos 30^{\circ}} = \frac{2a}{\sqrt{3}}
      \qquad
      L_3 = a\left(\tan 30^{\circ} + \tan 60^{\circ}\right) = \frac{4a}{\sqrt{3}}
      \qquad
      L_4 = L_5 = \frac{a}{\cos 60^{\circ}} = 2a
      $$

      A y C son fijos, así que los nudos que se mueven son B y D: cuatro
      ecuaciones para cinco axiles, hiperestática de grado uno (apuntes del
      tema 8, p. 4). La figura y la carga son simétricas respecto de BD: B y
      D solo bajan, $N_1 = N_2$ y $N_4 = N_5$, y las dos ecuaciones
      horizontales se cumplen solas. Con todas a tracción, las verticales:

      $$
      \text{B:}\quad 2N_1\operatorname{sen}30^{\circ} + N_3 = 0
      \qquad
      \text{D:}\quad 2N_4\operatorname{sen}60^{\circ} + N_3 = P
      $$

      Tres axiles y dos ecuaciones: la que falta es de compatibilidad.

      **Compatibilidad.** B baja $\delta_B$ y D baja $\delta_D$. Cada barra
      se alarga lo que su extremo avanza en su dirección (ec. 8.12). La 1 va
      de A a B, hacia $(\cos 30^{\circ}, \operatorname{sen} 30^{\circ})$: si
      B baja, se acorta $\delta_B/2$. La 4 va de A a D, hacia
      $(\cos 60^{\circ}, -\operatorname{sen} 60^{\circ})$: se alarga
      $\tfrac{\sqrt{3}}{2}\delta_D$. La 3 es vertical y se alarga lo que D
      baja más que B:

      $$
      \Delta L_1 = -\frac{\delta_B}{2}
      \qquad
      \Delta L_4 = \frac{\sqrt{3}}{2}\,\delta_D
      \qquad
      \Delta L_3 = \delta_D - \delta_B = \frac{2}{\sqrt{3}}\,\Delta L_4 + 2\,\Delta L_1
      $$

      **Ley de cada barra** (ec. 8.9), $\Delta L_i = N_iL_i/(EA)$, con las
      longitudes de arriba:

      $$
      N_3\,\frac{4a}{\sqrt{3}} = \frac{2}{\sqrt{3}}\,N_4\,2a + 2N_1\,\frac{2a}{\sqrt{3}}
      \;\Longrightarrow\;
      N_3 = N_4 + N_1
      $$

      **Las fuerzas.** De B, $N_1 = -N_3$; en la compatibilidad,
      $N_4 = 2N_3$; en D, $\sqrt{3}\cdot 2N_3 + N_3 = P$:

      $$
      N_3 = \frac{P}{2\sqrt{3} + 1} = \frac{2\sqrt{3} - 1}{11}\,P = 0{,}2240\,P
      $$

      $$
      N_4 = N_5 = 2N_3 = 0{,}4480\,P
      \qquad
      N_1 = N_2 = -N_3 = -0{,}2240\,P
      $$

      La 3, la 4 y la 5 tiran; la 1 y la 2 empujan. La 3 no lleva carga
      directa, pero trabaja: tira de B hacia abajo, y la 1 y la 2 lo
      sostienen comprimidas.

      **Comprobación por otro camino.** Con las fuerzas, lo que baja cada
      nudo, en unidades de $Pa/(EA)$: B baja $\delta_B = -2\,\Delta L_1$,
      que da $2 \cdot 0{,}2240 \cdot 1{,}1547 = 0{,}5173$, y D baja
      $\delta_D = \tfrac{2}{\sqrt{3}}\,\Delta L_4$, que da
      $1{,}1547 \cdot 0{,}4480 \cdot 2 = 1{,}0346$. D baja el doble que B, y
      la 3 se alarga la diferencia, $1{,}0346 - 0{,}5173 = 0{,}5173$, que es
      lo que da su axil, $0{,}2240 \cdot 2{,}3094 = 0{,}5173$. Y el equilibrio global:
      cada apoyo recibe en vertical
      $N_4\operatorname{sen}60^{\circ} - N_1\operatorname{sen}30^{\circ} = 0{,}3880 + 0{,}1120 = 0{,}5$,
      en unidades de $P$, y los dos juntos sostienen P.

  # ── Propuesta A7 de clase · la columna de igual resistencia.
  - id: ejerm8-cla7-la-columna-de-igual-resistencia
    titulo: La columna con su peso y la carga P, a la misma tensión en todas sus secciones
    fuente: >-
      Propuesta A7 · Enunciados de los ejercicios de clase del tema 8,
      «Esfuerzo axial simple» · Elasticidad y Resistencia de Materiales,
      UPV/EHU. El material no trae solución: la resolución es nuestra, con el
      convenio del tema 8, y cada cifra está calculada con el motor del curso
      (la columna partida en 4000 tramos, con el peso de cada uno en sus
      nudos) y comprobada por un segundo camino (la fórmula cerrada y el
      equilibrio de la columna entera). Se conserva la errata del original,
      «secciónes» con tilde. El enunciado no da números: los pasos con
      cifras usan un ejemplo nuestro, que dice la nota. La figura está
      redibujada.
    nivel: practica
    enunciado: |
      La columna con el peso específico $\gamma$ sufre su peso propio y la
      carga $P$. Calcula la ecuación del cambio de sección para que la
      tensión que sufren todas las secciónes sea la misma.

      <figure class="figura-examen">
      <svg viewBox="20 6 220 190" role="img" width="220" height="190" aria-labelledby="ejerm8-cla7-la-columna-de-igual-resistencia-fig-t ejerm8-cla7-la-columna-de-igual-resistencia-fig-d">
      <title id="ejerm8-cla7-la-columna-de-igual-resistencia-fig-t">Una columna cuya sección crece hacia la base, cargada arriba con P</title>
      <desc id="ejerm8-cla7-la-columna-de-igual-resistencia-fig-d">Una columna vertical apoyada en el suelo. Arriba es estrecha, con una cara plana de área A₀, y su perfil se abre hacia abajo en dos curvas, cada vez más deprisa, hasta una base mucho más ancha. Sobre la cara de arriba actúa una fuerza P vertical hacia abajo, en el centro. Una flecha curva señala la cara de arriba con el rótulo A₀.</desc>
      <defs><pattern id="ejerm8-cla7-la-columna-de-igual-resistencia-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <polygon points="146,52 146.65,55.25 147.32,58.5 148.02,61.75 148.75,65 149.5,68.25 150.29,71.5 151.11,74.75 151.96,78 152.85,81.25 153.77,84.5 154.74,87.75 155.73,91 156.77,94.25 157.86,97.5 158.98,100.75 160.15,104 161.37,107.25 162.64,110.5 163.96,113.75 165.33,117 166.75,120.25 168.24,123.5 169.78,126.75 171.39,130 173.06,133.25 174.8,136.5 176.61,139.75 178.5,143 180.45,146.25 182.49,149.5 184.61,152.75 186.82,156 189.12,159.25 191.5,162.5 193.99,165.75 196.57,169 199.26,172.25 202.06,175.5 204.97,178.75 208,182 52,182 55.03,178.75 57.94,175.5 60.74,172.25 63.43,169 66.01,165.75 68.5,162.5 70.88,159.25 73.18,156 75.39,152.75 77.51,149.5 79.55,146.25 81.5,143 83.39,139.75 85.2,136.5 86.94,133.25 88.61,130 90.22,126.75 91.76,123.5 93.25,120.25 94.67,117 96.04,113.75 97.36,110.5 98.63,107.25 99.85,104 101.02,100.75 102.14,97.5 103.23,94.25 104.27,91 105.26,87.75 106.23,84.5 107.15,81.25 108.04,78 108.89,74.75 109.71,71.5 110.5,68.25 111.25,65 111.98,61.75 112.68,58.5 113.35,55.25 114,52" fill="var(--faint)" fill-opacity=".18" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="30" y="182" width="200" height="9" fill="url(#ejerm8-cla7-la-columna-de-igual-resistencia-r)"/><line x1="30" y1="182" x2="230" y2="182" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="130" y1="12" x2="130" y2="44" stroke="var(--d2)" stroke-width="1.8"/><polygon points="130,51 126.5,43 133.5,43" fill="var(--d2)"/>
      <text x="138" y="24" font-size="12" font-style="italic" fill="var(--d2-tinta)">P</text>
      <path d="M84 36 Q104 34 116 49" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
      <polygon points="116,49 110.38,45.81 114.13,42.82" fill="var(--ink)"/>
      <text x="80" y="39" font-size="12" fill="var(--ink)" text-anchor="end">A₀</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: P actúa sobre la cara de arriba, de área
      A₀, y la columna se apoya en el suelo por su base. Como en el
      original, el perfil no está a escala.

      </figcaption>
      </figure>

      **Notas nuestras.** $y$ es la profundidad bajo la cara de arriba, y
      $A(y)$, el área de la sección a esa profundidad: la «ecuación del
      cambio de sección» es $A(y)$. Para las cifras, un ejemplo nuestro: una
      columna de hormigón de 20 m de alto, con $P = 1000\ \text{kN}$,
      $A_0 = 0{,}5\ \text{m}^{2}$ y $\gamma = 25\ \text{kN/m}^{3}$.
    pide: >-
      La ecuación de A(y) y, con el ejemplo de la nota, la constante k de
      la ecuación de la rebanada, el área de la base y el peso de la
      columna.
    pasos:
      - tipo: reconocer
        pregunta: |
          Toma la rebanada de columna entre las profundidades $y$ e
          $y + dy$. Si todas las secciones han de trabajar a la misma
          tensión $\sigma_0$, ¿qué ecuación da $A(y)$?
        opciones:
          - texto: $\sigma_0\,dA = \gamma\,A\,dy$, porque de una cara de la rebanada a la otra la fuerza crece lo que pesa la rebanada
            correcta: true
            mensaje: |
              Eso es. La cara de arriba de la rebanada transmite
              $\sigma_0 A$, y la de abajo, eso más el peso de la rebanada,
              $\gamma A\,dy$. Con la tensión fija, la fuerza solo puede
              crecer si crece el área: $\sigma_0\,dA = \gamma A\,dy$, con
              $A = A_0$ en la cara de arriba y $\sigma_0 = P/A_0$.
          - texto: $\sigma_0\,A = P + \gamma\,A\,y$, con el peso de lo de encima igual al área de la sección por la profundidad
            mensaje: |
              Eso sería el peso de un prisma de sección $A(y)$, y lo de
              encima no lo es: más arriba la columna es más estrecha. El
              peso de lo de encima es $\gamma\int_0^y A\,ds$, y por eso hay
              que ir rebanada a rebanada.
          - texto: $\sigma_0\,A = P + \gamma\,A_0\,y$, con el peso de lo de encima calculado con el área de arriba
            mensaje: |
              Con $A_0$ cuentas lo de encima como si no se hubiera
              ensanchado, y se ha ensanchado: el peso de lo de encima es
              $\gamma\int_0^y A\,ds$, mayor que $\gamma A_0\,y$.
          - texto: $A = A_0$ en toda la columna, porque con la sección constante la tensión no cambia
            mensaje: |
              Con la sección constante, el axil crece con la profundidad:
              cada sección sostiene $P$ y además el peso de lo de encima. La
              tensión, $N/A$ (ec. 8.5), crece con él, y para que no crezca
              el área tiene que crecer al mismo paso.

      - tipo: calcular
        titulo: La constante de la columna
        pregunta: |
          La ecuación de la rebanada se escribe $dA/dy = k\,A$. Con el
          ejemplo de la nota, ¿cuánto vale $k$, en 1/m?
        respuesta:
          tipo: numero
          valor: '0.0125'
          tolerancia: 0.0002
          formato: un número, en 1/m
        distractores:
          - valor: '12.5'
            mensaje: |
              Has dividido kN/m³ entre MPa sin pasarlos a las mismas
              unidades. $\sigma_0 = 2\ \text{MPa}$ son
              $2000\ \text{kN/m}^{2}$, y $k = \gamma/\sigma_0$ sale en 1/m.
          - valor: '80'
            mensaje: |
              Es la inversa, $\sigma_0/\gamma$: la altura de columna que,
              con su propio peso, daría la tensión $\sigma_0$. De
              $\sigma_0\,dA = \gamma A\,dy$, $k = \gamma/\sigma_0$.
          - valor: '0.025'
            mensaje: |
              Has dividido $\gamma$ entre $P$ y no entre la tensión:
              $k = \gamma/\sigma_0 = \gamma A_0/P$.
        pista: |
          De $\sigma_0\,dA = \gamma A\,dy$, $k = \gamma/\sigma_0$, con
          $\sigma_0 = P/A_0$ en kN/m².
        desarrollo: |
          $$
          \sigma_0 = \frac{P}{A_0} = \frac{1000\ \text{kN}}{0{,}5\ \text{m}^{2}} = 2000\ \text{kN/m}^{2}
          $$

          $$
          k = \frac{\gamma}{\sigma_0} = \frac{25\ \text{kN/m}^{3}}{2000\ \text{kN/m}^{2}} = 0{,}0125\ \text{m}^{-1}
          $$

      - tipo: calcular
        titulo: El área de la base
        pregunta: |
          ¿Qué área necesita la sección a 20 m de profundidad, la base de la
          columna del ejemplo, en m²?
        respuesta:
          tipo: numero
          valor: '0.6420'
          tolerancia: 0.002
          formato: un número, en m²
        distractores:
          - valor: '0.625'
            mensaje: |
              Es $A_0(1 + k\,y)$, la de $\sigma_0 A = P + \gamma A_0\,y$: has
              contado el peso de lo de encima con el área de arriba. La
              columna se ensancha al bajar, y cada rebanada pesa más que la
              de encima.
          - valor: '0.6667'
            mensaje: |
              Es $A_0/(1 - k\,y)$, la de $\sigma_0 A = P + \gamma A\,y$: has
              contado lo de encima como un prisma con el área de la sección.
              Lo de encima es más estrecho, y hay que sumarlo rebanada a
              rebanada.
          - valor: '0.5'
            mensaje: |
              Es $A_0$, la sección que bastaría sin peso propio. La base
              sostiene además el peso de toda la columna, y para seguir a
              $\sigma_0$ tiene que ser mayor.
          - valor: '0.3894'
            mensaje: |
              Es $A_0\,e^{-k y}$: has integrado con el signo cambiado, y la
              sección te sale menguando hacia abajo. Cada sección sostiene
              más que la de encima, así que tiene que ser mayor.
        pista: |
          Integrando $dA/A = k\,dy$ desde la cara de arriba, donde
          $A = A_0$: $A(y) = A_0\,e^{k y}$.
        desarrollo: |
          $$
          A(y) = A_0\,e^{k y}
          $$

          $$
          A(20\ \text{m}) = 0{,}5\ \text{m}^{2} \cdot e^{0{,}25} = 0{,}6420\ \text{m}^{2}
          $$

      - tipo: calcular
        titulo: El peso de la columna
        pregunta: |
          ¿Cuánto pesa la columna entera del ejemplo, en kN?
        respuesta:
          tipo: numero
          valor: '284.03'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '250'
            mensaje: |
              Es $\gamma A_0 h$, el peso de un prisma con el área de arriba.
              La columna se ensancha hacia abajo y pesa más.
          - valor: '321.01'
            mensaje: |
              Es $\gamma A_b h$, el peso de un prisma con el área de la base.
              Más arriba la columna es más estrecha y pesa menos.
          - valor: '1284.03'
            mensaje: |
              Es la reacción del suelo, $P + W$: lo que sostiene la base. El
              peso de la columna es lo que la base sostiene de más sobre $P$.
        pista: |
          La base trabaja a $\sigma_0$ como todas las secciones, y sostiene
          $P$ más el peso de la columna: $\sigma_0 A_b = P + W$.
        desarrollo: |
          $$
          W = \sigma_0 A_b - P = 2000 \cdot 0{,}6420\ \text{kN} - 1000\ \text{kN} = 284{,}0\ \text{kN}
          $$

          Por la integral, con $\sigma_0 A_0 = P$:

          $$
          W = \int_0^h \gamma A_0\,e^{k y}\,dy = P\left(e^{k h} - 1\right)
          = 1000\ \text{kN} \cdot \left(e^{0{,}25} - 1\right) = 284{,}03\ \text{kN}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Todas las secciones han de trabajar a la tensión de la cara de
              arriba, $\sigma_0 = P/A_0$, a compresión.
          - texto: >-
              La rebanada entre $y$ e $y + dy$ pesa $\gamma A\,dy$, y la
              fuerza de su cara de abajo es la de la de arriba más ese peso.
          - texto: >-
              Con $\sigma_0$ fija, $\sigma_0\,dA = \gamma A\,dy$: el área
              crece en proporción a sí misma.
          - texto: >-
              Integrando desde la cara de arriba,
              $A(y) = A_0\,e^{\gamma y/\sigma_0} = A_0\,e^{\gamma A_0 y/P}$.
          - texto: >-
              La base sostiene $P$ más el peso de la columna:
              $W = P\left(e^{\gamma A_0 h/P} - 1\right)$.
          - texto: >-
              El axil es $P$ en toda la columna, así que basta con la sección
              constante $A_0$.
            trampa: true
            mensaje: |
              Eso sería sin peso propio. Cada sección sostiene $P$ y además
              el peso de lo que tiene encima: el axil crece hacia abajo, y la
              sección tiene que crecer con él.
    resolucion: |
      **La condición.** Toda la columna está a compresión. En la cara de
      arriba, de área $A_0$, el axil es $-P$, y la tensión,
      $\sigma_x = N/A = -P/A_0$ (ec. 8.5, p. 6). Que todas las secciones
      trabajen igual quiere decir $\sigma_x = -\sigma_0$ en toda la columna,
      con

      $$
      \sigma_0 = \frac{P}{A_0}
      $$

      **La rebanada.** Se mide $y$ hacia abajo desde la cara de arriba. La
      sección a la profundidad $y$ sostiene $P$ y el peso de todo lo que
      tiene encima, y transmite $\sigma_0 A(y)$. La de $y + dy$ sostiene,
      además, la rebanada entre las dos, que pesa $\gamma A\,dy$:

      $$
      \sigma_0\,(A + dA) = \sigma_0 A + \gamma A\,dy
      \;\Longrightarrow\;
      \frac{dA}{A} = \frac{\gamma}{\sigma_0}\,dy
      $$

      Integrando desde la cara de arriba, donde $A = A_0$:

      $$
      A(y) = A_0\,e^{\gamma y/\sigma_0} = A_0\,e^{\gamma A_0 y/P}
      $$

      Es la ecuación del cambio de sección: el área crece en exponencial
      hacia la base, y cada sección es justo la que hace falta para que su
      axil, $-\sigma_0 A(y)$, la deje a $\sigma_0$. El peso de la columna
      hasta la profundidad $h$ es lo que la base sostiene de más sobre $P$:

      $$
      W = \sigma_0 A(h) - P = P\left(e^{\gamma A_0 h/P} - 1\right)
      $$

      **El ejemplo.** Con $P = 1000\ \text{kN}$, $A_0 = 0{,}5\ \text{m}^{2}$
      y $\gamma = 25\ \text{kN/m}^{3}$, $\sigma_0 = 2000\ \text{kN/m}^{2}$,
      es decir, 2 MPa, y

      $$
      k = \frac{\gamma}{\sigma_0} = \frac{25\ \text{kN/m}^{3}}{2000\ \text{kN/m}^{2}} = 0{,}0125\ \text{m}^{-1}
      $$

      A 20 m de profundidad, $A = 0{,}5\ \text{m}^{2} \cdot e^{0{,}25} = 0{,}6420\ \text{m}^{2}$,
      y la columna pesa
      $W = 1000\ \text{kN} \cdot (e^{0{,}25} - 1) = 284{,}03\ \text{kN}$.
      El suelo empuja con $P + W = 1284{,}03\ \text{kN}$, y la base, a
      $\sigma_0$, lo sostiene:
      $2000\ \text{kN/m}^{2} \cdot 0{,}642013\ \text{m}^{2} = 1284{,}03\ \text{kN}$.

      **Comprobación por otro camino.** El motor parte la columna en 4000
      tramos prismáticos, cada uno con el área de su profundidad media y su
      peso repartido en sus dos nudos, y la resuelve como una barra con
      cargas puntuales. La tensión le sale la misma en todos los tramos,
      2 MPa, con diferencias de menos de una parte en mil millones, y la reacción
      del suelo, $1284{,}03\ \text{kN}$. Con la columna prismática de área
      $A_0$, la de la base sería
      $(1000 + 25 \cdot 0{,}5 \cdot 20)\ \text{kN}/(0{,}5\ \text{m}^{2}) = 2500\ \text{kN/m}^{2}$:
      un 25 % más que arriba.

  # ── Propuesta A8 de clase · tres barras en B, con la 3 calentada.
  - id: ejerm8-cla8-tres-barras-y-la-3-calentada
    titulo: Tres barras en el nudo B, sobre un apoyo móvil, con la barra 3 calentada
