            porque: |
              Se suponen a tracción; el signo dirá si alguna empuja.
          - punto: |
              **En A, una fuerza horizontal y una vertical.**
            porque: |
              La articulación impide que A se mueva, pero no que la celosía
              gire.
          - punto: |
              **$P$ hacia abajo, en C, a $2a$ de A.**
            porque: |
              Es la carga del enunciado, el dato.
