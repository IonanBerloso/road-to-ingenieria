        <path d="M96 110 A14 14 0 1 1 124 110 A14 14 0 1 1 96 110 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="100" y1="100" x2="100" y2="74" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
