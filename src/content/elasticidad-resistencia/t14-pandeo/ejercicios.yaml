ejercicios:
  # ── Ejemplo introductorio nuestro · columna empotrada-libre de sección rectangular con la carga desplazada del eje.
  - id: ejerm14-la-columna-con-la-carga-desplazada
    titulo: La columna con la carga desplazada
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      La columna de la figura, de acero, está empotrada en su base A y libre
      arriba, y mide $L = 2{,}5$ m. Su sección es un rectángulo macizo de
      120 mm según el eje $y$ y 80 mm según el eje $z$. Sobre su cara de
      arriba actúa una carga de compresión $P = 150$ kN, paralela al eje de
      la columna, a $e_y = 20$ mm del centro de gravedad de la sección, sobre
      el eje $y$. El acero tiene $E = 210$ GPa y $\sigma_e = 275$ MPa.

      Determinar la carga crítica de pandeo de la columna, su esbeltez, y el
      desplazamiento del extremo libre y el momento en el empotramiento que
      produce la carga excéntrica.

