      <figcaption>

      La columna del ejemplo: acero, empotrada en la base y libre arriba, de 2,5 m. La sección, maciza, mide 120 mm según <i>y</i> y 80 mm según <i>z</i>, y la carga <i>P</i> = 150 kN actúa sobre el eje <i>y</i>, a <i>e</i><sub>y</sub> = 20 mm de G. La sección está a escala; el alzado, no.

      </figcaption>
      </figure>
    pide: >-
      La carga crítica de pandeo, en kN; la esbeltez de la columna, y el
      desplazamiento del extremo libre, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          La sección tiene dos momentos de inercia principales,
          $I_z = 80 \cdot 120^{3}/12$ e $I_y = 120 \cdot 80^{3}/12$. ¿Cuál
          va en cada cuenta?
        opciones:
          - texto: 'La carga crítica, con $I_y$, la menor, porque la columna pandea en el plano en que menos resiste; el factor de la excentricidad, con $I_z$, porque $e_y$ flecta la columna alrededor de $z$'
            correcta: true
            mensaje: |
              Eso es. Son dos cosas distintas. El pandeo de Euler se produce
              en el plano del momento de inercia mínimo (ec. 14.8), aquí $I_y$,
              y no tiene nada que ver con dónde está la carga. La
              excentricidad $e_y$ da un flector $M_z$, y su amplificación es
              la del plano $xy$, con $\alpha_z = \sqrt{P/EI_z}$ (ec. 14.20 y
              diapositiva 17). Que $I_z$ no sea la mínima no cambia eso.
          - texto: 'Las dos con $I_z$: la carga está desplazada según $y$, y la columna pandea hacia donde la empuja la excentricidad'
            mensaje: |
              El factor sí va con $I_z$; la carga crítica, no. Aunque la
              excentricidad la curve en el plano $xy$, la columna puede
              pandear en el otro, y lo hace en el de la inercia mínima,
              $I_y$, con una carga crítica 2,25 veces menor que la del plano
              $xy$. Hay que comprobar los dos.
          - texto: 'Las dos con $I_y$, la mínima: es la que manda en pandeo, y queda del lado de la seguridad'
            mensaje: |
              Para la carga crítica, sí; para el factor, no. La excentricidad
              $e_y$ curva la columna alrededor de $z$, y la ec. 14.20 lleva la
              inercia de ese plano, $I_z$. Con $I_y$, el factor sale 1,68 en
              lugar de 1,23: es el de otra columna, la que tuviera la carga
              sobre el eje $z$.
          - texto: 'Ninguna: con la carga excéntrica no hay pandeo, sino flexión compuesta, como en el tema 9, con $I_z$'
            mensaje: |
              La flexión compuesta del tema 9 es lo que queda cuando la
              columna es poco esbelta: $\sec\alpha_zL \approx 1$. Esta es
              esbelta, el flector se amplifica con la secante, y además la
              columna puede pandear en el otro plano. Hacen falta las dos
              inercias.

      - tipo: calcular
        titulo: La carga crítica
        pregunta: |
          ¿Cuánto vale la carga crítica de pandeo de la columna, en kN?
        respuesta:
          tipo: numero
          valor: '424.47'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '1697.89'
            mensaje: |
              Es la carga con $L_p = L$, la de una columna biarticulada de
              2,5 m. Esta es empotrada-libre: su elástica, reflejada en el
              empotramiento, es media onda de 5 m, y $L_p = 2L$. Con el doble
              de longitud, la carga es la cuarta parte.
          - valor: '955.06'
            mensaje: |
              Es la de pandeo en el plano $xy$, con $I_z$. La columna pandea
              en el plano en que antes llega a la carga crítica, el de la
              inercia mínima: $I_y$, 2,25 veces menor.
          - valor: '3820.25'
            mensaje: |
              Es con $I_z$ y con $L$, los dos errores a la vez: una carga
              nueve veces la buena.
        pista: |
          Empotrada-libre: $L_p = 2L$. Y la inercia, la menor de las dos.
        desarrollo: |
          La columna pandea en el plano de la inercia mínima,
          $I_y = 120 \cdot 80^{3}/12 = 5{,}12 \cdot 10^{6}$ mm⁴, con
          $L_p = 2L = 5000$ mm. En N y mm:

          $$
          P_{crit} = \frac{\pi^{2} \cdot 2{,}1 \cdot 10^{5} \cdot 5{,}12 \cdot 10^{6}}{5000^{2}} = 424{,}5\ \text{kN}
          $$

          Es 2,8 veces la carga que lleva la columna.

      - tipo: calcular
        titulo: La esbeltez
        pregunta: |
          ¿Cuánto vale la esbeltez de la columna?
        respuesta:
          tipo: numero
          valor: '216.51'
          tolerancia: 0.2
          formato: un número, sin unidades
        distractores:
          - valor: '108.25'
            mensaje: |
              Es la esbeltez con $L$ en lugar de $L_p$. La esbeltez lleva la
              longitud de pandeo, la misma de la carga crítica: 5 m.
          - valor: '144.34'
            mensaje: |
              Es la esbeltez con el radio de giro de $I_z$,
              $i_z = 120/\sqrt{12} = 34{,}6$ mm. La que cuenta es la del plano
              en que pandea, el de la inercia mínima:
              $i_{\min} = 80/\sqrt{12} = 23{,}1$ mm.
          - valor: '72.17'
            mensaje: |
              Es con $L$ y con el radio de giro mayor. Así sale menor que
              $\lambda_0 = 86{,}8$, y la columna parecería corta. Con $L_p$ y
              con $i_{\min}$, la esbeltez es 2,5 veces $\lambda_0$, y la
              columna es esbelta.
        pista: |
          $\lambda = L_p/i_{\min}$, con $i_{\min} = \sqrt{I_{\min}/A}$. En un
          rectángulo, $i_{\min}$ es el lado menor partido por $\sqrt{12}$.
        desarrollo: |
          Con $A = 120 \cdot 80 = 9600$ mm²:

          $$
          i_{\min} = \sqrt{\frac{5{,}12 \cdot 10^{6}}{9600}} = 23{,}09\ \text{mm}
          $$

          $$
          \lambda = \frac{5000}{23{,}09} = 216{,}5
          $$

          Es mayor que $\lambda_0 = \pi\sqrt{2{,}1 \cdot 10^{5}/275} = 86{,}8$:
          la columna es esbelta, y la carga crítica de Euler vale. Su tensión
          crítica, $424{,}5 \cdot 10^{3}/9600 = 44{,}2$ MPa, está muy por
          debajo del límite elástico.

      - tipo: calcular
        titulo: El desplazamiento del extremo libre
        pregunta: |
          ¿Cuánto se desplaza el extremo libre de la columna, en mm?
        respuesta:
          tipo: numero
          valor: '4.618'
          tolerancia: 0.02
          formato: un número, en mm
        distractores:
          - valor: '3.8752'
            mensaje: |
              Es la flecha de primer orden, la del voladizo del tema 10 con el
              momento $Pe_y$ constante: $Pe_yL^{2}/2EI_z$. No cuenta con que,
              al desplazarse el extremo, la carga se aleja y el momento crece.
              La secante sí lo cuenta: $e_y(\sec\alpha_zL - 1)$ da un 19 % más.
          - valor: '3.7517'
            mensaje: |
              Es $e_y(1 - \cos\alpha_zL)$, sin dividir por $\cos\alpha_zL$.
              Sale si en el flector la carga se pone a $e_y$ del eje sin
              deformar, $M = Pv - Pe_y$, y no a $e_y + \delta_y$: la carga
              se mueve con el extremo libre. Con el brazo bueno, la ec. 14.17
              divide por $\cos\alpha_zL = 0{,}812$.
          - valor: '13.6244'
            mensaje: |
              Es con $I_y$ en $\alpha_z$. La excentricidad $e_y$ curva la
              columna en el plano $xy$, alrededor de $z$, y el factor lleva
              $I_z$. Con $I_y$ sería el de una carga sobre el eje $z$.
          - valor: '42.4931'
            mensaje: |
              Es con $2L$, la longitud de pandeo, en la secante. La ec. 14.17
              sale de integrar la elástica de la columna, que mide $L$, y el
              $2L$ ya está dentro: el factor se hace infinito en
              $\alpha_zL = \pi/2$, que es la carga crítica con $L_p = 2L$.
          - valor: '24.618'
            mensaje: |
              Es $e_y\sec\alpha_zL = e_y + \delta_y$, la distancia de la carga
              al eje sin deformar: el brazo del momento del empotramiento. El
              desplazamiento del extremo es lo que se ha movido la columna,
              $e_y(\sec\alpha_zL - 1)$.
          - valor: '0.00118'
            mensaje: |
              Es con $\alpha_zL = 0{,}6225$ tomado en grados. Es un ángulo en
              radianes: con la calculadora en grados, el coseno sale casi 1 y
              el desplazamiento casi desaparece.
        pista: |
          $\alpha_z = \sqrt{P/EI_z}$, con la inercia del plano en que flecta
          $e_y$; $\alpha_zL$, con la longitud de la columna y en radianes. Y
          $\delta_y = e_y(1 - \cos\alpha_zL)/\cos\alpha_zL$.
        desarrollo: |
          Con $I_z = 80 \cdot 120^{3}/12 = 1{,}152 \cdot 10^{7}$ mm⁴, en N y
          mm:

          $$
          \alpha_zL = 2500\sqrt{\frac{1{,}5 \cdot 10^{5}}{2{,}1 \cdot 10^{5} \cdot 1{,}152 \cdot 10^{7}}} = 0{,}6225
          $$

          en radianes, con $\cos\alpha_zL = 0{,}8124$ y
          $\sec\alpha_zL = 1{,}2309$. Y

          $$
          \delta_y = 20 \cdot \frac{1 - 0{,}8124}{0{,}8124} = 4{,}618\ \text{mm}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La columna es empotrada-libre, con $L_p = 2L = 5$ m, y pandea en el plano de la inercia mínima, $I_y = 5{,}12 \cdot 10^{6}$ mm⁴.'
          - texto: '$P_{crit} = \pi^{2}EI_y/L_p^{2} = 424{,}5$ kN, y la carga, $P = 150$ kN, es algo más de un tercio.'
          - texto: 'Con $i_{\min} = 23{,}1$ mm, $\lambda = 216{,}5$, mayor que $\lambda_0 = 86{,}8$: la columna es esbelta y Euler vale.'
          - texto: 'La excentricidad $e_y$ flecta la columna alrededor de $z$: $\alpha_zL = L\sqrt{P/EI_z} = 0{,}6225$ rad y $\sec\alpha_zL = 1{,}231$.'
          - texto: '$\delta_y = e_y(\sec\alpha_zL - 1) = 4{,}62$ mm, y el momento del empotramiento es $-Pe_y\sec\alpha_zL = -3{,}69$ kN·m.'
          - texto: 'En la secante, $\alpha_zL$ se calcula con la longitud de pandeo, $2L$, igual que la carga crítica.'
            trampa: true
            mensaje: |
              La ec. 14.20 sale de integrar la elástica de la columna, que
              mide $L$. El $2L$ ya está dentro: el factor se hace infinito en
              $\alpha_zL = \pi/2$, y esa es la carga crítica con $L_p = 2L$
              (ec. 14.21). Con $2L$, el factor saldría 3,12 en lugar de 1,23.
    resolucion: |
      **Dos inercias para dos cosas.** La sección tiene
      $I_z = 80 \cdot 120^{3}/12 = 1{,}152 \cdot 10^{7}$ mm⁴ e
      $I_y = 120 \cdot 80^{3}/12 = 5{,}12 \cdot 10^{6}$ mm⁴. La columna pandea
      en el plano de la inercia mínima, $I_y$; la excentricidad $e_y$ la
      flecta alrededor de $z$, y su factor va con $I_z$.

      **La carga crítica.** Empotrada-libre: $L_p = 2L = 5000$ mm. En N y mm:

      $$
      P_{crit} = \frac{\pi^{2} \cdot 2{,}1 \cdot 10^{5} \cdot 5{,}12 \cdot 10^{6}}{5000^{2}} = 424{,}5\ \text{kN}
      $$

      La carga, 150 kN, es algo más de un tercio.

      **La esbeltez.** Con $A = 9600$ mm²,
      $i_{\min} = \sqrt{I_y/A} = 23{,}09$ mm y

      $$
      \lambda = \frac{5000}{23{,}09} = 216{,}5
      $$

      Con $\lambda_0 = \pi\sqrt{2{,}1 \cdot 10^{5}/275} = 86{,}8$, la columna
      es esbelta y Euler vale: su tensión crítica, 44,2 MPa, está muy por
      debajo del límite elástico.

      **La excentricidad.** Con $I_z$ y la longitud de la columna:

      $$
      \alpha_zL = 2500\sqrt{\frac{1{,}5 \cdot 10^{5}}{2{,}1 \cdot 10^{5} \cdot 1{,}152 \cdot 10^{7}}} = 0{,}6225
      $$

      en radianes, con $\sec\alpha_zL = 1{,}2309$. El extremo libre se
      desplaza (ec. 14.17)

      $$
      \delta_y = 20 \cdot (1{,}2309 - 1) = 4{,}618\ \text{mm}
      $$

      y el momento del empotramiento es (ec. 14.20)

      $$
      M_A = -1{,}5 \cdot 10^{5} \cdot 20 \cdot 1{,}2309 = -3{,}69\ \text{kN·m}
      $$

      Sin la secante serían $-Pe_y = -3$ kN·m: la deformación de la columna
      lo aumenta un 23 %.

      **Por otro camino.** El momento del empotramiento es el de la carga
      sobre la columna deformada, con el brazo $e_y + \delta_y$
      (diapositiva 13):

      $$
      -1{,}5 \cdot 10^{5} \cdot (20 + 4{,}618) = -3{,}69\ \text{kN·m}
      $$

      el mismo. Y la tensión en la fibra más comprimida de la base, con
      $|M_A|$ en N·mm,

      $$
      \frac{1{,}5 \cdot 10^{5}}{9600} + \frac{3{,}693 \cdot 10^{6} \cdot 60}{1{,}152 \cdot 10^{7}} = 34{,}86\ \text{MPa}
      $$

      de compresión, lejos de los 275 MPa del límite elástico: la columna
      no plastifica.
