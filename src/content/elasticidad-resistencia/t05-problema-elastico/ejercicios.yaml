ejercicios:
  - id: ejerm5-de-los-desplazamientos-a-las-fuerzas
    titulo: De los desplazamientos a las fuerzas, por el camino de Navier
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        Aquí es dato lo que de ordinario se busca, los desplazamientos, y se pide
        lo que de ordinario es dato, la fuerza de volumen. Las ecuaciones del
        problema elástico son las mismas; solo cambia por dónde se entra.
      formula: |
        $$
        \lambda = \frac{\nu E}{(1 + \nu)(1 - 2\nu)}
        \qquad
        G = \frac{E}{2(1 + \nu)}
        $$

        Las dos constantes de Lamé, a partir de $E$ y $\nu$.
      reconocer: |
        Antes de las cuentas, lee qué da el enunciado y qué pide, y piensa qué
        grupo de ecuaciones lleva de cada cosa a la siguiente.
    enunciado: |
      En un sólido de acero, con $E = 200\ \text{GPa}$ y $\nu = 0{,}25$, el
      campo de desplazamientos es

      $$
      u = k\,x^{2} \qquad v = 0 \qquad w = 0 \qquad k = 10^{-4}\ \text{m}^{-1}
      $$

      con $x$, $u$ en metros. Calcular la tensión $\sigma_x$ en los puntos de
      $x = 1\ \text{m}$ y la fuerza de volumen $F_x$ que hace falta para que
      el sólido esté en equilibrio.
    pide: La tensión σx en x = 1 m y la fuerza de volumen Fx.
    pasos:
      - tipo: reconocer
        pregunta: |
          Dados los desplazamientos, ¿en qué orden se recorren las ecuaciones
          del problema elástico para llegar a las fuerzas?
        opciones:
          - texto: Deformaciones derivando los desplazamientos, tensiones con Lamé, y fuerzas con el equilibrio
            correcta: true
            mensaje: |
              Eso es: es la formulación en desplazamientos, la de Navier,
              recorrida al revés. Y la compatibilidad no hace falta: unas
              deformaciones que salen de derivar un campo de desplazamientos
              son compatibles siempre.
          - texto: Primero hay que comprobar las seis ecuaciones de compatibilidad
            mensaje: |
              La compatibilidad asegura que unas deformaciones vienen de algún
              campo de desplazamientos. Aquí el campo ya está dado, así que
              se cumple sola.
          - texto: Las tensiones con $\sigma_x = E\,\varepsilon_x$ y las fuerzas con el equilibrio
            mensaje: |
              $\sigma = E\,\varepsilon$ es la ley de una barra, en la que las
              otras tensiones son nulas. Aquí $\varepsilon_y = \varepsilon_z = 0$
              porque el sólido no puede contraerse de lado, y eso pide
              tensiones laterales: hace falta la ley de Hooke entera, o Lamé.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **una rebanada del sólido entre
          $x$ y $x + dx$**, con lo que actúa sobre ella.
        comprueba:
          - punto: |
              **$\sigma_x$ en la cara $x$ y $\sigma_x + d\sigma_x$ en la cara
              $x + dx$, dibujadas positivas.**
            porque: |
              $\sigma_x$ cambia con $x$: lo que no compensan las dos caras lo
              tiene que compensar la fuerza de volumen.
          - punto: |
              **La fuerza de volumen $F_x$ dentro, como incógnita, dibujada
              positiva.**
            porque: |
              No actúa en las caras, sino en todo el volumen de la rebanada.
          - punto: |
              **$\sigma_y$ arriba y abajo, y $\sigma_z$ igual, como
              incógnitas.**
            porque: |
              Si valen cero o no lo dirán las cuentas. Como no cambian con $y$
              ni con $z$, se compensan y no entran en el equilibrio según $x$.
        figura: |
          <svg viewBox="0 0 340 200" role="img" width="340" height="200" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Una rebanada del sólido entre x y x + dx</title>
            <desc id="dsl-d">Un cuadrado, la rebanada entre x y x + dx, vista desde z. En la cara de la izquierda, sigma x saliendo hacia la izquierda; en la de la derecha, sigma x más su incremento, saliendo hacia la derecha. Arriba y abajo, sigma y saliendo. Dentro, la fuerza de volumen F x, hacia la derecha. Todas como incógnitas, dibujadas positivas.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M120 60 H200 V140 H120 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="107" y1="100" x2="72" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="68" y="104" font-size="10" text-anchor="end" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="213" y1="100" x2="248" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="254" y="104" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"> + dσ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></tspan></text>
            <line x1="140" y1="100" x2="180" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="160" y="90" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="160" y1="47" x2="160" y2="17" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="168" y="22" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">y</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="160" y1="153" x2="160" y2="188" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
            <text x="120" y="156" font-size="9" text-anchor="middle" fill="var(--faint)">x</text>
            <text x="200" y="156" font-size="9" text-anchor="middle" fill="var(--faint)">x + dx</text>
          </svg>

      - tipo: calcular
        titulo: La tensión σx en x = 1 m
        pregunta: |
          ¿Cuánto vale $\sigma_x$ en $x = 1\ \text{m}$, en MPa?
        respuesta:
          tipo: numero
          valor: '48'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '40'
            mensaje: |
              Es $E\,\varepsilon_x$, la ley de una barra que puede contraerse
              de lado. Aquí no puede, $\varepsilon_y = \varepsilon_z = 0$, y
              con Lamé $\sigma_x = (\lambda + 2G)\,\varepsilon_x$, con
              $\lambda + 2G = 240$ GPa.
          - valor: '32'
            mensaje: |
              Te has dejado el término $\lambda\,e$ de Lamé:
              $\sigma_x = 2G\,\varepsilon_x + \lambda\,e$, y aquí
              $e = \varepsilon_x$, así que suma $80\,000 \cdot 2 \cdot 10^{-4} = 16$ MPa.
        pista: |
          $\varepsilon_x = \partial u/\partial x = 2kx$, y las demás son nulas.
          $\lambda = E\nu/[(1+\nu)(1-2\nu)] = 80$ GPa y $G = E/[2(1+\nu)] = 80$ GPa.
        desarrollo: |
          $$
          \varepsilon_x = 2kx = 2 \cdot 10^{-4}
          \qquad
          \sigma_x = 2G\,\varepsilon_x + \lambda\,e = (160\,000 + 80\,000) \cdot 2 \cdot 10^{-4} = 48\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La fuerza de volumen
        pregunta: |
          ¿Cuánto vale $F_x$, en MN/m³, con su signo?
        respuesta:
          tipo: numero
          valor: '-48'
          tolerancia: 0.05
          formato: un número con su signo, en MN/m³
        distractores:
          - valor: '48'
            mensaje: |
              El equilibrio es $\partial\sigma_x/\partial x + F_x = 0$: la
              fuerza de volumen compensa el crecimiento de la tensión, y va
              en contra. $F_x = -\partial\sigma_x/\partial x$.
          - valor: '-40'
            mensaje: |
              Has derivado $E\,\varepsilon_x$ en lugar de la tensión de Lamé.
              $\partial\sigma_x/\partial x = (\lambda + 2G) \cdot 2k = 240\,000 \cdot 2 \cdot 10^{-4}$ MPa/m.
        pista: |
          $\sigma_x = (\lambda + 2G)\,2kx$ y $\sigma_y$, $\sigma_z$ no dependen
          de $y$ ni de $z$. La primera ecuación de equilibrio se queda en
          $\partial\sigma_x/\partial x + F_x = 0$.
        desarrollo: |
          $$
          F_x = -\frac{\partial\sigma_x}{\partial x} = -(\lambda + 2G)\,2k = -240\,000 \cdot 2 \cdot 10^{-4} = -48\ \text{MPa/m} = -48\ \text{MN/m}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: Las deformaciones salen de derivar, $\varepsilon_x = 2kx$, y las demás son nulas.
          - texto: Con Lamé, $\sigma_x = (\lambda + 2G)\,\varepsilon_x = 48$ MPa y $\sigma_y = \sigma_z = \lambda\,\varepsilon_x = 16$ MPa en $x = 1$ m.
          - texto: 'El equilibrio según $x$ da $F_x = -\partial\sigma_x/\partial x = -48$ MN/m³.'
          - texto: 'Por Navier sale lo mismo: $F_x = -[(\lambda + G)\,2k + G\,2k]$.'
          - texto: Como $\varepsilon_y = \varepsilon_z = 0$, también son nulas $\sigma_y$ y $\sigma_z$.
            trampa: true
            mensaje: |
              Al revés: para que el sólido no se contraiga de lado hacen falta
              tensiones laterales, $\sigma_y = \sigma_z = \lambda\,e = 16$ MPa.
              Deformación nula no es tensión nula.
    resolucion: |
      **1. El estado de tensión.** Es el problema elástico recorrido al revés:
      los desplazamientos son dato y la fuerza de volumen, incógnita. El dibujo
      lleva una rebanada entre $x$ y $x + dx$.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 200" role="img" width="510" height="300" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Una rebanada del sólido entre x y x + dx</title>
        <desc id="dsl-d">Un cuadrado, la rebanada entre x y x + dx, vista desde z. En la cara de la izquierda, sigma x saliendo hacia la izquierda; en la de la derecha, sigma x más su incremento, saliendo hacia la derecha. Arriba y abajo, sigma y saliendo. Dentro, la fuerza de volumen F x, hacia la derecha. Todas como incógnitas, dibujadas positivas.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M120 60 H200 V140 H120 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="107" y1="100" x2="72" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="68" y="104" font-size="10" text-anchor="end" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="213" y1="100" x2="248" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="254" y="104" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"> + dσ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></tspan></text>
        <line x1="140" y1="100" x2="180" y2="100" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="160" y="90" font-size="10" text-anchor="middle" fill="var(--d2-tinta)">F<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="160" y1="47" x2="160" y2="17" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="168" y="22" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">y</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="160" y1="153" x2="160" y2="188" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
        <text x="120" y="156" font-size="9" text-anchor="middle" fill="var(--faint)">x</text>
        <text x="200" y="156" font-size="9" text-anchor="middle" fill="var(--faint)">x + dx</text>
      </svg>
      <figcaption>

      La rebanada entre x y x + dx, con todo dibujado positivo, como incógnita: σx en una cara, σx + dσx en la otra, σy arriba y abajo, y la fuerza de volumen Fx dentro. En z, como en y.

      </figcaption>
      </figure>

      - **Solo $u$ es no nulo**, y solo depende de $x$: la única deformación
        es $\varepsilon_x$.
      - **El sólido no se contrae de lado**, $\varepsilon_y = \varepsilon_z = 0$,
        pero eso no anula $\sigma_y$ ni $\sigma_z$.
      - **Las tensiones solo dependen de $x$**: en el equilibrio según $x$
        solo entra cómo cambia $\sigma_x$.
      - **No hace falta comprobar la compatibilidad**: las deformaciones salen
        de un campo de desplazamientos.

      **2. Incógnitas.** Las deformaciones; las tensiones en $x = 1$ m,
      $\sigma_x$ y las laterales; y la fuerza de volumen $F_x$.

      **3. Ecuaciones.** Las deformaciones, derivando; las tensiones, con
      Lamé; y la fuerza, con la primera ecuación de equilibrio:

      $$
      \varepsilon_x = \frac{\partial u}{\partial x}
      \qquad
      \sigma_x = \lambda e + 2G\varepsilon_x
      \qquad
      \sigma_y = \lambda e + 2G\varepsilon_y
      \qquad
      \frac{\partial\sigma_x}{\partial x} + \frac{\partial\tau_{xy}}{\partial y} + \frac{\partial\tau_{xz}}{\partial z} + F_x = 0
      $$

      **4. Resultados.** **Deformaciones.** $\varepsilon_x = 2kx$, y todas
      las demás, $\varepsilon_y$, $\varepsilon_z$ y las tres $\gamma$, son
      nulas. La dilatación es $e = \varepsilon_x$.

      **Tensiones.** Con $E = 200\,000$ MPa y $\nu = 0{,}25$:
      $\lambda = \tfrac{0{,}25\cdot200\,000}{1{,}25\cdot0{,}5} = 80\,000$ MPa
      y $G = \tfrac{200\,000}{2{,}5} = 80\,000$ MPa. En $x = 1$ m,
      $\varepsilon_x = 2\cdot10^{-4}$ y

      $$
      \sigma_x = 2G\,\varepsilon_x + \lambda\,e = 32 + 16 = 48\ \text{MPa}
      \qquad
      \sigma_y = \sigma_z = \lambda\,e = 16\ \text{MPa}
      $$

      **Fuerza de volumen.** Sin tangenciales, la ecuación de equilibrio
      queda

      $$
      \frac{\partial\sigma_x}{\partial x} + F_x = 0
      \quad\Longrightarrow\quad
      F_x = -(\lambda + 2G)\,2k = -240\,000\cdot2\cdot10^{-4} = -48\ \text{MN/m}^{3}
      $$

      **5. Comprobación.** Por Navier,
      $F_x + (\lambda + G)\,\partial e/\partial x + G\,\nabla^{2}u = 0$, con
      $\partial e/\partial x = 2k$ y $\nabla^{2}u = 2k$:
      $F_x = -(160\,000 + 80\,000)\cdot2\cdot10^{-4} = -48$ MN/m³. Lo mismo.
      Y las unidades: MPa por metro son MN/m³.

      **Lo que dice el resultado.** $\sigma_x$ no es $E\varepsilon_x$, que
      daría 40 MPa: los 8 que faltan vienen de que el sólido no puede
      contraerse de lado, y lo mismo da las laterales de 16 MPa. Y $F_x$ es
      negativa: como $\sigma_x$ crece con $x$, la cara de la derecha tira más
      que la de la izquierda, y la fuerza de volumen tiene que tirar hacia
      $-x$. Es la misma en todo el sólido; $\sigma_x$ vale 48 MPa solo en
      $x = 1$ m.
