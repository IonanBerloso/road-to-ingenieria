      <g transform="translate(93 262.2) rotate(60)"><rect x="-22" y="-6" width="44" height="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-18 0 H-14 V-3.6 H14 V-1.2 H-12 V1.2 H14 V3.6 H-14" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <text x="234.4" y="32" font-size="16" fill="var(--ink)" font-style="italic">a</text>
      <text x="257" y="148" font-size="16" fill="var(--ink)" font-style="italic">b</text>
      <text x="129" y="309.8" font-size="16" fill="var(--ink)" font-style="italic">c</text>
