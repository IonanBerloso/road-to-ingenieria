      - tipo: calcular
        titulo: La tensión σx
        pregunta: |
          Con $\nu = 0{,}25$, un ejemplo nuestro, ¿cuánto vale $\sigma_x$, en
          unidades de $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.002
          formato: un número, en unidades de σ0, con su signo
        distractores:
          - valor: '-0.25'
            mensaje: |
              Es $\nu\sigma_y$, lo del 4.1, con $\sigma_z = 0$. Aquí $\sigma_z$
              también comprime, y su Poisson empuja $x$ hacia fuera: las
              paredes tienen que apretar más.
          - valor: '-0.3125'
            mensaje: |
              Has calculado $\sigma_z = \nu\sigma_y$ como en el 4.1 y luego
              $\sigma_x = \nu(\sigma_y + \sigma_z)$. Las dos condiciones van a
              la vez: $\sigma_x = \nu(\sigma_y + \sigma_z)$ y
              $\sigma_z = \nu(\sigma_x + \sigma_y)$, un sistema de dos
              ecuaciones.
          - valor: '0.3333'
            mensaje: |
              Tiene el signo cambiado. Las paredes empujan hacia dentro para
              que el cuerpo no se ensanche: compresión.
        pista: |
          $\varepsilon_x = 0$ y $\varepsilon_z = 0$ dan dos ecuaciones,
          simétricas: resta una de otra.
        desarrollo: |
          De la ec. 4.2 de $x$ y de $z$:

          $$
          \sigma_x = \nu(\sigma_y + \sigma_z),\qquad
          \sigma_z = \nu(\sigma_x + \sigma_y)
          $$

          Restándolas, $(\sigma_x - \sigma_z)(1 + \nu) = 0$, así que
          $\sigma_x = \sigma_z$, y entonces $\sigma_x(1 - \nu) = \nu\sigma_y$:

          $$
          \sigma_x = \sigma_z = -\frac{\nu}{1 - \nu}\,\sigma_0
          $$

          Con $\nu = 0{,}25$, $0{,}25/0{,}75 = 0{,}3333$:
          $\sigma_x = \sigma_z = -0{,}3333\,\sigma_0$.
      - tipo: calcular
        titulo: La variación de la arista b
        pregunta: |
          Con $\nu = 0{,}25$, ¿cuánto vale $\Delta b$, en unidades de
          $\sigma_0 b/E$?
        respuesta:
          tipo: numero
          valor: '-0.8333'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·b/E, con su signo
        distractores:
          - valor: '-0.9375'
            mensaje: |
              Es la del 4.1, con $\sigma_z = 0$. Aquí $\sigma_z$ también
              comprime, y su Poisson alarga $b$: el acortamiento es menor.
          - valor: '-1'
            mensaje: |
              Es $\sigma_y/E$ sola. Las dos tensiones de las paredes, por
              Poisson, alargan en $y$:
              $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E$.
          - valor: '-1.1667'
            mensaje: |
              Has sumado el término de Poisson en vez de restarlo. Con
              $\sigma_x$ y $\sigma_z$ negativas,
              $-\nu(\sigma_x + \sigma_z)$ es positivo.
        pista: |
          $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{1}{E}\Bigl[-\sigma_0 + \frac{2\nu^{2}}{1 - \nu}\,\sigma_0\Bigr]
          = -\frac{(1 + \nu)(1 - 2\nu)}{1 - \nu}\,\frac{\sigma_0}{E}
          $$

          Con $\nu = 0{,}25$, $1{,}25\cdot0{,}5/0{,}75 = 0{,}8333$:
          $\Delta b = -0{,}8333\,\sigma_0 b/E$. Y $\Delta a = \Delta c = 0$.
      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          Con $\nu = 0{,}25$, ¿cuánto vale $\Delta V$, en unidades de
          $\sigma_0\,abc/E$?
        respuesta:
          tipo: numero
          valor: '-0.8333'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·abc/E, con su signo
        distractores:
          - valor: '-0.6667'
            mensaje: |
              Falta $\sigma_z$ en la suma de la ec. 4.8. Con $z$ impedida,
              $\sigma_z = \sigma_x$, y las tres tensiones entran.
          - valor: '-0.5'
            mensaje: |
              Es $(1 - 2\nu)\,\sigma_y/E$, sin las tensiones de las paredes. La
              ec. 4.8 lleva la suma de las tres.
          - valor: '-0.1667'
            mensaje: |
              Sale con $\sigma_x$ y $\sigma_z$ de tracción. Las paredes
              comprimen: las tres tensiones son negativas.
        pista: |
          Ec. 4.8 con las tres tensiones; o bien, como solo cambia $b$,
          $\Delta V = ac\,\Delta b$.
        desarrollo: |
          $$
          e = \frac{1 - 2\nu}{E}\Bigl(-\sigma_0 - \frac{2\nu}{1 - \nu}\,\sigma_0\Bigr)
          = -\frac{(1 - 2\nu)(1 + \nu)}{1 - \nu}\,\frac{\sigma_0}{E}
          $$

          que es $\varepsilon_y$, porque $\varepsilon_x = \varepsilon_z = 0$.
          Con $\nu = 0{,}25$, $\Delta V = -0{,}8333\,\sigma_0\,abc/E$.
      - tipo: reconocer
        pregunta: |
          ¿Qué pasa con $\nu = \tfrac12$, el apartado d/?
        opciones:
          - texto: >-
              Las tres tensiones valen $-\sigma_0$ y $\Delta V = 0$: con
              $\nu = \tfrac12$ el material no cambia de volumen
            correcta: true
            mensaje: |
              Eso es. $\nu/(1 - \nu) = 1$: $\sigma_x = \sigma_z = -\sigma_0$,
              un estado hidrostático. Y el factor $1 - 2\nu$ de la ec. 4.8 es
              cero: el módulo de elasticidad volumétrico,
              $k = E/[3(1 - 2\nu)]$ (ec. 4.16), es infinito. Es el límite de
              la ec. 4.18: $\nu < 0{,}5$.
          - texto: >-
              $\Delta V$ es el de c/ con $\nu = \tfrac12$ en el numerador, y no es
              cero
            mensaje: |
              El de c/ lleva el factor $1 - 2\nu$, y con $\nu = \tfrac12$ es cero. Sea
              cual sea la carga, un material con $\nu = \tfrac12$ no cambia de
              volumen.
          - texto: >-
              No se puede calcular: con $\nu = \tfrac12$ las fórmulas dejan de valer
            mensaje: |
              Las tensiones se calculan igual, y dan $-\sigma_0$ las tres. Lo
              que se hace infinito es $k$, y eso quiere decir que el volumen no
              cambia, no que el problema no tenga solución.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\sigma_y = -\sigma_0$, y las paredes impiden la deformación en
              $x$ y en $z$: $\varepsilon_x = \varepsilon_z = 0$.
          - texto: >-
              Las dos condiciones son simétricas:
              $\sigma_x = \sigma_z = -\nu\sigma_0/(1 - \nu)$.
          - texto: >-
              $\Delta a = \Delta c = 0$ y
              $\Delta b = -(1 + \nu)(1 - 2\nu)\,\sigma_0 b/[(1 - \nu)E]$.
          - texto: >-
              $\Delta V = ac\,\Delta b$, porque solo cambia $b$.
          - texto: >-
              Con $\nu = \tfrac12$, el estado es hidrostático y $\Delta V = 0$.
          - texto: >-
              Primero $\sigma_z = \nu\sigma_y$, como con $z$ libre, y después
              $\sigma_x = \nu(\sigma_y + \sigma_z)$.
            trampa: true
            mensaje: |
              $\sigma_z = \nu\sigma_y$ es lo que sale con $\sigma_x = 0$. Las
              dos tensiones de las paredes se influyen la una a la otra: van
              juntas, en un sistema de dos ecuaciones.
    resolucion: |
      **1. El estado de tensión.** Ahora hay dos aristas que no cambian, $a$ y
      $c$, y dos tensiones que el hueco pone para conseguirlo. El dibujo lleva
      el cuerpo sacado del hueco.

