        <line x1="62" y1="105" x2="32" y2="105" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
