    pide: La tensión de las paredes, la deformación en z y el cambio de volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dicen las paredes y las caras libres, antes de calcular nada?
        opciones:
          - texto: En x la deformación es nula, por las paredes, y en z la tensión es nula, porque está libre
            correcta: true
            mensaje: |
              Eso es. Una pared rígida sin holgura fija la deformación,
              $\varepsilon_x = 0$, y deja libre la tensión; una cara libre fija
              la tensión, $\sigma_z = 0$, y deja libre la deformación. Con
              $\sigma_y$ dada, quedan tres ecuaciones de Hooke para tres
              incógnitas.
          - texto: En x la tensión es nula, porque nada tira del cubo, y en z la deformación es nula
            mensaje: |
              Es justo al revés. Las paredes no tiran, pero **empujan**: el
              cubo querría ensancharse en $x$ y no le dejan. Y en $z$ no hay
              nada que impida deformarse, así que lo que se anula es la
              tensión.
          - texto: En x y en z las dos deformaciones son nulas
            mensaje: |
              En $z$ no hay pared: el cubo se ensancha libremente en esa
              dirección. Impedir la deformación en $z$ sería otro problema,
              con otra tensión $\sigma_z$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cubo sacado de su hueco,
          visto desde z**, con lo que se sabe y lo que se busca.
        comprueba:
          - punto: |
              **$\sigma_y$, de 70 MPa, entrando en las caras y.**
            porque: |
              Es la carga, de compresión.
          - punto: |
              **En lugar de las paredes, $\sigma_x$ como incógnita, dibujada
              positiva.**
            porque: |
              Sin rozamiento, la pared solo da una tensión normal; su signo lo
              dirá Hooke.
          - punto: |
              **Las caras z, las del papel, libres.**
            porque: |
              $\sigma_z = 0$. Y las paredes, rígidas y sin holgura, dan
              $\varepsilon_x = 0$: son las dos condiciones que faltan.
        figura: |
          <svg viewBox="0 6 280 210" role="img" width="280" height="210" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El cubo sacado de su hueco, visto desde z</title>
            <desc id="dsl-d">Un cuadrado, el cubo visto desde z, con x horizontal e y vertical. Arriba y abajo, 70 MPa entrando en las caras y, como dato. A izquierda y derecha, a trazos, las dos paredes quitadas, y en su lugar sigma x como incógnita, dibujada positiva.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M92 72 L168 72 L168 148 L92 148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M70 60 H92 V160 H70 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <path d="M168 60 H190 V160 H168 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="130" y1="29" x2="130" y2="59" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="137" y="36" font-size="10" text-anchor="start" fill="var(--flag)">70</text>
            <line x1="130" y1="191" x2="130" y2="161" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="181" y1="110" x2="211" y2="110" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="216" y="114" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="79" y1="110" x2="49" y2="110" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
          </svg>

      - tipo: calcular
        titulo: La tensión que hacen las paredes
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa, con su signo?
        respuesta:
          tipo: numero
          valor: '-21'
          tolerancia: 0.3
          formato: un número, en MPa, con su signo
        distractores:
          - valor: '21'
            mensaje: |
              El valor es bueno y el signo no: la pared tirando del cubo. De
              $\varepsilon_x = 0$ sale $\sigma_x = \nu\sigma_y$, del mismo signo
              que $\sigma_y$: si $\sigma_y$ comprime, la pared también.
          - valor: '0'
            mensaje: |
              Eso sería si $x$ estuviera libre. Con la pared,
              $\varepsilon_x = 0$, y para conseguirlo hace falta una tensión.
        pista: |
          Primera ecuación de Hooke con $\varepsilon_x = 0$ y $\sigma_z = 0$:
          $0 = [\sigma_x - \nu(\sigma_y + 0)]/E$.
        desarrollo: |
          $$
          \sigma_x = \nu\,\sigma_y = 0{,}3 \cdot (-70) = -21\ \text{MPa}
          $$

          De compresión: la pared empuja.

      - tipo: calcular
        titulo: La deformación en z
        pregunta: |
          ¿Cuánto vale $\varepsilon_z$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '390'
          tolerancia: 3
          formato: un número, en millonésimas
        distractores:
          - valor: '300.0'
            mensaje: |
              Te has dejado la tensión de la pared. En $z$ influyen las dos,
              $\sigma_x$ y $\sigma_y$: $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '0'
            mensaje: |
              $z$ está libre: lo que se anula es la tensión, no la
              deformación. El cubo se ensancha en $z$ porque lo comprimen en
              las otras dos.
        pista: |
          $\varepsilon_z = [\sigma_z - \nu(\sigma_x + \sigma_y)]/E$, con
          $\sigma_z = 0$ y $E = 70\,000$ MPa.
        desarrollo: |
          $$
          \varepsilon_z = \frac{-0{,}3\,(-21 - 70)}{70\,000} = 390 \cdot 10^{-6}
          $$

      - tipo: calcular
        titulo: El cambio de volumen
        pregunta: |
          ¿Cuánto cambia el volumen del cubo, en mm³, con su signo?
        respuesta:
          tipo: numero
          valor: '-65'
          tolerancia: 0.5
          formato: un número, en mm³, con su signo
        distractores:
          - valor: '-50'
            mensaje: |
              Has hecho $e = (1 - 2\nu)\,\sigma_y/E$, sin la tensión de la
              pared. La suma es de las tres tensiones:
              $e = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E$.
          - valor: '-113.75'
            mensaje: |
              Solo has contado $\varepsilon_y$. La deformación volumétrica es
              la suma de las tres: $\varepsilon_x = 0$, $\varepsilon_y$ y
              $\varepsilon_z$, que es positiva y compensa en parte.
        pista: |
          $\Delta V = e\,V$, con $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$
          y $V = 50^{3}$ mm³.
        desarrollo: |
          $$
          \varepsilon_y = \frac{-70 - 0{,}3\,(-21)}{70\,000} = -910 \cdot 10^{-6}
          \qquad e = (0 - 910 + 390) \cdot 10^{-6} = -520 \cdot 10^{-6}
          $$

          $$
          \Delta V = e\,V = -520 \cdot 10^{-6} \cdot 125\,000 = -65\ \text{mm}^{3}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Las paredes dan $\varepsilon_x = 0$, la cara libre $\sigma_z = 0$, y $\sigma_y = -70$ MPa es dato.'
          - texto: 'De $\varepsilon_x = 0$ sale $\sigma_x = \nu\sigma_y = -21$ MPa: las paredes empujan.'
          - texto: 'Con las dos tensiones, $\varepsilon_y = -910 \cdot 10^{-6}$ y $\varepsilon_z = 390 \cdot 10^{-6}$.'
          - texto: 'El volumen cambia en $e\,V = -520 \cdot 10^{-6} \cdot 125\,000 = -65$ mm³: disminuye.'
          - texto: 'Como el cubo querría ensancharse en $x$, la pared tira de él y $\sigma_x = +21$ MPa.'
            trampa: true
            mensaje: |
              Una pared solo puede empujar. Si el cubo querría ensancharse y
              no le dejan, la pared lo comprime: $\sigma_x$ sale negativa, del
              mismo signo que $\sigma_y$.
    resolucion: |
      **1. El estado de tensión.** Un cubo con una dirección impedida, otra
      cargada y otra libre. El dibujo lo lleva sacado de su hueco, con las
      paredes cambiadas por su tensión.

