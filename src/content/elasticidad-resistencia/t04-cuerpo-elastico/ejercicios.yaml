ejercicios:
  - id: ejerm4-cubo-en-un-hueco-rigido
    titulo: Un cubo en un hueco rígido, y cuánto cambia su volumen
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      Un cubo de aluminio de 50 mm de arista ($E = 70\ \text{GPa}$,
      $\nu = 0{,}3$) está metido sin holgura entre dos paredes rígidas que le
      impiden deformarse en $x$. Las caras perpendiculares a $z$ están libres.
      Se comprime en $y$ con una tensión uniforme
      $\sigma_y = -70\ \text{MPa}$. Sin rozamiento con las paredes, calcular
      la tensión $\sigma_x$ que hacen las paredes, la deformación
      $\varepsilon_z$ y el cambio de volumen del cubo.

