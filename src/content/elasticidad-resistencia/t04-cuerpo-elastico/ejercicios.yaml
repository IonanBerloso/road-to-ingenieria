              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M90 68 L170 68 L170 148 L90 148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M68 36 H90 V148 H170 V36 H192 V170 H68 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="130" y1="25" x2="130" y2="55" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="137" y="32" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="130" y1="191" x2="130" y2="161" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="183" y1="108" x2="213" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="218" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="77" y1="108" x2="47" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
          </svg>

      - tipo: calcular
        titulo: La tensión σx
        pregunta: |
          Con $\nu = 0{,}25$, un ejemplo nuestro, ¿cuánto vale $\sigma_x$, en
          unidades de $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.002
          formato: un número, en unidades de σ0, con su signo
        distractores:
          - valor: '0.25'
            mensaje: |
              Tiene el signo cambiado. De $\varepsilon_x = 0$ sale
              $\sigma_x = \nu\sigma_y$, y $\sigma_y = -\sigma_0$: las paredes
              también comprimen.
          - valor: '0'
            mensaje: |
              Es tomar las paredes por caras libres. Para que $a$ no cambie,
              las paredes tienen que empujar: el cuerpo querría ensancharse
              según $x$ por el efecto Poisson de $\sigma_y$.
          - valor: '-0.3333'
            mensaje: |
              Es $-\nu\sigma_0/(1 - \nu)$, lo que sale con $z$ también
              impedida, $\varepsilon_z = 0$: es el ejercicio 4.2. Aquí $z$ es
              libre y $\sigma_z = 0$.
        pista: |
          Ec. 4.2 de $x$, con $\varepsilon_x = 0$ y $\sigma_z = 0$.
        desarrollo: |
          $$
          \varepsilon_x = \frac{1}{E}\bigl[\sigma_x - \nu(\sigma_y + \sigma_z)\bigr] = 0
          \;\Longrightarrow\;
          \sigma_x = \nu\sigma_y = -\nu\sigma_0
          $$

          y con $\nu = 0{,}25$, $\sigma_x = -0{,}25\,\sigma_0$. Las tres son
          principales: no hay cortantes, porque las paredes no rozan y la
          carga es normal.
      - tipo: calcular
        titulo: La variación de la arista b
        pregunta: |
          Con $\nu = 0{,}25$, ¿cuánto vale $\Delta b$, en unidades de
          $\sigma_0 b/E$?
        respuesta:
          tipo: numero
          valor: '-0.9375'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·b/E, con su signo
        distractores:
          - valor: '-1'
            mensaje: |
              Es $\sigma_y/E$ sola, sin el término de Poisson. La $\sigma_x$
              de las paredes también comprime, y por Poisson alarga en $y$:
              $\varepsilon_y = [\sigma_y - \nu\sigma_x]/E$.
          - valor: '-1.0625'
            mensaje: |
              Has sumado el término de Poisson en vez de restarlo: con
              $\sigma_x = -\nu\sigma_0$, $-\nu\sigma_x = +\nu^{2}\sigma_0$, y
              $\varepsilon_y = -(1 - \nu^{2})\,\sigma_0/E$.
          - valor: '-0.8333'
            mensaje: |
              Arrastra las tensiones del cuerpo impedido en $z$, el 4.2:
              $\sigma_x = \sigma_z = -\sigma_0/3$. Aquí $\sigma_z = 0$.
          - valor: '0.9375'
            mensaje: |
              Tiene el signo cambiado: sale con $\sigma_y = +\sigma_0$, de
              tracción. La carga comprime, $\sigma_y = -\sigma_0$, y $b$ se
              acorta.
        pista: |
          $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E$, y
          $\Delta b = b\,\varepsilon_y$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{1}{E}\bigl[-\sigma_0 - \nu(-\nu\sigma_0)\bigr] = -\frac{(1 - \nu^{2})\,\sigma_0}{E},\qquad
          \Delta b = -(1 - \nu^{2})\,\frac{\sigma_0 b}{E}
          $$

          Con $\nu = 0{,}25$, $1 - 0{,}25^{2} = 0{,}9375$:
          $\Delta b = -0{,}9375\,\sigma_0 b/E$. Y $\Delta a = 0$, por las
          paredes.
      - tipo: calcular
        titulo: La variación de la arista c
        pregunta: |
          Con $\nu = 0{,}25$, ¿cuánto vale $\Delta c$, en unidades de
          $\sigma_0 c/E$?
        respuesta:
          tipo: numero
          valor: '0.3125'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·c/E, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Es tomar «libertad de deformación» por «no se deforma». Libre
              quiere decir que nada empuja, $\sigma_z = 0$; la deformación
              $\varepsilon_z$ es la que piden las otras dos tensiones.
          - valor: '0.25'
            mensaje: |
              Solo cuenta el Poisson de $\sigma_y$. La $\sigma_x$ de las
              paredes también comprime y también ensancha en $z$:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '0.1875'
            mensaje: |
              Sale con $\sigma_x = +\nu\sigma_0$, de tracción. Las paredes
              comprimen: $\sigma_x + \sigma_y = -(1 + \nu)\,\sigma_0$.
          - valor: '-0.3125'
            mensaje: |
              Sale con $\sigma_y = +\sigma_0$, de tracción, y todo cambia de
              signo. La carga comprime, $\sigma_y = -\sigma_0$, y por Poisson
              $c$ crece.
        pista: |
          $\varepsilon_z = [\sigma_z - \nu(\sigma_x + \sigma_y)]/E$, con
          $\sigma_z = 0$.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{\nu}{E}\,(\sigma_x + \sigma_y) = \frac{\nu(1 + \nu)\,\sigma_0}{E},\qquad
          \Delta c = \nu(1 + \nu)\,\frac{\sigma_0 c}{E}
          $$

          Con $\nu = 0{,}25$, $0{,}25\cdot1{,}25 = 0{,}3125$: $c$ crece. Es la
          única arista que crece.
      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          Con $\nu = 0{,}25$, ¿cuánto vale $\Delta V$, en unidades de
          $\sigma_0\,abc/E$?
        respuesta:
          tipo: numero
          valor: '-0.625'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·abc/E, con su signo
        distractores:
          - valor: '-0.5'
            mensaje: |
              Es $(1 - 2\nu)\,\sigma_y/E$, sin $\sigma_x$. La ec. 4.8 lleva la
              suma de las tres tensiones, y la de las paredes no es cero.
          - valor: '-0.9375'
            mensaje: |
              Es $\varepsilon_y$ sola. La variación de volumen unitaria es la
              suma de las tres deformaciones, y $\varepsilon_z$ es positiva:
              compensa parte del acortamiento de $b$.
          - valor: '-0.375'
            mensaje: |
              Sale con $\sigma_x = +\nu\sigma_0$. Con las dos tensiones de
              compresión, $\sigma_x + \sigma_y = -(1 + \nu)\,\sigma_0$.
          - valor: '0.625'
            mensaje: |
              Sale con $\sigma_y = +\sigma_0$, de tracción. La carga comprime,
              $\sigma_y = -\sigma_0$, y las paredes también: el volumen
              disminuye.
        pista: |
          Ec. 4.8: $e = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E$, y
          $\Delta V = abc\,e$.
        desarrollo: |
          $$
          e = \frac{1 - 2\nu}{E}\,(\sigma_x + \sigma_y + \sigma_z) = -\frac{(1 - 2\nu)(1 + \nu)\,\sigma_0}{E},\qquad
          \Delta V = -(1 - 2\nu)(1 + \nu)\,\frac{\sigma_0\,abc}{E}
          $$

          Con $\nu = 0{,}25$, $0{,}5\cdot1{,}25 = 0{,}625$. Por el otro
          camino, sumando las deformaciones de las aristas:
          $0 - 0{,}9375 + 0{,}3125 = -0{,}625$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga comprime la cara de arriba, las paredes impiden la
              deformación según $x$ y nada sujeta $z$: $\sigma_y = -\sigma_0$,
              $\varepsilon_x = 0$ y $\sigma_z = 0$.
          - texto: >-
              De $\varepsilon_x = 0$, $\sigma_x = \nu\sigma_y = -\nu\sigma_0$.
          - texto: >-
              $\Delta a = 0$, $\Delta b = -(1 - \nu^{2})\,\sigma_0 b/E$ y
              $\Delta c = \nu(1 + \nu)\,\sigma_0 c/E$.
          - texto: >-
              Con la ec. 4.8,
              $\Delta V = -(1 - 2\nu)(1 + \nu)\,\sigma_0\,abc/E$.
          - texto: >-
              Como $z$ es libre, $\varepsilon_z = 0$ y $c$ no cambia.
            trampa: true
            mensaje: |
              Libre quiere decir sin tensión, $\sigma_z = 0$, no sin
              deformación. Las otras dos tensiones son de compresión, y por
              Poisson el cuerpo se ensancha en $z$: $c$ crece.
    resolucion: |
      **1. El estado de tensión.** El cuerpo, uniforme y sin tangenciales,
      tiene una condición en cada dirección. El dibujo lo lleva sacado del
      hueco.

      <figure class="figura-examen">
      <svg viewBox="0 0 280 220" role="img" width="420" height="330" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El cuerpo A sacado del hueco, libre en z</title>
        <desc id="dsl-d">Un cuadrado, el cuerpo A visto desde z, con x horizontal e y vertical. Arriba, sigma cero entrando, la carga; abajo, otra flecha entrando, la respuesta del fondo. A trazos, la forma en U del hueco quitado, y en lugar de las paredes, sigma x como incógnita, dibujada positiva. En z, nada.</desc>
