      <figcaption>

      El elemento de la cara libre, visto desde z. σx, σy y τxy van dibujadas positivas, como incógnitas; la cara z, la del papel, está libre: tensión plana.

      </figcaption>
      </figure>

      - **La cara z está libre**: $\sigma_z = \tau_{zx} = \tau_{yz} = 0$
        (apuntes, ec. 4.23, p. 9).
      - **De deformaciones a tensiones** se despeja Hooke (ecs. 4.24 y 4.25,
        p. 9); no se usa $\sigma = E\varepsilon$, que es la ley de una barra con
        una sola tensión.

      **2. Incógnitas.** $\sigma_x$, $\sigma_y$ y $\tau_{xy}$, y la
      deformación $\varepsilon_z$, que la roseta no mide.

      **3. Ecuaciones.** Hooke en tensión plana, despejada, con
      $G = E/[2(1 + \nu)]$ (ec. 4.6, p. 5), y la tercera ecuación de Hooke con
      $\sigma_z = 0$:

      $$
      \sigma_x = \frac{E}{1-\nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y)
      \qquad
      \sigma_y = \frac{E}{1-\nu^{2}}\,(\varepsilon_y + \nu\varepsilon_x)
      \qquad
      \tau_{xy} = G\gamma_{xy}
      \qquad
      \varepsilon_z = -\frac{\nu}{E}\,(\sigma_x + \sigma_y)
      $$

      **4. Resultados.** **Las dos normales.** Con
      $E/(1 - \nu^{2}) = 2 \cdot 10^{5}/0{,}91$ MPa:

      $$
      \sigma_x = \frac{2 \cdot 10^{5}}{0{,}91} \cdot 682{,}5 \cdot 10^{-6} = 150\ \text{MPa}
      \qquad
      \sigma_y = \frac{2 \cdot 10^{5}}{0{,}91} \cdot 136{,}5 \cdot 10^{-6} = 30\ \text{MPa}
      $$

      $\varepsilon_y$ es negativa y $\sigma_y$ es de tracción. No hay
      contradicción: $\sigma_x$ acorta $y$ en
      $\nu\sigma_x/E = 0{,}3 \cdot 150/(2 \cdot 10^{5}) = 225 \cdot 10^{-6}$, y
      $\sigma_y$ solo la alarga $30/(2 \cdot 10^{5}) = 150 \cdot 10^{-6}$.
      Gana el acortamiento: $(150 - 225) \cdot 10^{-6} = -75 \cdot 10^{-6}$,
      la lectura.

      **La tangencial**, con la $\gamma$ entera:

      $$
      \tau_{xy} = G\gamma_{xy} = \frac{2 \cdot 10^{5}}{2{,}6} \cdot 520 \cdot 10^{-6} = 40\ \text{MPa}
      $$

