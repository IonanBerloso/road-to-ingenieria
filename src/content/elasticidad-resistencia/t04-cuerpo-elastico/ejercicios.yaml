      **Notas nuestras.** El apartado d/ dice «calculado en d/»: se lee
      «calculado en c/», que es donde se calcula esa temperatura.
    notas:
      - >-
        Nota: $E$, $\nu$, $\alpha$ son datos.
    pide: >-
      Las tensiones principales y la variación de longitud de las aristas, con
      σ0 y T; la variación de temperatura que anula la variación de volumen, y
      las aristas con esa temperatura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las condiciones son las del cuerpo sin temperatura:
          $\sigma_y = -\sigma_0$, $\varepsilon_x = 0$ y $\sigma_z = 0$. ¿Cuánto
          vale ahora $\sigma_x$?
        opciones:
          - texto: >-
              $\sigma_x = -\nu\sigma_0 - E\alpha T$
            correcta: true
            mensaje: |
              Eso es. Con la ec. 4.19,
              $\varepsilon_x = [\sigma_x - \nu\sigma_y]/E + \alpha T = 0$. Si
              el cuerpo se calienta, querría dilatarse según $x$, y las paredes
              tienen que apretar más: $-E\alpha T$ se suma a la compresión.
          - texto: >-
              $\sigma_x = -\nu\sigma_0 + E\alpha T$
            mensaje: |
              El signo del término térmico está al revés. Al calentarse, el
              cuerpo empuja las paredes y ellas le devuelven una compresión:
              con $T > 0$, $\sigma_x$ tiene que bajar.
          - texto: >-
              $\sigma_x = -\nu\sigma_0$, porque la temperatura no da
              tensiones
            mensaje: |
              La temperatura sola no da tensiones si el cuerpo se dilata a
              gusto. Según $x$ no puede: las paredes se lo impiden, y la
              dilatación impedida es una tensión.
      - tipo: reconocer
        pregunta: |
          En $\varepsilon_y$ y en $\varepsilon_z$, ¿qué factor multiplica a
          $\alpha T$?
        opciones:
          - texto: $1 + \nu$
            correcta: true
            mensaje: |
              Eso es. Está la dilatación libre, $\alpha T$, y además el Poisson
              de la parte térmica de $\sigma_x$: $-\nu(-E\alpha T)/E = \nu\alpha T$.
              Lo que no puede dilatarse según $x$ sale por las otras dos.
          - texto: $1$
            mensaje: |
              Es solo la dilatación libre. La $\sigma_x$ lleva un término
              $-E\alpha T$, y su Poisson también alarga en $y$ y en $z$: añade
              $\nu\alpha T$.
          - texto: $1 - \nu$
            mensaje: |
              El Poisson de una compresión según $x$ alarga en las otras
              direcciones: el término de $\sigma_x$ se suma a la dilatación,
              no se resta.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cuerpo A sacado del hueco,
          visto desde z**, con la temperatura aparte.
        comprueba:
          - punto: |
              **$\sigma_0$ arriba y abajo, $\sigma_x$ en lugar de las paredes y
              nada en z, como en el 4.1.**
            porque: |
              Las condiciones son las mismas: $\sigma_y = -\sigma_0$,
              $\varepsilon_x = 0$ y $\sigma_z = 0$.
          - punto: |
              **La temperatura, sin flecha.**
            porque: |
              No es una tensión: es una deformación, $\alpha T$ en las tres
              direcciones, que se suma en Hooke.
          - punto: |
              **$\sigma_x$ dibujada positiva, como incógnita.**
            porque: |
              Ahora depende de $\sigma_0$ y de T: el signo lo dan las cuentas.
        figura: |
          <svg viewBox="0 0 280 220" role="img" width="280" height="220" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El cuerpo A sacado del hueco, libre en z y calentado</title>
            <desc id="dsl-d">Como en el ejercicio 4.1: el cuerpo A visto desde z, con sigma cero entrando por arriba y por abajo, la forma en U del hueco a trazos y sigma x como incógnita en lugar de las paredes; en z, nada. Dentro del cuerpo, el rótulo T: la variación de temperatura, que no es una tensión.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M90 68 L170 68 L170 148 L90 148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M68 36 H90 V148 H170 V36 H192 V170 H68 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
            <line x1="130" y1="25" x2="130" y2="55" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="137" y="32" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="130" y1="191" x2="130" y2="161" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
            <line x1="183" y1="108" x2="213" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="218" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
            <line x1="77" y1="108" x2="47" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
            <text x="130" y="112" font-size="9" text-anchor="middle" fill="var(--faint)">T</text>
          </svg>

      - tipo: calcular
        titulo: La temperatura que anula ΔV
        pregunta: |
          Con $\nu = 0{,}3$, un ejemplo nuestro, ¿qué $T$ hace nula la
          variación de volumen, en unidades de $\sigma_0/(E\alpha)$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.002
          formato: un número, en unidades de σ0/(Eα), con su signo
        distractores:
          - valor: '-0.2'
            mensaje: |
              Tiene el signo cambiado. La carga encoge el volumen; para
              compensarlo hay que dilatar, y eso es calentar: $T > 0$.
          - valor: '0.17333'
            mensaje: |
              Has sumado la dilatación libre, $3\alpha T$, a la ec. 4.8 con la
              $\sigma_x$ sin temperatura. Pero la $\sigma_x$ de las paredes
              también cambia con $T$: lleva $-E\alpha T$.
          - valor: '0.13333'
            mensaje: |
              Es la temperatura de un cuerpo libre con $\sigma_y = -\sigma_0$
              y nada más: $(1 - 2\nu)\,\sigma_0 = 3E\alpha T$. Aquí las paredes
              ponen $\sigma_x$, que también cambia el volumen.
          - valor: '0.26'
            mensaje: |
              Has puesto en $\varepsilon_y$ y $\varepsilon_z$ solo la
              dilatación libre, $\alpha T$: falta el Poisson de la parte
              térmica de $\sigma_x$, $\nu\alpha T$. El factor es $1 + \nu$.
          - valor: '0.37143'
            mensaje: |
              Sale con $\sigma_x = -\nu\sigma_0 + E\alpha T$: el término
              térmico con el signo cambiado deja el factor de $\alpha T$ en
              $1 - \nu$. Al calentarse, las paredes comprimen más.
        pista: |
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$ con
          $\varepsilon_x = 0$, o la ec. 4.8 con el término térmico,
          $3\alpha T$, y la $\sigma_x$ de a/.
        desarrollo: |
          Con $\varepsilon_x = 0$:

          $$
          e = \varepsilon_y + \varepsilon_z
          = (1 + \nu)\Bigl[-(1 - 2\nu)\,\frac{\sigma_0}{E} + 2\alpha T\Bigr] = 0
          \;\Longrightarrow\;
          T = \frac{(1 - 2\nu)\,\sigma_0}{2E\alpha}
          $$

          Con $\nu = 0{,}3$, $0{,}4/2 = 0{,}2$: $T = 0{,}2\,\sigma_0/(E\alpha)$.
      - tipo: calcular
        titulo: La variación de b con esa temperatura
        pregunta: |
          Con $\nu = 0{,}3$ y esa $T$, ¿cuánto vale $\Delta b$, en unidades de
          $\sigma_0 b/E$?
        respuesta:
          tipo: numero
          valor: '-0.65'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·b/E, con su signo
        distractores:
          - valor: '-0.91'
            mensaje: |
              Es la del cuerpo sin temperatura: la fórmula del 4.1,
              $-(1 - \nu^{2})$, con $\nu = 0{,}3$. Aquí $b$ también se dilata:
              hay que sumar $(1 + \nu)\,\alpha T\,b$.
          - valor: '-0.71'
            mensaje: |
              Has sumado solo la dilatación libre, $\alpha T$. La parte térmica
              de $\sigma_x$ añade $\nu\alpha T$ por Poisson: el factor es
              $1 + \nu$.
          - valor: '0.65'
            mensaje: |
              Tiene el signo cambiado. La compresión acorta $b$ más de lo que
              la temperatura lo alarga: $\Delta b$ es negativa.
        pista: |
          $\varepsilon_y = -(1 - \nu^{2})\,\sigma_0/E + (1 + \nu)\,\alpha T$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{\sigma_0}{E}\bigl[-(1 - \nu^{2}) + (1 + \nu)\cdot\tfrac12(1 - 2\nu)\bigr]
          = -\frac{1 + \nu}{2}\,\frac{\sigma_0}{E}
          $$

          Con $\nu = 0{,}3$, $-0{,}91 + 1{,}3\cdot0{,}2 = -0{,}65$:
          $\Delta b = -0{,}65\,\sigma_0 b/E$.
      - tipo: calcular
        titulo: La variación de c con esa temperatura
        pregunta: |
          Con $\nu = 0{,}3$ y esa $T$, ¿cuánto vale $\Delta c$, en unidades de
          $\sigma_0 c/E$?
        respuesta:
          tipo: numero
          valor: '0.65'
          tolerancia: 0.002
          formato: un número, en unidades de σ0·c/E, con su signo
        distractores:
          - valor: '0.39'
            mensaje: |
              Es la del cuerpo sin temperatura. Con la $T$ de c/, $c$ se dilata
              además $(1 + \nu)\,\alpha T\,c$.
          - valor: '0.59'
            mensaje: |
              Has sumado solo la dilatación libre, $\alpha T$. El Poisson de la
              parte térmica de $\sigma_x$ añade $\nu\alpha T$.
          - valor: '0'
            mensaje: |
              $z$ es libre: no tiene tensión, pero sí deformación. El volumen
              no cambia porque lo que encoge $b$ lo crece $c$, no porque no
              cambie ninguna.
        pista: |
          $\varepsilon_z = \nu(1 + \nu)\,\sigma_0/E + (1 + \nu)\,\alpha T$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{\sigma_0}{E}\bigl[\nu(1 + \nu) + (1 + \nu)\cdot\tfrac12(1 - 2\nu)\bigr]
          = \frac{1 + \nu}{2}\,\frac{\sigma_0}{E}
          $$

          Con $\nu = 0{,}3$, $0{,}39 + 0{,}26 = 0{,}65$. Comprobación:
          $\Delta a = 0$ y $\varepsilon_y + \varepsilon_z = 0$, la variación de
          volumen nula que se buscaba.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\sigma_y = -\sigma_0$, $\sigma_z = 0$ y $\varepsilon_x = 0$, ahora
              con el término térmico de la ec. 4.19.
          - texto: >-
              De $\varepsilon_x = 0$, $\sigma_x = -\nu\sigma_0 - E\alpha T$.
          - texto: >-
              $\varepsilon_y = -(1 - \nu^{2})\,\sigma_0/E + (1 + \nu)\,\alpha T$ y
              $\varepsilon_z = \nu(1 + \nu)\,\sigma_0/E + (1 + \nu)\,\alpha T$.
          - texto: >-
              $\varepsilon_y + \varepsilon_z = 0$ da
              $T = (1 - 2\nu)\,\sigma_0/(2E\alpha)$.
          - texto: >-
              Con esa $T$, $\Delta b = -(1 + \nu)\,\sigma_0 b/(2E)$ y
              $\Delta c = (1 + \nu)\,\sigma_0 c/(2E)$.
          - texto: >-
              La temperatura no cambia $\sigma_x$: un cambio de temperatura no
              da tensiones.
            trampa: true
            mensaje: |
              No da tensiones si el cuerpo puede dilatarse libremente. Según
              $x$ las paredes se lo impiden, y la dilatación impedida aparece
              como $-E\alpha T$ en $\sigma_x$.
    resolucion: |
      **1. El estado de tensión.** El cuerpo libre en z del 4.1, ahora
      calentado. El dibujo lo lleva sacado del hueco, con la temperatura
      aparte.

      <figure class="figura-examen">
      <svg viewBox="0 0 280 220" role="img" width="420" height="330" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El cuerpo A sacado del hueco, libre en z y calentado</title>
        <desc id="dsl-d">Como en el ejercicio 4.1: el cuerpo A visto desde z, con sigma cero entrando por arriba y por abajo, la forma en U del hueco a trazos y sigma x como incógnita en lugar de las paredes; en z, nada. Dentro del cuerpo, el rótulo T: la variación de temperatura, que no es una tensión.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M90 68 L170 68 L170 148 L90 148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M68 36 H90 V148 H170 V36 H192 V170 H68 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="130" y1="25" x2="130" y2="55" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="137" y="32" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="130" y1="191" x2="130" y2="161" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="183" y1="108" x2="213" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="218" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="77" y1="108" x2="47" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
        <text x="130" y="112" font-size="9" text-anchor="middle" fill="var(--faint)">T</text>
      </svg>
      <figcaption>

      El cuerpo A sin el hueco, visto desde z: σ0 por arriba y por abajo, σx en lugar de las paredes, como incógnita, y nada en z. La temperatura, T, va dentro: dilata el cuerpo, no lo carga.

      </figcaption>
      </figure>

      - **Las condiciones** son las del 4.1: $\sigma_y = -\sigma_0$,
        $\varepsilon_x = 0$ y $\sigma_z = 0$.
      - **Cada deformación** lleva además $\alpha T$ (ec. 4.19, p. 8).

      **2. Incógnitas.** $\sigma_x$; las variaciones de las aristas; la T que
      anula la variación de volumen, y las aristas con esa T.

      **3. Ecuaciones.** Hooke con temperatura en las tres direcciones (ec.
      4.19) y la variación de volumen unitaria:

      $$
      \varepsilon_i = \frac{\sigma_i - \nu(\sigma_j + \sigma_k)}{E} + \alpha T
      \qquad
      e = \varepsilon_x + \varepsilon_y + \varepsilon_z
      $$

      **4. Resultados.** **a/** De $\varepsilon_x = 0$:

      $$
      \sigma_x = -\nu\sigma_0 - E\alpha T,\qquad
      \sigma_y = -\sigma_0,\qquad
      \sigma_z = 0
      $$

      **b/** Llevando $\sigma_x$ a las ecuaciones de $y$ y de $z$:

      $$
      \Delta a = 0,\qquad
      \Delta b = \Bigl[-(1 - \nu^{2})\,\frac{\sigma_0}{E} + (1 + \nu)\,\alpha T\Bigr]b,\qquad
      \Delta c = \Bigl[\nu(1 + \nu)\,\frac{\sigma_0}{E} + (1 + \nu)\,\alpha T\Bigr]c
      $$

      El factor $1 + \nu$ de $\alpha T$ es la dilatación libre más la que
      empuja hacia $y$ y hacia $z$ la parte térmica de $\sigma_x$.

      **c/** Como $\varepsilon_x = 0$, $e = \varepsilon_y + \varepsilon_z$:

      $$
      e = (1 + \nu)\Bigl[-(1 - 2\nu)\,\frac{\sigma_0}{E} + 2\alpha T\Bigr] = 0
      \;\Longrightarrow\;
      T = \frac{(1 - 2\nu)\,\sigma_0}{2E\alpha}
      $$

      Positiva: hay que calentar para compensar lo que la carga encoge.

      **d/** Con esa T, el término térmico vale
      $(1 + \nu)(1 - 2\nu)\,\sigma_0/(2E)$, y

      $$
      \Delta a = 0,\qquad
      \Delta b = -\frac{1 + \nu}{2}\,\frac{\sigma_0 b}{E},\qquad
      \Delta c = \frac{1 + \nu}{2}\,\frac{\sigma_0 c}{E}
      $$

      **El ejemplo nuestro.** Con $\nu = 0{,}3$:
      $T = 0{,}2\,\sigma_0/(E\alpha)$, $\Delta b = -0{,}65\,\sigma_0 b/E$ y
      $\Delta c = 0{,}65\,\sigma_0 c/E$.

      **5. Comprobación.** Con d/, el volumen:
      $ac\,\Delta b + ab\,\Delta c = \bigl(-\tfrac{1 + \nu}{2} + \tfrac{1 + \nu}{2}\bigr)\,\sigma_0\,abc/E = 0$.
      Y el motor del curso, con esas tensiones y esa temperatura, devuelve
      $\varepsilon_x = 0$ y una variación de volumen nula.

      **Lo que dice el resultado.** Calentar un cuerpo que no puede
      dilatarse sí da tensiones: las paredes lo aprietan $E\alpha T$ más que
      sin temperatura. Y con la T de c/, lo que se acorta $b$ lo crece $c$,
      en proporción: el cuerpo cambia de forma sin cambiar de volumen.

  # ── Ejercicio de clase 4.5 · acero y aluminio en un hueco rígido,
  #    separados por una placa rígida, con temperaturas distintas.
  - id: ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa
    titulo: Acero y aluminio en un hueco rígido, separados por una placa
    fuente: >-
      Ejercicio 4.5 · Tema 4, «El cuerpo elástico» · Elasticidad y Resistencia
      de Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ley de Hooke con temperatura de los apuntes (ec. 4.19,
      p. 8). Cada cifra sale del motor del curso, que pasa de tensiones a
      deformaciones con el término térmico y da la variación de volumen, y
      está comprobada por un segundo camino: las fórmulas despejadas a mano y
      los volúmenes de los bloques deformados, multiplicando sus tres aristas.
      El enunciado está transcrito de la página del ejercicio, con el
      «alumnio» del original, con los datos en una tabla como allí y con la
      nota aparte.
    nivel: practica
    antes:
      idea: |
        Son dos cuerpos, cada uno con su material y su temperatura, en el mismo
        hueco. Cada uno cumple su ley de Hooke con temperatura; lo que los ata
        es lo que hay entre ellos y alrededor.
      formula: |
        $$
        \varepsilon_y = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E} + \alpha\,\Delta T
        $$

        La ley de Hooke con temperatura (ec. 4.19), y las otras dos igual, una
        vez por bloque, con sus $E$, $\nu$, $\alpha$ y $\Delta T$.
      reconocer: |
        Antes de las cuentas, mira cada cara de cada bloque: cuáles están
        libres, cuáles tocan algo rígido y qué de eso puede moverse.
    enunciado: |
      2 paralelepípedos, uno de acero(1) y uno de alumnio(2), de dimensiones
      a·b·c según los ejes *x*, *y*, *z* respectivamente, se ajustan en el
      hueco de una pieza rígida separados por una placa rígida. Ambos cuerpos
      sufren variaciones de temperatura diferentes. Teniendo en cuenta que
      existe libertad de deformación según el eje *x*, determinar:

      a/ Tensiones principales en cada bloque.

      b/ Variación de longitud de las aristas.

      c/ Variación de volumen de cada bloque.

      *a* = 20 cm, *b* = 20 cm, *c* = 20 cm

      | | Acero | Aluminio |
      |---|---|---|
      | $E$ (kp/cm²) | $2\cdot10^{6}$ | $0{,}69\cdot10^{6}$ |
      | $\alpha$ (ºC⁻¹) | $0{,}117\cdot10^{-4}$ | $0{,}234\cdot10^{-4}$ |
      | $\nu$ | 0,25 | 0,23 |
      | $\Delta T$ (ºC) | 60 | 50 |

      <figure class="figura-examen">
      <svg viewBox="0 25 550 295" role="img" width="550" height="295" aria-labelledby="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-t ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-d">
      <title id="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-t">Los bloques de acero (1) y de aluminio (2) del ejercicio 4.5, separados por una placa rígida</title>
      <desc id="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-d">Una pieza rígida rayada con forma de U, abierta por arriba. En su hueco, dos bloques de anchura b y altura c: el 1, de acero, sombreado, contra la pared de la izquierda, y el 2, de aluminio, punteado, contra la de la derecha. Entre los dos, una placa rígida delgada, con otro rayado, que se apoya en el fondo y sube hasta lo alto de las paredes, por encima de los bloques. La altura c se acota a la derecha y la anchura b debajo del bloque 2. Aparte, a la derecha, los ejes y, hacia la derecha, y z, hacia arriba.</desc>
      <defs><pattern id="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-pu" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--paper)"/><rect width=".7" height="4" fill="var(--faint)"/><rect width="4" height=".7" fill="var(--faint)"/></pattern><pattern id="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-pp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--paper)"/><rect width="1" height="6" fill="var(--ink)"/><rect width="6" height="1" fill="var(--ink)"/></pattern><pattern id="ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-pd" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="var(--paper)"/><circle cx="1.5" cy="1.5" r=".65" fill="var(--faint)"/><circle cx="4" cy="4" r=".65" fill="var(--faint)"/></pattern></defs>
      <path d="M60 50 H120 V210 H316 V50 H376 V265 H60 Z" fill="url(#ejerm4-cl4-5-acero-y-aluminio-separados-por-una-placa-fig-pu)" stroke="var(--ink)" stroke-width="1.4"/>
