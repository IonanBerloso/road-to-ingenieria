    notas:
      - >-
        Nota: $E$, $\nu$ son datos.
    pide: >-
      Las tensiones principales, la variación de longitud de las aristas y la
      variación de volumen del cuerpo A, en función de σ0, E y ν.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condiciones ponen la carga, el hueco y la libertad en $z$?
        opciones:
          - texto: >-
              $\sigma_y = -\sigma_0$, $\varepsilon_x = 0$ y $\sigma_z = 0$
            correcta: true
            mensaje: |
              Eso es. La carga empuja la cara de arriba: compresión,
              $\sigma_y = -\sigma_0$. Las paredes rígidas no dejan que $a$
              cambie: $\varepsilon_x = 0$, y la tensión $\sigma_x$ es la que
              ellas ponen. Y en $z$ nada sujeta las caras: $\sigma_z = 0$, y
              $\varepsilon_z$ es la que salga.
          - texto: >-
              $\sigma_y = -\sigma_0$, $\sigma_x = 0$ y $\varepsilon_z = 0$
            mensaje: |
              Están cambiadas. Las paredes del hueco son las de $x$: impiden
              el alargamiento según $x$, y para eso empujan, así que lo nulo es
              $\varepsilon_x$, no $\sigma_x$. La libertad en $z$ es lo
              contrario: nadie empuja, $\sigma_z = 0$.
          - texto: >-
              $\sigma_y = +\sigma_0$, $\varepsilon_x = 0$ y $\sigma_z = 0$
            mensaje: |
              Las flechas de $\sigma_0$ llegan a la cara de arriba y la
              empujan hacia dentro del cuerpo: es una compresión, y con el
              convenio de signos de los apuntes es negativa.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cuerpo A sacado del hueco,
          visto desde z**, con lo que se sabe y lo que se busca.
        comprueba:
          - punto: |
              **$\sigma_0$ entrando por arriba, y lo mismo por abajo.**
            porque: |
              El fondo responde con lo mismo: $\sigma_y = -\sigma_0$ en todo el
              cuerpo, porque el estado es uniforme.
          - punto: |
              **En lugar de las paredes, $\sigma_x$ como incógnita, dibujada
              positiva.**
            porque: |
              Sin rozamiento, la pared solo da tensión normal. Las paredes,
              rígidas, imponen $\varepsilon_x = 0$.
          - punto: |
              **En z, nada.**
            porque: |
              La dirección z es libre: $\sigma_z = 0$.
        figura: |
          <svg viewBox="0 0 280 220" role="img" width="280" height="220" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El cuerpo A sacado del hueco, libre en z</title>
            <desc id="dsl-d">Un cuadrado, el cuerpo A visto desde z, con x horizontal e y vertical. Arriba, sigma cero entrando, la carga; abajo, otra flecha entrando, la respuesta del fondo. A trazos, la forma en U del hueco quitado, y en lugar de las paredes, sigma x como incógnita, dibujada positiva. En z, nada.</desc>
            <defs>
