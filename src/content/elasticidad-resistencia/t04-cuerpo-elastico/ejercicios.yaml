        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="347.4" y1="136.3" x2="379.6" y2="117.7" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <text x="23" y="191" font-size="11" font-weight="700" fill="var(--ink)">a) 13,28°</text>
        <text x="258" y="191" font-size="11" font-weight="700" fill="var(--ink)">b) 30°</text>
      </svg>
      <figcaption>

      Con las tensiones en su sentido real, en MPa: a) los planos principales, en las direcciones de las deformaciones principales; b) el plano perpendicular a la galga a y su perpendicular.

      </figcaption>
      </figure>

      **La deformación que la roseta no mide**, con $\sigma_z = 0$:
      $\varepsilon_z = -\tfrac{\nu}{E}(\sigma_x + \sigma_y) = -2\cdot10^{-4}$.

      **5. Comprobación.** Por Hooke en las direcciones principales de
      deformación salen las mismas principales:
      $\sigma_1 = 1{,}6\cdot10^{6}\cdot(5{,}2361 + 0{,}25\cdot0{,}7639)\cdot10^{-4} = 868{,}33$ MPa
      y $\sigma_2 = 1{,}6\cdot10^{6}\cdot(0{,}7639 + 0{,}25\cdot5{,}2361)\cdot10^{-4} = 331{,}67$ MPa.
      Y el plano, por Cauchy: con $\vec n = (\cos30°, \operatorname{sen}30°)$,
      $\vec S = [\sigma]\{n\} = (787{,}46;\ 283{,}92)$ MPa, y
      $\vec S\cdot\vec n = 787{,}46\cdot0{,}86603 + 283{,}92\cdot0{,}5 = 823{,}92$ MPa
      y $\vec S\cdot\hat t = -787{,}46\cdot0{,}5 + 283{,}92\cdot0{,}86603 = -147{,}85$ MPa.

      **Lo que dice el resultado.** Las direcciones principales de tensión
      son las de deformación: el material es isótropo. Pero
      $\sigma_1 \ne E\varepsilon_1$: $E\varepsilon_1$ daría 785,41 MPa, y la
      $\varepsilon_2$ aporta el resto, por el efecto Poisson. Con el módulo
      probable, $1{,}5\cdot10^{6}$ kp/cm², todas las tensiones serían unas
      diez veces menores, y $\varepsilon_z$ no cambiaría.

  # ── Ejercicio de clase 4.1 · el cuerpo elástico en el hueco rígido, libre
  #    en z. Resultado simbólico; los pasos lo comprueban con ν = 0,25.
  - id: ejerm4-cl4-1-el-cuerpo-libre-en-z
    titulo: El cuerpo elástico en el hueco rígido, libre en z
    fuente: >-
      Ejercicio 4.1 · Tema 4, «El cuerpo elástico» · Elasticidad y Resistencia
      de Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ley de Hooke de los apuntes (ecs. 4.2 y 4.8, pp. 4 y 6).
      El resultado es simbólico; los pasos de cálculo lo comprueban con
      ν = 0,25, un ejemplo nuestro, con las cifras del motor del curso, que
      pasa de tensiones a deformaciones, comprobadas por un segundo camino: las
      fórmulas cerradas en función de ν. El enunciado está transcrito de la
      página del ejercicio, con su negrita y con la nota aparte.
    nivel: practica
    antes:
      idea: |
        Cada dirección da una condición: en unas se conoce la tensión y en otras
        la deformación. Con tres condiciones y las tres ecuaciones de Hooke se
        cierra el problema.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}
        \qquad
        \frac{\Delta V}{V} = \frac{1 - 2\nu}{E}\,(\sigma_x + \sigma_y + \sigma_z)
        $$

        La ley de Hooke, y las otras dos igual (ec. 4.2), y la variación de
        volumen (ec. 4.8).
      reconocer: |
        Antes de las cuentas, traduce cada frase del enunciado a una condición
        en una dirección: la carga, el hueco y lo que dice de z.
    enunciado: |
      El cuerpo elástico A se ajusta en el hueco del cuerpo rígido B,
      **teniendo libertad de deformación en dirección z**. El cuerpo soporta la
      tensión $\sigma_0$ y el estado de deformación es uniforme. Siendo *a*,
      *b*, *c* las dimensiones paralelas a los ejes *x*, *y*, *z*
      respectivamente, determinar:

      a/ El valor de las tensiones principales $\sigma_x$, $\sigma_y$,
      $\sigma_z$.

      b/ La variación de longitud de las aristas del cuerpo A.

      c/ La variación de volumen del cuerpo A.

