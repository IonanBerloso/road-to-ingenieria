# De ocho en ocho y no de diez: con la caja, el paso de dibujarlo y la
# resolución en cinco partes, el primer bloque de diez pesaba 2,86 MB,
# a un paso de los 3 MB (lib/ejercicios.ts).
porPagina: 8
ejercicios:
  # ── Ejemplo introductorio nuestro · de las deformaciones a las tensiones.
  - id: ejerm4-de-la-roseta-a-las-tensiones
    titulo: Las tensiones que hay detrás de una roseta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        Una roseta da deformaciones; las tensiones salen de la ley de Hooke
        despejada al revés. En una cara libre el estado es de tensión plana, y
        eso fija qué ecuaciones se despejan.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu\sigma_y}{E}
        \qquad
        \varepsilon_y = \frac{\sigma_y - \nu\sigma_x}{E}
        \qquad
        \gamma_{xy} = \frac{\tau_{xy}}{G}
        $$

        La ley de Hooke en el plano, sin tensión en z (ec. 4.2): hay que
        despejar las tensiones.
      reconocer: |
        Te dan deformaciones y piden tensiones: es Hooke al revés. Antes de
        despejar, decide qué estado es por dónde está pegada la roseta.
    enunciado: |
      Una roseta está pegada en una cara libre, sin ninguna carga, de una
      pieza de acero con $E = 200\ \text{GPa}$ y $\nu = 0{,}3$. Con
      sus tres lecturas ya resueltas, da en ese punto

      $$
      \varepsilon_x = 705 \cdot 10^{-6}
      \qquad
      \varepsilon_y = -75 \cdot 10^{-6}
      \qquad
      \gamma_{xy} = 520 \cdot 10^{-6}
      $$

      Calcular $\sigma_x$, $\sigma_y$ y $\tau_{xy}$, y la deformación
      $\varepsilon_z$, perpendicular a la cara, que la roseta no mide.
    pide: >-
      σx, σy y τxy, en MPa, y εz, en millonésimas.
    pasos:
      - tipo: reconocer
        pregunta: |
          $\varepsilon_y$ sale negativa: en $y$ el material se acorta. Antes de
          calcular, ¿qué dice eso de $\sigma_y$?
        opciones:
          - texto: Nada todavía, porque $\sigma_x$ también acorta $y$; el signo sale de Hooke en tensión plana, con las dos deformaciones
            correcta: true
            mensaje: |
              Eso es. En una cara libre $\sigma_z = 0$: tensión plana
              (apuntes, ec. 4.23, p. 9). Cada deformación del plano depende de
              las dos tensiones, $\varepsilon_y = (\sigma_y - \nu\sigma_x)/E$,
              y una $\sigma_x$ grande acorta $y$ aunque $\sigma_y$ tire. Lo que
              da el signo de $\sigma_y$ es $\varepsilon_y + \nu\varepsilon_x$
              (ec. 4.25).
          - texto: Que $\sigma_y$ es de compresión, $\sigma_y = E\varepsilon_y$
            mensaje: |
              Es el error de pasar de galgas a tensiones con
              $\sigma = E\varepsilon$, que es la ley de una barra con una sola
              tensión. Aquí hay dos en el plano, y cada una cambia la
              deformación de la otra dirección.
          - texto: Que no se puede saber sin $\sigma_z$, que el enunciado no da
            mensaje: |
              Lo da: la roseta está en una cara sin carga, y ahí
              $\sigma_z = 0$. Lo que no es cero, y no mide la roseta, es
              $\varepsilon_z$.

      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el elemento de la cara libre,
          con lo que se busca**.
        comprueba:
          - punto: |
              **$\sigma_x$, $\sigma_y$ y $\tau_{xy}$ como incógnitas, dibujadas
              positivas.**
            porque: |
              Son lo que se pide; su signo lo darán las cuentas, no el de las
              deformaciones.
          - punto: |
              **En la cara z, la del papel, nada.**
            porque: |
              La roseta está en una cara sin carga:
              $\sigma_z = \tau_{zx} = \tau_{yz} = 0$, tensión plana.
          - punto: |
              **Las tres deformaciones, aparte, como datos.**
            porque: |
              Son las de la roseta, ya resueltas: $\varepsilon_x$,
              $\varepsilon_y$ y la $\gamma_{xy}$ entera.
        figura: |
          <svg viewBox="0 0 260 200" role="img" width="260" height="200" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">El elemento de la cara libre, con sus tres incógnitas</title>
            <desc id="dsl-d">Un cuadrado con las caras x e y, visto desde z: sigma x, sigma y y tau xy como incógnitas, dibujadas positivas. En la cara z, la del papel, nada: está libre.</desc>
            <defs>
