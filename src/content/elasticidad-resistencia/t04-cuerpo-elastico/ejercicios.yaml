    pide: >-
      εx, εy y γxy en función de εa, εb y εc y con las lecturas; las
      deformaciones principales y la dirección de la mayor.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A qué ángulos de $x$, medidos en sentido antihorario, están las
          tres galgas?
        opciones:
          - texto: La a a 30°, la b a 0° y la c a −60°
            correcta: true
            mensaje: |
              Eso es. La b va sobre $x$. El 30° se mide de $x$ a la a, hacia
              arriba. El arco de 60° baja de la b a la c, en sentido horario:
              la c está a $-60°$, que es la misma recta que 120°. Y la a y la c
              forman 90°.
          - texto: La a a 30°, la b a 0° y la c a 60°
            mensaje: |
              El arco de 60° baja desde la b hasta la c: va en sentido horario,
              y medido desde $x$ en sentido antihorario es $-60°$. A $+60°$ la
              c estaría por encima del eje, al lado de la a.
          - texto: La a a 30°, la b a 0° y la c a −30°
            mensaje: |
              El arco de 60° sale de la b, que va sobre $x$: se mide desde
              $x$, no desde el eje $y$. La c está a $-60°$.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **las tres galgas con el ángulo
          de cada una desde x**.
        comprueba:
          - punto: |
              **b sobre x: $\varepsilon_x = \varepsilon_b$.**
            porque: |
              Una galga mide la deformación normal de su dirección.
          - punto: |
              **a a 30° por encima de x, y c a 60° por debajo, en $-60°$.**
            porque: |
              El arco de la c va desde la b hacia abajo, en sentido horario.
          - punto: |
              **a y c, perpendiculares.**
            porque: |
              $30° - (-60°) = 90°$: la suma de sus lecturas es el primer
              invariante del plano, $\varepsilon_x + \varepsilon_y$.
        figura: |
          <svg viewBox="0 0 270 220" role="img" width="270" height="220" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Las tres galgas con sus ángulos desde x</title>
            <desc id="dsl-d">Desde un punto O salen tres flechas finas: b hacia la derecha, sobre el eje x; a hacia arriba a la derecha, a 30 grados de x; y c hacia abajo a la derecha, a 60 grados por debajo de x. Dos arcos marcan los dos ángulos.</desc>
            <defs>
              <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
              </marker>
              <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
              </marker>
              <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
              </marker>
            </defs>
            <path d="M130 110 A70 70 0 0 0 120.6 75" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="134" y="96" font-size="10" fill="var(--ink)">30°</text>
            <path d="M82 148.1 A44 44 0 0 0 104 110" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
            <text x="108" y="142" font-size="10" fill="var(--ink)">60°</text>
            <line x1="60" y1="110" x2="200" y2="110" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="204" y="114" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">b (x)</text>
            <line x1="60" y1="110" x2="181.2" y2="40" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="186" y="38" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a</text>
            <line x1="60" y1="110" x2="115" y2="205.3" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
            <text x="121" y="206" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">c</text>
            <circle cx="60" cy="110" r="2.4" fill="var(--ink)"/>
            <text x="52" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
          </svg>

      - tipo: calcular
        titulo: La deformación εy
        pregunta: |
          ¿Cuánto vale $\varepsilon_y$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '-2.464'
            mensaje: |
              Sale con la galga c a $+60°$. Está a $-60°$: con
              $\operatorname{sen}(-60°)\cos(-60°) = -\tfrac{\sqrt3}{4}$, el
              término de $\gamma_{xy}$ entra restando en $\varepsilon_c$.
          - valor: '1.134'
            mensaje: |
              Es $\varepsilon_c$: has usado la roseta a 45°, donde la tercera
              galga está sobre $y$ y lee $\varepsilon_y$ tal cual. Aquí la c
              está a $-60°$, y las fórmulas de la roseta a 45° solo valen con
              las galgas a 0°, 45° y 90°.
        pista: |
          La a y la c son perpendiculares (30° y $-60°$), y la suma de las
          deformaciones de dos direcciones perpendiculares no depende de los
          ejes: $\varepsilon_a + \varepsilon_c = \varepsilon_x + \varepsilon_y$.
        desarrollo: |
          Con la ec. 3.55, $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta$,
          en cada galga:

          $$
          \varepsilon_a = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
          \varepsilon_b = \varepsilon_x,\qquad
          \varepsilon_c = \tfrac{1}{4}\varepsilon_x + \tfrac{3}{4}\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
          $$

          Sumando la a y la c, $\varepsilon_a + \varepsilon_c = \varepsilon_x + \varepsilon_y$,
          y con $\varepsilon_x = \varepsilon_b$:

          $$
          \varepsilon_y = \varepsilon_a + \varepsilon_c - \varepsilon_b = (4{,}866 + 1{,}134 - 5)\cdot10^{-4} = 1\cdot10^{-4}
          $$
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '4'
            mensaje: |
              Este número sale de dos errores distintos: la galga c a $+60°$, o
              la fórmula de la galga escrita con $\tfrac12\gamma_{xy}$. La c
              está a $-60°$, y la ec. 3.55 lleva
              $\gamma_{xy}\operatorname{sen}\theta\cos\theta$ con la $\gamma$
              entera: la mitad va en el tensor y en el círculo, no aquí.
          - valor: '1'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, la componente del tensor. Lo que se
              pide es la distorsión, la $\gamma_{xy}$ entera.
        pista: |
          Resta la c de la a:
          $\varepsilon_a - \varepsilon_c = \tfrac12(\varepsilon_x - \varepsilon_y) + \tfrac{\sqrt3}{2}\gamma_{xy}$.
        desarrollo: |
          $$
          \gamma_{xy} = \frac{2(\varepsilon_a - \varepsilon_c) - (\varepsilon_x - \varepsilon_y)}{\sqrt3}
          = \frac{3\varepsilon_a - \varepsilon_c - 2\varepsilon_b}{\sqrt3}
          $$

          $$
          \gamma_{xy} = \frac{3\cdot4{,}866 - 1{,}134 - 2\cdot5}{\sqrt3}\cdot10^{-4} = 2{,}000\cdot10^{-4}
          $$

          Comprobación con la galga a:
          $\tfrac{3}{4}\cdot5 + \tfrac{1}{4}\cdot1 + \tfrac{\sqrt3}{4}\cdot2 = 4{,}866$.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale la deformación principal mayor, $\varepsilon_1$, en
          unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '5.2361'
          tolerancia: 0.002
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '5.8284'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. En el círculo de
              deformaciones el eje vertical es $\tfrac12\gamma$: el radio es
              $\sqrt{2^{2} + 1^{2}}$, no $\sqrt{2^{2} + 2^{2}}$.
          - valor: '2.2361'
            mensaje: |
              Es el radio del círculo, $\sqrt5$. La principal es el centro más
              el radio.
        pista: |
          Centro $\tfrac12(\varepsilon_x + \varepsilon_y)$ y radio
          $\sqrt{\left(\tfrac12(\varepsilon_x - \varepsilon_y)\right)^{2} + \left(\tfrac12\gamma_{xy}\right)^{2}}$.
        desarrollo: |
          $$
          C = \frac{5 + 1}{2} = 3,\qquad R = \sqrt{2^{2} + 1^{2}} = 2{,}2361
          $$

          $\varepsilon_1 = 3 + 2{,}2361 = 5{,}2361$ y
          $\varepsilon_2 = 3 - 2{,}2361 = 0{,}7639$, en $10^{-4}$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿A qué ángulo de $x$, en grados y en sentido antihorario, está la
          dirección principal 1?
        respuesta:
          tipo: numero
          valor: '13.28'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '26.56'
            mensaje: |
              Es $2\theta_1$, el ángulo que se gira en el círculo. En el
              material el ángulo es la mitad.
          - valor: '-13.28'
            mensaje: |
              El signo. Con $\gamma_{xy} > 0$ el ángulo recto entre $x$ e $y$
              se cierra, y el alargamiento máximo queda entre $+x$ y $+y$.
              Compruébalo con la ec. 3.55: a $+13{,}28°$ la galga leería
              $5{,}236$, y a $-13{,}28°$, $4{,}342$.
        pista: |
          $\tan2\theta_1 = \dfrac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y}$;
          como $\varepsilon_x > \varepsilon_y$, la dirección 1 es la que está a
          menos de 45° de $x$.
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{2}{5 - 1} = 0{,}5
          \;\Longrightarrow\; 2\theta_1 = 26{,}56°,\qquad \theta_1 = 13{,}28°
          $$

          La dirección 2 está a $103{,}28°$. Comprobación con la ec. 3.55 en
          $\theta_1$: $5\cos^{2}\theta_1 + \operatorname{sen}^{2}\theta_1 + 2\operatorname{sen}\theta_1\cos\theta_1 = 5{,}236$,
          la $\varepsilon_1$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La a está a 30°, la b a 0° y la c a $-60°$: la b da
              $\varepsilon_x$, y la a y la c, perpendiculares, cumplen
              $\varepsilon_a + \varepsilon_c = \varepsilon_x + \varepsilon_y$.
          - texto: >-
              $\varepsilon_x = \varepsilon_b = 5$,
              $\varepsilon_y = \varepsilon_a + \varepsilon_c - \varepsilon_b = 1$ y
              $\gamma_{xy} = (3\varepsilon_a - \varepsilon_c - 2\varepsilon_b)/\sqrt3 = 2$,
              en $10^{-4}$.
          - texto: >-
              El círculo tiene centro 3 y radio $\sqrt5$:
              $\varepsilon_1 = 5{,}236$ y $\varepsilon_2 = 0{,}764$, en
              $10^{-4}$.
          - texto: >-
              $\tan2\theta_1 = 2/4$: la dirección 1 está a $13{,}28°$ de $x$ y
              la 2, a $103{,}28°$.
          - texto: >-
              Como la c está a 60° de la b, las tres forman la roseta a 120° de
              los apuntes y valen sus fórmulas (ecs. 3.65-3.66).
            trampa: true
            mensaje: |
              La roseta a 120° de los apuntes lleva las galgas a 0°, 120° y
              240°. Aquí están a 30°, 0° y $-60°$, y la a y la c forman 90°:
              hay que escribir la ec. 3.55 para cada galga.
    resolucion: |
      **1. El estado de deformación.** Es una roseta de tres galgas en un
      estado de tensión plana. El dibujo lleva las tres con su ángulo desde
      x.

      <figure class="figura-examen">
      <svg viewBox="0 0 270 220" role="img" width="405" height="330" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Las tres galgas con sus ángulos desde x</title>
        <desc id="dsl-d">Desde un punto O salen tres flechas finas: b hacia la derecha, sobre el eje x; a hacia arriba a la derecha, a 30 grados de x; y c hacia abajo a la derecha, a 60 grados por debajo de x. Dos arcos marcan los dos ángulos.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M130 110 A70 70 0 0 0 120.6 75" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="134" y="96" font-size="10" fill="var(--ink)">30°</text>
        <path d="M82 148.1 A44 44 0 0 0 104 110" fill="none" stroke="var(--ink)" stroke-width="0.9"/>
        <text x="108" y="142" font-size="10" fill="var(--ink)">60°</text>
        <line x1="60" y1="110" x2="200" y2="110" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="204" y="114" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">b (x)</text>
        <line x1="60" y1="110" x2="181.2" y2="40" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="186" y="38" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">a</text>
        <line x1="60" y1="110" x2="115" y2="205.3" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#dsl-fe)"/>
        <text x="121" y="206" font-size="10" text-anchor="start" fill="var(--ink)" font-style="italic">c</text>
        <circle cx="60" cy="110" r="2.4" fill="var(--ink)"/>
        <text x="52" y="114" font-size="10" text-anchor="end" font-weight="700" fill="var(--ink)">O</text>
      </svg>
      <figcaption>

      Las tres galgas: b sobre x, a a 30° y c a −60°, medidos desde x en sentido antihorario. a y c son perpendiculares.

      </figcaption>
      </figure>

      - **b** va sobre x, **a** a 30° por encima y **c** a 60° por debajo, en
        $-60°$.
      - **a y c** son perpendiculares.

      **2. Incógnitas.** $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$, en
      función de las lecturas y con sus números; y las deformaciones
      principales con la dirección de la mayor.

      **3. Ecuaciones.** La ec. 3.55 (apuntes del tema 3) para cada galga,
      con la $\gamma$ entera, y el círculo de deformaciones, con
      $\tfrac12\gamma$ en el eje vertical:

      $$
      \varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta
      \qquad
      \tan2\theta_1 = \frac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y}
      $$

      **4. Resultados.** **a/ Las deformaciones en función de las
      lecturas.** Con $\theta = 30°$, $0°$ y $-60°$:

      $$
      \varepsilon_a = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
      \varepsilon_b = \varepsilon_x,\qquad
      \varepsilon_c = \tfrac{1}{4}\varepsilon_x + \tfrac{3}{4}\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
      $$

      Sumando las de a y c,
      $\varepsilon_a + \varepsilon_c = \varepsilon_x + \varepsilon_y$;
      restándolas,
      $\varepsilon_a - \varepsilon_c = \tfrac12(\varepsilon_x - \varepsilon_y) + \tfrac{\sqrt3}{2}\gamma_{xy}$.
      Así:

      $$
      \varepsilon_x = \varepsilon_b,\qquad
      \varepsilon_y = \varepsilon_a + \varepsilon_c - \varepsilon_b,\qquad
      \gamma_{xy} = \frac{3\varepsilon_a - \varepsilon_c - 2\varepsilon_b}{\sqrt3}
      $$

      Con las lecturas, en $10^{-4}$: $\varepsilon_x = 5$,
      $\varepsilon_y = 4{,}866 + 1{,}134 - 5 = 1$ y
      $\gamma_{xy} = \frac{14{,}598 - 1{,}134 - 10}{\sqrt3} = 2{,}000$.

      **b/ Deformaciones y direcciones principales.** Con
      $\tfrac12\gamma_{xy} = 1$: centro $\tfrac{5 + 1}{2} = 3$ y radio
      $\sqrt{2^{2} + 1^{2}} = 2{,}2361$.

      $$
      \varepsilon_1 = 3 + 2{,}2361 = 5{,}2361,\qquad
      \varepsilon_2 = 3 - 2{,}2361 = 0{,}7639\qquad (10^{-4})
      $$

      $$
      \tan2\theta_1 = \frac{2}{4} = 0{,}5
      \;\Longrightarrow\; \theta_1 = 13{,}28°
      $$

      La dirección 1 está a $13{,}28°$ de $x$, entre $+x$ y $+y$ porque
      $\gamma_{xy} > 0$, y la 2 a $103{,}28°$. La distorsión máxima en el
      plano es el diámetro, $\gamma_{max} = 2\cdot2{,}2361 = 4{,}472$, en
      $10^{-4}$.

      <figure class="figura-examen">
      <svg viewBox="0 0 296 200" role="img" width="444" height="300" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">El círculo de Mohr de deformaciones del ejercicio 4.4</title>
        <desc id="dsl-d">El eje epsilon horizontal y el eje gamma medios vertical. El círculo tiene el centro en 3 y radio 2,24, todo a la derecha del origen: corta el eje en 5,24, el punto 1, y en 0,76, el punto 2. El punto x, en (5, 1), va abajo; el y, en (1, 1), arriba, en el otro extremo del diámetro.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M240 140 L80 60" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M70.6 100 A89.4 89.4 0 1 0 249.4 100 A89.4 89.4 0 1 0 70.6 100" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="24" y1="100" x2="276" y2="100" stroke="var(--faint)" stroke-width="0.7"/>
        <line x1="40" y1="194" x2="40" y2="6" stroke="var(--faint)" stroke-width="0.7"/>
        <circle cx="240" cy="140" r="2.4" fill="var(--ink)"/>
        <text x="246" y="153" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">x</text>
        <circle cx="80" cy="60" r="2.4" fill="var(--ink)"/>
        <text x="86" y="55" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">y</text>
        <circle cx="249.4" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="255.4" y="95" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">1</text>
        <circle cx="70.6" cy="100" r="2.4" fill="var(--ink)"/>
        <text x="60" y="95" font-size="10" text-anchor="start" font-weight="700" fill="var(--ink)">2</text>
        <text x="279" y="104" font-size="9" text-anchor="start" fill="var(--faint)">ε</text>
        <text x="45" y="10" font-size="9" text-anchor="start" fill="var(--faint)">γ/2</text>
        <text x="36" y="112" font-size="9" text-anchor="end" fill="var(--faint)">O</text>
      </svg>
      <figcaption>

      El círculo de deformaciones, a escala, en 10⁻⁴: ε en el eje horizontal y γ/2 en el vertical. x va abajo porque γxy es positiva; de x a 1 se suben 26,57°, el doble de los 13,28° de la dirección 1.

      </figcaption>
      </figure>

      **5. Comprobación.** La ec. 3.55 en $\theta_1 = 13{,}28°$ da
      $5{,}236$, la $\varepsilon_1$; y
      $\varepsilon_1 + \varepsilon_2 = 6 = \varepsilon_x + \varepsilon_y$.
      Las tres lecturas vuelven con $\varepsilon_x = 5$, $\varepsilon_y = 1$
      y $\gamma_{xy} = 2$: la de la a, por ejemplo,
      $\tfrac{3}{4}\cdot5 + \tfrac{1}{4}\cdot1 + \tfrac{\sqrt3}{4}\cdot2 = 4{,}866$.

      **Lo que dice el resultado.** La dirección 1 está a solo 13,28° de x:
      la galga b casi lee la deformación mayor, 5 frente a 5,236. Y no es la
      roseta a 120° de los apuntes: la c está a 60° de la b, pero la a está a
      30°, y sus fórmulas darían otros números.

  # ── Ejercicio de clase 4.4, apartado c/ · de las deformaciones a las
  #    tensiones. Repite el enunciado entero y la figura, con sus propios ids.
  - id: ejerm4-cl4-4-las-tensiones-de-la-roseta
    titulo: La roseta del ejercicio 4.4, de las deformaciones a las tensiones y al plano perpendicular a la galga a
    fuente: >-
      Ejercicio 4.4, apartado c/ · Tema 4, «El cuerpo elástico» · Elasticidad
      y Resistencia de Materiales, UPV/EHU. El material no trae solución: la
      resolución es nuestra, con los convenios de los temas 2 y 4 (Hooke en
      tensión plana, ecs. 4.24-4.25; la tangencial de un plano con la ec.
      2.61). Cada cifra sale del motor del curso y está comprobada por un
      segundo camino: las principales por Hooke en las direcciones
      principales de deformación, εz por −ν(ε1 + ε2)/(1 − ν), y σn y τn del
      plano por Cauchy, proyectando {S} = [σ]{n}. Los apartados a/ y b/ son el
      ejercicio anterior. El módulo, E = 1,5·10⁶ MPa, se usa tal como está
      impreso, aunque es casi seguro una errata (lo dicen las notas). El paso de εz es nuestro: el enunciado no lo pide.
    nivel: practica
    antes:
      idea: |
        Las galgas ya dieron las deformaciones del plano (ejercicio anterior).
        Ahora se pasa a tensiones y, con ellas, a las principales y a un plano
        cualquiera, como en el tema 2.
      formula: |
        $$
        G = \frac{E}{2(1 + \nu)}
        $$

        La relación entre las tres constantes (ec. 4.6): $G$ hace falta para
        la tangencial.
      reconocer: |
        Es pasar de deformaciones a tensiones: antes de escribir nada, mira qué
        dice el enunciado del estado.
    enunciado: |
      En el estado de tensión plana de la figura las deformaciones
      $\varepsilon_a$, $\varepsilon_b$ y $\varepsilon_c$ se obtienen mediante
      galgas extensométricas.

      a/ Determinar $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ en
      función de $\varepsilon_a$, $\varepsilon_b$ y $\varepsilon_c$.

      Siendo $\varepsilon_a = 4{,}866\cdot10^{-4}$, $\varepsilon_b$ =$5\cdot10^{-4}$,
      $\varepsilon_c = 1{,}134\cdot10^{-4}$, determinar:

      b/ Deformaciones y direcciones principales.

      c/ Tensiones y direcciones principales y las tensiones normal y
      cortante del plano que es perpendicular a la dirección $a$.

      Datos: $E = 1{,}5\cdot10^{6}$ MPa   $\nu = 0{,}25$

