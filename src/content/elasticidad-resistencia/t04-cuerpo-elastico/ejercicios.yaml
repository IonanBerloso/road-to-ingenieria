      - tipo: calcular
        titulo: La tensión σy
        pregunta: |
          ¿Cuánto vale $\sigma_y$, la misma en los dos bloques, en kp/cm²?
        respuesta:
          tipo: numero
          valor: '-960.36'
          tolerancia: 0.5
          formato: un número, en kp/cm², con su signo
        distractores:
          - valor: '-1404'
            mensaje: |
              Es $-E_1\alpha_1\Delta T_1$, la tensión del acero con la placa
              fija y $\varepsilon_y = 0$. La placa está suelta: lo que se
              anula es la suma $\Delta b_1 + \Delta b_2$, y la tensión sale de
              los dos materiales a la vez.
          - valor: '-807.3'
            mensaje: |
              Es $-E_2\alpha_2\Delta T_2$, la tensión del aluminio con la placa
              fija. Lo que no cambia es el hueco entero: la suma
              $\Delta b_1 + \Delta b_2$, con la misma $\sigma_y$ en los dos.
          - valor: '960.36'
            mensaje: |
              Tiene el signo cambiado. Los dos bloques se calientan y no tienen
              sitio para crecer según $y$: se comprimen.
          - valor: '-1258.1'
            mensaje: |
              Sale con una cara impedida en cada bloque, $\varepsilon_z = 0$ o
              $\varepsilon_x = 0$: la ecuación queda con $(1 - \nu_i^{2})/E_i$
              y $(1 + \nu_i)\,\alpha_i\Delta T_i$. La cara de arriba está libre
              y en $x$ hay libertad: $\sigma_x = \sigma_z = 0$, y cada bloque
              solo tiene $\sigma_y$.
        pista: |
          Con $\sigma_x = \sigma_z = 0$,
          $\varepsilon_{y,i} = \sigma_y/E_i + \alpha_i\Delta T_i$; y
          $b\,\varepsilon_{y,1} + b\,\varepsilon_{y,2} = 0$.
        desarrollo: |
          $$
          \sigma_y\Bigl(\frac{1}{E_1} + \frac{1}{E_2}\Bigr) = -(\alpha_1\Delta T_1 + \alpha_2\Delta T_2)
          \;\Longrightarrow\;
          \sigma_y = -\frac{\alpha_1\Delta T_1 + \alpha_2\Delta T_2}{1/E_1 + 1/E_2}
          $$

          Con los datos, $\alpha_1\Delta T_1 = 7{,}02\cdot10^{-4}$,
          $\alpha_2\Delta T_2 = 11{,}7\cdot10^{-4}$ y
          $1/E_1 + 1/E_2 = (0{,}5 + 1{,}449275)\cdot10^{-6}$, en cm²/kp:

          $$
          \sigma_y = -\frac{18{,}72\cdot10^{-4}}{1{,}949275\cdot10^{-6}} = -960{,}36
          $$

          en kp/cm², unos $-94{,}2$ MPa. $\sigma_x = \sigma_z = 0$ en los dos
          bloques.
      - tipo: calcular
        titulo: La arista a del acero
        pregunta: |
          ¿Cuánto vale $\Delta a_1$, la variación de la arista $a$ del bloque
          de acero, en unidades de $10^{-3}$ cm?
        respuesta:
          tipo: numero
          valor: '16.441'
          tolerancia: 0.05
          formato: un número, en 10⁻³ cm, con su signo
        distractores:
          - valor: '14.04'
            mensaje: |
              Es solo la dilatación térmica, $a\,\alpha_1\Delta T_1$. La
              compresión según $y$ ensancha el bloque en $x$ por Poisson:
              suma $-\nu_1\sigma_y/E_1$.
          - valor: '11.639'
            mensaje: |
              Has restado el término de Poisson. Con $\sigma_y$ negativa,
              $-\nu_1\sigma_y/E_1$ es positivo: la compresión ensancha.
          - valor: '4.4364'
            mensaje: |
              Es $\Delta b_1$, la arista según $y$. La $a$ va según $x$:
              $\varepsilon_x = -\nu_1\sigma_y/E_1 + \alpha_1\Delta T_1$.
        pista: |
          $\varepsilon_{x,1} = -\nu_1\sigma_y/E_1 + \alpha_1\Delta T_1$.
        desarrollo: |
          $$
          \varepsilon_{x,1} = \frac{0{,}25\cdot960{,}357}{2\cdot10^{6}} + 7{,}02\cdot10^{-4}
          = 8{,}2204\cdot10^{-4}
          $$

          y $\Delta a_1 = 20\cdot8{,}2204\cdot10^{-4} = 16{,}441\cdot10^{-3}$, en
          cm. La arista $c$ del acero cambia lo mismo, porque
          $\varepsilon_z = \varepsilon_x$ y $c = a$.
      - tipo: calcular
        titulo: La arista b del acero
        pregunta: |
          ¿Cuánto vale $\Delta b_1$, en unidades de $10^{-3}$ cm?
        respuesta:
          tipo: numero
          valor: '4.4364'
          tolerancia: 0.02
          formato: un número, en 10⁻³ cm, con su signo
        distractores:
          - valor: '-4.4364'
            mensaje: |
              Es $\Delta b_2$, la del aluminio. El acero, que se dilata menos,
              sigue creciendo algo según $y$ aunque esté comprimido; el que
              encoge es el aluminio.
          - valor: '14.04'
            mensaje: |
              Es solo la dilatación térmica, $b\,\alpha_1\Delta T_1$. Falta la
              compresión: $\sigma_y/E_1$.
          - valor: '0'
            mensaje: |
              Es tomar la placa por fija. Está suelta, y cada bloque cambia: lo
              que no cambia es la suma $\Delta b_1 + \Delta b_2$.
        pista: |
          $\varepsilon_{y,1} = \sigma_y/E_1 + \alpha_1\Delta T_1$.
        desarrollo: |
          $$
          \varepsilon_{y,1} = -\frac{960{,}36}{2\cdot10^{6}} + 7{,}02\cdot10^{-4}
          = (-4{,}8018 + 7{,}02)\cdot10^{-4} = 2{,}2182\cdot10^{-4}
          $$

          y $\Delta b_1 = 20\cdot2{,}2182\cdot10^{-4} = 4{,}4364\cdot10^{-3}$, en
          cm. Y $\Delta b_2 = -4{,}4364\cdot10^{-3}$ cm: la suma es cero, como
          impone la placa.
      - tipo: calcular
        titulo: La arista a del aluminio
        pregunta: |
          ¿Cuánto vale $\Delta a_2$, en unidades de $10^{-3}$ cm?
        respuesta:
          tipo: numero
          valor: '29.802'
          tolerancia: 0.05
          formato: un número, en 10⁻³ cm, con su signo
        distractores:
          - valor: '23.4'
            mensaje: |
              Es solo la dilatación térmica, $a\,\alpha_2\Delta T_2$. La
              compresión según $y$ ensancha en $x$: suma
              $-\nu_2\sigma_y/E_2$.
          - valor: '16.998'
            mensaje: |
              Has restado el término de Poisson. Con $\sigma_y$ negativa,
              $-\nu_2\sigma_y/E_2$ es positivo.
        pista: |
          $\varepsilon_{x,2} = -\nu_2\sigma_y/E_2 + \alpha_2\Delta T_2$.
        desarrollo: |
          $$
          \varepsilon_{x,2} = \frac{0{,}23\cdot960{,}36}{0{,}69\cdot10^{6}} + 11{,}7\cdot10^{-4}
          = (3{,}2012 + 11{,}7)\cdot10^{-4} = 14{,}901\cdot10^{-4}
          $$

          y $\Delta a_2 = 20\cdot14{,}901\cdot10^{-4} = 29{,}802\cdot10^{-3}$, en
          cm. La $c$ del aluminio, lo mismo.
      - tipo: calcular
        titulo: La variación de volumen del acero
        pregunta: |
          ¿Cuánto vale $\Delta V_1$, en cm³?
        respuesta:
          tipo: numero
          valor: '14.927'
          tolerancia: 0.03
          formato: un número, en cm³, con su signo
        distractores:
          - valor: '16.848'
            mensaje: |
              Es solo la dilatación térmica, $3\alpha_1\Delta T_1\,abc$. La
              compresión quita volumen: $(1 - 2\nu_1)\,\sigma_y/E_1$.
          - valor: '-1.9207'
            mensaje: |
              Es solo la parte mecánica, $(1 - 2\nu_1)\,\sigma_y\,abc/E_1$.
              Falta la dilatación térmica, $3\alpha_1\Delta T_1$, que es mucho
              mayor.
        pista: |
          $e_1 = (1 - 2\nu_1)\,\sigma_y/E_1 + 3\alpha_1\Delta T_1$, y
          $\Delta V_1 = abc\,e_1$, con $abc = 8000$ cm³.
        desarrollo: |
          $$
          e_1 = 0{,}5\cdot(-4{,}8018\cdot10^{-4}) + 21{,}06\cdot10^{-4} = 18{,}659\cdot10^{-4}
          $$

          y $\Delta V_1 = 8000\cdot18{,}659\cdot10^{-4} = 14{,}927$, en cm³. Es
          la suma de las tres deformaciones,
          $(8{,}2204 + 2{,}2182 + 8{,}2204)\cdot10^{-4} = 18{,}659\cdot10^{-4}$.
          Multiplicando las tres aristas deformadas sale 14,936 cm³: la
          diferencia es de segundo orden.
      - tipo: calcular
        titulo: La variación de volumen del aluminio
        pregunta: |
          ¿Cuánto vale $\Delta V_2$, en cm³?
        respuesta:
          tipo: numero
          valor: '22.067'
          tolerancia: 0.03
          formato: un número, en cm³, con su signo
        distractores:
          - valor: '28.08'
            mensaje: |
              Es solo la dilatación térmica, $3\alpha_2\Delta T_2\,abc$. La
              compresión quita volumen: $(1 - 2\nu_2)\,\sigma_y/E_2$.
          - valor: '-6.0127'
            mensaje: |
              Es solo la parte mecánica. Falta la dilatación térmica,
              $3\alpha_2\Delta T_2$.
        pista: |
          $e_2 = (1 - 2\nu_2)\,\sigma_y/E_2 + 3\alpha_2\Delta T_2$.
        desarrollo: |
          $$
          e_2 = 0{,}54\cdot\Bigl(-\frac{960{,}36}{0{,}69\cdot10^{6}}\Bigr) + 35{,}1\cdot10^{-4} = 27{,}584\cdot10^{-4}
          $$

          y $\Delta V_2 = 8000\cdot27{,}584\cdot10^{-4} = 22{,}067$, en cm³.
          Multiplicando las aristas deformadas, 22,080 cm³.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\sigma_x = 0$ (libre) y $\sigma_z = 0$ (cara de arriba libre) en
              los dos bloques.
          - texto: >-
              La placa suelta da la misma $\sigma_y$ en los dos, y el hueco no
              cambia: $\Delta b_1 + \Delta b_2 = 0$.
          - texto: >-
              $\sigma_y = -(\alpha_1\Delta T_1 + \alpha_2\Delta T_2)/(1/E_1 + 1/E_2) = -960{,}36$
              kp/cm².
          - texto: >-
              En cada bloque, $\varepsilon_x = \varepsilon_z = -\nu_i\sigma_y/E_i + \alpha_i\Delta T_i$
              y $\varepsilon_y = \sigma_y/E_i + \alpha_i\Delta T_i$.
          - texto: >-
              $\Delta V_i = abc\,[(1 - 2\nu_i)\,\sigma_y/E_i + 3\alpha_i\Delta T_i]$:
              14,93 cm³ el acero y 22,07 cm³ el aluminio.
          - texto: >-
              Como la placa es rígida, $\varepsilon_y = 0$ en cada bloque, y
              cada uno es un problema aparte.
            trampa: true
            mensaje: |
              Rígida no es fija: la placa no se deforma, pero se mueve hasta
              que las dos tensiones son iguales. Lo que no cambia es el hueco
              entero, la suma de las dos $b$.
    resolucion: |
      **1. El estado de tensión.** Dos bloques uniformes, cada uno con una
      sola tensión, $\sigma_y$. El dibujo los lleva sacados del hueco.

      <figure class="figura-examen">
      <svg viewBox="0 0 490 166" role="img" width="735" height="249" aria-labelledby="dsl-t dsl-d">
        <title id="dsl-t">Los dos bloques sacados del hueco, vistos desde x</title>
        <desc id="dsl-d">Dos cuadrados separados, el bloque 1, de acero, a la izquierda, y el 2, de aluminio, a la derecha, vistos desde x, con y horizontal y z vertical. A trazos, la pieza rígida en U que los rodeaba y, entre los dos, la placa, más alta que ellos. En cada bloque, sigma y como incógnita, dibujada positiva, saliendo de la cara que tocaba la pared y de la que tocaba la placa. Arriba y abajo, nada.</desc>
        <defs>
          <marker id="dsl-fc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--flag)"/>
          </marker>
          <marker id="dsl-fr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
