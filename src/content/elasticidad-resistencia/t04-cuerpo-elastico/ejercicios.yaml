            <path d="M0 0 L8 4 L0 8 z" fill="var(--d2)"/>
          </marker>
          <marker id="dsl-fe" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0 L8 4 L0 8 z" fill="var(--ink)"/>
          </marker>
        </defs>
        <path d="M90 68 L170 68 L170 148 L90 148 Z" fill="var(--faint)" fill-opacity="0.18" stroke="var(--ink)" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M68 36 H90 V148 H170 V36 H192 V170 H68 Z" fill="none" stroke="var(--faint)" stroke-width="0.9" stroke-dasharray="5 4"/>
        <line x1="130" y1="25" x2="130" y2="55" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="137" y="32" font-size="10" text-anchor="start" fill="var(--flag)">σ<tspan font-size="7.5" dy="2.5">0</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="130" y1="191" x2="130" y2="161" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="183" y1="108" x2="213" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="218" y="112" font-size="10" text-anchor="start" fill="var(--d2-tinta)">σ<tspan font-size="7.5" dy="2.5">x</tspan><tspan dy="-2.5"></tspan></text>
        <line x1="77" y1="108" x2="47" y2="108" stroke="var(--d2)" stroke-width="2" marker-end="url(#dsl-fr)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
      </svg>
      <figcaption>

      El cuerpo A sin el hueco, visto desde z: σ0 entrando por arriba y por abajo, porque el fondo responde con lo mismo; σx, la de las paredes, como incógnita, dibujada positiva. En z, libre, nada.

      </figcaption>
      </figure>

      - **En y** se conoce la tensión: la carga comprime,
        $\sigma_y = -\sigma_0$.
      - **En x**, la deformación: las paredes rígidas dan $\varepsilon_x = 0$.
      - **En z**, la tensión: está libre, $\sigma_z = 0$.
      - **Sin tangenciales**, porque las paredes no rozan y la carga es normal
        a su cara: las tres son tensiones principales.

      **2. Incógnitas.** $\sigma_x$; las variaciones de las aristas, que
      salen de $\varepsilon_y$ y $\varepsilon_z$; y la variación de volumen.

      **3. Ecuaciones.** Las tres de Hooke (ec. 4.2) y la variación de volumen
      (ec. 4.8, p. 6):

      $$
      \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}
      \qquad
      \varepsilon_y = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E}
      \qquad
      \varepsilon_z = \frac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E}
      \qquad
      \Delta V = abc\,\frac{1 - 2\nu}{E}\,(\sigma_x + \sigma_y + \sigma_z)
      $$

      **4. Resultados.** **a/** De $\varepsilon_x = 0$:

      $$
      \sigma_x = \nu\,(\sigma_y + \sigma_z) = -\nu\sigma_0,\qquad
      \sigma_y = -\sigma_0,\qquad
      \sigma_z = 0
      $$

      **b/** Con las ecuaciones en $y$ y en $z$:

      $$
      \Delta a = 0,\qquad
      \Delta b = -(1 - \nu^{2})\,\frac{\sigma_0 b}{E},\qquad
      \Delta c = \nu(1 + \nu)\,\frac{\sigma_0 c}{E}
      $$

      **c/**

      $$
      \Delta V = abc\,\frac{1 - 2\nu}{E}\,(-\nu\sigma_0 - \sigma_0) = -(1 - 2\nu)(1 + \nu)\,\frac{\sigma_0\,abc}{E}
      $$

      **El ejemplo nuestro.** Con $\nu = 0{,}25$: $\sigma_x = -0{,}25\,\sigma_0$,
      $\Delta b = -0{,}9375\,\sigma_0 b/E$, $\Delta c = 0{,}3125\,\sigma_0 c/E$
      y $\Delta V = -0{,}625\,\sigma_0\,abc/E$.

      **5. Comprobación.** $\Delta V$ es también
      $abc\,(\varepsilon_x + \varepsilon_y + \varepsilon_z)$:
      $(1 + \nu)\,[-(1 - \nu) + \nu] = -(1 + \nu)(1 - 2\nu)$, en unidades de
      $\sigma_0\,abc/E$. Y el motor del curso, con esas tensiones, devuelve
      $\varepsilon_x = 0$ y las mismas deformaciones.

      **Lo que dice el resultado.** La arista $b$ se acorta algo menos que
      sin paredes, $1 - \nu^{2}$ frente a 1, porque las paredes la ayudan. Y
      la $c$ se alarga aunque nada tire de ella: libre en z quiere decir
      $\sigma_z = 0$, no $\varepsilon_z = 0$.

  # ── Ejercicio de clase 4.2 · el mismo hueco, con z impedida, y el caso
  #    ν = ½.
  - id: ejerm4-cl4-2-el-cuerpo-impedido-en-z
    titulo: El cuerpo elástico en el hueco rígido, impedido en z
    fuente: >-
      Ejercicio 4.2 · Tema 4, «El cuerpo elástico» · Elasticidad y Resistencia
      de Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ley de Hooke de los apuntes (ecs. 4.2 y 4.8, pp. 4 y 6).
      El resultado es simbólico; los pasos de cálculo lo
      comprueban con ν = 0,25, un ejemplo nuestro, con las cifras del motor
      del curso, comprobadas por un segundo camino: las fórmulas cerradas en
      función de ν. El apartado d/ no pasa por el motor, que no admite
      ν = ½: se comprueba con ν tendiendo a ½. El
      enunciado está transcrito de la página del ejercicio, con su negrita y
      con la nota aparte.
    nivel: practica
    antes:
      idea: |
        Es el ejercicio 4.1 con una dirección impedida más. Cada dirección da una
        condición, y la ley de Hooke da las tres ecuaciones para lo que falta.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}
        \qquad
        \varepsilon_z = \frac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E}
        $$

        Dos de las tres ecuaciones de Hooke (ec. 4.2).
      reconocer: |
        Traduce cada frase a una condición, como en el 4.1: lo que cambia es lo
        que dice de z. Y el apartado d/ pide mirar un valor de $\nu$ concreto.
    enunciado: |
      El cuerpo elástico A se ajusta en el hueco del cuerpo rígido B,
      **teniendo impedida la deformación en dirección z**. El cuerpo soporta
      la tensión $\sigma_0$. El estado de deformación es uniforme. Siendo *a*,
      *b*, *c* las dimensiones paralelas a los ejes *x*, *y*, *z*
      respectivamente, determinar:

      a/ El valor de las tensiones principales $\sigma_x$, $\sigma_y$,
      $\sigma_z$.

      b/ La variación de longitud de las aristas del cuerpo A.

      c/ La variación de volumen del cuerpo A.

      d/ La variación de volumen del cuerpo A siendo $\nu = \tfrac12$.

