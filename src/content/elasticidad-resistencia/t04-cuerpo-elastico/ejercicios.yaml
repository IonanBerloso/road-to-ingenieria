      <figcaption>

      El cuerpo A sin el hueco, visto desde z: σ0 por arriba y por abajo, σx en lugar de las paredes y σz, que sale del papel, las dos como incógnitas, dibujadas positivas.

      </figcaption>
      </figure>

      - **En y**, $\sigma_y = -\sigma_0$.
      - **En x y en z**, $\varepsilon_x = \varepsilon_z = 0$: las dos
        condiciones son iguales cambiando $x$ por $z$.

      **2. Incógnitas.** $\sigma_x$ y $\sigma_z$; las variaciones de las
      aristas; la variación de volumen, y la misma con $\nu = \tfrac12$.

      **3. Ecuaciones.** Las de Hooke (ec. 4.2) con
      $\varepsilon_x = \varepsilon_z = 0$, la de $y$ para $\Delta b$, y la
      variación de volumen (ec. 4.8):

      $$
      \sigma_x = \nu(\sigma_y + \sigma_z)
      \qquad
      \sigma_z = \nu(\sigma_x + \sigma_y)
      \qquad
      \varepsilon_y = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E}
      $$

      **4. Resultados.** **a/** Las dos primeras, a la vez:

      $$
      \sigma_x = \sigma_z = -\frac{\nu}{1 - \nu}\,\sigma_0,\qquad \sigma_y = -\sigma_0
      $$

      **b/**

      $$
      \Delta a = \Delta c = 0,\qquad
      \Delta b = b\,\varepsilon_y = -\frac{(1 + \nu)(1 - 2\nu)}{1 - \nu}\,\frac{\sigma_0 b}{E}
      $$

      **c/** Como solo cambia $b$, $\Delta V = ac\,\Delta b$, lo mismo que da
      la ec. 4.8:

      $$
      \Delta V = -\frac{(1 + \nu)(1 - 2\nu)}{1 - \nu}\,\frac{\sigma_0\,abc}{E}
      $$

      **d/** Con $\nu = \tfrac12$, $\nu/(1 - \nu) = 1$: las tres tensiones
      valen $-\sigma_0$, un estado hidrostático, y el factor $1 - 2\nu$ es
      cero:

      $$
      \Delta V = 0
      $$

      **El ejemplo nuestro.** Con $\nu = 0{,}25$:
      $\sigma_x = \sigma_z = -0{,}3333\,\sigma_0$,
      $\Delta b = -0{,}8333\,\sigma_0 b/E$ y
      $\Delta V = -0{,}8333\,\sigma_0\,abc/E$.

      **5. Comprobación.** El motor del curso devuelve, con esas tensiones,
      $\varepsilon_x = \varepsilon_z = 0$. Con $\nu = \tfrac12$ no admite el
      material, porque está fuera de la ec. 4.18; tendiendo a ½, $\Delta V$
      tiende a cero.

      **Lo que dice el resultado.** Con más direcciones impedidas, el cuerpo
      es más rígido en y: con $\nu = 0{,}25$, $b$ se acorta 1 sin paredes,
      0,9375 con z libre y 0,8333 con z impedida, en unidades de
      $\sigma_0 b/E$. Con $\nu = \tfrac12$ el material es incompresible: su
      módulo volumétrico, $k = E/[3(1 - 2\nu)]$ (ec. 4.16, p. 7), es
      infinito, y tampoco cambia $b$: el hueco lo sostiene todo.

  # ── Ejercicio de clase 4.3 · el mismo hueco, libre en z, con una
  #    variación de temperatura. Resultado simbólico; ejemplo con ν = 0,3.
  - id: ejerm4-cl4-3-el-hueco-y-la-temperatura
    titulo: El cuerpo elástico en el hueco rígido, con una variación de temperatura
    fuente: >-
      Ejercicio 4.3 · Tema 4, «El cuerpo elástico» · Elasticidad y Resistencia
      de Materiales, UPV/EHU. El material no trae solución: la resolución es
      nuestra, con la ley de Hooke con temperatura de los apuntes (ec. 4.19,
      p. 8). El resultado es simbólico; los pasos de cálculo lo comprueban con
      ν = 0,3, un ejemplo nuestro, con las cifras del motor del curso, que
      pasa de tensiones a deformaciones con el término térmico, comprobadas
      por un segundo camino: las fórmulas cerradas en función de ν. El
      enunciado está transcrito de la página del ejercicio, con su negrita,
      con la nota aparte y con el «calculado en d/» del apartado d/, que se
      comenta en el enunciado.
    nivel: practica
    antes:
      idea: |
        Es el cuerpo del ejercicio 4.1, calentado. Las condiciones de cada
        dirección no cambian; lo que cambia es que cada deformación lleva además
        la dilatación térmica.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E} + \alpha T
        $$

        y las otras dos igual: la ley de Hooke con temperatura (ec. 4.19).
      reconocer: |
        Las condiciones son las del 4.1. La pregunta, en cada apartado, es dónde
        entra T: en las tensiones, en las deformaciones o en las dos.
    enunciado: |
      El cuerpo elástico A se ajusta en el hueco del cuerpo rígido B,
      **teniendo libertad de deformación en dirección z**. El cuerpo soporta la
      tensión $\sigma_0$ y la variación de temperatura *T*. El estado de
      deformación es uniforme. Siendo *a*, *b*, *c* las dimensiones paralelas a
      los ejes *x*, *y*, *z* respectivamente, determinar:

      a/ El valor de las tensiones principales $\sigma_x$, $\sigma_y$,
      $\sigma_z$.

      b/ La variación de longitud de las aristas del cuerpo A.

      c/ El valor de la variación de temperatura que hace nula la variación de
      volumen.

      d/ La variación de longitud de las aristas para el valor de *T*
      calculado en d/.

