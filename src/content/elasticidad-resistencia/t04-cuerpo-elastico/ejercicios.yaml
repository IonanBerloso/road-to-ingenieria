      <figcaption>

      σx, σy y τxy, las incógnitas, dibujadas positivas; en z, nada, porque el estado es de tensión plana.

      </figcaption>
      </figure>

      - **Del ejercicio anterior**, en $10^{-4}$: $\varepsilon_x = 5$,
        $\varepsilon_y = 1$ y $\gamma_{xy} = 2$; las principales,
        $\varepsilon_1 = 5{,}236$ y $\varepsilon_2 = 0{,}764$, con la 1 a
        $13{,}28°$ de $x$.
      - **De deformaciones a tensiones** se pasa con Hooke en tensión plana,
        no con $\sigma = E\varepsilon$.
      - **El módulo** se usa tal como está impreso, aunque casi seguro es una
        errata (lo dicen las notas).

      **2. Incógnitas.** $\sigma_x$, $\sigma_y$ y $\tau_{xy}$; las tensiones
      principales y su dirección; $\sigma_n$ y $\tau_n$ del plano
      perpendicular a la dirección a; y, aunque no lo pida, $\varepsilon_z$.

      **3. Ecuaciones.** Hooke en tensión plana (ecs. 4.6 y 4.24-4.25), el
      círculo de tensiones y la ec. 2.61 para el plano, con la tangencial
      positiva según $\hat t$:

      $$
      \sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)
      \qquad
      \sigma_y = \frac{E}{1-\nu^{2}}(\varepsilon_y + \nu\varepsilon_x)
      \qquad
      \tau_{xy} = G\gamma_{xy}
      $$

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos 2\theta + \tau_{xy}\operatorname{sen} 2\theta
      \qquad
      \tau_n = -\frac{\sigma_x - \sigma_y}{2}\operatorname{sen} 2\theta + \tau_{xy}\cos 2\theta
      $$

      **4. Resultados.** **Las tensiones del plano.** Con
      $\tfrac{E}{1-\nu^{2}} = \tfrac{1{,}5\cdot10^{6}}{0{,}9375} = 1{,}6\cdot10^{6}$ MPa
      y $G = 6\cdot10^{5}$ MPa:

      $$
      \sigma_x = 1{,}6\cdot10^{6}\cdot(5 + 0{,}25\cdot1)\cdot10^{-4} = 840\ \text{MPa},\qquad
      \sigma_y = 1{,}6\cdot10^{6}\cdot(1 + 0{,}25\cdot5)\cdot10^{-4} = 360\ \text{MPa}
      $$

      $$
      \tau_{xy} = 6\cdot10^{5}\cdot2\cdot10^{-4} = 120\ \text{MPa},\qquad \sigma_z = 0
      $$

      **c/ Tensiones y direcciones principales.** Centro
      $\tfrac{840 + 360}{2} = 600$ y radio $\sqrt{240^{2} + 120^{2}} = 268{,}33$ MPa:

      $$
      \sigma_1 = 868{,}33\ \text{MPa},\qquad
      \sigma_2 = 331{,}67\ \text{MPa},\qquad \sigma_3 = 0
      $$

      con $\tan2\theta_1 = \tfrac{2\cdot120}{840 - 360} = 0{,}5$: la dirección
      1 a $13{,}28°$ de $x$ y la 2 a $103{,}28°$, las de las deformaciones
      principales.

      **El plano perpendicular a la dirección a.** Su normal es la a,
      $\theta = 30°$, y $2\theta = 60°$:

      $$
      \sigma_n = 600 + 240\cos60° + 120\operatorname{sen}60° = 600 + 120 + 103{,}92 = 823{,}92\ \text{MPa}
      $$

      $$
      \tau_n = -240\operatorname{sen}60° + 120\cos60° = -207{,}85 + 60 = -147{,}85\ \text{MPa}
      $$

      $\tau_n$ negativa: la tangencial va al revés que $\hat t$ (a 120°),
      hacia $-60°$. En las caras perpendiculares,
      $\sigma = 1200 - 823{,}92 = 376{,}08$ MPa.

