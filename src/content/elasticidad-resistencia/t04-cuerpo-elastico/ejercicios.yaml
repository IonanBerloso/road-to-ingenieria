        <text x="436" y="56" font-size="9" text-anchor="start" fill="var(--faint)">y</text>
        <text x="400" y="18" font-size="9" text-anchor="middle" fill="var(--faint)">z</text>
      </svg>
      <figcaption>

      Los dos bloques sin la pieza rígida ni la placa, vistos desde x: en cada uno, σy en las caras de la pared y de la placa, como incógnita, dibujada positiva. Arriba, la cara libre; según x, libres. Cada uno, además, con su temperatura.

      </figcaption>
      </figure>

      - **Según x y según z**, nada: $\sigma_x = \sigma_z = 0$ en los dos.
      - **Según y**, la placa suelta transmite lo mismo: la misma $\sigma_y$
        en los dos bloques.
      - **El hueco no cambia**: lo que crece uno según $y$, lo encoge el otro,
        $\Delta b_1 + \Delta b_2 = 0$.
      - **Cada bloque** lleva su $\alpha_i\Delta T_i$ (ec. 4.19, p. 8).

      **2. Incógnitas.** $\sigma_y$, con ella las tensiones principales; las
      variaciones de las tres aristas de cada bloque; y la variación de
      volumen de cada uno.

      **3. Ecuaciones.** Hooke con temperatura (ec. 4.19) en cada bloque, con
      $\sigma_x = \sigma_z = 0$, la condición del hueco y la variación de
      volumen unitaria:

      $$
      \varepsilon_{y,i} = \frac{\sigma_y}{E_i} + \alpha_i\Delta T_i
      \qquad
      \varepsilon_{x,i} = \varepsilon_{z,i} = -\frac{\nu_i\sigma_y}{E_i} + \alpha_i\Delta T_i
      \qquad
      b\,(\varepsilon_{y,1} + \varepsilon_{y,2}) = 0
      $$

      $$
      e_i = (1 - 2\nu_i)\,\frac{\sigma_y}{E_i} + 3\alpha_i\Delta T_i
      $$

      **4. Resultados.** **a/** De la condición del hueco:

      $$
      \sigma_y = -\frac{\alpha_1\Delta T_1 + \alpha_2\Delta T_2}{1/E_1 + 1/E_2}
      = -\frac{(7{,}02 + 11{,}7)\cdot10^{-4}}{(0{,}5 + 1{,}449275)\cdot10^{-6}} = -960{,}36
      $$

      en kp/cm², unos $-94{,}2$ MPa. Las tensiones principales, en los dos
      bloques, son $0$, $0$ y $\sigma_y = -960{,}36$ kp/cm².

      **b/** Por 20 cm, en $10^{-3}$ cm:

      | | $\Delta a$ | $\Delta b$ | $\Delta c$ |
      |---|---|---|---|
      | Acero (1) | 16,441 | 4,4364 | 16,441 |
      | Aluminio (2) | 29,802 | −4,4364 | 29,802 |

      **c/** Con $abc = 8000$ cm³:

      $$
      \Delta V_1 = 14{,}927\ \text{cm}^3,\qquad
      \Delta V_2 = 22{,}067\ \text{cm}^3
      $$

      **5. Comprobación.** $\Delta b_1 + \Delta b_2 = 4{,}4364 - 4{,}4364 = 0$:
      el hueco no cambia. Y multiplicando las tres aristas deformadas salen
      14,936 y 22,080 cm³: la diferencia es de segundo orden, la que la
      variación de volumen unitaria desprecia. El motor del curso, con
      $\sigma_y$ y cada temperatura, devuelve las mismas deformaciones.

      **Lo que dice el resultado.** El acero, que se dilata menos, aún crece
      algo según $y$, 4,4 frente a los 14,0 que crecería libre; el aluminio,
      que libre crecería 23,4, encoge 4,4. Los dos crecen según $x$ y según
      $z$ más que lo que daría la temperatura sola: es el Poisson de la
      compresión.

  # ── Cuestión 1 de autoevaluación del tema 4 · las hipótesis del material.
  - id: ejerm4-cu1-las-hipotesis-del-material
    titulo: Homogéneo, isótropo, elástico y lineal; dúctil y frágil
    fuente: >-
      Cuestión 1 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.1 (pp. 3 y 4), y la diapositiva 4 del tema, la de los
      materiales dúctil y frágil, que los apuntes no tratan. No está entre
      las preguntas de examen publicadas en el sitio. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Son seis palabras que describen cómo se comporta un material, y no
        todas son del mismo tipo: unas son hipótesis que el tema da por buenas y
        otras clasifican materiales por cómo llegan a romper.
      formula: |
        $$
        \sigma = E\,\varepsilon
        $$

        La ley del ensayo de tracción en el tramo elástico lineal.
      reconocer: |
        Es una pregunta de definiciones, y la dificultad está en no mezclar las
        que se parecen. Piensa, para cada término, qué es lo que no cambia.
    enunciado: |
      1. Homogeneidad, isotropía, material elástico, comportamiento lineal,
      dúctil, frágil.
    pide: >-
      Qué quiere decir cada uno de los seis términos, y cuáles se suponen en
      el tema.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis del tema permite usar el mismo $E$ y el mismo $\nu$
          en cualquier dirección de un punto?
        opciones:
          - texto: >-
              La isotropía: las propiedades del material en un punto son las
              mismas en cualquier dirección
            correcta: true
            mensaje: |
              Eso es (p. 3). Por eso una tracción según $x$ o según $y$ da el
              mismo $E$ y el mismo $\nu$, y una tensión tangencial no da
              deformaciones normales (p. 5).
          - texto: >-
              La homogeneidad: las propiedades son las mismas en todos los
              puntos
            mensaje: |
              Eso dice que $E$ y $\nu$ no cambian de un punto a otro, no de una
              dirección a otra. Un tablero de madera puede ser igual en todos
              sus puntos y no ser igual de rígido a lo largo de la veta que de
              través.
          - texto: >-
              La linealidad: las tensiones y las deformaciones son
              proporcionales
            mensaje: |
              La linealidad hace que $E$ y $\nu$ sean constantes y permite
              superponer; que sean los mismos en todas las direcciones es la
              isotropía.
          - texto: >-
              La elasticidad: el material vuelve a su forma al descargarlo
            mensaje: |
              Elástico quiere decir que vuelve a la posición no deformada al
              quitar las fuerzas, aunque la relación no sea lineal ni igual en
              todas las direcciones.
      - tipo: redactar
        que: definicion
        consigna: >-
          Define los seis términos como en un examen y di cuáles se suponen en
          el tema.
        rubrica:
          - punto: >-
              Homogéneo: las propiedades del material son las mismas en todos
              los puntos (p. 3).
            porque: >-
              Es la hipótesis que ya se suponía en los temas de tensiones y
              deformaciones, junto con la continuidad.
            minimo: true
          - punto: >-
              Isótropo: las propiedades en un punto son las mismas en
              cualquier dirección.
            porque: >-
              Es la que deja la ley de Hooke con solo dos constantes
              independientes.
            minimo: true
          - punto: >-
              Elástico: el material vuelve a su posición no deformada al
              suprimir las fuerzas que actúan sobre él.
            porque: >-
              Separa lo elástico de lo plástico, con deformaciones
              permanentes.
            minimo: true
          - punto: >-
              Comportamiento lineal: las relaciones entre tensiones y
              deformaciones son lineales, y por eso se cumple el principio de
              superposición (pp. 3 y 4).
            porque: >-
              Es lo que permite sumar los efectos de σx, σy y σz en la ley de
              Hooke.
            minimo: true
          - punto: >-
              Dúctil: tras un tramo elástico lineal se produce la fluencia
              plástica, hay grandes deformaciones antes de la rotura y quedan
              deformaciones permanentes (diapositiva 4).
            porque: >-
              Es el comportamiento del acero: su fallo es la fluencia, no la
              rotura.
            minimo: true
          - punto: >-
              Frágil: tras una fase elástica lineal se produce la rotura, con
              pequeñas deformaciones antes de romper.
            porque: >-
              Es el del hormigón o la fundición, y el que hace elegir otros
              criterios de fallo en el tema 6.
            minimo: true
          - punto: >-
              En el tema se supone un material homogéneo, isótropo, elástico
              y lineal, con deformaciones pequeñas, menores que 0,02.
            porque: >-
              Dice cuáles son hipótesis: dúctil y frágil son tipos de
              material, no hipótesis.
      - tipo: calcular
        titulo: La superposición
        pregunta: |
          Un ejemplo nuestro: un elemento de acero ($E = 200$ GPa,
          $\nu = 0{,}3$) con $\sigma_x = \sigma_y = 100$ MPa y $\sigma_z = 0$.
          ¿Cuánto vale $\varepsilon_x$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '350'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '500'
            mensaje: |
              Solo has contado $\sigma_x$. $\sigma_y$ también acorta $x$, en
              $-\nu\sigma_y/E$: por superposición se suman los dos efectos.
          - valor: '650'
            mensaje: |
              Has sumado el efecto de $\sigma_y$ en vez de restarlo. Una
              tracción en $y$ estrecha el material en $x$: $-\nu\sigma_y/E$.
          - valor: '1000'
            mensaje: |
              Has sumado las dos tensiones como si actuaran en $x$.
              $\sigma_y$ actúa en $y$; en $x$ solo da su efecto de Poisson.
        pista: |
          Superposición: el efecto de $\sigma_x$ en $x$, $\sigma_x/E$, más el
          de $\sigma_y$ en $x$, $-\nu\sigma_y/E$ (la tabla de la p. 4).
        desarrollo: |
          $$
          \varepsilon_x = \frac{100}{2\cdot10^{5}} - 0{,}3\cdot\frac{100}{2\cdot10^{5}} = (500 - 150)\cdot10^{-6} = 350\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Homogéneo: las mismas propiedades en todos los puntos.
          - texto: >-
              Isótropo: las mismas propiedades en todas las direcciones de un
              punto.
          - texto: >-
              Elástico: vuelve a su forma al descargarlo; lineal: tensiones y
              deformaciones proporcionales, y vale la superposición.
          - texto: >-
              Dúctil: fluye y se deforma mucho antes de romper; frágil: rompe
              tras la fase elástica, con poca deformación.
          - texto: >-
              Un material homogéneo es también isótropo: si las propiedades no
              cambian de un punto a otro, tampoco cambian con la dirección.
            trampa: true
            mensaje: |
              Son independientes: la madera o un laminado pueden ser iguales
              en todos sus puntos y distintos según la dirección. La ley de
              Hooke del tema necesita las dos cosas.
    resolucion: |
      **Las hipótesis** (apuntes del tema 4, apartado 4.1, pp. 3 y 4). En los
      temas de tensiones y deformaciones solo se ha supuesto que el material
      es continuo y homogéneo. En este se añade que es isótropo, elástico y
      lineal:

      - **Homogéneo**: las propiedades son las mismas en todos los puntos.
      - **Isótropo**: las propiedades en un punto son las mismas en
        cualquier dirección.
      - **Elástico**: el material vuelve a su posición no deformada al
        suprimir las fuerzas que actúan sobre él.
      - **Comportamiento lineal**: las relaciones entre tensiones y
        deformaciones son lineales. Por eso se cumple el *principio de
        superposición*: el efecto de una serie de causas es la suma de los
        efectos de cada una.

      Además, las deformaciones normales y tangenciales son pequeñas, menores
      que 0,02, y las relaciones dependen de las propiedades físico-químicas
      del material.

      **Dúctil y frágil** (diapositiva 4 del tema; los apuntes no los
      definen). En el ensayo de tracción:

      - **Dúctil**: tras un tramo elástico lineal se produce la fluencia
        plástica, hay grandes deformaciones antes de la rotura y, tras la
        fluencia, quedan deformaciones permanentes. Es el acero.
      - **Frágil**: tras una fase elástica lineal se produce la rotura, con
        pequeñas deformaciones antes de romper. Es el hormigón o la
        fundición.

      No son hipótesis sino tipos de material. El tema estudia la parte
      elástica lineal de los dos; el tema 6 vuelve a ellos, porque el fallo
      de uno dúctil es la fluencia y el de uno frágil, la rotura.

      **Un ejemplo nuestro de la superposición.** Con $\sigma_x = \sigma_y = 100$
      MPa en un acero de $E = 200$ GPa y $\nu = 0{,}3$, la tracción en $x$
      alarga $x$ en $\sigma_x/E = 500\cdot10^{-6}$ y la de $y$ lo acorta en
      $\nu\sigma_y/E = 150\cdot10^{-6}$; sumando,
      $\varepsilon_x = 350\cdot10^{-6}$. El motor del curso, con la ley de
      Hooke entera, da lo mismo.

  # ── Cuestión 2 de autoevaluación del tema 4 · la ley de Hooke.
  - id: ejerm4-cu2-la-ley-de-hooke
    titulo: La ley de Hooke, las deformaciones en función de las tensiones
    fuente: >-
      Cuestión 2 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.2 (pp. 4 y 5, ecs. 4.1 a 4.3 y la tabla de la p. 4). No está
      entre las preguntas de examen publicadas en el sitio; la inversa, las
      tensiones en función de las deformaciones, es la cuestión 3 de esta
      hoja y cayó en el primer parcial de 2017-2018. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Se parte del ensayo de tracción, que da el efecto de una sola tensión
        normal: alarga en su dirección y acorta en las perpendiculares. Con las
        tres normales a la vez, y con las tangenciales, se llega a las seis
        relaciones.
      formula: |
        $$
        \varepsilon = \frac{\sigma}{E}
        \qquad
        \varepsilon_{\perp} = -\nu\,\frac{\sigma}{E}
        $$

        Lo que da el ensayo de tracción: el alargamiento en la dirección de la
        carga y el acortamiento en las perpendiculares.
      reconocer: |
        Es una pregunta de deducción: de qué ensayo se parte, cómo se juntan los
        efectos y qué pasa con las tangenciales.
    enunciado: |
      2. Ley de Hooke: Deformaciones en función de las tensiones.
    pide: >-
      Las deformaciones de un elemento en función de sus tensiones, normales y
      tangenciales, y de dónde sale cada término.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se pueden sumar los efectos de $\sigma_x$, $\sigma_y$ y
          $\sigma_z$ para obtener $\varepsilon_x$?
        opciones:
          - texto: >-
              Porque el material es elástico lineal: se cumple el principio de
              superposición
            correcta: true
            mensaje: |
              Eso es (p. 4). Con relaciones lineales, el efecto de las tres
              juntas es la suma de los efectos de cada una, y cada fila de la
              tabla de la p. 4 se suma para dar la ec. 4.2.
          - texto: >-
              Porque las tres tensiones son perpendiculares entre sí
            mensaje: |
              Ser perpendiculares no basta: con un material no lineal, el
              efecto de $\sigma_y$ dependería de cuánto vale $\sigma_x$. Lo que
              permite sumar es la linealidad.
          - texto: >-
              Porque el material es isótropo
            mensaje: |
              La isotropía hace que el efecto de $\sigma_y$ en $x$ sea el mismo
              $-\nu\sigma_y/E$ que el de $\sigma_x$ en $y$; sumar efectos es
              cosa de la linealidad.
          - texto: >-
              Porque el material es homogéneo
            mensaje: |
              La homogeneidad dice que las propiedades son las mismas en todos
              los puntos; no tiene nada que ver con sumar efectos en uno.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la ley de Hooke como en un examen: de qué ensayo se parte,
          cómo se llega a las tres normales y qué pasa con las tangenciales.
        rubrica:
          - punto: >-
              Con una tracción σx, en un material isótropo y elástico lineal:
              εx = σx/E y εy = εz = −νσx/E, sin deformaciones tangenciales
              (ec. 4.1).
            porque: >-
              Es el ensayo de partida, con el significado de E y de ν.
            minimo: true
          - punto: >-
              E es el módulo de elasticidad longitudinal o de Young, con
              unidades de tensión, y ν el coeficiente de Poisson,
              adimensional.
            porque: >-
              Son las dos constantes del material.
          - punto: >-
              Con las tres normales a la vez, la tabla de efectos y la
              superposición, sumando cada fila:
              εx = [σx − ν(σy + σz)]/E, y lo mismo en y y en z (ec. 4.2).
            porque: >-
              Es la ley pedida, y la superposición su porqué.
            minimo: true
          - punto: >-
              Las tensiones tangenciales solo dan deformación tangencial en su
              plano: γxy = τxy/G, γyz = τyz/G y γzx = τzx/G (ec. 4.3), con G
              el módulo de cortadura.
            porque: >-
              Completa la ley: en un material isótropo las normales y las
              tangenciales no se mezclan.
            minimo: true
          - punto: >-
              Las ecs. 4.2 y 4.3 son la ley de Hooke, y como
              G = E/2(1 + ν) (ec. 4.6), el material tiene solo dos constantes
              independientes.
            porque: >-
              Dice cuántas constantes hacen falta para describirlo.
      - tipo: calcular
        titulo: La deformación normal en x
        pregunta: |
          Un ejemplo nuestro: $\sigma_x = 80$, $\sigma_y = -40$,
          $\sigma_z = 20$ y $\tau_{xy} = 30$ MPa, y las otras tangenciales
          nulas, en un acero con $E = 200$ GPa y $\nu = 0{,}25$. ¿Cuánto vale
          $\varepsilon_x$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '425'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '400'
            mensaje: |
              Solo $\sigma_x/E$. Faltan los efectos de Poisson de $\sigma_y$ y
              $\sigma_z$, $-\nu(\sigma_y + \sigma_z)/E$.
          - valor: '325'
            mensaje: |
              Has tomado $\sigma_y = +40$. Es de compresión, $-40$ MPa, y con
              su signo $-\nu(\sigma_y + \sigma_z) = -0{,}25\cdot(-20) = +5$
              MPa: suma.
          - valor: '375'
            mensaje: |
              Has sumado $\nu(\sigma_y + \sigma_z)$ en vez de restarlo. La
              ec. 4.2 es $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E$.
        pista: |
          Ec. 4.2: $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E$,
          con el signo de cada tensión.
        desarrollo: |
          $$
          \varepsilon_x = \frac{80 - 0{,}25\,(-40 + 20)}{2\cdot10^{5}} = \frac{85}{2\cdot10^{5}} = 425\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La distorsión
        pregunta: |
          ¿Y $\gamma_{xy}$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '375'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '150'
            mensaje: |
              Has dividido por $E$. La tangencial va con
              $G = E/2(1 + \nu) = 80$ GPa (ec. 4.3).
          - valor: '187.5'
            mensaje: |
              Es $\tau_{xy}/2G$, la $\tfrac12\gamma_{xy}$ del tensor de
              deformaciones. La ec. 4.3 da $\gamma_{xy}$ entera:
              $\tau_{xy}/G$.
          - valor: '225'
            mensaje: |
              Has usado $G = E/2(1 - \nu)$. Es $E/2(1 + \nu)$ (ec. 4.6): 80
              GPa, no 133,3.
        pista: |
          Ec. 4.3: $\gamma_{xy} = \tau_{xy}/G$, con $G = E/2(1 + \nu)$.
        desarrollo: |
          $G = \dfrac{2\cdot10^{5}}{2\,(1 + 0{,}25)} = 8\cdot10^{4}$, en MPa, y

          $$
          \gamma_{xy} = \frac{30}{8\cdot10^{4}} = 375\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Una tracción $\sigma_x$ da $\varepsilon_x = \sigma_x/E$ y
              $\varepsilon_y = \varepsilon_z = -\nu\sigma_x/E$ (ec. 4.1).
          - texto: >-
              Lo mismo con $\sigma_y$ y con $\sigma_z$, cada una en su eje (la
              tabla de la p. 4).
          - texto: >-
              Por superposición, sumando los efectos:
              $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E$
              (ec. 4.2).
          - texto: >-
              Las tangenciales solo dan distorsión en su plano:
              $\gamma_{xy} = \tau_{xy}/G$ (ec. 4.3).
          - texto: >-
              Una tensión tangencial $\tau_{xy}$ también alarga o acorta las
              direcciones $x$ e $y$, con su propio coeficiente.
            trampa: true
            mensaje: |
              En un material isótropo, al aplicar tensiones cortantes las
              deformaciones normales son nulas (p. 5): $\tau_{xy}$ solo cierra
              el ángulo recto entre $x$ e $y$. Lo que se alarga es la
              diagonal, a 45°, que no es ni $x$ ni $y$.
    resolucion: |
      **El ensayo de partida** (apuntes del tema 4, apartado 4.2, p. 4). En
      un material isótropo con comportamiento elástico lineal, una tracción
      en $x$ no da deformaciones tangenciales, y sí normales:

      $$
      \varepsilon_x = \frac{\sigma_x}{E} \qquad \varepsilon_y = \varepsilon_z = -\nu\frac{\sigma_x}{E} \qquad (4.1)
      $$

      $E$ es el módulo de elasticidad longitudinal o de Young, con unidades
      de tensión, y $\nu$ el coeficiente de Poisson, adimensional.

      **Las tres normales.** Con $\sigma_x$, $\sigma_y$ y $\sigma_z$ a la
      vez, cada una da en su eje $\sigma/E$ y en los otros dos
      $-\nu\sigma/E$ (la tabla de la p. 4). Por el principio de
      superposición, sumando los términos de cada fila:

      $$
      \varepsilon_x = \frac1E\left[\sigma_x - \nu(\sigma_y + \sigma_z)\right] \qquad
      \varepsilon_y = \frac1E\left[\sigma_y - \nu(\sigma_x + \sigma_z)\right] \qquad
      \varepsilon_z = \frac1E\left[\sigma_z - \nu(\sigma_x + \sigma_y)\right] \qquad (4.2)
      $$

      **Las tangenciales** (p. 5). Al aplicar tensiones cortantes, las
      deformaciones normales son nulas y solo hay deformación tangencial en
      el plano de la tensión:

      $$
      \gamma_{xy} = \frac{\tau_{xy}}{G} \qquad \gamma_{yz} = \frac{\tau_{yz}}{G} \qquad \gamma_{zx} = \frac{\tau_{zx}}{G} \qquad (4.3)
      $$

      con $G$ el módulo elástico tangencial o de cortadura. Las ecs. 4.2 y
      4.3 son la ley de Hooke. Como $G = E/2(1 + \nu)$ (ec. 4.6), un
      material isótropo tiene solo dos constantes independientes.

      **Un ejemplo nuestro.** $\sigma_x = 80$, $\sigma_y = -40$,
      $\sigma_z = 20$ y $\tau_{xy} = 30$ MPa, con $E = 200$ GPa y
      $\nu = 0{,}25$ ($G = 80$ GPa). En $10^{-6}$:
      $\varepsilon_x = 425$, $\varepsilon_y = -325$, $\varepsilon_z = 50$ y
      $\gamma_{xy} = 375$. Las cuatro salen igual con el motor del curso, y
      con las tensiones en función de las deformaciones (cuestión 3)
      vuelven a dar las tensiones de partida.

  # ── Cuestión 4 de autoevaluación del tema 4 · las mismas direcciones principales.
  - id: ejerm4-cu4-las-mismas-direcciones-principales
    titulo: Por qué coinciden las direcciones principales de tensiones y de deformaciones
    fuente: >-
      Cuestión 4 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.2 (p. 5). Cayó con otras palabras («¿Porque [sic] son
      iguales las direcciones principales de las tensiones y las
      deformaciones?») como parte b) de la pregunta 1 de teoría de la
      extraordinaria del 1 de febrero de 2023, que está en el sitio con su
      resolución. El ejemplo es nuestro, comprobado con el motor del curso y
      a mano.
    nivel: practica
    antes:
      idea: |
        Una dirección es principal cuando en los planos perpendiculares a ella
        no hay componente tangencial: en tensiones, $\tau = 0$; en
        deformaciones, $\gamma = 0$. La pregunta es qué liga una cosa con la
        otra.
      formula: |
        $$
        [\sigma]\{n\} = \sigma\{n\}
        \qquad
        [\varepsilon]\{n\} = \varepsilon\{n\}
        $$

        Una dirección principal de cada tensor: el vector que le corresponde
        es paralelo a ella.
      reconocer: |
        Es un «¿por qué?»: la respuesta depende del material, y hay que decir de
        qué propiedad y cómo se usa.
    enunciado: |
      4. ¿Por qué son las mismas las direcciones principales de tensiones y
      de deformaciones?
    pide: >-
      La razón por la que coinciden las direcciones principales de
      tensiones y de deformaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué coinciden?
        opciones:
          - texto: >-
              Porque en un material isótropo una tensión tangencial nula da
              una deformación tangencial nula, y al revés: $\gamma = \tau/G$
              en cada plano
            correcta: true
            mensaje: |
              Eso es (p. 5, con la ec. 4.3). Un plano sin $\tau$ es un plano
              sin $\gamma$, y las tensiones normales no dan distorsión: las
              direcciones principales de un tensor lo son del otro.
          - texto: >-
              Porque las deformaciones son pequeñas
            mensaje: |
              Ser pequeñas hace lineal la geometría. Pero en un material
              anisótropo, con deformaciones igual de pequeñas, una tensión
              normal puede dar distorsión, y las direcciones no coinciden.
          - texto: >-
              Porque los dos tensores tienen los mismos invariantes
            mensaje: |
              No los tienen: tensiones y deformaciones ni siquiera tienen las
              mismas unidades. Lo que comparten son las direcciones, no los
              valores.
          - texto: >-
              Porque $-1 < \nu < 0{,}5$
            mensaje: |
              Las cotas de $\nu$ dicen que $G$ y el módulo volumétrico son
              positivos; no dicen nada de las direcciones.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Justifícalo como en un examen: qué se cumple en un material
          isótropo y por qué eso hace coincidir las direcciones.
        rubrica:
          - punto: >-
              Las direcciones principales de tensión son las de los planos sin
              tensión tangencial; las de deformación, las direcciones sin
              deformación tangencial.
            porque: >-
              Es lo que hay que comparar.
            minimo: true
          - punto: >-
              En un material isótropo, γxy = τxy/G, γyz = τyz/G y
              γzx = τzx/G (ec. 4.3): una tensión tangencial nula da una
              deformación tangencial nula, y al revés.
            porque: >-
              Es la razón que pide la cuestión.
            minimo: true
          - punto: >-
              Y las tensiones normales no dan distorsión (ec. 4.1): en los
              ejes principales de tensión, con solo σ1, σ2 y σ3, no hay
              ninguna γ, así que son también principales de deformación.
            porque: >-
              Cierra el argumento.
            minimo: true
          - punto: >-
              En el plano: tan(2θ1ten) = 2τxy/(σx − σy) (ec. 4.4) y
              tan(2θ1def) = γxy/(εx − εy) (ec. 4.5) dan el mismo ángulo.
            porque: >-
              Es la forma en que los apuntes lo usan, y de ella sale
              G = E/2(1 + ν).
          - punto: >-
              En un material anisótropo no tiene por qué cumplirse: una
              tensión normal puede dar distorsión.
            porque: >-
              Dice que es una propiedad del material isótropo, no una regla
              general.
      - tipo: calcular
        titulo: La distorsión de esas tensiones
        pregunta: |
          Un ejemplo nuestro, en tensión plana: $\sigma_x = 60$,
          $\sigma_y = -20$ y $\tau_{xy} = 30$ MPa, en un acero con
          $E = 200$ GPa y $\nu = 0{,}3$. ¿Cuánto vale $\gamma_{xy}$, en
          unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '390'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '150'
            mensaje: |
              Has dividido por $E$. La distorsión va con
              $G = E/2(1 + \nu) = 76{,}92$ GPa.
          - valor: '195'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, lo que va en el tensor de
              deformaciones. La ec. 4.3 da $\gamma_{xy} = \tau_{xy}/G$ entera.
          - valor: '780'
            mensaje: |
              Has hecho $2\tau_{xy}/G$, como el numerador de la ec. 4.4. La
              ec. 4.3 es $\gamma_{xy} = \tau_{xy}/G$.
        pista: |
          Ec. 4.3: $\gamma_{xy} = \tau_{xy}/G$, con $G = E/2(1 + \nu)$.
        desarrollo: |
          $G = \dfrac{2\cdot10^{5}}{2\cdot1{,}3} = 76923$, en MPa, y

          $$
          \gamma_{xy} = \frac{30}{76923} = 390\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La dirección principal de las deformaciones
        pregunta: |
          Con $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ de esas
          tensiones, ¿qué ángulo forma con $x$ la dirección principal 1 de
          deformación, en grados, positivo de $x$ hacia $y$?
        respuesta:
          tipo: numero
          valor: '18.43'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '36.87'
            mensaje: |
              Es $2\theta_1$: falta dividir el ángulo entre 2.
          - valor: '10.28'
            mensaje: |
              Has puesto $\tfrac12\gamma_{xy}$ en el numerador de la ec. 4.5,
              que lleva $\gamma_{xy}$ entera:
              $\tan(2\theta_{1def}) = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$.
          - valor: '108.43'
            mensaje: |
              Es la dirección 2, perpendicular a la buena. La 1 es la de la
              mayor deformación: con $\varepsilon_x > \varepsilon_y$ y
              $\gamma_{xy} > 0$ está entre 0° y 45°.
        pista: |
          Hooke (ec. 4.2, con $\sigma_z = 0$) para $\varepsilon_x$ y
          $\varepsilon_y$, y
          $\tan(2\theta_{1def}) = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$
          (ec. 4.5).
        desarrollo: |
          $$
          \varepsilon_x = \frac{60 + 0{,}3\cdot20}{2\cdot10^{5}} = 330\cdot10^{-6}
          \qquad
          \varepsilon_y = \frac{-20 - 0{,}3\cdot60}{2\cdot10^{5}} = -190\cdot10^{-6}
          $$

          $$
          \tan(2\theta_{1def}) = \frac{390}{330 + 190} = 0{,}75
          \quad\Rightarrow\quad \theta_1 = 18{,}43°
          $$

          Con las tensiones, $\tan(2\theta_{1ten}) = 2\cdot30/(60 + 20) = 0{,}75$:
          el mismo ángulo.
      - tipo: justificar
        pregunta: Ordena la justificación. Una pieza es falsa.
        piezas:
          - texto: >-
              Las direcciones principales de tensión son las de los planos sin
              tensión tangencial.
          - texto: >-
              En un material isótropo, $\gamma = \tau/G$ en cada plano
              (ec. 4.3), y las tensiones normales no dan distorsión
              (ec. 4.1).
          - texto: >-
              En los ejes principales de tensión no hay ninguna $\tau$, luego
              tampoco ninguna $\gamma$.
          - texto: >-
              Esos ejes son, por tanto, principales de deformación:
              $\tan(2\theta_{1def}) = \tan(2\theta_{1ten})$.
          - texto: >-
              Coinciden en cualquier material, porque los dos tensores son
              simétricos.
            trampa: true
            mensaje: |
              Ser simétricos garantiza que cada tensor tenga tres direcciones
              principales perpendiculares, no que sean las mismas. Eso lo da
              la isotropía: en un material anisótropo una tensión normal
              puede dar distorsión.
    resolucion: |
      **Lo que hay que comparar.** Las direcciones principales de tensión
      son las normales de los planos en que no hay tensión tangencial; las
      de deformación, las direcciones en que no hay deformación tangencial.

      **La razón** (apuntes del tema 4, p. 5). Según la ley de Hooke,

      $$
      \gamma_{xy} = \frac{\tau_{xy}}{G} \qquad \gamma_{yz} = \frac{\tau_{yz}}{G} \qquad \gamma_{zx} = \frac{\tau_{zx}}{G} \qquad (4.3)
      $$

      las deformaciones tangenciales son nulas cuando lo son las tensiones
      tangenciales, y al revés; y las tensiones normales solo dan
      deformaciones normales (ec. 4.1). En los ejes principales de tensión
      solo hay $\sigma_1$, $\sigma_2$ y $\sigma_3$, así que no hay ninguna
      $\gamma$: son también ejes principales de deformación. En consecuencia,
      **en un material isótropo las direcciones principales de tensiones y
      deformaciones coinciden**. En el plano,

      $$
      \tan(2\theta_{1ten}) = \frac{2\tau_{xy}}{\sigma_x - \sigma_y} \quad (4.4)
      \qquad
      \tan(2\theta_{1def}) = \frac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y} \quad (4.5)
      $$

      dan el mismo ángulo. Los apuntes imprimen $\sigma_x - \sigma_x$ en el
      denominador de la 4.4: es $\sigma_x - \sigma_y$. De esta igualdad sale
      después $G = E/2(1 + \nu)$ (cuestión 6). En un material anisótropo
      una tensión normal puede dar distorsión, y las direcciones no tienen
      por qué coincidir.

      **Un ejemplo nuestro.** $\sigma_x = 60$, $\sigma_y = -20$ y
      $\tau_{xy} = 30$ MPa, con $E = 200$ GPa y $\nu = 0{,}3$. Hooke da, en
      $10^{-6}$, $\varepsilon_x = 330$, $\varepsilon_y = -190$ y
      $\gamma_{xy} = 390$, y

      $$
      \tan(2\theta_{1def}) = \frac{390}{520} = 0{,}75 = \frac{2\cdot30}{80} = \tan(2\theta_{1ten})
      $$

      Las dos direcciones están a $18{,}43°$ de $x$. El motor del curso,
      que saca las principales del tensor de deformaciones sin pasar por la
      4.5, da el mismo ángulo.

  # ── Cuestión 6 de autoevaluación del tema 4 · la relación entre E, G y ν.
  - id: ejerm4-cu6-la-relacion-entre-e-g-y-nu
    titulo: La relación entre E, G y ν
    fuente: >-
      Cuestión 6 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.2 (p. 5). La relación se usa, sin deducirla, en la
      cuestión de las cotas del coeficiente de Poisson de los primeros
      parciales de 2020-2021 y 2022-2023, que es la cuestión 5 de esta hoja.
      El ejemplo es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Para un material isótropo bastan dos constantes elásticas: la tercera
        tiene que salir de las otras dos. La demostración elige un estado de
        tensión sencillo y compara cómo se ve en tensiones y en deformaciones.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu\sigma_y}{E}
        \qquad
        \gamma_{xy} = \frac{\tau_{xy}}{G}
        $$

        La ley de Hooke en el plano, con las tres constantes.
      reconocer: |
        «Demostrar» una relación entre constantes: hay que escribir una misma
        cosa de dos maneras, una con $E$ y $\nu$ y otra con $G$, e igualarlas.
    enunciado: |
      6. Demostrar la relación entre *E*, *G* y $\nu$.
    pide: >-
      La demostración de la relación entre el módulo de Young, el de
      cortadura y el coeficiente de Poisson.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apuntes deducen la relación en un estado de tensión plana. ¿De
          qué igualdad parten?
        opciones:
          - texto: >-
              De que las direcciones principales de tensión y de deformación
              coinciden: el ángulo de la ec. 4.4 es el de la ec. 4.5
            correcta: true
            mensaje: |
              Eso es (p. 5). Con Hooke dentro de la 4.5, igualarla con la 4.4
              deja una relación entre $E$, $G$ y $\nu$ que no depende de las
              tensiones.
          - texto: >-
              De que la tensión hidrostática solo cambia el volumen
            mensaje: |
              Eso da el módulo volumétrico, $k = E/3(1 - 2\nu)$ (ecs. 4.14 a
              4.16), no $G$.
          - texto: >-
              De exigir que $G$ sea positivo
            mensaje: |
              Eso se hace después, con la relación ya deducida, y da
              $\nu > -1$ (ec. 4.7).
          - texto: >-
              De la definición: $G$ es $E$ dividido por 2
            mensaje: |
              $G$ no se define con $E$: es el cociente $\tau/\gamma$ de una
              cortadura (ec. 4.3). Que dependa de $E$ y $\nu$ es lo que hay
              que demostrar.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración como en un examen, desde las direcciones
          principales hasta G = E/2(1 + ν).
        rubrica:
          - punto: >-
              En tensión plana, la dirección principal de tensiones:
              tan(2θ1ten) = 2τxy/(σx − σy) (ec. 4.4).
            porque: >-
              Es una de las dos expresiones que se igualan.
            minimo: true
          - punto: >-
              La de deformaciones: tan(2θ1def) = γxy/(εx − εy) (ec. 4.5).
            porque: >-
              Es la otra expresión que se iguala.
            minimo: true
          - punto: >-
              En un material isótropo las dos coinciden, porque las
              deformaciones tangenciales son nulas si y solo si lo son las
              tensiones tangenciales (ec. 4.3): tan(2θ1def) = tan(2θ1ten).
            porque: >-
              Es la igualdad de la que sale todo, y hay que justificarla.
            minimo: true
          - punto: >-
              Con Hooke (ecs. 4.2 y 4.3, σz = 0): γxy = τxy/G y
              εx − εy = (1 + ν)(σx − σy)/E.
            porque: >-
              Es la sustitución que hace la cuenta; el 1 + ν sale de restar
              las dos normales.
            minimo: true
          - punto: >-
              Igualando, (τxy/G)·E/[(1 + ν)(σx − σy)] = 2τxy/(σx − σy), y
              queda G = E/2(1 + ν) (ec. 4.6).
            porque: >-
              Es el resultado pedido.
            minimo: true
          - punto: >-
              Siendo una propiedad del material, vale en cualquier estado de
              tensión; y como G > 0, ν > −1 (ec. 4.7).
            porque: >-
              Dice por qué una deducción en tensión plana vale siempre, y para
              qué se usa después.
      - tipo: calcular
        titulo: El coeficiente de Poisson a partir de E y G
        pregunta: |
          Un ejemplo nuestro: en una aleación se miden $E = 70$ GPa con un
          ensayo de tracción y $G = 26$ GPa con uno de torsión. ¿Cuánto vale
          $\nu$?
        respuesta:
          tipo: numero
          valor: '0.346'
          tolerancia: 0.001
          formato: un número, sin unidades
        distractores:
          - valor: '1.346'
            mensaje: |
              Es $E/2G$, sin restar 1. De la ec. 4.6, $\nu = E/2G - 1$.
              Además, 1,346 está fuera de $-1 < \nu < 0{,}5$: no puede ser.
          - valor: '1.692'
            mensaje: |
              Has despejado $\nu = E/G - 1$, sin el 2 de la ec. 4.6. También
              está fuera de $-1 < \nu < 0{,}5$.
          - valor: '-0.257'
            mensaje: |
              Has invertido el cociente, $2G/E - 1$. De
              $G = E/2(1 + \nu)$ sale $1 + \nu = E/2G$.
        pista: |
          Ec. 4.6, $G = E/2(1 + \nu)$, despejada: $\nu = E/2G - 1$.
        desarrollo: |
          $$
          \nu = \frac{70}{2\cdot26} - 1 = 1{,}3462 - 1 = 0{,}346
          $$

          Está entre $-1$ y $0{,}5$, como tiene que estar.
      - tipo: calcular
        titulo: El módulo de cortadura de un acero
        pregunta: |
          Un acero tiene $E = 210$ GPa y $\nu = 0{,}3$. ¿Cuánto vale $G$, en
          GPa?
        respuesta:
          tipo: numero
          valor: '80.77'
          tolerancia: 0.01
          formato: un número, en GPa
        distractores:
          - valor: '150'
            mensaje: |
              Has usado $1 - \nu$ en vez de $1 + \nu$:
              $G = E/2(1 + \nu)$ (ec. 4.6).
          - valor: '175'
            mensaje: |
              Es el módulo volumétrico, $k = E/3(1 - 2\nu)$ (ec. 4.16), no el
              de cortadura.
          - valor: '161.54'
            mensaje: |
              Te ha faltado el 2: $G = E/2(1 + \nu)$, no $E/(1 + \nu)$.
        pista: |
          Ec. 4.6: $G = E/2(1 + \nu)$.
        desarrollo: |
          $$
          G = \frac{210}{2\,(1 + 0{,}3)} = 80{,}77
          $$

          en GPa.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              En tensión plana,
              $\tan(2\theta_{1ten}) = 2\tau_{xy}/(\sigma_x - \sigma_y)$
              (ec. 4.4) y
              $\tan(2\theta_{1def}) = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$
              (ec. 4.5).
          - texto: >-
              En un material isótropo las dos direcciones coinciden:
              $\tan(2\theta_{1def}) = \tan(2\theta_{1ten})$.
          - texto: >-
              Con Hooke, $\gamma_{xy} = \tau_{xy}/G$ y
              $\varepsilon_x - \varepsilon_y = (1 + \nu)(\sigma_x - \sigma_y)/E$.
          - texto: >-
              Igualando y simplificando, $G = E/2(1 + \nu)$ (ec. 4.6).
          - texto: >-
              Como la deducción se hace en tensión plana, la relación solo vale
              en tensión plana.
            trampa: true
            mensaje: |
              $E$, $G$ y $\nu$ son propiedades del material, no del estado de
              tensión: la relación, deducida en un caso, vale en todos
              (p. 5). La tensión plana solo simplifica la cuenta.
    resolucion: |
      **De dónde se parte** (apuntes del tema 4, p. 5). La relación se deduce
      en un estado de tensión plana y, siendo una propiedad del material,
      vale en cualquier estado de tensión. Las direcciones principales del
      plano $xy$ son, para las tensiones y para las deformaciones,

      $$
      \tan(2\theta_{1ten}) = \frac{2\tau_{xy}}{\sigma_x - \sigma_y} \quad (4.4)
      \qquad
      \tan(2\theta_{1def}) = \frac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y} \quad (4.5)
      $$

      (los apuntes imprimen $\sigma_x - \sigma_x$ en la 4.4: es
      $\sigma_x - \sigma_y$). Según la ec. 4.3, las deformaciones
      tangenciales son nulas cuando lo son las tensiones tangenciales y al
      revés: en un material isótropo las dos direcciones coinciden,
      $\tan(2\theta_{1def}) = \tan(2\theta_{1ten})$.

      **La sustitución.** Con $\sigma_z = 0$, la ley de Hooke (ecs. 4.2 y
      4.3) da

      $$
      \gamma_{xy} = \frac{\tau_{xy}}{G} \qquad
      \varepsilon_x - \varepsilon_y = \frac{(\sigma_x - \nu\sigma_y) - (\sigma_y - \nu\sigma_x)}{E} = \frac{(1 + \nu)(\sigma_x - \sigma_y)}{E}
      $$

      y llevadas a la 4.5 e igualadas con la 4.4:

      $$
      \frac{\tau_{xy}/G}{(1 + \nu)(\sigma_x - \sigma_y)/E} = \frac{2\tau_{xy}}{\sigma_x - \sigma_y}
      \quad\Rightarrow\quad
      G = \frac{E}{2(1 + \nu)} \qquad (4.6)
      $$

      Como una tensión tangencial da una deformación tangencial del mismo
      signo, $G > 0$, y con ella $\nu > -1$ (ec. 4.7): es la cota inferior
      de la cuestión 5.

      **Un ejemplo nuestro.** Una aleación con $E = 70$ GPa y $G = 26$ GPa
      tiene $\nu = 70/52 - 1 = 0{,}346$, y un acero con $E = 210$ GPa y
      $\nu = 0{,}3$ tiene $G = 80{,}77$ GPa. El motor del curso da lo
      mismo, y con ese $\nu$ devuelve $G = 26$ GPa.

  # ── Cuestión 7 de autoevaluación del tema 4 · el efecto de la temperatura.
  - id: ejerm4-cu7-el-efecto-de-la-temperatura
    titulo: El efecto de la temperatura en la ley de Hooke
    fuente: >-
      Cuestión 7 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.4 (pp. 8 y 9, ecs. 4.19 a 4.22). No está entre las preguntas
      de examen publicadas en el sitio. El ejemplo es nuestro, comprobado con
      el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Un cambio de temperatura dilata el material igual en todas las
        direcciones, sin cambiar los ángulos. Esa deformación se suma a la que
        producen las tensiones.
      formula: |
        $$
        \varepsilon_T = \alpha\,\Delta T
        $$

        La deformación térmica, la misma en todas las direcciones, con $\alpha$
        el coeficiente de dilatación lineal.
      reconocer: |
        Es una pregunta de concepto con dos caras: cómo entra la temperatura en
        las deformaciones y cómo entra en las tensiones.
    enunciado: |
      7. Efecto de la temperatura.
    pide: >-
      Cómo entra un cambio de temperatura en la ley de Hooke: en las
      deformaciones y en las tensiones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un sólido libre, sin ninguna sujeción, se calienta uniformemente.
          ¿Qué tensiones aparecen?
        opciones:
          - texto: >-
              Ninguna: se dilata $\alpha\Delta T$ en todas las direcciones, sin
              distorsión, y si nada lo impide no hace falta ninguna tensión
            correcta: true
            mensaje: |
              Eso es. Con $\varepsilon = \alpha\Delta T$ en los tres ejes, las
              $\varepsilon'$ de la ec. 4.20 son nulas, y la 4.21 da
              $\sigma = 0$.
          - texto: >-
              $\sigma = E\alpha\Delta T$ en cada dirección
            mensaje: |
              Esa es la tensión de una barra que no puede dilatarse en una
              dirección. Libre, la deformación térmica se produce entera y no
              hace falta ninguna fuerza.
          - texto: >-
              Tensiones tangenciales, por la dilatación
            mensaje: |
              Un cambio de temperatura da solo deformaciones normales,
              $\alpha\Delta T$ en cada eje (p. 8): no cambia los ángulos.
          - texto: >-
              La hidrostática, $\sigma = -E\alpha\Delta T/(1 - 2\nu)$
            mensaje: |
              Es la de un sólido al que se le impide dilatarse en las tres
              direcciones. Libre, cero.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Explica el efecto como en un examen: la deformación térmica, la ley
          de Hooke con temperatura y las tensiones en función de las
          deformaciones.
        rubrica:
          - punto: >-
              Un cambio de temperatura da deformaciones normales αΔT, con α el
              coeficiente de dilatación y ΔT medida desde el estado sin
              deformación térmica; no da deformaciones tangenciales.
            porque: >-
              Es el efecto, y lo que no hace.
            minimo: true
          - punto: >-
              Con α constante y superposición:
              εx = [σx − ν(σy + σz)]/E + αΔT, y lo mismo en y y en z
              (ec. 4.19); las tangenciales no cambian.
            porque: >-
              Es la ley de Hooke con temperatura.
            minimo: true
          - punto: >-
              Se escribe con ε′ = ε − αΔT, la parte de la deformación que
              dan las tensiones: ε′x = [σx − ν(σy + σz)]/E (ec. 4.20).
            porque: >-
              Es el cambio de variable que deja la ley como sin temperatura.
            minimo: true
          - punto: >-
              Y al revés: σx = 2Gε′x + λe′ (ec. 4.21), con
              e′ = e − 3αΔT (ec. 4.22).
            porque: >-
              Es la forma con la que se sacan las tensiones de un cuerpo con
              la dilatación impedida.
            minimo: true
          - punto: >-
              Solo hay tensiones térmicas si algo impide la dilatación: un
              cuerpo libre calentado uniformemente se dilata sin tensión.
            porque: >-
              Es lo que se usa después en las barras del tema 8.
      - tipo: calcular
        titulo: La tensión de las paredes
        pregunta: |
          Un ejemplo nuestro: un prisma de acero ($E = 200$ GPa,
          $\nu = 0{,}3$, $\alpha = 12\cdot10^{-6}$ °C⁻¹) está entre dos
          paredes rígidas que le impiden deformarse en $x$, y libre en $y$ y
          en $z$; a la temperatura de montaje no tiene tensión. Se calienta
          50 °C. ¿Cuánto vale $\sigma_x$, en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '-120'
          tolerancia: 0.1
          formato: un número, en MPa, con su signo
        distractores:
          - valor: '120'
            mensaje: |
              Las paredes impiden que se alargue: empujan, y la tensión es de
              compresión.
          - valor: '-171.43'
            mensaje: |
              Es $-E\alpha\Delta T/(1 - \nu)$, la de un prisma al que se le
              impide deformarse en dos direcciones. Aquí $y$ y $z$ están
              libres: $\sigma_y = \sigma_z = 0$.
          - valor: '0'
            mensaje: |
              Sería así si estuviera libre. En $x$ la deformación es nula, y
              la dilatación que no puede hacer se convierte en tensión.
        pista: |
          Ec. 4.19 en $x$, con $\sigma_y = \sigma_z = 0$ y
          $\varepsilon_x = 0$: $0 = \sigma_x/E + \alpha\Delta T$.
        desarrollo: |
          $$
          \sigma_x = -E\,\alpha\,\Delta T = -2\cdot10^{5}\cdot12\cdot10^{-6}\cdot50 = -120
          $$

          en MPa.
      - tipo: calcular
        titulo: Cuánto se ensancha
        pregunta: |
          ¿Y $\varepsilon_y$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '780'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '600'
            mensaje: |
              Solo $\alpha\Delta T$. Falta el efecto de Poisson de $\sigma_x$,
              $-\nu\sigma_x/E$, que con $\sigma_x$ de compresión ensancha.
          - valor: '420'
            mensaje: |
              Has restado el efecto de Poisson. Con $\sigma_x = -120$ MPa,
              $-\nu\sigma_x/E = +180\cdot10^{-6}$: se suma a la dilatación.
          - valor: '180'
            mensaje: |
              Solo el efecto de Poisson. Falta la dilatación térmica,
              $\alpha\Delta T = 600\cdot10^{-6}$, que en $y$ nada impide.
        pista: |
          Ec. 4.19 en $y$:
          $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E + \alpha\Delta T$,
          con $\sigma_y = \sigma_z = 0$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{-0{,}3\cdot(-120)}{2\cdot10^{5}} + 12\cdot10^{-6}\cdot50 = (180 + 600)\cdot10^{-6} = 780\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              La temperatura da deformaciones normales $\alpha\Delta T$ en
              todas las direcciones, sin tangenciales.
          - texto: >-
              Por superposición,
              $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E + \alpha\Delta T$
              (ec. 4.19).
          - texto: >-
              Con $\varepsilon' = \varepsilon - \alpha\Delta T$ queda la ley sin
              temperatura (ec. 4.20).
          - texto: >-
              Y al revés, $\sigma_x = 2G\varepsilon_x' + \lambda e'$, con
              $e' = e - 3\alpha\Delta T$ (ecs. 4.21 y 4.22).
          - texto: >-
              Un cuerpo calentado uniformemente tiene siempre tensiones
              térmicas, $\sigma = E\alpha\Delta T$, aunque esté libre.
            trampa: true
            mensaje: |
              Libre, se dilata $\alpha\Delta T$ sin tensión: $\varepsilon' = 0$
              y la ec. 4.21 da $\sigma = 0$. Las tensiones aparecen solo si
              algo impide la dilatación, como las paredes del ejemplo.
    resolucion: |
      **La deformación térmica** (apuntes del tema 4, apartado 4.4, p. 8).
      Un cambio de temperatura $\Delta T$, medido desde el estado sin
      deformación térmica, da deformaciones normales $\alpha\Delta T$, con
      $\alpha$ el coeficiente de dilatación; no da deformaciones
      tangenciales. Con $\alpha$ constante y el principio de superposición,

      $$
      \varepsilon_x = \frac1E\left[\sigma_x - \nu(\sigma_y + \sigma_z)\right] + \alpha\Delta T \qquad (4.19)
      $$

      y lo mismo en $y$ y en $z$; las tangenciales siguen siendo
      $\gamma = \tau/G$.

      **La ley con ε′.** Llamando $\varepsilon' = \varepsilon - \alpha\Delta T$
      a la parte de la deformación que dan las tensiones, la 4.19 queda como
      la ley sin temperatura:

      $$
      \varepsilon_x' = \varepsilon_x - \alpha\Delta T = \frac1E\left[\sigma_x - \nu(\sigma_y + \sigma_z)\right] \qquad (4.20)
      $$

      y siguiendo el procedimiento del apartado 4.3, las tensiones en
      función de las deformaciones son

      $$
      \sigma_x = 2G\varepsilon_x' + \lambda e' \qquad (4.21)
      \qquad
      e' = \varepsilon_x' + \varepsilon_y' + \varepsilon_z' = e - 3\alpha\Delta T \qquad (4.22)
      $$

      **Cuándo hay tensiones.** Un cuerpo libre calentado uniformemente se
      dilata $\alpha\Delta T$ en todas las direcciones, con $\varepsilon' = 0$
      y sin tensiones. Las tensiones térmicas aparecen cuando algo impide
      esa dilatación.

      **Un ejemplo nuestro.** Un prisma de acero entre dos paredes rígidas
      en $x$, libre en $y$ y $z$, calentado 50 °C ($E = 200$ GPa,
      $\nu = 0{,}3$, $\alpha = 12\cdot10^{-6}$ °C⁻¹). En $x$,
      $0 = \sigma_x/E + \alpha\Delta T$:
      $\sigma_x = -E\alpha\Delta T = -120$ MPa, de compresión. En $y$, la
      dilatación más el efecto de Poisson de esa compresión:
      $\varepsilon_y = (180 + 600)\cdot10^{-6} = 780\cdot10^{-6}$. Con las
      ecs. 4.21 y 4.22 se comprueba al revés que $\sigma_y = \sigma_z = 0$;
      el motor del curso da lo mismo.

  # ── Cuestión 8 de autoevaluación del tema 4 · tensión plana y deformación plana.
  - id: ejerm4-cu8-tension-plana-y-deformacion-plana
    titulo: Tensión plana y deformación plana
    fuente: >-
      Cuestión 8 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.5 (pp. 9 y 10, ecs. 4.23 a 4.26). No está entre las
      preguntas de examen publicadas en el sitio. El ejemplo es nuestro,
      comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        Los dos estados son «planos» de forma distinta: en uno se anulan las
        tensiones de z, y en el otro, las deformaciones de z.
      formula: |
        $$
        \varepsilon_z = \frac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E}
        $$

        La ley de Hooke en z, la que relaciona las dos cosas.
      reconocer: |
        Hay que explicar dos estados parecidos: qué es nulo en cada uno, en qué
        piezas se da y cómo quedan las relaciones de Hooke.
    enunciado: |
      8. Tensión y deformación plana.
    pide: >-
      Qué es cada estado, dónde se da y cómo quedan en cada uno las
      relaciones entre tensiones y deformaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se da cada uno?
        opciones:
          - texto: >-
              La tensión plana, en piezas de pequeño espesor y en la parte
              exterior de los cuerpos; la deformación plana, en el interior de
              cuerpos de gran espesor que no pueden deformarse en $z$
            correcta: true
            mensaje: |
              Eso es (pp. 9 y 10). Donde nada sujeta en $z$, lo nulo es la
              tensión; donde el material de alrededor impide la deformación,
              lo nulo es la deformación.
          - texto: >-
              Al revés: la tensión plana en el interior de los cuerpos gruesos
              y la deformación plana en las piezas delgadas
            mensaje: |
              En una chapa o en una cara libre no hay nada en $z$ que haga
              fuerza: $\sigma_z = 0$, tensión plana. En el interior de un
              cuerpo grueso es la deformación la que está impedida.
          - texto: >-
              Las dos en piezas de pequeño espesor; se distinguen por la carga
            mensaje: |
              En una pieza delgada nada impide deformarse en $z$: es tensión
              plana. La deformación plana necesita un cuerpo grueso, o algo
              que impida la deformación.
          - texto: >-
              La tensión plana, cuando no hay tensiones tangenciales en el
              plano
            mensaje: |
              Tensión plana es $\sigma_z = \tau_{zx} = \tau_{yz} = 0$
              (ec. 4.23); $\tau_{xy}$ puede valer lo que sea.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica los dos estados como en un examen: qué es nulo en cada uno,
          dónde se dan y cómo quedan las relaciones de Hooke.
        rubrica:
          - punto: >-
              Tensión plana: σz = τzx = τyz = 0 (ec. 4.23).
            porque: >-
              Es la definición del primer estado.
            minimo: true
          - punto: >-
              Se da en piezas de pequeño espesor y, en general, en la parte
              exterior de los cuerpos, porque en z no hay tensiones que
              impidan la deformación (p. 9).
            porque: >-
              Dice cuándo se puede suponer; es el caso de las galgas.
            minimo: true
          - punto: >-
              En ella, ε′x = (σx − νσy)/E, ε′y = (σy − νσx)/E y
              ε′z = −ν(σx + σy)/E (ec. 4.24): εz no es nula.
            porque: >-
              Es la ley en este estado, con la εz que una roseta no mide.
            minimo: true
          - punto: >-
              Despejando de las dos primeras:
              σx = E(ε′x + νε′y)/(1 − ν²) y σy = E(νε′x + ε′y)/(1 − ν²)
              (ec. 4.25).
            porque: >-
              Es la que se usa después de una roseta.
            minimo: true
          - punto: >-
              Deformación plana: εz = γzx = γyz = 0 (ec. 4.26). Se da en el
              interior de cuerpos de gran espesor sin libertad de
              deformación, y para impedirla surgen tensiones σz (p. 10).
            porque: >-
              Es la definición del otro estado, con lo que lo distingue.
            minimo: true
          - punto: >-
              En ella se usan las ecuaciones generales con εz = 0; sin
              temperatura, σz = λe (ec. 4.12), que es ν(σx + σy).
            porque: >-
              Dice cómo se calcula la σz que aparece.
          - punto: >-
              Sin temperatura, la tensión plana solo tiene εz = 0 si
              σx = −σy, y la deformación plana solo tiene σz = 0 si
              εx = −εy (p. 10).
            porque: >-
              Es el único caso en que los dos estados coinciden.
      - tipo: calcular
        titulo: σx en tensión plana
        pregunta: |
          Un ejemplo nuestro: en un punto de un acero ($E = 200$ GPa,
          $\nu = 0{,}3$) se miden $\varepsilon_x = 500\cdot10^{-6}$ y
          $\varepsilon_y = 100\cdot10^{-6}$, sin distorsión en el plano. Si
          es un estado de tensión plana, ¿cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '116.48'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '100'
            mensaje: |
              Es $E\varepsilon_x$, como en tracción simple. En tensión plana
              $\sigma_x$ depende también de $\varepsilon_y$ (ec. 4.25).
          - valor: '146.15'
            mensaje: |
              Es la de deformación plana, $2G\varepsilon_x + \lambda e$ con
              $\varepsilon_z = 0$. En tensión plana lo nulo es $\sigma_z$, y
              la fórmula es la 4.25.
          - valor: '151.43'
            mensaje: |
              Has puesto $1 - \nu$ en el denominador. Es $1 - \nu^{2}$
              (ec. 4.25).
        pista: |
          Ec. 4.25, sin temperatura:
          $\sigma_x = E(\varepsilon_x + \nu\varepsilon_y)/(1 - \nu^{2})$.
        desarrollo: |
          $$
          \sigma_x = \frac{2\cdot10^{5}}{1 - 0{,}09}\,(500 + 0{,}3\cdot100)\cdot10^{-6} = 116{,}48
          $$

          en MPa. Igual, $\sigma_y = 54{,}95$ MPa.
      - tipo: calcular
        titulo: εz en tensión plana
        pregunta: |
          En ese mismo estado de tensión plana, ¿cuánto vale
          $\varepsilon_z$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '-257.14'
          tolerancia: 0.05
          formato: un número, en unidades de 10⁻⁶, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              Eso es la deformación plana. En tensión plana lo nulo es
              $\sigma_z$, y $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ no lo
              es (ec. 4.24).
          - valor: '-180'
            mensaje: |
              Has hecho $-\nu(\varepsilon_x + \varepsilon_y)$, aplicando Poisson
              a las deformaciones. Poisson va con las tensiones:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '257.14'
            mensaje: |
              Tiene el signo cambiado: con $\sigma_x$ y $\sigma_y$ de
              tracción, la pieza adelgaza, y $\varepsilon_z$ es negativa.
        pista: |
          Ec. 4.24: $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{0{,}3\,(116{,}484 + 54{,}945)}{2\cdot10^{5}} = -257{,}14\cdot10^{-6}
          $$

          Comprobación: con Hooke sustituida,
          $\varepsilon_z = -\nu(\varepsilon_x + \varepsilon_y)/(1 - \nu) = -0{,}3\cdot600/0{,}7$,
          en $10^{-6}$, que da lo mismo.
      - tipo: calcular
        titulo: σz en deformación plana
        pregunta: |
          Si el punto estuviera en cambio en deformación plana, con esas
          mismas $\varepsilon_x$ y $\varepsilon_y$ y $\varepsilon_z = 0$,
          ¿cuánto valdría $\sigma_z$, en MPa?
        respuesta:
          tipo: numero
          valor: '69.23'
          tolerancia: 0.05
          formato: un número, en MPa, con su signo
        distractores:
          - valor: '0'
            mensaje: |
              En deformación plana lo nulo es $\varepsilon_z$, y para
              impedirla hace falta una $\sigma_z$ (p. 10).
          - valor: '51.43'
            mensaje: |
              Has hecho $\nu(\sigma_x + \sigma_y)$ con las $\sigma_x$ y
              $\sigma_y$ de tensión plana. En deformación plana son otras,
              146,15 y 84,62 MPa, y con ellas
              $\nu(\sigma_x + \sigma_y) = 69{,}23$ MPa; o directamente
              $\lambda e$.
          - valor: '-69.23'
            mensaje: |
              Tiene el signo cambiado. El material querría adelgazar, y lo que
              se lo impide tira de él: $\sigma_z = \lambda e$ es de tracción
              con $e > 0$.
        pista: |
          Ec. 4.12 con $\varepsilon_z = 0$:
          $\sigma_z = 2G\varepsilon_z + \lambda e = \lambda e$, con
          $\lambda = \nu E/(1 + \nu)(1 - 2\nu)$ y
          $e = \varepsilon_x + \varepsilon_y$.
        desarrollo: |
          $\lambda = \dfrac{0{,}3\cdot2\cdot10^{5}}{1{,}3\cdot0{,}4} = 115384{,}6$,
          en MPa, y con $e = 600\cdot10^{-6}$:

          $$
          \sigma_z = \lambda e = 115384{,}6\cdot600\cdot10^{-6} = 69{,}23
          $$

          en MPa.
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Tensión plana: $\sigma_z = \tau_{zx} = \tau_{yz} = 0$, en piezas
              delgadas y en la parte exterior de los cuerpos (ec. 4.23).
          - texto: >-
              En ella $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ no es nula,
              y $\sigma_x = E(\varepsilon_x + \nu\varepsilon_y)/(1 - \nu^{2})$
              (ecs. 4.24 y 4.25).
          - texto: >-
              Deformación plana: $\varepsilon_z = \gamma_{zx} = \gamma_{yz} = 0$,
              en el interior de cuerpos gruesos (ec. 4.26).
          - texto: >-
              En ella hace falta una $\sigma_z$ para impedir $\varepsilon_z$,
              que sale de las ecuaciones generales con $\varepsilon_z = 0$.
          - texto: >-
              En tensión plana $\varepsilon_z = 0$, porque no hay tensión en
              $z$.
            trampa: true
            mensaje: |
              Sin tensión en $z$, el material se estrecha libremente por
              Poisson: $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$. Es la
              deformación plana la que tiene $\varepsilon_z = 0$, y por eso
              necesita una $\sigma_z$.
    resolucion: |
      **Tensión plana** (apuntes del tema 4, apartado 4.5.1, p. 9). Se
      cumple

      $$
      \sigma_z = \tau_{zx} = \tau_{yz} = 0 \qquad (4.23)
      $$

      Se da en piezas de pequeño espesor y, en general, en la parte exterior
      de los cuerpos, porque en $z$ no hay tensiones que impidan la
      deformación. De las ecs. 4.20,

      $$
      \varepsilon_x' = \frac1E(\sigma_x - \nu\sigma_y) \qquad
      \varepsilon_y' = \frac1E(\sigma_y - \nu\sigma_x) \qquad
      \varepsilon_z' = \frac1E\left[-\nu(\sigma_x + \sigma_y)\right] \qquad (4.24)
      $$

      y $\varepsilon_z$ no es nula. Con galgas, en vez de las ecuaciones
      generales se despejan las dos primeras:

      $$
      \sigma_x = \frac{E}{1 - \nu^{2}}\left(\varepsilon_x' + \nu\varepsilon_y'\right) \qquad
      \sigma_y = \frac{E}{1 - \nu^{2}}\left(\nu\varepsilon_x' + \varepsilon_y'\right) \qquad (4.25)
      $$

      Sin temperatura, $\varepsilon_z = 0$ solo si $\sigma_x = -\sigma_y$
      (p. 10).

      **Deformación plana** (apartado 4.5.2, p. 10). Se cumple

      $$
      \varepsilon_z = \gamma_{zx} = \gamma_{yz} = 0 \qquad (4.26)
      $$

      Se da en el interior de cuerpos de gran espesor, cuando no hay
      libertad de deformación; para impedirla surgen tensiones normales en
      $z$. Se usan las ecuaciones generales con $\varepsilon_z = 0$: sin
      temperatura, la 4.12 da $\sigma_z = \lambda e$, que es lo mismo que
      $\nu(\sigma_x + \sigma_y)$. $\sigma_z = 0$ solo si
      $\varepsilon_x = -\varepsilon_y$.

      **Un ejemplo nuestro.** $\varepsilon_x = 500$ y $\varepsilon_y = 100$,
      en $10^{-6}$, sin distorsión, con $E = 200$ GPa y $\nu = 0{,}3$:

      | | tensión plana | deformación plana |
      |---|---|---|
      | $\sigma_x$, MPa | 116,48 | 146,15 |
      | $\sigma_y$, MPa | 54,95 | 84,62 |
      | $\sigma_z$, MPa | 0 | 69,23 |
      | $\varepsilon_z$, $10^{-6}$ | −257,14 | 0 |

      Las mismas deformaciones del plano dan tensiones bien distintas según
      el estado. Las dos columnas salen igual con el motor del curso y por
      el otro camino: $\varepsilon_z = -\nu(\varepsilon_x + \varepsilon_y)/(1 - \nu)$
      en tensión plana y $\sigma_z = \nu(\sigma_x + \sigma_y)$ en
      deformación plana.

  # ── Cuestión 9 de autoevaluación del tema 4 · la energía elástica de deformación.
  - id: ejerm4-cu9-la-energia-elastica-de-deformacion
    titulo: La energía elástica de deformación
    fuente: >-
      Cuestión 9 de autoevaluación · Tema 4, «El cuerpo elástico» ·
      Elasticidad y Resistencia de Materiales, UPV/EHU. El material no trae
      respuesta: la resolución es nuestra y sigue los apuntes del tema 4,
      apartado 4.6 (pp. 10 a 13, fig. 4.1, ecs. 4.27 a 4.37). La pregunta 3
      de teoría del primer parcial de 2019-2020 da esta energía como dato
      para deducir el criterio de Von Mises; esta pide deducirla. El ejemplo
      es nuestro, comprobado con el motor del curso y a mano.
    nivel: practica
    antes:
      idea: |
        La energía de deformación es el trabajo de las fuerzas sobre el elemento
        mientras se deforma, que en un material elástico queda almacenado. Se
        empieza por un resorte y se generaliza a las seis componentes.
      formula: |
        $$
        W = \tfrac12\,F\,x
        $$

        El trabajo en un resorte lineal (ec. 4.27): el ½ sale de que la fuerza
        crece con el alargamiento.
      reconocer: |
        Es una deducción: del caso más sencillo al elemento con todas sus
        tensiones, y del elemento a todo el cuerpo. Al sumar, cuida cómo entra
        cada pareja de tensión y deformación.
    enunciado: |
      9. Energía elástica de deformación.
    pide: >-
      Cómo se obtiene la energía de deformación de un elemento, cuánto vale
      por unidad de volumen y cuánto en todo el cuerpo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al sumar el trabajo de las tensiones en las seis caras y el de las
          fuerzas de volumen salen términos con los desplazamientos y
          términos con sus derivadas (ec. 4.34). ¿Qué pasa con los primeros?
        opciones:
          - texto: >-
              Son nulos: lo que multiplica a $u$, $v$ y $w$ son las ecuaciones
              diferenciales de equilibrio del tema 2
            correcta: true
            mensaje: |
              Eso es (p. 12). Cada paréntesis es
              $\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z} + F_x$ y sus
              compañeros, que valen cero en un cuerpo en equilibrio.
          - texto: >-
              Se desprecian por ser de segundo orden
            mensaje: |
              Son del mismo orden que los otros. No se desprecian: se anulan,
              por el equilibrio.
          - texto: >-
              Son la energía cinética del elemento
            mensaje: |
              El problema es estático: no hay energía cinética. Son nulos por
              el equilibrio.
          - texto: >-
              Son nulos porque las fuerzas de volumen no trabajan
            mensaje: |
              Trabajan (ec. 4.33), pero sus términos se juntan con las
              derivadas de las tensiones en las ecuaciones de equilibrio, y la
              suma es cero.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce la energía como en un examen, desde el resorte hasta U0 y U.
        rubrica:
          - punto: >-
              En un resorte lineal, F = kx, y el trabajo desde la posición no
              deformada es W = U = ½Fx (ec. 4.27); el ½ sale de la relación
              lineal.
            porque: >-
              Es el modelo, y explica el ½ de todo lo que sigue.
            minimo: true
          - punto: >-
              Se calcula el trabajo de las tensiones en las caras del elemento
              de la fig. 4.1: de cada par de caras opuestas queda la variación,
              ½[(σxu),x + (τxyv),x + (τxzw),x] dx dy dz en las caras 1 y 2
              (ecs. 4.28 a 4.30), y lo mismo en y y en z (ecs. 4.31 y 4.32).
            porque: >-
              Es el trabajo de las fuerzas de superficie.
            minimo: true
          - punto: >-
              Se suma el de las fuerzas de volumen, ½(Fxu + Fyv + Fzw) dV
              (ec. 4.33).
            porque: >-
              Completa el trabajo sobre el elemento.
          - punto: >-
              Separando (ec. 4.34): lo que multiplica a u, v y w son las
              ecuaciones de equilibrio y se anula; lo que queda lleva las
              derivadas de los desplazamientos, que en pequeños
              desplazamientos son las deformaciones.
            porque: >-
              Es el paso clave de la deducción.
            minimo: true
          - punto: >-
              dW = ½(σxεx + σyεy + σzεz + τxyγxy + τyzγyz + τzxγzx) dV
              (ec. 4.35), y con dU = dW, la energía por unidad de volumen es
              U0 = dU/dV = ½(σxεx + … + τzxγzx) (ec. 4.36).
            porque: >-
              Es el resultado pedido.
            minimo: true
          - punto: >-
              La de todo el cuerpo es U = ∫ U0 dV, extendida al volumen
              (ec. 4.37).
            porque: >-
              Pasa del elemento al cuerpo.
            minimo: true
      - tipo: calcular
        titulo: La energía por unidad de volumen
        pregunta: |
          Un ejemplo nuestro, en tensión plana: $\sigma_x = 100$,
          $\sigma_y = -50$ y $\tau_{xy} = 40$ MPa, en un acero con
          $E = 200$ GPa y $\nu = 0{,}3$. ¿Cuánto vale $U_0$, en kJ/m³?
        respuesta:
          tipo: numero
          valor: '49.15'
          tolerancia: 0.05
          formato: un número, en kJ/m³
        distractores:
          - valor: '98.30'
            mensaje: |
              Te has dejado el ½ de la ec. 4.36. Las tensiones crecen desde
              cero a la vez que las deformaciones, como la fuerza del resorte:
              el trabajo es la mitad del producto.
          - valor: '38.75'
            mensaje: |
              Te has dejado $\tau_{xy}\gamma_{xy}$. La tangencial también
              trabaja: $\tfrac12\tau_{xy}\gamma_{xy} = 10{,}4$ kJ/m³.
          - valor: '43.95'
            mensaje: |
              Has puesto $\tfrac12\gamma_{xy}$, la del tensor. En la ec. 4.36
              va $\tau_{xy}\gamma_{xy}$, con $\gamma$ entera.
          - valor: '41.65'
            mensaje: |
              Has sacado las deformaciones sin el efecto de Poisson,
              $\varepsilon_x = \sigma_x/E$. Con la ley de Hooke entera,
              $\varepsilon_x = 575\cdot10^{-6}$ y
              $\varepsilon_y = -400\cdot10^{-6}$.
        pista: |
          Hooke para $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$, y
          $U_0 = \tfrac12(\sigma_x\varepsilon_x + \sigma_y\varepsilon_y + \tau_{xy}\gamma_{xy})$
          (ec. 4.36, con $\sigma_z = 0$). 1 MPa son 1000 kJ/m³.
        desarrollo: |
          En $10^{-6}$: $\varepsilon_x = (100 + 0{,}3\cdot50)/0{,}2 = 575$,
          $\varepsilon_y = (-50 - 0{,}3\cdot100)/0{,}2 = -400$ y
          $\gamma_{xy} = 40/0{,}076923 = 520$. Entonces

          $$
          U_0 = \tfrac12\left(100\cdot575 + (-50)(-400) + 40\cdot520\right)\cdot10^{-6} = 0{,}04915
          $$

          en MPa: 49,15 kJ/m³.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En un resorte lineal, $W = U = \tfrac12Fx$ (ec. 4.27).
          - texto: >-
              En el elemento, el trabajo de las tensiones en las seis caras y
              el de las fuerzas de volumen (ecs. 4.28 a 4.33).
          - texto: >-
              Los términos con $u$, $v$ y $w$ son las ecuaciones de equilibrio
              y se anulan (ec. 4.34).
          - texto: >-
              Queda
              $dW = \tfrac12(\sigma_x\varepsilon_x + \dots + \tau_{zx}\gamma_{zx})\,dV$,
              y con $dU = dW$, $U_0 = dU/dV$ (ecs. 4.35 y 4.36).
          - texto: >-
              La del cuerpo es $U = \int_V U_0\,dV$ (ec. 4.37).
          - texto: >-
              En $U_0$ las tangenciales van con su mitad,
              $\tau_{xy}\cdot\tfrac12\gamma_{xy}$, como en el tensor de
              deformaciones.
            trampa: true
            mensaje: |
              En la ec. 4.36 va $\tau_{xy}\gamma_{xy}$, con $\gamma$ entera:
              sale de $\tau_{xy}(v_{,x} + u_{,y})$ en la 4.34, los términos de
              las caras $x$ y de las caras $y$ juntos. Con el tensor, cada
              $\tfrac12\gamma$ aparece dos veces y se llega a lo mismo.
    resolucion: |
      **El resorte** (apuntes del tema 4, apartado 4.6, p. 10). En un resorte
      lineal, $F = kx$, y el trabajo realizado desde la posición no deformada
      se convierte en energía potencial elástica:

      $$
      W = U = \tfrac12Fx \qquad (4.27)
      $$

      El $\tfrac12$ es consecuencia de la relación lineal.

      **El trabajo sobre el elemento** (pp. 10 a 12, fig. 4.1). En la cara
      1, la de la izquierda, tensiones y desplazamientos tienen sentidos
      opuestos y el trabajo es
      $-\tfrac12[(\sigma_xu)_1 + (\tau_{xy}v)_1 + (\tau_{xz}w)_1]\,dy\,dz$
      (ec. 4.28); en la cara 2 todo va con su incremento en $x$ y el trabajo
      es positivo (ec. 4.29). Las dos juntas dejan

      $$
      \tfrac12\left[(\sigma_xu)_{,x} + (\tau_{xy}v)_{,x} + (\tau_{xz}w)_{,x}\right]dx\,dy\,dz \qquad (4.30)
      $$

      y lo mismo las caras 3 y 4 en $y$ (ec. 4.31) y las 5 y 6 en $z$
      (ec. 4.32). Las fuerzas de volumen añaden
      $\tfrac12(F_xu + F_yv + F_zw)\,dV$ (ec. 4.33).

      **Los términos que se anulan.** Sumando y separando lo que lleva
      desplazamientos de lo que lleva sus derivadas (ec. 4.34), la primera
      línea es

      $$
      \tfrac12dV\left[\left(\sigma_{x,x} + \tau_{yx,y} + \tau_{zx,z} + F_x\right)u + \dots\right]
      $$

      y cada paréntesis es una ecuación diferencial de equilibrio del tema 2:
      es nula. La segunda línea lleva $u_{,x}$, $v_{,y}$, $w_{,z}$ y las
      sumas $v_{,x} + u_{,y}$…, que en un problema de pequeños
      desplazamientos son las deformaciones del tema 3:

      $$
      dW = \tfrac12\left(\sigma_x\varepsilon_x + \sigma_y\varepsilon_y + \sigma_z\varepsilon_z + \tau_{xy}\gamma_{xy} + \tau_{yz}\gamma_{yz} + \tau_{zx}\gamma_{zx}\right)dV \qquad (4.35)
      $$

      **La energía.** Como en el resorte, el trabajo se convierte en energía
      elástica de deformación, $dU = dW$, y por unidad de volumen

      $$
      U_0 = \frac{dU}{dV} = \tfrac12\left(\sigma_x\varepsilon_x + \sigma_y\varepsilon_y + \sigma_z\varepsilon_z + \tau_{xy}\gamma_{xy} + \tau_{yz}\gamma_{yz} + \tau_{zx}\gamma_{zx}\right) \qquad (4.36)
      $$

      La de todo el cuerpo es $U = \int_V U_0\,dV$ (ec. 4.37).

      **Un ejemplo nuestro.** $\sigma_x = 100$, $\sigma_y = -50$ y
      $\tau_{xy} = 40$ MPa, con $E = 200$ GPa y $\nu = 0{,}3$. Hooke da, en
      $10^{-6}$, $\varepsilon_x = 575$, $\varepsilon_y = -400$,
      $\varepsilon_z = -75$ y $\gamma_{xy} = 520$, y $U_0 = 0{,}04915$ MPa,
      es decir, 49,15 kJ/m³ ($\varepsilon_z$ no trabaja, porque
      $\sigma_z = 0$). Escrita con las tensiones,
      $U_0 = (\sigma_x^{2} + \sigma_y^{2} - 2\nu\sigma_x\sigma_y)/2E + \tau_{xy}^{2}/2G$,
      sale lo mismo, y el motor del curso también.
