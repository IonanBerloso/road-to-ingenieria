      <figcaption>

      Redibujada del enunciado: la pieza rígida, los dos bloques, la placa
      entre ellos, las dos cotas y los ejes, como en el original.

      </figcaption>
      </figure>

      **Notas nuestras.** La placa rígida es una pieza aparte, como la dibuja
      la figura, con otro rayado: no está unida a la pieza rígida del hueco.
    notas:
      - >-
        Nota: $E$, $\nu$, $\alpha$, $\Delta T$ son datos para cada material. Se
        recomienda resolver el problema simbólicamente y posteriormente
        sustituir los datos numéricos.
    pide: >-
      Las tensiones principales en cada bloque, la variación de longitud de
      las aristas y la variación de volumen de cada bloque.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay en las caras de cada bloque según $x$ y según $z$?
        opciones:
          - texto: >-
              $\sigma_x = 0$ y $\sigma_z = 0$: en $x$ lo dice el enunciado, y
              en $z$ la cara de arriba está libre
            correcta: true
            mensaje: |
              Eso es. El fondo del hueco sostiene los bloques, pero no impide
              que crezcan hacia arriba: la cara de arriba no toca nada, y
              $\sigma_z = 0$. Cada bloque está en un estado de tensión de una
              sola componente, $\sigma_y$.
          - texto: >-
              $\sigma_x = 0$ y $\varepsilon_z = 0$, porque el fondo del hueco
              es rígido
            mensaje: |
              El fondo impide que el bloque baje, no que crezca hacia arriba.
              La cara de arriba está libre, y por encima no hay nada: lo nulo
              es $\sigma_z$.
          - texto: >-
              $\varepsilon_x = 0$ y $\sigma_z = 0$
            mensaje: |
              El enunciado dice lo contrario: hay libertad de deformación según
              $x$. Libre quiere decir sin tensión, $\sigma_x = 0$.
      - tipo: reconocer
        pregunta: |
          ¿Qué impone la placa rígida entre los dos bloques?
        opciones:
          - texto: >-
              La misma $\sigma_y$ en los dos, y que lo que crece uno según $y$
              lo encoja el otro: $\Delta b_1 + \Delta b_2 = 0$
            correcta: true
            mensaje: |
              Eso es. La placa está suelta: se queda donde las dos fuerzas se
              equilibran, y como los dos bloques tienen la misma cara $a\,c$,
              tienen la misma tensión. Y como el hueco entero no cambia, lo que
              uno crece según $y$ lo encoge el otro.
          - texto: >-
              $\varepsilon_y = 0$ en cada bloque, porque la placa es rígida
            mensaje: |
              Rígida no quiere decir fija: la placa no se deforma, pero se
              mueve. Si estuviera fija, cada bloque sería un problema aparte,
              con la placa de pared; está suelta, y es la suma la que no
              cambia.
          - texto: >-
              $\sigma_y = 0$, porque la placa se desplaza hasta que ningún
              bloque empuja
            mensaje: |
              La placa se desplaza, pero los dos bloques se calientan y los dos
              quieren crecer según $y$: entre las dos paredes del hueco no hay
              sitio para los dos. Se comprimen el uno al otro, a través de la
              placa.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **los dos bloques sacados del
          hueco, vistos desde x**, con lo que se busca.
        comprueba:
          - punto: |
              **En cada bloque, $\sigma_y$ en las caras de la pared y de la
              placa, como incógnita, dibujada positiva.**
            porque: |
              La placa está suelta: lo que empuja a un bloque empuja al otro, y
              la incógnita es una sola, la misma en los dos.
          - punto: |
              **Arriba y según x, nada.**
            porque: |
              La cara de arriba está libre y según x hay libertad de
              deformación: $\sigma_z = \sigma_x = 0$.
          - punto: |
              **La temperatura de cada bloque, sin flecha.**
            porque: |
              No es una tensión: es una deformación, $\alpha_i\Delta T_i$ en las
              tres direcciones, distinta en cada bloque.
        figura: |
          <svg viewBox="0 0 490 166" role="img" width="490" height="166" aria-labelledby="dsl-t dsl-d">
            <title id="dsl-t">Los dos bloques sacados del hueco, vistos desde x</title>
