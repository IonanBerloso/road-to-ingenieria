        <line x1="88.3" y1="63" x2="131.7" y2="63" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
        <line x1="131.7" y1="147" x2="88.3" y2="147" stroke="var(--flag)" stroke-width="2" marker-end="url(#dsl-fc)"/>
        <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--flag)"></text>
      </svg>
      <figcaption>

      Las tensiones, en su sentido real, en MPa: las dos normales son de tracción, aunque la roseta lea un acortamiento en y.

      </figcaption>
      </figure>

      **Lo que la roseta no mide.**

      $$
      \varepsilon_z = -\frac{0{,}3}{2 \cdot 10^{5}}\,(150 + 30) = -270 \cdot 10^{-6}
      $$

      **5. Comprobación.** Hooke en el sentido de los apuntes, de tensiones a
      deformaciones (ec. 4.2, p. 4), tiene que devolver las lecturas:

      $$
      \varepsilon_x = \frac{150 - 0{,}3 \cdot 30}{2 \cdot 10^{5}} = 705 \cdot 10^{-6}
      \qquad
      \varepsilon_y = \frac{30 - 0{,}3 \cdot 150}{2 \cdot 10^{5}} = -75 \cdot 10^{-6}
      $$

      Y $\varepsilon_z$ también sale sin las tensiones, solo con las
      deformaciones del plano:
      $\varepsilon_z = -\frac{\nu}{1-\nu}\,(\varepsilon_x + \varepsilon_y) = -\frac{0{,}3}{0{,}7} \cdot 630 \cdot 10^{-6} = -270 \cdot 10^{-6}$.

      **Lo que dice el resultado.** El signo de una deformación no es el de
      la tensión de su dirección: $y$ se acorta y está a tracción. Y la pieza
      adelgaza en z, $-270\cdot10^{-6}$, aunque nada la empuje en esa
      dirección.

  - id: ejerm4-cubo-en-un-hueco-rigido
    titulo: Un cubo en un hueco rígido, y cuánto cambia su volumen
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    antes:
      idea: |
        Cada sujeción da una condición: en cada dirección se conoce o la tensión
        o la deformación. Con tres condiciones y las tres ecuaciones de Hooke se
        cierra el problema.
      formula: |
        $$
        \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}
        $$

        y las otras dos igual (ec. 4.2). El cambio de volumen es $e\,V$, con
        $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$.
      reconocer: |
        Antes de las cuentas, traduce cada frase del enunciado a una condición:
        las paredes, las caras libres y la carga.
    enunciado: |
      Un cubo de aluminio de 50 mm de arista ($E = 70\ \text{GPa}$,
      $\nu = 0{,}3$) está metido sin holgura entre dos paredes rígidas que le
      impiden deformarse en $x$. Las caras perpendiculares a $z$ están libres.
      Se comprime en $y$ con una tensión uniforme
      $\sigma_y = -70\ \text{MPa}$. Sin rozamiento con las paredes, calcular
      la tensión $\sigma_x$ que hacen las paredes, la deformación
      $\varepsilon_z$ y el cambio de volumen del cubo.

