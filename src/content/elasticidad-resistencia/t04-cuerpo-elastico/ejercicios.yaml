        Nota: $E$, $\nu$ son datos.
    pide: >-
      Las tensiones principales, la variación de longitud de las aristas y la
      variación de volumen del cuerpo A, en función de σ0, E y ν; y la
      variación de volumen con ν = ½.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condiciones ponen la carga, el hueco y la deformación impedida
          en $z$?
        opciones:
          - texto: >-
              $\sigma_y = -\sigma_0$, $\varepsilon_x = 0$ y $\varepsilon_z = 0$
            correcta: true
            mensaje: |
              Eso es. Ahora hay dos direcciones impedidas, $x$ y $z$, y en las
              dos la incógnita es la tensión que hace falta para que la arista
              no cambie. En $y$ se conoce la tensión, la carga.
          - texto: >-
              $\sigma_y = -\sigma_0$, $\varepsilon_x = 0$ y $\sigma_z = 0$
            mensaje: |
              Esas son las del 4.1, con $z$ libre. Aquí la deformación en $z$
              está impedida: lo nulo es $\varepsilon_z$, y $\sigma_z$ es la que
              haga falta para conseguirlo.
          - texto: >-
              $\varepsilon_x = 0$, $\varepsilon_y = 0$ y $\varepsilon_z = 0$
            mensaje: |
              En $y$ la cara de arriba no está contra nada rígido: soporta la
              carga, y el cuerpo se acorta en $y$. Lo que se conoce en $y$ es
              la tensión, $\sigma_y = -\sigma_0$.
      - tipo: dibujar
        consigna: |
          En papel, antes de ninguna cuenta: **el cuerpo A sacado del hueco,
          visto desde z**, con lo que se sabe y lo que se busca.
        comprueba:
          - punto: |
              **$\sigma_0$ entrando por arriba, y lo mismo por abajo.**
            porque: |
              El fondo responde con lo mismo: $\sigma_y = -\sigma_0$.
          - punto: |
              **En lugar de las paredes, $\sigma_x$ como incógnita, dibujada
              positiva.**
            porque: |
              Sin rozamiento, la pared solo da tensión normal, y como es
              rígida, $\varepsilon_x = 0$.
          - punto: |
              **En z, $\sigma_z$, también incógnita, saliendo del papel.**
            porque: |
              La deformación en z está impedida, $\varepsilon_z = 0$: también
              ahí hace falta una tensión para conseguirlo.
