      **Notas nuestras.** Aquí va el apartado c/; los a/ y b/ son el
      ejercicio anterior, y de ellos se parte: $\varepsilon_x = 5$,
      $\varepsilon_y = 1$ y $\gamma_{xy} = 2$, y las principales
      $\varepsilon_1 = 5{,}236$ y $\varepsilon_2 = 0{,}764$, todo en
      $10^{-4}$, con la dirección 1 a $13{,}28°$ de $x$. El módulo,
      $E = 1{,}5\cdot10^{6}$ MPa, es unas siete veces el del acero: ningún
      material es tan rígido, y casi seguro es una errata del original. El
      ejercicio 4.5 da los módulos en kp/cm² con ese mismo orden de magnitud
      (2·10⁶ el acero), así que lo probable es que fueran 1,5·10⁶ kp/cm²,
      unos 1,47·10⁵ MPa. Aquí se usa lo impreso. Las tensiones son
      proporcionales a $E$: con el otro valor serían unas diez veces menores
      ($\sigma_1 \approx 85$ MPa), y $\varepsilon_z$ no cambia.
    pide: >-
      σx, σy y τxy; las tensiones principales y su dirección; σn y τn del
      plano perpendicular a la dirección a; y, aunque no lo pida, εz.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las galgas dan deformaciones del plano. ¿Con qué se pasa a
          tensiones?
        opciones:
          - texto: >-
              Con Hooke en tensión plana:
              $\sigma_x = \tfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$,
              $\sigma_y = \tfrac{E}{1-\nu^{2}}(\varepsilon_y + \nu\varepsilon_x)$
              y $\tau_{xy} = G\gamma_{xy}$
            correcta: true
            mensaje: |
              Eso es (ecs. 4.24-4.25). El enunciado dice tensión plana:
              $\sigma_z = 0$, y $\varepsilon_z$ no es cero.
          - texto: Con $\sigma = E\varepsilon$ en cada dirección
            mensaje: |
              Eso es la barra a tracción, con una sola tensión. Aquí hay dos en
              el plano y cada una acorta la otra dirección por Poisson:
              $\sigma_x = E\varepsilon_x$ olvida el $\nu\varepsilon_y$ y el
              $1 - \nu^{2}$.
          - texto: >-
              Con las de deformación plana,
              $\sigma_x = (\lambda + 2G)\,\varepsilon_x + \lambda\,\varepsilon_y$
            mensaje: |
              Esas suponen $\varepsilon_z = 0$. El enunciado dice tensión
              plana: lo nulo es $\sigma_z$, y $\varepsilon_z$ queda libre.
      - tipo: calcular
        titulo: La tensión σx
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '840'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '750'
            mensaje: |
              Es $E\varepsilon_x$, como en una barra. En tensión plana,
              $\sigma_x = \tfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$:
              la $\sigma_y$ acorta $x$ por Poisson, y $\sigma_x$ tiene que ser
              mayor para dar el mismo $\varepsilon_x$.
          - valor: '960'
            mensaje: |
              Es $(\lambda + 2G)\,\varepsilon_x + \lambda\,\varepsilon_y$, de
              deformación plana ($\varepsilon_z = 0$). Aquí es tensión plana:
              $\sigma_z = 0$.
        pista: |
          $\dfrac{E}{1-\nu^{2}} = \dfrac{1{,}5\cdot10^{6}}{0{,}9375} = 1{,}6\cdot10^{6}$ MPa.
        desarrollo: |
          $$
          \sigma_x = \frac{E}{1-\nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y) = 1{,}6\cdot10^{6}\cdot(5 + 0{,}25\cdot1)\cdot10^{-4} = 840\ \text{MPa}
          $$

          $$
          \sigma_y = 1{,}6\cdot10^{6}\cdot(1 + 0{,}25\cdot5)\cdot10^{-4} = 360\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial τxy
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '60'
            mensaje: |
              Es $G\cdot\tfrac12\gamma_{xy}$. La ley es
              $\tau_{xy} = G\gamma_{xy}$, con la distorsión entera; la mitad es
              la componente del tensor de deformaciones.
          - valor: '300'
            mensaje: |
              Es $E\gamma_{xy}$. La tangencial va con el módulo de
              elasticidad transversal, $G = \tfrac{E}{2(1+\nu)}$ (ec. 4.6), no
              con $E$.
        pista: |
          $G = \dfrac{E}{2(1+\nu)}$, y $\tau_{xy} = G\gamma_{xy}$ con la
          $\gamma$ entera.
        desarrollo: |
          $$
          G = \frac{1{,}5\cdot10^{6}}{2\cdot1{,}25} = 6\cdot10^{5}\ \text{MPa},\qquad
          \tau_{xy} = 6\cdot10^{5}\cdot2\cdot10^{-4} = 120\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor, $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '868.33'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '785.41'
            mensaje: |
              Es $E\varepsilon_1$. En tensión plana,
              $\sigma_1 = \tfrac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$:
              la contracción de Poisson que causa $\sigma_2$ en la dirección 1
              hay que compensarla, y $\sigma_1$ sale mayor que
              $E\varepsilon_1$.
          - valor: '268.33'
            mensaje: |
              Es el radio del círculo de tensiones. La principal es el centro
              más el radio.
        pista: |
          El círculo de tensiones: centro $\tfrac12(\sigma_x + \sigma_y)$ y
          radio $\sqrt{\left(\tfrac12(\sigma_x - \sigma_y)\right)^{2} + \tau_{xy}^{2}}$,
          aquí con la $\tau_{xy}$ entera.
        desarrollo: |
          $$
          C = \frac{840 + 360}{2} = 600,\qquad R = \sqrt{240^{2} + 120^{2}} = 268{,}33\ \text{MPa}
          $$

          $\sigma_1 = 600 + 268{,}33 = 868{,}33$ MPa y
          $\sigma_2 = 600 - 268{,}33 = 331{,}67$ MPa, con $\sigma_3 = \sigma_z = 0$.
          Con
          $\tan2\theta = \frac{2\cdot120}{840 - 360} = 0{,}5$ la dirección 1
          está a $13{,}28°$ de $x$, la misma que la de $\varepsilon_1$: en un
          material isótropo las direcciones principales de tensiones y de
          deformaciones coinciden. Por el otro camino,
          $\sigma_1 = 1{,}6\cdot10^{6}\cdot(5{,}2361 + 0{,}25\cdot0{,}7639)\cdot10^{-4} = 868{,}33$ MPa.
      - tipo: calcular
        titulo: La deformación εz
        pregunta: |
          Un paso nuestro: el enunciado no lo pide, pero es lo que la roseta
          no mide. ¿Cuánto vale $\varepsilon_z$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.005
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '0'
            mensaje: |
              En tensión plana lo nulo es $\sigma_z$, no $\varepsilon_z$: con
              $\sigma_x$ y $\sigma_y$ de tracción el espesor se estrecha por
              Poisson.
          - valor: '-1.5'
            mensaje: |
              Es $-\nu(\varepsilon_x + \varepsilon_y)$. La ec. 4.25 da
              $\varepsilon_z = -\tfrac{\nu}{E}(\sigma_x + \sigma_y)$, que en
              deformaciones es
              $-\tfrac{\nu}{1-\nu}(\varepsilon_x + \varepsilon_y)$: el factor
              es $\tfrac{\nu}{1-\nu} = \tfrac13$, no $\nu$.
        pista: |
          $\varepsilon_z = -\dfrac{\nu}{E}\,(\sigma_x + \sigma_y)$.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{0{,}25}{1{,}5\cdot10^{6}}\cdot(840 + 360) = -2\cdot10^{-4}
          $$

          Por el otro camino,
          $-\frac{0{,}25}{0{,}75}\cdot(5 + 1)\cdot10^{-4} = -2\cdot10^{-4}$.
      - tipo: calcular
        titulo: La normal del plano perpendicular a la galga a
        pregunta: |
          El plano perpendicular a la dirección a tiene por normal la propia a,
          a 30° de $x$. ¿Cuánto vale su tensión normal $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '823.92'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '376.08'
            mensaje: |
              Es la del plano que contiene la dirección a, el de normal a
              120°. «Perpendicular a la dirección a» quiere decir que a es su
              normal.
          - valor: '616.08'
            mensaje: |
              Es la del plano de normal a $-30°$: el ángulo de la a con el
              signo cambiado. La a sube hacia la derecha, a $+30°$.
        pista: |
          $\sigma_n = \dfrac{\sigma_x + \sigma_y}{2} + \dfrac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\operatorname{sen}2\theta$,
          con $\theta = 30°$.
        desarrollo: |
          $$
          \sigma_n = 600 + 240\cos60° + 120\operatorname{sen}60° = 600 + 120 + 103{,}92 = 823{,}92\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial del plano perpendicular a la galga a
        pregunta: |
          ¿Y su tensión tangencial $\tau_n$, en MPa, con el convenio del tema
          2: positiva si va según $\hat t$, la normal girada 90° en sentido
          antihorario?
        respuesta:
          tipo: numero
          valor: '-147.85'
          tolerancia: 0.1
          formato: un número con su signo, en MPa
        distractores:
          - valor: '267.85'
            mensaje: |
              Has cambiado el signo del primer término, o has tomado la a a
              $-30°$, que da lo mismo. Con el convenio del curso,
              $\tau_n = \tfrac{\sigma_y - \sigma_x}{2}\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
              (ec. 2.61): $-240\operatorname{sen}60° + 120\cos60°$.
          - valor: '147.85'
            mensaje: |
              El valor es ese y el signo no: sale negativa, así que la
              tangencial va al revés que $\hat t$ (que está a 120°): apunta
              hacia $-60°$.
          - valor: '837.08'
            mensaje: |
              Es el módulo del vector tensión,
              $\sqrt{\sigma_n^{2} + \tau_n^{2}}$. $\tau_n$ es solo su
              componente en el plano.
        pista: |
          $\tau_n = \dfrac{\sigma_y - \sigma_x}{2}\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
          (ec. 2.61), con $\theta = 30°$.
        desarrollo: |
          $$
          \tau_n = -240\operatorname{sen}60° + 120\cos60° = -207{,}85 + 60 = -147{,}85\ \text{MPa}
          $$

          Por Cauchy: $\vec S = [\sigma]\{\cos30°, \operatorname{sen}30°\} = (787{,}46;\ 283{,}92)$ MPa,
          y proyectado sobre $\hat t = (-\operatorname{sen}30°, \cos30°)$,
          $-787{,}46\cdot0{,}5 + 283{,}92\cdot0{,}86603 = -147{,}85$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En tensión plana, $\sigma_x = 840$ y $\sigma_y = 360$ MPa por
              Hooke (ecs. 4.24-4.25), y $\tau_{xy} = G\gamma_{xy} = 120$ MPa
              con $G = 6\cdot10^{5}$ MPa.
          - texto: >-
              El círculo de tensiones tiene centro 600 y radio 268,33 MPa:
              $\sigma_1 = 868{,}33$ y $\sigma_2 = 331{,}67$ MPa, a $13{,}28°$ y
              $103{,}28°$ de $x$, las mismas direcciones que las de las
              deformaciones.
          - texto: >-
              $\varepsilon_z = -\tfrac{\nu}{E}(\sigma_x + \sigma_y) = -2\cdot10^{-4}$,
              aunque $\sigma_z = 0$.
          - texto: >-
              El plano perpendicular a la a tiene la normal a 30°:
              $\sigma_n = 823{,}92$ MPa y $\tau_n = -147{,}85$ MPa.
          - texto: >-
              Las principales salen de las deformaciones principales con
              $\sigma_1 = E\varepsilon_1 = 785{,}41$ MPa y
              $\sigma_2 = E\varepsilon_2$.
            trampa: true
            mensaje: |
              $\sigma = E\varepsilon$ es la barra con una sola tensión. En
              tensión plana,
              $\sigma_1 = \tfrac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2) = 868{,}33$ MPa:
              la contracción de Poisson que causa $\sigma_2$ en la dirección 1
              hay que compensarla.
    resolucion: |
      **La idea.** De la roseta salen las deformaciones del plano (ejercicio
      anterior). Para pasar a tensiones se usa Hooke en tensión plana, no
      $\sigma = E\varepsilon$; las principales salen del círculo de tensiones
      o, por el mismo Hooke, de las deformaciones principales, porque en un
      material isótropo las direcciones coinciden. El plano perpendicular a
      la a es el que tiene la a por normal.

      **Las tensiones del plano.** Con
      $\tfrac{E}{1-\nu^{2}} = \tfrac{1{,}5\cdot10^{6}}{0{,}9375} = 1{,}6\cdot10^{6}$ MPa
      y $G = \tfrac{E}{2(1+\nu)} = 6\cdot10^{5}$ MPa (ecs. 4.6, 4.24-4.25):

      $$
      \sigma_x = 1{,}6\cdot10^{6}\cdot(5 + 0{,}25\cdot1)\cdot10^{-4} = 840\ \text{MPa},\qquad
      \sigma_y = 1{,}6\cdot10^{6}\cdot(1 + 0{,}25\cdot5)\cdot10^{-4} = 360\ \text{MPa}
      $$

      $$
      \tau_{xy} = 6\cdot10^{5}\cdot2\cdot10^{-4} = 120\ \text{MPa},\qquad \sigma_z = 0
      $$

      **c/ Tensiones y direcciones principales.** Centro
      $\tfrac{840 + 360}{2} = 600$ y radio $\sqrt{240^{2} + 120^{2}} = 268{,}33$ MPa:

      $$
      \sigma_1 = 600 + 268{,}33 = 868{,}33\ \text{MPa},\qquad
      \sigma_2 = 600 - 268{,}33 = 331{,}67\ \text{MPa},\qquad \sigma_3 = 0
      $$

      con $\tan2\theta_1 = \tfrac{2\cdot120}{840 - 360} = 0{,}5$: la dirección
      1 a $13{,}28°$ de $x$ y la 2 a $103{,}28°$, las de las deformaciones
      principales. Por Hooke en esas direcciones sale lo mismo:
      $\sigma_1 = 1{,}6\cdot10^{6}\cdot(5{,}2361 + 0{,}25\cdot0{,}7639)\cdot10^{-4} = 868{,}33$ MPa
      y $\sigma_2 = 1{,}6\cdot10^{6}\cdot(0{,}7639 + 0{,}25\cdot5{,}2361)\cdot10^{-4} = 331{,}67$ MPa.
      Y, aunque el enunciado no la pida, la deformación que la roseta no
      mide: $\varepsilon_z = -\tfrac{\nu}{E}(\sigma_x + \sigma_y) = -2\cdot10^{-4}$.

      **El plano perpendicular a la dirección a.** Su normal es la a,
      $\theta = 30°$, y $2\theta = 60°$:

      $$
      \sigma_n = 600 + 240\cos60° + 120\operatorname{sen}60° = 600 + 120 + 103{,}92 = 823{,}92\ \text{MPa}
      $$

      $$
      \tau_n = -240\operatorname{sen}60° + 120\cos60° = -207{,}85 + 60 = -147{,}85\ \text{MPa}
      $$

      con la ec. 2.61: $\tau_n$ negativa quiere decir que la tangencial va al
      revés que $\hat t$ (a 120°), hacia $-60°$.

      **La comprobación, por Cauchy.** Con $\vec n = (\cos30°, \operatorname{sen}30°)$,
      $\vec S = [\sigma]\{n\} = (787{,}46;\ 283{,}92)$ MPa. Proyectado,
      $\vec S\cdot\vec n = 787{,}46\cdot0{,}86603 + 283{,}92\cdot0{,}5 = 823{,}92$ MPa
      y $\vec S\cdot\hat t = -787{,}46\cdot0{,}5 + 283{,}92\cdot0{,}86603 = -147{,}85$ MPa;
      su módulo, $|\vec S| = \sqrt{823{,}92^{2} + 147{,}85^{2}} = 837{,}08$ MPa.
