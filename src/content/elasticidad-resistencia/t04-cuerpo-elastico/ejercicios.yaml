      <figcaption>

      El cubo sin las paredes, visto desde z: σy, de 70 MPa, entrando en las caras y, como dato; σx, la que hacen las paredes, como incógnita, dibujada positiva. Las caras z, las del papel, están libres.

      </figcaption>
      </figure>

      - **Las paredes**, rígidas y sin holgura, dan $\varepsilon_x = 0$.
      - **Las caras de z**, libres, dan $\sigma_z = 0$.
      - **$\sigma_y = -70$ MPa** es dato.

      **2. Incógnitas.** $\sigma_x$, $\varepsilon_y$ y $\varepsilon_z$, y el
      cambio de volumen.

      **3. Ecuaciones.** Las tres de Hooke (ec. 4.2) y la deformación
      volumétrica:

      $$
      \varepsilon_x = \frac{\sigma_x - \nu\,\sigma_y}{E}
      \qquad
      \varepsilon_y = \frac{\sigma_y - \nu\,\sigma_x}{E}
      \qquad
      \varepsilon_z = \frac{-\nu\,(\sigma_x + \sigma_y)}{E}
      \qquad
      \Delta V = (\varepsilon_x + \varepsilon_y + \varepsilon_z)\,V
      $$

      **4. Resultados.** **La pared.** De la primera, con $\varepsilon_x = 0$:

      $$
      \sigma_x = \nu\,\sigma_y = -21\ \text{MPa}
      $$

      de compresión: el cubo querría ensancharse en $x$ y la pared lo empuja.

      **Las otras dos deformaciones**, con $E = 70\,000$ MPa:

      $$
      \varepsilon_y = \frac{-70 + 0{,}3 \cdot 21}{70\,000} = -910 \cdot 10^{-6}
      \qquad
      \varepsilon_z = \frac{-0{,}3\,(-21 - 70)}{70\,000} = 390 \cdot 10^{-6}
      $$

      **El volumen.** $e = 0 - 910 + 390 = -520$, en $10^{-6}$. Con
      $V = 50^{3} = 125\,000$ mm³:

      $$
      \Delta V = e\,V = -65\ \text{mm}^{3}
      $$

      **5. Comprobación.** La primera ecuación, con las dos tensiones:
      $(-21 + 0{,}3\cdot70)/E = 0$, la pared. Y la deformación volumétrica
      sale también de las tensiones,
      $e = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E = 0{,}4\cdot(-91)/70\,000 = -520\cdot10^{-6}$.

      **Lo que dice el resultado.** El cubo pierde volumen, y menos de lo que
      diría $\varepsilon_y$ sola, $-910\cdot10^{-6}$, porque en z se
      ensancha. Las paredes no tiran: lo empujan, porque el cubo, aplastado
      en y, querría ensancharse también en x.

  # ── Ejercicio de clase 4.4, apartados a/ y b/ · de las lecturas a las
