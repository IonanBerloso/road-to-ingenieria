            <text x="0" y="0" font-size="10" text-anchor="start" fill="var(--d2-tinta)"></text>
          </svg>

      - tipo: calcular
        titulo: La tensión σx
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '150'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '141'
            mensaje: |
              Es $E\varepsilon_x$, como en una barra. En tensión plana,
              $\sigma_x = \tfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$:
              la ley de la barra se olvida del $\nu\varepsilon_y$ y del
              $1 - \nu^{2}$.
          - valor: '181.15'
            mensaje: |
              Es $(\lambda + 2G)\,\varepsilon_x + \lambda\,\varepsilon_y$, la de
              deformación plana, que supone $\varepsilon_z = 0$. En una cara
              libre lo nulo es $\sigma_z$.
        pista: |
          $\sigma_x = \dfrac{E}{1-\nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y)$,
          con $1 - \nu^{2} = 0{,}91$ y $E = 2 \cdot 10^{5}$ MPa.
        desarrollo: |
          $$
          \sigma_x = \frac{E}{1-\nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y)
          = \frac{2 \cdot 10^{5}}{0{,}91}\,(705 - 0{,}3 \cdot 75) \cdot 10^{-6}
          = \frac{2 \cdot 10^{5}}{0{,}91} \cdot 682{,}5 \cdot 10^{-6} = 150\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La tensión σy
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.5
          formato: un número, en MPa, con signo (positivo a tracción)
        distractores:
          - valor: '-15'
            mensaje: |
              Es $E\varepsilon_y$: el signo de la deformación pasado tal cual
              a la tensión. El acortamiento de $y$ lo causa sobre todo
              $\sigma_x$, por Poisson; con Hooke en tensión plana,
              $\sigma_y$ sale de tracción.
          - valor: '61.15'
            mensaje: |
              Es $(\lambda + 2G)\,\varepsilon_y + \lambda\,\varepsilon_x$, de
              deformación plana. Supone $\varepsilon_z = 0$, y en una cara
              libre lo nulo es $\sigma_z$.
        pista: |
          $\sigma_y = \dfrac{E}{1-\nu^{2}}\,(\varepsilon_y + \nu\varepsilon_x)$.
          Mira el signo del paréntesis.
        desarrollo: |
          $$
          \sigma_y = \frac{E}{1-\nu^{2}}\,(\varepsilon_y + \nu\varepsilon_x)
          = \frac{2 \cdot 10^{5}}{0{,}91}\,(-75 + 0{,}3 \cdot 705) \cdot 10^{-6}
          = \frac{2 \cdot 10^{5}}{0{,}91} \cdot 136{,}5 \cdot 10^{-6} = 30\ \text{MPa}
          $$

          Positiva: a tracción, aunque $y$ se acorte.

      - tipo: calcular
        titulo: La tangencial τxy
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '40'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '20'
            mensaje: |
              Has usado $\tfrac12\gamma_{xy}$, el término del tensor de
              deformaciones. La ley es $\tau_{xy} = G\gamma_{xy}$, con la
              $\gamma$ entera.
          - valor: '104'
            mensaje: |
              Es $E\gamma_{xy}$. La tangencial va con el módulo de
              cizalladura, $G = E/[2(1+\nu)]$, no con $E$.
        pista: |
          $G = \dfrac{E}{2(1+\nu)}$ y $\tau_{xy} = G\gamma_{xy}$.
        desarrollo: |
          $$
          G = \frac{E}{2(1+\nu)} = \frac{2 \cdot 10^{5}}{2{,}6} = 76\,923\ \text{MPa}
          \qquad
          \tau_{xy} = G\gamma_{xy} = \frac{2 \cdot 10^{5}}{2{,}6} \cdot 520 \cdot 10^{-6} = 40\ \text{MPa}
          $$

      - tipo: calcular
        titulo: La deformación εz
        pregunta: |
          ¿Cuánto vale $\varepsilon_z$, en millonésimas ($10^{-6}$)?
        respuesta:
          tipo: numero
          valor: '-270'
          tolerancia: 1
          formato: un número, en millonésimas (10⁻⁶), con signo
        distractores:
          - valor: '0'
            mensaje: |
              En tensión plana lo nulo es $\sigma_z$, no $\varepsilon_z$. Las
              dos tensiones del plano estrechan la pieza por Poisson:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '-189'
            mensaje: |
              Es $-\nu(\varepsilon_x + \varepsilon_y)$: la fórmula de
              Poisson con deformaciones en vez de tensiones. Con tensiones es
              $-\nu(\sigma_x + \sigma_y)/E$; con deformaciones, el factor es
              $\nu/(1 - \nu)$, no $\nu$.
        pista: |
          De Hooke con $\sigma_z = 0$ (ec. 4.24):
          $\varepsilon_z = -\dfrac{\nu}{E}\,(\sigma_x + \sigma_y)$.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{\nu}{E}\,(\sigma_x + \sigma_y)
          = -\frac{0{,}3}{2 \cdot 10^{5}}\,(150 + 30) = -270 \cdot 10^{-6}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La roseta está en una cara sin carga: $\sigma_z = 0$, tensión plana.'
          - texto: 'Hooke en tensión plana: $\sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y) = 150$ MPa y $\sigma_y = \frac{E}{1-\nu^{2}}(\varepsilon_y + \nu\varepsilon_x) = 30$ MPa.'
          - texto: 'La tangencial, con la $\gamma$ entera: $\tau_{xy} = G\gamma_{xy} = 40$ MPa.'
          - texto: 'Lo que la roseta no mide: $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E = -270 \cdot 10^{-6}$.'
          - texto: 'Como $\varepsilon_y$ es negativa, $\sigma_y$ es de compresión: $\sigma_y = E\varepsilon_y = -15$ MPa.'
            trampa: true
            mensaje: |
              El signo de una deformación no es el de su tensión cuando hay
              dos tensiones en el plano. Aquí $\sigma_x = 150$ MPa acorta $y$
              por Poisson más de lo que $\sigma_y$ la alarga: $\varepsilon_y$
              sale negativa con $\sigma_y = +30$ MPa.
    resolucion: |
      **1. El estado de tensión.** Una roseta en una cara sin carga: tensión
      plana. El dibujo lleva el elemento de esa cara con lo que se busca.

