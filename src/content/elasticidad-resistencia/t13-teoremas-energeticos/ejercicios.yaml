      <figcaption>

      La base isostática, el pórtico empotrado en A sin el muelle: con <i>q</i> y la fuerza <i>X</i> del muelle (izquierda), y con la fuerza unidad horizontal en C (derecha).

      </figcaption>
      </figure>

      **La condición.** Por Engesser-Castigliano (ec. 13.14), la derivada de la
      coenergía de las barras respecto de $X$ es el desplazamiento de C hacia
      arriba. El muelle se acorta $X/k$ y C baja eso, así que
      $\partial C/\partial X = -X/k$, la ec. 13.51 con $\delta_0 = -X/k$. Es
      lo mismo que sumar la coenergía del muelle, $X^{2}/2k$ (ec. 13.45), y
      pedir derivada nula.

      **Las integrales.** Con $x$ desde C en BC y el flector positivo si
      tracciona la fibra de dentro del pórtico, $M = Xx - qx^{2}/2$ en BC y
      $M = Xa - qa^{2}/2$ en AB, constante porque todas las cargas son
      verticales. Sus derivadas, los flectores de una fuerza unidad hacia
      arriba en C, son $x$ y $a$:

      $$
      X\Big(\frac{a^{3}}{3} + a^{2}h + \frac{EI}{k}\Big) = \frac{qa^{4}}{8} + \frac{qa^{3}h}{2}
      $$

      En m³ y kN·m³, $X(8/3 + 12 + 16/3) = 40 + 240$, es decir, $20X = 280$,
      y $X = 14$ kN. El muelle está comprimido y se acorta $X/k$, 9,33 mm.

      **El desplazamiento horizontal.** Con $X$ ya conocida, la fuerza unidad
      horizontal va en la isostática (diapositiva 23). En BC solo da axil; en
      AB, a una altura $y$, un flector $h - y$ que tracciona la fibra de fuera,
      la misma que el flector real del pilar, $qa^{2}/2 - Xa = 12$ kN·m:

      $$
      EI\,\delta_H = \int_0^{h} 12\,(h - y)\,dy = 54
      \qquad
      \delta_H = \frac{54}{8000} = 6{,}75 \cdot 10^{-3}\ \text{m}
      $$

      C se mueve 6,75 mm hacia la derecha: el momento de la carga sobre el
      pilar puede más que el del muelle, y la cabeza del pilar gira en sentido
      horario.

      **Por otro camino.** La compatibilidad del tema 11 da la misma ecuación
      con flechas. En el pórtico sin muelle, la carga baja C
      $(qa^{4}/8 + qa^{3}h/2)/EI$ y $X$ la sube $X(a^{3}/3 + a^{2}h)/EI$; lo
      que queda es lo que se acorta el muelle, $X/k$. Con $X = 14$ kN,
      $(280 - 14 \cdot 44/3)/8000 = 14/1500$, los dos 9,33 mm.
