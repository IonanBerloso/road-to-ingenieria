ejercicios:
  # ── Ejemplo introductorio nuestro · el pórtico en L empotrado con un muelle bajo la punta.
  - id: ejerm13-el-portico-con-un-muelle
    titulo: El pórtico en L con un muelle bajo la punta
    fuente: Ejemplo introductorio · Road to Ingeniería. La figura y los datos son nuestros. No es de examen ni del material de la asignatura.
    nivel: ejemplo
    enunciado: |
      El pórtico plano de la figura tiene un pilar vertical AB de altura
      $h = 3$ m, empotrado en el suelo en A, y un brazo horizontal BC de
      longitud $a = 2$ m. El brazo lleva una carga uniforme $q = 20$ kN/m
      hacia abajo, y bajo su punta C hay un muelle vertical de rigidez
      $k = 1500$ kN/m que llega al suelo. Las dos barras tienen la misma
      rigidez, $EI = 8000$ kN·m², y solo se cuenta la energía de flexión.

      Se toma como estructura isostática equivalente el pórtico empotrado en
      A sin el muelle, y como incógnita hiperestática la fuerza $X$ que el
      muelle hace sobre C, positiva hacia arriba.

