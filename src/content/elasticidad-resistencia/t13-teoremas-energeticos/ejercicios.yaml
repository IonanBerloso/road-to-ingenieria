    pide: >-
      La fuerza del muelle, en kN, y el desplazamiento horizontal de C, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al quitar el muelle, su fuerza $X$ queda como una carga más del
          pórtico empotrado en A. Con $C$ la coenergía de flexión de las dos
          barras, ¿qué ecuación da $X$?
        opciones:
          - texto: '$\partial C/\partial X = 0$'
            mensaje: |
              Esa es la de un apoyo fijo: C no se movería en vertical. Pero el
              muelle cede, y C baja lo que se acorta. La derivada de la
              coenergía de las barras es el desplazamiento de C en el sentido
              de $X$, y tiene que valer lo que se mueve el extremo del muelle.
          - texto: '$\partial C/\partial X = -X/k$'
            correcta: true
            mensaje: |
              Eso es. La derivada es el desplazamiento de C hacia arriba, el
              sentido de $X$ (ec. 13.14). El muelle, empujado con $X$, se acorta
              $X/k$, y C baja eso: hacia arriba se mueve $-X/k$, la
              $\delta_{0}$ de la ec. 13.51. Es lo mismo que sumar a $C$ la
              coenergía del muelle, $X^{2}/2k$ (ec. 13.45), y pedir derivada
              nula.
          - texto: '$\partial C/\partial X = X/k$'
            mensaje: |
              El tamaño es $X/k$, pero el signo no. La derivada da el
              desplazamiento de C en el sentido de $X$, hacia arriba, y un
              muelle que empuja hacia arriba está comprimido: C baja. El
              extremo del muelle se mueve en contra de su fuerza.
          - texto: '$X = k\,\delta_C$, con $\delta_C$ la flecha de C en el pórtico sin muelle'
            mensaje: |
              Con el muelle puesto, C baja menos que sin él, porque el muelle
              lo sujeta. La fuerza del muelle es $k$ por lo que baja C con el
              muelle, que es justo lo que no se sabe todavía. Con la flecha sin
              muelle sale una fuerza mucho mayor que la carga que hay en el
              brazo.

      - tipo: calcular
        titulo: La fuerza del muelle
        pregunta: |
          ¿Cuánto vale la fuerza $X$ del muelle, en kN, positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '14'
          tolerancia: 0.05
          formato: un número con su signo, en kN
        distractores:
          - valor: '19.0909'
            mensaje: |
              Es la fuerza con $\partial C/\partial X = 0$, como si C estuviera
              sobre un apoyo fijo: $X = 280/(44/3) = 19{,}09$ kN. El muelle cede
              y C baja $X/k$; con $\partial C/\partial X = -X/k$, el coeficiente
              de $X$ gana $EI/k = 16/3$ m³. Sale también si el término del
              muelle se suma sin pasarlo a las unidades de los otros: $1/k$ sin
              multiplicar por $EI$, o $k/EI$ en lugar de $EI/k$.
          - valor: '30'
            mensaje: |
              Sale con el término del muelle cambiado de signo,
              $\partial C/\partial X = X/k$, que deja el coeficiente de $X$ en
              $44/3 - 16/3$. Un muelle que empuja C hacia arriba está
              comprimido y C baja: el desplazamiento en el sentido de $X$ es
              $-X/k$, y el coeficiente es $44/3 + 16/3 = 20$.
          - valor: '5'
            mensaje: |
              Falta el pilar AB. Su flector es constante, porque las dos cargas
              son verticales, y pesa mucho: $a^{2}h = 12$ m³ frente a los $8/3$
              de BC en el coeficiente de $X$, y $qa^{3}h/2 = 240$ frente a 40
              en el otro término. Con solo BC sale $40/(8/3 + 16/3) = 5$ kN.
          - valor: '15'
            mensaje: |
              Es $3qa/8$, la reacción de la viga empotrada y apoyada del tema
              11: tomar BC como empotrada en B, sin el pilar, y el muelle como
              un apoyo fijo. Aquí B se mueve con el pilar y C baja con el
              muelle, y las dos cosas cuentan.
          - valor: '28'
            mensaje: |
              Es el doble de la buena: falta el $\tfrac12$ del flector de la
              carga uniforme, $qx^{2}/2$ en BC y $qa^{2}/2$ en AB. La
              resultante de $q$ es $qa$, aplicada en el centro del brazo, a
              $a/2$ de B y a $x/2$ de cada sección de BC.
          - valor: '-14'
            mensaje: |
              El valor es ese; el signo, no. Con $X$ positiva hacia arriba la
              ecuación da $20X = 280$, positiva: el muelle empuja C hacia
              arriba, comprimido, como hace un muelle que sostiene una carga
              que baja.
        pista: |
          En la isostática, con $x$ desde C en BC y el flector positivo si
          tracciona la fibra de dentro del pórtico (la inferior de BC y la
          derecha de AB): la carga da $-qx^{2}/2$ en BC y $-qa^{2}/2$, constante,
          en AB; la fuerza unidad hacia arriba en C da $x$ en BC y $a$ en AB.
        desarrollo: |
          Con $M = Xx - qx^{2}/2$ en BC y $M = Xa - qa^{2}/2$ en AB, y las
          derivadas $M' = x$ y $M' = a$:

          $$
          EI\,\frac{\partial C}{\partial X}
          = \int_0^{a}\Big(Xx - \frac{qx^{2}}{2}\Big)x\,dx + \int_0^{h}\Big(Xa - \frac{qa^{2}}{2}\Big)a\,dy
          = X\Big(\frac{a^{3}}{3} + a^{2}h\Big) - \frac{qa^{4}}{8} - \frac{qa^{3}h}{2}
          $$

          Con los datos, en m³ y kN·m³: $a^{3}/3 + a^{2}h = 8/3 + 12 = 44/3$ y
          $qa^{4}/8 + qa^{3}h/2 = 40 + 240 = 280$. La condición del muelle,
          $\partial C/\partial X = -X/k$, con $EI/k = 8000/1500 = 16/3$ m³:

          $$
          X\Big(\frac{44}{3} + \frac{16}{3}\Big) = 280
          \quad\Longrightarrow\quad
          X = \frac{280}{20} = 14\ \text{kN}
          $$

          Positiva: el muelle empuja hacia arriba y está comprimido.

      - tipo: calcular
        titulo: El desplazamiento horizontal de C
        pregunta: |
          ¿Cuánto se desplaza C en horizontal, en mm, positivo hacia la
          derecha?
        respuesta:
          tipo: numero
          valor: '6.75'
          tolerancia: 0.05
          formato: un número con su signo, en mm
        distractores:
          - valor: '22.5'
            mensaje: |
              Sale con el flector de la carga sola en el pilar, $qa^{2}/2 = 40$
              kN·m. Los esfuerzos reales son los del pórtico con $X$ puesta, y
              $X$ descarga el pilar: $40 - 14 \cdot 2 = 12$ kN·m.
          - valor: '1.0227'
            mensaje: |
              Sale con la $X$ del apoyo fijo, 19,09 kN, la de olvidar el muelle:
              el pilar queda con $40 - 38{,}18 = 1{,}82$ kN·m. Con el muelle,
              $X = 14$ kN y el flector del pilar es 12 kN·m.
          - valor: '13.5'
            mensaje: |
              Es el doble: falta el $\tfrac12$ de
              $\int_0^{h}(h - y)\,dy = h^{2}/2$. El flector de la fuerza unidad
              no vale $h$ en todo el pilar: crece desde cero en B hasta $h$ en
              A.
          - valor: '-6.75'
            mensaje: |
              El valor es ese; el sentido, no. Los dos flectores del pilar, el
              real y el de la fuerza unidad, traccionan la misma fibra, la de
              fuera, y su producto es positivo: C se mueve en el sentido de la
              fuerza unidad, hacia la derecha. El momento de la carga del brazo
              sobre el pilar puede más que el del muelle, y la cabeza del pilar
              gira en sentido horario.
          - valor: '9.3333'
            mensaje: |
              Es el desplazamiento vertical de C, $X/k = 14/1500$ m: lo que se
              acorta el muelle. Se pide el horizontal, que sale de una fuerza
              unidad horizontal en C.
          - valor: '0'
            mensaje: |
              Las cargas son verticales, pero flectan el pilar, y un pilar
              flectado lleva su cabeza hacia un lado. La fuerza unidad
              horizontal en C flecta AB, y su producto con el flector real de
              AB no se anula.
          - valor: '38.25'
            mensaje: |
              Sale con el flector del pilar $qa^{2}/2 + Xa = 68$ kN·m, con $X$
              sumada a la carga. $X$ va hacia arriba y la carga hacia abajo, y
              sus momentos sobre el pilar se restan: $40 - 28 = 12$ kN·m.
        pista: |
          Con $X$ conocida, la fuerza unidad va en el pórtico sin muelle. Una
          fuerza horizontal en C no flecta BC, que va en su dirección; en AB, a
          una altura $y$ sobre A, da un flector $h - y$. El flector real de AB
          es constante.
        desarrollo: |
          En AB, el flector real vale $qa^{2}/2 - Xa = 40 - 28 = 12$ kN·m en
          toda la altura, traccionando la fibra de fuera, y el de la fuerza
          unidad, $h - y$, también por fuera. BC no cuenta: la fuerza unidad
          solo la estira.

          $$
          EI\,\delta_H = \int_0^{h} 12\,(h - y)\,dy = 12\,\frac{h^{2}}{2} = 54
          $$

          $$
          \delta_H = \frac{54}{8000} = 6{,}75 \cdot 10^{-3}\ \text{m}
          $$

          Positivo: 6,75 mm en el sentido de la fuerza unidad, hacia la
          derecha.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Sin el muelle queda el pórtico empotrado en A, que es isostático, y la fuerza $X$ del muelle pasa a ser una carga hacia arriba en C.'
          - texto: 'C baja lo que se acorta el muelle, y $\partial C/\partial X = -X/k$ da $X\left(a^{3}/3 + a^{2}h + EI/k\right) = qa^{4}/8 + qa^{3}h/2$, es decir, $X = 14$ kN.'
          - texto: 'Para el desplazamiento horizontal de C, la fuerza unidad va en el pórtico sin muelle: no flecta BC, y en AB su flector crece desde cero en B hasta $h$ en A.'
          - texto: 'Con el flector real de AB, constante e igual a $qa^{2}/2 - Xa = 12$ kN·m, $EI\,\delta_H = 12\,h^{2}/2$: C se mueve 6,75 mm hacia la derecha.'
          - texto: 'La fuerza unidad hay que ponerla con el muelle puesto, porque la estructura real lo tiene: en el pórtico sin muelle el desplazamiento sale mal.'
            trampa: true
            mensaje: |
              La fuerza unidad puede ir en la isostática (diapositiva 23): sus
              esfuerzos solo tienen que estar en equilibrio con ella. Los que
              tienen que ser los reales son los otros, con $X$ ya puesta. Con el
              muelle puesto también sale lo mismo, sumando el término del
              muelle, pero hay que resolver otro hiperestático para tener los
              esfuerzos de la fuerza unidad.
    resolucion: |
      **Cuántas incógnitas sobran.** El empotramiento de A da tres reacciones
      y el muelle una más: cuatro incógnitas para tres ecuaciones de
      equilibrio. El pórtico es hiperestático de grado 1.

      **La isostática.** Se quita el muelle, y su fuerza $X$, positiva hacia
      arriba, queda como una carga en la punta del pórtico empotrado en A. A
      la derecha, la misma isostática con la fuerza unidad del segundo paso.

