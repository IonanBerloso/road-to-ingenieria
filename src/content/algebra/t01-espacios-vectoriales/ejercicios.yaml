ejercicios:
  # ── Los tres primeros son NUESTROS (§08). Existen porque el primer
  #    ejercicio del boletín ya pide recorrer los ocho axiomas de un espacio
  #    vectorial con operaciones inventadas, y el primero del examen pide una
  #    demostración: no había por dónde entrar.
  - id: ejalg1-lo-primero-es-mirar-el-cero
    titulo: Lo primero que se mira, y por qué se acaba ahí
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      En $\mathbb{R}^{3}$ se dan estos tres conjuntos:

      $$
      A=\left\{\left(x,y,z\right)\;/\;x-2y=0\right\},
      \quad
      B=\left\{\left(x,y,z\right)\;/\;x-2y=3\right\},
      \quad
      C=\left\{\left(x,y,z\right)\;/\;x^{2}=y\right\}
      $$

      Decidir cuáles son subespacios vectoriales, y dar la dimensión de los que
      lo sean.
    pide: Cuáles de los tres son subespacios, y la dimensión de los que lo sean.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de comprobar nada, ¿qué se mira primero en los tres?
        opciones:
          - texto: >-
              Si el vector $\left(0,0,0\right)$ está dentro: todo subespacio lo
              contiene, así que si falta, ya está descartado
            correcta: true
            mensaje: |
              Eso es. Sale de la propia definición con el escalar $\alpha=0$:
              si $\overline{x}$ está en el subespacio,
              $0\cdot\overline{x}=\overline{0}$ también. Es la comprobación más
              barata que existe y descarta a $B$ de un vistazo, porque
              $0-2\cdot0=0\neq3$.
          - texto: >-
              Si el conjunto está definido por una sola ecuación
            mensaje: |
              El número de ecuaciones decide la **dimensión**, no si es
              subespacio. $A$ y $B$ tienen una ecuación cada uno y solo uno de
              los dos lo es.
          - texto: >-
              Si los tres conjuntos son infinitos
            mensaje: |
              Los tres lo son, y no aporta nada: casi todos los subespacios
              interesantes tienen infinitos elementos.
          - texto: >-
              Si las ecuaciones tienen todas las variables
            mensaje: |
              En $A$ no aparece la $z$ y sigue siendo subespacio: significa
              simplemente que la $z$ es libre. Que falte una variable no
              descalifica nada.

      - tipo: calcular
        titulo: La dimensión del que sí lo es
        pregunta: |
          ¿Cuál es la dimensión de $A$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es la dimensión de $\mathbb{R}^{3}$ entero. La ecuación
              $x-2y=0$ es una condición de verdad —deja fuera a
              $\left(1,0,0\right)$, por ejemplo—, así que $A$ es un subespacio
              **propio** y pierde una dimensión.
          - valor: '1'
            mensaje: |
              $1$ dejaría a $A$ como una recta, y no lo es: la $z$ es
              completamente libre y la $y$ también, porque $x$ se despeja de
              ellas. Son dos parámetros.
          - valor: '0'
            mensaje: |
              $0$ sería solo el vector nulo. Pero $\left(2,1,0\right)$ cumple
              $x-2y=0$ y no es nulo.
        pista: |
          Despeja $x=2y$ y escribe el elemento genérico de $A$ con los
          parámetros que quedan libres. ¿Cuántos son?
        desarrollo: |
          De $x=2y$, un elemento cualquiera de $A$ se escribe

          $$
          \left(2y,y,z\right)=y\left(2,1,0\right)+z\left(0,0,1\right)
          $$

          con $y$ y $z$ libres. Los dos vectores que aparecen son
          independientes —cada uno tiene un $1$ donde el otro tiene un $0$—, así
          que forman base:

          $$
          A=L\left(\left\{\left(2,1,0\right),\left(0,0,1\right)\right\}\right),
          \qquad
          \dim A=2
          $$

          Y esa forma de escribirlo **es** la demostración de que $A$ es
          subespacio: todo generado lo es.

      - tipo: justificar
        pregunta: Ordena el estudio de los tres conjuntos. Una pieza es falsa.
        piezas:
          - texto: >-
              $B$ queda descartado sin hacer nada: $\left(0,0,0\right)$ no
              cumple $x-2y=3$, y todo subespacio contiene al nulo.
          - texto: >-
              $C$ sí contiene al nulo —$0^{2}=0$—, así que hay que mirar las
              operaciones.
          - texto: >-
              Y falla: $\left(1,1,0\right)$ está en $C$, pero
              $2\cdot\left(1,1,0\right)=\left(2,2,0\right)$ no, porque
              $2^{2}=4\neq2$.
          - texto: >-
              $A$ sí lo es, y se ve escribiéndolo como
              $L\left(\left\{\left(2,1,0\right),
              \left(0,0,1\right)\right\}\right)$, de dimensión $2$.
          - texto: >-
              $C$ falla porque no contiene al vector nulo, igual que $B$.
            trampa: true
            mensaje: |
              $C$ **sí** contiene al nulo: $0^{2}=0$ se cumple. Por eso hace
              falta seguir mirando, y lo que falla en $C$ es otra cosa —el
              cuadrado rompe el producto por escalar—. Confundir los dos
              motivos es el error de fondo: el truco del cero es rapidísimo
              **cuando funciona**, pero que el cero esté dentro no demuestra
              nada por sí solo.
    resolucion: |
      **$B$ se cae en diez segundos.** Todo subespacio contiene al vector nulo,
      porque tomando $\alpha=0$ en la condición del producto por escalar sale
      $0\cdot\overline{x}=\overline{0}$. Y $\left(0,0,0\right)$ no cumple
      $x-2y=3$. Fin.

      La lectura general vale para todo el tema: **un término independiente
      distinto de cero descalifica siempre**. Lo que describe $B$ no es un
      subespacio sino un plano trasladado, y esa traslación es justo lo que deja
      fuera al origen.

      **$C$ no se cae por ahí, y ahí está la gracia del ejemplo.** El nulo sí
      cumple $x^{2}=y$, así que el atajo no sirve y hay que ir a las
      operaciones. Falla el producto por escalar:

      $$
      \left(1,1,0\right)\in C,
      \qquad
      2\cdot\left(1,1,0\right)=\left(2,2,0\right)\notin C
      \;\text{ porque }\;2^{2}=4\neq2
      $$

      Un solo contraejemplo con números concretos basta. **No hay que recorrer
      ninguna lista de propiedades** cuando la respuesta es «no».

      **$A$ sí lo es**, y la forma más corta de demostrarlo no es comprobar las
      dos condiciones, sino escribirlo como un generado:

      $$
      A=\left\{\left(2y,y,z\right)\right\}
      =L\left(\left\{\left(2,1,0\right),\left(0,0,1\right)\right\}\right)
      $$

      Todo $L\left(G\right)$ es subespacio, así que con esa línea queda
      demostrado, y de paso salen la base y la dimensión, que es lo que el
      enunciado pide justo después.

      $$
      \boxed{\;A\text{ sí, }\dim A=2;\quad B\text{ no};\quad C\text{ no}\;}
      $$

  - id: ejalg1-del-elemento-generico-a-la-base
    titulo: Del elemento genérico a la base, en tres pasos
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      Sea el subconjunto de $\mathbb{R}^{4}$

      $$
      S=\left\{\left(a,\;2a,\;b,\;a-b\right)\;/\;a,b\in\mathbb{R}\right\}
      $$

      Demostrar que es subespacio vectorial y hallar una base y su dimensión.
    pide: La demostración, una base y la dimensión.

    pasos:
      - tipo: reconocer
        pregunta: |
          El conjunto viene dado por parámetros, no por ecuaciones. ¿Cuál es la
          forma más corta de demostrar que es subespacio?
        opciones:
          - texto: >-
              Escribirlo como $L\left(G\right)$ separando los parámetros: todo
              generado es subespacio, así que con eso queda demostrado
            correcta: true
            mensaje: |
              Exacto, y de paso salen la base y la dimensión sin trabajo extra.
              Es el atajo que más rinde del tema, y funciona siempre que el
              conjunto venga por parámetros.
          - texto: >-
              Comprobar los ocho axiomas de espacio vectorial
            mensaje: |
              Los ocho los hereda de $\mathbb{R}^{4}$: en un **sub**conjunto no
              hay que volver a comprobarlos. Lo único que puede fallar es
              salirse al operar.
          - texto: >-
              Comprobar que la suma y el producto por escalar se quedan dentro,
              con $a$ y $b$ genéricos
            mensaje: |
              Funciona y es correcto, pero cuesta el doble: hay que escribir dos
              elementos genéricos, sumarlos y volver a identificar los
              parámetros. Escribirlo como generado hace lo mismo en una línea.
          - texto: >-
              Ver si $\left(0,0,0,0\right)$ está dentro
            mensaje: |
              Eso descarta cuando falla, pero no demuestra cuando se cumple.
              Aquí sí está —con $a=b=0$—, y eso solo significa que hay que
              seguir.

      - tipo: calcular
        titulo: La dimensión
        pregunta: |
          ¿Cuál es la dimensión de $S$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es la dimensión de $\mathbb{R}^{4}$ entero. En $S$ solo hay
              dos números libres, $a$ y $b$: las otras dos coordenadas quedan
              determinadas por ellos.
          - valor: '3'
            mensaje: |
              $3$ saldría de contar como libre alguna de las coordenadas
              derivadas. La segunda vale $2a$ y la cuarta $a-b$: las dos están
              atadas a $a$ y $b$.
          - valor: '1'
            mensaje: |
              $1$ dejaría a $S$ como una recta. Pero $\left(1,2,0,1\right)$ y
              $\left(0,0,1,-1\right)$ están los dos en $S$ y no son
              proporcionales.
        pista: |
          Cuenta cuántos parámetros libres hay. Cada uno aporta un vector a la
          base, si los vectores que salen son independientes.
        desarrollo: |
          Separando por parámetros:

          $$
          \left(a,2a,b,a-b\right)
          =a\left(1,2,0,1\right)+b\left(0,0,1,-1\right)
          $$

          $$
          S=L\left(\left\{\left(1,2,0,1\right),
          \left(0,0,1,-1\right)\right\}\right)
          $$

          Los dos son independientes: el primero tiene un $1$ en la primera
          coordenada donde el segundo tiene $0$, y el segundo tiene un $1$ en la
          tercera donde el primero tiene $0$. Luego

          $$
          \dim S=2
          $$

      - tipo: calcular
        titulo: El vector de la base que sale con a = 1
        pregunta: |
          Poniendo $a=1$ y $b=0$, ¿qué vector se obtiene?
        respuesta:
          tipo: vector
          valor: '(1, 2, 0, 1)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(1, 2, 0, -1)'
            mensaje: |
              La cuarta coordenada es $a-b$, y con $a=1$, $b=0$ vale
              $1-0=1$, positiva. El menos afecta a $b$, no a $a$.
          - valor: '(1, 1, 0, 1)'
            mensaje: |
              La segunda coordenada es $2a$, no $a$: con $a=1$ vale $2$.
          - valor: '(0, 0, 1, -1)'
            mensaje: |
              Ese es el que sale con $a=0$ y $b=1$, el otro vector de la base.
        pista: |
          Sustituye directamente en $\left(a,2a,b,a-b\right)$.
        desarrollo: |
          $$
          \left(1,\;2\cdot1,\;0,\;1-0\right)=\left(1,2,0,1\right)
          $$

          y con $a=0$, $b=1$ sale $\left(0,0,1,-1\right)$. Esos dos son la base,
          y cada uno se obtiene **poniendo un parámetro a uno y el resto a
          cero**: es el mismo procedimiento que se usará con matrices y con
          polinomios.

      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Se escribe el elemento genérico y se separa por parámetros:
              $\left(a,2a,b,a-b\right)
              =a\left(1,2,0,1\right)+b\left(0,0,1,-1\right)$.
          - texto: >-
              Eso dice que $S$ es exactamente el conjunto de las combinaciones
              lineales de esos dos vectores, es decir
              $S=L\left(\left\{\left(1,2,0,1\right),
              \left(0,0,1,-1\right)\right\}\right)$.
          - texto: >-
              Y como toda clausura lineal es subespacio vectorial, $S$ lo es.
          - texto: >-
              Los dos generadores son independientes, así que además forman
              base y $\dim S=2$.
          - texto: >-
              Los dos generadores son independientes porque son perpendiculares
              entre sí.
            trampa: true
            mensaje: |
              La independencia no tiene nada que ver con la perpendicularidad,
              y aquí ni siquiera hay definido un producto escalar. Que
              $\left(1,2,0,1\right)$ y $\left(0,0,1,-1\right)$ sean
              independientes se comprueba con la definición: una combinación
              nula obliga a $a=0$ mirando la primera coordenada y a $b=0$
              mirando la tercera. Vectores perpendiculares sí son
              independientes, pero el recíproco es falso y aquí el argumento no
              está disponible.
    resolucion: |
      **El procedimiento entero, y sirve para todo el tema.** Cuando un conjunto
      viene dado por parámetros, se hace siempre lo mismo:

      1. Escribir el elemento genérico.
      2. Separarlo como «parámetro × vector» sumando.
      3. Los vectores que salen generan el conjunto. Si son independientes, son
         la base.

      $$
      \left(a,2a,b,a-b\right)
      =a\left(1,2,0,1\right)+b\left(0,0,1,-1\right)
      $$

      $$
      \boxed{\;S=L\left(\left\{\left(1,2,0,1\right),
      \left(0,0,1,-1\right)\right\}\right),\quad\dim S=2\;}
      $$

      **La demostración va incluida.** No hay que comprobar la suma ni el
      producto por escalar: se ha escrito $S$ como una clausura lineal, y todo
      $L\left(G\right)$ es subespacio. Esa es la frase que hay que escribir en
      el examen, y vale un apartado entero.

      **Por qué son independientes.** Si
      $a\left(1,2,0,1\right)+b\left(0,0,1,-1\right)=\overline{0}$, la primera
      coordenada da $a=0$ y la tercera da $b=0$. Cuando cada generador tiene un
      $1$ donde los demás tienen $0$, la independencia se lee sin escribir nada.

      **El camino inverso, por si el examen lo pide.** El mismo subespacio se
      puede dar por ecuaciones: eliminando $a$ y $b$ de las cuatro coordenadas
      salen $y=2x$ y $t=x-z$. Dos ecuaciones independientes en $\mathbb{R}^{4}$,
      que dejan $4-2=2$ dimensiones — la misma cuenta por el otro lado.

  - id: ejalg1-las-coordenadas-y-el-sentido-del-cambio
    titulo: Coordenadas, y en qué sentido va cada cuenta
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      En $\mathbb{R}^{2}$ se considera
      $B=\left\{\left(1,1\right),\left(1,-1\right)\right\}$, que es base.

      a) Hallar las coordenadas del vector $\left(4,2\right)$ en la base $B$.

      b) Si un vector $\overline{w}$ tiene coordenadas $\left(2,-1\right)$ en la
      base $B$, ¿cuál es $\overline{w}$?
    pide: Las coordenadas de un vector, y el vector de unas coordenadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos apartados van en sentidos contrarios. ¿Cuál de los dos se
          resuelve **sin** plantear un sistema?
        opciones:
          - texto: >-
              El b): teniendo las coordenadas en $B$, basta sustituirlas en la
              combinación lineal y sumar
            correcta: true
            mensaje: |
              Exacto. Ir **de la base nueva a la vieja** es multiplicar, porque
              los vectores de $B$ ya están escritos en la vieja. Ir al revés
              exige resolver, y es el sentido que se falla.
          - texto: >-
              El a): las coordenadas se leen directamente del vector
            mensaje: |
              Eso solo pasa con la base canónica. En cualquier otra base hay que
              resolver: las coordenadas de $\left(4,2\right)$ en $B$ **no** son
              $4$ y $2$.
          - texto: >-
              Los dos, porque la base tiene solo dos vectores
            mensaje: |
              El tamaño no cambia el sentido. Con dos vectores el sistema es
              pequeño, pero sigue habiendo que resolverlo en el apartado a).
          - texto: >-
              Ninguno, porque la base no es la canónica
            mensaje: |
              Justamente por eso uno de los dos sí es directo: la base está
              escrita **en coordenadas canónicas**, y eso hace inmediato el
              paso de $B$ a la canónica.

      - tipo: calcular
        titulo: Las coordenadas de (4,2)
        pregunta: |
          ¿Cuáles son las coordenadas de $\left(4,2\right)$ en la base
          $B=\left\{\left(1,1\right),\left(1,-1\right)\right\}$?
        respuesta:
          tipo: vector
          valor: '(3, 1)'
          tolerancia: 0.001
          formato: dos coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(4, 2)'
            mensaje: |
              Esas son las coordenadas en la base **canónica**, que es como
              viene escrito el vector. En $B$ hay que resolver
              $a\left(1,1\right)+b\left(1,-1\right)=\left(4,2\right)$.
          - valor: '(1, 3)'
            mensaje: |
              Las dos cambiadas de sitio. Comprueba:
              $1\cdot\left(1,1\right)+3\cdot\left(1,-1\right)
              =\left(4,-2\right)$, con la segunda coordenada negativa.
          - valor: '(3, -1)'
            mensaje: |
              El signo del segundo coeficiente. De $a+b=4$ y $a-b=2$ sale
              $b=1$, positivo: el signo menos ya lo lleva dentro el vector
              $\left(1,-1\right)$.
        pista: |
          Plantea $a\left(1,1\right)+b\left(1,-1\right)=\left(4,2\right)$ y mira
          las dos coordenadas por separado.
        desarrollo: |
          $$
          a\left(1,1\right)+b\left(1,-1\right)=\left(a+b,\;a-b\right)
          =\left(4,2\right)
          $$

          De donde $a+b=4$ y $a-b=2$. Sumando las dos, $2a=6$ y $a=3$;
          restando, $b=1$.

          $$
          \left(4,2\right)\big|_{B}=\left(3,1\right)
          $$

          Y la comprobación, que aquí cuesta cinco segundos:
          $3\left(1,1\right)+1\left(1,-1\right)=\left(4,2\right)$.

      - tipo: calcular
        titulo: El vector que tiene coordenadas (2,−1)
        pregunta: |
          Si $\overline{w}$ tiene coordenadas $\left(2,-1\right)$ en $B$,
          ¿cuál es $\overline{w}$ en coordenadas canónicas?
        respuesta:
          tipo: vector
          valor: '(1, 3)'
          tolerancia: 0.001
          formato: dos coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(2, -1)'
            mensaje: |
              Esas son las coordenadas **en $B$**, el dato de partida. El vector
              es la combinación
              $2\left(1,1\right)-1\left(1,-1\right)$, que hay que hacer.
          - valor: '(3, 1)'
            mensaje: |
              Ese es el resultado del apartado anterior, que va en el sentido
              contrario. Aquí no hay sistema: basta sustituir y sumar.
          - valor: '(1, 1)'
            mensaje: |
              La segunda coordenada. $2\cdot1-1\cdot\left(-1\right)=2+1=3$: al
              restar $\left(1,-1\right)$, el $-1$ se convierte en $+1$.
        pista: |
          Este sentido es el cómodo:
          $\overline{w}=2\left(1,1\right)-1\left(1,-1\right)$.
        desarrollo: |
          $$
          \overline{w}=2\left(1,1\right)-1\left(1,-1\right)
          =\left(2,2\right)-\left(1,-1\right)=\left(1,3\right)
          $$

          Sin sistema, sin matriz inversa: sustituir y sumar. Ese es el sentido
          barato del cambio de base, y conviene reconocerlo en el enunciado
          antes de ponerse a resolver nada.

      - tipo: justificar
        pregunta: Ordena el razonamiento de los dos apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              Las coordenadas de un vector en una base son los coeficientes de
              la única combinación lineal de la base que da ese vector.
          - texto: >-
              En a) se conoce el vector y se buscan los coeficientes: hay que
              resolver
              $a\left(1,1\right)+b\left(1,-1\right)=\left(4,2\right)$, y sale
              $\left(3,1\right)$.
          - texto: >-
              En b) se conocen los coeficientes y se busca el vector: basta
              sustituir, y sale $\left(1,3\right)$.
          - texto: >-
              Los dos apartados son la misma operación en sentidos contrarios, y
              solo uno de ellos exige resolver un sistema.
          - texto: >-
              Como los dos apartados son inversos, el resultado de b) tiene que
              ser el mismo que el de a) con las coordenadas cambiadas de orden.
            trampa: true
            mensaje: |
              Ser operaciones inversas no significa que los resultados se
              parezcan: son **vectores distintos** los que entran en cada
              apartado. En a) entra $\left(4,2\right)$ y en b) entra
              $\left(2,-1\right)$, que no tienen nada que ver. La inversión
              relaciona los **procedimientos**, no los números; buscar un
              parecido entre los resultados lleva a dar por buena una respuesta
              equivocada.
    resolucion: |
      **Qué son las coordenadas.** Fijada una base $B$, todo vector se escribe
      de **una sola manera** como combinación lineal de ella, y esos
      coeficientes son sus coordenadas en $B$. La unicidad es lo que hace que la
      palabra «las» tenga sentido, y viene de que $B$ es libre.

      **a) De la canónica a $B$: hay que resolver.**

      $$
      a\left(1,1\right)+b\left(1,-1\right)=\left(4,2\right)
      \;\Longrightarrow\;
      \begin{cases}a+b=4\\a-b=2\end{cases}
      \;\Longrightarrow\;
      \boxed{\;\left(4,2\right)\big|_{B}=\left(3,1\right)\;}
      $$

      **b) De $B$ a la canónica: basta sustituir.**

      $$
      \overline{w}=2\left(1,1\right)-1\left(1,-1\right)
      =\boxed{\;\left(1,3\right)\;}
      $$

      **La regla que hay que llevar aprendida**, porque es la que decide el
      apartado de cambio de base en el examen:

      | de dónde a dónde | qué se hace |
      |---|---|
      | de la base nueva a la vieja | **multiplicar** |
      | de la vieja a la nueva | **resolver** un sistema |

      El sentido barato es el que va hacia la base en la que están escritos los
      vectores. Y si dudas, la comprobación es siempre la misma: sustituye tus
      coeficientes en la combinación y mira si sale el vector de partida.

  # ── Y estos tres son del boletín oficial, reproducidos tal cual (§08).
  - id: ejalg1-bol6-cuales-son-subespacios-de-r3
    titulo: Ocho conjuntos, y cuáles aguantan las dos condiciones
    fuente: >-
      Ejercicio 6 · Boletín de problemas, Espacios vectoriales · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de Matemática
      Aplicada.
    nivel: practica
    enunciado: |
      ¿Cuáles de los siguientes conjuntos son subespacios vectoriales de
      $\left(\mathbb{R}^{3},+,\cdot\right)$?

      a) $S=\left\{\left(x,y,0\right)\;/\;x,y\in\mathbb{R}\right\}$

      b) $S=\left\{\left(x,0,0\right)\;/\;x\in\mathbb{R}\right\}$

      c) $S=\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;x=y+z\right\}$

      d) $S=\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;x+y+z=0\right\}$

      e) $S=\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;xyz\in\mathbb{Q}
      \right\}$

      f) $S=\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;
      x^{2}+y^{2}+z^{2}\geq1\right\}$

      g) $S=\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;2x+y+z=0\right\}$

      h) $S=\left\{\left(x,y,2\right)\;/\;x,y\in\mathbb{R}\right\}$
    pide: Cuáles de los ocho son subespacios vectoriales.

    pasos:
      - tipo: reconocer
        pregunta: |
          Dos de los ocho se descartan sin escribir nada. ¿Cuáles, y por qué?
        opciones:
          - texto: >-
              El f) y el h): en los dos, el vector $\left(0,0,0\right)$ no
              cumple la condición
            correcta: true
            mensaje: |
              Eso es. En f), $0+0+0=0$ no es $\geq1$; en h), la tercera
              coordenada vale $2$ y nunca $0$. Los dos caen con la comprobación
              más barata que hay.
          - texto: >-
              El e) y el f), porque los dos llevan condiciones que no son
              ecuaciones lineales
            mensaje: |
              El f) sí se cae, pero el e) **no** por esa vía: el
              $\left(0,0,0\right)$ tiene $xyz=0\in\mathbb{Q}$, así que el nulo
              está dentro y hay que buscar el fallo en otro sitio.
          - texto: >-
              El a) y el h), porque los dos fijan una coordenada
            mensaje: |
              Fijarla **a cero** es una ecuación homogénea perfectamente
              válida: el a) sí es subespacio. Lo que descalifica al h) es que la
              fije a $2$.
          - texto: >-
              El c) y el d), porque las ecuaciones son equivalentes
            mensaje: |
              No lo son —$x=y+z$ es $x-y-z=0$, distinta de $x+y+z=0$— y las dos
              son homogéneas, así que los dos conjuntos son subespacios.

      - tipo: calcular
        titulo: Cuántos lo son
        pregunta: |
          De los ocho conjuntos, ¿cuántos son subespacios vectoriales de
          $\mathbb{R}^{3}$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              Sobra uno, y casi seguro es el e). Su condición
              $xyz\in\mathbb{Q}$ **sí** deja pasar al vector nulo, pero no
              aguanta el producto por un escalar irracional.
          - valor: '4'
            mensaje: |
              Falta uno. Repasa el a) y el b): fijar coordenadas **a cero** es
              una condición homogénea, y los dos son subespacios —de dimensión
              $2$ y $1$—.
          - valor: '3'
            mensaje: |
              Los tres que fallan son el e), el f) y el h). Los otros cinco
              están definidos por ecuaciones lineales igualadas a cero, y todos
              lo son.
          - valor: '8'
            mensaje: |
              Al menos el h) no lo es: su tercera coordenada vale siempre $2$,
              así que no contiene al vector nulo.
        pista: |
          Empieza descartando los que no contienen al $\left(0,0,0\right)$. De
          los que quedan, mira si aguantan el producto por un escalar
          cualquiera.
        desarrollo: |
          | | condición | ¿subespacio? | por qué |
          |---|---|---|---|
          | a) | $z=0$ | **sí** | ecuación homogénea; $\dim=2$ |
          | b) | $y=z=0$ | **sí** | dos ecuaciones homogéneas; $\dim=1$ |
          | c) | $x-y-z=0$ | **sí** | homogénea; $\dim=2$ |
          | d) | $x+y+z=0$ | **sí** | homogénea; $\dim=2$ |
          | e) | $xyz\in\mathbb{Q}$ | **no** | ver abajo |
          | f) | $x^{2}+y^{2}+z^{2}\geq1$ | **no** | el nulo no cumple |
          | g) | $2x+y+z=0$ | **sí** | homogénea; $\dim=2$ |
          | h) | $z=2$ | **no** | el nulo no cumple |

          Son **cinco**.

          El e) es el interesante, porque es el único que exige pensar. El nulo
          está dentro, y la suma tampoco lo rompe de forma evidente. Lo que
          falla es el producto por escalar:

          $$
          \left(1,1,1\right)\in S\;\text{ porque }\;1\in\mathbb{Q},
          \qquad
          \sqrt{2}\cdot\left(1,1,1\right)=\left(\sqrt{2},\sqrt{2},\sqrt{2}\right)
          $$

          y su producto es $2\sqrt{2}$, que es irracional. El escalar tiene que
          poder ser **cualquier** número real, y ahí se cae.

      - tipo: justificar
        pregunta: >-
          Ordena el criterio que resuelve los ocho de un vistazo. Una pieza es
          falsa.
        piezas:
          - texto: >-
              Todo subespacio contiene al vector nulo, así que lo primero es
              sustituir $\left(0,0,0\right)$ en la condición.
          - texto: >-
              Eso descarta el f) y el h) sin más trabajo.
          - texto: >-
              De los que quedan, los definidos por ecuaciones **lineales
              igualadas a cero** son subespacios: a), b), c), d) y g).
          - texto: >-
              Queda el e), que pasa el filtro del cero pero falla el producto
              por un escalar irracional.
          - texto: >-
              Y la condición del e) tampoco aguanta la suma, porque la suma de
              dos racionales puede ser irracional.
            trampa: true
            mensaje: |
              La suma de dos racionales es siempre racional: eso es cierto en
              $\mathbb{Q}$ y no tiene vuelta de hoja. Pero además el argumento
              está mal planteado, porque la condición del e) no es sobre la suma
              de las coordenadas sino sobre su **producto**, y ese producto no
              se comporta bien al sumar vectores. Lo que de verdad rompe el e)
              es el escalar irracional, y ese contraejemplo es el que hay que
              escribir.
    resolucion: |
      **El criterio, en dos pasos, resuelve los ocho.**

      **Paso 1: ¿está el cero?** Sustituir $\left(0,0,0\right)$ en cada
      condición. Se caen el **f)** —$0\geq1$ es falso— y el **h)** —la tercera
      coordenada vale $2$—. Dos descartados sin escribir una cuenta.

      **Paso 2: de los que quedan, ¿la condición es lineal y homogénea?** Si
      es una o varias ecuaciones lineales igualadas a cero, el conjunto es
      subespacio, y su dimensión es $3$ menos el número de ecuaciones
      independientes:

      $$
      \text{a) }z=0,\quad
      \text{b) }y=z=0,\quad
      \text{c) }x-y-z=0,\quad
      \text{d) }x+y+z=0,\quad
      \text{g) }2x+y+z=0
      $$

      Los cinco lo son. Y las dimensiones salen de contar:
      $\dim=2$ en a), c), d) y g); $\dim=1$ en b).

      **El e) es el que enseña algo.** Su condición pasa el filtro del cero
      —$0\cdot0\cdot0=0$ es racional— y no es una ecuación lineal, así que hay
      que buscar el contraejemplo a mano. Está en el escalar:

      $$
      \left(1,1,1\right)\in S,
      \qquad
      \sqrt{2}\cdot\left(1,1,1\right)
      =\left(\sqrt{2},\sqrt{2},\sqrt{2}\right)\notin S
      \;\text{ porque }\;2\sqrt{2}\notin\mathbb{Q}
      $$

      $$
      \boxed{\;\text{Son subespacios: a), b), c), d) y g). Cinco de ocho.}\;
      $$

      **La lección general**, que vale para el examen entero: la condición que
      define un subespacio tiene que ser **lineal y homogénea**. Un término
      independiente, un cuadrado, una desigualdad o una restricción sobre a qué
      conjunto de números pertenece algo lo estropean siempre.

  - id: ejalg1-bol12-suma-e-interseccion-en-r3
    titulo: Un plano y una recta, y la suma que llena el espacio
    fuente: >-
      Ejercicio 12 · Boletín de problemas, Espacios vectoriales · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de Matemática
      Aplicada.
    nivel: practica
    enunciado: |
      Sean los siguientes subespacios vectoriales de $\mathbb{R}^{3}$:

      $$
      U=\left\{\left(x,y,z\right)\;/\;x+y+z=0,\;x,y,z\in\mathbb{R}\right\},
      \qquad
      V=\left\{\left(t,2t,3t\right)\;/\;t\in\mathbb{R}\right\}
      $$

      Hallar las bases y dimensiones de $U$, $V$, $U+V$ y $U\cap V$.
    pide: Las cuatro bases y las cuatro dimensiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          $U$ viene por una ecuación y $V$ por un parámetro. ¿Cómo conviene
          calcular la intersección?
        opciones:
          - texto: >-
              Metiendo el vector genérico de $V$ en la ecuación de $U$: sale una
              ecuación con una sola incógnita
            correcta: true
            mensaje: |
              Exacto, y es el caso más cómodo que hay. Un subespacio por
              ecuaciones funciona como un **filtro**: se le pasa el genérico del
              otro y se mira qué sobrevive. Aquí sale $t+2t+3t=0$, o sea $6t=0$.
          - texto: >-
              Igualando dos combinaciones genéricas, una de cada subespacio
            mensaje: |
              Funciona siempre, pero aquí es trabajo de más: hace falta primero
              sacar una base de $U$ y luego montar un sistema de tres ecuaciones
              con tres incógnitas. Con la ecuación de $U$ a mano, el cálculo es
              de una línea.
          - texto: >-
              Con la fórmula de Grassmann, despejando
              $\dim\left(U\cap V\right)$
            mensaje: |
              Grassmann da la dimensión **si ya conoces la de la suma**, y aquí
              la suma es justo lo que falta. Además el enunciado pide la
              **base** de la intersección, y esa la fórmula no la da.
          - texto: >-
              Pasando los dos a ecuaciones y resolviendo el sistema conjunto
            mensaje: |
              Es correcto, pero exige convertir $V$ a ecuaciones primero. El
              atajo es al revés: aprovechar que $U$ **ya** viene por ecuaciones.

      - tipo: calcular
        titulo: La dimensión de la intersección
        pregunta: |
          ¿Cuánto vale $\dim\left(U\cap V\right)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ significaría que la recta $V$ está contenida en el plano $U$.
              No lo está: sustituyendo $\left(t,2t,3t\right)$ en $x+y+z=0$ sale
              $6t=0$, es decir $t=0$. Solo sobrevive el vector nulo.
          - valor: '2'
            mensaje: |
              La intersección está dentro de $V$, que tiene dimensión $1$: no
              puede valer $2$.
          - valor: '3'
            mensaje: |
              $3$ sería todo $\mathbb{R}^{3}$, y la intersección de un plano con
              una recta no puede serlo.
        pista: |
          Mete $\left(t,2t,3t\right)$ en la ecuación $x+y+z=0$ y despeja $t$.
        desarrollo: |
          $$
          t+2t+3t=6t=0
          \;\Longrightarrow\;
          t=0
          \;\Longrightarrow\;
          U\cap V=\left\{\left(0,0,0\right)\right\}
          $$

          $$
          \dim\left(U\cap V\right)=0
          $$

          Su base es la **familia vacía**, que es la respuesta correcta y la que
          casi nadie escribe: el subespacio nulo no tiene ningún vector en su
          base, porque el $\overline{0}$ nunca forma familia libre.

          Como la intersección es trivial, la suma es **directa**:
          $U\oplus V$.

      - tipo: calcular
        titulo: La dimensión de la suma
        pregunta: |
          ¿Cuánto vale $\dim\left(U+V\right)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es la dimensión de $U$ solo. La suma añade la dirección de
              $V$, que no estaba dentro de $U$ —lo acabamos de comprobar—, así
              que crece una unidad.
          - valor: '1'
            mensaje: |
              $1$ es la dimensión de $V$. La suma contiene a los dos, así que es
              al menos tan grande como el mayor.
          - valor: '4'
            mensaje: |
              La suma vive dentro de $\mathbb{R}^{3}$, así que no puede tener
              dimensión $4$. Grassmann da $2+1-0=3$, que es el máximo posible.
        pista: |
          Grassmann: $\dim U+\dim V-\dim\left(U\cap V\right)$, con los tres
          números ya calculados.
        desarrollo: |
          $$
          \dim\left(U+V\right)=\dim U+\dim V-\dim\left(U\cap V\right)
          =2+1-0=3
          $$

          Y como $\mathbb{R}^{3}$ tiene dimensión $3$, la suma es **todo el
          espacio**:

          $$
          U\oplus V=\mathbb{R}^{3}
          $$

          Es decir, todo vector de $\mathbb{R}^{3}$ se escribe de forma única
          como «algo del plano más algo de la recta». Ese es el contenido de que
          la suma sea directa, y es lo que hace útil el resultado.

      - tipo: justificar
        pregunta: Ordena el cálculo de los cuatro subespacios. Una pieza es falsa.
        piezas:
          - texto: >-
              $U$ es un plano: una ecuación homogénea en $\mathbb{R}^{3}$ deja
              $3-1=2$ dimensiones, con base
              $\left\{\left(1,0,-1\right),\left(0,1,-1\right)\right\}$.
          - texto: >-
              $V$ es una recta: un solo parámetro, con base
              $\left\{\left(1,2,3\right)\right\}$ y dimensión $1$.
          - texto: >-
              La intersección se calcula metiendo el genérico de $V$ en la
              ecuación de $U$: $6t=0$, luego solo queda el nulo y la dimensión
              es $0$.
          - texto: >-
              Por Grassmann, $\dim\left(U+V\right)=2+1-0=3$, así que
              $U+V=\mathbb{R}^{3}$ y la suma es directa.
          - texto: >-
              Y como la suma es directa, $U$ y $V$ son ortogonales entre sí.
            trampa: true
            mensaje: |
              «Directa» y «ortogonal» no son lo mismo, y aquí ni siquiera se ha
              definido un producto escalar. Que la suma sea directa significa
              solo que la intersección es el vector nulo. De hecho, con el
              producto escalar usual estos dos **no** son ortogonales:
              $\left(1,0,-1\right)\cdot\left(1,2,3\right)=1-3=-2\neq0$. La
              confusión es frecuente porque los dos conceptos aparecen juntos en
              el tema de espacios euclídeos, pero uno vive sin métrica y el otro
              no.
    resolucion: |
      **$U$ es un plano.** Una ecuación homogénea independiente en
      $\mathbb{R}^{3}$ quita una dimensión. Despejando $z=-x-y$:

      $$
      \left(x,y,-x-y\right)=x\left(1,0,-1\right)+y\left(0,1,-1\right)
      $$

      $$
      \boxed{\;U=L\left(\left\{\left(1,0,-1\right),
      \left(0,1,-1\right)\right\}\right),\quad\dim U=2\;}
      $$

      **$V$ es una recta.** Ya viene generada por un solo vector:

      $$
      \boxed{\;V=L\left(\left\{\left(1,2,3\right)\right\}\right),
      \quad\dim V=1\;}
      $$

      **La intersección, con el atajo del filtro.** $U$ viene por ecuaciones y
      $V$ por parámetros, así que se mete el genérico de $V$ en la ecuación de
      $U$:

      $$
      t+2t+3t=6t=0\;\Longrightarrow\;t=0
      $$

      $$
      \boxed{\;U\cap V=\left\{\overline{0}\right\},\quad
      \dim\left(U\cap V\right)=0\;}
      $$

      La base es la familia vacía. Merece la pena escribirlo así y no «la base
      es $\left\{\overline{0}\right\}$», que es falso: el vector nulo nunca
      forma familia libre, y por eso $\dim\left\{\overline{0}\right\}=0$.

      **La suma, por Grassmann.**

      $$
      \dim\left(U+V\right)=2+1-0=3
      \;\Longrightarrow\;
      \boxed{\;U\oplus V=\mathbb{R}^{3}\;}
      $$

      con base la canónica, o bien la unión de las dos bases:
      $\left\{\left(1,0,-1\right),\left(0,1,-1\right),
      \left(1,2,3\right)\right\}$, que también es base porque son tres vectores
      independientes en dimensión $3$.

      **Y la lectura geométrica**, que es la que hace que esto se recuerde: un
      plano y una recta que **no** está contenida en él se cortan solo en el
      origen, y entre los dos llenan el espacio. Si la recta hubiera estado
      dentro del plano, la intersección habría sido la recta entera y la suma se
      habría quedado en el plano.

  - id: ejalg1-bol18-otra-base-y-las-coordenadas-en-ella
    titulo: Otra base fabricada a partir de la que había
    fuente: >-
      Ejercicio 18 · Boletín de problemas, Espacios vectoriales · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de Matemática
      Aplicada.
    nivel: practica
    enunciado: |
      Sea
      $B=\left\{\overline{u}_{1},\overline{u}_{2},\overline{u}_{3}\right\}$ una
      base del espacio vectorial $V$. Demostrar que
      $\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$, donde

      $$
      \begin{cases}
      \overline{v}_{1}=\overline{u}_{1}+2\overline{u}_{2}\\
      \overline{v}_{2}=2\overline{u}_{1}-\overline{u}_{2}\\
      \overline{v}_{3}=\overline{u}_{3}
      \end{cases}
      $$

      es otra base de $V$ y calcular las coordenadas del vector
      $\overline{u}=5\overline{u}_{1}-5\overline{u}_{2}+3\overline{u}_{3}$ en
      esta nueva base.
    pide: La demostración de que es base, y unas coordenadas en ella.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la forma más corta de demostrar que los tres vectores nuevos
          forman base?
        opciones:
          - texto: >-
              Comprobar que el determinante de la matriz de sus coordenadas en
              $B$ no es nulo: tres vectores independientes en dimensión $3$ ya
              son base
            correcta: true
            mensaje: |
              Exacto, y son dos ahorros a la vez. El determinante da la
              independencia de un golpe; y como el espacio tiene dimensión $3$ y
              hay tres vectores, no hace falta comprobar aparte que generan: en
              dimensión $n$, $n$ vectores libres son siempre base.
          - texto: >-
              Comprobar que son libres **y** que generan $V$, las dos cosas
            mensaje: |
              Es la definición, pero se puede ahorrar la mitad. Un teorema del
              tema dice que en un espacio de dimensión $n$, una familia libre de
              $n$ vectores es automáticamente sistema generador.
          - texto: >-
              Ver que los tres son distintos de $\overline{0}$
            mensaje: |
              Necesario pero muy lejos de suficiente:
              $\left\{\overline{u}_{1},\overline{u}_{1},
              \overline{u}_{2}\right\}$ son todos no nulos y no es libre.
          - texto: >-
              Comprobar que cada $\overline{v}_{i}$ se escribe con la base $B$
            mensaje: |
              Eso está dado en el enunciado y no demuestra nada: cualquier
              vector de $V$ se escribe con $B$, precisamente porque $B$ es base.

      - tipo: calcular
        titulo: El determinante que decide
        pregunta: |
          ¿Cuánto vale el determinante de la matriz que tiene por columnas las
          coordenadas de $\overline{v}_{1}$, $\overline{v}_{2}$ y
          $\overline{v}_{3}$ en la base $B$?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              El signo. El bloque de arriba a la izquierda es
              $\begin{pmatrix}1&2\\2&-1\end{pmatrix}$, cuyo determinante es
              $-1-4=-5$. Lo importante para el ejercicio es que **no sea cero**,
              pero el signo también cuenta si te lo piden.
          - valor: '0'
            mensaje: |
              Si fuese cero, los tres no serían base y el ejercicio no tendría
              segunda parte. Desarrolla por la tercera fila, que solo tiene un
              $1$.
          - valor: '3'
            mensaje: |
              $3$ es la dimensión del espacio, no el determinante.
          - valor: '-3'
            mensaje: |
              El determinante del bloque $2\times2$ es
              $1\cdot\left(-1\right)-2\cdot2=-5$, no $-3$. Cuidado con el
              producto cruzado.
        pista: |
          La matriz es
          $\begin{pmatrix}1&2&0\\2&-1&0\\0&0&1\end{pmatrix}$. Desarrolla por la
          última fila o por la última columna.
        desarrollo: |
          Las columnas son las coordenadas de cada $\overline{v}_{i}$ en $B$:

          $$
          P=\begin{pmatrix}1&2&0\\2&-1&0\\0&0&1\end{pmatrix}
          $$

          Es diagonal por bloques, así que el determinante es el producto de los
          determinantes de los bloques:

          $$
          \det P=\left(1\cdot\left(-1\right)-2\cdot2\right)\cdot1
          =-5\neq0
          $$

          Y con eso queda demostrado: tres vectores independientes en un espacio
          de dimensión $3$ forman base.

      - tipo: calcular
        titulo: Las coordenadas en la base nueva
        pregunta: |
          ¿Cuáles son las coordenadas de
          $\overline{u}=5\overline{u}_{1}-5\overline{u}_{2}
          +3\overline{u}_{3}$ en la base
          $\left\{\overline{v}_{1},\overline{v}_{2},
          \overline{v}_{3}\right\}$?
        respuesta:
          tipo: vector
          valor: '(-1, 3, 3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(5, -5, 3)'
            mensaje: |
              Esas son las coordenadas en la base **vieja** $B$, que es el dato
              de partida. Para pasar a la nueva hay que **resolver**
              $P\overline{y}=\left(5,-5,3\right)$, no copiar.
          - valor: '(1, -3, 3)'
            mensaje: |
              Los dos primeros signos. De $y_{1}+2y_{2}=5$ y
              $2y_{1}-y_{2}=-5$ sale $y_{2}=3$ e $y_{1}=-1$. Comprueba:
              $-\overline{v}_{1}+3\overline{v}_{2}
              =-\overline{u}_{1}-2\overline{u}_{2}+6\overline{u}_{1}
              -3\overline{u}_{2}$.
          - valor: '(-1, 3, 1)'
            mensaje: |
              La tercera. Como $\overline{v}_{3}=\overline{u}_{3}$, el
              coeficiente de $\overline{u}_{3}$ pasa tal cual: vale $3$.
        pista: |
          La tercera coordenada es inmediata, porque
          $\overline{v}_{3}=\overline{u}_{3}$. Las otras dos salen de un sistema
          de dos ecuaciones.
        desarrollo: |
          Se busca $\overline{y}$ con
          $P\overline{y}=\left(5,-5,3\right)$. La tercera fila da directamente
          $y_{3}=3$, y las dos primeras un sistema pequeño:

          $$
          \begin{cases}
          y_{1}+2y_{2}=5\\
          2y_{1}-y_{2}=-5
          \end{cases}
          \;\Longrightarrow\;
          y_{2}=3,\quad y_{1}=-1
          $$

          $$
          \overline{u}\big|_{B'}=\left(-1,3,3\right)
          $$

          Y la comprobación, que en este ejercicio es especialmente barata:

          $$
          -\overline{v}_{1}+3\overline{v}_{2}+3\overline{v}_{3}
          =-\left(\overline{u}_{1}+2\overline{u}_{2}\right)
          +3\left(2\overline{u}_{1}-\overline{u}_{2}\right)
          +3\overline{u}_{3}
          =5\overline{u}_{1}-5\overline{u}_{2}+3\overline{u}_{3}
          $$

      - tipo: justificar
        pregunta: Ordena el ejercicio entero. Una pieza es falsa.
        piezas:
          - texto: >-
              Las coordenadas de los $\overline{v}_{i}$ en $B$ son
              $\left(1,2,0\right)$, $\left(2,-1,0\right)$ y
              $\left(0,0,1\right)$, y forman las columnas de $P$.
          - texto: >-
              $\det P=-5\neq0$, luego los tres son independientes.
          - texto: >-
              Y como el espacio tiene dimensión $3$ y hay tres vectores libres,
              forman base sin necesidad de comprobar que generan.
          - texto: >-
              Para las coordenadas de $\overline{u}$ en la base nueva hay que
              resolver $P\overline{y}=\left(5,-5,3\right)$, y sale
              $\left(-1,3,3\right)$.
          - texto: >-
              Y basta multiplicar $P$ por $\left(5,-5,3\right)$, porque $P$ es
              la matriz del cambio.
            trampa: true
            mensaje: |
              Multiplicar por $P$ va en el sentido contrario: lleva coordenadas
              de la base **nueva** a la vieja, porque las columnas de $P$ están
              escritas en la vieja. Como aquí el dato viene en la vieja, hay que
              resolver el sistema —o multiplicar por $P^{-1}$, que es lo mismo
              con más trabajo—. Es el error más repetido del apartado de cambio
              de base, y produce un vector perfectamente presentable y
              equivocado: $P\left(5,-5,3\right)=\left(-5,15,3\right)$, que no es
              la respuesta.
    resolucion: |
      **Demostrar que es base: un determinante.** Las coordenadas de los tres
      vectores nuevos en la base $B$ son
      $\left(1,2,0\right)$, $\left(2,-1,0\right)$ y $\left(0,0,1\right)$.
      Puestas en columna:

      $$
      P=\begin{pmatrix}1&2&0\\2&-1&0\\0&0&1\end{pmatrix},
      \qquad
      \det P=-5\neq0
      $$

      Determinante no nulo significa **independientes**. Y aquí hay un ahorro
      que conviene usar siempre: en un espacio de dimensión $3$, tres vectores
      libres son automáticamente sistema generador, así que **no hay que
      comprobar que generan**. Es un teorema del tema y se puede citar.

      **Las coordenadas: el sentido importa.** El vector viene dado en la base
      vieja, $\overline{u}\big|_{B}=\left(5,-5,3\right)$, y se piden sus
      coordenadas en la nueva. Ese es el sentido caro:

      $$
      P\overline{y}=\begin{pmatrix}5\\-5\\3\end{pmatrix}
      \;\Longrightarrow\;
      \begin{cases}
      y_{1}+2y_{2}=5\\
      2y_{1}-y_{2}=-5\\
      y_{3}=3
      \end{cases}
      \;\Longrightarrow\;
      \boxed{\;\overline{u}\big|_{B'}=\left(-1,3,3\right)\;}
      $$

      **Y siempre la comprobación**, que aquí sale sola:

      $$
      -\overline{v}_{1}+3\overline{v}_{2}+3\overline{v}_{3}
      =5\overline{u}_{1}-5\overline{u}_{2}+3\overline{u}_{3}
      $$

      Diez segundos, y es la única forma de cazar el error de haber
      multiplicado cuando había que resolver.
