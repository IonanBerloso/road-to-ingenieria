ejercicios:
  # ── Los tres primeros son NUESTROS (§08). El boletín de euclídeos empieza
  #    demostrando que el producto usual lo es «en general», y sigue con
  #    productos escalares sobre funciones e integrales: no hay por dónde
  #    entrar sin haber ortonormalizado antes dos vectores concretos.
  - id: ejalg6-que-hace-falta-para-ser-producto-escalar
    titulo: Tres candidatos, y por qué solo uno sirve
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      Sobre $\mathbb{R}^{2}$ se definen las tres aplicaciones

      $$
      f\left(\overline{x},\overline{y}\right)=x_{1}y_{1}+x_{2}y_{2},
      \quad
      g\left(\overline{x},\overline{y}\right)=x_{1}y_{1}-x_{2}y_{2},
      \quad
      h\left(\overline{x},\overline{y}\right)=x_{1}y_{2}+x_{2}y_{1}
      $$

      Decidir cuáles son productos escalares.
    pide: Cuáles de las tres son productos escalares, y qué propiedad falla en las otras.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres son bilineales y simétricas. ¿Qué queda por comprobar, y cómo
          se descarta rápido?
        opciones:
          - texto: >-
              La **definida positiva**: basta encontrar un vector no nulo cuyo
              producto consigo mismo no sea estrictamente positivo
            correcta: true
            mensaje: |
              Eso es. Y como para descartar basta **un** contraejemplo, es la
              comprobación más rentable: se prueban los vectores de la base
              canónica y casi siempre uno de ellos falla.
          - texto: >-
              Que estén definidas sobre el mismo espacio
            mensaje: |
              Las tres van de $\mathbb{R}^{2}\times\mathbb{R}^{2}$ en
              $\mathbb{R}$, que es lo que pide la definición. Eso no distingue
              nada.
          - texto: >-
              Que sean lineales en el primer argumento
            mensaje: |
              La bilinealidad ya está dada en el enunciado del paso. Lo que
              queda es la tercera condición.
          - texto: >-
              Que la matriz asociada tenga determinante no nulo
            mensaje: |
              Determinante no nulo no basta: la matriz de $g$ es
              $\begin{pmatrix}1&0\\0&-1\end{pmatrix}$, con determinante $-1\neq0$,
              y $g$ **no** es producto escalar. Hace falta que los menores
              principales sean **positivos**, no solo distintos de cero.

      - tipo: calcular
        titulo: El contraejemplo de g
        pregunta: |
          Con $g\left(\overline{x},\overline{y}\right)=x_{1}y_{1}-x_{2}y_{2}$,
          ¿cuánto vale $g\left(\overline{v},\overline{v}\right)$ para
          $\overline{v}=\left(0,1\right)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              El signo, que es todo el ejercicio. $g$ **resta** el producto de
              las segundas coordenadas: $0\cdot0-1\cdot1=-1$.
          - valor: '0'
            mensaje: |
              $0$ sería si las dos coordenadas se cancelaran, y aquí la primera
              aporta $0$ y la segunda $-1$.
          - valor: '2'
            mensaje: |
              $2$ saldría de sumar los dos términos con signo positivo, que es
              lo que hace $f$, no $g$.
        pista: |
          Sustituye $\overline{x}=\overline{y}=\left(0,1\right)$ en la fórmula
          de $g$, con su signo menos.
        desarrollo: |
          $$
          g\left(\left(0,1\right),\left(0,1\right)\right)
          =0\cdot0-1\cdot1=-1<0
          $$

          Un producto escalar tiene que dar **estrictamente positivo** sobre
          todo vector no nulo. Con un solo contraejemplo, $g$ queda descartada.

          Y con la matriz se ve igual de rápido:
          $A_{g}=\begin{pmatrix}1&0\\0&-1\end{pmatrix}$ tiene el segundo menor
          principal igual a $-1$, negativo.

      - tipo: calcular
        titulo: Y el de h
        pregunta: |
          Con $h\left(\overline{x},\overline{y}\right)=x_{1}y_{2}+x_{2}y_{1}$,
          ¿cuánto vale $h\left(\overline{v},\overline{v}\right)$ para
          $\overline{v}=\left(1,0\right)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ saldría con el producto usual. $h$ **cruza** las coordenadas:
              $1\cdot0+0\cdot1=0$.
          - valor: '2'
            mensaje: |
              $2$ sale con $\overline{v}=\left(1,1\right)$:
              $1\cdot1+1\cdot1=2$. Con $\left(1,0\right)$ los dos términos son
              cero.
          - valor: '-1'
            mensaje: |
              $h$ solo tiene sumas, sin ningún signo menos.
        pista: |
          Sustituye $x_{1}=y_{1}=1$ y $x_{2}=y_{2}=0$. Los dos términos cruzan
          una coordenada con la otra.
        desarrollo: |
          $$
          h\left(\left(1,0\right),\left(1,0\right)\right)
          =1\cdot0+0\cdot1=0
          $$

          Y $\left(1,0\right)$ **no es el vector nulo**, así que falla la
          definida positiva: la condición exige estrictamente mayor que cero
          para todo vector no nulo.

          Es un caso más sutil que el de $g$, porque aquí nunca sale un número
          negativo sobre la diagonal… salvo que se pruebe con
          $\left(1,-1\right)$, donde da $-2$. Con la matriz se ve de golpe:
          $A_{h}=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ tiene el primer menor
          principal igual a $0$, que no es positivo.

      - tipo: justificar
        pregunta: Ordena el estudio de las tres. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres son bilineales y simétricas, así que todo se juega en la
              definida positiva.
          - texto: >-
              $g$ falla con $\left(0,1\right)$, que da $-1$: negativo sobre un
              vector no nulo.
          - texto: >-
              $h$ falla con $\left(1,0\right)$, que da $0$: la condición exige
              estrictamente positivo.
          - texto: >-
              $f$ es el producto usual, y sí las cumple las tres: su matriz es
              la identidad, con los dos menores principales iguales a $1$.
          - texto: >-
              $h$ falla porque su matriz tiene determinante negativo, igual que
              la de $g$.
            trampa: true
            mensaje: |
              El determinante de $A_{h}=\begin{pmatrix}0&1\\1&0\end{pmatrix}$
              vale $-1$, cierto, pero **no es ese el criterio**: lo que hay que
              exigir es que **todos los menores principales sean positivos**, y
              en $h$ el primero ya vale $0$. La diferencia importa: hay matrices
              con determinante positivo que tampoco son definidas positivas,
              como $\begin{pmatrix}-1&0\\0&-1\end{pmatrix}$, cuyo determinante
              es $+1$ y que da $-1$ sobre cualquier vector unitario.
    resolucion: |
      **Las tres son bilineales y simétricas**, así que todo se decide en la
      tercera condición. Y para **descartar** basta un contraejemplo:

      | | contraejemplo | valor | qué falla |
      |---|---|---|---|
      | $g$ | $\left(0,1\right)$ | $-1$ | negativo |
      | $h$ | $\left(1,0\right)$ | $0$ | no estrictamente positivo |
      | $f$ | — | — | nada: **sí** es producto escalar |

      $$
      \boxed{\;\text{Solo }f\text{ es producto escalar}\;}
      $$

      **El criterio de las matrices dice lo mismo más deprisa.** Escribiendo
      cada una como
      $\left\langle\overline{x},\overline{y}\right\rangle
      =\overline{x}^{T}A\,\overline{y}$:

      $$
      A_{f}=\begin{pmatrix}1&0\\0&1\end{pmatrix},
      \qquad
      A_{g}=\begin{pmatrix}1&0\\0&-1\end{pmatrix},
      \qquad
      A_{h}=\begin{pmatrix}0&1\\1&0\end{pmatrix}
      $$

      Es producto escalar $\iff$ $A$ es simétrica **y todos sus menores
      principales son positivos**. Las tres son simétricas; $A_{f}$ tiene
      menores $1$ y $1$; $A_{g}$ tiene $1$ y $-1$; $A_{h}$ tiene $0$ y $-1$.

      **Ojo a la palabra «positivos»**, que no es «no nulos». Una matriz con
      determinante positivo puede no ser definida positiva:
      $\begin{pmatrix}-1&0\\0&-1\end{pmatrix}$ tiene determinante $+1$ y da
      valores negativos sobre todo vector no nulo.

  - id: ejalg6-gram-schmidt-paso-a-paso
    titulo: Gram-Schmidt sobre dos vectores, y el tercero de regalo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      En $\mathbb{R}^{3}$ con el producto escalar usual, sea el subespacio

      $$
      S=L\left(\left\{\left(2,1,2\right),\left(1,1,0\right)\right\}\right)
      $$

      a) Encontrar una base ortonormal de $S$.

      b) Completarla hasta una base ortonormal de $\mathbb{R}^{3}$.
    pide: La base ortonormal de S, y su ampliación a todo el espacio.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es exactamente lo que Gram-Schmidt le resta al segundo vector?
        opciones:
          - texto: >-
              Su **proyección** sobre el primero, es decir, la parte del segundo
              que va en la dirección del primero
            correcta: true
            mensaje: |
              Exacto. Lo que queda ya no tiene nada en esa dirección, y por eso
              es perpendicular. Es la única idea del método; lo demás es
              aritmética.
          - texto: >-
              El primer vector entero
            mensaje: |
              Restar el primero a secas no da nada perpendicular:
              $\left(1,1,0\right)-\left(2,1,2\right)=\left(-1,0,-2\right)$, cuyo
              producto escalar con $\left(2,1,2\right)$ vale $-6$, no cero.
          - texto: >-
              La media de los dos
            mensaje: |
              La media no tiene ninguna propiedad útil aquí. Lo que hay que
              quitar es exactamente la componente en la dirección del primero,
              ni más ni menos.
          - texto: >-
              Su norma
            mensaje: |
              La norma es un número, no un vector: no se le puede restar a un
              vector. Lo que se resta es un múltiplo del primero, y el
              coeficiente sale de un producto escalar.

      - tipo: calcular
        titulo: El primer vector, ya unitario
        pregunta: |
          Normalizando $\left(2,1,2\right)$, ¿qué vector sale?
        respuesta:
          tipo: vector
          valor: '(2/3, 1/3, 2/3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen fracciones
        distractores:
          - valor: '(2, 1, 2)'
            mensaje: |
              Ese es el vector de partida, cuya norma vale $3$. Para
              normalizarlo hay que dividir cada coordenada entre $3$.
          - valor: '(2/9, 1/9, 2/9)'
            mensaje: |
              Has dividido entre $9$, que es la norma **al cuadrado**. La norma
              es su raíz: $\sqrt{9}=3$.
          - valor: '(1/3, 2/3, 2/3)'
            mensaje: |
              Las dos primeras coordenadas cambiadas. El vector es
              $\left(2,1,2\right)$: primero el $2$.
        pista: |
          La norma de $\left(2,1,2\right)$ es
          $\sqrt{4+1+4}$. Sale entera.
        desarrollo: |
          $$
          \left\|\left(2,1,2\right)\right\|=\sqrt{4+1+4}=3,
          \qquad
          \overline{u}_{1}=\left(\tfrac{2}{3},\tfrac{1}{3},\tfrac{2}{3}\right)
          $$

          Que la norma salga entera es lo habitual en estos ejercicios, y una
          señal de que vas bien.

      - tipo: calcular
        titulo: El segundo, tras restar la proyección
        pregunta: |
          Ortogonalizando $\left(1,1,0\right)$ respecto de
          $\overline{u}_{1}$ y normalizando, ¿qué vector sale?
        respuesta:
          tipo: vector
          valor: '(1/3, 2/3, -2/3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen fracciones
        distractores:
          - valor: '(1, 1, 0)'
            mensaje: |
              Ese es el vector de partida, sin ortogonalizar. Su producto
              escalar con $\overline{u}_{1}$ vale $1$, no cero.
          - valor: '(1/3, 2/3, 2/3)'
            mensaje: |
              El signo de la tercera. La proyección que se resta es
              $1\cdot\left(2/3,1/3,2/3\right)$, y $0-2/3=-2/3$, negativa.
          - valor: '(2/3, 1/3, 2/3)'
            mensaje: |
              Ese es $\overline{u}_{1}$, el primero. El segundo tiene que ser
              perpendicular a él.
        pista: |
          $\left\langle\left(1,1,0\right),\overline{u}_{1}\right\rangle
          =\tfrac{2}{3}+\tfrac{1}{3}+0=1$. Réstale esa proyección y mira qué
          norma queda.
        desarrollo: |
          $$
          \left\langle\left(1,1,0\right),\overline{u}_{1}\right\rangle
          =\tfrac{2}{3}+\tfrac{1}{3}+0=1
          $$

          $$
          \overline{w}_{2}=\left(1,1,0\right)
          -1\cdot\left(\tfrac{2}{3},\tfrac{1}{3},\tfrac{2}{3}\right)
          =\left(\tfrac{1}{3},\tfrac{2}{3},-\tfrac{2}{3}\right)
          $$

          Y su norma:
          $\sqrt{\tfrac{1+4+4}{9}}=\sqrt{1}=1$. **Ya es unitario**, así que no
          hay que dividir por nada:

          $$
          \overline{u}_{2}=\left(\tfrac{1}{3},\tfrac{2}{3},-\tfrac{2}{3}\right)
          $$

          Comprobación:
          $\left\langle\overline{u}_{1},\overline{u}_{2}\right\rangle
          =\tfrac{2}{9}+\tfrac{2}{9}-\tfrac{4}{9}=0$ ✓.

      - tipo: calcular
        titulo: El tercero, para completar la base
        pregunta: |
          El vector que completa la base ortonormal de $\mathbb{R}^{3}$, tomando
          $\overline{u}_{1}\times\overline{u}_{2}$.
        respuesta:
          tipo: vector
          valor: '(-2/3, 2/3, 1/3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen fracciones
        distractores:
          - valor: '(2/3, -2/3, -1/3)'
            mensaje: |
              Es el opuesto, que también completa una base ortonormal, pero sale
              de $\overline{u}_{2}\times\overline{u}_{1}$: el producto vectorial
              **no es conmutativo** y cambiar el orden cambia el signo.
          - valor: '(-2/3, -2/3, 1/3)'
            mensaje: |
              El signo de la segunda. En el desarrollo del producto vectorial,
              la componente $j$ lleva un menos delante, y aquí ese menos
              convierte un $-6/9$ en $+6/9$.
          - valor: '(-2, 2, 1)'
            mensaje: |
              Esa es la dirección, sin normalizar: su norma vale $3$. Pero
              $\overline{u}_{1}$ y $\overline{u}_{2}$ ya eran unitarios y
              perpendiculares, así que su producto vectorial **ya sale
              unitario**; si te ha salido de norma $3$ es que has multiplicado
              los vectores originales.
        pista: |
          Con dos vectores unitarios y perpendiculares, su producto vectorial es
          automáticamente unitario. No hay que volver a dividir.
        desarrollo: |
          $$
          \overline{u}_{3}=\overline{u}_{1}\times\overline{u}_{2}
          =\left(-\tfrac{2}{3},\tfrac{2}{3},\tfrac{1}{3}\right)
          $$

          y su norma es
          $\sqrt{\tfrac{4+4+1}{9}}=1$ ✓.

          **El otro camino, que es el que hay que usar si el producto escalar no
          es el usual:** imponer las dos ecuaciones de ortogonalidad

          $$
          \left\langle\overline{x},\overline{u}_{1}\right\rangle=0,
          \qquad
          \left\langle\overline{x},\overline{u}_{2}\right\rangle=0
          $$

          Sale un sistema homogéneo de dos ecuaciones y tres incógnitas, cuya
          solución es una recta: la misma dirección, y luego se normaliza.

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              El primer vector solo hay que normalizarlo:
              $\overline{u}_{1}=\left(2,1,2\right)/3$.
          - texto: >-
              Al segundo se le resta su proyección sobre
              $\overline{u}_{1}$, que es
              $\left\langle\overline{v}_{2},\overline{u}_{1}\right\rangle
              \overline{u}_{1}$.
          - texto: >-
              Lo que queda es perpendicular a $\overline{u}_{1}$ por
              construcción, y aquí además sale ya unitario.
          - texto: >-
              Para completar hasta $\mathbb{R}^{3}$ basta un vector
              perpendicular a los dos, y con el producto escalar usual lo da el
              producto vectorial.
          - texto: >-
              Y como los tres son ortogonales, el orden en que se toman los
              vectores de partida no cambia el resultado.
            trampa: true
            mensaje: |
              El resultado de Gram-Schmidt **depende del orden**: el primer
              vector se queda en su dirección original y los demás se van
              torciendo respecto de él. Empezando por $\left(1,1,0\right)$ en
              lugar de por $\left(2,1,2\right)$ sale otra base ortonormal, tan
              válida como esta pero distinta. Lo que no cambia es el subespacio
              que generan.
    resolucion: |
      **a) Gram-Schmidt, con dos vectores.**

      $$
      \left\|\left(2,1,2\right)\right\|=3
      \;\Longrightarrow\;
      \overline{u}_{1}=\left(\tfrac{2}{3},\tfrac{1}{3},\tfrac{2}{3}\right)
      $$

      $$
      \left\langle\left(1,1,0\right),\overline{u}_{1}\right\rangle=1
      \;\Longrightarrow\;
      \overline{w}_{2}=\left(1,1,0\right)-\overline{u}_{1}
      =\left(\tfrac{1}{3},\tfrac{2}{3},-\tfrac{2}{3}\right)
      $$

      y $\left\|\overline{w}_{2}\right\|=1$, así que ya es unitario:

      $$
      \boxed{\;\left\{
      \left(\tfrac{2}{3},\tfrac{1}{3},\tfrac{2}{3}\right),
      \left(\tfrac{1}{3},\tfrac{2}{3},-\tfrac{2}{3}\right)\right\}\;}
      $$

      **b) El tercero.** Con el producto escalar usual, el producto vectorial lo
      da directamente y sale unitario porque los dos factores lo eran y eran
      perpendiculares:

      $$
      \boxed{\;\overline{u}_{3}=\overline{u}_{1}\times\overline{u}_{2}
      =\left(-\tfrac{2}{3},\tfrac{2}{3},\tfrac{1}{3}\right)\;}
      $$

      **Las tres comprobaciones**, que cuestan seis productos escalares y cazan
      cualquier error:

      | | valor |
      |---|---|
      | las tres normas | $1$ |
      | $\left\langle\overline{u}_{1},\overline{u}_{2}\right\rangle$ | $0$ |
      | $\left\langle\overline{u}_{1},\overline{u}_{3}\right\rangle$ y $\left\langle\overline{u}_{2},\overline{u}_{3}\right\rangle$ | $0$ |

      **Y dos advertencias que se pagan en el examen.** La primera: el resultado
      **depende del orden** de los vectores de partida; empezando por el otro
      sale una base distinta, igual de válida. La segunda: si el enunciado
      define un producto escalar que no es el usual, **el producto vectorial ya
      no sirve** para completar y hay que imponer las dos ecuaciones de
      ortogonalidad.

  - id: ejalg6-el-complemento-ortogonal-y-la-proyeccion
    titulo: Partir un vector en su sombra y lo que sobra
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      En $\mathbb{R}^{3}$ con el producto escalar usual, sea el plano

      $$
      S=\left\{\left(x,y,z\right)\;/\;x+y+z=0\right\}
      $$

      a) Hallar $S^{\perp}$, con su dimensión.

      b) Descomponer el vector $\left(3,0,0\right)$ en su parte de $S$ y su
      parte de $S^{\perp}$.
    pide: El complemento ortogonal, y la descomposición del vector.

    pasos:
      - tipo: reconocer
        pregunta: |
          $S$ viene dado por la ecuación $x+y+z=0$. ¿Qué es $S^{\perp}$?
        opciones:
          - texto: >-
              La recta generada por $\left(1,1,1\right)$: los coeficientes de la
              ecuación son exactamente el vector perpendicular al plano
            correcta: true
            mensaje: |
              Eso es, y es un atajo que vale la pena tener. La ecuación
              $x+y+z=0$ dice justamente
              $\left\langle\left(x,y,z\right),\left(1,1,1\right)\right\rangle=0$:
              el plano son los vectores perpendiculares a
              $\left(1,1,1\right)$, así que su complemento ortogonal es la recta
              que ese vector genera.
          - texto: >-
              El plano $x+y+z=1$
            mensaje: |
              Ese conjunto ni siquiera es subespacio —no contiene al
              $\overline{0}$— y desde luego no es perpendicular a $S$: es $S$
              trasladado.
          - texto: >-
              El conjunto $\left\{\left(x,y,z\right)\;/\;x-y-z=0\right\}$
            mensaje: |
              Ese es otro plano, y dos planos distintos de $\mathbb{R}^{3}$
              nunca son ortogonales entre sí: sus dimensiones sumarían $4$, y
              $\dim S+\dim S^{\perp}$ tiene que dar $3$.
          - texto: >-
              El vector nulo, porque $S$ ya llena casi todo el espacio
            mensaje: |
              $\dim S+\dim S^{\perp}=3$ siempre, y $\dim S=2$, así que
              $S^{\perp}$ tiene dimensión $1$: es una recta, no el origen.

      - tipo: calcular
        titulo: La dimensión del complemento
        pregunta: |
          ¿Cuánto vale $\dim S^{\perp}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es la dimensión de $S$. Las dos tienen que sumar $3$, la del
              espacio entero.
          - valor: '0'
            mensaje: |
              $0$ significaría que solo el $\overline{0}$ es perpendicular a
              todo $S$, y no es así: $\left(1,1,1\right)$ lo es y no es nulo.
          - valor: '3'
            mensaje: |
              $3$ sería todo $\mathbb{R}^{3}$, y eso exigiría que $S$ fuese
              perpendicular a sí mismo — imposible salvo que $S$ sea el
              subespacio nulo.
        pista: |
          $\dim S+\dim S^{\perp}=\dim V$, y $S$ es un plano.
        desarrollo: |
          Una ecuación homogénea en $\mathbb{R}^{3}$ deja $\dim S=2$, y

          $$
          \dim S^{\perp}=3-2=1
          $$

          $$
          S^{\perp}=L\left(\left\{\left(1,1,1\right)\right\}\right)
          $$

          **Y los coeficientes de la ecuación son el generador**: eso vale
          siempre que el producto escalar sea el usual, y ahorra plantear
          cualquier sistema.

      - tipo: calcular
        titulo: La parte perpendicular al plano
        pregunta: |
          ¿Cuál es la proyección de $\left(3,0,0\right)$ sobre
          $S^{\perp}$?
        respuesta:
          tipo: vector
          valor: '(1, 1, 1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(3, 3, 3)'
            mensaje: |
              Falta dividir por la norma al cuadrado. La fórmula es
              $\dfrac{\left\langle\overline{v},\overline{w}\right\rangle}
              {\left\langle\overline{w},\overline{w}\right\rangle}\overline{w}$,
              y aquí $\left\langle\overline{w},\overline{w}\right\rangle=3$.
          - valor: '(3, 0, 0)'
            mensaje: |
              Ese es el vector de partida. Su proyección sobre una recta tiene
              que ser un **múltiplo** de $\left(1,1,1\right)$, y $\left(3,0,0\right)$
              no lo es.
          - valor: '(2, -1, -1)'
            mensaje: |
              Esa es la otra mitad: la parte que cae **dentro** de $S$.
              Comprueba: sus coordenadas suman $0$, así que está en el plano, no
              en la recta perpendicular.
        pista: |
          Proyección sobre la recta que genera $\overline{w}=\left(1,1,1\right)$:
          $\dfrac{\left\langle\overline{v},\overline{w}\right\rangle}
          {\left\langle\overline{w},\overline{w}\right\rangle}\overline{w}$.
        desarrollo: |
          $$
          \left\langle\left(3,0,0\right),\left(1,1,1\right)\right\rangle=3,
          \qquad
          \left\langle\left(1,1,1\right),\left(1,1,1\right)\right\rangle=3
          $$

          $$
          \overline{p}=\frac{3}{3}\left(1,1,1\right)=\left(1,1,1\right)
          $$

          Y la otra mitad sale restando:

          $$
          \left(3,0,0\right)-\left(1,1,1\right)=\left(2,-1,-1\right)
          $$

          cuyas coordenadas suman $0$, así que efectivamente está en $S$ ✓.

      - tipo: justificar
        pregunta: Ordena la descomposición. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación $x+y+z=0$ dice que $S$ son los vectores
              perpendiculares a $\left(1,1,1\right)$, así que
              $S^{\perp}=L\left(\left\{\left(1,1,1\right)\right\}\right)$.
          - texto: >-
              Como $\dim S=2$ y $\dim S^{\perp}=1$, se cumple
              $\dim S+\dim S^{\perp}=3$ y la suma es directa:
              $\mathbb{R}^{3}=S\oplus S^{\perp}$.
          - texto: >-
              La proyección de $\left(3,0,0\right)$ sobre $S^{\perp}$ vale
              $\left(1,1,1\right)$, y restándola queda
              $\left(2,-1,-1\right)$.
          - texto: >-
              Ese resto está en $S$, porque sus coordenadas suman cero; y la
              descomposición es **única** por ser la suma directa.
          - texto: >-
              Y como la suma es directa, $S$ y $S^{\perp}$ no tienen ningún
              vector en común.
            trampa: true
            mensaje: |
              Comparten el $\overline{0}$, que está en **todo** subespacio. Que
              la suma sea directa significa que la intersección es
              $\left\{\overline{0}\right\}$, no que sea vacía — y no puede
              serlo, porque una intersección de subespacios siempre es
              subespacio y todo subespacio contiene al nulo. Es un desliz de
              redacción que en un examen escrito cuesta, porque delata no tener
              clara la diferencia entre «intersección trivial» e «intersección
              vacía».
    resolucion: |
      **a) El complemento ortogonal, leído de la ecuación.** Con el producto
      escalar usual, la ecuación $x+y+z=0$ dice exactamente

      $$
      \left\langle\left(x,y,z\right),\left(1,1,1\right)\right\rangle=0
      $$

      o sea que $S$ **son** los vectores perpendiculares a
      $\left(1,1,1\right)$. Por tanto

      $$
      \boxed{\;S^{\perp}=L\left(\left\{\left(1,1,1\right)\right\}\right),
      \quad\dim S^{\perp}=1\;}
      $$

      y se comprueba con la fórmula:
      $\dim S+\dim S^{\perp}=2+1=3$ ✓.

      **Los coeficientes de la ecuación son el vector perpendicular.** Ese atajo
      vale siempre con el producto usual, y ahorra plantear un sistema.

      **b) La descomposición.** La proyección sobre la recta:

      $$
      \overline{p}=\frac{\left\langle\left(3,0,0\right),
      \left(1,1,1\right)\right\rangle}
      {\left\langle\left(1,1,1\right),\left(1,1,1\right)\right\rangle}
      \left(1,1,1\right)
      =\frac{3}{3}\left(1,1,1\right)=\left(1,1,1\right)
      $$

      $$
      \boxed{\;\left(3,0,0\right)
      =\underbrace{\left(2,-1,-1\right)}_{\in S}
      +\underbrace{\left(1,1,1\right)}_{\in S^{\perp}}\;}
      $$

      **Y la descomposición es única**, porque
      $\mathbb{R}^{3}=S\oplus S^{\perp}$. Esa unicidad es lo que hace que tenga
      sentido hablar de «la» proyección ortogonal de un vector sobre un
      subespacio.

      **La comprobación de siempre:** el sumando de $S$ tiene que cumplir la
      ecuación —$2-1-1=0$ ✓— y el de $S^{\perp}$ tiene que ser múltiplo de
      $\left(1,1,1\right)$ ✓.

  # ── Y estos dos son del boletín oficial, reproducidos tal cual (§08).
  - id: ejalg6-bol642-ortonormalizar-una-base-de-r3
    titulo: Ortonormalizar una base entera de R³
    fuente: >-
      Ejercicio 6.4, apartado 2 · Boletín de problemas, Espacios vectoriales
      euclídeos · Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Matemática Aplicada.
    nivel: practica
    enunciado: |
      Ortonormaliza la siguiente base de $\mathbb{R}^{3}$, con el producto
      escalar usual:

      $$
      \left\{\left(1,1,0\right),\left(0,1,1\right),
      \left(1,0,1\right)\right\}
      $$
    pide: La base ortonormal que resulta.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al llegar al **tercer** vector, ¿de cuántas proyecciones hay que
          restarle?
        opciones:
          - texto: >-
              De **dos**: una por cada vector ya ortonormalizado
            correcta: true
            mensaje: |
              Eso es. La fórmula resta la proyección sobre **todos** los
              anteriores, no solo sobre el inmediatamente anterior. Con tres
              vectores son cero, una y dos restas respectivamente.
          - texto: >-
              De **una**, la del inmediatamente anterior
            mensaje: |
              Es el error más común del método. Restando solo la del segundo, el
              tercero queda perpendicular a $\overline{u}_{2}$ pero **no** a
              $\overline{u}_{1}$, y la base no sale ortogonal.
          - texto: >-
              De **tres**, incluida la suya propia
            mensaje: |
              Restarse su propia proyección lo dejaría en el vector nulo.
              Solo se resta lo que corresponde a los vectores **anteriores**.
          - texto: >-
              De ninguna: basta normalizarlo
            mensaje: |
              Normalizar solo cambia la longitud, no la dirección. Si el tercer
              vector no es perpendicular a los otros dos, normalizarlo no lo
              arregla.

      - tipo: calcular
        titulo: El primero
        pregunta: |
          Normalizando $\left(1,1,0\right)$, ¿qué vector sale?
        respuesta:
          tipo: vector
          valor: '(1/√2, 1/√2, 0)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen raíces y fracciones
        distractores:
          - valor: '(1, 1, 0)'
            mensaje: |
              Ese es el de partida, de norma $\sqrt{2}$. Hay que dividir cada
              coordenada por esa norma.
          - valor: '(1/2, 1/2, 0)'
            mensaje: |
              Has dividido entre $2$, que es la norma **al cuadrado**. La norma
              es $\sqrt{2}$.
          - valor: '(√2, √2, 0)'
            mensaje: |
              Has multiplicado por la norma en vez de dividir. Ese vector tiene
              norma $2$, no $1$.
        pista: |
          $\left\|\left(1,1,0\right)\right\|=\sqrt{1+1+0}$.
        desarrollo: |
          $$
          \left\|\left(1,1,0\right)\right\|=\sqrt{2},
          \qquad
          \overline{u}_{1}
          =\left(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2},0\right)
          $$

          Aquí las normas **no** salen enteras, a diferencia de los ejercicios
          de examen: es un ejercicio de método, no de números cómodos.

      - tipo: calcular
        titulo: El segundo
        pregunta: |
          Tras ortogonalizar $\left(0,1,1\right)$ respecto de
          $\overline{u}_{1}$ y normalizar, ¿qué vector sale?
        respuesta:
          tipo: vector
          valor: '(-1/√6, 1/√6, 2/√6)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen raíces y fracciones
        distractores:
          - valor: '(0, 1, 1)'
            mensaje: |
              Ese es el de partida. Su producto escalar con $\overline{u}_{1}$
              vale $1/\sqrt2$, no cero.
          - valor: '(-1/2, 1/2, 1)'
            mensaje: |
              Esa es la dirección correcta **sin normalizar**: su norma vale
              $\sqrt{3/2}$. Divídela por ella y sale
              $\left(-1,1,2\right)/\sqrt6$.
          - valor: '(1/√6, -1/√6, 2/√6)'
            mensaje: |
              Los dos primeros signos. La proyección que se resta es
              $\tfrac{1}{2}\left(1,1,0\right)$, así que la primera coordenada
              queda $0-\tfrac12=-\tfrac12$, negativa, y la segunda
              $1-\tfrac12=+\tfrac12$.
        pista: |
          $\left\langle\left(0,1,1\right),\overline{u}_{1}\right\rangle
          =\tfrac{1}{\sqrt2}$, así que la proyección es
          $\tfrac{1}{2}\left(1,1,0\right)$.
        desarrollo: |
          $$
          \left\langle\left(0,1,1\right),\overline{u}_{1}\right\rangle
          =\tfrac{1}{\sqrt2}
          \;\Longrightarrow\;
          \overline{w}_{2}=\left(0,1,1\right)-\tfrac{1}{2}\left(1,1,0\right)
          =\left(-\tfrac12,\tfrac12,1\right)
          $$

          $$
          \left\|\overline{w}_{2}\right\|
          =\sqrt{\tfrac14+\tfrac14+1}=\sqrt{\tfrac32}
          \;\Longrightarrow\;
          \overline{u}_{2}=\frac{\left(-1,1,2\right)}{\sqrt6}
          $$

          Multiplicar por $2$ antes de normalizar —pasando de
          $\left(-\tfrac12,\tfrac12,1\right)$ a $\left(-1,1,2\right)$— es
          legítimo y evita fracciones: la dirección es la misma y solo importa
          normalizar al final.

      - tipo: calcular
        titulo: El tercero
        pregunta: |
          Tras restarle **las dos** proyecciones y normalizar, ¿qué vector
          sale?
        respuesta:
          tipo: vector
          valor: '(1/√3, -1/√3, 1/√3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen raíces y fracciones
        distractores:
          - valor: '(1/√3, 1/√3, 1/√3)'
            mensaje: |
              El signo de la segunda. Comprueba con $\overline{u}_{1}$: el
              producto escalar de tu candidata con
              $\left(1,1,0\right)/\sqrt2$ vale $2/\sqrt6$, no cero.
          - valor: '(2/3, -2/3, 2/3)'
            mensaje: |
              Esa es la dirección correcta **sin normalizar**: su norma vale
              $2/\sqrt3$. Al dividir queda
              $\left(1,-1,1\right)/\sqrt3$.
          - valor: '(-1/√6, 1/√6, 2/√6)'
            mensaje: |
              Ese es $\overline{u}_{2}$, el anterior. El tercero tiene que ser
              perpendicular a los **dos** primeros.
        pista: |
          Réstale a $\left(1,0,1\right)$ su proyección sobre
          $\overline{u}_{1}$ **y** su proyección sobre $\overline{u}_{2}$. La
          dirección que queda es $\left(1,-1,1\right)$.
        desarrollo: |
          $$
          \left\langle\left(1,0,1\right),\overline{u}_{1}\right\rangle
          =\tfrac{1}{\sqrt2},
          \qquad
          \left\langle\left(1,0,1\right),\overline{u}_{2}\right\rangle
          =\tfrac{1}{\sqrt6}
          $$

          $$
          \overline{w}_{3}=\left(1,0,1\right)
          -\tfrac12\left(1,1,0\right)-\tfrac16\left(-1,1,2\right)
          =\left(\tfrac23,-\tfrac23,\tfrac23\right)
          $$

          $$
          \left\|\overline{w}_{3}\right\|=\tfrac{2}{\sqrt3}
          \;\Longrightarrow\;
          \overline{u}_{3}=\frac{\left(1,-1,1\right)}{\sqrt3}
          $$

      - tipo: justificar
        pregunta: Ordena el método y su comprobación. Una pieza es falsa.
        piezas:
          - texto: >-
              El primer vector solo se normaliza; el segundo pierde su
              proyección sobre el primero; el tercero, sus proyecciones sobre
              los **dos** anteriores.
          - texto: >-
              Al final hay que comprobar las tres normas y los tres productos
              cruzados: son seis cuentas y cazan casi cualquier error.
          - texto: >-
              La base obtenida genera el mismo subespacio que la de partida —en
              este caso, todo $\mathbb{R}^{3}$—.
          - texto: >-
              Y el resultado depende del orden en que se tomen los vectores de
              partida: con otro orden sale otra base ortonormal, igual de
              válida.
          - texto: >-
              Como la base de partida ya era libre, cada
              $\overline{w}_{k}$ tiene la misma norma que su
              $\overline{v}_{k}$.
            trampa: true
            mensaje: |
              Al restar la proyección, la norma **baja**: por Pitágoras,
              $\left\|\overline{v}_{k}\right\|^{2}
              =\left\|\overline{w}_{k}\right\|^{2}+\left\|
              \text{proyección}\right\|^{2}$. Aquí se ve en los números:
              $\left(0,1,1\right)$ tiene norma $\sqrt2\approx1{,}41$ y
              $\overline{w}_{2}$ tiene $\sqrt{3/2}\approx1{,}22$. Lo único que
              la libertad de la base garantiza es que $\overline{w}_{k}$ no sea
              **nulo**, que es lo que haría fallar el método.
    resolucion: |
      **El método, con las restas creciendo.**

      $$
      \overline{u}_{1}=\frac{\left(1,1,0\right)}{\sqrt2}
      $$

      $$
      \overline{w}_{2}=\left(0,1,1\right)-\tfrac12\left(1,1,0\right)
      =\left(-\tfrac12,\tfrac12,1\right)
      \;\Longrightarrow\;
      \overline{u}_{2}=\frac{\left(-1,1,2\right)}{\sqrt6}
      $$

      $$
      \overline{w}_{3}=\left(1,0,1\right)-\tfrac12\left(1,1,0\right)
      -\tfrac16\left(-1,1,2\right)=\left(\tfrac23,-\tfrac23,\tfrac23\right)
      \;\Longrightarrow\;
      \overline{u}_{3}=\frac{\left(1,-1,1\right)}{\sqrt3}
      $$

      $$
      \boxed{\;\left\{
      \frac{\left(1,1,0\right)}{\sqrt2},
      \ \frac{\left(-1,1,2\right)}{\sqrt6},
      \ \frac{\left(1,-1,1\right)}{\sqrt3}\right\}\;}
      $$

      **Dos costumbres que ahorran errores.** La primera: **multiplicar por lo
      que haga falta antes de normalizar**. La dirección de
      $\left(-\tfrac12,\tfrac12,1\right)$ es la misma que la de
      $\left(-1,1,2\right)$, y con enteros la norma se calcula mejor. La
      segunda: **normalizar solo al final** de cada paso, nunca a medias.

      **Y la comprobación**, que aquí son seis cuentas:

      | | valor |
      |---|---|
      | las tres normas | $1$ |
      | los tres productos cruzados | $0$ |

      **Por qué el tercero necesita dos restas.** Es el error más repetido del
      método: restar solo la proyección sobre el anterior. Con eso el tercero
      queda perpendicular a $\overline{u}_{2}$ y **no** a $\overline{u}_{1}$, y
      la base no es ortogonal. La fórmula resta sobre **todos** los anteriores.

  - id: ejalg6-bol66-el-parametro-que-lo-hace-producto-escalar
    titulo: El parámetro que convierte una forma en producto escalar
    fuente: >-
      Ejercicio 6.6 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada · El boletín lo marca como «ejercicio de examen».
    nivel: practica
    enunciado: |
      Sea $f:\mathbb{R}^{2}\times\mathbb{R}^{2}\longrightarrow\mathbb{R}$ la
      aplicación definida por

      $$
      f\left(\overline{x},\overline{y}\right)
      =\left(x_{1},x_{2}\right)
      \begin{pmatrix}1&1\\\lambda-2&4\lambda\end{pmatrix}
      \begin{pmatrix}y_{1}\\y_{2}\end{pmatrix}
      $$

      a) Hallar el valor de $\lambda$ para que $f$ sea un producto escalar.

      b) Calcular la relación entre $a$ y $b$ para que el vector
      $\left(a,b\right)$ sea ortogonal a $\left(2,1\right)$.
    pide: El valor del parámetro, y la relación entre a y b.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición sobre la matriz hay que imponer **primero**, y por
          qué?
        opciones:
          - texto: >-
              Que sea **simétrica**, porque el producto escalar tiene que serlo
              y eso fija el parámetro de una sola ecuación
            correcta: true
            mensaje: |
              Exacto, y es lo que hace corto el ejercicio: la simetría da
              $1=\lambda-2$, o sea $\lambda=3$, y solo queda comprobar la
              definida positiva para ese valor.
          - texto: >-
              Que el determinante sea no nulo
            mensaje: |
              No basta: hace falta que sea **positivo**, y además que el primer
              menor también lo sea. Y sobre todo, esa condición sola no fija el
              parámetro.
          - texto: >-
              Que la matriz sea la identidad
            mensaje: |
              Eso solo pasaría con el producto usual, y aquí la matriz tiene un
              $1$ fuera de la diagonal que no depende de $\lambda$: nunca puede
              ser la identidad.
          - texto: >-
              Que $\lambda$ sea positivo
            mensaje: |
              El signo de $\lambda$ no es una condición del enunciado. Lo que
              hay que imponer son las propiedades del producto escalar, y la
              primera que muerde es la simetría.

      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          ¿Para qué valor de $\lambda$ es $f$ un producto escalar?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Con $\lambda=2$ la entrada $\left(2,1\right)$ vale
              $\lambda-2=0$, y la $\left(1,2\right)$ vale $1$: la matriz no sale
              simétrica. La ecuación es $1=\lambda-2$.
          - valor: '1'
            mensaje: |
              Con $\lambda=1$ la entrada $\left(2,1\right)$ vale $-1$ y la
              $\left(1,2\right)$ vale $1$: tampoco es simétrica.
          - valor: '0'
            mensaje: |
              Con $\lambda=0$ la matriz sería
              $\begin{pmatrix}1&1\\-2&0\end{pmatrix}$: ni simétrica ni definida
              positiva.
        pista: |
          Iguala la entrada $\left(1,2\right)$ con la $\left(2,1\right)$:
          $1=\lambda-2$.
        desarrollo: |
          **Simetría:**

          $$
          1=\lambda-2
          \;\Longrightarrow\;
          \lambda=3
          $$

          **Y hay que comprobar la definida positiva para ese valor**, que es lo
          que mucha gente se salta. Con $\lambda=3$:

          $$
          A=\begin{pmatrix}1&1\\1&12\end{pmatrix}
          $$

          Menores principales: $1>0$ y $12-1=11>0$. Los dos positivos, luego sí
          es definida positiva.

          $$
          \boxed{\;\lambda=3\;}
          $$

      - tipo: calcular
        titulo: El producto escalar de (1,0) con (2,1)
        pregunta: |
          Con $\lambda=3$, ¿cuánto vale
          $\left\langle\left(1,0\right),\left(2,1\right)\right\rangle$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el producto **usual**: $1\cdot2+0\cdot1$. Aquí hay que
              meter la matriz por medio, y el término cruzado añade $1$.
          - valor: '14'
            mensaje: |
              $14$ es
              $\left\langle\left(0,1\right),\left(2,1\right)\right\rangle$, el
              del otro vector de la base. Con $\left(1,0\right)$ solo interviene
              la primera fila de la matriz.
          - valor: '1'
            mensaje: |
              $1$ sería solo el término $x_{1}y_{1}$. La primera fila de la
              matriz es $\left(1,1\right)$, así que también entra $x_{1}y_{2}$.
        pista: |
          Multiplica $\left(1,0\right)\cdot A$ primero, y el resultado por
          $\left(2,1\right)^{T}$.
        desarrollo: |
          $$
          \left(1,0\right)\begin{pmatrix}1&1\\1&12\end{pmatrix}
          =\left(1,1\right),
          \qquad
          \left(1,1\right)\begin{pmatrix}2\\1\end{pmatrix}=3
          $$

          Y con el otro vector de la base:

          $$
          \left(0,1\right)A=\left(1,12\right),
          \qquad
          \left(1,12\right)\begin{pmatrix}2\\1\end{pmatrix}=14
          $$

          Esos dos números son justo los coeficientes de la relación que pide el
          apartado b).

      - tipo: justificar
        pregunta: Ordena el ejercicio entero. Una pieza es falsa.
        piezas:
          - texto: >-
              Para que $f$ sea producto escalar, su matriz tiene que ser
              simétrica: $1=\lambda-2$, luego $\lambda=3$.
          - texto: >-
              Con ese valor la matriz es
              $\begin{pmatrix}1&1\\1&12\end{pmatrix}$, cuyos menores
              principales valen $1$ y $11$: definida positiva.
          - texto: >-
              Por bilinealidad,
              $\left\langle\left(a,b\right),\left(2,1\right)\right\rangle
              =a\left\langle\left(1,0\right),\left(2,1\right)\right\rangle
              +b\left\langle\left(0,1\right),\left(2,1\right)\right\rangle$.
          - texto: >-
              Esos dos productos valen $3$ y $14$, así que la condición de
              ortogonalidad es $3a+14b=0$.
          - texto: >-
              Y como el vector $\left(2,1\right)$ no es perpendicular a sí mismo
              con el producto usual, tampoco lo es con este.
            trampa: true
            mensaje: |
              La ortogonalidad **depende del producto escalar**, y ese es todo
              el mensaje del ejercicio: con este producto, el vector
              $\left(14,-3\right)$ es perpendicular a $\left(2,1\right)$, y con
              el usual no lo es —su producto usual vale $28-3=25$—. La pieza
              además usa un caso —que ningún vector no nulo es perpendicular a
              sí mismo— que es cierto en **todo** producto escalar por la
              definida positiva, y por tanto no distingue nada.
    resolucion: |
      **a) La simetría fija el parámetro; la definida positiva lo confirma.**

      $$
      A=\begin{pmatrix}1&1\\\lambda-2&4\lambda\end{pmatrix}
      \quad\text{simétrica}\iff
      1=\lambda-2\iff\lambda=3
      $$

      Y con $\lambda=3$:

      $$
      A=\begin{pmatrix}1&1\\1&12\end{pmatrix},
      \qquad
      1>0,\qquad\det A=11>0
      $$

      $$
      \boxed{\;\lambda=3\;}
      $$

      **El paso que no hay que saltarse** es el segundo. La simetría sola no
      basta: si el segundo menor hubiera salido negativo, no habría **ningún**
      valor de $\lambda$ que sirviera, y la respuesta sería «no existe».

      **b) La relación, por bilinealidad.** No hace falta multiplicar matrices
      con letras: basta calcular el producto de los dos vectores de la base
      canónica contra $\left(2,1\right)$ y combinar.

      $$
      \left\langle\left(1,0\right),\left(2,1\right)\right\rangle=3,
      \qquad
      \left\langle\left(0,1\right),\left(2,1\right)\right\rangle=14
      $$

      $$
      \left\langle\left(a,b\right),\left(2,1\right)\right\rangle=3a+14b
      $$

      $$
      \boxed{\;3a+14b=0\;}
      $$

      Por ejemplo, $\left(14,-3\right)$ es perpendicular a
      $\left(2,1\right)$ con este producto escalar.

      **Y eso es lo que hay que llevarse del ejercicio.** Con el producto usual,
      $\left(14,-3\right)$ y $\left(2,1\right)$ **no** son perpendiculares: su
      producto vale $28-3=25$. **La perpendicularidad no es una propiedad de los
      vectores, es una propiedad de los vectores más el producto escalar.**

  - id: ejalg6-bol61-el-producto-usual-es-un-producto-escalar
    titulo: Que el producto de siempre cumple los axiomas
    fuente: >-
      Ejercicio 6.1 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada.
    nivel: practica
    enunciado: |
      $\langle\,,\rangle : \mathbb{R}^{n}\times\mathbb{R}^{n}\longrightarrow
      \mathbb{R}$ es una aplicación definida de la siguiente forma:

      $$
      \langle\bar{x},\bar{y}\rangle = \sum_{i=1}^{n} x_i y_i,
      \qquad
      \bar{x}=(x_1,\ldots,x_n),\;\bar{y}=(y_1,\ldots,y_n)\in\mathbb{R}^{n}
      $$

      Prueba que es un producto escalar definido en $\mathbb{R}^{n}$ y halla la
      norma.
    pide: La comprobación de los axiomas y la norma que induce.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las cuatro condiciones que definen un producto escalar, ¿cuál es
          la que **no** sale sola y hay que mirar con cuidado?
        opciones:
          - texto: >-
              La **definida positiva**: que
              $\langle\bar{x},\bar{x}\rangle>0$ salvo para el vector nulo
            correcta: true
            mensaje: |
              Sí. Simetría y bilinealidad salen de las propiedades de la suma y
              el producto de números, casi sin escribir nada. La definida
              positiva es la que de verdad se comprueba, y la que falla en
              cuanto la fórmula deja de ser una suma de cuadrados.
          - texto: La simetría
            mensaje: |
              La simetría es inmediata aquí: $x_iy_i = y_ix_i$ porque el
              producto de números reales conmuta. No hay nada que decidir.
          - texto: La linealidad en la primera componente
            mensaje: |
              También sale sola, de la distributiva. Lo que separa un producto
              escalar de una forma bilineal cualquiera es la definida positiva.
          - texto: Que el resultado sea un número real
            mensaje: |
              Eso es parte de cómo está definida la aplicación, no una
              condición que haya que probar.

      - tipo: calcular
        titulo: El producto de un vector por sí mismo
        pregunta: |
          Para $\bar{x}=(3,-4)$, ¿cuánto vale
          $\langle\bar{x},\bar{x}\rangle$?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '-7'
            mensaje: |
              Has sumado las coordenadas, $3+(-4)$. El producto escalar
              multiplica cada coordenada **por la suya** y después suma:
              $3\cdot3+(-4)(-4)$.
          - valor: '5'
            mensaje: |
              $5$ es la **norma**, la raíz de 25. El producto de un vector por
              sí mismo es la norma **al cuadrado**.
          - valor: '-12'
            mensaje: |
              $-12$ es $3\cdot(-4)$, el producto cruzado de las dos
              coordenadas. Aquí cada una va con la suya.
        pista: |
          $3\cdot3 + (-4)\cdot(-4)$.
        desarrollo: |
          $$
          \langle\bar{x},\bar{x}\rangle = 3^{2}+(-4)^{2} = 9+16 = 25
          $$

          Positivo, como tiene que ser: es una **suma de cuadrados**, y esa es
          justamente la razón por la que este producto es definido positivo.

      - tipo: justificar
        pregunta: |
          Ordena la comprobación de la definida positiva. Una pieza es falsa.
        piezas:
          - texto: >-
              $\langle\bar{x},\bar{x}\rangle = \sum x_i^{2}$, una suma de
              cuadrados de números reales.
          - texto: >-
              Cada sumando es mayor o igual que cero, así que la suma entera
              también lo es.
          - texto: >-
              Y la suma vale cero solo si **todos** los sumandos valen cero, es
              decir si $x_i = 0$ para todo $i$.
          - texto: >-
              Luego $\langle\bar{x},\bar{x}\rangle > 0$ salvo para el vector
              nulo, que es la definición de definida positiva.
          - texto: >-
              La norma es entonces $\lVert\bar{x}\rVert = \sum x_i^{2}$.
            trampa: true
            mensaje: |
              Falta la raíz. La norma es
              $\lVert\bar{x}\rVert=\sqrt{\langle\bar{x},\bar{x}\rangle}$, y sin
              ella no se cumpliría lo más básico que se le pide a una longitud:
              que la del vector $(1,0)$ valga 1. Con la fórmula sin raíz, un
              vector de coordenadas grandes tendría una «longitud» que crece
              como el cuadrado.

    resolucion: |
      **Las cuatro condiciones, y cuál cuesta.** Un producto escalar es una
      aplicación que a dos vectores les asigna un número, y tiene que ser
      simétrica, lineal en cada componente y **definida positiva**. Las tres
      primeras salen de las propiedades de los números reales; la cuarta es la
      que se comprueba de verdad.

      **Simetría.** $x_iy_i = y_ix_i$ para cada $i$, así que

      $$
      \langle\bar{x},\bar{y}\rangle = \sum x_iy_i = \sum y_ix_i
      = \langle\bar{y},\bar{x}\rangle
      $$

      **Linealidad en la primera componente.** Con
      $\bar{x}=\alpha\bar{u}+\beta\bar{v}$:

      $$
      \sum(\alpha u_i + \beta v_i)y_i
      = \alpha\sum u_iy_i + \beta\sum v_iy_i
      = \alpha\langle\bar{u},\bar{y}\rangle+\beta\langle\bar{v},\bar{y}\rangle
      $$

      Es la distributiva y nada más. Y por la simetría ya probada, la
      linealidad en la segunda sale gratis.

      **Definida positiva**, que es la interesante:

      $$
      \langle\bar{x},\bar{x}\rangle = \sum_{i=1}^{n} x_i^{2}
      $$

      Una **suma de cuadrados** nunca es negativa, y solo vale cero si todos
      los sumandos son cero, o sea si $\bar{x}=\bar{0}$.

      **La norma asociada** es la raíz del producto de un vector por sí mismo:

      $$
      \boxed{\;\lVert\bar{x}\rVert = \sqrt{\langle\bar{x},\bar{x}\rangle}
      = \sqrt{x_1^{2}+\cdots+x_n^{2}}\;}
      $$

      que es exactamente el teorema de Pitágoras en $n$ dimensiones.

      > **Para qué sirve haber hecho este.** Es el producto escalar que todo el
      > mundo da por supuesto, y verlo comprobado deja claro **qué se
      > comprueba**: los otros ejercicios del tema cambian la fórmula —una
      > integral, una traza, una matriz de por medio— y lo único que hay que
      > repetir es esta misma lista de cuatro. Y en el 6.7 hay uno que **no**
      > pasa la última.

  - id: ejalg6-bol62-el-producto-escalar-de-matrices
    titulo: Un producto escalar entre matrices, con la traza
    fuente: >-
      Ejercicio 6.2 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada.
    nivel: practica
    enunciado: |
      Se define el siguiente producto interno:

      $$
      \langle\,,\rangle : \mathcal{M}(n,\mathbb{R})\times
      \mathcal{M}(n,\mathbb{R})\longrightarrow\mathbb{R}
      $$

      $$
      \langle A,B\rangle = \operatorname{traza}\left(A\cdot B^{T}\right)
      = \sum_{i=1}^{n}\sum_{j=1}^{n} a_{ij}b_{ij},
      \qquad A=(a_{ij}),\; B=(b_{ij})
      $$

      $B^{T}$ es la traspuesta de $B$. Comprueba que es un producto escalar
      definido en $\mathcal{M}(n,\mathbb{R})$ y halla la norma que le
      corresponde.
    pide: La comprobación de los axiomas y la norma asociada.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da dos expresiones del mismo producto. ¿Qué gana usar la
          del sumatorio en vez de la de la traza?
        opciones:
          - texto: >-
              Que se ve que es **el producto usual** tratando la matriz como
              una lista de sus $n^{2}$ entradas
            correcta: true
            mensaje: |
              Exacto, y con eso el ejercicio está prácticamente hecho: es el
              6.1 con las entradas puestas en cuadrícula en vez de en fila. La
              traza es solo el envoltorio.
          - texto: Que evita calcular la traspuesta
            mensaje: |
              Es cómodo, sí, pero no es lo que importa. Lo que importa es que
              la suma doble deja a la vista que se están multiplicando entradas
              **en la misma posición**, que es el producto de siempre.
          - texto: Que solo vale para matrices simétricas
            mensaje: |
              Vale para cualquier matriz cuadrada. La traspuesta aparece
              precisamente para emparejar $a_{ij}$ con $b_{ij}$, no para exigir
              simetría.

      - tipo: calcular
        titulo: La norma de una matriz concreta
        pregunta: |
          Para $A=\begin{pmatrix}1&2\\0&2\end{pmatrix}$, ¿cuánto vale
          $\langle A,A\rangle$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Parece que has sumado solo la diagonal, $1+4$. La suma recorre
              **todas** las entradas: $1^2+2^2+0^2+2^2$.
          - valor: '3'
            mensaje: |
              $3$ es la **norma**, la raíz de 9. El producto de una matriz por
              sí misma es la norma al cuadrado.
          - valor: '2'
            mensaje: |
              $2$ es la traza de $A$, que es otra cosa: la suma de su diagonal,
              sin elevar al cuadrado y sin la traspuesta de por medio.
        pista: |
          Suma los cuadrados de las cuatro entradas.
        desarrollo: |
          $$
          \langle A,A\rangle = \sum_{i,j} a_{ij}^{2}
          = 1^{2}+2^{2}+0^{2}+2^{2} = 9
          $$

          Y la norma, $\lVert A\rVert = \sqrt{9} = 3$.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La entrada $(i,i)$ de $A\cdot B^{T}$ es
              $\sum_j a_{ij}b_{ij}$, así que su traza es
              $\sum_i\sum_j a_{ij}b_{ij}$.
          - texto: >-
              Escrito así, es el producto usual sobre las entradas de las dos
              matrices.
          - texto: >-
              Luego hereda la simetría y la bilinealidad del producto usual,
              sin más que comprobar.
          - texto: >-
              Y es definido positivo porque
              $\langle A,A\rangle=\sum a_{ij}^{2}$ es una suma de cuadrados que
              solo se anula con la matriz nula.
          - texto: >-
              Como la traza solo recorre la diagonal, el producto únicamente
              depende de los elementos diagonales de $A$ y de $B$.
            trampa: true
            mensaje: |
              La traza recorre la diagonal **del producto** $A\cdot B^{T}$, no
              la de $A$. Y cada entrada diagonal de ese producto ya lleva dentro
              una fila entera de $A$ por una fila entera de $B$. Por eso el
              resultado depende de las $n^{2}$ entradas y no de $n$: se ve en el
              sumatorio doble del propio enunciado.

    resolucion: |
      **El truco entero está en reescribirlo.** La entrada $(i,i)$ del producto
      $A\cdot B^{T}$ es la fila $i$ de $A$ por la fila $i$ de $B$:

      $$
      \left(A B^{T}\right)_{ii} = \sum_{j} a_{ij}b_{ij}
      $$

      Sumando sobre la diagonal, que es lo que hace la traza:

      $$
      \langle A,B\rangle = \operatorname{traza}\left(AB^{T}\right)
      = \sum_{i}\sum_{j} a_{ij}b_{ij}
      $$

      **Y eso es el producto escalar usual**, aplicado a las $n^{2}$ entradas
      de cada matriz puestas en fila. Así que las cuatro condiciones se heredan
      del 6.1 sin repetir la cuenta: simétrico, lineal en cada componente y

      $$
      \langle A,A\rangle = \sum_{i,j} a_{ij}^{2}
      $$

      que solo se anula cuando **todas** las entradas son cero, o sea con la
      matriz nula.

      **La norma:**

      $$
      \boxed{\;\lVert A\rVert = \sqrt{\operatorname{traza}\left(AA^{T}\right)}
      = \sqrt{\sum_{i,j} a_{ij}^{2}}\;}
      $$

      Se llama **norma de Frobenius**, y es la longitud del vector que resulta
      de estirar la matriz.

      > **Lo que este ejercicio enseña de verdad** no es la traza: es que un
      > espacio de matrices, de polinomios o de funciones se convierte en
      > $\mathbb{R}^{N}$ en cuanto eliges una base. La fórmula parece nueva y
      > es la de siempre con otro disfraz.

  - id: ejalg6-bol63-una-familia-ortogonal-de-funciones
    titulo: Una familia ortogonal, pero de funciones
    fuente: >-
      Ejercicio 6.3 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada.
    nivel: practica
    enunciado: |
      $\langle\,,\rangle:\mathcal{C}\left(\left[0,2\pi\right],\mathbb{R}\right)
      \times\mathcal{C}\left(\left[0,2\pi\right],\mathbb{R}\right)
      \longrightarrow\mathbb{R}$ se define de la siguiente forma:

      $$
      \langle f,g\rangle = \int_{0}^{2\pi} f(x)\cdot g(x)\,dx
      $$

      Comprueba que $S$ es una familia ortogonal:

      $$
      S=\left\{f_0(x)=1,\; f_1(x)=\cos x,\; f_2(x)=\operatorname{sen} x,\;
      f_3(x)=\cos 2x,\right.
      $$

      $$
      \left. f_4(x)=\operatorname{sen} 2x,\;\ldots,\;
      f_{2n-1}(x)=\cos nx,\; f_{2n}(x)=\operatorname{sen} nx\right\}
      $$
    pide: Que todos los productos entre funciones distintas de S valen cero.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa aquí que dos funciones sean **ortogonales**?
        opciones:
          - texto: >-
              Que la integral de su producto sobre
              $\left[0,2\pi\right]$ vale cero
            correcta: true
            mensaje: |
              Eso es, y conviene decirlo en voz alta: «perpendicular» ha dejado
              de significar un ángulo. Significa lo que diga el producto
              escalar que se haya definido, y aquí el producto es una integral.
          - texto: Que sus gráficas se cortan en ángulo recto
            mensaje: |
              Las gráficas no intervienen. Dos funciones ortogonales pueden
              cortarse como sea, o no cortarse: lo único que cuenta es que la
              integral de su producto se anule.
          - texto: Que una es múltiplo de la otra
            mensaje: |
              Eso sería lo contrario: dos funciones proporcionales tienen
              producto escalar **máximo**, no nulo. Son las más «paralelas»
              posibles.

      - tipo: calcular
        titulo: El primer producto que hay que comprobar
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{2\pi} 1\cdot\cos x\,dx$, o sea
          $\langle f_0,f_1\rangle$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es $\int_0^{2\pi}1\,dx$, o sea $\langle f_0,f_0\rangle$.
              Con el coseno dentro la integral se anula: el seno vuelve al
              mismo valor al cabo de un periodo entero.
          - valor: '1'
            mensaje: |
              La primitiva de $\cos x$ es $\operatorname{sen} x$, y hay que
              **evaluarla** entre $0$ y $2\pi$:
              $\operatorname{sen}2\pi-\operatorname{sen}0 = 0$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es lo que valen los productos de una función **por sí
              misma** —$\int_0^{2\pi}\cos^{2}x\,dx=\pi$—, que son justamente
              los que **no** se anulan.
        pista: |
          La primitiva es $\operatorname{sen} x$, y el seno vale lo mismo en
          $0$ que en $2\pi$.
        desarrollo: |
          $$
          \int_{0}^{2\pi}\cos x\,dx
          = \Bigl[\operatorname{sen} x\Bigr]_{0}^{2\pi}
          = \operatorname{sen}2\pi - \operatorname{sen}0 = 0
          $$

      - tipo: justificar
        pregunta: |
          Ordena la comprobación. Una pieza es falsa.
        piezas:
          - texto: >-
              $\langle f_0, f_k\rangle = \int_0^{2\pi}\cos kx\,dx = 0$, y lo
              mismo con el seno: un periodo entero de una sinusoide integra
              cero.
          - texto: >-
              Para dos cosenos distintos se usa
              $\cos a\cos b=\frac12\left[\cos(a-b)+\cos(a+b)\right]$, y las dos
              integrales que quedan son de sinusoides sobre periodos enteros.
          - texto: >-
              El producto de un seno por un coseno es impar respecto del centro
              del intervalo, y su integral también se anula.
          - texto: >-
              Luego todos los productos entre funciones **distintas** de $S$
              valen cero: la familia es ortogonal.
          - texto: >-
              Y como es ortogonal, también es ortonormal.
            trampa: true
            mensaje: |
              Ortogonal no es ortonormal: falta que cada función tenga norma 1,
              y aquí no la tienen. $\lVert f_0\rVert^{2}=2\pi$ y
              $\lVert\cos kx\rVert^{2}=\pi$, así que habría que dividir la
              primera entre $\sqrt{2\pi}$ y las demás entre $\sqrt{\pi}$. Esos
              son exactamente los factores que aparecen en las series de
              Fourier.

    resolucion: |
      **Lo primero, el cambio de significado.** «Ortogonal» aquí no habla de
      ángulos: significa que el producto escalar vale cero, y el producto
      escalar es una integral. Comprobar la familia es comprobar que todas esas
      integrales se anulan.

      **Con la función constante.** Para cualquier $k\ge 1$,

      $$
      \int_{0}^{2\pi}\cos kx\,dx
      = \left[\frac{\operatorname{sen} kx}{k}\right]_{0}^{2\pi} = 0,
      \qquad
      \int_{0}^{2\pi}\operatorname{sen} kx\,dx
      = \left[\frac{-\cos kx}{k}\right]_{0}^{2\pi} = 0
      $$

      porque $\left[0,2\pi\right]$ contiene **un número entero de periodos** de
      cada una: lo que sube por encima del eje es exactamente lo que baja.

      **Entre dos cosenos**, con $m\neq n$, se usa la fórmula del producto:

      $$
      \cos mx\cos nx = \tfrac12\left[\cos(m-n)x + \cos(m+n)x\right]
      $$

      y las dos integrales que quedan vuelven a ser sinusoides sobre periodos
      enteros: cero. Igual con dos senos, usando
      $\operatorname{sen} a\operatorname{sen} b
      =\frac12\left[\cos(a-b)-\cos(a+b)\right]$.

      **Entre un seno y un coseno** el argumento es aún más corto: el producto
      es impar respecto del punto medio del intervalo, así que lo de un lado
      cancela lo del otro.

      $$
      \boxed{\;\langle f_i,f_j\rangle = 0 \text{ para todo } i\neq j\;}
      $$

      > **Dónde reaparece esto.** Esta familia es la base de las **series de
      > Fourier**, y su ortogonalidad es la razón de que los coeficientes se
      > calculen con una integral cada uno, sin resolver ningún sistema: al
      > multiplicar la serie por $\cos kx$ e integrar, **todos** los términos
      > desaparecen menos uno. Es el mismo mecanismo que hace útil una base
      > ortonormal en $\mathbb{R}^{n}$, con funciones en vez de flechas.

  - id: ejalg6-bol641-la-base-que-ya-viene-casi-ortogonal
    titulo: Una base que ya viene casi ortogonal
    fuente: >-
      Ejercicio 6.4, apartado 1 · Boletín de problemas, Espacios vectoriales
      euclídeos · Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Matemática Aplicada.
    nivel: practica
    enunciado: |
      Ortonormaliza la siguiente base, con el producto escalar usual:

      $$
      \left\{\left(2,0,0\right),\left(0,1,2\right),\left(0,0,1\right)\right\}
      $$
    pide: La base ortonormal que resulta.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de aplicar Gram-Schmidt, ¿qué conviene mirar en estos tres
          vectores?
        opciones:
          - texto: >-
              Que los dos primeros **ya son ortogonales**, así que la primera
              proyección sale cero y hay una resta que no hay que hacer
            correcta: true
            mensaje: |
              Eso es. $\langle(2,0,0),(0,1,2)\rangle = 0$, y el método lo
              detecta solo: la proyección vale cero y el segundo vector pasa
              intacto. Mirarlo antes ahorra la cuenta y, sobre todo, avisa de
              si te has equivocado cuando **no** sale cero.
          - texto: Que hay que reordenarlos de menor a mayor norma
            mensaje: |
              El orden se puede cambiar y el resultado sería otra base
              ortonormal igual de válida, pero no hay ninguna regla que obligue
              a ordenarlos por norma.
          - texto: Que el tercero es unitario, así que se puede dejar tal cual
            mensaje: |
              Es unitario, sí, pero eso solo se refiere a su **longitud**. Como
              no es perpendicular al segundo, hay que ortogonalizarlo igual — y
              después volver a normalizar.

      - tipo: calcular
        titulo: El segundo vector de la base
        pregunta: |
          Normalizando $\left(0,1,2\right)$, ¿qué vector sale?
        respuesta:
          tipo: vector
          valor: '(0, 1/√5, 2/√5)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen raíces y fracciones
        distractores:
          - valor: '(0, 1, 2)'
            mensaje: |
              Ese es el de partida. Su norma es $\sqrt{0+1+4}=\sqrt5$, así que
              hay que dividir cada coordenada entre $\sqrt5$.
          - valor: '(0, 1/5, 2/5)'
            mensaje: |
              Has dividido entre $5$, que es la norma **al cuadrado**. La norma
              es $\sqrt5$.
          - valor: '(0, 1/√3, 2/√3)'
            mensaje: |
              La norma no es $\sqrt3$: hay que sumar los **cuadrados**,
              $1^{2}+2^{2}=5$, no las coordenadas.
        pista: |
          La norma de $(0,1,2)$ es $\sqrt{1+4}$.
        desarrollo: |
          El primer vector ya es ortogonal a este, así que no hay nada que
          restar: solo normalizar.

          $$
          \lVert(0,1,2)\rVert = \sqrt{0^{2}+1^{2}+2^{2}} = \sqrt5
          \qquad\Longrightarrow\qquad
          \bar{u}_2 = \left(0,\tfrac{1}{\sqrt5},\tfrac{2}{\sqrt5}\right)
          $$

      - tipo: justificar
        pregunta: |
          Ordena el proceso. Una pieza es falsa.
        piezas:
          - texto: >-
              $\bar{u}_1 = \frac{(2,0,0)}{2} = (1,0,0)$.
          - texto: >-
              $\langle(0,1,2),\bar{u}_1\rangle = 0$, así que el segundo vector
              ya es ortogonal al primero y solo hay que normalizarlo:
              $\bar{u}_2=\left(0,\frac{1}{\sqrt5},\frac{2}{\sqrt5}\right)$.
          - texto: >-
              Para el tercero, $\langle(0,0,1),\bar{u}_1\rangle = 0$ y
              $\langle(0,0,1),\bar{u}_2\rangle = \frac{2}{\sqrt5}$, así que hay
              **una** proyección que restar.
          - texto: >-
              Restando queda $\left(0,-\frac{2}{5},\frac{1}{5}\right)$, de norma
              $\frac{1}{\sqrt5}$, y normalizado
              $\bar{u}_3=\left(0,-\frac{2}{\sqrt5},\frac{1}{\sqrt5}\right)$.
          - texto: >-
              Como los tres vectores de partida ya eran perpendiculares dos a
              dos, bastaba con normalizarlos.
            trampa: true
            mensaje: |
              Los dos primeros sí lo eran, pero el tercero **no**:
              $\langle(0,1,2),(0,0,1)\rangle = 2 \neq 0$. Esa es justamente la
              proyección que hay que restar, y saltársela deja una base que no
              es ortogonal.

    resolucion: |
      **Mirar antes de calcular**, que aquí ahorra la mitad del trabajo:

      $$
      \langle(2,0,0),(0,1,2)\rangle = 0,
      \qquad
      \langle(0,1,2),(0,0,1)\rangle = 2 \neq 0
      $$

      Los dos primeros ya son perpendiculares; el tercero no lo es del segundo.

      **Primero.** Solo normalizar, porque no hay nada anterior:

      $$
      \bar{u}_1 = \frac{(2,0,0)}{2} = (1,0,0)
      $$

      **Segundo.** La proyección sobre $\bar{u}_1$ vale cero, así que pasa
      intacto y solo se normaliza:

      $$
      \bar{u}_2 = \frac{(0,1,2)}{\sqrt5}
      = \left(0,\tfrac{1}{\sqrt5},\tfrac{2}{\sqrt5}\right)
      $$

      **Tercero.** Aquí sí hay que restar, y solo la segunda proyección:

      $$
      \bar{w}_3 = (0,0,1) - \langle(0,0,1),\bar{u}_2\rangle\,\bar{u}_2
      = (0,0,1) - \frac{2}{\sqrt5}\left(0,\tfrac{1}{\sqrt5},\tfrac{2}{\sqrt5}\right)
      = \left(0,-\tfrac{2}{5},\tfrac{1}{5}\right)
      $$

      Su norma es $\sqrt{\frac{4}{25}+\frac{1}{25}}=\frac{1}{\sqrt5}$, así que

      $$
      \bar{u}_3 = \left(0,-\tfrac{2}{\sqrt5},\tfrac{1}{\sqrt5}\right)
      $$

      $$
      \boxed{\;\left\{(1,0,0),\;
      \left(0,\tfrac{1}{\sqrt5},\tfrac{2}{\sqrt5}\right),\;
      \left(0,-\tfrac{2}{\sqrt5},\tfrac{1}{\sqrt5}\right)\right\}\;}
      $$

      **La comprobación de treinta segundos**, y conviene hacerla siempre: los
      tres productos cruzados valen cero y las tres normas valen uno.

      > Fíjate en la forma del tercero: es el segundo con las coordenadas
      > **cambiadas de sitio y una con el signo cambiado**. En el plano
      > $YZ$ eso es girar 90°, y no es casualidad: en dos dimensiones solo hay
      > una dirección perpendicular a una dada, salvo el signo.

  - id: ejalg6-bol643-gram-schmidt-en-cuatro-dimensiones
    titulo: Gram-Schmidt con vectores de cuatro coordenadas
    fuente: >-
      Ejercicio 6.4, apartado 3 · Boletín de problemas, Espacios vectoriales
      euclídeos · Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) ·
      Departamento de Matemática Aplicada.
    nivel: practica
    enunciado: |
      Ortonormaliza la siguiente base, con el producto escalar usual:

      $$
      \left\{\left(1,1,0,-1\right),\left(1,0,0,4\right),
      \left(2,0,1,-1\right)\right\}
      $$
    pide: La familia ortonormal que resulta.

    pasos:
      - tipo: reconocer
        pregunta: |
          Son **tres** vectores de **cuatro** coordenadas. ¿Qué se obtiene al
          ortonormalizarlos?
        opciones:
          - texto: >-
              Una base ortonormal del **subespacio de dimensión 3** que generan,
              no de $\mathbb{R}^{4}$ entero
            correcta: true
            mensaje: |
              Exacto, y es una distinción que el examen aprovecha. Gram-Schmidt
              no inventa direcciones: devuelve tantos vectores como le das, y
              generan exactamente lo mismo que los de partida.
          - texto: Una base ortonormal de $\mathbb{R}^{4}$
            mensaje: |
              Harían falta **cuatro** vectores independientes para eso. Con tres
              solo se llega a un hiperplano.
          - texto: Cuatro vectores, porque el espacio tiene dimensión 4
            mensaje: |
              El método no añade vectores: transforma los que hay. De tres
              entran tres y salen tres.

      - tipo: calcular
        titulo: La norma del primero
        pregunta: |
          ¿Cuánto vale $\lVert(1,1,0,-1)\rVert^{2}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Parece que has sumado las coordenadas, $1+1+0-1$. La norma al
              cuadrado suma los **cuadrados**, y el signo desaparece.
          - valor: '4'
            mensaje: |
              Has contado el $0$ como si aportara. Son $1+1+0+1$, y eso da 3.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ es la **norma**, no su cuadrado. La pregunta pide el
              cuadrado precisamente porque es lo que aparece en la fórmula de
              la proyección.
        pista: |
          $1^{2}+1^{2}+0^{2}+(-1)^{2}$.
        desarrollo: |
          $$
          \lVert(1,1,0,-1)\rVert^{2} = 1+1+0+1 = 3
          \qquad\Longrightarrow\qquad
          \bar{u}_1 = \frac{1}{\sqrt3}\left(1,1,0,-1\right)
          $$

      - tipo: justificar
        pregunta: |
          Ordena el proceso. Una pieza es falsa.
        piezas:
          - texto: >-
              $\bar{u}_1 = \frac{1}{\sqrt3}(1,1,0,-1)$, normalizando el primero.
          - texto: >-
              $\langle(1,0,0,4),\bar{u}_1\rangle = \frac{1-4}{\sqrt3}
              = -\frac{3}{\sqrt3} = -\sqrt3$, así que la proyección **no** es
              cero y hay que restarla.
          - texto: >-
              $\bar{w}_2 = (1,0,0,4) + (1,1,0,-1) = (2,1,0,3)$, que ya es
              perpendicular a $\bar{u}_1$.
          - texto: >-
              Se normaliza: $\lVert(2,1,0,3)\rVert = \sqrt{14}$, luego
              $\bar{u}_2 = \frac{1}{\sqrt{14}}(2,1,0,3)$.
          - texto: >-
              Al tercero hay que restarle solo la proyección sobre
              $\bar{u}_2$, porque $\bar{u}_1$ ya se usó en el paso anterior.
            trampa: true
            mensaje: |
              Se restan las proyecciones sobre **todos** los anteriores, sin
              excepción. Que $\bar{u}_1$ se haya usado antes no lo agota: el
              tercer vector tiene que quedar perpendicular a los dos, y para eso
              hay que restarle las dos proyecciones.

    resolucion: |
      **El primero**, normalizado sin más:

      $$
      \lVert(1,1,0,-1)\rVert = \sqrt3,
      \qquad
      \bar{u}_1 = \tfrac{1}{\sqrt3}\left(1,1,0,-1\right)
      $$

      **El segundo.** Su proyección sobre $\bar{u}_1$ no es cero:

      $$
      \langle(1,0,0,4),\bar{u}_1\rangle
      = \frac{1\cdot1+0\cdot1+0\cdot0+4\cdot(-1)}{\sqrt3}
      = \frac{-3}{\sqrt3} = -\sqrt3
      $$

      $$
      \bar{w}_2 = (1,0,0,4) - \left(-\sqrt3\right)\bar{u}_1
      = (1,0,0,4) + (1,1,0,-1) = (2,1,0,3)
      $$

      Comprobación de un segundo: $\langle(2,1,0,3),(1,1,0,-1)\rangle
      = 2+1+0-3 = 0$ ✓

      $$
      \lVert(2,1,0,3)\rVert = \sqrt{4+1+0+9} = \sqrt{14},
      \qquad
      \bar{u}_2 = \tfrac{1}{\sqrt{14}}\left(2,1,0,3\right)
      $$

      **El tercero**, restando las **dos** proyecciones:

      $$
      \langle(2,0,1,-1),\bar{u}_1\rangle = \frac{2+0+0+1}{\sqrt3} = \sqrt3,
      \qquad
      \langle(2,0,1,-1),\bar{u}_2\rangle = \frac{4+0+0-3}{\sqrt{14}}
      = \frac{1}{\sqrt{14}}
      $$

      $$
      \bar{w}_3 = (2,0,1,-1) - (1,1,0,-1)
      - \tfrac{1}{14}(2,1,0,3)
      = \left(\tfrac{6}{7},-\tfrac{15}{14},1,-\tfrac{3}{14}\right)
      $$

      Y normalizándolo se obtiene $\bar{u}_3$.

      > **La comprobación que evita rehacerlo entero.** Después de cada resta,
      > multiplica el vector recién obtenido por los anteriores: tiene que dar
      > cero. Si no da, el error está en ese paso y no en los siguientes, y eso
      > ahorra buscarlo en toda la cuenta. En cuatro coordenadas y con
      > fracciones, es la diferencia entre corregir una línea y repetirlo todo.

  - id: ejalg6-bol65-ortonormalizar-polinomios
    titulo: Ortonormalizar polinomios, con una integral por producto
    fuente: >-
      Ejercicio 6.5 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada.
    nivel: practica
    enunciado: |
      Se define el siguiente producto escalar entre polinomios de grado menor o
      igual a 2, $P_2[x]$:

      $$
      \langle p(x),q(x)\rangle = \int_{-1}^{1} p(x)\cdot q(x)\,dx
      $$

      Ortonormaliza la base $\left\{1,\;x,\;x^{2}\right\}$.
    pide: La base ortonormal de P₂[x] con ese producto.

    pasos:
      - tipo: reconocer
        pregunta: |
          El intervalo de integración es simétrico. ¿Qué se puede decir **sin
          integrar** de $\langle 1, x\rangle$?
        opciones:
          - texto: >-
              Que vale cero, porque el integrando es una función **impar** sobre
              un intervalo simétrico
            correcta: true
            mensaje: |
              Eso es, y es el atajo que ahorra media hoja: cualquier producto
              entre un polinomio par y uno impar se anula solo. Aquí se anulan
              $\langle 1,x\rangle$ y $\langle x,x^{2}\rangle$ de golpe.
          - texto: Que vale $2$, la longitud del intervalo
            mensaje: |
              $2$ es $\langle 1,1\rangle=\int_{-1}^{1}dx$. Con la $x$ dentro el
              integrando cambia de signo en el origen y las dos mitades se
              cancelan.
          - texto: Que no se puede saber sin calcular la integral
            mensaje: |
              Sí se puede: el integrando es $x$, impar, y el intervalo es
              simétrico. Reconocer la paridad es parte del método aquí.

      - tipo: calcular
        titulo: El primer polinomio de la base
        pregunta: |
          $\langle 1,1\rangle = \int_{-1}^{1} dx = 2$. Normalizando el
          polinomio constante $1$, ¿por qué número hay que dividir?
        respuesta:
          tipo: numero
          valor: '1.4142136'
          tolerancia: 0.0005
          formato: en forma exacta (sqrt(2)), o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $\lVert 1\rVert^{2}$, el producto del polinomio por sí
              mismo. La norma es su **raíz**.
          - valor: '1'
            mensaje: |
              Si la norma fuera 1 no habría nada que normalizar, pero
              $\int_{-1}^{1}dx = 2 \neq 1$. El polinomio constante $1$ **no** es
              unitario con este producto.
          - valor: '0.7071068'
            mensaje: |
              $\frac{1}{\sqrt2}$ es el resultado final, el polinomio ya
              normalizado. La pregunta es por el número entre el que se divide.
        pista: |
          La norma es la raíz del producto por sí mismo.
        desarrollo: |
          $$
          \lVert 1\rVert = \sqrt{\langle 1,1\rangle}
          = \sqrt{\int_{-1}^{1} 1\,dx} = \sqrt{2}
          \qquad\Longrightarrow\qquad
          u_0(x) = \frac{1}{\sqrt2}
          $$

      - tipo: justificar
        pregunta: |
          Ordena el proceso. Una pieza es falsa.
        piezas:
          - texto: >-
              $\langle 1,1\rangle = 2$, luego $u_0 = \frac{1}{\sqrt2}$.
          - texto: >-
              $\langle x,1\rangle = 0$ por paridad, así que $x$ ya es ortogonal
              al primero: solo se normaliza.
          - texto: >-
              $\langle x,x\rangle = \int_{-1}^{1}x^{2}dx = \frac23$, luego
              $u_1 = \sqrt{\tfrac32}\,x$.
          - texto: >-
              Para $x^{2}$, la proyección sobre $u_1$ es cero por paridad, pero
              la de $u_0$ **no**: $\langle x^{2},1\rangle = \frac23$.
          - texto: >-
              Como $x^{2}$ es par y $u_0$ también, sus productos se anulan y no
              hay nada que restar.
            trampa: true
            mensaje: |
              Al revés. Lo que se anula es el producto de una función **par**
              por una **impar**. Dos pares se multiplican y dan una par, cuya
              integral sobre un intervalo simétrico es el **doble** de la mitad
              — no cero. Ahí está justamente la única proyección que hay que
              restar en todo el ejercicio.

    resolucion: |
      **La paridad hace casi todo el trabajo.** El intervalo es simétrico, así
      que el producto de un polinomio par por uno impar integra cero:

      $$
      \langle 1,x\rangle = 0,
      \qquad
      \langle x,x^{2}\rangle = 0
      $$

      Solo queda un producto cruzado que no se anula, y es el único sitio donde
      hay que restar algo.

      **El primero.** $\langle 1,1\rangle = \int_{-1}^{1}dx = 2$:

      $$
      u_0(x) = \frac{1}{\sqrt2}
      $$

      **El segundo.** Ya es ortogonal al primero, así que solo se normaliza:

      $$
      \langle x,x\rangle = \int_{-1}^{1}x^{2}dx = \frac23
      \qquad\Longrightarrow\qquad
      u_1(x) = \sqrt{\frac32}\,x
      $$

      **El tercero.** La proyección sobre $u_1$ es cero por paridad; la de
      $u_0$, no:

      $$
      \langle x^{2},u_0\rangle
      = \frac{1}{\sqrt2}\int_{-1}^{1}x^{2}dx = \frac{2}{3\sqrt2}
      $$

      $$
      w_2(x) = x^{2} - \frac{2}{3\sqrt2}\cdot\frac{1}{\sqrt2}
      = x^{2}-\frac13
      $$

      Y su norma:

      $$
      \langle w_2,w_2\rangle = \int_{-1}^{1}\left(x^{2}-\tfrac13\right)^{2}dx
      = \frac{8}{45}
      \qquad\Longrightarrow\qquad
      u_2(x) = \sqrt{\frac{45}{8}}\left(x^{2}-\frac13\right)
      $$

      $$
      \boxed{\;\left\{\frac{1}{\sqrt2},\;\sqrt{\tfrac32}\,x,\;
      \sqrt{\tfrac{45}{8}}\left(x^{2}-\tfrac13\right)\right\}\;}
      $$

      > **Estos polinomios tienen nombre.** Salvo la normalización son los
      > **polinomios de Legendre**, y aparecen en cuanto hay que aproximar una
      > función por otra de grado bajo en $[-1,1]$. Que salgan de aplicar
      > Gram-Schmidt a $\{1,x,x^{2}\}$ es la forma más rápida de ver de dónde
      > vienen: no son una lista que alguien inventó, son lo que queda al
      > exigirle a las potencias que sean perpendiculares entre sí.

  - id: ejalg6-bol67-el-que-no-es-producto-escalar
    titulo: El que dice ser producto escalar y no lo es
    fuente: >-
      Ejercicio 6.7 · Boletín de problemas, Espacios vectoriales euclídeos ·
      Álgebra, Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Departamento de
      Matemática Aplicada · **El enunciado va tal cual, y la expresión que da
      no es un producto escalar**: está explicado en la resolución.
    nivel: practica
    enunciado: |
      1. Define: producto escalar, norma asociada, vectores ortogonales.

         Prueba:

         (a) $\lVert\bar{u}\rVert=\lVert\bar{v}\rVert=1$ y
         $\langle\bar{u},\bar{v}\rangle=0
         \Rightarrow \lVert\bar{u}-\bar{v}\rVert=\sqrt2$

         (b) $\langle\bar{u},\bar{v}\rangle
         = \frac14\lVert\bar{u}+\bar{v}\rVert^{2}
         - \frac14\lVert\bar{u}-\bar{v}\rVert^{2}$

      2. En $\mathbb{R}^{3}$ se define el producto escalar:

      $$
      \langle(x_1,x_2,x_3),(y_1,y_2,y_3)\rangle
      = x_1y_1 + 2x_1y_2 + 2x_2y_1 + x_3y_3
      $$

         Halla una base de $\mathbb{R}^{3}$ ortonormal respecto a este producto
         escalar.
    pide: Las definiciones, las dos demostraciones, y la base ortonormal del apartado 2.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de ponerte con Gram-Schmidt en el apartado 2, ¿qué hay que
          comprobar de la expresión que da el enunciado?
        opciones:
          - texto: >-
              Que sea **definida positiva**, porque si no lo es no hay norma y
              no se puede normalizar nada
            correcta: true
            mensaje: |
              Exacto, y aquí no lo es. Sin definida positiva no hay
              $\lVert\bar{x}\rVert=\sqrt{\langle\bar{x},\bar{x}\rangle}$: la
              raíz de un número negativo no existe, y el método se queda sin
              primer paso.
          - texto: Que la matriz asociada sea simétrica
            mensaje: |
              Lo es —el coeficiente de $x_1y_2$ y el de $x_2y_1$ valen los dos
              2— y aun así falla, así que la simetría no basta. Lo que falla es
              otra condición.
          - texto: 'Nada: si el enunciado dice «producto escalar», lo es'
            mensaje: |
              Un enunciado puede equivocarse, y este se equivoca. Comprobarlo
              cuesta dos determinantes y es exactamente lo que el apartado 1 te
              acaba de pedir que definas.

      - tipo: calcular
        titulo: El vector que lo delata
        pregunta: |
          Con esa expresión, ¿cuánto vale
          $\langle(0,1,0),(0,1,0)\rangle$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Sería 1 con el producto **usual**, pero aquí no hay término
              $x_2y_2$: mira la fórmula. Con $x_1=x_3=0$ todos los sumandos se
              anulan.
          - valor: '2'
            mensaje: |
              El $2$ multiplica a $x_1y_2$ y a $x_2y_1$, y las dos llevan un
              subíndice 1 que aquí vale cero.
          - valor: '4'
            mensaje: |
              No hay ningún término que sobreviva: los cuatro sumandos tienen
              un factor $x_1$, $y_1$ o $x_3$, y todos valen cero.
        pista: |
          Sustituye $x_1=0$, $x_2=1$, $x_3=0$ en los cuatro sumandos.
        desarrollo: |
          $$
          \langle(0,1,0),(0,1,0)\rangle
          = 0\cdot0 + 2\cdot0\cdot1 + 2\cdot1\cdot0 + 0\cdot0 = 0
          $$

          Un vector **no nulo** con producto por sí mismo igual a cero. Eso
          basta para que no sea definido positivo, y por tanto para que no sea
          un producto escalar.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado 2. Una pieza es falsa.
        piezas:
          - texto: >-
              La matriz asociada es
              $\begin{pmatrix}1&2&0\\2&0&0\\0&0&1\end{pmatrix}$, simétrica.
          - texto: >-
              Su menor principal de orden 2 vale
              $1\cdot0-2\cdot2 = -4 < 0$, así que la forma **no** es definida
              positiva.
          - texto: >-
              El contraejemplo más corto es $(0,1,0)$: no es el vector nulo y su
              producto por sí mismo vale $0$.
          - texto: >-
              Luego la expresión no es un producto escalar, y la pregunta no
              tiene respuesta tal como está planteada.
          - texto: >-
              Aun así se puede aplicar Gram-Schmidt, porque el método solo
              necesita que la forma sea bilineal y simétrica.
            trampa: true
            mensaje: |
              Gram-Schmidt divide por la norma en cada paso, y la norma es
              $\sqrt{\langle\bar{x},\bar{x}\rangle}$. Con esta forma ese número
              puede ser cero —como en $(0,1,0)$— o negativo —en $(1,-1,0)$ vale
              $1-2-2=-3$—, así que el método se rompe en el primer paso: o
              divide entre cero, o pide la raíz de un negativo.

    resolucion: |
      **Las definiciones del apartado 1**, que valen puntos por sí solas:

      - **Producto escalar**: aplicación
        $\langle\,,\rangle: V\times V\to\mathbb{R}$ simétrica, lineal en cada
        componente y **definida positiva**
        —$\langle\bar{x},\bar{x}\rangle>0$ para todo $\bar{x}\neq\bar{0}$—.
      - **Norma asociada**:
        $\lVert\bar{x}\rVert = \sqrt{\langle\bar{x},\bar{x}\rangle}$, que
        existe **porque** el producto es definido positivo.
      - **Vectores ortogonales**: los que cumplen
        $\langle\bar{u},\bar{v}\rangle = 0$.

      **(a)** Desarrollando la norma al cuadrado por bilinealidad:

      $$
      \lVert\bar{u}-\bar{v}\rVert^{2}
      = \lVert\bar{u}\rVert^{2} - 2\langle\bar{u},\bar{v}\rangle
      + \lVert\bar{v}\rVert^{2}
      = 1 - 0 + 1 = 2
      $$

      y tomando raíces, $\lVert\bar{u}-\bar{v}\rVert=\sqrt2$. Es el teorema de
      Pitágoras escrito con productos escalares.

      **(b)** Las dos normas desarrolladas se diferencian solo en el signo del
      término cruzado:

      $$
      \lVert\bar{u}+\bar{v}\rVert^{2} - \lVert\bar{u}-\bar{v}\rVert^{2}
      = 4\langle\bar{u},\bar{v}\rangle
      $$

      Dividiendo entre 4 sale la igualdad pedida. **Lo que dice** es que el
      producto escalar se puede recuperar solo con longitudes: la norma
      determina el producto, no solo al revés.

      ### El apartado 2, y por qué no tiene la respuesta que pide

      La forma del enunciado tiene por matriz

      $$
      A = \begin{pmatrix}1&2&0\\2&0&0\\0&0&1\end{pmatrix}
      $$

      Es simétrica y bilineal, pero **no es definida positiva**, y hay dos
      formas de verlo en diez segundos:

      - el menor principal de orden 2 vale $1\cdot0 - 2\cdot2 = -4 < 0$;
      - o directamente, $\langle(0,1,0),(0,1,0)\rangle = 0$ con un vector que
        **no** es el nulo. Y peor: $\langle(1,-1,0),(1,-1,0)\rangle = -3$, un
        «cuadrado» negativo.

      $$
      \boxed{\;\text{No es un producto escalar, así que no hay base ortonormal
      respecto a él.}\;}
      $$

      > **Esto es una errata del boletín, y se reproduce tal cual a propósito**
      > (§08). Falta un término $x_2y_2$: con
      > $x_1y_1+2x_1y_2+2x_2y_1+5x_2y_2+x_3y_3$ los tres menores serían $1$,
      > $1$ y $1$, y entonces sí. Se deja el enunciado como está porque el
      > ejercicio que sale es **mejor** que el que se pretendía: la respuesta
      > correcta no es una base, es darse cuenta de que no la hay — y eso es
      > exactamente lo que el apartado 1 acaba de pedirte definir.
      >
      > Si en un examen te encuentras algo así, la respuesta que puntúa es
      > escribir el contraejemplo. Un vector no nulo con producto por sí mismo
      > menor o igual que cero cierra la cuestión en una línea.
