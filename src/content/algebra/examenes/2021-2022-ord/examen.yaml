# Cuadernillo bilingüe, con el euskera PRIMERO: la página 1 es la versión en
# euskera y la 2 la castellana. En los cuadernillos de 2022-2023 en adelante es
# al revés. Se transcribe desde la castellana, como siempre.
#
# Y este examen está compuesto con LaTeX, no con el editor de ecuaciones de
# Word. Se nota: `pdftotext -enc UTF-8` respeta los signos y no hay que ir a la
# imagen a leerlos. Las dos matrices sí se han contrastado con la página
# renderizada, porque `-layout` sigue apilándolas mal.
#
# El ejercicio 3 es el único de las ocho convocatorias que define un producto
# escalar DISTINTO del habitual —$x_1y_1-x_1y_2-x_2y_1+2x_2y_2+2x_3y_3$— y pide
# ortonormalizar con él. Es el ejercicio que más rinde del tema 6, porque separa
# a quien ha entendido qué es un producto escalar de quien ha memorizado el
# usual.
#
# Como todos los de Álgebra, no publica reparto de puntos.
pdf: 2021-2022-ord.pdf

