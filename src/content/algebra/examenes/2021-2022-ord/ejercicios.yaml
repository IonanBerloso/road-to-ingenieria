ejercicios:
  - id: exalg2122-ord-1-simetricas-y-antisimetricas-parten-el-espacio
    titulo: Las simétricas y las antisimétricas se reparten el espacio
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, curso 2021-2022 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) i. Demuestra que si $S$ y $T$ son subespacios del espacio vectorial
      $E$, con sistemas generadores
      $G_{S}=\left\{\overline{u}_{1},\overline{u}_{2},\dots,
      \overline{u}_{n}\right\}$ y
      $G_{T}=\left\{\overline{v}_{1},\overline{v}_{2},\dots,
      \overline{v}_{m}\right\}$, entonces $G_{S}\cup G_{T}$ es sistema
      generador de $S+T$.

      ii. Sean $S$ y $T$ subespacios vectoriales de $\mathbb{R}^{10}$, con
      $\dim\left(S\right)=2$ y $\dim\left(T\right)=7$. Calcula las posibles
      dimensiones para los subespacios $S\cap T$ y $S+T$.

      b) Se definen en el espacio vectorial
      $\mathcal{M}\left(2\times2,\mathbb{R}\right)$ de las matrices cuadradas
      reales de orden $2$ los siguientes conjuntos:

      $$
      U=\left\{A\in\mathcal{M}\left(2\times2,\mathbb{R}\right)
      \;\Big|\;A\text{ simétrica}\right\}
      $$

      $$
      V=\left\{B\in\mathcal{M}\left(2\times2,\mathbb{R}\right)
      \;\Big|\;B\text{ antisimétrica}\right\}
      $$

      i. Demuestra que $U$ y $V$ son subespacios vectoriales.

      ii. Calcula las bases y dimensiones de $U$, $V$, $U+V$ y $U\cap V$.

      iii. Calcula las coordenadas de la matriz
      $\begin{pmatrix}-2&2\\4&1\end{pmatrix}$ respecto de la base de $U+V$ que
      has obtenido.
    pide: La demostración, las dimensiones posibles, y las cuatro bases con unas coordenadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con $\dim S=2$ y $\dim T=7$ dentro de $\mathbb{R}^{10}$, ¿qué acota
          por abajo la dimensión de $S\cap T$?
        opciones:
          - texto: >-
              Que $S+T$ no puede pasar de $10$: como
              $\dim\left(S+T\right)=9-\dim\left(S\cap T\right)$ y $9\leq10$, la
              intersección puede llegar a valer $0$
            correcta: true
            mensaje: |
              Exacto, y esa es la lectura fina del ejercicio. Grassmann dice
              $\dim\left(S+T\right)=2+7-\dim\left(S\cap T\right)$; el espacio
              ambiente pone el techo. Aquí $9\leq10$, así que el techo **no
              obliga a nada** y la intersección puede ser trivial. Si $T$
              tuviera dimensión $9$, la cosa cambiaría.
          - texto: >-
              Nada: dos subespacios cualesquiera siempre se cortan solo en el
              cero
            mensaje: |
              No es cierto ni siquiera aquí: $S$ podría estar contenido en $T$,
              y entonces $S\cap T=S$ tendría dimensión $2$. Lo que hay son
              varias posibilidades, no una sola.
          - texto: >-
              Que la intersección vale siempre $\dim S+\dim T-10=-1$
            mensaje: |
              Una dimensión no puede ser negativa, y eso ya avisa de que la
              cota no muerde. Cuando $\dim S+\dim T\leq n$, la cota inferior de
              Grassmann se queda por debajo de cero y el mínimo real es $0$.
          - texto: >-
              Que $S+T$ es todo $\mathbb{R}^{10}$
            mensaje: |
              $S+T$ tiene como mucho dimensión $9$, así que **nunca** es todo
              $\mathbb{R}^{10}$: la suma de un subespacio de dimensión $2$ y
              otro de $7$ no llega a llenar diez dimensiones.

      - tipo: calcular
        titulo: La dimensión de las simétricas
        pregunta: |
          ¿Cuál es la dimensión de $U$, el subespacio de las matrices
          simétricas de orden $2$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es la dimensión de
              $\mathcal{M}\left(2\times2,\mathbb{R}\right)$ entero. La simetría
              impone una condición, $b=c$, y eso quita exactamente un grado de
              libertad.
          - valor: '2'
            mensaje: |
              $2$ dejaría fuera uno de los tres parámetros. Una simétrica de
              orden $2$ es
              $\begin{pmatrix}a&b\\b&d\end{pmatrix}$: son $a$, $b$ y $d$, tres
              números libres.
          - valor: '1'
            mensaje: |
              $1$ es la dimensión de las **antisimétricas**, que sí tienen un
              solo grado de libertad porque la diagonal se les anula.
        pista: |
          Escribe una simétrica genérica de orden $2$ y cuenta cuántos números
          puedes elegir libremente.
        desarrollo: |
          Una matriz simétrica de orden $2$ tiene la forma

          $$
          \begin{pmatrix}a&b\\b&d\end{pmatrix}
          =a\begin{pmatrix}1&0\\0&0\end{pmatrix}
          +b\begin{pmatrix}0&1\\1&0\end{pmatrix}
          +d\begin{pmatrix}0&0\\0&1\end{pmatrix}
          $$

          Tres matrices independientes, luego $\dim U=3$. Y una antisimétrica
          es
          $\begin{pmatrix}0&b\\-b&0\end{pmatrix}$ —la diagonal se anula porque
          $a_{ii}=-a_{ii}$—, así que $\dim V=1$.

      - tipo: calcular
        titulo: Las coordenadas en la base de la suma
        pregunta: |
          Con la base de $U+V$ formada por
          $\begin{pmatrix}1&0\\0&0\end{pmatrix}$,
          $\begin{pmatrix}0&1\\1&0\end{pmatrix}$,
          $\begin{pmatrix}0&0\\0&1\end{pmatrix}$ y
          $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$, en ese orden, ¿cuáles son
          las coordenadas de $\begin{pmatrix}-2&2\\4&1\end{pmatrix}$?
        respuesta:
          tipo: vector
          valor: '(-2, 3, 1, -1)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(-2, 2, 1, 4)'
            mensaje: |
              Has copiado las entradas de la matriz en vez de resolver. Las
              coordenadas segunda y cuarta salen de un sistema: la entrada
              $\left(1,2\right)$ vale $b+d$ y la $\left(2,1\right)$ vale $b-d$,
              con $b$ y $d$ los coeficientes que buscas.
          - valor: '(-2, 3, 1, 1)'
            mensaje: |
              El signo de la última. De $b+d=2$ y $b-d=4$ sale $d=-1$: la parte
              antisimétrica va **restando**, porque la entrada de abajo es
              mayor que la de arriba.
          - valor: '(-2, 1, 3, -1)'
            mensaje: |
              Las dos de en medio cambiadas. El orden de la base es
              $a$ —entrada $\left(1,1\right)$—, $b$ —la simétrica de fuera—,
              luego la entrada $\left(2,2\right)$, y por último la
              antisimétrica.
        pista: |
          Toda matriz se parte en simétrica más antisimétrica:
          $M=\tfrac{1}{2}\left(M+M^{T}\right)
          +\tfrac{1}{2}\left(M-M^{T}\right)$.
        desarrollo: |
          Escribiendo la combinación genérica:

          $$
          a\begin{pmatrix}1&0\\0&0\end{pmatrix}
          +b\begin{pmatrix}0&1\\1&0\end{pmatrix}
          +c\begin{pmatrix}0&0\\0&1\end{pmatrix}
          +d\begin{pmatrix}0&1\\-1&0\end{pmatrix}
          =\begin{pmatrix}a&b+d\\b-d&c\end{pmatrix}
          $$

          e igualando a $\begin{pmatrix}-2&2\\4&1\end{pmatrix}$:

          | entrada | ecuación | despejado |
          |---|---|---|
          | $\left(1,1\right)$ | $a=-2$ | $a=-2$ |
          | $\left(2,2\right)$ | $c=1$ | $c=1$ |
          | $\left(1,2\right)$ y $\left(2,1\right)$ | $b+d=2$, $b-d=4$ | $b=3$, $d=-1$ |

          $$
          \boxed{\;\left(-2,3,1,-1\right)\;}
          $$

          Es lo mismo que partir la matriz en su parte simétrica
          $\tfrac{1}{2}\left(M+M^{T}\right)
          =\begin{pmatrix}-2&3\\3&1\end{pmatrix}$ y su parte antisimétrica
          $\tfrac{1}{2}\left(M-M^{T}\right)
          =\begin{pmatrix}0&-1\\1&0\end{pmatrix}$.

      - tipo: justificar
        pregunta: >-
          Ordena el cálculo de $U+V$ y $U\cap V$. Una pieza es falsa.
        piezas:
          - texto: >-
              $U\cap V$ son las matrices simétricas y antisimétricas a la vez:
              $A^{T}=A$ y $A^{T}=-A$, luego $A=-A$ y $A=0$.
          - texto: >-
              Por tanto $U\cap V=\left\{0\right\}$ y $\dim\left(U\cap
              V\right)=0$: la suma es **directa**.
          - texto: >-
              Por Grassmann,
              $\dim\left(U+V\right)=3+1-0=4$.
          - texto: >-
              Y como $\mathcal{M}\left(2\times2,\mathbb{R}\right)$ tiene
              dimensión $4$, la suma es el espacio entero: toda matriz se parte
              de forma única en simétrica más antisimétrica.
          - texto: >-
              Esa descomposición es única porque la base elegida es
              ortonormal.
            trampa: true
            mensaje: |
              La unicidad no viene de ninguna ortonormalidad: viene de que la
              suma es **directa**, o sea de que la intersección es nula. Aquí
              ni siquiera se ha definido un producto escalar sobre las
              matrices, así que hablar de base ortonormal no significa nada.
              Es la confusión más habitual del tema: «descomponer de forma
              única» suena a proyección ortogonal, y no lo es.
    resolucion: |
      **a) i. La unión de generadores genera la suma.** Todo vector de $S+T$
      es $\overline{s}+\overline{t}$; escribiendo cada sumando sobre su
      sistema generador queda una combinación lineal de los
      $\overline{u}_{i}$ y los $\overline{v}_{j}$ a la vez, o sea, de
      $G_{S}\cup G_{T}$. Y al revés: toda combinación de esos vectores se
      agrupa en «los de $S$» más «los de $T$», que está en $S+T$.

      Ojo con lo que **no** dice: la unión es sistema generador, pero no tiene
      por qué ser base. Si $S$ y $T$ se cortan, sobran vectores.

      **a) ii. Las dimensiones posibles.** Grassmann fija la relación:

      $$
      \dim\left(S+T\right)=2+7-\dim\left(S\cap T\right)
      =9-\dim\left(S\cap T\right)
      $$

      La intersección está dentro de $S$, así que su dimensión va de $0$ a
      $2$; y $S+T$ cabe en $\mathbb{R}^{10}$, cosa que aquí no restringe nada
      porque $9\leq10$. Quedan tres casos:

      | $\dim\left(S\cap T\right)$ | $\dim\left(S+T\right)$ | cuándo |
      |---|---|---|
      | $0$ | $9$ | $S$ y $T$ solo comparten el cero |
      | $1$ | $8$ | comparten una recta |
      | $2$ | $7$ | $S\subset T$ |

      **b) i. Los dos son subespacios.** Ninguno es vacío —la matriz nula es
      simétrica y antisimétrica—, y trasponer es lineal:
      $\left(\alpha A+\beta B\right)^{T}=\alpha A^{T}+\beta B^{T}$. Si $A$ y
      $B$ cumplen $X^{T}=X$, la combinación también; y lo mismo con el signo
      menos.

      **b) ii. Bases y dimensiones.**

      $$
      U=L\left(\left\{
      \begin{pmatrix}1&0\\0&0\end{pmatrix},
      \begin{pmatrix}0&1\\1&0\end{pmatrix},
      \begin{pmatrix}0&0\\0&1\end{pmatrix}\right\}\right),
      \qquad\dim U=3
      $$

      $$
      V=L\left(\left\{\begin{pmatrix}0&1\\-1&0\end{pmatrix}\right\}\right),
      \qquad\dim V=1
      $$

      La intersección se calcula en una línea: si $A^{T}=A$ y $A^{T}=-A$,
      entonces $A=-A$, luego $A=0$.

      $$
      \boxed{\;U\cap V=\left\{0\right\},\quad
      U\oplus V=\mathcal{M}\left(2\times2,\mathbb{R}\right),\quad
      \dim\left(U+V\right)=4\;}
      $$

      **Y esto es un resultado con nombre, no una coincidencia:** toda matriz
      cuadrada se escribe de forma única como simétrica más antisimétrica,

      $$
      M=\underbrace{\tfrac{1}{2}\left(M+M^{T}\right)}_{\text{simétrica}}
      +\underbrace{\tfrac{1}{2}\left(M-M^{T}\right)}_{\text{antisimétrica}}
      $$

      **b) iii. Las coordenadas.** Uniendo las dos bases y resolviendo:

      $$
      \begin{pmatrix}-2&2\\4&1\end{pmatrix}
      =-2\begin{pmatrix}1&0\\0&0\end{pmatrix}
      +3\begin{pmatrix}0&1\\1&0\end{pmatrix}
      +1\begin{pmatrix}0&0\\0&1\end{pmatrix}
      -1\begin{pmatrix}0&1\\-1&0\end{pmatrix}
      $$

      $$
      \boxed{\;\left(-2,3,1,-1\right)\;}
      $$

  - id: exalg2122-ord-2-tres-datos-cruzados-y-el-nucleo-por-ecuaciones
    titulo: Tres imágenes mezcladas, y un núcleo dado por ecuaciones
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, curso 2021-2022 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) Demuestra que la aplicación lineal $f:V\longrightarrow V'$ es
      inyectiva si y solo si $\ker\left(f\right)=\left\{\overline{0}\right\}$.

      b) Sea
      $\left\{\overline{e}_{1},\overline{e}_{2},
      \overline{e}_{3},\overline{e}_{4}\right\}$ una base de $\mathbb{R}^{4}$.
      Consideramos $f:\mathbb{R}^{4}\longrightarrow\mathbb{R}^{3}$, la
      aplicación lineal que verifica las siguientes propiedades:

      $$
      f\left(\overline{e}_{1}\right)=\left(0,1,2\right);
      \quad
      f\left(\overline{e}_{2}+\overline{e}_{3}\right)=\left(0,-1,0\right);
      $$

      $$
      f\left(\overline{e}_{1}+\overline{e}_{2}-\overline{e}_{3}\right)
      =\left(-2,-2,0\right)
      $$

      $$
      \operatorname{Ker}\left(f\right)
      =\left\{\left(x,y,z,t\right)\;\Big|\;x=z=0;\;y-z-t=0\right\}
      $$

      i. Calcula la matriz asociada a $f$.

      ii. Calcula las bases y dimensiones de $\operatorname{Im}f$ y
      $\ker f$.

      iii. Clasifica la aplicación $f$.
    pide: La demostración, la matriz, las dos bases y la clasificación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El núcleo viene dado por ecuaciones: $x=z=0$ y $y-z-t=0$. ¿Qué
          aporta ese dato al cálculo de la matriz?
        opciones:
          - texto: >-
              Un cuarto vector con imagen conocida: el generador del núcleo va
              al $\overline{0}$, y con los otros tres datos ya hay cuatro
              condiciones
            correcta: true
            mensaje: |
              Eso es. Con $x=0$, $z=0$ y $y=t$, el núcleo es la recta generada
              por $\left(0,1,0,1\right)$, así que
              $f\left(\overline{e}_{2}+\overline{e}_{4}\right)=\overline{0}$.
              Es la cuarta ecuación, y sin ella el sistema no se cierra.
          - texto: >-
              Solo sirve para el apartado ii, cuando toca dar su base
            mensaje: |
              Se puede leer así y se llega a un callejón: con las tres
              primeras condiciones hay tres ecuaciones y cuatro incógnitas
              vectoriales. El núcleo es un dato **de entrada**, no un
              resultado.
          - texto: >-
              Dice que $f$ no es sobreyectiva
            mensaje: |
              Dice lo contrario, y conviene verlo: si el núcleo tiene dimensión
              $1$, la imagen tiene $4-1=3$, o sea todo $\mathbb{R}^{3}$. Es
              sobreyectiva.
          - texto: >-
              Que la matriz es de orden $4\times4$
            mensaje: |
              La matriz es $3\times4$: cuatro columnas por la base de partida y
              tres filas por el espacio de llegada. El núcleo no cambia el
              orden de la matriz.

      - tipo: calcular
        titulo: La imagen del segundo vector de la base
        pregunta: |
          De $f\left(\overline{e}_{2}+\overline{e}_{3}\right)
          =\left(0,-1,0\right)$ y
          $f\left(\overline{e}_{1}+\overline{e}_{2}-\overline{e}_{3}\right)
          =\left(-2,-2,0\right)$, ¿cuánto vale
          $f\left(\overline{e}_{2}\right)$?
        respuesta:
          tipo: vector
          valor: '(-1, -2, -1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(-2, -4, -2)'
            mensaje: |
              Ese es el doble, es decir
              $f\left(\overline{e}_{2}\right)+f\left(\overline{e}_{3}\right)$
              sumado a $f\left(\overline{e}_{2}\right)
              -f\left(\overline{e}_{3}\right)$ **sin dividir entre dos**.
          - valor: '(1, 1, 1)'
            mensaje: |
              Ese es $f\left(\overline{e}_{3}\right)$, el otro de la pareja.
              Sale de restar: $f\left(\overline{e}_{3}\right)
              =\left(0,-1,0\right)-f\left(\overline{e}_{2}\right)$.
          - valor: '(-2, -3, -2)'
            mensaje: |
              Esa es la **diferencia**
              $f\left(\overline{e}_{2}\right)-f\left(\overline{e}_{3}\right)$,
              que sale de restar
              $f\left(\overline{e}_{1}\right)$ al tercer dato. Falta sumarle la
              suma y dividir entre dos.
        pista: |
          Del tercer dato, restando el primero, sale
          $f\left(\overline{e}_{2}\right)-f\left(\overline{e}_{3}\right)$. Con
          la suma ya conocida, tienes un sistema de dos ecuaciones.
        desarrollo: |
          Llamando $\overline{u}=f\left(\overline{e}_{2}\right)$ y
          $\overline{v}=f\left(\overline{e}_{3}\right)$:

          $$
          \overline{u}+\overline{v}=\left(0,-1,0\right)
          $$

          $$
          \overline{u}-\overline{v}
          =\left(-2,-2,0\right)-\left(0,1,2\right)
          =\left(-2,-3,-2\right)
          $$

          Sumando y dividiendo entre dos:

          $$
          \overline{u}=\tfrac{1}{2}\left(-2,-4,-2\right)
          =\left(-1,-2,-1\right),
          \qquad
          \overline{v}=\left(1,1,1\right)
          $$

      - tipo: calcular
        titulo: La matriz asociada
        pregunta: |
          La matriz de $f$ en esas bases. Escribe las filas separadas por punto
          y coma.
        respuesta:
          tipo: matriz
          valor: '[0, -1, 1, 1; 1, -2, 1, 2; 2, -1, 1, 1]'
          tolerancia: 0.001
          formato: tres filas de cuatro números, con punto y coma entre filas
        distractores:
          - valor: '[0, 1, 2; -1, -2, -1; 1, 1, 1; 1, 2, 1]'
            mensaje: |
              Es la **traspuesta**: cada imagen en una fila. Van en columnas, y
              además el orden queda $4\times3$ en vez de $3\times4$.
          - valor: '[0, -1, 1, -1; 1, -2, 1, -2; 2, -1, 1, -1]'
            mensaje: |
              La cuarta columna con el signo cambiado. Del núcleo sale
              $f\left(\overline{e}_{2}\right)+f\left(\overline{e}_{4}\right)
              =\overline{0}$, luego $f\left(\overline{e}_{4}\right)
              =-f\left(\overline{e}_{2}\right)=\left(1,2,1\right)$: es el
              **opuesto** de la segunda columna, y la segunda ya es negativa.
          - valor: '[0, -1, 1, 0; 1, -2, 1, 0; 2, -1, 1, 0]'
            mensaje: |
              La cuarta columna no es nula: lo que va al cero es
              $\overline{e}_{2}+\overline{e}_{4}$, no $\overline{e}_{4}$
              solo.
        pista: |
          Las cuatro columnas son
          $f\left(\overline{e}_{1}\right)$, $f\left(\overline{e}_{2}\right)$,
          $f\left(\overline{e}_{3}\right)$ y
          $f\left(\overline{e}_{4}\right)$, esta última sacada del núcleo.
        desarrollo: |
          El núcleo, resuelto: $x=0$, $z=0$ y $y=t$, o sea la recta generada
          por $\left(0,1,0,1\right)$. Eso significa

          $$
          f\left(\overline{e}_{2}\right)+f\left(\overline{e}_{4}\right)
          =\overline{0}
          \;\Longrightarrow\;
          f\left(\overline{e}_{4}\right)=\left(1,2,1\right)
          $$

          Y con las cuatro imágenes en columna:

          $$
          A=\begin{pmatrix}
          0&-1&1&1\\
          1&-2&1&2\\
          2&-1&1&1
          \end{pmatrix}
          $$

          Se comprueba contra los cuatro datos, incluido el del núcleo:
          $A\left(0,1,0,1\right)^{T}=\overline{0}$.

      - tipo: calcular
        titulo: La dimensión de la imagen
        pregunta: |
          ¿Cuánto vale $\dim\operatorname{Im}f$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ dejaría el núcleo en dimensión $2$, y el enunciado lo da de
              dimensión $1$: las ecuaciones $x=0$, $z=0$, $y=t$ dejan un solo
              parámetro libre.
          - valor: '4'
            mensaje: |
              La imagen vive dentro de $\mathbb{R}^{3}$, así que no puede tener
              dimensión $4$ por muy grande que sea el espacio de partida.
          - valor: '1'
            mensaje: |
              $1$ es la dimensión del **núcleo**. Las dos suman $4$, la
              dimensión del espacio de partida.
        pista: |
          El núcleo tiene dimensión $1$ y el espacio de partida $4$.
        desarrollo: |
          $$
          \dim\operatorname{Im}f=4-\dim\ker f=4-1=3
          $$

          y como $\mathbb{R}^{3}$ tiene dimensión $3$, la imagen es **todo el
          espacio de llegada**. Se ve también en la matriz: sus tres primeras
          columnas tienen determinante $2\neq0$, así que ya son base de
          $\mathbb{R}^{3}$.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a): inyectiva si y solo si el
          núcleo es nulo. Una pieza es falsa.
        piezas:
          - texto: >-
              Si $f$ es inyectiva y $\overline{x}$ está en el núcleo, entonces
              $f\left(\overline{x}\right)=\overline{0}
              =f\left(\overline{0}\right)$, luego
              $\overline{x}=\overline{0}$.
          - texto: >-
              Al revés: si el núcleo es nulo y
              $f\left(\overline{x}\right)=f\left(\overline{y}\right)$, la
              linealidad da
              $f\left(\overline{x}-\overline{y}\right)=\overline{0}$.
          - texto: >-
              Entonces $\overline{x}-\overline{y}$ está en el núcleo, que solo
              contiene al cero, así que $\overline{x}=\overline{y}$.
          - texto: >-
              Las dos implicaciones juntas dan la equivalencia.
          - texto: >-
              Y en particular, toda aplicación lineal con núcleo nulo es
              biyectiva.
            trampa: true
            mensaje: |
              Núcleo nulo da inyectividad, no biyectividad: falta la
              sobreyectividad, que aquí ni siquiera se ha mencionado. La
              inclusión de $\mathbb{R}^{2}$ en $\mathbb{R}^{3}$ tiene núcleo
              nulo y no es biyectiva. Las dos coinciden **solo** cuando los dos
              espacios tienen la misma dimensión, y este mismo ejercicio va de
              dimensión $4$ a dimensión $3$.
    resolucion: |
      **a) La equivalencia, en dos direcciones cortas.** Si $f$ es inyectiva y
      $f\left(\overline{x}\right)=\overline{0}$, como también
      $f\left(\overline{0}\right)=\overline{0}$, la inyectividad obliga a
      $\overline{x}=\overline{0}$. Y al revés, si el núcleo es nulo y dos
      vectores tienen la misma imagen,

      $$
      f\left(\overline{x}\right)=f\left(\overline{y}\right)
      \;\Longrightarrow\;
      f\left(\overline{x}-\overline{y}\right)=\overline{0}
      \;\Longrightarrow\;
      \overline{x}-\overline{y}=\overline{0}
      $$

      La linealidad es lo que permite pasar de «dos imágenes iguales» a «una
      imagen nula», y es el único paso que hay que recordar.

      **b) El núcleo es el cuarto dato.** Resolviendo sus ecuaciones —$x=0$,
      $z=0$ y $y=t$— sale la recta generada por $\left(0,1,0,1\right)$, es
      decir

      $$
      \ker f=L\left(\left\{\overline{e}_{2}+\overline{e}_{4}\right\}\right)
      \;\Longrightarrow\;
      f\left(\overline{e}_{4}\right)=-f\left(\overline{e}_{2}\right)
      $$

      Con eso ya hay cuatro condiciones para cuatro imágenes.

      **i. La matriz.** Del segundo y el tercer dato sale un sistema de dos
      ecuaciones en $f\left(\overline{e}_{2}\right)$ y
      $f\left(\overline{e}_{3}\right)$:

      $$
      f\left(\overline{e}_{2}\right)+f\left(\overline{e}_{3}\right)
      =\left(0,-1,0\right),
      \qquad
      f\left(\overline{e}_{2}\right)-f\left(\overline{e}_{3}\right)
      =\left(-2,-3,-2\right)
      $$

      $$
      f\left(\overline{e}_{2}\right)=\left(-1,-2,-1\right),
      \qquad
      f\left(\overline{e}_{3}\right)=\left(1,1,1\right),
      \qquad
      f\left(\overline{e}_{4}\right)=\left(1,2,1\right)
      $$

      $$
      \boxed{\;A=\begin{pmatrix}
      0&-1&1&1\\
      1&-2&1&2\\
      2&-1&1&1
      \end{pmatrix}\;}
      $$

      **ii. Bases y dimensiones.**

      $$
      \ker f=L\left(\left\{\left(0,1,0,1\right)\right\}\right),
      \quad\dim=1;
      \qquad
      \operatorname{Im}f=\mathbb{R}^{3},\quad\dim=3
      $$

      La imagen es todo $\mathbb{R}^{3}$ porque las tres primeras columnas de
      $A$ tienen determinante $2\neq0$, y por tanto ya generan.

      **iii. Clasificación.** $f$ es **sobreyectiva pero no inyectiva**. Y las
      dos cosas se sabían antes de calcular: yendo de dimensión $4$ a
      dimensión $3$, la inyectividad es imposible; y con el núcleo de
      dimensión $1$, la imagen tiene que llenar las tres dimensiones que
      quedan.

  - id: exalg2122-ord-3-ortonormalizar-con-un-producto-escalar-que-no-es-el-de-siempre
    titulo: Ortonormalizar cuando el producto escalar está torcido
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, curso 2021-2022 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · Es el único de las ocho
      convocatorias que define un producto escalar distinto del usual · El
      examen no publica solución ni reparto de puntos: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sean $\overline{u}$ y $\overline{v}$ dos vectores del espacio
      vectorial euclídeo $V$. Demuestra:

      i. $\left\|\overline{u}+\overline{v}\right\|
      \leq\left\|\overline{u}\right\|+\left\|\overline{v}\right\|$

      ii. $\left\|\overline{u}+\overline{v}\right\|^{2}
      =\left\|\overline{u}\right\|^{2}+\left\|\overline{v}\right\|^{2}
      \iff\overline{u}$ y $\overline{v}$ son vectores ortogonales.

      b) Se define en el espacio vectorial euclídeo $\mathbb{R}^{3}$ el
      siguiente producto escalar:

      $$
      \left\langle\left(x_{1},x_{2},x_{3}\right),
      \left(y_{1},y_{2},y_{3}\right)\right\rangle
      =x_{1}y_{1}-x_{1}y_{2}-x_{2}y_{1}+2x_{2}y_{2}+2x_{3}y_{3}
      $$

      i. Utilizando este producto escalar, calcula una base ortonormal para el
      subespacio
      $S=\left\{\left(x,y,z\right)\;\Big|\;-2x+2y-z=0\right\}$.

      ii. Completa la base calculada en el apartado anterior hasta conseguir
      una base ortonormal de $\mathbb{R}^{3}$.
    pide: Las dos demostraciones, y las dos bases ortonormales con el producto dado.

    pasos:
      - tipo: reconocer
        pregunta: |
          El producto escalar del enunciado no es el usual. ¿Qué cambia eso en
          el procedimiento de Gram-Schmidt?
        opciones:
          - texto: >-
              Nada del procedimiento: cambian solo los números, porque
              Gram-Schmidt está escrito con $\left\langle\cdot,
              \cdot\right\rangle$ y sirve para cualquier producto escalar
            correcta: true
            mensaje: |
              Exacto, y ese es el fondo del ejercicio. Gram-Schmidt no sabe si
              el producto es el usual: solo usa que sea bilineal, simétrico y
              definido positivo. Lo único que hay que tener cuidado es de no
              volver a $\sqrt{x^{2}+y^{2}+z^{2}}$ por costumbre.
          - texto: >-
              Que ya no se puede ortonormalizar, porque el producto no es el
              euclídeo
            mensaje: |
              Sí se puede: el enunciado lo llama producto escalar y el espacio,
              euclídeo. Cualquier producto escalar define su propia noción de
              ángulo y de longitud, y Gram-Schmidt funciona con todas.
          - texto: >-
              Que hay que pasar antes los vectores a la base canónica
            mensaje: |
              Ya están en la base canónica: el producto se da por sus
              coordenadas en ella. Lo que cambia no son los vectores, es cómo
              se miden.
          - texto: >-
              Que la ortogonalidad geométrica se conserva, solo cambian las
              normas
            mensaje: |
              Cambian las dos cosas.
              $\left(1,1,0\right)$ y $\left(1,0,0\right)$ son perpendiculares
              con este producto —sale $1-1=0$— y no lo son con el usual. La
              ortogonalidad depende del producto.

      - tipo: calcular
        titulo: La norma del primer generador
        pregunta: |
          Tomando $\overline{w}_{1}=\left(1,0,-2\right)$, que está en $S$,
          ¿cuánto vale $\left\|\overline{w}_{1}\right\|$ con este producto
          escalar?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2.2360680'
            mensaje: |
              $\sqrt{5}$ es la norma **usual**, la de
              $\sqrt{1+0+4}$. Con este producto hay que usar la fórmula del
              enunciado: el término $2x_{3}y_{3}$ dobla la aportación de la
              tercera coordenada.
          - valor: '9'
            mensaje: |
              $9$ es
              $\left\|\overline{w}_{1}\right\|^{2}$, el producto del vector por
              sí mismo. La norma es su raíz cuadrada.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt{3}$ saldría de haber contado la tercera coordenada sin el
              factor $2$ y con signo cambiado en algún término. Sustituye
              despacio: $x_{1}=y_{1}=1$, $x_{2}=y_{2}=0$, $x_{3}=y_{3}=-2$.
        pista: |
          Sustituye $\overline{x}=\overline{y}=\left(1,0,-2\right)$ en la
          fórmula. Los términos con $x_{2}$ se anulan.
        desarrollo: |
          $$
          \left\langle\left(1,0,-2\right),\left(1,0,-2\right)\right\rangle
          =1\cdot1-1\cdot0-0\cdot1+2\cdot0\cdot0+2\left(-2\right)\left(-2\right)
          =1+8=9
          $$

          $$
          \left\|\overline{w}_{1}\right\|=3,
          \qquad
          \overline{u}_{1}=\left(\tfrac{1}{3},0,-\tfrac{2}{3}\right)
          $$

          Que la norma salga entera no es casualidad: el examen está diseñado
          para hacerse sin calculadora, y el segundo vector saldrá con norma
          $1$ de fábrica.

      - tipo: calcular
        titulo: El segundo vector de la base de S
        pregunta: |
          Ortogonalizando $\left(0,1,2\right)$ respecto de
          $\overline{u}_{1}$ y normalizando, ¿cuál es el segundo vector de la
          base ortonormal de $S$?
        respuesta:
          tipo: vector
          valor: '(1, 1, 0)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(0, 1, 2)'
            mensaje: |
              Ese es el vector de partida, sin ortogonalizar. Su producto
              escalar con $\overline{u}_{1}$ vale $-3$, bien lejos de cero.
          - valor: '(1/3, 0, -2/3)'
            mensaje: |
              Ese es $\overline{u}_{1}$, el primero. El segundo tiene que ser
              perpendicular a él **con este producto**.
          - valor: '(0.7071068, 0.7071068, 0)'
            mensaje: |
              Has normalizado con la norma **usual**, dividiendo por
              $\sqrt{2}$. Con el producto del enunciado,
              $\left(1,1,0\right)$ ya tiene norma $1$:
              $1-1-1+2=1$.
        pista: |
          Calcula $\left\langle\left(0,1,2\right),
          \overline{u}_{1}\right\rangle$ y réstale esa proyección. El resultado
          sale sorprendentemente limpio.
        desarrollo: |
          La proyección:

          $$
          \left\langle\left(0,1,2\right),
          \left(\tfrac{1}{3},0,-\tfrac{2}{3}\right)\right\rangle
          =0-0-\tfrac{1}{3}+0+2\cdot2\cdot\left(-\tfrac{2}{3}\right)
          =-\tfrac{1}{3}-\tfrac{8}{3}=-3
          $$

          $$
          \overline{w}_{2}=\left(0,1,2\right)-\left(-3\right)
          \left(\tfrac{1}{3},0,-\tfrac{2}{3}\right)
          =\left(0,1,2\right)+\left(1,0,-2\right)=\left(1,1,0\right)
          $$

          Y su norma:

          $$
          \left\langle\left(1,1,0\right),\left(1,1,0\right)\right\rangle
          =1-1-1+2+0=1
          $$

          o sea que **ya es unitario** y no hay que dividir por nada:

          $$
          \overline{u}_{2}=\left(1,1,0\right)
          $$

          Con la norma usual valdría $\sqrt{2}$, y ahí es donde se cuela el
          error de este ejercicio.

      - tipo: calcular
        titulo: La dirección que completa la base
        pregunta: |
          El tercer vector tiene que ser ortogonal a $\overline{u}_{1}$ y a
          $\overline{u}_{2}$ con este producto. ¿Qué dirección sale, tomando la
          de coordenadas enteras más pequeñas y primera coordenada positiva?
        respuesta:
          tipo: vector
          valor: '(4, 0, 1)'
          tolerancia: 0.001
          formato: tres coordenadas enteras entre paréntesis
        distractores:
          - valor: '(2, 2, 1)'
            mensaje: |
              Ese es el producto **vectorial** de los dos primeros, que sirve
              con el producto escalar usual y no con este. Aquí hay que
              imponer las dos ecuaciones a mano.
          - valor: '(1, 0, 4)'
            mensaje: |
              Las coordenadas primera y tercera cambiadas. De
              $\left\langle\overline{x},\overline{u}_{1}\right\rangle=0$ sale
              $x-y-4z=0$, así que con $y=0$ queda $x=4z$: la primera es la
              grande.
          - valor: '(4, 1, 0)'
            mensaje: |
              La segunda coordenada tiene que ser cero. De
              $\left\langle\overline{x},\left(1,1,0\right)\right\rangle=0$ sale
              directamente $y=0$, porque los términos en $x$ se cancelan entre
              sí.
        pista: |
          Impón las dos ecuaciones
          $\left\langle\overline{x},\overline{u}_{1}\right\rangle=0$ y
          $\left\langle\overline{x},\overline{u}_{2}\right\rangle=0$. La
          segunda es sorprendentemente corta.
        desarrollo: |
          Con $\overline{x}=\left(x,y,z\right)$, la condición contra
          $\overline{u}_{2}=\left(1,1,0\right)$:

          $$
          x\cdot1-x\cdot1-y\cdot1+2y\cdot1+0=y=0
          $$

          Los dos términos en $x$ se cancelan y queda $y=0$ directamente. Y
          contra $\overline{u}_{1}=\left(\tfrac{1}{3},0,-\tfrac{2}{3}\right)$:

          $$
          \tfrac{x}{3}-0-\tfrac{y}{3}+0-\tfrac{4z}{3}=0
          \;\Longrightarrow\;
          x-y-4z=0
          \;\Longrightarrow\;
          x=4z
          $$

          La dirección es $\left(4,0,1\right)$. Su norma:

          $$
          \left\langle\left(4,0,1\right),\left(4,0,1\right)\right\rangle
          =16+2=18,
          \qquad
          \left\|\left(4,0,1\right)\right\|=3\sqrt{2}
          $$

          $$
          \overline{u}_{3}=\left(\tfrac{2\sqrt{2}}{3},0,
          \tfrac{\sqrt{2}}{6}\right)
          $$

      - tipo: justificar
        pregunta: >-
          Ordena la demostración de la desigualdad triangular. Una pieza es
          falsa.
        piezas:
          - texto: >-
              Se desarrolla el cuadrado:
              $\left\|\overline{u}+\overline{v}\right\|^{2}
              =\left\|\overline{u}\right\|^{2}
              +2\left\langle\overline{u},\overline{v}\right\rangle
              +\left\|\overline{v}\right\|^{2}$.
          - texto: >-
              Por Cauchy-Schwarz,
              $\left\langle\overline{u},\overline{v}\right\rangle
              \leq\left\|\overline{u}\right\|\left\|\overline{v}\right\|$.
          - texto: >-
              Sustituyendo, el miembro de la izquierda queda acotado por
              $\left(\left\|\overline{u}\right\|
              +\left\|\overline{v}\right\|\right)^{2}$.
          - texto: >-
              Y como las normas no son negativas, se puede tomar raíz cuadrada
              en los dos lados sin cambiar el sentido.
          - texto: >-
              La desigualdad es estricta salvo que $\overline{u}$ y
              $\overline{v}$ sean ortogonales.
            trampa: true
            mensaje: |
              Es al revés de lo que dice la pieza. La igualdad se alcanza
              cuando los dos vectores son **proporcionales con el mismo
              sentido** —el caso de igualdad de Cauchy-Schwarz—, no cuando son
              ortogonales. Con ortogonales la desigualdad es estricta y lo que
              vale es Pitágoras, que es el apartado ii. La pieza confunde los
              dos casos extremos del mismo teorema.
    resolucion: |
      **a) i. La desigualdad triangular.** Se desarrolla el cuadrado y se acota
      el término cruzado con Cauchy-Schwarz:

      $$
      \left\|\overline{u}+\overline{v}\right\|^{2}
      =\left\|\overline{u}\right\|^{2}
      +2\left\langle\overline{u},\overline{v}\right\rangle
      +\left\|\overline{v}\right\|^{2}
      \leq\left\|\overline{u}\right\|^{2}
      +2\left\|\overline{u}\right\|\left\|\overline{v}\right\|
      +\left\|\overline{v}\right\|^{2}
      $$

      El miembro derecho es
      $\left(\left\|\overline{u}\right\|
      +\left\|\overline{v}\right\|\right)^{2}$, y como las normas no son
      negativas se toma raíz cuadrada.

      **a) ii. Pitágoras.** El mismo desarrollo, ahora exigiendo la igualdad:
      sobra $2\left\langle\overline{u},\overline{v}\right\rangle$, y anularlo
      es exactamente la ortogonalidad. Como todos los pasos son equivalencias,
      la doble implicación sale de una vez.

      **b) El producto escalar está torcido, y ahí está la gracia.** La
      fórmula del enunciado se puede leer con su matriz:

      $$
      \left\langle\overline{x},\overline{y}\right\rangle
      =\overline{x}^{T}
      \begin{pmatrix}1&-1&0\\-1&2&0\\0&0&2\end{pmatrix}
      \overline{y}
      $$

      Gram-Schmidt funciona igual —solo necesita bilinealidad, simetría y ser
      definido positivo—, pero **hay que usar esta norma y no la de siempre**.
      Ese es el error que este ejercicio caza.

      **i. La base ortonormal de $S$.** El plano $-2x+2y-z=0$ se parametriza
      con $z=-2x+2y$, y dos generadores cómodos son
      $\left(1,0,-2\right)$ y $\left(0,1,2\right)$.

      $$
      \left\|\left(1,0,-2\right)\right\|^{2}=1+8=9
      \;\Longrightarrow\;
      \overline{u}_{1}=\left(\tfrac{1}{3},0,-\tfrac{2}{3}\right)
      $$

      $$
      \left\langle\left(0,1,2\right),\overline{u}_{1}\right\rangle=-3
      \;\Longrightarrow\;
      \overline{w}_{2}=\left(0,1,2\right)+\left(1,0,-2\right)
      =\left(1,1,0\right)
      $$

      $$
      \left\|\left(1,1,0\right)\right\|^{2}=1-1-1+2=1
      \;\Longrightarrow\;
      \boxed{\;\overline{u}_{2}=\left(1,1,0\right)\;}
      $$

      El segundo sale unitario sin dividir por nada, y con la norma usual
      valdría $\sqrt{2}$: es la comprobación de que se está usando el producto
      correcto.

      **ii. Completar a base de $\mathbb{R}^{3}$.** Se imponen las dos
      condiciones de ortogonalidad y sale un sistema muy corto:

      | contra | ecuación | sale |
      |---|---|---|
      | $\overline{u}_{2}=\left(1,1,0\right)$ | $y=0$ | $y=0$ |
      | $\overline{u}_{1}$ | $x-y-4z=0$ | $x=4z$ |

      La dirección es $\left(4,0,1\right)$, de norma
      $\sqrt{18}=3\sqrt{2}$:

      $$
      \boxed{\;\overline{u}_{3}=\left(\tfrac{2\sqrt{2}}{3},0,
      \tfrac{\sqrt{2}}{6}\right)\;}
      $$

      La base ortonormal de $\mathbb{R}^{3}$ es
      $\left\{\overline{u}_{1},\overline{u}_{2},\overline{u}_{3}\right\}$, y
      $\overline{u}_{3}$ genera además $S^{\perp}$ **con este producto** — que
      no es la recta que daría el producto usual.

  - id: exalg2122-ord-4-una-simetrica-con-tres-autovalores-limpios
    titulo: Una simétrica, y por qué sus direcciones salen perpendiculares
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, curso 2021-2022 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) i. Dado el endomorfismo $f:E\longrightarrow E$, demuestra que el
      subconjunto de $E$ formado por los autovectores asociados a un autovalor
      $\lambda$ junto con el vector $\overline{0}$,
      $S=\left\{\overline{x}\in E-\left\{\overline{0}\right\}
      \;\Big|\;f\left(\overline{x}\right)=\lambda\overline{x}\right\}
      \cup\left\{\overline{0}\right\}$, es subespacio vectorial.

      ii. Demuestra que si $\overline{x}$ es autovector de la matriz $A$
      asociado a un valor propio $\lambda$, también es autovector de las
      matrices $A^{2}$ y $A^{3}$. Di cuál es, en cada caso, el autovalor
      asociado.

      b) Obtén una base ortonormal de $\mathbb{R}^{3}$ formada por autovectores
      de la siguiente matriz y da la fórmula de la diagonalización:

      $$
      G=\begin{pmatrix}3&1&1\\1&1&1\\1&1&1\end{pmatrix}
      $$
    pide: Las dos demostraciones, y la base ortonormal con la fórmula.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide una base **ortonormal** de autovectores. ¿Por qué
          se puede prometer eso de antemano en esta matriz?
        opciones:
          - texto: >-
              Porque $G$ es simétrica, y toda matriz simétrica real admite una
              base ortonormal de autovectores
            correcta: true
            mensaje: |
              Exacto. Es el teorema espectral, y es el que justifica que el
              enunciado pueda pedirlo sin condiciones. En una matriz
              cualquiera, ni siquiera está garantizado que haya base de
              autovectores.
          - texto: >-
              Porque su determinante es cero
            mensaje: |
              El determinante nulo solo dice que $0$ es autovalor. No garantiza
              ni la diagonalización ni la ortogonalidad de las direcciones.
          - texto: >-
              Porque toda matriz $3\times3$ tiene tres autovalores distintos
            mensaje: |
              Ni son siempre tres distintos ni siempre reales. Que aquí salgan
              tres limpios es una propiedad de esta matriz, y la ortogonalidad
              viene de la simetría, no del recuento.
          - texto: >-
              Porque sus filas suman lo mismo
            mensaje: |
              No suman lo mismo: la primera suma $5$ y las otras dos, $3$. Y
              aunque sumaran igual, eso solo daría un autovector concreto, no
              una base ortonormal.

      - tipo: calcular
        titulo: El autovalor que delata el determinante
        pregunta: |
          Las filas segunda y tercera de $G$ son iguales. ¿Qué autovalor tiene
          eso como consecuencia inmediata?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ también es autovalor de esta matriz, pero no se deduce de que
              haya dos filas iguales. Lo que dan las filas repetidas es
              $\det G=0$, y eso es exactamente «$0$ es autovalor».
          - valor: '3'
            mensaje: |
              $3$ es la entrada $\left(1,1\right)$, no un autovalor: los de
              esta matriz son $0$, $1$ y $4$.
          - valor: '2'
            mensaje: |
              $2$ no es autovalor de $G$. Sustituye: $\det\left(G-2I\right)$ no
              se anula.
        pista: |
          Dos filas iguales hacen cero el determinante. Y el determinante es el
          producto de los autovalores.
        desarrollo: |
          Con dos filas iguales, $\det G=0$. Y como el determinante es el
          producto de los autovalores, alguno tiene que ser nulo:

          $$
          \det\left(G-0\cdot I\right)=\det G=0
          \;\Longrightarrow\;
          \lambda=0\text{ es autovalor}
          $$

          Su autovector sale de $G\overline{x}=\overline{0}$: restando las dos
          primeras filas queda $2x=0$, y con $x=0$ la ecuación $y+z=0$ da
          $\left(0,1,-1\right)$.

      - tipo: calcular
        titulo: El autovalor más grande
        pregunta: |
          La traza de $G$ vale $5$ y sus autovalores son $0$, $1$ y un tercero.
          ¿Cuál es?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              $5$ es la traza entera. La traza es la **suma** de los tres, así
              que el que falta es $5-0-1=4$.
          - valor: '3'
            mensaje: |
              $3$ es la primera entrada de la diagonal, y la diagonal de una
              matriz no diagonal no son sus autovalores. La suma tiene que dar
              $5$.
          - valor: '6'
            mensaje: |
              Con $6$, la traza saldría $7$. Suma: $0+1+\lambda=5$.
        pista: |
          La traza es la suma de los autovalores, contados con su
          multiplicidad.
        desarrollo: |
          $$
          0+1+\lambda=\operatorname{traza}G=3+1+1=5
          \;\Longrightarrow\;
          \lambda=4
          $$

          El polinomio característico lo confirma:

          $$
          p\left(\lambda\right)=-\lambda^{3}+5\lambda^{2}-4\lambda
          =-\lambda\left(\lambda-1\right)\left(\lambda-4\right)
          $$

          Tres autovalores distintos, así que $G$ diagonaliza sin más
          comprobaciones; y siendo simétrica, además con base **ortonormal**.

      - tipo: calcular
        titulo: El autovector del autovalor 4
        pregunta: |
          Un autovector de $G$ asociado a $\lambda=4$, con coordenadas enteras
          y las dos últimas iguales a $1$.
        respuesta:
          tipo: vector
          valor: '(2, 1, 1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(1, 1, 1)'
            mensaje: |
              Comprueba:
              $G\left(1,1,1\right)^{T}=\left(5,3,3\right)$, que no es múltiplo
              de $\left(1,1,1\right)$. De la primera ecuación de
              $\left(G-4I\right)\overline{x}=\overline{0}$ sale $x=y+z$, o sea
              $x=2$ cuando $y=z=1$.
          - valor: '(1, 2, 2)'
            mensaje: |
              Las coordenadas al revés. La que se dobla es la **primera**:
              $-x+y+z=0$ con $y=z=1$ da $x=2$.
          - valor: '(4, 1, 1)'
            mensaje: |
              El $4$ es el autovalor, no una coordenada. Sustituyendo,
              $G\left(4,1,1\right)^{T}=\left(14,6,6\right)$, que no es
              $4\left(4,1,1\right)$.
        pista: |
          La primera fila de $G-4I$ es $\left(-1,1,1\right)$, así que
          $x=y+z$.
        desarrollo: |
          $$
          G-4I=\begin{pmatrix}-1&1&1\\1&-3&1\\1&1&-3\end{pmatrix}
          $$

          Restando las dos últimas filas sale $-4y+4z=0$, o sea $y=z$; y la
          primera da $x=y+z=2y$. Con $y=1$:

          $$
          \overline{x}=\left(2,1,1\right),
          \qquad
          G\left(2,1,1\right)^{T}=\left(8,4,4\right)^{T}
          =4\left(2,1,1\right)^{T}
          $$

          Y los tres autovectores salen perpendiculares dos a dos sin haber
          hecho nada para conseguirlo:

          $$
          \left(0,1,-1\right)\cdot\left(1,-1,-1\right)=0,
          \quad
          \left(0,1,-1\right)\cdot\left(2,1,1\right)=0,
          \quad
          \left(1,-1,-1\right)\cdot\left(2,1,1\right)=0
          $$

          Eso es el teorema espectral trabajando: en una matriz simétrica, los
          autovectores de autovalores distintos son automáticamente
          ortogonales.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a) ii: si $\overline{x}$ es
          autovector de $A$, lo es de $A^{2}$ y $A^{3}$. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de $A\overline{x}=\lambda\overline{x}$, con
              $\overline{x}\neq\overline{0}$.
          - texto: >-
              Aplicando $A$ otra vez:
              $A^{2}\overline{x}=A\left(\lambda\overline{x}\right)
              =\lambda A\overline{x}=\lambda^{2}\overline{x}$.
          - texto: >-
              Repitiendo,
              $A^{3}\overline{x}=\lambda^{3}\overline{x}$.
          - texto: >-
              Luego $\overline{x}$ es autovector de $A^{2}$ con autovalor
              $\lambda^{2}$, y de $A^{3}$ con autovalor $\lambda^{3}$.
          - texto: >-
              Y en general, los autovectores de $A^{2}$ son exactamente los de
              $A$.
            trampa: true
            mensaje: |
              Lo demostrado va en un solo sentido: todo autovector de $A$ lo es
              de $A^{2}$. Al revés es falso, y el contraejemplo es corto:
              $A=\begin{pmatrix}0&1\\1&0\end{pmatrix}$ tiene $A^{2}=I$, y
              **todos** los vectores son autovectores de la identidad, mientras
              que los de $A$ son solo dos direcciones. Elevar al cuadrado junta
              autovalores opuestos y con ellos aparecen direcciones propias
              nuevas.
    resolucion: |
      **a) i. El subespacio propio.** Contiene al $\overline{0}$ por
      construcción, así que no es vacío. Y si $\overline{x}$ e $\overline{y}$
      cumplen $f\left(\overline{x}\right)=\lambda\overline{x}$ y
      $f\left(\overline{y}\right)=\lambda\overline{y}$:

      $$
      f\left(\alpha\overline{x}+\beta\overline{y}\right)
      =\alpha\lambda\overline{x}+\beta\lambda\overline{y}
      =\lambda\left(\alpha\overline{x}+\beta\overline{y}\right)
      $$

      La combinación vuelve a cumplir la condición. Y aquí se ve por qué el
      enunciado añade el $\overline{0}$ a mano: sin él el conjunto no sería
      cerrado —la suma de dos opuestos se sale— y por tanto no sería
      subespacio. Ese detalle **es** el ejercicio.

      **a) ii. Las potencias.** Aplicando $A$ repetidamente:

      $$
      A^{2}\overline{x}=A\left(\lambda\overline{x}\right)
      =\lambda^{2}\overline{x},
      \qquad
      A^{3}\overline{x}=\lambda^{3}\overline{x}
      $$

      Los autovalores son $\lambda^{2}$ y $\lambda^{3}$, y el autovector es
      **el mismo**. La implicación no se puede dar la vuelta.

      **b) Los autovalores de $G$, sin desarrollar el determinante.** Dos
      atajos que valen más que la cuenta:

      - Las filas segunda y tercera son iguales, luego $\det G=0$ y
        $\lambda=0$ es autovalor.
      - La traza vale $5$, así que los tres suman $5$.

      Desarrollando sale

      $$
      p\left(\lambda\right)
      =-\lambda\left(\lambda-1\right)\left(\lambda-4\right)
      $$

      con autovalores $0$, $1$ y $4$: tres distintos, luego $G$ diagonaliza.

      **Los autovectores, y la sorpresa que no lo es.**

      | $\lambda$ | sistema | autovector | norma |
      |---|---|---|---|
      | $0$ | $2x=0$, $y+z=0$ | $\left(0,1,-1\right)$ | $\sqrt{2}$ |
      | $1$ | $x+z=0$, $x+y=0$ | $\left(1,-1,-1\right)$ | $\sqrt{3}$ |
      | $4$ | $y=z$, $x=2y$ | $\left(2,1,1\right)$ | $\sqrt{6}$ |

      Los tres son ortogonales dos a dos **sin haber ortogonalizado nada**, y
      eso no es suerte: es el teorema espectral. En una matriz simétrica real,
      autovalores distintos dan direcciones propias perpendiculares.

      Normalizando:

      $$
      \boxed{\;\left\{
      \left(0,\tfrac{1}{\sqrt{2}},-\tfrac{1}{\sqrt{2}}\right),
      \left(\tfrac{1}{\sqrt{3}},-\tfrac{1}{\sqrt{3}},
      -\tfrac{1}{\sqrt{3}}\right),
      \left(\tfrac{2}{\sqrt{6}},\tfrac{1}{\sqrt{6}},
      \tfrac{1}{\sqrt{6}}\right)\right\}\;}
      $$

      **La fórmula de la diagonalización.** Poniendo esos tres vectores en
      columna se obtiene una matriz $P$ **ortogonal**, y en una matriz
      ortogonal la inversa es la traspuesta:

      $$
      G=PDP^{T},
      \qquad
      D=\begin{pmatrix}0&0&0\\0&1&0\\0&0&4\end{pmatrix}
      $$

      Que se pueda escribir $P^{T}$ en lugar de $P^{-1}$ es justo lo que se
      gana al ortonormalizar, y es la razón de que el enunciado pida la base
      ortonormal y no una cualquiera: ahorra invertir una matriz.
