ejercicios:
  - id: exalg2223-ext-1-un-subespacio-y-otro-que-no-lo-es
    titulo: Dos conjuntos casi iguales, y solo uno es subespacio
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, curso 2022-2023 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Las dos matrices del
      enunciado se han leído de la página renderizada, porque el volcado de
      texto las deja ilegibles · El examen no publica solución ni reparto de
      puntos: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar: si el sistema de vectores
      $\left\{\overline{u}_{1},\overline{u}_{2},\dots,\overline{u}_{n}\right\}$
      es libre, toda combinación lineal de estos vectores tiene expresión
      única.

      b) Sea $\mathcal{M}_{2\times3}\left(\mathbb{R}\right)$ el espacio
      vectorial de las matrices reales de orden $2\times3$. Demostrar que uno
      de los siguientes subconjuntos es subespacio vectorial y que el otro no
      lo es:

      $$
      \begin{gathered}
      S_{1}=\left\{\begin{pmatrix}0&a+b&a\\c&0&b\end{pmatrix}
      \;\Big|\;a,b,c\in\mathbb{R}\right\} \\[2mm]
      S_{2}=\left\{\begin{pmatrix}1&a&2\\c&0&b\end{pmatrix}
      \;\Big|\;a,b,c\in\mathbb{R}\right\}
      \end{gathered}
      $$
    pide: La demostración de la unicidad, y cuál de los dos conjuntos es subespacio.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué hay que mirar primero para descartar que
          $S_{2}$ sea subespacio?
        opciones:
          - texto: >-
              Si la matriz nula está dentro. En $S_{2}$ la entrada
              $\left(1,1\right)$ vale siempre $1$, así que no
            correcta: true
            mensaje: |
              Eso es, y es la comprobación más barata que existe. Todo
              subespacio contiene al vector nulo; si el nulo no está, ya se ha
              acabado el ejercicio y no hace falta tocar ninguna suma.
          - texto: >-
              Si los tres parámetros son independientes entre sí
            mensaje: |
              Eso serviría para calcular la dimensión, no para decidir si es
              subespacio. Y aquí lo son en los dos conjuntos: $a$, $b$ y $c$
              aparecen cada uno en su sitio.
          - texto: >-
              Si el conjunto es finito
            mensaje: |
              Los dos son infinitos, como casi todos los subespacios
              interesantes. La cardinalidad no interviene en la definición.
          - texto: >-
              Si las matrices son cuadradas
            mensaje: |
              No hace falta que lo sean:
              $\mathcal{M}_{2\times3}\left(\mathbb{R}\right)$ es un espacio
              vectorial perfectamente normal, de dimensión $6$, y sus
              subespacios tampoco tienen por qué ser cuadrados.

      - tipo: calcular
        titulo: La dimensión del que sí es subespacio
        pregunta: |
          ¿Cuál es la dimensión de $S_{1}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              $6$ es la dimensión de
              $\mathcal{M}_{2\times3}\left(\mathbb{R}\right)$ entero. $S_{1}$
              es un subespacio propio: dos de las seis entradas están fijadas a
              cero y la $\left(1,2\right)$ no es libre, sino $a+b$.
          - valor: '4'
            mensaje: |
              $4$ saldría de contar como libre la entrada $\left(1,2\right)$,
              pero esa vale $a+b$ y **no aporta nada nuevo**: queda determinada
              en cuanto se eligen $a$ y $b$.
          - valor: '2'
            mensaje: |
              $2$ dejaría fuera a $c$, que es un parámetro más y aparece solo
              en la entrada $\left(2,1\right)$. Son tres parámetros
              independientes.
        pista: |
          Escribe una matriz genérica de $S_{1}$ como
          $a\cdot M_{a}+b\cdot M_{b}+c\cdot M_{c}$ y mira si esas tres matrices
          son independientes.
        desarrollo: |
          Toda matriz de $S_{1}$ se descompone así:

          $$
          \begin{pmatrix}0&a+b&a\\c&0&b\end{pmatrix}
          =a\begin{pmatrix}0&1&1\\0&0&0\end{pmatrix}
          +b\begin{pmatrix}0&1&0\\0&0&1\end{pmatrix}
          +c\begin{pmatrix}0&0&0\\1&0&0\end{pmatrix}
          $$

          Las tres son independientes: cada una tiene un $1$ donde las otras
          dos tienen un $0$ —la $\left(1,3\right)$, la $\left(2,3\right)$ y la
          $\left(2,1\right)$ respectivamente—, así que una combinación nula
          obliga a $a=b=c=0$.

          $$
          \dim S_{1}=3
          $$

          Y esa descomposición **es** la demostración de que $S_{1}$ es
          subespacio: se ha escrito como el generado de tres matrices, y todo
          generado es subespacio.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a): la expresión de una
          combinación lineal es única. Una pieza es falsa.
        piezas:
          - texto: >-
              Supongamos que un mismo vector admite dos expresiones:
              $\overline{x}=\sum\alpha_{i}\overline{u}_{i}
              =\sum\beta_{i}\overline{u}_{i}$.
          - texto: >-
              Restando las dos, queda
              $\sum\left(\alpha_{i}-\beta_{i}\right)\overline{u}_{i}
              =\overline{0}$.
          - texto: >-
              Como la familia es libre, la única combinación que da el vector
              nulo es la de coeficientes todos nulos.
          - texto: >-
              Luego $\alpha_{i}-\beta_{i}=0$ para todo $i$, es decir, las dos
              expresiones eran la misma.
          - texto: >-
              Y por eso una familia libre es siempre una base del espacio.
            trampa: true
            mensaje: |
              Una familia libre da unicidad **a lo que consigue escribir**, no
              a todo el espacio. Para ser base hace falta además que **genere**,
              y eso el enunciado no lo dice ni lo necesita:
              $\left\{\left(1,0,0\right)\right\}$ es libre en $\mathbb{R}^{3}$
              y no es base de nada más que de una recta. Confundir «libre» con
              «base» es el error que más aparece en este ejercicio, porque la
              conclusión suena a lo mismo.

      - tipo: redactar
        consigna: |
          Ahora el apartado b) en papel: por qué $S_2$ **no** es subespacio y
          por qué $S_1$ **sí** lo es, escrito como lo entregarías.

          Es la demostración más frecuente de la asignatura: «demostrar que
          esto es subespacio vectorial» aparece en siete ejercicios de las ocho
          convocatorias transcritas, y en cinco de las ocho convocatorias hay
          al menos uno. Contado el 5 de septiembre de 2026.
        rubrica:
          - punto: |
              Para el que **no** lo es: **un solo argumento**, y que sea
              suficiente.
            porque: |
              Con que falle una condición ya está descartado. La más barata es
              el vector nulo: la matriz nula no está en $S_2$ porque la entrada
              $(1,1)$ vale $1$ pase lo que pase. Ponerse a comprobar sumas y
              productos después de eso no suma puntos y gasta el tiempo que
              necesitas para el apartado siguiente.
          - punto: |
              Para el que **sí** lo es: las **dos** condiciones, o el generado.
            porque: |
              Hay dos caminos correctos y conviene elegir uno a conciencia:
              comprobar que la suma y el producto por un escalar no se salen
              —y entonces hay que escribir los dos—, o exhibir $S_1$ como
              $L(\{\dots\})$, porque todo generado es subespacio. El segundo es
              más corto y **de regalo te deja la base y la dimensión**, que es
              justo lo que el apartado siguiente suele pedir.
          - punto: |
              Si vas por el generado: **los generadores escritos**, no
              descritos.
            porque: |
              «Se ve que está generado por tres matrices» no es una
              demostración. Hay que escribirlas, y sale de separar los
              parámetros: una matriz por cada uno de $a$, $b$ y $c$. Con las
              tres delante, la afirmación es verificable de un vistazo.
          - punto: |
              Decir **de qué espacio** es subespacio.
            porque: |
              Un subespacio no lo es en abstracto: $S_1$ es subespacio de
              $\mathcal{M}_{2\times3}(\mathbb{R})$. Es media línea, y es lo que
              distingue haber entendido la definición de haberla recitado.
        veredicto: |
          Dos bloques bien separados, y en este orden de coste: primero el que
          no lo es —una línea, el vector nulo—, después el que sí, con sus
          generadores escritos.

          La comprobación rápida: cuenta las matrices que has dibujado. Si en
          el segundo bloque no hay tres, o has ido por el camino de las dos
          condiciones —y entonces tienen que estar las dos, cerradas— o te has
          dejado los generadores a medio decir.

    resolucion: |
      **a) La unicidad, que es una resta.** Si un vector admite dos
      expresiones sobre la misma familia,

      $$
      \overline{x}=\sum_{i=1}^{n}\alpha_{i}\overline{u}_{i}
      =\sum_{i=1}^{n}\beta_{i}\overline{u}_{i}
      $$

      restando queda
      $\sum\left(\alpha_{i}-\beta_{i}\right)\overline{u}_{i}=\overline{0}$. Y
      ser libre significa exactamente que la única combinación que da el nulo
      es la trivial, así que $\alpha_{i}=\beta_{i}$ para todo $i$.

      Toda la demostración es esa resta. Lo que hay que tener claro es **qué se
      está usando**: la definición de familia libre, y nada más.

      **b) El que no lo es se descarta en una línea.** Un subespacio contiene
      siempre al vector nulo —aquí, la matriz nula—, y en $S_{2}$ la entrada
      $\left(1,1\right)$ vale $1$ pase lo que pase:

      $$
      \begin{pmatrix}0&0&0\\0&0&0\end{pmatrix}\notin S_{2}
      \;\Longrightarrow\;
      S_{2}\text{ no es subespacio}
      $$

      No hace falta comprobar ninguna suma. Y si se quiere un argumento
      alternativo, sirve igual sumar dos elementos de $S_{2}$: la entrada
      $\left(1,1\right)$ del resultado vale $2$, así que la suma se sale del
      conjunto.

      **El que sí lo es se demuestra escribiéndolo.** La forma más limpia no es
      comprobar las dos propiedades, sino exhibir $S_{1}$ como un generado:

      $$
      S_{1}=L\left(\left\{
      \begin{pmatrix}0&1&1\\0&0&0\end{pmatrix},
      \begin{pmatrix}0&1&0\\0&0&1\end{pmatrix},
      \begin{pmatrix}0&0&0\\1&0&0\end{pmatrix}
      \right\}\right)
      $$

      Todo generado es subespacio, y de paso queda la base y la dimensión:

      $$
      \boxed{\;\dim S_{1}=3\;}
      $$

      **La diferencia entre los dos, dicha en corto.** En $S_{1}$ las entradas
      constantes son ceros y las variables son **lineales** en los parámetros;
      en $S_{2}$ hay dos constantes no nulas, el $1$ y el $2$. Un término
      independiente distinto de cero rompe siempre la estructura de subespacio:
      lo que describe no es un subespacio, sino una **variedad afín** —un
      subespacio trasladado— y esa traslación es justo lo que deja fuera al
      nulo.

  - id: exalg2223-ext-2-cuatro-imagenes-y-una-matriz-que-no-es-cuadrada
    titulo: De un espacio de dimensión 4 a uno de dimensión 3
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, curso 2022-2023 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sea $f:V\rightarrow V'$ una aplicación lineal inyectiva. Demostrar que
      si $\left\{\overline{u}_{1},\dots,\overline{u}_{n}\right\}\subset V$ es
      una familia libre,
      $\left\{f\left(\overline{u}_{1}\right),\dots,
      f\left(\overline{u}_{n}\right)\right\}\subset V'$ también es libre.

      b) Sean $V$ y $W$ dos espacios vectoriales sobre $\mathbb{R}$ y
      $B=\left\{\overline{e}_{1},\overline{e}_{2},
      \overline{e}_{3},\overline{e}_{4}\right\}$,
      $B'=\left\{\overline{u}_{1},\overline{u}_{2},\overline{u}_{3}\right\}$,
      bases de $V$ y $W$ respectivamente. Sea la aplicación lineal definida de
      la siguiente manera:

      $$
      f\left(\overline{e}_{1}\right)
      =\overline{u}_{1}+\overline{u}_{2}-4\overline{u}_{3},
      \quad
      f\left(\overline{e}_{2}\right)
      =2\overline{u}_{1}+\overline{u}_{2}-2\overline{u}_{3},
      $$

      $$
      f\left(\overline{e}_{3}\right)=3\overline{u}_{1}+\overline{u}_{2},
      \quad
      f\left(\overline{e}_{4}\right)=\overline{u}_{1}+2\overline{u}_{3}
      $$

      i. Hallar la matriz de $f$ en las bases $B$ y $B'$.

      ii. Calcular una base de $\operatorname{Ker}\left(f\right)$ e
      $\operatorname{Im}\left(f\right)$ y clasificar la aplicación.
    pide: La demostración, la matriz asociada, y las dos bases con la clasificación.

    pasos:
      - tipo: reconocer
        pregunta: |
          $V$ tiene dimensión $4$ y $W$ dimensión $3$. ¿De qué orden es la
          matriz de $f$ en esas bases?
        opciones:
          - texto: >-
              $3\times4$: tres filas y cuatro columnas, una columna por cada
              vector de la base de partida
            correcta: true
            mensaje: |
              Eso es. Cada columna es la imagen de un $\overline{e}_{i}$
              escrita en $B'$, así que hay tantas columnas como dimensión tiene
              el espacio de **partida** y tantas filas como el de llegada. Y
              así $A\overline{x}$ tiene sentido: una columna de $4$ por una
              matriz de $4$ columnas.
          - texto: >-
              $4\times3$
            mensaje: |
              Ese es el orden traspuesto, y da un producto que ni siquiera se
              puede hacer: $A\overline{x}$ con $\overline{x}$ de cuatro
              coordenadas exige cuatro columnas.
          - texto: >-
              $4\times4$, porque la base de partida tiene cuatro vectores
            mensaje: |
              La matriz de una aplicación lineal solo es cuadrada cuando los
              dos espacios tienen la misma dimensión. Aquí $f$ va de dimensión
              $4$ a dimensión $3$, y eso ya obliga a que **no** sea inyectiva.
          - texto: >-
              $3\times3$, porque el rango no puede pasar de $3$
            mensaje: |
              Es cierto que el rango no pasa de $3$, pero eso no cambia el
              orden de la matriz: hay cuatro imágenes que escribir, y cada una
              ocupa su columna aunque luego resulten dependientes.

      - tipo: calcular
        titulo: La matriz asociada
        pregunta: |
          La matriz de $f$ en las bases $B$ y $B'$. Escribe las filas separadas
          por punto y coma.
        respuesta:
          tipo: matriz
          valor: '[1, 2, 3, 1; 1, 1, 1, 0; -4, -2, 0, 2]'
          tolerancia: 0.001
          formato: tres filas de cuatro números, con punto y coma entre filas
        distractores:
          - valor: '[1, 1, -4; 2, 1, -2; 3, 1, 0; 1, 0, 2]'
            mensaje: |
              Es la **traspuesta**: has puesto cada imagen en una fila. Las
              imágenes van por **columnas**, que es lo que hace que
              $A\overline{x}$ reproduzca $f\left(\overline{x}\right)$.
          - valor: '[1, 2, 3, 1; 1, 1, 1, 0; -4, -2, 0, 0]'
            mensaje: |
              La última entrada. $f\left(\overline{e}_{4}\right)
              =\overline{u}_{1}+2\overline{u}_{3}$ tiene coeficiente $2$ en
              $\overline{u}_{3}$: el cero que le falta a esa imagen es el de
              $\overline{u}_{2}$, en la fila de en medio.
          - valor: '[1, 2, 3, 1; 1, 1, 1, 2; -4, -2, 0, 0]'
            mensaje: |
              Has metido el $2$ de $2\overline{u}_{3}$ en la fila de
              $\overline{u}_{2}$. El orden de las filas es el de la base $B'$:
              primera fila $\overline{u}_{1}$, segunda $\overline{u}_{2}$,
              tercera $\overline{u}_{3}$.
        pista: |
          Cada columna son los tres coeficientes de una imagen, en el orden
          $\overline{u}_{1},\overline{u}_{2},\overline{u}_{3}$. Los coeficientes
          que no aparecen escritos son ceros.
        desarrollo: |
          Escribiendo las cuatro imágenes con sus tres coeficientes, ceros
          incluidos:

          | | $\overline{u}_{1}$ | $\overline{u}_{2}$ | $\overline{u}_{3}$ |
          |---|---|---|---|
          | $f\left(\overline{e}_{1}\right)$ | $1$ | $1$ | $-4$ |
          | $f\left(\overline{e}_{2}\right)$ | $2$ | $1$ | $-2$ |
          | $f\left(\overline{e}_{3}\right)$ | $3$ | $1$ | $0$ |
          | $f\left(\overline{e}_{4}\right)$ | $1$ | $0$ | $2$ |

          y **poniéndolas en columna**, que es lo que pide la definición:

          $$
          A=\begin{pmatrix}
          1&2&3&1\\
          1&1&1&0\\
          -4&-2&0&2
          \end{pmatrix}
          $$

      - tipo: calcular
        titulo: La dimensión del núcleo
        pregunta: |
          ¿Cuánto vale $\dim\operatorname{Ker}\left(f\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ sería si el rango valiese $3$. Pero el rango es $2$: la
              tercera columna es $-c_{1}+2c_{2}$ y la cuarta,
              $-c_{1}+c_{2}$. Solo dos columnas son independientes.
          - valor: '0'
            mensaje: |
              Un núcleo nulo significaría que $f$ es inyectiva, y eso es
              imposible yendo de dimensión $4$ a dimensión $3$: la imagen no
              puede tener dimensión $4$ dentro de un espacio de dimensión $3$.
          - valor: '3'
            mensaje: |
              $3$ dejaría el rango en $1$, es decir, todas las columnas
              proporcionales entre sí. No lo son:
              $\left(1,1,-4\right)$ y $\left(2,1,-2\right)$ no son múltiplos.
        pista: |
          Calcula primero el rango de $A$ mirando cuántas columnas son
          independientes, y usa
          $\dim\operatorname{Ker}+\operatorname{rg}=4$.
        desarrollo: |
          El rango se ve escalonando por filas: restando la primera a la
          segunda y sumando cuatro veces la primera a la tercera queda

          $$
          \begin{pmatrix}
          1&2&3&1\\
          0&-1&-2&-1\\
          0&6&12&6
          \end{pmatrix}
          $$

          y la tercera fila es $-6$ veces la segunda. Rango $2$.

          $$
          \dim\operatorname{Ker}\left(f\right)=4-2=2
          $$

      - tipo: calcular
        titulo: Un vector concreto del núcleo
        pregunta: |
          De los vectores del núcleo, ¿cuál es el que tiene segunda coordenada
          $1$ y tercera coordenada $0$? Da sus cuatro coordenadas en la base
          $B$.
        respuesta:
          tipo: vector
          valor: '(-1, 1, 0, -1)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(-1, 1, 0, 1)'
            mensaje: |
              La cuarta coordenada. De las dos primeras ecuaciones sale
              $x_{4}=-x_{2}-2x_{3}$, y con $x_{2}=1$, $x_{3}=0$ eso da $-1$.
              Comprueba sumando la primera fila de $A$: $-1+2+0+1=2\neq0$.
          - valor: '(1, 1, 0, -1)'
            mensaje: |
              La primera. De la segunda fila sale $x_{1}=-x_{2}-x_{3}$, que con
              $x_{2}=1$ y $x_{3}=0$ vale $-1$. Con $+1$, la segunda fila daría
              $1+1+0+0=2\neq0$.
          - valor: '(-1, 0, 1, -2)'
            mensaje: |
              Ese es el **otro** vector de la base del núcleo, el que sale con
              $x_{2}=0$ y $x_{3}=1$. También está en el núcleo, pero no cumple
              lo que pide el paso.
        pista: |
          De $A\overline{x}=\overline{0}$, la segunda fila da
          $x_{1}+x_{2}+x_{3}=0$. Empieza por ahí.
        desarrollo: |
          El sistema $A\overline{x}=\overline{0}$ se reduce a dos ecuaciones,
          porque la tercera fila es combinación de las otras dos:

          $$
          x_{1}+x_{2}+x_{3}=0,
          \qquad
          x_{2}+2x_{3}+x_{4}=0
          $$

          Con $x_{2}=1$ y $x_{3}=0$ salen $x_{1}=-1$ y $x_{4}=-1$:

          $$
          \overline{v}_{1}=\left(-1,1,0,-1\right)
          $$

          y con $x_{2}=0$, $x_{3}=1$ sale
          $\overline{v}_{2}=\left(-1,0,1,-2\right)$. Los dos juntos son base
          del núcleo.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a): la imagen de una familia
          libre por una aplicación inyectiva es libre. Una pieza es falsa.
        piezas:
          - texto: >-
              Se parte de una combinación nula de las imágenes:
              $\sum\alpha_{i}f\left(\overline{u}_{i}\right)=\overline{0}$.
          - texto: >-
              Por linealidad, eso es
              $f\left(\sum\alpha_{i}\overline{u}_{i}\right)=\overline{0}$.
          - texto: >-
              Como $f$ es inyectiva, su núcleo es
              $\left\{\overline{0}\right\}$, luego
              $\sum\alpha_{i}\overline{u}_{i}=\overline{0}$.
          - texto: >-
              Y como la familia de partida era libre, todos los $\alpha_{i}$
              son nulos: las imágenes forman familia libre.
          - texto: >-
              La inyectividad no hace falta: la linealidad basta para llevar
              familias libres a familias libres.
            trampa: true
            mensaje: |
              La inyectividad es justo el paso que no se puede saltar, y hay un
              contraejemplo de una línea: la aplicación nula es lineal y manda
              cualquier familia libre a
              $\left\{\overline{0},\dots,\overline{0}\right\}$, que es lo menos
              libre que hay. Sin inyectividad, del $f\left(\sum\alpha_{i}
              \overline{u}_{i}\right)=\overline{0}$ no se deduce nada sobre lo
              de dentro.
    resolucion: |
      **a) Por qué la inyectividad es el paso clave.** Se parte de una
      combinación nula de las imágenes y se usa la linealidad para meterla
      dentro:

      $$
      \sum_{i}\alpha_{i}f\left(\overline{u}_{i}\right)=\overline{0}
      \;\Longleftrightarrow\;
      f\left(\sum_{i}\alpha_{i}\overline{u}_{i}\right)=\overline{0}
      $$

      Eso dice que $\sum\alpha_{i}\overline{u}_{i}$ está en el núcleo. Y como
      $f$ es inyectiva, el núcleo solo tiene al $\overline{0}$, así que
      $\sum\alpha_{i}\overline{u}_{i}=\overline{0}$; siendo libre la familia de
      partida, todos los $\alpha_{i}$ son nulos.

      Sin inyectividad el argumento se cae en el penúltimo paso, y el
      contraejemplo es la aplicación nula.

      **b) i. La matriz.** Las cuatro imágenes, escritas en $B'$ y puestas en
      columna:

      $$
      \boxed{\;A=\begin{pmatrix}
      1&2&3&1\\
      1&1&1&0\\
      -4&-2&0&2
      \end{pmatrix}\;}
      $$

      No es cuadrada, y no tiene por qué serlo: $f$ va de un espacio de
      dimensión $4$ a uno de dimensión $3$.

      **b) ii. Rango, núcleo e imagen.** Escalonando sale rango $2$, y de ahí
      todo lo demás:

      $$
      \operatorname{rg}A=2
      \;\Longrightarrow\;
      \dim\operatorname{Im}\left(f\right)=2,
      \quad
      \dim\operatorname{Ker}\left(f\right)=4-2=2
      $$

      La imagen está generada por las columnas, y basta quedarse con dos
      independientes:

      $$
      \operatorname{Im}\left(f\right)
      =L\left(\left\{\overline{u}_{1}+\overline{u}_{2}-4\overline{u}_{3},
      \;2\overline{u}_{1}+\overline{u}_{2}-2\overline{u}_{3}\right\}\right)
      $$

      Las otras dos son combinación suya: $c_{3}=-c_{1}+2c_{2}$ y
      $c_{4}=-c_{1}+c_{2}$, y comprobarlo es lo que confirma el rango.

      El núcleo sale del sistema reducido a dos ecuaciones:

      $$
      \boxed{\;\operatorname{Ker}\left(f\right)
      =L\left(\left\{\left(-1,1,0,-1\right),
      \left(-1,0,1,-2\right)\right\}\right)\;}
      $$

      **Clasificación.** No es inyectiva —el núcleo tiene dimensión $2$— ni
      sobreyectiva —la imagen tiene dimensión $2$ y $W$ tiene $3$—. Y la
      primera de las dos se sabía **antes de calcular nada**: una aplicación de
      un espacio de dimensión $4$ a uno de dimensión $3$ no puede ser
      inyectiva, porque la imagen no cabe. Merece la pena hacer esa lectura al
      principio: dice qué esperar y avisa si la cuenta sale distinta.

  - id: exalg2223-ext-3-cuando-existe-la-inversa-y-cuanto-vale
    titulo: Un parámetro que decide si hay inversa
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, curso 2022-2023 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · La matriz del enunciado se
      ha leído de la página renderizada, porque el volcado de texto la reparte
      en cinco renglones desordenados · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) i. Definir vectores ortogonales y norma de un vector.

      ii. Sean el espacio vectorial euclídeo
      $\left(E,\left\langle,\right\rangle\right)$ y los vectores
      $\overline{u},\overline{v}\in E$. Demostrar que se cumple la siguiente
      propiedad:

      $$
      \left\|\overline{u}+\overline{v}\right\|^{2}
      =\left\|\overline{u}\right\|^{2}+\left\|\overline{v}\right\|^{2}
      \iff\overline{u}\perp\overline{v}
      $$

      b) Dada la siguiente matriz:

      $$
      A=\begin{pmatrix}
      1&-x&0&0\\
      0&1&-x&0\\
      -1&x-1&1&1-x\\
      0&1&0&-1
      \end{pmatrix}
      $$

      i. Calcular el valor de $x$ para que exista $A^{-1}$.

      ii. Para el caso $x=-2$, calcular $A^{-1}$.
    pide: Las definiciones, la demostración de Pitágoras, y la inversa con su condición.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición hay que imponer para que $A^{-1}$ exista?
        opciones:
          - texto: >-
              Que $\det A\neq0$, y por eso el ejercicio empieza calculando el
              determinante en función de $x$
            correcta: true
            mensaje: |
              Exacto. Una matriz cuadrada es inversible si y solo si su
              determinante no es nulo, así que el apartado i) es en realidad
              «calcula $\det A\left(x\right)$ y mira dónde se anula».
          - texto: >-
              Que $A$ sea simétrica
            mensaje: |
              La simetría no tiene nada que ver con la inversibilidad. Hay
              matrices simétricas sin inversa —la nula— y matrices no
              simétricas con ella, como esta misma para casi todo $x$.
          - texto: >-
              Que todas las entradas sean distintas de cero
            mensaje: |
              La identidad está llena de ceros y es inversible. Lo que decide
              es el determinante, no dónde están los ceros.
          - texto: >-
              Que $x$ no aparezca en la diagonal
            mensaje: |
              Dónde esté el parámetro es irrelevante: lo único que cuenta es el
              valor del determinante, que aquí resulta ser $x^{2}-1$.

      - tipo: calcular
        titulo: Los valores prohibidos
        pregunta: |
          Sabiendo que $\det A=x^{2}-1$, ¿para qué valores de $x$ **no** existe
          $A^{-1}$?
        respuesta:
          tipo: conjunto
          valor: '1, -1'
          tolerancia: 0.001
          formato: los valores separados por comas
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ el determinante vale $-1$, que no es cero: ahí la
              inversa existe sin problema. Lo que hay que resolver es
              $x^{2}-1=0$.
          - valor: '1'
            mensaje: |
              El $1$ está bien, pero falta el otro: $x^{2}=1$ tiene **dos**
              soluciones, y perder la negativa es el fallo clásico de sacar
              raíces cuadradas.
          - valor: '2, -2'
            mensaje: |
              De $x^{2}-1=0$ sale $x^{2}=1$, no $x^{2}=4$. En $x=-2$ el
              determinante vale $3$, y por eso el apartado ii) puede pedir la
              inversa justo ahí.
        pista: |
          Resuelve $x^{2}-1=0$. Son dos valores, no uno.
        desarrollo: |
          $$
          \det A=x^{2}-1=\left(x-1\right)\left(x+1\right)=0
          \;\Longleftrightarrow\;
          x=1\;\text{ o }\;x=-1
          $$

          Por tanto **$A^{-1}$ existe para todo $x\neq\pm1$**. Y el apartado
          ii) elige $x=-2$, donde el determinante vale $3$: un valor pequeño y
          entero, que es lo que permite hacer la inversa a mano.

      - tipo: calcular
        titulo: El determinante en el caso que se pide
        pregunta: |
          Para $x=-2$, ¿cuánto vale $\det A$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              $5$ saldría de $x^{2}+1$. El determinante es $x^{2}-1$, y con
              $x=-2$ da $4-1=3$.
          - valor: '-3'
            mensaje: |
              El signo. $x^{2}$ vale $4$ aunque $x$ sea negativo, así que
              $4-1=3$, positivo.
          - valor: '-5'
            mensaje: |
              Aquí hay dos cosas a la vez: el cuadrado de $-2$ es $+4$, no
              $-4$. $\det A=4-1=3$.
        pista: |
          Sustituye en $x^{2}-1$ y recuerda que el cuadrado de un negativo es
          positivo.
        desarrollo: |
          $$
          \det A\left(-2\right)=\left(-2\right)^{2}-1=3\neq0
          $$

          y la matriz queda con todo entero:

          $$
          A\left(-2\right)=\begin{pmatrix}
          1&2&0&0\\
          0&1&2&0\\
          -1&-3&1&3\\
          0&1&0&-1
          \end{pmatrix}
          $$

      - tipo: calcular
        titulo: La primera fila de la inversa
        pregunta: |
          Calculando $A^{-1}$ para $x=-2$, ¿cuál es su **primera fila**?
        respuesta:
          tipo: vector
          valor: '(-1/3, 2/3, -4/3, -4)'
          tolerancia: 0.001
          formato: cuatro números entre paréntesis; valen fracciones
        distractores:
          - valor: '(-1, 2, -4, -12)'
            mensaje: |
              Esa es la primera fila de la **matriz adjunta traspuesta**, sin
              dividir por el determinante. Falta el
              $\tfrac{1}{\det A}=\tfrac{1}{3}$ que multiplica a todo.
          - valor: '(1/3, -2/3, 4/3, 4)'
            mensaje: |
              Los cuatro signos cambiados. Suele salir de usar $\det A=-3$; es
              $+3$, porque $\left(-2\right)^{2}=4$.
          - valor: '(-1/3, 2/3, -1/3, -1)'
            mensaje: |
              Esa es la **tercera** fila de $A^{-1}$. Las dos primeras entradas
              coinciden y por eso se confunden; las dos últimas no.
        pista: |
          Monta $\left(A\mid I\right)$ y haz Gauss-Jordan. O calcula la adjunta
          y divide por $3$.
        desarrollo: |
          Por Gauss-Jordan sobre $\left(A\mid I\right)$, o por la adjunta
          dividida entre el determinante:

          $$
          A^{-1}=\frac{1}{3}\begin{pmatrix}
          -1&2&-4&-12\\
          2&-1&2&6\\
          -1&2&-1&-3\\
          2&-1&2&3
          \end{pmatrix}
          $$

          La primera fila es
          $\left(-\tfrac{1}{3},\tfrac{2}{3},-\tfrac{4}{3},-4\right)$.

          Y la comprobación no es opcional en un ejercicio como este:
          $AA^{-1}=I$ y $A^{-1}A=I$, las dos. Multiplicar cuesta menos que
          equivocarse.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración de que Pitágoras equivale a la
          ortogonalidad. Una pieza es falsa.
        piezas:
          - texto: >-
              Se desarrolla la norma al cuadrado usando la bilinealidad:
              $\left\|\overline{u}+\overline{v}\right\|^{2}
              =\left\langle\overline{u}+\overline{v},
              \overline{u}+\overline{v}\right\rangle$.
          - texto: >-
              Queda
              $\left\|\overline{u}\right\|^{2}
              +2\left\langle\overline{u},\overline{v}\right\rangle
              +\left\|\overline{v}\right\|^{2}$, donde el doble producto sale
              de la simetría del producto escalar.
          - texto: >-
              La igualdad del enunciado se cumple exactamente cuando ese
              término sobrante se anula, es decir cuando
              $\left\langle\overline{u},\overline{v}\right\rangle=0$.
          - texto: >-
              Y eso es, por definición, que $\overline{u}$ y $\overline{v}$
              sean ortogonales. Como cada paso es una equivalencia, vale en los
              dos sentidos.
          - texto: >-
              El doble producto se anula siempre que $\overline{u}$ y
              $\overline{v}$ sean distintos, así que la igualdad vale para
              cualquier par de vectores diferentes.
            trampa: true
            mensaje: |
              Ser distintos no tiene nada que ver con ser ortogonales.
              $\overline{u}=\left(1,0\right)$ y
              $\overline{v}=\left(1,0\right)+\left(1,0\right)
              =\left(2,0\right)$ son distintos y su producto escalar vale $2$,
              bien lejos de cero. Si la igualdad valiese para cualquier par, el
              teorema no diría nada.
    resolucion: |
      **a) i. Las dos definiciones.** Dos vectores $\overline{u}$ y
      $\overline{v}$ son **ortogonales** si
      $\left\langle\overline{u},\overline{v}\right\rangle=0$, y se escribe
      $\overline{u}\perp\overline{v}$. La **norma** de un vector es
      $\left\|\overline{u}\right\|
      =\sqrt{\left\langle\overline{u},\overline{u}\right\rangle}$, que tiene
      sentido porque el producto escalar es definido positivo y el radicando
      nunca es negativo.

      **a) ii. Pitágoras, que es desarrollar un cuadrado.**

      $$
      \left\|\overline{u}+\overline{v}\right\|^{2}
      =\left\langle\overline{u}+\overline{v},
      \overline{u}+\overline{v}\right\rangle
      =\left\|\overline{u}\right\|^{2}
      +2\left\langle\overline{u},\overline{v}\right\rangle
      +\left\|\overline{v}\right\|^{2}
      $$

      El $2$ del término central sale de la **simetría**: los dos productos
      cruzados valen lo mismo. Restando
      $\left\|\overline{u}\right\|^{2}+\left\|\overline{v}\right\|^{2}$ a los
      dos lados, la igualdad del enunciado equivale a
      $2\left\langle\overline{u},\overline{v}\right\rangle=0$, o sea a la
      ortogonalidad.

      Como todos los pasos son equivalencias, la demostración vale en los dos
      sentidos de una vez, y no hay que repetirla al revés.

      **b) i. Dónde existe la inversa.** Desarrollando el determinante de la
      matriz $4\times4$ —conviene empezar por la última fila, que solo tiene
      dos entradas no nulas— sale

      $$
      \det A=x^{2}-1=\left(x-1\right)\left(x+1\right)
      $$

      $$
      \boxed{\;A^{-1}\text{ existe si y solo si }x\neq1\text{ y }x\neq-1\;}
      $$

      Un detalle de redacción que el enunciado invita a fallar: pide «el valor
      de $x$», en singular, y la respuesta es **todos menos dos**.

      **b) ii. La inversa en $x=-2$.** Ahí el determinante vale
      $\left(-2\right)^{2}-1=3$, así que existe. La matriz queda

      $$
      A\left(-2\right)=\begin{pmatrix}
      1&2&0&0\\
      0&1&2&0\\
      -1&-3&1&3\\
      0&1&0&-1
      \end{pmatrix}
      $$

      y por Gauss-Jordan sobre $\left(A\mid I\right)$:

      $$
      \boxed{\;A^{-1}=\frac{1}{3}\begin{pmatrix}
      -1&2&-4&-12\\
      2&-1&2&6\\
      -1&2&-1&-3\\
      2&-1&2&3
      \end{pmatrix}\;}
      $$

      Comprobado por los dos lados: $AA^{-1}=A^{-1}A=I$. En una inversa de
      orden $4$ la comprobación no es un lujo, es parte del ejercicio: son
      dieciséis entradas y cualquiera de ellas puede llevarse un signo por
      delante.

  - id: exalg2223-ext-4-los-parametros-que-el-autovector-obliga
    titulo: El autovector como ecuación, y tres parámetros que caen
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, curso 2022-2023 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar que los autovectores asociados a autovalores diferentes son
      linealmente independientes.

      b) Sea

      $$
      A=\begin{pmatrix}
      1&2&\alpha\\
      2&1&\beta\\
      2&2&\gamma
      \end{pmatrix},
      $$

      donde $\lambda=1$ es un autovalor de $A$ y $\left(1,1,1\right)$ es un
      autovector asociado a $\lambda=1$.

      i. Hallar $\alpha,\beta,\gamma$.

      ii. En caso de ser diagonalizable, diagonalizar $A$, dando la matriz de
      cambio de base correspondiente.
    pide: La demostración, los tres parámetros, y la diagonalización.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que $\left(1,1,1\right)$ es autovector de
          autovalor $1$. ¿Qué se hace con ese dato?
        opciones:
          - texto: >-
              Se escribe $A\left(1,1,1\right)^{T}=1\cdot\left(1,1,1\right)^{T}$
              y sale un sistema de tres ecuaciones, una por fila
            correcta: true
            mensaje: |
              Eso es, y es lo que hace fácil el ejercicio: cada fila da una
              ecuación con un solo parámetro dentro, así que los tres se
              despejan por separado y sin resolver ningún sistema acoplado.
          - texto: >-
              Se calcula el polinomio característico y se impone que $1$ sea
              raíz
            mensaje: |
              También funciona, pero cuesta mucho más: sale **una** ecuación
              con los tres parámetros mezclados, y aún faltarían dos
              condiciones. La definición de autovector da las tres de golpe.
          - texto: >-
              Se impone $\det A=1$
            mensaje: |
              El determinante es el **producto** de los autovalores, no uno de
              ellos. Saber que $1$ es autovalor no dice cuánto vale el
              determinante.
          - texto: >-
              Se impone que la traza valga $1$
            mensaje: |
              La traza es la **suma** de los tres autovalores. Con uno solo
              conocido no se puede imponer nada sobre ella.

      - tipo: calcular
        titulo: Los tres parámetros
        pregunta: |
          Los valores de $\alpha$, $\beta$ y $\gamma$, en ese orden.
        respuesta:
          tipo: vector
          valor: '(-2, -2, -3)'
          tolerancia: 0.001
          formato: tres números entre paréntesis, separados por comas
        distractores:
          - valor: '(2, 2, 3)'
            mensaje: |
              Los tres signos. De la primera fila,
              $1+2+\alpha=1$, así que $\alpha=1-3=-2$: hay que **restar**, no
              sumar.
          - valor: '(-2, -2, -4)'
            mensaje: |
              La tercera. La tercera fila es
              $2+2+\gamma=1$, luego $\gamma=1-4=-3$. Comprueba multiplicando:
              $A\left(1,1,1\right)^{T}$ tiene que dar $\left(1,1,1\right)$
              exacto.
          - valor: '(-2, -3, -2)'
            mensaje: |
              Los dos últimos cambiados de sitio. La segunda fila es
              $2+1+\beta=1$, que da $\beta=-2$; la tercera es
              $2+2+\gamma=1$, que da $\gamma=-3$.
        pista: |
          Cada fila de $A\left(1,1,1\right)^{T}=\left(1,1,1\right)^{T}$ es
          «suma de las tres entradas de la fila $=1$».
        desarrollo: |
          La condición de autovector, escrita fila a fila:

          | fila | ecuación | despejado |
          |---|---|---|
          | 1.ª | $1+2+\alpha=1$ | $\alpha=-2$ |
          | 2.ª | $2+1+\beta=1$ | $\beta=-2$ |
          | 3.ª | $2+2+\gamma=1$ | $\gamma=-3$ |

          $$
          A=\begin{pmatrix}1&2&-2\\2&1&-2\\2&2&-3\end{pmatrix}
          $$

          y se comprueba:
          $A\left(1,1,1\right)^{T}=\left(1,1,1\right)^{T}$.

      - tipo: calcular
        titulo: El otro autovalor
        pregunta: |
          Con $A$ ya completa, la traza vale $-1$ y el determinante $1$. Además
          de $\lambda=1$, ¿cuál es el otro autovalor?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Si los tres fuesen $1$, la traza valdría $3$ y no $-1$. El otro
              autovalor es distinto, y además es doble.
          - valor: '-2'
            mensaje: |
              Con $1$, $-2$ y un tercero, el producto tendría que dar $1$: el
              tercero sería $-\tfrac{1}{2}$, y entonces la traza no da $-1$.
              Resuelve $-\lambda^{3}-\lambda^{2}+\lambda+1=0$.
          - valor: '3'
            mensaje: |
              Un autovalor positivo grande contradice la traza, que vale $-1$:
              con $1$ y $3$ dentro, el que falta tendría que valer $-5$, y
              entonces el determinante no sale $1$.
        pista: |
          El polinomio característico es
          $-\left(\lambda+1\right)^{2}\left(\lambda-1\right)$. O usa que la
          traza es la suma y el determinante el producto.
        desarrollo: |
          Con traza $-1$, suma de menores principales $-1$ y determinante $1$:

          $$
          p\left(\lambda\right)=-\lambda^{3}-\lambda^{2}+\lambda+1
          =-\left(\lambda+1\right)^{2}\left(\lambda-1\right)
          $$

          Autovalores: $\lambda=1$ simple y $\lambda=-1$ **doble**. Cuadra con
          los dos datos: la suma es $1-1-1=-1$ y el producto
          $1\cdot\left(-1\right)\cdot\left(-1\right)=1$.

      - tipo: calcular
        titulo: La multiplicidad geométrica del autovalor doble
        pregunta: |
          ¿Cuánto vale $\dim\operatorname{Ker}\left(A+I\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ dejaría a $A$ sin diagonalizar. Pero $A+I$ tiene sus **tres
              filas iguales** a $\left(2,2,-2\right)$: su rango es $1$, así que
              el núcleo tiene dimensión $2$.
          - valor: '3'
            mensaje: |
              $3$ exigiría $A+I=0$, es decir $A=-I$. No lo es, y además la
              multiplicidad geométrica nunca supera a la algebraica, que aquí
              vale $2$.
          - valor: '0'
            mensaje: |
              Si fuese $0$, $-1$ no sería autovalor. Y lo es: es raíz doble del
              polinomio característico.
        pista: |
          Escribe $A+I$ y mira sus tres filas antes de resolver nada.
        desarrollo: |
          $$
          A+I=\begin{pmatrix}2&2&-2\\2&2&-2\\2&2&-2\end{pmatrix}
          $$

          Las tres filas son idénticas, así que el rango vale $1$ y

          $$
          \dim\operatorname{Ker}\left(A+I\right)=3-1=2
          $$

          que es exactamente la multiplicidad algebraica de $-1$. **Con eso,
          $A$ diagonaliza**: el autovalor simple aporta siempre su dirección, y
          el doble aporta las dos que hacían falta.

          El subespacio propio es el plano $x+y-z=0$, con base
          $\left\{\left(1,0,1\right),\left(0,1,1\right)\right\}$.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a), en el caso de dos
          autovalores. Una pieza es falsa.
        piezas:
          - texto: >-
              Sean $\overline{x}_{1}$ y $\overline{x}_{2}$ autovectores de
              autovalores distintos $\lambda_{1}\neq\lambda_{2}$, y supongamos
              $\alpha_{1}\overline{x}_{1}+\alpha_{2}\overline{x}_{2}
              =\overline{0}$.
          - texto: >-
              Aplicando $A$ a esa igualdad sale
              $\alpha_{1}\lambda_{1}\overline{x}_{1}
              +\alpha_{2}\lambda_{2}\overline{x}_{2}=\overline{0}$.
          - texto: >-
              Multiplicando la primera por $\lambda_{2}$ y restando, queda
              $\alpha_{1}\left(\lambda_{1}-\lambda_{2}\right)\overline{x}_{1}
              =\overline{0}$.
          - texto: >-
              Como $\lambda_{1}\neq\lambda_{2}$ y $\overline{x}_{1}$ no es
              nulo, se deduce $\alpha_{1}=0$, y con ello $\alpha_{2}=0$.
          - texto: >-
              Y de aquí se sigue que toda matriz con al menos dos autovalores
              distintos es diagonalizable.
            trampa: true
            mensaje: |
              Lo que se ha demostrado es que los autovectores de autovalores
              distintos son independientes, no que haya **suficientes**. Para
              diagonalizar hacen falta $n$ vectores propios independientes, y
              un autovalor múltiple puede no aportar tantos como su
              multiplicidad: la matriz $B$ de la ordinaria de este mismo curso
              tiene dos autovalores distintos y no diagonaliza. Lo que sí se
              sigue —y es el corolario útil— es que $n$ autovalores **todos
              distintos** garantizan la diagonalización.
    resolucion: |
      **a) Independencia, con dos autovalores.** Se supone una combinación nula
      $\alpha_{1}\overline{x}_{1}+\alpha_{2}\overline{x}_{2}=\overline{0}$ y se
      juega con ella de dos maneras: aplicando $A$, y multiplicando por
      $\lambda_{2}$.

      $$
      \alpha_{1}\lambda_{1}\overline{x}_{1}
      +\alpha_{2}\lambda_{2}\overline{x}_{2}=\overline{0},
      \qquad
      \alpha_{1}\lambda_{2}\overline{x}_{1}
      +\alpha_{2}\lambda_{2}\overline{x}_{2}=\overline{0}
      $$

      Restando desaparece el segundo término:

      $$
      \alpha_{1}\left(\lambda_{1}-\lambda_{2}\right)\overline{x}_{1}
      =\overline{0}
      $$

      y como $\lambda_{1}\neq\lambda_{2}$ y un autovector nunca es nulo, sale
      $\alpha_{1}=0$; sustituyendo, $\alpha_{2}=0$. Para más de dos autovalores
      el argumento es el mismo por inducción.

      **b) i. El autovector es el que da las ecuaciones.** La definición
      $A\overline{x}=\lambda\overline{x}$, con $\overline{x}=\left(1,1,1\right)$
      y $\lambda=1$, dice que **la suma de cada fila vale $1$**:

      | fila | ecuación | despejado |
      |---|---|---|
      | 1.ª | $1+2+\alpha=1$ | $\alpha=-2$ |
      | 2.ª | $2+1+\beta=1$ | $\beta=-2$ |
      | 3.ª | $2+2+\gamma=1$ | $\gamma=-3$ |

      $$
      \boxed{\;A=\begin{pmatrix}1&2&-2\\2&1&-2\\2&2&-3\end{pmatrix}\;}
      $$

      Es más rápido que el camino del polinomio característico, y conviene
      verlo: el dato «$\overline{x}$ es autovector» no es información sobre el
      polinomio, es **un sistema de $n$ ecuaciones**.

      **b) ii. Los autovalores y la diagonalización.**

      $$
      p\left(\lambda\right)=-\left(\lambda+1\right)^{2}
      \left(\lambda-1\right)
      $$

      así que $\lambda=1$ es simple y $\lambda=-1$ doble. La única duda está en
      el doble, y se resuelve mirando $A+I$:

      $$
      A+I=\begin{pmatrix}2&2&-2\\2&2&-2\\2&2&-2\end{pmatrix}
      $$

      Tres filas iguales, rango $1$, núcleo de dimensión $2$: exactamente la
      multiplicidad que hacía falta. **$A$ diagonaliza.**

      Los subespacios propios:

      $$
      V_{-1}=\left\{x+y-z=0\right\}
      =L\left(\left\{\left(1,0,1\right),
      \left(0,1,1\right)\right\}\right),
      \qquad
      V_{1}=L\left(\left\{\left(1,1,1\right)\right\}\right)
      $$

      y el $V_{1}$ no hay ni que calcularlo: lo da el enunciado.

      $$
      \boxed{\;P=\begin{pmatrix}1&0&1\\0&1&1\\1&1&1\end{pmatrix},
      \qquad
      D=\begin{pmatrix}-1&0&0\\0&-1&0\\0&0&1\end{pmatrix},
      \qquad
      P^{-1}AP=D\;}
      $$

      con $\det P=-1\neq0$, que confirma que las tres columnas son
      independientes. El orden de las columnas de $P$ tiene que ser el mismo
      que el de la diagonal de $D$; cambiarlo está bien mientras se cambien las
      dos cosas a la vez.
