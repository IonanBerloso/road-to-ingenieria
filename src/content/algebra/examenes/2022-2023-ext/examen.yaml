# Cuadernillo bilingüe, como todos: el mismo examen en castellano y en euskera.
# Se transcribe una vez, desde la versión castellana.
#
# §17 en estado puro. `pdftotext -layout` deja las dos matrices del enunciado
# ilegibles: los seis huecos de $S_1$ y $S_2$ salen en una sola línea sin saber
# qué va arriba y qué abajo, y la matriz $4\times4$ del ejercicio 3 sale
# repartida en cinco renglones desordenados. Las dos se han leído de la página
# renderizada a 190 ppp, que para la DISPOSICIÓN sí sirve.
#
# El ejercicio 3 va etiquetado como `t04-determinantes` y no como euclídeos,
# que es lo que ocupa ese hueco en las otras convocatorias. El motivo es que
# aquí el apartado (a) es la definición de ortogonalidad y el teorema de
# Pitágoras —teoría— y todo el cálculo, que es donde viven los pasos guiados,
# es la inversa de una matriz de orden 4 con un parámetro dentro.
#
# Y va al 4 y no al 3 porque **el temario oficial pone la matriz inversa y el
# rango en el tema de Determinantes**, no en el de Matrices: son sus apartados
# 4 y 5. La hoja de Matrices no menciona ni una cosa ni la otra. Estuvo
# etiquetado como `t03-matrices` hasta el 27 de agosto de 2026, y se corrigió
# al leer el temario para escribir el tema 3.
#
# Como todos los de Álgebra, no publica reparto de puntos.
pdf: 2022-2023-ext.pdf

