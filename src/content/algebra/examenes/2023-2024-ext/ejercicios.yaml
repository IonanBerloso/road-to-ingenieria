ejercicios:
  - id: exalg2324-ext-1-dos-combinaciones-y-las-matrices-de-traza-nula
    titulo: Dos combinaciones que a veces son dependientes
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, curso 2023-2024 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sea $\left\{\overline{u},\overline{v}\right\}$ una familia libre de
      vectores del espacio vectorial $V$. Estudiar si los vectores
      $\left(2\overline{u}+\lambda\overline{v}\right)$ y
      $\left(\lambda\overline{u}+3\overline{v}\right)$ son linealmente
      independientes en función del parámetro $\lambda\in K$.

      b) Sea

      $$
      S=\left\{A\in M_{2\times2}\left(\mathbb{R}\right)\;/\;
      \operatorname{traza}\left(A\right)=a_{11}+a_{22}=0\right\}
      $$

      un subconjunto de $M_{2\times2}\left(\mathbb{R}\right)$. Demostrar que $S$
      es subespacio vectorial y hallar una base y la dimensión del subespacio.
    pide: El estudio en función de λ, y la demostración con base y dimensión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se estudia si dos combinaciones de $\overline{u}$ y
          $\overline{v}$ son independientes?
        opciones:
          - texto: >-
              Con el determinante de la matriz de sus coeficientes: son
              independientes si y solo si no se anula
            correcta: true
            mensaje: |
              Eso es, y funciona **porque $\left\{\overline{u},\overline{v}\right\}$
              es libre**. Esa hipótesis es la que permite pasar de una relación
              entre los vectores nuevos a un sistema sobre los coeficientes.
          - texto: >-
              Comprobando si uno es múltiplo del otro, coordenada a coordenada
            mensaje: |
              No hay coordenadas: $\overline{u}$ y $\overline{v}$ son vectores
              abstractos de un espacio cualquiera. Lo que sí se puede es
              trabajar con los coeficientes, y eso es el determinante.
          - texto: >-
              Calculando la norma de cada uno
            mensaje: |
              No hay producto escalar en el enunciado, así que no hay norma. Y
              aunque lo hubiera, la norma no dice nada sobre la independencia.

      - tipo: calcular
        titulo: Los valores de λ que los hacen dependientes
        pregunta: |
          ¿Para qué valores de $\lambda$ son **dependientes**?
        respuesta:
          tipo: conjunto
          valor: '2.4494897, -2.4494897'
          tolerancia: 0.001
          formato: los dos valores separados por una coma; vale la forma exacta
        distractores:
          - valor: '6, -6'
            mensaje: |
              $\pm6$ sería la solución de $\lambda=\pm6$. La ecuación es
              $\lambda^{2}=6$, así que hay que sacar la raíz:
              $\lambda=\pm\sqrt6$.
          - valor: '5, -5'
            mensaje: |
              Parece salir de $2+3=5$. El determinante es $2\cdot3-\lambda^{2}$,
              con el producto de la diagonal, no la suma.
          - valor: '1, -1'
            mensaje: |
              Con $\lambda=\pm1$ el determinante vale $6-1=5\neq0$: ahí son
              independientes.
        pista: |
          El determinante de $\begin{pmatrix}2&\lambda\\\lambda&3\end{pmatrix}$
          es $6-\lambda^{2}$.
        desarrollo: |
          Si $\alpha\left(2\overline{u}+\lambda\overline{v}\right)
          +\beta\left(\lambda\overline{u}+3\overline{v}\right)=\overline{0}$,
          agrupando:

          $$
          \left(2\alpha+\lambda\beta\right)\overline{u}
          +\left(\lambda\alpha+3\beta\right)\overline{v}=\overline{0}
          $$

          y como $\left\{\overline{u},\overline{v}\right\}$ es **libre**, los dos
          coeficientes son cero:

          $$
          \begin{cases}2\alpha+\lambda\beta=0\\ \lambda\alpha+3\beta=0\end{cases}
          \qquad
          \begin{vmatrix}2&\lambda\\\lambda&3\end{vmatrix}=6-\lambda^{2}
          $$

          El sistema tiene solución distinta de la trivial —y los vectores son
          dependientes— exactamente cuando $6-\lambda^{2}=0$, es decir
          $\lambda=\pm\sqrt6\approx\pm2{,}4495$.

      - tipo: calcular
        titulo: La dimensión de las matrices de traza nula
        pregunta: |
          ¿Cuál es la dimensión de $S$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              La condición $a_{11}+a_{22}=0$ es **una sola** ecuación, así que
              quita **un** grado de libertad de los cuatro: quedan tres.
          - valor: '4'
            mensaje: |
              $4$ es la dimensión de $M_{2\times2}\left(\mathbb{R}\right)$
              entero. La traza nula es una restricción de verdad: la identidad,
              por ejemplo, no está en $S$.
          - valor: '1'
            mensaje: |
              $1$ es la dimensión de las **antisimétricas**. Aquí solo se pide
              que la diagonal sume cero: $b$ y $c$ quedan completamente libres.
        pista: |
          $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ con $a+d=0$, o sea $d=-a$.
          ¿Cuántos parámetros quedan?
        desarrollo: |
          $$
          A=\begin{pmatrix}a&b\\c&-a\end{pmatrix}
          $$

          Quedan tres parámetros libres: $a$, $b$ y $c$. Una base:

          $$
          \begin{pmatrix}1&0\\0&-1\end{pmatrix},
          \qquad
          \begin{pmatrix}0&1\\0&0\end{pmatrix},
          \qquad
          \begin{pmatrix}0&0\\1&0\end{pmatrix}
          $$

          $$
          \dim S=3
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              $S$ no es vacío: la matriz nula tiene traza $0$.
          - texto: >-
              La traza es **lineal**:
              $\operatorname{traza}\left(\alpha A+\beta B\right)
              =\alpha\operatorname{traza}\left(A\right)
              +\beta\operatorname{traza}\left(B\right)$.
          - texto: >-
              Luego si $A,B\in S$ entonces
              $\operatorname{traza}\left(\alpha A+\beta B\right)=0$ y
              $\alpha A+\beta B\in S$: es subespacio.
          - texto: >-
              Y como la traza es multiplicativa,
              $\operatorname{traza}\left(AB\right)
              =\operatorname{traza}\left(A\right)\operatorname{traza}\left(B\right)$,
              el producto de dos elementos de $S$ también está en $S$.
            trampa: true
            mensaje: |
              La traza **no** es multiplicativa: eso lo cumple el determinante,
              no la traza. Con
              $A=\begin{pmatrix}0&1\\0&0\end{pmatrix}$ y
              $B=\begin{pmatrix}0&0\\1&0\end{pmatrix}$, las dos tienen traza
              $0$ y su producto es
              $\begin{pmatrix}1&0\\0&0\end{pmatrix}$, de traza $1$. Y además el
              producto **no hace falta**: un subespacio solo tiene que ser
              cerrado para la suma y para el producto por escalares, no para el
              producto de matrices.
    resolucion: |
      **a) Dos combinaciones, y cuándo se estropean.** Se plantea la definición
      de independencia y se deja que la hipótesis trabaje:

      $$
      \alpha\left(2\overline{u}+\lambda\overline{v}\right)
      +\beta\left(\lambda\overline{u}+3\overline{v}\right)=\overline{0}
      $$

      Agrupando por $\overline{u}$ y $\overline{v}$:

      $$
      \left(2\alpha+\lambda\beta\right)\overline{u}
      +\left(\lambda\alpha+3\beta\right)\overline{v}=\overline{0}
      $$

      **Y aquí es donde se usa que $\left\{\overline{u},\overline{v}\right\}$ es
      libre**, que es la única hipótesis del enunciado: una combinación de una
      familia libre solo da $\overline{0}$ con todos los coeficientes nulos.

      $$
      \begin{cases}
      2\alpha+\lambda\beta=0\\
      \lambda\alpha+3\beta=0
      \end{cases}
      $$

      Un sistema homogéneo con dos incógnitas. Tiene **solo** la solución
      trivial —y entonces los vectores son independientes— si y solo si su
      determinante no se anula:

      $$
      \begin{vmatrix}2&\lambda\\\lambda&3\end{vmatrix}=6-\lambda^{2}
      $$

      $$
      \boxed{\;
      \begin{cases}
      \text{independientes} & \text{si }\lambda\neq\pm\sqrt6\\
      \text{dependientes} & \text{si }\lambda=\sqrt6\ \text{o}\ \lambda=-\sqrt6
      \end{cases}\;}
      $$

      **Comprobación en el caso malo.** Con $\lambda=\sqrt6$, los dos vectores
      son $2\overline{u}+\sqrt6\,\overline{v}$ y
      $\sqrt6\,\overline{u}+3\overline{v}$, y el segundo es
      $\frac{\sqrt6}{2}$ veces el primero:
      $\frac{\sqrt6}{2}\cdot2=\sqrt6$ ✓ y
      $\frac{\sqrt6}{2}\cdot\sqrt6=\frac{6}{2}=3$ ✓.

      **b) Las matrices de traza nula.**

      **Que es subespacio se demuestra sin describirlo**, y en una línea, si se
      dice lo importante: **la traza es una aplicación lineal** de
      $M_{2\times2}\left(\mathbb{R}\right)$ en $\mathbb{R}$.

      | qué | por qué |
      |---|---|
      | no vacío | $\operatorname{traza}\left(O\right)=0$ |
      | cerrado | $\operatorname{traza}\left(\alpha A+\beta B\right)=\alpha\cdot0+\beta\cdot0=0$ |

      $\blacksquare$

      De hecho $S=\operatorname{Ker}\left(\operatorname{traza}\right)$, y el
      núcleo de una aplicación lineal siempre es subespacio. Decirlo así es más
      corto y explica **por qué**.

      **La base y la dimensión.** La condición $a_{11}+a_{22}=0$ es **una sola
      ecuación**, así que quita un grado de libertad de los cuatro:

      $$
      A=\begin{pmatrix}a&b\\c&-a\end{pmatrix}
      =a\begin{pmatrix}1&0\\0&-1\end{pmatrix}
      +b\begin{pmatrix}0&1\\0&0\end{pmatrix}
      +c\begin{pmatrix}0&0\\1&0\end{pmatrix}
      $$

      $$
      \boxed{\;
      B=\left\{
      \begin{pmatrix}1&0\\0&-1\end{pmatrix},
      \begin{pmatrix}0&1\\0&0\end{pmatrix},
      \begin{pmatrix}0&0\\1&0\end{pmatrix}\right\},
      \qquad \dim S=3\;}
      $$

      **Que es base se ve solo**: generan por la escritura de arriba, y son
      independientes porque cada una tiene un $1$ donde las otras tienen $0$.

      Y hay una comprobación general que conviene tener: **el núcleo de una
      aplicación lineal no nula sobre $\mathbb{R}$ pierde exactamente una
      dimensión**. Aquí, $4-1=3$ ✓.

  - id: exalg2324-ext-2-tres-datos-torcidos-y-una-aplicacion
    titulo: Tres datos torcidos, y la aplicación que sale de ellos
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, curso 2023-2024 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar que si el núcleo o kernel de una aplicación lineal solo
      contiene al vector nulo, la aplicación lineal es inyectiva.

      b) Sean
      $B=\left\{\overline{e}_{1},\overline{e}_{2},\overline{e}_{3}\right\}$ la
      base canónica de $\mathbb{R}^{3}$ y
      $f\colon\mathbb{R}^{3}\to\mathbb{R}^{3}$ una aplicación lineal tal que
      $f\left(\overline{e}_{3}\right)=3\overline{e}_{1}+\overline{e}_{3}$,
      $f\left(\overline{e}_{3}-2\overline{e}_{2}\right)
      =\overline{e}_{1}+2\overline{e}_{2}-\overline{e}_{3}$ y
      $\overline{e}_{1}+\overline{e}_{2}\in\operatorname{Ker}\left(f\right)$.

      i. Calcular la matriz asociada a la aplicación lineal.

      ii. Calcular bases y dimensiones de $\operatorname{Im}\left(f\right)$ y
      $\operatorname{Ker}\left(f\right)$. Clasificar la aplicación.

      iii. Calcular la matriz asociada a la aplicación lineal en la base $B'$:

      $$
      B'=\left\{\left(1,0,-2\right),\left(0,1,1\right),\left(1,0,-1\right)\right\}
      $$
    pide: La demostración, la matriz, las bases, la clasificación y la matriz en B'.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los datos no dan $f\left(\overline{e}_{1}\right)$ ni
          $f\left(\overline{e}_{2}\right)$ directamente. ¿Cómo se obtienen?
        opciones:
          - texto: >-
              De la segunda condición sale
              $f\left(\overline{e}_{2}\right)$ despejando, y de la tercera sale
              $f\left(\overline{e}_{1}\right)$ porque
              $f\left(\overline{e}_{1}\right)=-f\left(\overline{e}_{2}\right)$
            correcta: true
            mensaje: |
              Eso es. $f\left(\overline{e}_{3}-2\overline{e}_{2}\right)
              =f\left(\overline{e}_{3}\right)-2f\left(\overline{e}_{2}\right)$
              despeja el segundo, y que
              $\overline{e}_{1}+\overline{e}_{2}$ esté en el núcleo dice
              $f\left(\overline{e}_{1}\right)+f\left(\overline{e}_{2}\right)
              =\overline{0}$.
          - texto: >-
              Suponiendo que $f\left(\overline{e}_{1}\right)=\overline{0}$,
              porque $\overline{e}_{1}$ aparece en el núcleo
            mensaje: |
              Lo que está en el núcleo es la **suma**
              $\overline{e}_{1}+\overline{e}_{2}$, no cada sumando. Que una suma
              vaya a $\overline{0}$ no obliga a que sus partes lo hagan.
          - texto: >-
              No se pueden: faltan datos y el problema está mal planteado
            mensaje: |
              Hay exactamente tres datos y el espacio tiene dimensión tres. Lo
              que hay que comprobar es que los tres vectores implicados sean
              base, y lo son.

      - tipo: calcular
        titulo: La imagen del segundo vector canónico
        pregunta: |
          ¿Cuánto vale $f\left(\overline{e}_{2}\right)$?
        respuesta:
          tipo: vector
          valor: '(1, -1, 1)'
          tolerancia: 0.001
          formato: las tres coordenadas en orden
        distractores:
          - valor: '(2, -2, 2)'
            mensaje: |
              Falta dividir entre $2$. De
              $f\left(\overline{e}_{3}\right)-2f\left(\overline{e}_{2}\right)
              =\left(1,2,-1\right)$ sale
              $2f\left(\overline{e}_{2}\right)=\left(2,-2,2\right)$, y todavía
              hay que partirlo por la mitad.
          - valor: '(-1, 1, -1)'
            mensaje: |
              Ese es $f\left(\overline{e}_{1}\right)$, que es el **opuesto**.
              Los dos salen del mismo cálculo y es fácil cambiarlos.
          - valor: '(1, 2, -1)'
            mensaje: |
              Ese es el dato $f\left(\overline{e}_{3}-2\overline{e}_{2}\right)$
              tal cual, sin despejar nada.
        pista: |
          $f\left(\overline{e}_{3}\right)-2f\left(\overline{e}_{2}\right)
          =\left(1,2,-1\right)$, y
          $f\left(\overline{e}_{3}\right)=\left(3,0,1\right)$.
        desarrollo: |
          $$
          f\left(\overline{e}_{3}-2\overline{e}_{2}\right)
          =f\left(\overline{e}_{3}\right)-2f\left(\overline{e}_{2}\right)
          =\left(1,2,-1\right)
          $$

          $$
          2f\left(\overline{e}_{2}\right)
          =\left(3,0,1\right)-\left(1,2,-1\right)=\left(2,-2,2\right)
          \;\Longrightarrow\;
          f\left(\overline{e}_{2}\right)=\left(1,-1,1\right)
          $$

          Y de la tercera condición,
          $f\left(\overline{e}_{1}\right)=-f\left(\overline{e}_{2}\right)
          =\left(-1,1,-1\right)$.

      - tipo: calcular
        titulo: La matriz asociada en la base canónica
        pregunta: |
          ¿Cuál es la matriz de $f$ en la base canónica?
        respuesta:
          tipo: matriz
          valor: '-1, 1, 3; 1, -1, 0; -1, 1, 1'
          tolerancia: 0.001
          formato: filas separadas por punto y coma, por ejemplo -1,1,3; 1,-1,0; -1,1,1
        distractores:
          - valor: '-1, 1, -1; 1, -1, 1; 3, 0, 1'
            mensaje: |
              Es la **traspuesta**: las imágenes están puestas en fila. Las
              imágenes de los vectores de la base van en **columna**.
          - valor: '1, -1, 3; -1, 1, 0; 1, -1, 1'
            mensaje: |
              La primera columna con el signo cambiado. De
              $\overline{e}_{1}+\overline{e}_{2}\in\operatorname{Ker}$ sale
              $f\left(\overline{e}_{1}\right)=-f\left(\overline{e}_{2}\right)
              =\left(-1,1,-1\right)$.
          - valor: '3, 0, 1; 1, 2, -1; 0, 0, 0'
            mensaje: |
              Esos son los tres datos del enunciado copiados como filas, sin
              despejar las imágenes de la base canónica.
        pista: |
          Las columnas son $f\left(\overline{e}_{1}\right)$,
          $f\left(\overline{e}_{2}\right)$ y
          $f\left(\overline{e}_{3}\right)$, en ese orden.
        desarrollo: |
          $$
          A=\begin{pmatrix}
          -1 & 1 & 3\\
          1 & -1 & 0\\
          -1 & 1 & 1
          \end{pmatrix}
          $$

          **Comprobación con los tres datos:**

          | dato | $A$ lo confirma |
          |---|---|
          | $f\left(\overline{e}_{3}\right)=\left(3,0,1\right)$ | tercera columna ✓ |
          | $f\left(\overline{e}_{3}-2\overline{e}_{2}\right)=\left(1,2,-1\right)$ | ✓ |
          | $f\left(\overline{e}_{1}+\overline{e}_{2}\right)=\overline{0}$ | las dos primeras columnas se cancelan ✓ |

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Sean $\overline{x},\overline{y}$ con
              $f\left(\overline{x}\right)=f\left(\overline{y}\right)$. Hay que
              llegar a $\overline{x}=\overline{y}$.
          - texto: >-
              Restando y usando la linealidad,
              $f\left(\overline{x}\right)-f\left(\overline{y}\right)
              =f\left(\overline{x}-\overline{y}\right)=\overline{0}$.
          - texto: >-
              Luego $\overline{x}-\overline{y}\in\operatorname{Ker}\left(f\right)
              =\left\{\overline{0}\right\}$, así que
              $\overline{x}-\overline{y}=\overline{0}$ y
              $\overline{x}=\overline{y}$.
          - texto: >-
              Y este argumento vale para cualquier aplicación, lineal o no,
              porque solo usa la definición de núcleo.
            trampa: true
            mensaje: |
              Usa la linealidad **dos veces**, y sin ella el paso central es
              falso: $f\left(\overline{x}\right)-f\left(\overline{y}\right)$ no
              tiene por qué ser $f\left(\overline{x}-\overline{y}\right)$. El
              contraejemplo de siempre: $f\left(x\right)=x^{2}$ sobre
              $\mathbb{R}$ tiene «núcleo» $\left\{0\right\}$ y no es inyectiva,
              porque $f\left(2\right)=f\left(-2\right)$.
    resolucion: |
      **a) Núcleo trivial implica inyectiva.** Sean $\overline{x},\overline{y}$
      con $f\left(\overline{x}\right)=f\left(\overline{y}\right)$:

      $$
      f\left(\overline{x}\right)-f\left(\overline{y}\right)=\overline{0}
      \;\overset{\text{lineal}}{\Longrightarrow}\;
      f\left(\overline{x}-\overline{y}\right)=\overline{0}
      \;\Longrightarrow\;
      \overline{x}-\overline{y}\in\operatorname{Ker}\left(f\right)
      =\left\{\overline{0}\right\}
      $$

      $$
      \Longrightarrow\;\overline{x}=\overline{y}
      \qquad\blacksquare
      $$

      **Dónde se usa la linealidad**: en el paso de
      $f\left(\overline{x}\right)-f\left(\overline{y}\right)$ a
      $f\left(\overline{x}-\overline{y}\right)$. Sin ella el teorema es falso —
      $f\left(x\right)=x^{2}$ solo anula al cero y no es inyectiva—.

      **b) i · La matriz.** Los datos vienen torcidos a propósito: ninguno da
      directamente la imagen de un vector canónico salvo el primero. Se despejan
      en cadena:

      | de dónde | qué sale |
      |---|---|
      | dato 1 | $f\left(\overline{e}_{3}\right)=\left(3,0,1\right)$ |
      | dato 2, por linealidad | $2f\left(\overline{e}_{2}\right)=f\left(\overline{e}_{3}\right)-\left(1,2,-1\right)=\left(2,-2,2\right)$, luego $f\left(\overline{e}_{2}\right)=\left(1,-1,1\right)$ |
      | dato 3 | $f\left(\overline{e}_{1}\right)+f\left(\overline{e}_{2}\right)=\overline{0}$, luego $f\left(\overline{e}_{1}\right)=\left(-1,1,-1\right)$ |

      $$
      \boxed{\;A=\begin{pmatrix}
      -1 & 1 & 3\\
      1 & -1 & 0\\
      -1 & 1 & 1
      \end{pmatrix}\;}
      $$

      **Ojo al tercer dato**: dice que la **suma**
      $\overline{e}_{1}+\overline{e}_{2}$ está en el núcleo, no cada sumando.
      Suponer que $f\left(\overline{e}_{1}\right)=\overline{0}$ es el error que
      arruina el ejercicio entero.

      **b) ii · Núcleo, imagen y clasificación.** Las dos primeras columnas de
      $A$ son opuestas, así que el rango no llega a $3$:

      $$
      \operatorname{rango}A=2
      \;\Longrightarrow\;
      \dim\operatorname{Im}=2,
      \qquad
      \dim\operatorname{Ker}=3-2=1
      $$

      | | base |
      |---|---|
      | $\operatorname{Ker}\left(f\right)$ | $\left\{\left(1,1,0\right)\right\}$, que lo regala el enunciado |
      | $\operatorname{Im}\left(f\right)$ | $\left\{\left(-1,1,-1\right),\left(3,0,1\right)\right\}$ |

      $$
      \boxed{\;f\text{ no es inyectiva ni suprayectiva}\;}
      $$

      **b) iii · La matriz en $B'$.** Con
      $B'=\left\{\left(1,0,-2\right),\left(0,1,1\right),\left(1,0,-1\right)\right\}$
      y $P$ la matriz que las tiene por columnas —$\det P=1$, así que es base—:

      $$
      M=P^{-1}A\,P
      =\begin{pmatrix}
      11 & -7 & 7\\
      1 & -1 & 1\\
      -18 & 11 & -11
      \end{pmatrix}
      $$

      **Los números salen feos y eso no es señal de error.** La comprobación que
      lo confirma es la **traza**, que es la misma en matrices semejantes:

      $$
      \operatorname{tr}A=-1-1+1=-1,
      \qquad
      \operatorname{tr}M=11-1-11=-1\;\checkmark
      $$

      Y una segunda: $\det M=\det A=0$, porque el determinante también se
      conserva por semejanza. Con dos invariantes cuadrando, un error de signo
      es muy improbable.

  - id: exalg2324-ext-3-la-identidad-de-polarizacion-y-una-inversa
    titulo: Una identidad que recupera el producto escalar, y una inversa
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, curso 2023-2024 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · Los apartados a) y b) son
      del tema 6 y el c) del tema 4 · El examen no publica solución ni reparto
      de puntos: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sea $\left(V,\left\langle\;,\;\right\rangle\right)$ un espacio
      vectorial euclídeo. Demostrar la siguiente igualdad:

      $$
      \left\|\overline{x}+\overline{y}\right\|^{2}
      -\left\|\overline{x}-\overline{y}\right\|^{2}
      =4\left\langle\overline{x},\overline{y}\right\rangle
      $$

      para todos $\overline{x},\overline{y}\in V$.

      b) Sea
      $B=\left\{\overline{e}_{1},\overline{e}_{2},\dots,\overline{e}_{n}\right\}$
      una base ortonormal del espacio euclídeo
      $\left(V,\left\langle\;,\;\right\rangle\right)$. Demuestra que si
      $\overline{x}=x_{1}\overline{e}_{1}+\dots+x_{n}\overline{e}_{n}$ e
      $\overline{y}=y_{1}\overline{e}_{1}+\dots+y_{n}\overline{e}_{n}$, entonces
      $\left\langle\overline{x},\overline{y}\right\rangle
      =x_{1}y_{1}+x_{2}y_{2}+\dots+x_{n}y_{n}$.

      c) Dada la siguiente matriz:

      $$
      A=\begin{pmatrix}
      x & -1 & -1\\
      -x & x & -1\\
      1 & -1 & x
      \end{pmatrix}
      $$

      i. Hallar los valores de $x$ para los que la matriz $A$ es invertible.

      ii. En caso de ser posible, calcular la inversa de $A$ para $x=0$.
    pide: Las dos demostraciones, los valores de x, y la inversa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve la igualdad del apartado a)?
        opciones:
          - texto: >-
              Para **recuperar el producto escalar a partir de la norma**: si se
              conocen todas las normas, el producto escalar queda determinado
            correcta: true
            mensaje: |
              Eso es, y por eso se llama **identidad de polarización**. Dice que
              la norma lleva dentro toda la información del producto escalar,
              aunque parezca que se ha perdido al elevar al cuadrado.
          - texto: >-
              Para demostrar que la norma es siempre positiva
            mensaje: |
              La positividad viene de la definición de producto escalar, no de
              esta identidad — que de hecho puede dar un número negativo si el
              ángulo es obtuso.
          - texto: >-
              Para calcular ángulos sin usar el coseno
            mensaje: |
              El ángulo sigue saliendo de
              $\cos\theta=\frac{\left\langle x,y\right\rangle}{\|x\|\|y\|}$.
              Esta identidad da el numerador, no evita la fórmula.

      - tipo: calcular
        titulo: Cuántos valores de x estropean la matriz
        pregunta: |
          ¿Para cuántos valores **distintos** de $x$ no es invertible $A$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              El determinante es $\left(x-1\right)^{2}\left(x+1\right)$: tiene
              tres raíces contando multiplicidades, pero el $1$ es **doble**, así
              que valores distintos hay dos.
          - valor: '1'
            mensaje: |
              $x=1$ es uno de los dos. El otro es $x=-1$, donde el determinante
              también se anula.
          - valor: '0'
            mensaje: |
              El determinante sí se anula: en $x=1$ vale $0$. Con $x=0$ vale
              $1$, que es otra cosa.
        pista: |
          $\det A=x^{3}-x^{2}-x+1$. Factorízalo sacando factor común por
          grupos.
        desarrollo: |
          $$
          \det A=x^{3}-x^{2}-x+1
          =x^{2}\left(x-1\right)-\left(x-1\right)
          =\left(x-1\right)\left(x^{2}-1\right)
          =\left(x-1\right)^{2}\left(x+1\right)
          $$

          | $x$ | $\det A$ |
          |---|---|
          | $-1$ | $\mathbf{0}$ |
          | $0$ | $1$ |
          | $1$ | $\mathbf{0}$ |
          | $2$ | $3$ |

          Dos valores distintos: $x=1$ —doble— y $x=-1$.

      - tipo: calcular
        titulo: La inversa en x = 0
        pregunta: |
          Con $x=0$, ¿cuál es $A^{-1}$?
        respuesta:
          tipo: matriz
          valor: '-1, 1, 1; -1, 1, 0; 0, -1, 0'
          tolerancia: 0.001
          formato: filas separadas por punto y coma
        distractores:
          - valor: '-1, -1, 0; 1, 1, -1; 1, 0, 0'
            mensaje: |
              Es la **traspuesta** de la buena. Al resolver por Gauss-Jordan es
              fácil escribir el bloque derecho girado.
          - valor: '0, -1, -1; 0, 0, -1; 1, -1, 0'
            mensaje: |
              Esa es $A$ misma con $x=0$, no su inversa. Se comprueba
              multiplicando: no da la identidad.
          - valor: '1, -1, -1; 1, -1, 0; 0, 1, 0'
            mensaje: |
              Todos los signos cambiados. El determinante vale $+1$, no $-1$,
              así que no hay ningún signo global que sacar.
        pista: |
          $\det A\left(0\right)=1$, así que la inversa existe. Con
          $A=\begin{pmatrix}0&-1&-1\\0&0&-1\\1&-1&0\end{pmatrix}$, Gauss-Jordan
          va rápido porque hay muchos ceros.
        desarrollo: |
          $$
          A\left(0\right)=\begin{pmatrix}0&-1&-1\\0&0&-1\\1&-1&0\end{pmatrix},
          \qquad
          \det=1\neq0
          $$

          $$
          A^{-1}=\begin{pmatrix}-1&1&1\\-1&1&0\\0&-1&0\end{pmatrix}
          $$

          **Comprobación**: $A\cdot A^{-1}=I$, y hay que hacerla — es la única
          manera de saber que no falta un signo.

      - tipo: justificar
        pregunta: Ordena la demostración del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              $\left\|\overline{x}+\overline{y}\right\|^{2}
              =\left\|\overline{x}\right\|^{2}
              +2\left\langle\overline{x},\overline{y}\right\rangle
              +\left\|\overline{y}\right\|^{2}$, desarrollando el producto
              escalar por bilinealidad.
          - texto: >-
              $\left\|\overline{x}-\overline{y}\right\|^{2}
              =\left\|\overline{x}\right\|^{2}
              -2\left\langle\overline{x},\overline{y}\right\rangle
              +\left\|\overline{y}\right\|^{2}$, igual pero con el signo
              cambiado en el término cruzado.
          - texto: >-
              Restando, los cuadrados de las normas se cancelan y quedan los dos
              términos cruzados con el mismo signo:
              $2\left\langle\overline{x},\overline{y}\right\rangle
              +2\left\langle\overline{x},\overline{y}\right\rangle
              =4\left\langle\overline{x},\overline{y}\right\rangle$.
          - texto: >-
              Y en el primer desarrollo aparece el $2$ porque
              $\left\langle\overline{x},\overline{y}\right\rangle$ se cuenta dos
              veces: una en cada dirección, y valen lo mismo porque el producto
              escalar es **bilineal**.
            trampa: true
            mensaje: |
              Lo que hace que $\left\langle\overline{x},\overline{y}\right\rangle$
              y $\left\langle\overline{y},\overline{x}\right\rangle$ valgan lo
              mismo es la **simetría**, no la bilinealidad. La bilinealidad es
              lo que permite abrir el paréntesis en cuatro sumandos; la simetría
              es lo que permite juntar dos de ellos. Son dos propiedades
              distintas de la definición y las dos hacen falta aquí.
    resolucion: |
      **a) La identidad de polarización.** Se desarrollan los dos cuadrados y se
      restan. El primero:

      $$
      \left\|\overline{x}+\overline{y}\right\|^{2}
      =\left\langle\overline{x}+\overline{y},\overline{x}+\overline{y}\right\rangle
      =\left\|\overline{x}\right\|^{2}
      +2\left\langle\overline{x},\overline{y}\right\rangle
      +\left\|\overline{y}\right\|^{2}
      $$

      donde se usan **dos** propiedades y conviene nombrarlas: la
      **bilinealidad**, que abre el paréntesis en cuatro sumandos, y la
      **simetría**, que permite juntar
      $\left\langle\overline{x},\overline{y}\right\rangle$ con
      $\left\langle\overline{y},\overline{x}\right\rangle$ y sacar el $2$.

      El segundo es igual con el signo cambiado en el término cruzado:

      $$
      \left\|\overline{x}-\overline{y}\right\|^{2}
      =\left\|\overline{x}\right\|^{2}
      -2\left\langle\overline{x},\overline{y}\right\rangle
      +\left\|\overline{y}\right\|^{2}
      $$

      Restando, **los cuadrados de las normas se cancelan** y los dos términos
      cruzados se suman:

      $$
      \left\|\overline{x}+\overline{y}\right\|^{2}
      -\left\|\overline{x}-\overline{y}\right\|^{2}
      =4\left\langle\overline{x},\overline{y}\right\rangle
      \qquad\blacksquare
      $$

      **Qué dice esta identidad**, que es lo que la hace interesante: el
      producto escalar se puede **recuperar** conociendo solo normas. Parecía
      que al elevar al cuadrado se perdía información sobre el ángulo, y no: dos
      normas bien elegidas la devuelven entera.

      **b) En una base ortonormal, el producto escalar es la suma de productos.**

      $$
      \left\langle\overline{x},\overline{y}\right\rangle
      =\left\langle\sum_{i}x_{i}\overline{e}_{i},
      \sum_{j}y_{j}\overline{e}_{j}\right\rangle
      =\sum_{i}\sum_{j}x_{i}y_{j}
      \left\langle\overline{e}_{i},\overline{e}_{j}\right\rangle
      $$

      por bilinealidad. Y **aquí entra la hipótesis de que la base es
      ortonormal**:

      $$
      \left\langle\overline{e}_{i},\overline{e}_{j}\right\rangle=
      \begin{cases}1 & i=j\\ 0 & i\neq j\end{cases}
      $$

      así que de los $n^{2}$ sumandos **sobreviven solo los $n$ de la
      diagonal**:

      $$
      \left\langle\overline{x},\overline{y}\right\rangle
      =\sum_{i}x_{i}y_{i}=x_{1}y_{1}+\dots+x_{n}y_{n}
      \qquad\blacksquare
      $$

      **Y esto explica para qué sirve buscar una base ortonormal**, que es lo
      que piden los otros exámenes: en ella, cualquier producto escalar —por
      raro que fuese en la base de partida— se convierte en el de siempre. La
      matriz $G$ pasa a ser la identidad.

      **c) i · Cuándo es invertible.**

      $$
      \det A=x^{3}-x^{2}-x+1
      $$

      **Y hay que factorizarlo**, que es donde está el ejercicio. Sacando factor
      común por grupos:

      $$
      x^{3}-x^{2}-x+1
      =x^{2}\left(x-1\right)-\left(x-1\right)
      =\left(x-1\right)\left(x^{2}-1\right)
      =\left(x-1\right)^{2}\left(x+1\right)
      $$

      $$
      \boxed{\;A\text{ es invertible}\iff x\neq1\ \text{y}\ x\neq-1\;}
      $$

      El $1$ es raíz **doble**, y eso no cambia la respuesta —sigue siendo un
      solo valor prohibido— pero conviene verlo: quien resuelve
      $x^{3}-x^{2}-x+1=0$ por tanteo y encuentra $x=1$ puede quedarse ahí sin
      dividir, y perder el $-1$.

      **c) ii · La inversa en $x=0$.**

      $$
      A\left(0\right)=\begin{pmatrix}0&-1&-1\\0&0&-1\\1&-1&0\end{pmatrix},
      \qquad
      \det A\left(0\right)=1\neq0
      $$

      $$
      \boxed{\;A^{-1}=\begin{pmatrix}-1&1&1\\-1&1&0\\0&-1&0\end{pmatrix}\;}
      $$

      **Con tantos ceros, Gauss-Jordan es especialmente cómodo**: se pone
      $\left(A\mid I\right)$, y como la primera columna solo tiene un $1$ —en la
      tercera fila—, el primer intercambio ya deja casi todo hecho.

      **Y la comprobación es obligatoria**: $A\cdot A^{-1}$ tiene que dar la
      identidad. Con nueve entradas y muchos signos negativos, es la única
      manera de estar seguro.

  - id: exalg2324-ext-4-esta-si-se-diagonaliza
    titulo: Esta sí se diagonaliza, y no por ser simétrica
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, curso 2023-2024 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado b) es el mismo
      que el 4a de la extraordinaria de 2024-2025 · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Definir los siguientes conceptos: autovalor y autovector de un
      endomorfismo del espacio vectorial $E$.

      b) Sea el siguiente subconjunto del espacio vectorial $E$:

      $$
      S=\left\{\overline{x}\in E-\left\{\overline{0}\right\}
      \;\middle|\;f\left(\overline{x}\right)=\lambda\overline{x}\right\}
      \cup\left\{\overline{0}\right\}
      $$

      Demostrar que $S$ es subespacio vectorial de $E$.

      c) Estudiar si la matriz $A$ es diagonalizable, y en caso de ser posible,
      diagonalizarla dando la matriz de cambio de base correspondiente:

      $$
      A=\begin{pmatrix}
      1 & 2 & -2\\
      2 & 1 & -2\\
      2 & 2 & -3
      \end{pmatrix}
      $$
    pide: Las definiciones, la demostración, y el estudio con la diagonalización.

    pasos:
      - tipo: reconocer
        pregunta: |
          $A$ **no** es simétrica. ¿Qué significa eso para el apartado c)?
        opciones:
          - texto: >-
              Que no se puede dar nada por hecho: hay que comparar las
              multiplicidades algebraica y geométrica de cada autovalor
            correcta: true
            mensaje: |
              Exacto. El teorema espectral solo garantiza la diagonalización de
              las simétricas reales; fuera de ahí, hay que comprobarlo. Y aquí
              resulta que **sí** se diagonaliza.
          - texto: >-
              Que no es diagonalizable
            mensaje: |
              La simetría es **suficiente**, no necesaria. Hay muchísimas
              matrices no simétricas que se diagonalizan — esta, sin ir más
              lejos.
          - texto: >-
              Que sus autovalores pueden ser complejos, y hay que trabajar en
              $\mathbb{C}$
            mensaje: |
              Podrían serlo en general, y por eso hay que mirar; pero aquí el
              polinomio característico factoriza entero en $\mathbb{R}$.
              Comprobarlo es parte del ejercicio, suponerlo no.

      - tipo: calcular
        titulo: La multiplicidad geométrica del autovalor doble
        pregunta: |
          El autovalor $\lambda=-1$ es doble. ¿Cuánto vale
          $\dim\operatorname{Ker}\left(A+I\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Con $1$ la matriz **no** sería diagonalizable. Pero $A+I$ tiene
              sus tres filas iguales, así que su rango es $1$ y el núcleo tiene
              dimensión $3-1=2$.
          - valor: '3'
            mensaje: |
              $3$ solo saldría si $A+I$ fuese la matriz nula, es decir si $A$
              fuese $-I$.
          - valor: '0'
            mensaje: |
              No puede ser cero: $-1$ **es** autovalor, así que $A+I$ es
              singular y su núcleo tiene al menos dimensión $1$.
        pista: |
          $A+I=\begin{pmatrix}2&2&-2\\2&2&-2\\2&2&-2\end{pmatrix}$. Mira sus
          filas.
        desarrollo: |
          $$
          A+I=\begin{pmatrix}2&2&-2\\2&2&-2\\2&2&-2\end{pmatrix}
          $$

          **Las tres filas son idénticas**, así que el rango es $1$ y

          $$
          \dim\operatorname{Ker}\left(A+I\right)=3-1=2
          $$

          Coincide con la multiplicidad algebraica, así que este autovalor no
          estropea nada. El subespacio propio es el plano $x+y-z=0$.

      - tipo: calcular
        titulo: El autovector del autovalor simple
        pregunta: |
          ¿Cuál es un autovector de $\lambda=1$, con las tres coordenadas
          iguales a uno?
        respuesta:
          tipo: vector
          valor: '(1, 1, 1)'
          tolerancia: 0.001
          formato: las tres coordenadas en orden
        distractores:
          - valor: '(1, 1, 0)'
            mensaje: |
              $A\left(1,1,0\right)=\left(3,3,4\right)$, que no es proporcional a
              $\left(1,1,0\right)$.
          - valor: '(1, 0, 1)'
            mensaje: |
              Ese es autovector de $\lambda=-1$, no de $1$: está en el plano
              $x+y-z=0$.
          - valor: '(1, -1, 0)'
            mensaje: |
              $A\left(1,-1,0\right)=\left(-1,1,0\right)=-\left(1,-1,0\right)$:
              también es de $\lambda=-1$.
        pista: |
          Resuelve $\left(A-I\right)v=\overline{0}$, o simplemente prueba
          $\left(1,1,1\right)$ y mira qué sale.
        desarrollo: |
          $$
          A\begin{pmatrix}1\\1\\1\end{pmatrix}
          =\begin{pmatrix}1+2-2\\2+1-2\\2+2-3\end{pmatrix}
          =\begin{pmatrix}1\\1\\1\end{pmatrix}
          $$

          así que $\left(1,1,1\right)$ es autovector de $\lambda=1$.

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El polinomio característico es
              $-\left(\lambda-1\right)\left(\lambda+1\right)^{2}$: autovalores
              $\lambda=1$ simple y $\lambda=-1$ doble. Suman $-1$, que es la
              traza, y multiplican $1$, que es el determinante.
          - texto: >-
              Para $\lambda=-1$, la matriz $A+I$ tiene las tres filas iguales,
              así que su rango es $1$ y la multiplicidad geométrica vale $2$:
              **coincide** con la algebraica.
          - texto: >-
              Para $\lambda=1$ la geométrica es $1$, que también coincide.
              Luego $A$ **sí** es diagonalizable, con
              $D=\operatorname{diag}\left(1,-1,-1\right)$ y $P$ la matriz de los
              tres autovectores.
          - texto: >-
              Y como $A$ es diagonalizable, la matriz de paso $P$ es
              necesariamente ortogonal.
            trampa: true
            mensaje: |
              La ortogonalidad de $P$ está garantizada **solo cuando $A$ es
              simétrica**, y esta no lo es. Aquí los autovectores
              $\left(1,1,1\right)$ y $\left(1,0,1\right)$ dan producto escalar
              $1+0+1=2\neq0$: no son perpendiculares. $P$ es regular —eso sí,
              siempre— pero no ortogonal, y $P^{-1}$ hay que calcularla, no
              basta con trasponer.
    resolucion: |
      **a) Las dos definiciones.**

      > $\lambda\in K$ es **autovalor** de $f$ si existe algún
      > $\overline{x}\neq\overline{0}$ con
      > $f\left(\overline{x}\right)=\lambda\overline{x}$.

      > Ese $\overline{x}$ es un **autovector** de $f$ asociado a $\lambda$.

      **La exclusión del $\overline{0}$ es lo que hay que cuidar**: el vector
      nulo cumple $f\left(\overline{0}\right)=\lambda\overline{0}$ para
      **cualquier** $\lambda$, así que si se admitiera como autovector todo
      escalar sería autovalor y la definición no serviría de nada.

      Geométricamente: un autovector es una dirección que $f$ **no gira**, solo
      estira o encoge, y el autovalor es cuánto.

      **b) El subespacio propio.** El enunciado quita el $\overline{0}$ y lo
      vuelve a añadir por eso mismo: no es autovector, pero sin él $S$ no podría
      ser subespacio.

      Sean $\overline{x},\overline{y}\in S$ y $\alpha,\beta\in K$:

      $$
      f\left(\alpha\overline{x}+\beta\overline{y}\right)
      =\alpha f\left(\overline{x}\right)+\beta f\left(\overline{y}\right)
      =\alpha\lambda\overline{x}+\beta\lambda\overline{y}
      =\lambda\left(\alpha\overline{x}+\beta\overline{y}\right)
      $$

      luego $\alpha\overline{x}+\beta\overline{y}\in S$. Y $\overline{0}\in S$
      por construcción. $\blacksquare$

      **Más corto**: $S=\operatorname{Ker}\left(f-\lambda\,\mathrm{id}\right)$, y
      el núcleo de una aplicación lineal siempre es subespacio.

      **c) El estudio, y esta vez sale que sí.**

      **Lo primero: $A$ no es simétrica.** La entrada $\left(1,3\right)$ vale
      $-2$ y la $\left(3,1\right)$ vale $2$. Así que el teorema espectral no se
      puede invocar y hay que comprobarlo todo a mano.

      $$
      \left|A-\lambda I\right|
      =-\left(\lambda-1\right)\left(\lambda+1\right)^{2}
      $$

      | comprobación | |
      |---|---|
      | traza $=1+1-3=-1$ | $1-1-1=-1$ ✓ |
      | $\det A=1$ | $1\cdot\left(-1\right)\cdot\left(-1\right)=1$ ✓ |

      Autovalores: $\lambda=1$ simple y $\lambda=-1$ **doble**.

      **El criterio.** Hay que comparar, para cada autovalor, la multiplicidad
      algebraica con la geométrica.

      *$\lambda=-1$*, que es el que decide:

      $$
      A+I=\begin{pmatrix}2&2&-2\\2&2&-2\\2&2&-2\end{pmatrix}
      $$

      **Las tres filas son idénticas**, así que el rango es $1$ y

      $$
      \dim\operatorname{Ker}\left(A+I\right)=3-1=2=\text{multiplicidad algebraica}\;\checkmark
      $$

      *$\lambda=1$*: simple, y un autovalor simple siempre tiene geométrica $1$,
      así que coincide sin más comprobación.

      $$
      \boxed{\;A\text{ SÍ es diagonalizable}\;}
      $$

      **Los autovectores.**

      | $\lambda$ | subespacio propio | base |
      |---|---|---|
      | $1$ | recta | $\left(1,1,1\right)$ |
      | $-1$ | plano $x+y-z=0$ | $\left(1,0,1\right)$, $\left(0,1,1\right)$ |

      $$
      \boxed{\;
      P=\begin{pmatrix}1&1&0\\1&0&1\\1&1&1\end{pmatrix},
      \qquad
      D=P^{-1}AP=\begin{pmatrix}1&0&0\\0&-1&0\\0&0&-1\end{pmatrix}\;}
      $$

      con $\det P=-1\neq0$, que es lo que hay que comprobar: **$P$ tiene que ser
      regular**, y lo es porque sus columnas son autovectores independientes.

      **Y lo que este ejercicio enseña frente a los otros tres exámenes.** Aquí
      la matriz **no** es simétrica y aun así se diagonaliza: la simetría es una
      condición **suficiente**, no necesaria. Lo que decide siempre es la
      igualdad de multiplicidades.

      Y hay una diferencia práctica: como $A$ no es simétrica, **$P$ no es
      ortogonal** —$\left(1,1,1\right)\cdot\left(1,0,1\right)=2\neq0$—, así que
      $P^{-1}$ hay que calcularla de verdad. En los ejercicios con matriz
      simétrica bastaba con trasponer.
