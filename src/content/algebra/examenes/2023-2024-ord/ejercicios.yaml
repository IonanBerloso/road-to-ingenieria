ejercicios:
  - id: exalg2324-ord-1-cambiar-de-base-para-que-salga-1-0-0
    titulo: Fabricar la base en la que un vector es el primero
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, curso 2023-2024 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado b) es el mismo que el 1a
      de la ordinaria de 2024-2025 · El examen no publica solución ni reparto de
      puntos: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sea $V$ un espacio vectorial y
      $B=\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$ una
      base de $V$. Sea $\overline{x}$ un vector de $V$ cuyas coordenadas en la
      base $B$ son $\left(1,1,1\right)$. Dar una base de $V$ en la cual las
      coordenadas de $\overline{x}$ sean $\left(1,0,0\right)$.

      b) Sean $S$ y $T$ subespacios vectoriales de $V$. Demostrar que $S+T$ es
      subespacio vectorial de $V$.

      c) Sea
      $W=\left\{A\in M_{2\times2}\left(\mathbb{R}\right)\;/\;A^{T}=-A\right\}$
      un subconjunto del espacio vectorial
      $M_{2\times2}\left(\mathbb{R}\right)$. Estudiar si $W$ es subespacio
      vectorial.
    pide: Una base, la demostración de que S+T es subespacio, y el estudio de W.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para que $\overline{x}$ tenga coordenadas $\left(1,0,0\right)$ en una
          base, ¿qué tiene que pasar?
        opciones:
          - texto: >-
              Que $\overline{x}$ sea **el primer vector** de esa base, porque
              $\left(1,0,0\right)$ significa
              $1\cdot\overline{u}_{1}+0+0=\overline{u}_{1}$
            correcta: true
            mensaje: |
              Exacto, y con eso el ejercicio está medio resuelto: solo queda
              elegir dos vectores más que completen una base, y los más cómodos
              son dos de los que ya había.
          - texto: >-
              Que la base sea ortonormal
            mensaje: |
              La ortonormalidad no pinta nada aquí: el enunciado no da ningún
              producto escalar, y las coordenadas se definen en cualquier
              espacio vectorial, con o sin él.
          - texto: >-
              Que $\overline{x}$ sea unitario
            mensaje: |
              Otra vez hace falta un producto escalar para hablar de eso, y no
              lo hay. Las coordenadas $\left(1,0,0\right)$ no dicen nada del
              «tamaño» de $\overline{x}$.

      - tipo: calcular
        titulo: La dimensión del subespacio de las antisimétricas
        pregunta: |
          ¿Cuál es la dimensión de
          $W=\left\{A\in M_{2\times2}\left(\mathbb{R}\right):A^{T}=-A\right\}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ saldría si la diagonal pudiera ser cualquier cosa. Pero
              $A^{T}=-A$ obliga a $a_{11}=-a_{11}$, es decir
              $a_{11}=0$: **la diagonal de una antisimétrica es siempre nula**.
          - valor: '3'
            mensaje: |
              $3$ es la dimensión de las matrices **simétricas** de
              $2\times2$. Las antisimétricas son el complemento, y en
              $2\times2$ solo tienen un grado de libertad.
          - valor: '0'
            mensaje: |
              $W$ no se reduce a la matriz nula:
              $\begin{pmatrix}0&1\\-1&0\end{pmatrix}$ cumple $A^{T}=-A$ y no es
              nula.
          - valor: '4'
            mensaje: |
              $4$ es la dimensión de $M_{2\times2}\left(\mathbb{R}\right)$
              entero. $W$ es un subespacio propio.
        pista: |
          Escribe $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$ e impón
          $A^{T}=-A$ entrada a entrada. Empieza por la diagonal.
        desarrollo: |
          $$
          A^{T}=\begin{pmatrix}a&c\\b&d\end{pmatrix},
          \qquad
          -A=\begin{pmatrix}-a&-b\\-c&-d\end{pmatrix}
          $$

          Igualando entrada a entrada:

          | posición | ecuación | consecuencia |
          |---|---|---|
          | $\left(1,1\right)$ | $a=-a$ | $a=0$ |
          | $\left(2,2\right)$ | $d=-d$ | $d=0$ |
          | $\left(1,2\right)$ | $c=-b$ | $c=-b$ |

          $$
          W=\left\{\begin{pmatrix}0&b\\-b&0\end{pmatrix}:b\in\mathbb{R}\right\}
          \;\Longrightarrow\;
          \dim W=1
          $$

          con base $\left\{\begin{pmatrix}0&1\\-1&0\end{pmatrix}\right\}$.

      - tipo: calcular
        titulo: El determinante de la matriz de cambio
        pregunta: |
          Con la base nueva $B'=\left\{\overline{x},\overline{v}_{2},
          \overline{v}_{3}\right\}$, ¿cuánto vale el determinante de la matriz
          de cambio de base respecto de $B$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Si fuese cero, $B'$ no sería base. La matriz es triangular
              inferior con unos en la diagonal, así que su determinante es $1$
              y $B'$ es base.
          - valor: '3'
            mensaje: |
              $3$ es la dimensión del espacio, no el determinante. La matriz de
              cambio tiene por columnas $\left(1,1,1\right)$,
              $\left(0,1,0\right)$ y $\left(0,0,1\right)$.
          - valor: '-1'
            mensaje: |
              El signo saldría de haber intercambiado dos columnas. Aquí no se
              intercambia nada: $\overline{x}$ ocupa el primer puesto y los
              otros dos se quedan donde estaban.
        pista: |
          Las columnas son las coordenadas de los vectores nuevos en la base
          vieja: $\left(1,1,1\right)$, $\left(0,1,0\right)$ y
          $\left(0,0,1\right)$.
        desarrollo: |
          $$
          P=\begin{pmatrix}1&0&0\\1&1&0\\1&0&1\end{pmatrix},
          \qquad
          \det P=1\neq0
          $$

          Es triangular inferior con unos en la diagonal, así que el
          determinante es el producto de la diagonal. Y como no es cero, $B'$
          **es** base — que es lo que había que comprobar.

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Que las coordenadas de $\overline{x}$ en $B$ sean
              $\left(1,1,1\right)$ significa
              $\overline{x}=\overline{v}_{1}+\overline{v}_{2}+\overline{v}_{3}$.
          - texto: >-
              Para que sus coordenadas sean $\left(1,0,0\right)$ en una base
              nueva, $\overline{x}$ tiene que ser el **primer** vector de esa
              base.
          - texto: >-
              Se toma $B'=\left\{\overline{x},\overline{v}_{2},
              \overline{v}_{3}\right\}$, y es base porque su matriz de cambio
              respecto de $B$ tiene determinante $1$.
          - texto: >-
              Y esa es **la** base que cumple lo pedido, porque las coordenadas
              de un vector son únicas.
            trampa: true
            mensaje: |
              La unicidad de las coordenadas dice que, **fijada una base**, los
              coeficientes de un vector son únicos. No dice nada sobre cuántas
              bases hay: aquí valen infinitas, porque los dos vectores que
              acompañan a $\overline{x}$ se pueden elegir de infinitas maneras
              mientras completen una base. El enunciado pide «dar una base», no
              «la base», y decirlo es parte de la respuesta.
    resolucion: |
      **a) La base que hay que fabricar.** Las coordenadas
      $\left(1,1,1\right)$ significan

      $$
      \overline{x}=\overline{v}_{1}+\overline{v}_{2}+\overline{v}_{3}
      $$

      Y las coordenadas $\left(1,0,0\right)$ significan
      $\overline{x}=1\cdot\overline{u}_{1}+0\cdot\overline{u}_{2}
      +0\cdot\overline{u}_{3}=\overline{u}_{1}$. O sea: **el vector tiene que
      ser el primero de la base nueva**. Con eso, el ejercicio está resuelto
      salvo por elegir dos acompañantes.

      Lo más cómodo es dejar los otros dos como estaban:

      $$
      \boxed{\;B'=\left\{\overline{v}_{1}+\overline{v}_{2}+\overline{v}_{3},
      \;\overline{v}_{2},\;\overline{v}_{3}\right\}\;}
      $$

      **Hay que comprobar que es base**, y con la matriz de cambio se hace de un
      vistazo:

      $$
      P=\begin{pmatrix}1&0&0\\1&1&0\\1&0&1\end{pmatrix},
      \qquad
      \det P=1\neq0
      $$

      **Y la respuesta no es única.** Sirve cualquier base cuyo primer vector
      sea $\overline{x}$: $\left\{\overline{x},\overline{v}_{1},
      \overline{v}_{3}\right\}$ también vale. Decirlo demuestra que se ha
      entendido lo que se estaba haciendo.

      **b) $S+T$ es subespacio.**

      $$
      S+T=\left\{s+t\;:\;s\in S,\;t\in T\right\}
      $$

      | qué | por qué |
      |---|---|
      | no vacío | $\overline{0}=\overline{0}+\overline{0}\in S+T$ |
      | cerrado | si $u=s_{1}+t_{1}$ y $v=s_{2}+t_{2}$, entonces $\alpha u+\beta v=\underbrace{\left(\alpha s_{1}+\beta s_{2}\right)}_{\in S}+\underbrace{\left(\alpha t_{1}+\beta t_{2}\right)}_{\in T}$ |

      y los dos paréntesis están donde se dice porque $S$ y $T$ son subespacios.
      $\blacksquare$

      **c) Las matrices antisimétricas.** Con
      $A=\begin{pmatrix}a&b\\c&d\end{pmatrix}$, la condición $A^{T}=-A$ es

      $$
      \begin{pmatrix}a&c\\b&d\end{pmatrix}
      =\begin{pmatrix}-a&-b\\-c&-d\end{pmatrix}
      $$

      **Lo primero que sale es lo que más se olvida**: $a=-a$ y $d=-d$, es
      decir $a=d=0$. **La diagonal de una matriz antisimétrica es siempre
      nula.** Y de las otras dos entradas, $c=-b$.

      $$
      W=\left\{\begin{pmatrix}0&b\\-b&0\end{pmatrix}:b\in\mathbb{R}\right\},
      \qquad
      \boxed{\;\dim W=1\;}
      $$

      **¿Es subespacio? Sí**, y se demuestra sin describir $W$:

      | qué | por qué |
      |---|---|
      | no vacío | $O^{T}=O=-O$, la matriz nula está |
      | cerrado | $\left(\alpha A+\beta B\right)^{T}=\alpha A^{T}+\beta B^{T}=-\alpha A-\beta B=-\left(\alpha A+\beta B\right)$ |

      usando que **trasponer es lineal**. $\blacksquare$

      **El apartado c) tiene una trampa que conviene nombrar**: pide «estudiar
      si $W$ es subespacio», y eso admite la respuesta «no». Aquí sí lo es, pero
      el mismo enunciado con $A^{T}=A+I$, o con $\det A=0$, daría que no — y en
      esos casos lo que hay que dar es **un contraejemplo concreto**, no un
      argumento general. Dos matrices de determinante nulo cuya suma tenga
      determinante no nulo bastan para tumbar el segundo.

  - id: exalg2324-ord-2-la-imagen-de-una-base-genera-la-imagen
    titulo: Las imágenes de una base generan la imagen, pero no siempre son base
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, curso 2023-2024 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) Definir imagen y núcleo o kernel de una aplicación lineal.

      b) Sean la aplicación lineal $f\colon V\to W$ y
      $B=\left\{\overline{e}_{1},\overline{e}_{2},\dots,\overline{e}_{n}\right\}$
      una base de $V$. Demostrar que la familia
      $\left\{f\left(\overline{e}_{1}\right),f\left(\overline{e}_{2}\right),
      \dots,f\left(\overline{e}_{n}\right)\right\}$ es un sistema generador de
      $\operatorname{Im}\left(f\right)$. ¿Es una base de
      $\operatorname{Im}\left(f\right)$? Razona la respuesta.

      c) Sea la aplicación lineal
      $f\colon\mathbb{R}^{4}\to\mathbb{R}^{4}$ tal que:

      $$
      f\left(\overline{e}_{1}\right)=\left(1,1,1,\alpha\right)
      $$

      $$
      f\left(\overline{e}_{1}+\overline{e}_{2}\right)
      =\left(2,2,\alpha+1,\alpha+1\right)
      $$

      $$
      f\left(\overline{e}_{1}+\overline{e}_{3}\right)
      =\left(2,\alpha+1,2,\alpha+1\right)
      $$

      $$
      f\left(\overline{e}_{1}+\overline{e}_{4}\right)
      =\left(\alpha+1,2,2,\alpha+1\right)
      $$

      siendo $\left\{\overline{e}_{1},\overline{e}_{2},\overline{e}_{3},
      \overline{e}_{4}\right\}$ la base canónica de $\mathbb{R}^{4}$.

      i. Calcular la matriz asociada a $f$ en la base canónica.

      ii. Calcular los valores de $\alpha$ para que $f$ sea inyectiva.

      iii. Calcular bases y dimensiones de $\operatorname{Im}\left(f\right)$ y
      $\operatorname{Ker}\left(f\right)$ para $\alpha=-3$.
    pide: Las definiciones, la demostración, y los tres apartados de c).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se sacan las imágenes de $\overline{e}_{2}$,
          $\overline{e}_{3}$ y $\overline{e}_{4}$ de los datos del enunciado?
        opciones:
          - texto: >-
              Restando: $f\left(\overline{e}_{2}\right)
              =f\left(\overline{e}_{1}+\overline{e}_{2}\right)
              -f\left(\overline{e}_{1}\right)$, por linealidad
            correcta: true
            mensaje: |
              Eso es. La linealidad permite repartir la suma, y con
              $f\left(\overline{e}_{1}\right)$ conocido cada resta da una
              columna nueva.
          - texto: >-
              Resolviendo un sistema de cuatro ecuaciones con cuatro incógnitas
            mensaje: |
              Se puede, pero es dar un rodeo enorme: la linealidad lo resuelve
              con tres restas de vectores y sin plantear nada.
          - texto: >-
              No se pueden: el enunciado no da esos datos
            mensaje: |
              Sí los da, aunque disfrazados. Los cuatro vectores
              $\overline{e}_{1}$, $\overline{e}_{1}+\overline{e}_{2}$,
              $\overline{e}_{1}+\overline{e}_{3}$ y
              $\overline{e}_{1}+\overline{e}_{4}$ son base de $\mathbb{R}^{4}$.

      - tipo: calcular
        titulo: Los valores de α que estropean la inyectividad
        pregunta: |
          ¿Para qué valores de $\alpha$ **no** es $f$ inyectiva?
        respuesta:
          tipo: conjunto
          valor: '-3, 1'
          tolerancia: 0.001
          formato: los dos valores separados por una coma
        distractores:
          - valor: '3, -1'
            mensaje: |
              Los signos cambiados. El determinante es
              $\left(\alpha+3\right)\left(\alpha-1\right)^{3}$, que se anula en
              $\alpha=-3$ y $\alpha=1$.
          - valor: '1'
            mensaje: |
              $\alpha=1$ es uno de los dos —ahí la matriz es todo unos y tiene
              rango $1$—, pero falta el otro.
          - valor: '0, 1'
            mensaje: |
              Con $\alpha=0$ el determinante vale $-3\neq0$, así que ahí $f$ sí
              es inyectiva.
        pista: |
          $f$ es inyectiva si y solo si su matriz es regular. Calcula el
          determinante en función de $\alpha$.
        desarrollo: |
          La matriz es todo unos salvo la **antidiagonal**, que vale $\alpha$:

          $$
          A=\begin{pmatrix}
          1&1&1&\alpha\\ 1&1&\alpha&1\\ 1&\alpha&1&1\\ \alpha&1&1&1
          \end{pmatrix},
          \qquad
          \det A=\left(\alpha+3\right)\left(\alpha-1\right)^{3}
          $$

          | $\alpha$ | $\det A$ |
          |---|---|
          | $-4$ | $125$ |
          | $-3$ | $\mathbf{0}$ |
          | $0$ | $-3$ |
          | $1$ | $\mathbf{0}$ |
          | $2$ | $5$ |

          $$
          f\ \text{inyectiva}\iff\alpha\neq-3\ \text{y}\ \alpha\neq1
          $$

      - tipo: calcular
        titulo: El núcleo cuando α vale −3
        pregunta: |
          Con $\alpha=-3$, ¿cuál es el vector que genera
          $\operatorname{Ker}\left(f\right)$, con las cuatro coordenadas iguales
          a uno?
        respuesta:
          tipo: vector
          valor: '(1, 1, 1, 1)'
          tolerancia: 0.001
          formato: las cuatro coordenadas en orden
        distractores:
          - valor: '(1, -1, 1, -1)'
            mensaje: |
              Ese vector es autovector de la parte antidiagonal, pero no está en
              el núcleo: $A\left(1,-1,1,-1\right)$ no da $\overline{0}$ con
              $\alpha=-3$.
          - valor: '(1, 1, 1, -3)'
            mensaje: |
              Esa es la primera **columna** de la matriz, no un vector del
              núcleo. El núcleo lo forman los $\overline{x}$ con
              $A\overline{x}=\overline{0}$.
          - valor: '(0, 0, 0, 0)'
            mensaje: |
              El vector nulo está en todos los núcleos y no genera nada: una
              base no puede contenerlo. Se pide un generador **no nulo**.
        pista: |
          Con $\alpha=-3$ cada fila de $A$ suma $1+1+1-3=0$.
        desarrollo: |
          Con $\alpha=-3$, **cada fila de $A$ suma cero**:
          $1+1+1-3=0$. Y que las filas sumen cero es exactamente decir que

          $$
          A\begin{pmatrix}1\\1\\1\\1\end{pmatrix}
          =\begin{pmatrix}0\\0\\0\\0\end{pmatrix}
          $$

          Así que $\left(1,1,1,1\right)\in\operatorname{Ker}\left(f\right)$. Y
          como el rango es $3$, la dimensión del núcleo es $4-3=1$ y ese vector
          lo genera entero.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Sea $\overline{y}\in\operatorname{Im}\left(f\right)$. Entonces
              $\overline{y}=f\left(\overline{x}\right)$ para algún
              $\overline{x}\in V$.
          - texto: >-
              Como $B$ es base, $\overline{x}=\sum\alpha_{i}\overline{e}_{i}$, y
              por linealidad
              $\overline{y}=f\left(\sum\alpha_{i}\overline{e}_{i}\right)
              =\sum\alpha_{i}f\left(\overline{e}_{i}\right)$.
          - texto: >-
              Luego todo elemento de la imagen es combinación lineal de los
              $f\left(\overline{e}_{i}\right)$: son **sistema generador**.
          - texto: >-
              Y como $B$ es libre y $f$ es lineal, las imágenes
              $f\left(\overline{e}_{i}\right)$ también son libres, así que
              **siempre** son base de $\operatorname{Im}\left(f\right)$.
            trampa: true
            mensaje: |
              Aquí está justo lo que el enunciado pregunta, y la respuesta es
              **no**. La linealidad no conserva la independencia: hace falta que
              $f$ sea **inyectiva**. Si el núcleo no es trivial, alguna
              combinación no nula de los $\overline{e}_{i}$ va al
              $\overline{0}$, y esa misma combinación de las imágenes da
              $\overline{0}$: son dependientes. El apartado c) lo enseña con
              números: con $\alpha=-3$ hay cuatro imágenes que solo generan un
              subespacio de dimensión $3$.
    resolucion: |
      **a) Las dos definiciones.**

      > $\operatorname{Ker}\left(f\right)=\left\{\overline{x}\in V\;:\;
      > f\left(\overline{x}\right)=\overline{0}_{W}\right\}$, un subespacio de
      > **$V$**, el de partida.

      > $\operatorname{Im}\left(f\right)=\left\{f\left(\overline{x}\right)\;:\;
      > \overline{x}\in V\right\}$, un subespacio de **$W$**, el de llegada.

      Y conviene decir en qué espacio vive cada uno, porque es lo que más se
      confunde: uno está a la entrada y el otro a la salida, y sus dimensiones
      suman $\dim V$ — nunca $\dim W$.

      **b) Generan la imagen.** Sea
      $\overline{y}\in\operatorname{Im}\left(f\right)$: por definición existe
      $\overline{x}\in V$ con $\overline{y}=f\left(\overline{x}\right)$. Como
      $B$ es base de $V$,

      $$
      \overline{x}=\sum_{i=1}^{n}\alpha_{i}\overline{e}_{i}
      \;\Longrightarrow\;
      \overline{y}=f\left(\sum_{i=1}^{n}\alpha_{i}\overline{e}_{i}\right)
      =\sum_{i=1}^{n}\alpha_{i}f\left(\overline{e}_{i}\right)
      $$

      Todo elemento de la imagen es combinación lineal de las
      $f\left(\overline{e}_{i}\right)$: **son sistema generador**.
      $\blacksquare$

      **¿Son base? No necesariamente**, y esa es la pregunta de verdad.

      Para ser base hace falta además que sean **libres**, y eso solo está
      garantizado si $f$ es **inyectiva**:

      $$
      \sum\alpha_{i}f\left(\overline{e}_{i}\right)=\overline{0}
      \;\Longleftrightarrow\;
      f\left(\sum\alpha_{i}\overline{e}_{i}\right)=\overline{0}
      \;\Longleftrightarrow\;
      \sum\alpha_{i}\overline{e}_{i}\in\operatorname{Ker}\left(f\right)
      $$

      Si el núcleo es $\left\{\overline{0}\right\}$, la independencia de $B$
      fuerza $\alpha_{i}=0$ y las imágenes son libres. Si no lo es, hay una
      combinación no nula que da $\overline{0}$ y **son dependientes**.

      $$
      \boxed{\;\text{son base}\iff f\text{ es inyectiva}\;}
      $$

      El apartado c) lo enseña con números: con $\alpha=-3$ hay cuatro imágenes
      generando un subespacio de dimensión $3$, así que una sobra.

      **c) i · La matriz.** Los cuatro datos no dan las imágenes de la canónica
      directamente, pero la linealidad las despeja en una resta cada una:

      $$
      f\left(\overline{e}_{2}\right)
      =f\left(\overline{e}_{1}+\overline{e}_{2}\right)
      -f\left(\overline{e}_{1}\right)
      =\left(2,2,\alpha+1,\alpha+1\right)-\left(1,1,1,\alpha\right)
      =\left(1,1,\alpha,1\right)
      $$

      y análogamente
      $f\left(\overline{e}_{3}\right)=\left(1,\alpha,1,1\right)$ y
      $f\left(\overline{e}_{4}\right)=\left(\alpha,1,1,1\right)$.

      $$
      \boxed{\;A=\begin{pmatrix}
      1&1&1&\alpha\\
      1&1&\alpha&1\\
      1&\alpha&1&1\\
      \alpha&1&1&1
      \end{pmatrix}\;}
      $$

      **Todo unos salvo la antidiagonal.** Esa simetría no es casual y va a
      pagar en el apartado siguiente.

      **c) ii · Cuándo es inyectiva.** $f$ es inyectiva si y solo si su núcleo
      es trivial, es decir si y solo si $A$ es regular:

      $$
      \det A=\left(\alpha+3\right)\left(\alpha-1\right)^{3}
      $$

      $$
      \boxed{\;f\ \text{es inyectiva}\iff\alpha\neq-3\ \text{y}\ \alpha\neq1\;}
      $$

      **De dónde sale ese determinante sin desarrollarlo a lo bruto.** $A$ se
      escribe como $J+\left(\alpha-1\right)K$, donde $J$ es la matriz de todo
      unos y $K$ la que tiene unos en la antidiagonal. Las dos conmutan, así que
      se diagonalizan a la vez, y sus autovalores se combinan:

      | vector | $J$ | $K$ | $A$ |
      |---|---|---|---|
      | $\left(1,1,1,1\right)$ | $4$ | $1$ | $\alpha+3$ |
      | $\left(1,-1,-1,1\right)$ | $0$ | $1$ | $\alpha-1$ |
      | $\left(1,0,0,-1\right)$ | $0$ | $-1$ | $1-\alpha$ |
      | $\left(0,1,-1,0\right)$ | $0$ | $-1$ | $1-\alpha$ |

      El producto de los cuatro es
      $\left(\alpha+3\right)\left(\alpha-1\right)\left(1-\alpha\right)^{2}
      =\left(\alpha+3\right)\left(\alpha-1\right)^{3}$. Y quien prefiera
      desarrollar el determinante a mano llega al mismo sitio; esto explica
      **por qué** sale así.

      **c) iii · Con $\alpha=-3$.**

      $$
      A=\begin{pmatrix}
      1&1&1&-3\\ 1&1&-3&1\\ 1&-3&1&1\\ -3&1&1&1
      \end{pmatrix}
      $$

      **Cada fila suma cero** —$1+1+1-3=0$—, y eso dice de un vistazo que

      $$
      A\left(1,1,1,1\right)^{T}=\overline{0}
      \;\Longrightarrow\;
      \left(1,1,1,1\right)\in\operatorname{Ker}\left(f\right)
      $$

      El rango es $3$, así que

      $$
      \boxed{\;
      \dim\operatorname{Ker}=1,\ \text{base }\left\{\left(1,1,1,1\right)\right\};
      \qquad
      \dim\operatorname{Im}=3\;}
      $$

      y como base de la imagen sirven tres columnas independientes cualesquiera
      —las tres primeras, por ejemplo—.

      **Comprobación**: $\dim\operatorname{Ker}+\dim\operatorname{Im}=1+3=4
      =\dim\mathbb{R}^{4}$ ✓. Y esto cierra el apartado b): aquí las **cuatro**
      imágenes de la base canónica generan un subespacio de dimensión $3$, así
      que son sistema generador y **no** son base.

  - id: exalg2324-ord-3-matrices-ortogonales-y-un-producto-escalar-torcido
    titulo: Dos propiedades de las ortogonales, y un producto escalar torcido
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, curso 2023-2024 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · Los signos del producto escalar del
      apartado b) se han leído de la página renderizada: el volcado de texto los
      pierde todos · El examen no publica solución ni reparto de puntos: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar las siguientes afirmaciones:

      i. Sean $A$ y $B$ dos matrices ortogonales (es decir, $A^{-1}=A^{T}$ y
      $B^{-1}=B^{T}$). Entonces, la matriz $AB$ también es ortogonal.

      ii. Sea $A$ una matriz ortogonal. Entonces, $\left|A\right|=\pm1$.

      b) En el espacio vectorial $\mathbb{R}^{3}$ se considera el producto
      escalar definido por:

      $$
      \begin{aligned}
      \left\langle\left(x_{1},x_{2},x_{3}\right),
      \left(y_{1},y_{2},y_{3}\right)\right\rangle
      ={} & 2x_{1}y_{1}-x_{1}y_{2}+x_{1}y_{3} \\
      & -x_{2}y_{1}+3x_{2}y_{2}+x_{3}y_{1}+3x_{3}y_{3}
      \end{aligned}
      $$

      Hallar una base ortonormal de $\mathbb{R}^{3}$ respecto al producto
      escalar definido.
    pide: Las dos demostraciones, y una base ortonormal.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se pasa de la expresión con siete sumandos a una matriz?
        opciones:
          - texto: >-
              El coeficiente de $x_{i}y_{j}$ es la entrada
              $\left(i,j\right)$ de la matriz $G$, y entonces
              $\left\langle x,y\right\rangle=x^{T}G\,y$
            correcta: true
            mensaje: |
              Exacto, y hay que hacerlo con cuidado con los términos cruzados:
              $-x_{1}y_{2}$ va a la posición $\left(1,2\right)$ y
              $-x_{2}y_{1}$ a la $\left(2,1\right)$. Que salgan iguales es la
              simetría, y es lo que hay que comprobar.
          - texto: >-
              Se ordenan los siete coeficientes en fila y se rellena por filas
            mensaje: |
              Los coeficientes que faltan son ceros, y hay que colocarlos en su
              sitio. En esta expresión no aparecen $x_{2}y_{3}$ ni
              $x_{3}y_{2}$: sus entradas valen cero.
          - texto: >-
              Se toma la matriz identidad, porque todo producto escalar se
              reduce a ella
            mensaje: |
              Se reduce a ella **en una base ortonormal**, y encontrar esa base
              es justamente lo que pide el ejercicio. En la canónica, este
              producto escalar no es el de siempre.

      - tipo: calcular
        titulo: El menor que decide si es producto escalar
        pregunta: |
          ¿Cuánto vale el determinante de la matriz $G$ del producto escalar?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '18'
            mensaje: |
              $18$ es solo el primer sumando del desarrollo,
              $2\cdot\left(9-0\right)$. Faltan los otros dos, que restan $3$
              cada uno.
          - valor: '0'
            mensaje: |
              Si fuese cero, $G$ no sería definida positiva y esto no sería un
              producto escalar: no habría norma y el ejercicio no tendría
              sentido.
          - valor: '5'
            mensaje: |
              $5$ es el menor de orden **dos**,
              $\begin{vmatrix}2&-1\\-1&3\end{vmatrix}$. El de orden tres es
              otro.
        pista: |
          $G=\begin{pmatrix}2&-1&1\\-1&3&0\\1&0&3\end{pmatrix}$.
        desarrollo: |
          $$
          \det G=
          \begin{vmatrix}2&-1&1\\-1&3&0\\1&0&3\end{vmatrix}
          =2\left(9-0\right)-\left(-1\right)\left(-3-0\right)
          +1\left(0-3\right)
          =18-3-3=12
          $$

          Los tres menores principales son $2$, $5$ y $12$: **los tres
          positivos**, así que $G$ es definida positiva y define un producto
          escalar de verdad.

      - tipo: calcular
        titulo: El segundo vector de la base ortonormal
        pregunta: |
          Aplicando Gram-Schmidt a la base canónica, ¿cuál es el segundo vector
          $u_{2}$?
        respuesta:
          tipo: vector
          valor: '(1/√10, 2/√10, 0)'
          tolerancia: 0.001
          formato: las tres coordenadas en orden; valen raíces y fracciones
        distractores:
          - valor: '(0, 1/√3, 0)'
            mensaje: |
              Ese sería $e_{2}$ normalizado **sin corregirlo**. Pero
              $\left\langle e_{2},e_{1}\right\rangle=-1\neq0$: con este producto
              escalar $e_{1}$ y $e_{2}$ **no** son ortogonales, y hay que
              restarle su proyección.
          - valor: '(1/2, 1, 0)'
            mensaje: |
              Ese es el vector ya ortogonalizado —proporcional a
              $\left(1,2,0\right)$— pero sin normalizar. Su norma vale
              $\sqrt{10}/2$.
          - valor: '(2/√10, 1/√10, 0)'
            mensaje: |
              Las dos coordenadas cambiadas de sitio. Al corregir $e_{2}$ sale
              $\left(\frac12,1,0\right)$, proporcional a $\left(1,2,0\right)$:
              la segunda coordenada es la grande.
        pista: |
          $u_{1}=\frac{1}{\sqrt2}e_{1}$, y
          $\left\langle e_{2},e_{1}\right\rangle=-1$, así que
          $v_{2}=e_{2}+\frac12 e_{1}$.
        desarrollo: |
          $$
          \left\langle e_{1},e_{1}\right\rangle=2
          \;\Longrightarrow\;
          u_{1}=\frac{1}{\sqrt2}\left(1,0,0\right)
          $$

          $$
          \left\langle e_{2},u_{1}\right\rangle
          =\frac{-1}{\sqrt2}
          \;\Longrightarrow\;
          v_{2}=e_{2}+\frac12\left(1,0,0\right)
          =\left(\tfrac12,1,0\right)
          $$

          $$
          \left\langle v_{2},v_{2}\right\rangle=\tfrac52
          \;\Longrightarrow\;
          u_{2}=\frac{\left(\frac12,1,0\right)}{\sqrt{5/2}}
          =\frac{\left(1,2,0\right)}{\sqrt{10}}
          $$

      - tipo: justificar
        pregunta: Ordena las dos demostraciones del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              **i.** $\left(AB\right)^{T}=B^{T}A^{T}=B^{-1}A^{-1}
              =\left(AB\right)^{-1}$, usando que trasponer un producto invierte
              el orden y que las dos son ortogonales.
          - texto: >-
              **ii.** De $A^{T}A=I$, tomando determinantes:
              $\left|A^{T}\right|\left|A\right|=\left|I\right|=1$.
          - texto: >-
              Y como $\left|A^{T}\right|=\left|A\right|$, queda
              $\left|A\right|^{2}=1$, luego $\left|A\right|=\pm1$.
          - texto: >-
              De $\left|A\right|=\pm1$ se deduce además que toda matriz
              ortogonal es simétrica.
            trampa: true
            mensaje: |
              No tiene nada que ver: el determinante no dice nada sobre la
              simetría. Una rotación de $90°$ en el plano,
              $\begin{pmatrix}0&-1\\1&0\end{pmatrix}$, es ortogonal, tiene
              determinante $1$ y **no** es simétrica —de hecho es
              antisimétrica—. Lo que sí se deduce del signo es geométrico: con
              $+1$ la transformación conserva la orientación (es un giro) y con
              $-1$ la invierte (lleva una simetría dentro).
    resolucion: |
      **a) i · El producto de ortogonales es ortogonal.** Todo está en cómo se
      traspone un producto:

      $$
      \left(AB\right)^{T}=B^{T}A^{T}
      $$

      —**el orden se invierte**, y ese es el paso que hay que escribir—. Y como
      $A$ y $B$ son ortogonales, $A^{T}=A^{-1}$ y $B^{T}=B^{-1}$:

      $$
      \left(AB\right)^{T}=B^{-1}A^{-1}=\left(AB\right)^{-1}
      $$

      donde la última igualdad usa que la inversa de un producto también
      invierte el orden. Luego $AB$ es ortogonal. $\blacksquare$

      **a) ii · El determinante vale $\pm1$.** De la definición, $A^{T}A=I$.
      Tomando determinantes y usando que el determinante de un producto es el
      producto de los determinantes:

      $$
      \left|A^{T}\right|\cdot\left|A\right|=\left|I\right|=1
      $$

      Y como $\left|A^{T}\right|=\left|A\right|$ —trasponer no cambia el
      determinante—:

      $$
      \left|A\right|^{2}=1
      \;\Longrightarrow\;
      \boxed{\;\left|A\right|=\pm1\;}
      $$

      $\blacksquare$

      **Y lo que significa el signo**, que no se pide y es lo que hace
      recordable el resultado: una matriz ortogonal transforma sin deformar
      —conserva longitudes y ángulos—, así que solo puede multiplicar los
      volúmenes por $\pm1$. Con $+1$ es un **giro**, que conserva la
      orientación; con $-1$ lleva dentro una **simetría**, que la invierte.

      **b) El producto escalar, escrito como matriz.** El coeficiente de
      $x_{i}y_{j}$ es la entrada $\left(i,j\right)$:

      $$
      G=\begin{pmatrix}
      2 & -1 & 1\\
      -1 & 3 & 0\\
      1 & 0 & 3
      \end{pmatrix},
      \qquad
      \left\langle x,y\right\rangle=x^{T}G\,y
      $$

      Los términos que no aparecen —$x_{2}y_{3}$ y $x_{3}y_{2}$— son ceros, y
      hay que ponerlos.

      **Lo primero es comprobar que esto es un producto escalar de verdad:**

      | condición | comprobación |
      |---|---|
      | simétrica | $G^{T}=G$ ✓ |
      | definida positiva | menores $2>0$, $5>0$, $12>0$ ✓ |

      **Y lo segundo, que decide el ejercicio: la base canónica no es
      ortonormal aquí.** $\left\langle e_{1},e_{1}\right\rangle=2\neq1$ y
      $\left\langle e_{1},e_{2}\right\rangle=-1\neq0$.

      **Gram-Schmidt**, empezando por la canónica:

      $$
      u_{1}=\frac{e_{1}}{\sqrt{\left\langle e_{1},e_{1}\right\rangle}}
      =\frac{1}{\sqrt2}\left(1,0,0\right)
      $$

      $$
      v_{2}=e_{2}-\left\langle e_{2},u_{1}\right\rangle u_{1}
      =\left(0,1,0\right)+\tfrac12\left(1,0,0\right)
      =\left(\tfrac12,1,0\right)
      \;\Longrightarrow\;
      u_{2}=\frac{\left(1,2,0\right)}{\sqrt{10}}
      $$

      $$
      v_{3}=e_{3}-\left\langle e_{3},u_{1}\right\rangle u_{1}
      -\left\langle e_{3},u_{2}\right\rangle u_{2}
      \;\Longrightarrow\;
      u_{3}=\frac{\left(-3,-1,5\right)}{\sqrt{60}}
      $$

      $$
      \boxed{\;\left\{
      \frac{\left(1,0,0\right)}{\sqrt2},\;
      \frac{\left(1,2,0\right)}{\sqrt{10}},\;
      \frac{\left(-3,-1,5\right)}{\sqrt{60}}
      \right\}\;}
      $$

      **La comprobación, y con la $G$ del enunciado.** Los nueve productos
      $\left\langle u_{i},u_{j}\right\rangle=u_{i}^{T}G\,u_{j}$ dan la
      identidad. Hacerla con el producto escalar de siempre daría otros números
      y la conclusión contraria: $\left(1,0,0\right)/\sqrt2$ tiene módulo
      ordinario $0{,}707$, no $1$.

      **Y una comprobación intermedia que ahorra rehacerlo todo:** en cuanto se
      tiene $v_{3}=\left(-3,-1,5\right)$ sin normalizar, conviene calcular
      $G\,v_{3}=\left(0,0,12\right)$ y de ahí
      $\left\langle v_{3},v_{3}\right\rangle=60$. Si sale un número feo o
      negativo, el error está antes y no en la normalización.

  - id: exalg2324-ord-4-tres-autovalores-distintos-y-una-base-ortogonal
    titulo: Tres autovalores distintos, y la ortogonalidad que sale sola
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, curso 2023-2024 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado a) es el mismo que el 4a
      de la ordinaria de 2024-2025 · El examen no publica solución ni reparto de
      puntos: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar la invarianza del polinomio característico.

      b) Diagonalizar la matriz $A$ utilizando una matriz de cambio de base
      ortogonal:

      $$
      A=\begin{pmatrix}
      2 & 1 & 3\\
      1 & -2 & -1\\
      3 & -1 & 2
      \end{pmatrix}
      $$
    pide: La demostración, y la diagonalización con matriz de paso ortogonal.

    pasos:
      - tipo: reconocer
        pregunta: |
          $A$ es simétrica y sus tres autovalores son distintos. ¿Qué le ahorra
          eso al ejercicio?
        opciones:
          - texto: >-
              Que los autovectores salen **ortogonales entre sí solos**, sin
              aplicar Gram-Schmidt: basta normalizarlos
            correcta: true
            mensaje: |
              Ese es el ahorro. En una matriz simétrica, autovectores de
              autovalores **distintos** son siempre ortogonales. Gram-Schmidt
              solo hace falta dentro de un subespacio propio de dimensión mayor
              que uno, y aquí los tres son de dimensión uno.
          - texto: >-
              Que no hace falta calcular el polinomio característico
            mensaje: |
              Hay que calcularlo igual: los autovalores no aparecen solos. Lo
              que se ahorra es el trabajo **después** de tenerlos.
          - texto: >-
              Que la matriz de paso es la identidad
            mensaje: |
              Solo si $A$ ya fuese diagonal. Aquí no lo es, y la matriz de paso
              es la de los autovectores normalizados.

      - tipo: calcular
        titulo: El autovalor que falta
        pregunta: |
          Dos autovalores de $A$ son $0$ y $5$. ¿Cuál es el tercero?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              El signo. La suma de los tres tiene que ser la traza, que vale
              $2-2+2=2$: con $0+5+3=8$ no cuadra, con $0+5-3=2$ sí.
          - valor: '2'
            mensaje: |
              $2$ es la **traza**, que es la suma de los tres, no el tercero.
          - valor: '-5'
            mensaje: |
              Con $-5$ la suma sería $0$ y la traza vale $2$.
        pista: |
          La suma de los autovalores es la traza de la matriz.
        desarrollo: |
          La traza de $A$ vale $2+\left(-2\right)+2=2$, y es la suma de los
          autovalores:

          $$
          0+5+\lambda=2
          \;\Longrightarrow\;
          \lambda=-3
          $$

          **Segunda comprobación**, con el determinante: el producto de los
          autovalores tiene que dar $\det A$, y
          $0\cdot5\cdot\left(-3\right)=0=\det A$ ✓ — coherente con que $0$ sea
          autovalor, que es exactamente decir que $A$ es singular.

      - tipo: calcular
        titulo: El autovector del cinco
        pregunta: |
          ¿Cuál es un autovector asociado a $\lambda=5$, con la primera
          coordenada igual a uno?
        respuesta:
          tipo: vector
          valor: '(1, 0, 1)'
          tolerancia: 0.001
          formato: las tres coordenadas en orden
        distractores:
          - valor: '(1, 1, 1)'
            mensaje: |
              $A\left(1,1,1\right)=\left(6,-2,4\right)$, que no es proporcional
              a $\left(1,1,1\right)$: no es autovector de nada.
          - valor: '(1, 0, -1)'
            mensaje: |
              El signo de la tercera coordenada.
              $A\left(1,0,-1\right)=\left(-1,2,1\right)$, que no es un múltiplo
              de $\left(1,0,-1\right)$.
          - valor: '(1, -2, -1)'
            mensaje: |
              Ese es el autovector de $\lambda=-3$, no el de $5$. Los dos son
              autovectores, pero de autovalores distintos.
        pista: |
          Resuelve $\left(A-5I\right)v=\overline{0}$. La primera y la tercera
          fila son proporcionales.
        desarrollo: |
          $$
          A-5I=\begin{pmatrix}-3&1&3\\1&-7&-1\\3&-1&-3\end{pmatrix}
          $$

          La tercera fila es la primera cambiada de signo, así que solo quedan
          dos ecuaciones:

          $$
          -3x+y+3z=0,
          \qquad
          x-7y-z=0
          $$

          Sustituyendo $y=3x-3z$ en la segunda:
          $x-21x+21z-z=0\Rightarrow -20x+20z=0\Rightarrow x=z$, y entonces
          $y=0$.

          $$
          v=\left(1,0,1\right)
          $$

          **Comprobación**:
          $A\left(1,0,1\right)=\left(5,0,5\right)=5\left(1,0,1\right)$ ✓

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El polinomio característico da los autovalores $\lambda=5$,
              $\lambda=0$ y $\lambda=-3$, los tres **simples**: suman $2$, que
              es la traza, y multiplican $0$, que es el determinante.
          - texto: >-
              Los autovectores son $\left(1,0,1\right)$,
              $\left(-1,-1,1\right)$ y $\left(1,-2,-1\right)$, y como $A$ es
              simétrica y los autovalores son distintos, **ya salen ortogonales
              entre sí**.
          - texto: >-
              Normalizando los tres se obtiene $P$ ortogonal, y entonces
              $D=P^{T}AP=\operatorname{diag}\left(5,0,-3\right)$, en el mismo
              orden en que se hayan puesto las columnas.
          - texto: >-
              Como uno de los autovalores es cero, $A$ no se puede diagonalizar:
              la matriz de paso saldría singular.
            trampa: true
            mensaje: |
              Confunde dos cosas distintas. **La matriz que tiene que ser
              regular es la de paso $P$, no $A$.** Que $\lambda=0$ sea autovalor
              solo dice que $A$ es singular, y eso no impide diagonalizarla: la
              matriz diagonal $D$ tendrá un cero en la diagonal, y ya está.
              Aquí $P$ es ortogonal, así que su determinante es $\pm1$ y desde
              luego no es cero.
    resolucion: |
      **a) La invarianza del polinomio característico.** Si $A$ y $B$ son
      semejantes, existe $P$ regular con $B=P^{-1}AP$, y entonces

      $$
      \left|B-\lambda I\right|
      =\left|P^{-1}AP-\lambda P^{-1}P\right|
      =\left|P^{-1}\left(A-\lambda I\right)P\right|
      =\frac{\left|A-\lambda I\right|\cdot\left|P\right|}{\left|P\right|}
      =\left|A-\lambda I\right|
      $$

      $\blacksquare$

      El truco es la primera igualdad: escribir $\lambda I$ como
      $P^{-1}\lambda I P$ para poder sacar factor común. Y lo que garantiza es
      que **los autovalores son del endomorfismo, no de la matriz**: cambiar de
      base no los mueve.

      **b) Los autovalores.**

      $$
      \left|A-\lambda I\right|=
      \begin{vmatrix}2-\lambda&1&3\\1&-2-\lambda&-1\\3&-1&2-\lambda\end{vmatrix}
      $$

      Sale $\lambda=5$, $\lambda=0$ y $\lambda=-3$, **los tres simples**. Y las
      dos comprobaciones de siempre, que aquí son especialmente útiles porque
      cazan un signo mal:

      | qué | de la matriz | de los autovalores |
      |---|---|---|
      | suma | traza $=2-2+2=2$ | $5+0-3=2$ ✓ |
      | producto | $\det A=0$ | $5\cdot0\cdot\left(-3\right)=0$ ✓ |

      Que $0$ sea autovalor concuerda con que $\det A=0$: **$A$ es singular**, y
      eso no impide nada.

      **Los autovectores**, uno por autovalor:

      | $\lambda$ | sistema | autovector |
      |---|---|---|
      | $5$ | $\left(A-5I\right)v=\overline{0}$ | $\left(1,0,1\right)$ |
      | $0$ | $Av=\overline{0}$ | $\left(-1,-1,1\right)$ |
      | $-3$ | $\left(A+3I\right)v=\overline{0}$ | $\left(1,-2,-1\right)$ |

      **Y aquí está el regalo de que $A$ sea simétrica con autovalores
      distintos: los tres salen ortogonales entre sí, sin hacer nada.**

      $$
      \left(1,0,1\right)\cdot\left(-1,-1,1\right)=0,
      \quad
      \left(1,0,1\right)\cdot\left(1,-2,-1\right)=0,
      \quad
      \left(-1,-1,1\right)\cdot\left(1,-2,-1\right)=0
      $$

      No hay que aplicar Gram-Schmidt: solo **normalizar**. Gram-Schmidt haría
      falta si algún subespacio propio tuviera dimensión mayor que uno, y aquí
      los tres son rectas.

      $$
      \boxed{\;
      P=\begin{pmatrix}
      \frac{1}{\sqrt2} & -\frac{1}{\sqrt3} & \frac{1}{\sqrt6}\\[3pt]
      0 & -\frac{1}{\sqrt3} & -\frac{2}{\sqrt6}\\[3pt]
      \frac{1}{\sqrt2} & \frac{1}{\sqrt3} & -\frac{1}{\sqrt6}
      \end{pmatrix},
      \qquad
      D=P^{T}AP=\begin{pmatrix}5&0&0\\0&0&0\\0&0&-3\end{pmatrix}\;}
      $$

      **Las normas son $\sqrt2$, $\sqrt3$ y $\sqrt6$**, una por vector, y
      conviene calcularlas antes de escribir nada para no arrastrar
      denominadores.

      **La comprobación**: $P^{T}P=I$ —que es lo que significa ortogonal, y por
      eso $P^{-1}=P^{T}$ y no hay que invertir nada— y $P^{T}AP$ sale diagonal
      con los tres autovalores **en el mismo orden** en que se pusieron las
      columnas. Si el orden no coincide, no es un error: es que se ordenaron
      distinto. Lo que sí sería un error es que no saliera diagonal.
