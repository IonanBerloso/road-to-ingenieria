asignatura: algebra
curso: '2021-2022'
convocatoria: extraordinaria
fecha: curso 2021-2022
# La octava y última convocatoria del corpus de Álgebra.
#
# Cuadernillo bilingüe, con el euskera primero, como su ordinaria. Compuesto
# con LaTeX, así que `pdftotext -enc UTF-8` respeta los signos; las dos
# matrices con parámetro se han contrastado igualmente con la página
# renderizada, porque `-layout` las apila mal.
#
# Dos enunciados repiten otras convocatorias, y conviene tenerlo anotado para
# la ruta:
#   · el 1a.ii, «la expresión de una combinación lineal es única», es el 1a de
#     la extraordinaria de 2022-2023;
#   · el 4a, «el polinomio característico no varía al cambiar de base», es el
#     4a de la ordinaria de 2023-2024 y el de la de 2024-2025. Tres de ocho.
#
# El 2a también repite: es literalmente el 2a de la extraordinaria de
# 2022-2023, partido en dos apartados en vez de uno.
#
# Como todos los de Álgebra, no publica reparto de puntos.
pdf: 2021-2022-ext.pdf

ejercicios:
  - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
    tema: t01-espacios-vectoriales
  - id: exalg2122-ext-2-tres-imagenes-en-una-base-torcida
    tema: t02-aplicaciones-lineales
  - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
    tema: t03-matrices
  - id: exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza
    tema: t07-diagonalizacion
