ejercicios:
  - id: exalg2122-ext-1-un-subespacio-por-generadores-y-otro-por-ecuaciones
    titulo: Uno viene por generadores y el otro por ecuaciones
    fuente: >-
      Ejercicio 1 · Convocatoria extraordinaria, curso 2021-2022 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado a.ii es el
      mismo que el 1a de la extraordinaria de 2022-2023 · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) i. Si $R$, $S$ y $T$ son subespacios de un espacio vectorial $E$,
      demuestra que $R\cap S\cap T$ también es subespacio vectorial.

      ii. Demuestra que si
      $\left\{\overline{u}_{1},\overline{u}_{2},\dots,\overline{u}_{n}\right\}$
      es un sistema libre, un vector que sea combinación lineal de esos
      vectores se expresa de forma única.

      b) Sean los siguientes subespacios de $\mathbb{R}^{4}$:

      $$
      S=L\left(\left\{\left(1,0,0,0\right),\left(2,1,1,0\right),
      \left(0,0,1,0\right)\right\}\right)
      $$

      $$
      T=\left\{\left(x,y,z,t\right)\in\mathbb{R}^{4}
      \;\Big|\;x-2y-z=0;\;z+t=0\right\}
      $$

      i. Calcula bases y dimensiones de $S$, $T$, $S+T$ y $S\cap T$.

      ii. Amplía la base de $S$ para obtener una base de $\mathbb{R}^{4}$.

      iii. Calcula las coordenadas del vector $\left(2,1,0,0\right)$ respecto
      de la base obtenida en el apartado anterior.
    pide: Las dos demostraciones, las cuatro bases, y unas coordenadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          $S$ viene dado por generadores y $T$ por ecuaciones. ¿Cuál de los dos
          es más cómodo para calcular la intersección, y por qué?
        opciones:
          - texto: >-
              $T$: teniendo sus ecuaciones, basta imponerlas a los vectores de
              $S$, sin resolver ningún sistema grande
            correcta: true
            mensaje: |
              Exacto, y es la técnica que ahorra más tiempo del tema. Un
              subespacio por ecuaciones es un **filtro**: se toma la forma
              genérica del otro y se le exigen esas ecuaciones. Al revés
              —cruzar dos conjuntos de generadores— sale un sistema con el
              doble de incógnitas.
          - texto: >-
              $S$: los generadores siempre son más manejables
            mensaje: |
              Para la **suma** sí, porque basta juntar generadores. Para la
              intersección son lo peor: dos vectores genéricos, uno de cada
              subespacio, dan un sistema con tantas incógnitas como
              generadores hay en total.
          - texto: >-
              Da igual: hay que pasar los dos a la misma forma antes
            mensaje: |
              Es lo que muchos hacen y es trabajo de más. Cuando uno viene por
              generadores y el otro por ecuaciones, **ya están en las formas
              que hacen falta**: generadores para la suma, ecuaciones para la
              intersección.
          - texto: >-
              Ninguno: la intersección se calcula con la fórmula de Grassmann
            mensaje: |
              Grassmann da la **dimensión** de la intersección si ya conoces la
              de la suma, pero no da su base. Y aquí se pide la base.

      - tipo: calcular
        titulo: La dimensión del primero
        pregunta: |
          ¿Cuál es la dimensión de $S$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ supondría que uno de los tres generadores sobra. No sobra
              ninguno: $\left(2,1,1,0\right)$ tiene un $1$ en la segunda
              coordenada donde los otros dos tienen $0$, así que no es
              combinación suya.
          - valor: '4'
            mensaje: |
              $4$ sería todo $\mathbb{R}^{4}$, y $S$ no lo es: los tres
              generadores tienen la cuarta coordenada nula, así que $S$ está
              contenido en el hiperplano $t=0$.
          - valor: '1'
            mensaje: |
              $1$ dejaría a los tres generadores proporcionales entre sí, y no
              lo son ni de lejos.
        pista: |
          Escalona los tres generadores. Fíjate en que los tres tienen la
          cuarta coordenada nula.
        desarrollo: |
          Los tres generadores son independientes:
          $\left(2,1,1,0\right)-2\left(1,0,0,0\right)-\left(0,0,1,0\right)
          =\left(0,1,0,0\right)$, así que a partir de ellos se obtienen
          $\left(1,0,0,0\right)$, $\left(0,1,0,0\right)$ y
          $\left(0,0,1,0\right)$.

          $$
          S=\left\{\left(x,y,z,t\right)\;\Big|\;t=0\right\},
          \qquad
          \dim S=3
          $$

          Es decir: $S$ es exactamente el hiperplano $t=0$, y verlo así hace
          trivial todo lo que viene después.

      - tipo: calcular
        titulo: La dimensión de la intersección
        pregunta: |
          ¿Cuánto vale $\dim\left(S\cap T\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ significaría $T\subset S$, y no lo es:
              $\left(1,0,1,-1\right)$ está en $T$ y tiene la cuarta coordenada
              distinta de cero, así que no está en $S$.
          - valor: '0'
            mensaje: |
              $0$ dejaría $\dim\left(S+T\right)=5$, imposible dentro de
              $\mathbb{R}^{4}$. Y de hecho $\left(2,1,0,0\right)$ está en los
              dos.
          - valor: '3'
            mensaje: |
              La intersección está dentro de $T$, que tiene dimensión $2$: no
              puede valer $3$.
        pista: |
          $S$ es el hiperplano $t=0$. Impón $t=0$ a las ecuaciones de $T$ y
          cuenta los grados de libertad que quedan.
        desarrollo: |
          $T$ tiene dos ecuaciones independientes, luego $\dim T=2$, con base

          $$
          \left\{\left(2,1,0,0\right),\left(1,0,1,-1\right)\right\}
          $$

          Como $S$ es $t=0$, la intersección son los vectores de $T$ con
          $t=0$; de $z+t=0$ sale $z=0$, y de $x-2y-z=0$, $x=2y$:

          $$
          S\cap T=L\left(\left\{\left(2,1,0,0\right)\right\}\right),
          \qquad
          \dim\left(S\cap T\right)=1
          $$

          Y Grassmann cierra el apartado sin más cuentas:
          $\dim\left(S+T\right)=3+2-1=4$, o sea $S+T=\mathbb{R}^{4}$.

      - tipo: calcular
        titulo: Las coordenadas en la base ampliada
        pregunta: |
          Ampliando la base de $S$ con $\left(0,0,0,1\right)$, ¿cuáles son las
          coordenadas de $\left(2,1,0,0\right)$ en la base
          $\left\{\left(1,0,0,0\right),\left(2,1,1,0\right),
          \left(0,0,1,0\right),\left(0,0,0,1\right)\right\}$?
        respuesta:
          tipo: vector
          valor: '(0, 1, -1, 0)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(2, 1, 0, 0)'
            mensaje: |
              Esas son las coordenadas en la base **canónica**, que es el dato
              de partida. En la base nueva hay que resolver un sistema, y la
              segunda coordenada del vector obliga a que el segundo coeficiente
              valga $1$.
          - valor: '(0, 1, 1, 0)'
            mensaje: |
              El signo de la tercera. La tercera coordenada del vector es $0$ y
              el segundo generador ya aporta un $1$ ahí, así que hay que
              **restar**: el coeficiente es $-1$.
          - valor: '(2, 1, -1, 0)'
            mensaje: |
              La primera. Con el coeficiente $1$ en
              $\left(2,1,1,0\right)$ ya se llega a $2$ en la primera
              coordenada, así que el de $\left(1,0,0,0\right)$ es $0$, no $2$.
        pista: |
          Empieza por la segunda coordenada: solo un generador tiene algo ahí.
        desarrollo: |
          Planteando
          $a\left(1,0,0,0\right)+b\left(2,1,1,0\right)+c\left(0,0,1,0\right)
          +d\left(0,0,0,1\right)=\left(2,1,0,0\right)$:

          | coordenada | ecuación | despejado |
          |---|---|---|
          | 2.ª | $b=1$ | $b=1$ |
          | 4.ª | $d=0$ | $d=0$ |
          | 3.ª | $b+c=0$ | $c=-1$ |
          | 1.ª | $a+2b=2$ | $a=0$ |

          $$
          \boxed{\;\left(0,1,-1,0\right)\;}
          $$

          Y se comprueba:
          $\left(2,1,1,0\right)-\left(0,0,1,0\right)=\left(2,1,0,0\right)$.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a) i: la intersección de tres
          subespacios es subespacio. Una pieza es falsa.
        piezas:
          - texto: >-
              $R\cap S\cap T$ no es vacío: el $\overline{0}$ está en los tres,
              porque todo subespacio lo contiene.
          - texto: >-
              Si $\overline{x}$ e $\overline{y}$ están en la intersección,
              están en $R$, en $S$ y en $T$ a la vez.
          - texto: >-
              Cada uno de los tres es cerrado para la combinación lineal, así
              que $\alpha\overline{x}+\beta\overline{y}$ está en los tres.
          - texto: >-
              Luego la combinación vuelve a estar en la intersección, y esta es
              subespacio.
          - texto: >-
              El mismo argumento vale para la unión $R\cup S\cup T$.
            trampa: true
            mensaje: |
              La unión casi nunca es subespacio, y el contraejemplo cabe en una
              línea: en $\mathbb{R}^{2}$, la unión de los dos ejes contiene a
              $\left(1,0\right)$ y a $\left(0,1\right)$ pero **no** a su suma
              $\left(1,1\right)$. El argumento de arriba se cae en el tercer
              paso: de estar en la unión no se sigue estar en el mismo
              subespacio los dos, y sin eso no se puede sumar.
    resolucion: |
      **a) i. La intersección.** Los tres contienen al $\overline{0}$, así que
      la intersección no es vacía. Y si $\overline{x}$ e $\overline{y}$ están
      en los tres, cada uno de los tres —siendo subespacio— contiene a
      $\alpha\overline{x}+\beta\overline{y}$; luego la intersección también.

      Lo mismo vale para una intersección de cuantos subespacios se quiera,
      incluso infinitos. Con la **unión** el argumento falla, y ese es el
      contraste que hay que tener presente.

      **a) ii. La unicidad.** Si un vector admite dos expresiones sobre la
      misma familia libre, restándolas queda
      $\sum\left(\alpha_{i}-\beta_{i}\right)\overline{u}_{i}=\overline{0}$, y
      ser libre significa que todos los coeficientes son nulos.

      **b) i. Los dos subespacios, cada uno en su forma.** $S$ viene por
      generadores y los tres son independientes; además todos tienen la cuarta
      coordenada nula, así que

      $$
      \boxed{\;S=\left\{t=0\right\},\quad\dim S=3\;}
      $$

      $T$ viene por dos ecuaciones independientes, luego $\dim T=2$. Despejando
      $x=2y+z$ y $t=-z$:

      $$
      T=L\left(\left\{\left(2,1,0,0\right),
      \left(1,0,1,-1\right)\right\}\right)
      $$

      **La intersección se calcula con las ecuaciones, no con los
      generadores.** Como $S$ es «$t=0$», basta añadir esa ecuación a las de
      $T$: de $z+t=0$ sale $z=0$, y de $x-2y-z=0$, $x=2y$.

      $$
      \boxed{\;S\cap T=L\left(\left\{\left(2,1,0,0\right)\right\}\right),
      \quad\dim=1\;}
      $$

      $$
      \dim\left(S+T\right)=3+2-1=4
      \;\Longrightarrow\;
      S+T=\mathbb{R}^{4}
      $$

      **b) ii. Ampliar la base de $S$.** Falta salir del hiperplano $t=0$, y el
      vector más barato que lo hace es $\left(0,0,0,1\right)$:

      $$
      B=\left\{\left(1,0,0,0\right),\left(2,1,1,0\right),
      \left(0,0,1,0\right),\left(0,0,0,1\right)\right\}
      $$

      Es base porque la matriz de sus coordenadas es triangular por bloques con
      determinante $1$.

      **b) iii. Las coordenadas.** Resolviendo de la segunda coordenada hacia
      atrás:

      $$
      \left(2,1,0,0\right)=\left(2,1,1,0\right)-\left(0,0,1,0\right)
      \;\Longrightarrow\;
      \boxed{\;\left(0,1,-1,0\right)\;}
      $$

      Que el vector de este apartado sea justo el generador de $S\cap T$ no es
      casualidad del enunciado: el examen reutiliza el vector que ya ha
      aparecido, y eso da una comprobación gratis —tiene que salir con cuarta
      coordenada nula, porque está en $S$—.

  - id: exalg2122-ext-2-tres-imagenes-en-una-base-torcida
    titulo: Tres imágenes sobre una base que no es la canónica
    fuente: >-
      Ejercicio 2 · Convocatoria extraordinaria, curso 2021-2022 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado a) es el mismo
      que el 2a de la extraordinaria de 2022-2023 · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demostrar para la aplicación lineal $f:E\longrightarrow F$:

      i. Si
      $\left\{\overline{u}_{1},\overline{u}_{2},\dots,\overline{u}_{n}\right\}$
      es sistema generador de $E$, entonces
      $\left\{f\left(\overline{u}_{1}\right),f\left(\overline{u}_{2}\right),
      \dots,f\left(\overline{u}_{n}\right)\right\}$ es sistema generador del
      subespacio imagen $\operatorname{Im}f$.

      ii. Si
      $\left\{\overline{u}_{1},\overline{u}_{2},\dots,\overline{u}_{n}\right\}$
      es sistema libre y $f$ es inyectiva, entonces también
      $\left\{f\left(\overline{u}_{1}\right),f\left(\overline{u}_{2}\right),
      \dots,f\left(\overline{u}_{n}\right)\right\}$ es libre.

      b) Sea $f:\mathbb{R}^{3}\longrightarrow\mathbb{R}^{3}$ la aplicación
      lineal definida del modo siguiente:

      $$
      f\left(1,1,0\right)=\left(2,0,1\right);
      \quad
      f\left(0,2,-1\right)=\left(0,2,-3\right);
      \quad
      f\left(1,2,0\right)=\left(3,-1,3\right)
      $$

      i. Obtén la expresión de $f$ en la base canónica.

      ii. Calcula $\operatorname{Ker}f$ e $\operatorname{Im}f$ y halla sus
      bases y dimensiones.

      iii. Clasifica la aplicación.
    pide: Las dos demostraciones, la matriz canónica, y las dos bases con la clasificación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres vectores de partida no son la base canónica. ¿Qué hay que
          comprobar antes de nada?
        opciones:
          - texto: >-
              Que $\left\{\left(1,1,0\right),\left(0,2,-1\right),
              \left(1,2,0\right)\right\}$ sea base: si no lo fuese, los datos
              podrían ser contradictorios o insuficientes
            correcta: true
            mensaje: |
              Exacto. Una aplicación lineal queda determinada por lo que hace
              sobre una base, y solo entonces. Aquí el determinante de los tres
              vale $1$, así que son base y los datos determinan $f$ por
              completo.
          - texto: >-
              Que los tres sean unitarios
            mensaje: |
              No hace falta: para determinar una aplicación lineal solo se
              necesita que los vectores sean base, y ser base no tiene nada que
              ver con la longitud. Además, aquí ni siquiera hay definido un
              producto escalar.
          - texto: >-
              Que las tres imágenes sean independientes
            mensaje: |
              No tienen por qué serlo, y en este ejercicio **no lo son**: el
              determinante de la matriz sale $0$. Que las imágenes sean
              dependientes es información sobre el rango, no un problema.
          - texto: >-
              Que $f$ sea inyectiva
            mensaje: |
              Eso es una conclusión, no una hipótesis. De hecho aquí no lo es:
              el núcleo tiene dimensión $1$.

      - tipo: calcular
        titulo: La imagen del segundo vector canónico
        pregunta: |
          De $f\left(1,1,0\right)=\left(2,0,1\right)$ y
          $f\left(1,2,0\right)=\left(3,-1,3\right)$, ¿cuánto vale
          $f\left(0,1,0\right)$?
        respuesta:
          tipo: vector
          valor: '(1, -1, 2)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(-1, 1, -2)'
            mensaje: |
              El signo de la resta. $\left(0,1,0\right)
              =\left(1,2,0\right)-\left(1,1,0\right)$, en ese orden, así que
              hay que restar la primera imagen a la tercera y no al revés.
          - valor: '(5, -1, 4)'
            mensaje: |
              Has **sumado** las dos imágenes. La combinación que da
              $\left(0,1,0\right)$ es una resta:
              $\left(1,2,0\right)-\left(1,1,0\right)$.
          - valor: '(1, 1, -1)'
            mensaje: |
              Ese es $f\left(1,0,0\right)$, que sale del paso siguiente:
              $f\left(1,1,0\right)-f\left(0,1,0\right)$.
        pista: |
          $\left(1,2,0\right)-\left(1,1,0\right)=\left(0,1,0\right)$, y $f$ es
          lineal.
        desarrollo: |
          $$
          f\left(0,1,0\right)
          =f\left(1,2,0\right)-f\left(1,1,0\right)
          =\left(3,-1,3\right)-\left(2,0,1\right)
          =\left(1,-1,2\right)
          $$

          De ahí salen las otras dos:

          $$
          f\left(1,0,0\right)=f\left(1,1,0\right)-f\left(0,1,0\right)
          =\left(1,1,-1\right)
          $$

          $$
          f\left(0,0,1\right)=2f\left(0,1,0\right)-f\left(0,2,-1\right)
          =\left(2,-2,4\right)-\left(0,2,-3\right)=\left(2,-4,7\right)
          $$

      - tipo: calcular
        titulo: La matriz en la base canónica
        pregunta: |
          La matriz de $f$ en la base canónica. Escribe las filas separadas por
          punto y coma.
        respuesta:
          tipo: matriz
          valor: '[1, 1, 2; 1, -1, -4; -1, 2, 7]'
          tolerancia: 0.001
          formato: tres filas de tres números, con punto y coma entre filas
        distractores:
          - valor: '[1, 1, -1; 1, -1, 2; 2, -4, 7]'
            mensaje: |
              Es la **traspuesta**: las imágenes puestas en filas. Van en
              columnas, y aquí se nota enseguida porque la matriz correcta
              tiene determinante $0$ y esta también, así que el error no salta
              solo.
          - valor: '[1, 1, 2; 1, -1, -4; -1, 2, -7]'
            mensaje: |
              El signo de la última entrada.
              $f\left(0,0,1\right)=\left(2,-4,7\right)$, con $+7$: sale de
              $2\cdot2-\left(-3\right)=7$.
          - valor: '[1, 1, 0; 1, -1, 2; -1, 2, -1]'
            mensaje: |
              La tercera columna no es
              $f\left(0,2,-1\right)$: ese vector no es el tercero de la base
              canónica. Hay que despejar $f\left(0,0,1\right)$ de él, y sale
              $\left(2,-4,7\right)$.
        pista: |
          Las columnas son $f\left(1,0,0\right)$, $f\left(0,1,0\right)$ y
          $f\left(0,0,1\right)$, ya calculadas.
        desarrollo: |
          $$
          A=\begin{pmatrix}
          1&1&2\\
          1&-1&-4\\
          -1&2&7
          \end{pmatrix}
          $$

          Y se comprueba contra los tres datos del enunciado, que es lo que
          convierte una matriz plausible en una matriz correcta:

          | vector | $A\overline{v}$ | dato |
          |---|---|---|
          | $\left(1,1,0\right)$ | $\left(2,0,1\right)$ | ✓ |
          | $\left(0,2,-1\right)$ | $\left(0,2,-3\right)$ | ✓ |
          | $\left(1,2,0\right)$ | $\left(3,-1,3\right)$ | ✓ |

      - tipo: calcular
        titulo: El generador del núcleo
        pregunta: |
          El núcleo de $f$ es una recta. ¿Cuál es su generador, tomando el que
          tiene segunda coordenada $3$?
        respuesta:
          tipo: vector
          valor: '(-1, 3, -1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(1, 3, -1)'
            mensaje: |
              La primera coordenada. Comprueba con la primera fila:
              $1+3-2=2\neq0$. Con $-1$ sale $-1+3-2=0$.
          - valor: '(-1, 3, 1)'
            mensaje: |
              La tercera. Con $+1$, la primera fila da
              $-1+3+2=4\neq0$. La combinación entre columnas es
              $c_{3}=-c_{1}+3c_{2}$, así que el coeficiente de la tercera es
              $-1$.
          - valor: '(0, 0, 0)'
            mensaje: |
              El vector nulo está en todo núcleo, pero no genera nada: un
              generador tiene que ser distinto de cero. El núcleo aquí tiene
              dimensión $1$.
        pista: |
          Busca la combinación entre columnas: ¿cómo se escribe la tercera con
          las dos primeras?
        desarrollo: |
          Las tres columnas son
          $c_{1}=\left(1,1,-1\right)$, $c_{2}=\left(1,-1,2\right)$ y
          $c_{3}=\left(2,-4,7\right)$, y

          $$
          c_{3}=-c_{1}+3c_{2}
          \;\Longleftrightarrow\;
          -c_{1}+3c_{2}-c_{3}=\overline{0}
          $$

          Los coeficientes de esa combinación **son** el vector del núcleo:

          $$
          \ker f=L\left(\left\{\left(-1,3,-1\right)\right\}\right),
          \qquad
          A\left(-1,3,-1\right)^{T}=\overline{0}
          $$

          Es un atajo que conviene tener: cada relación entre columnas es un
          vector del núcleo, escrito directamente.

      - tipo: justificar
        pregunta: >-
          Ordena la clasificación de $f$. Una pieza es falsa.
        piezas:
          - texto: >-
              El determinante de $A$ vale $0$, así que el rango es menor que
              $3$.
          - texto: >-
              Las dos primeras columnas no son proporcionales, luego el rango
              es exactamente $2$ y
              $\dim\operatorname{Im}f=2$.
          - texto: >-
              Por la fórmula de las dimensiones,
              $\dim\ker f=3-2=1$, así que $f$ no es inyectiva.
          - texto: >-
              Y como la imagen tiene dimensión $2<3$, tampoco es sobreyectiva:
              $f$ no es ni inyectiva ni sobreyectiva.
          - texto: >-
              El determinante nulo indica que $f$ no es inyectiva, pero podría
              seguir siendo sobreyectiva.
            trampa: true
            mensaje: |
              En un endomorfismo —de un espacio en sí mismo— las dos
              propiedades van siempre juntas: si el núcleo no es nulo, la
              imagen pierde exactamente esas dimensiones y ya no puede llenar
              el espacio de llegada, que tiene la misma dimensión que el de
              partida. Sin ser endomorfismo la pieza sí podría ser cierta —una
              aplicación de $\mathbb{R}^{4}$ a $\mathbb{R}^{3}$ puede ser
              sobreyectiva y no inyectiva—, y ahí está la trampa.
    resolucion: |
      **a) i. Las imágenes de un sistema generador generan la imagen.** Todo
      elemento de $\operatorname{Im}f$ es $f\left(\overline{x}\right)$ para
      algún $\overline{x}\in E$; escribiendo $\overline{x}$ sobre el sistema
      generador y aplicando linealidad,

      $$
      f\left(\overline{x}\right)
      =f\left(\sum\alpha_{i}\overline{u}_{i}\right)
      =\sum\alpha_{i}f\left(\overline{u}_{i}\right)
      $$

      **a) ii. Y si además es inyectiva, conservan la libertad.** De
      $\sum\alpha_{i}f\left(\overline{u}_{i}\right)=\overline{0}$ y linealidad
      sale $f\left(\sum\alpha_{i}\overline{u}_{i}\right)=\overline{0}$; la
      inyectividad obliga a que lo de dentro sea $\overline{0}$, y la libertad
      de partida, a que todos los $\alpha_{i}$ lo sean.

      Juntando los dos apartados sale el corolario que se usa a diario: **una
      aplicación lineal inyectiva lleva bases a bases de la imagen**.

      **b) i. Bajar a la base canónica.** Los tres vectores de partida son base
      —su determinante vale $1$—, así que los datos determinan $f$. Se despejan
      en cadena:

      $$
      f\left(0,1,0\right)=f\left(1,2,0\right)-f\left(1,1,0\right)
      =\left(1,-1,2\right)
      $$

      $$
      f\left(1,0,0\right)=f\left(1,1,0\right)-f\left(0,1,0\right)
      =\left(1,1,-1\right)
      $$

      $$
      f\left(0,0,1\right)=2f\left(0,1,0\right)-f\left(0,2,-1\right)
      =\left(2,-4,7\right)
      $$

      $$
      \boxed{\;A=\begin{pmatrix}1&1&2\\1&-1&-4\\-1&2&7\end{pmatrix}\;}
      $$

      **b) ii. Núcleo e imagen.** $\det A=0$ y las dos primeras columnas no son
      proporcionales, luego el rango vale $2$:

      $$
      \operatorname{Im}f
      =L\left(\left\{\left(1,1,-1\right),
      \left(1,-1,2\right)\right\}\right),\quad\dim=2
      $$

      $$
      \boxed{\;\ker f=L\left(\left\{\left(-1,3,-1\right)\right\}\right),
      \quad\dim=1\;}
      $$

      El generador del núcleo sale de la relación entre columnas
      $c_{3}=-c_{1}+3c_{2}$: sus coeficientes, con el signo cambiado en la
      última, son el vector buscado. Es más rápido que resolver el sistema.

      **b) iii. Clasificación.** Ni inyectiva ni sobreyectiva. En un
      endomorfismo las dos fallan a la vez o ninguna, así que basta comprobar
      una: el determinante nulo ya lo decide todo.

  - id: exalg2122-ext-3-una-ecuacion-que-da-la-inversa-sin-calcularla
    titulo: Una ecuación que regala tres inversas
    fuente: >-
      Ejercicio 3 · Convocatoria extraordinaria, curso 2021-2022 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica
      solución ni reparto de puntos: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Sea $A$ una matriz cuadrada que cumple la siguiente ecuación:

      $$
      \left(I+A+A^{2}+A^{3}\right)\left(I-A\right)=0
      $$

      i. Desarrolla esta ecuación para obtener $A^{4}$.

      ii. ¿Cuáles son las matrices inversas de $A$, $A^{2}$ y $A^{3}$?

      b) Dada la siguiente matriz, ¿para qué valor de $a$ existe la inversa? Si
      es posible, calcula la inversa de $A$ cuando $a=0$.

      $$
      A=\begin{pmatrix}
      -3&1&-1\\
      -a&5&-1\\
      -6&a&-2
      \end{pmatrix}
      $$
    pide: El valor de A⁴, las tres inversas, y la inversa concreta con su condición.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al desarrollar $\left(I+A+A^{2}+A^{3}\right)\left(I-A\right)$, ¿qué
          pasa con los términos intermedios?
        opciones:
          - texto: >-
              Se cancelan dos a dos y solo sobreviven $I$ y $-A^{4}$: es una
              suma telescópica
            correcta: true
            mensaje: |
              Exacto. Cada potencia aparece dos veces con signos opuestos:
              $+A$ y $-A$, $+A^{2}$ y $-A^{2}$, $+A^{3}$ y $-A^{3}$. Queda
              $I-A^{4}=0$, o sea $A^{4}=I$.
          - texto: >-
              No se pueden desarrollar, porque el producto de matrices no es
              conmutativo
            mensaje: |
              La no conmutatividad impide **reordenar** factores, no
              desarrollar. Y aquí no hace falta reordenar nada: todos los
              factores son potencias de la misma $A$, y esas sí conmutan entre
              sí.
          - texto: >-
              Quedan cuatro términos, uno por cada potencia
            mensaje: |
              Salen ocho términos y seis se cancelan. Escríbelos con cuidado:
              $I-A+A-A^{2}+A^{2}-A^{3}+A^{3}-A^{4}$.
          - texto: >-
              Que el producto es cero obliga a que $A=I$
            mensaje: |
              Con matrices, un producto nulo **no** obliga a que un factor lo
              sea: hay divisores de cero. Lo único que se deduce es la igualdad
              $A^{4}=I$.

      - tipo: calcular
        titulo: Los valores donde no hay inversa
        pregunta: |
          El determinante de la matriz del apartado b) vale $a^{2}-5a+6$. ¿Para
          qué valores de $a$ **no** existe $A^{-1}$?
        respuesta:
          tipo: conjunto
          valor: '2, 3'
          tolerancia: 0.001
          formato: los valores separados por comas
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ está bien, pero falta el otro:
              $a^{2}-5a+6=\left(a-2\right)\left(a-3\right)$ tiene **dos**
              raíces.
          - valor: '-2, -3'
            mensaje: |
              Los signos. Las raíces de $a^{2}-5a+6$ son las que suman $5$ y
              multiplican $6$: son $2$ y $3$, las dos positivas.
          - valor: '0, 6'
            mensaje: |
              En $a=0$ el determinante vale $6$, que es justo lo que permite el
              segundo apartado. Lo que hay que resolver es
              $a^{2}-5a+6=0$, no leer los coeficientes.
        pista: |
          Factoriza $a^{2}-5a+6$. Son dos números que suman $5$ y multiplican
          $6$.
        desarrollo: |
          $$
          \det A=a^{2}-5a+6=\left(a-2\right)\left(a-3\right)=0
          \;\Longleftrightarrow\;
          a=2\;\text{ o }\;a=3
          $$

          Así que **$A^{-1}$ existe para todo $a\neq2$ y $a\neq3$**, que es
          exactamente lo que pregunta el enunciado, aunque lo pregunte en
          singular. En $a=0$ el determinante vale $6$: por eso el segundo
          apartado elige ese valor.

      - tipo: calcular
        titulo: La primera fila de la inversa
        pregunta: |
          Para $a=0$, ¿cuál es la primera fila de $A^{-1}$?
        respuesta:
          tipo: vector
          valor: '(-5/3, 1/3, 2/3)'
          tolerancia: 0.001
          formato: tres números entre paréntesis; valen fracciones
        distractores:
          - valor: '(-10, 2, 4)'
            mensaje: |
              Esa es la primera fila de la matriz adjunta traspuesta, sin
              dividir por el determinante. Falta el factor
              $\tfrac{1}{6}$ que multiplica a todo.
          - valor: '(5/3, -1/3, -2/3)'
            mensaje: |
              Los tres signos. El determinante vale $+6$, no $-6$: sustituye
              $a=0$ en $a^{2}-5a+6$.
          - valor: '(-3, 1, -1)'
            mensaje: |
              Esa es la primera fila de $A$, no de su inversa. Invertir no es
              cambiar el signo de nada: hay que hacer la cuenta.
        pista: |
          Con $a=0$ la matriz es
          $\begin{pmatrix}-3&1&-1\\0&5&-1\\-6&0&-2\end{pmatrix}$ y su
          determinante vale $6$. Monta $\left(A\mid I\right)$ y haz
          Gauss-Jordan.
        desarrollo: |
          Con $a=0$:

          $$
          A=\begin{pmatrix}-3&1&-1\\0&5&-1\\-6&0&-2\end{pmatrix},
          \qquad
          \det A=6
          $$

          y por Gauss-Jordan o por la adjunta:

          $$
          A^{-1}=\frac{1}{6}\begin{pmatrix}
          -10&2&4\\
          6&0&-3\\
          30&-6&-15
          \end{pmatrix}
          =\begin{pmatrix}
          -\tfrac{5}{3}&\tfrac{1}{3}&\tfrac{2}{3}\\[2pt]
          1&0&-\tfrac{1}{2}\\[2pt]
          5&-1&-\tfrac{5}{2}
          \end{pmatrix}
          $$

          Comprobado por los dos lados: $AA^{-1}=A^{-1}A=I$.

      - tipo: justificar
        pregunta: >-
          Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Desarrollando el producto sale
              $I-A+A-A^{2}+A^{2}-A^{3}+A^{3}-A^{4}$, donde todo se cancela
              salvo los extremos.
          - texto: >-
              Queda $I-A^{4}=0$, es decir $A^{4}=I$.
          - texto: >-
              De $A\cdot A^{3}=I$ se deduce que $A$ es inversible y que
              $A^{-1}=A^{3}$.
          - texto: >-
              Con el mismo argumento,
              $\left(A^{2}\right)^{-1}=A^{2}$ y
              $\left(A^{3}\right)^{-1}=A$.
          - texto: >-
              Y como el producto de las dos matrices del enunciado es cero,
              alguna de las dos tiene que ser la matriz nula.
            trampa: true
            mensaje: |
              Con matrices, un producto nulo no obliga a que un factor lo sea:
              existen **divisores de cero**. El contraejemplo cabe en cuatro
              números:
              $\begin{pmatrix}1&0\\0&0\end{pmatrix}
              \begin{pmatrix}0&0\\0&1\end{pmatrix}=0$ y ninguna de las dos es
              nula. Y aquí, además, se llega a $A^{4}=I$, que **excluye** que
              $A$ sea nula.
    resolucion: |
      **a) i. La cuarta potencia, por telescopio.** El producto se desarrolla y
      casi todo se cancela:

      $$
      \left(I+A+A^{2}+A^{3}\right)\left(I-A\right)
      =I-A+A-A^{2}+A^{2}-A^{3}+A^{3}-A^{4}
      =I-A^{4}
      $$

      $$
      \boxed{\;A^{4}=I\;}
      $$

      Merece la pena ver por qué se puede desarrollar tan alegremente aunque el
      producto de matrices no sea conmutativo: **todas las potencias de una
      misma matriz conmutan entre sí**, así que aquí la no conmutatividad no
      estorba.

      **a) ii. Las tres inversas, sin invertir nada.** De $A^{4}=I$ salen
      directas:

      | matriz | inversa | por qué |
      |---|---|---|
      | $A$ | $A^{3}$ | $A\cdot A^{3}=A^{4}=I$ |
      | $A^{2}$ | $A^{2}$ | $A^{2}\cdot A^{2}=I$ |
      | $A^{3}$ | $A$ | lo mismo del revés |

      Y $A^{2}$ es su propia inversa, o sea una **involución**. No hay que
      calcular ningún determinante: la ecuación lo da todo.

      **b) Dónde existe la inversa.** Desarrollando el determinante:

      $$
      \det A=a^{2}-5a+6=\left(a-2\right)\left(a-3\right)
      $$

      $$
      \boxed{\;A^{-1}\text{ existe si y solo si }a\neq2\text{ y }a\neq3\;}
      $$

      **La inversa en $a=0$**, donde el determinante vale $6$:

      $$
      \boxed{\;A^{-1}=\frac{1}{6}\begin{pmatrix}
      -10&2&4\\
      6&0&-3\\
      30&-6&-15
      \end{pmatrix}\;}
      $$

      Comprobada por los dos lados. En una inversa de orden $3$ con entradas
      grandes, multiplicar cuesta menos que revisar la adjunta signo a signo.

  - id: exalg2122-ext-4-el-parametro-que-decide-si-diagonaliza
    titulo: Dos valores del parámetro que estropean la diagonalización
    fuente: >-
      Ejercicio 4 · Convocatoria extraordinaria, curso 2021-2022 · Álgebra,
      Escuela de Ingeniería de Gipuzkoa (UPV/EHU) · El apartado a) es el mismo
      que el 4a de las ordinarias de 2023-2024 y 2024-2025: tres de las ocho
      convocatorias · El examen no publica solución ni reparto de puntos: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    enunciado: |
      a) Demuestra que haciendo un cambio de base en el espacio vectorial $E$,
      el polinomio característico de la matriz asociada al endomorfismo
      $f:E\longrightarrow E$ no varía.

      b) Calcula los valores del parámetro $a\in\mathbb{R}$ para que la matriz
      $A$ sea diagonalizable.

      $$
      A=\begin{pmatrix}
      1&-2&-2\\
      -2&a&8\\
      2&8&a
      \end{pmatrix}
      $$
    pide: La demostración de la invariancia, y los valores del parámetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          El polinomio característico sale
          $-\left(\lambda-1\right)\left(\lambda-a-8\right)
          \left(\lambda-a+8\right)$. ¿Qué hay que estudiar para decidir la
          diagonalización?
        opciones:
          - texto: >-
              Para qué valores de $a$ dos de los tres autovalores coinciden, y
              solo en esos casos mirar la multiplicidad geométrica
            correcta: true
            mensaje: |
              Exacto, y ese orden ahorra casi todo el trabajo. Con tres
              autovalores distintos la diagonalización está garantizada sin más
              cuentas; solo los valores de $a$ que producen un autovalor
              repetido obligan a calcular rangos.
          - texto: >-
              Para qué valores de $a$ el determinante es no nulo
            mensaje: |
              El determinante no tiene nada que ver: una matriz singular puede
              diagonalizar perfectamente —basta que el $0$ sea autovalor con
              bastantes direcciones propias— y una inversible puede no hacerlo.
          - texto: >-
              Para qué valores de $a$ la matriz es simétrica
            mensaje: |
              Es una buena idea que aquí no llega a nada: la entrada
              $\left(1,2\right)$ vale $-2$ y la $\left(2,1\right)$ vale $-2$…
              pero la $\left(1,3\right)$ vale $-2$ y la $\left(3,1\right)$ vale
              $2$. La matriz **no es simétrica** para ningún $a$.
          - texto: >-
              Para qué valores de $a$ los tres autovalores son positivos
            mensaje: |
              El signo de los autovalores no interviene en la
              diagonalización. Lo que decide es si cada autovalor aporta tantas
              direcciones propias como su multiplicidad.

      - tipo: calcular
        titulo: El autovalor que no depende del parámetro
        pregunta: |
          Uno de los tres autovalores es el mismo para cualquier valor de $a$.
          ¿Cuál es?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              $8$ aparece en los otros dos autovalores, que son $a+8$ y $a-8$,
              pero los dos **sí** dependen de $a$. El fijo es el que sale de la
              primera entrada.
          - valor: '0'
            mensaje: |
              $0$ es autovalor solo cuando el determinante se anula, es decir
              cuando $a=\pm8$. No es fijo.
          - valor: '-8'
            mensaje: |
              Igual que el $8$: es parte de $a-8$, que depende de $a$. Con
              $a=0$ ese autovalor vale $-8$, pero con $a=5$ vale $-3$.
        pista: |
          Prueba $\lambda=1$ en el polinomio característico y comprueba que se
          anula sea cual sea $a$.
        desarrollo: |
          Con traza $1+2a$, suma de menores principales $a^{2}+2a-64$ y
          determinante $a^{2}-64$:

          $$
          p\left(\lambda\right)=-\lambda^{3}+\left(1+2a\right)\lambda^{2}
          -\left(a^{2}+2a-64\right)\lambda+\left(a^{2}-64\right)
          $$

          Sustituyendo $\lambda=1$ todo se cancela, para cualquier $a$. Y
          dividiendo:

          $$
          p\left(\lambda\right)=-\left(\lambda-1\right)
          \left(\lambda^{2}-2a\lambda+a^{2}-64\right)
          =-\left(\lambda-1\right)\left(\lambda-a-8\right)
          \left(\lambda-a+8\right)
          $$

          Autovalores: $1$, $a+8$ y $a-8$.

      - tipo: calcular
        titulo: Los valores de a con autovalor repetido
        pregunta: |
          ¿Para qué valores de $a$ dos de los tres autovalores $1$, $a+8$ y
          $a-8$ coinciden?
        respuesta:
          tipo: conjunto
          valor: '-7, 9'
          tolerancia: 0.001
          formato: los valores separados por comas
        distractores:
          - valor: '-7'
            mensaje: |
              El $-7$ está bien: es donde $a+8=1$. Falta el otro, que sale de
              $a-8=1$.
          - valor: '7, -9'
            mensaje: |
              Los signos al revés. De $a+8=1$ sale $a=1-8=-7$, y de $a-8=1$
              sale $a=1+8=9$.
          - valor: '8, -8'
            mensaje: |
              Esos son los valores donde el determinante se anula, o sea donde
              uno de los autovalores vale $0$. Que un autovalor sea cero no lo
              repite.
        pista: |
          $a+8$ y $a-8$ nunca coinciden entre sí. Iguala cada uno al $1$.
        desarrollo: |
          $a+8=a-8$ es imposible, así que las únicas coincidencias posibles son
          con el $1$:

          | ecuación | valor de $a$ | autovalores |
          |---|---|---|
          | $a+8=1$ | $a=-7$ | $1$, $1$, $-15$ |
          | $a-8=1$ | $a=9$ | $1$, $17$, $1$ |

          Para cualquier otro $a$ hay **tres autovalores distintos**, y eso ya
          garantiza la diagonalización sin calcular nada más.

      - tipo: calcular
        titulo: La multiplicidad geométrica en el caso conflictivo
        pregunta: |
          Para $a=-7$, el autovalor $1$ es doble. ¿Cuánto vale
          $\dim\operatorname{Ker}\left(A-I\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es lo que **haría falta** para que diagonalizase, y no se
              alcanza: $A-I$ vale
              $\begin{pmatrix}0&-2&-2\\-2&-8&8\\2&8&-8\end{pmatrix}$, cuya
              tercera fila es la opuesta de la segunda. Rango $2$, núcleo de
              dimensión $1$.
          - valor: '3'
            mensaje: |
              $3$ exigiría $A=I$. Y la multiplicidad geométrica nunca supera a
              la algebraica, que aquí vale $2$.
          - valor: '0'
            mensaje: |
              Si fuese $0$, el $1$ no sería autovalor. Y lo es para todo $a$.
        pista: |
          Escribe $A-I$ con $a=-7$ y mira la relación entre la segunda y la
          tercera fila.
        desarrollo: |
          $$
          A-I=\begin{pmatrix}0&-2&-2\\-2&-8&8\\2&8&-8\end{pmatrix}
          $$

          La tercera fila es la opuesta de la segunda, y la primera no es
          proporcional a ninguna: el rango vale $2$, así que

          $$
          \dim\operatorname{Ker}\left(A-I\right)=3-2=1<2
          $$

          Falta una dirección propia y **$A$ no diagonaliza** en $a=-7$. Con
          $a=9$ pasa lo mismo:
          $A-I=\begin{pmatrix}0&-2&-2\\-2&8&8\\2&8&8\end{pmatrix}$ tiene
          también rango $2$.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración del apartado a): el polinomio característico
          no cambia al cambiar de base. Una pieza es falsa.
        piezas:
          - texto: >-
              Dos matrices del mismo endomorfismo en bases distintas son
              semejantes: $A'=P^{-1}AP$, con $P$ la matriz de cambio.
          - texto: >-
              Entonces
              $A'-\lambda I=P^{-1}AP-\lambda P^{-1}P
              =P^{-1}\left(A-\lambda I\right)P$.
          - texto: >-
              Tomando determinantes y usando que es multiplicativo,
              $\det\left(A'-\lambda I\right)
              =\det\left(P^{-1}\right)\det\left(A-\lambda I\right)\det P$.
          - texto: >-
              Y como
              $\det\left(P^{-1}\right)\det P=1$, los dos polinomios
              característicos coinciden.
          - texto: >-
              Por tanto dos matrices con el mismo polinomio característico son
              siempre semejantes.
            trampa: true
            mensaje: |
              Es el recíproco, y es falso. La implicación demostrada va en un
              solo sentido: semejantes ⟹ mismo polinomio. Al revés no: en la
              ordinaria de este mismo curso 2022-2023 hay dos matrices con
              idéntico polinomio característico de las que **una diagonaliza y
              la otra no**, así que no pueden ser semejantes entre sí.
    resolucion: |
      **a) La invariancia del polinomio característico.** Dos matrices del
      mismo endomorfismo en bases distintas son semejantes,
      $A'=P^{-1}AP$. La clave está en meter también el $\lambda I$ dentro del
      sándwich:

      $$
      A'-\lambda I=P^{-1}AP-\lambda P^{-1}P
      =P^{-1}\left(A-\lambda I\right)P
      $$

      Y tomando determinantes, que son multiplicativos:

      $$
      \det\left(A'-\lambda I\right)
      =\frac{1}{\det P}\det\left(A-\lambda I\right)\det P
      =\det\left(A-\lambda I\right)
      $$

      La consecuencia es la que importa: **los autovalores son del
      endomorfismo, no de la matriz**. Cambiar de base cambia los números de
      la tabla, no lo que la aplicación hace.

      **b) El polinomio, factorizado.** Traza $1+2a$, suma de menores
      principales $a^{2}+2a-64$ y determinante $a^{2}-64$ dan

      $$
      p\left(\lambda\right)=-\left(\lambda-1\right)
      \left(\lambda-a-8\right)\left(\lambda-a+8\right)
      $$

      $$
      \text{autovalores: }\quad 1,\quad a+8,\quad a-8
      $$

      Que el $1$ salga fijo es lo que hace tratable el ejercicio: solo hay dos
      formas de que haya repetición, y las dos son ecuaciones de primer grado.

      **Los dos casos conflictivos.**

      | $a$ | autovalores | $A-I$ | rango | $\dim\operatorname{Ker}$ | ¿diagonaliza? |
      |---|---|---|---|---|---|
      | $-7$ | $1$, $1$, $-15$ | 3.ª fila $=-$ 2.ª | $2$ | $1$ | **no** |
      | $9$ | $1$, $17$, $1$ | rango $2$ | $2$ | $1$ | **no** |

      En los dos, la multiplicidad algebraica del $1$ vale $2$ y la geométrica
      solo $1$: falta una dirección propia.

      $$
      \boxed{\;A\text{ es diagonalizable si y solo si }
      a\neq-7\text{ y }a\neq9\;}
      $$

      **Y conviene fijarse en el orden del razonamiento**, porque es lo que
      hace corto un ejercicio con parámetro: primero se factoriza el polinomio,
      después se buscan las coincidencias, y **solo en esos pocos casos** se
      calculan rangos. Ir al revés —calcular
      $\operatorname{rg}\left(A-\lambda I\right)$ con $a$ dentro— es un cálculo
      con parámetro mucho más caro y mucho más fácil de equivocar.
