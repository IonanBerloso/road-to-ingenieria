ejercicios:
  - id: exalg2223-ord-1-la-suma-la-interseccion-y-una-base-nueva
    titulo: La suma se ve, la intersección hay que buscarla
    fuente: >-
      Ejercicio 1 · Convocatoria ordinaria, curso 2022-2023 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) Sea el espacio vectorial $V$ y
      $\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$ una
      familia libre. Siendo
      $S_{1}=L\left(\left\{\overline{v}_{1},
      \overline{v}_{2}+\overline{v}_{3}\right\}\right)$ y
      $S_{2}=L\left(\left\{\overline{v}_{2},\overline{v}_{3}\right\}\right)$,
      hallar una base y la dimensión de los subespacios $S_{1}+S_{2}$ y
      $S_{1}\cap S_{2}$.

      b) Sea $V$ un espacio vectorial,
      $B=\left\{\overline{u}_{1},\overline{u}_{2},
      \overline{u}_{3},\overline{u}_{4}\right\}$ una base de $V$, y

      $$
      \overline{v}_{1}=\overline{u}_{1}+\overline{u}_{2}+\overline{u}_{3},
      \quad
      \overline{v}_{2}=-\overline{u}_{2},
      \quad
      \overline{v}_{3}=\overline{u}_{1}-\overline{u}_{4},
      \quad
      \overline{v}_{4}=\overline{u}_{1}+\overline{u}_{3}+\overline{u}_{4}
      $$

      i. Demostrar que
      $B'=\left\{\overline{v}_{1},\overline{v}_{2},
      \overline{v}_{3},\overline{v}_{4}\right\}$ es otra base de $V$ y dar la
      matriz de cambio de base.

      ii. Hallar las coordenadas del vector
      $\overline{x}=\overline{u}_{1}+2\overline{u}_{2}-\overline{u}_{3}$ en la
      base $B'$.

      iii. Si las coordenadas de un vector $\overline{v}$ en la base $B'$ son
      $\left(1,-3,0,1\right)$, ¿cuáles son sus coordenadas en la base $B$?
    pide: Bases y dimensiones de la suma y la intersección, y dos cambios de base.

    pasos:
      - tipo: reconocer
        pregunta: |
          $S_{1}$ tiene dimensión $2$ y $S_{2}$ también. ¿Se puede concluir ya
          que $S_{1}+S_{2}$ tiene dimensión $4$?
        opciones:
          - texto: >-
              No: la suma de dimensiones solo vale si la suma es **directa**, y
              aquí los dos subespacios se cortan
            correcta: true
            mensaje: |
              Eso es. La fórmula que siempre vale es la de Grassmann,
              $\dim\left(S_{1}+S_{2}\right)=\dim S_{1}+\dim S_{2}
              -\dim\left(S_{1}\cap S_{2}\right)$, y el término que se resta es
              justo el que hay que calcular.
          - texto: >-
              Sí, porque los cuatro generadores son cuatro vectores distintos
            mensaje: |
              Ser distintos no es ser independientes. Aquí
              $\overline{v}_{2}+\overline{v}_{3}$ es combinación de
              $\overline{v}_{2}$ y $\overline{v}_{3}$, así que de los cuatro
              generadores sobra uno.
          - texto: >-
              Sí, porque la familia de partida es libre
            mensaje: |
              La familia libre es
              $\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$,
              tres vectores. Todo lo que se genera con ellos vive dentro de un
              espacio de dimensión $3$, así que $4$ es imposible de entrada.
          - texto: >-
              No se puede saber sin conocer $V$
            mensaje: |
              $V$ puede ser todo lo grande que quiera: la dimensión de
              $S_{1}+S_{2}$ solo depende de los generadores que se dan, y esos
              están escritos.

      - tipo: calcular
        titulo: La dimensión de la intersección
        pregunta: |
          ¿Cuánto vale $\dim\left(S_{1}\cap S_{2}\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              $0$ sería si la suma fuese directa, y no lo es:
              $\overline{v}_{2}+\overline{v}_{3}$ está en $S_{1}$ **por
              definición** y está en $S_{2}$ por ser combinación de
              $\overline{v}_{2}$ y $\overline{v}_{3}$. Un vector no nulo en los
              dos basta para que la intersección no sea trivial.
          - valor: '2'
            mensaje: |
              $2$ significaría $S_{1}=S_{2}$, y no lo son:
              $\overline{v}_{1}$ está en $S_{1}$ y no en $S_{2}$, porque la
              familia de partida es libre.
          - valor: '3'
            mensaje: |
              $3$ es la dimensión de $S_{1}+S_{2}$, no la de la intersección.
              La intersección es siempre **más pequeña** que cualquiera de los
              dos, y $S_{1}$ solo tiene dimensión $2$.
        pista: |
          Un vector de $S_{1}$ se escribe
          $a\overline{v}_{1}+b\left(\overline{v}_{2}+\overline{v}_{3}\right)$ y
          uno de $S_{2}$ se escribe
          $c\overline{v}_{2}+d\overline{v}_{3}$. Iguala y usa que
          $\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$ es
          libre.
        desarrollo: |
          Un vector de la intersección admite las dos escrituras a la vez:

          $$
          a\overline{v}_{1}+b\overline{v}_{2}+b\overline{v}_{3}
          =c\overline{v}_{2}+d\overline{v}_{3}
          $$

          Como la familia es libre, se pueden igualar coeficiente a coeficiente:
          $a=0$, $b=c$ y $b=d$. O sea que el vector es
          $b\left(\overline{v}_{2}+\overline{v}_{3}\right)$, y

          $$
          S_{1}\cap S_{2}
          =L\left(\left\{\overline{v}_{2}+\overline{v}_{3}\right\}\right),
          \qquad
          \dim\left(S_{1}\cap S_{2}\right)=1
          $$

          Grassmann lo confirma: $2+2-1=3=\dim\left(S_{1}+S_{2}\right)$.

      - tipo: calcular
        titulo: Las coordenadas de x en la base nueva
        pregunta: |
          Las coordenadas de
          $\overline{x}=\overline{u}_{1}+2\overline{u}_{2}-\overline{u}_{3}$ en
          la base $B'$, en el orden
          $\left(\overline{v}_{1},\overline{v}_{2},
          \overline{v}_{3},\overline{v}_{4}\right)$.
        respuesta:
          tipo: vector
          valor: '(-3, -5, 2, 2)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(1, 2, -1, 0)'
            mensaje: |
              Esas son las coordenadas de $\overline{x}$ en la base $B$, que es
              el dato de partida. Lo que se pide es reescribirlo en $B'$, y
              para eso hay que resolver un sistema.
          - valor: '(3, 5, -2, -2)'
            mensaje: |
              Los cuatro signos cambiados. Suele salir de resolver
              $P\overline{y}=\overline{x}$ y despejar con el signo al revés en
              la última sustitución. Comprueba con
              $-3\overline{v}_{1}-5\overline{v}_{2}
              +2\overline{v}_{3}+2\overline{v}_{4}$: tiene que dar
              $\overline{x}$.
          - valor: '(-3, -5, 2, -2)'
            mensaje: |
              La cuarta coordenada. De la última ecuación sale
              $-y_{3}+y_{4}=0$, es decir $y_{4}=y_{3}$: las dos valen $2$, con
              el mismo signo.
        pista: |
          Monta la matriz $P$ que tiene por columnas las coordenadas de
          $\overline{v}_{1},\dots,\overline{v}_{4}$ en $B$ y resuelve
          $P\overline{y}=\left(1,2,-1,0\right)$.
        desarrollo: |
          La matriz de cambio de $B'$ a $B$ lleva por columnas las coordenadas
          de cada $\overline{v}_{i}$ en $B$:

          $$
          P=\begin{pmatrix}
          1&0&1&1\\
          1&-1&0&0\\
          1&0&0&1\\
          0&0&-1&1
          \end{pmatrix}
          $$

          y el sistema $P\overline{y}=\left(1,2,-1,0\right)$ se resuelve de
          abajo arriba: la cuarta fila da $y_{4}=y_{3}$, la tercera da
          $y_{1}=-1-y_{4}$, la primera da $y_{3}=2$ y la segunda
          $y_{2}=y_{1}-2$.

          $$
          \boxed{\;\overline{x}\big|_{B'}=\left(-3,-5,2,2\right)\;}
          $$

          Comprobación, que aquí es barata:
          $-3\overline{v}_{1}-5\overline{v}_{2}+2\overline{v}_{3}
          +2\overline{v}_{4}
          =\overline{u}_{1}+2\overline{u}_{2}-\overline{u}_{3}$.

      - tipo: calcular
        titulo: Y el camino de vuelta
        pregunta: |
          Si las coordenadas de $\overline{v}$ en $B'$ son
          $\left(1,-3,0,1\right)$, ¿cuáles son sus coordenadas en $B$?
        respuesta:
          tipo: vector
          valor: '(2, 4, 2, 1)'
          tolerancia: 0.001
          formato: cuatro coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(1, -3, 0, 1)'
            mensaje: |
              Esas son las de partida, en $B'$. La pregunta pide las de $B$, y
              para pasar de $B'$ a $B$ **se multiplica por $P$**: es el sentido
              fácil, sin resolver ningún sistema.
          - valor: '(2, -2, 2, 1)'
            mensaje: |
              La segunda coordenada. El $\overline{v}_{2}=-\overline{u}_{2}$
              lleva un signo menos dentro, así que $-3\overline{v}_{2}$ aporta
              $+3\overline{u}_{2}$, no $-3$. Sumado al $\overline{u}_{2}$ de
              $\overline{v}_{1}$, sale $4$.
          - valor: '(-3, -5, 2, 2)'
            mensaje: |
              Ese es el resultado del apartado anterior, que va en el sentido
              contrario. Aquí no hay sistema que resolver: basta multiplicar.
        pista: |
          Este sentido es el cómodo: $\overline{v}\big|_{B}=P\,
          \overline{v}\big|_{B'}$.
        desarrollo: |
          $$
          \overline{v}\big|_{B}
          =P\begin{pmatrix}1\\-3\\0\\1\end{pmatrix}
          =\begin{pmatrix}2\\4\\2\\1\end{pmatrix}
          $$

          Y sin matriz, escribiéndolo a mano, sale lo mismo:

          $$
          \overline{v}=\overline{v}_{1}-3\overline{v}_{2}+\overline{v}_{4}
          =\left(\overline{u}_{1}+\overline{u}_{2}+\overline{u}_{3}\right)
          +3\overline{u}_{2}
          +\left(\overline{u}_{1}+\overline{u}_{3}+\overline{u}_{4}\right)
          =2\overline{u}_{1}+4\overline{u}_{2}+2\overline{u}_{3}
          +\overline{u}_{4}
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo de la intersección. Una pieza es falsa.
        piezas:
          - texto: >-
              Un vector de $S_{1}\cap S_{2}$ se escribe de las dos maneras:
              $a\overline{v}_{1}+b\left(\overline{v}_{2}
              +\overline{v}_{3}\right)$ y $c\overline{v}_{2}+d\overline{v}_{3}$.
          - texto: >-
              Al igualar y usar que
              $\left\{\overline{v}_{1},\overline{v}_{2},\overline{v}_{3}\right\}$
              es libre, los coeficientes se pueden comparar uno a uno.
          - texto: >-
              De $\overline{v}_{1}$ sale $a=0$, y de los otros dos, $b=c$ y
              $b=d$.
          - texto: >-
              Luego la intersección es
              $L\left(\left\{\overline{v}_{2}+\overline{v}_{3}\right\}\right)$,
              de dimensión $1$.
          - texto: >-
              Y como la intersección no es nula, $S_{1}$ y $S_{2}$ son el mismo
              subespacio.
            trampa: true
            mensaje: |
              Que dos subespacios se corten en algo no nulo no los hace
              iguales: aquí se cortan en una recta y cada uno es un plano
              distinto dentro de un espacio de dimensión $3$. La igualdad
              exigiría que la intersección tuviera dimensión $2$, la de los
              dos. El error de fondo es confundir «se cortan» con «coinciden»,
              y es el mismo que lleva a decir que la suma es directa en cuanto
              los generadores parecen distintos.
    resolucion: |
      **a) La suma se lee de un vistazo.** $S_{1}+S_{2}$ está generado por los
      cuatro generadores juntos:

      $$
      S_{1}+S_{2}=L\left(\left\{\overline{v}_{1},
      \overline{v}_{2}+\overline{v}_{3},\overline{v}_{2},
      \overline{v}_{3}\right\}\right)
      $$

      y ahí sobra $\overline{v}_{2}+\overline{v}_{3}$, que es la suma de los dos
      últimos. Queda
      $S_{1}+S_{2}=L\left(\left\{\overline{v}_{1},\overline{v}_{2},
      \overline{v}_{3}\right\}\right)$, que es base porque la familia es libre:

      $$
      \boxed{\;\dim\left(S_{1}+S_{2}\right)=3,\quad
      \text{base }\left\{\overline{v}_{1},\overline{v}_{2},
      \overline{v}_{3}\right\}\;}
      $$

      **La intersección hay que buscarla.** Un vector que esté en los dos admite
      las dos escrituras a la vez, y la independencia permite comparar
      coeficientes: $a=0$, $b=c$, $b=d$. Es decir, todo vector de la
      intersección es múltiplo de $\overline{v}_{2}+\overline{v}_{3}$:

      $$
      \boxed{\;S_{1}\cap S_{2}
      =L\left(\left\{\overline{v}_{2}+\overline{v}_{3}\right\}\right),\quad
      \dim=1\;}
      $$

      Y Grassmann cuadra: $2+2-1=3$. Conviene hacer esta comprobación siempre,
      porque es gratis y caza el error de haber perdido una dimensión.

      **b) La matriz de cambio.** Sus columnas son las coordenadas de los
      $\overline{v}_{i}$ en $B$:

      $$
      P=\begin{pmatrix}
      1&0&1&1\\
      1&-1&0&0\\
      1&0&0&1\\
      0&0&-1&1
      \end{pmatrix},
      \qquad
      \det P=1\neq0
      $$

      El determinante no nulo **es** la demostración de que $B'$ es base: cuatro
      vectores independientes en un espacio de dimensión $4$.

      **i y ii, que van en sentidos contrarios.** Y esto es lo que más se falla
      del ejercicio, así que va dicho aparte:

      | de dónde a dónde | qué se hace |
      |---|---|
      | de $B'$ a $B$ | multiplicar por $P$ |
      | de $B$ a $B'$ | resolver $P\overline{y}=\overline{x}$ |

      Para $\overline{x}=\left(1,2,-1,0\right)$ en $B$ hay que resolver el
      sistema, y sale
      $\overline{x}\big|_{B'}=\left(-3,-5,2,2\right)$. Para
      $\overline{v}=\left(1,-3,0,1\right)$ en $B'$ basta multiplicar, y sale
      $\overline{v}\big|_{B}=\left(2,4,2,1\right)$.

      La comprobación de las dos es la misma y no cuesta nada: se sustituye y
      se mira si sale el vector de partida.

  - id: exalg2223-ord-2-el-nucleo-dado-y-la-matriz-que-sale-de-el
    titulo: Cuando el núcleo es el tercer dato
    fuente: >-
      Ejercicio 2 · Convocatoria ordinaria, curso 2022-2023 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) Sea $f:V\rightarrow V'$ una aplicación lineal. Definir
      $\operatorname{Ker}\left(f\right)$ y demostrar que es subespacio
      vectorial de $V$.

      b) Sea $f:\mathbb{R}^{3}\longrightarrow\mathbb{R}^{3}$ una aplicación
      lineal tal que $f\left(0,1,0\right)=\left(0,1,1\right)$,
      $f\left(1,0,1\right)=\left(1,0,1\right)$ y

      $$
      \operatorname{Ker}\left(f\right)
      =\left\{\left(x,y,z\right)\in\mathbb{R}^{3}\;/\;x=y,\;z=0\right\}
      $$

      i. Calcular la matriz asociada a la aplicación lineal.

      ii. Calcular bases y dimensiones de $\operatorname{Im}\left(f\right)$ y
      $\operatorname{Ker}\left(f\right)$. Clasificar la aplicación.
    pide: La definición y la demostración, la matriz asociada, y las dos bases.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da dos imágenes y un núcleo. ¿Por qué eso basta para
          determinar $f$ del todo?
        opciones:
          - texto: >-
              Porque el núcleo aporta un vector más con imagen conocida —la
              nula—, y los tres forman base de $\mathbb{R}^{3}$
            correcta: true
            mensaje: |
              Exacto. El núcleo es la recta generada por
              $\left(1,1,0\right)$, así que
              $f\left(1,1,0\right)=\overline{0}$ es el tercer dato. Y
              $\left(0,1,0\right)$, $\left(1,0,1\right)$ y $\left(1,1,0\right)$
              son independientes: una aplicación lineal queda determinada por
              lo que hace sobre una base.
          - texto: >-
              Porque dos vectores bastan siempre para determinar una aplicación
              lineal
            mensaje: |
              Con dos vectores solo se sabe qué hace $f$ en el plano que
              generan. Fuera de ese plano podría hacer cualquier cosa: harían
              falta tantos datos como dimensión tiene el espacio de partida.
          - texto: >-
              Porque el núcleo determina la aplicación por sí solo
            mensaje: |
              El núcleo dice qué se va a cero, no qué pasa con lo demás.
              Infinitas aplicaciones comparten núcleo: multiplicar $f$ por $2$
              no cambia el núcleo y sí cambia la aplicación.
          - texto: >-
              Porque la matriz es cuadrada y eso fija los coeficientes
            mensaje: |
              Que sea cuadrada solo dice que sale y llega al mismo espacio. Los
              nueve coeficientes hay que sacarlos de los datos, y son
              exactamente los tres del enunciado.

      - tipo: calcular
        titulo: La imagen del primer vector de la base canónica
        pregunta: |
          De $f\left(1,1,0\right)=\overline{0}$ y
          $f\left(0,1,0\right)=\left(0,1,1\right)$, ¿cuánto vale
          $f\left(1,0,0\right)$?
        respuesta:
          tipo: vector
          valor: '(0, -1, -1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(0, 1, 1)'
            mensaje: |
              Ese es $f\left(0,1,0\right)$, no $f\left(1,0,0\right)$. De
              $f\left(1,0,0\right)+f\left(0,1,0\right)=\overline{0}$ sale que
              uno es **el opuesto** del otro.
          - valor: '(0, 0, 0)'
            mensaje: |
              El que va a cero es $\left(1,1,0\right)$, que genera el núcleo.
              $\left(1,0,0\right)$ no está en el núcleo: no cumple $x=y$.
          - valor: '(1, 0, 1)'
            mensaje: |
              Ese es $f\left(1,0,1\right)$, un dato del enunciado. Para llegar
              a $f\left(1,0,0\right)$ hay que restarle $f\left(0,0,1\right)$, y
              esa se obtiene después.
        pista: |
          $\left(1,1,0\right)=\left(1,0,0\right)+\left(0,1,0\right)$, y $f$ es
          lineal.
        desarrollo: |
          El núcleo es la recta
          $\left\{\left(x,x,0\right)\right\}=L\left(\left\{\left(1,1,0\right)
          \right\}\right)$, luego $f\left(1,1,0\right)=\overline{0}$. Por
          linealidad:

          $$
          f\left(1,0,0\right)+f\left(0,1,0\right)=\overline{0}
          \;\Longrightarrow\;
          f\left(1,0,0\right)=-\left(0,1,1\right)=\left(0,-1,-1\right)
          $$

      - tipo: calcular
        titulo: La matriz asociada, entera
        pregunta: |
          La matriz de $f$ en la base canónica. Escribe las filas separadas por
          punto y coma.
        respuesta:
          tipo: matriz
          valor: '[0, 0, 1; -1, 1, 1; -1, 1, 2]'
          tolerancia: 0.001
          formato: tres filas de tres números, con punto y coma entre filas
        distractores:
          - valor: '[0, -1, -1; 0, 1, 1; 1, 1, 2]'
            mensaje: |
              Esa es la **traspuesta**: has puesto las imágenes por filas. En la
              matriz asociada las imágenes de la base van por **columnas**,
              porque así $A\overline{x}$ reproduce
              $f\left(\overline{x}\right)$.
          - valor: '[0, 0, 1; 1, 1, 1; 1, 1, 2]'
            mensaje: |
              La primera columna es $f\left(1,0,0\right)=\left(0,-1,-1\right)$,
              con los dos signos negativos. Sale de
              $f\left(1,0,0\right)=-f\left(0,1,0\right)$.
          - valor: '[0, 0, 1; -1, 1, 0; -1, 1, 1]'
            mensaje: |
              La tercera columna es
              $f\left(0,0,1\right)=f\left(1,0,1\right)-f\left(1,0,0\right)
              =\left(1,0,1\right)-\left(0,-1,-1\right)=\left(1,1,2\right)$. Se
              te ha quedado la resta a medias.
        pista: |
          Las columnas son $f\left(1,0,0\right)$, $f\left(0,1,0\right)$ y
          $f\left(0,0,1\right)$, en ese orden. Las dos primeras ya están.
        desarrollo: |
          Falta la tercera columna, y sale de la resta:

          $$
          f\left(0,0,1\right)=f\left(1,0,1\right)-f\left(1,0,0\right)
          =\left(1,0,1\right)-\left(0,-1,-1\right)=\left(1,1,2\right)
          $$

          Poniendo las tres imágenes por columnas:

          $$
          A=\begin{pmatrix}
          0&0&1\\
          -1&1&1\\
          -1&1&2
          \end{pmatrix}
          $$

          Y hay que comprobarla contra los tres datos, que es lo que separa una
          matriz buena de una plausible:

          | vector | $A\overline{v}$ | lo que pedía el enunciado |
          |---|---|---|
          | $\left(1,1,0\right)$ | $\left(0,0,0\right)$ | está en el núcleo |
          | $\left(0,1,0\right)$ | $\left(0,1,1\right)$ | dato |
          | $\left(1,0,1\right)$ | $\left(1,0,1\right)$ | dato |

      - tipo: calcular
        titulo: La dimensión de la imagen
        pregunta: |
          ¿Cuánto vale $\dim\operatorname{Im}\left(f\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              $3$ significaría que $f$ es sobreyectiva y, siendo un
              endomorfismo, también inyectiva —o sea, núcleo nulo—. Pero el
              enunciado da un núcleo de dimensión $1$. La fórmula de las
              dimensiones no deja: $\dim\operatorname{Im}=3-1=2$.
          - valor: '1'
            mensaje: |
              $1$ es la dimensión del **núcleo**. La suma de las dos tiene que
              dar $3$, la dimensión del espacio de partida.
        pista: |
          $\dim\operatorname{Ker}+\dim\operatorname{Im}=\dim\mathbb{R}^{3}$, y
          el núcleo lo da el enunciado.
        desarrollo: |
          El núcleo es una recta, así que $\dim\operatorname{Ker}=1$ y

          $$
          \dim\operatorname{Im}\left(f\right)=3-1=2
          $$

          Se ve también en las columnas de $A$: la primera es la opuesta de la
          segunda, así que solo dos son independientes. Una base es
          $\left\{\left(0,1,1\right),\left(1,1,2\right)\right\}$.

      - tipo: justificar
        pregunta: Ordena la clasificación de f. Una pieza es falsa.
        piezas:
          - texto: >-
              $\operatorname{Ker}\left(f\right)$ es la recta generada por
              $\left(1,1,0\right)$, así que tiene dimensión $1$.
          - texto: >-
              Como el núcleo no es $\left\{\overline{0}\right\}$, $f$ **no** es
              inyectiva.
          - texto: >-
              Por la fórmula de las dimensiones,
              $\dim\operatorname{Im}\left(f\right)=3-1=2<3$, así que $f$
              tampoco es sobreyectiva.
          - texto: >-
              Luego $f$ es un endomorfismo que no es ni inyectivo ni
              sobreyectivo, y en particular no es automorfismo.
          - texto: >-
              De hecho, como la matriz es cuadrada, $f$ sería biyectiva si el
              enunciado no hubiera fijado el núcleo.
            trampa: true
            mensaje: |
              Que la matriz sea cuadrada no da la biyectividad: la da que su
              determinante sea no nulo. Aquí $\det A=0$ —la primera columna es
              la opuesta de la segunda— y por eso no es biyectiva. La pieza
              además insinúa que el núcleo es una imposición externa, y no lo
              es: el núcleo **sale** de la aplicación, y el enunciado se limita
              a decírtelo para ahorrarte calcularlo.
    resolucion: |
      **a) El núcleo, y por qué es subespacio.**
      $\operatorname{Ker}\left(f\right)=\left\{\overline{x}\in V\;/\;
      f\left(\overline{x}\right)=\overline{0}\right\}$.

      Es subespacio porque contiene al $\overline{0}$ —toda aplicación lineal
      cumple $f\left(\overline{0}\right)=\overline{0}$, así que no es vacío— y
      porque es cerrado para la combinación lineal: si
      $f\left(\overline{x}\right)=f\left(\overline{y}\right)=\overline{0}$,
      entonces

      $$
      f\left(\alpha\overline{x}+\beta\overline{y}\right)
      =\alpha f\left(\overline{x}\right)+\beta f\left(\overline{y}\right)
      =\alpha\overline{0}+\beta\overline{0}=\overline{0}
      $$

      y por tanto $\alpha\overline{x}+\beta\overline{y}$ vuelve a estar en el
      núcleo. Toda la demostración es **una sola línea**, la de la linealidad;
      lo demás es decir qué se está comprobando.

      **b) El núcleo es el tercer dato.** Esta es la idea del ejercicio y
      conviene aislarla: el enunciado parece dar dos imágenes, pero da tres. El
      núcleo, escrito con $x=y$ y $z=0$, es la recta generada por
      $\left(1,1,0\right)$, y eso significa
      $f\left(1,1,0\right)=\overline{0}$.

      Los tres vectores $\left(0,1,0\right)$, $\left(1,0,1\right)$ y
      $\left(1,1,0\right)$ son independientes —su determinante vale $1$—, así
      que forman base de $\mathbb{R}^{3}$ y $f$ queda determinada.

      **La matriz.** Se despejan las imágenes de la base canónica una a una:

      $$
      f\left(0,1,0\right)=\left(0,1,1\right),
      \qquad
      f\left(1,0,0\right)=-f\left(0,1,0\right)=\left(0,-1,-1\right)
      $$

      $$
      f\left(0,0,1\right)=f\left(1,0,1\right)-f\left(1,0,0\right)
      =\left(1,1,2\right)
      $$

      $$
      \boxed{\;A=\begin{pmatrix}0&0&1\\-1&1&1\\-1&1&2\end{pmatrix}\;}
      $$

      **Bases y clasificación.**

      $$
      \operatorname{Ker}\left(f\right)
      =L\left(\left\{\left(1,1,0\right)\right\}\right),\quad\dim=1
      $$

      $$
      \operatorname{Im}\left(f\right)
      =L\left(\left\{\left(0,1,1\right),\left(1,1,2\right)\right\}\right),
      \quad\dim=2
      $$

      La imagen está generada por las columnas de $A$, y de las tres solo dos
      son independientes porque la primera es la opuesta de la segunda.

      Con esto, $f$ **no es inyectiva** —el núcleo no es nulo— ni
      **sobreyectiva** —la imagen no llena $\mathbb{R}^{3}$—. En un
      endomorfismo las dos cosas van siempre juntas: si falla una, falla la
      otra.

  - id: exalg2223-ord-3-determinantes-de-memoria-y-una-base-ortonormal
    titulo: Cinco determinantes sin calcular ninguno
    fuente: >-
      Ejercicio 3 · Convocatoria ordinaria, curso 2022-2023 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) i. Sean $A,B\in\mathcal{M}_{3\times3}\left(\mathbb{R}\right)$ tales
      que $\left|A\right|=10$ y $\left|B\right|=12$. Calcular:
      $\left|AB\right|$, $\left|A^{T}\right|$, $\left|2B\right|$,
      $\left|A^{4}\right|$ y $\left|B^{-1}\right|$.

      ii. Demostrar las siguientes propiedades:

      ii.a) Sean $A$ y $B$ matrices invertibles. Entonces
      $\left(AB\right)^{-1}=B^{-1}A^{-1}$.

      ii.b) Sean $A$ y $B$ matrices invertibles y conmutativas, es decir,
      $AB=BA$. Entonces $A^{-1}$ y $B$ son conmutativas, y $A^{-1}$ y $B^{-1}$
      también.

      b) Sea el subespacio de $\mathbb{R}^{3}$
      $U=L\left(\left\{\left(1,2,2\right),
      \left(-1,0,2\right)\right\}\right)$.

      i. Encontrar una base ortonormal de $U$.

      ii. Completando la base calculada en el apartado anterior, encontrar una
      base ortonormal de $\mathbb{R}^{3}$.
    pide: Los cinco determinantes, las dos demostraciones, y las dos bases ortonormales.

    pasos:
      - tipo: reconocer
        pregunta: |
          De los cinco determinantes que se piden, ¿cuál es el único que
          depende del **tamaño** de la matriz y no solo de su determinante?
        opciones:
          - texto: >-
              $\left|2B\right|$, porque sacar el $2$ de cada una de las tres
              filas da $2^{3}$
            correcta: true
            mensaje: |
              Eso es, y es el que más se falla. El determinante es lineal en
              **cada fila por separado**, así que multiplicar la matriz entera
              por $2$ multiplica el determinante por $2^{n}$, con $n$ el orden.
              Aquí $n=3$, luego $\left|2B\right|=8\cdot12=96$.
          - texto: >-
              $\left|A^{4}\right|$, porque el exponente cambia con el orden
            mensaje: |
              $\left|A^{4}\right|=\left|A\right|^{4}$ y el orden de la matriz no
              interviene: sale de aplicar cuatro veces
              $\left|AB\right|=\left|A\right|\left|B\right|$.
          - texto: >-
              $\left|A^{T}\right|$, porque trasponer reordena las filas
            mensaje: |
              Trasponer no cambia el determinante en ningún orden:
              $\left|A^{T}\right|=\left|A\right|=10$. Es una de las propiedades
              más útiles, porque permite hacer con columnas todo lo que se hace
              con filas.
          - texto: >-
              $\left|B^{-1}\right|$, porque invertir depende de la dimensión
            mensaje: |
              $\left|B^{-1}\right|=1/\left|B\right|$ sea cual sea el orden. Sale
              de $BB^{-1}=I$ y de que $\left|I\right|=1$.

      - tipo: calcular
        titulo: El determinante de 2B
        pregunta: |
          Con $\left|B\right|=12$ y $B$ de orden $3\times3$, ¿cuánto vale
          $\left|2B\right|$?
        respuesta:
          tipo: numero
          valor: '96'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '24'
            mensaje: |
              $24$ es $2\cdot12$: has sacado el $2$ una sola vez. El
              determinante es lineal en cada fila por separado, y aquí hay
              **tres** filas multiplicadas por $2$.
          - valor: '144'
            mensaje: |
              $144$ es $12^{2}$, que no pinta nada aquí. El factor que sale
              fuera es $2^{3}$, y multiplica —no eleva— al determinante.
          - valor: '72'
            mensaje: |
              $72$ sale de $6\cdot12$, como si el factor fuese
              $2\cdot3$ en vez de $2^{3}$. El exponente es el orden de la
              matriz, no un producto.
        pista: |
          Saca el $2$ de la primera fila, luego de la segunda, luego de la
          tercera. ¿Cuántos $2$ han salido?
        desarrollo: |
          $$
          \left|2B\right|=2^{3}\left|B\right|=8\cdot12=96
          $$

          En general, para una matriz de orden $n$,
          $\left|\lambda B\right|=\lambda^{n}\left|B\right|$. Los otros cuatro
          salen de propiedades directas:

          | pedido | propiedad | valor |
          |---|---|---|
          | $\lvert AB\rvert$ | $\lvert A\rvert\lvert B\rvert$ | $120$ |
          | $\lvert A^{T}\rvert$ | $=\lvert A\rvert$ | $10$ |
          | $\lvert A^{4}\rvert$ | $\lvert A\rvert^{4}$ | $10\,000$ |
          | $\lvert B^{-1}\rvert$ | $1/\lvert B\rvert$ | $1/12$ |

      - tipo: calcular
        titulo: El segundo vector de la base ortonormal de U
        pregunta: |
          Aplicando Gram-Schmidt a
          $\left\{\left(1,2,2\right),\left(-1,0,2\right)\right\}$ en ese orden y
          normalizando, ¿cuál es el segundo vector?
        respuesta:
          tipo: vector
          valor: '(-2/3, -1/3, 2/3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen fracciones
        distractores:
          - valor: '(-1, 0, 2)'
            mensaje: |
              Ese es el vector de partida, sin ortogonalizar ni normalizar. Su
              producto escalar con $\left(1,2,2\right)$ vale $3$, así que no es
              perpendicular al primero.
          - valor: '(1/3, 2/3, 2/3)'
            mensaje: |
              Ese es el **primero** de la base, $\overline{u}_{1}$. El segundo
              tiene que ser perpendicular a él.
          - valor: '(-4/3, -2/3, 4/3)'
            mensaje: |
              Esa es la dirección correcta, pero sin normalizar: su norma vale
              $2$. Divídelo por $2$ y sale
              $\left(-2/3,-1/3,2/3\right)$.
          - valor: '(-2/3, 1/3, 2/3)'
            mensaje: |
              El signo de la segunda coordenada. La proyección que se resta es
              $1\cdot\left(1/3,2/3,2/3\right)$, y $0-2/3=-2/3$; al normalizar
              queda $-1/3$, negativo.
        pista: |
          Normaliza primero $\left(1,2,2\right)$, cuya norma es $3$. Luego
          réstale a $\left(-1,0,2\right)$ su proyección sobre él.
        desarrollo: |
          El primer vector es cómodo porque su norma es entera:

          $$
          \left\|\left(1,2,2\right)\right\|=3,
          \qquad
          \overline{u}_{1}=\left(\tfrac{1}{3},\tfrac{2}{3},\tfrac{2}{3}\right)
          $$

          La proyección del segundo sobre el primero:

          $$
          \left\langle\left(-1,0,2\right),\overline{u}_{1}\right\rangle
          =-\tfrac{1}{3}+0+\tfrac{4}{3}=1
          $$

          $$
          \overline{w}_{2}=\left(-1,0,2\right)-1\cdot\overline{u}_{1}
          =\left(-\tfrac{4}{3},-\tfrac{2}{3},\tfrac{4}{3}\right),
          \qquad
          \left\|\overline{w}_{2}\right\|=2
          $$

          $$
          \overline{u}_{2}=\left(-\tfrac{2}{3},-\tfrac{1}{3},\tfrac{2}{3}\right)
          $$

          Las dos normas salen enteras —$3$ y $2$—, lo que es una señal de que
          el examen está diseñado para hacerse sin calculadora.

      - tipo: calcular
        titulo: El vector que completa la base de R³
        pregunta: |
          El tercer vector, perpendicular a los dos anteriores y unitario.
          Toma el que sale del producto vectorial
          $\overline{u}_{1}\times\overline{u}_{2}$.
        respuesta:
          tipo: vector
          valor: '(2/3, -2/3, 1/3)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis; valen fracciones
        distractores:
          - valor: '(-2/3, 2/3, -1/3)'
            mensaje: |
              Es el opuesto, y también sirve como base ortonormal: sale de
              $\overline{u}_{2}\times\overline{u}_{1}$. Pero el enunciado del
              paso pide $\overline{u}_{1}\times\overline{u}_{2}$, y el producto
              vectorial **no es conmutativo**: cambiar el orden cambia el
              signo.
          - valor: '(2/3, 2/3, 1/3)'
            mensaje: |
              El signo de la segunda coordenada. En el desarrollo por
              cofactores, la componente $j$ del producto vectorial lleva un
              menos delante, y es el error más repetido de esta cuenta.
          - valor: '(2, -2, 1)'
            mensaje: |
              Esa es la dirección, pero sin normalizar: su norma vale $3$. Como
              $\overline{u}_{1}$ y $\overline{u}_{2}$ ya son unitarios y
              perpendiculares, su producto vectorial **ya sale unitario**; si
              te ha salido de norma $3$ es que has partido de los vectores sin
              normalizar.
        pista: |
          Con dos vectores unitarios y perpendiculares, su producto vectorial
          es automáticamente unitario. No hace falta volver a dividir.
        desarrollo: |
          $$
          \overline{u}_{3}=\overline{u}_{1}\times\overline{u}_{2}
          =\left(\tfrac{2}{3},-\tfrac{2}{3},\tfrac{1}{3}\right)
          $$

          y se comprueba que es unitario:
          $\left(4+4+1\right)/9=1$.

          Hay un camino alternativo que evita el producto vectorial: $U$ es un
          plano, y su ortogonal es la recta de los
          $\left(x,y,z\right)$ que cumplen las dos ecuaciones
          $x+2y+2z=0$ y $-x+2z=0$. Sale la misma dirección.

      - tipo: justificar
        pregunta: >-
          Ordena la demostración de que $\left(AB\right)^{-1}=B^{-1}A^{-1}$.
          Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición, la inversa de $AB$ es la única matriz $X$ que
              cumple $\left(AB\right)X=X\left(AB\right)=I$.
          - texto: >-
              Se prueba con $X=B^{-1}A^{-1}$:
              $\left(AB\right)\left(B^{-1}A^{-1}\right)
              =A\left(BB^{-1}\right)A^{-1}=AA^{-1}=I$.
          - texto: >-
              Y por el otro lado,
              $\left(B^{-1}A^{-1}\right)\left(AB\right)
              =B^{-1}\left(A^{-1}A\right)B=B^{-1}B=I$.
          - texto: >-
              Cumple las dos igualdades, luego es la inversa y el orden queda
              invertido.
          - texto: >-
              El orden se invierte porque el producto de matrices no es
              conmutativo; si $A$ y $B$ conmutaran, la inversa del producto no
              existiría.
            trampa: true
            mensaje: |
              La primera mitad es cierta y la segunda es falsa, que es lo que
              hace peligrosa a la pieza. Si $A$ y $B$ conmutan, la inversa del
              producto **existe igual** —solo hace falta que las dos sean
              invertibles— y además coincide con $A^{-1}B^{-1}$, porque los dos
              órdenes dan lo mismo. La conmutatividad no es un obstáculo: es un
              caso particular cómodo, y es justo el del apartado ii.b).
    resolucion: |
      **a) i. Los cinco determinantes, sin calcular ninguno.** Todos salen de
      propiedades, y ese es el ejercicio:

      | pedido | propiedad | valor |
      |---|---|---|
      | $\lvert AB\rvert$ | el determinante es multiplicativo | $10\cdot12=120$ |
      | $\lvert A^{T}\rvert$ | trasponer no lo cambia | $10$ |
      | $\lvert 2B\rvert$ | $\lvert\lambda B\rvert=\lambda^{n}\lvert B\rvert$, con $n=3$ | $8\cdot12=96$ |
      | $\lvert A^{4}\rvert$ | multiplicativo, cuatro veces | $10^{4}=10\,000$ |
      | $\lvert B^{-1}\rvert$ | de $BB^{-1}=I$ | $1/12$ |

      El único con trampa es el tercero: el factor sale **de cada fila**, y hay
      tres.

      **a) ii.a. La inversa de un producto.** Basta exhibir la candidata y
      comprobar los dos lados:

      $$
      \left(AB\right)\left(B^{-1}A^{-1}\right)
      =A\left(BB^{-1}\right)A^{-1}=AA^{-1}=I
      $$

      y simétricamente por la izquierda. Como la inversa es única, queda
      $\left(AB\right)^{-1}=B^{-1}A^{-1}$. **El orden se invierte**, y es lo
      único que hay que recordar.

      **a) ii.b. Conmutar se hereda.** De $AB=BA$, multiplicando los dos lados
      por $A^{-1}$ por la izquierda y por la derecha:

      $$
      A^{-1}\left(AB\right)A^{-1}=A^{-1}\left(BA\right)A^{-1}
      \;\Longrightarrow\;
      BA^{-1}=A^{-1}B
      $$

      que es lo primero. Y repitiendo el mismo truco con $B^{-1}$ sobre
      $A^{-1}B=BA^{-1}$ sale $A^{-1}B^{-1}=B^{-1}A^{-1}$.

      **b) i. Gram-Schmidt, con números que salen a mano.**

      $$
      \overline{u}_{1}=\frac{\left(1,2,2\right)}{3}
      =\left(\tfrac{1}{3},\tfrac{2}{3},\tfrac{2}{3}\right)
      $$

      $$
      \overline{w}_{2}=\left(-1,0,2\right)
      -\left\langle\left(-1,0,2\right),\overline{u}_{1}\right\rangle
      \overline{u}_{1}
      =\left(-\tfrac{4}{3},-\tfrac{2}{3},\tfrac{4}{3}\right)
      $$

      $$
      \boxed{\;\overline{u}_{2}
      =\left(-\tfrac{2}{3},-\tfrac{1}{3},\tfrac{2}{3}\right)\;}
      $$

      Las dos normas que aparecen son $3$ y $2$: enteras. Cuando en este examen
      salen raíces feas, casi siempre es que hay una cuenta mal.

      **b) ii. Completar.** El tercer vector tiene que ser perpendicular a los
      dos, y para eso está el producto vectorial:

      $$
      \overline{u}_{3}=\overline{u}_{1}\times\overline{u}_{2}
      =\left(\tfrac{2}{3},-\tfrac{2}{3},\tfrac{1}{3}\right)
      $$

      que ya sale unitario porque los dos factores lo eran y eran
      perpendiculares. La base ortonormal de $\mathbb{R}^{3}$ es
      $\left\{\overline{u}_{1},\overline{u}_{2},\overline{u}_{3}\right\}$, y
      $\overline{u}_{3}$ vale también como base de $U^{\perp}$.

  - id: exalg2223-ord-4-el-mismo-polinomio-y-solo-una-diagonaliza
    titulo: Mismo polinomio característico, distinto final
    fuente: >-
      Ejercicio 4 · Convocatoria ordinaria, curso 2022-2023 · Álgebra, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU) · El examen no publica solución ni
      reparto de puntos: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    enunciado: |
      a) i. Definir valor propio y vector propio de un endomorfismo.

      ii. Sea $A$ una matriz cuadrada de orden $n\times n$. Demostrar que si
      $A^{2}=I$, entonces los valores propios de $A$ son $\lambda=1$ o
      $\lambda=-1$.

      iii. Sea $A$ una matriz cuadrada de orden $n\times n$ inversible. Si
      $\lambda$ es un valor propio de $A$, demostrar que $1/\lambda$ es valor
      propio de $A^{-1}$.

      b) Dadas las siguientes matrices:

      $$
      A=\begin{pmatrix}2&3&-3\\1&0&-1\\1&1&-2\end{pmatrix}
      \qquad
      B=\begin{pmatrix}0&1&0\\3&0&1\\2&0&0\end{pmatrix}
      $$

      i. Comprobar que sus polinomios característicos son iguales.

      ii. ¿Son diagonalizables? En los casos afirmativos, diagonalizar la
      matriz dando la matriz del cambio de base.
    pide: Las dos definiciones, las dos demostraciones, y el estudio de las dos matrices.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos matrices tienen el **mismo** polinomio característico. ¿Qué
          se puede concluir de ahí sobre su diagonalización?
        opciones:
          - texto: >-
              Nada: el polinomio da los autovalores y sus multiplicidades
              algebraicas, pero la diagonalización la decide la dimensión de
              cada subespacio propio
            correcta: true
            mensaje: |
              Exacto, y por eso el enunciado pone las dos juntas. Comparten
              autovalores $2$ y $-1$ —este último doble—, y una diagonaliza y
              la otra no. La diferencia está en cuántos vectores propios
              independientes hay para el $-1$.
          - texto: >-
              Que las dos diagonalizan o ninguna, porque el polinomio es el
              mismo
            mensaje: |
              Es justo lo que este ejercicio desmiente. El polinomio no ve la
              diferencia entre una matriz con dos direcciones propias para
              $\lambda=-1$ y otra con una sola.
          - texto: >-
              Que las dos son semejantes entre sí
            mensaje: |
              Compartir polinomio característico es necesario para ser
              semejantes, pero no suficiente. Aquí una es semejante a una
              diagonal y la otra no, así que no pueden ser semejantes entre sí.
          - texto: >-
              Que las dos tienen la misma matriz de cambio de base
            mensaje: |
              La matriz de cambio se construye con los vectores propios, y esos
              no los da el polinomio: dependen de la matriz concreta. Aquí
              además una de las dos ni siquiera llega a tener suficientes.

      - tipo: calcular
        titulo: El determinante que comparten
        pregunta: |
          El polinomio característico es el mismo para las dos. ¿Cuánto vale
          $\left|A\right|$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Si fuese $0$, el $0$ sería autovalor y la matriz no sería
              inversible. Aquí los autovalores son $2$, $-1$ y $-1$, y su
              producto es $2$.
          - valor: '-2'
            mensaje: |
              Un signo. El producto de los autovalores es
              $2\cdot\left(-1\right)\cdot\left(-1\right)=+2$: los dos menos se
              cancelan.
          - valor: '1'
            mensaje: |
              $1$ saldría si el autovalor doble fuese $1$ en vez de $-1$.
              Desarrolla el determinante y compruébalo: sale $2$.
        pista: |
          El determinante es el producto de los autovalores, contados con su
          multiplicidad. O desarróllalo directamente por la primera fila.
        desarrollo: |
          Desarrollando por la primera fila:

          $$
          \left|A\right|
          =2\left(0\cdot\left(-2\right)-\left(-1\right)\cdot1\right)
          -3\left(1\cdot\left(-2\right)-\left(-1\right)\cdot1\right)
          +\left(-3\right)\left(1\cdot1-0\cdot1\right)
          =2+3-3=2
          $$

          y para $B$, desarrollando por la primera fila, también sale $2$. Con
          la traza —que vale $0$ en las dos— y la suma de menores principales
          —que vale $-3$ en las dos— el polinomio queda determinado:

          $$
          p\left(\lambda\right)=-\lambda^{3}+3\lambda+2
          =-\left(\lambda-2\right)\left(\lambda+1\right)^{2}
          $$

      - tipo: calcular
        titulo: La multiplicidad geométrica que decide
        pregunta: |
          Para $\lambda=-1$, ¿cuánto vale
          $\dim\operatorname{Ker}\left(A+I\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es lo que sale para $B$, y por eso $B$ no diagonaliza. Para
              $A$, la matriz $A+I$ tiene sus tres filas proporcionales a
              $\left(1,1,-1\right)$: su rango es $1$, así que el núcleo tiene
              dimensión $2$.
          - valor: '3'
            mensaje: |
              $3$ significaría $A+I=0$, es decir $A=-I$, y no lo es. La
              multiplicidad geométrica nunca supera a la algebraica, que aquí
              vale $2$.
          - valor: '0'
            mensaje: |
              Si fuese $0$, $-1$ no sería autovalor. Y lo es: es raíz doble del
              polinomio característico.
        pista: |
          Escribe $A+I$ y mira sus tres filas. ¿Cuántas son independientes?
        desarrollo: |
          $$
          A+I=\begin{pmatrix}3&3&-3\\1&1&-1\\1&1&-1\end{pmatrix}
          $$

          Las tres filas son múltiplos de $\left(1,1,-1\right)$, así que el
          rango vale $1$ y

          $$
          \dim\operatorname{Ker}\left(A+I\right)=3-1=2
          $$

          que coincide con la multiplicidad algebraica de $-1$. **Esa igualdad
          es la condición de diagonalización**, y $A$ la cumple. Con $B$ pasa lo
          contrario:

          $$
          B+I=\begin{pmatrix}1&1&0\\3&1&1\\2&0&1\end{pmatrix}
          $$

          tiene determinante $0$ pero rango $2$ —restando $3F_{1}$ a la segunda
          y $2F_{1}$ a la tercera queda dos veces la misma fila—, así que su
          núcleo tiene dimensión $1$ y falta una dirección propia.

      - tipo: calcular
        titulo: El vector propio del autovalor simple
        pregunta: |
          Un vector propio de $A$ asociado a $\lambda=2$, con la primera
          coordenada igual a $3$.
        respuesta:
          tipo: vector
          valor: '(3, 1, 1)'
          tolerancia: 0.001
          formato: tres coordenadas entre paréntesis, separadas por comas
        distractores:
          - valor: '(3, 1, 0)'
            mensaje: |
              Comprueba con la primera fila:
              $2\cdot3+3\cdot1-3\cdot0=9$, y debería dar
              $2\cdot3=6$. La tercera coordenada no es libre.
          - valor: '(1, 1, 1)'
            mensaje: |
              $\left(1,1,1\right)$ no cumple la segunda ecuación:
              $x-2y-z=1-2-1=-2\neq0$. Además el paso pide primera coordenada
              $3$.
          - valor: '(3, 1, -1)'
            mensaje: |
              El signo de la tercera. De la primera fila de $A-2I$ sale
              $3y-3z=0$, es decir $y=z$: las dos últimas coordenadas son
              **iguales**.
        pista: |
          Resuelve $\left(A-2I\right)\overline{x}=\overline{0}$. La primera
          ecuación es $3y-3z=0$.
        desarrollo: |
          $$
          A-2I=\begin{pmatrix}0&3&-3\\1&-2&-1\\1&1&-4\end{pmatrix}
          $$

          La primera fila da $y=z$; la segunda, $x=2y+z=3y$. La tercera se
          cumple sola —$3y+y-4y=0$—, que es la señal de que el sistema es
          compatible indeterminado, como tiene que ser.

          Tomando $y=1$:

          $$
          \overline{x}=\left(3,1,1\right),
          \qquad
          A\left(3,1,1\right)^{T}=\left(6,2,2\right)^{T}
          =2\left(3,1,1\right)^{T}
          $$

      - tipo: justificar
        pregunta: >-
          Ordena el argumento de por qué $B$ no diagonaliza. Una pieza es
          falsa.
        piezas:
          - texto: >-
              $A$ y $B$ tienen el mismo polinomio característico,
              $-\left(\lambda-2\right)\left(\lambda+1\right)^{2}$, luego los
              mismos autovalores: $2$ simple y $-1$ doble.
          - texto: >-
              Para el autovalor simple no hay nada que decidir: aporta
              exactamente una dirección propia en las dos matrices.
          - texto: >-
              Todo se juega en $\lambda=-1$: hace falta que
              $\dim\operatorname{Ker}\left(M+I\right)$ valga $2$, la
              multiplicidad algebraica.
          - texto: >-
              En $A$ vale $2$ y en $B$ vale $1$, así que $A$ diagonaliza y $B$
              no.
          - texto: >-
              $B$ no diagonaliza porque su autovalor doble es negativo, y los
              autovalores negativos no admiten base de vectores propios.
            trampa: true
            mensaje: |
              El signo del autovalor no tiene nada que ver. La prueba está en la
              propia $A$: tiene el mismo autovalor doble $-1$ y sí diagonaliza.
              Lo que decide es cuántos vectores propios independientes hay, o
              sea el rango de $M+I$ — un dato de la matriz, no del signo del
              número.
    resolucion: |
      **a) i. Las definiciones.** $\lambda$ es valor propio del endomorfismo
      $f$ si existe $\overline{x}\neq\overline{0}$ con
      $f\left(\overline{x}\right)=\lambda\overline{x}$, y ese $\overline{x}$ es
      un vector propio asociado a $\lambda$. La condición
      $\overline{x}\neq\overline{0}$ no es un adorno: sin ella todo escalar
      sería valor propio.

      **a) ii. Si $A^{2}=I$.** Sea $\lambda$ autovalor con vector propio
      $\overline{x}\neq\overline{0}$. Aplicando $A$ dos veces:

      $$
      A^{2}\overline{x}=A\left(\lambda\overline{x}\right)
      =\lambda A\overline{x}=\lambda^{2}\overline{x}
      $$

      y como $A^{2}=I$, eso es $\overline{x}$. Luego
      $\left(\lambda^{2}-1\right)\overline{x}=\overline{0}$ y, al ser
      $\overline{x}$ no nulo, $\lambda^{2}=1$, es decir $\lambda=\pm1$.

      **a) iii. El autovalor de la inversa.** De $A\overline{x}
      =\lambda\overline{x}$, multiplicando por $A^{-1}$:

      $$
      \overline{x}=\lambda A^{-1}\overline{x}
      \;\Longrightarrow\;
      A^{-1}\overline{x}=\frac{1}{\lambda}\overline{x}
      $$

      La división es legítima porque $\lambda\neq0$: si $A$ es inversible, $0$
      no puede ser autovalor suyo. Y el vector propio es **el mismo**.

      **b) i. El polinomio, que es el mismo.** Los tres coeficientes de un
      polinomio característico de orden $3$ salen de la traza, la suma de
      menores principales y el determinante:

      | | traza | suma de menores | determinante |
      |---|---|---|---|
      | $A$ | $0$ | $-3$ | $2$ |
      | $B$ | $0$ | $-3$ | $2$ |

      $$
      p\left(\lambda\right)=-\lambda^{3}+3\lambda+2
      =-\left(\lambda-2\right)\left(\lambda+1\right)^{2}
      $$

      Autovalores: $2$ simple y $-1$ doble, en las dos.

      **b) ii. Y aquí se separan.** La condición de diagonalización es que cada
      autovalor aporte tantas direcciones propias como multiplicidad tiene. El
      simple siempre aporta una, así que todo depende del $-1$:

      | | $M+I$ | rango | $\dim\operatorname{Ker}$ | ¿basta? |
      |---|---|---|---|---|
      | $A$ | filas todas múltiplas de $\left(1,1,-1\right)$ | $1$ | $2$ | sí |
      | $B$ | dos filas iguales tras reducir | $2$ | $1$ | no |

      $$
      \boxed{\;A\text{ diagonaliza};\quad B\text{ no}\;}
      $$

      **La diagonalización de $A$.** Para $\lambda=-1$ el sistema se reduce a
      $x+y-z=0$, que da dos vectores independientes:
      $\left(1,0,1\right)$ y $\left(0,1,1\right)$. Para $\lambda=2$ sale
      $\left(3,1,1\right)$. Por tanto

      $$
      P=\begin{pmatrix}1&0&3\\0&1&1\\1&1&1\end{pmatrix},
      \qquad
      D=\begin{pmatrix}-1&0&0\\0&-1&0\\0&0&2\end{pmatrix},
      \qquad
      P^{-1}AP=D
      $$

      con $\det P=-3\neq0$, que confirma que las tres columnas son
      independientes. El orden de las columnas de $P$ y el de la diagonal de
      $D$ tienen que coincidir; cambiarlo es correcto siempre que se cambien
      los dos a la vez.

      **Por qué este ejercicio merece recordarse.** Es la forma más limpia de
      ver que el polinomio característico **no decide** la diagonalización.
      Dice qué autovalores hay y con qué multiplicidad algebraica; lo que falta
      —la geométrica— hay que calcularlo aparte, y es justo donde estas dos
      matrices, idénticas para el polinomio, se separan.
