# El cuadernillo trae el examen dos veces —castellano y euskera— y es el mismo
# examen: se transcribe una sola vez, desde la versión castellana.
#
# Es el examen más «de teoría» de los cinco leídos hasta ahora: cuenta cuatro
# demostraciones con nombre propio —Ker es subespacio, la inversa del producto,
# los autovalores de una involución, el autovalor de la inversa— más dos
# definiciones. Eso deja el cálculo concentrado en 1b, 2b, 3b y 4b.
#
# El 4b es el ejercicio que más rinde de la convocatoria y merece anotarse: dos
# matrices con el MISMO polinomio característico, una diagonalizable y la otra
# no. Es la única forma limpia de enseñar que el polinomio característico no
# decide la diagonalización, y aquí lo enseña el propio enunciado.
#
# Como todos los de Álgebra, no publica reparto de puntos.
