# El primer examen de Álgebra que entra en el sitio, y el que decidió el lector
# de vectores y matrices (§13: empieza por el caso difícil).
#
# Tres cosas que este cuadernillo tiene y los de Cálculo no:
#
# 1. NO PUBLICA REPARTO DE PUNTOS. Ni por competencias ni por apartado: solo una
#    casilla de CALIFICACIÓN. Por eso los cuatro ejercicios van sin el campo
#    `puntos`, que el esquema deja opcional. No se estima lo que no se imprime.
# 2. Cada ejercicio es (a) demostrar un teorema + (b) calcular. Los ocho
#    exámenes de Álgebra tienen esa estructura, sin excepción.
# 3. La cabecera no lleva fecha, solo el curso. Se archiva con lo que dice.
#
# El ejercicio 3 cruza dos temas: (a) es de matrices y (b) de espacios
# euclídeos. Se archiva en el 6 porque la base ortonormal es la parte que
# ocupa el tiempo y es la única aparición de ese tema en el examen; el
# apartado (a) queda enlazado desde el tema 3.
pdf: 2024-2025-ord.pdf

