name: Construir, verificar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para publicar en Pages desde Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela una en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Construir
        run: npm run build

      - name: Suelo de calidad
        run: node scripts/verify.mjs

      - name: Paleta
        run: node scripts/check-color.mjs

      - name: Tests
        run: npm test

      # El navegador se cachea entre despliegues: descargarlo cada vez
      # costaría más que todo lo demás junto.
      - name: Caché del navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Lo que verify.mjs no puede ver: que las fórmulas se dibujen y que
      # los componentes respondan de verdad.
      - name: Navegador
        run: npm run humo

      # El diario del proyecto no se versiona en PDF (§12): se genera aquí,
      # con el mismo Chromium que acaba de instalarse, y viaja con el sitio.
      # No se enlaza desde ninguna página, porque es material del proyecto y
      # no del alumno: queda en /road-to-ingenieria/diario.pdf
      - name: Diario del proyecto
        run: |
          npm run diario
          cp diario/diario-road-to-ingenieria.pdf dist/diario.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    # Solo se publica si el trabajo anterior ha pasado entero
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
