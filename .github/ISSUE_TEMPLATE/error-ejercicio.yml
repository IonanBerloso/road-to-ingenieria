name: Hay un error en un ejercicio
description: Algo de una resolución, un diagnóstico o un enunciado no cuadra.
title: "[asignatura] id-del-ejercicio: "
body:
  - type: markdown
    attributes:
      value: |
        Gracias por decirlo. Las resoluciones de este sitio las escribimos
        nosotros y **pueden estar mal**: los enunciados son los originales de
        la escuela, pero todo lo que va debajo es nuestro.

        Si has llegado desde el enlace «¿Esto está mal? Dilo» los dos primeros
        campos vienen rellenos. No hace falta que los toques.

  - type: input
    id: ejercicio
    attributes:
      label: Qué ejercicio
      description: El identificador que viene puesto. Si escribes tú, vale con el título.
      placeholder: ej-disco-y-borde
    validations:
      required: true

  - type: input
    id: pagina
    attributes:
      label: En qué página estabas
      placeholder: https://ionanberloso.github.io/road-to-ingenieria/calculo/t01-complejos/

  - type: textarea
    id: que
    attributes:
      label: Qué está mal
      description: |
        Con lo que recuerdes vale. Si sabes cuál es el número o el paso bueno,
        ponlo; si solo sabes que no te cuadra, dilo así.
      placeholder: |
        En el paso 3 dice que el argumento es pi/4, y viniendo del tercer
        cuadrante tendría que ser -3pi/4.
    validations:
      required: true

  - type: dropdown
    id: contrastado
    attributes:
      label: ¿Lo has contrastado con algo?
      description: |
        Esta es la pregunta que más nos sirve. Un aviso contrastado se corrige
        el mismo día; uno sin contrastar hay que recalcularlo entero antes de
        tocar nada, y también nos vale — pero tarda más.
      options:
        - Sí, con la solución oficial del boletín
        - Sí, con lo que me corrigió el profesor en el examen
        - Sí, lo he vuelto a calcular yo
        - No, pero no me cuadra
    validations:
      required: true

  - type: textarea
    id: mas
    attributes:
      label: Cualquier otra cosa
      description: Opcional. Si es un fallo de la página y no del contenido, dilo aquí.
