# La pieza de la espiga de lib/vistas (diseño de la fase M, §3.1 y §3.9),
# tal cual la escribe el diseño. Es nuestra: no sale de ningún ejercicio.
# Vive aquí, como dato de los tests, hasta que exista la colección `piezas`
# (fase M1, segunda parte); entonces se mueve a src/content/piezas/.
#
# Ejes: x a la derecha, y hacia el fondo, z hacia arriba; mm.
codigo: RI-V1
fuente: Pieza nuestra para la espiga de lib/vistas.
cotas: dadas
suma:
  - { nombre: base,  caja: [0, 80, 0, 50, 0, 12] }
  - { nombre: torre, caja: [0, 24, 0, 50, 12, 50] }
resta:
  - { nombre: chaflán, semiespacio: { normal: [-1, 0, -1], pasa: [24, 0, 42] }, dentro: torre }
  - { nombre: agujero de la base, cilindro: { eje: z, centro: [56, 25], r: 7 } }
  - { nombre: agujero de la torre, cilindro: { eje: y, centro: [12, 34], r: 6 } }
noSeCorta: []
simetria: [{ plano: y, en: 25 }]
ocultas: todas
